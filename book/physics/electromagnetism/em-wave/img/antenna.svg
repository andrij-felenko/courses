<text x="480.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">випромінена хвиля →</text>
<text x="480.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">частота струму = частота хвилі</text>
<rect x="60.0" y="256.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся фізика розділу зводиться сюди: трясеш заряди — народжується хвиля; ловиш хвилю — трясуться заряди.</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Як саме добирати дріт під частоту (резонанс, чверть хвилі) — у Розділі 41 про антени.</text>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А скільки разів за секунду трястись (частота) і яка тоді довжина хвилі — наступна тема.</text>
</svg>
