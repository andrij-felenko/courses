<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний поверхневий заряд на вигині провідника та стрибку перерізу</text>
<line x1="400.0" y1="45.0" x2="400.0" y2="380.0" stroke="#d6dde6" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="200.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">а) Поворот провідника на 90°</text>
<rect x="70.0" y="100.0" width="50.0" height="100.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
<rect x="70.0" y="200.0" width="160.0" height="50.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
<rect x="71.0" y="201.0" width="48.0" height="48.0" rx="6" fill="#e2e8f0" stroke="none" stroke-width="0.0"/>
<text x="58.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="58.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="58.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="85.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="128.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="128.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="95.0" y1="130.0" x2="95.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="102.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">J₁</text>
<line x1="80.0" y1="225.0" x2="110.0" y2="225.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">E_trans</text>
<line x1="160.0" y1="225.0" x2="210.0" y2="225.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="185.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">J₂</text>
<rect x="81.1" y="309.2" width="237.7" height="51.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Заряд на зовнішньому куті створює</tspan><tspan x="200.0" dy="14.3">поперечне поле E_trans, яке повертає</tspan><tspan x="200.0" dy="14.3">траєкторію носіїв заряду.</tspan></text>
<text x="600.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) Стрибок перерізу (A₁ → A₂)</text>
<rect x="460.0" y="110.0" width="100.0" height="80.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
<text x="500.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Товстий (A₁)</text>
<rect x="560.0" y="130.0" width="120.0" height="40.0" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.8"/>
<text x="620.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тонкий (A₂ &lt; A₁)</text>
<line x1="480.0" y1="150.0" x2="530.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="505.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">E₁ (менше)</text>
<line x1="580.0" y1="150.0" x2="650.0" y2="150.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="615.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">E₂ (більше)</text>
<text x="552.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="552.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="562.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="569.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="440.4" y="309.2" width="319.2" height="51.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Неперервність струму I = J₁A₁ = J₂A₂ вимагає</tspan><tspan x="600.0" dy="14.3">більшого E₂ у тонкій частині. Градієнт поля</tspan><tspan x="600.0" dy="14.3">забезпечується зарядом на межі σ_s = ε₀(E₂ - E₁).</tspan></text>
</svg>