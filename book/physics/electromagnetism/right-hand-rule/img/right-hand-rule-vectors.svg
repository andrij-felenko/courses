<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 781.64 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="781.64" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило правої руки та геометрія векторного добутку</text>
<rect x="10.0" y="10.0" width="740.0" height="400.0" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<rect x="30.0" y="30.0" width="340.0" height="360.0" rx="6" fill="#fcfcfc" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="200.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правоорієнтована система координат</text>
<line x1="130.0" y1="290.0" x2="70.0" y2="340.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="55.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">X</text>
<line x1="130.0" y1="290.0" x2="310.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="325.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y</text>
<line x1="130.0" y1="290.0" x2="130.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="130.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z</text>
<rect x="180.0" y="280.0" width="170.0" height="95.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="265.0" y="309.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Правоорієнтований базис:</tspan><tspan x="265.0" dy="14.3">i × j = k</tspan><tspan x="265.0" dy="14.3">j × k = i</tspan><tspan x="265.0" dy="14.3">k × i = j</tspan></text>
<rect x="390.0" y="30.0" width="340.0" height="360.0" rx="6" fill="#fcfcfc" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="560.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторний добуток C = A × B</text>
<line x1="490.0" y1="270.0" x2="630.0" y2="250.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="645.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">A (перший множник)</text>
<line x1="490.0" y1="270.0" x2="560.0" y2="170.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="570.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">B (другий множник)</text>
<line x1="490.0" y1="270.0" x2="490.0" y2="80.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="505.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">C = A × B (аксіальний результат)</text>
<path d="M 540 263 A 50 50 0 0 0 520 230" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="3,3"/>
<line x1="523.0" y1="235.0" x2="517.0" y2="227.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">θ</text>
<rect x="410.0" y="305.0" width="300.0" height="70.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="560.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Правило правої руки:</tspan><tspan x="560.0" dy="14.3">Пальці затискаються від A до B,</tspan><tspan x="560.0" dy="14.3">великий палець вказує напрямок C</tspan></text>
</svg>