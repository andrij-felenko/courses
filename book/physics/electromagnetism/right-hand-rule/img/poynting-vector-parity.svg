<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектор Пойнтінга як полярний вектор перенесення енергії</text>
<rect x="10.0" y="10.0" width="740.0" height="400.0" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<line x1="240.0" y1="250.0" x2="240.0" y2="140.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">E (Електричне поле)</text>
<line x1="240.0" y1="250.0" x2="150.0" y2="330.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="140.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">B (Магнітне поле)</text>
<line x1="240.0" y1="250.0" x2="520.0" y2="250.0" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="370.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">S = (1 / μ₀) E × B (Пойнтінгів потік енергії)</text>
<text x="370.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Справжній полярний вектор напрямку імпульсу</text>
<rect x="20.0" y="30.0" width="200.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="120.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація P:</text>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">P E = −E (Полярний)</text>
<text x="120.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">P B = +B (Аксіальний)</text>
<text x="120.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">P S = −S (Полярний!)</text>
<rect x="40.0" y="335.0" width="680.0" height="50.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="380.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Потік енергії має реальний напрямок руху в просторі.</tspan><tspan x="380.0" dy="15.6">Множення полярного вектора на аксіальний завжди дає справжній полярний вектор.</tspan></text>
</svg>