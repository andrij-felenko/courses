<text x="410.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЕРС — це не «сила», а енергія на заряд (вольти), яку джерело ДОДАЄ; під навантаженням на клемах трохи менше (Розд.5).</text>
