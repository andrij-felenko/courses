<rect x="102.3" y="204.0" width="209.5" height="72.0" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><text x="207.0" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="207.0" dy="0.0">Формула скін-шару:</tspan><tspan x="207.0" dy="13.0">δ = √( 2 / (ω·μ·σ) )</tspan><tspan x="207.0" dy="13.0">50 Гц: δ ≈ 9.3 мм</tspan><tspan x="207.0" dy="13.0">1 ГГц: δ ≈ 2 мкм</tspan><tspan x="207.0" dy="13.0">Оптика: повністю непрозоре дзеркало</tspan></text>
