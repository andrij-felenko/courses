<text x="460.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Наші Wi-Fi і Bluetooth — це просто ділянка цього спектра трохи вище за мікрохвильову піч.</text>
