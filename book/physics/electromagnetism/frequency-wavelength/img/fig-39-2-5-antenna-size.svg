</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розмір антени йде за довжиною хвилі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">антену роблять часткою хвилі (зазвичай чверть λ) — тож висока частота = коротка хвиля = мала антена</text>
<rect x="70.0" y="92.0" width="360.0" height="200.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2.4 ГГц: λ ≈ 12.5 см</text>
<line x1="250.0" y1="250.0" x2="250.0" y2="220.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<rect x="238.0" y="250.0" width="24.0" height="16.0" rx="3" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="250.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 3 см (¼λ)</text>
<text x="250.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крихітна — влазить у чип/плату</text>
<rect x="470.0" y="92.0" width="380.0" height="200.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="660.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">AM 1 МГц: λ ≈ 300 м</text>
<line x1="660.0" y1="280.0" x2="660.0" y2="150.0" stroke="#9a9aa0" stroke-width="5" stroke-linecap="round"/>
<line x1="640.0" y1="170.0" x2="680.0" y2="170.0" stroke="#9a9aa0" stroke-width="1.6" stroke-linecap="round"/>
<line x1="640.0" y1="200.0" x2="680.0" y2="200.0" stroke="#9a9aa0" stroke-width="1.6" stroke-linecap="round"/>
<line x1="640.0" y1="230.0" x2="680.0" y2="230.0" stroke="#9a9aa0" stroke-width="1.6" stroke-linecap="round"/>
<text x="720.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">десятки-сотні</text>
<text x="720.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">метрів заввишки</text>
<text x="660.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">велетенська щогла</text>
<rect x="60.0" y="306.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому Wi-Fi-антена ховається в куточку плати, а AM-радіостанція має щоглу на десятки метрів.</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Деталі (чверть хвилі, диполь, резонанс) — у Розділі 41; тут головне: РОЗМІР іде за λ.</text>
</svg>
