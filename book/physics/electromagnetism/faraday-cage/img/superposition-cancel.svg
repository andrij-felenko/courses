<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">наведені заряди дають поле, точно протилежне зовнішньому, — і в порожнині вони гасяться</text>
