<rect x="60.0" y="298.0" width="740.0" height="58.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="430.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це та сама суперпозиція, що й у §1.1.2–1.1.3: заряди на поверхні самі добирають таке поле,</text>
<text x="430.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що скрізь у порожнині дорівнює зовнішньому за модулем і протилежне за напрямком.</text>
