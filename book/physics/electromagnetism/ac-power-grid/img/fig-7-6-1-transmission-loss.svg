<text x="120.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 кВ</text>
<line x1="146.0" y1="150.0" x2="360.0" y2="150.0" stroke="#cf8b5e" stroke-width="3.0" stroke-linecap="round"/>
