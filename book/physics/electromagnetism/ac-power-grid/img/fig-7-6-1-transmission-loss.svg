<text x="120.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">100 кВ</text>
<line x1="146.0" y1="330.0" x2="360.0" y2="330.0" stroke="#cf8b5e" stroke-width="3.0" stroke-linecap="round"/>
<line x1="540.0" y1="330.0" x2="740.0" y2="330.0" stroke="#cf8b5e" stroke-width="3.0" stroke-linecap="round"/>
<rect x="390.0" y="317.0" width="120.0" height="26.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="450.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R дроту</text>
<rect x="740.0" y="302.0" width="56.0" height="56.0" rx="5" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.0"/>
