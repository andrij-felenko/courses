<line x1="180.0" y1="112.0" x2="320.0" y2="112.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="250.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = 100 А</text>
<rect x="360.0" y="180.0" width="156.0" height="40.0" rx="3" fill="#f7d6d2" stroke="#c0271e" stroke-width="1.2"/>
