<text x="450.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому передають високою напругою: втрати в дроті ростуть із квадратом струму</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама потужність P = U·I; підняли U удесятеро → струм у 10 разів менший → втрати I²R у 100 разів менші</text>
<text x="70.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">НИЗЬКА напруга</text>
