<text x="70.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ВИСОКА напруга</text>
<circle cx="120.0" cy="330.0" r="26.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
