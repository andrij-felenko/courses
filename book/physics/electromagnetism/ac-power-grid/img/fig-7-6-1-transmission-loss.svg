<line x1="180.0" y1="292.0" x2="320.0" y2="292.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="250.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = 1 А</text>
<rect x="360.0" y="360.0" width="156.0" height="4.0" rx="3" fill="#f7d6d2" stroke="#c0271e" stroke-width="1.2"/>
<text x="438.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">втрати ∝ 1² — у 10000× менші</text>
<text x="450.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P_втрат = I²·R — менший струм коштує квадратично менших втрат; тому в магістраль ідуть сотні кіловольтів</text>
