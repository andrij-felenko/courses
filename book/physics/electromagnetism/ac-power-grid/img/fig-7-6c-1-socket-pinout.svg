<text x="318.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Контакти однакові на вигляд — різні за роллю:</text>
