<text x="400.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Заряди лише перерозподілилися. Скільки + з'явилося — стільки ж − залишилося деінде:</text>
<text x="400.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">заряд неможливо створити з нічого чи знищити. Це знадобиться в законі Кірхгофа (§4.2).</text>
