<text x="430.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Послідовність у часі: спершу спрацьовує швидкий TVS (тримає кидок сам), напруга на ньому росте на R/L → GDT пробиває й бере на себе кілоампери.</text>
