<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Будова ядра Землі та джерела енергії геодинамо</text>
<circle cx="250.0" cy="270.0" r="200.0" fill="#fefce8" stroke="#ca8a04" stroke-width="2.0"/>
<text x="250.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Мантія (силікати, R ≈ 6371 км)</text>
<circle cx="250.0" cy="270.0" r="130.0" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
<text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">Рідке зовнішнє ядро (Fe-Ni, 2260 км)</text>
<circle cx="250.0" cy="270.0" r="55.0" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/>
<text x="250.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Тверде ядро</tspan><tspan x="250.0" dy="13.0">R ≈ 1220 км</tspan></text>
<line x1="250.0" y1="40.0" x2="250.0" y2="500.0" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="265.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Вісь обертання (Ω)</text>
<line x1="315.0" y1="300.0" x2="355.0" y2="315.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="185.0" y1="240.0" x2="145.0" y2="225.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="220.0" y1="335.0" x2="205.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="280.0" y1="205.0" x2="295.0" y2="165.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="58.0" width="340.0" height="73.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="630.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Тверде внутрішнє ядро</tspan><tspan x="630.0" dy="14.3">• Кристалізація чистого заліза (Fe-Ni)</tspan><tspan x="630.0" dy="14.3">• Зростання радиуса: ~1 мм/рік</tspan><tspan x="630.0" dy="14.3">• Виділення прихованої теплоти кристалізації</tspan></text>
<rect x="460.0" y="178.1" width="340.0" height="73.9" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="630.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Рідке зовнішнє ядро</tspan><tspan x="630.0" dy="14.3">• Електропровідність σ ≈ 10⁶ Ом⁻¹м⁻¹</tspan><tspan x="630.0" dy="14.3">• Кінематична в'язкість ν ≈ 10⁻⁶ м²/с</tspan><tspan x="630.0" dy="14.3">• Швидкість конвективних потоків: U ≈ 0.2–1 мм/с</tspan></text>
<rect x="453.8" y="298.1" width="352.3" height="73.9" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="630.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Плавучість та джерела енергії (Q ≈ 12 ТВт)</tspan><tspan x="630.0" dy="14.3">• Теплова конвекція: остигання + радіоактивний розпад</tspan><tspan x="630.0" dy="14.3">• Композиційна плавучість: виштовхування легких</tspan><tspan x="630.0" dy="14.3">  елементів (S, Si, O) на межі з внутрішнім ядром</tspan></text>
<rect x="460.0" y="415.2" width="340.0" height="59.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="630.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Магнітне число Рейнольдса</tspan><tspan x="630.0" dy="14.3">Rm = U·L / η ≈ 100–1000 &gt;&gt; 1</tspan><tspan x="630.0" dy="14.3">Потік «вморожений» у провідну рідину</tspan></text>
<line x1="290.0" y1="245.0" x2="455.0" y2="95.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="350.0" y1="270.0" x2="455.0" y2="215.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="410.0" y1="370.0" x2="455.0" y2="335.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2"/>
</svg>