<rect x="30.0" y="323.1" width="800.0" height="73.9" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="430.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Скалярний магнітний потенціал Гаусса:</tspan><tspan x="430.0" dy="14.3">V(r,θ,φ) = a · ∑ₙ (a/r)ⁿ⁺¹ ∑ₘ [ gₙᵐ cos(mφ) + hₙᵐ sin(mφ) ] Pₙᵐ(cos θ)</tspan><tspan x="430.0" dy="14.3">• Множник (a/r)ⁿ⁺¹ описує швидкість згасання гармонік з відстанню від ядра</tspan><tspan x="430.0" dy="14.3">• Високі гармоніки (n &gt; 13) відповідають намагніченості земної кори</tspan></text>
</svg>