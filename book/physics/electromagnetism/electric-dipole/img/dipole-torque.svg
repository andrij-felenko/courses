<rect x="469.1" y="215.9" width="201.8" height="188.3" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="570.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Рівновага та енергія:</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Результуюча сила:</tspan><tspan x="570.0" dy="14.3">F_net = F₊ + F₋ = 0</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Обертальний момент:</tspan><tspan x="570.0" dy="14.3">τ = p × E  =&gt;  τ = p·E·sin θ</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Потенціальна енергія:</tspan><tspan x="570.0" dy="14.3">U(θ) = −p · E = −p·E·cos θ</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Мінімум U при θ = 0 (стійкий)</tspan></text>
