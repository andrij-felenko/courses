<text x="162.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">p = q·d</text>
<rect x="437.7" y="195.2" width="264.5" height="159.7" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="570.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Формули дипольного поля (r » d):</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Потенціал:</tspan><tspan x="570.0" dy="14.3">Φ(r, θ) = (1 / 4πε₀) · (p · cos θ / r²)</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Радіальна напруженість:</tspan><tspan x="570.0" dy="14.3">E_r = (1 / 4πε₀) · (2p cos θ / r³)</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Тангенціальна напруженість:</tspan><tspan x="570.0" dy="14.3">E_θ = (1 / 4πε₀) · (p sin θ / r³)</tspan></text>
