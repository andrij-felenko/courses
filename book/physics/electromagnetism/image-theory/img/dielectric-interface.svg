<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точковий заряд на межі двох діелектриків</text>
<rect x="40.0" y="50.0" width="680.0" height="160.0" rx="0" fill="#fcf8f2" stroke="none" stroke-width="1.5"/>
<text x="70.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">Середовище 1 (проникність ε₁)</text>
<rect x="40.0" y="210.0" width="680.0" height="160.0" rx="0" fill="#edf7f6" stroke="none" stroke-width="1.5"/>
<text x="70.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a085" text-anchor="start" font-weight="700">Середовище 2 (проникність ε₂)</text>
<line x1="40.0" y1="210.0" x2="720.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="700.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Площина z = 0</text>
<circle cx="280.0" cy="120.0" r="15.0" fill="#fadbd8" stroke="#c0392b" stroke-width="2.0"/>
<text x="280.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+q</text>
<text x="256.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">Заряд q</text>
<circle cx="280.0" cy="300.0" r="13.0" fill="#eaeded" stroke="#6b7280" stroke-width="1.8"/>
<text x="280.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">q′</text>
<text x="256.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">Зображення q′</text>
<line x1="440.0" y1="60.0" x2="440.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="456.4" y="118.2" width="227.2" height="53.6" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/><text x="570.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Поле в середовищі 1 (z &gt; 0):</tspan><tspan x="570.0" dy="14.3">утворено зарядом q та зображенням:</tspan><tspan x="570.0" dy="14.3">q′ = −q · (ε₂ − ε₁) / (ε₁ + ε₂)</tspan></text>
<rect x="447.0" y="248.2" width="246.0" height="53.6" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.2"/><text x="570.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Поле в середовищі 2 (z &lt; 0):</tspan><tspan x="570.0" dy="14.3">утворено фіктивним зарядом у точці q:</tspan><tspan x="570.0" dy="14.3">q″ = q · 2ε₂ / (ε₁ + ε₂)</tspan></text>
<rect x="117.5" y="386.0" width="525.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="380.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Граничні умови діелектрика вимагають неперервності E_t та D_n на межі z = 0</tspan></text>
</svg>