<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="620.0" height="340.0" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<polygon points="160,220 340,150 480,170 300,240" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="none"/>
<line x1="320.0" y1="190.0" x2="280.0" y2="80.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="265.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">n̂ (нормаль)</text>
<line x1="320.0" y1="190.0" x2="380.0" y2="100.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="390.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B (магнітне поле)</text>
<path d="M 304,146 A 45 45 0 0 1 344,154" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="326.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">θ</text>
<line x1="180.0" y1="306.0" x2="280.0" y2="156.0" stroke="#81c784" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="296.0" x2="330.0" y2="146.0" stroke="#81c784" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="286.0" x2="380.0" y2="136.0" stroke="#81c784" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="276.0" x2="430.0" y2="126.0" stroke="#81c784" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="40.0" width="190.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#d1d5db" stroke-width="1.5"/><text x="525.0" y="52.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Формула потоку:</tspan><tspan x="525.0" dy="16.9">Φ = B · A · cos(θ)</tspan><tspan x="525.0" dy="16.9"></tspan><tspan x="525.0" dy="16.9">• Φ — вебер (Wb)</tspan><tspan x="525.0" dy="16.9">• B — тесла (T)</tspan><tspan x="525.0" dy="16.9">• A — м²</tspan></text>
<rect x="430.0" y="155.0" width="190.0" height="180.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="525.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Крайові випадки кута θ:</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">1) θ = 0° (B ⊥ контуру):</tspan><tspan x="525.0" dy="11.7">   cos(0°) = 1 → Φ_max = B·A</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">2) θ = 60°:</tspan><tspan x="525.0" dy="11.7">   cos(60°) = 0.5 → Φ = 0.5 B·A</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">3) θ = 90° (B ∥ контуру):</tspan><tspan x="525.0" dy="11.7">   cos(90°) = 0 → Φ = 0</tspan></text>
</svg>