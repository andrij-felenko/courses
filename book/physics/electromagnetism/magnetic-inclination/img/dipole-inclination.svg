<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл кута магнітного нахилу на Землі (Дипольна модель)</text>
<circle cx="240.0" cy="240.0" r="120.0" fill="#f4f8ff" stroke="#333333" stroke-width="2.0"/>
<line x1="240.0" y1="105.0" x2="240.0" y2="375.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Північний географічний полюс</text>
<line x1="105.0" y1="240.0" x2="375.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="240.0" cy="120.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="240.0" y1="120.0" x2="240.0" y2="160.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Полюс: I = +90°</text>
<circle cx="324.9" cy="155.1" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="324.9" y1="155.1" x2="362.8" y2="167.8" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="369.9" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">φ = 45°: I ≈ 63.4°</text>
<circle cx="360.0" cy="240.0" r="5.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<line x1="360.0" y1="240.0" x2="360.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="405.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Екватор: I = 0°</text>
<rect x="464.2" y="63.8" width="211.5" height="172.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Теоретична формула диполя:</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">  tan(I) = 2 · tan(φ)</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">де:</tspan><tspan x="570.0" dy="15.6">• I — кут магнітного нахилу</tspan><tspan x="570.0" dy="15.6">• φ — геомагнітна широта</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">Вертикальна складова зростає</tspan><tspan x="570.0" dy="15.6">вдвічі швидше за широту!</tspan></text>
<rect x="469.1" y="291.6" width="201.8" height="116.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Широта (φ)  | Кут нахилу (I)</tspan><tspan x="570.0" dy="14.3">------------+----------------</tspan><tspan x="570.0" dy="14.3"> 0° (Екватор)|   0.0°</tspan><tspan x="570.0" dy="14.3">15°          |  28.2°</tspan><tspan x="570.0" dy="14.3">30°          |  49.1°</tspan><tspan x="570.0" dy="14.3">50° (Україна)|  67.2°</tspan><tspan x="570.0" dy="14.3">90° (Полюс)  |  90.0°</tspan></text>
<rect x="16.1" y="441.0" width="747.9" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">На магнітному екваторі поле горизонтальне, на полюсах — прямовисне, а в Україні поле пірнає під кутом ~67°.</tspan></text>
</svg>