<text x="460.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виток зі струмом = магнітний диполь: один бік поводиться як N, другий — як S (зв'язок із §1.8.1).</text>
