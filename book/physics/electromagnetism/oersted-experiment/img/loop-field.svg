<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Згорни дріт у виток — і поле всередині складається в одному напрямі</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">по обидва боки витка поле дивиться в один бік крізь отвір; зовні виток поводиться як маленький магніт</text>
