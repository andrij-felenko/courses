<text x="460.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок Ерстеда: електрика й магнетизм пов'язані — рухомий заряд створює магнітне поле.</text>
