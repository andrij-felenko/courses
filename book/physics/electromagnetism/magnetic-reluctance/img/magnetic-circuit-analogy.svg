<text x="580.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Потік Φ</text>
<text x="575.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700">Опір Rm</text>
<rect x="392.0" y="240.1" width="385.9" height="69.9" rx="6" fill="#f4f8ff" stroke="#cce0ff" stroke-width="1.2"/><text x="585.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">F = Φ · Rm  (МРС = Потік · Магн. опір)</tspan><tspan x="585.0" dy="14.3">• Потік — стан поля (без руху частинок)</tspan><tspan x="585.0" dy="14.3">• Статичний потік НЕ витрачає енергію!</tspan><tspan x="585.0" dy="14.3">• μ сталі / μ повітря ≈ 10³...10⁴ (повітря пропускає потік)</tspan></text>
<rect x="8.9" y="363.5" width="762.2" height="23.0" rx="6" fill="#f9f9f9" stroke="#d0d0d0" stroke-width="1.0"/><text x="390.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ГОЛОВНА ВІДМІННІСТЬ: Мобільність зарядів створює витік струму = 0, але магнітне поле завжди витікає у повітря!</tspan></text>
