<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 797.9 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="797.9" height="420" fill="#ffffff"/>
