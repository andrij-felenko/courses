<rect x="36.5" y="240.1" width="317.0" height="69.9" rx="6" fill="#fff8f8" stroke="#ffcccc" stroke-width="1.2"/><text x="195.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">V = I · R  (ЕРС = Струм · Опір)</tspan><tspan x="195.0" dy="14.3">• Струм — рух зарядів (Ампери)</tspan><tspan x="195.0" dy="14.3">• Виділяється тепло Джоуля: P = I²·R</tspan><tspan x="195.0" dy="14.3">• σ міді / σ повітря ≈ 10²¹ (повітря — ізолятор)</tspan></text>
<text x="585.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Магнітне коло (Закон Гопкінсона)</text>
