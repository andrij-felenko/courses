<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сила залежить від кута: F = B·I·L·sinθ</text>
<rect x="30.0" y="80.0" width="280.0" height="220.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="170.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">θ = 90°  (I ⟂ B)</text>
<line x1="90.0" y1="190.0" x2="250.0" y2="190.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="256.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="italic">B</text>
<line x1="170.0" y1="190.0" x2="240.0" y2="190.0" stroke="#e08030" stroke-width="2.8" marker-end="url(#aOrange)"/>
<text x="178.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="start" font-weight="bold" font-style="italic">I</text>
<text x="170.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">F = B·I·L</text>
<text x="170.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">максимум</text>
<rect x="322.0" y="80.0" width="280.0" height="220.0" rx="10" fill="#ffffff" stroke="#e08030" stroke-width="1.8"/>
<text x="462.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">θ = 45°  (навскіс)</text>
<line x1="382.0" y1="190.0" x2="542.0" y2="190.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="548.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="italic">B</text>
<line x1="462.0" y1="190.0" x2="511.5" y2="140.5" stroke="#e08030" stroke-width="2.8" marker-end="url(#aOrange)"/>
<text x="470.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="start" font-weight="bold" font-style="italic">I</text>
<text x="462.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">F = 0.71·B·I·L</text>
<text x="462.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">менше</text>
<rect x="614.0" y="80.0" width="280.0" height="220.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="754.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">θ = 0°  (I ∥ B)</text>
<line x1="674.0" y1="190.0" x2="834.0" y2="190.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="840.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="italic">B</text>
<line x1="754.0" y1="190.0" x2="754.0" y2="120.0" stroke="#e08030" stroke-width="2.8" marker-end="url(#aOrange)"/>
<text x="762.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="start" font-weight="bold" font-style="italic">I</text>
<text x="754.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">F = 0</text>
<text x="754.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сили немає</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому в моторах обмотку розташовують так, щоб струм ішов поперек поля — там сила найбільша.</text>
</svg>
