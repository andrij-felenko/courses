<text x="298.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−Q₀</text>
<line x1="100.0" y1="100.0" x2="275.0" y2="100.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="100.0" y1="145.0" x2="275.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="100.0" y1="190.0" x2="275.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="187.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">E₀ = V / d</text>
<rect x="60.0" y="230.0" width="260.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Ємність: C₀ = ε₀ · A / d</tspan><tspan x="190.0" dy="15.6">Заряд: Q₀ = C₀ · V</tspan></text>
<rect x="380.0" y="20.0" width="340.0" height="260.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конденсатор із діелектриком C</text>
<rect x="460.0" y="70.0" width="160.0" height="150.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="540.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Діелектрик (ε_r)</text>
