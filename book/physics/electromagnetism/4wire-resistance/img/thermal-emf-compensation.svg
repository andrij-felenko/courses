<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод реверсування струму для компенсації термо-ЕРС (Vemf)</text>
<line x1="60.0" y1="230.0" x2="680.0" y2="230.0" stroke="#333333" stroke-width="1.5"/>
<text x="685.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text>
<line x1="60.0" y1="45.0" x2="60.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<text x="45.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">V, I</text>
<line x1="55.0" y1="150.0" x2="670.0" y2="150.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="40.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<rect x="100.0" y="70.0" width="240.0" height="80.0" rx="2" fill="#eef6ff" stroke="#b3d7ff" stroke-width="1.0"/>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Струм +I</text>
<rect x="380.0" y="150.0" width="240.0" height="80.0" rx="2" fill="#fff4e6" stroke="#ffd8a8" stroke-width="1.0"/>
<text x="500.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Струм −I</text>
<line x1="70.0" y1="130.0" x2="660.0" y2="130.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Vemf (термо-ЕРС)</text>
<line x1="100.0" y1="80.0" x2="340.0" y2="80.0" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="220.0" cy="80.0" r="4.0" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">V+ = +I·Rx + Vemf</text>
<line x1="380.0" y1="180.0" x2="620.0" y2="180.0" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="500.0" cy="180.0" r="4.0" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="500.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">V− = −I·Rx + Vemf</text>
<line x1="100.0" y1="60.0" x2="100.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="340.0" y1="60.0" x2="340.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="380.0" y1="60.0" x2="380.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="620.0" y1="60.0" x2="620.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="130.7" y="269.0" width="458.6" height="26.0" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.2"/><text x="360.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Vx = (V+ − V−) / 2 = I · Rx   →   Vemf повністю взаємознищується!</tspan></text>
</svg>