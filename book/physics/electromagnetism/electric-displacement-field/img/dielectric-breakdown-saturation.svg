<rect x="140.0" y="60.0" width="280.0" height="80.0" rx="6" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1.5"/><text x="280.0" y="85.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Залежність D(E) у середовищі:</tspan><tspan x="280.0" dy="11.7">• У слабких полях D ∝ E (лінійний режим)</tspan><tspan x="280.0" dy="11.7">• У сильних полях виникає насичення диполів</tspan><tspan x="280.0" dy="11.7">• При E &gt; E_br середовище втрачає ізоляційні властивості</tspan></text>
