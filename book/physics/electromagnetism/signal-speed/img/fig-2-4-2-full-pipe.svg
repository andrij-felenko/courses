<circle cx="720.0" cy="175.0" r="16.0" fill="#fde8e8" stroke="#c0271e" stroke-width="2"/>
<line x1="694.0" y1="175.0" x2="702.0" y2="175.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="720.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вмить!</text>
<text x="410.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">біг не кулька, а ПОШТОВХ — пружна хвиля крізь увесь ряд</text>
<rect x="150.0" y="290.0" width="520.0" height="50.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так само дріт уже повний електронів по всій довжині;</text>
<text x="410.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вмикач — це «поштовх» (поле), що пробігає дротом майже миттєво.</text>
