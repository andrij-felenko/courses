<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому миттєво: труба вже повна</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">штовхни кульку зліва — справа вилітає інша вмить, хоч жодна не пробігла трубу</text>
<line x1="120.0" y1="153.0" x2="690.0" y2="153.0" stroke="#7a93a8" stroke-width="3" stroke-linecap="round"/>
