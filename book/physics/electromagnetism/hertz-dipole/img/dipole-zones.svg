<rect x="456.0" y="55.0" width="273.1" height="69.9" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.2"/><text x="592.5" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">1. Ближня зона (реактивна, kr ≪ 1)</tspan><tspan x="592.5" dy="14.3">• E ∝ 1/r³,  H ∝ 1/r²</tspan><tspan x="592.5" dy="14.3">• Зсув фаз між E та H дорівнює 90°</tspan><tspan x="592.5" dy="14.3">• Реактивна енергія повертається в диполь</tspan></text>
