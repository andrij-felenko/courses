<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -15 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-15" width="720" height="400" fill="#ffffff"/>
