<rect x="430.0" y="50.0" width="230.0" height="240.0" rx="10" fill="#fcfdff" stroke="#333333" stroke-width="1.4"/>
<text x="540.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Вихорове поле E_ind:</text>
<text x="445.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Силові лінії замкнені</text>
<text x="445.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  (не мають початку/кінця).</text>
<text x="445.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Циркуляція по контуру:</text>
<text x="445.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">  ∮ E · dl = −dΦ/dt = ЕРС</text>
<text x="445.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Робота на замкненому</text>
<text x="445.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">  шляху НЕ дорівнює нулю!</text>
<text x="445.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Скалярного потенціалу</text>
<text x="445.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">  φ для такого поля НЕ існує.</text>
<rect x="40.8" y="328.5" width="618.5" height="27.0" rx="6" fill="#fff5f5" stroke="#2457d6" stroke-width="1.4"/><text x="350.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Закон індукції Фарадея: ∮ [C] E · dl = −dΦ[B]/dt  (поле НЕ є потенціальним)</tspan></text>
