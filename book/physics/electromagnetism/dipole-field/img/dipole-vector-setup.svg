<text x="270.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-style="italic">θ</text>
<line x1="180.0" y1="300.0" x2="180.0" y2="180.0" stroke="#059669" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="155.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">p = q·d</text>
<rect x="454.6" y="203.0" width="290.8" height="114.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="600.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Електричний потенціал:</tspan><tspan x="600.0" dy="15.6">φ(r, θ) = (1 / 4πε₀) · (p · cos θ / r²)</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Напруженість поля:</tspan><tspan x="600.0" dy="15.6">E_r = (1 / 4πε₀) · (2p cos θ / r³)</tspan><tspan x="600.0" dy="15.6">E_θ = (1 / 4πε₀) · (p sin θ / r³)</tspan></text>
