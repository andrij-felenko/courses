<line x1="240.0" y1="180.0" x2="540.0" y2="110.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="400.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">r₊</text>
