<text x="215.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">d</text>
<circle cx="240.0" cy="300.0" r="14.0" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="240.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">−q</text>
<circle cx="240.0" cy="180.0" r="14.0" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="240.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+q</text>
<circle cx="540.0" cy="110.0" r="6.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<text x="555.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">P(r, θ)</text>
