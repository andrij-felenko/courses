<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крива поздовжньої магнітострикції Джоуля λ(H)</text>
<line x1="60.0" y1="270.0" x2="640.0" y2="270.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="310.0" x2="340.0" y2="50.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="645.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">H</text>
<text x="350.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">λ = ΔL / L</text>
<text x="330.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
<line x1="80.0" y1="110.0" x2="600.0" y2="110.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="520.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Насичення λₛ (максимальне видовження)</text>
<path d="M 340 270 C 260 270, 180 120, 80 110" fill="none" stroke="#2457d6" stroke-width="3"/>
<path d="M 340 270 C 420 270, 500 120, 600 110" fill="none" stroke="#c0392b" stroke-width="3"/>
<circle cx="340.0" cy="270.0" r="4.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Квадратична зона: λ ∝ H²</text>
<line x1="440.0" y1="205.0" x2="410.0" y2="230.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">λ(-H) = λ(+H)</text>
<line x1="240.0" y1="205.0" x2="270.0" y2="230.0" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="340.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Напрям деформації не залежить від знака поля H (парний ефект)</text>
</svg>