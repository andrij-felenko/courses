<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
<rect width="800" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Словник: одне явище — дві мови</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що рядок — те саме поняття, сказане через поле і через потенціал</text>
<rect x="60.0" y="78.0" width="680.0" height="300.0" rx="10" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<line x1="400.0" y1="78.0" x2="400.0" y2="378.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="60.0" y="78.0" width="340.0" height="36.0" rx="0" fill="#eaf5ee" stroke="none" stroke-width="0"/>
<rect x="400.0" y="78.0" width="340.0" height="36.0" rx="0" fill="#f3eefb" stroke="none" stroke-width="0"/>
<text x="230.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛЕ  E</text>
<text x="570.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">ПОТЕНЦІАЛ  V</text>
<text x="230.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вектор (напрямок + величина)</text>
<text x="570.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скаляр (одне число)</text>
<line x1="60.0" y1="146.0" x2="740.0" y2="146.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сила на заряд:  F = qE</text>
<text x="570.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">енергія на заряд:  W = qV</text>
<line x1="60.0" y1="186.0" x2="740.0" y2="186.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Н/Кл  =  В/м</text>
<text x="570.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дж/Кл  =  В (вольт)</text>
<line x1="60.0" y1="226.0" x2="740.0" y2="226.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«крутість» рельєфу</text>
<text x="570.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«висота» рельєфу</text>
<line x1="60.0" y1="266.0" x2="740.0" y2="266.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">E = −(нахил V)</text>
<text x="570.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">V = сума E вздовж шляху</text>
<line x1="60.0" y1="306.0" x2="740.0" y2="306.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лінії поля</text>
<text x="570.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">еквіпотенціалі (⊥ до ліній)</text>
<line x1="60.0" y1="346.0" x2="740.0" y2="346.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="400.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Дай одне з двох усюди — і друге однозначно відновлюється. Це одна реальність.</text>
</svg>
