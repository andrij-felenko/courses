<text x="615.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">E = E₁ + E₂ (векторно)</text>
<text x="615.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">треба напрямки й проєкції</text>
<text x="410.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому часто спершу рахують V (легко), а тоді дістають E як його нахил.</text>
