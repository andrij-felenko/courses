<text x="205.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">V = 3 + 2 = 5 В</text>
<text x="205.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">просто додати числа</text>
<text x="615.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">поле E — вектор</text>
