<rect x="50.0" y="308.0" width="560.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="330.0" y="332.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Набута кінетична енергія: Eₖ = q · ΔV = e · 1 В = 1.602 176 634 × 10⁻¹⁹ Дж ≡ 1 еВ</tspan><tspan x="330.0" dy="11.7">Робота поля не залежить від траєкторії чи відстані між електродами, а лише від різниці потенціалів.</tspan></text>
