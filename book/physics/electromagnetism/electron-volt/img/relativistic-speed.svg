<text x="68.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>
<line x1="75.0" y1="136.0" x2="600.0" y2="136.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="68.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">0.866</text>
<text x="68.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">1.0</text>
