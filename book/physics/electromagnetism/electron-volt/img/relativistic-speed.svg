<path d="M 80.0,300.0 L 100.0,299.0 L 220.0,262.0 L 340.0,181.0 L 410.0,110.0" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4"/>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-style="italic">Ньютонівська механіка (v ∝ √Eₖ)</text>
<path d="M 80.0,300.0 L 100.0,299.0 L 220.0,263.0 L 340.0,196.0 L 430.0,136.0 L 480.0,121.0 L 570.0,110.2" fill="none" stroke="#27ae60" stroke-width="2.6"/>
