<text x="330.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залежність швидкості електрона v/c від кінетичної енергії Eₖ</text>
