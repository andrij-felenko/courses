<line x1="430.0" y1="136.0" x2="430.0" y2="300.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="430.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Eₖ = mₑ c² (γ = 2, v = 0.866 c)</text>
<rect x="90.0" y="328.0" width="500.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="340.0" y="346.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">При Eₖ &lt;&lt; mₑ c² (до кількох кеВ) класична та релятивістська формули збігаються.</tspan><tspan x="340.0" dy="11.7">При Eₖ ≥ 511 кеВ класична механіка дає хибну швидкість v &gt; c, а реальна швидкість асимптотично прямує до c.</tspan></text>
