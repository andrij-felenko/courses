<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 680 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="680" height="400" fill="#ffffff"/>
