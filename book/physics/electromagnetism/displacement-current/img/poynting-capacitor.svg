<rect x="486.5" y="130.2" width="226.9" height="159.7" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="600.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Парадокс Пойнтінга:</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Енергія не тече по дротах!</tspan><tspan x="600.0" dy="14.3">  Дроти лише створюють E й H.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Енергія надходить із простору</tspan><tspan x="600.0" dy="14.3">  довкола конденсатора через S.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Повний потік P = ∬ S·dA = V · I</tspan><tspan x="600.0" dy="14.3">  дорівнює dW_e/dt !</tspan></text>
