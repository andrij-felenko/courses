<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 700 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="700" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="680.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="340.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локалізація енергії в об'ємі електростатичного поля</text>
<ellipse cx="180.0" cy="160.0" rx="110" ry="80" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">об'єм V (заряд ρ)</text>
<rect x="188.0" y="158.0" width="24.0" height="24.0" rx="6" fill="#f7d4d0" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">dV</text>
<line x1="212.0" y1="170.0" x2="265.0" y2="195.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="272.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">заряд dq = ρ dV
потенціал φ(r)</text>
<rect x="73.6" y="265.2" width="212.9" height="39.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="180.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Формулювання через джерела:</tspan><tspan x="180.0" dy="15.6">W = ½ ∫_V ρ(r) φ(r) dV</tspan></text>
<line x1="320.0" y1="160.0" x2="380.0" y2="160.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="350.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">∇·E = ρ/ε₀</text>
<text x="350.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">E = −∇φ</text>
<rect x="420.0" y="85.0" width="200.0" height="150.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="520.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">простір з полем E</text>
<line x1="445.0" y1="135.0" x2="595.0" y2="135.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="445.0" y1="160.0" x2="595.0" y2="160.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="445.0" y1="185.0" x2="595.0" y2="185.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="424.7" y="155.2" width="190.6" height="39.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">об'ємна густина енергії:</tspan><tspan x="520.0" dy="15.6">w_e = ½ ε₀ E²</tspan></text>
<rect x="424.7" y="265.2" width="190.6" height="39.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="520.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Формулювання через поле:</tspan><tspan x="520.0" dy="15.6">W = ½ ε₀ ∫_∞ E² dV</tspan></text>
</svg>