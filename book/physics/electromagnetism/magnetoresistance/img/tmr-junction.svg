<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="20.0" width="720.0" height="280.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітний тунельний перехід (MTJ): Спін-поляризоване тунелювання</text>
<rect x="60.0" y="70.0" width="220.0" height="170.0" rx="6" fill="#bbdefb" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Феромагнітний електрод 1</text>
<line x1="110.0" y1="120.0" x2="170.0" y2="120.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="210.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">M1 (↑)</text>
<text x="170.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Густина станів N(E):</text>
<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Спін ↑ : Багато станів (N_up)</text>
<text x="170.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Спін ↓ : Мало станів (N_dn)</text>
<rect x="300.0" y="70.0" width="140.0" height="170.0" rx="4" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2.0"/>
<text x="370.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a237e" text-anchor="middle" font-weight="700">Тонкий діелектрик</text>
<text x="370.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a237e" text-anchor="middle" font-weight="700">(MgO ~ 1 нм)</text>
<path d="M 270 160 Q 300 160 330 175 T 410 190 L 450 190" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3,2"/>
<text x="370.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Квантове тунелювання</text>
<rect x="460.0" y="70.0" width="220.0" height="170.0" rx="6" fill="#ffcdd2" stroke="#c0392b" stroke-width="1.5"/>
<text x="570.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Феромагнітний електрод 2</text>
<line x1="510.0" y1="120.0" x2="570.0" y2="120.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="610.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">M2 (вільний)</text>
<text x="570.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Перекриття спінових станів:</text>
<text x="570.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">P-стан: Великий тунельний струм</text>
<text x="570.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">AP-стан: Малий тунельний струм</text>
<text x="380.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">TMR ratio = (R_AP - R_P) / R_P = 2·P1·P2 / (1 - P1·P2)   [Формула Жюльєра]</text>
</svg>