<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="370.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Балансне оптичне гетеродинне детектування</text>
<text x="40.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Сигнал E⛛</text>
<line x1="110.0" y1="75.0" x2="230.0" y2="75.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="40.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Гетеродин Eₗ</text>
<line x1="110.0" y1="160.0" x2="230.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="55.0" width="100.0" height="120.0" rx="6" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="280.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куплер 2×2
(50:50)</text>
<line x1="330.0" y1="80.0" x2="440.0" y2="80.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="385.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">1/√2 (E⛛ + Eₗ)</text>
<line x1="330.0" y1="150.0" x2="440.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="385.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">1/√2 (E⛛ - Eₗ)</text>
<rect x="440.0" y="60.0" width="70.0" height="40.0" rx="4" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="475.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PD1</text>
<rect x="440.0" y="130.0" width="70.0" height="40.0" rx="4" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="475.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PD2</text>
<line x1="510.0" y1="80.0" x2="570.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I₁</text>
<line x1="510.0" y1="150.0" x2="570.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I₂</text>
<circle cx="590.0" cy="115.0" r="20.0" fill="#eff6ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<line x1="570.0" y1="80.0" x2="590.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="570.0" y1="150.0" x2="590.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="610.0" y1="115.0" x2="690.0" y2="115.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="650.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_bal = I₁ - I₂</text>
<rect x="40.0" y="210.0" width="650.0" height="135.0" rx="6" fill="#fdfbf7" stroke="#333333" stroke-width="1.2"/><text x="365.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Переваги балансної схеми:</tspan><tspan x="365.0" dy="13.0">• Повне пригнічення постійної складової гетеродина (DC offset cancelation).</tspan><tspan x="365.0" dy="13.0">• Пригнічення шуму інтенсивності гетеродина (RIN — Relative Intensity Noise) на 20...40 dB.</tspan><tspan x="365.0" dy="13.0">• Подвоєння корисної амплітуди сигналу проміжної частоти: I_bal(t) = 2·R·√(P⛛Pₗ)·cos(2π·f_IF·t + Δφ).</tspan><tspan x="365.0" dy="13.0">• Запобігання насиченню підсилювача постійним фотострумом гетеродина.</tspan></text>
</svg>