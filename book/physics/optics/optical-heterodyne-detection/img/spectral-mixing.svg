<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="700.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптичний та радіочастотний спектри при гетеродинуванні</text>
<rect x="60.0" y="60.0" width="260.0" height="100.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="190.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптичний спектр (~193 THz)</text>
<line x1="60.0" y1="160.0" x2="335.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="60.0" y1="160.0" x2="60.0" y2="45.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="330.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">f (THz)</text>
<line x1="160.0" y1="160.0" x2="160.0" y2="75.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="160.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">fₗ (LO)</text>
<line x1="240.0" y1="160.0" x2="240.0" y2="125.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f⛛ (сигнал)</text>
<line x1="160.0" y1="110.0" x2="240.0" y2="110.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="200.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">f_IF</text>
<rect x="400.0" y="60.0" width="260.0" height="100.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електричний спектр радіочастот</text>
<line x1="400.0" y1="160.0" x2="675.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="160.0" x2="400.0" y2="45.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="670.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">f (GHz)</text>
<line x1="400.0" y1="160.0" x2="400.0" y2="70.0" stroke="#6b7280" stroke-width="3.0"/>
<text x="415.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">DC (Pₗ)</text>
<line x1="520.0" y1="160.0" x2="520.0" y2="90.0" stroke="#b45309" stroke-width="2.8"/>
<text x="520.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">f_IF = |f⛛ - fₗ|</text>
<line x1="400.0" y1="140.0" x2="660.0" y2="140.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="650.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">Шум гетеродина (Shot noise)</text>
<line x1="400.0" y1="154.0" x2="660.0" y2="154.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="650.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Тепловий шум</text>
<rect x="60.0" y="200.0" width="600.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="360.0" y="250.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Перенесення спектра (Downconversion):</tspan><tspan x="360.0" dy="11.7">1. Квадратичне детектування оптичних хвиль переносить оптичний сигнал із частотою ~200 THz у радіочастотний діапазон f_IF.</tspan><tspan x="360.0" dy="11.7">2. Частотна селективність визначається вузькосмуговим радіочастотним фільтром (Δf_IF ~ 1...100 MHz).</tspan><tspan x="360.0" dy="11.7">3. Оптична роздільна здатність становить Δλ ~ 10⁻⁵...10⁻⁷ nm, що недосяжно для звичайних оптичних спектрометрів.</tspan></text>
</svg>