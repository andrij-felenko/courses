<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умова просторового узгодження та антенна теорема Зігмана</text>
<rect x="40.0" y="60.0" width="300.0" height="150.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="190.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">А) Ідеальне узгодження (θ = 0)</text>
<line x1="60.0" y1="100.0" x2="220.0" y2="100.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="60.0" y1="115.0" x2="220.0" y2="115.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="60.0" y1="130.0" x2="220.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Хвильовий фронт E⛛ ∥ Eₗ</text>
<line x1="240.0" y1="90.0" x2="240.0" y2="180.0" stroke="#1a1a1a" stroke-width="4.0"/>
<text x="250.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Площа А</text>
<text x="190.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Синфазні коливання по всій площі А
Сигнал биття максимальний!</text>
<rect x="380.0" y="60.0" width="300.0" height="150.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Б) Кутовий нахил (θ &gt; λ / D)</text>
<line x1="400.0" y1="88.0" x2="540.0" y2="112.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="400.0" y1="103.0" x2="540.0" y2="127.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="400.0" y1="118.0" x2="540.0" y2="142.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="470.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Нахил фронту на кут θ</text>
<line x1="580.0" y1="90.0" x2="580.0" y2="180.0" stroke="#1a1a1a" stroke-width="4.0"/>
<rect x="576.0" y="95.0" width="8.0" height="8.0" rx="6" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<rect x="576.0" y="111.0" width="8.0" height="8.0" rx="6" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<rect x="576.0" y="127.0" width="8.0" height="8.0" rx="6" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<rect x="576.0" y="143.0" width="8.0" height="8.0" rx="6" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<rect x="576.0" y="159.0" width="8.0" height="8.0" rx="6" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<rect x="576.0" y="175.0" width="8.0" height="8.0" rx="6" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="530.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Утворюються смуги періодом Λ = λ/θ
Синхронне інтегрування → Сигнал = 0!</text>
<rect x="40.0" y="225.0" width="640.0" height="115.0" rx="6" fill="#eff6ff" stroke="#333333" stroke-width="1.2"/><text x="360.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Антенна теорема Зігмана (Siegman Antenna Theorem):</tspan><tspan x="360.0" dy="13.0">• Ефективне гетеродинне детектування вимагає узгодження фазових фронтів сигнальної хвилі та гетеродина.</tspan><tspan x="360.0" dy="13.0">• Граничний кутовий допуск: θ_max ≈ λ / D (для D = 1 mm, λ = 1550 nm допуск θ &lt; 1.5 mrad ≈ 0.08°).</tspan><tspan x="360.0" dy="13.0">• Теорема Зігмана: A_det · Ω_fov ≈ λ² (добуток площі детектора на тілесний кут поля зору дорівнює λ²).</tspan><tspan x="360.0" dy="13.0">• Поляризаційне узгодження: вектори E⛛ та Eₗ повинні мати однакову поляризацію (ортогональні → Сигнал = 0).</tspan></text>
</svg>