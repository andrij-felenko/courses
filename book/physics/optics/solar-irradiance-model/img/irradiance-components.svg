<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компоненти інсоляції на похилій поверхні (Direct, Diffuse, Albedo)</text>
<rect x="40.0" y="400.0" width="760.0" height="35.0" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="120.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Поверхня землі (Альбедо ρ_g ≈ 0.2)</text>
<path d="M 80 400 A 340 340 0 0 1 760 400" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,4"/>
<text x="660.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Небесна напівсфера (DHI)</text>
<line x1="308.9" y1="308.2" x2="440.0" y2="400.0" stroke="#1e293b" stroke-width="10.0"/>
<line x1="308.9" y1="308.2" x2="440.0" y2="400.0" stroke="#38bdf8" stroke-width="3.0"/>
<line x1="374.5" y1="354.1" x2="431.8" y2="272.2" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="473.8" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">Нормаль n̂</text>
<line x1="360.0" y1="400.0" x2="470.0" y2="400.0" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3"/>
<path d="M 390.0 400.0 A 50 50 0 0 1 399.0 371.3" fill="none" stroke="#0f172a" stroke-width="1.8"/>
<text x="375.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">β</text>
<circle cx="160.0" cy="110.0" r="20.0" fill="#f59e0b" stroke="#d97706" stroke-width="2.0"/>
<text x="160.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Сонце</text>
<line x1="175.0" y1="125.0" x2="369.5" y2="349.1" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="280.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Пряме випромінювання (DNI · cos θ)</text>
<line x1="560.0" y1="140.0" x2="439.4" y2="279.2" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="630.0" y1="200.0" x2="463.9" y2="300.2" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="510.0" y1="230.0" x2="421.9" y2="310.7" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Дифузне розсіяння неба (DHI · (1 + cos β)/2)</text>
<line x1="250.0" y1="390.0" x2="349.5" y2="379.1" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Відбиття від землі (GHI · ρ_g · (1 - cos β)/2)</text>
<rect x="196.8" y="432.4" width="446.4" height="45.3" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="420.0" y="451.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Загальна інсоляція POA (G_T):</tspan><tspan x="420.0" dy="14.3">G_T = DNI · cos(θ) + DHI · (1 + cos β)/2 + GHI · ρ_g · (1 - cos β)/2</tspan></text>
</svg>