<rect x="35.0" y="235.0" width="480.0" height="85.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="275.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Формула CTR (Current Transfer Ratio):</tspan><tspan x="275.0" dy="11.7">CTR = η_int · η_ext_LED · η_opt · η_det · β</tspan><tspan x="275.0" dy="11.7">Кожен коефіцієнт каскаду становить &lt; 1.0, тому для оптичного фотодіода</tspan><tspan x="275.0" dy="11.7">типовий CTR становить 0.1%..2%, а для фототранзистора (з підсиленням β) — 50%..500%.</tspan></text>
</svg>