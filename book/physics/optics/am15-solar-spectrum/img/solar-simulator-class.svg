<rect x="215.0" y="112.2" width="110.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Оптична система</tspan><tspan x="270.0" dy="14.3">конденсора та</tspan><tspan x="270.0" dy="14.3">відбивача</tspan></text>
<rect x="364.0" y="112.2" width="131.9" height="55.6" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="430.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Спектральний</tspan><tspan x="430.0" dy="14.3">фільтр AM1.5G</tspan><tspan x="430.0" dy="14.3">(Air Mass Filter)</tspan></text>
<rect x="516.2" y="112.2" width="147.7" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Оптичний</tspan><tspan x="590.0" dy="14.3">гомогенізатор</tspan><tspan x="590.0" dy="14.3">(рівномірність плями)</tspan></text>
<line x1="180.0" y1="140.0" x2="205.0" y2="140.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="335.0" y1="140.0" x2="360.0" y2="140.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
