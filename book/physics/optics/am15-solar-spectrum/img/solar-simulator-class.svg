<rect x="610.0" y="298.0" width="100.0" height="22.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="660.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Термостатування 25°C</text>
<rect x="21.1" y="262.5" width="437.8" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Вимоги до імітатора класу AAA (IEC 60904-9):</tspan><tspan x="240.0" dy="13.0">1. Спектральний збіг (Spectral Match): відхилення 0.75…1.25 від AM1.5G</tspan><tspan x="240.0" dy="13.0">2. Просторова нерівномірність (Non-uniformity): &lt; 2% по всій площі плями</tspan><tspan x="240.0" dy="13.0">3. Часова нестабільність (Temporal Instability): &lt; 2% протягом вимірювання</tspan></text>
</svg>