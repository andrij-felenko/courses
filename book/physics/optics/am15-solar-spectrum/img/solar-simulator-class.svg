<line x1="590.0" y1="185.0" x2="590.0" y2="250.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="260.0" width="280.0" height="70.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
