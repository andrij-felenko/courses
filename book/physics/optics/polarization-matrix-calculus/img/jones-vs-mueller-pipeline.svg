<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="700.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння числення Джонса та Мюллера</text>
<rect x="40.0" y="70.0" width="290.0" height="250.0" rx="6" fill="#f0f9ff" stroke="#c0392b" stroke-width="1.5"/>
<text x="185.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Числення Джонса (2×2)</text>
<line x1="55.0" y1="108.0" x2="315.0" y2="108.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="55.0" y="120.0" width="260.0" height="180.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="185.0" y="148.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">• Світло: Вектор Джонса J (2×1, ℂ)</tspan><tspan x="185.0" dy="13.0">  з амплітудами та фазами (Eₓ, Eᵧ)</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">• Елементи: Матриця Джонса M (2×2, ℂ)</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">• Трансформація: J_out = M_N ... M₁ · J_in</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">• Обмеження:</tspan><tspan x="185.0" dy="13.0">  - ТІЛЬКИ когерентне світло (P = 1)</tspan><tspan x="185.0" dy="13.0">  - Не описує деполяризацію</tspan><tspan x="185.0" dy="13.0">  - Враховує абсолютну фазу</tspan></text>
<rect x="370.0" y="70.0" width="290.0" height="250.0" rx="6" fill="#fdf2f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="515.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Числення Мюллера (4×4)</text>
<line x1="385.0" y1="108.0" x2="645.0" y2="108.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="385.0" y="120.0" width="260.0" height="180.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="515.0" y="148.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">• Світло: Вектор Стокса S (4×1, ℝ)</tspan><tspan x="515.0" dy="13.0">  з інтенсивностями (S₀, S₁, S₂, S₃)</tspan><tspan x="515.0" dy="13.0"></tspan><tspan x="515.0" dy="13.0">• Елементи: Матриця Мюллера M (4×4, ℝ)</tspan><tspan x="515.0" dy="13.0"></tspan><tspan x="515.0" dy="13.0">• Трансформація: S_out = M_N ... M₁ · S_in</tspan><tspan x="515.0" dy="13.0"></tspan><tspan x="515.0" dy="13.0">• Переваги:</tspan><tspan x="515.0" dy="13.0">  - Будь-яке світло (0 ≤ P ≤ 1)</tspan><tspan x="515.0" dy="13.0">  - Описує деполяризацію й розсіяння</tspan><tspan x="515.0" dy="13.0">  - Працює з некогерентними сумішами</tspan></text>
<rect x="180.0" y="328.0" width="340.0" height="26.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/><text x="350.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="350.0" dy="0.0">Конверсія: M_Mueller = 1/2 · Tr(σ_i · J · σ_j · J†) [для недополяризуючих систем]</tspan></text>
</svg>