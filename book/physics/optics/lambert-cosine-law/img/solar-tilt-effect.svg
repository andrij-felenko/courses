<line x1="252.0" y1="100.0" x2="252.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">потік Φ₀ (5 променів на ширину A)</text>
<text x="180.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Освітленість E = E₀ · cos 0° = E₀ (100%)</text>
<line x1="360.0" y1="50.0" x2="360.0" y2="330.0" stroke="#333333" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="540.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Б. Падіння під кутом (θ = 60°)</text>
<line x1="495.0" y1="337.9" x2="585.0" y2="182.1" stroke="#1a1a1a" stroke-width="6.0"/>
