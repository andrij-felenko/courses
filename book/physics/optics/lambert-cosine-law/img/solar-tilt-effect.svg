<text x="180.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">площа панелі A</text>
<line x1="180.0" y1="260.0" x2="180.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="188.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">n̂</text>
<line x1="108.0" y1="100.0" x2="108.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="144.0" y1="100.0" x2="144.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="180.0" y1="100.0" x2="180.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
