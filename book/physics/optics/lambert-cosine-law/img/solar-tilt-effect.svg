<line x1="540.0" y1="260.0" x2="418.8" y2="190.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="408.8" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">n̂</text>
<line x1="468.0" y1="100.0" x2="468.0" y2="300.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
