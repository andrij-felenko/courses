<line x1="540.0" y1="100.0" x2="540.0" y2="256.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="576.0" y1="100.0" x2="576.0" y2="193.6" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="612.0" y1="100.0" x2="612.0" y2="300.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
