<text x="522.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">θ = 60°</text>
<text x="540.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">потік розтягується: вловлюється 2.5 променя</text>
<text x="540.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Освітленість E = E₀ · cos 60° = 0.5 · E₀ (50%)</text>
<text x="360.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Для максимального збору енергії трекери повертають панелі перпендикулярно до сонця (θ = 0°)</text>
