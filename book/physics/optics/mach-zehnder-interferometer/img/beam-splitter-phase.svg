<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 700 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="700" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="680.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазові співвідношення на напівпрозорому світлодільнику</text>
<rect x="230.0" y="80.0" width="20.0" height="200.0" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<line x1="230.0" y1="80.0" x2="230.0" y2="280.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="220.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">Диелектричне</text>
<text x="220.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">покриття</text>
<text x="260.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Скляна</text>
<text x="260.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">підкладка</text>
<line x1="60.0" y1="140.0" x2="230.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="120.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Падаючий пучок E₁</text>
<line x1="200.0" y1="310.0" x2="200.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="192.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Падаючий пучок E₂</text>
<line x1="230.0" y1="140.0" x2="200.0" y2="50.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">r₁·E₁ (зсув фази π)</text>
<line x1="250.0" y1="140.0" x2="440.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t₁·E₁ (зсув фази 0)</text>
<line x1="250.0" y1="190.0" x2="440.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">r₂·E₂ (зсув фази 0)</text>
<rect x="470.0" y="70.0" width="190.0" height="220.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="565.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазовий матричний зв'язок</text>
<line x1="480.0" y1="102.0" x2="650.0" y2="102.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="485.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="485.0" dy="0.0">Матриця світлодільника:</tspan><tspan x="485.0" dy="12.5">M = 1/√2 · [ 1   i ]</tspan><tspan x="485.0" dy="12.5">          [ i   1 ]</tspan><tspan x="485.0" dy="12.5"></tspan><tspan x="485.0" dy="12.5">Властивість унітарності:</tspan><tspan x="485.0" dy="12.5">|r|² + |t|² = 1</tspan><tspan x="485.0" dy="12.5">r·t* + t·r* = 0</tspan><tspan x="485.0" dy="12.5"></tspan><tspan x="485.0" dy="12.5">Різниця фаз між відбитим</tspan><tspan x="485.0" dy="12.5">і пройденим променем</tspan><tspan x="485.0" dy="12.5">завжди дорівнює Δθ = π/2.</tspan></text>
</svg>