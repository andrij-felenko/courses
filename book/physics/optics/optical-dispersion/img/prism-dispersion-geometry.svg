<text x="460.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">кутова дисперсія dδ/dλ</text>
<rect x="55.0" y="55.0" width="140.0" height="115.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="125.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Оптична скляна призма:</tspan><tspan x="125.0" dy="11.7">n(фіолетовий) &gt; n(червоний)</tspan><tspan x="125.0" dy="11.7"></tspan><tspan x="125.0" dy="11.7">Коротші хвилі (сині)</tspan><tspan x="125.0" dy="11.7">зазнають сильнішого</tspan><tspan x="125.0" dy="11.7">заломлення, ніж довші (червоні).</tspan></text>
