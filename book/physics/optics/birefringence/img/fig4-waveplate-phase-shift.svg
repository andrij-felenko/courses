<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення поляризації фазовою платівкою (Чвертьхвильова λ/4 та Напівхвильова λ/2)</text>
<text x="80.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Падаюче світло (45°)</text>
<line x1="20.0" y1="150.0" x2="130.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="55.0" y1="125.0" x2="95.0" y2="175.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="75.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Лінійна 45°</text>
<rect x="140.0" y="70.0" width="120.0" height="160.0" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2.0"/>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Фазова
платівка</text>
<line x1="200.0" y1="125.0" x2="200.0" y2="210.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="200.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Швидка вісь</text>
<line x1="260.0" y1="110.0" x2="480.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="370.0" cy="110.0" r="25.0" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<line x1="370.0" y1="110.0" x2="388.0" y2="92.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Платівка λ/4 (Δφ = π/2)</text>
<text x="595.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ Кругова поляризація</text>
<line x1="260.0" y1="190.0" x2="480.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="350.0" y1="210.0" x2="390.0" y2="170.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="595.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Платівка λ/2 (Δφ = π)</text>
<text x="595.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ Повернена лінійна (-45°)</text>
<text x="380.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різниця фаз: Δφ = (2π / λ) · d · |nₑ - nₒ|</text>
</svg>