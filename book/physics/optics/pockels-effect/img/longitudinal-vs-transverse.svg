<text x="200.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Γ = (2π / λ) · n_o³ · r_63 · V</text>
