<text x="570.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Γ = (2π / λ) · n_e³ · r_33 · V · (L / d)</text>
<text x="570.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">V_π = (λ / (2 · n_e³ · r_33)) · (d / L)  ≈ 50..300 В</text>
