<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 772.52 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="772.52" height="440" fill="#ffffff"/>
