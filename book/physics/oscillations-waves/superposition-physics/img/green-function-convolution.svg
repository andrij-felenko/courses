<rect x="427.9" y="115.0" width="94.1" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="475.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Оператор L</tspan><tspan x="475.0" dy="16.9">G(t, t')</tspan></text>
