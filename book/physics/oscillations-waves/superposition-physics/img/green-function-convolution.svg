<text x="675.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">G(t, t') f(t') dt'</text>
<rect x="30.0" y="240.0" width="760.0" height="170.0" rx="6" fill="#f8f9fa" stroke="#7d3c98" stroke-width="1.5"/>
<text x="410.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7d3c98" text-anchor="middle" font-weight="700">3. Неперервна суперпозиція (Інтеграл згортки)</text>
