<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класична проти квантової суперпозиції: що саме додається</text>
<rect x="40.0" y="60.0" width="350.0" height="370.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="215.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Класична суперпозиція</text>
<rect x="97.6" y="115.0" width="234.9" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Додаються безпосередні</tspan><tspan x="215.0" dy="16.9">фізичні величини (сили, поля)</tspan></text>
<text x="215.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторне / скалярне поле:</text>
<text x="215.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">E = E₁ + E₂</text>
<text x="215.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Густина енергії / інтенсивність:</text>
<text x="215.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">I ∝ |E₁ + E₂|²</text>
<rect x="68.2" y="320.6" width="293.6" height="78.8" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/><text x="215.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Особливості:</tspan><tspan x="215.0" dy="15.6">• Вимірювання не змінює стан</tspan><tspan x="215.0" dy="15.6">• Означена траєкторія й стан</tspan><tspan x="215.0" dy="15.6">• Відсутній зворотний вплив спостерігача</tspan></text>
<rect x="430.0" y="60.0" width="350.0" height="370.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="1.5"/>
<text x="605.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7d3c98" text-anchor="middle" font-weight="700">Квантова суперпозиція</text>
<rect x="480.1" y="115.0" width="249.7" height="49.9" rx="6" fill="#f5eeef" stroke="#7d3c98" stroke-width="1.5"/><text x="605.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Додаються вектори станів</tspan><tspan x="605.0" dy="16.9">(амплітуди ймовірностей cᵢ ∈ ℂ)</tspan></text>
<text x="605.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектор стану в Гільбертовому просторі:</text>
<text x="605.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7d3c98" text-anchor="middle" font-weight="700">|Ψ⟩ = c₁ |ϕ₁⟩ + c₂ |ϕ₂⟩</text>
<text x="605.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імовірність виявлення стану:</text>
<text x="605.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">P = |c₁|² + |c₂|² + 2 Re(c₁* c₂)</text>
<rect x="447.9" y="320.6" width="314.1" height="78.8" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/><text x="605.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Особливості:</tspan><tspan x="605.0" dy="15.6">• Вимірювання викликає редукцію (колапс)</tspan><tspan x="605.0" dy="15.6">• Квантова інтерференція через 2 Re(c₁* c₂)</tspan><tspan x="605.0" dy="15.6">• Руйнується декогеренцією з довкіллям</tspan></text>
</svg>