<text x="450.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">прискорення (вигин кривої) завжди напрямлене до осі й тим більше, чим далі ми від неї — лише синус так уміє</text>
