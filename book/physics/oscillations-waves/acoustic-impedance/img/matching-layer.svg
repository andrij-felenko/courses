<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип чвертьхвильового акустичного узгоджувального шару</text>
<rect x="40.0" y="55.0" width="180.0" height="170.0" rx="4" fill="#e0e7ff" stroke="#3730a3" stroke-width="2.0"/>
<text x="130.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">П'єзокераміка (PZT)</tspan><tspan x="130.0" dy="16.9">z₁ ≈ 30 МРайл</tspan></text>
<rect x="220.0" y="55.0" width="150.0" height="170.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
<text x="295.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Узгоджувальний шар</tspan><tspan x="295.0" dy="15.6">d = λ / 4</tspan><tspan x="295.0" dy="15.6">zₘ = √(z₁ · z₂)</tspan></text>
<text x="295.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">zₘ ≈ 6.7 МРайл</text>
<rect x="370.0" y="55.0" width="340.0" height="170.0" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2.0"/>
<text x="540.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Біологічна тканина / Гель</tspan><tspan x="540.0" dy="16.9">z₂ ≈ 1.5 МРайл</tspan></text>
<line x1="110.0" y1="205.0" x2="215.0" y2="205.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="162.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Падна хвиля</text>
<line x1="225.0" y1="85.0" x2="365.0" y2="85.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="365.0" y1="85.0" x2="225.0" y2="103.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4,2"/>
<text x="295.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Проходження й внутрішні відбиття</text>
<rect x="65.0" y="251.2" width="630.1" height="47.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Протифазна інтерференція відбивачів на межах (фазовий набіг 2 · d = λ/2 = 180°)</tspan><tspan x="380.0" dy="15.6">попустовує відбиту хвилю й забезпечує майже 100% проходження енергії на частоті f₀</tspan></text>
</svg>