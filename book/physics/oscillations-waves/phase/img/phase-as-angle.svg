<text x="460.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Обидва фазори обертаються разом, тож кут φ між ними застиглий — тригонометрія коливань стає геометрією трикутника.</text>
