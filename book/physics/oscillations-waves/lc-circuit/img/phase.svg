<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="500.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження енергії — це еліпс, а нормування осей робить рух рівномірним обертанням</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ліворуч — траєкторія контуру в осях (q, I); праворуч — вона ж у безрозмірних координатах</text>
<line x1="108.0" y1="285.0" x2="402.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">q</text>
<line x1="250.0" y1="408.0" x2="250.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">I</text>
<ellipse cx="250.0" cy="285.0" rx="120.0" ry="92.0" fill="none" stroke="#27ae60" stroke-width="2.6"/>
<line x1="323.9" y1="212.5" x2="294.7" y2="195.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="323.9" cy="212.5" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="370.0" y1="285.0" x2="370.0" y2="322.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="370.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">q₀</text>
<line x1="250.0" y1="193.0" x2="205.0" y2="193.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="198.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">I₀</text>
<rect x="102.9" y="414.6" width="294.2" height="66.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="435.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">q²/(2C) + L·I²/2 = E</tspan><tspan x="250.0" dy="16.9">піввісі:  q₀ = √(2EC),   I₀ = √(2E/L)</tspan><tspan x="250.0" dy="16.9">I₀/q₀ = 1/√(L·C) = ω₀</tspan></text>
<text x="477.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="477.0" dy="0.0">нормування</tspan><tspan x="477.0" dy="15.6">u = q/q₀,   v = I/I₀</tspan></text>
<line x1="430.0" y1="250.0" x2="528.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="578.0" y1="285.0" x2="838.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="846.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">u</text>
<line x1="700.0" y1="408.0" x2="700.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="700.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">v</text>
<circle cx="700.0" cy="285.0" r="105.0" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<line x1="700.0" y1="285.0" x2="764.6" y2="202.3" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="764.6" cy="202.3" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<path d="M 740.0 285.0 A 40.0 40.0 0 0 0 724.6 253.5" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="750.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ</text>
<text x="719.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<line x1="764.6" y1="202.3" x2="764.6" y2="285.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<text x="764.6" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">u = cos θ</text>
<rect x="486.2" y="423.1" width="427.5" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="444.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">u² + v² = 1,    θ = ω₀·t</tspan><tspan x="700.0" dy="16.9">кут росте рівномірно → тінь точки на вісь u є cos(ω₀·t)</tspan></text>
</svg>