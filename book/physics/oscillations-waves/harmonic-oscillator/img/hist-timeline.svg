<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 812" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="812" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="812.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне поняття, десять перевтілень</text>
<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">праворуч — чим гармонічний осцилятор ставав після кожного кроку</text>
<line x1="250.0" y1="78.0" x2="250.0" y2="772.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="225.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1602</text>
<circle cx="250.0" cy="100.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<text x="282.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ґалілей — лист із Падуї до даль Монте</text>
<text x="282.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">період — властивість маятника, а не розмаху</text>
<rect x="725.0" y="90.0" width="150.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="800.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">РІЧ</tspan></text>
<text x="225.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1636</text>
<circle cx="250.0" cy="172.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<text x="282.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Мерсенн — «Harmonie universelle»</text>
<text x="282.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тон уперше стає числом: f = (1/2L)·√(F/μ)</text>
<rect x="725.0" y="162.0" width="150.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="800.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ЧИСЛО</tspan></text>
<text x="225.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1657</text>
<circle cx="250.0" cy="244.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<text x="282.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Гюйгенс — маятниковий годинник, потім циклоїда</text>
<text x="282.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">15 хв/добу → 15 с/добу; коло не ізохронне</text>
<rect x="725.0" y="234.0" width="150.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="800.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">КРИВА</tspan></text>
<text x="225.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1678</text>
<circle cx="250.0" cy="316.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<text x="282.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Гук — «ut tensio, sic vis»</text>
<text x="282.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">повертальна сила без участі тяжіння</text>
<rect x="725.0" y="306.0" width="150.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="800.0" y="326.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ПРУЖНІСТЬ</tspan></text>
<text x="225.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1687</text>
<circle cx="250.0" cy="388.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="282.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ньютон — «Principia»</text>
<text x="282.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">сила перекладається у прискорення</text>
<rect x="725.0" y="378.0" width="150.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="398.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ЗАКОН</tspan></text>
<text x="225.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1739</text>
<circle cx="250.0" cy="460.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="282.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ейлер — «De novo genere oscillationum»</text>
<text x="282.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">резонанс знайдено на папері, а не в досліді</text>
<rect x="725.0" y="450.0" width="150.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="470.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">РІВНЯННЯ</tspan></text>
<text x="225.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1788</text>
<circle cx="250.0" cy="532.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="282.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Лаґранж — «Mécanique analytique»</text>
<text x="282.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">будь-яка система біля рівноваги = сума мод</text>
<rect x="725.0" y="522.0" width="150.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="542.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">МОДИ</tspan></text>
<text x="225.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1853</text>
<circle cx="250.0" cy="604.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="282.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Томсон (Кельвін) — теорія розряду банки</text>
<text x="282.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">контур коливається зовсім без маси</text>
<rect x="725.0" y="594.0" width="150.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="800.0" y="614.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ПОЛЕ</tspan></text>
<text x="225.0" y="681.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1900</text>
<circle cx="250.0" cy="676.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="282.0" y="681.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Планк — резонатори в стінках чорного тіла</text>
<text x="282.0" y="702.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">енергія міняється порціями E = h·ν</text>
<rect x="725.0" y="666.0" width="150.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="800.0" y="686.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">КВАНТ</tspan></text>
<text x="225.0" y="753.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1925</text>
<circle cx="250.0" cy="748.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="282.0" y="753.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Гайзенберг — матрична механіка</text>
<text x="282.0" y="774.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Eₙ = ħω(n + ½): найнижчий стан уже дрижить</text>
<rect x="725.0" y="738.0" width="150.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="800.0" y="758.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">НУЛЬОВА ЕНЕРГІЯ</tspan></text>
</svg>