<text x="520.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">уздовж струни:  T₁·cos θ₁ = T₂·cos θ₂ ≡ T_h  —  горизонтальний складник однаковий на кінцях</text>
<text x="520.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">упоперек:  T·sin θ = T_h·tg θ = T_h·∂y/∂x  (точно)  →  різниця кінців = T_h · ∂²y/∂x² · Δx</text>
<text x="520.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(кути на рисунку перебільшено; жодного розкладу в ряд тут не знадобилося)</text>
