<text x="510.0" y="644.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">жодних матриць: усе, що треба, — три сусіди й той самий вузол кроком раніше</text>
