<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обвідна = довжина суми двох обертових фазорів</text>
<circle cx="110.0" cy="195.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><line x1="110.0" y1="177.0" x2="188.0" y2="177.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="188.0" y1="177.0" x2="236.0" y2="177.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="110.0" y1="195.0" x2="236.0" y2="195.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/><text x="149.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">A</text><text x="212.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">B</text><text x="173.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R = A+B</text><text x="173.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">у фазі → гучно</text>
<circle cx="410.0" cy="195.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><line x1="410.0" y1="195.0" x2="488.0" y2="195.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="488.0" y1="195.0" x2="488.0" y2="147.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="410.0" y1="195.0" x2="488.0" y2="147.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/><text x="449.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">A</text><text x="502.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">B</text><text x="427.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">R = √(A²+B²)</text><text x="449.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">під кутом → середина</text>
<circle cx="690.0" cy="195.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><line x1="690.0" y1="177.0" x2="768.0" y2="177.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="768.0" y1="159.0" x2="720.0" y2="159.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="690.0" y1="195.0" x2="720.0" y2="195.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/><text x="729.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">A</text><text x="744.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">B</text><text x="709.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R = |A−B|</text><text x="725.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">у протифазі → тихо</text>
<text x="440.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R = √( A² + B² + 2·A·B·cos θ ),   θ = 2π·Δf·t   (від 0 до π за пів-биття)</text>
</svg>