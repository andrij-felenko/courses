<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як Совер здобув частоту з биття: відношення + рахунок</text>
<line x1="175.0" y1="88.0" x2="343.0" y2="88.0" stroke="#1a1a1a" stroke-width="1.4"/><line x1="175.0" y1="88.0" x2="175.0" y2="94.0" stroke="#1a1a1a" stroke-width="1.4"/><line x1="343.0" y1="88.0" x2="343.0" y2="94.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="259.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">разом: 6 биттів за секунду</text>
<rect x="175.0" y="100.0" width="58.0" height="150.0" rx="3" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="285.0" y="110.0" width="58.0" height="140.0" rx="3" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
<line x1="160.0" y1="250.0" x2="358.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="204.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">нижчий тон  f₁</text>
<text x="314.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вищий тон  f₂</text>
<line x1="362.0" y1="168.0" x2="462.0" y2="148.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="92.0" width="312.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="626.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="626.0" dy="0.0">Відомий інтервал (півтон):</tspan><tspan x="626.0" dy="18.2">f₂ : f₁ = 16 : 15</tspan></text>
<rect x="470.0" y="162.0" width="312.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="626.0" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="626.0" dy="0.0">Полічені биття (на слух + маятник):</tspan><tspan x="626.0" dy="16.9">f₂ − f₁ = 6 за секунду</tspan></text>
<line x1="626.0" y1="218.0" x2="626.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="254.0" width="312.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="626.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="626.0" dy="0.0">f₁ = 90 Гц        f₂ = 96 Гц</tspan></text>
</svg>