<line x1="550.0" y1="90.0" x2="550.0" y2="330.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="550.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">x = 1 (hν = E_k)</text>
<line x1="140.0" y1="180.0" x2="550.0" y2="180.0" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="280.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Крамерс: ω·dσ/dω = const</text>
<path d="M 120 100 Q 160 160 280 175 T 460 200 L 550 295" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="340.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Квантова теорія Бете — Гайтлера</text>
<line x1="240.0" y1="95.0" x2="135.0" y2="110.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">Інфрачервона дивергенція (ω → 0)</text>
<line x1="550.0" y1="330.0" x2="650.0" y2="330.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="590.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-style="italic">dσ/dω = 0 при hν &gt; E_k</text>
