<line x1="650.0" y1="330.0" x2="670.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="670.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Відносна енергія фотона x = hν / E_k</text>
<line x1="90.0" y1="330.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
