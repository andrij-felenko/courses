<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Дефект маси та баланс енергії при ядерному синтезі (D + T → ⁴He + n)</text>
<text x="440" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Зменшення маси спокою Δm виділяється у формі кінетичної енергії продуктів реакції (17.6 МеВ)</text>
<rect x="60" y="90" width="330" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="225" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Вхідні ядра (До реакції)</text>
<circle cx="150" cy="190" r="22" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<text x="150" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">p</text>
<circle cx="180" cy="190" r="22" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<text x="180" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
<text x="165" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Дейтерій (²H)</text>
<text x="165" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">m = 2.014102 u</text>
<circle cx="280" cy="180" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<text x="280" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">p</text>
<circle cx="310" cy="175" r="20" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<text x="310" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
<circle cx="295" cy="205" r="20" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<text x="295" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
<text x="295" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Тритій (³H)</text>
<text x="295" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">m = 3.016049 u</text>
<line x1="80" y1="290" x2="370" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="225" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Сумарна маса початкова:</text>
<text x="225" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">M_in = 5.030151 u</text>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 Z" fill="#059669" />
  </marker>
</defs>
<line x1="405" y1="245" x2="475" y2="245" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
<text x="440" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Синтез</text>
<rect x="490" y="90" width="330" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="655" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Продукти реакції (Після)</text>
<circle cx="560" cy="180" r="18" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="585" cy="180" r="18" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="572" cy="162" r="18" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<circle cx="572" cy="198" r="18" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<text x="572" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Гелій-4 (⁴He)</text>
<text x="572" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">m = 4.001506 u</text>
<circle cx="715" cy="190" r="18" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
<text x="715" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
<text x="715" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Нейтрон (n)</text>
<text x="715" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">m = 1.008665 u</text>
<line x1="510" y1="290" x2="800" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="655" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Маса продуктів: M_out = 5.010171 u</text>
<text x="655" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Дефект маси: Δm = 0.019980 u</text>
<text x="655" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">Виділена енергія: ΔE = 17.59 МеВ</text>
</svg>