<rect x="304.6" y="76.2" width="290.8" height="207.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Геометрична рівність похідних:</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">1. Градієнт тиску з температурою</tspan><tspan x="450.0" dy="15.6">   при сталому об'ємі (∂P/∂T)ᵥ</tspan><tspan x="450.0" dy="15.6">   визначений кривою стану.</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">2. За співвідношенням Максвелла F(T,V):</tspan><tspan x="450.0" dy="15.6">   (∂S/∂V)ᵀ = (∂P/∂T)ᵥ</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">3. Приріст ентропії при ізотермічному</tspan><tspan x="450.0" dy="15.6">   розширенні точно дорівнює</tspan><tspan x="450.0" dy="15.6">   термічному коефіцієнту тиску!</tspan></text>
