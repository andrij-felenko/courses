<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічні умови фазової рівноваги у багатокомпонентній системі</text>
<rect x="25.4" y="116.4" width="229.2" height="67.2" rx="6" fill="#eef6fc" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Фаза α (Тверда)</tspan><tspan x="140.0" dy="15.6">T^(α), P^(α)</tspan><tspan x="140.0" dy="15.6">μ_1^(α), μ_2^(α), ..., μ_K^(α)</tspan></text>
<rect x="255.4" y="116.4" width="229.2" height="67.2" rx="6" fill="#eff9f0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Фаза β (Рідка)</tspan><tspan x="370.0" dy="15.6">T^(β), P^(β)</tspan><tspan x="370.0" dy="15.6">μ_1^(β), μ_2^(β), ..., μ_K^(β)</tspan></text>
<rect x="485.4" y="116.4" width="229.2" height="67.2" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Фаза γ (Газова)</tspan><tspan x="600.0" dy="15.6">T^(γ), P^(γ)</tspan><tspan x="600.0" dy="15.6">μ_1^(γ), μ_2^(γ), ..., μ_K^(γ)</tspan></text>
<line x1="215.0" y1="130.0" x2="295.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="295.0" y1="170.0" x2="215.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T^(α) = T^(β),  P^(α) = P^(β)</text>
<text x="255.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">μ_i^(α) = μ_i^(β)</text>
<line x1="445.0" y1="130.0" x2="525.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="525.0" y1="170.0" x2="445.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T^(β) = T^(γ),  P^(β) = P^(γ)</text>
<text x="485.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">μ_i^(β) = μ_i^(γ)</text>
<rect x="36.2" y="299.1" width="667.5" height="81.9" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="370.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Баланс термодинамічних змінних та рівнянь зв'язку:</tspan><tspan x="370.0" dy="14.3">1. Інтенсивні змінні системи: T, P та P·(K - 1) мольних часток  →  Всього N_var = 2 + P·(K - 1)</tspan><tspan x="370.0" dy="14.3">2. Рівняння рівноваги: K·(P - 1) рівностей хімічних потенціалів  →  Всього N_eq = K·(P - 1)</tspan><tspan x="370.0" dy="14.3">3. Число ступенів вільності (варіантність): F = N_var - N_eq = [2 + P·(K - 1)] - K·(P - 1) = K - P + 2</tspan></text>
</svg>