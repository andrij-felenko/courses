<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 457" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="457" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок ефектів Зеебека та Пельтьє через співвідношення Онсагера</text>
<rect x="160.0" y="100.0" width="500.0" height="140.0" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<rect x="50.0" y="85.0" width="110.0" height="170.0" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="105.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Гарячий контакт</text>
<text x="105.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">T_hot = T + ΔT</text>
<rect x="660.0" y="85.0" width="110.0" height="170.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.0"/>
<text x="715.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Холодний контакт</text>
<text x="715.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">T_cold = T</text>
<line x1="200.0" y1="140.0" x2="620.0" y2="140.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Потік тепла J_q = L_qq · ∇(1/T) + L_qe · (−∇φ/T)</text>
<line x1="200.0" y1="200.0" x2="620.0" y2="200.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Потік заряду J_e = L_eq · ∇(1/T) + L_ee · (−∇φ/T)</text>
<rect x="50.0" y="280.0" width="340.0" height="130.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="220.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Ефект Зеебека (термо-ЕРС)</text>
<text x="220.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle">Градієнт ∇T породжує різницю потенціалів ΔV</text>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Коефіцієнт Зеебека: S = ΔV / ΔT = L_eq / (T · L_ee)</text>
<rect x="430.0" y="280.0" width="340.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="600.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Ефект Пельтьє (теплоперенос струмом)</text>
<text x="600.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">Струм I виділяє/поглинає тепло Q_Peltier на контакті</text>
<text x="600.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Коефіцієнт Пельтьє: Π = Q_Peltier / I = L_qe / L_ee</text>
<rect x="50.0" y="415.0" width="720.0" height="22.0" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.0"/>
<text x="410.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Взаємність Онсагера L_qe = L_eq  ⇒  Співвідношення Кельвіна: Π = T · S</text>
</svg>