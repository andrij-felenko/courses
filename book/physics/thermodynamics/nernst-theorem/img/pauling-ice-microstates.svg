<rect x="444.5" y="122.4" width="281.1" height="235.2" rx="6" fill="#f8f9f9" stroke="#6b7280" stroke-width="1.2"/><text x="585.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Комбінаторика Полінга</tspan><tspan x="585.0" dy="14.3">───────────────────────</tspan><tspan x="585.0" dy="14.3">1. Кожен O має 4 зв'язки</tspan><tspan x="585.0" dy="14.3">2. Всього H-атомів: 2N на N молів O</tspan><tspan x="585.0" dy="14.3">3. На кожному зв'язку — 2 позиції (2^2N)</tspan><tspan x="585.0" dy="14.3">4. З 16 варіантів оточення O лише 6</tspan><tspan x="585.0" dy="14.3">   задовольняють правилу H2O (6/16 = 3/8)</tspan><tspan x="585.0" dy="14.3">───────────────────────</tspan><tspan x="585.0" dy="14.3">Кількість мікростанів:</tspan><tspan x="585.0" dy="14.3">Ω = 2^(2N) · (3/8)^N = (3/2)^N</tspan><tspan x="585.0" dy="14.3">───────────────────────</tspan><tspan x="585.0" dy="14.3">Залишкова ентропія при T = 0 K:</tspan><tspan x="585.0" dy="14.3">S_0 = k_B ln Ω = N k_B ln(3/2)</tspan><tspan x="585.0" dy="14.3">S_0 ≈ 0.85 R = 3.37 Дж/(моль·К)</tspan><tspan x="585.0" dy="14.3">(Експеримент: 3.41 Дж/(моль·К))</tspan></text>
