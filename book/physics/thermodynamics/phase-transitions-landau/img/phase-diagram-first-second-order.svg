<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльна характеристика фазових переходів 1-го та 2-го роду</text>
<rect x="30.0" y="55.0" width="370.0" height="340.0" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">Фазовий перехід 1-го роду</text>
<text x="215.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle">(Плавлення, кипіння, скачок параметра)</text>
<line x1="45.0" y1="110.0" x2="385.0" y2="110.0" stroke="#fdba74" stroke-width="1.0"/>
<rect x="45.0" y="128.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.0"/>
<text x="55.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="start" font-weight="700">• Стрибок параметра порядку:</text>
<text x="55.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start">Δη ≠ 0 (переривчастий)</text>
<rect x="45.0" y="178.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.0"/>
<text x="55.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="start" font-weight="700">• Прихована теплота плавлення/пару:</text>
<text x="55.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start">L = T꜀ · ΔS ≠ 0</text>
<rect x="45.0" y="228.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.0"/>
<text x="55.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="start" font-weight="700">• Співіснування фаз:</text>
<text x="55.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start">Існує гетерогенна суміш</text>
<rect x="45.0" y="278.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.0"/>
<text x="55.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="start" font-weight="700">• Похідні вільної енергії:</text>
<text x="55.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start">Стрибок 1-х похідних (S, V)</text>
<rect x="45.0" y="328.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.0"/>
<text x="55.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="start" font-weight="700">• Гістерезис та переохолодження:</text>
<text x="55.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start">Присутні метастабільні стани</text>
<rect x="420.0" y="55.0" width="370.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="605.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Фазовий перехід 2-го роду (Ландау)</text>
<text x="605.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">(Точка Кюрі, надпровідність, He-II)</text>
<line x1="435.0" y1="110.0" x2="775.0" y2="110.0" stroke="#86efac" stroke-width="1.0"/>
<rect x="435.0" y="128.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="445.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">• Неперервний параметр порядку:</text>
<text x="445.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start">η(T꜀) = 0 (без стрибка)</text>
<rect x="435.0" y="178.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="445.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">• Прихована теплота:</text>
<text x="445.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start">L = 0 (теплота не виділяється)</text>
<rect x="435.0" y="228.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="445.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">• Співіснування фаз:</text>
<text x="445.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start">Відсутнє (межа критична точка)</text>
<rect x="435.0" y="278.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="445.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">• Похідні вільної енергії:</text>
<text x="445.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start">Стрибок 2-х похідних (Cₚ, χ)</text>
<rect x="435.0" y="328.0" width="340.0" height="42.0" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="445.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">• Фундаментальна причина:</text>
<text x="445.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start">Спонтанне порушення симетрії</text>
</svg>