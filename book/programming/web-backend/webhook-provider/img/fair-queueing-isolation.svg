<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція черг: блокування пулу (Head-of-Line) проти Fair-Share</text>
<line x1="40.0" y1="260.0" x2="960.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="60.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Спільна FIFO-черга: повільний клієнт А захоплює всі слоти воркерів</text>
<rect x="56.4" y="117.3" width="327.2" height="45.3" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Спільна черга FIFO</tspan><tspan x="220.0" dy="14.3">[Подія А] [Подія А] [Подія А] [Подія Б] [Подія В]</tspan></text>
<rect x="485.0" y="95.9" width="270.0" height="88.2" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Пул HTTP-воркерів (4/4 зайняті)</tspan><tspan x="620.0" dy="14.3">Воркер 1: чекає А (таймаут 30s)...</tspan><tspan x="620.0" dy="14.3">Воркер 2: чекає А (таймаут 30s)...</tspan><tspan x="620.0" dy="14.3">Воркер 3: чекає А (таймаут 30s)...</tspan><tspan x="620.0" dy="14.3">Воркер 4: чекає А (таймаут 30s)...</tspan></text>
<rect x="835.0" y="110.2" width="130.0" height="59.6" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Клієнти Б і В</tspan><tspan x="900.0" dy="14.3">(Швидкі)</tspan><tspan x="900.0" dy="14.3">ЗАБЛОКОВАНІ ✗</tspan></text>
<line x1="383.6" y1="140.0" x2="485.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="755.0" y1="140.0" x2="835.0" y2="140.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="500.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">Один висячий бекенд блокує доставку тисячам здорових клієнтів</text>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Fair-Share Queueing: окремі черги або ліміти за клієнтами</text>
<rect x="70.0" y="358.1" width="300.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Черги за тенантами (Leaky / Fair)</tspan><tspan x="220.0" dy="14.3">Черга А (ліміт: 1 слот/с)</tspan><tspan x="220.0" dy="14.3">Черга Б (ліміт: 10 слотів/с)</tspan><tspan x="220.0" dy="14.3">Черга В (ліміт: 10 слотів/с)</tspan></text>
<rect x="485.0" y="350.9" width="270.0" height="88.2" rx="6" fill="#eaf7ef" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Пул HTTP-воркерів (розділені слоти)</tspan><tspan x="620.0" dy="14.3">Слот 1: Клієнт А (ізольований)</tspan><tspan x="620.0" dy="14.3">Слот 2: Клієнт Б (відправлено ✓)</tspan><tspan x="620.0" dy="14.3">Слот 3: Клієнт В (відправлено ✓)</tspan><tspan x="620.0" dy="14.3">Слот 4: Вільний резерв</tspan></text>
<rect x="835.0" y="365.2" width="130.0" height="59.6" rx="6" fill="#eaf7ef" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Клієнти Б і В</tspan><tspan x="900.0" dy="14.3">(Швидкі)</tspan><tspan x="900.0" dy="14.3">ДОСТАВЛЕНО ✓</tspan></text>
<line x1="370.0" y1="395.0" x2="485.0" y2="395.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="755.0" y1="395.0" x2="835.0" y2="395.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Квота клієнта А обмежена; клієнти Б і В отримують події без затримок</text>
</svg>