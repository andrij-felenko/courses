<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазний платіж: Авторизація (Hold) та Захоплення (Capture)</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">чому пряме списання шкідливе в інтернет-торгівлі при відмові чи коригуванні замовлення</text>
<rect x="40.0" y="75.0" width="800.0" height="165.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/>
<text x="170.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Однофазне списання (Immediate Charge)</text>
<rect x="60.0" y="120.0" width="210.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Списання $100</tspan><tspan x="165.0" dy="14.3">(Гроші знято з балансу)</tspan></text>
<rect x="305.0" y="120.0" width="230.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. Товар закінчився на складі</tspan><tspan x="420.0" dy="14.3">(Замовлення неможливо виконати)</tspan></text>
<rect x="570.0" y="115.0" width="250.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="695.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">3. Повне повернення (Refund)</tspan><tspan x="695.0" dy="14.3">• Комісія шлюзу втрачена</tspan><tspan x="695.0" dy="14.3">• Очікування клієнта 3–5 днів</tspan></text>
<line x1="270.0" y1="145.0" x2="305.0" y2="145.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="535.0" y1="145.0" x2="570.0" y2="145.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="440.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Ризик: фінансові втрати на interchange-комісіях та незадоволений клієнт</text>
<rect x="40.0" y="260.0" width="800.0" height="200.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="170.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Двофазне списання (Authorize &amp; Capture)</text>
<rect x="60.0" y="310.0" width="210.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Авторизація (Hold)</tspan><tspan x="165.0" dy="14.3">Блокування ліміту на картці</tspan><tspan x="165.0" dy="14.3">(Діє 7 днів, $0 комісій)</tspan></text>
<rect x="310.0" y="300.0" width="240.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">2А. Товар відправлено покупцю</tspan><tspan x="430.0" dy="14.3">Виклик Capture на $100</tspan><tspan x="430.0" dy="14.3">(Остаточний кліринг коштів)</tspan></text>
<rect x="585.0" y="300.0" width="235.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="702.5" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="702.5" dy="0.0">Результат: Кошти списано</tspan><tspan x="702.5" dy="14.3">Товар доставлено</tspan><tspan x="702.5" dy="14.3">Комісія сплачена раз</tspan></text>
<rect x="310.0" y="385.0" width="240.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">2Б. Відмова / Немає на складі</tspan><tspan x="430.0" dy="14.3">Виклик Void (Скасування холду)</tspan><tspan x="430.0" dy="14.3">(Миттєве зняття блоку)</tspan></text>
<rect x="585.0" y="385.0" width="235.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="702.5" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="702.5" dy="0.0">Результат: $0 комісій</tspan><tspan x="702.5" dy="14.3">Баланс доступний миттєво</tspan><tspan x="702.5" dy="14.3">Немає процедури Refund</tspan></text>
<line x1="270.0" y1="340.0" x2="310.0" y2="330.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="270.0" y1="340.0" x2="310.0" y2="415.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="550.0" y1="330.0" x2="585.0" y2="330.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="550.0" y1="415.0" x2="585.0" y2="415.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>