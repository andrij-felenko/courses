<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка вебхуків та щоденна звірка (Reconciliation)</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">гарантія узгодженості стану між платіжним шлюзом та внутрішньою головною книгою</text>
<rect x="40.0" y="75.0" width="380.0" height="400.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Потоковий обробник вебхуків</text>
<rect x="55.0" y="120.0" width="350.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Перевірка HMAC-SHA256 підпису</tspan><tspan x="230.0" dy="14.3">Stripe-Signature (timestamp + v1)</tspan><tspan x="230.0" dy="14.3">Захист від спуфінгу та replay</tspan></text>
<rect x="55.0" y="190.0" width="350.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2. Дедуплікація подій (Таблиця processed_events)</tspan><tspan x="230.0" dy="14.3">Перевірка UNIQUE(event_id)</tspan><tspan x="230.0" dy="14.3">Ідемпотентний захист від повторів</tspan></text>
<rect x="55.0" y="260.0" width="350.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">3. Монотонний захист станів (State Guard)</tspan><tspan x="230.0" dy="14.3">Відхилення застарілих подій,</tspan><tspan x="230.0" dy="14.3">якщо локальний стан уже 'succeeded'</tspan></text>
<rect x="55.0" y="340.0" width="350.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">4. Подвійний бухгалтерський запис (Ledger)</tspan><tspan x="230.0" dy="14.3">Дебет: Розрахунковий рахунок шлюзу</tspan><tspan x="230.0" dy="14.3">Кредит: Дохід від реалізації замовлення</tspan></text>
<rect x="55.0" y="420.0" width="350.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="443.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">5. Відповідь 200 OK провайдеру</tspan></text>
<rect x="460.0" y="75.0" width="380.0" height="400.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фонова щоденна звірка (Reconciliation)</text>
<rect x="475.0" y="120.0" width="350.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">1. Завантаження балансового звіту PSP</tspan><tspan x="650.0" dy="14.3">(Settlement Report / Payout API / CSV)</tspan><tspan x="650.0" dy="14.3">Усі списання, повернення та комісії за добу</tspan></text>
<rect x="475.0" y="195.0" width="350.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">2. Посторінкове порівняння (Diff Engine)</tspan><tspan x="650.0" dy="14.3">Порівняння PSP Charge ID з записами</tspan><tspan x="650.0" dy="14.3">внутрішньої бази транзакцій магазину</tspan></text>
<rect x="475.0" y="275.0" width="350.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">3. Виявлення розбіжностей (Discrepancies):</tspan><tspan x="650.0" dy="14.3">• Втрачені вебхуки (charge є у PSP, нема в БД)</tspan><tspan x="650.0" dy="14.3">• Несподівані чарджбеки (Disputes)</tspan><tspan x="650.0" dy="14.3">• Відхилення валютної конвертації (FX slippage)</tspan></text>
<rect x="475.0" y="365.0" width="350.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="403.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">4. Автоматичне виправлення та алерт:</tspan><tspan x="650.0" dy="11.7">• Допроведення відсутніх проводок у Ledger</tspan><tspan x="650.0" dy="11.7">• Сповіщення фінансового відділу при суттєвих відхиленнях суми</tspan></text>
</svg>