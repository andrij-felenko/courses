<text x="75.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;/m:GetBalance&gt;</text>
<text x="65.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">&lt;/soap:Body&gt;</text>
<text x="230.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">✖ Заборонено стандартом WS-I Basic Profile 1.1</text>
<rect x="445.0" y="55.0" width="370.0" height="290.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="630.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Document / Literal Wrapped (Галузевий канон)</text>
<text x="460.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Особливості серіалізації:</text>
<text x="460.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Тіло — це повноцінний XML-документ, валідований XSD</text>
<text x="460.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Обгортка з назвою методу (&lt;GetBalance&gt;) спрощує диспетчеризацію</text>
<text x="460.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Повна сумісність між усіма мовами програмування</text>
<rect x="457.0" y="170.0" width="346.0" height="130.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="465.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">&lt;soap:Body&gt;</text>
<text x="475.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">&lt;m:GetBalance&gt;  &lt;!-- Обгортка операції --&gt;</text>
<text x="490.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;m:accNumber&gt;4291&lt;/m:accNumber&gt;</text>
<text x="490.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;m:currency&gt;USD&lt;/m:currency&gt;</text>
<text x="475.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">&lt;/m:GetBalance&gt;</text>
<text x="465.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">&lt;/soap:Body&gt;</text>
<text x="630.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Стандарт де-факто для всіх корпоративних SOAP-систем</text>
<text x="430.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Document/Literal Wrapped поєднав сувору схему XSD із можливістю маршрутизації методу за кореневим тегом</text>
</svg>