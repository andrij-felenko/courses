<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стилів повідомлень SOAP: RPC/Encoded vs Document/Literal Wrapped</text>
<rect x="45.0" y="55.0" width="370.0" height="290.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.6"/>
<text x="230.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">RPC / Encoded (Застарілий підхід)</text>
<text x="60.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Особливості серіалізації:</text>
<text x="60.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Типи кодуються за секцією 5 SOAP (xsi:type у кожному вузлі)</text>
<text x="60.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Тіло не можна валідувати стандартною XSD-схемою</text>
<text x="60.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Платформи (.NET, Java Axis) кодували графі не сумісно</text>
<rect x="57.0" y="170.0" width="346.0" height="130.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">&lt;soap:Body&gt;</text>
<text x="75.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;m:GetBalance soap:encodingStyle=&quot;...&quot;&gt;</text>
<text x="90.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">&lt;accNumber xsi:type=&quot;xsd:string&quot;&gt;4291&lt;/accNumber&gt;</text>
