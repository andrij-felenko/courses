<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість рівнів специфікації WSDL 1.1</text>
<rect x="50.0" y="60.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="64.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">&lt;types&gt;</text>
<text x="64.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">XSD-схеми: визначення типів даних і структур (елементи, поля)</text>
<rect x="50.0" y="125.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="64.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">&lt;message&gt;</text>
<text x="64.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Логічні повідомлення: вхідні й вихідні параметри операцій</text>
<rect x="50.0" y="190.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="64.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">&lt;portType&gt;</text>
<text x="64.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Абстрактний інтерфейс: набір операцій (Request-Response, One-Way)</text>
<rect x="450.0" y="60.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="464.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">&lt;binding&gt;</text>
<text x="464.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Конкретний протокол: SOAP 1.1/1.2, стиль Document/Wrapped, транспорт HTTP</text>
<rect x="450.0" y="125.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="464.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">&lt;port&gt;</text>
<text x="464.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Мережева адреса: фізична точка підключення (URL ендпоінта)</text>
<rect x="450.0" y="190.0" width="340.0" height="52.0" rx="7" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="464.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">&lt;service&gt;</text>
<text x="464.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Служба: логічне об'єднання споріднених портів у єдиний сервіс</text>
<text x="220.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">АБСТРАКТНИЙ РІВЕНЬ (ЩО робить сервіс)</text>
<text x="620.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КОНКРЕТНИЙ РІВЕНЬ (ЯК і ДЕ викликати)</text>
<line x1="220.0" y1="112.0" x2="220.0" y2="123.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="177.0" x2="220.0" y2="188.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390.0" y1="216.0" x2="450.0" y2="86.0" stroke="#7b1fa2" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle" font-style="italic">реалізує</text>
<line x1="620.0" y1="112.0" x2="620.0" y2="123.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="177.0" x2="620.0" y2="188.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="260.0" width="340.0" height="80.0" rx="6" fill="#fdfbf7" stroke="#b08900" stroke-width="1.2"/>
<text x="62.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="start" font-weight="700">Генерація коду (WSDL2Java / svcutil):</text>
<text x="62.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Клієнтський стаб (Stub/Proxy) генерується автоматично</text>
<text x="62.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Сувора статична типізація під час компіляції</text>
<text x="62.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Не потребує ручного парсингу XML</text>
<rect x="450.0" y="260.0" width="340.0" height="80.0" rx="6" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.2"/>
<text x="462.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">WS-I Basic Profile 1.1:</text>
<text x="462.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Стандарт інтероперабельності між різними платформами</text>
<text x="462.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Забороняє RPC/Encoded (секція 5 SOAP)</text>
<text x="462.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Вимагає стиль Document/Literal Wrapped</text>
<text x="420.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">WSDL відділяє абстрактні типи й методи від деталей транспорту, протоколу та фізичної адреси</text>
</svg>