<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Штатне виведення вузла (Drain): сесійна прив'язка проти бездержавності</text>
<rect x="20.0" y="52.0" width="900.0" height="145.0" rx="8" fill="#fdfaf6" stroke="#d97706" stroke-width="1.5"/>
<text x="160.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">Вузол із сесіями в пам'яті (Stateful):</text>
<line x1="290.0" y1="75.0" x2="880.0" y2="75.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="320.0" cy="75.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="320.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SIGTERM</text>
<rect x="350.0" y="108.5" width="340.0" height="43.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="520.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Очікування згасання сесій (Session Drain Time)</tspan><tspan x="520.0" dy="13.0">Тривалість: від 30 хвилин до кількох годин!</tspan></text>
<circle cx="750.0" cy="75.0" r="6.0" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="750.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зупинка</text>
<text x="850.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Деплой паралізовано</text>
<rect x="20.0" y="215.0" width="900.0" height="145.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Бездержавний воркер (Stateless):</text>
<line x1="290.0" y1="238.0" x2="880.0" y2="238.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="320.0" cy="238.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="320.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">SIGTERM</text>
<rect x="318.8" y="273.5" width="202.4" height="43.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Завершення активних HTTP-запитів</tspan><tspan x="420.0" dy="13.0">Тривалість: 2–5 секунд</tspan></text>
<circle cx="530.0" cy="238.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="530.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Повна зупинка</text>
<text x="730.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Нові запити миттєво підхоплюють сусідні вузли</text>
<text x="730.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Безперервний деплой (Zero-Downtime Rolling Update)</text>
</svg>