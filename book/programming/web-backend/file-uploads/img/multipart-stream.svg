<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буферизація проти потокового парсингу multipart/form-data</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">накопичення всього тіла в пам'яті (O(N)) проти кінцевого автомата на фіксованому буфері (O(1))</text>
<rect x="180.0" y="70.0" width="520.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Вхідний HTTP-потік: POST multipart/form-data (100 паралельних завантажень по 500 МБ)</tspan></text>
<rect x="35.0" y="120.0" width="390.0" height="345.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Наївна буферизація (в оперативній пам'яті)</text>
<rect x="50.0" y="165.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Сервер зчитує весь потік у пам'ять до кінця — 500 МБ на з'єднання</tspan></text>
<rect x="50.0" y="217.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="242.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">100 активних клієнтів тримають пам'ять — 50 ГБ споживання RAM</tspan></text>
<rect x="50.0" y="269.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="294.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Затримка першого байту для обробки — Повна тривалість мережі</tspan></text>
<rect x="50.0" y="321.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="346.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Наслідок: вичерпання RAM і падіння — OOM Killer гасить бекенд</tspan></text>
<rect x="50.0" y="385.0" width="360.0" height="60.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/><text x="230.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Пам'ять: O(N · розмір)   ✗  Вразливість до DoS</tspan></text>
<rect x="455.0" y="120.0" width="390.0" height="345.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Потоковий розбір (Streaming State Machine)</text>
<rect x="470.0" y="165.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="650.0" y="190.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Фіксований буфер чанка в пам'яті — 64 КБ на з'єднання</tspan></text>
<rect x="470.0" y="217.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="650.0" y="242.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Кінцевий автомат шукає boundary — Обробка байтів на льоту</tspan></text>
<rect x="470.0" y="269.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="650.0" y="294.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Потоковий запис у диск або S3 — Backpressure контролює потік</tspan></text>
<rect x="470.0" y="321.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="650.0" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">100 активних клієнтів споживають — Всього 6.4 МБ RAM</tspan></text>
<rect x="470.0" y="385.0" width="360.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="418.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Пам'ять: O(1)   ✓  Стабільність під будь-яким навантаженням</tspan></text>
</svg>