<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада токенів у сучасній архітектурі OIDC та OAuth 2.0</text>
<rect x="24.0" y="60.0" width="280.0" height="350.0" rx="11" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="164.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ID Token (Ідентичність)</text>
<text x="164.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Для кого: КЛІЄНТСЬКИЙ ЗАСТОСУНОК</text>
<rect x="38.0" y="122.0" width="252.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="164.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">Формат: Завжди підписаний JWT.</tspan><tspan x="164.0" dy="11.7">Питання: ХТО цей користувач?</tspan><tspan x="164.0" dy="11.7">Призначення: Доказ успішної автентифікації.</tspan></text>
<rect x="38.0" y="214.0" width="252.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="164.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">Ключові твердження (claims):</tspan><tspan x="164.0" dy="13.7">• sub: унікальний ID особи</tspan><tspan x="164.0" dy="13.7">• iss: URL провайдера (IdP)</tspan><tspan x="164.0" dy="13.7">• aud: client_id застосунку</tspan><tspan x="164.0" dy="13.7">• exp / iat: строк дії та час видачі</tspan><tspan x="164.0" dy="13.7">• nonce: захист від повтору</tspan></text>
<rect x="38.0" y="336.0" width="252.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="164.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="164.0" dy="0.0">⚠️ Ніколи не надсилається до ресурсного API як дозвіл!</tspan></text>
<rect x="330.0" y="60.0" width="280.0" height="350.0" rx="11" fill="#fbf8ff" stroke="#7b1fa2" stroke-width="1.8"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b1fa2" text-anchor="middle" font-weight="700">Access Token (Доступ)</text>
<text x="470.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="700">Для кого: СЕРВЕР РЕСУРСІВ (API)</text>
<rect x="344.0" y="122.0" width="252.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="470.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Формат: JWT або Opaque (посилання).</tspan><tspan x="470.0" dy="13.0">Питання: ЩО дозволено робити?</tspan><tspan x="470.0" dy="13.0">Призначення: Авторизація запитів до API.</tspan></text>
<rect x="344.0" y="214.0" width="252.0" height="110.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.2"/><text x="470.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ключові властивості:</tspan><tspan x="470.0" dy="13.7">• scope: read:photos write:orders</tspan><tspan x="470.0" dy="13.7">• aud: ідентифікатор API</tspan><tspan x="470.0" dy="13.7">• exp: короткий TTL (5–60 хв)</tspan><tspan x="470.0" dy="13.7">• Передається в заголовку:</tspan><tspan x="470.0" dy="13.7">  Authorization: Bearer &lt;token&gt;</tspan></text>
<rect x="344.0" y="336.0" width="252.0" height="60.0" rx="6" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.2"/><text x="470.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">✓ Клієнт ставиться як до «чорної скриньки» (Bearer).</tspan></text>
<rect x="636.0" y="60.0" width="280.0" height="350.0" rx="11" fill="#fffdfa" stroke="#b08900" stroke-width="1.8"/>
<text x="776.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">Refresh Token (Оновлення)</text>
<text x="776.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">Для кого: СЕРВЕР АВТОРИЗАЦІЇ</text>
<rect x="650.0" y="122.0" width="252.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="776.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">Формат: Зазвичай довгий opaque-рядок.</tspan><tspan x="776.0" dy="11.7">Питання: Як поновити сесію без вводу пароля?</tspan><tspan x="776.0" dy="11.7">Призначення: Отримання свіжих токенів.</tspan></text>
<rect x="650.0" y="214.0" width="252.0" height="110.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="776.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">Ключові властивості:</tspan><tspan x="776.0" dy="11.7">• Довгий TTL (дні, місяці)</tspan><tspan x="776.0" dy="11.7">• Зберігається у безпечному сховищі</tspan><tspan x="776.0" dy="11.7">• Підлягає ротації при кожному використанні (Rotation)</tspan><tspan x="776.0" dy="11.7">• Негайно анулюється при виході</tspan></text>
<rect x="650.0" y="336.0" width="252.0" height="60.0" rx="6" fill="#fff8e7" stroke="#b08900" stroke-width="1.2"/><text x="776.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="776.0" dy="0.0">🔒 Знищує старий токен при видачі нового (Token Rotation).</tspan></text>
</svg>