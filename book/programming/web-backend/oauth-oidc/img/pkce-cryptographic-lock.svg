<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічний замок PKCE проти перехоплення коду</text>
<rect x="30.0" y="60.0" width="260.0" height="330.0" rx="10" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.7"/>
<text x="160.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Клієнт створює секрет</text>
<rect x="46.0" y="106.0" width="228.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="160.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">code_verifier:</tspan><tspan x="160.0" dy="14.3">випадковий рядок 43..128 симв.</tspan><tspan x="160.0" dy="14.3">(висока ентропія)</tspan></text>
<rect x="46.0" y="198.0" width="228.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="160.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">code_challenge:</tspan><tspan x="160.0" dy="14.3">BASE64URL(SHA256(verifier))</tspan><tspan x="160.0" dy="14.3">(односторонній хеш)</tspan></text>
<rect x="46.0" y="290.0" width="228.0" height="80.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.2"/><text x="160.0" y="327.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Клієнт ховає verifier у пам'яті,</tspan><tspan x="160.0" dy="11.7">а challenge надсилає у запиті /authorize</tspan></text>
<rect x="330.0" y="60.0" width="280.0" height="330.0" rx="10" fill="#fffdfa" stroke="#c0392b" stroke-width="1.7"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Перехоплення у фронт-каналі</text>
<rect x="346.0" y="106.0" width="248.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="470.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="470.0" dy="0.0">Зловмисник перехоплює:</tspan><tspan x="470.0" dy="14.3">• code_challenge (з URL)</tspan><tspan x="470.0" dy="14.3">• code (з редіректу)</tspan></text>
<rect x="346.0" y="198.0" width="248.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="470.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Але зловмисник НЕ знає</tspan><tspan x="470.0" dy="15.0">оригінальний code_verifier!</tspan></text>
<rect x="346.0" y="290.0" width="248.0" height="80.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.2"/><text x="470.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Відновити verifier із challenge</tspan><tspan x="470.0" dy="13.7">неможливо, бо SHA-256 незворотний.</tspan></text>
<rect x="650.0" y="60.0" width="260.0" height="330.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.7"/>
<text x="780.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Валідація на /token</text>
<rect x="666.0" y="106.0" width="228.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="780.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Клієнт надсилає verifier</tspan><tspan x="780.0" dy="14.3">на бекенд-ендпоінт /token</tspan></text>
<rect x="666.0" y="198.0" width="228.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="780.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Сервер рахує:</tspan><tspan x="780.0" dy="14.3">SHA256(надісланий verifier)</tspan><tspan x="780.0" dy="14.3">і звіряє з збереженим challenge</tspan></text>
<rect x="666.0" y="290.0" width="228.0" height="80.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.3"/><text x="780.0" y="327.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">✓ Збіглося → видати токени.</tspan><tspan x="780.0" dy="11.7">✗ Зловмисник без verifier → 400 Bad Request.</tspan></text>
<line x1="290.0" y1="238.0" x2="326.0" y2="238.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="238.0" x2="646.0" y2="238.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>