<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий загублений відгук — два різні кінці</text>
<text x="430.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">клієнт не знає, чи пройшло, тож повторює — а далі все залежить від сервера</text>
<rect x="150.0" y="78.0" width="560.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="430.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">POST /charges 100 грн  →  сервер списав  →  відгук зник  →  клієнт повторює</tspan></text>
<rect x="40.0" y="142.0" width="380.0" height="292.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.9"/>
<text x="230.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Повтор без захисту</text>
<rect x="62.0" y="194.0" width="336.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">① POST 100 грн  →  списано, відгук зник</tspan></text>
<rect x="62.0" y="248.0" width="336.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">② повтор POST 100 грн  →  списано ЗНОВУ</tspan></text>
<rect x="62.0" y="324.0" width="336.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="230.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">разом −200 грн   ✗  подвійне списання</tspan></text>
<rect x="440.0" y="142.0" width="380.0" height="292.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.9"/>
<text x="630.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Повтор із ключем ідемпотентності</text>
<rect x="462.0" y="194.0" width="336.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="630.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">① POST 100 грн [key K]  →  списано, відгук зник</tspan></text>
<rect x="462.0" y="248.0" width="336.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="630.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">② повтор [key K]  →  віддано збережене</tspan></text>
<rect x="462.0" y="324.0" width="336.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="630.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">разом −100 грн   ✓  рівно раз</tspan></text>
</svg>