<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура диспетчера: Outbox, розділення черг та ізоляція навантаження</text>
<rect x="40.0" y="85.9" width="180.0" height="88.2" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Доменні сервіси</tspan><tspan x="130.0" dy="14.3">(Платежі, Замовлення)</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">Транзакційний Outbox</tspan><tspan x="130.0" dy="14.3">(Таблиця webhook_events)</tspan></text>
<rect x="270.0" y="93.0" width="180.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Outbox CDC / Poller</tspan><tspan x="360.0" dy="14.3">+</tspan><tspan x="360.0" dy="14.3">Маршрутизатор підписок</tspan><tspan x="360.0" dy="14.3">(Схеми, Версіонування)</tspan></text>
<line x1="225.0" y1="130.0" x2="265.0" y2="130.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="500.0" y="57.3" width="240.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Пріоритетна Live-черга</tspan><tspan x="620.0" dy="14.3">(Свіжі події, затримка &lt; 200 ms)</tspan></text>
<rect x="500.0" y="157.3" width="240.0" height="45.3" rx="6" fill="#fff8e7" stroke="#d48806" stroke-width="1.5"/><text x="620.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Черга повторів (Retry Backoff)</tspan><tspan x="620.0" dy="14.3">(Відкладені спроби 1хв - 24год)</tspan></text>
<rect x="484.6" y="257.4" width="270.8" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Черга ручного перевідправлення (Replay)</tspan><tspan x="620.0" dy="14.3">(Низький пріоритет, без блокування Live)</tspan></text>
<rect x="490.9" y="357.4" width="258.3" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Мертва черга (Dead Letter Queue / DLQ)</tspan><tspan x="620.0" dy="14.3">(Незворотні збої, для розслідування)</tspan></text>
