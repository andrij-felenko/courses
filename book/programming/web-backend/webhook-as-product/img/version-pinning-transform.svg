<line x1="480.0" y1="169.4" x2="480.0" y2="250.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="488.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">для версії 2022-08</text>
