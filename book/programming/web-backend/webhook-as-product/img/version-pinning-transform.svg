<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Версіонування схем подій та фіксація версії (API Version Pinning)</text>
<rect x="40.0" y="57.2" width="240.0" height="125.6" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Канонічна подія (v2026-03)</tspan><tspan x="160.0" dy="15.6">{</tspan><tspan x="160.0" dy="15.6">  event_id: 'evt_991',</tspan><tspan x="160.0" dy="15.6">  amount: 4500,</tspan><tspan x="160.0" dy="15.6">  currency: 'usd',</tspan><tspan x="160.0" dy="15.6">  billing: { address: '...' }</tspan><tspan x="160.0" dy="15.6">}</tspan></text>
<text x="160.0" y="45.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Доменна сутність (ядро)</text>
<rect x="340.0" y="80.6" width="279.9" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Реєстр підписок кінцевих точок</tspan><tspan x="480.0" dy="15.6">Ендпоінт A: pinned_version = '2026-03'</tspan><tspan x="480.0" dy="15.6">Ендпоінт B: pinned_version = '2024-11'</tspan><tspan x="480.0" dy="15.6">Ендпоінт C: pinned_version = '2022-08'</tspan></text>
