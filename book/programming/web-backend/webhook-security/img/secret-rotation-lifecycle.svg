<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ротація секретів без простою (Zero-Downtime Secret Rotation)</text>
<rect x="40.0" y="88.8" width="200.0" height="102.5" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Фаза 1: Генерація</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">Провайдер створює</tspan><tspan x="140.0" dy="14.3">новий секрет Secret_B.</tspan><tspan x="140.0" dy="14.3">Споживач додає Secret_B</tspan><tspan x="140.0" dy="14.3">як вторинний (secondary).</tspan></text>
<text x="140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">КРОК 1</text>
<rect x="279.1" y="81.6" width="201.8" height="116.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Фаза 2: Підпис обома</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Провайдер шле підпис</tspan><tspan x="380.0" dy="14.3">Secret_B (або обидва: A і B).</tspan><tspan x="380.0" dy="14.3">Споживач валідує:</tspan><tspan x="380.0" dy="14.3">1) Secret_A (primary)</tspan><tspan x="380.0" dy="14.3">2) Secret_B (secondary).</tspan></text>
<text x="380.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">КРОК 2</text>
<line x1="240.0" y1="140.0" x2="279.1" y2="140.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="520.0" y="81.6" width="200.0" height="116.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Фаза 3: Перемикання</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Споживач підвищує</tspan><tspan x="620.0" dy="14.3">Secret_B до primary.</tspan><tspan x="620.0" dy="14.3">Secret_A стає secondary.</tspan><tspan x="620.0" dy="14.3">Запити обох типів</tspan><tspan x="620.0" dy="14.3">успішно проходять.</tspan></text>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КРОК 3</text>
<line x1="480.9" y1="140.0" x2="520.0" y2="140.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="760.0" y="81.6" width="200.0" height="116.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Фаза 4: Очищення</tspan><tspan x="860.0" dy="14.3"></tspan><tspan x="860.0" dy="14.3">Минув час time-window</tspan><tspan x="860.0" dy="14.3">(наприклад, 15 хвилин).</tspan><tspan x="860.0" dy="14.3">Старий Secret_A</tspan><tspan x="860.0" dy="14.3">повністю видаляється</tspan><tspan x="860.0" dy="14.3">з конфігурації.</tspan></text>
<text x="860.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КРОК 4</text>
<line x1="720.0" y1="140.0" x2="760.0" y2="140.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="500.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан верифікатора споживача на кожному етапі:</text>
<rect x="45.0" y="337.4" width="190.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Primary: Key_A</tspan><tspan x="140.0" dy="14.3">Secondary: Key_B</tspan></text>
<rect x="285.0" y="337.4" width="190.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Primary: Key_A</tspan><tspan x="380.0" dy="14.3">Secondary: Key_B</tspan></text>
<rect x="525.0" y="337.4" width="190.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Primary: Key_B</tspan><tspan x="620.0" dy="14.3">Secondary: Key_A</tspan></text>
<rect x="765.0" y="337.4" width="190.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Primary: Key_B</tspan><tspan x="860.0" dy="14.3">Secondary: —</tspan></text>
<line x1="235.0" y1="360.0" x2="285.0" y2="360.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="475.0" y1="360.0" x2="525.0" y2="360.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="715.0" y1="360.0" x2="765.0" y2="360.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>