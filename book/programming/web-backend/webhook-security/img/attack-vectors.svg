<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1011.5 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1011.5" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори атак на відкритий вебхук-ендпоінт</text>
<rect x="580.0" y="254.6" width="200.0" height="70.8" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/><text x="680.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Сервер споживача</tspan><tspan x="680.0" dy="16.9">POST /api/webhooks</tspan><tspan x="680.0" dy="16.9">(Публічна URL-адреса)</tspan></text>
<rect x="40.0" y="68.4" width="360.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Спуфінг джерела (Source Spoofing)</tspan><tspan x="220.0" dy="15.6">Зловмисник шле вигадану подію</tspan><tspan x="220.0" dy="15.6">«payment.succeeded» на публічний URL</tspan></text>
<line x1="400.0" y1="100.0" x2="580.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фальшиве тіло без секрету</text>
<rect x="40.0" y="188.4" width="360.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. Підробка тіла (Payload Tampering)</tspan><tspan x="220.0" dy="15.6">Перехоплення та зміна суми</tspan><tspan x="220.0" dy="15.6">або account_id під час передачі</tspan></text>
<line x1="400.0" y1="220.0" x2="580.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Модифікований JSON</text>
<rect x="40.0" y="318.4" width="360.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3. Атака повторення (Replay Attack)</tspan><tspan x="220.0" dy="15.6">Перехоплення справжнього запиту</tspan><tspan x="220.0" dy="15.6">і повторне надсилання десятки разів</tspan></text>
<line x1="400.0" y1="350.0" x2="580.0" y2="315.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повтор старого виклику</text>
<rect x="40.0" y="448.4" width="360.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">4. Таймінг-атака (Timing Attack)</tspan><tspan x="220.0" dy="15.6">Побайтовий підбір підпису через різницю</tspan><tspan x="220.0" dy="15.6">в часі обриву небезпечного strcmp</tspan></text>
<line x1="400.0" y1="480.0" x2="580.0" y2="360.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вимірювання затримки відповіді</text>
<rect x="808.5" y="253.1" width="183.0" height="73.9" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Наслідки без захисту:</tspan><tspan x="900.0" dy="14.3">• Відвантаження без оплати</tspan><tspan x="900.0" dy="14.3">• Подвійне нарахування</tspan><tspan x="900.0" dy="14.3">• Злам автентифікації</tspan></text>
<line x1="780.0" y1="290.0" x2="815.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>