<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вразливість Range DoS (Apache Killer) та захист через коалесценцію</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">шкідливий запит десятків тисяч зрізів проти дедуплікації та об'єднання діапазонів на сервері</text>
<rect x="40.0" y="75.0" width="385.0" height="395.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="232.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Атака: Перевантаження діапазонами (CVE-2011-3192)</text>
<rect x="55.0" y="120.0" width="355.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="232.5" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="232.5" dy="0.0">Range: bytes=0-,5-1,5-2,5-3,5-4,...</tspan><tspan x="232.5" dy="13.7">(зловмисник передає тисячі перекритих зрізів)</tspan></text>
<rect x="55.0" y="185.0" width="355.0" height="45.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="232.5" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Сервер генерує тисячі MIME-заголовків</tspan><tspan x="232.5" dy="13.0">розмір відповіді в 100 разів більший за файл</tspan></text>
<rect x="55.0" y="240.0" width="355.0" height="55.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="232.5" y="264.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Диск виконує тисячі випадкових seek()</tspan><tspan x="232.5" dy="13.0">оперативна пам'ять вичерпується буферами MIME</tspan></text>
<rect x="55.0" y="305.0" width="355.0" height="45.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="232.5" y="324.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Наслідок: 100% завантаження CPU і RAM</tspan><tspan x="232.5" dy="13.0">робочі процеси вебсервера блокуються</tspan></text>
<rect x="55.0" y="360.0" width="355.0" height="95.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="232.5" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="232.5" dy="0.0">Підсумок наївного сервера:</tspan><tspan x="232.5" dy="14.3">✗ Повне вичерпання ресурсів пам'яті</tspan><tspan x="232.5" dy="14.3">✗ Відмова в обслуговуванні легітимних клієнтів</tspan></text>
<rect x="455.0" y="75.0" width="385.0" height="395.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="647.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Захист: Валідація та коалесценція (Range Coalescing)</text>
<rect x="470.0" y="120.0" width="355.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="647.5" y="141.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">1. Ліміт кількості діапазонів (Max Ranges)</tspan><tspan x="647.5" dy="13.7">NGINX: max 1 range, Apache: max 5-10 ranges</tspan></text>
<rect x="470.0" y="180.0" width="355.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="647.5" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">2. Сортування та злиття (Coalescing)</tspan><tspan x="647.5" dy="12.3">[0..100] + [50..200] автоматично зливаються в [0..200]</tspan></text>
<rect x="470.0" y="240.0" width="355.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="647.5" y="262.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">3. Відкидання некоректних діапазонів</tspan><tspan x="647.5" dy="11.7">start &gt; end або start &gt;= total → 416 Range Not Satisfiable</tspan></text>
<rect x="470.0" y="300.0" width="355.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="647.5" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">4. Поріг накладних витрат MIME</tspan><tspan x="647.5" dy="12.3">якщо розмір MIME перевищує виграш — повернення 200 OK</tspan></text>
<rect x="470.0" y="360.0" width="355.0" height="95.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="647.5" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">Підсумок захищеного сервера:</tspan><tspan x="647.5" dy="14.3">✓ Стабільне споживання O(1) ресурсів</tspan><tspan x="647.5" dy="14.3">✓ Повний захист від атак вичерпання пам'яті</tspan></text>
</svg>