<rect x="475.0" y="335.0" width="330.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="640.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Content-Type: video/mp4</tspan></text>
<rect x="475.0" y="380.0" width="330.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="640.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Accept-Ranges: bytes</tspan><tspan x="640.0" dy="13.7">(підтвердження підтримки байтових зрізів)</tspan><tspan x="640.0" dy="13.7">+ Тіло: двійковий зріз 1 048 576 байтів</tspan></text>
