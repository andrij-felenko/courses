<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемотування медіа: індексація MP4 moov та байтові діапазони</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">браузер зчитує метадані з початку файлу, обчислює зміщення кадру і запитує потрібний зріз</text>
<rect x="60.0" y="75.0" width="760.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="75.0" width="120.0" height="50.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="180.0" y="75.0" width="340.0" height="50.0" rx="0" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
<rect x="520.0" y="75.0" width="150.0" height="50.0" rx="0" fill="#dbeafe" stroke="#2457d6" stroke-width="2.0"/>
<rect x="670.0" y="75.0" width="150.0" height="50.0" rx="0" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">moov atom (1.2 МБ)</text>
<text x="120.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">індекс таймкодів</text>
<text x="350.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">mdat: відеокадри (0 .. 45 хв)</text>
<text x="595.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ключовий кадр 45:00</text>
<text x="595.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">зсув: 1 250 000 000</text>
<text x="745.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">mdat: решта (46..90 хв)</text>
<rect x="60.0" y="145.0" width="360.0" height="310.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="240.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Крок 1: Ініціалізація та пошук moov</text>
<rect x="75.0" y="190.0" width="330.0" height="48.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="240.0" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Запит перших 64 КБ:</tspan><tspan x="240.0" dy="13.7">GET /video.mp4  |  Range: bytes=0-65535</tspan></text>
<rect x="75.0" y="245.0" width="330.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="240.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Якщо moov на початку (qt-faststart):</tspan><tspan x="240.0" dy="13.7">браузер миттєво отримує таблицю семплів stbl</tspan></text>
<rect x="75.0" y="300.0" width="330.0" height="48.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="240.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Якщо moov у хвості (без faststart):</tspan><tspan x="240.0" dy="13.7">Range: bytes=-1048576 (читання останнього 1 МБ)</tspan></text>
<rect x="75.0" y="355.0" width="330.0" height="85.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="240.0" y="380.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Результат:</tspan><tspan x="240.0" dy="13.7">Плеєр знає тривалість, роздільність та</tspan><tspan x="240.0" dy="13.7">побайтну карту всіх ключових кадрів (GOP).</tspan><tspan x="240.0" dy="13.7">Відео готове до миттєвого старту.</tspan></text>
<line x1="425.0" y1="300.0" x2="455.0" y2="300.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="145.0" width="360.0" height="310.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="640.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 2: Стрибок на 45:00 (Seek)</text>
<rect x="475.0" y="190.0" width="330.0" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="640.0" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Користувач перетягує повзунок на 45:00:</tspan><tspan x="640.0" dy="13.7">Плеєр шукає найближчий I-frame у таблиці stss</tspan></text>
<rect x="475.0" y="245.0" width="330.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="640.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Обчислення байтового зсуву в таблиці stco:</tspan><tspan x="640.0" dy="12.3">I-frame на 45:00 розташований за зсувом 1 250 000 000</tspan></text>
<rect x="475.0" y="300.0" width="330.0" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Запит точного зрізу кадру:</tspan><tspan x="640.0" dy="13.7">GET /video.mp4  |  Range: bytes=1250000000-</tspan></text>
<rect x="475.0" y="355.0" width="330.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="380.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Результат:</tspan><tspan x="640.0" dy="13.7">✗ Не потрібно завантажувати перші 1.2 ГБ</tspan><tspan x="640.0" dy="13.7">✓ Відео починає грати з 45:00 за 50 мс</tspan><tspan x="640.0" dy="13.7">✓ Економія 99% мережевого трафіку</tspan></text>
</svg>