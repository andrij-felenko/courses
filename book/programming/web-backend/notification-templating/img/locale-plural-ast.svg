<text x="420.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. name = &quot;Олена&quot; | 2. 23 mod 10 = 3 (не 13) -&gt; категорія 'few' -&gt; &quot;23 нові завдання&quot;</text>
<text x="420.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Результат: &quot;Олена, ви маєте 23 нові завдання&quot;</text>
