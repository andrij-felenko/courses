<text x="500.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повтор доставки, повтор черги, гонка робітників, рестарт — усі впираються в 'done' і виходять без ефекту.</text>
