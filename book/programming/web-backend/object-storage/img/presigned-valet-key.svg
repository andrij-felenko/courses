<text x="290.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. POST /api/v1/files/ticket { filename, size, mime }</text>
