<text x="440.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. PUT https://bucket.s3.amazonaws.com/uuid?X-Amz-Signature=... (двійковий блоб 500 МБ)</text>
