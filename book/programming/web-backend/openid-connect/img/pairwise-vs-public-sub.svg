<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Публічний (Public) vs Попарний (Pairwise) ідентифікатор суб'єкта sub</text>
<rect x="40.0" y="54.0" width="425.0" height="346.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="252.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Публічний суб'єкт (Public Subject)</text>
<rect x="56.0" y="100.0" width="393.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="252.5" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="252.5" dy="0.0">sub однаковий для всіх застосунків у світі</tspan></text>
<rect x="56.0" y="158.0" width="393.0" height="110.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="252.5" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Користувач Alice (ID: 48201) логіниться:</tspan><tspan x="252.5" dy="15.0">• Сайт A (Магазин):      sub = &quot;usr-48201&quot;</tspan><tspan x="252.5" dy="15.0">• Сайт B (Форум):        sub = &quot;usr-48201&quot;</tspan><tspan x="252.5" dy="15.0">• Сайт C (Медпортал): sub = &quot;usr-48201&quot;</tspan></text>
<rect x="56.0" y="280.0" width="393.0" height="106.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="252.5" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="252.5" dy="0.0">НАСЛІДОК ДЛЯ ПРИВАТНОСТІ:</tspan><tspan x="252.5" dy="14.3">Сайти A, B і C можуть об'єднати бази даних</tspan><tspan x="252.5" dy="14.3">й повністю відстежити активність та профіль Аліси</tspan><tspan x="252.5" dy="14.3">в усьому інтернеті без її згоди</tspan></text>
<rect x="495.0" y="54.0" width="425.0" height="346.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="707.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Попарний суб'єкт (Pairwise Subject)</text>
<rect x="511.0" y="100.0" width="393.0" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="707.5" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">sub унікальний для кожного домену/клієнта</tspan></text>
<rect x="511.0" y="158.0" width="393.0" height="110.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="707.5" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Формула: sub = HMAC_SHA256(user_id + sector_id, secret)</tspan><tspan x="707.5" dy="15.0">• Сайт A (shop.com):     sub = &quot;a9f4c81...&quot;</tspan><tspan x="707.5" dy="15.0">• Сайт B (forum.org):    sub = &quot;b2e710d...&quot;</tspan><tspan x="707.5" dy="15.0">• Сайт C (health.net):   sub = &quot;c503fa9...&quot;</tspan></text>
<rect x="511.0" y="280.0" width="393.0" height="106.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="707.5" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="707.5" dy="0.0">ПЕРЕВАГА ДЛЯ ПРИВАТНОСТІ:</tspan><tspan x="707.5" dy="14.3">Сайти A, B і C бачать геть різні ідентифікатори.</tspan><tspan x="707.5" dy="14.3">Неможливо скорелювати дії користувача між різними</tspan><tspan x="707.5" dy="14.3">сервісами, доки користувач сам не розкриє зв'язок</tspan></text>
</svg>