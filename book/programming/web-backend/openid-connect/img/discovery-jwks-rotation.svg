<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічне виявлення конфігурації та безпечна ротація ключів через JWKS</text>
<rect x="40.0" y="56.0" width="410.0" height="360.0" rx="8" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.6"/>
<text x="245.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Relying Party)</text>
<rect x="56.0" y="102.0" width="378.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="245.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. Завантажує метадані при старті:</tspan><tspan x="245.0" dy="15.0">GET https://idp.com/.well-known/openid-configuration</tspan><tspan x="245.0" dy="15.0">Дізнається jwks_uri, token_endpoint тощо</tspan></text>
<rect x="56.0" y="184.0" width="378.0" height="96.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="245.0" y="214.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">2. Кеш відкритих ключів (JWKS Cache):</tspan><tspan x="245.0" dy="14.3">  key-2026-01  →  RSA Public Key A (активний)</tspan><tspan x="245.0" dy="14.3">  key-2025-12  →  RSA Public Key B (старий)</tspan><tspan x="245.0" dy="14.3">TTL кешу: 24 години (з повагою до Cache-Control)</tspan></text>
<rect x="56.0" y="294.0" width="378.0" height="108.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="245.0" y="330.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">3. Обробка ротації при отриманні токена:</tspan><tspan x="245.0" dy="14.3">• Приходить ID-токен із новим kid=&quot;key-2026-02&quot;</tspan><tspan x="245.0" dy="14.3">• Якщо kid немає в кеші → одиночний запит до jwks_uri</tspan><tspan x="245.0" dy="14.3">• Оновлення кешу → успішна валідація підпису</tspan></text>
<rect x="510.0" y="56.0" width="410.0" height="360.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="715.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">OpenID Provider (IdP)</text>
<rect x="526.0" y="102.0" width="378.0" height="86.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="715.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Ендпоінт JWKS:</tspan><tspan x="715.0" dy="15.0">GET https://idp.com/.well-known/jwks.json</tspan><tspan x="715.0" dy="15.0">Повертає набір публічних ключів (keys array)</tspan><tspan x="715.0" dy="15.0">із параметрами kty, alg, use, kid, n, e</tspan></text>
<rect x="526.0" y="202.0" width="378.0" height="96.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="715.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Процес ротації ключів на стороні IdP:</tspan><tspan x="715.0" dy="14.3">1. Генерація нового ключа (kid: key-2026-02)</tspan><tspan x="715.0" dy="14.3">2. Публікація нового ключа в JWKS заздалегідь</tspan><tspan x="715.0" dy="14.3">3. Початок підписання нових токенів новим ключем</tspan></text>
<rect x="526.0" y="312.0" width="378.0" height="90.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.3"/><text x="715.0" y="346.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Граціозне виведення старого ключа:</tspan><tspan x="715.0" dy="14.3">Старий ключ (key-2026-01) лишається в JWKS ще деякий час,</tspan><tspan x="715.0" dy="14.3">доки не спливе термін дії всіх раніше виданих токенів</tspan></text>
<line x1="450.0" y1="136.0" x2="508.0" y2="136.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="508.0" y1="357.0" x2="450.0" y2="357.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>