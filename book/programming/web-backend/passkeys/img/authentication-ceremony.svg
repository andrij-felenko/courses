<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Церемонія автентифікації: криптографічний доказ володіння закритим ключем</text>
<rect x="59.4" y="40.0" width="181.2" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Автентифікатор</tspan><tspan x="150.0" dy="16.9">(Пристрій із ключем)</tspan></text>
