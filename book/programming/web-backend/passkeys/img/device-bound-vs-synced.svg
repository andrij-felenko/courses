<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний ключ (Device-Bound) проти синхронізованого Passkey (Multi-Device)</text>
<rect x="110.9" y="40.0" width="318.2" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Апаратний ключ (Device-Bound / FIDO2)</tspan><tspan x="270.0" dy="16.9">Прив'язаний до одного фізичного чіпа</tspan></text>
<rect x="60.0" y="110.0" width="420.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Особливості архітектури:</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">• Закритий ключ створюється всередині апаратного чіпа</tspan><tspan x="270.0" dy="14.3">  (YubiKey, Nitrokey, апаратний модуль TPM)</tspan><tspan x="270.0" dy="14.3">• Ключ НЕМОЖЛИВО експортувати чи скопіювати з чіпа</tspan><tspan x="270.0" dy="14.3">• Прапорці BE = 0, BS = 0 (не підлягає резервуванню)</tspan><tspan x="270.0" dy="14.3">• signCount суворо зростає на кожному підписі</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">Перевага: максимальний рівень захисту від крадіжки</tspan><tspan x="270.0" dy="14.3">Ризик: втрата фізичного ключа вимагає резервного методу входу</tspan></text>
<rect x="141.7" y="376.4" width="256.5" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Підходить для: адмінів, інфраструктури,</tspan><tspan x="270.0" dy="14.3">високоризикових корпоративних акаунтів</tspan></text>
<rect x="554.8" y="40.0" width="350.5" height="49.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Синхронізований Passkey (Multi-Device)</tspan><tspan x="730.0" dy="16.9">Наскрізне шифрування через хмарний брелок</tspan></text>
<rect x="520.0" y="110.0" width="420.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Особливості архітектури:</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">• Закритий ключ зберігається в захищеному сховищі ОС</tspan><tspan x="730.0" dy="14.3">  (iCloud Keychain, Google Password Manager, 1Password)</tspan><tspan x="730.0" dy="14.3">• Синхронізується між пристроями з наскрізним шифруванням (E2EE)</tspan><tspan x="730.0" dy="14.3">• Прапорці BE = 1, BS = 1 (резервування увімкнено)</tspan><tspan x="730.0" dy="14.3">• signCount зазвичай = 0 (бо стан розходиться між гаджетами)</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">Перевага: користувач не втрачає доступ при зміні телефону</tspan><tspan x="730.0" dy="14.3">Ризик: безпека залежить від захисту головного хмарного акаунта</tspan></text>
<rect x="576.7" y="376.4" width="306.7" height="37.3" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Підходить для: масових користувацьких сервісів,</tspan><tspan x="730.0" dy="14.3">банкінгу, e-commerce, заміни паролів</tspan></text>
</svg>