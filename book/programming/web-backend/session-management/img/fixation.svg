<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фіксація сесії живе доти, доки номер переживає вхід</text>
<text x="70.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">без</tspan><tspan x="70.0" dy="15.6">ротації</tspan></text>
<rect x="140.0" y="126.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">зловмисник має</tspan><tspan x="240.0" dy="15.6">номер X (анонімний)</tspan></text>
<rect x="430.0" y="126.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">жертва входить,</tspan><tspan x="530.0" dy="15.6">номер лишається X</tspan></text>
<rect x="720.0" y="126.2" width="200.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">зловмисник</tspan><tspan x="820.0" dy="15.6">заходить як жертва</tspan></text>
<line x1="345.0" y1="150.0" x2="428.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="386.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">підсовує</text>
<line x1="635.0" y1="150.0" x2="718.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ вхід зламано</text>
<line x1="40.0" y1="240.0" x2="960.0" y2="240.0" stroke="#333333" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="70.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">з ротацією</tspan><tspan x="70.0" dy="15.6">на вході</tspan></text>
<rect x="140.0" y="314.0" width="200.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">жертва входить</tspan></text>
<rect x="430.0" y="306.2" width="200.0" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">у жертви — новий Y,</tspan><tspan x="530.0" dy="15.6">старий X мертвий</tspan></text>
<rect x="720.0" y="306.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">копія X у зловмисника</tspan><tspan x="820.0" dy="15.6">нічого не варта</tspan></text>
<line x1="345.0" y1="330.0" x2="428.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="386.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">X → Y</text>
<line x1="635.0" y1="330.0" x2="718.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ вхід захищено</text>
</svg>