<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація коду TOTP за RFC 6238: від часу до 6 цифр</text>
<rect x="91.9" y="58.4" width="136.3" height="63.2" rx="6" fill="#fef6e7" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Поточний час Unix</tspan><tspan x="160.0" dy="15.6">t = 1718928015 с</tspan><tspan x="160.0" dy="15.6">Крок X = 30 с</tspan></text>
<line x1="160.0" y1="130.0" x2="160.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="158.4" width="150.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Лічильник кроків</tspan><tspan x="160.0" dy="15.6">T = floor(t / 30)</tspan><tspan x="160.0" dy="15.6">8 байтів Big-Endian</tspan></text>
<rect x="74.8" y="273.4" width="170.5" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Спільний секрет K</tspan><tspan x="160.0" dy="15.6">(Base32 у сховищі)</tspan><tspan x="160.0" dy="15.6">20 байтів випадковості</tspan></text>
<rect x="344.9" y="207.6" width="250.3" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="470.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">HMAC-SHA-1(K, T)</tspan><tspan x="470.0" dy="16.9">Однобічний криптографічний хеш</tspan><tspan x="470.0" dy="16.9">Результат: 20 байтів відбитка</tspan></text>
<line x1="228.1" y1="190.0" x2="338.9" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="228.1" y1="305.0" x2="338.9" y2="265.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="637.8" y="88.6" width="304.4" height="82.8" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Динамічне усікання (Truncate)</tspan><tspan x="790.0" dy="15.6">1. offset = байт[19] &amp; 0x0F</tspan><tspan x="790.0" dy="15.6">2. беремо 4 байти з offset</tspan><tspan x="790.0" dy="15.6">3. скидаємо знаковий біт (P &amp; 0x7FFFFFFF)</tspan></text>
<line x1="595.1" y1="225.0" x2="631.8" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="790.0" y1="195.0" x2="790.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="688.2" y="241.7" width="203.6" height="96.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.0"/><text x="790.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Шестизначний код</tspan><tspan x="790.0" dy="18.2">Code = P mod 1 000 000</tspan><tspan x="790.0" dy="18.2">Результат: «482 910»</tspan><tspan x="790.0" dy="18.2">(діє рівно 30 секунд)</tspan></text>
</svg>