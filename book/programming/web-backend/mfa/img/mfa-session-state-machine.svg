<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів автентифікації на бекенді: розділення етапів входу</text>
<rect x="58.4" y="156.2" width="143.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Анонімний гість</tspan><tspan x="130.0" dy="15.6">(немає прав)</tspan></text>
<rect x="375.7" y="138.6" width="208.7" height="82.8" rx="6" fill="#fef6e7" stroke="#c0392b" stroke-width="1.5"/><text x="473.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="473.0" dy="0.0">2. Стан: mfa_pending</tspan><tspan x="473.0" dy="15.6">Тимчасовий жетон (TTL 5 хв)</tspan><tspan x="473.0" dy="15.6">Дозволено ТІЛЬКИ маршрут</tspan><tspan x="473.0" dy="15.6">POST /api/auth/mfa/verify</tspan></text>
<rect x="735.1" y="138.6" width="249.7" height="82.8" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.0"/><text x="860.0" y="172.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">3. Повна сесія користувача</tspan><tspan x="860.0" dy="15.6">Видано постійний Session ID / JWT</tspan><tspan x="860.0" dy="15.6">amr: [&quot;pwd&quot;, &quot;totp&quot;]</tspan><tspan x="860.0" dy="15.6">Повний доступ до системи</tspan></text>
<line x1="207.6" y1="180.0" x2="369.7" y2="180.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="285.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">POST /login
(логін + пароль OK)</text>
<line x1="590.3" y1="180.0" x2="729.1" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="670.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">POST /mfa/verify
(TOTP або WebAuthn OK)</text>
<line x1="480.0" y1="235.0" x2="480.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="186.7" y="291.5" width="586.6" height="27.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">3 невдалі спроби введення коду → тимчасове блокування (Rate Limit) + анулювання mfa_pending</tspan></text>
</svg>