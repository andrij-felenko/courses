<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Антипатерн спільного пароля проти моделі токенів OAuth 2.0</text>
<rect x="30.0" y="55.0" width="430.0" height="350.0" rx="12" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="245.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">АНТИПАТЕРН: ПЕРЕДАЧА ПАРОЛЯ</text>
<rect x="55.0" y="105.0" width="380.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="245.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Користувач віддає сторонній програмі</tspan><tspan x="245.0" dy="15.6">свій майстер-логін і пароль</tspan></text>
<line x1="245.0" y1="162.0" x2="245.0" y2="192.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="196.0" width="380.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="245.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Стороння програма зберігає пароль у себе</tspan><tspan x="245.0" dy="15.6">і звертається до сервера від імені власника</tspan></text>
<text x="245.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НАСЛІДКИ ТА ВРАЗЛИВОСТІ:</text>
<rect x="55.0" y="288.0" width="380.0" height="102.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/><text x="245.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">• Немає меж доступу: клієнт бачить і видаляє все</tspan><tspan x="245.0" dy="14.3">• Немає вибіркового відкликання: треба міняти пароль</tspan><tspan x="245.0" dy="14.3">• Витік у клієнта компрометує весь акаунт</tspan><tspan x="245.0" dy="14.3">• Привчає користувачів вводити паролі будь-де</tspan></text>
<rect x="500.0" y="55.0" width="430.0" height="350.0" rx="12" fill="#f2f8f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="715.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">OAUTH 2.0: ДЕЛЕГОВАНИЙ ДОСТУП</text>
<rect x="525.0" y="105.0" width="380.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="715.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Користувач логіниться ТІЛЬКИ на сервері авторизації</tspan><tspan x="715.0" dy="15.6">і дає згоду на конкретну дію (scope)</tspan></text>
<line x1="715.0" y1="162.0" x2="715.0" y2="192.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="525.0" y="196.0" width="380.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="715.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Клієнт отримує лише тимчасовий токен доступу;</tspan><tspan x="715.0" dy="15.6">пароль користувача йому не відкривається</tspan></text>
<text x="715.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАХИСНІ МЕХАНІЗМИ:</text>
<rect x="525.0" y="288.0" width="380.0" height="102.0" rx="6" fill="#f6fcf8" stroke="#27ae60" stroke-width="1.2"/><text x="715.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">• Суворі межі (scope): тільки дозволені операції</tspan><tspan x="715.0" dy="14.3">• Швидке точкове відкликання окремого токена</tspan><tspan x="715.0" dy="14.3">• Обмежений час дії токена (5-60 хвилин)</tspan><tspan x="715.0" dy="14.3">• Пароль залишається виключно у власника</tspan></text>
</svg>