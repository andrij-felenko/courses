<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл Access Token та ротація Refresh Token</text>
<rect x="30.0" y="60.0" width="420.0" height="160.0" rx="10" fill="#f2f8f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">АКТИВНИЙ ДОСТУП (Access Token)</text>
<rect x="50.0" y="102.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="240.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Access Token (дійсний 15 хв):</tspan><tspan x="240.0" dy="14.3">клієнт надсилає до Resource Server у кожному запиті</tspan></text>
<rect x="50.0" y="156.0" width="380.0" height="48.0" rx="6" fill="#f6fcf8" stroke="#27ae60" stroke-width="1.2"/><text x="240.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Через 15 хв токен стає недійсним (401 Expired);</tspan><tspan x="240.0" dy="14.3">витік небезпечний лише короткий час</tspan></text>
<line x1="240.0" y1="224.0" x2="240.0" y2="258.0" stroke="#b08900" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">POST /token { refresh_token }</text>
<rect x="30.0" y="265.0" width="420.0" height="145.0" rx="10" fill="#fffef5" stroke="#b08900" stroke-width="1.6"/>
<text x="240.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700">РОТАЦІЯ REFRESH TOKEN (Rotation)</text>
<rect x="50.0" y="308.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="240.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Сервер видає: новий Access Token + новий Refresh Token;</tspan><tspan x="240.0" dy="14.3">старий Refresh Token негайно інвалідується</tspan></text>
<rect x="50.0" y="360.0" width="380.0" height="38.0" rx="6" fill="#fffaf0" stroke="#b08900" stroke-width="1.2"/><text x="240.0" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Кожен токен оновлення строго одноразовий!</tspan></text>
<rect x="480.0" y="60.0" width="430.0" height="350.0" rx="12" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.7"/>
<text x="695.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ВИЯВЛЕННЯ ВИТОКУ (Reuse Detection)</text>
<rect x="505.0" y="110.0" width="380.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="695.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Сценарій: зловмисник викрав старий Refresh Token</tspan><tspan x="695.0" dy="15.0">і пробує використати його для отримання доступу</tspan></text>
<line x1="695.0" y1="172.0" x2="695.0" y2="202.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="206.0" width="380.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="695.0" y="230.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Сервер бачить запит з уже погашеним токеном:</tspan><tspan x="695.0" dy="15.0">це маркер компрометації ланцюжка сесії!</tspan></text>
<line x1="695.0" y1="268.0" x2="695.0" y2="298.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="302.0" width="380.0" height="88.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/><text x="695.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="695.0" dy="0.0">РЕАКЦІЯ БЕЗПЕКИ СЕРВЕРА:</tspan><tspan x="695.0" dy="14.3">• Негайно блокує всі токени цієї родини (family)</tspan><tspan x="695.0" dy="14.3">• Примусово розриває активну сесію</tspan><tspan x="695.0" dy="14.3">• Вимагає у користувача повну повторну автентифікацію</tspan></text>
</svg>