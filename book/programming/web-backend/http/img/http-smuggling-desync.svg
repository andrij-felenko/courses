<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розсинхронізація запитів (HTTP Request Smuggling: CL.TE)</text>
<rect x="20.0" y="56.0" width="260.0" height="400.0" rx="8" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">АТАКУВАЛЬНИЙ ПАКЕТ</text>
<rect x="30.0" y="96.0" width="240.0" height="340.0" rx="6" fill="#fdfbf0" stroke="#b08900" stroke-width="1.5"/><text x="150.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">POST / HTTP/1.1</tspan><tspan x="150.0" dy="13.7">Host: example.com</tspan><tspan x="150.0" dy="13.7">Content-Length: 13</tspan><tspan x="150.0" dy="13.7">Transfer-Encoding: chunked</tspan><tspan x="150.0" dy="13.7"></tspan><tspan x="150.0" dy="13.7">0</tspan><tspan x="150.0" dy="13.7"></tspan><tspan x="150.0" dy="13.7">GET /admin HTTP/1.1</tspan><tspan x="150.0" dy="13.7">Host: example.com</tspan><tspan x="150.0" dy="13.7">X-Injected: 1</tspan></text>
<rect x="300.0" y="56.0" width="310.0" height="185.0" rx="8" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.5"/>
<text x="455.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ФРОНТЕНД-ПРОКСІ (читає CL)</text>
<rect x="310.0" y="96.0" width="290.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Керується Content-Length: 13.</tspan><tspan x="455.0" dy="13.7">Бачить рівно 13 байтів тіла:</tspan><tspan x="455.0" dy="13.7">&quot;0\r\n\r\nGET /admin...&quot;</tspan><tspan x="455.0" dy="13.7">Пересилає весь блок бекенду як</tspan><tspan x="455.0" dy="13.7">один повний HTTP-запит #1.</tspan></text>
<rect x="300.0" y="270.0" width="310.0" height="185.0" rx="8" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.5"/>
<text x="455.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">БЕКЕНД-СЕРВЕР (читає TE)</text>
<rect x="310.0" y="310.0" width="290.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Керується Transfer-Encoding.</tspan><tspan x="455.0" dy="13.7">Бачить шматок довжиною 0</tspan><tspan x="455.0" dy="13.7">і вважає запит #1 завершеним.</tspan><tspan x="455.0" dy="13.7">Хвіст &quot;GET /admin...&quot; лишається</tspan><tspan x="455.0" dy="13.7">в сокеті як початок запиту #2!</tspan></text>
<line x1="280.0" y1="148.0" x2="300.0" y2="148.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="455.0" y1="241.0" x2="455.0" y2="270.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="630.0" y="56.0" width="310.0" height="400.0" rx="8" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="785.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НАСЛІДОК ДЛЯ ЖЕРТВИ</text>
<rect x="640.0" y="96.0" width="290.0" height="340.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="785.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">1. Наступний користувач надсилає:</tspan><tspan x="785.0" dy="13.7">   GET /index.html HTTP/1.1</tspan><tspan x="785.0" dy="13.7"></tspan><tspan x="785.0" dy="13.7">2. Бекенд склеює отруєний хвіст із</tspan><tspan x="785.0" dy="13.7">   новим запитом у цьому ж сокеті:</tspan><tspan x="785.0" dy="13.7">   GET /admin HTTP/1.1</tspan><tspan x="785.0" dy="13.7">   X-Injected: 1GET /index.html...</tspan><tspan x="785.0" dy="13.7"></tspan><tspan x="785.0" dy="13.7">3. Бекенд виконує /admin від імені</tspan><tspan x="785.0" dy="13.7">   або в сесії невинної жертви!</tspan><tspan x="785.0" dy="13.7"></tspan><tspan x="785.0" dy="13.7">Захист: суворо відхиляти (HTTP 400)</tspan><tspan x="785.0" dy="13.7">запити, що одночасно мають</tspan><tspan x="785.0" dy="13.7">і Content-Length, і Transfer-Encoding.</tspan></text>
</svg>