<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція транспорту: подолання блокування черги (Head-of-Line Blocking)</text>
<rect x="20.0" y="52.0" width="900.0" height="136.0" rx="8" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.5"/>
<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">HTTP/1.1 PIPELINING (1 TCP-з'єднання)</text>
<rect x="40.0" y="96.0" width="250.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Запити надсилаються пачкою:</tspan><tspan x="165.0" dy="13.7">Req 1 (важкий SQL)</tspan><tspan x="165.0" dy="13.7">Req 2 (стиль CSS)</tspan><tspan x="165.0" dy="13.7">Req 3 (логотип PNG)</tspan></text>
<line x1="300.0" y1="132.0" x2="350.0" y2="132.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="96.0" width="530.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="129.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">ВІДПОВІДІ СУВОРО ЗА ЧЕРГОЮ: Resp 1 (обробка 3 с) → Resp 2 (чекає!) → Resp 3 (чекає!)</tspan><tspan x="625.0" dy="11.7">Блокування початку черги на рівні HTTP: швидкі ресурси заблоковані важким запитом.</tspan></text>
<rect x="20.0" y="204.0" width="900.0" height="136.0" rx="8" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="40.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="700">HTTP/2 MULTIPLEXING (1 TCP-з'єднання, незалежні логічні потоки)</text>
<rect x="40.0" y="248.0" width="250.0" height="72.0" rx="6" fill="#fdfbf0" stroke="#b08900" stroke-width="1.5"/><text x="165.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Запити розбиваються на бінарні кадри:</tspan><tspan x="165.0" dy="13.7">Stream 1 (кадри даних)</tspan><tspan x="165.0" dy="13.7">Stream 2 (кадри даних)</tspan><tspan x="165.0" dy="13.7">Stream 3 (кадри даних)</tspan></text>
<line x1="300.0" y1="284.0" x2="350.0" y2="284.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="248.0" width="530.0" height="72.0" rx="6" fill="#fdfbf0" stroke="#b08900" stroke-width="1.5"/><text x="625.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">КАДРИ ЧЕРГУЮТЬСЯ В ОДНОМУ TCP-СОКЕТІ: [S2 Frame] [S3 Frame] [S1 Frame 1] [S2 Frame 2]...</tspan><tspan x="625.0" dy="13.0">HTTP HoL знято! Але втрата одного IP-пакета блокує весь TCP-буфер для ВСІХ потоків.</tspan></text>
<rect x="20.0" y="356.0" width="900.0" height="136.0" rx="8" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.5"/>
<text x="40.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">HTTP/3 QUIC (UDP-дейтаграми, фізично незалежні потоки)</text>
<rect x="40.0" y="400.0" width="250.0" height="72.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Потоки QUIC поверх UDP:</tspan><tspan x="165.0" dy="13.7">Потік A (незалежні пакети)</tspan><tspan x="165.0" dy="13.7">Потік B (незалежні пакети)</tspan><tspan x="165.0" dy="13.7">Потік C (незалежні пакети)</tspan></text>
<line x1="300.0" y1="436.0" x2="350.0" y2="436.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="400.0" width="530.0" height="72.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="433.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">ВТРАТА ПАКЕТА В ПОТОЦІ A НЕ ВПЛИВАЄ НА ПОТОКИ B І C:</tspan><tspan x="625.0" dy="11.7">Повна відсутність блокування черги як на рівні HTTP, так і на рівні транспорту + 0-RTT рукостискання.</tspan></text>
</svg>