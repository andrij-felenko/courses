<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пароль — один раз під час входу; жетон — на кожному запиті</text>
<rect x="130.0" y="48.5" width="140.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Клієнт</tspan></text>
<rect x="750.0" y="48.5" width="140.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Сервер</tspan></text>
<line x1="200.0" y1="100.0" x2="200.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="820.0" y1="100.0" x2="820.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="510.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">1. вхід: пароль (лише один раз)</text>
<line x1="200.0" y1="152.0" x2="820.0" y2="152.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">2. сервер видає жетон — випадковий секрет</text>
<line x1="820.0" y1="216.0" x2="200.0" y2="216.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3. далі КОЖЕН запит несе жетон замість пароля</text>
<line x1="200.0" y1="306.0" x2="820.0" y2="306.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="200.0" y1="350.0" x2="820.0" y2="350.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="200.0" y1="394.0" x2="820.0" y2="394.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="840.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">(повторюється</text>
<text x="840.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"> щоразу)</text>
