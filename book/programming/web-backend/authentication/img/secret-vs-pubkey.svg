<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вроджена вада пароля — спільний секрет; пара ключів прибирає саму спільність</text>
<line x1="560.0" y1="60.0" x2="560.0" y2="500.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="285.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Спільний секрет (пароль)</text>
<text x="840.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Пара ключів (passkey)</text>
<rect x="107.2" y="123.0" width="105.5" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">клієнт</tspan><tspan x="160.0" dy="16.9">знає пароль</tspan></text>
<rect x="353.5" y="123.0" width="112.9" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">сервер</tspan><tspan x="410.0" dy="16.9">зберігає хеш</tspan></text>
<text x="285.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">секрет тече дротом</text>
<line x1="218.8" y1="150.0" x2="347.5" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="90.0" cy="250.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="90.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="112.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">дротом — секрет можна перехопити</text>
<circle cx="90.0" cy="310.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="90.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="112.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">у базі — можна викрасти при зламі</text>
<circle cx="90.0" cy="370.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="90.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="112.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">фішинг — можна виманити в людини</text>
<rect x="659.8" y="114.6" width="120.3" height="70.8" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">пристрій</tspan><tspan x="720.0" dy="16.9">закритий ключ</tspan><tspan x="720.0" dy="16.9">(не виходить)</tspan></text>
<rect x="906.1" y="123.0" width="127.7" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">сервер</tspan><tspan x="970.0" dy="16.9">відкритий ключ</tspan></text>
<text x="845.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">дротом іде лише підпис</text>
<line x1="786.2" y1="150.0" x2="900.1" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="600.0" cy="250.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="622.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">дротом — нічого придатного до повтору</text>
<circle cx="600.0" cy="310.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="622.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">у базі — лише відкриті ключі, вони безпечні</text>
<circle cx="600.0" cy="370.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="622.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">фішинг — підпис прив'язаний до адреси сайту</text>
</svg>