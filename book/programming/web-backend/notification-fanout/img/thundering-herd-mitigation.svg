<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="45.0" width="385.0" height="395.0" rx="8" fill="#fff2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без захисту: Thundering Herd</text>
<rect x="86.9" y="96.3" width="250.3" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Миттєва розсилка на 10 млн юзерів</tspan><tspan x="212.0" dy="14.3">[t = 0 c: всі push надсилаються разом]</tspan></text>
<line x1="212.0" y1="150.0" x2="212.0" y2="195.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="212.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">10 млн екранів спалахують одночасно</text>
<rect x="102.5" y="211.3" width="218.9" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Масовий клік і відкриття додатка</tspan><tspan x="212.0" dy="14.3">[t = 2-5 c: 1 000 000 RPS до API]</tspan></text>
<line x1="212.0" y1="265.0" x2="212.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="212.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Перевантаження БД та бекендів</text>
<rect x="35.0" y="335.0" width="355.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="367.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Наслідок: Каскадна відмова (Cascading Failure).</tspan><tspan x="212.5" dy="14.3">БД падає під важкими SELECT-запитами стрічки,</tspan><tspan x="212.5" dy="14.3">черги забиваються, виникає відмова в обслуговуванні.</tspan></text>
<rect x="435.0" y="45.0" width="385.0" height="395.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="627.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Зі стійкою архітектурою Fanout</text>
<rect x="508.1" y="96.3" width="237.7" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Розмазування відправки з Jitter</tspan><tspan x="627.0" dy="14.3">[Розподіл розсилки у вікні 30-120 c]</tspan></text>
<line x1="627.0" y1="150.0" x2="627.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="627.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Згладжений потік доставлених push</text>
<rect x="527.0" y="211.3" width="200.1" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Самодостатній Payload у Push</tspan><tspan x="627.0" dy="14.3">+ CDN/Кеш на рівні API Gateway</tspan></text>
<line x1="627.0" y1="265.0" x2="627.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="627.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Кешовані відповіді, контрольований RPS</text>
<rect x="450.0" y="335.0" width="355.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.5" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Результат: Плавна робота системи.</tspan><tspan x="627.5" dy="14.3">Навантаження на API розтягнуте в часі,</tspan><tspan x="627.5" dy="14.3">трафік читання обслуговується з кешу,</tspan><tspan x="627.5" dy="14.3">провайдери не блокують за перевищення лімітів.</tspan></text>
</svg>