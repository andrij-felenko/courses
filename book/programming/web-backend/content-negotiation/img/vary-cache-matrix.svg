<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив заголовка Vary на формування ключів кеша</text>
<rect x="30.0" y="50.0" width="880.0" height="205.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
<text x="50.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">БЕЗ VARY: КЕШУВАННЯ ЗА ЄДИНИМ КЛЮЧЕМ URI (ОТРУЄННЯ КЕША)</text>
<rect x="50.0" y="95.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Клієнт A (UA, Brotli)</tspan><tspan x="135.0" dy="13.7">Accept-Lang: uk</tspan><tspan x="135.0" dy="13.7">Accept-Enc: br</tspan></text>
<line x1="225.0" y1="120.0" x2="360.0" y2="120.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="95.0" width="180.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Проміжний кеш CDN</tspan><tspan x="460.0" dy="14.3">Ключ: [GET /article]</tspan></text>
<line x1="555.0" y1="120.0" x2="690.0" y2="120.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="700.0" y="95.0" width="180.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Сервер джерела</tspan><tspan x="790.0" dy="14.3">Віддає: UK / Brotli</tspan><tspan x="790.0" dy="14.3">(забув Vary!)</tspan></text>
<rect x="50.0" y="160.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Клієнт B (EN, без br)</tspan><tspan x="135.0" dy="13.7">Accept-Lang: en</tspan><tspan x="135.0" dy="13.7">Accept-Enc: identity</tspan></text>
<line x1="225.0" y1="185.0" x2="360.0" y2="185.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="195.0" x2="225.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="160.0" width="430.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">ХИБНЕ ПОТРАПЛЯННЯ В КЕШ (CACHE POISONING):</tspan><tspan x="665.0" dy="13.7">Клієнту B віддано закешовані байти UK + Brotli!</tspan><tspan x="665.0" dy="13.7">Браузер показує сміття замість англійського тексту.</tspan></text>
<rect x="30.0" y="275.0" width="880.0" height="225.0" rx="8" fill="#f6ffed" stroke="#27ae60" stroke-width="1.6"/>
<text x="50.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">З VARY: СКЛАДЕНИЙ КЛЮЧ КЕША (ПОВНА ІЗОЛЯЦІЯ ВАРІАНТІВ)</text>
<rect x="50.0" y="325.0" width="180.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Клієнт A (UA, br)</tspan><tspan x="140.0" dy="13.7">Accept-Lang: uk</tspan><tspan x="140.0" dy="13.7">Accept-Enc: br</tspan></text>
<rect x="50.0" y="410.0" width="180.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Клієнт B (EN, gzip)</tspan><tspan x="140.0" dy="13.7">Accept-Lang: en</tspan><tspan x="140.0" dy="13.7">Accept-Enc: gzip</tspan></text>
<line x1="235.0" y1="355.0" x2="335.0" y2="355.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="235.0" y1="440.0" x2="335.0" y2="440.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="345.0" y="320.0" width="260.0" height="165.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="475.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Складені ключі кеша CDN:</text>
<rect x="355.0" y="355.0" width="240.0" height="55.0" rx="6" fill="#f4fcf6" stroke="#b7eb8f" stroke-width="1.5"/><text x="475.0" y="379.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Ключ 1: [/article | uk | br]</tspan><tspan x="475.0" dy="13.7">→ Закешовано відповідь A</tspan></text>
<rect x="355.0" y="420.0" width="240.0" height="55.0" rx="6" fill="#f4fcf6" stroke="#b7eb8f" stroke-width="1.5"/><text x="475.0" y="444.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Ключ 2: [/article | en | gzip]</tspan><tspan x="475.0" dy="13.7">→ Закешовано відповідь B</tspan></text>
<rect x="660.0" y="355.0" width="230.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Сервер додає заголовок:</tspan><tspan x="775.0" dy="14.3">Vary: Accept-Language,</tspan><tspan x="775.0" dy="14.3">      Accept-Encoding</tspan><tspan x="775.0" dy="14.3"></tspan><tspan x="775.0" dy="14.3">Кожен клієнт дістає свій</tspan><tspan x="775.0" dy="14.3">незалежний кеш-слот.</tspan></text>
<line x1="608.0" y1="385.0" x2="652.0" y2="385.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>