<text x="215.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вибірка з черги</text>
<text x="410.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTP 200 OK шлюзу</text>
<text x="615.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">DSN-вебхук / ACK</text>
<text x="810.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Піксель / Deep Link</text>
<line x1="40.0" y1="240.0" x2="960.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="80.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Гілки помилок, ретраїв та вичерпання терміну придатності</text>
<rect x="159.1" y="320.2" width="201.8" height="59.6" rx="6" fill="#fff8e6" stroke="#d48806" stroke-width="1.5"/><text x="260.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">FAILED_TRANSIENT</tspan><tspan x="260.0" dy="14.3">(Мережевий збій, 429 / 5xx)</tspan><tspan x="260.0" dy="14.3">Повтор через Backoff + Jitter</tspan></text>
<rect x="489.1" y="320.2" width="201.8" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">FAILED_PERMANENT</tspan><tspan x="590.0" dy="14.3">(410 Dead Token, Hard Bounce)</tspan><tspan x="590.0" dy="14.3">Запуск Fallback-каскаду</tspan></text>
<rect x="780.0" y="320.2" width="160.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">EXPIRED</tspan><tspan x="860.0" dy="14.3">(TTL вичерпано)</tspan><tspan x="860.0" dy="14.3">Скасування доставки</tspan></text>
<line x1="310.0" y1="173.8" x2="260.0" y2="320.2" stroke="#d48806" stroke-width="1.5" marker-end="url(#arrow)"/>
