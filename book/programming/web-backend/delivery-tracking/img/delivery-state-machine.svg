<text x="210.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d48806" text-anchor="middle" font-weight="700">Retry</text>
<line x1="510.0" y1="173.8" x2="564.8" y2="320.2" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Фатальна помилка</text>
<line x1="720.0" y1="173.8" x2="840.0" y2="320.2" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t &gt; created + TTL</text>
<rect x="70.0" y="442.4" width="860.0" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="461.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Правило монотонності: UPDATE notification SET status = :new WHERE id = :id AND status_rank(:new) &gt; status_rank(status);</tspan><tspan x="500.0" dy="14.3">Захищає стан від пізніх вебхуків (наприклад, DSN-підтвердження доставки прийшло після кліку користувача по лінку).</tspan></text>
</svg>