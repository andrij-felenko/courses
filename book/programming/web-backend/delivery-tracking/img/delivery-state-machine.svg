<rect x="424.8" y="126.2" width="170.5" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">SENT</tspan><tspan x="510.0" dy="15.6">(Шлюз прийняв, ранг 2)</tspan></text>
<rect x="610.8" y="126.2" width="218.4" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">DELIVERED</tspan><tspan x="720.0" dy="15.6">(Пристрій підтвердив, ранг 3)</tspan></text>
<rect x="801.1" y="126.2" width="197.8" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">OPENED</tspan><tspan x="900.0" dy="15.6">(Клік / Прочитано, ранг 4)</tspan></text>
