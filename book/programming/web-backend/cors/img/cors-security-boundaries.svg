<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпекові пастки CORS: облікові дані, дзеркалення Origin та кеш</text>
<rect x="40.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечний патерн: сліпе дзеркалення</text>
<rect x="60.0" y="102.0" width="380.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Вхідний запит від зловмисника:</tspan><tspan x="250.0" dy="13.0">Origin: https://evil-attacker.com</tspan><tspan x="250.0" dy="13.0">Cookie: session_id=secret123</tspan></text>
<rect x="60.0" y="192.0" width="380.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Вразлива конфігурація сервера:</tspan><tspan x="250.0" dy="13.0">ACAO: req.headers['Origin'] (динамічно)</tspan><tspan x="250.0" dy="13.0">Access-Control-Allow-Credentials: true</tspan></text>
<rect x="60.0" y="285.5" width="380.0" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Катастрофічний наслідок:</tspan><tspan x="250.0" dy="13.0">Будь-який сайт у світі може прочитати</tspan><tspan x="250.0" dy="13.0">персональні дані та приватні API жертви,</tspan><tspan x="250.0" dy="13.0">повністю обійшовши захист SOP!</tspan></text>
<text x="250.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сліпе копіювання Origin зводить безпеку нанівець</text>
<rect x="480.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечний патерн: білий список і Vary</text>
<rect x="500.0" y="102.0" width="380.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Сувора валідація білого списку (Whitelist):</tspan><tspan x="690.0" dy="13.0">origins = {'https://app.example.com', ...}</tspan><tspan x="690.0" dy="13.0">Перевірка точного збігу FQDN та схеми</tspan></text>
<rect x="500.0" y="192.0" width="380.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Заборона конфлікту * та Credentials:</tspan><tspan x="690.0" dy="13.0">Якщо потрібні Cookie/Auth-заголовки,</tspan><tspan x="690.0" dy="13.0">значення '*' суворо ЗАБОРОНЕНО специфікацією</tspan></text>
<rect x="500.0" y="285.5" width="380.0" height="69.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Захист кешу через заголовок Vary: Origin:</tspan><tspan x="690.0" dy="13.0">Запобігає отруєнню спільних CDN/проксі кешів,</tspan><tspan x="690.0" dy="13.0">де відповідь для сайту A могла б помилково</tspan><tspan x="690.0" dy="13.0">віддатися сайту B з чужим заголовком ACAO</tspan></text>
<text x="690.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Vary: Origin є обов'язковим при динамічному ACAO</text>
<text x="470.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">CORS — це не файрвол; заголовок Access-Control-Allow-Origin керує лише дозволом браузеру показати дані скрипту</text>
</svg>