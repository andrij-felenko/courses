<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ кеша: адреса плюс те, що назвав Vary</text>
<rect x="60.0" y="52.0" width="800.0" height="52.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">ключ  =  метод  +  повна адреса  +  значення заголовків, перелічених у Vary</tspan></text>
<rect x="60.0" y="138.0" width="250.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">GET /report</tspan><tspan x="185.0" dy="15.6">Vary: Accept-Encoding</tspan></text>
<rect x="400.0" y="130.0" width="440.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="620.0" dy="0.0">Accept-Encoding: gzip</tspan><tspan x="620.0" dy="15.6">тіло 42 КБ, стиснене</tspan></text>
<line x1="316.0" y1="166.0" x2="394.0" y2="161.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="208.0" width="440.0" height="62.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="620.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle"><tspan x="620.0" dy="0.0">Accept-Encoding відсутній</tspan><tspan x="620.0" dy="15.6">тіло 180 КБ, як є</tspan></text>
<line x1="316.0" y1="166.0" x2="394.0" y2="239.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два записи під однією адресою</text>
<rect x="24.0" y="300.0" width="872.0" height="146.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="44.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Пастка: відповідь залежить від заголовка, якого немає у Vary</text>
<text x="44.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сервер віддає різний вміст за X-Country, але пише лише Vary: Accept-Encoding</text>
<text x="44.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→ спільний кеш вважає обидві відповіді одним записом</text>
<text x="44.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→ наступний відвідувач дістає чужу країну, і це вже не помилка швидкості</text>
</svg>