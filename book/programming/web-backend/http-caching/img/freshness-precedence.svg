<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться freshness_lifetime</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">перший рядок, що справдився, дає відповідь — нижче вже не дивляться</text>
<rect x="36.0" y="78.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="271.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle"><tspan x="271.0" dy="0.0">s-maxage=N</tspan><tspan x="271.0" dy="16.2">тільки коли кеш СПІЛЬНИЙ</tspan></text>
<rect x="546.0" y="78.0" width="358.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">freshness_lifetime = N</tspan></text>
<line x1="512.0" y1="110.0" x2="540.0" y2="110.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="36.0" y="156.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="271.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="271.0" dy="0.0">max-age=N</tspan><tspan x="271.0" dy="16.2">будь-який кеш</tspan></text>
<rect x="546.0" y="156.0" width="358.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">freshness_lifetime = N</tspan></text>
<line x1="512.0" y1="188.0" x2="540.0" y2="188.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="36.0" y="234.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="271.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="271.0" dy="0.0">Expires: &lt;дата&gt;</tspan><tspan x="271.0" dy="16.2">читають, тільки якщо max-age немає</tspan></text>
<rect x="546.0" y="234.0" width="358.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">= Expires − Date</tspan></text>
<line x1="512.0" y1="266.0" x2="540.0" y2="266.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="36.0" y="312.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="271.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="271.0" dy="0.0">нічого з переліченого немає</tspan><tspan x="271.0" dy="16.2">евристична свіжість</tspan></text>
<rect x="546.0" y="312.0" width="358.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="348.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">≈ 10 % від (Date − Last-Modified)</tspan></text>
<line x1="512.0" y1="344.0" x2="540.0" y2="344.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24.0" y="404.0" width="892.0" height="132.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="44.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Свіжість — ще не дозвіл видати копію: запит уміє звузити результат</text>
<text x="44.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">min-fresh=N — копія має лишатися свіжою ще щонайменше N секунд</text>
<text x="44.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">max-age=N у ЗАПИТІ — вік копії має бути не більший за N</text>
<text x="44.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">max-stale=N — навпаки, приймаю прострочену на ≤ N с (без значення — на будь-скільки)</text>
</svg>