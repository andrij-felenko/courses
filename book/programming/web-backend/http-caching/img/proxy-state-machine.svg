<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 776" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="776" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машина станів кеша-посередника: три розвилки поспіль</text>
<rect x="20.0" y="50.0" width="940.0" height="176.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.4"/>
<text x="44.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1 · знайти запис</text>
<rect x="44.0" y="94.0" width="330.0" height="52.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="209.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="209.0" dy="0.0">первинний ключ = метод + URL</tspan></text>
<line x1="378.0" y1="120.0" x2="414.0" y2="120.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="418.0" y="94.0" width="520.0" height="52.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="678.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="678.0" dy="0.0">запису під ключем немає  →  повний запит до origin</tspan></text>
<rect x="44.0" y="152.0" width="330.0" height="52.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="209.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="209.0" dy="0.0">серед варіантів під ключем — відбір за Vary</tspan></text>
<line x1="378.0" y1="178.0" x2="414.0" y2="178.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="418.0" y="152.0" width="520.0" height="52.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="678.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="678.0" dy="0.0">жоден варіант не збігся  →  повний запит до origin</tspan></text>
<rect x="20.0" y="244.0" width="940.0" height="246.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.4"/>
<text x="44.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">2 · вирішити долю збереженого запису</text>
<rect x="44.0" y="290.0" width="390.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="239.0" y="314.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="239.0" dy="0.0">no-cache не стоїть</tspan><tspan x="239.0" dy="15.6">і current_age &lt; freshness_lifetime</tspan></text>
<line x1="438.0" y1="318.0" x2="470.0" y2="318.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="474.0" y="290.0" width="464.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="706.0" y="314.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">ВІДДАТИ зі сховища — мережі немає;</tspan><tspan x="706.0" dy="15.6">дописати Age: current_age</tspan></text>
<rect x="44.0" y="356.0" width="390.0" height="56.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="239.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle"><tspan x="239.0" dy="0.0">прострочена не більш ніж на</tspan><tspan x="239.0" dy="15.6">stale-while-revalidate</tspan></text>
<line x1="438.0" y1="384.0" x2="470.0" y2="384.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="474.0" y="356.0" width="464.0" height="56.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="706.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">ВІДДАТИ одразу,</tspan><tspan x="706.0" dy="15.6">а валідацію запустити у фоні</tspan></text>
<rect x="44.0" y="422.0" width="390.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="239.0" y="454.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="239.0" dy="0.0">решта випадків</tspan></text>
<line x1="438.0" y1="450.0" x2="470.0" y2="450.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="474.0" y="422.0" width="464.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="706.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">УМОВНИЙ ЗАПИТ до origin:</tspan><tspan x="706.0" dy="15.6">If-None-Match  ·  If-Modified-Since</tspan></text>
<rect x="20.0" y="508.0" width="940.0" height="246.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.4"/>
<text x="44.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">3 · що зробити з відповіддю origin на умовний запит</text>
<rect x="44.0" y="554.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="149.0" y="586.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="149.0" dy="0.0">304 Not Modified</tspan></text>
<line x1="258.0" y1="582.0" x2="286.0" y2="582.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="554.0" width="648.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="614.0" y="578.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="614.0" dy="0.0">вписати заголовки в запис, КРІМ Content-Length;</tspan><tspan x="614.0" dy="15.6">вік стартує з нуля — і віддати збережене тіло</tspan></text>
<rect x="44.0" y="620.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="149.0" y="652.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="149.0" dy="0.0">200 OK</tspan></text>
<line x1="258.0" y1="648.0" x2="286.0" y2="648.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="620.0" width="648.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="614.0" y="652.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="614.0" dy="0.0">замінити запис новим тілом і новими заголовками</tspan></text>
<rect x="44.0" y="686.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="149.0" y="718.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="149.0" dy="0.0">5xx або тиша</tspan></text>
<line x1="258.0" y1="714.0" x2="286.0" y2="714.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="686.0" width="648.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="614.0" y="710.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="614.0" dy="0.0">stale-if-error ще чинний → віддати стару копію;</tspan><tspan x="614.0" dy="15.6">інакше прокинути помилку — запис НЕ чіпати</tspan></text>
</svg>