<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема N+1 у резолверах і оптимізація через DataLoader</text>
<rect x="30.0" y="52.0" width="395.0" height="315.0" rx="8" fill="#fdfdfd" stroke="#333333" stroke-width="1.2"/>
<text x="227.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний підхід: N+1 окремих запитів</text>
<rect x="45.0" y="95.0" width="365.0" height="36.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.2"/>
<text x="227.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1 запит: SELECT * FROM posts LIMIT 10</text>
<text x="227.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Далі для кожного з 10 постів викликається Post.author:</text>
<rect x="45.0" y="160.0" width="365.0" height="26.0" rx="4" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.1"/>
<text x="227.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Запит #2: SELECT * FROM users WHERE id = 10</text>
<rect x="45.0" y="192.0" width="365.0" height="26.0" rx="4" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.1"/>
<text x="227.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Запит #3: SELECT * FROM users WHERE id = 11</text>
<rect x="45.0" y="224.0" width="365.0" height="26.0" rx="4" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.1"/>
<text x="227.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Запит #4: SELECT * FROM users WHERE id = 12</text>
<rect x="45.0" y="256.0" width="365.0" height="26.0" rx="4" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.1"/>
<text x="227.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Запит #5: SELECT * FROM users WHERE id = 13</text>
<text x="227.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">... ще 6 окремих SQL-запитів ...</text>
<rect x="45.0" y="315.0" width="365.0" height="40.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="227.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Разом: 1 + 10 = 11 запитів до БД (водоспад I/O)</text>
<rect x="455.0" y="52.0" width="395.0" height="315.0" rx="8" fill="#fdfdfd" stroke="#333333" stroke-width="1.2"/>
<text x="652.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З DataLoader: збирання ключів і батчинг</text>
<rect x="470.0" y="95.0" width="365.0" height="36.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.2"/>
<text x="652.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1 запит: SELECT * FROM posts LIMIT 10</text>
<rect x="470.0" y="145.0" width="365.0" height="80.0" rx="6" fill="#fef9e7" stroke="#b08900" stroke-width="1.2"/>
<text x="652.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">DataLoader (черга у мікротасці Event Loop):</text>
<text x="652.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">loader.load(10), loader.load(11), loader.load(12)...</text>
<text x="652.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">-&gt; Об'єднання ключів у множину: { 10, 11, 12, ... }</text>
<rect x="470.0" y="240.0" width="365.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="652.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2 батч-запит до бази даних:</text>
<text x="652.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">SELECT * FROM users WHERE id IN (10, 11, 12, ...)</text>
<rect x="470.0" y="315.0" width="365.0" height="40.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="652.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Разом: рівно 2 запити до БД + кеш у межах запиту</text>
</svg>