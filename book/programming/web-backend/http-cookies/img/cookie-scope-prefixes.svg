<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі видимості cookie та захист префіксами __Host- і __Secure-</text>
<rect x="40.0" y="65.0" width="420.0" height="280.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звичайні cookie: область дії Domain</text>
<rect x="55.0" y="108.2" width="390.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Без Domain (Host-Only):</tspan><tspan x="250.0" dy="14.3">Видно ТІЛЬКИ на example.com</tspan><tspan x="250.0" dy="14.3">(піддомени не мають доступу)</tspan></text>
<rect x="55.0" y="185.2" width="390.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">З Domain=example.com:</tspan><tspan x="250.0" dy="14.3">Видно на example.com ТА ВСІХ піддоменах</tspan><tspan x="250.0" dy="14.3">(api.example.com, blog.example.com)</tspan></text>
<text x="250.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека: зламаний піддомен може перетерти</text>
<text x="250.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">або нав'язати cookie для основного домену (cookie tossing)</text>
<rect x="480.0" y="65.0" width="420.0" height="280.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захищені префікси (RFC 6265bis)</text>
<rect x="495.0" y="110.2" width="390.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Префікс __Secure-name</tspan><tspan x="690.0" dy="14.3">1. Вимагає обов'язкового прапорця Secure</tspan><tspan x="690.0" dy="14.3">2. Приймається браузером ТІЛЬКИ через HTTPS</tspan></text>
<rect x="495.0" y="198.1" width="390.0" height="73.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Префікс __Host-name (найсуворіший захист)</tspan><tspan x="690.0" dy="14.3">1. Вимагає Secure + ТІЛЬКИ HTTPS</tspan><tspan x="690.0" dy="14.3">2. ЗАБОРОНЯЄ атрибут Domain (тільки Host-Only!)</tspan><tspan x="690.0" dy="14.3">3. Вимагає обов'язкового Path=/</tspan></text>
<text x="690.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Жоден піддомен не зможе підмінити чи прочитати __Host- cookie</text>
<text x="470.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Префікс __Host- гарантує, що cookie прив'язаний виключно до цього хоста та передається лише шифрованим каналом</text>
</svg>