<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмін HTTP-cookie: від заголовка відповіді до автоматичного повернення</text>
<rect x="40.0" y="70.0" width="260.0" height="310.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт (Браузер)</text>
<text x="170.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сховище cookie (Cookie Jar)</text>
<rect x="55.0" y="140.0" width="230.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="170.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис cookie:</text>
<text x="170.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ім'я: sid, Значення: k8d9...2a</text>
<text x="170.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Домен: example.com, Шлях: /</text>
<text x="170.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Secure, HttpOnly, SameSite=Lax</text>
<rect x="55.0" y="270.2" width="230.0" height="59.6" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="170.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Перевіряє атрибути перед</tspan><tspan x="170.0" dy="14.3">кожним запитом і додає</tspan><tspan x="170.0" dy="14.3">лише ім'я та значення</tspan></text>
<rect x="640.0" y="70.0" width="260.0" height="310.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="770.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер (example.com)</text>
<text x="770.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обробник запитів і сесій</text>
<rect x="655.0" y="140.0" width="230.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="770.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Автентифікація успішна</text>
<text x="770.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Генерує sid = k8d9...2a</text>
<text x="770.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Формує директиви захисту</text>
<rect x="655.0" y="270.2" width="230.0" height="59.6" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="770.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Отримує лише sid=k8d9...2a;</tspan><tspan x="770.0" dy="14.3">атрибути браузер назад</tspan><tspan x="770.0" dy="14.3">ніколи не відсилає</tspan></text>
<line x1="300.0" y1="105.0" x2="640.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1. POST /login (пароль або токен)</text>
<line x1="640.0" y1="160.0" x2="300.0" y2="160.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. 200 OK + Set-Cookie: sid=k8d9...; Secure; HttpOnly; SameSite=Lax</text>
<line x1="300.0" y1="255.0" x2="640.0" y2="255.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. GET /profile + Cookie: sid=k8d9...2a (автоматично)</text>
<line x1="640.0" y1="340.0" x2="300.0" y2="340.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4. 200 OK (дані профілю для користувача із сесії sid)</text>
<text x="470.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Асиметрія: сервер задає всі атрибути, але браузер повертає тільки рядок «ім'я=значення»</text>
</svg>