<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 664" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="664" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири покоління однієї ідеї: що кожне додало до черги</text>
<text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Епоха</text>
<text x="530.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чим ставили задачу</text>
<text x="990.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ця епоха додала</text>
<line x1="35.0" y1="106.0" x2="1200.0" y2="106.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="35.0" y="158.2" width="250.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Мейнфрейм</tspan><tspan x="160.0" dy="15.6">1956 → 1970-ті</tspan></text>
<rect x="315.0" y="151.3" width="430.0" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">колода карток і оператор</tspan><tspan x="530.0" dy="15.0">GM-NAA I/O (1956) · JCL (1965)</tspan><tspan x="530.0" dy="15.0">спулінг · HASP (1967)</tspan></text>
<rect x="780.0" y="151.3" width="420.0" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">приймання окремо від виконання</tspan><tspan x="990.0" dy="15.0">задача як довговічний предмет</tspan><tspan x="990.0" dy="15.0">пріоритет і черговість</tspan></text>
<rect x="35.0" y="288.2" width="250.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Unix</tspan><tspan x="160.0" dy="15.6">1976 → 1987</tspan></text>
<rect x="315.0" y="281.3" width="430.0" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">uucp-спул (1976)</tspan><tspan x="530.0" dy="15.0">cron у V7 (1979) · at</tspan><tspan x="530.0" dy="15.0">Vixie cron (1987)</tspan></text>
<rect x="780.0" y="281.3" width="420.0" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">повтор після невдачі</tspan><tspan x="990.0" dy="15.0">відкладення в часі</tspan><tspan x="990.0" dy="15.0">виконавець-демон без людини</tspan></text>
<rect x="35.0" y="418.2" width="250.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="438.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Корпоративні брокери</tspan><tspan x="160.0" dy="15.6">1993 → 2008</tspan></text>
<rect x="315.0" y="411.3" width="430.0" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">IBM MQSeries (1993) · MSMQ (1997)</tspan><tspan x="530.0" dy="15.0">JMS (1998) як спільний API</tspan><tspan x="530.0" dy="15.0">AMQP (2003→2006) · RabbitMQ (2007)</tspan></text>
<rect x="780.0" y="411.3" width="420.0" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">підтвердження і повторна доставка</tspan><tspan x="990.0" dy="15.0">мертва черга</tspan><tspan x="990.0" dy="15.0">транзакційна постановка</tspan></text>
<rect x="35.0" y="548.2" width="250.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="568.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Веб-черги задач</tspan><tspan x="160.0" dy="15.6">2004 → 2012</tspan></text>
<rect x="315.0" y="541.3" width="430.0" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="561.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Amazon SQS (2004→2006) · Gearman (2005)</tspan><tspan x="530.0" dy="15.0">beanstalkd (2007) · delayed_job (2008)</tspan><tspan x="530.0" dy="15.0">Resque (2009) · Celery (2009) · Sidekiq (2012)</tspan></text>
<rect x="780.0" y="541.3" width="420.0" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="561.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">черга в тій самій базі</tspan><tspan x="990.0" dy="15.0">видимість: панель, невдалі задачі</tspan><tspan x="990.0" dy="15.0">бібліотека замість інфраструктури</tspan></text>
<text x="620.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">спільне для всіх чотирьох: прийняти швидко → записати надійно → відповісти → виконати осторонь</text>
</svg>