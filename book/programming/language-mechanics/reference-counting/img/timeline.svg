<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 794" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="794" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне число крізь шість десятиліть</text>
<line x1="232.0" y1="79.0" x2="232.0" y2="761.0" stroke="#6b7280" stroke-width="2.2"/>
<text x="180.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1960</text>
<circle cx="232.0" cy="105.0" r="8.0" fill="#f1f3f5" stroke="#6b7280" stroke-width="2.6"/>
<rect x="268.0" y="78.0" width="640.0" height="54.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.7"/><text x="588.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Джон Маккарті: LISP і трасувальний збирач (mark-sweep) —</tspan><tspan x="588.0" dy="18.2">суперник підрахунку, що лишиться поруч назавжди</tspan></text>
<text x="180.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">груд. 1960</text>
<circle cx="232.0" cy="175.0" r="8.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.6"/>
<rect x="268.0" y="148.0" width="640.0" height="54.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="588.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Джордж Коллінз, CACM: перший опис підрахунку —</tspan><tspan x="588.0" dy="18.2">лічильник, щоб безпечно стирати спільні списки</tspan></text>
<text x="180.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1963</text>
<circle cx="232.0" cy="245.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<rect x="268.0" y="218.0" width="640.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="588.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Дж. Макбет: підрахунок не бачить циклів —</tspan><tspan x="588.0" dy="18.2">сліпу пляму помічено вже за три роки</tspan></text>
<text x="180.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1990</text>
<circle cx="232.0" cy="315.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<rect x="268.0" y="288.0" width="640.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="588.0" y="310.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Мартінес · Ваченчаузер · Лінс:</tspan><tspan x="588.0" dy="18.2">перший загальний збирач циклів для підрахунку</tspan></text>
<text x="180.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1993</text>
<circle cx="232.0" cy="385.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<rect x="268.0" y="358.0" width="640.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="588.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Microsoft COM: IUnknown.AddRef / Release —</tspan><tspan x="588.0" dy="18.2">облік клієнтів через межі мов і процесів</tspan></text>
<text x="180.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1994</text>
<circle cx="232.0" cy="455.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<rect x="268.0" y="428.0" width="640.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="588.0" y="450.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">OpenStep (NeXTSTEP): retain / release / autorelease —</tspan><tspan x="588.0" dy="18.2">ручний облік; звідси й самі назви операцій</tspan></text>
<text x="180.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">жовт. 2000</text>
<circle cx="232.0" cy="525.0" r="8.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.6"/>
<rect x="268.0" y="498.0" width="640.0" height="54.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="588.0" y="520.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Python 2.0: до підрахунку (ob_refcnt) додано</tspan><tspan x="588.0" dy="18.2">окремий збирач циклів — гібрид у мейнстрімі</tspan></text>
<text x="180.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2007 → 2011</text>
<circle cx="232.0" cy="595.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<rect x="268.0" y="568.0" width="640.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="588.0" y="590.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">C++: shared_ptr з Boost → звіт TR1 → стандарт C++11</tspan><tspan x="588.0" dy="18.2">(сильні й слабкі посилання, керівний блок)</tspan></text>
<text x="180.0" y="670.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2011</text>
<circle cx="232.0" cy="665.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<rect x="268.0" y="638.0" width="640.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="588.0" y="660.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Objective-C ARC: компілятор Clang сам розставляє</tspan><tspan x="588.0" dy="18.2">retain / release; згодом — основа пам'яті Swift</tspan></text>
<text x="180.0" y="740.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">Rust</text>
<circle cx="232.0" cy="735.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<rect x="268.0" y="708.0" width="640.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="588.0" y="730.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Rc і Arc: ціну атомарного лічильника винесено</tspan><tspan x="588.0" dy="18.2">прямо в тип, і компілятор її пильнує</tspan></text>
</svg>