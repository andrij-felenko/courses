<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сильні тримають об'єкт, слабкі тільки спостерігають</text>
<rect x="50.0" y="72.0" width="150.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="125.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">shared_ptr</tspan></text>
<rect x="50.0" y="272.0" width="150.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="125.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">weak_ptr</tspan></text>
<rect x="330.0" y="135.0" width="200.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="430.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">керівний блок</tspan><tspan x="430.0" dy="19.5"></tspan><tspan x="430.0" dy="19.5">сильних: 1</tspan><tspan x="430.0" dy="19.5">слабких: 1</tspan></text>
<rect x="640.0" y="55.0" width="170.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="725.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">керований</tspan><tspan x="725.0" dy="19.5">об'єкт</tspan></text>
<line x1="200.0" y1="100.0" x2="330.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="200.0" y1="300.0" x2="330.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">не тримає життя</text>
<line x1="530.0" y1="175.0" x2="640.0" y2="100.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="585.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">власність</text>
<rect x="50.0" y="350.0" width="360.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="230.0" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">сильних = 0  →  звільнити ОБ'ЄКТ</tspan></text>
<rect x="440.0" y="350.0" width="380.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="630.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">сильних = 0 і слабких = 0  →  звільнити БЛОК</tspan></text>
