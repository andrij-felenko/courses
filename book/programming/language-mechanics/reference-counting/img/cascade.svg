<text x="430.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">Один release на A запускає release на всьому, що A тримав,</tspan><tspan x="430.0" dy="18.2">а звільнення C — ще один на D: три звільнення однією хвилею.</tspan></text>
