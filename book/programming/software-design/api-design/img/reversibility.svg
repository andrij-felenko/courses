<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незворотність = коли N поза твоїм контролем</text>
<rect x="60.0" y="70.0" width="350.0" height="280.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="235.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">N мале й відоме (твій контроль)</text>
<text x="235.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">внутрішнє API — кличуть із твого ж репозиторію</text>
<rect x="90.0" y="145.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="235.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">усі N викликів перелічені:</tspan><tspan x="235.0" dy="15.0">grep знаходить кожен</tspan></text>
<rect x="90.0" y="200.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="235.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">полагодив усі → зламаного не лишилось</tspan></text>
<text x="235.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">C = N · c скінченна й оплатна</text>
<text x="235.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">двобічні двері — зміну можна відкотити</text>
<text x="235.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">рішення ЗВОРОТНЕ</text>
<rect x="450.0" y="70.0" width="350.0" height="280.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="625.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">N поза контролем (не твоє)</text>
<text x="625.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">публічна бібліотека — тебе взяли тисячі незнайомців</text>
<rect x="480.0" y="145.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="625.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">N невідоме й росте: багатьох викликів</tspan><tspan x="625.0" dy="15.0">ти навіть не бачиш</tspan></text>
<rect x="480.0" y="200.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="625.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">полагодити чужі рядки ти не можеш —</tspan><tspan x="625.0" dy="15.0">вони не в твоєму дереві</tspan></text>
<text x="625.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C = N · c — рахунок лягає на чужих</text>
<text x="625.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">однобічні двері — назад ходу немає</text>
<text x="625.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">рішення НЕЗВОРОТНЕ</text>
<text x="430.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Технічно файл однаково легко змінити з обох боків; різниця лише в тому, ХТО володіє множиною N.</text>
</svg>