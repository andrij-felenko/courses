<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія: додати до API легко, забрати — майже неможливо</text>
<rect x="70.0" y="70.0" width="320.0" height="210.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="230.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ДОДАТИ метод / поле</text>
<text x="230.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">двобічні двері</text>
<line x1="150.0" y1="165.0" x2="310.0" y2="165.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="310.0" y1="200.0" x2="150.0" y2="200.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">старий код працює як був,</text>
<text x="230.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">новий отримує більше</text>
<rect x="430.0" y="70.0" width="320.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="590.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАБРАТИ / ЗМІНИТИ зміст</text>
<text x="590.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">однобічні двері</text>
<line x1="510.0" y1="175.0" x2="670.0" y2="175.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="590.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кожен, хто це кличе,</text>
<text x="590.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ламається — і мовчки, і гучно</text>
<text x="590.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">назад ходу немає</text>
<text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тому «коли вагаєшся — не додавай»: невключене додаси потім, зайве вже не прибереш.</text>
</svg>