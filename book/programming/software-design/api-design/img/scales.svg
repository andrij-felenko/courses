<text x="430.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ширша аудиторія межі, то дорожча зміна: аргумент правиш за хвилину,</text>
