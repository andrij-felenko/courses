<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стрілка залежності — тільки ВНИЗ</text>
<rect x="150.0" y="92.0" width="380.0" height="78.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="170.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Представлення</text>
<text x="170.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">UI, HTTP, CLI — як говоримо зі світом</text>
<rect x="150.0" y="196.0" width="380.0" height="78.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="170.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Застосунок</text>
<text x="170.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">сценарії: що по кроках робить система</text>
<rect x="150.0" y="300.0" width="380.0" height="78.0" rx="9" fill="#fff6e6" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="170.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Домен</text>
<text x="170.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">правила предметної області — серце</text>
<rect x="150.0" y="404.0" width="380.0" height="78.0" rx="9" fill="#f2f2f5" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="170.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Інфраструктура</text>
<text x="170.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">БД, мережа, файли, чужі сервіси</text>
<line x1="116.0" y1="162.0" x2="116.0" y2="204.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="116.0" y1="266.0" x2="116.0" y2="308.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="116.0" y1="370.0" x2="116.0" y2="412.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="96.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">можна</text>
<line x1="564.0" y1="412.0" x2="564.0" y2="162.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="548.0" y1="299.0" x2="580.0" y2="275.0" stroke="#c0392b" stroke-width="3.2"/>
<text x="586.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">не</text>
<text x="586.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">можна</text>
<rect x="182.5" y="502.2" width="454.9" height="51.6" rx="6" fill="#ffffff" stroke="#d0d5db" stroke-width="1.4"/><text x="410.0" y="524.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Нижнє нічого не знає про верхнє — тому його можна замінити,</tspan><tspan x="410.0" dy="15.6">не чіпаючи домен. Верхнє гукає нижнє лише через його інтерфейс.</tspan></text>
</svg>