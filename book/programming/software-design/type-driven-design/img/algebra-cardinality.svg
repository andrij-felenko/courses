<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки значень уміщає тип: три дії алгебри</text>
<rect x="90.0" y="66.0" width="620.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="400.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">СУМА (АБО):   |A + B|  =  |A| + |B|</tspan><tspan x="400.0" dy="19.5">Option⟨uint8⟩ = 1 + 256 = 257 значень</tspan></text>
<rect x="90.0" y="162.0" width="620.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="400.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ДОБУТОК (І):   |A × B|  =  |A| · |B|</tspan><tspan x="400.0" dy="19.5">(bool, uint8) = 2 · 256 = 512 значень</tspan></text>
<rect x="90.0" y="258.0" width="620.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="400.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ФУНКЦІЯ (→):   |A → B|  =  |B| ^ |A|</tspan><tspan x="400.0" dy="19.5">bool → bool = 2² = 4 функції</tspan></text>
<text x="400.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Додавання не дає перехресних членів. Множення дає — і кожен зайвий перехресний є незаконний стан.</text>
</svg>