<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лаг проєкції: що бачить користувач після своєї дії</text>
<line x1="90.0" y1="150.0" x2="950.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="948.0" y1="150.0" x2="954.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="950.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<circle cx="200.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="470.0" cy="150.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="740.0" cy="150.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">команда змінила стан</text>
<text x="200.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у сховищі запису</text>
<text x="470.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">сторінка перечитує</text>
<text x="470.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зі сховища читання</text>
<text x="740.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">проєкція оновила знімок</text>
<text x="740.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">боки зійшлися</text>
<line x1="200.0" y1="120.0" x2="200.0" y2="142.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="740.0" y1="120.0" x2="740.0" y2="142.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="200.0" y1="126.0" x2="740.0" y2="126.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="470.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ЛАГ · тут читання показує стару правду</text>
<rect x="60.0" y="268.4" width="280.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1 · читати з боку запису</tspan><tspan x="200.0" dy="15.6">на цьому екрані —</tspan><tspan x="200.0" dy="15.6">свіжо, але повільно</tspan></text>
<rect x="380.0" y="268.4" width="280.0" height="63.2" rx="6" fill="#fdf6ec" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">2 · показати «застосовується»</tspan><tspan x="520.0" dy="15.6">чесно попередити,</tspan><tspan x="520.0" dy="15.6">оновити за мить</tspan></text>
<rect x="700.0" y="268.4" width="280.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="840.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">3 · домалювати наперед</tspan><tspan x="840.0" dy="15.6">показати свій намір,</tspan><tspan x="840.0" dy="15.6">поки знімок доганяє</tspan></text>
<text x="520.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">лаг не зникає — його ховають від очей або обходять там, де нестерпний</text>
<text x="520.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">питання-запобіжник: чи витримає користувач, що прочитане мить відстає від записаного?</text>
</svg>