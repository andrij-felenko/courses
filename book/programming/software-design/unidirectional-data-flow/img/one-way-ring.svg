<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="75.0" y="84.4" width="230.0" height="71.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/><text x="190.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Стан</tspan><tspan x="190.0" dy="22.1">одна правда</tspan></text>
<rect x="695.0" y="85.6" width="230.0" height="68.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="810.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Подання</tspan><tspan x="810.0" dy="20.8">картинка = f(стан)</tspan></text>
<rect x="695.0" y="365.6" width="230.0" height="68.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="810.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Дія</tspan><tspan x="810.0" dy="20.8">що саме сталося</tspan></text>
<rect x="75.0" y="365.6" width="230.0" height="68.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="190.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Перехід</tspan><tspan x="190.0" dy="20.8">(стан, дія) → стан</tspan></text>
<line x1="315.0" y1="120.0" x2="685.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">читає</text>
<line x1="810.0" y1="168.0" x2="810.0" y2="352.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="838.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">людина натиснула</text>
<line x1="685.0" y1="400.0" x2="315.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">у чергу дій</text>
<line x1="190.0" y1="352.0" x2="190.0" y2="172.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="162.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">новий стан</text>
<text x="500.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">кільце замкнене — програма ж інтерактивна.</tspan><tspan x="500.0" dy="22.5">Але право змінити стан має рівно одна стрілка.</tspan></text>
<rect x="310.0" y="529.9" width="380.0" height="60.2" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.6"/><text x="500.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Оболонка: мережа, диск, годинник</tspan><tspan x="500.0" dy="18.2">результат повертається новою дією</tspan></text>
<line x1="190.0" y1="448.0" x2="330.0" y2="536.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="670.0" y1="536.0" x2="810.0" y2="448.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>