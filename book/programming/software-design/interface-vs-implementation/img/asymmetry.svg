<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія рішення: над нею платиш за зміну, під нею — ні</text>
<line x1="70.0" y1="232.0" x2="290.4" y2="232.0" stroke="#1a1a1a" stroke-width="3.0"/>
<line x1="609.6" y1="232.0" x2="830.0" y2="232.0" stroke="#1a1a1a" stroke-width="3.0"/>
<rect x="294.4" y="217.0" width="311.1" height="30.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="450.0" y="236.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">  контракт: інтерфейс — обіцянка  </tspan></text>
<text x="450.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">НАД лінією — ті, хто викликає: прив'язані до обіцянки</text>
<rect x="70.0" y="68.0" width="150.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="145.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">звіт</text>
<line x1="145.0" y1="196.0" x2="145.0" y2="212.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="273.3" y="68.0" width="150.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="348.3" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">форма</text>
<line x1="348.3" y1="196.0" x2="348.3" y2="212.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="476.7" y="68.0" width="150.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="551.7" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">журнал</text>
<line x1="551.7" y1="196.0" x2="551.7" y2="212.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="680.0" y="68.0" width="150.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="755.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тест</text>
<line x1="755.0" y1="196.0" x2="755.0" y2="212.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="450.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">зміниш обіцянку — усі вони ламаються</text>
<text x="450.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПІД лінією — як саме зроблено: вільно переписати будь-коли</text>
<rect x="70.0" y="300.0" width="150.0" height="50.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="145.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер і кеш</text>
<rect x="273.3" y="300.0" width="150.0" height="50.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="348.3" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">структури даних</text>
<rect x="476.7" y="300.0" width="150.0" height="50.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="551.7" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">алгоритм</text>
<rect x="680.0" y="300.0" width="150.0" height="50.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="755.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">блокування</text>
<text x="450.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">переписуй нутрощі — над лінією ніхто не помітить</text>
</svg>