<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна обіцянка, різні нутрощі: реалізацію підставляють ззовні</text>
<rect x="300.0" y="60.0" width="300.0" height="58.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="450.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">клієнт</text>
<text x="450.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знає лише інтерфейс SensorReader</text>
<rect x="300.0" y="166.0" width="300.0" height="46.0" rx="8" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="450.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">float read()  ·  bool ok()</text>
<text x="450.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">єдина обіцянка — те, що видно</text>
<line x1="450.0" y1="120.0" x2="450.0" y2="162.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="49.0" y="320.0" width="250.0" height="96.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="174.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">FakeSensor</text>
<text x="174.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повертає стале число</text>
<text x="174.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">для тесту — без заліза</text>
<line x1="450.0" y1="212.0" x2="174.0" y2="320.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="325.0" y="320.0" width="250.0" height="96.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="450.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">I2cSensor</text>
<text x="450.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">читає регістр по шині I2C</text>
<text x="450.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">реальний давач</text>
<line x1="450.0" y1="212.0" x2="450.0" y2="320.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="601.0" y="320.0" width="250.0" height="96.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="726.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">FileSensor</text>
<text x="726.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">бере рядок із файлу</text>
<text x="726.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">відтворення запису</text>
<line x1="450.0" y1="212.0" x2="726.0" y2="320.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="450.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">підміна реалізації внизу не чіпає клієнта вгорі — обіцянка та сама</text>
</svg>