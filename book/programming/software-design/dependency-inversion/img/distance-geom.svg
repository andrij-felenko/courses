<text x="360.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряма стоїть під 45°, тому перпендикуляр коротший за вертикальний розрив рівно в √2.</text>
<text x="360.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Мартін відкидає √2 і бере нормовану D = |A+I−1| ∈ [0,1].</text>
