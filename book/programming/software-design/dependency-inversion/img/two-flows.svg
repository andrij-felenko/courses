<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стрілки на одній межі: керування вниз, залежність — угору</text>
<rect x="115.0" y="272.1" width="200.0" height="55.9" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.9"/><text x="215.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Політика</tspan><tspan x="215.0" dy="16.9">(високий рівень)</tspan></text>
<rect x="395.0" y="272.1" width="250.0" height="55.9" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.2"/><text x="520.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Порт (інтерфейс)</tspan><tspan x="520.0" dy="16.9">мовою політики</tspan></text>
<rect x="715.0" y="272.1" width="220.0" height="55.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="825.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Адаптер</tspan><tspan x="825.0" dy="16.9">(база / мережа / SDK)</tspan></text>
<line x1="321.0" y1="300.0" x2="389.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="709.0" y1="300.0" x2="651.0" y2="300.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="355.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">залежить від</text>
<text x="680.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">реалізує</text>
<line x1="215.0" y1="266.1" x2="215.0" y2="178.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="6,5"/>
<line x1="215.0" y1="178.0" x2="825.0" y2="178.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="6,5"/>
<line x1="825.0" y1="178.0" x2="825.0" y2="266.1" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="520.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">керування у рантаймі: політика гукає адаптер</text>
<text x="520.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна межа — два зустрічні потоки.</text>
<text x="520.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Керування тече праворуч (у деталь), а залежність коду — ліворуч (у порт).</text>
<text x="520.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Тому деталь замінна, а політика про заміну й не знає.</text>
</svg>