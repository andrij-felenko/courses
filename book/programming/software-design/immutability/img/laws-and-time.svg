<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівність за вмістом як відношення еквівалентності — і як час її ламає</text>
<line x1="40.0" y1="332.0" x2="860.0" y2="332.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="450.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заморожений момент: три закони тримаються</text>
<rect x="40.0" y="88.0" width="260.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">РЕФЛЕКСИВНІСТЬ</tspan><tspan x="170.0" dy="18.2">a = a</tspan><tspan x="170.0" dy="18.2">кожне дорівнює собі</tspan></text>
<rect x="320.0" y="88.0" width="260.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">СИМЕТРІЯ</tspan><tspan x="450.0" dy="18.2">a = b ⇒ b = a</tspan><tspan x="450.0" dy="18.2">порядок не важить</tspan></text>
<rect x="600.0" y="88.0" width="260.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">ТРАНЗИТИВНІСТЬ</tspan><tspan x="730.0" dy="18.2">a = b, b = c ⇒ a = c</tspan></text>
<text x="450.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">разом ⇒ рівність чисто розбиває множину на класи (усе в класі взаємозамінне):</text>
<rect x="300.0" y="232.0" width="300.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<circle cx="360.0" cy="265.0" r="24.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">100₴</text>
<circle cx="450.0" cy="265.0" r="24.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="450.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">50₴</text>
<circle cx="540.0" cy="265.0" r="24.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="540.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3€</text>
<text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">класи не перетинаються й покривають усе</text>
<text x="450.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зміна на місці: той самий об'єкт у різних класах у різні моменти</text>
<rect x="70.0" y="400.0" width="300.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">МОМЕНТ t₁</tspan><tspan x="220.0" dy="16.9">об'єкт a у класі {«cola»}</tspan><tspan x="220.0" dy="16.9">рівний усім іншим «cola»</tspan></text>
<rect x="530.0" y="400.0" width="300.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">МОМЕНТ t₂ (після мутації)</tspan><tspan x="680.0" dy="16.9">той самий a у класі {«beer»}</tspan><tspan x="680.0" dy="16.9">уже НЕ рівний «cola»</tspan></text>
<line x1="370.0" y1="460.0" x2="530.0" y2="460.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="450.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мутація на місці</text>
<text x="450.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Клас об’єкта a у t₁ і у t₂ — різні; рівність за змінним вмістом у часі не одне</text>
<text x="450.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">відношення, а щомиті інше. Кожен закон читається у ДВА моменти — і ламається.</text>
</svg>