<text x="895.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<text x="490.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">стару версію звільняють лише коли її вже не тримає жоден ДОЧАСНИЙ читач;</tspan><tspan x="490.0" dy="15.6">новий читач r3 бачить одразу нову версію. GC чи лічильник роблять це відкладення за нас.</tspan></text>
