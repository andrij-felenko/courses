<line x1="430.0" y1="130.0" x2="430.0" y2="430.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,5"/>
<text x="442.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">публікація vN+1</text>
<line x1="660.0" y1="300.0" x2="660.0" y2="430.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="6,5"/>
<text x="672.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">звільнити стару vN — безпечно</text>
