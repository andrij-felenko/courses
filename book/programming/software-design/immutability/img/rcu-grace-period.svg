<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">RCU: відкладене вивільнення старої версії</text>
<rect x="150.0" y="139.0" width="370.0" height="22.0" rx="8" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="138.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">r1</text>
