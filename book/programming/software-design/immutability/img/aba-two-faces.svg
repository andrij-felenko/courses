<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="34.0" width="410.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="55.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">ЗНАЧЕННЄВА ABA — знята незмінністю</tspan></text>
<rect x="50.0" y="94.0" width="390.0" height="52.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">комірка → v1   (незмінний)</tspan></text>
<rect x="50.0" y="184.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">хтось: v1 → v2 → v1  (назад ТОЙ САМИЙ v1)</tspan></text>
<rect x="50.0" y="274.0" width="390.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">писар: prev = v1 → CAS(v1 → v3) успіх</tspan></text>
<line x1="245.0" y1="146.0" x2="245.0" y2="184.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="245.0" y1="236.0" x2="245.0" y2="274.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="372.0" width="390.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="392.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">те саме посилання ⇒ той самий зміст.</tspan><tspan x="245.0" dy="16.9">незмінний об’єкт не міг збрехати —</tspan><tspan x="245.0" dy="16.9">CAS має рацію</tspan></text>
<rect x="530.0" y="34.0" width="410.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="55.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">АДРЕСНА ABA — НЕ знята незмінністю</tspan></text>
<rect x="540.0" y="89.0" width="390.0" height="52.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/><text x="735.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">сира комірка → &amp;A   (0xA1 = v1)</tspan></text>
<rect x="540.0" y="164.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">v1 звільнено — 0xA1 вільна</tspan></text>
<rect x="540.0" y="239.0" width="390.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">аллокатор віддає 0xA1 під НОВИЙ v3</tspan></text>
<rect x="540.0" y="314.0" width="390.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">комірка → &amp;A знову, та за 0xA1 вже v3</tspan></text>
<line x1="735.0" y1="141.0" x2="735.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="735.0" y1="216.0" x2="735.0" y2="239.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="735.0" y1="291.0" x2="735.0" y2="314.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="408.0" width="390.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="428.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">CAS(&amp;A → …) збігся за АДРЕСОЮ, об’єкт інший →</tspan><tspan x="735.0" dy="16.9">тихе псування. незмінність</tspan><tspan x="735.0" dy="16.9">не керує аллокатором</tspan></text>
</svg>