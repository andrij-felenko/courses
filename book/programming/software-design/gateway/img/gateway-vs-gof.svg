<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чим шлюз не Фасад і не Адаптер — межі, що виправдали нову назву</text>
<rect x="50.0" y="80.0" width="260.0" height="250.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="180.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Фасад</text>
<text x="180.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">двері будує АВТОР</tspan><tspan x="180.0" dy="14.3">системи — для всіх</tspan></text>
<rect x="120.0" y="200.0" width="120.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="180.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">нутро системи</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="172.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зсередини → назовні</text>
<rect x="350.0" y="80.0" width="280.0" height="250.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="490.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Адаптер</text>
<text x="490.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">обидва роз'єми</tspan><tspan x="490.0" dy="14.3">ВЖЕ готові</tspan></text>
<rect x="372.0" y="196.0" width="84.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="414.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">роз'єм A</text>
<rect x="524.0" y="196.0" width="84.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="566.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">роз'єм Б</text>
<line x1="456.0" y1="219.0" x2="524.0" y2="219.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">лише міст між готовими</text>
<rect x="670.0" y="80.0" width="280.0" height="250.0" rx="10" fill="#fff7e6" stroke="#d68910" stroke-width="2.0"/>
<text x="810.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="middle" font-weight="700">Шлюз</text>
<text x="810.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">двері будує КЛІЄНТ</tspan><tspan x="810.0" dy="14.3">під себе</tspan></text>
<rect x="690.0" y="196.0" width="92.0" height="46.0" rx="6" fill="#ffffff" stroke="#d68910" stroke-width="1.5"/>
<text x="736.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle"><tspan x="736.0" dy="0.0">мій бік —</tspan><tspan x="736.0" dy="13.0">вигадую сам</tspan></text>
<rect x="840.0" y="196.0" width="92.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="886.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="886.0" dy="0.0">чужина —</tspan><tspan x="886.0" dy="13.0">готова</tspan></text>
<line x1="782.0" y1="219.0" x2="840.0" y2="219.0" stroke="#d68910" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="810.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">свій бік — з нуля, під потребу</text>
<text x="490.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«різниці досить, аби виправдати нову назву» — М. Фаулер</text>
</svg>