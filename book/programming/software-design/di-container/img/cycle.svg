<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виявлення циклічної залежності стеком «зараз будуються»</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виявлення циклу: стек «зараз будуються» ловить зворотну стрілку</text>
<text x="240.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">стек «resolving»</text>
<text x="240.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(хто зараз у процесі збірки)</text>
<rect x="120.0" y="140.0" width="240.0" height="56.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="240.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">A  (resolve A)</tspan></text>
<line x1="240.0" y1="198.0" x2="240.0" y2="208.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="210.0" width="240.0" height="56.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="240.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">B  (A просить B)</tspan></text>
<line x1="240.0" y1="268.0" x2="240.0" y2="278.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="280.0" width="240.0" height="56.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="240.0" y="312.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">C  (B просить C)</tspan></text>
<line x1="364.0" y1="308.0" x2="406.0" y2="308.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="406.0" y1="308.0" x2="406.0" y2="168.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="406.0" y1="168.0" x2="364.0" y2="168.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="426.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700" transform="rotate(-90 426.0 238.0)">C просить A</text>
<text x="750.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевірка на вході resolve(T)</text>
<rect x="600.0" y="130.0" width="320.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="760.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">T уже в кеші?  → віддати збережене</tspan></text>
<rect x="600.0" y="196.0" width="320.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="760.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">T уже у стеку resolving?  → ЦИКЛ!</tspan></text>
<rect x="600.0" y="262.0" width="320.0" height="52.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="760.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">інакше: клади T у стек, будуй далі</tspan></text>
<rect x="600.0" y="328.0" width="320.0" height="52.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="760.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">зібрав T → знімай зі стека, у кеш</tspan></text>
<text x="750.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">цикл ловиться раніше, ніж стек переповниться</text>
</svg>