<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="206.0" y="106.0" width="208.0" height="208.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.3"/><text x="310.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">«Треба відвантажити</tspan><tspan x="310.0" dy="18.2">зараз — розберемося</tspan><tspan x="310.0" dy="18.2">з наслідками потім»</tspan></text>
<rect x="426.0" y="106.0" width="208.0" height="208.0" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.3"/><text x="530.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">«Тепер ми розуміємо,</tspan><tspan x="530.0" dy="18.2">як слід було</tspan><tspan x="530.0" dy="18.2">це зробити»</tspan></text>
<rect x="206.0" y="326.0" width="208.0" height="208.0" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.3"/><text x="310.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">«Нема часу</tspan><tspan x="310.0" dy="18.2">на дизайн»</tspan></text>
<rect x="426.0" y="326.0" width="208.0" height="208.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.3"/><text x="530.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">«А що таке</tspan><tspan x="530.0" dy="18.2">шари?»</tspan></text>
<text x="310.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СВІДОМИЙ</text>
<text x="310.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(знали, що беремо борг)</text>
<text x="530.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВИПАДКОВИЙ</text>
<text x="530.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(усвідомили заднім числом)</text>
<text x="176.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">РОЗВАЖ-</text>
<text x="176.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">ЛИВИЙ</text>
<text x="176.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(зважене</text>
<text x="176.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">рішення)</text>
<text x="176.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">БЕЗРОЗ-</text>
<text x="176.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">СУДНИЙ</text>
<text x="176.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(недбалість)</text>
<text x="214.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">найкраще</text>
<text x="626.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">найгірше</text>
