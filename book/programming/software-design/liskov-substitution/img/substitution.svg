<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підстановка: S годиться всюди, де очікували T</text>
<rect x="45.0" y="80.8" width="210.0" height="78.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Клієнт</tspan><tspan x="150.0" dy="18.2">працює через тип T</tspan><tspan x="150.0" dy="18.2">shape.area()</tspan></text>
<rect x="45.0" y="217.5" width="210.0" height="35.0" rx="6" fill="#eef7ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">очікує: контракт T</tspan></text>
<line x1="150.0" y1="148.0" x2="150.0" y2="213.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="460.0" y="63.0" width="200.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">об'єкт типу T</tspan><tspan x="560.0" dy="16.9">(база)</tspan></text>
<rect x="460.0" y="208.1" width="200.0" height="53.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">об'єкт підтипу S</tspan><tspan x="560.0" dy="16.9">(нащадок)</tspan></text>
