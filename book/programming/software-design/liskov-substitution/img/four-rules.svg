<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири правила чесного підтипу</text>
<rect x="55.0" y="78.0" width="670.0" height="60.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="2.0"/>
<text x="77.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Передумова</text>
<text x="77.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">можна лише ПОСЛАБИТИ</text>
<text x="415.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">приймай не менше входів, ніж база</text>
<rect x="55.0" y="160.0" width="670.0" height="60.0" rx="6" fill="#f7f9fc" stroke="#c0392b" stroke-width="2.0"/>
<text x="77.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Постумова</text>
<text x="77.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">можна лише ПОСИЛИТИ</text>
<text x="415.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">гарантуй не менше, ніж база</text>
<rect x="55.0" y="242.0" width="670.0" height="60.0" rx="6" fill="#f7f9fc" stroke="#27ae60" stroke-width="2.0"/>
<text x="77.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Інваріант</text>
<text x="77.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">треба ЗБЕРЕГТИ</text>
<text x="415.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усі інваріанти супертипу лишаються</text>
<rect x="55.0" y="324.0" width="670.0" height="60.0" rx="6" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="77.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Історія</text>
<text x="77.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">не додавай нових переходів</text>
<text x="415.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">жодних змін стану, неможливих над базою</text>
<text x="390.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">усі чотири разом  ⟺  S — поведінковий підтип T   (S &lt;: T)</text>
</svg>