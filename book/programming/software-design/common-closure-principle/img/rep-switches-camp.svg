<rect x="60.0" y="372.0" width="990.0" height="44.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="555.0" y="398.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Незмінне за обома поділами одне: CCP і CRP завжди у ворожих таборах. Це і є справжня напруга.</tspan></text>
