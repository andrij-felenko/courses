<text x="660.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="middle" font-weight="700">не Python-модуль / биткий файл</text>
<text x="660.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виняток при завантаженні</text>
<rect x="500.0" y="280.0" width="320.0" height="66.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="660.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="middle" font-weight="700">API 2, а ядро дає лише 3</text>
<text x="660.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">несумісна версія контракту</text>
