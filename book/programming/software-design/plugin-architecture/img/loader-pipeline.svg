<text x="210.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Звірити версію контракту</text>
<text x="210.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">плагін.API == HOST_API?</text>
<rect x="60.0" y="385.0" width="300.0" height="66.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/>
<text x="210.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. register(host)</text>
<text x="210.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">плагін вписує себе в реєстр</text>
<rect x="510.0" y="480.0" width="300.0" height="60.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="660.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">залогувати причину</text>
<text x="660.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">і взяти НАСТУПНИЙ плагін</text>
<line x1="660.0" y1="451.0" x2="660.0" y2="478.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
