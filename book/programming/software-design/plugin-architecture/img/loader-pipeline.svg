<text x="660.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="middle" font-weight="700">register кинув виняток</text>
<text x="660.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">плагін упав під час реєстрації</text>
<rect x="60.0" y="70.0" width="300.0" height="66.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Сканувати plugins/</text>
<text x="210.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знайти файли-кандидати</text>
<rect x="60.0" y="175.0" width="300.0" height="66.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="210.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Завантажити модуль</text>
<text x="210.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">importlib / import() / dlopen</text>
