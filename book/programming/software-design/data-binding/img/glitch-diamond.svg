<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збій узгодженості: порядок обходу вирішує, що встигне побачити світ</text>
<line x1="430.0" y1="84.0" x2="430.0" y2="580.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 7"/>
<text x="220.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">граф залежностей</text>
<rect x="142.0" y="146.0" width="156.0" height="60.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.8"/><text x="220.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">a = 5</tspan></text>
<rect x="42.0" y="270.0" width="156.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="120.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">b = a+1</tspan></text>
<rect x="242.0" y="270.0" width="156.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="320.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">c = a·2</tspan></text>
<rect x="142.0" y="398.0" width="156.0" height="60.0" rx="6" fill="#fff6e6" stroke="#333333" stroke-width="1.8"/><text x="220.0" y="432.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">d = b+c</tspan></text>
<text x="220.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">висота 0</text>
<text x="48.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
<text x="392.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
<text x="220.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">висота 2</text>
<line x1="196.0" y1="208.0" x2="140.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="244.0" y1="208.0" x2="300.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="140.0" y1="334.0" x2="196.0" y2="396.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="334.0" x2="244.0" y2="396.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">d залежить від a двома шляхами</text>
<rect x="468.0" y="100.0" width="772.0" height="232.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="494.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">наївно: углиб від зміненого вузла</text>
<text x="510.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">a := 5</text>
<text x="510.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">b := a+1 = 6</text>
<text x="510.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">d := b+c = 6+2 = 8      ← c ще старе</text>
<text x="510.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">c := a·2 = 10</text>
<text x="510.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">d := b+c = 6+10 = 16</text>
<text x="494.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">d обчислено двічі; перший результат не існував ніколи</text>
<rect x="468.0" y="360.0" width="772.0" height="190.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="494.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">за висотами: спершу все, від чого залежить</text>
<text x="510.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">a := 5</text>
<text x="510.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">висота 1:   b := 6,   c := 10</text>
<text x="510.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">висота 2:   d := 6+10 = 16</text>
<text x="494.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">кожен вузол обчислено рівно раз; проміжної неправди немає</text>
</svg>