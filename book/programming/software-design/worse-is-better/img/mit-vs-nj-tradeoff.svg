<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири критерії Ґебріела: MIT проти Нью-Джерсі</text>
<rect x="30.0" y="40.0" width="370.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Підхід MIT («Роби як слід»)</tspan><tspan x="215.0" dy="16.9">Пріоритет: чистий інтерфейс</tspan></text>
<rect x="420.0" y="40.0" width="370.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">Підхід Нью-Джерсі («Worse is Better»)</tspan><tspan x="605.0" dy="16.9">Пріоритет: проста реалізація</tspan></text>
<text x="410.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1. ПРОСТОТА</text>
<rect x="30.0" y="134.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Інтерфейс має бути простим.</tspan><tspan x="215.0" dy="14.3">Реалізація може бути як завгодно</tspan><tspan x="215.0" dy="14.3">складною заради зручності користувача.</tspan></text>
<rect x="420.0" y="134.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Реалізація МАЄ бути простою.</tspan><tspan x="605.0" dy="14.3">Простота інтерфейсу бажана, але</tspan><tspan x="605.0" dy="14.3">простота реалізації завжди вища.</tspan></text>
<text x="410.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">2. КОРЕКТНІСТЬ</text>
<rect x="30.0" y="229.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="246.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Абсолютна в усіх аспектах.</tspan><tspan x="215.0" dy="14.3">Некоректність неприпустима,</tspan><tspan x="215.0" dy="14.3">крайові випадки покриваються на 100%.</tspan></text>
<rect x="420.0" y="229.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="246.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Коректна в усіх спостережуваних аспектах.</tspan><tspan x="605.0" dy="14.3">Краще мати просту систему, ніж</tspan><tspan x="605.0" dy="14.3">ускладнювати її заради 1% рідкісних країв.</tspan></text>
<text x="410.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">3. УЗГОДЖЕНІСТЬ</text>
<rect x="30.0" y="324.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Сувора ортогональність правил.</tspan><tspan x="215.0" dy="14.3">Жодних винятків чи спеціальних випадків</tspan><tspan x="215.0" dy="14.3">в інтерфейсі не дозволяється.</tspan></text>
<rect x="420.0" y="324.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Узгодженість важлива, але нею можна</tspan><tspan x="605.0" dy="14.3">поступитися: краще дозволити виняток,</tspan><tspan x="605.0" dy="14.3">ніж роздувати ядро складністю.</tspan></text>
<text x="410.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">4. ПОВНОТА</text>
<rect x="30.0" y="419.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="436.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Покриває всі передбачувані ситуації.</tspan><tspan x="215.0" dy="14.3">Усі системні випадки мають бути</tspan><tspan x="215.0" dy="14.3">повністю вирішені ядром.</tspan></text>
<rect x="420.0" y="419.2" width="370.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="436.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Покриває лише практичні щоденні задачі.</tspan><tspan x="605.0" dy="14.3">Повнотою жертвують першою заради</tspan><tspan x="605.0" dy="14.3">збереження простоти реалізації.</tspan></text>
</svg>