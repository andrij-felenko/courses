<line x1="190.0" y1="205.0" x2="290.0" y2="135.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="337.6" y="211.2" width="144.9" height="87.7" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Результат:</tspan><tspan x="410.0" dy="16.9">«Гірша» система</tspan><tspan x="410.0" dy="16.9">стає світовим</tspan><tspan x="410.0" dy="16.9">стандартом</tspan></text>
