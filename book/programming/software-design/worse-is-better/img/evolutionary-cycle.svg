<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюційний маховик Worse is Better</text>
<rect x="310.0" y="80.2" width="200.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">1. Проста реалізація</tspan><tspan x="410.0" dy="14.3">Мінімальний обсяг коду ядра,</tspan><tspan x="410.0" dy="14.3">немає складних машин стану</tspan></text>
<rect x="559.1" y="225.2" width="201.8" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">2. Легке портування</tspan><tspan x="660.0" dy="14.3">Перенесення на новий процесор</tspan><tspan x="660.0" dy="14.3">за лічені тижні / дні</tspan></text>
<rect x="310.0" y="370.2" width="200.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">3. Вірусне впровадження</tspan><tspan x="410.0" dy="14.3">Система працює всюди,</tspan><tspan x="410.0" dy="14.3">витісняє дорогі аналоги</tspan></text>
<rect x="60.0" y="225.2" width="200.0" height="59.6" rx="6" fill="#fdf6e2" stroke="#b58900" stroke-width="1.5"/><text x="160.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">4. Доопрацювання зверху</tspan><tspan x="160.0" dy="14.3">Спільнота пише бібліотеки</tspan><tspan x="160.0" dy="14.3">й закриває вади ядра</tspan></text>
<line x1="530.0" y1="135.0" x2="630.0" y2="205.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
