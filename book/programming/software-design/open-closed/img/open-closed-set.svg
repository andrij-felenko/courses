<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкрита множина — завіса; замкнена — вичерпний switch</text>
<rect x="310.0" y="58.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="510.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Множина варіантів (типів) — яка вона?</tspan></text>
<rect x="96.0" y="154.0" width="344.0" height="58.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.9"/><text x="268.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">ВІДКРИТА / росте</tspan><tspan x="268.0" dy="16.2">нові фігури, провайдери, формати весь час</tspan></text>
<rect x="96.0" y="288.0" width="344.0" height="58.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="268.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="268.0" dy="0.0">Поліморфна завіса:</tspan><tspan x="268.0" dy="16.2">інтерфейс + взаємозамінні реалізації</tspan></text>
<rect x="96.0" y="418.0" width="344.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.9"/><text x="268.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">закрито для модифікації:</tspan><tspan x="268.0" dy="16.2">новий варіант не чіпає старе</tspan></text>
<rect x="580.0" y="154.0" width="344.0" height="58.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="752.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="752.0" dy="0.0">ЗАМКНЕНА / відома</tspan><tspan x="752.0" dy="16.2">3 стани, 4 масті — скінченна й стабільна</tspan></text>
<rect x="580.0" y="288.0" width="344.0" height="58.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="752.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">Вичерпний switch / sealed /</tspan><tspan x="752.0" dy="16.2">сума типів</tspan></text>
<rect x="580.0" y="418.0" width="344.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="752.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="752.0" dy="0.0">компілятор флагує КОЖНЕ</tspan><tspan x="752.0" dy="16.2">місце, що треба оновити</tspan></text>
<line x1="420.0" y1="108.0" x2="308.0" y2="152.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="600.0" y1="108.0" x2="712.0" y2="152.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="268.0" y1="212.0" x2="268.0" y2="286.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="268.0" y1="346.0" x2="268.0" y2="416.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="752.0" y1="212.0" x2="752.0" y2="286.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="752.0" y1="346.0" x2="752.0" y2="416.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="510.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Відкритість корисна там, де множина справді відкрита.</text>
<text x="510.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">На замкненій множині завіса лише сховала б місця, які інакше вказав би компілятор.</text>
</svg>