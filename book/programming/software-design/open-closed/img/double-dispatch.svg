<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійна диспетчеризація: два виклики → одна клітина</text>
<rect x="70.0" y="66.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="285.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">add.accept(printer)</tspan><tspan x="285.0" dy="17.6">add : Add      ·      printer : Print</tspan></text>
<line x1="285.0" y1="124.0" x2="285.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="526.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">① за РЕАЛЬНИМ типом</text>
<text x="526.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">елемента  →  РЯДОК</text>
<rect x="70.0" y="166.0" width="430.0" height="56.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="285.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Add.accept(v)  {  return v.visitAdd(this)  }</tspan><tspan x="285.0" dy="16.9">обрано РЯДОК матриці:  Add</tspan></text>
<line x1="285.0" y1="222.0" x2="285.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="526.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">② за РЕАЛЬНИМ типом</text>
<text x="526.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">відвідувача  →  СТОВПЕЦЬ</text>
<rect x="70.0" y="264.0" width="430.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="285.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Print.visitAdd(a)  {  …будує рядок…  }</tspan><tspan x="285.0" dy="16.9">обрано СТОВПЕЦЬ матриці:  Print</tspan></text>
<line x1="285.0" y1="320.0" x2="285.0" y2="356.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="362.0" width="430.0" height="48.0" rx="6" fill="#eafaef" stroke="#27ae60" stroke-width="2.2"/><text x="285.0" y="390.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">виконано РІВНО ОДНЕ тіло — клітина ( Add × Print )</tspan></text>
<text x="470.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Подвійна» — це два звичайні віртуальні виклики поспіль;</text>
<text x="470.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">їх перетин (тип елемента × тип відвідувача) і є одна клітина матриці операцій.</text>
</svg>