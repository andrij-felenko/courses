<rect x="105.0" y="190.0" width="260.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="235.0" y="212.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">class Report  (робочий)</tspan><tspan x="235.0" dy="16.2">поля + код усередині</tspan></text>
