<rect x="645.0" y="300.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">HtmlReport</tspan></text>
<rect x="787.0" y="300.0" width="120.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="847.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0.0">…новаReport</tspan></text>
<circle cx="901.0" cy="300.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="901.0" y="304.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="705.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">реалізації взаємозамінні,</text>
<text x="705.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">клієнт про них не знає</text>
<text x="235.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">слова Меєра, механізм — конкретне успадкування</text>
<text x="705.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ті самі слова, механізм — абстракція (ця версія в SOLID)</text>
