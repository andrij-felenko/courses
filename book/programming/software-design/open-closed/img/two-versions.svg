<rect x="575.0" y="190.0" width="260.0" height="46.0" rx="6" fill="#f2ecfb" stroke="#7c3aed" stroke-width="2.0"/><text x="705.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">abstract Report  (лише контракт)</tspan></text>
