<text x="135.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">твоє репо</text>
<rect x="250.0" y="175.0" width="150.0" height="64.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="325.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">твій модуль</text>
<text x="325.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">те саме репо</text>
