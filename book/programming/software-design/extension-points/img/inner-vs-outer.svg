<line x1="210.0" y1="207.0" x2="250.0" y2="207.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="60.0" cy="290.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="60.0" y="292.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="78.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">обидва боки — твої</text>
<circle cx="60.0" cy="324.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="60.0" y="326.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="78.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">збираються разом</text>
<circle cx="60.0" cy="358.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="60.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="78.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">зламав межу — полагодив сам</text>
<circle cx="60.0" cy="392.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="60.0" y="394.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="78.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">міняй будь-коли</text>
