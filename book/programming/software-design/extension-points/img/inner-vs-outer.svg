<text x="670.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#a02419" text-anchor="middle" font-weight="700">Зовнішня межа</text>
<text x="670.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">точка розширення назовні</text>
<rect x="500.0" y="175.0" width="150.0" height="64.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="575.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">твій продукт</text>
<text x="575.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">твоє репо</text>
<rect x="690.0" y="175.0" width="150.0" height="64.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="765.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="middle" font-weight="700">чужий код</text>
<text x="765.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">не бачиш, не збираєш</text>
