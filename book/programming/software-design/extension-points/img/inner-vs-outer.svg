<line x1="650.0" y1="207.0" x2="661.0" y2="207.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="679.0" y1="207.0" x2="690.0" y2="207.0" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="500.0" cy="290.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="518.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="start">по той бік — чужі, невідомі</text>
<circle cx="500.0" cy="324.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="518.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="start">релізяться окремо, у своєму часі</text>
<circle cx="500.0" cy="358.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="518.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="start">зламав контракт — зламав усім</text>
<circle cx="500.0" cy="392.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="395.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="518.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a02419" text-anchor="start">заморожений: майже не змінити</text>
