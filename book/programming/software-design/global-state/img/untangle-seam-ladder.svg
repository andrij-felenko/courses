<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">один критерій: чи значення глобала вертається в рішення логіки?</text>
<text x="105.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">глобал</text>
<text x="287.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що це для логіки</text>
<text x="539.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">вертається в рішення?</text>
<text x="846.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">вирок</text>
<rect x="40.0" y="90.0" width="130.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="105.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">годинник</tspan></text>
<rect x="182.0" y="90.0" width="210.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="287.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">вхід</tspan></text>
<rect x="404.0" y="90.0" width="270.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="539.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="539.0" dy="0.0">так — вирішує</tspan><tspan x="539.0" dy="16.9">expired чи ok</tspan></text>
<rect x="686.0" y="90.0" width="320.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="846.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="846.0" dy="0.0">витягти у шов:</tspan><tspan x="846.0" dy="16.9">порт Clock</tspan></text>
<rect x="40.0" y="176.0" width="130.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="105.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">конфіг</tspan></text>
<rect x="182.0" y="176.0" width="210.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="287.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">вхід</tspan></text>
<rect x="404.0" y="176.0" width="270.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="539.0" y="210.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="539.0" dy="0.0">так — вирішує</tspan><tspan x="539.0" dy="16.9">суму</tspan></text>
<rect x="686.0" y="176.0" width="320.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="846.0" y="210.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="846.0" dy="0.0">витягти у шов:</tspan><tspan x="846.0" dy="16.9">заморожене значення</tspan></text>
<rect x="40.0" y="262.0" width="130.0" height="76.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="105.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">лічильник</tspan></text>
<rect x="182.0" y="262.0" width="210.0" height="76.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="287.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">вхід і вихід</tspan><tspan x="287.0" dy="16.9">(read-modify-write)</tspan></text>
<rect x="404.0" y="262.0" width="270.0" height="76.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="539.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="539.0" dy="0.0">у логіку — ні,</tspan><tspan x="539.0" dy="16.9">у тест — так</tspan></text>
<rect x="686.0" y="262.0" width="320.0" height="76.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="846.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="846.0" dy="0.0">дати власника:</tspan><tspan x="846.0" dy="16.9">Metrics із замком</tspan></text>
<rect x="40.0" y="348.0" width="130.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="105.0" y="390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">логер</tspan></text>
<rect x="182.0" y="348.0" width="210.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="287.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">лише вихід</tspan><tspan x="287.0" dy="16.9">(чистий стік)</tspan></text>
<rect x="404.0" y="348.0" width="270.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="539.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="539.0" dy="0.0">ні — назад</tspan><tspan x="539.0" dy="16.9">не вертається</tspan></text>
<rect x="686.0" y="348.0" width="320.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="846.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="846.0" dy="0.0">лишити фоновим —</tspan><tspan x="846.0" dy="16.9">свідомо</tspan></text>
<text x="505.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">порядок швів — згори вниз: спершу те, що логіка читає найглибше</text>
</svg>