<text x="450.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">єдиний тест, який можна написати з живим годинником, — єдиний, який цього бага не бачить</text>
