<text x="410.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">чужий формат тече в ядро лише через перекладач — уже як поняття ядра</text>
