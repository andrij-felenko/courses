<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкрій креслить межі: товсту навколо ядра, тонку над чужим</text>
<rect x="40.0" y="135.0" width="190.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="135.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">ДОПОМІЖНИЙ</tspan><tspan x="135.0" dy="18.2">піддомен</tspan><tspan x="135.0" dy="18.2"></tspan><tspan x="135.0" dy="18.2">пишемо самі,</tspan><tspan x="135.0" dy="18.2">простіше</tspan></text>
<rect x="300.0" y="135.0" width="220.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="3.2"/><text x="410.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ЯДРО</tspan><tspan x="410.0" dy="19.5"></tspan><tspan x="410.0" dy="19.5">власна багата</tspan><tspan x="410.0" dy="19.5">модель,</tspan><tspan x="410.0" dy="19.5">своя мова</tspan></text>
<rect x="546.0" y="135.0" width="44.0" height="150.0" rx="6" fill="#fff7e6" stroke="#b7791f" stroke-width="1.8"/><text x="568.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="568.0" dy="0.0">A</tspan><tspan x="568.0" dy="19.5">C</tspan><tspan x="568.0" dy="19.5">L</tspan></text>
<text x="568.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700">перекладач</text>
<rect x="616.0" y="135.0" width="200.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="716.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="716.0" dy="0.0">ЗАГАЛЬНИЙ</tspan><tspan x="716.0" dy="18.2">піддомен</tspan><tspan x="716.0" dy="18.2"></tspan><tspan x="716.0" dy="18.2">готовий сервіс</tspan><tspan x="716.0" dy="18.2">за чужим API</tspan></text>
