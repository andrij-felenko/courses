<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дистиляція визріває у два кроки: два полюси → три названі сорти</text>
<rect x="40.0" y="96.0" width="340.0" height="320.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<rect x="540.0" y="96.0" width="340.0" height="320.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="210.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еванс · 2003 · «синя книжка»</text>
<text x="210.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Частина IV · розділ 15 «Distillation»</text>
<text x="710.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вернон · 2013 і 2016</text>
<text x="710.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">«Implementing DDD» · «DDD Distilled»</text>
<rect x="64.0" y="122.0" width="292.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="210.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ЯДРОВА ОБЛАСТЬ (core domain)</tspan><tspan x="210.0" dy="15.6">найцінніша фракція — у неї найкращі сили</tspan></text>
<rect x="64.0" y="214.0" width="292.0" height="74.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="210.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">сіра зона без власного імені</tspan><tspan x="210.0" dy="16.9">(«і не ядро, і не готове»)</tspan></text>
<rect x="64.0" y="306.0" width="292.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="210.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ЗАГАЛЬНІ ПІДДОМЕНИ (generic)</tspan><tspan x="210.0" dy="16.9">відкинута фракція — беремо готове</tspan></text>
<rect x="564.0" y="122.0" width="292.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="710.0" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ЯДРОВИЙ (core)</tspan><tspan x="710.0" dy="16.9">унікальне — найкращі сили</tspan></text>
<rect x="564.0" y="214.0" width="292.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="710.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ДОПОМІЖНИЙ (supporting)</tspan><tspan x="710.0" dy="16.9">не ядро й не загальне — пишемо самі</tspan></text>
<rect x="564.0" y="306.0" width="292.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="710.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ЗАГАЛЬНИЙ (generic)</tspan><tspan x="710.0" dy="16.9">вже вирішене — купуємо</tspan></text>
<line x1="386.0" y1="251.0" x2="534.0" y2="251.0" stroke="#b7791f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="460.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700">доназвано</text>
<text x="460.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700">середній член</text>
<text x="460.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ідея «відділити ядро» — від Еванса; чиста тріада з трьох імен — від наступників</text>
</svg>