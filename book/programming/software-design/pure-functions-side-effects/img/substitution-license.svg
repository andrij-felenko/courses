<text x="500.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">замінити на значення</text>
<text x="500.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">⇄</text>
<text x="500.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">лише якщо f чиста</text>
<line x1="500.0" y1="176.0" x2="500.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тоді вільно:</text>
<line x1="500.0" y1="244.0" x2="118.0" y2="293.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
