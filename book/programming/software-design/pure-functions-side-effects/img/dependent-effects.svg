<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де плаский план ефектів перестає давати раду</text>
<text x="540.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Незалежні ефекти — плаский список Effect[] годиться</text>
<rect x="212.6" y="114.0" width="74.7" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">saveUser</tspan></text>
<rect x="449.0" y="114.0" width="102.1" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">appendLedger</tspan></text>
<rect x="719.5" y="114.0" width="61.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">notify</tspan></text>
<rect x="316.5" y="181.0" width="446.9" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">жоден не читає результату іншого → виконуй у будь-якому порядку</tspan></text>
<text x="540.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Ефект B читає РЕЗУЛЬТАТ ефекту A — списку замало</text>
<rect x="192.4" y="316.2" width="95.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">insert(row)</tspan><tspan x="240.0" dy="15.6">→ новий id</tspan></text>
<text x="392.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">id є лише ПІСЛЯ виконання</text>
<line x1="291.6" y1="340.0" x2="496.0" y2="340.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="495.3" y="316.2" width="129.4" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">notify(user, id)</tspan><tspan x="560.0" dy="15.6">← потребує id</tspan></text>
<rect x="256.4" y="424.0" width="567.2" height="32.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">потрібен ЛАНЦЮГ: наступний крок = функція(результат) — це форма монади IO (bind)</tspan></text>
