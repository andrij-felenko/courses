<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефекти — на край: чисте всередині, брудне зовні</text>
<circle cx="430.0" cy="330.0" r="210.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="430.0" cy="330.0" r="110.0" fill="#f2faf5" stroke="#27ae60" stroke-width="2.4"/>
<text x="430.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ЧИСТЕ ЯДРО</text>
<text x="430.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">уся логіка й рішення</text>
<text x="430.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">той самий вхід</text>
<text x="430.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">→ той самий вихід</text>
<text x="430.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ІМПЕРАТИВНА ОБОЛОНКА (тонка)</text>
