<rect x="86.4" y="252.5" width="87.2" height="23.0" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.4"/><text x="130.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="130.0" dy="0.0">читання з БД</tspan></text>
<line x1="130.0" y1="370.0" x2="314.0" y2="354.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="77.0" y="384.5" width="106.0" height="23.0" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.4"/><text x="130.0" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="130.0" dy="0.0">читання конфіга</tspan></text>
<line x1="546.0" y1="306.0" x2="730.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="692.6" y="252.5" width="74.7" height="23.0" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.4"/><text x="730.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="730.0" dy="0.0">запис у БД</tspan></text>
<line x1="546.0" y1="354.0" x2="730.0" y2="370.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="689.5" y="384.5" width="81.0" height="23.0" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.4"/><text x="730.0" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="730.0" dy="0.0">вивід у лог</tspan></text>
<rect x="173.8" y="564.0" width="512.5" height="32.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.4"/><text x="430.0" y="584.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Бруд приносить дані в ядро й виносить його рішення — рішень у ньому нема</tspan></text>
