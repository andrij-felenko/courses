<text x="500.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">обробник вільно кличе cancel() і add() — ядро вже не всередині свого обходу</text>
