<rect x="30.0" y="272.0" width="940.0" height="220.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="500.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Обробника кличе ВЛАСНИК ЦИКЛУ — після того, як step() повернувся</text>
