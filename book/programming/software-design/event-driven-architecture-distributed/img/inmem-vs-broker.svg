<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що змінюється, коли видавець і підписник — різні сервіси</text>
<line x1="480.0" y1="58.0" x2="480.0" y2="476.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="240.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ОДИН ПРОЦЕС · ШИНА В ПАМ'ЯТІ</text>
<text x="720.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">РІЗНІ СЕРВІСИ · БРОКЕР</text>
<rect x="75.0" y="82.0" width="330.0" height="300.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.5"/>
<text x="240.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">процес застосунку</text>
<rect x="170.0" y="128.5" width="140.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">видавець</tspan></text>
<rect x="140.0" y="216.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">шина</tspan><tspan x="240.0" dy="15.6">(об'єкт у пам'яті)</tspan></text>
<rect x="170.0" y="328.5" width="140.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">підписник</tspan></text>
<line x1="240.0" y1="161.5" x2="240.0" y2="216.2" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="240.0" y1="263.8" x2="240.0" y2="328.5" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">рестарт процесу — черга зникає разом</text>
<text x="240.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">з пам'яттю; ніщо не переживає падіння</text>
