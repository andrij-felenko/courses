<rect x="605.0" y="276.2" width="230.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">брокер</tspan><tspan x="720.0" dy="15.6">(журнал на диску)</tspan></text>
<line x1="590.0" y1="189.0" x2="605.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="584.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">публікує</text>
<line x1="835.0" y1="292.0" x2="850.0" y2="189.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="856.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">доставляє</text>
<text x="720.0" y="353.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">рестарт будь-якого сервісу — брокер тримає</text>
<text x="720.0" y="373.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">події на диску; підписник дочитає з місця, де спинився</text>
