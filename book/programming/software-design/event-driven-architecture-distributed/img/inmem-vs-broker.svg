<rect x="530.0" y="142.0" width="120.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">видавець</tspan></text>
<rect x="772.0" y="105.0" width="156.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="850.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">сервіс B</text>
