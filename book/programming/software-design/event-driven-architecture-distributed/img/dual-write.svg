<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема подвійного запису та її лік — скринька</text>
<line x1="490.0" y1="58.0" x2="490.0" y2="496.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="245.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ДВА ЗАПИСИ — РОЗ'ЇХАЛИСЯ</text>
<text x="735.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ОДИН ЗАПИС — АТОМАРНО</text>
<rect x="170.0" y="93.5" width="150.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="245.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">сервіс</tspan></text>
<rect x="65.0" y="226.2" width="150.0" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">база</tspan><tspan x="140.0" dy="15.6">✓ записано</tspan></text>
<rect x="275.0" y="226.2" width="150.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">брокер</tspan><tspan x="350.0" dy="15.6">✗ не дійшло</tspan></text>
<line x1="215.0" y1="126.5" x2="140.0" y2="226.2" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="126.5" x2="350.0" y2="226.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="360.6" width="270.0" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">стан каже «сталося»,</tspan><tspan x="245.0" dy="15.6">події немає — ніхто</tspan><tspan x="245.0" dy="15.6">не дізнається. Розбіжність</tspan><tspan x="245.0" dy="15.6">без транзакції, що їх обійме</tspan></text>
<rect x="660.0" y="93.5" width="150.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="735.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">сервіс</tspan></text>
<rect x="585.0" y="200.0" width="300.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="735.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">одна транзакція бази</text>
<rect x="600.0" y="255.3" width="120.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">дані</tspan><tspan x="660.0" dy="14.3">замовлення</tspan></text>
<rect x="750.0" y="255.3" width="120.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">скринька:</tspan><tspan x="810.0" dy="14.3">рядок-подія</tspan></text>
<line x1="735.0" y1="126.5" x2="735.0" y2="196.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="384.0" width="360.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">відправник читає скриньку → брокер</tspan></text>
<line x1="735.0" y1="320.0" x2="735.0" y2="384.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="735.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">або зберігся і факт, і намір його розіслати — або ні те, ні те</text>
</svg>