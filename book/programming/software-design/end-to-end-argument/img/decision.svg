<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1190" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="595.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три питання, які треба провести для кожної функції</text>
<rect x="80.0" y="70.0" width="430.0" height="78.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="2.2"/><text x="295.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Чи можна перевірити це,</tspan><tspan x="295.0" dy="19.5">не маючи обох кінців?</tspan></text>
<rect x="80.0" y="208.0" width="430.0" height="78.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="2.2"/><text x="295.0" y="242.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Чи здешевлює механізм нижче</tspan><tspan x="295.0" dy="19.5">ціну помилки?</tspan></text>
<rect x="80.0" y="346.0" width="430.0" height="78.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="2.2"/><text x="295.0" y="380.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Чи вгадує він уподобання застосунку</tspan><tspan x="295.0" dy="19.5">(порядок, повтори, затримку)?</tspan></text>
<line x1="295.0" y1="148.0" x2="295.0" y2="202.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="295.0" y1="286.0" x2="295.0" y2="340.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="70.0" width="440.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="910.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Функція належить кінцям —</tspan><tspan x="910.0" dy="19.5">нижче її не завершити.</tspan></text>
<rect x="690.0" y="176.0" width="440.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="910.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Додай як фільтр</tspan><tspan x="910.0" dy="19.5">і міряй як продуктивність.</tspan></text>
<rect x="690.0" y="272.0" width="440.0" height="78.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="2.2"/><text x="910.0" y="306.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Не додавай: складність</tspan><tspan x="910.0" dy="19.5">без виграшу.</tspan></text>
<rect x="690.0" y="378.0" width="440.0" height="78.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="2.2"/><text x="910.0" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Дай спосіб вимкнути —</tspan><tspan x="910.0" dy="19.5">інакше зверху не обійти.</tspan></text>
<line x1="516.0" y1="109.0" x2="684.0" y2="109.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ні</text>
<line x1="516.0" y1="247.0" x2="684.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">так</text>
<line x1="516.0" y1="247.0" x2="684.0" y2="311.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ні</text>
<line x1="516.0" y1="385.0" x2="684.0" y2="417.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">так</text>
</svg>