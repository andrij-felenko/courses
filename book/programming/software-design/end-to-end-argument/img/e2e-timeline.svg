<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 954" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1010" height="954" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хроніка наскрізного аргументу</text>
<text x="358.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Сорок років наскрізного аргументу</text>
<line x1="330.0" y1="62.0" x2="330.0" y2="920.0" stroke="#c9ced6" stroke-width="2.4"/>
<rect x="323.0" y="89.0" width="14.0" height="14.0" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0.0"/>
<text x="358.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="start" font-weight="700">ПРАКТИКА, ЯКУ ЩЕ НЕ НАЗВАЛИ</text>
<circle cx="330.0" cy="154.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">1971–1976</text>
<text x="358.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">CYCLADES: за цілісність відповідає хост, а не мережа</text>
<circle cx="330.0" cy="206.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">1973</text>
<text x="358.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">Бренстед: шифрування має бути наскрізним</text>
<circle cx="330.0" cy="258.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">1978</text>
<text x="358.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">TCP ділять на TCP та IP — щоб голос обійшов повтори</text>
<rect x="323.0" y="303.0" width="14.0" height="14.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="358.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="start" font-weight="700">ФОРМУЛЮВАННЯ</text>
<circle cx="330.0" cy="368.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="300.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">грудень 1980</text>
<text x="358.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">семінар ACM у Фолбруку: ідею обговорюють у вузькому колі</text>
<circle cx="330.0" cy="420.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="300.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">8–10.04.1981</text>
<text x="358.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">Париж, 2-га ICDCS: перша публікація, чотири сторінки</text>
<circle cx="330.0" cy="472.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="300.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">листопад 1984</text>
<text x="358.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">ACM TOCS 2(4), 277–288: канонічний текст</text>
<rect x="323.0" y="517.0" width="14.0" height="14.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="358.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">КАНОН, А ТОДІ РОЗЛАМ</text>
<circle cx="330.0" cy="582.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="300.0" y="587.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">1988</text>
<text x="358.0" y="587.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">Кларк, SIGCOMM: спільна доля стану і сполучення</text>
<circle cx="330.0" cy="634.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="300.0" y="639.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">травень 1994</text>
<text x="358.0" y="639.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">RFC 1631: NAT — коробка, що переписує адреси в дорозі</text>
<circle cx="330.0" cy="686.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="300.0" y="691.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">червень 1996</text>
<text x="358.0" y="691.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">RFC 1958: аргумент записано в архітектуру інтернету</text>
<circle cx="330.0" cy="738.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="300.0" y="743.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">1998</text>
<text x="358.0" y="743.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">Рід, Зальцер, Кларк: де аргумент шкодить</text>
<circle cx="330.0" cy="790.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="300.0" y="795.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">серпень 2001</text>
<text x="358.0" y="795.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">Блументаль і Кларк: кінцям більше не можна довіряти</text>
<circle cx="330.0" cy="842.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="300.0" y="847.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">2002</text>
<text x="358.0" y="847.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">RFC 3234: перепис проміжних коробок; критика Мурса</text>
<circle cx="330.0" cy="894.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="300.0" y="899.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">2017</text>
<text x="358.0" y="899.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">вимір перехоплення TLS: розлам усередині шифру</text>
</svg>