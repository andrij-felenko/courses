<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дорожча межа, то більший ρ = (L+m)/t — і виграш DTO</text>
<line x1="64.0" y1="90.0" x2="64.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="30.0" dy="0.0">межа</tspan><tspan x="30.0" dy="14.3">дорожчає</tspan></text>
<rect x="105.0" y="74.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">виклик функції (той самий процес)</tspan><tspan x="255.0" dy="15.6">L+m ≈ 5 нс · t ≈ 1 нс</tspan></text>
<line x1="425.0" y1="98.0" x2="515.0" y2="98.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="66.4" width="220.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ρ ≈ 5</tspan><tspan x="660.0" dy="15.6">межі майже нема:</tspan><tspan x="660.0" dy="15.6">DTO — сама ціна</tspan></text>
<rect x="105.0" y="156.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">інший процес (IPC на машині)</tspan><tspan x="255.0" dy="15.6">L+m ≈ 10 мкс · t ≈ 0.1 мкс</tspan></text>
<line x1="425.0" y1="180.0" x2="515.0" y2="180.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="156.2" width="220.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ρ ≈ 100</tspan><tspan x="660.0" dy="15.6">виграш помітний</tspan></text>
<rect x="105.0" y="238.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">мережа, той самий ЦОД (RTT)</tspan><tspan x="255.0" dy="15.6">L+m ≈ 500 мкс · t ≈ 1 мкс</tspan></text>
<line x1="425.0" y1="262.0" x2="515.0" y2="262.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="238.2" width="220.0" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ρ ≈ 500</tspan><tspan x="660.0" dy="15.6">DTO окупається</tspan></text>
<rect x="105.0" y="320.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">інший континент (RTT)</tspan><tspan x="255.0" dy="15.6">L+m ≈ 150 мс · t ≈ 1 мкс</tspan></text>
<line x1="425.0" y1="344.0" x2="515.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="320.2" width="220.0" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ρ ≈ 150 000</tspan><tspan x="660.0" dy="15.6">бери якнайгрубіше</tspan></text>
<text x="430.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ρ = (L+m)/t — скільки полів «коштує» один похід через межу; що твердіша межа, то більший ρ</text>
