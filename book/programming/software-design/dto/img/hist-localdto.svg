<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна межа-DTO: коли платити, коли ні</text>
<rect x="150.0" y="93.5" width="140.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">клієнт</tspan></text>
<rect x="120.0" y="276.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">чужий процес</tspan><tspan x="220.0" dy="15.6">/ мережа / черга</tspan></text>
<line x1="220.0" y1="150.0" x2="220.0" y2="268.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="124.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">справжня межа процесу</text>
<line x1="220.0" y1="158.0" x2="220.0" y2="262.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="312.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">DTO</text>
<text x="220.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">DTO виправданий:</text>
<text x="220.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">купує швидкодію й розв'язку</text>
<line x1="410.0" y1="60.0" x2="410.0" y2="366.0" stroke="#333333" stroke-width="1.0" stroke-dasharray="2 4"/>
<rect x="530.0" y="93.5" width="140.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">виклик A</tspan></text>
<rect x="500.0" y="276.2" width="200.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">виклик B</tspan><tspan x="600.0" dy="15.6">(той самий процес)</tspan></text>
<line x1="600.0" y1="158.0" x2="600.0" y2="262.0" stroke="#6b7280" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="578.0" y1="232.0" x2="622.0" y2="188.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="692.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">DTO</text>
<text x="600.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">DTO зайвий:</text>
<text x="600.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сама ціна, нуль користі</text>
<text x="410.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">«Перший закон: не розподіляй свої об'єкти» — М. Фаулер, PoEAA</text>
</svg>