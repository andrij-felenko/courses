<rect x="55.0" y="92.0" width="390.0" height="386.0" rx="10" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="250.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">on_plus_clicked()</text>
<rect x="80.0" y="146.0" width="340.0" height="46.0" rx="6" fill="#f2f2f5" stroke="#333333" stroke-width="1.4"/><text x="250.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1 · ввід — читає число з ЕКРАНА</tspan></text>
<rect x="80.0" y="202.0" width="340.0" height="46.0" rx="6" fill="#fff6e6" stroke="#333333" stroke-width="1.4"/><text x="250.0" y="229.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">2 · правило — межа 5–30</tspan></text>
<rect x="80.0" y="258.0" width="340.0" height="46.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.4"/><text x="250.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">3 · рендер — поле + смужка</tspan></text>
