<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розплутування: обробник-спрут → три частини</text>
<line x1="500.0" y1="78.0" x2="500.0" y2="560.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
