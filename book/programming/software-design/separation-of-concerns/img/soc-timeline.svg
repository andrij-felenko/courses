<rect x="655.0" y="143.4" width="150.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="730.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">аспекти: є клопоти,</tspan><tspan x="730.0" dy="15.6">що ріжуться навскіс</tspan><tspan x="730.0" dy="15.6">будь-якому розкладу</tspan></text>
