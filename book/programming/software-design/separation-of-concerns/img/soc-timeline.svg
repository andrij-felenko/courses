<text x="120.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1968</text>
<rect x="234.8" y="143.4" width="170.5" height="63.2" rx="6" fill="#eefaf0" stroke="#27ae60" stroke-width="2.0"/><text x="320.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Парнас: критерій —</tspan><tspan x="320.0" dy="15.6">ховати рішення,</tspan><tspan x="320.0" dy="15.6">які ймовірно зміняться</tspan></text>
