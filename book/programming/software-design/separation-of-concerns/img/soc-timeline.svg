<rect x="434.8" y="58.4" width="170.5" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="520.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Дейкстра дає назву;</tspan><tspan x="520.0" dy="15.6">Константайн і колеги —</tspan><tspan x="520.0" dy="15.6">мірило розрізу</tspan></text>
