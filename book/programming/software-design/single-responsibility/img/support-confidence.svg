<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метрика: наскільки разом — і наскільки окремо</text>
<rect x="130.0" y="133.1" width="240.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="250.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">pay_calculator.py</tspan><tspan x="250.0" dy="16.9">мінявся 4×</tspan></text>
<rect x="630.0" y="133.1" width="240.0" height="53.9" rx="6" fill="#fff5e6" stroke="#b8860b" stroke-width="1.8"/><text x="750.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">hours_policy.py</tspan><tspan x="750.0" dy="16.9">мінявся 7×</tspan></text>
<line x1="374.0" y1="160.0" x2="626.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="626.0" y1="160.0" x2="374.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">разом: 4 коміти  (support)</text>
<rect x="120.0" y="250.0" width="760.0" height="58.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">впевненість  pay_calculator ⇒ hours_policy  =  4 / 4  =  1.00     (щоразу, як міняли pay, міняли й policy)</tspan></text>
<rect x="120.0" y="330.0" width="760.0" height="58.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.6"/><text x="500.0" y="362.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">впевненість  hours_policy ⇒ pay_calculator  =  4 / 7  =  0.57     (policy тягне ще й звіт — назад тримає слабше)</tspan></text>
<rect x="40.0" y="410.0" width="920.0" height="44.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="500.0" y="435.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Та сама пара — різна впевненість у два боки. Слабший зворотний бік означає, що hours_policy служить не одному господареві: це хаб, крізь який тече спільний шов.</tspan></text>
