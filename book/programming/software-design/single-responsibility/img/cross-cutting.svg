<rect x="95.0" y="496.0" width="890.0" height="44.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="521.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Наскрізний концерн прибирають з ядра не «в один модуль», а в один шар, що ОБГОРТАЄ модулі — декоратор / аспект / middleware. Ядро лишається з єдиним актором.</tspan></text>
