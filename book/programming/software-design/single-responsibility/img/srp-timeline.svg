<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога SRP: від зв'язності до «одного актора»</text>
<line x1="70.0" y1="150.0" x2="970.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="968.0" y1="150.0" x2="994.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="990.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">час</text>
<line x1="150.0" y1="142.0" x2="150.0" y2="91.7" stroke="#2457d6" stroke-width="1.4"/>
<rect x="65.0" y="32.3" width="170.0" height="59.4" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="51.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Ларрі Константин</tspan><tspan x="150.0" dy="15.0">виміряв зв'язність</tspan><tspan x="150.0" dy="15.0">і зчеплення</tspan></text>
<circle cx="150.0" cy="150.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="164.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1960–70-ті</text>
<line x1="150.0" y1="158.0" x2="150.0" y2="241.2" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="65.0" y="241.2" width="170.0" height="57.6" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/><text x="150.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ще лише «на око»:</tspan><tspan x="150.0" dy="14.3">щабель відчувають,</tspan><tspan x="150.0" dy="14.3">не міряють</tspan></text>
<line x1="390.0" y1="142.0" x2="390.0" y2="91.7" stroke="#2457d6" stroke-width="1.4"/>
<rect x="305.0" y="32.3" width="170.0" height="59.4" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="390.0" y="51.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ДеМарко · Пейдж-Джонс</tspan><tspan x="390.0" dy="15.0">зв'язність —</tspan><tspan x="390.0" dy="15.0">у практику</tspan></text>
<circle cx="390.0" cy="150.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="404.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">кінець 1970-х</text>
<line x1="390.0" y1="158.0" x2="390.0" y2="241.2" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="305.0" y="241.2" width="170.0" height="57.6" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/><text x="390.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">настанова є,</tspan><tspan x="390.0" dy="14.3">а точної лінійки</tspan><tspan x="390.0" dy="14.3">ще нема</tspan></text>
<line x1="650.0" y1="142.0" x2="650.0" y2="99.2" stroke="#c0392b" stroke-width="1.4"/>
<rect x="565.0" y="24.8" width="170.0" height="74.4" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="650.0" y="43.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Роберт Мартин</tspan><tspan x="650.0" dy="15.0">ім'я SRP:</tspan><tspan x="650.0" dy="15.0">«одна причина</tspan><tspan x="650.0" dy="15.0">для зміни»</tspan></text>
<circle cx="650.0" cy="150.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="664.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2003</text>
<line x1="650.0" y1="158.0" x2="650.0" y2="241.2" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="565.0" y="241.2" width="170.0" height="57.6" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">слово «причина»</tspan><tspan x="650.0" dy="14.3">двозначне —</tspan><tspan x="650.0" dy="14.3">видно всюди</tspan></text>
<line x1="890.0" y1="142.0" x2="890.0" y2="91.7" stroke="#27ae60" stroke-width="1.4"/>
<rect x="805.0" y="32.3" width="170.0" height="59.4" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="890.0" y="51.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">розбір Мартина</tspan><tspan x="890.0" dy="15.0">уточнив:</tspan><tspan x="890.0" dy="15.0">«один актор»</tspan></text>
<circle cx="890.0" cy="150.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="904.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2014</text>
<line x1="890.0" y1="158.0" x2="890.0" y2="248.3" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="805.0" y="248.3" width="170.0" height="43.3" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/><text x="890.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">причина = ЛЮДИ,</tspan><tspan x="890.0" dy="14.3">що просять зміну</tspan></text>
<text x="520.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">одна наскрізна нитка:</text>
<rect x="120.0" y="508.0" width="800.0" height="34.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="520.0" y="528.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">«збери докупи те, що міняється разом»  —  функційна зв'язність на вершині драбини, лише сказана дедалі точніше</tspan></text>
</svg>