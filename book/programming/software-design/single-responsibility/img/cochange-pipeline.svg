<text x="570.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр аналізу сумісної зміни: від git log до карти швів</text>
<rect x="40.0" y="152.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="130.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">git log</tspan><tspan x="130.0" dy="15.6">--name-only</tspan><tspan x="130.0" dy="15.6">коміт → його файли</tspan></text>
<rect x="260.0" y="152.0" width="180.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">відсів шуму</tspan><tspan x="350.0" dy="15.6">коміт &gt; K файлів</tspan><tspan x="350.0" dy="15.6">— геть</tspan></text>
<rect x="480.0" y="152.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="570.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">пари файлів</tspan><tspan x="570.0" dy="15.6">combinations(f, 2)</tspan><tspan x="570.0" dy="15.6">+1 кожній парі</tspan></text>
<rect x="700.0" y="152.0" width="180.0" height="96.0" rx="6" fill="#fff5e6" stroke="#b8860b" stroke-width="1.8"/><text x="790.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">метрика</tspan><tspan x="790.0" dy="13.0">support = разом</tspan><tspan x="790.0" dy="13.0">confidence = разом / усіх</tspan></text>
<rect x="920.0" y="152.0" width="180.0" height="96.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="1010.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">ранг</tspan><tspan x="1010.0" dy="15.6">карта прихованих</tspan><tspan x="1010.0" dy="15.6">швів SRP</tspan></text>
