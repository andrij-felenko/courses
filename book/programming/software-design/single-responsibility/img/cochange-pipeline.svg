<rect x="195.0" y="308.0" width="310.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="350.0" y="332.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">мега-рефактор · bulk-rename · merge</tspan><tspan x="350.0" dy="15.0">→ у смітник</tspan></text>
<rect x="100.0" y="396.0" width="940.0" height="40.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.4"/><text x="570.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Коміт — це «кошик»: файли, що лягли в один коміт, «купують разом». Що частіше разом — то ймовірніше одна прихована відповідальність.</tspan></text>
