<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="62.8" width="300.0" height="54.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Девід Парнас · 1972</tspan><tspan x="190.0" dy="19.5">Приховування ІНФОРМАЦІЇ</tspan></text>
<rect x="20.0" y="150.0" width="340.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ховай РІШЕННЯ, що зміниться;</tspan><tspan x="190.0" dy="16.9">модуль знає його один,</tspan><tspan x="190.0" dy="16.9">решта про нього не здогадується</tspan></text>
<rect x="520.0" y="62.8" width="300.0" height="54.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Алан Кей · Smalltalk</tspan><tspan x="670.0" dy="19.5">стан ЗАМКНЕНО в об'єкті</tspan></text>
<rect x="500.0" y="150.0" width="340.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">об'єкт береже свій стан-процес;</tspan><tspan x="670.0" dy="16.9">ззовні — лише повідомлення,</tspan><tspan x="670.0" dy="16.9">внутрішнє приховане й захищене</tspan></text>
<rect x="150.0" y="322.5" width="560.0" height="35.0" rx="6" fill="#fdf6ec" stroke="#1a1a1a" stroke-width="1.5"/><text x="430.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">МЕЖА: назовні — обіцянка, всередині — свобода змінити</tspan></text>
<line x1="190.0" y1="242.0" x2="190.0" y2="318.5" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="670.0" y1="242.0" x2="670.0" y2="318.5" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
