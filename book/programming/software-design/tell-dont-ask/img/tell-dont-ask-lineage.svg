<text x="470.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Дали ім'я «Tell, Don't Ask»</tspan><tspan x="470.0" dy="13.7">і рознесли принцип;</tspan><tspan x="470.0" dy="13.7">додали думку про</tspan><tspan x="470.0" dy="13.7">інваріанти класу</tspan></text>
