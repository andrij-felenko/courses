<text x="200.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">«Процедурний код здобуває</tspan><tspan x="200.0" dy="13.7">інформацію, тоді ухвалює</tspan><tspan x="200.0" dy="13.7">рішення; об'єктний — каже</tspan><tspan x="200.0" dy="13.7">об'єктам щось зробити»</tspan></text>
