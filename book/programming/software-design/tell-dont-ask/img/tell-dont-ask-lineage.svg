<text x="740.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">«Особисто я tell-dont-ask</tspan><tspan x="740.0" dy="13.7">не вживаю»; сходинка до</tspan><tspan x="740.0" dy="13.7">співрозташування, не догма;</tspan><tspan x="740.0" dy="13.7">стереже від GetterEradicators</tspan></text>
<text x="470.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">спостереження  →  гасло й розголос  →  зважений канон із застереженнями</text>
