<text x="530.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">зайвий журнал-запит, кеш, повтор після збою — усе це переставляє й дублює виклики</text>
<text x="530.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">поки запит нічого не міняє — це безпечно; щойно міняє — тихо ламається</text>
