<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дає поділ: запит стає безпечним, команда лишається однією точкою зміни</text>
<rect x="85.0" y="93.0" width="230.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">переставляй</tspan></text>
<text x="200.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">виклики запитів</tspan><tspan x="200.0" dy="17.5">у будь-якому</tspan><tspan x="200.0" dy="17.5">порядку</tspan></text>
<rect x="385.0" y="93.0" width="230.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">повторюй</tspan></text>
<text x="500.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">клич той самий</tspan><tspan x="500.0" dy="17.5">запит скільки хоч —</tspan><tspan x="500.0" dy="17.5">відповідь та сама</tspan></text>
<rect x="685.0" y="93.0" width="230.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">кешуй</tspan></text>
<text x="800.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">запам'ятай раз,</tspan><tspan x="800.0" dy="17.5">віддавай багато —</tspan><tspan x="800.0" dy="17.5">нічого не зіпсуєш</tspan></text>
<line x1="120.0" y1="250.0" x2="880.0" y2="250.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="500.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">усе це чинне рівно доти, доки запит НІЧОГО не міняє</text>
<rect x="120.0" y="325.1" width="760.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">КОМАНДА — навпаки: жодної з цих вольностей.</tspan><tspan x="500.0" dy="16.9">Зате зміна стану зібрана в одну точку, а не розлита по запитах.</tspan></text>
</svg>