<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="545" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пасивне подання за інтерфейсом: справжнє в застосунку, фальшиве в тесті</text>
<rect x="320.0" y="57.0" width="300.0" height="66.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Презентер</text><text x="470.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">однаково працює з будь-яким поданням</text>
<rect x="310.0" y="165.0" width="320.0" height="120.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="470.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подання — інтерфейс екрана</text>
<line x1="340.0" y1="202.0" x2="600.0" y2="202.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">showTemperature(text)</tspan><tspan x="470.0" dy="18.8">showColor(hex)</tspan><tspan x="470.0" dy="18.8">onNudge(handler)</tspan></text>
<line x1="470.0" y1="123.0" x2="470.0" y2="163.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="486.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">керує через інтерфейс</text>
<rect x="120.0" y="384.0" width="250.0" height="96.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/><text x="245.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Справжнє подання</text><text x="245.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">малює на віджетах</text><text x="245.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(у застосунку)</text>
<rect x="570.0" y="384.0" width="250.0" height="96.0" rx="9" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.8"/><text x="695.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фальшиве подання</text><text x="695.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запам'ятовує виклики</text><text x="695.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(у тесті)</text>
<line x1="470.0" y1="285.0" x2="258.0" y2="384.0" stroke="#6b7280" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="285.0" x2="682.0" y2="384.0" stroke="#6b7280" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="330.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">реалізує</text>
<text x="610.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">реалізує</text>
<text x="470.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Той самий інтерфейс — презентер не бачить різниці між ними.</text>
<text x="470.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">У тесті «натискаємо +» і звіряємо, що подання почуло «23°» — без жодного віджета.</text>
</svg>