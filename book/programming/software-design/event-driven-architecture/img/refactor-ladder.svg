<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина рефакторингу: що кожен крок купує й чим платить</text>
<rect x="100.0" y="615.0" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="636.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Крок 0 · прямі виклики</tspan><tspan x="250.0" dy="16.9">placeOrder кличе всіх поіменно</tspan></text>
<rect x="100.0" y="465.1" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="486.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Крок 1 · синхронна шина</tspan><tspan x="250.0" dy="16.9">publish у тому ж потоці</tspan></text>
<rect x="98.9" y="315.1" width="302.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Крок 2 · асинхронна шина</tspan><tspan x="250.0" dy="16.9">queueMicrotask, повертається одразу</tspan></text>
<rect x="98.9" y="165.1" width="302.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Крок 3 · ідемпотентність</tspan><tspan x="250.0" dy="16.9">eventId + дедуплікація, форма події</tspan></text>
<line x1="74.0" y1="615.0" x2="74.0" y2="515.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="434.0" y="553.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">+ розв'язка в коді</text>
<text x="434.0" y="579.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">− видимість потоку</text>
<line x1="74.0" y1="465.1" x2="74.0" y2="364.9" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="434.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">+ розв'язка в часі</text>
<text x="434.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">− гарантія «все або нічого»</text>
<line x1="74.0" y1="315.1" x2="74.0" y2="214.9" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="434.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">+ стійкість до повторів</text>
<text x="434.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">− стан, що переживе рестарт</text>
<rect x="705.0" y="152.8" width="250.0" height="94.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">ЗА МЕЖЕЮ ПАМ'ЯТІ</tspan><tspan x="830.0" dy="15.6">надійна доставка:</tspan><tspan x="830.0" dy="15.6">намір — у ту саму</tspan><tspan x="830.0" dy="15.6">транзакцію, черга —</tspan><tspan x="830.0" dy="15.6">поза процесом</tspan></text>
<text x="830.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">жоден щабель у пам'яті</text>
<text x="830.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">сюди не дотягується</text>
<text x="830.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">читати не як «вище — краще»,</text>
<text x="830.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">а як вибір під конкретний наслідок:</text>
<text x="830.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">єдиний → крок 0</text>
<text x="830.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">невіддільний → крок 1</text>
<text x="830.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">самостійний → крок 2</text>
<text x="830.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">надійний повтор → крок 3</text>
</svg>