<rect x="302.0" y="173.0" width="90.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="347.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="347.0" dy="0.0">Лук+важ</tspan></text>
<text x="191.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">магічна</text>
<rect x="206.0" y="213.0" width="90.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="251.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="251.0" dy="0.0">Меч+маг</tspan></text>
<rect x="302.0" y="213.0" width="90.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="347.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="347.0" dy="0.0">Лук+маг</tspan></text>
<text x="265.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">2 × 3 = 6 класів</text>
<text x="265.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ отрута (×2):   6 × 2 = 12</text>
<text x="265.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ політ  (×2):  12 × 2 = 24</text>
<text x="265.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ ранг   (×3):  24 × 3 = 72</text>
<text x="265.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">кожна вісь МНОЖИТЬ усе дерево</text>
<text x="795.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Композиція: клас на деталь</text>
<text x="795.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">кількість = СУМА осей</text>
<text x="703.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зброя (2)</text>
<rect x="643.0" y="130.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="703.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="703.0" dy="0.0">Меч</tspan></text>
<rect x="643.0" y="172.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="703.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="703.0" dy="0.0">Лук</tspan></text>
<text x="887.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Броня (3)</text>
<rect x="827.0" y="130.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="887.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.0" dy="0.0">легка</tspan></text>
<rect x="827.0" y="172.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="887.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.0" dy="0.0">важка</tspan></text>
<rect x="827.0" y="214.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="887.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.0" dy="0.0">магічна</tspan></text>
<text x="795.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2 + 3 = 5 деталей</text>
<text x="795.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ отрута (+1):   5 + 1 = 6</text>
<text x="795.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ політ  (+1):   6 + 1 = 7</text>
<text x="795.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+ ранг   (+3):   7 + 3 = 10</text>
<text x="795.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">нова вісь лише ДОДАЄ рядок</text>
