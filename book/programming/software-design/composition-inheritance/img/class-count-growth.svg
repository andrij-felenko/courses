<rect x="302.0" y="133.0" width="90.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="347.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="347.0" dy="0.0">Лук+лег</tspan></text>
<text x="191.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">важка</text>
