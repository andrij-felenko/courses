<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чесна ціна композиції на один виклик</text>
<text x="500.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один виклик attack() — куди він насправді йде</text>
<rect x="40.0" y="150.0" width="190.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="179.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">клієнт</tspan><tspan x="135.0" dy="15.6">enemy.attack()</tspan></text>
<rect x="300.0" y="150.0" width="190.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Enemy::attack()</tspan><tspan x="395.0" dy="14.3">{ return weapon-&gt;hit(); }</tspan></text>
<rect x="560.0" y="150.0" width="190.0" height="66.0" rx="6" fill="#fff6e6" stroke="#d08a1e" stroke-width="1.6"/><text x="655.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">vtable зброї</tspan><tspan x="655.0" dy="14.3">знайти адресу hit()</tspan></text>
<rect x="780.0" y="150.0" width="190.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="875.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">Sword::hit()</tspan><tspan x="875.0" dy="14.3">{ return 10; }</tspan></text>
<line x1="232.0" y1="183.0" x2="298.0" y2="183.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">виклик обгортки</text>
<line x1="492.0" y1="183.0" x2="558.0" y2="183.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">віртуальний виклик</text>
<line x1="752.0" y1="183.0" x2="778.0" y2="183.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="765.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">стрибок за адресою</text>
<text x="500.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна проти прямого поля-об'єкта:</text>
<text x="500.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+ рядок делегування у власника (обгортка на кожен метод, що прокидається)</text>
<text x="500.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+ один рівень непрямості: щоб знати результат, треба знати, ЩО зараз у полі</text>
<text x="500.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+ віртуальний виклик: ≈ 1–5 нс, і головне — компілятор НЕ вбудує (inline) тіло</text>
<text x="500.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">На холодному коді — тоне; на мільйони викликів/с гарячого циклу — міряй</text>
</svg>