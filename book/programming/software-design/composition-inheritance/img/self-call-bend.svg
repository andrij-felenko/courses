<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="590.0" y1="92.0" x2="590.0" y2="384.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="300.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Спадкування: self-виклик згинається ВГОРУ</text>
<rect x="250.0" y="80.0" width="210.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="355.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">виклик: addAll([a, b, c])</tspan></text>
<rect x="120.0" y="152.0" width="160.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="200.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">add(e)</tspan><tspan x="200.0" dy="15.6">addCount++</tspan></text>
<rect x="340.0" y="152.0" width="190.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="435.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">addAll(c)</tspan><tspan x="435.0" dy="15.6">addCount += 3</tspan></text>
<text x="300.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">шар нащадка (перевизначення)</text>
<rect x="140.0" y="262.0" width="320.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">HashSet.addAll — успадкований</tspan><tspan x="300.0" dy="15.6">для кожного e:  this.add(e)</tspan></text>
<line x1="360.0" y1="114.0" x2="435.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="415.0" y1="202.0" x2="350.0" y2="260.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="470.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-style="italic">super.addAll</text>
<path d="M 175 260 C 95 224, 82 196, 150 204" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">внутрішній this.add бази б'є в перевизначений add нащадка</text>
<text x="300.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">addCount = 6   ✗   (пачку порахували двічі)</text>
<text x="880.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Композиція: self-виклик замикається В ДЕТАЛІ</text>
<rect x="830.0" y="80.0" width="210.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="935.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">виклик: addAll([a, b, c])</tspan></text>
<rect x="700.0" y="152.0" width="160.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">add(e)</tspan><tspan x="780.0" dy="15.6">addCount++</tspan></text>
<rect x="920.0" y="152.0" width="190.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="1015.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1015.0" dy="0.0">addAll(c)</tspan><tspan x="1015.0" dy="15.6">addCount += 3</tspan></text>
<text x="880.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">шар обгортки (InstrumentedSet)</text>
<rect x="720.0" y="262.0" width="320.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="880.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">s : HashSet — ОКРЕМА деталь</tspan><tspan x="880.0" dy="15.6">для кожного e:  s.add(e)</tspan></text>
<line x1="940.0" y1="114.0" x2="1015.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="995.0" y1="202.0" x2="940.0" y2="260.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="1050.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">s.addAll</text>
<path d="M 1040 276 C 1104 270, 1104 306, 1042 300" fill="none" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="880.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">s.add замикається в деталі — до обгортки не дістає</text>
<text x="880.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">addCount = 3   ✓   (порахували рівно раз)</text>
</svg>