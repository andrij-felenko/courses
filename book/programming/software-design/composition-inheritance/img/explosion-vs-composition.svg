<line x1="780.0" y1="176.0" x2="898.0" y2="349.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="780.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2 + 3 = 5 деталей покривають усі 6 комбінацій</text>
<text x="780.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">нова вісь ДОДАЄ, а не множить</text>
<text x="780.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">комбінацію збирають під час роботи</text>
