<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина захисту інваріанта: вище — раніше й надійніше</text>
<rect x="150.0" y="470.0" width="620.0" height="74.0" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="2.2"/>
<text x="460.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">нічого — лише сподівання на дисципліну</text>
<text x="460.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">правило в голові, поля відкриті — порушать неминуче</text>
<rect x="150.0" y="378.0" width="620.0" height="74.0" rx="10" fill="#fdf3e3" stroke="#e08a1e" stroke-width="2.2"/>
<text x="460.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#e08a1e" text-anchor="middle" font-weight="700">перевірка під час виконання</text>
<text x="460.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">падає на порушенні — у місці й у момент, а не потім</text>
<rect x="150.0" y="286.0" width="620.0" height="74.0" rx="10" fill="#eef3ff" stroke="#2457d6" stroke-width="2.2"/>
<text x="460.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">інкапсуляція</text>
<text x="460.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">порушити можна лише через код самого класу</text>
<rect x="150.0" y="194.0" width="620.0" height="74.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="460.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">тип</text>
<text x="460.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">некоректний стан неможливо навіть виразити</text>
<line x1="816.0" y1="544.0" x2="816.0" y2="188.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="834.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">порушення</text>
<text x="834.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ловиться</text>
<text x="834.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">раніше</text>
<text x="834.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">слабший</text>
<text x="126.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">сильніше</text>
</svg>