<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="285.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Дорога 1: копія в проєкт</text>
<text x="838.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Дорога 2: залежність на компонент</text>
<line x1="560.0" y1="112.0" x2="560.0" y2="448.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="145.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">першоджерело</text>
<rect x="70.0" y="138.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="145.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">v1.0.0</tspan></text>
<rect x="70.0" y="210.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="145.0" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">v1.1.0</tspan><tspan x="145.0" dy="15.6">+виправлення</tspan></text>
<rect x="70.0" y="282.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="145.0" y="300.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">v1.2.0</tspan><tspan x="145.0" dy="15.6">+можливість</tspan></text>
<line x1="145.0" y1="182.0" x2="145.0" y2="208.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="145.0" y1="254.0" x2="145.0" y2="280.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="150.0" width="210.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="405.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">твій проєкт:</tspan><tspan x="405.0" dy="16.2">копія застигла на v1.0.0</tspan></text>
<line x1="221.0" y1="160.0" x2="297.0" y2="178.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="405.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">новіші версії сюди не течуть</text>
<rect x="70.0" y="356.0" width="440.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="290.0" y="378.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Першоджерело пішло далі — копія</tspan><tspan x="290.0" dy="15.6">лишилась на v1.0.0. Виправлення й нові</tspan><tspan x="290.0" dy="15.6">можливості доводиться зливати руками —</tspan><tspan x="290.0" dy="15.6">це відгалуження, а не повторне використання.</tspan></text>
<text x="685.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">першоджерело (випуски)</text>
<rect x="610.0" y="138.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">v2.3.0</tspan></text>
<rect x="610.0" y="210.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">v2.3.1</tspan><tspan x="685.0" dy="15.6">латка</tspan></text>
<rect x="610.0" y="282.0" width="150.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="300.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">v2.4.0</tspan><tspan x="685.0" dy="15.6">+можливість</tspan></text>
<line x1="685.0" y1="182.0" x2="685.0" y2="208.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="685.0" y1="254.0" x2="685.0" y2="280.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="858.0" y="200.0" width="202.0" height="60.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="959.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="959.0" dy="0.0">твій проєкт:</tspan><tspan x="959.0" dy="16.2">залежність ^2.3.0</tspan></text>
<text x="806.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">оновлення течуть</text>
<line x1="762.0" y1="224.0" x2="856.0" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="356.0" width="450.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="835.0" y="378.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Версія — договір: сумісні оновлення</tspan><tspan x="835.0" dy="15.6">(2.3.1, 2.4.0) приходять самі; ламка</tspan><tspan x="835.0" dy="15.6">3.0.0 — лише коли ти сам перейдеш</tspan><tspan x="835.0" dy="15.6">і прочитаєш, що змінилось.</tspan></text>
<rect x="60.0" y="464.0" width="1000.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="560.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Повторно використати можна лише ВИПУЩЕНЕ — з номером версії, обіцянкою сумісності</tspan><tspan x="560.0" dy="16.9">й журналом змін. Без випуску «повторне використання» вироджується в копію.</tspan></text>
</svg>