<rect x="610.0" y="424.0" width="420.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="820.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Теми немає: що означає перехід 8.2→8.3 — невідомо.</tspan><tspan x="820.0" dy="15.6">Будь-який доробок будь-кого — випуск, що будить усіх.</tspan><tspan x="820.0" dy="15.6">Залежність важка: береш усе заради дрібниці.</tspan></text>
