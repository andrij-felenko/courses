<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце двобічного зв'язування: де воно спиняється</text>
<rect x="115.0" y="125.0" width="270.0" height="90.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/><text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поле вводу</text><text x="250.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">текст «23»</text>
<rect x="675.0" y="125.0" width="270.0" height="90.0" rx="9" fill="#f2f2f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="810.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворювач</text><text x="810.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«23» → 23</text>
<rect x="675.0" y="345.0" width="270.0" height="90.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="810.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивість</text><text x="810.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нове ≠ старе?</text>
<rect x="115.0" y="345.0" width="270.0" height="90.0" rx="9" fill="#f2f2f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="250.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворювач</text><text x="250.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">23 → «23»</text>
<line x1="390.0" y1="170.0" x2="670.0" y2="170.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="530.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">подія input</text>
<text x="530.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">користувач надрукував</text>
<line x1="810.0" y1="220.0" x2="810.0" y2="340.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="828.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">число 23</text>
<text x="828.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">у сетер</text>
<line x1="670.0" y1="390.0" x2="390.0" y2="390.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="530.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">сигнал про зміну</text>
<text x="530.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лише якщо значення справді інше</text>
<line x1="250.0" y1="345.0" x2="250.0" y2="220.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="232.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">«23» у поле</text>
<text x="232.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">запис із коду</text>
<rect x="40.0" y="462.0" width="420.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">запис у поле з коду не породжує</tspan><tspan x="250.0" dy="16.9">події input — обороту не буде</tspan></text>
<rect x="600.0" y="462.0" width="420.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="810.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">нове = старе → сигналу немає:</tspan><tspan x="810.0" dy="16.9">кільце спиняється саме тут</tspan></text>
