<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що прибирає зв'язування: перепис поле-за-полем проти однієї декларації</text>
<line x1="520.0" y1="84.0" x2="520.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="265.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Руками: рядок коду на кожен показ і ввід</text>
<rect x="58.0" y="92.0" width="414.0" height="250.0" rx="10" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="84.0" y="132.0" width="362.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">лейбл.text = fmt(темп)</tspan></text>
<rect x="84.0" y="182.0" width="362.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">темп = parse(поле.text)</tspan></text>
<rect x="84.0" y="232.0" width="362.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">кнопка.enabled = можнаЗберегти</tspan></text>
<rect x="84.0" y="282.0" width="362.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">× на КОЖНЕ поле, обидва боки</tspan></text>
<text x="265.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">багато однакового коду; забув рядок — екран бреше</text>
<text x="775.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язуванням: оголосив пару — рушій тримає</text>
<rect x="568.0" y="92.0" width="414.0" height="250.0" rx="10" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="594.0" y="138.0" width="362.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="775.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">&lt;поле text={Binding Темп}&gt;</tspan></text>
<text x="775.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">подання: одна прив'язка</text>
<rect x="594.0" y="240.0" width="362.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="775.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Темп — спостережувана властивість</tspan></text>
<text x="775.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">модель подання: одне поле</text>
<text x="775.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">рушій сам тримає їх рівними — копіювати не треба</text>
<text x="520.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">MVVM прибирає ручний перепис: оголошуєш зв'язок раз — рушій тримає екран і дані рівними</text>
</svg>