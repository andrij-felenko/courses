<line x1="320.0" y1="410.0" x2="370.0" y2="410.0" stroke="#ea580c" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="380.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Непряма залежність за керуванням (Control/Predicate Flow у WHERE/JOIN)</text>
