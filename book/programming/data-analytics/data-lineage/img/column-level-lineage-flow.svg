<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стовпчиковий Lineage: прямі та непрямі потоки залежностей</text>
<rect x="40.0" y="80.0" width="220.0" height="280.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="78.6" y="89.5" width="142.8" height="31.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Таблиця raw.orders</tspan></text>
<rect x="103.0" y="135.0" width="94.1" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">order_id (PK)</tspan></text>
<rect x="102.8" y="190.0" width="94.4" height="30.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/><text x="150.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">amount (UAH)</tspan></text>
<rect x="93.5" y="245.0" width="113.0" height="30.0" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="150.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">status ('PAID')</tspan></text>
<rect x="103.0" y="300.0" width="94.1" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="318.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">currency_code</tspan></text>
<rect x="40.0" y="375.0" width="220.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="81.1" y="385.0" width="137.8" height="30.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/><text x="150.0" y="403.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">fx.usd_rate (float)</tspan></text>
<rect x="310.0" y="120.0" width="270.0" height="230.0" rx="6" fill="#1e293b" stroke="#333333" stroke-width="2.0"/>
<text x="445.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">Трансформація (SQL Query AST)</text>
<text x="325.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="start"><tspan x="325.0" dy="0.0">SELECT</tspan><tspan x="325.0" dy="14.0">  o.order_id,</tspan><tspan x="325.0" dy="14.0">  SUM(o.amount / fx.usd_rate) AS usd_revenue</tspan><tspan x="325.0" dy="14.0">FROM raw.orders o</tspan><tspan x="325.0" dy="14.0">JOIN fx ON o.currency = fx.code</tspan><tspan x="325.0" dy="14.0">WHERE o.status = 'PAID'</tspan><tspan x="325.0" dy="14.0">GROUP BY o.order_id</tspan></text>
<rect x="630.0" y="110.0" width="220.0" height="220.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
