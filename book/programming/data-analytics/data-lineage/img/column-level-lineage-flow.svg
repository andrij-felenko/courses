<rect x="707.2" y="170.0" width="65.6" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="188.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">order_id</tspan></text>
<rect x="695.9" y="240.0" width="88.2" height="30.0" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/><text x="740.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">usd_revenue</tspan></text>
