<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка схем і відтворюваність даних</text>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція схеми джерела: втрата інформації в ETL проти відтворюваності в ELT</text>
<rect x="25.0" y="55.0" width="395.0" height="365.0" rx="6" fill="#fdfbfb" stroke="#c0392b" stroke-width="1.3"/>
<text x="225.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ETL: Жорстка фільтрація на вході</text>
<rect x="105.0" y="107.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="225.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Джерело додає нове поле:</tspan><tspan x="225.0" dy="14.3">{id, sum, client_tier}</tspan></text>
<rect x="105.0" y="185.2" width="240.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Конвеєр ETL (старий код):</tspan><tspan x="225.0" dy="14.3">пропускає лише {id, sum},</tspan><tspan x="225.0" dy="14.3">поле client_tier відкинуто!</tspan></text>
<line x1="225.0" y1="155.0" x2="225.0" y2="185.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="105.0" y="275.2" width="240.0" height="59.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="225.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Сховище DWH:</tspan><tspan x="225.0" dy="14.3">історія за пів року без tier.</tspan><tspan x="225.0" dy="14.3">Відновити неможливо!</tspan></text>
<line x1="225.0" y1="245.0" x2="225.0" y2="275.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="225.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Непоправна втрата історичного контексту</text>
<rect x="440.0" y="55.0" width="395.0" height="365.0" rx="6" fill="#fbfdfb" stroke="#27ae60" stroke-width="1.3"/>
<text x="635.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ELT: Сирий шар та відкладена проекція</text>
<rect x="515.0" y="107.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="635.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Джерело додає нове поле:</tspan><tspan x="635.0" dy="14.3">{id, sum, client_tier}</tspan></text>
<rect x="515.0" y="185.2" width="240.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Сирий шар Bronze (Lakehouse):</tspan><tspan x="635.0" dy="14.3">записано повний JSON/рядки</tspan><tspan x="635.0" dy="14.3">в незмінному вигляді</tspan></text>
<line x1="635.0" y1="155.0" x2="635.0" y2="185.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="515.0" y="275.2" width="240.0" height="59.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="635.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">SQL-модель (dbt / View):</tspan><tspan x="635.0" dy="14.3">додаємо client_tier у запит і</tspan><tspan x="635.0" dy="14.3">перераховуємо всю історію!</tspan></text>
<line x1="635.0" y1="245.0" x2="635.0" y2="275.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="635.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повна відтворюваність (Zero Data Loss)</text>
</svg>