<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="980.0" height="430.0" rx="8" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="530.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Data-контракту: багатошарова структура угоди</text><rect x="70.0" y="82.0" width="920.0" height="72.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" font-weight="700">1. Синтаксис і типи</text><text x="90.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Імена полів, типи даних (int, string, decimal), обов'язковість (nullability), кодування.</text><rect x="70.0" y="170.0" width="920.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="90.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">2. Бізнес-семантика</text><text x="90.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Одиниці виміру (центи/долари, UTC-час), скінченний автомат статусів, опис сутності.</text><rect x="70.0" y="258.0" width="920.0" height="72.0" rx="6" fill="#fdf8e2" stroke="#d97706" stroke-width="1.5"/><text x="90.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">3. Інваріанти якості (SLO)</text><text x="90.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Унікальність первинного ключа, допустимі діапазони, відсоток заповненості, допустимий лаг.</text><rect x="70.0" y="346.0" width="920.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start" font-weight="700">4. Володіння та регламент</text><text x="90.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Команда-власник (Slack/Email), рівень конфіденційності (PII/GDPR), політика застарівання.</text><text x="530.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Контракт — це не просто схема DDL, а повна специфікація поведінки, якості та відповідальності.</tspan></text>
</svg>