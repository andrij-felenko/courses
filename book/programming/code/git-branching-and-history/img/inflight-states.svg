<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операція в польоті: виходи й що кожен гарантує</text>
<text x="45.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Конфлікт злиття: у теці .git з'явився MERGE_HEAD</text>
<rect x="60.0" y="140.0" width="240.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">git merge</tspan><tspan x="180.0" dy="18.2">зупинився на конфлікті</tspan></text>
<line x1="308.0" y1="168.0" x2="550.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="88.0" width="440.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--continue → коміт-злиття з двома батьками</tspan></text>
<line x1="308.0" y1="168.0" x2="550.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="146.0" width="440.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="780.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--abort → стан рівно такий, як до злиття</tspan></text>
<line x1="308.0" y1="168.0" x2="550.0" y2="226.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="204.0" width="440.0" height="44.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.6"/><text x="780.0" y="230.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--quit → маркер знято, зроблене лишається</tspan></text>
<line x1="40.0" y1="272.0" x2="1020.0" y2="272.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7,6"/>
<text x="45.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Перебазування в польоті: тека .git/rebase-merge/</text>
<rect x="60.0" y="411.0" width="240.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="434.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">git rebase</tspan><tspan x="180.0" dy="18.2">спіткнувся на коміті</tspan></text>
<line x1="308.0" y1="439.0" x2="550.0" y2="352.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="330.0" width="440.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--continue → накласти коміт і йти далі за планом</tspan></text>
<line x1="308.0" y1="439.0" x2="550.0" y2="410.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="388.0" width="440.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="780.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--skip → поточний коміт викинуто зовсім</tspan></text>
<line x1="308.0" y1="439.0" x2="550.0" y2="468.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="446.0" width="440.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="780.0" y="472.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--abort → гілка туди, де стартувала</tspan></text>
<line x1="308.0" y1="439.0" x2="550.0" y2="526.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="504.0" width="440.0" height="44.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.6"/><text x="780.0" y="530.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">--quit → зупинка, HEAD лишається де є</tspan></text>
<rect x="40.0" y="572.0" width="980.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="600.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Стан операції видно командою git status.</tspan><tspan x="530.0" dy="16.9">Поки маркер у теці .git не знято, коміт і перемикання гілок відмовляються працювати.</tspan></text>
</svg>