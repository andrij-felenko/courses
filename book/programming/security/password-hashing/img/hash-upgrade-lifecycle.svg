<text x="555.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">needs_rehash()</text>
<text x="555.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чи застарів алгоритм?</text>
<text x="555.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(напр. bcrypt -&gt; Argon2id)</text>
<text x="555.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чи зросли ліміти?</text>
<text x="555.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(m: 32MB -&gt; 64MB)</text>
<line x1="640.0" y1="125.0" x2="700.0" y2="125.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
