<line x1="170.0" y1="125.0" x2="230.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1. POST</text>
<rect x="230.0" y="50.0" width="180.0" height="150.0" rx="8" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="320.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Сервер автентифікації</text>
<text x="320.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зчитує геш із БД</text>
<text x="320.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перевірка пароля:</text>
<text x="320.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">verify(pass, stored_hash)</text>
<text x="320.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Пароль правильний?</text>
<line x1="410.0" y1="125.0" x2="470.0" y2="125.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
