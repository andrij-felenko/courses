<text x="757.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Новий геш</text>
<text x="757.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Argon2id</text>
<text x="757.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">UPDATE db</text>
<text x="757.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у фоні транзакції</text>
<line x1="320.0" y1="200.0" x2="320.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="757.0" y1="200.0" x2="757.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="250.0" width="585.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="522.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Випуск сесійного токена (JWT / Session Cookie) для користувача</text>
<text x="522.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Користувач не помічає оновлення; база даних поступово мігрує на актуальний алгоритм</text>
