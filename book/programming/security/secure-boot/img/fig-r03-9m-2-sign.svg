<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підпис і перевірка: хеш + пара ключів</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тільки таємний ключ міг підписати; будь-хто з відкритим — перевірити</text>
<rect x="60.0" y="84.0" width="360.0" height="110.0" rx="10" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="240.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">у виробника</text>
<text x="80.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дані → Hash → h</text>
<text x="80.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">h → Sign(таємний ключ) → підпис</text>
<rect x="480.0" y="84.0" width="360.0" height="110.0" rx="10" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="660.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">на пристрої</text>
<text x="500.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дані → Hash → h′</text>
<text x="500.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">підпис → Verify(відкритий) → h</text>
<line x1="420.0" y1="139.0" x2="480.0" y2="139.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<text x="450.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">віддаємо</text>
<rect x="300.0" y="220.0" width="300.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">порівняти  h  vs  h′</text>
<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">збіг → справжнє ✓     ні → підробка ✗</text>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Підмінити дані й лишити підпис чинним не можна: інший хеш не зійдеться,</text>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">а поставити новий підпис без таємного ключа — годі.</text>
</svg>
