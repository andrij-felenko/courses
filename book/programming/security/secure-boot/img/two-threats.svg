<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні загрози — два різні щити</text>
<rect x="40.0" y="50.0" width="320.0" height="168.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Підміна прошивки</text>
<text x="200.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">зловмисник заливає свій код</text>
<rect x="95.0" y="124.0" width="210.0" height="32.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">щит: secure boot</tspan></text>
<text x="200.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">перевіряє, чи прошивка наша,</text>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">і не дає стартувати чужій</text>
<rect x="400.0" y="50.0" width="320.0" height="168.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="560.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Підглядання даних</text>
<text x="560.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">зловмисник читає вміст Flash</text>
<rect x="455.0" y="124.0" width="210.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">щит: шифрування Flash</tspan></text>
<text x="560.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">робить вміст нечитним для</text>
