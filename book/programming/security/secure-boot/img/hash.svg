<text x="380.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміна на біт — геть інший відбиток; однобічний (назад не відновити), без колізій.</text>
