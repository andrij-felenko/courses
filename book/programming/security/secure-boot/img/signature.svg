<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цифровий підпис: «це справді наше?»</text>
<rect x="40.0" y="60.0" width="300.0" height="120.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="190.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">виробник</text>
<text x="190.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">прошивка + таємний ключ</text>
<rect x="90.0" y="134.0" width="200.0" height="32.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="190.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">підписаний образ</tspan></text>
<line x1="340.0" y1="120.0" x2="420.0" y2="120.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">віддаємо</text>
<rect x="420.0" y="60.0" width="300.0" height="120.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="570.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">пристрій</text>
<text x="570.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">звіряє відкритим ключем (зашитий)</text>
<text x="500.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">збіг → наше</text>
<text x="645.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ні → чуже</text>
<rect x="80.0" y="210.0" width="600.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="380.0" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Як печатка: підробити не може ніхто, упізнати — кожен.</tspan><tspan x="380.0" dy="14.3">Контрольна сума ловить випадок; підпис — навмисну підміну.</tspan></text>
</svg>