<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фундаментальні питання моделювання загроз</text>
<circle cx="410.0" cy="180.0" r="52.0" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл</text>
<text x="410.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Шостака</text>
<rect x="270.0" y="20.0" width="280.0" height="75.0" rx="8" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Що ми будуємо?</text>
<text x="410.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Декомпозиція: DFD, процеси, межі довіри</text>
<text x="410.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Потоки даних і сховища активів</text>
<rect x="540.0" y="140.0" width="260.0" height="80.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="670.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Що може піти не так?</text>
<text x="670.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ідентифікація загроз: STRIDE</text>
<text x="670.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Дерева атак (Attack Trees)</text>
<rect x="270.0" y="265.0" width="280.0" height="75.0" rx="8" fill="#f0fbf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="410.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Що ми з цим робимо?</text>
<text x="410.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Контрзаходи: зменшити, усунути,</text>
<text x="410.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">передати або свідомо прийняти ризик</text>
<rect x="20.0" y="140.0" width="260.0" height="80.0" rx="8" fill="#fdf8ed" stroke="#d97706" stroke-width="1.8"/>
<text x="150.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">4. Чи добре впоралися?</text>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Валідація повноти, QA-тести,</text>
<text x="150.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ретроспектива та оновлення моделі</text>
