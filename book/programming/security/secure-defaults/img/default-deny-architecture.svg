<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр авторизації за принципом абсолютної заборони (Default Deny)</text>
<rect x="100.0" y="61.0" width="680.0" height="28.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Вхідний запит (Request: Суб'єкт, Дія, Об'єкт, Контекст оточення)</tspan></text>
<rect x="100.0" y="124.3" width="680.0" height="41.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">КРОК 1: Ініціалізація рішення за замовчуванням</tspan><tspan x="440.0" dy="14.3">Рішення = ЗАБОРОНЕНО (Explicit Deny Baseline, S = ⊥)</tspan></text>
<rect x="100.0" y="204.3" width="680.0" height="41.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="440.0" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">КРОК 2: Перевірка заборонних правил (Explicit Deny Rules)</tspan><tspan x="440.0" dy="14.3">Якщо знайдено хоча б одну пряму заборону → Негайне блокування</tspan></text>
<rect x="100.0" y="284.4" width="680.0" height="41.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">КРОК 3: Пошук однозначного явного дозволу (Explicit Allow Match)</tspan><tspan x="440.0" dy="14.3">Повне співпадіння прав + валідний підпис + успішна перевірка умов</tspan></text>
<rect x="70.0" y="382.2" width="340.0" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">ДОЗВІЛ (ALLOW)</tspan><tspan x="240.0" dy="14.3">Лише якщо є явний дозвіл,</tspan><tspan x="240.0" dy="14.3">немає заборон і збоїв</tspan></text>
<rect x="470.0" y="382.2" width="340.0" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">ЗАБОРОНА (DENY)</tspan><tspan x="640.0" dy="14.3">Немає дозволу / Помилка / Збій /</tspan><tspan x="640.0" dy="14.3">Невідоме правило / Таймаут</tspan></text>
<line x1="440.0" y1="96.0" x2="440.0" y2="122.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="168.0" x2="440.0" y2="202.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="248.0" x2="440.0" y2="282.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="328.0" x2="240.0" y2="380.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="328.0" x2="640.0" y2="380.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>