<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна й обережність: двері в один бік</text>
<rect x="40.0" y="60.0" width="200.0" height="104.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Запобіжники — назавжди</text>
<text x="140.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перепалив — назад не повернеш</text>
<rect x="300.0" y="60.0" width="200.0" height="104.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="400.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">Ключ — це все</text>
<text x="400.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">втратив чи виказав — лихо</text>
<rect x="560.0" y="60.0" width="200.0" height="104.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="660.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Плата за швидкість</text>
<text x="660.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">трохи складніше й повільніше</text>
<rect x="80.0" y="196.0" width="600.0" height="56.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="380.0" y="220.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Хобі-проєкт — зазвичай вимкнено; серійний виріб — увімкнено, але обережно.</tspan><tspan x="380.0" dy="14.3">Це інструмент готового продукту, а не першого знайомства з платою.</tspan></text>
</svg>