<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічне знищення даних та дешева ротація ключів</text>
<rect x="40.0" y="45.0" width="355.0" height="175.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="217.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Криптографічне стирання (Crypto-Shredding)</text>
<text x="217.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Знищення 256-бітного ключа KEK або DEK</text>
<rect x="62.0" y="113.5" width="310.0" height="43.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="217.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="217.0" dy="0.0">Петабайти шифротексту на диску</tspan><tspan x="217.0" dy="13.0">стають нерозрізненним шумом</tspan></text>
<text x="217.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Миттєве виконання GDPR Right to be Forgotten</text>
<rect x="425.0" y="45.0" width="355.0" height="175.0" rx="10" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.8"/>
<text x="602.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Безперервна ротація KEK (Re-wrapping)</text>
<text x="602.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Оновлення KEKv1 -&gt; KEKv2 у KMS</text>
<rect x="447.0" y="113.5" width="310.0" height="43.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="602.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="602.0" dy="0.0">Перешифровується лише 32 байти DEK,</tspan><tspan x="602.0" dy="13.0">самі гігабайти даних лишаються без змін</tspan></text>
<text x="602.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Нульовий оверхед на дискове I/O</text>
<text x="410.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвертна архітектура перетворює важкі операції з даними на легкі операції над ключами.</text>
</svg>