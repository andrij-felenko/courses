<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія ключів: Root Key -&gt; KEK -&gt; DEK -&gt; Дані</text>
<rect x="40.0" y="50.0" width="220.0" height="190.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний HSM</text>
<text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Апаратний корінь довіри</text>
<rect x="53.2" y="123.5" width="193.6" height="43.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Master / Root Key</tspan><tspan x="150.0" dy="13.0">(Незмінний апаратний корінь)</tspan></text>
<text x="150.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ключ не покидає чип</text>
<line x1="260.0" y1="145.0" x2="300.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">огортає</text>
<rect x="300.0" y="50.0" width="220.0" height="190.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="410.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6d1a" text-anchor="middle" font-weight="700">Сервіс KMS</text>
<text x="410.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Керування доступом та аудитом</text>
<rect x="315.0" y="123.5" width="190.0" height="43.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.5"/><text x="410.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">KEK (Key Encryption Key)</tspan><tspan x="410.0" dy="13.0">(Ключ шифрування ключів)</tspan></text>
<text x="410.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">Автоматична ротація</text>
<line x1="520.0" y1="145.0" x2="560.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">шифрує</text>
<rect x="560.0" y="50.0" width="220.0" height="190.0" rx="10" fill="#eaf6ec" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сховище / Додаток</text>
<text x="670.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидке локальне шифрування</text>
<rect x="570.1" y="108.5" width="199.8" height="43.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">DEK (Data Encryption Key)</tspan><tspan x="670.0" dy="13.0">(Унікальний для запису/файлу)</tspan></text>
<rect x="575.0" y="168.5" width="190.0" height="43.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Зашифроване тіло даних</tspan><tspan x="670.0" dy="13.0">(AES-256-GCM шифротекст)</tspan></text>
<rect x="60.0" y="255.0" width="700.0" height="48.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ієрархія розділяє обов'язки: KMS управляє та ротує KEK без передачі сирих ключів додатку,</tspan><tspan x="410.0" dy="13.0">а додаток локально шифрує гігабайти даних унікальним DEK без мережевих затримок на кожен блок.</tspan></text>
</svg>