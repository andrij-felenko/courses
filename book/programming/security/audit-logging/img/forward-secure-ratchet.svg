<text x="600.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">HMAC(K_3, R_3)</text>
<rect x="40.0" y="180.0" width="700.0" height="75.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="390.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія безпеки минулого (Forward Secrecy):</text>
<text x="390.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Ключі K_0, K_1, K_2 негайно затираються в ОЗП (Zeroization)</text>
<text x="390.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. Знаючи K_3, неможливо відновити K_2 чи K_1 (одностороння функція) — минуле захищено</text>
</svg>