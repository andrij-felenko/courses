<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель загроз компрометації журналу аудиту</text>
<rect x="25.0" y="30.0" width="345.0" height="255.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
<text x="197.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Локальний файл (Вразливо)</text>
<text x="197.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Звичайний текстовий лог на сервері</text>
<rect x="45.0" y="95.0" width="305.0" height="55.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="197.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер застосунку (App Server)</text>
<text x="197.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запис подій у локальний /var/log/audit.log</text>
<line x1="197.0" y1="155.0" x2="197.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.0" y="195.0" width="305.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="197.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зловмисник здобув права root</text>
<text x="197.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1. sed -i '/attacker/d' audit.log (стирання)</text>
<text x="197.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">2. Фальсифікація міток часу та дій</text>
<rect x="395.0" y="30.0" width="360.0" height="255.0" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="575.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Незмінний контур аудиту (WORM)</text>
<text x="575.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Криптографічний захист та ізоляція</text>
<rect x="415.0" y="95.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="575.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Агент аудиту (Forward-Secure)</text>
<text x="575.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Геш-ланцюг + знищення старих ключів</text>
<text x="575.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Потокова передача по TLS/mTLS</text>
<line x1="575.0" y1="160.0" x2="575.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="415.0" y="195.0" width="320.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="575.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ізольоване WORM-сховище / SIEM</text>
<text x="575.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Апаратна заборона перезапису (Object Lock)</text>
<text x="575.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Корінь Меркла публікується незалежно</text>
</svg>