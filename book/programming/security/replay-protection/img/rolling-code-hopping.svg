<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плаваючий код (Rolling Code) та вектор RollJam</text>
<rect x="40.0" y="50.0" width="200.0" height="110.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="140.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брелок (Transmitter)</text>
<text x="140.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Лічильник: C = 1042</text>
<text x="140.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шифрування: E_K(C, UID)</text>
<text x="140.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">C := C + 1 після кліку</text>
<line x1="245.0" y1="105.0" x2="510.0" y2="105.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Радіоканал (433.92 МГц)</text>
<text x="380.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зашифрований блок: 32 біти коду</text>
<rect x="515.0" y="50.0" width="210.0" height="110.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="620.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок авто (Receiver)</text>
<text x="620.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Останній валідний: C_rx = 1041</text>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розшифрування: D_K(пакет)</text>
<text x="620.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Вікно допуску: [C_rx+1 .. C_rx+256]</text>
<rect x="40.0" y="180.0" width="680.0" height="80.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вектор атаки перехоплення RollJam (глушіння + запис):</text>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зловмисник глушить приймач авто й записує код C_1042. Водій тисне вдруге: шпигун записує C_1043,</text>
<text x="380.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">але транслює в авто C_1042. Авто відмикається, а код C_1043 лишається свіжим і дійсним у руках шпигуна!</text>
</svg>