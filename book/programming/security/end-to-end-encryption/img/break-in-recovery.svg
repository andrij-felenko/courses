<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення після компрометації</text>
<rect x="30.0" y="20.0" width="700.0" height="230.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення після компрометації (Post-Compromise Security / Break-in Recovery)</text>
<rect x="50.0" y="65.0" width="190.0" height="130.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="145.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стан зламано</text>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зловмисник зняв дамп RAM:</text>
<text x="145.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">викрадено RK_0, CK_0, dh_priv</text>
<text x="145.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пасивне читання поточних даних</text>
<text x="145.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Минулі дані захищені (PFS)</text>
<line x1="245.0" y1="130.0" x2="285.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="65.0" width="180.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="380.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Крок DH-храповика</text>
<text x="380.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Аліса генерує нову пару:</text>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">(dh_priv_new, dh_pub_new)</text>
<text x="380.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Надсилає dh_pub_new Бобу</text>
<text x="380.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у заголовку повідомлення</text>
<line x1="475.0" y1="130.0" x2="515.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="65.0" width="190.0" height="130.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/>
<text x="615.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Секретність відновлено</text>
<text x="615.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Боб надсилає відповідь:</text>
<text x="615.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">новий спільний секрет DH</text>
<text x="615.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зловмисник не знає dh_priv_new</text>
<text x="615.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Майбутній трафік знову таємний</text>
<text x="380.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Злам пам'яті тимчасовий: один повноцінний обмін повідомленнями повертає абсолютну таємницю</text>
</svg>