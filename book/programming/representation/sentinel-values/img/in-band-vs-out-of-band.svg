<text x="290.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">−1 / 0xFF</text>
<text x="290.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">вартовий краде 1 стан</text>
<rect x="50.0" y="170.0" width="280.0" height="140.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/><text x="190.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Плюси:</tspan><tspan x="190.0" dy="15.6">• 0 байтів оверхеду пам'яті</tspan><tspan x="190.0" dy="15.6">• Працює у примітивних типах</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">Мінуси:</tspan><tspan x="190.0" dy="15.6">• Втрата валідного значення</tspan><tspan x="190.0" dy="15.6">• Можна забути перевірити (баг)</tspan><tspan x="190.0" dy="15.6">• Плутанина між даними й помилкою</tspan></text>
