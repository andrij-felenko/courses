<text x="620.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">усі 256/4G станів доступні</text>
<rect x="430.0" y="170.0" width="280.0" height="140.0" rx="6" fill="#f6fcf8" stroke="#27ae60" stroke-width="1.4"/><text x="570.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Плюси:</tspan><tspan x="570.0" dy="15.6">• Безпека на рівні типів</tspan><tspan x="570.0" dy="15.6">• Жодне число не втрачається</tspan><tspan x="570.0" dy="15.6">• Компілятор змушує перевіряти</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">Мінуси:</tspan><tspan x="570.0" dy="15.6">• Додаткова пам'ять (+паддінг)</tspan><tspan x="570.0" dy="15.6">• Потрібна підтримка мови / Option</tspan></text>
