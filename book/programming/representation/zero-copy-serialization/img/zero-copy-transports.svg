<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14.75 -10 994.75 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-14.75" y="-10" width="994.75" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системні механізми передачі даних без копіювання: mmap, Shm, RDMA</text>
<rect x="30.0" y="40.0" width="920.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="490.0" y="60.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Наскрізні канали Zero-Copy: усунення проміжних буферів ядра ОС та копіювань між процесами.</tspan><tspan x="490.0" dy="15.6">Дані кладуться в оперативну пам'ять один раз і читаються всіма споживачами на місці.</tspan></text>
<rect x="35.0" y="110.0" width="285.0" height="420.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="43.0" y="120.0" width="269.0" height="36.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="177.5" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">1. Файли: POSIX mmap</tspan></text>
<rect x="50.0" y="165.0" width="255.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="177.5" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Дисковий накопичувач</tspan><tspan x="177.5" dy="14.3">NVMe SSD / HDD</tspan></text>
<line x1="177.5" y1="218.0" x2="177.5" y2="233.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="235.0" width="255.0" height="52.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.1"/><text x="177.5" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Сторінковий кеш ОС</tspan><tspan x="177.5" dy="14.3">(Page Cache ядра)</tspan></text>
<line x1="177.5" y1="288.0" x2="177.5" y2="303.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="305.0" width="255.0" height="52.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.1"/><text x="177.5" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Таблиця сторінок MMU</tspan><tspan x="177.5" dy="14.3">віртуальний простір процесу</tspan></text>
<line x1="177.5" y1="358.0" x2="177.5" y2="373.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="375.0" width="255.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="177.5" y="397.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Прямий доступ CPU</tspan><tspan x="177.5" dy="14.3">без виклику read()</tspan></text>
<rect x="45.0" y="465.0" width="265.0" height="55.0" rx="6" fill="#eef4ff" stroke="#eef4ff" stroke-width="1.5"/><text x="177.5" y="495.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle"><tspan x="177.5" dy="0.0">ОС підвантажує сторінки за потребою (Page Fault); нуль копій у буфери користувача</tspan></text>
<rect x="345.0" y="110.0" width="285.0" height="420.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="353.0" y="120.0" width="269.0" height="36.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="487.5" dy="0.0">2. IPC: Shared Memory</tspan></text>
<rect x="360.0" y="165.0" width="255.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="487.5" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Процес-виробник</tspan><tspan x="487.5" dy="14.3">формує буфер у /dev/shm</tspan></text>
<line x1="487.5" y1="218.0" x2="487.5" y2="233.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="235.0" width="255.0" height="52.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.1"/><text x="487.5" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Спільні сторінки RAM</tspan><tspan x="487.5" dy="14.3">фізична пам'ять</tspan></text>
<line x1="487.5" y1="288.0" x2="487.5" y2="303.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="305.0" width="255.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="487.5" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Процес-споживач</tspan><tspan x="487.5" dy="14.3">відображає той самий буфер</tspan></text>
<line x1="487.5" y1="358.0" x2="487.5" y2="373.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="375.0" width="255.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="487.5" y="397.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Читання без IPC-копій</tspan><tspan x="487.5" dy="14.3">затримка &lt; 100 нс</tspan></text>
<rect x="355.0" y="465.0" width="265.0" height="55.0" rx="6" fill="#eaf7ef" stroke="#eaf7ef" stroke-width="1.5"/><text x="487.5" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="487.5" dy="0.0">Спільний адресний простір: виключає пересилання через сокети чи пайпи</tspan></text>
<rect x="655.0" y="110.0" width="290.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="663.0" y="120.0" width="274.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">3. Мережа: RDMA / Bypass</tspan></text>
<rect x="670.0" y="165.0" width="260.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.1"/><text x="800.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Мережева карта (NIC)</tspan><tspan x="800.0" dy="14.3">InfiniBand / RoCE</tspan></text>
<line x1="800.0" y1="218.0" x2="800.0" y2="233.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="235.0" width="260.0" height="52.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.1"/><text x="800.0" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Апаратний DMA через PCIe</tspan><tspan x="800.0" dy="14.3">просто в RAM користувача</tspan></text>
<line x1="800.0" y1="288.0" x2="800.0" y2="303.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="305.0" width="260.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="800.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Буфер користувача</tspan><tspan x="800.0" dy="14.3">оминаючи стек ядра (Bypass)</tspan></text>
<line x1="800.0" y1="358.0" x2="800.0" y2="373.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="375.0" width="260.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.1"/><text x="800.0" y="397.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Обробка повідомлення</tspan><tspan x="800.0" dy="14.3">час передачі ~ 1 мкс</tspan></text>
<rect x="665.0" y="465.0" width="270.0" height="55.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="800.0" y="495.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="800.0" dy="0.0">Kernel Bypass: мережева карта записує дані прямо в пам'ять програми</tspan></text>
</svg>