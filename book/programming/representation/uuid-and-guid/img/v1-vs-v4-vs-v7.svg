<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння бітового складу UUIDv1, UUIDv4 та UUIDv7</text>
<text x="410.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл 128 бітів у версіях UUIDv1, UUIDv4 та UUIDv7</text>
<rect x="30.0" y="60.0" width="110.0" height="56.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/><text x="85.0" y="84.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">UUIDv1</tspan><tspan x="85.0" dy="14.3">(Час + MAC)</tspan></text>
<rect x="150.0" y="60.0" width="240.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">60-бітний час (100 нс від 1582 року)</tspan></text>
<rect x="390.0" y="60.0" width="30.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="405.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">v1</tspan></text>
<rect x="420.0" y="60.0" width="110.0" height="56.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.4"/><text x="475.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">14-біт clk_seq</tspan></text>
<rect x="530.0" y="60.0" width="260.0" height="56.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.4"/><text x="660.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">48-бітний MAC-адрес (IEEE 802)</tspan></text>
<rect x="30.0" y="135.0" width="110.0" height="56.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/><text x="85.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">UUIDv4</tspan><tspan x="85.0" dy="14.3">(Випадковий)</tspan></text>
<rect x="150.0" y="135.0" width="320.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="310.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">48 бітів криптографічної ентропії (CSPRNG)</tspan></text>
<rect x="470.0" y="135.0" width="30.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="485.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">v4</tspan></text>
<rect x="500.0" y="135.0" width="12.0" height="56.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.4"/><text x="506.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="506.0" dy="0.0">var</tspan></text>
<rect x="512.0" y="135.0" width="278.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="651.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="651.0" dy="0.0">74 біти випадкової ентропії (разом: 122 біти)</tspan></text>
<rect x="30.0" y="210.0" width="110.0" height="56.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/><text x="85.0" y="235.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">UUIDv7</tspan><tspan x="85.0" dy="11.7">(Unix ms + Rand)</tspan></text>
<rect x="150.0" y="210.0" width="240.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">48-бітний Unix Epoch Timestamp (мілісекунди)</tspan></text>
<rect x="390.0" y="210.0" width="30.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="405.0" y="241.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">v7</tspan></text>
<rect x="420.0" y="210.0" width="70.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.4"/><text x="455.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">12 біт sub-ms</tspan></text>
<rect x="490.0" y="210.0" width="12.0" height="56.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.4"/><text x="496.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">var</tspan></text>
<rect x="502.0" y="210.0" width="288.0" height="56.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.4"/><text x="646.0" y="241.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="646.0" dy="0.0">62 біти випадкової ентропії (k-сортувальний)</tspan></text>
<rect x="30.0" y="290.0" width="760.0" height="75.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.3"/><text x="410.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">• UUIDv1: прив'язаний до заліза (MAC), видає фізичну адресу вузла й точний час;</tspan><tspan x="410.0" dy="14.3">• UUIDv4: 122 випадкові біти, не розкриває залізо, але хаотичний для B-дерев;</tspan><tspan x="410.0" dy="14.3">• UUIDv7: 48 бітів Unix ms + 74 біти ентропії — монотонний у часі та дружній до БД.</tspan></text>
</svg>