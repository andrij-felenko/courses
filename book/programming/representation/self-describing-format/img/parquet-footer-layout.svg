<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1052 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1052" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колонкове збереження Parquet: метадані у футері та оптимізації</text>
<rect x="40.0" y="60.0" width="440.0" height="30.0" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="260.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Початок файлу: 4 байти Magic 'PAR1'</tspan></text>
<rect x="40.0" y="100.0" width="440.0" height="135.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="260.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Row Group #1 (наприклад, 1 000 000 рядків)</text>
<rect x="50.0" y="130.0" width="130.0" height="95.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">ColumnChunk 1</tspan><tspan x="115.0" dy="13.0">(user_id)</tspan><tspan x="115.0" dy="13.0">Dict Page</tspan><tspan x="115.0" dy="13.0">Data Pages</tspan></text>
<rect x="190.0" y="130.0" width="130.0" height="95.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">ColumnChunk 2</tspan><tspan x="255.0" dy="13.0">(timestamp)</tspan><tspan x="255.0" dy="13.0">Data Pages</tspan><tspan x="255.0" dy="13.0">Snappy/Zstd</tspan></text>
<rect x="330.0" y="130.0" width="140.0" height="95.0" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/><text x="400.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ColumnChunk 3</tspan><tspan x="400.0" dy="13.0">(payload_json)</tspan><tspan x="400.0" dy="13.0">Data Pages</tspan><tspan x="400.0" dy="13.0">Snappy/Zstd</tspan></text>
<rect x="40.0" y="245.0" width="440.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="260.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Row Group #2 ... #N</text>
<rect x="40.0" y="285.0" width="440.0" height="160.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.0"/>
<text x="260.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d6608" text-anchor="middle" font-weight="700">ФУТЕР ФАЙЛУ: FileMetaData (Thrift)</text>
<rect x="50.0" y="318.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#f1c40f" stroke-width="1.5"/><text x="260.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Дерево схеми: SchemaElement (типи, вкладення, repetition)</tspan></text>
<rect x="50.0" y="360.0" width="420.0" height="45.0" rx="6" fill="#ffffff" stroke="#f1c40f" stroke-width="1.5"/><text x="260.0" y="379.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Метадані груп: зміщення чанків, розміри, кодеки, словники;</tspan><tspan x="260.0" dy="13.0">Статистика чанків: min / max значення, null_count</tspan></text>
<rect x="50.0" y="410.0" width="205.0" height="28.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="152.5" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Footer Length (4 байти uint32)</tspan></text>
<rect x="265.0" y="410.0" width="205.0" height="28.0" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="367.5" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="367.5" dy="0.0">Magic 'PAR1' (4 байти)</tspan></text>
<rect x="530.0" y="60.0" width="410.0" height="385.0" rx="8" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="735.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізації завдяки футеру метаданих</text>
<rect x="545.0" y="105.0" width="380.0" height="45.0" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/><text x="735.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Крок 1. Зчитування кінця файлу</tspan><tspan x="735.0" dy="11.7">Читаємо останні 4–512 КБ: беремо довжину футера й розбираємо FileMetaData.</tspan></text>
<rect x="545.0" y="160.0" width="380.0" height="80.0" rx="6" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/><text x="735.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Проекція колонок (Column Projection):</tspan><tspan x="735.0" dy="14.3">Запит: SELECT user_id FROM t</tspan><tspan x="735.0" dy="14.3">Читаються байти ТІЛЬКИ ColumnChunk 1.</tspan><tspan x="735.0" dy="14.3">ColumnChunk 3 (великий JSON) не торкається на диску!</tspan></text>
<rect x="545.0" y="250.0" width="380.0" height="85.0" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/><text x="735.0" y="276.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Проштовхування предикатів (Predicate Pushdown):</tspan><tspan x="735.0" dy="13.0">Запит: WHERE timestamp &gt;= 2026-08-01</tspan><tspan x="735.0" dy="13.0">Якщо в статистиці чанка max &lt; 2026-08-01, уся</tspan><tspan x="735.0" dy="13.0">група рядків (мільйон рядків) пропускається без дискового I/O!</tspan></text>
<rect x="545.0" y="345.0" width="380.0" height="85.0" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.5"/><text x="735.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Чому футер, а не заголовок?</tspan><tspan x="735.0" dy="11.7">Під час запису точні зміщення, розміри після стиснення та min/max статистика стають відомі лише ПІСЛЯ завершення запису всіх рядків.</tspan></text>
<line x1="480.0" y1="360.0" x2="530.0" y2="125.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>