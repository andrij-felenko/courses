<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція даних: узгодження схеми записувача і зчитувача</text>
<rect x="30.0" y="65.0" width="270.0" height="160.0" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="165.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Схема записувача (Writer Schema)</tspan><tspan x="165.0" dy="14.3">[вбудована всередині старого файлу]</tspan><tspan x="165.0" dy="14.3">{</tspan><tspan x="165.0" dy="14.3">  &quot;id&quot;: int,</tspan><tspan x="165.0" dy="14.3">  &quot;username&quot;: string,</tspan><tspan x="165.0" dy="14.3">  &quot;legacy_status&quot;: int</tspan><tspan x="165.0" dy="14.3">}</tspan></text>
<rect x="660.0" y="65.0" width="270.0" height="160.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Схема зчитувача (Reader Schema)</tspan><tspan x="795.0" dy="11.7">[скомпільована в поточному коді]</tspan><tspan x="795.0" dy="11.7">{</tspan><tspan x="795.0" dy="11.7">  &quot;id&quot;: long,           // тип розширено</tspan><tspan x="795.0" dy="11.7">  &quot;username&quot;: string,</tspan><tspan x="795.0" dy="11.7">  &quot;email&quot;: string = &quot;&quot; // нове поле з дефолтом</tspan><tspan x="795.0" dy="11.7">}</tspan></text>
<rect x="340.0" y="65.0" width="280.0" height="240.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="2.0"/>
<text x="480.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рушій зіставлення (Resolver)</text>
<rect x="350.0" y="105.0" width="260.0" height="36.0" rx="6" fill="#f4f6f7" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">1. Збіг полів за іменами / аліасами</tspan></text>
<rect x="350.0" y="145.0" width="260.0" height="36.0" rx="6" fill="#f4f6f7" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Просування типів (int → long)</tspan></text>
<rect x="350.0" y="185.0" width="260.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">3. Нове поле в Reader:</tspan><tspan x="480.0" dy="13.0">підставляється default (&quot;&quot;)</tspan></text>
<rect x="350.0" y="240.0" width="260.0" height="50.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">4. Видалене поле з Writer:</tspan><tspan x="480.0" dy="13.0">legacy_status пропускається парсером</tspan></text>
<line x1="300.0" y1="145.0" x2="340.0" y2="145.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="145.0" x2="620.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="335.0" width="500.0" height="95.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="480.0" y="364.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Результуючий об'єкт у пам'яті застосунку:</tspan><tspan x="480.0" dy="14.3">User { id: 42L, username: &quot;alice&quot;, email: &quot;&quot; }</tspan><tspan x="480.0" dy="14.3">✓ Старий файл успішно прочитано новим кодом без міграції бази даних!</tspan><tspan x="480.0" dy="14.3">Якщо поле відсутнє і не має default → SchemaResolutionException.</tspan></text>
<line x1="480.0" y1="305.0" x2="480.0" y2="335.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>