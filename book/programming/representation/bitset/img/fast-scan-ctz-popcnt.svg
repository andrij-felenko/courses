<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 361.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="361.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне сканування бітів: POPCNT, CTZ та пропуск нулів</text>
<rect x="30.0" y="60.0" width="335.0" height="125.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="197.5" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">Потужність множини  |S|</tspan><tspan x="197.5" dy="15.6"></tspan><tspan x="197.5" dy="15.6">POPCNT / __builtin_popcountll</tspan><tspan x="197.5" dy="15.6"></tspan><tspan x="197.5" dy="15.6">Рахує кількість піднятих бітів за 1 такт.</tspan><tspan x="197.5" dy="15.6">Замінює повільний цикл перевірки 64 бітів.</tspan></text>
<rect x="395.0" y="60.0" width="335.0" height="125.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="562.5" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="562.5" dy="0.0">Пошук найменшого елемента</tspan><tspan x="562.5" dy="15.6"></tspan><tspan x="562.5" dy="15.6">CTZ / TZCNT / __builtin_ctzll</tspan><tspan x="562.5" dy="15.6"></tspan><tspan x="562.5" dy="15.6">Рахує нулі праворуч до першої «1».</tspan><tspan x="562.5" dy="15.6">Миттєво дає точний індекс молодшого біта.</tspan></text>
<rect x="30.0" y="200.0" width="700.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Швидка ітерація по встановлених бітах через скидання молодшого розряду:</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">while (word != 0) {</tspan><tspan x="380.0" dy="14.3">    int bit = __builtin_ctzll(word);   // Знаходимо найменший елемент за 1 інструкцію</tspan><tspan x="380.0" dy="14.3">    emit(base + bit);                  // Опрацьовуємо знайдений елемент</tspan><tspan x="380.0" dy="14.3">    word &amp;= (word - 1);                // Скидаємо молодшу «1» (трюк Кернігана)</tspan><tspan x="380.0" dy="14.3">}</tspan></text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Складність ітерації O(K), де K — кількість елементів, а не довжина всього масиву O(N)</text>
</svg>