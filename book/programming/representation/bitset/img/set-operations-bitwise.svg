<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоморфізм операцій над множинами та побітових інструкцій ЦП</text>
<text x="160.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операція над множинами</text>
<text x="370.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побітова дія</text>
<text x="570.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машинна інструкція</text>
<line x1="30.0" y1="74.0" x2="730.0" y2="74.0" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="86.0" width="700.0" height="38.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A ∩ B  (Перетин)</text>
<text x="370.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A &amp; B  (Побітове І)</text>
<text x="570.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">AND  (x86 / ARM) / VPAND (AVX2)</text>
<rect x="30.0" y="132.0" width="700.0" height="38.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A ∪ B  (Об'єднання)</text>
<text x="370.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A | B  (Побітове АБО)</text>
<text x="570.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">OR   (x86 / ARM) / VPOR (AVX2)</text>
<rect x="30.0" y="178.0" width="700.0" height="38.0" rx="4" fill="#fbf3eb" stroke="#d35400" stroke-width="1.2"/>
<text x="160.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A △ B  (Сим. різниця)</text>
<text x="370.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A ^ B  (Побітове XOR)</text>
<text x="570.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">XOR  (x86 / ARM) / VPXOR (AVX2)</text>
<rect x="30.0" y="224.0" width="700.0" height="38.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="160.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A \ B  (Різниця)</text>
<text x="370.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A &amp; ~B (Побітове AND-NOT)</text>
<text x="570.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ANDN (x86 BMI1) / BIC (ARM)</text>
<rect x="30.0" y="270.0" width="700.0" height="38.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="160.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">U \ A  (Доповнення)</text>
<text x="370.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">~A     (Побітове НЕ)</text>
<text x="570.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">NOT  (x86 / ARM)</text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Одна 64-бітна інструкція обчислює дію для 64 елементів множини одночасно за 1 такт</text>
</svg>