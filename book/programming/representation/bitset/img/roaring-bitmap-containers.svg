<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева архітектура та типи контейнерів Roaring Bitmaps</text>
<rect x="140.0" y="50.0" width="240.0" height="36.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="260.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Старші 16 бітів (Ключ чанка)</text>
<rect x="380.0" y="50.0" width="240.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="500.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Молодші 16 бітів (0 … 65535)</text>
<line x1="380.0" y1="90.0" x2="380.0" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="120.0" width="220.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="140.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Array Container</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Кількість: &lt; 4096 елементів</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Формат: відсортований масив uint16_t</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Пам'ять: cardinality × 2 байти</tspan><tspan x="140.0" dy="11.7">(від 2 байтів до 8 КБ)</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Ідеально для розріджених даних</tspan></text>
<rect x="270.0" y="120.0" width="220.0" height="195.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="380.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Bitmap Container</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Кількість: 4096 … 61440</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Формат: фіксований бітсет</tspan><tspan x="380.0" dy="14.3">1024 × uint64_t = 65536 біт</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Пам'ять: рівно 8192 байти (8 КБ)</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Ідеально для щільних даних</tspan></text>
<rect x="510.0" y="120.0" width="220.0" height="195.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="620.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Run Container (RLE)</tspan><tspan x="620.0" dy="13.0"></tspan><tspan x="620.0" dy="13.0">Кількість: довгі серії</tspan><tspan x="620.0" dy="13.0"></tspan><tspan x="620.0" dy="13.0">Формат: масив пар</tspan><tspan x="620.0" dy="13.0">[start, length] (uint16_t)</tspan><tspan x="620.0" dy="13.0"></tspan><tspan x="620.0" dy="13.0">Пам'ять: 4 байти на відрізок</tspan><tspan x="620.0" dy="13.0"></tspan><tspan x="620.0" dy="13.0">Ідеально для неперервних діапазонів</tspan></text>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Порогове значення 4096: 4096 × 2 B = 8192 B — момент, коли масив стає більшим за бітсет</text>
</svg>