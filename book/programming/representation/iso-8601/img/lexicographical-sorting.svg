<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лексикографічне сортування: побайтовий та хронологічний порядок</text>
<rect x="30.0" y="48.0" width="900.0" height="70.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="480.0" y="79.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Спадання ваги розряду зліва направо (Big-Endian ієрархія):</tspan><tspan x="480.0" dy="16.9">Рік (YYYY)  →  Місяць (MM)  →  День (DD)  →  Година (hh)  →  Хвилина (mm)  →  Секунда (ss)</tspan></text>
<rect x="30.0" y="136.0" width="435.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="247.5" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Традиційні формати: Сортування ламається</tspan><tspan x="247.5" dy="15.6"></tspan><tspan x="247.5" dy="15.6">Little-Endian (DD/MM/YYYY) — лексикографічний порядок:</tspan><tspan x="247.5" dy="15.6">✖ 01/12/2025  (Грудень 2025)</tspan><tspan x="247.5" dy="15.6">✖ 02/01/2020  (Січень 2020 — виявився пізнішим!)</tspan><tspan x="247.5" dy="15.6">✖ 15/05/2024  (Травень 2024)</tspan><tspan x="247.5" dy="15.6"></tspan><tspan x="247.5" dy="15.6">Алфавітне сортування strcmp() не збігається з часом!</tspan></text>
<rect x="495.0" y="136.0" width="435.0" height="170.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="712.5" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">ISO 8601: Лексикографічний порядок == Часовий</tspan><tspan x="712.5" dy="15.6"></tspan><tspan x="712.5" dy="15.6">Big-Endian (YYYY-MM-DD) — лексикографічний порядок:</tspan><tspan x="712.5" dy="15.6">✓ 2020-01-02  (Найраніша дата)</tspan><tspan x="712.5" dy="15.6">✓ 2024-05-15  (Проміжна дата)</tspan><tspan x="712.5" dy="15.6">✓ 2025-12-01  (Найпізніша дата)</tspan><tspan x="712.5" dy="15.6"></tspan><tspan x="712.5" dy="15.6">Побайтове порівняння memcmp() точно впорядковує час.</tspan></text>
<rect x="30.0" y="324.0" width="900.0" height="108.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.6"/><text x="480.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Пастка зміщень часових поясів (Timezone Offset Pitfall)</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">«2026-08-20T22:00:00+03:00»  та  «2026-08-20T19:00:00Z» — це одна й та сама мить часу,</tspan><tspan x="480.0" dy="15.6">але лексикографічно «2026-08-20T19...» &lt; «2026-08-20T22...» через різницю цифр годин.</tspan><tspan x="480.0" dy="15.6">Правило для індексації та сортування: перед збереженням нормалізувати всі мітки до UTC (Z)!</tspan></text>
</svg>