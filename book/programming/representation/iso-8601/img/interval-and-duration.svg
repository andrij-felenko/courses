<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подання часових інтервалів та тривалостей в ISO 8601</text>
<rect x="30.0" y="48.0" width="435.0" height="96.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="247.5" y="76.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">1. Початок / Кінець (Start / End)</tspan><tspan x="247.5" dy="15.6"></tspan><tspan x="247.5" dy="15.6">2026-08-20T09:00:00Z / 2026-08-20T18:00:00Z</tspan><tspan x="247.5" dy="15.6">Повністю фіксований проміжок між двома митями.</tspan></text>
<rect x="495.0" y="48.0" width="435.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="712.5" y="76.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">2. Початок / Тривалість (Start / Duration)</tspan><tspan x="712.5" dy="15.6"></tspan><tspan x="712.5" dy="15.6">2026-08-20T09:00:00Z / PT9H</tspan><tspan x="712.5" dy="15.6">Подія з відомим стартом і тривалістю 9 годин.</tspan></text>
<rect x="30.0" y="160.0" width="435.0" height="96.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.6"/><text x="247.5" y="188.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">3. Тривалість / Кінець (Duration / End)</tspan><tspan x="247.5" dy="15.6"></tspan><tspan x="247.5" dy="15.6">PT9H / 2026-08-20T18:00:00Z</tspan><tspan x="247.5" dy="15.6">Дедлайн: 9-годинний таймер із завершенням о 18:00.</tspan></text>
<rect x="495.0" y="160.0" width="435.0" height="96.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/><text x="712.5" y="188.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">4. Тільки тривалість (Duration Only)</tspan><tspan x="712.5" dy="15.6"></tspan><tspan x="712.5" dy="15.6">P1Y2M10DT2H30M  або  P3W (3 тижні)</tspan><tspan x="712.5" dy="15.6">Абстрактний відрізок без прив'язки до дати.</tspan></text>
<rect x="30.0" y="274.0" width="900.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Анатомія тривалості ISO 8601: P [n]Y [n]M [n]D T [n]H [n]M [n]S</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">• P (Period) — позначає початок тривалості</tspan><tspan x="480.0" dy="15.6">• M після P = Місяці (Months);  M після T = Хвилини (Minutes)</tspan><tspan x="480.0" dy="15.6">• W (Week) — окремий формат для тижнів (наприклад, P4W)</tspan></text>
<rect x="30.0" y="374.0" width="900.0" height="80.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="480.0" y="394.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Повторювані інтервали (Recurring Intervals): R [n] / [інтервал]</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">• R5 / 2026-08-20T08:00:00Z / PT1H — 5 повторів щогодини від 08:00 UTC</tspan><tspan x="480.0" dy="15.6">• R / PT15M — нескінченний цикл опитування кожні 15 хвилин</tspan></text>
</svg>