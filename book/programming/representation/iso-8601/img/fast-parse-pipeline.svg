<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр побайтового парсингу ISO 8601 без динамічних алокацій</text>
<rect x="30.0" y="48.0" width="900.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="480.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Вхідний рядок: &quot;2026-08-20T22:30:15Z&quot; (довжина 20 байтів, нуль динамічних алокацій)</tspan></text>
<rect x="30.0" y="118.0" width="205.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="132.5" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">1. Перевірка міток</tspan><tspan x="132.5" dy="15.6"></tspan><tspan x="132.5" dy="15.6">Перевірка розділювачів</tspan><tspan x="132.5" dy="15.6">за фіксованими індексами:</tspan><tspan x="132.5" dy="15.6">s[4]  == '-'</tspan><tspan x="132.5" dy="15.6">s[7]  == '-'</tspan><tspan x="132.5" dy="15.6">s[10] == 'T' || ' '</tspan><tspan x="132.5" dy="15.6">s[13] == ':'</tspan><tspan x="132.5" dy="15.6">s[16] == ':'</tspan></text>
<rect x="255.0" y="118.0" width="215.0" height="175.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="362.5" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">2. Швидке множення</tspan><tspan x="362.5" dy="15.6"></tspan><tspan x="362.5" dy="15.6">Дві цифри за операцію:</tspan><tspan x="362.5" dy="15.6">val = s[0]*10 + s[1] - 528</tspan><tspan x="362.5" dy="15.6"></tspan><tspan x="362.5" dy="15.6">Чотири цифри року:</tspan><tspan x="362.5" dy="15.6">Y = (s[0]*1000 + s[1]*100</tspan><tspan x="362.5" dy="15.6">   + s[2]*10 + s[3]) - 53328</tspan><tspan x="362.5" dy="15.6">Без виклику atoi / sscanf!</tspan></text>
<rect x="490.0" y="118.0" width="215.0" height="175.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.6"/><text x="597.5" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">3. Перевірка меж</tspan><tspan x="597.5" dy="15.6"></tspan><tspan x="597.5" dy="15.6">Контроль діапазонів:</tspan><tspan x="597.5" dy="15.6">• Місяць: 1 &lt;= M &lt;= 12</tspan><tspan x="597.5" dy="15.6">• День: 1 &lt;= D &lt;= days_in_m</tspan><tspan x="597.5" dy="15.6">• Година: 0 &lt;= h &lt;= 23</tspan><tspan x="597.5" dy="15.6">• Хвилина: 0 &lt;= m &lt;= 59</tspan><tspan x="597.5" dy="15.6">• Секунда: 0 &lt;= s &lt;= 60</tspan></text>
<rect x="725.0" y="118.0" width="205.0" height="175.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/><text x="827.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">4. Зміщення UTC</tspan><tspan x="827.5" dy="14.3"></tspan><tspan x="827.5" dy="14.3">Обробка суфікса:</tspan><tspan x="827.5" dy="14.3">• 'Z' → offset = 0 хв</tspan><tspan x="827.5" dy="14.3">• '+hh:mm' → + (h*60+m)</tspan><tspan x="827.5" dy="14.3">• '-hh:mm' → - (h*60+m)</tspan><tspan x="827.5" dy="14.3"></tspan><tspan x="827.5" dy="14.3">Unix epoch seconds = </tspan><tspan x="827.5" dy="14.3">days_from_civil(Y,M,D)*86400</tspan><tspan x="827.5" dy="14.3">+ h*3600 + m*60 + s - off</tspan></text>
<rect x="30.0" y="310.0" width="900.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="480.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Результат конвеєра: struct tm / unix_timestamp_ns без звернення до купи (Heap)</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">• Продуктивність: ~10-25 наносекунд на мітку часу на сучасному CPU</tspan><tspan x="480.0" dy="15.6">• Відсутність фрагментації пам'яті та тиску на GC (у Go / Java / Node.js)</tspan><tspan x="480.0" dy="15.6">• Прогнозований час виконання для високочастотного трейдингу, HFT та IoT</tspan></text>
</svg>