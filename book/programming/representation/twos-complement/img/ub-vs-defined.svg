<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головна відмінність у коді: знакове переповнення — UB, беззнакове — визначене</text>
<line x1="360.0" y1="44.0" x2="360.0" y2="284.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗНАКОВЕ переповнення</text>
<rect x="30.0" y="80.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="180.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">INT_MAX + 1  →  невизначена</tspan><tspan x="180.0" dy="15.6">поведінка (UB)</tspan></text>
<text x="180.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">стандарт НЕ обіцяє нічого:</tspan><tspan x="180.0" dy="14.9">компілятор має право</tspan><tspan x="180.0" dy="14.9">викинути перевірку, зламати логіку</tspan></text>
<text x="180.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">≈ 90% таких переповнень —</text>
<text x="180.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">це справжня помилка</text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">БЕЗЗНАКОВЕ переповнення</text>
<rect x="390.0" y="80.0" width="300.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="540.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">UINT_MAX + 1  =  0</tspan><tspan x="540.0" dy="15.6">чесний залишок mod 2ⁿ</tspan></text>
<text x="540.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">поведінка ГАРАНТОВАНА:</tspan><tspan x="540.0" dy="14.9">коло замикається в нуль,</tspan><tspan x="540.0" dy="14.9">на це можна покладатися</tspan></text>
<text x="540.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лічильники, геш, різниця часу —</text>
<text x="540.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">wrap тут навмисний</text>
<text x="360.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">C++20/C23 закріпили доповняльний код — але знакове переповнення лишили UB</text>
</svg>