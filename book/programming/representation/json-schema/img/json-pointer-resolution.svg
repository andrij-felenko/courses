<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="330.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="30.0" y="45.0" width="415.0" height="290.0" rx="6" fill="#ffffff" stroke="#c8d1dc" stroke-width="1.2"/>
<text x="237.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коренева схема ($id: https://api.org/order.json)</text>
<rect x="45.0" y="88.0" width="385.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="237.5" dy="0.0">&quot;$defs&quot;: {</tspan><tspan x="237.5" dy="13.0">  &quot;Address&quot;: { &quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: { ... } },</tspan><tspan x="237.5" dy="13.0">  &quot;UUID&quot;: { &quot;type&quot;: &quot;string&quot;, &quot;format&quot;: &quot;uuid&quot; }</tspan><tspan x="237.5" dy="13.0">}</tspan></text>
<rect x="45.0" y="155.0" width="385.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.5" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="237.5" dy="0.0">&quot;properties&quot;: {</tspan><tspan x="237.5" dy="13.0">  &quot;order_id&quot;: { &quot;$ref&quot;: &quot;#/$defs/UUID&quot; },</tspan><tspan x="237.5" dy="13.0">  &quot;shipping&quot;: { &quot;$ref&quot;: &quot;#/$defs/Address&quot; },</tspan><tspan x="237.5" dy="13.0">  &quot;billing&quot;:  { &quot;$ref&quot;: &quot;https://schemas.org/address.json&quot; }</tspan><tspan x="237.5" dy="13.0">}</tspan></text>
<rect x="45.0" y="235.0" width="385.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.5" y="258.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="237.5" dy="0.0">Синтаксис JSON Pointer (RFC 6901):</tspan><tspan x="237.5" dy="11.7">• '#' позначає фрагмент URI всередині документа</tspan><tspan x="237.5" dy="11.7">• Роздільник '/' переходить на один рівень ключа чи індексу</tspan><tspan x="237.5" dy="11.7">• Ескейп: '~1' кодує '/', а '~0' кодує '~'</tspan><tspan x="237.5" dy="11.7">• Приклад: &quot;#/$defs/Address/properties/street&quot;</tspan></text>
<line x1="445.0" y1="175.0" x2="485.0" y2="125.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="445.0" y1="205.0" x2="485.0" y2="255.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490.0" y="45.0" width="420.0" height="140.0" rx="6" fill="#ffffff" stroke="#c8d1dc" stroke-width="1.2"/>
<text x="700.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Локальна інтра-документна резолюція (#/...)</text>
<rect x="505.0" y="88.0" width="390.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Базовий URI: https://api.org/order.json</tspan><tspan x="700.0" dy="13.0">2. Обхід AST дерева за токенами [&quot;$defs&quot;, &quot;UUID&quot;]</tspan><tspan x="700.0" dy="13.0">3. Вузол зв'язується в пам'яті за O(1) без мережі</tspan><tspan x="700.0" dy="13.0">4. Вказівник кешується у таблиці символів валідатора</tspan></text>
<rect x="490.0" y="195.0" width="420.0" height="140.0" rx="6" fill="#ffffff" stroke="#c8d1dc" stroke-width="1.2"/>
<text x="700.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зовнішня міждокументна резолюція (URI)</text>
<rect x="505.0" y="238.0" width="390.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="264.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Нормалізація абсолютного URI за RFC 3986</tspan><tspan x="700.0" dy="13.0">2. Пошук у локальному реєстрі скомпільованих схем</tspan><tspan x="700.0" dy="13.0">3. Якщо схема відсутня: блокування або Schema Loader</tspan><tspan x="700.0" dy="13.0">4. Захист від SSRF через заборону неперевірених хостів</tspan></text>
</svg>