<rect x="60.0" y="125.0" width="160.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">allOf (Кон'юнкція)</tspan><tspan x="140.0" dy="11.7">∀ S_i: Valid(S_i) = true</tspan></text>
<rect x="280.0" y="125.0" width="160.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">anyOf (Диз'юнкція)</tspan><tspan x="360.0" dy="11.7">∃ S_i: Valid(S_i) = true</tspan></text>
<rect x="500.0" y="125.0" width="160.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">oneOf (XOR)</tspan><tspan x="580.0" dy="14.3">∑ [Valid(S_i)] == 1</tspan></text>
<rect x="720.0" y="125.0" width="160.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">if / then / else</tspan><tspan x="800.0" dy="14.3">Умовна валідація</tspan></text>
