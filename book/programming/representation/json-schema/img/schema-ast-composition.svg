<line x1="520.0" y1="83.0" x2="800.0" y2="125.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="45.0" y="195.0" width="190.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Перетин обмежень:</tspan><tspan x="140.0" dy="13.0">• Зупинка на першій</tspan><tspan x="140.0" dy="13.0">  помилці (fail-fast)</tspan><tspan x="140.0" dy="13.0">• Без повернення назад</tspan><tspan x="140.0" dy="13.0">• Складність: O(∑ T(S_i))</tspan></text>
<rect x="265.0" y="195.0" width="190.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Швидкий вихід:</tspan><tspan x="360.0" dy="13.0">• Зупинка на першому</tspan><tspan x="360.0" dy="13.0">  успіху</tspan><tspan x="360.0" dy="13.0">• Помилка якщо всі S_i хибні</tspan><tspan x="360.0" dy="13.0">• Складність: O(k · T(S_i))</tspan></text>
<rect x="485.0" y="195.0" width="190.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="580.0" dy="0.0">Вичерпна перевірка:</tspan><tspan x="580.0" dy="13.0">• Обов'язковий прохід ВСІХ</tspan><tspan x="580.0" dy="13.0">  гілок S_i</tspan><tspan x="580.0" dy="13.0">• Немає fail-fast!</tspan><tspan x="580.0" dy="13.0">• Ризик вибуху складності</tspan></text>
<rect x="705.0" y="195.0" width="190.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="243.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Умовне розгалуження:</tspan><tspan x="800.0" dy="11.7">• Обчислення предикату 'if'</tspan><tspan x="800.0" dy="11.7">• Якщо 'if' true → перевірка 'then'</tspan><tspan x="800.0" dy="11.7">• Якщо 'if' false → перевірка 'else'</tspan></text>
