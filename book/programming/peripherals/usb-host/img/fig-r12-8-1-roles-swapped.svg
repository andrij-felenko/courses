<text x="189.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle">відповідь</text>
<rect x="20.0" y="215.0" width="370.0" height="56.0" rx="6" fill="#fef9ec" stroke="#e67e22" stroke-width="1.0"/><text x="205.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Простіше: прошивка реактивна</tspan><tspan x="205.0" dy="15.6">Мало коду, без арбітражу, без живлення VBUS</tspan></text>
