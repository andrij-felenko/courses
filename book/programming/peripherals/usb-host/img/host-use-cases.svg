<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найчастіші причини зробити МК хостом</text>
<rect x="315.0" y="114.8" width="130.0" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="380.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">МК</tspan><tspan x="380.0" dy="18.2">host</tspan><tspan x="380.0" dy="18.2">(S2 / S3)</tspan></text>
<rect x="75.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="150.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">USB-флешка</tspan><tspan x="150.0" dy="16.9">клас MSC</tspan></text>
<line x1="310.0" y1="150.0" x2="232.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">логи на знімний носій,</tspan><tspan x="150.0" dy="14.3">оновлення без програматора</tspan></text>
<rect x="535.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="610.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">USB-клавіатура</tspan><tspan x="610.0" dy="16.9">клас HID</tspan></text>
<line x1="450.0" y1="150.0" x2="528.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">ввід команд</tspan><tspan x="610.0" dy="14.3">без матриці кнопок</tspan></text>
<rect x="120.0" y="268.0" width="520.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="380.0" dy="0.0">В обох випадках МК мусить подати на порт 5 В VBUS,</tspan><tspan x="380.0" dy="15.6">а сам живиться від 3.3 В — тож потрібне зовнішнє джерело й ключ.</tspan></text>
