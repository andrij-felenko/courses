<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контакт ID задає роль до першого біта даних</text>
<rect x="60.0" y="64.0" width="300.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">micro-B: ID висить</text>
<text x="210.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ID ──/  (не підключено)</text>
<text x="210.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">контролер: лишаюсь</text>
<text x="210.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ПРИСТРОЄМ</text>
<text x="210.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">VBUS бере ззовні</text>
<rect x="400.0" y="64.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="550.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">micro-A (OTG-кабель)</text>
<text x="550.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ID ──● GND  (замкнуто)</text>
<text x="550.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">контролер: стаю</text>
<text x="550.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">HOST</text>
<text x="550.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">зобов'язаний дати VBUS</text>
<text x="380.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять контактів micro-USB:</text>
<circle cx="200.0" cy="270.0" r="16.0" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">VBUS</text>
<circle cx="290.0" cy="270.0" r="16.0" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="290.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">D−</text>
<circle cx="380.0" cy="270.0" r="16.0" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">D+</text>
<circle cx="470.0" cy="270.0" r="16.0" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="470.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ID</text>
<circle cx="560.0" cy="270.0" r="16.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="560.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND</text>
<rect x="60.0" y="312.0" width="640.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">На USB-C тієї самої ролі досягають резистори CC, але ідея та сама: статичний сигнал каже контролеру, хто головний.</tspan></text>
</svg>