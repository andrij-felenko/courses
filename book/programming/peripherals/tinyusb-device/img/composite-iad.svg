<rect x="410.0" y="200.0" width="284.0" height="26.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="552.0" y="216.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="552.0" dy="0.0">Interface 2: HID (окрема функція)</tspan></text>
