<text x="188.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">Хост не знає, що Interface 0 і 1 —</tspan><tspan x="188.0" dy="14.9">один CDC. Бере їх за різні пристрої</tspan><tspan x="188.0" dy="14.9">або вантажить не той драйвер.</tspan></text>
