<text x="594.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.0" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дані (у QSPI — одна з 4 ліній)</text>
<rect x="60.0" y="372.0" width="780.0" height="60.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.0" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">QSPI: чотири лінії даних IO0–IO3 працюють разом — учетверо більше бітів за такт, ніж проста SPI з однією лінією.</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Плюс CE# (вибір чипа), SCLK (такт), VCC = 3.3 В і GND. Це та сама вісімка ніжок, що в SPI-флеші поруч.</text>
<rect x="60.0" y="442.0" width="780.0" height="64.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На готовому модулі PSRAM і Flash часто сидять на СПІЛЬНИХ лініях CLK/IO, а розрізняє їх лише окремий CE#:</text>
<text x="450.0" y="488.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">контролер опускає потрібний CE# — і говорить саме з тим чипом. Тому «зайняти» ці піни під щось інше не можна.</text>
</svg>
