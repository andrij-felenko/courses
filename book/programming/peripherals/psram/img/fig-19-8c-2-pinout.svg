<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розпіновка SOIC-8 і підключення: ті самі лінії, що й у флеші</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.0" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вісім ніжок; у режимі QSPI всі чотири лінії даних возять і команду, і дані — це й дає вищу швидкість, ніж проста SPI</text>
