<rect x="350.0" y="64.0" width="340.0" height="240.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="520.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">мікросхема PSRAM</text>
<rect x="372.0" y="108.0" width="150.0" height="104.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.6"/><text x="447.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">масив комірок DRAM</tspan><tspan x="447.0" dy="14.3">(транзистор +</tspan><tspan x="447.0" dy="14.3">конденсатор)</tspan></text>
<rect x="534.0" y="108.0" width="134.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="601.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="601.0" dy="0.0">схований</tspan><tspan x="601.0" dy="14.3">лічильник</tspan><tspan x="601.0" dy="14.3">самооновлення</tspan></text>
