<line x1="158.2" y1="150.0" x2="348.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="254.1" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">SPI / QSPI</text>
<text x="254.1" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(послідовно)</text>
<rect x="54.1" y="255.3" width="111.8" height="49.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Flash</tspan><tspan x="110.0" dy="14.3">(код, нелетка)</tspan></text>
<line x1="110.0" y1="181.0" x2="110.0" y2="255.3" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">динамічна за фізикою, статична на вигляд: возню з регенерацією чип бере на себе</text>
