<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастки: фіксовані D+/D− і бюджет живлення</text>
<rect x="28.0" y="60.0" width="330.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="44.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Виводи USB закріплені</text>
<rect x="44.0" y="110.0" width="150.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="119.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D+ → GPIO20</text>
<text x="206.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">S2/S3: OTG і S-J</text>
<rect x="44.0" y="156.0" width="150.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="119.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D− → GPIO19</text>
<text x="206.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"> те саме коло</text>
<rect x="44.0" y="202.0" width="150.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="119.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">C6 device: D−/D+</text>
<text x="206.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">→ GPIO12 / GPIO13</text>
<rect x="44.0" y="256.0" width="298.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="193.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="193.0" dy="0.0">Зайняв ці GPIO під периферію → USB не підніметься</tspan></text>
<rect x="402.0" y="60.0" width="330.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="418.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Бюджет живлення з USB</text>
<rect x="418.0" y="110.0" width="130.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="483.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">USB порт</text>
<text x="560.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">5 В, типово до ~500 мА</text>
<rect x="418.0" y="156.0" width="130.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="483.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">LDO ↓</text>
<text x="560.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">5 В → 3.3 В, решта — у тепло</text>
<rect x="418.0" y="202.0" width="130.0" height="34.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="483.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сплеск Wi-Fi</text>
<text x="560.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">піки струму просаджують шину</text>
<rect x="418.0" y="256.0" width="298.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="567.0" y="279.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.0" dy="0.0">Лік: запас по С-конденсаторах на 3.3 В і 5 В</tspan></text>
