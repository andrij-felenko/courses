<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінцеві точки пристрою: однонапрямні труби IN/OUT і службовий EP0</text>
<rect x="280.0" y="60.0" width="220.0" height="260.0" rx="10" fill="#fef9ec" stroke="#e67e22" stroke-width="2.5"/>
<text x="390.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="middle" font-weight="700">Пристрій</text>
<rect x="310.0" y="107.0" width="160.0" height="36.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="2.0"/>
<text x="390.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle">EP0 (control, двобічний)</text>
<rect x="310.0" y="162.0" width="160.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">EP1-IN (bulk →)</text>
<rect x="310.0" y="217.0" width="160.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">EP1-OUT (bulk ←)</text>
<rect x="310.0" y="272.0" width="160.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="390.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">EP2-IN (interrupt →)</text>
<rect x="60.0" y="120.0" width="140.0" height="140.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="130.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Хост</text>
<text x="130.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(ПК)</text>
<text x="130.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ініціює обмін</text>
<line x1="205.0" y1="170.0" x2="275.0" y2="125.0" stroke="#8e44ad" stroke-width="1.8"/>
<line x1="205.0" y1="170.0" x2="275.0" y2="125.0" stroke="#8e44ad" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="275.0" y1="180.0" x2="205.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="290.0" x2="205.0" y2="200.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="205.0" y1="220.0" x2="275.0" y2="235.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">IN  = до хоста</text>
<text x="740.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="end" font-weight="700">OUT = від хоста</text>
<text x="740.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">напрям — завжди з погляду хоста</text>
<rect x="143.0" y="326.0" width="474.0" height="26.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/><text x="380.0" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">EP0 є завжди: двобічний службовий канал, ним іде енумерація</tspan></text>
</svg>