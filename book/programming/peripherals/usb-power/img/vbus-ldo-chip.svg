<text x="464.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="464.0" dy="0.0">якщо Vin LDO просяде нижче</tspan><tspan x="464.0" dy="13.0">мінімуму → brownout-reset</tspan></text>
<rect x="60.0" y="300.0" width="740.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="326.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Просадка = I × R_кабелю.  Сплеск Wi-Fi 250 мА на 0,5 Ом тонкого кабелю знімає ~0,13 В; додай inrush — і Vin LDO черкає мінімум.</tspan></text>
<rect x="60.0" y="356.0" width="740.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Лікування: товщий/коротший кабель, більший вхідний C, нижчий dropout LDO, або зовнішнє живлення (self-powered).</tspan></text>
