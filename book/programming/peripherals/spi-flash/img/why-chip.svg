<rect x="24.6" y="328.0" width="710.8" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Логіку й пам'ять роблять різні процеси → дешевше тримати їх двома кристалами, з'єднаними тонкою шиною</tspan></text>
