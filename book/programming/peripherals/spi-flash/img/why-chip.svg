<rect x="109.5" y="118.4" width="61.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">ядро</tspan><tspan x="140.0" dy="15.6">+ SRAM</tspan><tspan x="140.0" dy="15.6">(кБ)</tspan></text>
<rect x="209.9" y="120.2" width="70.2" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">вбуд.</tspan><tspan x="245.0" dy="14.3">флеш</tspan><tspan x="245.0" dy="14.3">сотні кБ</tspan></text>
