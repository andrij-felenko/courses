<line x1="470.0" y1="205.0" x2="300.0" y2="205.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="385.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI</text>
<text x="385.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4 проводи</text>
<rect x="470.0" y="110.0" width="220.0" height="170.0" rx="6" fill="#fef7e9" stroke="#c0392b" stroke-width="2.0"/>
<text x="580.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Окремий чип флеші</text>
<rect x="508.4" y="153.4" width="143.1" height="63.2" rx="6" fill="#fdf0d5" stroke="#caa53d" stroke-width="1.5"/><text x="580.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">масив комірок</tspan><tspan x="580.0" dy="15.6">плаваючого затвора</tspan><tspan x="580.0" dy="15.6">МіБ за копійки</tspan></text>
<text x="580.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дешевий «оптовий» процес</text>
