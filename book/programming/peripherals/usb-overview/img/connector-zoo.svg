<rect x="505.0" y="172.8" width="230.0" height="54.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.8"/><text x="620.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">USB Type-A</tspan><tspan x="620.0" dy="19.5">один роз'єм на всіх</tspan></text>
