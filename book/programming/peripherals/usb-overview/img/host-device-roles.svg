<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія USB: хост ініціює, пристрій відповідає</text>
<rect x="50.0" y="122.8" width="200.0" height="54.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="150.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ХОСТ</tspan><tspan x="150.0" dy="19.5">(ПК, смартфон)</tspan></text>
<text x="150.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">Ініціює ВСЕ:</tspan><tspan x="150.0" dy="14.3">запити · темп · адреси</tspan></text>
<rect x="510.0" y="122.8" width="200.0" height="54.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.2"/><text x="610.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">ПРИСТРІЙ</tspan><tspan x="610.0" dy="19.5">(ESP32, флешка)</tspan></text>
<text x="610.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">Лише ВІДПОВІДАЄ:</tspan><tspan x="610.0" dy="14.3">ніколи не першим</tspan></text>
<line x1="255.0" y1="120.0" x2="505.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">запит (хост → пристрій)</text>
<line x1="505.0" y1="180.0" x2="258.0" y2="180.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="8,4"/>
<text x="503.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">◄</text>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">відповідь (тільки у відповідь)</text>
<rect x="150.0" y="300.0" width="460.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="380.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Ніхто не говорить без дозволу → колізій немає, пристрій реактивний</tspan></text>
