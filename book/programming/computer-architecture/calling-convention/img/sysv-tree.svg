<rect x="90.0" y="160.6" width="280.0" height="78.8" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/><text x="230.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">gABI — загальна частина</tspan><tspan x="230.0" dy="15.6">формати файлів (ELF),</tspan><tspan x="230.0" dy="15.6">правила зв'язування</tspan><tspan x="230.0" dy="15.6">(однакові скрізь)</tspan></text>
<rect x="490.0" y="160.6" width="280.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="630.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">psABI — процесорний додаток</tspan><tspan x="630.0" dy="15.6">які регістри під аргументи,</tspan><tspan x="630.0" dy="15.6">розміри типів, порядок байтів</tspan><tspan x="630.0" dy="15.6">(під кожну архітектуру свій)</tspan></text>
