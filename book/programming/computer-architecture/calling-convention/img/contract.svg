<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Угода про виклик: що саме мусять узгодити обидва боки</text>
<rect x="25.0" y="56.6" width="210.0" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="130.0" y="77.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ТОЙ, ХТО КЛИЧЕ</tspan><tspan x="130.0" dy="16.9">(caller)</tspan><tspan x="130.0" dy="16.9">прошивка, що викликає</tspan></text>
<rect x="585.0" y="56.6" width="210.0" height="66.8" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/><text x="690.0" y="77.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ТОЙ, КОГО КЛИЧУТЬ</tspan><tspan x="690.0" dy="16.9">(callee)</tspan><tspan x="690.0" dy="16.9">функція-бібліотека</tspan></text>
<line x1="245.0" y1="90.0" x2="575.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="575.0" y1="78.0" x2="245.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="130.0" y="191.2" width="560.0" height="117.5" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/><text x="410.0" y="212.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">СПІЛЬНА ДОМОВЛЕНІСТЬ (ABI)</tspan><tspan x="410.0" dy="16.9">• куди класти аргументи (які регістри, тоді стек)</tspan><tspan x="410.0" dy="16.9">• звідки брати результат (регістр RAX / R0)</tspan><tspan x="410.0" dy="16.9">• хто зберігає які регістри (caller- / callee-saved)</tspan><tspan x="410.0" dy="16.9">• як лягає кадр стека і де адреса повернення</tspan><tspan x="410.0" dy="16.9">• хто прибирає стек після виклику</tspan></text>
<line x1="130.0" y1="135.0" x2="200.0" y2="191.2" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="690.0" y1="135.0" x2="620.0" y2="191.2" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="338.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">збігаються ці пункти — код склеюється; не збігаються — тихо ламається</text>
</svg>