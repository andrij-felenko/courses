<rect x="429.3" y="40.0" width="471.4" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Математика променів та блокування:</tspan><tspan x="665.0" dy="15.6">1. Маска зайнятості (Occupancy) містить усі фігури на дошці.</tspan><tspan x="665.0" dy="15.6">2. Промінь ковзної фігури поширюється вздовж напрямку (N, S, E, W)</tspan><tspan x="665.0" dy="15.6">   до першого встановленого біта-перешкоди (Blocker).</tspan><tspan x="665.0" dy="15.6">3. Перший блокер включається в маску атаки (можливе взяття).</tspan><tspan x="665.0" dy="15.6">4. Усі поля за блокером відсікаються (Ray Shadow).</tspan></text>
