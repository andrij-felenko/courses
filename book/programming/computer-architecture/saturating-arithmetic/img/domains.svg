<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 315.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="315.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли впертися в межу — правда, а коли — прихована втрата</text>
<line x1="360.0" y1="44.0" x2="360.0" y2="280.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Насичення — правильна межа</text>
<rect x="28.0" y="92.0" width="304.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="114.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">звук: гучніше за максимум</tspan><tspan x="180.0" dy="14.3">= просто максимум, не тріск</tspan></text>
<rect x="28.0" y="154.0" width="304.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">яскравість пікселя 0…255</tspan><tspan x="180.0" dy="14.3">не «загортається» в чорне</tspan></text>
<rect x="28.0" y="216.0" width="304.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">керування: сигнал на привід</tspan><tspan x="180.0" dy="14.3">упертий у фізичну межу</tspan></text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Насичення тут — брехня</text>
<rect x="388.0" y="92.0" width="304.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="114.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">лічба грошей/подій: 255+1</tspan><tspan x="540.0" dy="14.3">мусить рости, не застрягти</tspan></text>
<rect x="388.0" y="154.0" width="304.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">індекси, адреси, хеші:</tspan><tspan x="540.0" dy="14.3">потрібен wrap за модулем</tspan></text>
<rect x="388.0" y="216.0" width="304.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">де важлива ТОЧНА сума —</tspan><tspan x="540.0" dy="14.3">краще виявити переповнення</tspan></text>
<text x="360.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">питання одне: «застрягти на межі» — це правда про величину чи мовчазна втрата?</text>
</svg>