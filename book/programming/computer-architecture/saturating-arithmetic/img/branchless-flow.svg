<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безгіллясте знакове насичення: дві гілки сходяться у виборі маскою</text>
<rect x="227.2" y="42.0" width="265.5" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="360.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">доданки  a,  b   (сума s = a + b)</tspan></text>
<rect x="96.0" y="122.2" width="157.9" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="175.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">знак доданків: a &gt;&gt; 31</tspan><tspan x="175.0" dy="14.3">плюс → межа = INT_MAX</tspan><tspan x="175.0" dy="14.3">мінус → межа = INT_MIN</tspan></text>
<rect x="469.2" y="122.2" width="151.7" height="59.6" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.6"/><text x="545.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">переповнення?</tspan><tspan x="545.0" dy="14.3">(a^b) | ~(b^s) → знак</tspan><tspan x="545.0" dy="14.3">сталось? всі-1 : 0</tspan></text>
<line x1="320.0" y1="74.0" x2="175.0" y2="120.2" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="400.0" y1="74.0" x2="545.0" y2="120.2" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="204.9" y="251.5" width="310.2" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="360.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">r = (межа &amp; маска) | (сума &amp; ~маска)</tspan></text>
<line x1="175.0" y1="181.8" x2="290.0" y2="249.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="545.0" y1="181.8" x2="430.0" y2="249.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">переповнення → береться межа; нема → береться сума. Жодного if — рівний час.</text>
</svg>