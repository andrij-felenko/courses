<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 398" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="398" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPU у часі: окремий чип → на кристалі → опція</text>
<line x1="56.0" y1="150.0" x2="724.0" y2="150.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="120.0" cy="150.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="120.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1980</text>
<text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Intel 8087</text>
<line x1="120.0" y1="118.0" x2="120.0" y2="142.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="120.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">окремий чип</text>
<text x="120.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">перший матем.</text>
<text x="120.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">співпроцесор</text>
<circle cx="300.0" cy="150.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="300.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1989</text>
<text x="300.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">80486DX</text>
<line x1="300.0" y1="118.0" x2="300.0" y2="142.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FPU на кристалі</text>
<text x="300.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">той самий</text>
<text x="300.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">кремній</text>
<circle cx="480.0" cy="150.0" r="8.0" fill="#b9770e" stroke="#b9770e" stroke-width="2.0"/>
<text x="480.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="middle" font-weight="700">1991</text>
<text x="480.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">486SX</text>
<line x1="480.0" y1="118.0" x2="480.0" y2="142.0" stroke="#b9770e" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="480.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FPU вимкнено</text>
<text x="480.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">опція, не</text>
<text x="480.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">обов'язок</text>
<circle cx="660.0" cy="150.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="660.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">нині</text>
<text x="660.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cortex-M</text>
<line x1="660.0" y1="118.0" x2="660.0" y2="142.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="660.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">то є, то нема</text>
<text x="660.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">опція й</text>
<text x="660.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">донині</text>
<rect x="56.0" y="250.0" width="388.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">окремий чип  →  той самий кристал</tspan></text>
<rect x="456.0" y="250.0" width="268.0" height="40.0" rx="6" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/><text x="590.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">…і завжди лишається опцією</tspan></text>
<rect x="56.0" y="306.0" width="668.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="390.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Одна лінія розвитку: спершу дробову арифметику винесли в ОКРЕМУ мікросхему,</tspan><tspan x="390.0" dy="15.6">далі транзистори здешевшали — і FPU переїхав на кристал ядра;</tspan><tspan x="390.0" dy="15.6">але він так і не став обов'язковим — і на 486SX, і на сучасних МК це ОПЦІЯ.</tspan></text>
</svg>