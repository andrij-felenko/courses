<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дійшовши кінця, адреса апаратно стає початком — без if і без модуля в циклі.</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Новий відлік затирає найдавніший; вікно фільтра «їде» по сигналу задарма.</text>
