<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 441.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="441.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто перший: народження однокристального DSP (1978–1984)</text>
<rect x="240.4" y="43.8" width="339.2" height="44.5" rx="6" fill="#fef6e9" stroke="#b8860b" stroke-width="1.5"/><text x="410.0" y="62.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Корінь усіх трьох: телефонія й обробка мовлення —</tspan><tspan x="410.0" dy="15.0">потік відліків крізь фільтри, MAC щотакту</tspan></text>
<line x1="60.0" y1="150.0" x2="760.0" y2="150.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="120.0" y1="145.0" x2="120.0" y2="155.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="120.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1978</text>
<line x1="250.0" y1="145.0" x2="250.0" y2="155.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="250.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1979</text>
<line x1="400.0" y1="145.0" x2="400.0" y2="155.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1980</text>
<line x1="600.0" y1="145.0" x2="600.0" y2="155.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="600.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1982</text>
<line x1="740.0" y1="145.0" x2="740.0" y2="155.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="740.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1984</text>
<rect x="130.3" y="215.3" width="239.4" height="69.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Bell Labs DSP-1</tspan><tspan x="250.0" dy="13.7">травень 1979 — перші зразки</tspan><tspan x="250.0" dy="13.7">перший справжній однокристальний</tspan><tspan x="250.0" dy="13.7">з апаратним MAC · лише всередині AT&amp;T</tspan></text>
<line x1="250.0" y1="154.0" x2="250.0" y2="215.3" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="346.2" y="305.3" width="167.6" height="69.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">NEC µPD7720</tspan><tspan x="430.0" dy="13.7">ISSCC, лютий 1980</tspan><tspan x="430.0" dy="13.7">перший, який можна купити</tspan><tspan x="430.0" dy="13.7">(у продажу з 1981–82)</tspan></text>
<line x1="400.0" y1="154.0" x2="430.0" y2="305.3" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="572.2" y="215.3" width="215.5" height="69.4" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">TI TMS32010</tspan><tspan x="680.0" dy="13.7">анонс 1982, поставки 1983–84</tspan><tspan x="680.0" dy="13.7">ринковий еталон · множення 200 нс</tspan><tspan x="680.0" dy="13.7">початок родини TMS320</tspan></text>
<line x1="680.0" y1="154.0" x2="680.0" y2="215.3" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три різні «перші»: перший з апаратним MAC (DSP-1), перший у продажу (7720), перший еталон ринку (TMS32010).</text>
<text x="410.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Усіх трьох штовхала та сама потреба — гнати мову крізь фільтри в реальному часі.</text>
</svg>