<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення: загорнути (звичайний CPU) чи насити (DSP)</text>
<rect x="50.0" y="56.0" width="330.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="215.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Загортання (wrap)</text>
<text x="215.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">127 + 5  →  −124</text>
<text x="215.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">макс. «перескакує» у мінус</text>
<line x1="80.0" y1="200.0" x2="180.0" y2="160.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="180.0" y1="160.0" x2="182.0" y2="236.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="4 3"/>
<line x1="182.0" y1="236.0" x2="350.0" y2="196.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="215.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">у звуці — гучний тріск, сигнал зіпсовано</text>
<rect x="410.0" y="56.0" width="300.0" height="210.0" rx="10" fill="#eef7ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="560.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Насичення (saturate)</text>
<text x="560.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">127 + 5  →  127</text>
<text x="560.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">залипає на межі, не перескакує</text>
<line x1="440.0" y1="200.0" x2="540.0" y2="160.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="540.0" y1="160.0" x2="680.0" y2="160.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="560.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">у звуці — м'яке обрізання, слух терпить</text>
<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DSP насичує апаратно — межу тримає залізо, без жодної перевірки в коді.</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тому гучний звук на DSP не обертається на шум, а лише впирається у стелю.</text>
</svg>