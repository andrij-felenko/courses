<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна завертання індексу кільцевого буфера</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">той самий крок «назад по кільцю» коштує зовсім різне</text>
<rect x="56.0" y="78.0" width="250.0" height="82.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="181.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">(i - 1 + N) % N</text>
<rect x="332.0" y="78.0" width="300.0" height="82.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="346.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">оператор %  —  апаратне ДІЛЕННЯ</text>
<text x="346.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">десятки тактів у гарячому циклі</text>
<line x1="306.0" y1="119.0" x2="332.0" y2="119.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="654.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">★★★  дорого</text>
<rect x="56.0" y="174.0" width="250.0" height="82.0" rx="8" fill="#fef6e9" stroke="#b8860b" stroke-width="1.8"/>
<text x="181.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">(i - 1) &amp; (N - 1)</text>
<rect x="332.0" y="174.0" width="300.0" height="82.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="346.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">маска  —  одна дешева команда</text>
<text x="346.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">лише коли довжина N = 2ᵏ</text>
<line x1="306.0" y1="215.0" x2="332.0" y2="215.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="654.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="start" font-weight="700">★  дешево</text>
<rect x="56.0" y="270.0" width="250.0" height="82.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="181.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">hw-модульна адресація</text>
<rect x="332.0" y="270.0" width="300.0" height="82.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="346.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">апаратне кільце DSP</text>
<text x="346.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">0 команд у циклі, будь-яке N</text>
<line x1="306.0" y1="311.0" x2="332.0" y2="311.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="654.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">◦  безкоштовно</text>
<text x="410.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ближче до DSP — то дешевше завертання; апаратне кільце тримає темп «один MAC за такт».</text>
</svg>