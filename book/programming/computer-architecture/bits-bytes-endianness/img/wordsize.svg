<text x="490.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">беззнаковий діапазон: 0…~1.8·10¹⁹</text>
<text x="490.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">приклад: x86-64, ARM64 (ПК, телефон)</text>
<text x="150.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(кожен квадрат — байт; ширше слово = більше байтів за раз = більші числа)</text>
<rect x="60.0" y="422.0" width="780.0" height="34.0" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.4"/>
<text x="450.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Увага: у деяких системах (Windows API) «word» жорстко = 16 біт, dword = 32, qword = 64 — незалежно від машини.</text>
