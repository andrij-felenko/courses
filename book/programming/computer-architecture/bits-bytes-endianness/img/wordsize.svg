<text x="490.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">приклад: AVR (Arduino Uno), 8051</text>
<text x="128.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="end" font-weight="700">16 біт</text>
<rect x="150.0" y="178.0" width="36.0" height="40.0" rx="5" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<rect x="190.0" y="178.0" width="36.0" height="40.0" rx="5" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
