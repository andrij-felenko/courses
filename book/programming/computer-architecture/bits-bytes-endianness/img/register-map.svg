<text x="70.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">MSB-байт — за МЕНШОЮ адресою (0xF7), молодший — за більшою: у даташиті регістри впорядковані big-endian,</text>
