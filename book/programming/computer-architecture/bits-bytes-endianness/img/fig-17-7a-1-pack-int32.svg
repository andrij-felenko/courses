<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<rect width="960" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="480.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серіалізація int32 у байтовий буфер явними зсувами (без union, без приведення вказівника)</text>
<text x="480.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">число 0x12345678 → 4 байти в мережевому порядку (big-endian); код дає той самий буфер на будь-якій машині</text>
<rect x="300.0" y="84.0" width="360.0" height="56.0" rx="8" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="2.0"/>
<text x="480.0" y="105.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">значення в регістрі (uint32_t)</text>
<text x="480.0" y="127.0" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">v = 0x12345678</text>
<text x="60.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">крок 1 — дістаємо кожен байт зсувом і маскою:</text>
<rect x="60.0" y="190.0" width="200.0" height="40.0" rx="6" fill="#fdeceb" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="208.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">(v &gt;&gt; 24) &amp; 0xFF</text>
<text x="250.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#c0271e" text-anchor="end" font-weight="bold">= 0x12</text>
<line x1="160.0" y1="236.0" x2="160.0" y2="270.0" stroke="#c0271e" stroke-width="2.0" marker-end="url(#aRed)"/>
<rect x="278.0" y="190.0" width="200.0" height="40.0" rx="6" fill="#fbf4e3" stroke="#caa24a" stroke-width="1.8"/>
<text x="288.0" y="208.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">(v &gt;&gt; 16) &amp; 0xFF</text>
<text x="468.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#caa24a" text-anchor="end" font-weight="bold">= 0x34</text>
<line x1="378.0" y1="236.0" x2="378.0" y2="270.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#aInk)"/>
<rect x="496.0" y="190.0" width="200.0" height="40.0" rx="6" fill="#eaf6ec" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="506.0" y="208.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">(v &gt;&gt;  8) &amp; 0xFF</text>
<text x="686.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold">= 0x56</text>
<line x1="596.0" y1="236.0" x2="596.0" y2="270.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<rect x="714.0" y="190.0" width="200.0" height="40.0" rx="6" fill="#eaeffb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="724.0" y="208.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">(v &gt;&gt;  0) &amp; 0xFF</text>
<text x="904.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f47b5" text-anchor="end" font-weight="bold">= 0x78</text>
<line x1="814.0" y1="236.0" x2="814.0" y2="270.0" stroke="#1f47b5" stroke-width="2.0" marker-end="url(#aBlue)"/>
<text x="60.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">крок 2 — кладемо в буфер старшим байтом уперед (мережевий порядок):</text>
<rect x="60.0" y="306.0" width="200.0" height="56.0" rx="6" fill="#fdeceb" stroke="#c0271e" stroke-width="2.0"/>
<text x="160.0" y="339.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x12</text>
<text x="160.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">buf[0]</text>
<rect x="278.0" y="306.0" width="200.0" height="56.0" rx="6" fill="#fbf4e3" stroke="#caa24a" stroke-width="2.0"/>
<text x="378.0" y="339.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x34</text>
<text x="378.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">buf[1]</text>
<rect x="496.0" y="306.0" width="200.0" height="56.0" rx="6" fill="#eaf6ec" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="596.0" y="339.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x56</text>
<text x="596.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">buf[2]</text>
<rect x="714.0" y="306.0" width="200.0" height="56.0" rx="6" fill="#eaeffb" stroke="#1f47b5" stroke-width="2.0"/>
<text x="814.0" y="339.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x78</text>
<text x="814.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">buf[3]</text>
<line x1="60.0" y1="390.0" x2="914.0" y2="390.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="60.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">найменша адреса</text>
<text x="914.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">найбільша</text>
<rect x="60.0" y="482.0" width="840.0" height="56.0" rx="10" fill="#eef9ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="480.0" y="506.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код НЕ залежить від ендіанності машини: ми самі диктуємо порядок зсувами.</text>
<text x="480.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Розпакування — дзеркальне: v = (buf[0]&lt;&lt;24)|(buf[1]&lt;&lt;16)|(buf[2]&lt;&lt;8)|buf[3].  Хочеш little-endian — поміняй buf[0..3] місцями.</text>
</svg>
