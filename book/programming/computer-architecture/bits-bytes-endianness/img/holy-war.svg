<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки назва й чому це «свята війна»: Ліліпутія, Свіфт і Коен</text>
<rect x="60.0" y="84.0" width="360.0" height="252.0" rx="10" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Мандри Гуллівера» (Свіфт, 1726)</text>
<ellipse cx="150" cy="198" rx="34" ry="44" fill="#fffdf5" stroke="#c0392b" stroke-width="2.4"/>
<polyline points="134,236 144,228 152,238 162,229 168,237" fill="none" stroke="#c0392b" stroke-width="2"/>
<ellipse cx="330" cy="198" rx="34" ry="44" fill="#fffdf5" stroke="#2457d6" stroke-width="2.4"/>
<polyline points="316,162 325,154 333,163 341,154 346,162" fill="none" stroke="#2457d6" stroke-width="2"/>
<text x="150.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">тупоконечники</text>
<text x="150.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(б'ють з тупого кінця)</text>
<text x="330.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">гостроконечники</text>
<text x="330.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(б'ють з гострого кінця)</text>
<text x="240.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ліліпути воювали, з якого кінця бити яйце</text>
<rect x="440.0" y="84.0" width="400.0" height="252.0" rx="10" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="640.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Денні Коен, 1980</text>
<text x="640.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">«On Holy Wars and a Plea for Peace»</text>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Коен узяв образ Свіфта й охрестив два</text>
<text x="460.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">порядки байтів: big-endian і little-endian.</text>
<text x="460.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="460.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Його теза: жоден не «кращий» — головне</text>
<text x="460.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ДОМОВИТИСЯ, інакше машини не зрозуміють</text>
<text x="460.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">одна одну. Це й була його «мольба про мир».</text>
<text x="450.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Практичний укус: на little-endian машині число 0x12345678 у hex-дампі пам'яті виглядає як «78 56 34 12».</text>
<text x="450.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Новачки лякаються «перевернутих» байтів — а це просто little-endian показує молодший байт першим.</text>
<rect x="60.0" y="410.0" width="780.0" height="48.0" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.4"/>
<text x="450.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині однієї машини порядок байтів НЕВИДИМИЙ — він кусає лише на МЕЖІ: обмін по мережі, файли, давачі.</text>
<text x="450.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тому й «свята війна»: суперечка пристрасна, а по суті — лише угода, якого кінця триматися.</text>
</svg>