<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складання результату: явні зсуви проти «приведення вказівника»</text>
<rect x="120.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="195.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">0xFA</text>
<text x="195.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">temp_msb</text>
<text x="195.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">T[19:12]</text>
<text x="195.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">&lt;&lt; 12</text>
<line x1="195.0" y1="180.0" x2="195.0" y2="208.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="195.0" y1="190.0" x2="195.0" y2="208.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="385.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">0xFB</text>
<text x="385.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">temp_lsb</text>
<text x="385.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">T[11:4]</text>
<text x="385.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">&lt;&lt; 4</text>
<line x1="385.0" y1="180.0" x2="385.0" y2="208.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="385.0" y1="190.0" x2="385.0" y2="208.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="575.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">0xFC</text>
<text x="575.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">temp_xlsb</text>
<text x="575.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">T[3:0]</text>
<text x="575.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">&gt;&gt; 4</text>
<line x1="575.0" y1="180.0" x2="575.0" y2="208.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="575.0" y1="190.0" x2="575.0" y2="208.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="222.0" width="530.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="385.0" y="247.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="700">int32_t T = (msb &lt;&lt; 12) | (lsb &lt;&lt; 4) | (xlsb &gt;&gt; 4);</text>
<text x="430.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">20-бітний «сирий» результат T (raw ADC value)</text>
<rect x="100.0" y="306.0" width="264.0" height="34.0" rx="0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="232.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">T[19:12] ← msb</text>
<rect x="364.0" y="306.0" width="264.0" height="34.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="496.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T[11:4] ← lsb</text>
<rect x="628.0" y="306.0" width="132.0" height="34.0" rx="0" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="694.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">T[3:0] ← xlsb</text>
<rect x="100.0" y="306.0" width="660.0" height="34.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="430.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ той самий результат на БУДЬ-ЯКІЙ машині — little- чи big-endian</text>
<rect x="70.0" y="392.0" width="720.0" height="56.0" rx="6" fill="#fff4f4" stroke="#c0392b" stroke-width="1.6"/>
<text x="90.0" y="414.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#c0392b" text-anchor="start" font-weight="700">✗  int32_t T = *(int32_t*)buf;</text>
<text x="330.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">— читає байти «як лежать»: ламається на чужій ендіанності,</text>
<text x="330.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">а ще — невирівняна адреса (alignment) і суворе аліасування (strict aliasing). Не робіть так.</text>
</svg>