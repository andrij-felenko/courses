<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<rect width="960" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="480.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дістати байти float: union проти memcpy</text>
<text x="480.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва читають ті самі 4 байти IEEE-754, але стандарт C дозволяє лише один із них</text>
<rect x="330.0" y="78.0" width="300.0" height="46.0" rx="8" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="480.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">float f = 1.0f</text>
<text x="480.0" y="117.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal">біти IEEE-754: 0x3F800000</text>
<rect x="60.0" y="150.0" width="400.0" height="300.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.9"/>
<text x="260.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">union — спільна пам'ять</text>
<text x="82.0" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">union { float f;</text>
<text x="82.0" y="226.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">        uint8_t b[4]; } u;</text>
<text x="82.0" y="250.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">u.f = 1.0f;</text>
<text x="82.0" y="270.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">u.b[0] ... u.b[3]  // читаємо байти</text>
<rect x="130.0" y="300.0" width="260.0" height="34.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="162.0" y="322.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">3F</text>
<line x1="195.0" y1="300.0" x2="195.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="227.0" y="322.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">80</text>
<line x1="260.0" y1="300.0" x2="260.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="292.0" y="322.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">00</text>
<line x1="325.0" y1="300.0" x2="325.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="357.0" y="322.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">00</text>
<text x="260.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ті самі 4 байти</text>
<text x="260.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">f і b[] — два «вікна» в одну комірку</text>
<rect x="80.0" y="380.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.5"/>
<text x="260.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У C — поширена практика й зазвичай працює.</text>
<text x="260.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">У C++ читати НЕ той член union — формально UB.</text>
<rect x="500.0" y="150.0" width="400.0" height="300.0" rx="12" fill="#eef9ee" stroke="#1f8a3b" stroke-width="1.9"/>
<text x="700.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">memcpy — байтова копія</text>
<text x="522.0" y="210.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">uint8_t b[4];</text>
<text x="522.0" y="234.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">memcpy(b, &amp;f, 4);  // байт-у-байт</text>
<text x="522.0" y="258.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="normal">// b[] тепер копія байтів f</text>
<rect x="560.0" y="290.0" width="120.0" height="34.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="620.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">f (float)</text>
<text x="620.0" y="312.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">3F 80 00 00</text>
<line x1="685.0" y1="307.0" x2="735.0" y2="307.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="710.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">копія</text>
<rect x="740.0" y="290.0" width="120.0" height="34.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="800.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">b[4] (uint8_t)</text>
<text x="800.0" y="312.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal">3F 80 00 00</text>
<rect x="520.0" y="380.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="700.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Визначено і в C, і в C++. Компілятор оптимізує</text>
<text x="700.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">memcpy сталого розміру в той самий код — без накладних.</text>
<rect x="60.0" y="490.0" width="840.0" height="46.0" rx="10" fill="#fff6e6" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="513.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільна засторога: байти float переносні між машинами ЛИШЕ якщо обидві — IEEE-754 і однакової ендіанності.</text>
<text x="480.0" y="531.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перетинаєш мережу — домовся про формат: 4 байти IEEE-754 у фіксованому (зазвичай мережевому) порядку.</text>
</svg>
