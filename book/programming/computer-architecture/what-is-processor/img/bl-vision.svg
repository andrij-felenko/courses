<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стрибок думки Лавлейс: не калькулятор, а машина символів</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Беббідж бачив швидку лічбу; Лавлейс перша зрозуміла, що машина оперує символами</text>
<rect x="70.0" y="86.0" width="360.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="250.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Беббідж бачив КАЛЬКУЛЯТОР</text>
<text x="250.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">машину, що швидко й безпомилково</text>
<text x="250.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рахує числа — таблиці, обчислення</text>
<text x="250.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(велика, та все ж лише арифметика)</text>
<text x="250.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">123 + 456 = 579</text>
<rect x="470.0" y="86.0" width="360.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Лавлейс — МАШИНУ СИМВОЛІВ</text>
<text x="650.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">якщо числа можуть позначати ноти,</text>
<text x="650.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">букви, що завгодно — машина за</text>
<text x="650.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">правилами творитиме музику, графіку…</text>
<text x="650.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">♪ ♫  ✎  ∑  → не лише лічба</text>
<rect x="70.0" y="254.0" width="760.0" height="58.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="450.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та вона ж застерегла: «Машина не претендує породжувати нічого нового —</text>
<text x="450.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">вона робить лише те, що ми вміємо їй наказати» — «заперечення Лавлейс».</text>
<rect x="70.0" y="330.0" width="760.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="450.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Беббідж спроєктував машини й розробляв обчислення; Лавлейс написала Нотатки,</text>
<text x="450.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">опублікувала перший алгоритм і першою осягнула, що це машина загального призначення.</text>
<text x="450.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Обидва внески справжні й різні — велика ідея є праця кількох рук.</text>
</svg>