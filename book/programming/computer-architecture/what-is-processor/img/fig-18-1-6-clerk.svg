<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408">
<rect width="880" height="408" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Точна аналогія: процесор — це надшвидкий, бездоганно слухняний клерк</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">він сидить над списком одно-рядкових наказів і виконує їх по черзі, точно й миттєво — але без жодного розуміння</text>
<circle cx="150.0" cy="150.0" r="12.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4"/>
<path d="M132,180 Q150,160 168,180" fill="none" stroke="#1b1b1b" stroke-width="2.4"/>
<rect x="110.0" y="196.0" width="110.0" height="70.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<line x1="122.0" y1="212.0" x2="208.0" y2="212.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="122.0" y1="226.0" x2="208.0" y2="226.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="122.0" y1="240.0" x2="208.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="122.0" y1="254.0" x2="208.0" y2="254.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="150.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">клерк зі списком</text>
<rect x="280.0" y="92.0" width="560.0" height="130.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="560.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">У ЧОМУ аналогія точна</text>
<text x="300.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• виконує накази строго ПО ПОРЯДКУ, один за одним</text>
<text x="300.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• кожен наказ — простий і однозначний («візьми», «додай», «перейди на рядок 5»)</text>
<text x="300.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не імпровізує: робить рівно те, що в списку, нічого від себе</text>
<rect x="280.0" y="236.0" width="560.0" height="132.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="560.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ДЕ аналогія ламається (важливо!)</text>
<text x="300.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• живий клерк РОЗУМІЄ сенс і помітив би абсурдний наказ — процесор НЕ розуміє нічого</text>
<text x="300.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• він не «читає» команду, а механічно зіставляє число з дією; сенсу для нього не існує</text>
<text x="300.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тож хибний наказ він виконає так само ретельно, як слушний → звідси й беруться баги</text>
<text x="440.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тримайте подвійність: «слухняний клерк» — щоб уявити роботу; «без розуміння» — щоб не чекати від нього здорового глузду.</text>
</svg>
