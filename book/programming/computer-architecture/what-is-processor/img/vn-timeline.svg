<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="798" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг до головної ідеї: як комп'ютер став універсальним</text>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">від машин, що вміли одне, до машини, яку перепрограмовуєш, заклавши інші числа</text>
<line x1="250.0" y1="90.0" x2="250.0" y2="712.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="250.0" cy="96.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">давні</text>
<text x="276.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">рахівниця → Паскаль → Беббідж</text>
<text x="276.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Кожна вміла одне: зроблена під одну задачу;</text>
<text x="276.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">змінити її — перебудувати залізо</text>
<circle cx="250.0" cy="192.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1945</text>
<text x="276.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ENIAC</text>
<text x="276.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перша велика електронна — швидка; та «програмування» =</text>
<text x="276.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">перемикати сотні дротів і тумблерів днями</text>
<circle cx="250.0" cy="288.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">питання</text>
<text x="276.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">а якщо…?</text>
<text x="276.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Що, як інструкції зберігати в пам'яті як звичайні числа —</text>
<text x="276.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">поряд із даними?</text>
<circle cx="250.0" cy="384.0" r="10.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.2"/>
<circle cx="250.0" cy="384.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="228.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1945</text>
<text x="276.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">«First Draft» — фон Нейман</text>
<text x="276.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перший ясний опис збереженої програми;</text>
<text x="276.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">саме його ім'я закріпилось за архітектурою</text>
<circle cx="250.0" cy="480.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1948</text>
<text x="276.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Манчестерський «Baby»</text>
<text x="276.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перша машина, що реально виконала збережену програму</text>
<text x="276.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">(Вільямс і Кілберн)</text>
<circle cx="250.0" cy="576.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1949</text>
<text x="276.0" y="573.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">EDSAC</text>
<text x="276.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перша практична машина зі збереженою програмою</text>
<text x="276.0" y="611.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">(Вілкс, Кембридж)</text>
<circle cx="250.0" cy="672.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="677.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">донині</text>
<text x="276.0" y="669.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ПК · телефон · ESP32</text>
<text x="276.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Майже кожен комп'ютер і досі —</text>
<text x="276.0" y="707.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">машина зі збереженою програмою</text>
</svg>