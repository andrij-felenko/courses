<text x="440.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Колода карток — це і є ПРОГРАМА: послідовність інструкцій, яку машина виконує одну за одною (рівно ідея §18.1).</text>
<text x="440.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перфокарти прожили довге життя: ними програмували комп'ютери аж до 1970-х.</text>
