<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки складність: тривіальний крок × нечувана швидкість</text>
<rect x="60.0" y="135.6" width="200.0" height="78.8" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/><text x="160.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ОДИН крок</tspan><tspan x="160.0" dy="15.6">напр. A + B</tspan><tspan x="160.0" dy="15.6">тривіально:</tspan><tspan x="160.0" dy="15.6">школяр зробить</tspan></text>
<line x1="266.0" y1="175.0" x2="336.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="335.0" y="150.1" width="150.0" height="49.9" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/><text x="410.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">× мільярди</tspan><tspan x="410.0" dy="16.9">за секунду</tspan></text>
<line x1="486.0" y1="175.0" x2="556.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="570.0" y="135.6" width="200.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="670.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">= усе, що бачимо</tspan><tspan x="670.0" dy="15.6">3D-графіка · відео</tspan><tspan x="670.0" dy="15.6">керування дроном</tspan><tspan x="670.0" dy="15.6">розпізнавання, ШІ</tspan></text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">роботу процесора за ОДНУ секунду людина по кроку щосекунди робила б десятки років</text>
<text x="410.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«розум» машини — це не розумний крок, а безліч простих кроків шалено швидко</text>
</svg>