<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">За століття до електроніки: машина, що мала виконувати програму</text>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Беббідж задумав механічний «процесор», а Лавлейс написала для нього перший алгоритм</text>
<line x1="250.0" y1="90.0" x2="250.0" y2="520.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="250.0" cy="96.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1822</text>
<text x="276.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Різницева машина</text>
<text x="276.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Механічний обчислювач таблиць методом різниць (самі додавання);</text>
<text x="276.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">уряд фінансує — недобудовано</text>
<circle cx="250.0" cy="192.0" r="10.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.2"/>
<circle cx="250.0" cy="192.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="228.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1834</text>
<text x="276.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Аналітична машина</text>
<text x="276.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Задум універсальної машини: «Млин» + «Склад» + перфокарти +</text>
<text x="276.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">розгалуження й цикли</text>
<circle cx="250.0" cy="288.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1843</text>
<text x="276.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Нотатки Ади Лавлейс</text>
<text x="276.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Переклад статті + власні Нотатки: перший опублікований алгоритм</text>
<text x="276.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">(числа Бернуллі) і бачення «машини символів»</text>
<circle cx="250.0" cy="384.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">XIX ст.</text>
<text x="276.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Не збудовано</text>
<text x="276.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Надскладно для механіки тих часів, бракло коштів —</text>
<text x="276.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">геніальний задум лишився на папері</text>
<circle cx="250.0" cy="480.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1991</text>
<text x="276.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Справдження</text>
<text x="276.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Музей науки в Лондоні будує Різницеву машину №2 за кресленнями —</text>
<text x="276.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">і вона працює</text>
</svg>