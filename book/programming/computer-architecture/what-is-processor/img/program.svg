<text x="410.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">рядки 2–5 повторюються завдяки стрибку — з купки наказів уже постає алгоритм</text>
