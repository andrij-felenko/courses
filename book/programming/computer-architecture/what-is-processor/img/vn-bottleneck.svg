<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слабке місце моделі: «вузьке місце фон Неймана»</text>
<text x="440.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">і інструкції, і дані течуть тим самим єдиним каналом — тож процесор інколи голодує</text>
<rect x="70.0" y="130.0" width="210.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="175.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОЦЕСОР</text>
<text x="175.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">швидкий</text>
<rect x="600.0" y="130.0" width="210.0" height="120.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="705.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ПАМ'ЯТЬ</text>
<text x="705.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">велика</text>
<path d="M280,150 L420,184 L460,184 L600,150 L600,230 L460,196 L420,196 L280,230 Z" fill="#fdf6e3" stroke="#b8860b" stroke-width="2"/>
<text x="440.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">одна</text>
<text x="440.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">вузька</text>
<text x="440.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">інструкції + дані — разом</text>
<rect x="60.0" y="280.0" width="760.0" height="84.0" rx="6" fill="#f6f8f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="440.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">термін увів Джон Бекус (Тюрінгова лекція 1977): чим швидший процесор,</text>
<text x="440.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">тим частіше він простоює, чекаючи на єдину шину до пам'яті.</text>
<text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">інший підхід — Гарвардська архітектура (окремі канали коду й даних); AVR в Arduino — саме така</text>
</svg>