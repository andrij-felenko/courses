<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інструкція — один крихітний, точно означений наказ</text>
<rect x="150.0" y="80.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.8"/>
<text x="275.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">завантаж число</text>
<text x="420.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">поклади значення в робочу комірку</text>
<rect x="150.0" y="132.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.8"/>
<text x="275.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">додай / відніми</text>
<text x="420.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">склади чи відніми два числа</text>
<rect x="150.0" y="184.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#b8860b" stroke-width="1.8"/>
<text x="275.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">порівняй</text>
<text x="420.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">більше? менше? рівно?</text>
<rect x="150.0" y="236.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#c0392b" stroke-width="1.8"/>
<text x="275.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">перейди (стрибок)</text>
<text x="420.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">роби далі не наступну, а іншу команду</text>
<rect x="150.0" y="288.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="275.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">запиши / прочитай</text>
<text x="420.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перенеси число між процесором і пам'яттю</text>
<text x="410.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кілька десятків таких примітивів — і нічого більше; велике зібране з довгих ланцюгів дрібного</text>
</svg>