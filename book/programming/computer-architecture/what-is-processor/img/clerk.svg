<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точна аналогія: надшвидкий, бездоганно слухняний клерк</text>
<circle cx="140.0" cy="140.0" r="13.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<path d="M120,172 Q140,150 160,172" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="96.0" y="186.0" width="90.0" height="70.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="108.0" y1="202.0" x2="174.0" y2="202.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="108.0" y1="216.0" x2="174.0" y2="216.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="108.0" y1="230.0" x2="174.0" y2="230.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="108.0" y1="244.0" x2="174.0" y2="244.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="140.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">клерк зі списком</text>
<rect x="250.0" y="80.0" width="520.0" height="130.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="510.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">У чому аналогія точна</text>
<text x="268.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• виконує накази строго по порядку, один за одним</text>
<text x="268.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• кожен наказ простий і однозначний</text>
<text x="268.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• не імпровізує — робить рівно те, що в списку</text>
<rect x="250.0" y="224.0" width="520.0" height="134.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="510.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Де аналогія ламається</text>
<text x="268.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• живий клерк розуміє сенс і помітив би абсурд —</text>
<text x="268.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  процесор не розуміє нічого</text>
<text x="268.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• для нього команда — просто число, що вмикає дію</text>
<text x="268.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• хибний наказ зробить так само ретельно → звідси баги</text>
<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">образ клерка — щоб уявити роботу; «без розуміння» — щоб не чекати здорового глузду</text>
</svg>