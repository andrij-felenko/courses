<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 873.3 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="873.3" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фази життєвого циклу сторінки в протоколі Twin-and-Diff</text>
<rect x="40.0" y="60.0" width="175.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="127.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Чистий стан</text>
<rect x="55.0" y="95.0" width="145.0" height="30.0" rx="4" fill="#e2e8f0" stroke="#6b7280" stroke-width="1.0"/>
<text x="127.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сторінка: PROT_READ</text>
<text x="127.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Читання локальне (1 нс)</text>
<line x1="215.0" y1="115.0" x2="255.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="235.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Store</text>
<rect x="260.0" y="60.0" width="245.0" height="190.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="382.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2. Перехоплення запису</text>
<text x="382.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="382.0" dy="0.0">MMU генерує Page Fault</tspan><tspan x="382.0" dy="13.0">Обробник SIGSEGV:</tspan></text>
<rect x="275.0" y="135.0" width="105.0" height="45.0" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="327.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тіньовий Twin</text>
<text x="327.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">memcpy(twin, p)</text>
<rect x="390.0" y="135.0" width="105.0" height="45.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="442.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Робоча сторінка</text>
<text x="442.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">PROT_READ|WRITE</text>
<text x="382.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">mprotect() розблоковує запис</text>
<text x="382.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Команда повторюється процесором</text>
<line x1="505.0" y1="115.0" x2="545.0" y2="115.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання</text>
<rect x="550.0" y="60.0" width="270.0" height="130.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="685.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Нативне виконання епохи</text>
<text x="685.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Потоки вільно виконують тисячі</tspan><tspan x="685.0" dy="13.0">операцій читання та запису в DRAM</tspan><tspan x="685.0" dy="13.0">з нульовими програмними накладними</tspan><tspan x="685.0" dy="13.0">витратами на інструкцію (0 % оверхед).</tspan></text>
<line x1="685.0" y1="195.0" x2="685.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="748.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка синхронізації
(Release / Barrier)</text>
<rect x="80.0" y="280.0" width="700.0" height="180.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="430.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Обчислення компактного Diff і скидання прав</text>
<rect x="110.0" y="325.0" width="180.0" height="50.0" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="200.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Twin (стан до змін)</text>
<text x="200.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">[ 0x00, 0x00, 0x12, 0x34 ... ]</text>
<text x="305.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">VS</text>
<rect x="325.0" y="325.0" width="180.0" height="50.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="415.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Робоча сторінка (після)</text>
<text x="415.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">[ 0x00, 0x00, 0x99, 0x34 ... ]</text>
<line x1="510.0" y1="350.0" x2="550.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="325.0" width="200.0" height="50.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Diff-запис: [Зсув=2, Байт=0x99]</text>
<text x="655.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розмір: 6 байтів замість 4096</text>
<text x="430.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Звільнення пам'яті Twin → 2. mprotect(p, PROT_READ) → 3. Передача Diff у мережу</text>
<text x="430.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Сторінка повертається у Фазу 1 для захисту від майбутніх записів нової епохи.</text>
</svg>