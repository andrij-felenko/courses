<text x="380.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Стіна 2004-го — причина: одиноке ядро вже не пришвидшити, тож ту саму площу пустили на кілька ядер</text>
