<text x="345.2" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТІНА ПОТУЖНОСТІ</text>
<text x="345.2" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">скасовано Tejas і 4-ГГц P4:</text>
