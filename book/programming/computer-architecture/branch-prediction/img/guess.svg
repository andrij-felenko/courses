<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гілка ще в конвеєрі — а куди вибирати далі?</text>
<rect x="40.0" y="70.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Вибірка</tspan></text>
<rect x="168.0" y="70.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="228.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="228.0" dy="0.0">Декод</tspan></text>
<rect x="296.0" y="70.0" width="120.0" height="46.0" rx="6" fill="#fff4e6" stroke="#333333" stroke-width="1.5"/><text x="356.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="356.0" dy="0.0">Вик</tspan></text>
<rect x="424.0" y="70.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="484.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="484.0" dy="0.0">Пам'ять</tspan></text>
<rect x="552.0" y="70.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="612.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Запис</tspan></text>
<text x="164.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">тут гілка BNE</text>
<text x="356.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">напрям відомий аж тут</text>
<line x1="356.0" y1="116.0" x2="356.0" y2="134.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="100.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<text x="100.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">яку адресу</text>
<text x="100.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">брати цього такту?</text>
<rect x="60.0" y="240.0" width="260.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">НЕ стрибнули → наступна за порядком</tspan><tspan x="190.0" dy="15.6">(адреса гілки + розмір команди)</tspan></text>
<rect x="400.0" y="240.0" width="260.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">СТРИБНУЛИ → ціль стрибка</tspan><tspan x="530.0" dy="15.6">(куди веде мітка гілки)</tspan></text>
<line x1="100.0" y1="202.0" x2="150.0" y2="234.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="100.0" y1="202.0" x2="500.0" y2="234.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Чекати з вибіркою — конвеєр спорожніє. Тому процесор мусить ОБРАТИ наперед — тобто вгадати.</text>
