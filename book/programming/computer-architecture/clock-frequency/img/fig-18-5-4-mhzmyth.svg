<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396">
<rect width="900" height="396" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Міф мегагерців»: вища частота ≠ завжди швидше</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два процесори з різною частотою, але різним CPI — і повільніший за МГц виявляється швидшим у ділі</text>
<rect x="90.0" y="92.0" width="330.0" height="200.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="255.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Процесор A</text>
<text x="255.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">200 МГц</text>
<text x="255.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">але CPI = 4 (багато простоїв)</text>
<line x1="120.0" y1="188.0" x2="390.0" y2="188.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="255.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">200 млн ÷ 4 =</text>
<text x="255.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">50 млн команд/с</text>
<text x="255.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вища частота…</text>
<rect x="480.0" y="92.0" width="330.0" height="200.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="645.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Процесор B</text>
<text x="645.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">100 МГц</text>
<text x="645.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">але CPI = 1 (ефективний)</text>
<line x1="510.0" y1="188.0" x2="780.0" y2="188.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="645.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">100 млн ÷ 1 =</text>
<text x="645.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">100 млн команд/с</text>
<text x="645.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">…але ВДВІЧІ швидший!</text>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому порівнювати процесори лише за МГц — помилка (особливо різні архітектури). Важить РОБОТА за секунду, а не такти.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Частота чесно порівнює хіба що той самий процесор із собою; між різними ISA вона майже нічого не каже.</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Цей урок дорого коштував індустрії в «гонитві за гігагерцами» 1990–2000-х.</text>
</svg>
