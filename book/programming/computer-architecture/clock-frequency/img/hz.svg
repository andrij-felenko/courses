<rect x="110.0" y="262.0" width="220.0" height="56.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="220.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Arduino Uno</text>
<text x="220.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">16 МГц  ·  16 млн тактів/с</text>
<rect x="350.0" y="262.0" width="220.0" height="56.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="460.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32</text>
<text x="460.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">240 МГц  ·  240 млн/с</text>
<rect x="590.0" y="262.0" width="220.0" height="56.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="700.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сучасний ПК</text>
<text x="700.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3–5 ГГц  ·  мільярди/с</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Отже «ESP32 на 240 МГц» означає: його такт цокає 240 мільйонів разів щосекунди — і стільки ж разів зрушується серцебиття процесора.</text>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Більша частота — більше тактів за секунду — швидше крутиться цикл вибірка-декодування-виконання. Та не все так просто (далі).</text>
</svg>
