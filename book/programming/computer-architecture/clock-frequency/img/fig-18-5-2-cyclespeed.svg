<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама секунда, той самий цикл — але швидший такт устигає прокрутити його більше разів, тобто виконати більше команд.</text>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси й гонитва за мегагерцами: більше тактів за секунду = більше роботи. Але «такт» і «команда» — НЕ одне й те саме…</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(і саме тому частота — не вся правда про швидкість; див. наступні фігури)</text>
