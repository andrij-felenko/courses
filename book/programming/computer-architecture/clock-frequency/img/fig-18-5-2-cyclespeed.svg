<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен такт рухає цикл §18.3; за одну секунду повільний процесор робить мало обертів, швидкий — багато</text>
