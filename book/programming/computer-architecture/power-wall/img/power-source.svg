<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки в чипі береться тепло</text>
<rect x="70.0" y="70.0" width="260.0" height="150.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="200.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a2820" text-anchor="middle" font-weight="700">один вентиль = конденсатор</text>
<line x1="150.0" y1="120.0" x2="250.0" y2="120.0" stroke="#1a1a1a" stroke-width="3.0"/>
<line x1="150.0" y1="165.0" x2="250.0" y2="165.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="200.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">V</text>
<text x="266.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">заряд ↑</text>
<text x="266.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">= «1»</text>
<text x="200.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зарядити → розрядити = порція тепла</text>
<text x="410.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">×</text>
<rect x="440.0" y="70.0" width="260.0" height="150.0" rx="10" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="570.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">мільярди вентилів</text>
<text x="570.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">× мільярди перемикань</text>
<text x="570.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">за секунду</text>
<text x="570.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">= гаряча пічка на долоні</text>
<rect x="150.0" y="250.0" width="460.0" height="60.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">P = C · V² · f</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V у квадраті — головна пружина: удвічі вища напруга → вчетверо більше тепла.</text>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">C — ємність, V — напруга, f — частота такту (перемикань за секунду).</text>
</svg>