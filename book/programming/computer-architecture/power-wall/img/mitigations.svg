<text x="662.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">NPU</text>
<rect x="698.0" y="150.0" width="56.0" height="34.0" rx="5" fill="#e3e6ea" stroke="#c4c8cd" stroke-width="1.3"/>
<text x="726.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">FPU</text>
<text x="660.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">мозаїка економних блоків</text>
<text x="660.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">світиться лише потрібний,</text>
<text x="660.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">решта — темна</text>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жодна не скасовує фізику — усі живуть у тому самому тепловому бюджеті, лиш розумніше.</text>
<text x="400.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Ось чому сучасний чип — багато різних ядер із режимами розгону й купою прискорювачів.</text>
</svg>