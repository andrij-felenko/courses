<rect x="698.0" y="106.0" width="56.0" height="34.0" rx="5" fill="#e3e6ea" stroke="#c4c8cd" stroke-width="1.3"/>
<text x="726.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">кодек</text>
<rect x="570.0" y="150.0" width="56.0" height="34.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="598.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">крипто</text>
