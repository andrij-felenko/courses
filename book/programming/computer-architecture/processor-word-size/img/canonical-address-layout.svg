<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема 48-бітної канонічної адреси в x86-64 та знакове розширення</text>
<rect x="50.0" y="50.0" width="300.0" height="50.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Біти 63 .. 48 (16 бітів)</text>
<text x="200.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Копія біта 47 (знакове розширення)</text>
<rect x="350.0" y="50.0" width="60.0" height="50.0" rx="4" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Біт 47</text>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">знак</text>
<rect x="410.0" y="50.0" width="460.0" height="50.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Біти 46 .. 0 (47 бітів)</text>
<text x="640.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фізичний індекс сторінки + зміщення</text>
<rect x="60.0" y="135.0" width="800.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Простір ядра (Kernel Space)</text>
<text x="190.0" y="185.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="start">0xFFFF_8000_0000_0000 .. 0xFFFF_FFFF_FFFF_FFFF</text>
<text x="720.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">128 ТБ (біт 47 = 1)</text>
<rect x="60.0" y="213.0" width="800.0" height="95.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/>
<text x="460.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">НЕКАНОНІЧНА ДІРА (Non-canonical Address Hole)</text>
<text x="460.0" y="263.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="start">0x0000_8000_0000_0000 .. 0xFFFF_7FFF_FFFF_FFFF</text>
<text x="460.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Будь-яке звернення до цієї зони викликає апаратне виключення #GP (General Protection)</text>
<rect x="60.0" y="321.0" width="800.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Простір користувача (User Space)</text>
<text x="190.0" y="371.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="start">0x0000_0000_0000_0000 .. 0x0000_7FFF_FFFF_FFFF</text>
<text x="720.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">128 ТБ (біт 47 = 0)</text>
</svg>