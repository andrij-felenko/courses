<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність обробки сторінкової помилки в DSM</text>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл перехоплення сторінкової помилки у Software DSM</text>
<rect x="45.0" y="76.0" width="175.0" height="78.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="132.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Доступ</text>
<text x="132.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">ЦП виконує *ptr = 42</tspan><tspan x="132.5" dy="12.5">на захищеній сторінці</tspan></text>
<rect x="240.0" y="76.0" width="175.0" height="78.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="327.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. MMU</text>
<text x="327.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">Апаратний збій</tspan><tspan x="327.5" dy="12.5">Page Fault (права)</tspan></text>
<rect x="435.0" y="76.0" width="175.0" height="78.0" rx="4" fill="#fff9db" stroke="#333333" stroke-width="1.5"/>
<text x="522.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">3. Ядро ОС</text>
<text x="522.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Формування сигналу</tspan><tspan x="522.5" dy="12.5">SIGSEGV (si_addr)</tspan></text>
<rect x="630.0" y="76.0" width="175.0" height="78.0" rx="4" fill="#f3eafa" stroke="#8e44ad" stroke-width="1.5"/>
<text x="717.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">4. Обробник</text>
<text x="717.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="717.5" dy="0.0">sigaction перехоплює</tspan><tspan x="717.5" dy="12.5">адресу віддаленої сторінки</tspan></text>
<rect x="630.0" y="182.0" width="175.0" height="78.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="717.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">5. Мережа</text>
<text x="717.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="717.5" dy="0.0">Запит сторінки 4KB</tspan><tspan x="717.5" dy="12.5">у віддаленого власника</tspan></text>
<rect x="435.0" y="182.0" width="175.0" height="78.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="522.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">6. Відповідь</text>
<text x="522.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Отримання даних</tspan><tspan x="522.5" dy="12.5">через TCP/IP або RDMA</tspan></text>
<rect x="240.0" y="182.0" width="175.0" height="78.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="327.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">7. mprotect</text>
<text x="327.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">Зняття захисту</tspan><tspan x="327.5" dy="12.5">PROT_READ | PROT_WRITE</tspan></text>
<rect x="45.0" y="182.0" width="175.0" height="78.0" rx="4" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/>
<text x="132.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">8. Повтор</text>
<text x="132.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">ЦП прозоро повторює</tspan><tspan x="132.5" dy="12.5">команду без помилки</tspan></text>
<line x1="220.0" y1="115.0" x2="240.0" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="415.0" y1="115.0" x2="435.0" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="610.0" y1="115.0" x2="630.0" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="717.5" y1="154.0" x2="717.5" y2="182.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="630.0" y1="221.0" x2="610.0" y2="221.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="435.0" y1="221.0" x2="415.0" y2="221.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="240.0" y1="221.0" x2="220.0" y2="221.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="306.0" width="765.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="427.5" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Для прикладної програми весь ланцюжок від MMU до отримання мережного пакета</tspan><tspan x="427.5" dy="15.6">виглядає як звичайна затримка читання або запису в пам'ять.</tspan><tspan x="427.5" dy="15.6">Програма не містить жодного рядка з кодом сокетів чи серіалізації.</tspan></text>
</svg>