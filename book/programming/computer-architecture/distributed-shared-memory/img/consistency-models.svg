<text x="645.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Локальні записи виконуються зі швидкістю RAM;</text>
<text x="645.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">мережні повідомлення об'єднуються у пачку</text>
<rect x="50.0" y="350.0" width="760.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Послідовна узгодженість робить мережу частиною кожного запису.</tspan><tspan x="430.0" dy="15.6">Узгодженість за звільненням (RC) відкладає обмін до межі критичної секції,</tspan><tspan x="430.0" dy="15.6">зменшуючи кількість мережних транзакцій на кілька порядків.</tspan></text>
</svg>