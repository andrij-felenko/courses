<text x="215.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мережний трафік на КОЖНУ інструкцію запису:</text>
