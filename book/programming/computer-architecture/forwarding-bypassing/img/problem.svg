<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наївно: чекати запису — це 2 порожні такти (бульбашки) на кожну таку пару.</text>
<text x="410.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Але ж результат уже полічений на виході АЛП у т3 — просто ще не доїхав до регістрів.</text>
<text x="410.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Навіщо ганяти його в регістр і назад, якщо можна подати прямо?</text>
