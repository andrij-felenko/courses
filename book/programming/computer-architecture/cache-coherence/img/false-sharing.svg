<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хибне спільне (false sharing): лінія літає шиною задарма</text>
<text x="380.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Одна кеш-лінія на дві незалежні змінні</text>
<rect x="294.0" y="76.0" width="172.0" height="44.0" rx="6" fill="none" stroke="#2457d6" stroke-width="1.4"/>
<rect x="300.0" y="82.0" width="76.0" height="32.0" rx="3" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="338.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">a (ядро A)</text>
<rect x="380.0" y="82.0" width="76.0" height="32.0" rx="3" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="418.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">b (ядро B)</text>
<text x="380.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">одна лінія (64 байти)</text>
<rect x="70.0" y="150.0" width="120.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="130.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро A</text>
<text x="130.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пише лише a</text>
<rect x="570.0" y="150.0" width="120.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="630.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро B</text>
<text x="630.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пише лише b</text>
<path d="M 195 168 A 180 60 0 0 1 565 168" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 565 196 A 180 60 0 0 1 195 196" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">запис у a знеправлює лінію в B, запис у b — в A:</text>
<text x="380.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">лінія «літає» шиною туди-сюди, хоч дані незалежні (хибне спільне)</text>
<line x1="60.0" y1="272.0" x2="720.0" y2="272.0" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вирівнювання: кожна змінна — у своїй лінії</text>
<rect x="174.0" y="318.0" width="88.0" height="40.0" rx="6" fill="none" stroke="#27ae60" stroke-width="1.4"/>
<rect x="180.0" y="324.0" width="76.0" height="28.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="218.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<text x="218.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лінія A</text>
<rect x="474.0" y="318.0" width="88.0" height="40.0" rx="6" fill="none" stroke="#27ae60" stroke-width="1.4"/>
<rect x="480.0" y="324.0" width="76.0" height="28.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="518.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">b</text>
<text x="518.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лінія B</text>
<text x="380.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ядра більше не чіпають спільної лінії — пінг-понг зник, кожне мчить своєю</text>
</svg>