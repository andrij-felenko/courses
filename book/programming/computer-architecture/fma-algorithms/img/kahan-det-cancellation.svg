<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Катастрофічне скасування та алгоритм Вільяма Кахана для det = ad − bc</text>
<rect x="40.0" y="55.0" width="360.0" height="320.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний підхід: (a × d) − (b × c)</text>
<rect x="60.0" y="100.0" width="320.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">p = round(a × d) [округлення 1]</text>
<rect x="60.0" y="145.0" width="320.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">q = round(b × c) [округлення 2]</text>
<line x1="220.0" y1="177.0" x2="220.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="200.0" width="320.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Віднімання p − q при p ≈ q</text>
<text x="220.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Катастрофічне скасування розрядів!</text>
<line x1="220.0" y1="255.0" x2="220.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="280.0" width="320.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Старші 50 бітів збігаються і зникають.</text>
<text x="220.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">У результаті лишається 3 біти шуму.</text>
<text x="220.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Відносна похибка: до 100% (або хибний знак)</text>
<rect x="440.0" y="55.0" width="360.0" height="320.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Алгоритм Кахана на базі FMA</text>
<rect x="460.0" y="100.0" width="320.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. w = b × c</text>
<rect x="460.0" y="145.0" width="320.0" height="32.0" rx="4" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="620.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">2. e = fma(-b, c, w)  [точна похибка w]</text>
<line x1="620.0" y1="177.0" x2="620.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="200.0" width="320.0" height="55.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. d = fma(a, d, -w)  [різниця у 106 бітах]</text>
<text x="620.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. det = d + e        [додавання похибки]</text>
<line x1="620.0" y1="255.0" x2="620.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="280.0" width="320.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">FMA утримує 106 бітів різниці a·d − w.</text>
<text x="620.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Похибка e компенсує залишок округлення w.</text>
<text x="620.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантована похибка: ≤ 1.5 ULP!</text>
<rect x="40.0" y="385.0" width="760.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Кахана гарантує високу відносну точність навіть при майже повному збігу добутків</text>
</svg>