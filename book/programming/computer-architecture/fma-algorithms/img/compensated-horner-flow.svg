<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компенсована схема Горнера: паралельне відстеження полінома та похибок</text>
<rect x="40.0" y="55.0" width="760.0" height="115.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Основна обчислювальна лінія: sᵢ = sᵢ₋₁ × x + aᵢ</text>
<rect x="60.0" y="95.0" width="140.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Попереднє sᵢ₋₁</text>
<line x1="200.0" y1="113.0" x2="240.0" y2="113.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="95.0" width="170.0" height="36.0" rx="4" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="325.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">TwoProductFMA(sᵢ₋₁, x)</text>
<line x1="410.0" y1="113.0" x2="450.0" y2="113.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="95.0" width="160.0" height="36.0" rx="4" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="530.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">TwoSum(pᵢ, aᵢ)</text>
<line x1="610.0" y1="113.0" x2="650.0" y2="113.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="95.0" width="130.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="715.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Нове значення sᵢ</text>
<line x1="325.0" y1="131.0" x2="325.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="131.0" x2="530.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="335.0" y="170.0" width="140.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="405.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Похибка множення πᵢ</text>
<rect x="540.0" y="170.0" width="140.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Похибка додавання σᵢ</text>
<rect x="40.0" y="230.0" width="760.0" height="135.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Лінія компенсації: P_err(x) = ∑ (πᵢ + σᵢ) × xⁿ⁻ⁱ</text>
<rect x="60.0" y="275.0" width="170.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="145.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Поточна похибка eᵢ₋₁</text>
<line x1="230.0" y1="293.0" x2="270.0" y2="293.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270.0" y="275.0" width="310.0" height="36.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="425.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Акумуляція похибки: eᵢ = fma(eᵢ₋₁, x, πᵢ + σᵢ)</text>
<line x1="580.0" y1="293.0" x2="620.0" y2="293.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="275.0" width="160.0" height="36.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Акумульована eᵢ</text>
<text x="420.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оновлення полінома похибок виконується однією інструкцією FMA без розширених типів</text>
<rect x="40.0" y="385.0" width="760.0" height="65.0" rx="6" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фінальний результат: res = s_n + e_n (додавання накопиченого виправлення)</text>
<text x="420.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Точність подвоюється: результат еквівалентний обчисленню в quad precision з подальшим округленням до double</text>
</svg>