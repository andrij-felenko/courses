<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм точного розкладання добутку: алгоритм Fast2Mult на базі FMA</text>
<rect x="40.0" y="55.0" width="360.0" height="180.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 1: Старша частина x = round(a × b)</text>
<rect x="60.0" y="95.0" width="140.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мантиса a (53 біти)</text>
<rect x="240.0" y="95.0" width="140.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="310.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мантиса b (53 біти)</text>
<line x1="130.0" y1="127.0" x2="190.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="127.0" x2="250.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="145.0" width="240.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Множення: 106 бітів у конвеєрі</text>
<line x1="220.0" y1="177.0" x2="220.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="195.0" width="280.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Округлення IEEE 754 -&gt; x (старші 53 біти)</text>
<rect x="440.0" y="55.0" width="360.0" height="180.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 2: Точний залишок y = fma(a, b, -x)</text>
<rect x="460.0" y="95.0" width="150.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="535.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Добуток a × b (106 бітів)</text>
<rect x="630.0" y="95.0" width="150.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Віднімання -x (53 біти)</text>
<line x1="535.0" y1="127.0" x2="590.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="705.0" y1="127.0" x2="650.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="145.0" width="280.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Акумулятор FMA: точне скасування старших бітів</text>
<line x1="620.0" y1="177.0" x2="620.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="195.0" width="280.0" height="30.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат y: рівно молодші 53 біти (без похибки!)</text>
<rect x="40.0" y="255.0" width="760.0" height="200.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія розрядної сітки: точний зв'язок a × b = x + y</text>
<rect x="70.0" y="305.0" width="340.0" height="38.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Старша частина: число x (53 біти)</text>
<rect x="410.0" y="305.0" width="350.0" height="38.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="585.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Молодший хвіст: залишок y (≤ 53 біти)</text>
<line x1="70.0" y1="350.0" x2="760.0" y2="350.0" stroke="#333333" stroke-width="1.2"/>
<text x="70.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Біт 106 (MSB)</text>
<text x="410.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Біт 53 (Межа ULP(x))</text>
<text x="760.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Біт 1 (LSB)</text>
<rect x="70.0" y="390.0" width="690.0" height="50.0" rx="6" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="420.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чому FMA не створює другої похибки: віднімання -x відбувається всередині широкого акумулятора FMA.</text>
<text x="420.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Старші 53 біти взаємно знищуються, а залишок y займає не більше 53 бітів, тому вкладається у double абсолютно точно.</text>
</svg>