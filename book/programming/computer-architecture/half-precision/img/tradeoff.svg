<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що обміняли: float16 бере точність, bfloat16 — діапазон</text>
<line x1="90.0" y1="300.0" x2="650.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="300.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">діапазон (де живе порядок) →</text>
<text x="70.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">↑ точність (мантиса)</text>
<circle cx="622.0" cy="93.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="622.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">float32</text>
<text x="622.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">24 біти точності · ±3.4·10³⁸</text>
<circle cx="258.0" cy="173.5" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="258.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">float16</text>
<text x="258.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">11 бітів · ±65 504</text>
<circle cx="622.0" cy="226.4" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="622.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">bfloat16</text>
<text x="622.0" y="250.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8 бітів · ±3.4·10³⁸</text>
<line x1="622.0" y1="93.0" x2="622.0" y2="226.4" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="630.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">той самий
діапазон</text>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">float16 і bfloat16 — обидва 16 бітів; один купує точність, другий — діапазон</text>
</svg>