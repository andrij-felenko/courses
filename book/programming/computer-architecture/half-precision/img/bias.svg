<circle cx="630.0" cy="160.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="90.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">нижча сходинка</text>
<text x="630.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">вища сходинка</text>
<line x1="360.0" y1="126.0" x2="360.0" y2="194.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
