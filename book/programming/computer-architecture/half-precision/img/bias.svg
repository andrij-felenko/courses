<line x1="424.8" y1="126.0" x2="424.8" y2="152.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="418.8" y1="234.0" x2="102.0" y2="234.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="257.4" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДКИДАННЯ → завжди вниз</text>
<line x1="430.8" y1="86.0" x2="618.0" y2="86.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="527.4" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ОКРУГЛЕННЯ → до найближчої</text>
<text x="360.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Відкидання завжди зсуває до нижчої сходинки → сума мільйона чисел «сповзає» вниз</text>
