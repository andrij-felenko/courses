<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід: MSI → MESI → MOESI, і гілка MESIF</text>
<rect x="55.0" y="97.0" width="150.0" height="66.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.9"/>
<text x="130.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">M S I</text>
<text x="130.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 стани — база</text>
<rect x="265.0" y="97.0" width="150.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="340.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">M E S I</text>
<text x="340.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ Exclusive</text>
<rect x="485.0" y="97.0" width="150.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/>
<text x="560.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">M O E S I</text>
<text x="560.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ Owned</text>
<line x1="205.0" y1="130.0" x2="265.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="415.0" y1="130.0" x2="485.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="117.0" y="189.0" width="236.0" height="58.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">зайвий invalidate, коли ядро</tspan><tspan x="235.0" dy="11.7">само читало лінію, тоді пише —</tspan><tspan x="235.0" dy="11.7">перший запис стає тихим</tspan></text>
<text x="235.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">E прибирає:</text>
<rect x="332.0" y="189.0" width="236.0" height="58.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">зайвий write-back у RAM,</tspan><tspan x="450.0" dy="11.7">щоб поділитися брудною лінією —</tspan><tspan x="450.0" dy="11.7">власник віддає її прямо з кеша</tspan></text>
<text x="450.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">O прибирає:</text>
<rect x="265.0" y="307.0" width="150.0" height="66.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/>
<text x="340.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">M E S I F</text>
<text x="340.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ Forward</text>
<line x1="340.0" y1="163.0" x2="340.0" y2="307.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="435.0" y="306.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">F прибирає зайву відповідь: коли</tspan><tspan x="560.0" dy="11.7">копію мають кілька ядер, лишень</tspan><tspan x="560.0" dy="11.7">ОДИН (у стані Forward) віддає її</tspan><tspan x="560.0" dy="11.7">тому, хто просить — не всі разом</tspan></text>
<text x="380.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">спільна логіка одна — кожен зайвий стан лише гасить свій різновид непотрібної роботи на шині</text>
</svg>