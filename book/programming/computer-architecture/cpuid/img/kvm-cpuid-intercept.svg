<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплення та маскування CPUID у гіпервізорі KVM/QEMU</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплення та маскування CPUID у гіпервізорі KVM/QEMU</text>
<rect x="40.0" y="70.0" width="880.0" height="140.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="140.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Гість (VM Non-Root)</text>
<rect x="60.0" y="115.0" width="260.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Застосунок або ядро гостя</tspan><tspan x="190.0" dy="16.2">виконує інструкцію CPUID</tspan><tspan x="190.0" dy="16.2">(EAX=1, ECX=0)</tspan></text>
<rect x="640.0" y="115.0" width="260.0" height="75.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Гість отримує віртуалізовані</tspan><tspan x="770.0" dy="16.2">значення регістрів EAX..EDX</tspan><tspan x="770.0" dy="16.2">і продовжує виконання</tspan></text>
<line x1="340.0" y1="150.0" x2="460.0" y2="240.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">VM-Exit (EXIT_REASON_CPUID)</text>
<line x1="580.0" y1="240.0" x2="680.0" y2="195.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="665.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">VM-Entry (Відновлення vCPU)</text>
<rect x="40.0" y="250.0" width="880.0" height="190.0" rx="6" fill="#fbf8f2" stroke="#c98a00" stroke-width="1.6"/>
<text x="140.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c98a00" text-anchor="middle" font-weight="700">Господар (Root Mode / KVM &amp; QEMU)</text>
<rect x="60.0" y="295.0" width="260.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="322.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Перехоплення в KVM</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">1. Зчитування вхідних EAX/ECX</tspan><tspan x="190.0" dy="15.6">2. Пошук у таблиці конфігурації</tspan><tspan x="190.0" dy="15.6">(налаштованій через ioctl</tspan><tspan x="190.0" dy="15.6">KVM_SET_CPUID2)</tspan></text>
<rect x="350.0" y="295.0" width="260.0" height="125.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="480.0" y="322.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Маскування та фільтрація</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">• Вимкнення AVX-512 для міграції</tspan><tspan x="480.0" dy="15.6">• Додавання бітів IBRS / IBPB</tspan><tspan x="480.0" dy="15.6">• Встановлення Hypervisor Bit</tspan><tspan x="480.0" dy="15.6">• Формування vCPU топології</tspan></text>
<rect x="640.0" y="295.0" width="260.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Запис у стан vCPU</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">Запис змодельованих значень</tspan><tspan x="770.0" dy="14.3">у віртуальні EAX, EBX, ECX, EDX</tspan><tspan x="770.0" dy="14.3">інкремент гостьового RIP (+2)</tspan><tspan x="770.0" dy="14.3">для переходу до наступної інструкції</tspan></text>
<line x1="320.0" y1="355.0" x2="350.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="355.0" x2="640.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>