<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дають дві шини: вибірку команди й доступ до даних — водночас</text>
<rect x="40.0" y="70.0" width="330.0" height="180.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="205.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Фон Нейман: по черзі</text>
<text x="205.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">одна шина → дві потреби конфліктують</text>
<rect x="80.0" y="134.0" width="250.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="153.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">такт 1: вибрати команду</tspan></text>
<rect x="80.0" y="176.0" width="250.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">такт 2: читати дані</tspan></text>
<text x="205.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">доступ до даних чекає на вибірку</text>
<rect x="390.0" y="70.0" width="330.0" height="180.0" rx="6" fill="#eef7f1" stroke="#27ae60" stroke-width="1.6"/>
<text x="555.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Гарвард: водночас</text>
<text x="555.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дві шини → обидві потреби разом</text>
<rect x="410.0" y="150.0" width="140.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">вибрати команду</tspan></text>
<rect x="560.0" y="150.0" width="140.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">читати дані</tspan></text>
<text x="555.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">обидва — за один такт</text>
<text x="555.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ніхто нікого не чекає</text>
</svg>