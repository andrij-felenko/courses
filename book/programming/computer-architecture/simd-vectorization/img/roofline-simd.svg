<circle cx="196.0" cy="401.8" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="218.0" dy="0.0">c[i] = a[i] + b[i]</tspan><tspan x="218.0" dy="15.6">обидві версії тут — виграшу немає</tspan></text>
