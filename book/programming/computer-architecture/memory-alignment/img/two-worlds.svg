<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невирівняний доступ: терпіти повільно чи впасти в HardFault</text>
<rect x="60.0" y="80.0" width="380.0" height="320.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Терпить (повільніше)</text>
<text x="250.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">x86 / x86-64 · Cortex-M3/M4/M7</text>
<text x="80.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Доступ дозволено</text>
<text x="96.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">процесор сам робить 2 читання + склеювання</text>
<text x="80.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Код просто працює</text>
<text x="96.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">програміст навіть не помічає</text>
<text x="80.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Плата — швидкодія</text>
<text x="96.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">і то помітно лише на розколі рядка кешу</text>
<text x="80.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Сучасні x86 (від Nehalem)</text>
<text x="96.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">усередині рядка кешу — майже без втрат</text>
<rect x="460.0" y="80.0" width="380.0" height="320.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Падає (HardFault)</text>
<text x="650.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Cortex-M0/M0+ · DEC Alpha · периферія</text>
<text x="480.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Апаратура не вміє</text>
<text x="496.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">невирівняного доступу до слова/півслова</text>
<text x="480.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Миттєвий виняток</text>
<text x="496.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">LDR/STR з невирівняною адресою → fault</text>
<text x="480.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Прошивка у HardFault</text>
<text x="496.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">зависання чи перезавантаження</text>
<text x="480.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">•  Завжди faultять</text>
<text x="496.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">LDM/STM, LDRD, атомарні, доступ до периферії</text>
<rect x="60.0" y="414.0" width="780.0" height="44.0" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="450.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий рядок C: на ПК тихо повільний, на Cortex-M0 — мертвий пристрій. «Працює в мене на ноуті» нічого не доводить.</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Біт CCR.UNALIGN_TRP на M3+ можна ввімкнути й змусити faultити всюди — для налагодження.</text>
</svg>