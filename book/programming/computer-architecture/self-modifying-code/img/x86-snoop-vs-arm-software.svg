<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний снупінг x86 проти явного програмного керування ARM/RISC-V</text>
<rect x="30.0" y="25.0" width="365.0" height="365.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="212.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">x86 / x86-64: Апаратний снупінг (SMC)</text>
<rect x="50.0" y="75.0" width="325.0" height="60.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис інструкції через D-Cache</text>
<text x="212.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Звичайний store: MOV [rip+offset], eax</text>
<line x1="212.0" y1="135.0" x2="212.0" y2="155.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="155.0" width="325.0" height="75.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="212.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратна логіка виявлення SMC</text>
<text x="212.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Снупінг перевіряє адресу запису в I-Cache,</text>
<text x="212.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">черзі вибірки, декодерах та буфері ROB</text>
<line x1="212.0" y1="230.0" x2="212.0" y2="250.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="250.0" width="325.0" height="65.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратне скидання (Machine Clear)</text>
<text x="212.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Повне очищення конвеєра та I-Cache лінії.</text>
<text x="212.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Штраф: ~150-300 тактів простою ядра</text>
<rect x="50.0" y="325.0" width="325.0" height="50.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимога: Серіалізація через CPUID / JMP</text>
<text x="212.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Забезпечує безпеку при випереджальній вибірці</text>
<rect x="425.0" y="25.0" width="365.0" height="365.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="607.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ARM / RISC-V: Програмне керування</text>
<rect x="445.0" y="75.0" width="325.0" height="60.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="607.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис інструкції через D-Cache</text>
<text x="607.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Звичайний store: STR W0, [X1]</text>
<line x1="607.0" y1="135.0" x2="607.0" y2="155.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="445.0" y="155.0" width="325.0" height="75.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="607.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратний снупінг ВІДСУТНІЙ</text>
<text x="607.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">L1 I-Cache не знає про зміни в D-Cache.</text>
<text x="607.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Економія кремнію та енергоспоживання ядра.</text>
<line x1="607.0" y1="230.0" x2="607.0" y2="250.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="445.0" y="250.0" width="325.0" height="65.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="607.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Явні інструкції обслуговування кешу</text>
<text x="607.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DC CVAU + DSB + IC IVAU + DSB + ISB</text>
<text x="607.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RISC-V: FENCE.I / sbi_remote_fence_i()</text>
<rect x="445.0" y="325.0" width="325.0" height="50.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="607.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передбачуваність: штраф лише при виклику</text>
<text x="607.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Швидкий звичайний код без зайвих апаратних перевірок</text>
</svg>