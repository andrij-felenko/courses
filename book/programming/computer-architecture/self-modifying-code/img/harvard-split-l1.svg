<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роздільна Гарвардська ієрархія кешів L1: неузгодженість I-Cache та D-Cache</text>
