<text x="180.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вужчі за int — ПІДІЙМАЮТЬСЯ</text>
