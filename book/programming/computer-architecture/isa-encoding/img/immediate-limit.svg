<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодування як бюджет бітів: чим платиш за сталу довжину</text>
<text x="200.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">12 біт на число в одній команді</text>
<rect x="40.0" y="70.0" width="320.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="40.0" y="70.0" width="200.0" height="44.0" rx="5" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.6"/>
<text x="140.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">opcode+rd+rs1+funct3</text>
<rect x="240.0" y="70.0" width="120.0" height="44.0" rx="5" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="300.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">imm 12б</text>
<text x="200.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">12 біт зі знаком →</text>
<rect x="70.0" y="150.0" width="260.0" height="34.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="200.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">−2048 … +2047</text>
<text x="200.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">більше в ОДНУ команду не влазить —</text>
<text x="200.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">місця в 32 бітах просто немає</text>
<line x1="410.0" y1="60.0" x2="410.0" y2="240.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="610.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a9842f" text-anchor="middle" font-weight="700">велике число 0x12345678?</text>
<text x="610.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">складаємо ДВОМА командами:</text>
<rect x="460.0" y="92.0" width="300.0" height="44.0" rx="7" fill="#eef2fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="610.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">lui  x5, 0x12345</text>
<text x="610.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кладе старші 20 біт у x5</text>
<line x1="610.0" y1="138.0" x2="610.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="460.0" y="158.0" width="300.0" height="44.0" rx="7" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.7"/>
<text x="610.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">addi x5, x5, 0x678</text>
<text x="610.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">додає молодші 12 біт</text>
<text x="610.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">два кроки замість одного — плата</text>
<text x="610.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">за сталу довжину команди</text>
<line x1="50.0" y1="270.0" x2="750.0" y2="270.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодування не лише описує команду — воно ОБМЕЖУЄ, що команда взагалі може виразити.</text>
<text x="400.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Скільки біт віддали під число — стільки й діапазон; скільки під поле регістра — стільки регістрів адресуєш.</text>
<text x="400.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">5 біт на регістр → рівно 2⁵ = 32 регістри. Ані на один більше — поле не розтягнути.</text>
<text x="400.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">формат — це і бюджет: кожне поле вкрадене в інших, тому в ISA завжди чимось жертвують</text>
</svg>