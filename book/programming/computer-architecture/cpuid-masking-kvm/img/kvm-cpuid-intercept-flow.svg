<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплення та емуляція інструкції CPUID у гіпервізорі KVM</text>
<rect x="30.0" y="50.0" width="900.0" height="150.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="160.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Гостьовий простір (VMX Non-Root)</text>
<rect x="50.0" y="95.0" width="230.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Гостьова програма / ОС</tspan><tspan x="165.0" dy="15.6">Виконує: CPUID (0F A2)</tspan><tspan x="165.0" dy="15.6">EAX = Leaf, ECX = Sub-leaf</tspan></text>
<rect x="340.0" y="95.0" width="270.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="475.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Апаратне перехоплення VT-x / AMD-V</tspan><tspan x="475.0" dy="15.6">Безумовний вихід у гіпервізор</tspan><tspan x="475.0" dy="15.6">EXIT_REASON_CPUID (причина 10)</tspan></text>
<rect x="670.0" y="95.0" width="240.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Відновлення роботи гостя</tspan><tspan x="790.0" dy="13.0">Оновлені регістри EAX, EBX, ECX, EDX</tspan><tspan x="790.0" dy="13.0">RIP = RIP + 2 (пропуск 0F A2)</tspan></text>
<line x1="280.0" y1="137.0" x2="340.0" y2="137.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="137.0" x2="670.0" y2="137.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="240.0" width="900.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір ядра хоста: модуль KVM (VMX Root Ring 0)</text>
<rect x="50.0" y="285.0" width="250.0" height="95.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="175.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">kvm_emulate_cpuid(vcpu)</tspan><tspan x="175.0" dy="13.0">Зчитує гостьові RAX та RCX</tspan><tspan x="175.0" dy="13.0">Визначає запитаний листок/підлисток</tspan></text>
<rect x="340.0" y="285.0" width="270.0" height="95.0" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/><text x="475.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">kvm_find_cpuid_entry(vcpu, leaf, idx)</tspan><tspan x="475.0" dy="14.3">Пошук у масиві kvm_cpuid_entry2</tspan><tspan x="475.0" dy="14.3">(або кешованих покажчиках vcpu)</tspan></text>
<rect x="650.0" y="285.0" width="260.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Запис змодельованих значень</tspan><tspan x="780.0" dy="15.6">kvm_rax_write, rbx, rcx, rdx</tspan><tspan x="780.0" dy="15.6">kvm_skip_emulated_instruction</tspan></text>
<rect x="200.0" y="405.0" width="560.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="434.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Конфігурація vCPU (завантажена VMM через ioctl KVM_SET_CPUID2):</tspan><tspan x="480.0" dy="13.7">Листки 0x0..0x23 (базові), 0x40000000..0x40000001 (PV), 0x80000000..0x80000028 (AMD/Ext)</tspan></text>
