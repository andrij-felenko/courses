<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна система команд на двох різних трактах</text>
<rect x="165.0" y="61.5" width="430.0" height="33.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">одна машинна команда: A(32) + B(32) → S(32)</tspan></text>
<text x="210.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Model 30 — дешева, повільна</text>
<rect x="60.0" y="155.0" width="300.0" height="250.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="80.0" y="175.0" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">сховище</tspan><tspan x="140.0" dy="14.3">(CCROS)</tspan></text>
<text x="210.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">8-бітний суматор</text>
<rect x="80.0" y="235.0" width="260.0" height="26.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прохід 1: байт 0 + байт 0 + перенос</text>
<rect x="80.0" y="269.0" width="260.0" height="26.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прохід 2: байт 1 + байт 1 + перенос</text>
<rect x="80.0" y="303.0" width="260.0" height="26.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прохід 3: байт 2 + байт 2 + перенос</text>
<rect x="80.0" y="337.0" width="260.0" height="26.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прохід 4: байт 3 + байт 3 + перенос</text>
<text x="210.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">32 біти = 4 проходи по 8 → довга мікропрограма</text>
<text x="550.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Model 50 — дорога, швидка</text>
<rect x="400.0" y="155.0" width="300.0" height="250.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.6"/>
<rect x="420.0" y="175.0" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">сховище</tspan><tspan x="480.0" dy="14.3">(BCROS)</tspan></text>
<text x="550.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">32-бітний суматор</text>
<rect x="420.0" y="240.0" width="260.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="550.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">один прохід: усі 32 біти разом</text>
<rect x="420.0" y="295.0" width="260.0" height="30.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.0"/>
<text x="550.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">+ окремий байтовий mover паралельно</text>
<text x="550.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">коротка мікропрограма → менше тактів на ту саму команду</text>
<line x1="260.0" y1="94.5" x2="210.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="94.5" x2="550.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Та сама ISA лежить мікропрограмою — тож різне залізо виконує однакову команду.</text>
</svg>