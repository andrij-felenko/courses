<text x="650.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кожен потрібний елемент — в ІНШІЙ лінії;</text>
<text x="650.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">решта принесеної лінії — викинута даремно</text>
<text x="650.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ промах майже на КОЖНОМУ доступі — ПОВІЛЬНО</text>
<rect x="60.0" y="312.0" width="780.0" height="110.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Однакова кількість «корисних» дій — а швидкість різниться в рази, бо один код влучає в кеш, а інший — ні.</text>
<text x="450.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси проста, але потужна звичка: обходьте дані ПОСЛІДОВНО, тримайте гаряче поряд — і кеш працюватиме на вас.</text>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це особливо важить там, де даних багато: пікселі кадру, відліки сигналу, великі масиви (Модулі 5–6).</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Кеш працює сам, без вашого втручання, — та порядок доступу, який ВИ задаєте в коді, вирішує, влучає він чи промахує.</text>
</svg>
