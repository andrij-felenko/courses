<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Практичний наслідок: той самий код може бути в РАЗИ швидшим</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обхід даних ПО ПОРЯДКУ йде в ногу з кеш-лініями (влучання); скоки по пам'яті — суцільні промахи</text>
