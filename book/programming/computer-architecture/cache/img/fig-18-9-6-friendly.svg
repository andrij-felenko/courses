<text x="250.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">a[1]…a[7] — уже влучання (вони в лінії!)</text>
