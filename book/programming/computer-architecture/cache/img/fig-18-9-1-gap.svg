<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь проблеми: ядро мчить, а пам'ять за ним не встигає</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за десятиліття швидкодія ядер зросла в тисячі разів, а пам'ять — у рази; розрив між ними дедалі ширшає</text>
<line x1="110.0" y1="286.0" x2="110.0" y2="90.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="110.0" y1="286.0" x2="490.0" y2="286.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="102.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">швидкодія</text>
<text x="102.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(лог. шкала)</text>
<text x="490.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">рік →</text>
<polyline points="110.0,270.0 200.0,232.0 290.0,182.0 390.0,128.0 482.0,102.0" fill="none" stroke="#c0271e" stroke-width="2.8"/>
<polyline points="110.0,272.0 200.0,260.0 290.0,246.0 390.0,232.0 482.0,220.0" fill="none" stroke="#1f47b5" stroke-width="2.8"/>
<text x="410.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ШВИДКОДІЯ ЯДРА</text>
<text x="410.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">× тисячі</text>
<text x="410.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ШВИДКІСТЬ ПАМ'ЯТІ</text>
<text x="410.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">× лише в рази</text>
<line x1="482.0" y1="220.0" x2="482.0" y2="102.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="498.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">розрив</text>
<text x="498.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">(дедалі</text>
<text x="498.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">ширший)</text>
<rect x="560.0" y="96.0" width="300.0" height="96.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="710.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Скільки ядро ЧЕКАЄ</text>
<text x="710.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">звернення до головної пам'яті —</text>
<text x="710.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">це десятки–сотні тактів простою</text>
<text x="710.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(згадайте «вузьке місце» §3.5.2)</text>
<rect x="560.0" y="204.0" width="300.0" height="90.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="710.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Чому не зробити всю</text>
<text x="710.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пам'ять швидкою?</text>
<text x="710.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Швидка пам'ять дорога й мала;</text>
<text x="710.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">велика — дешева, але повільна.</text>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро на 240 МГц виконує команду за такти, а по число з пам'яті йде десятки тактів — тож воно ГОЛОДУЄ, чекаючи дані.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хочеться неможливого: пам'ять водночас і велику, і швидку, і дешеву. Прямо — не вийде; обхідний шлях — КЕШ (далі).</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Цей розрив звуть «стіною пам'яті» (memory wall) — він і змусив інженерів вигадати кеш, щоб ядро не простоювало даремно.</text>
<text x="450.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Конвеєр (§3.5.6) теж не рятує: він прискорює обробку, та якщо даних немає, перекривати нічого — конвеєр стає.</text>
</svg>
