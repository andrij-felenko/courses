<text x="60.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">самі лиш потрібні x. Уся лінія —</text>
<text x="60.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">у діло.</text>
<text x="540.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">А чи є в цього МК кеш узагалі?</text>
<rect x="540.0" y="112.0" width="350.0" height="116.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<rect x="540.0" y="112.0" width="7.0" height="116.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="560.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Класичний 8-біт МК</text>
<text x="560.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ОЗП = SRAM на кристалі, доступ за ~такт,</text>
<text x="560.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кешу НЕМА. Порядок обходу майже не змінює часу.</text>
<text x="560.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">приклад: AVR ATmega</text>
<rect x="540.0" y="242.0" width="350.0" height="116.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<rect x="540.0" y="242.0" width="7.0" height="116.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="560.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">МК з кешем флешу</text>
<text x="560.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Код/дані відображено з повільного флешу,</text>
<text x="560.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">а ядро живить КЕШ. Тут порядок важить сильно.</text>
<text x="560.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">приклад: ESP32 (кеш ~32 КБ/ядро)</text>
<rect x="540.0" y="372.0" width="350.0" height="116.0" rx="10" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.8"/>
<rect x="540.0" y="372.0" width="7.0" height="116.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="560.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Внутрішній рядок-буфер</text>
<text x="560.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Навіть без кешу флеш часто віддає дані</text>
<text x="560.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">блоками. Послідовний доступ і тут вигідніший.</text>
<text x="560.0" y="468.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">багато ARM Cortex-M</text>
<text x="470.0" y="566.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило одне: дані, які читаєш разом, клади поряд і йди по них поспіль. Виграш — там, де між ядром і пам'яттю є кеш.</text>
</svg>
