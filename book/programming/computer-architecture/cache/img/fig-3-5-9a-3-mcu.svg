<text x="60.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лізуть і непотрібні y,z. Корисних —</text>
