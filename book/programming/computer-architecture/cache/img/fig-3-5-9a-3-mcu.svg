<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На мікроконтролері: розкладка даних і де кеш узагалі вмикається</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ліворуч — як покласти масив структур, якщо обходять одне поле; праворуч — де порядок важить, а де ні</text>
<text x="60.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Обхід одного поля з масиву об'єктів</text>
