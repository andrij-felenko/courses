<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація коду: Розгалуження проти Повної Предикації</text>
<text x="410.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Усунення стрибків та штрафів хибного передбачення конвеєра</text>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний конвеєр (Розгалуження)</text>
<rect x="90.0" y="110.0" width="260.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CMP r1, r2  (r1 == r2 ?)</text>
<line x1="160.0" y1="152.0" x2="130.0" y2="185.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Так</text>
<line x1="280.0" y1="152.0" x2="310.0" y2="185.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="320.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Ні</text>
<rect x="50.0" y="190.0" width="150.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="125.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADD r3 = r4, r5</text>
<rect x="240.0" y="190.0" width="150.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="315.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SUB r3 = r6, r7</text>
<line x1="125.0" y1="232.0" x2="190.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="315.0" y1="232.0" x2="250.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90.0" y="270.0" width="260.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Продовження виконання...</text>
<rect x="60.0" y="330.0" width="320.0" height="70.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="220.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ризик: Хибне передбачення переходу</text>
<text x="220.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Скидання конвеєра: втрата 15–30 тактів.</text>
<text x="220.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Апаратний предикатор витрачає енергію й площу.</text>
<line x1="410.0" y1="85.0" x2="410.0" y2="410.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="610.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">EPIC Предикація (Лінійний гіперблок)</text>
<rect x="450.0" y="110.0" width="320.0" height="50.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="610.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">cmp.eq p1, p2 = r1, r2 ;;</text>
<text x="610.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Встановлює: p1 = (r1==r2), p2 = (r1!=r2)</text>
<line x1="610.0" y1="160.0" x2="610.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="190.0" width="320.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="610.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельна пачка команд (один такт):</text>
<rect x="465.0" y="224.0" width="290.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="610.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(p1)  add r3 = r4, r5  [діє якщо p1==1]</text>
<rect x="465.0" y="253.0" width="290.0" height="26.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="610.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(p2)  sub r3 = r6, r7  [діє якщо p2==1]</text>
<line x1="610.0" y1="285.0" x2="610.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="315.0" width="320.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="610.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: Нуль переходів у коді</text>
<text x="610.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Обидві команди летять у конвеєр паралельно.</text>
<text x="610.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Команда з хибним предикатом перетворюється на NOP.</text>
<text x="610.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ніколи не скидає конвеєр, передбачення не потрібне.</text>
</svg>