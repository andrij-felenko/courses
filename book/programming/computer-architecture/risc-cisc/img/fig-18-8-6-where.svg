<svg xmlns="http://www.w3.org/2000/svg" width="900" height="408" viewBox="0 0 900 408">
<rect width="900" height="408" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хто де панує: RISC — у мобільному й вбудованому, CISC — на ПК</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">RISC виграє там, де важить енергоефективність; x86 (CISC) тримається на ПК завдяки десятиліттям сумісного софту</text>
<rect x="70.0" y="86.0" width="380.0" height="188.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="260.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RISC — панує в ефективності</text>
<text x="92.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• телефони й планшети — ARM</text>
<text x="92.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• мікроконтролери — AVR, ARM Cortex</text>
<text x="92.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ESP32 — Xtensa (нові — RISC-V)</text>
<text x="92.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• нове серверне залізо — ARM, RISC-V</text>
<text x="92.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Чому: простіше = менше кремнію =</text>
<text x="92.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">менше енергії → довша батарея</text>
<rect x="470.0" y="86.0" width="380.0" height="188.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="660.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CISC — тримається на ПК</text>
<text x="492.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ПК, ноутбуки, сервери — x86</text>
<text x="492.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (Intel, AMD)</text>
<text x="492.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• головна причина — СУМІСНІСТЬ:</text>
<text x="492.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   десятиліття готового софту (§18.4)</text>
<text x="492.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Сила не в архітектурі, а в спадщині —</text>
<text x="492.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">величезній екосистемі програм</text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ваш телефон, ваш мікроконтролер, ваш ESP32 — усі RISC, бо для них енергоефективність вирішальна.</text>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тенденція ширша: навіть ноутбуки й сервери дедалі частіше переходять на ARM — простота й економність беруть гору.</text>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Підсумок розвилки: RISC переміг ідейно (прості швидкі кроки), а CISC живе зовні там, де надто дорого ламати сумісність.</text>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Для нас практично: майже все, що ви програмуватимете в цьому курсі, — RISC-машини.</text>
</svg>
