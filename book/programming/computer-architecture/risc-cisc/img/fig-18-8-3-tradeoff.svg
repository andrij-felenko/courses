<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Компроміс RISC vs CISC</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">складні команди економлять пам'ять і рядки коду; прості — спрощують і пришвидшують залізо</text>
<rect x="330.0" y="82.0" width="250.0" height="30.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="455.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CISC</text>
<rect x="610.0" y="82.0" width="250.0" height="30.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="735.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RISC</text>
<rect x="70.0" y="120.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">команди</text>
<rect x="330.0" y="120.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">багато, складні, різної довжини</text>
<rect x="610.0" y="120.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мало, прості, однакові</text>
<rect x="70.0" y="168.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">код програми</text>
<rect x="330.0" y="168.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">компактніший (менше команд)</text>
<rect x="610.0" y="168.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">довший (більше команд)</text>
<rect x="70.0" y="216.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">тактів на команду</text>
<rect x="330.0" y="216.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">різні (складні — довгі)</text>
<rect x="610.0" y="216.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">майже всі ~1 такт</text>
<rect x="70.0" y="264.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">декодування</text>
<rect x="330.0" y="264.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">складне</text>
<rect x="610.0" y="264.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">просте й однакове</text>
<rect x="70.0" y="312.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">конвеєр (§18.6)</text>
<rect x="330.0" y="312.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">важко (нерівні команди)</text>
<rect x="610.0" y="312.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">легко (рівні команди)</text>
<rect x="70.0" y="360.0" width="250.0" height="42.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">залізо</text>
<rect x="330.0" y="360.0" width="250.0" height="42.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">складніше, ненажерливіше</text>
<rect x="610.0" y="360.0" width="250.0" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">простіше, економніше</text>
<text x="450.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Історично CISC родом з епохи, коли пам'ять була дорога (компактний код — на вагу золота), а код писали вручну.</text>
</svg>
