<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме завдання двома мовами: «додати число з пам'яті й зберегти»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">CISC пакує все в ОДНУ потужну команду; RISC розкладає на кілька простих — однакова робота, різна філософія</text>
<rect x="70.0" y="88.0" width="360.0" height="220.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="250.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CISC — одна складна команда</text>
<rect x="100.0" y="134.0" width="300.0" height="44.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="250.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ADD [адреса], R1</text>
<text x="250.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ця ОДНА команда сама:</text>
<text x="130.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1. читає число з пам'яті</text>
<text x="130.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2. додає до нього R1</text>
<text x="130.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3. пише результат назад</text>
<text x="250.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">✚ компактно   ✘ складно й довго виконувати</text>
<rect x="470.0" y="88.0" width="360.0" height="220.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="650.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RISC — три прості команди</text>
<rect x="500.0" y="134.0" width="300.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">LD  R2, [адреса]   ; прочитати</text>
<rect x="500.0" y="174.0" width="300.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ADD R2, R1         ; додати</text>
<rect x="500.0" y="214.0" width="300.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ST  [адреса], R2   ; записати</text>
<text x="650.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кожна — проста, ~1 такт, легко конвеєрити</text>
<text x="650.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✚ швидко й рівно   ✘ більше команд у коді</text>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лише RISC дозволяє доступ у пам'ять окремими командами LD/ST (load/store), а решта — лише між регістрами.</text>
<text x="450.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це «архітектура завантаження-збереження»: пам'ять чіпають тільки LD і ST, обчислення йдуть у регістрах (§18.2).</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама робота: CISC — 1 команда, RISC — 3. CISC економить РЯДКИ коду, RISC — СКЛАДНІСТЬ заліза.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(а простіше залізо легше зробити швидким — у цьому й уся суть суперечки)</text>
</svg>
