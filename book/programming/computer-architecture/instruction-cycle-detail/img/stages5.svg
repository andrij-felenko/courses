<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять класичних стадій — і що робить кожна</text>
<rect x="40.0" y="70.0" width="138.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="109.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ВИБІРКА</text>
<text x="109.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="109.0" dy="0.0">взяти команду з</tspan><tspan x="109.0" dy="13.4">пам'яті за PC</tspan><tspan x="109.0" dy="13.4">у регістр IR; PC+=</tspan></text>
<rect x="200.0" y="70.0" width="138.0" height="62.0" rx="8" fill="#eef1f4" stroke="#6b7280" stroke-width="2.0"/>
<text x="269.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ДЕКОД.</text>
<text x="269.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="269.0" dy="0.0">розібрати число-</tspan><tspan x="269.0" dy="13.4">команду; прочитати</tspan><tspan x="269.0" dy="13.4">потрібні регістри</tspan></text>
<rect x="360.0" y="70.0" width="138.0" height="62.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="429.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВИКОН.</text>
<text x="429.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="429.0" dy="0.0">АЛП рахує:</tspan><tspan x="429.0" dy="13.4">арифметика або</tspan><tspan x="429.0" dy="13.4">адреса для пам'яті</tspan></text>
<rect x="520.0" y="70.0" width="138.0" height="62.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="589.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПАМ'ЯТЬ</text>
<text x="589.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="589.0" dy="0.0">доступ до даних:</tspan><tspan x="589.0" dy="13.4">завантажити або</tspan><tspan x="589.0" dy="13.4">зберегти число</tspan></text>
<rect x="680.0" y="70.0" width="138.0" height="62.0" rx="8" fill="#f3eefb" stroke="#6b3fa0" stroke-width="2.0"/>
<text x="749.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b3fa0" text-anchor="middle" font-weight="700">ЗАПИС</text>
<text x="749.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="749.0" dy="0.0">покласти результат</tspan><tspan x="749.0" dy="13.4">назад у регістр</tspan><tspan x="749.0" dy="13.4">(register write-back)</tspan></text>
<rect x="184.0" y="64.0" width="10.0" height="180.0" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
<rect x="344.0" y="64.0" width="10.0" height="180.0" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
<rect x="504.0" y="64.0" width="10.0" height="180.0" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
<rect x="664.0" y="64.0" width="10.0" height="180.0" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
<text x="189.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6508" text-anchor="start" font-weight="700">між кожною парою стадій — засувка (pipeline register):</text>
<text x="189.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">щотакту вона замикає готовий результат стадії й передає його далі</text>
<text x="430.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожна стадія — окреме залізо; робота ділиться так, щоб усі шматки були приблизно рівні за часом.</text>
<text x="430.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">PC — лічильник команд, IR — регістр команди, АЛП — арифметико-логічний пристрій.</text>
</svg>