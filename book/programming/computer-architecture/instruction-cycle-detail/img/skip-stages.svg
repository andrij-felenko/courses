<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Так усі команди йдуть конвеєром у ногу: п'ять тактів кожна, ряд у ряд, без плутанини порядку.</text>
