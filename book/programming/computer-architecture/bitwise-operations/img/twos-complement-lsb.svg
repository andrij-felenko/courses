xt-anchor="middle" font-weight="700">1</text><rect x="534.0" y="125.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="149.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text><text x="594.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">(усі біти інвертовано: 1 ↔ 0)</text>
