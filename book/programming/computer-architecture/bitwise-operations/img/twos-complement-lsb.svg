a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="534.0" y="180.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="204.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><text x="594.0" y="203.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">(перенос 1 біжить до першого нуля)</text>
<line x1="140.0" y1="230.0" x2="816.0" y2="230.0" stroke="#333333" stroke-width="2.0"/>
<text x="220.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">побітове AND (&amp;)</text>
<text x="220.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">x &amp; -x =</text><rect x="240.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="261.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="282.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="303.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="324.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="366.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="387.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="408.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="429.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1</text><rect x="450.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="492.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="513.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="534.0" y="260.0" width="42.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="284.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><text x="594.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">= 0b00001000 (лишився рівно 1 молодший біт!)</text>
<rect x="60.0" y="315.0" width="760.0" height="50.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="440.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому це працює: додавання 1 до ~x перетворює всі молодші одиниці на 0, а перший 0 на 1.</text>
<text x="440.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Старші біти залишаються протилежними (~x і x), тому при AND вони обнуляються; збігається лише цей 1 біт.</text>
