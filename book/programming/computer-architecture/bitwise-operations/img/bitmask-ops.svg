<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операції з бітовими масками: Set, Clear, Toggle, Test</text>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири канонічні операції з бітовими масками</text>
<rect x="35.0" y="60.0" width="395.0" height="145.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="53.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">1. Встановити біт k (Set)</text>
<rect x="53.0" y="102.0" width="359.0" height="32.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="123.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">flags |= (1U &lt;&lt; k)</text>
<text x="53.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дія маски: </text>
<text x="120.0" y="158.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">flags | 0b00100000</text>
<text x="53.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Гарантує 1 у k-му розряді</text>
<rect x="450.0" y="60.0" width="395.0" height="145.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="468.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">2. Скинути біт k (Clear)</text>
<rect x="468.0" y="102.0" width="359.0" height="32.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="123.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">flags &amp;= ~(1U &lt;&lt; k)</text>
<text x="468.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дія маски: </text>
<text x="535.0" y="158.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">flags &amp; 0b11011111</text>
<text x="468.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Гарантує 0 у k-му розряді</text>
<rect x="35.0" y="220.0" width="395.0" height="145.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="53.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">3. Інвертувати біт k (Toggle)</text>
<rect x="53.0" y="262.0" width="359.0" height="32.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="283.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">flags ^= (1U &lt;&lt; k)</text>
<text x="53.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дія маски: </text>
<text x="120.0" y="318.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">flags ^ 0b00100000</text>
<text x="53.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Перемикає 0 ↔ 1 (керований NOT)</text>
<rect x="450.0" y="220.0" width="395.0" height="145.0" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<text x="468.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">4. Перевірити біт k (Test)</text>
<rect x="468.0" y="262.0" width="359.0" height="32.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="283.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">(flags &amp; (1U &lt;&lt; k)) != 0</text>
<text x="468.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дія маски: </text>
<text x="535.0" y="318.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">flags &amp; 0b00100000</text>
<text x="468.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Повертає true якщо біт піднято</text>
<text x="440.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маска (1U &lt;&lt; k) ізолює один розряд; комбінація бітів створюється через побітове OR масок.</text>
</svg>