<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Команди IN та OUT: єдиний спосіб дістатися простору портів</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">звичайні LD/ST сюди не дістають — потрібні окремі команди з власним кодом операції</text>
<rect x="50.0" y="78.0" width="320.0" height="120.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="210.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="700">IN  — прочитати з порту</text>
<text x="74.0" y="132.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">IN  AL, 0x60</text>
<text x="210.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">порт 0x60  →  регістр AL</text>
<line x1="300" y1="150" x2="210" y2="150" stroke="#1f8a3b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">дані течуть із пристрою в процесор</text>
<rect x="410.0" y="78.0" width="320.0" height="120.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/>
<text x="570.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="700">OUT — записати в порт</text>
<text x="434.0" y="132.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">OUT 0x20, AL</text>
<text x="570.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">регістр AL  →  порт 0x20</text>
<line x1="470" y1="150" x2="560" y2="150" stroke="#c0271e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="570.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">дані течуть із процесора в пристрій</text>
<text x="390.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться номер порту — два способи</text>
<rect x="90.0" y="252.0" width="300.0" height="92.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="240.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="700">прямо в команді (immediate)</text>
<text x="112.0" y="302.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">IN AL, 0x60</text>
<text x="240.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">8 бітів → порти лише 0..255</text>
<text x="240.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коротко, але вузько</text>
<rect x="410.0" y="252.0" width="300.0" height="92.0" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/>
<text x="560.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">через регістр DX</text>
<text x="432.0" y="302.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">MOV DX, 0x3F8</text>
<text x="432.0" y="322.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">IN  AL, DX</text>
<text x="560.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">16 бітів → усі 65536 портів</text>
<rect x="50.0" y="360.0" width="680.0" height="62.0" rx="10" fill="#fff8e8" stroke="#b8860b" stroke-width="1.6"/>
<text x="390.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані завжди йдуть через один регістр-акумулятор (AL/AX/EAX) — а не будь-який, як у пам'яті.</text>
<text x="390.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тому робота з портами тісна: одна команда — один байт (чи слово) через одну-єдину «трубу».</text>
</svg>