<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві шухляди адрес: пам'ять і окремий простір портів</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі дроти адреси й даних; один сигнал M/IO# обирає, до ЯКОГО простору звертання</text>
<rect x="300.0" y="78.0" width="180.0" height="66.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.2"/>
<text x="390.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="700">ПРОЦЕСОР</text>
<text x="390.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">виставляє адресу + сигнал</text>
<line x1="330" y1="144" x2="200" y2="212" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="214.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="700">M/IO# = 0</text>
<text x="214.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(команди LD / ST)</text>
<rect x="60.0" y="218.0" width="300.0" height="96.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="210.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="700">ПРОСТІР ПАМ'ЯТІ</text>
<text x="210.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">код, змінні, стек, купа</text>
<text x="210.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">величезний: 2³² адрес і більше</text>
<text x="210.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тут живе вся звична пам'ять</text>
<line x1="450" y1="144" x2="580" y2="212" stroke="#c0271e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="566.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="700">M/IO# = 1</text>
<text x="566.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(команди IN / OUT)</text>
<rect x="420.0" y="218.0" width="300.0" height="96.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/>
<text x="570.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="700">ПРОСТІР ПОРТІВ (I/O)</text>
<text x="570.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тільки регістри пристроїв</text>
<text x="570.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крихітний: на x86 лише 65536 портів</text>
<text x="570.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">жодного байта пам'яті сюди не кладуть</text>
<rect x="60.0" y="336.0" width="660.0" height="74.0" rx="10" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="390.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адреса 0x60 живе ДВІЧІ: як 0x60 у пам'яті й окремо як порт 0x60 — це РІЗНІ комірки.</text>
<text x="390.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Куди саме потрапить звертання, вирішує не адреса, а команда: LD/ST → пам'ять, IN/OUT → порт.</text>
<text x="390.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий провід адреси; різниця — лише в одному сигналі-прапорці M/IO#.</text>
</svg>