<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід окремого простору вводу-виводу</text>
<text x="450.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ідея визріла двічі незалежно; мікролінія дотягла порти аж у сьогоднішній x86</text>
<text x="30.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="700">лінія мінікомп'ютерів (DEC)</text>
<rect x="62.0" y="85.0" width="176.0" height="66.0" rx="9" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/><text x="150.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">1965</text><text x="150.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">PDP-8</text><text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">один опкод IOT</text>
<text x="150.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пристрій = номер на шині,</text>
<text x="150.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 імпульси-команди</text>
<text x="30.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="700">мікропроцесорна лінія (від термінала до Intel)</text>
<rect x="72.0" y="267.0" width="176.0" height="66.0" rx="9" fill="#f6f3fb" stroke="#6b4fa0" stroke-width="2.0"/><text x="160.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b4fa0" text-anchor="middle" font-weight="700">1970</text><text x="160.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Datapoint 2200</text><text x="160.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">STATUS · BEEP · REWIND</text>
<rect x="312.0" y="267.0" width="176.0" height="66.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/><text x="400.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">1972</text><text x="400.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Intel 8008</text><text x="400.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">32 родові команди в/в</text>
<rect x="532.0" y="267.0" width="176.0" height="66.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/><text x="620.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">1974</text><text x="620.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Intel 8080</text><text x="620.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">IN / OUT · 256 портів</text>
<rect x="712.0" y="267.0" width="176.0" height="66.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/><text x="800.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">1978→</text><text x="800.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x86 (8086→…)</text><text x="800.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тягне порти донині</text>
<line x1="248.0" y1="300.0" x2="312.0" y2="300.0" stroke="#c0271e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="488.0" y1="300.0" x2="532.0" y2="300.0" stroke="#c0271e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="708.0" y1="300.0" x2="712.0" y2="300.0" stroke="#c0271e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="620.0" y1="333.0" x2="620.0" y2="359.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="620.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Z80 · 8085 — теж успадкували</text>
<text x="620.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">окремі порти (сумісність)</text>
<rect x="560.0" y="96.0" width="300.0" height="44.0" rx="8" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/>
<text x="710.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">8-бітний номер порту заморожено тут:</text>
<text x="710.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">256 портів = стеля 1974 року, жива й досі</text>
<rect x="30.0" y="402.0" width="840.0" height="54.0" rx="9" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">Без вантажу сумісності обирають ІНШЕ: пристрої просто в пам'яті (memory-mapped I/O)</text>
<text x="450.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">6502 і 68000 тоді · ARM, RISC-V, майже всі мікроконтролери тепер — окремого простору портів немає зовсім</text>
</svg>