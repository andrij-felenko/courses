<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 670 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="670" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Clean і invalidate</text>
<rect x="59.5" y="15.0" width="211.0" height="34.0" rx="6" fill="#eef4ff" stroke="#4a72c0" stroke-width="1.5"/><text x="165.0" y="36.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Віддати назовні: CLEAN</tspan></text>
<rect x="70.0" y="70.0" width="90.0" height="50.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="115.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш</text>
<text x="115.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2a7" text-anchor="middle">нове</text>
<rect x="70.0" y="200.0" width="90.0" height="50.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="115.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОЗП</text>
<line x1="115.0" y1="120.0" x2="115.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2a7" text-anchor="start">clean</text>
<text x="240.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→ DMA читає</text>
<text x="115.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">спершу зіштовхнути,</text>
<text x="115.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">потім пускати DMA</text>
<line x1="330.0" y1="55.0" x2="330.0" y2="310.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="376.2" y="15.5" width="237.6" height="33.0" rx="6" fill="#fff0ee" stroke="#c0574a" stroke-width="1.5"/><text x="495.0" y="36.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Прийняти ззовні: INVALIDATE</tspan></text>
<rect x="450.0" y="70.0" width="90.0" height="50.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="495.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш</text>
<text x="495.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b23" text-anchor="middle">старе ✗</text>
<rect x="450.0" y="200.0" width="90.0" height="50.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="495.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОЗП</text>
<text x="495.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2a7" text-anchor="middle">нове (DMA)</text>
<line x1="495.0" y1="200.0" x2="495.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b23" text-anchor="start">invalidate</text>
<text x="495.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">викинути старе, щоб</text>
<text x="495.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перечитати з ОЗП</text>
</svg>