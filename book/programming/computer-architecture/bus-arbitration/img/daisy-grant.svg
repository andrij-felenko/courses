<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжкове надання: ближній «з'їдає» grant, дальній голодує</text>
<rect x="44.7" y="125.2" width="66.6" height="49.6" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.0"/><text x="78.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">арбітр</tspan><tspan x="78.0" dy="15.6">(ЦП)</tspan></text>
<rect x="190.0" y="117.0" width="120.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#c8ccd0" stroke-width="1.8"/>
<text x="250.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">пристрій A</tspan><tspan x="250.0" dy="14.3">(ближній)</tspan></text>
<rect x="370.0" y="117.0" width="120.0" height="66.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.8"/>
<text x="430.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">пристрій B</tspan></text>
<rect x="550.0" y="117.0" width="120.0" height="66.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.8"/>
<text x="610.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">пристрій C</tspan><tspan x="610.0" dy="14.3">(дальній)</tspan></text>
<line x1="111.3" y1="150.0" x2="190.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="150.7" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">GRANT</text>
<line x1="310.0" y1="150.0" x2="370.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="340.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">пропуск</text>
<line x1="490.0" y1="150.0" x2="550.0" y2="150.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="520.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">далі не доходить</text>
<text x="430.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">▲ бере шину</text>
<text x="610.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">голодує, поки просить B</text>
<text x="250.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">не просить</text>
<text x="380.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">пріоритет спадає зліва направо — за фізичним місцем у ланцюжку</text>
</svg>