<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоє просять — одна шина: арбітр пропускає одного, другий чекає</text>
<rect x="70.0" y="300.0" width="580.0" height="34.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Системна шина — одна, веде одну транзакцію за раз</text>
<rect x="323.8" y="189.5" width="72.4" height="37.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.0"/><text x="360.0" y="212.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">арбітр</tspan></text>
<line x1="360.0" y1="226.5" x2="360.0" y2="300.0" stroke="#e0a800" stroke-width="1.8"/>
<rect x="135.5" y="67.2" width="89.0" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="88.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">ядро</tspan><tspan x="180.0" dy="15.6">(майстер)</tspan></text>
<rect x="495.5" y="67.2" width="89.0" height="49.6" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="540.0" y="88.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">DMA</tspan><tspan x="540.0" dy="15.6">(майстер)</tspan></text>
<line x1="180.0" y1="116.8" x2="319.8" y2="195.7" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="300.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">REQ</text>
<line x1="540.0" y1="116.8" x2="400.2" y2="195.7" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="430.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">REQ</text>
<line x1="319.8" y1="220.3" x2="180.0" y2="118.8" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="210.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">GRANT</text>
<line x1="400.2" y1="220.3" x2="540.0" y2="118.8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="560.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">чекає</text>
<line x1="80.0" y1="356.0" x2="112.0" y2="356.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="120.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">надано (GRANT) — майстер шле транзакцію</text>
<line x1="440.0" y1="356.0" x2="472.0" y2="356.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="480.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">відкладено — стоїть у черзі</text>
</svg>