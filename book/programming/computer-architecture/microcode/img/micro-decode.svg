<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна машинна команда розкладається на потік мікрооперацій</text>
<rect x="300.0" y="46.0" width="180.0" height="46.0" rx="8" fill="#eef2fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="390.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">машинна команда</text>
<text x="390.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">напр. ADD [mem], EAX</text>
<line x1="390.0" y1="94.0" x2="390.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="250.0" y="124.0" width="280.0" height="40.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="390.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">декодер: проста чи складна?</text>
<line x1="320.0" y1="166.0" x2="200.0" y2="210.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="60.0" y="212.0" width="280.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАШИТИЙ декодер</text>
<text x="200.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">проста часта команда —</text>
<text x="200.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">µop виходить одразу з вентилів</text>
<line x1="200.0" y1="280.0" x2="200.0" y2="306.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="96.0" y="308.0" width="208.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="200.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 µop:  add r, [t]</text>
<line x1="460.0" y1="166.0" x2="580.0" y2="210.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="440.0" y="212.0" width="300.0" height="66.0" rx="10" fill="#fdf4f4" stroke="#c0392b" stroke-width="2.0"/>
<text x="590.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">МІКРОКОД-ROM</text>
<text x="590.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">складна/рідкісна команда —</text>
<text x="590.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ROM видає готовий рецепт µops</text>
<line x1="590.0" y1="280.0" x2="590.0" y2="306.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="456.0" y="308.0" width="268.0" height="26.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
<text x="462.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">µop1:  load  t, [mem]</text>
<rect x="456.0" y="338.0" width="268.0" height="26.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
<text x="462.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">µop2:  add   t, EAX</text>
<rect x="456.0" y="368.0" width="268.0" height="26.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
<text x="462.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">µop3:  store [mem], t</text>
<text x="390.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">усередині процесор виконує лише прості µop-и; мікрокод — це рецепт, як розкласти складну команду на них</text>
</svg>