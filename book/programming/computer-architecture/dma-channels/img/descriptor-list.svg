<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дескриптор і зв'язаний список (кільце ping-pong)</text>
<rect x="60.0" y="70.0" width="250.0" height="250.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="185.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один дескриптор</text>
<rect x="74.0" y="114.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="84.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">owner</text>
<text x="168.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">1 = DMA, 0 = CPU</text>
<rect x="74.0" y="150.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="84.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">eof</text>
<text x="168.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">1 = кінець → переривання</text>
<rect x="74.0" y="186.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="84.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">length</text>
<text x="168.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">скільки байтів передати</text>
<rect x="74.0" y="222.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="84.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">size</text>
<text x="168.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">місткість буфера</text>
<rect x="74.0" y="258.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="84.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">buf →</text>
<text x="168.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">адреса даних у RAM</text>
<rect x="74.0" y="294.0" width="222.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0a020" stroke-width="1.4"/>
<text x="84.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0a020" text-anchor="start" font-weight="700">next →</text>
<text x="168.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">наступний вузол</text>
<rect x="470.0" y="76.0" width="180.0" height="68.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">вузол A</text>
<text x="560.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">buf → buf_a</text>
<text x="560.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">eof=1 · owner=1</text>
<rect x="470.0" y="266.0" width="180.0" height="68.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вузол B</text>
<text x="560.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">buf → buf_b</text>
<text x="560.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">eof=1 · owner=1</text>
<line x1="630.0" y1="130.0" x2="630.0" y2="264.0" stroke="#c0a020" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="646.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0a020" text-anchor="start" font-style="italic">next</text>
<line x1="490.0" y1="264.0" x2="490.0" y2="130.0" stroke="#c0a020" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0a020" text-anchor="start" font-style="italic">next</text>
<text x="560.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">next останнього → перший: кільце,
яким DMA крутиться без зупину</text>
<line x1="310.0" y1="280.0" x2="470.0" y2="110.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
