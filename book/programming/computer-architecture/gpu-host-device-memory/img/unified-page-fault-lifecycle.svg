<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="20.0" width="850.0" height="385.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл апаратного GPU Page Fault (Unified Memory)</text>
<rect x="35.0" y="88.2" width="390.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Потік GPU звертається до адреси</tspan><tspan x="230.0" dy="15.6">(Сторінка фізично знаходиться в Host RAM)</tspan></text>
<rect x="35.0" y="173.2" width="390.0" height="43.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2. GPU MMU фіксує промах сторінки</tspan><tspan x="230.0" dy="15.6">(Invalid bit в таблиці сторінок GPU → Page Fault)</tspan></text>
<line x1="230.0" y1="140.0" x2="230.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="258.2" width="390.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">3. Апаратний блок GPU зупиняє варп</tspan><tspan x="230.0" dy="15.6">(Генерує переривання/подію до драйвера на Host)</tspan></text>
<line x1="230.0" y1="225.0" x2="230.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="455.0" y="88.2" width="390.0" height="43.6" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="650.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">4. Драйвер виділяє сторінку у VRAM</tspan><tspan x="650.0" dy="15.6">(Ініціює фоновий DMA-трансфер 64 КБ / 2 МБ через PCIe)</tspan></text>
<line x1="425.0" y1="280.0" x2="455.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">PCIe подія</text>
<rect x="455.0" y="173.2" width="390.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">5. Оновлення сторінкових таблиць</tspan><tspan x="650.0" dy="15.6">(Запис нового фізичного фрейму у GPU TLB)</tspan></text>
<line x1="650.0" y1="140.0" x2="650.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="455.0" y="258.2" width="390.0" height="43.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">6. Відновлення виконання варпу</tspan><tspan x="650.0" dy="15.6">(Інструкція повторюється і читає вже з швидкої VRAM)</tspan></text>
<line x1="650.0" y1="225.0" x2="650.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="340.0" width="810.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="440.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ціна гнучкості: кожен Page Fault займає кілька мікросекунд на обслуговування переривання.</tspan><tspan x="440.0" dy="13.8">Без попереднього підтягування (cudaMemPrefetchAsync) масивні промахи руйнують продуктивність.</tspan></text>
</svg>