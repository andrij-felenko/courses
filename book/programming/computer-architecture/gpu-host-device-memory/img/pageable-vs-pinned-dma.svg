<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="30.0" width="850.0" height="170.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="440.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">СХЕМА А: Звичайна сторінкова пам'ять (Pageable Memory, malloc)</text>
<rect x="30.0" y="87.2" width="160.0" height="55.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Сторінковий буфер</tspan><tspan x="110.0" dy="14.3">Host Virtual Memory</tspan><tspan x="110.0" dy="14.3">(malloc / new)</tspan></text>
<rect x="275.0" y="87.2" width="170.0" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Транзитний буфер ядра</tspan><tspan x="360.0" dy="14.3">(Pinned Staging Buffer)</tspan><tspan x="360.0" dy="14.3">Виділений драйвером</tspan></text>
<rect x="550.0" y="94.3" width="140.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Контролер DMA</tspan><tspan x="620.0" dy="14.3">на карті GPU</tspan></text>
<rect x="740.0" y="94.3" width="110.0" height="41.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Пам'ять GPU</tspan><tspan x="795.0" dy="14.3">(Device VRAM)</tspan></text>
<line x1="190.0" y1="115.0" x2="275.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="232.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Крок 1: CPU memcpy</text>
<text x="232.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(копіювання в ядрі)</text>
<line x1="445.0" y1="115.0" x2="550.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="497.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Крок 2: PCIe DMA</text>
<text x="497.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(пересилка в залізі)</text>
<line x1="690.0" y1="115.0" x2="740.0" y2="115.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Подвійне копіювання: CPU зайнятий переписуванням байтів, подвійне навантаження на шину ОЗП</text>
