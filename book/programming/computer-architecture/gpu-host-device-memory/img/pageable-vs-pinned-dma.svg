<text x="440.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">СХЕМА Б: Фіксована пам'ять (Pinned / Page-Locked Memory, cudaMallocHost)</text>
<rect x="40.0" y="277.2" width="200.0" height="55.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Фіксований буфер Host</tspan><tspan x="140.0" dy="14.3">(Фізичні сторінки заблоковані</tspan><tspan x="140.0" dy="14.3">від витискання ОС)</tspan></text>
<rect x="410.0" y="284.4" width="220.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Контролер DMA на GPU</tspan><tspan x="520.0" dy="14.3">(Знає точні фізичні адреси RAM)</tspan></text>
<rect x="720.0" y="284.4" width="120.0" height="41.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Пам'ять GPU</tspan><tspan x="780.0" dy="14.3">(Device VRAM)</tspan></text>
<line x1="240.0" y1="305.0" x2="410.0" y2="305.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="325.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Прямий трансфер PCIe DMA (1 крок)</text>
<text x="325.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">CPU повністю вільний, 100% утилізація шини</text>
<line x1="630.0" y1="305.0" x2="720.0" y2="305.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Прямий DMA: максимальна пропускна здатність PCIe, нульове навантаження на процесорні ядра</text>
</svg>