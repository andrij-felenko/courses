<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="45.0" width="340.0" height="365.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="190.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ХОСТ (Host CPU System)</text>
<text x="190.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оптимізовано під мінімальну затримку (Latency-oriented)</text>
<rect x="520.0" y="45.0" width="340.0" height="365.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="690.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРИСТРІЙ (Device GPU System)</text>
<text x="690.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оптимізовано під масивну пропускну здатність (Throughput)</text>
<rect x="50.0" y="115.0" width="280.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Багатоядерний CPU</tspan><tspan x="190.0" dy="16.9">(Кеші L1 / L2 / L3)</tspan></text>
<rect x="50.0" y="200.6" width="280.0" height="78.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Системна пам'ять DDR4 / DDR5</tspan><tspan x="190.0" dy="15.6">Ємність: 64–512 ГБ</tspan><tspan x="190.0" dy="15.6">Пропускна здатність: ~50–120 ГБ/с</tspan><tspan x="190.0" dy="15.6">Затримка: ~60–90 нс</tspan></text>
<line x1="190.0" y1="172.0" x2="190.0" y2="203.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Шинний контролер ОЗП (128-біт)</text>
<rect x="50.0" y="338.2" width="280.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">IOMMU / Контролер PCIe Root</tspan><tspan x="190.0" dy="15.6">Трансляція адрес DMA</tspan></text>
<line x1="190.0" y1="285.0" x2="190.0" y2="335.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="550.0" y="115.0" width="280.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Масив обчислювальних ядер GPU</tspan><tspan x="690.0" dy="16.9">(Потокові мультипроцесори SM / CU)</tspan></text>
<rect x="550.0" y="200.6" width="280.0" height="78.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Відеопам'ять GDDR6 / HBM3</tspan><tspan x="690.0" dy="15.6">Ємність: 16–96 ГБ</tspan><tspan x="690.0" dy="15.6">Пропускна здатність: 1 000–3 300 ГБ/с</tspan><tspan x="690.0" dy="15.6">Ширина шини: 384–4096 біт</tspan></text>
<line x1="690.0" y1="172.0" x2="690.0" y2="203.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Локальна надширока шина VRAM</text>
<rect x="550.0" y="338.2" width="280.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Апаратний DMA Engine GPU</tspan><tspan x="690.0" dy="15.6">Керування копіюванням через PCIe</tspan></text>
<line x1="690.0" y1="285.0" x2="690.0" y2="335.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="320.0" width="140.0" height="80.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Шина PCIe 4.0/5.0 x16</tspan><tspan x="440.0" dy="14.4">31.5 – 63 ГБ/с</tspan><tspan x="440.0" dy="14.4">(Вузьке горло)</tspan></text>
<line x1="330.0" y1="360.0" x2="370.0" y2="360.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="510.0" y1="360.0" x2="550.0" y2="360.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="370.0" y="110.0" width="140.0" height="170.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрив швидкості:</text>
<text x="440.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="440.0" dy="0.0">VRAM швидша за</tspan><tspan x="440.0" dy="13.8">PCIe у 30–100 разів!</tspan><tspan x="440.0" dy="13.8"></tspan><tspan x="440.0" dy="13.8">Якщо дані не в</tspan><tspan x="440.0" dy="13.8">локальній VRAM —</tspan><tspan x="440.0" dy="13.8">GPU простоює.</tspan></text>
</svg>