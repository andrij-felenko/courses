<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">📜 Славетні катастрофи переповнення</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тихий числовий баг коштував ракет, рекордів і досі загрожує — ось чому про межі типів треба пам'ятати</text>
<rect x="70.0" y="84.0" width="740.0" height="68.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="90.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Ariane 5, 1996</text>
<text x="90.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">64-бітне число швидкості (float) перетворювали на 16-бітне знакове → переповнення → відмова</text>
<text x="90.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">системи орієнтації (SRI) → ракета зруйнувалася. ~$370 млн, ~37 с після старту.</text>
<rect x="70.0" y="162.0" width="740.0" height="68.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="90.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">«Gangnam Style», 2014</text>
<text x="90.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Лічильник переглядів YouTube був 32-бітний знаковий (межа 2 147 483 647 ≈ 2.1 млрд). Кліп</text>
<text x="90.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">підійшов до межі — YouTube жартома оголосив про 64 біти (готові завчасно).</text>
<rect x="70.0" y="240.0" width="740.0" height="68.0" rx="10" fill="#fafafa" stroke="#9a7322" stroke-width="1.6"/>
<text x="90.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">Проблема 2038 року</text>
<text x="90.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Час у Unix — це 32-бітне знакове число секунд від 1970-го. 19 січня</text>
<text x="90.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2038-го воно переповниться й «стрибне» у 1901-й.</text>
<rect x="70.0" y="318.0" width="740.0" height="68.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="90.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Pac-Man, рівень 256</text>
<text x="90.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">8-бітний лічильник рівнів переповнюється на 256-му — екран псується</text>
<text x="90.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">наполовину («kill screen»), гру пройти неможливо.</text>
</svg>
