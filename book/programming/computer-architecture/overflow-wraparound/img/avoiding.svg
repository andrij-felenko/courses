<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме «перевалювання»: загроза ліворуч, користь праворуч</text>
<line x1="360.0" y1="44.0" x2="360.0" y2="296.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="180.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Убезпечитися</text>
<rect x="30.0" y="92.0" width="300.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ширший тип (8→16→32→64)</tspan><tspan x="180.0" dy="14.3">із запасом</tspan></text>
<rect x="30.0" y="162.0" width="300.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">перевірка меж або прапорців</tspan></text>
<rect x="30.0" y="232.0" width="300.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">насичення: 255 + 1 = 255</tspan><tspan x="180.0" dy="14.3">(впертися, не перевалити)</tspan></text>
<text x="540.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Wrap — це фіча</text>
<rect x="390.0" y="92.0" width="300.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">таймери й лічильники</tspan><tspan x="540.0" dy="14.3">по колу</tspan></text>
<rect x="390.0" y="162.0" width="300.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">кільцеві буфери: індекс</tspan><tspan x="540.0" dy="14.3">за модулем</tspan></text>
<rect x="390.0" y="232.0" width="300.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">різниця часу t₂ − t₁</tspan><tspan x="540.0" dy="14.3">у беззнакових — вірна</tspan></text>
<text x="360.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">різниця одна: чи передбачив переповнення інженер</text>
</svg>