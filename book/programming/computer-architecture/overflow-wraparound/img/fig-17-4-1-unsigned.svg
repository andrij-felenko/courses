<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Беззнакове переповнення: 255 + 1 = 0 (одометр «перевалив»)</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у 8-бітну комірку влазить лише 0…255; додавши 1 до 255, дев'ятий біт «випадає», лишаючи нулі</text>
<text x="150.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">255</text>
<text x="178.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 11111111</text>
<text x="150.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">+ 1</text>
<text x="178.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 00000001</text>
<line x1="178.0" y1="175.0" x2="470.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="150.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">сума</text>
<text x="178.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1 00000000</text>
<rect x="176.0" y="190.0" width="22.0" height="22.0" rx="3" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="187.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">↑ випав за байт</text>
<text x="330.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">= 00000000 = 0 (!)</text>
<circle cx="640.0" cy="160.0" r="70.0" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<circle cx="627.8" cy="91.1" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="624.0" y="73.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">255</text>
<circle cx="652.2" cy="91.1" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="656.0" y="73.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<circle cx="675.0" cy="99.4" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="686.0" y="84.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<circle cx="605.0" cy="99.4" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="594.0" y="84.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">254</text>
<line x1="620.0" y1="95.0" x2="660.0" y2="95.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="640.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коло 0…255</text>
<text x="640.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">255 → 0 через верх</text>
<rect x="70.0" y="290.0" width="720.0" height="50.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="430.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо не зупиняється й не лається — воно ТИХО дає 0. Лічильник на 255 «обнулиться» сам.</text>
<text x="430.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той «зайвий» перенос за межу — сигнал переповнення (прапорець Carry, §17.4 далі).</text>
</svg>
