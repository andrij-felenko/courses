<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка ДО додавання: переставлена нерівність безпечна</text>
<text x="360.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Питаємо ДО: чи лишилося місце для a + b?</text>
<rect x="40.0" y="78.0" width="300.0" height="86.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="103.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Беззнаковий: один бік</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">a &gt; UINT_MAX − b  →  вилізе</tspan><tspan x="190.0" dy="14.3">(різниця безпечна: b ≤ UINT_MAX)</tspan></text>
<rect x="380.0" y="78.0" width="300.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="530.0" y="103.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Знаковий: два боки</tspan><tspan x="530.0" dy="14.3"></tspan><tspan x="530.0" dy="14.3">b&gt;0 та a &gt; INT_MAX − b → зверху</tspan><tspan x="530.0" dy="14.3">b&lt;0 та a &lt; INT_MIN − b → знизу</tspan></text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">знак b підказує, яку межу звіряти</text>
<text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жодна з цих перевірок сама не переповнюється — дію не виконуємо, поки не впевнились</text>
</svg>