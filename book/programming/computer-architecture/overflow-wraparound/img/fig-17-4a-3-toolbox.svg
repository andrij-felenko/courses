<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
<rect width="880" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чим ловити переповнення: від найнадійнішого до найручнішого</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обирай за наявним компілятором і потрібним контролем</text>
<rect x="60.0" y="92.0" width="760.0" height="70.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="82.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">1. Ширший тип</text>
<text x="82.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">int64 для проміжку, тоді звузь із перевіркою. Найпростіше, коли запас по бітах є.</text>
<rect x="648.0" y="106.0" width="158.0" height="26.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="727.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">найдешевше думкою</text>
<rect x="60.0" y="172.0" width="760.0" height="70.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="82.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">2. __builtin_*_overflow</text>
<text x="82.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">GCC/Clang: bool o = __builtin_add_overflow(a, b, &amp;r). Робить дію Й каже, чи вилізло.</text>
<rect x="648.0" y="186.0" width="158.0" height="26.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="727.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">найнадійніше</text>
<rect x="60.0" y="252.0" width="760.0" height="70.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.7"/>
<text x="82.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">3. Беззнаковий домен</text>
<text x="82.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Свідомий wrap mod 2ᴺ: лічильники, гешування, різниця часу (t2 − t1). Визначено стандартом.</text>
<rect x="648.0" y="266.0" width="158.0" height="26.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="727.0" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">коли wrap — фіча</text>
<rect x="60.0" y="332.0" width="760.0" height="70.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.7"/>
<text x="82.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">4. Ручна перевірка ДО</text>
<text x="82.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Переставлена нерівність (Рис. 3.4.4a.2). Переносна на будь-який компілятор, без розширень.</text>
<rect x="648.0" y="346.0" width="158.0" height="26.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.3"/>
<text x="727.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">максимум контролю</text>
<text x="440.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Найгірший варіант — НЕ перевіряти зовсім і сподіватися, що «не вилізе».</text>
</svg>
