<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях однієї відмови: від hlt до вашого обробника</text>
<rect x="87.5" y="115.0" width="165.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Ваш код, кільце 3:</tspan><tspan x="170.0" dy="16.9">hlt</tspan></text>
<rect x="403.7" y="115.0" width="212.7" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="510.0" dy="0.0">Процесор: рівень ≠ 0 —</tspan><tspan x="510.0" dy="16.9">команду відхилено, #GP(13)</tspan></text>
<rect x="779.6" y="115.0" width="160.8" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Апаратна пастка:</tspan><tspan x="860.0" dy="16.9">вектор 13 у таблиці</tspan></text>
<line x1="252.5" y1="140.0" x2="403.7" y2="140.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="616.3" y1="140.0" x2="779.6" y2="140.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="860.0" y1="164.9" x2="860.0" y2="310.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="845.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">рівень 3 → 0</text>
<rect x="71.3" y="325.1" width="197.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">on_trap(): запам'ятати</tspan><tspan x="170.0" dy="16.9">сигнал → siglongjmp</tspan></text>
<rect x="414.8" y="316.6" width="190.4" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="337.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Ядро кладе кадр сигналу</tspan><tspan x="510.0" dy="16.9">на стек користувача</tspan><tspan x="510.0" dy="16.9">й вертає в кільце 3</tspan></text>
<rect x="779.6" y="325.1" width="160.8" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Ядро: обробник #GP</tspan><tspan x="860.0" dy="16.9">→ SIGSEGV процесові</tspan></text>
<line x1="779.6" y1="350.0" x2="605.2" y2="350.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="414.8" y1="350.0" x2="268.7" y2="350.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="417.7" y1="164.9" x2="340.0" y2="210.4" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="190.8" y="210.4" width="218.4" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="230.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="300.0" dy="0.0">RIP лишається НА команді hlt:</tspan><tspan x="300.0" dy="15.6">просте return з обробника</tspan><tspan x="300.0" dy="15.6">виконало б її знову — і знову</tspan></text>
<text x="510.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Команду так і не виконано, програма живе далі — але дорога туди й назад коштує кілька мікросекунд.</text>
</svg>