<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне #GP — три різні долі</text>
<rect x="230.0" y="60.0" width="520.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Процесор: привілейована команда в кільці 3</tspan><tspan x="490.0" dy="18.2">→ #GP(13), команду не виконано</tspan></text>
<line x1="490.0" y1="118.0" x2="170.0" y2="186.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="190.0" width="280.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Передати далі</tspan></text>
<rect x="30.0" y="248.0" width="280.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="275.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">ядро шле процесові SIGSEGV —</tspan><tspan x="170.0" dy="16.9">програма бачить відмову</tspan><tspan x="170.0" dy="16.9">hlt · rdmsr · mov %cr0</tspan></text>
<line x1="490.0" y1="118.0" x2="490.0" y2="186.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="190.0" width="280.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Підмінити результат</tspan></text>
<rect x="350.0" y="248.0" width="280.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="275.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">ядро емулює команду й вертає</tspan><tspan x="490.0" dy="16.9">правдоподібне число</tspan><tspan x="490.0" dy="16.9">smsw · sgdt · sidt під UMIP</tspan></text>
<line x1="490.0" y1="118.0" x2="810.0" y2="186.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="190.0" width="280.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="810.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Проковтнути</tspan></text>
<rect x="670.0" y="248.0" width="280.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="275.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">ядро вважає команду за</tspan><tspan x="810.0" dy="16.9">порожню, як nop</tspan><tspan x="810.0" dy="16.9">cli · sti після iopl(3)</tspan></text>
<text x="490.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Апаратна відмова однакова завжди — різниться тільки те, що з нею робить ядро.</text>
</svg>