<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Каталог периферії: апаратні «органи» зв'язку зі світом</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен вузол — окреме залізо, що працює само; це й різнить мікроконтролери</text>
<rect x="30.0" y="78.0" width="280.0" height="180.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="42.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Цифровий ввід-вивід</text>
<line x1="42.0" y1="108.0" x2="298.0" y2="108.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<text x="42.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• GPIO</text>
<text x="54.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">універсальні ніжки: 0 або 1</text>
<text x="42.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• читання / запис</text>
<text x="54.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">кнопки, світлодіоди, лінії</text>
<rect x="320.0" y="78.0" width="280.0" height="180.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="332.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Час</text>
<line x1="332.0" y1="108.0" x2="588.0" y2="108.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<text x="332.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• Таймери / лічильники</text>
<text x="344.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">міряють і задають інтервали</text>
<text x="332.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• ШІМ (PWM)</text>
<text x="344.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">«аналог» цифровою ніжкою</text>
<rect x="610.0" y="78.0" width="280.0" height="180.0" rx="8" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="622.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Аналог</text>
<line x1="622.0" y1="108.0" x2="878.0" y2="108.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<text x="622.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• АЦП</text>
<text x="634.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">напруга → число</text>
<text x="622.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• ЦАП</text>
<text x="634.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">число → напруга</text>
<rect x="30.0" y="278.0" width="425.0" height="200.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="42.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Зв'язок із іншими чипами</text>
<line x1="42.0" y1="308.0" x2="443.0" y2="308.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="42.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• UART</text>
<text x="54.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">асинхронний послідовний потік</text>
<text x="42.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• I2C</text>
<text x="54.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дві лінії — багато пристроїв</text>
<text x="42.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• SPI</text>
<text x="54.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">швидка повнодуплексна шина</text>
<rect x="465.0" y="278.0" width="425.0" height="200.0" rx="8" fill="#fbfbfb" stroke="#6a6a6a" stroke-width="2"/>
<text x="477.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6a6a6a" text-anchor="start" font-weight="bold" font-style="normal">Системне</text>
<line x1="477.0" y1="308.0" x2="878.0" y2="308.0" stroke="#6a6a6a" stroke-width="1.4" stroke-linecap="round"/>
<text x="477.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• контролер переривань</text>
<text x="489.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">реагувати на подію вмить</text>
<text x="477.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• DMA</text>
<text x="489.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перекидати дані без ядра</text>
<text x="477.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• RTC · watchdog</text>
<text x="489.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">годинник реального часу · захист від зависань</text>
<text x="460.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро лише налаштовує вузол — далі той працює сам, паралельно з ядром.</text>
</svg>
