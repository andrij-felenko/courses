<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Периферія за призначенням: кожен вузол — окреме залізо</text>
<rect x="40.0" y="70.0" width="270.0" height="170.0" rx="8" fill="#fbfbfb" stroke="#2457d6" stroke-width="2.0"/>
<text x="52.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Цифровий ввід-вивід</text>
<line x1="52.0" y1="100.0" x2="298.0" y2="100.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="52.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• GPIO</text>
<text x="64.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">універсальні ніжки: 0 або 1</text>
<text x="52.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• читання / запис</text>
<text x="64.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">кнопки, світлодіоди, лінії</text>
<rect x="320.0" y="70.0" width="270.0" height="170.0" rx="8" fill="#fbfbfb" stroke="#27ae60" stroke-width="2.0"/>
<text x="332.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Час</text>
<line x1="332.0" y1="100.0" x2="578.0" y2="100.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="332.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• таймери / лічильники</text>
<text x="344.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">міряють і задають інтервали</text>
<text x="332.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• ШІМ (PWM)</text>
<text x="344.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">«аналог» цифровою ніжкою</text>
<rect x="600.0" y="70.0" width="260.0" height="170.0" rx="8" fill="#fbfbfb" stroke="#c0392b" stroke-width="2.0"/>
<text x="612.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Аналог</text>
<line x1="612.0" y1="100.0" x2="848.0" y2="100.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="612.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• АЦП</text>
<text x="624.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">напруга → число</text>
<text x="612.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• ЦАП</text>
<text x="624.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">число → напруга</text>
<rect x="40.0" y="256.0" width="405.0" height="180.0" rx="8" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="52.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Зв'язок із іншими чипами</text>
<line x1="52.0" y1="286.0" x2="433.0" y2="286.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• UART</text>
<text x="64.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">асинхронний послідовний потік</text>
<text x="52.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• I2C</text>
<text x="64.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">дві лінії — багато пристроїв</text>
<text x="52.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• SPI</text>
<text x="64.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">швидка повнодуплексна шина</text>
<rect x="455.0" y="256.0" width="405.0" height="180.0" rx="8" fill="#fbfbfb" stroke="#6a6a6a" stroke-width="2.0"/>
<text x="467.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a6a6a" text-anchor="start" font-weight="700">Системне</text>
<line x1="467.0" y1="286.0" x2="848.0" y2="286.0" stroke="#6a6a6a" stroke-width="1.4"/>
<text x="467.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• контролер переривань</text>
<text x="479.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">реагувати на подію вмить</text>
<text x="467.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• DMA</text>
<text x="479.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">перекидати дані без ядра</text>
<text x="467.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• RTC · сторожовий таймер</text>
<text x="479.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">годинник реального часу · захист від зависань</text>
</svg>