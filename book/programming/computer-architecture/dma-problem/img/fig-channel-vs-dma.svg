<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.9.0.2. Канал IBM проти DMA мікроконтролера</text>
<rect x="70.0" y="14.0" width="330.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="235.0" y="37.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Канал IBM (System/360)</tspan></text>
<rect x="420.0" y="14.0" width="330.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="585.0" y="37.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">DMA мікроконтролера (ESP32)</tspan></text>
<line x1="410.0" y1="10.0" x2="410.0" y2="370.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="30.0" y="72.0" width="760.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="410.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">СПІЛЬНЕ: окремий апаратний агент на шині — ядро вільне рахувати</tspan></text>
<rect x="70.0" y="132.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Ядро лишає в пам'яті</tspan><tspan x="235.0" dy="14.3">канальну програму (CCW)</tspan></text>
<rect x="70.0" y="188.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Канал сам виконує CCW:</tspan><tspan x="235.0" dy="14.3">читай / перемотай / читай</tspan></text>
<rect x="70.0" y="244.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Умовні переходи й</tspan><tspan x="235.0" dy="14.3">перевірка даних у програмі</tspan></text>
<rect x="70.0" y="300.0" width="330.0" height="46.0" rx="6" fill="#d6e8fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Повноцінна збережена</tspan><tspan x="235.0" dy="14.3">програма з гілками</tspan></text>
<line x1="235.0" y1="180.0" x2="235.0" y2="187.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="235.0" y1="236.0" x2="235.0" y2="243.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="235.0" y1="292.0" x2="235.0" y2="299.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420.0" y="132.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Ядро задає один дескриптор:</tspan><tspan x="585.0" dy="14.3">адреса → адреса, N байтів</tspan></text>
<rect x="420.0" y="188.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">DMA виконує фіксований</tspan><tspan x="585.0" dy="14.3">переказ (або список блоків)</tspan></text>
<rect x="420.0" y="244.0" width="330.0" height="46.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.5"/><text x="585.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Гілок немає:</tspan><tspan x="585.0" dy="14.3">tільки scatter-gather (§4.9.3)</tspan></text>
<rect x="420.0" y="300.0" width="330.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Спрощений нащадок:</tspan><tspan x="585.0" dy="14.3">лише «скопіюй цей блок»</tspan></text>
<rect x="30.0" y="372.0" width="760.0" height="36.0" rx="6" fill="#fff6e0" stroke="#c0a020" stroke-width="2.0"/><text x="410.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">DMA — це канал, з якого зняли процесор: той самий агент на шині, але виконує лише фіксований переказ.</tspan></text>
</svg>