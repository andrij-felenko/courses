<svg xmlns="http://www.w3.org/2000/svg" width="900" height="426" viewBox="0 0 900 426">
<rect width="900" height="426" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шина: спільні дроти, якими процесор говорить із пам'яттю</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три набори ліній — АДРЕСА (куди), ДАНІ (що) і КЕРУВАННЯ (читати/писати, такт) — сполучають процесор, пам'ять і В/В</text>
<rect x="70.0" y="110.0" width="180.0" height="150.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="160.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<rect x="650.0" y="110.0" width="180.0" height="150.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="740.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПАМ'ЯТЬ</text>
<rect x="390.0" y="300.0" width="150.0" height="50.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="465.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Ввід/Вивід</text>
<line x1="255.0" y1="140.0" x2="645.0" y2="140.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<text x="450.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Адресна шина</text>
<text x="450.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">КУДИ — номер комірки</text>
<line x1="255.0" y1="175.0" x2="645.0" y2="175.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<line x1="645.0" y1="175.0" x2="255.0" y2="175.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="450.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Шина даних</text>
<text x="450.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ЩО — саме число (туди й назад)</text>
<line x1="255.0" y1="210.0" x2="645.0" y2="210.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="450.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Шина керування</text>
<text x="450.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">читати / писати / такт</text>
<line x1="465.0" y1="260.0" x2="465.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ширина шини даних — це і є «розрядність» (§17.7): 8-бітна шина носить байт за раз, 32-бітна — чотири.</text>
<text x="450.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усе тече тими самими спільними дротами — пам'ятаймо «вузьке місце» (історія розділу): шина одна на всіх.</text>
</svg>
