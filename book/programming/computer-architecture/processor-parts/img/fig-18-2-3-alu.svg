<text x="440.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЛП збудована з суматора (§15.6) і логічних вентилів (§15). Вона КОМБІНАЦІЙНА: лише рахує «тут і зараз», нічого не пам'ятаючи.</text>
<text x="440.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому її входи беруть з регістрів, а вихід кладуть назад у регістр — пам'ять і АЛП працюють у парі.</text>
<text x="440.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Приклад на схемі: 6 + 5 = 11 (0000 1011), прапорець C=0, Z=0 — звичайне додавання без переповнення.</text>
