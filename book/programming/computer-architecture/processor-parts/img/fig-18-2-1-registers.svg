<text x="440.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Регістрів МАЛО й вони крихітні — зате під рукою й миттєві. Тому процесор тягне числа в регістри, рахує там, і лиш тоді вертає в пам'ять.</text>
<text x="440.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це прямий наслідок «вузького місця» (історія розділу): пам'ять далеко й повільна, тож гаряча робота йде у швидких регістрах.</text>
