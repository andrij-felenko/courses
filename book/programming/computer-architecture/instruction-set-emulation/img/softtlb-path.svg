<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція адрес через програмний SoftTLB</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програмний SoftTLB: швидкий шлях проти повільного</text>
<rect x="340.0" y="60.0" width="260.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="79.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Гостьова віртуальна адреса (GVA)</tspan><tspan x="470.0" dy="15.0">[номер сторінки + зміщення]</tspan></text>
<line x1="470.0" y1="106.0" x2="470.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="140.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Індекс SoftTLB = (GVA &gt;&gt; 12) &amp; MASK</tspan></text>
<line x1="470.0" y1="184.0" x2="470.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="215.0" width="380.0" height="50.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="470.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Порівняння тегу в записі SoftTLB:</tspan><tspan x="470.0" dy="16.2">tlb[index].tag_vaddr == (GVA &amp; PAGE_MASK) ?</tspan></text>
<line x1="280.0" y1="240.0" x2="160.0" y2="240.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="160.0" y1="240.0" x2="160.0" y2="285.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="215.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК (Влучання)</text>
<rect x="40.0" y="285.0" width="240.0" height="150.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="160.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ШВИДКИЙ ШЛЯХ (Fast Path)</text>
<text x="160.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">HVA = GVA + tlb[index].addend</text>
<text x="160.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Прямий доступ: *hva</text>
<text x="160.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3–5 інструкцій JIT-коду</text>
<text x="160.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Час: ~1–3 такти процесора</text>
<line x1="660.0" y1="240.0" x2="780.0" y2="240.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="780.0" y1="240.0" x2="780.0" y2="285.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НІ (Промах / Захист)</text>
<rect x="640.0" y="285.0" width="260.0" height="175.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="770.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ПОВІЛЬНИЙ ШЛЯХ (Slow Path)</text>
<text x="770.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Виклик C-хелпера емулятора:</text>
<text x="770.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Прохід таблиць сторінок MMU</text>
<text x="770.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Доступ до MMIO-пристроїв</text>
<text x="770.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Генерація Page Fault / SMC</text>
<text x="770.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">• Оновлення запису SoftTLB</text>
<text x="770.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Час: ~50–300 тактів</text>
</svg>