<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвіст останнього слова: розряди, яких немає</text>
<text x="36.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Множина на 200 бітів займає 4 слова — а це 256 розрядів пам'яті.</text>
<rect x="40.0" y="92.0" width="609.4" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="344.7" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="344.7" dy="0.0">200 своїх розрядів</tspan></text>
<rect x="649.4" y="92.0" width="170.6" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="734.7" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="734.7" dy="0.0">56 чужих</tspan></text>
<line x1="235.0" y1="92.0" x2="235.0" y2="146.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="430.0" y1="92.0" x2="430.0" y2="146.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="625.0" y1="92.0" x2="625.0" y2="146.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="137.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">слово 0</text>
<text x="332.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">слово 1</text>
<text x="527.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">слово 2</text>
<text x="722.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">слово 3</text>
<text x="40.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">розряд 0</text>
<text x="649.4" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">199 | 200</text>
<text x="820.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">255</text>
<rect x="40.0" y="206.0" width="780.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="430.0" dy="0.0">flip() без маски: у хвості спалахують 56 одиниць — count() бреше на 56</tspan></text>
<rect x="40.0" y="264.0" width="780.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="430.0" dy="0.0">w[W−1] &amp;= tail_mask(): хвіст погашено, інваріант відновлено</tspan></text>
<text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">AND і OR двох чистих множин лишають хвіст чистим самі собою — а заперечення ні.</tspan><tspan x="440.0" dy="19.5">Тому маску хвоста накладають після кожної дії, що чіпає слово цілком.</tspan></text>
</svg>