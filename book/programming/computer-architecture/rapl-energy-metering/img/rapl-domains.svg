<text x="430.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен домен накопичує спожиті мікроджоулі в окремому 32-бітному MSR-лічильнику.</text>
<text x="430.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Квант енергії задається базовим регістром MSR_RAPL_POWER_UNIT (0x606): E = 1 / 2^ESU Джоулів.</text>
