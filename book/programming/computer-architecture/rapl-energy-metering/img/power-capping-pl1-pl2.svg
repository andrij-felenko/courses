<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19.1 -10 859.1 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-19.1" y="-10" width="859.1" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневе апаратне керування потужністю: ліміти PL1 та PL2</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Динамічне обмеження сплесків навантаження через ковзне часове вікно інтегрування</text>
<line x1="90.0" y1="340.0" x2="770.0" y2="340.0" stroke="#333333" stroke-width="2.0"/>
<line x1="90.0" y1="340.0" x2="90.0" y2="80.0" stroke="#333333" stroke-width="2.0"/>
<text x="755.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Час (секунди)</text>
<text x="80.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Потужність (Вт)</text>
<line x1="90.0" y1="140.0" x2="770.0" y2="140.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="78.0" y="144.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#c0271e" text-anchor="end" font-weight="700">PL2 (180 Вт)</text>
<text x="760.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0271e" text-anchor="end">Короткочасний ліміт (Short-term Limit / Tau)</text>
<line x1="90.0" y1="205.0" x2="770.0" y2="205.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="78.0" y="209.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1f47b5" text-anchor="end" font-weight="700">PL1 (125 Вт)</text>
<text x="760.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f47b5" text-anchor="end">Тривалий тепловий ліміт TDP (Sustained Limit)</text>
<text x="78.0" y="324.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="end">Холостий (15 Вт)</text>
<polyline points="90.0,320.0 180.0,320.0 185.0,145.0 320.0,145.0 360.0,205.0 550.0,205.0 565.0,320.0 770.0,320.0" fill="none" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="185.0" y="205.0" width="135.0" height="60.0" rx="2" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.0"/>
<text x="252.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">Енергетичний кредит</text>
<text x="252.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle">Turbo Boost (Tau ≈ 28-56 c)</text>
<line x1="185.0" y1="120.0" x2="320.0" y2="120.0" stroke="#c0271e" stroke-width="1.5"/>
<line x1="185.0" y1="114.0" x2="185.0" y2="126.0" stroke="#c0271e" stroke-width="1.5"/>
<line x1="320.0" y1="114.0" x2="320.0" y2="126.0" stroke="#c0271e" stroke-width="1.5"/>
<text x="252.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">Часове вікно Tau (Time Window)</text>
<line x1="390.0" y1="240.0" x2="355.0" y2="210.0" stroke="#1f47b5" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="700">PCU зменшує частоту (DVFS):</text>
<text x="420.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">середня енергія у вікні досягла PL1</text>
<rect x="40.0" y="375.0" width="760.0" height="68.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="420.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм RAPL Power Capping не обмежує миттєву потужність жорстко щомиті.</text>
<text x="420.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Він інтегрує енергію E = ∫ P dt: процесор може споживати PL2, доки середня потужність у вікні Tau не перевищить PL1.</text>
<text x="420.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">При вичерпанні теплового бюджету апаратний контролер плавно скидає P-стан до рівня охолодження.</text>
</svg>