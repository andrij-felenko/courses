<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сорок років віртуальної машини: реалізація випередила теорію</text>
<line x1="300.0" y1="108.0" x2="300.0" y2="678.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="300.0" cy="148.0" r="8.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="278.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1964</text>
<rect x="332.0" y="118.0" width="552.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="608.0" y="144.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">M44/44X (Йорктаун): народжується сам термін</tspan><tspan x="608.0" dy="16.9">«віртуальна машина» — та лише ЧАСТКОВА</tspan></text>
<circle cx="300.0" cy="218.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="278.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1967</text>
<rect x="332.0" y="188.0" width="552.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="608.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">CP-40 (Кембридж, Кризі й Комо): в експлуатації —</tspan><tspan x="608.0" dy="16.9">перша ПОВНА віртуальна машина, за 7 років до теорії</tspan></text>
<circle cx="300.0" cy="288.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="278.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1972</text>
<rect x="332.0" y="258.0" width="552.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="608.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">VM/370: віртуалізація стає товаром IBM</tspan><tspan x="608.0" dy="16.9">(System/370 з апаратним перекладом адрес)</tspan></text>
<circle cx="300.0" cy="358.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="278.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1974</text>
<rect x="332.0" y="328.0" width="552.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="608.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">Теорема Попека–Ґолдберґа (CACM 17):</tspan><tspan x="608.0" dy="16.9">«чутливе ⊆ привілейоване» — коли ВМ можлива</tspan></text>
<circle cx="300.0" cy="428.0" r="8.0" fill="#c98a00" stroke="#c98a00" stroke-width="1.5"/>
<text x="278.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1999</text>
<rect x="332.0" y="398.0" width="552.0" height="60.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="608.0" y="424.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">VMware: двійкова трансляція на льоту</tspan><tspan x="608.0" dy="16.9">обходить діру x86, не змінюючи гостя</tspan></text>
<circle cx="300.0" cy="498.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="278.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2000</text>
<rect x="332.0" y="468.0" width="552.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="608.0" y="494.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">Робін·Ірвайн (USENIX): ~17 команд x86 —</tspan><tspan x="608.0" dy="16.9">чутливі, але НЕ привілейовані; умову порушено</tspan></text>
<circle cx="300.0" cy="568.0" r="8.0" fill="#c98a00" stroke="#c98a00" stroke-width="1.5"/>
<text x="278.0" y="573.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2003</text>
<rect x="332.0" y="538.0" width="552.0" height="60.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="608.0" y="564.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">Xen (SOSP): паравіртуалізація —</tspan><tspan x="608.0" dy="16.9">гостя правлять на гіпервиклики</tspan></text>
<circle cx="300.0" cy="638.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="278.0" y="643.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2005–06</text>
<rect x="332.0" y="608.0" width="552.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="608.0" y="634.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">Intel VT-x і AMD-V: залізо додає кореневий</tspan><tspan x="608.0" dy="16.9">режим і закриває діру — гість біжить незмінний</tspan></text>
</svg>