<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи поставити гіпервізор нижче за гостя</text>
<text x="235.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класична деривілегізація</text>
<text x="705.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна (VT-x / AMD-V)</text>
<line x1="470.0" y1="74.0" x2="470.0" y2="410.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="85.0" y="85.0" width="300.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Застосунки гостя  ·  ring 3</tspan></text>
<rect x="85.0" y="180.0" width="300.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Ядро гостя  ·  ring 1  (знижений)</tspan></text>
<rect x="85.0" y="340.0" width="300.0" height="54.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="371.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Гіпервізор  ·  ring 0</tspan></text>
<line x1="360.0" y1="236.0" x2="360.0" y2="338.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="348.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">пастка</text>
<text x="348.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">(trap)</text>
<rect x="100.3" y="437.5" width="269.4" height="65.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="235.0" y="458.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="235.0" dy="0.0">Гостя виконують зниженим (ring 1).</tspan><tspan x="235.0" dy="16.2">Привілейована команда падає пасткою</tspan><tspan x="235.0" dy="16.2">вниз — гіпервізор її емулює.</tspan></text>
<rect x="555.0" y="80.0" width="300.0" height="172.0" rx="6" fill="#f9fbff" stroke="#2457d6" stroke-width="1.6"/>
<text x="705.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">NON-ROOT  ·  світ гостя</text>
<rect x="575.0" y="116.0" width="260.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Застосунки  ·  ring 3</tspan></text>
<rect x="575.0" y="172.0" width="260.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">Ядро гостя  ·  ring 0  (повний!)</tspan></text>
<rect x="555.0" y="340.0" width="300.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="374.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">ROOT  ·  «ring −1»  ·  гіпервізор</tspan></text>
<line x1="640.0" y1="256.0" x2="640.0" y2="338.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="628.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">VM exit</text>
<line x1="770.0" y1="338.0" x2="770.0" y2="256.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="782.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">VM entry</text>
<rect x="545.4" y="437.5" width="319.2" height="65.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="705.0" y="458.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="705.0" dy="0.0">Гість працює на повному ring 0 у non-root.</tspan><tspan x="705.0" dy="16.2">Лише налаштовані події дають VM exit</tspan><tspan x="705.0" dy="16.2">у root-режим («ring −1»).</tspan></text>
</svg>