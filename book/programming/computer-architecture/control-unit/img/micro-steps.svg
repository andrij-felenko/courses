<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна команда — послідовність тактів, у кожного своя порція сигналів</text>
<rect x="29.0" y="120.0" width="150.0" height="108.0" rx="10" fill="#fbf3df" stroke="#a9842f" stroke-width="2.0"/>
<text x="104.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a9842f" text-anchor="middle" font-weight="700">Такт 1</text>
<text x="104.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="104.0" dy="0.0">виставити адресу</tspan><tspan x="104.0" dy="13.8">на шину · «читати»</tspan></text>
<line x1="183.0" y1="174.0" x2="209.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="213.0" y="120.0" width="150.0" height="108.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="2.0"/>
<text x="288.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Такт 2</text>
<text x="288.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="288.0" dy="0.0">чекати пам'ять</tspan><tspan x="288.0" dy="13.8">(доступ повільний)</tspan></text>
<line x1="367.0" y1="174.0" x2="393.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="397.0" y="120.0" width="150.0" height="108.0" rx="10" fill="#fdf4f4" stroke="#c0392b" stroke-width="2.0"/>
<text x="472.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Такт 3</text>
<text x="472.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">число + регістр</tspan><tspan x="472.0" dy="13.8">в АЛП · увімкнути +</tspan></text>
<line x1="551.0" y1="174.0" x2="577.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="581.0" y="120.0" width="150.0" height="108.0" rx="10" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="656.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Такт 4</text>
<text x="656.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">защіпнути результат</tspan><tspan x="656.0" dy="13.8">у регістр</tspan></text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">крок 3 неможливий раніше за крок 2 — рахувати нема чого, поки дані не привезли</text>
<text x="380.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">команда «додати комірку пам'яті до регістра»</text>
</svg>