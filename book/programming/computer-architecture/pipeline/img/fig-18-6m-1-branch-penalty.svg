<text x="470.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Штраф дорівнює числу тактів від вибірки гілки до того такту, коли її напрям з'ясовано: тут гілку видно на «Вик», тож штраф = 3.</text>
<text x="470.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Глибший конвеєр (більше стадій до перевірки гілки) — більший штраф. Передбачення переходів намагається не платити його зовсім.</text>
