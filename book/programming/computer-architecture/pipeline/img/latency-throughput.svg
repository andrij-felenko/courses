<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затримка не міняється — пропускна здатність зростає</text>
<rect x="50.0" y="56.0" width="330.0" height="150.0" rx="10" fill="#f6f8fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАТРИМКА (час однієї команди)</text>
<rect x="56.0" y="103.0" width="78.0" height="30.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="95.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Виб</text>
<rect x="140.0" y="103.0" width="78.0" height="30.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/><text x="179.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Дек</text>
<rect x="224.0" y="103.0" width="78.0" height="30.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="263.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вик</text>
<text x="215.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3 такти — конвеєр цього не міняє</text>
<text x="215.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(кожна команда йде крізь усі фази)</text>
<rect x="400.0" y="56.0" width="310.0" height="150.0" rx="10" fill="#eef7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="555.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПРОПУСКНА ЗДАТНІСТЬ</text>
<text x="555.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(скільки команд за такт)</text>
<rect x="410.0" y="120.0" width="60.0" height="28.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">готова</text>
<rect x="476.0" y="120.0" width="60.0" height="28.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="506.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">готова</text>
<rect x="542.0" y="120.0" width="60.0" height="28.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="572.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">готова</text>
<rect x="608.0" y="120.0" width="60.0" height="28.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="638.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">готова</text>
<text x="555.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">одна нова — щотакту</text>
<text x="555.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(оце множить конвеєр)</text>
<rect x="50.0" y="228.0" width="660.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як завод: конвеєр не складає один автомобіль швидше —</text>
<text x="380.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">він робить так, щоб машини сходили з лінії частіше.</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Так конвеєр доводить CPI до 1, не піднімаючи частоти; N стадій → до ~N× за такт.</text>
</svg>