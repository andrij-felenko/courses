<text x="380.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ручки тримають CPI біля 1: менше гілок (f) і точніше їх угадувати (a).</text>
<text x="380.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Сучасні передбачувачі дають a ≈ 95–98%, тож надбавка мала; ×N з'їдають саме ці втрати.</text>
