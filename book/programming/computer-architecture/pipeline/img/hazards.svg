<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затори: чому ідеального ×N не буває</text>
<rect x="50.0" y="56.0" width="330.0" height="160.0" rx="10" fill="#fef6e9" stroke="#b8860b" stroke-width="1.6"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6508" text-anchor="middle" font-weight="700">Залежність даних</text>
<text x="215.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">команда 2 чекає результату команди 1</text>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДОДАЙ  R3 ← R1+R2</text>
<text x="215.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДНІМИ R4 ← R3−1   (чекає R3)</text>
<text x="215.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">бульбашка: конвеєр на такт стає</text>
<text x="215.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">лікують пробросом результату вперед</text>
<rect x="400.0" y="56.0" width="310.0" height="160.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="555.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Розгалуження (стрибок)</text>
<text x="555.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вибрані наперед команди — не ті</text>
<rect x="441.0" y="120.0" width="58.0" height="28.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">стриб.</text>
<rect x="505.0" y="120.0" width="58.0" height="28.0" rx="5" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.3"/><line x1="511.0" y1="126.0" x2="557.0" y2="142.0" stroke="#c0392b" stroke-width="1.5"/><line x1="557.0" y1="126.0" x2="511.0" y2="142.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="571.0" y="120.0" width="58.0" height="28.0" rx="5" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.3"/><line x1="577.0" y1="126.0" x2="623.0" y2="142.0" stroke="#c0392b" stroke-width="1.5"/><line x1="623.0" y1="126.0" x2="577.0" y2="142.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="555.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">викид (flush), вибирати заново</text>
<text x="555.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">лікують передбаченням переходів</text>
<rect x="50.0" y="238.0" width="660.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затори спорожнюють конвеєр і крадуть частину виграшу — реально трохи менше за ×N.</text>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Передбачення вгадує напрям гілки наперед: угадав — летить далі, схибив — викидає.</text>
<text x="380.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Прості, однакові команди конвеєрити легше — аргумент на користь RISC.</text>
</svg>