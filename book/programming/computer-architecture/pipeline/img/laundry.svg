<text x="380.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5 інтервалів — бо машини не простоюють</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жодна партія не випралася швидше — але всі три готові скоріше.</text>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Станції (пралка, сушарка) — це різні блоки процесора. Ламається аналогія там,</text>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">де партія потребує ту саму машину двічі або залежить від попередньої — як затори.</text>
