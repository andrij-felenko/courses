<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама робота — дві пари «напруга-частота»</text>
<line x1="50.0" y1="300.0" x2="680.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="680.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<line x1="50.0" y1="300.0" x2="50.0" y2="70.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="50.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">потужність</text>
<rect x="70.0" y="230.0" width="300.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.5"/>
<text x="220.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">низька пара V-f: довго, дешево за операцію</text>
<text x="220.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">менша площа = менше джоулів</text>
<line x1="70.0" y1="306.0" x2="370.0" y2="306.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="220.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">довший час</text>
<rect x="400.0" y="150.0" width="150.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="475.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">висока пара V-f:</text>
<text x="475.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">швидко,</text>
<text x="475.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">дорого</text>
<text x="475.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">за операцію</text>
<line x1="400.0" y1="306.0" x2="550.0" y2="306.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="475.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">коротший час</text>
<text x="360.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Батарея платить за ПЛОЩУ (джоулі), не за висоту стовпчика</text>
</svg>