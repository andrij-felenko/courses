<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому четвертий аргумент їде в r10, а rcx і r11 оголошують затертими</text>
<rect x="50.0" y="58.0" width="590.0" height="496.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<rect x="70.0" y="74.0" width="550.0" height="46.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">Так, як велить ЗВИЧАЙНА угода System V</tspan></text>
<text x="345.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у регістрах перед командою</text>
<rect x="82.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="144.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">rdi</tspan><tspan x="144.0" dy="16.9">арг 1</tspan></text>
<rect x="216.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="278.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="278.0" dy="0.0">rsi</tspan><tspan x="278.0" dy="16.9">арг 2</tspan></text>
<rect x="350.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="412.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="412.0" dy="0.0">rdx</tspan><tspan x="412.0" dy="16.9">арг 3</tspan></text>
<rect x="484.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.5"/><text x="546.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="546.0" dy="0.0">rcx</tspan><tspan x="546.0" dy="16.9">арг 4</tspan></text>
<line x1="345.0" y1="238.0" x2="345.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="262.0" width="450.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">syscall:  RCX := RIP,  R11 := RFLAGS</tspan></text>
<line x1="345.0" y1="310.0" x2="345.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у регістрах одразу після команди</text>
<rect x="80.0" y="360.0" width="530.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="345.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">rcx = адреса повернення</tspan><tspan x="345.0" dy="16.2">четвертого аргументу більше немає</tspan></text>
<rect x="70.0" y="442.0" width="550.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Аргумент зник ще до того, як ядро його прочитало.</tspan><tspan x="345.0" dy="15.6">openat(fd, path, flags, mode) створить файл</tspan><tspan x="345.0" dy="15.6">із випадковими правами.</tspan></text>
<rect x="670.0" y="58.0" width="590.0" height="496.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<rect x="690.0" y="74.0" width="550.0" height="46.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">Так, як велить угода СИСТЕМНОГО ВИКЛИКУ</tspan></text>
<text x="965.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у регістрах перед командою</text>
<rect x="702.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="764.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="764.0" dy="0.0">rdi</tspan><tspan x="764.0" dy="16.9">арг 1</tspan></text>
<rect x="836.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="898.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="898.0" dy="0.0">rsi</tspan><tspan x="898.0" dy="16.9">арг 2</tspan></text>
<rect x="970.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1032.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">rdx</tspan><tspan x="1032.0" dy="16.9">арг 3</tspan></text>
<rect x="1104.0" y="174.0" width="124.0" height="58.0" rx="6" fill="#fff5e0" stroke="#27ae60" stroke-width="1.5"/><text x="1166.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1166.0" dy="0.0">r10</tspan><tspan x="1166.0" dy="16.9">арг 4</tspan></text>
<line x1="965.0" y1="238.0" x2="965.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="740.0" y="262.0" width="450.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">syscall:  RCX := RIP,  R11 := RFLAGS</tspan></text>
<line x1="965.0" y1="310.0" x2="965.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="965.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у регістрах одразу після команди</text>
<rect x="700.0" y="360.0" width="530.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">rcx = адреса повернення</tspan><tspan x="965.0" dy="16.2">r10 = четвертий аргумент, цілий</tspan></text>
<rect x="690.0" y="442.0" width="550.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Команда не чіпає r10 — аргумент доїжджає.</tspan><tspan x="965.0" dy="15.6">Зате rcx і r11 мусять стояти у списку затертих:</tspan><tspan x="965.0" dy="15.6">компілятор сам не знає, що команда їх псує.</tspan></text>
</svg>