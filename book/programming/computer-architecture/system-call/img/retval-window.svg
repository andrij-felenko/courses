<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне число назад: помилці віддано рівно одну сторінку значень</text>
<rect x="70.0" y="120.0" width="1106.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="1176.0" y="120.0" width="34.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="623.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="623.0" dy="0.0">ЗАКОННИЙ РЕЗУЛЬТАТ</tspan><tspan x="623.0" dy="19.5">кількість байтів · номер дескриптора · адреса</tspan></text>
<text x="70.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0</text>
<text x="1210.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">2⁶⁴ − 1</text>
<text x="640.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">усе, що поміщається в rax (x86-64) або x0 (aarch64)</text>
<line x1="1176.0" y1="198.0" x2="320.0" y2="306.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="1210.0" y1="198.0" x2="1200.0" y2="306.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="760.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">остання сторінка, збільшено: рівно 4096 значень</text>
<rect x="320.0" y="306.0" width="293.3" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="466.7" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="466.7" dy="0.0">−4096</tspan><tspan x="466.7" dy="16.9">(тобто 2⁶⁴ − 4096)</tspan><tspan x="466.7" dy="16.9">не вживають</tspan></text>
<rect x="613.3" y="306.0" width="293.3" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">−4095 … −2</tspan><tspan x="760.0" dy="16.9">коди помилок</tspan><tspan x="760.0" dy="16.9">4095 … 2</tspan></text>
<rect x="906.7" y="306.0" width="293.3" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1053.3" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1053.3" dy="0.0">−1</tspan><tspan x="1053.3" dy="16.9">код помилки 1</tspan><tspan x="1053.3" dy="16.9">(EPERM)</tspan></text>
<rect x="60.0" y="298.0" width="220.0" height="116.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="336.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Ядро ніколи не віддає</tspan><tspan x="170.0" dy="15.6">цю сторінку. Тому жодна</tspan><tspan x="170.0" dy="15.6">законна адреса сюди</tspan><tspan x="170.0" dy="15.6">не влучить.</tspan></text>
<rect x="320.0" y="466.0" width="880.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="493.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Уся перевірка — одне беззнакове порівняння:</tspan><tspan x="760.0" dy="18.2">r &gt; −4096UL   ⇒   це помилка, errno = −r</tspan></text>
</svg>