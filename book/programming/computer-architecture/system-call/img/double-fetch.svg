<rect x="504.0" y="131.5" width="220.1" height="33.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="614.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="614.0" dy="0.0">перевіряє: 64 ≤ 64 — гаразд</tspan></text>
<rect x="840.8" y="114.6" width="190.4" height="66.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="936.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">читає len ВДРУГЕ → 4096</tspan><tspan x="936.0" dy="16.9">і копіює 4096 Б</tspan><tspan x="936.0" dy="16.9">у буфер на 64 Б</tspan></text>
<rect x="300.0" y="264.0" width="448.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="524.0" y="292.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="524.0" dy="0.0">len = 64</tspan></text>
