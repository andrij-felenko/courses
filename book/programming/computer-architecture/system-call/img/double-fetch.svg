<rect x="682.4" y="397.5" width="131.1" height="33.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.5"/><text x="748.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">пише len = 4096</tspan></text>
