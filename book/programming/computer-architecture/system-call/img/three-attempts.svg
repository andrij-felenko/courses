<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи потрапити в код ядра — і чому вцілів лише третій</text>
<text x="46.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Звичайний виклик підпрограми</text>
<text x="830.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">код ядра</text>
<rect x="46.0" y="93.0" width="160.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="126.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="126.0" dy="0.0">Застосунок</tspan><tspan x="126.0" dy="16.9">рівень 3</tspan></text>
<rect x="290.0" y="93.0" width="300.0" height="49.9" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">стрибок за адресою,</tspan><tspan x="440.0" dy="16.9">рівень НЕ міняється</tspan></text>
<rect x="680.0" y="64.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити права</tspan></text>
<rect x="680.0" y="100.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити межі</tspan></text>
<rect x="680.0" y="136.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">виконати запис</tspan></text>
<line x1="212.0" y1="118.0" x2="268.0" y2="118.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="614.0" y1="118.0" x2="672.0" y2="82.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1010.0" y="72.0" width="210.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1115.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1115.0" dy="0.0">Рівень так і лишився 3.</tspan><tspan x="1115.0" dy="15.6">Ядро падає на першій же</tspan><tspan x="1115.0" dy="15.6">привілейованій команді.</tspan></text>
<text x="46.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Виклик, що сам піднімає рівень</text>
<text x="830.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">код ядра</text>
<rect x="46.0" y="289.1" width="160.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="126.0" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="126.0" dy="0.0">Застосунок</tspan><tspan x="126.0" dy="16.9">рівень 3</tspan></text>
<rect x="290.0" y="280.6" width="300.0" height="66.8" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">рівень піднімає апаратура,</tspan><tspan x="440.0" dy="16.9">але адресу обирає той,</tspan><tspan x="440.0" dy="16.9">хто просить</tspan></text>
<rect x="680.0" y="260.0" width="300.0" height="36.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="282.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити права</tspan></text>
<rect x="680.0" y="296.0" width="300.0" height="36.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити межі</tspan></text>
<rect x="680.0" y="332.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">виконати запис</tspan></text>
<line x1="212.0" y1="314.0" x2="268.0" y2="314.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="614.0" y1="314.0" x2="672.0" y2="350.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1010.0" y="268.0" width="210.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1115.0" y="302.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1115.0" dy="0.0">Указано адресу одразу</tspan><tspan x="1115.0" dy="15.6">після перевірок —</tspan><tspan x="1115.0" dy="15.6">захисту не існує.</tspan></text>
<text x="46.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Команда-пастка (syscall / svc / ecall)</text>
<text x="830.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">код ядра</text>
<rect x="46.0" y="485.1" width="160.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="126.0" y="506.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="126.0" dy="0.0">Застосунок</tspan><tspan x="126.0" dy="16.9">рівень 3</tspan></text>
<rect x="290.0" y="476.6" width="300.0" height="66.8" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="497.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">у регістрі — НОМЕР послуги;</tspan><tspan x="440.0" dy="16.9">адресу входу апаратура бере</tspan><tspan x="440.0" dy="16.9">з регістра, який пише ядро</tspan></text>
<rect x="680.0" y="456.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="478.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити права</tspan></text>
<rect x="680.0" y="492.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="514.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">перевірити межі</tspan></text>
<rect x="680.0" y="528.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="550.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">виконати запис</tspan></text>
<line x1="212.0" y1="510.0" x2="268.0" y2="510.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="614.0" y1="510.0" x2="672.0" y2="474.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1010.0" y="464.0" width="210.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1115.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1115.0" dy="0.0">Вхід завжди згори,</tspan><tspan x="1115.0" dy="15.6">перевірки не обійти.</tspan><tspan x="1115.0" dy="15.6">Так і має бути.</tspan></text>
</svg>