<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1340" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід команди-пастки: від екстракодів Atlas до x86-64</text>
<text x="143.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1962 · Atlas</text>
<rect x="40.0" y="225.0" width="206.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="143.0" y="282.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="143.0" dy="0.0">екстракод</tspan><tspan x="143.0" dy="16.9">номер функції —</tspan><tspan x="143.0" dy="16.9">у самій команді</tspan><tspan x="143.0" dy="16.9">≈250 кодів із 512,</tspan><tspan x="143.0" dy="16.9">близько половини —</tspan><tspan x="143.0" dy="16.9">функції супервізора</tspan></text>
<text x="391.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1964 · IBM System/360</text>
<rect x="288.0" y="225.0" width="206.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="391.0" y="282.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="391.0" dy="0.0">SVC n</tspan><tspan x="391.0" dy="16.9">8-бітний номер</tspan><tspan x="391.0" dy="16.9">прямо в байті команди</tspan><tspan x="391.0" dy="16.9">стеля — 256 послуг</tspan><tspan x="391.0" dy="16.9">проблемний стан</tspan><tspan x="391.0" dy="16.9">проти супервізорного</tspan></text>
<text x="639.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1991 · Linux 0.01</text>
<rect x="536.0" y="225.0" width="206.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="639.0" y="282.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="639.0" dy="0.0">int 0x80</tspan><tspan x="639.0" dy="16.9">вектор — у команді,</tspan><tspan x="639.0" dy="16.9">номер послуги — в EAX</tspan><tspan x="639.0" dy="16.9">стелю номерів знято</tspan><tspan x="639.0" dy="16.9">але кожен вхід іде</tspan><tspan x="639.0" dy="16.9">через таблиці в пам'яті</tspan></text>
<text x="903.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">1997 · Intel Pentium II</text>
<rect x="800.0" y="88.0" width="206.0" height="178.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="903.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="903.0" dy="0.0">SYSENTER / SYSEXIT</tspan><tspan x="903.0" dy="16.9">вхід — із трьох MSR</tspan><tspan x="903.0" dy="16.9">жодного звернення</tspan><tspan x="903.0" dy="16.9">до таблиць</tspan><tspan x="903.0" dy="16.9">не зберігає ні адреси</tspan><tspan x="903.0" dy="16.9">повернення, ні стека</tspan></text>
<text x="903.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1997–98 · AMD K6</text>
<rect x="800.0" y="380.0" width="206.0" height="178.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="903.0" y="431.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="903.0" dy="0.0">SYSCALL / SYSRET</tspan><tspan x="903.0" dy="16.9">вхід — із MSR LSTAR,</tspan><tspan x="903.0" dy="16.9">селектори — зі STAR</tspan><tspan x="903.0" dy="16.9">RIP → RCX,</tspan><tspan x="903.0" dy="16.9">RFLAGS → R11</tspan><tspan x="903.0" dy="16.9">стек ядро ставить саме</tspan></text>
<text x="1190.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">2003–2004 · x86-64</text>
<rect x="1080.0" y="200.0" width="220.0" height="240.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1190.0" dy="0.0">AMD не має SYSENTER</tspan><tspan x="1190.0" dy="16.9">у довгому режимі;</tspan><tspan x="1190.0" dy="16.9">Intel не має SYSCALL</tspan><tspan x="1190.0" dy="16.9">у сумісному.</tspan><tspan x="1190.0" dy="16.9"></tspan><tspan x="1190.0" dy="16.9">Перетин у 64 бітах —</tspan><tspan x="1190.0" dy="16.9">лише SYSCALL,</tspan><tspan x="1190.0" dy="16.9">у 32-бітному сумісному —</tspan><tspan x="1190.0" dy="16.9">лише SYSENTER</tspan></text>
<line x1="246.0" y1="320.0" x2="282.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="494.0" y1="320.0" x2="530.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="742.0" y1="320.0" x2="794.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="742.0" y1="320.0" x2="794.0" y2="451.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1006.0" y1="177.0" x2="1074.0" y2="268.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1006.0" y1="469.0" x2="1074.0" y2="372.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="570.0" width="1260.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="596.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">Номер послуги переїхав із самої команди в регістр, а адреса входу — з таблиці в пам'яті в регістр процесора.</tspan></text>
</svg>