<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Внесок Томпсона: одна вимога, що зробила кодування живучим</text>
<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у телефонній розмові Пайк «проспівав» список бажаного — і саме пункт про синхронізацію все вирішив</text>
<rect x="40.0" y="92.0" width="410.0" height="322.0" rx="10" fill="#fbfbfb" stroke="#caa24a" stroke-width="2"/>
<text x="245.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Уже було у FSS-UTF (Дейв Проссер)</text>
<text x="62.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ASCII (0…127) кодується одним байтом —</text>
<text x="62.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    і це той самий байт, що в ASCII</text>
<text x="62.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у багатобайтовому символі КОЖЕН байт</text>
<text x="62.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    має старший біт 1 (не сплутати з ASCII)</text>
<text x="62.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">немає нуль-байтів і скісної риски '/'</text>
<text x="62.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    усередині символу → безпечно для</text>
<text x="62.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    імен файлів Unix (звідси й «FS-Safe»)</text>
<rect x="470.0" y="92.0" width="410.0" height="322.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.4"/>
<text x="675.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Що додав Кен Томпсон</text>
<text x="492.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">САМОСИНХРОНІЗАЦІЯ:</text>
<text x="492.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за будь-яким байтом видно його роль —</text>
<text x="492.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">початок символу чи його продовження</text>
<text x="492.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(продовження завжди починається з 10…);</text>
<text x="492.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тож, «упавши» в середину потоку,</text>
<text x="492.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">знаходиш межу символу, втративши</text>
<text x="492.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">щонайбільше кілька байтів — і йдеш далі</text>
<rect x="492.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<text x="515.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="515.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ASCII</text>
<rect x="544.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="567.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">110</text>
<text x="567.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">поч.</text>
<rect x="596.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
<text x="619.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">10</text>
<text x="619.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прод.</text>
<rect x="648.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="671.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1110</text>
<text x="671.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">поч.</text>
<rect x="700.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
<text x="723.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">10</text>
<text x="723.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прод.</text>
<rect x="752.0" y="326.0" width="46.0" height="34.0" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
<text x="775.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">10</text>
<text x="775.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прод.</text>
<line x1="619.0" y1="390.0" x2="619.0" y2="364.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="619.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">почав читати звідси → видно «прод.» → відступив до межі</text>
</svg>
