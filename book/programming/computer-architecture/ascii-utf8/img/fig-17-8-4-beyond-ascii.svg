<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">256 значень — замало для світу: кодові сторінки й «кракозябри»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">восьмий вільний біт дав лише 128 додаткових кодів — а мов і символів тисячі; почалася плутанина</text>
<rect x="60.0" y="84.0" width="360.0" height="150.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Проблема місткості</text>
<text x="78.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">байт = 256 значень (2⁸)</text>
<text x="78.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ASCII зайняв 0…127, лишилось 128</text>
<text x="78.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а в самій лише кирилиці ~66 букв,</text>
<text x="78.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а є ще грецька, іврит, арабська…</text>
<text x="78.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">а китайських ієрогліфів — десятки тисяч!</text>
<rect x="460.0" y="84.0" width="380.0" height="150.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">«Латка»: кодові сторінки</text>
<text x="478.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">верхні 128 кодів перевизначали</text>
<text x="478.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">під різні мови (code pages):</text>
<text x="478.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">CP1251 — кирилиця, CP1252 — Захід,</text>
<text x="478.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">KOI8-U, ISO-8859-… — десятки таблиць</text>
<text x="478.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">код 200 = різна буква в різних таблицях</text>
<rect x="60.0" y="250.0" width="760.0" height="130.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="440.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок — мохібейк (mojibake), ті самі «кракозябри»:</text>
<text x="240.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">збережено як CP1251:</text>
<rect x="180.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="203.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">П</text>
<rect x="232.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="255.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">р</text>
<rect x="284.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="307.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">и</text>
<line x1="360.0" y1="343.0" x2="430.0" y2="343.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="395.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">відкрито</text>
<text x="395.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">як CP1252</text>
<text x="640.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ті самі байти, інша таблиця:</text>
<rect x="560.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="583.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Ï</text>
<rect x="612.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="635.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ð</text>
<rect x="664.0" y="320.0" width="46.0" height="46.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="687.0" y="351.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">è</text>
<text x="760.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">— нісенітниця</text>
<text x="440.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Байти не змінилися — змінилася домовленість читання. Світу був потрібен ОДИН спільний список усіх символів.</text>
</svg>
