<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збій сторінки: доступ до того, чого немає в RAM</text>
<rect x="24.0" y="90.0" width="150.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="42.0" cy="108.0" r="12.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="42.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="99.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="99.0" dy="0.0">Програма читає</tspan><tspan x="99.0" dy="14.3">адресу на сторінці,</tspan><tspan x="99.0" dy="14.3">якої немає в RAM</tspan></text>
<rect x="198.0" y="90.0" width="150.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="216.0" cy="108.0" r="12.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="216.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="273.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="273.0" dy="0.0">Залізо бачить</tspan><tspan x="273.0" dy="14.3">«немає» → перериває</tspan><tspan x="273.0" dy="14.3">програму (trap)</tspan></text>
<rect x="372.0" y="90.0" width="150.0" height="110.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="390.0" cy="108.0" r="12.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="390.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<text x="447.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">Ядро ОС бере</tspan><tspan x="447.0" dy="14.3">сторінку з диска</tspan><tspan x="447.0" dy="14.3">у вільний фрейм</tspan></text>
<rect x="546.0" y="90.0" width="150.0" height="110.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="564.0" cy="108.0" r="12.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="564.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4</text>
<text x="621.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="621.0" dy="0.0">Править таблицю,</tspan><tspan x="621.0" dy="14.3">повторює ту саму</tspan><tspan x="621.0" dy="14.3">інструкцію — тепер влучає</tspan></text>
<line x1="174.0" y1="145.0" x2="198.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="348.0" y1="145.0" x2="372.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="522.0" y1="145.0" x2="546.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Програма нічого не помічає — лише невеличку затримку.</text>
<text x="360.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Для неї сторінка «завжди була на місці». Це і є ілюзія суцільної пам'яті.</text>
</svg>