<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
<rect width="940" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Множення у форматі Q (тут Q8.8): чотири кроки одного добутку</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">беремо ширший тип → перемножуємо як цілі → додаємо «пів-біта» для округлення → зсуваємо назад на n → звужуємо</text>
<rect x="70.0" y="96.0" width="150.0" height="56.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="145.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a = 1.5</text>
<text x="145.0" y="138.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="normal">int16 = 384</text>
<rect x="430.0" y="96.0" width="150.0" height="56.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="505.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">b = 2.5</text>
<text x="505.0" y="138.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="normal">int16 = 640</text>
<text x="360.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="900.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">крок 1</text>
<text x="900.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">два операнди</text>
<text x="900.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">Q8.8, масштаб 256</text>
<line x1="470.0" y1="156.0" x2="470.0" y2="182.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="280.0" y="186.0" width="380.0" height="56.0" rx="6" fill="#fff6e6" stroke="#caa24a" stroke-width="2.0"/>
<text x="470.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">32-бітний добуток (int32_t)</text>
<text x="470.0" y="229.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="normal">384 × 640 = 245760   ← масштаб 256·256</text>
<text x="900.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">крок 2</text>
<text x="900.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">ширший тип, щоб не</text>
<text x="900.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">переповнитись (масштаб²)</text>
<line x1="470.0" y1="246.0" x2="470.0" y2="272.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="280.0" y="276.0" width="380.0" height="56.0" rx="6" fill="#eef9ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="470.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">додати «пів-біта» перед зсувом</text>
<text x="470.0" y="319.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal">245760 + (1&lt;&lt;7) = 245888   ← +128 = ½·256</text>
<text x="900.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">крок 3</text>
<text x="900.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">необов'язково, але без</text>
<text x="900.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">нього зсув лише вниз</text>
<line x1="470.0" y1="336.0" x2="470.0" y2="362.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="280.0" y="366.0" width="380.0" height="56.0" rx="6" fill="#eef9ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="470.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зсув ≫ 8, потім назад у int16</text>
<text x="470.0" y="409.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="normal">245888 ≫ 8 = 960   →  960/256 = 3.75 ✓</text>
<text x="900.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">крок 4</text>
<text x="900.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">результат знову Q8.8</text>
<text x="900.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1.5 × 2.5 = 3.75</text>
<line x1="46.0" y1="180.0" x2="46.0" y2="428.0" stroke="#e4e4e4" stroke-width="6" stroke-linecap="round"/>
<text x="40.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ширший тип</text>
<rect x="70.0" y="504.0" width="800.0" height="36.0" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="470.0" y="527.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Те саме «множення зі зсувом», та на знаковому типі зсув мусить бути арифметичним (≫ зберігає знак).</text>
</svg>
