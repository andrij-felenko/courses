<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хитрість фіксованої коми: кома — у голові, в залізі — ціле число</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зберігаємо число × масштаб (тут ×16) як ЦІЛЕ; рахуємо цілою арифметикою; читаючи — ділимо назад</text>
<text x="260.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">хочемо зберегти</text>
<text x="280.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">23.5</text>
<line x1="330.0" y1="115.0" x2="400.0" y2="115.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="365.0" y="105.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">× 16</text>
<text x="420.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">376</text>
<text x="480.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← оце ціле лежить у залізі</text>
<text x="260.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">читаємо назад</text>
<text x="280.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">376</text>
<line x1="330.0" y1="170.0" x2="400.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="365.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">÷ 16</text>
<text x="420.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">23.5</text>
<text x="480.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← знову наше число</text>
<rect x="70.0" y="220.0" width="720.0" height="110.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="430.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо тримає 376 і не знає про жодну кому — вона існує лише в нашій ДОМОВЛЕНОСТІ.</text>
<text x="430.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«×16» = зсув коми на 4 розряди (бо 16 = 2⁴): 376 = 10111.1000 з комою після 4-го біта справа.</text>
<text x="430.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодного спецзаліза для дробів — лише звичайні цілі та звичка пам'ятати, де «уявна» кома.</text>
<text x="430.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так само й «гроші в копійках»: зберігай ×100 цілим — і жодних похибок із дробами.</text>
</svg>
