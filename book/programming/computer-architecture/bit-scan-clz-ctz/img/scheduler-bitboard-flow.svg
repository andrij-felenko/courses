<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування: Планувальник ОС та Шахові бітборди</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системні застосування бітового пошуку: Планувальник ОС та Шахові бітборди</text>
<rect x="35.0" y="55.0" width="370.0" height="370.0" rx="6" fill="#fafbfc" stroke="#2457d6" stroke-width="1.4"/>
<text x="220.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Планувальник ядра ОС (O(1) Scheduler)</text>
<rect x="55.0" y="105.0" width="330.0" height="52.0" rx="4" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="220.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бітова карта пріоритетів (140 черг задач)</text>
<text x="220.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">unsigned long bitmap[5] (1 біт = є готова задача)</text>
<line x1="220.0" y1="157.0" x2="220.0" y2="180.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="55.0" y="180.0" width="330.0" height="58.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">sched_find_first_bit(bitmap)</text>
<text x="220.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратний CTZ знаходить чергу за 1 такт</text>
<line x1="220.0" y1="238.0" x2="220.0" y2="260.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="55.0" y="260.0" width="330.0" height="68.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибір задачі з черги runqueue[prio]</text>
<text x="220.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Час вибору: O(1) константа &lt; 1 нс</text>
<text x="220.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Не залежить від загальної кількості ниток (10 чи 100 000)</text>
<rect x="55.0" y="345.0" width="330.0" height="65.0" rx="4" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="220.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Перевага над циклом:</text>
<text x="220.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Без перевірки 140 вказівників у пам'яті</text>
<text x="220.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повна відсутність промахів передбачення переходів</text>
<rect x="435.0" y="55.0" width="370.0" height="370.0" rx="6" fill="#fafbfc" stroke="#27ae60" stroke-width="1.4"/>
<text x="620.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Шаховий рушій (Bitboard Move Gen)</text>
<rect x="455.0" y="105.0" width="330.0" height="52.0" rx="4" fill="#f2faf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="620.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бітборд 64-біт: позиція фігур (uint64_t)</text>
<text x="620.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кожен біт 0..63 відповідає клітинці дошки (a1..h8)</text>
<line x1="620.0" y1="157.0" x2="620.0" y2="180.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="455.0" y="180.0" width="330.0" height="58.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">sq = std::countr_zero(bitboard)</text>
<text x="620.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Миттєве отримання координат наступної фігури</text>
<line x1="620.0" y1="238.0" x2="620.0" y2="260.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="455.0" y="260.0" width="330.0" height="68.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">bitboard &amp;= (bitboard - 1)</text>
<text x="620.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Скидання молодшого біта за 1 такт АЛП</text>
<text x="620.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Цикл виконується рівно K разів для K фігур (не 64!)</text>
<rect x="455.0" y="345.0" width="330.0" height="65.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="620.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Перевага над скануванням 8x8:</text>
<text x="620.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Генерація ходів прискорюється в 10–20 разів</text>
<text x="620.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ключовий фактор обчислення 100+ млн вузлів/с</text>
<text x="420.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Апаратний бітовий пошук замінює O(N) розгалужені цикли на O(1) безанкерні виклики АЛП.</tspan></text>
</svg>