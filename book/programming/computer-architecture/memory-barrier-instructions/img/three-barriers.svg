<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три бар'єри — три різні гарантії</text>
<rect x="40.0" y="90.0" width="150.0" height="92.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="115.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">DMB</text>
<text x="115.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">упорядкувати пам'ять</text>
<rect x="210.0" y="90.0" width="510.0" height="92.0" rx="6" fill="#fbfcfd" stroke="#c7ccd2" stroke-width="1.3"/>
<text x="465.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">усі доступи до пам'яті ДО бар'єра стають видимі перед доступами ПІСЛЯ.</text>
<text x="465.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Не-пам'ятні команди можуть бігти вперед. Нічого не «чекає».</text>
<rect x="40.0" y="210.0" width="150.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="115.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">DSB</text>
<text x="115.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">дочекатися пам'яті</text>
<rect x="210.0" y="210.0" width="510.0" height="92.0" rx="6" fill="#fbfcfd" stroke="#c7ccd2" stroke-width="1.3"/>
<text x="465.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">як DMB, але ЖОДНА наступна команда не почнеться, доки всі доступи ДО бар'єра</text>
<text x="465.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">реально не завершаться (запис дійшов до пристрою, кеш/TLB прибрані).</text>
<rect x="40.0" y="330.0" width="150.0" height="92.0" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="2.0"/>
<text x="115.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">ISB</text>
<text x="115.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">перечитати команди</text>
<rect x="210.0" y="330.0" width="510.0" height="92.0" rx="6" fill="#fbfcfd" stroke="#c7ccd2" stroke-width="1.3"/>
<text x="465.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">викинути вже вибрані команди з конвеєра й вибрати наступні НАНОВО —</text>
<text x="465.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">щоб зміна керівних регістрів (CONTROL, VTOR, CPACR) справді подіяла.</text>
<text x="380.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сила зростає: DMB тільки впорядковує → DSB ще й чекає завершення → ISB ще й скидає конвеєр</text>
</svg>