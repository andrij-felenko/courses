<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Результат фази: у IR лежить чергова команда, а PC уже вказує на наступну. Команду ВЗЯТО — час зрозуміти, що вона означає.</text>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зверніть увагу: тут спрацювало «вузьке місце» — по команду довелося йти в повільну пам'ять через шину.</text>
