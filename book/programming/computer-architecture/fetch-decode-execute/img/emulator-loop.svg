<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл вибірка → декодування → виконання як while-петля на C</text>
<circle cx="220.0" cy="280.0" r="130.0" fill="none" stroke="#e4e4e4" stroke-width="2.0"/>
<circle cx="220.0" cy="150.0" r="10.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="220.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВИБІРКА</text>
<text x="220.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">(fetch)</text>
<circle cx="333.1" cy="345.0" r="10.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<text x="333.1" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ВИКОНАННЯ</text>
<text x="333.1" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">(execute)</text>
<circle cx="106.9" cy="345.0" r="10.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<text x="106.9" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">наступна</text>
<text x="106.9" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">команда</text>
<text x="220.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">цикл</text>
<text x="220.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">крутиться</text>
<text x="220.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">декодування зливається з вибіркою:</text>
<text x="220.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">розрізати байт на op та операнди</text>
<rect x="470.0" y="90.0" width="420.0" height="380.0" rx="12" fill="#0e1116" stroke="#0e1116" stroke-width="0.0"/>
<text x="488" y="120" font-family="Consolas, monospace" font-size="14" fill="#7fd58f" text-anchor="start">// ядро емулятора</text>
<text x="488" y="146" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">while (running) {</text>
<text x="488" y="172" font-family="Consolas, monospace" font-size="14" fill="#27ae60" text-anchor="start">    op = code[ip++];   // ВИБІРКА</text>
<text x="488" y="198" font-family="Consolas, monospace" font-size="14" fill="#27ae60" text-anchor="start">    a  = code[ip++];   //  + декод</text>
<text x="488" y="224" font-family="Consolas, monospace" font-size="14" fill="#c0392b" text-anchor="start">    switch (op) {      // ВИКОНАННЯ</text>
<text x="488" y="250" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">      case LD:  r[a]=code[ip++];</text>
<text x="488" y="276" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">      case ADD: r[a]+=r[code[ip++]];</text>
<text x="488" y="302" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">      case ST:  mem[code[ip++]]=r[a];</text>
<text x="488" y="328" font-family="Consolas, monospace" font-size="14" fill="#2457d6" text-anchor="start">      case JMP: ip = a;</text>
<text x="488" y="354" font-family="Consolas, monospace" font-size="14" fill="#b8860b" text-anchor="start">      case HLT: running = 0;</text>
<text x="488" y="380" font-family="Consolas, monospace" font-size="14" fill="#6b7280" text-anchor="start">      // ... решта з 8 опкодів ...</text>
<text x="488" y="406" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">    }</text>
<text x="488" y="432" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8" text-anchor="start">}</text>
<line x1="232.0" y1="144.0" x2="478.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="341.1" y1="345.0" x2="478.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>