<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Фаза 3 — ВИКОНАННЯ: зробити те, що наказано</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за сигналами декодера операнди йдуть в АЛП, вона рахує, результат лягає в регістр, а прапорці оновлюються</text>
<rect x="90.0" y="130.0" width="140.0" height="30.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="100.0" y="149.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">R1</text>
<text x="220.0" y="149.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">6</text>
<rect x="90.0" y="168.0" width="140.0" height="30.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="100.0" y="187.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">R2</text>
<text x="220.0" y="187.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">5</text>
<line x1="232.0" y1="145.0" x2="320.0" y2="175.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="232.0" y1="183.0" x2="320.0" y2="192.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<path d="M320,150 L396,150 L410,168 L424,150 L500,150 L457,250 L363,250 Z" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="410.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">АЛП: +</text>
<line x1="410.0" y1="252.0" x2="410.0" y2="290.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="330.0" y="292.0" width="170.0" height="30.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="340.0" y="311.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">R3 ← результат</text>
<text x="490.0" y="311.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">11</text>
<line x1="500.0" y1="200.0" x2="600.0" y2="200.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="600.0" y="168.0" width="200.0" height="66.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="700.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">прапорці оновлено</text>
<text x="700.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Z=0 · C=0 · N=0 · V=0</text>
<rect x="60.0" y="332.0" width="760.0" height="76.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Команду ВИКОНАНО: 6 + 5 = 11 лежить у R3, прапорці відбивають результат. Тепер цикл вертається до Вибірки наступної.</text>
<text x="440.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Для іншої команди виконання інше: «завантаж/запиши» возить число шиною, а «стрибок» кладе нову адресу в PC —</text>
<text x="440.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">але коло фаз те саме. Різні команди — різна третя фаза, та вибірка й декодування завжди однакові.</text>
</svg>
