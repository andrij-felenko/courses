<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видимий селектор і тіньовий регістр дескриптора</text>
<text x="480.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тіньовий кеш дескрипторів (Shadow Descriptor Cache)</text>
<rect x="40.0" y="80.0" width="530.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="305.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура сегментного регістра CPU (CS, DS, SS...)</text>
<rect x="53.3" y="148.4" width="213.4" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Видима частина (16 біт):</tspan><tspan x="160.0" dy="15.6">Селектор (Selector)</tspan><tspan x="160.0" dy="15.6">(доступний для mov ds, ax)</tspan></text>
<rect x="60.0" y="250.0" width="490.0" height="225.0" rx="6" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
<text x="305.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Прихована частина — Тіньовий кеш (Shadow Cache):</text>
<rect x="80.0" y="295.0" width="450.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Базова адреса (Base Address): 32/64 біти</tspan></text>
<rect x="80.0" y="345.0" width="450.0" height="40.0" rx="6" fill="#fff2df" stroke="#d97706" stroke-width="1.5"/><text x="305.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Межа сегмента (Segment Limit): 32 біти (у байтах)</tspan></text>
<rect x="80.0" y="395.0" width="450.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="421.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Атрибути захисту: DPL (0..3), Тип (Read/Write/Exec),</tspan><tspan x="305.0" dy="14.3">Розрядність (D/B), Присутність (P), Гранулярність (G)</tspan></text>
<rect x="640.0" y="80.0" width="280.0" height="210.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="780.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оперативна пам'ять (RAM)</text>
<rect x="698.2" y="148.4" width="163.6" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Таблиця GDT в пам'яті</tspan><tspan x="780.0" dy="15.6">8-байтовий дескриптор</tspan><tspan x="780.0" dy="15.6">(Base, Limit, Rights)</tspan></text>
<line x1="266.7" y1="180.0" x2="698.2" y2="180.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="482.5" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Одноразове читання GDT</text>
<line x1="780.0" y1="211.6" x2="550.0" y2="360.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="720.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">2. Апаратне декодування
у тіньовий регістр</text>
<rect x="677.0" y="388.4" width="206.0" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Кожна інструкція [ebx]:</tspan><tspan x="780.0" dy="15.6">Читає Base/Limit миттєво</tspan><tspan x="780.0" dy="15.6">з тіньового кешу без RAM!</tspan></text>
<line x1="550.0" y1="420.0" x2="677.0" y2="420.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="613.5" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. 0 тактів затримки</text>
</svg>