<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плоска модель і сторінковий переклад MMU</text>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плоска модель (Flat Model) та витіснення сегментації пейджингом</text>
<rect x="53.3" y="106.6" width="213.4" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Логічна адреса:</tspan><tspan x="160.0" dy="16.9">Селектор : Зсув (Offset)</tspan><tspan x="160.0" dy="16.9">CS : EIP  або  DS : EAX</tspan></text>
<rect x="333.0" y="106.6" width="294.0" height="66.8" rx="6" fill="#fff2df" stroke="#d97706" stroke-width="1.5"/><text x="480.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Плоский дескриптор (Flat Segment):</tspan><tspan x="480.0" dy="16.9">Base Address = 0x00000000</tspan><tspan x="480.0" dy="16.9">Limit = 4 ГБ (0xFFFFF, G=1)</tspan></text>
<line x1="266.7" y1="140.0" x2="333.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="701.3" y="106.6" width="197.3" height="66.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Лінійна адреса:</tspan><tspan x="800.0" dy="16.9">Base + Offset = Offset</tspan><tspan x="800.0" dy="16.9">(тотожне відображення)</tspan></text>
<line x1="627.0" y1="140.0" x2="701.3" y2="140.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="800.0" y1="173.4" x2="800.0" y2="260.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="810.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">Лінійна адреса йде на вхід MMU</text>
<rect x="100.0" y="270.0" width="760.0" height="190.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="480.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Вся реальна ізоляція та захист перейшли до пейджингу (Сторінковий MMU):</text>
<rect x="144.5" y="338.4" width="191.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Таблиці сторінок (CR3)</tspan><tspan x="240.0" dy="15.6">Ізоляція процесів:</tspan><tspan x="240.0" dy="15.6">Кожен процес має свій CR3</tspan></text>
<rect x="374.2" y="338.4" width="211.5" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Прапорці захисту сторінок</tspan><tspan x="480.0" dy="15.6">R/W (запис) | U/S (рівень)</tspan><tspan x="480.0" dy="15.6">NX / XD (заборона виконання)</tspan></text>
<rect x="627.9" y="338.4" width="184.2" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Фізичні кадри RAM (4 КБ)</tspan><tspan x="720.0" dy="15.6">Динамічне виділення</tspan><tspan x="720.0" dy="15.6">та віртуальна пам'ять</tspan></text>
<line x1="340.0" y1="370.0" x2="370.0" y2="370.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="370.0" x2="620.0" y2="370.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>