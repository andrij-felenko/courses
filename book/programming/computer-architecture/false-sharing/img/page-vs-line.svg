<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="544" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама хвороба на двох одиницях власності</text>
<rect x="292.0" y="40.0" width="300.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="442.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="442.0" dy="0.0">IVY, 1986</tspan><tspan x="442.0" dy="16.2">програмна спільна пам'ять</tspan></text>
<rect x="616.0" y="40.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="766.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="766.0" dy="0.0">багатоядерний кристал</tspan><tspan x="766.0" dy="16.2">апаратна когерентність</tspan></text>
<rect x="34.0" y="100.0" width="236.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d2da" stroke-width="1.5"/><text x="152.0" y="135.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">одиниця власності</tspan></text>
<rect x="292.0" y="100.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="442.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="442.0" dy="0.0">сторінка ≈ 1 КБ</tspan></text>
<rect x="616.0" y="100.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="766.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="766.0" dy="0.0">кеш-лінія 64 Б</tspan></text>
<rect x="34.0" y="174.0" width="236.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d2da" stroke-width="1.5"/><text x="152.0" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">хто відбирає</tspan></text>
<rect x="292.0" y="174.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="442.0" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="442.0" dy="0.0">ядро ОС за пасткою</tspan><tspan x="442.0" dy="15.6">захисту сторінки</tspan></text>
<rect x="616.0" y="174.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="766.0" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="766.0" dy="0.0">протокол когерентності</tspan><tspan x="766.0" dy="15.6">в кремнію</tspan></text>
<rect x="34.0" y="248.0" width="236.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d2da" stroke-width="1.5"/><text x="152.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">куди їде</tspan></text>
<rect x="292.0" y="248.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="442.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="442.0" dy="0.0">мережею до іншої</tspan><tspan x="442.0" dy="15.6">машини</tspan></text>
<rect x="616.0" y="248.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="766.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="766.0" dy="0.0">між кешами</tspan><tspan x="766.0" dy="15.6">на тому самому кристалі</tspan></text>
<rect x="34.0" y="322.0" width="236.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d2da" stroke-width="1.5"/><text x="152.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">ціна одного переїзду</tspan></text>
<rect x="292.0" y="322.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="442.0" y="349.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="442.0" dy="0.0">кілька порядків над</tspan><tspan x="442.0" dy="15.6">локальним доступом</tspan></text>
<rect x="616.0" y="322.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="766.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="766.0" dy="0.0">≈ 20 нс проти ≈ 1.4 нс</tspan></text>
<rect x="34.0" y="396.0" width="236.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d2da" stroke-width="1.5"/><text x="152.0" y="431.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">як не платити</tspan></text>
<rect x="292.0" y="396.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="442.0" y="423.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="442.0" dy="0.0">класти незалежні дані</tspan><tspan x="442.0" dy="15.6">в різні сторінки</tspan></text>
<rect x="616.0" y="396.0" width="300.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="766.0" y="423.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="766.0" dy="0.0">класти незалежні дані</tspan><tspan x="766.0" dy="15.6">в різні лінії</tspan></text>
<rect x="34.0" y="488.0" width="872.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Одиниця стиснулася приблизно в шістнадцять разів, переїзд подешевшав на порядки — а останній рядок збігається слово в слово.</tspan></text>
