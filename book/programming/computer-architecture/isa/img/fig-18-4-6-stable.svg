<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436">
<rect width="900" height="436" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сила ISA — у сталості: один контракт, багато поколінь заліза</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки нові чипи чесно виконують ту саму ISA, старі програми працюють на них без змін — десятиліттями</text>
<rect x="130.0" y="86.0" width="180.0" height="44.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="220.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">програма 1995</text>
<line x1="220.0" y1="132.0" x2="220.0" y2="168.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="350.0" y="86.0" width="180.0" height="44.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="440.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">програма 2010</text>
<line x1="440.0" y1="132.0" x2="440.0" y2="168.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="570.0" y="86.0" width="180.0" height="44.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="660.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ваш код сьогодні</text>
<line x1="660.0" y1="132.0" x2="660.0" y2="168.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="120.0" y="172.0" width="660.0" height="60.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="450.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ISA (напр. x86 або ARM) — стабільний інтерфейс</text>
<text x="450.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама мова команд рік у рік</text>
<line x1="220.0" y1="234.0" x2="220.0" y2="270.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="130.0" y="272.0" width="180.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="220.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чип 1995</text>
<text x="220.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інше залізо всередині</text>
<line x1="440.0" y1="234.0" x2="440.0" y2="270.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="350.0" y="272.0" width="180.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="440.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чип 2010</text>
<text x="440.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інше залізо всередині</text>
<line x1="660.0" y1="234.0" x2="660.0" y2="270.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="570.0" y="272.0" width="180.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="660.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чип 2025</text>
<text x="660.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інше залізо всередині</text>
<rect x="60.0" y="338.0" width="780.0" height="78.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо під ISA вільно переробляють (швидше, економніше) — а софт цього навіть не помічає, бо мова команд та сама.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме тому процесори Intel 2025-го досі виконують команди, написані для 1980-х, а ARM-код працює на тисячах різних чипів.</text>
<text x="450.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ISA — це одна з найдовговічніших і найцінніших абстракцій в усій техніці: межа, що дала софту й залізу рости окремо.</text>
</svg>
