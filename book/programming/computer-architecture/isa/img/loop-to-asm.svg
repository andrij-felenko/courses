<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один цикл на C — і що з нього зробив компілятор двома мовами процесора</text>
<text x="480.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">та сама сума масиву; кожен рядок C розгортається в кілька машинних команд — і вони РІЗНІ для різних ISA</text>
<rect x="24.0" y="78.0" width="250.0" height="200.0" rx="12" fill="#fbfbff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="149.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="700">вихідний код (C)</text>
<text x="40.0" y="130.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">int sum = 0;</text>
<text x="40.0" y="156.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">for (int i = 0; i &lt; n; i++)</text>
<text x="40.0" y="182.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    sum += a[i];</text>
<text x="40.0" y="208.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">return sum;</text>
<rect x="38.0" y="142.0" width="222.0" height="20.0" rx="5" fill="none" stroke="#1f8a3b" stroke-width="1.3"/>
<rect x="38.0" y="168.0" width="222.0" height="20.0" rx="5" fill="none" stroke="#c0271e" stroke-width="1.3"/>
<text x="149.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">4 короткі рядки людською мовою</text>
<line x1="280" y1="150" x2="314" y2="150" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="297.0" y="142.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">gcc</text>
<line x1="280" y1="360" x2="314" y2="360" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="297.0" y="352.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">gcc</text>
<rect x="322.0" y="78.0" width="632.0" height="198.0" rx="12" fill="#f6fbf6" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="338.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="700">Xtensa  (ядро ESP32)</text>
<text x="940.0" y="100.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end">objdump -d</text>
<text x="336.0" y="124.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1f8a3b" text-anchor="start">  movi   a8, 0</text>
<text x="612.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; sum = 0  (поклади 0 у регістр)</text>
<text x="336.0" y="143.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#7a3fb0" text-anchor="start" font-weight="700">  blti   a3, 1, .Lend</text>
<text x="612.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; якщо n&lt;1 — одразу в кінець</text>
<text x="336.0" y="162.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#6b7280" text-anchor="start">.Lloop:</text>
<text x="612.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; — початок тіла циклу —</text>
<text x="336.0" y="181.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">  l32i   a9, a2, 0</text>
<text x="612.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; завантаж a[i] з пам'яті</text>
<text x="336.0" y="200.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="start" font-weight="700">  add.n  a8, a8, a9</text>
<text x="612.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; sum += a[i]</text>
<text x="336.0" y="219.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">  addi   a2, a2, 4</text>
<text x="612.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; крок покажчика на наступне слово</text>
<text x="336.0" y="238.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">  addi   a3, a3, -1</text>
<text x="612.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; лічильник n--</text>
<text x="336.0" y="257.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#7a3fb0" text-anchor="start" font-weight="700">  bnez   a3, .Lloop</text>
<text x="612.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; ще лишилось? — назад у .Lloop</text>
<rect x="322.0" y="288.0" width="632.0" height="198.0" rx="12" fill="#fff8f0" stroke="#e08030" stroke-width="1.8"/>
<text x="338.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08030" text-anchor="start" font-weight="700">RISC-V  (новіші ESP32-C, Pico 2…)</text>
<text x="940.0" y="310.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#6b7280" text-anchor="end">objdump -d</text>
<text x="336.0" y="334.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1f8a3b" text-anchor="start">  li     a5, 0</text>
<text x="612.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; sum = 0</text>
<text x="336.0" y="353.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#7a3fb0" text-anchor="start">  blez   a1, .Lend</text>
<text x="612.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; якщо n&lt;=0 — у кінець</text>
<text x="336.0" y="372.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#6b7280" text-anchor="start">.Lloop:</text>
<text x="612.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; — початок тіла циклу —</text>
<text x="336.0" y="391.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  lw     a4, 0(a0)</text>
<text x="612.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; завантаж a[i]</text>
<text x="336.0" y="410.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="start">  add    a5, a5, a4</text>
<text x="612.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; sum += a[i]</text>
<text x="336.0" y="429.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  addi   a0, a0, 4</text>
<text x="612.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; покажчик += 4 байти</text>
<text x="336.0" y="448.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  addi   a1, a1, -1</text>
<text x="612.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; n--</text>
<text x="336.0" y="467.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#7a3fb0" text-anchor="start">  bnez   a1, .Lloop</text>
<text x="612.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">; ще є — назад</text>
<rect x="24.0" y="296.0" width="250.0" height="150.0" rx="10" fill="#fafafa" stroke="#6b7280" stroke-width="1.4"/>
<text x="149.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">що видно одразу</text>
<text x="36.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• кожен рядок C → кілька команд</text>
<text x="36.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ідеї ті самі: load, add,</text>
<text x="36.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   крок покажчика, лічильник,</text>
<text x="36.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   умовний стрибок назад = ЦИКЛ</text>
<text x="36.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• мнемоніки й імена регістрів</text>
<text x="36.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   різні (a8 проти a5, l32i/lw)</text>
<text x="36.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• «sum += a[i]» — це 3 команди,</text>
<text x="36.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   а не одна</text>
</svg>