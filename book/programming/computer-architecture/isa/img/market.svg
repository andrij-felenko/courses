<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому відкрита ISA зрушила саме ринок мікроконтролерів</text>
<rect x="28.0" y="70.0" width="410.0" height="132.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="28.0" y="70.0" width="8.0" height="132.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0.0"/>
<text x="54.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f47b5" text-anchor="start" font-weight="700">Нуль роялті</text>
<text x="54.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">За саму мову не платять. У копійчаному МК, де кожен</text>
<text x="54.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">цент рахують, зекономлений роялті — це вже перевага</text>
<text x="54.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">в ціні.</text>
<rect x="462.0" y="70.0" width="410.0" height="132.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="462.0" y="70.0" width="8.0" height="132.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0.0"/>
<text x="488.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="start" font-weight="700">Своє ядро без дозволу</text>
<text x="488.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Виробник робить власний RISC-V-процесор сам, не</text>
<text x="488.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">питаючи власника ISA й не чекаючи його умов.</text>
<rect x="28.0" y="226.0" width="410.0" height="132.0" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="2.4"/>
<rect x="28.0" y="226.0" width="8.0" height="132.0" rx="0" fill="#b8860b" stroke="#b8860b" stroke-width="0.0"/>
<text x="54.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b8860b" text-anchor="start" font-weight="700">Спільні інструменти</text>
<text x="54.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Один компілятор, один асемблер, одна документація —</text>
<text x="54.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">для чипів різних фірм. Не треба городити власну мову</text>
<text x="54.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">з нуля.</text>
<rect x="462.0" y="226.0" width="410.0" height="132.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<rect x="462.0" y="226.0" width="8.0" height="132.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0.0"/>
<text x="488.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="700">Свобода від геополітики</text>
<text x="488.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Відкритий стандарт важче перекрити санкціями — тому</text>
<text x="488.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">2020-го його стандарт-орган переїхав у нейтральну</text>
<text x="488.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Швейцарію.</text>
</svg>