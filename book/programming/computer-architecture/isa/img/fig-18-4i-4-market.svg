<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому відкрита ISA зрушила саме ринок мікроконтролерів</text>
<rect x="28.0" y="70.0" width="410.0" height="132.0" rx="10" fill="#fff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="28.0" y="70.0" width="8.0" height="132.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="54.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Нуль роялті</text>
<text x="54.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">За саму мову не платять. У копійчаному МК, де кожен</text>
<text x="54.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">цент рахують, зекономлений роялті — це вже перевага</text>
<text x="54.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">в ціні.</text>
<rect x="462.0" y="70.0" width="410.0" height="132.0" rx="10" fill="#fff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="462.0" y="70.0" width="8.0" height="132.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="488.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Своє ядро без дозволу</text>
<text x="488.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Виробник робить власний RISC-V-процесор сам, не</text>
<text x="488.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">питаючи власника ISA й не чекаючи його умов.</text>
<rect x="28.0" y="226.0" width="410.0" height="132.0" rx="10" fill="#fff" stroke="#caa24a" stroke-width="2.4"/>
<rect x="28.0" y="226.0" width="8.0" height="132.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="54.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Спільні інструменти</text>
<text x="54.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Один компілятор, один асемблер, одна документація —</text>
<text x="54.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">для чипів різних фірм. Не треба городити власну мову</text>
<text x="54.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">з нуля.</text>
<rect x="462.0" y="226.0" width="410.0" height="132.0" rx="10" fill="#fff" stroke="#c0271e" stroke-width="2.4"/>
<rect x="462.0" y="226.0" width="8.0" height="132.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="488.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Свобода від геополітики</text>
<text x="488.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Відкритий стандарт важче перекрити санкціями — тому</text>
<text x="488.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2020-го його стандарт-орган переїхав у нейтральну</text>
<text x="488.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Швейцарію.</text>
</svg>
