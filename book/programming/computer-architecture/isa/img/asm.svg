<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме трьома мовами: асемблер, двійковий, шістнадцятковий</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">машина бачить ЧИСЛО; асемблер — лише читабельний для людини «правопис» того самого числа (один-в-один)</text>
<rect x="120.0" y="96.0" width="300.0" height="54.0" rx="10" fill="#fafafa" stroke="#b8860b" stroke-width="1.8"/>
<text x="270.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">асемблер (для людини)</text>
<text x="270.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADD R3, R1, R2</text>
<text x="434.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">мнемоніка — слово замість коду</text>
<rect x="120.0" y="166.0" width="300.0" height="54.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="270.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">машинний код (двійковий)</text>
<text x="270.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0001 0011 0001 0010</text>
<text x="434.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">те, що НАСПРАВДІ лежить у пам'яті</text>
<rect x="120.0" y="236.0" width="300.0" height="54.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="270.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">шістнадцятковий запис</text>
<text x="270.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x1312</text>
<text x="434.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">той самий машинний код, стисло</text>
<line x1="270.0" y1="150.0" x2="270.0" y2="166.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="270.0" y1="220.0" x2="270.0" y2="236.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="284.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">асемблер ↔ дизасемблер</text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асемблер один-в-один відповідає машинному коду. Як із вищих мов (C) народжується цей код — окрема велика тема.</text>
</svg>