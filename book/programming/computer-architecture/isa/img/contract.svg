<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Набір інструкцій (ISA) — мова-контракт між програмами й залізом</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">повний словник команд процесора плюс правило, як кожну закодувати числом</text>
<rect x="150.0" y="78.0" width="460.0" height="56.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/>
<text x="380.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="700">ПРОГРАМИ (софт)</text>
<text x="380.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">застосунки, ОС, ваш код — усе зрештою зводиться до інструкцій</text>
<line x1="380.0" y1="136.0" x2="380.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="476.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">говорять інструкціями</text>
<rect x="120.0" y="172.0" width="520.0" height="70.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="380.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="700">ISA — набір інструкцій</text>
<text x="380.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADD, LD, ST, JMP, CMP…  +  як саме кожна закодована в біти</text>
<text x="380.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">сталий контракт: софт пише такі команди, залізо вміє їх виконувати</text>
<line x1="380.0" y1="244.0" x2="380.0" y2="276.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="476.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">залізо виконує</text>
<rect x="150.0" y="280.0" width="460.0" height="56.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.0"/>
<text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="700">ЗАЛІЗО (процесор)</text>
<text x="380.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">транзистори, що декодують і виконують саме ці команди</text>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ISA — межа між «що робити» (софт) і «як це зроблено» (залізо): домовилися про мову — і обидві сторони вільні.</text>
</svg>