<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">RISC-V — праця багатьох рук, а не одне ім'я</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">точна атрибуція: хто заклав ідею RISC, хто зробив саму ISA, хто доніс її до залізного світу</text>
<rect x="30.0" y="96.0" width="200.0" height="250.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<circle cx="130.0" cy="148.0" r="16.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2.6"/>
<path d="M104.0,192 Q130.0,162 156.0,192" fill="none" stroke="#1f47b5" stroke-width="2.6"/>
<text x="130.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девід Паттерсон</text>
<text x="130.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ідея RISC (1980-ті) +</text>
<text x="130.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">директор Par Lab</text>
<text x="130.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle">заклав напрям; «дідусь»</text>
<text x="130.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle">лінії RISC у Берклі</text>
<line x1="224.7" y1="221.0" x2="248.7" y2="221.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="243.3" y="96.0" width="200.0" height="250.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<circle cx="343.3" cy="148.0" r="16.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<path d="M317.3,192 Q343.3,162 369.3,192" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="343.3" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крсте Асанович</text>
<text x="343.3" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">очолив проєкт RISC-V</text>
<text x="343.3" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(2010)</text>
<text x="343.3" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle">повів розробку нової</text>
<text x="343.3" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle">відкритої ISA</text>
<line x1="438.0" y1="221.0" x2="462.0" y2="221.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="456.7" y="96.0" width="200.0" height="250.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<circle cx="556.7" cy="148.0" r="16.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<path d="M530.7,192 Q556.7,162 582.7,192" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="556.7" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Е. Вотерман, Ю. Лі</text>
<text x="556.7" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">автори перших специфікацій</text>
<text x="556.7" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle">написали й виточили сам</text>
<text x="556.7" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle">набір команд</text>
<line x1="651.4" y1="221.0" x2="675.4" y2="221.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="670.0" y="96.0" width="200.0" height="250.0" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="2.4"/>
<circle cx="770.0" cy="148.0" r="16.0" fill="#ffffff" stroke="#b8860b" stroke-width="2.6"/>
<path d="M744.0,192 Q770.0,162 796.0,192" fill="none" stroke="#b8860b" stroke-width="2.6"/>
<text x="770.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільнота й SiFive</text>
<text x="770.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Foundation (2015) → Int'l</text>
<text x="770.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(2020)</text>
<text x="770.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">перетворили ISA на</text>
<text x="770.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">світовий стандарт</text>
<text x="450.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Велике в техніці майже завжди колективне — пам'ять лише зручно чіпляється за одне ім'я</text>
</svg>