</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме трьома мовами: асемблер, двійковий, шістнадцятковий</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">машина бачить ЧИСЛО; асемблер — це лише читабельний для людини «правопис» того самого числа (один-в-один)</text>
<rect x="120.0" y="96.0" width="280.0" height="54.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="260.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">асемблер (для людини)</text>
<text x="260.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ADD R3, R1, R2</text>
<text x="430.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">мнемоніка — слово замість коду</text>
<rect x="120.0" y="166.0" width="280.0" height="54.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="260.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">машинний код (двійковий)</text>
<text x="260.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0001 0011 0001 0010</text>
<text x="430.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">те, що НАСПРАВДІ лежить у пам'яті</text>
<rect x="120.0" y="236.0" width="280.0" height="54.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="260.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">шістнадцятковий запис</text>
<text x="260.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x1312</text>
<text x="430.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">той самий машинний код, стисло (§17.2)</text>
<line x1="260.0" y1="150.0" x2="260.0" y2="166.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="260.0" y1="220.0" x2="260.0" y2="236.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="285.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">асемблер перекладає →← дизасемблер</text>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Асемблер 1:1 відповідає машинному коду. Як із вищих мов (C) народжується цей код — окрема велика тема (Розділ 21).</text>
</svg>
