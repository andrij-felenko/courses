<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сила ISA — у сталості: один контракт, багато поколінь заліза</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">поки нові чипи чесно виконують ту саму ISA, старі програми працюють на них без змін — десятиліттями</text>
<rect x="120.0" y="80.0" width="160.0" height="42.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="200.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">програма 1995</text>
<line x1="200.0" y1="122.0" x2="200.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="80.0" width="160.0" height="42.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="400.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">програма 2010</text>
<line x1="400.0" y1="122.0" x2="400.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="80.0" width="160.0" height="42.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="600.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">ваш код сьогодні</text>
<line x1="600.0" y1="122.0" x2="600.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="160.0" width="580.0" height="58.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="390.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="700">ISA (напр. x86 або ARM) — стабільний інтерфейс</text>
<text x="390.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">та сама мова команд рік у рік</text>
<line x1="200.0" y1="218.0" x2="200.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="256.0" width="160.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="200.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">чип 1995</text>
<text x="200.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">інше залізо всередині</text>
<line x1="400.0" y1="218.0" x2="400.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="256.0" width="160.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="400.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">чип 2010</text>
<text x="400.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">інше залізо всередині</text>
<line x1="600.0" y1="218.0" x2="600.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="256.0" width="160.0" height="46.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="600.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">чип 2025</text>
<text x="600.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">інше залізо всередині</text>
<rect x="50.0" y="322.0" width="680.0" height="76.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="390.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залізо під ISA вільно переробляють (швидше, економніше) — а софт цього навіть не помічає, бо мова та сама.</text>
<text x="390.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Саме тому процесори Intel 2025-го досі виконують команди, написані для 1980-х, а ARM-код — на тисячах чипів.</text>
<text x="390.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ISA — одна з найдовговічніших абстракцій в усій техніці: межа, що дала софту й залізу рости окремо.</text>
</svg>