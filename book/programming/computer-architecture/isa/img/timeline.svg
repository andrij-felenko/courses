<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять поколінь RISC у Берклі — і вихід ISA у відкритий світ</text>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«V» — це і римська П'ЯТІРКА (п'яте покоління), і Vector, і Variations (варіанти-розширення)</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="666.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="250.0" cy="122.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1981</text>
<text x="274.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">RISC-I, RISC-II</text>
<text x="274.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Паттерсон зі студентами: прості команди — простий і швидкий кремній. Народження ідеї RISC</text>
<circle cx="250.0" cy="208.3" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="213.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1984</text>
<text x="274.0" y="204.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">SOAR (≈ «RISC-III»)</text>
<text x="274.0" y="224.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Наступний дослідницький чип лабораторії — лінія Берклі триває</text>
<circle cx="250.0" cy="294.7" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="299.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1988</text>
<text x="274.0" y="290.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">SPUR (≈ «RISC-IV»)</text>
<text x="274.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Четверте покоління; усе це — навчально-дослідні ISA, не для продажу</text>
<circle cx="250.0" cy="381.0" r="10.0" fill="#ffffff" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="381.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1.0"/>
<text x="228.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="700">2010</text>
<text x="274.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="700">RISC-V — старт у Par Lab</text>
<text x="274.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Асанович, Вотерман, Лі (дир. Паттерсон): чиста ISA з нуля, щоб НЕ платити за чужу мову</text>
<circle cx="250.0" cy="467.3" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="472.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2011</text>
<text x="274.0" y="463.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">перший том специфікації</text>
<text x="274.0" y="483.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Опубліковано опис базового набору — RISC-V виходить за межі однієї лабораторії</text>
<circle cx="250.0" cy="553.7" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="558.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2015</text>
<text x="274.0" y="549.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">RISC-V Foundation + SiFive</text>
<text x="274.0" y="569.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Стандарт віддали незалежній спільноті; трійця засновує першу RISC-V-компанію</text>
<circle cx="250.0" cy="640.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">донині</text>
<text x="274.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">у мільярдах чипів</text>
<text x="274.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Від крихітних МК (ESP32-C) до серверів — і все на ОДНІЙ відкритій, безплатній ISA</text>
</svg>