<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві моделі однієї й тієї самої речі — мови процесора (ISA)</text>
<rect x="40.0" y="70.0" width="380.0" height="360.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.4"/>
<text x="230.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="700">ЗАКРИТА (пропрієтарна) ISA</text>
<text x="230.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">власник тримає мову й бере плату</text>
<text x="64.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• належить одній фірмі (напр. ARM, x86)</text>
<text x="64.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• щоб робити чипи — купуєш ліцензію</text>
<text x="64.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• роялті: невеликий платіж із кожного</text>
<text x="64.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   проданого чипа</text>
<text x="64.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• не можна вільно додати свою команду</text>
<text x="64.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• порядок узгоджуєш із власником мови</text>
<rect x="204.0" y="322.0" width="52.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="2.6"/>
<path d="M214,322 v-14 a16,16 0 0 1 32,0 v14" fill="none" stroke="#c0271e" stroke-width="2.6"/>
<circle cx="230.0" cy="344.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1.0"/>
<text x="230.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="700">вхід — за гроші й дозволом</text>
<rect x="480.0" y="70.0" width="380.0" height="360.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="670.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="700">ВІДКРИТА ISA (RISC-V)</text>
<text x="670.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">мова — спільне надбання, без роялті</text>
<text x="504.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• специфікація вільна (ліцензія BSD-типу)</text>
<text x="504.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• робити чипи може будь-хто — без плати</text>
<text x="504.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• базовий набір «заморожено» — стабільний</text>
<text x="504.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• решта — модульні розширення (M, A, C, F…)</text>
<text x="504.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• стандарт веде незалежна спільнота</text>
<text x="504.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• можна додати власні команди під задачу</text>
<rect x="644.0" y="322.0" width="52.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<path d="M654,322 v-14 a16,16 0 0 1 32,0" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<circle cx="670.0" cy="344.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1.0"/>
<text x="670.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">вхід вільний для всіх</text>
</svg>