<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна апаратура — два різні обмани</text>
<rect x="40.0" y="56.0" width="350.0" height="250.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="215.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">MELTDOWN</text>
<text x="215.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">проламує МЕЖУ ПРИВІЛЕЇВ</text>
<text x="58.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="58.0" dy="0.0">Своя ж команда читає чужу</tspan><tspan x="58.0" dy="14.5">(ядрову) пам'ять. Заборона є,</tspan><tspan x="58.0" dy="14.5">але перевірка прав спізнюється —</tspan><tspan x="58.0" dy="14.5">виконання встигає скористатися</tspan><tspan x="58.0" dy="14.5">забороненим байтом наперед.</tspan></text>
<text x="58.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Обман: гонка «прочитав ⟷ заборонили».</text>
<text x="58.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Лік: розвести адреси ядра й програми</text>
<text x="58.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">(KPTI) — читати нема чого.</text>
<rect x="410.0" y="56.0" width="350.0" height="250.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="585.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">SPECTRE</text>
<text x="585.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">обманює ПЕРЕДБАЧЕННЯ ПЕРЕХОДІВ</text>
<text x="428.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="428.0" dy="0.0">Жертву намовляють саму</tspan><tspan x="428.0" dy="14.5">стрибнути «не туди»: наперед</tspan><tspan x="428.0" dy="14.5">натреновують передбачувач,</tspan><tspan x="428.0" dy="14.5">щоб вона спекулятивно прочитала</tspan><tspan x="428.0" dy="14.5">власну ж пам'ять поза межами.</tspan></text>
<text x="428.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Обман: отруєний передбачувач переходу.</text>
<text x="428.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Лік: точкові бар'єри в коді (lfence,</text>
<text x="428.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">retpoline) — важче, дорожче.</text>
<text x="400.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Спільне серце обох — слід у кеші від роботи, якої «не було».</text>
</svg>