<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Викинута робота стерта — а слід у кеші лишився</text>
<text x="40.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">У транзитному вікні (до перевірки прав):</text>
<circle cx="54.0" cy="106.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="54.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="100.0" y="90.5" width="670.0" height="31.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="435.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">читає байт із забороненої адреси → таємне значення  s</tspan></text>
<circle cx="54.0" cy="152.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="54.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<rect x="100.0" y="136.5" width="670.0" height="31.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="435.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">звертається до probe[s · 256] — підтягує цей рядок у кеш</tspan></text>
<circle cx="54.0" cy="198.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="54.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<rect x="100.0" y="182.5" width="670.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="435.0" y="201.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">апаратура помічає: доступу не було права → ВИНЯТОК</tspan></text>
<text x="40.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Виняток → усе транзитне ВИКИНУТО: регістри, результати — як не було.</text>
<text x="40.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Архітектурно машина чиста. Але крок 2 уже змінив КЕШ — і його не відкотили.</text>
<text x="40.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Тепер зловмисник міряє час доступу до кожного рядка probe[k · 256]:</text>
<rect x="46.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="85.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=0</text>
<text x="85.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="134.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="173.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=1</text>
<text x="173.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="222.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="261.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=2</text>
<text x="261.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="310.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="349.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=3</text>
<text x="349.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="398.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="437.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=4</text>
<text x="437.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="486.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="525.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">k=5</text>
<text x="525.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">швидко</text>
<rect x="574.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="613.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=6</text>
<text x="613.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<rect x="662.0" y="308.0" width="78.0" height="40.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="701.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">k=7</text>
<text x="701.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно</text>
<text x="525.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">↑ цей — у кеші</text>
<text x="525.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">отже s = 5</text>
</svg>