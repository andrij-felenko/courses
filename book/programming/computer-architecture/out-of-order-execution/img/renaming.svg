<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Несправжня залежність: імена стикаються, дані — ні</text>
<text x="40.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Як написано (обидві пишуть у R3):</text>
<rect x="65.0" y="93.5" width="250.0" height="33.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">A:  R3 ← R1 + R2</tspan></text>
<rect x="65.0" y="143.5" width="250.0" height="33.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">B:  R3 ← R5 · R6</tspan></text>
<line x1="190.0" y1="178.0" x2="190.0" y2="132.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">B нібито мусить</text>
<text x="205.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">чекати A —</text>
<text x="205.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">хоч даних не бере</text>
<text x="190.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Клас у клас — те саме ім'я R3.</text>
<text x="190.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Це не потік даних, а тіснота імен.</text>
<line x1="400.0" y1="150.0" x2="460.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">переймен.</text>
<text x="480.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Апаратура дає різні фізичні комірки:</text>
<rect x="495.0" y="93.5" width="230.0" height="33.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">A:  p37 ← R1 + R2</tspan></text>
<rect x="495.0" y="143.5" width="230.0" height="33.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">B:  p52 ← R5 · R6</tspan></text>
<text x="610.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">p37 і p52 — різні регістри.</text>
<text x="610.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Залежності нема — обидві</text>
<text x="610.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">йдуть одночасно.</text>
</svg>