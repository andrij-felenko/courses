<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада інструкцій FMA3 і порівняння з FMA4</text>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодування FMA в системі команд x86: тріада FMA3 проти FMA4</text>
<rect x="60.0" y="52.0" width="220.0" height="145.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="85.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">VFMADD132PS dst, s2, s3</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">dst = (dst × s3) + s2</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Цифри 1-3-2 означають:</tspan><tspan x="170.0" dy="14.3">Множимо 1-й (dst) на 3-й (s3)</tspan><tspan x="170.0" dy="14.3">Додаємо 2-й (s2)</tspan></text>
<rect x="300.0" y="52.0" width="220.0" height="145.0" rx="6" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/><text x="410.0" y="85.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">VFMADD213PS dst, s2, s3</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">dst = (s2 × dst) + s3</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">Цифри 2-1-3 означають:</tspan><tspan x="410.0" dy="14.3">Множимо 2-й (s2) на 1-й (dst)</tspan><tspan x="410.0" dy="14.3">Додаємо 3-й (s3)</tspan></text>
<rect x="540.0" y="52.0" width="220.0" height="145.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="85.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">VFMADD231PS dst, s2, s3</tspan><tspan x="650.0" dy="14.3"></tspan><tspan x="650.0" dy="14.3">dst = (s2 × s3) + dst</tspan><tspan x="650.0" dy="14.3"></tspan><tspan x="650.0" dy="14.3">Цифри 2-3-1 означають:</tspan><tspan x="650.0" dy="14.3">Множимо 2-й (s2) на 3-й (s3)</tspan><tspan x="650.0" dy="14.3">Додаємо 1-й (dst — акумулятор!)</tspan></text>
<rect x="60.0" y="217.0" width="700.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">FMA4 (AMD): 4 операнди (VFMADDPS dst, s1, s2, s3) — чисто, без перезапису, але вимагає довшого VEX/XOP кодування.</tspan><tspan x="410.0" dy="13.0">FMA3 (Intel / AMD Zen): 3 операнди з перезаписом dst — економить біти команди, ідеально для накопичувача.</tspan><tspan x="410.0" dy="13.0">Найчастіша інструкція в матричному множенні (GEMM) — VFMADD231: акумулятор тримає проміжну суму (dst),</tspan><tspan x="410.0" dy="13.0">а нові множники (s2, s3) безперервно підвантажуються з пам'яті чи векторних регістрів.</tspan></text>
</svg>