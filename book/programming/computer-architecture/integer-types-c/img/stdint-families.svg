<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">&lt;stdint.h&gt;: три родини на питання «скільки бітів»</text>
<rect x="40.0" y="66.0" width="208.0" height="168.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="144.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">int32_t</text>
<text x="144.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">РІВНО N бітів</text>
<text x="144.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">точна ширина на всіх</tspan><tspan x="144.0" dy="14.9">платформах, де є;</tspan><tspan x="144.0" dy="14.9">для протоколів і регістрів</tspan></text>
<rect x="256.0" y="66.0" width="208.0" height="168.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">int_least16_t</text>
<text x="360.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">≥ N, найменший</text>
<text x="360.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">щонайменше N бітів,</tspan><tspan x="360.0" dy="14.9">але якнайощадливіше</tspan><tspan x="360.0" dy="14.9">по пам'яті</tspan></text>
<rect x="472.0" y="66.0" width="208.0" height="168.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="576.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">int_fast16_t</text>
<text x="576.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">≥ N, найшвидший</text>
<text x="576.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="576.0" dy="0.0">щонайменше N бітів,</tspan><tspan x="576.0" dy="14.9">але найшвидший для ЦП</tspan><tspan x="576.0" dy="14.9">(часто ширший)</tspan></text>
<text x="360.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">приклад ARMv4: int_least16_t = 16 біт (ощадливо),  int_fast16_t = 32 біти (швидко)</text>
<text x="360.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усі — з &lt;stdint.h&gt; (C99); суфікс u дає беззнакові (uint32_t, uint_fast8_t)</text>
</svg>