<line x1="646.0" y1="177.0" x2="660.0" y2="177.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="440.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">послідовні float-значення (один крок ULP між сусідами)</text>
<text x="440.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ті самі біти, прочитані як 32-бітне ціле → рівно +1 на кожен крок</text>
<rect x="150.0" y="280.0" width="580.0" height="92.0" rx="12" fill="#f5f8ff" stroke="#1f47b5" stroke-width="1.7"/>
<text x="440.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ulpDiff = | bitsAsInt(a) − bitsAsInt(b) |</text>
<text x="440.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«рівні» ⇔ ulpDiff ≤ maxUlps  (типово 1…4 ULP)</text>
<text x="440.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">поріг у ULP сам масштабується разом із числом — окремий ε не потрібен</text>
<rect x="60.0" y="398.0" width="760.0" height="70.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="80.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Пастки ULP:</text>
<text x="80.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• знак: від'ємні float як ціле йдуть «навспак» — звести до знак-величини перед відніманням;</text>
<text x="80.0" y="460.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• різні знаки a,b і ±0 — окремий випадок; • NaN не «рівний» нічому; • потрібен union/memcpy без UB.</text>
</svg>
