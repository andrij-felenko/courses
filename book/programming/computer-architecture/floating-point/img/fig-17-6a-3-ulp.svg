<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ULP-порівняння: «за скільки представних чисел a відстоїть від b»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перетлумачуємо біти float як ціле — і сусідні числа стають сусідніми цілими (різниця = 1)</text>
<rect x="70.0" y="150.0" width="104.0" height="54.0" rx="9" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="122.0" y="173.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal">1.0000000</text>
