<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 382" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="382" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому float підступний: неточність і відносна точність</text>
<rect x="50.0" y="64.0" width="330.0" height="124.0" rx="6" fill="none" stroke="#c0392b" stroke-width="1.7"/>
<text x="215.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Пастка 1: неточність</text>
<text x="66.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">0.1 + 0.2 = 0.300000000000000044</text>
<text x="66.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">бо 0.1 у двійковій — нескінченний дріб</text>
<text x="66.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(як 1/3 у десятковій), тож зберігається</text>
<text x="66.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">з крихітною похибкою округлення.</text>
<rect x="400.0" y="64.0" width="310.0" height="124.0" rx="6" fill="none" stroke="#b9770e" stroke-width="1.7"/>
<text x="555.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Пастка 2: відносна точність</text>
<text x="416.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">крок між числами росте з величиною:</text>
<text x="416.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">біля 1 → крок ≈ 0.0000001</text>
<text x="416.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">біля мільйона → крок ≈ 0.06</text>
<text x="416.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">біля мільярда → крок &gt; 1 (!)</text>
<rect x="50.0" y="204.0" width="330.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="215.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок</text>
<text x="66.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1 000 000 000 + 1 = 1 000 000 000</text>
<text x="66.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(float32): доданок просто «зник»,</text>
<text x="66.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">бо 1 менше за крок на цій величині.</text>
<rect x="400.0" y="204.0" width="310.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="555.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Результати — не через ==</text>
<text x="416.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">погано:  if (x == 0.3)</text>
<text x="416.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">добре:   if (|x − 0.3| &lt; ε)</text>
<text x="416.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(для точних 0.0, цілих — == доречне)</text>
<rect x="60.0" y="326.0" width="620.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="370.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">float чудовий для діапазону, та оманливий для точності.</tspan></text>
</svg>