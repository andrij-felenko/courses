<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виграш: величезний динамічний діапазон</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">float32 покриває від ~10⁻³⁸ до ~10³⁸ — і крихітне, і астрономічне одним типом</text>
<line x1="110.0" y1="170.0" x2="800.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="164.0" x2="110.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="110.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10⁻³⁸</text>
<line x1="282.5" y1="164.0" x2="282.5" y2="176.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="282.5" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10⁻¹⁹</text>
<line x1="455.0" y1="164.0" x2="455.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="455.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<line x1="627.5" y1="164.0" x2="627.5" y2="176.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="627.5" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10¹⁹</text>
<line x1="800.0" y1="164.0" x2="800.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="800.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10³⁸</text>
<text x="110.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">крихітне ←</text>
<text x="800.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">→ величезне</text>
<rect x="400.5" y="210.0" width="108.9" height="24.0" rx="4" fill="#fbf6ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="455.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">фіксована кома —</text>
<text x="455.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лише вузьке вікно</text>
<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий float тримає і масу електрона, і відстань до зір. Це й є перевага плаваючої коми над фіксованою.</text>
