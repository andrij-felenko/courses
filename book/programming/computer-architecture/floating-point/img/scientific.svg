<text x="400.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">= 1.625 × 8 = 13</text>
<rect x="60.0" y="210.0" width="600.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="360.0" y="239.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Порядок рухає кому куди завгодно — звідси «плаваюча».</tspan><tspan x="360.0" dy="16.9">Мантиса несе значущі цифри (точність), порядок — масштаб (діапазон).</tspan></text>
