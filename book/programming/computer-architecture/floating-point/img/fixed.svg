<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 402" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="402" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що саме стандартизував IEEE 754</text>
<rect x="60.0" y="84.0" width="640.0" height="36.0" rx="6" fill="#f6f8f6" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Формати</text>
<text x="300.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">одинарна (32) і подвійна (64) точність — однакові скрізь</text>
<rect x="60.0" y="126.0" width="640.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Коректне округлення</text>
<text x="300.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">результат +−×÷ і √ — це точно округлене істинне значення</text>
<rect x="60.0" y="168.0" width="640.0" height="36.0" rx="6" fill="#f6f8f6" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Округлення до парного</text>
<text x="300.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">round-to-nearest-even за замовчуванням (без зсуву)</text>
<rect x="60.0" y="210.0" width="640.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Особливі значення</text>
<text x="300.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">±∞, NaN, ±0 — означені однозначно</text>
<rect x="60.0" y="252.0" width="640.0" height="36.0" rx="6" fill="#f6f8f6" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Поступове зникання</text>
<text x="300.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">денормалі: біля нуля числа «згасають» плавно</text>
<rect x="60.0" y="294.0" width="640.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="78.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Винятки/прапорці</text>
<text x="300.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ділення на 0, переповнення, неточність — сигналізуються</text>
<rect x="60.0" y="340.0" width="640.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="380.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Найреволюційніша — «коректне округлення»: воно зробило результат float однозначним.</tspan></text>
</svg>