<rect x="150.0" y="262.0" width="460.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="380.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ulpDiff = | bitsAsInt(a) − bitsAsInt(b) |</tspan><tspan x="380.0" dy="16.9">«рівні» ⇔ ulpDiff ≤ maxUlps (типово 1…4)</tspan><tspan x="380.0" dy="16.9">поріг у ULP сам масштабується — окремий ε не потрібен</tspan></text>
<rect x="50.0" y="366.0" width="660.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="66.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Пастки ULP:</text>
<text x="66.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• знак: від'ємні float як ціле йдуть «навспак» — різні знаки обробляємо окремо;</text>
<text x="66.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• NaN не «рівний» нічому (перевірка перша); ±0 — окремий випадок; біти — через memcpy/union.</text>
