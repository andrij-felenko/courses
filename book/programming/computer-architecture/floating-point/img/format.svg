<rect x="60.0" y="196.0" width="630.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="375.0" y="235.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">значення = (−1)ˢ × 1.мантиса × 2^(порядок − 127)</tspan><tspan x="375.0" dy="16.9">Старша 1 мантиси «мається на увазі» (1.xxxx) — даровий зайвий біт.</tspan><tspan x="375.0" dy="16.9">float32 ≈ 7 значущих цифр; float64 (1+11+52) ≈ 16 цифр.</tspan></text>
