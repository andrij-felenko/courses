<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Model Human Processor: перцептивний, когнітивний і моторний цикли</text>
<text x="540.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Model Human Processor (Card, Moran, Newell): конвеєр когнітивної обробки</text>
<rect x="60.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/>
<text x="190.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перцептивний процесор</text>
<text x="190.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Tp ≈ 100 мс [50–200 мс]</text>
<line x1="72.0" y1="160.0" x2="308.0" y2="160.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="74.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сенсорна зорова пам'ять</text>
<text x="74.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  (час згасання ≈ 200 мс)</text>
<text x="74.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кодування фізичного світла</text>
<text x="74.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  у нейронні образи</text>
<text x="74.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дискретизація вхідного потоку</text>
<rect x="410.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/>
<text x="540.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Когнітивний процесор</text>
<text x="540.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Tc ≈ 70 мс [25–170 мс]</text>
<line x1="422.0" y1="160.0" x2="658.0" y2="160.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="424.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Робоча пам'ять (7±2 фрагменти,</text>
<text x="424.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  час згасання ≈ 7–20 с)</text>
<text x="424.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Довгострокова пам'ять (LTM)</text>
<text x="424.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розпізнавання та прийняття рішень</text>
<text x="424.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зіставлення шаблонів</text>
<rect x="760.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.4"/>
<text x="890.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моторний процесор</text>
<text x="890.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Tm ≈ 70 мс [30–100 мс]</text>
<line x1="772.0" y1="160.0" x2="1008.0" y2="160.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="774.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Формування моторних команд</text>
<text x="774.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Активація м'язів кисті й пальців</text>
<text x="774.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фізичне натискання клавіші/миші</text>
<text x="774.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контроль траєкторії руху</text>
<line x1="320.0" y1="210.0" x2="410.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="365.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зорові образи</text>
<line x1="670.0" y1="210.0" x2="760.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="715.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">намір дії</text>
<line x1="890.0" y1="320.0" x2="890.0" y2="390.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,4"/>
<line x1="890.0" y1="390.0" x2="190.0" y2="390.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,4"/>
<line x1="190.0" y1="390.0" x2="190.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="365.0" width="280.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="393.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Зовнішній контур: Екран інтерфейсу</tspan><tspan x="540.0" dy="14.3">Цільовий відгук: ≤ 100 мс (T_sys ≤ Tp)</tspan></text>
<text x="540.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Якщо система повертає відгук за час T_sys ≤ Tp, мозок інтегрує реакцію в той самий цикл сприйняття</text>
</svg>