<text x="942.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">виграє</text>
<text x="942.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="942.5" dy="0.0">збій не тягне</tspan><tspan x="942.5" dy="15.6">за собою вікно</tspan></text>
<text x="942.5" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">платить</text>
<text x="942.5" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="942.5" dy="0.0">протокол: серіалізація,</tspan><tspan x="942.5" dy="15.6">таймаути, часткові</tspan><tspan x="942.5" dy="15.6">відмови</tspan></text>
