<text x="412.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">виграє</text>
<text x="412.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">межі даних немає,</tspan><tspan x="412.5" dy="15.6">замків теж немає</tspan></text>
<text x="412.5" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">платить</text>
<text x="412.5" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">загальний час росте,</tspan><tspan x="412.5" dy="15.6">світ міняється</tspan><tspan x="412.5" dy="15.6">між шматками</tspan></text>
<rect x="560.0" y="95.0" width="235.0" height="250.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
