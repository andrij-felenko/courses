<text x="545.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири щаблі розвантаження: від «не робити» до чужого процесу</text>
<rect x="30.0" y="95.0" width="235.0" height="250.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<rect x="42.0" y="108.0" width="211.0" height="54.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="147.5" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.5" dy="0.0">не робити</tspan><tspan x="147.5" dy="16.9">роботи</tspan></text>
<text x="147.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">виграє</text>
<text x="147.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">роботи немає зовсім —</tspan><tspan x="147.5" dy="15.6">найдешевша перемога</tspan></text>
<text x="147.5" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">платить</text>
<text x="147.5" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">треба глибше зрозуміти</tspan><tspan x="147.5" dy="15.6">саму задачу</tspan></text>
<rect x="295.0" y="95.0" width="235.0" height="250.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
