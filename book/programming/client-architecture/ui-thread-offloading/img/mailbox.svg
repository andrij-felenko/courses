<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди дівати роботу, що приходить швидше, ніж робиться</text>
<rect x="35.0" y="70.0" width="460.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="265.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">необмежена черга</text>
<text x="160.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">надходить 10 завдань/с</text>
<line x1="160.0" y1="132.0" x2="160.0" y2="152.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
