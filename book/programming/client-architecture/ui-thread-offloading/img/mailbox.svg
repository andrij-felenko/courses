<rect x="90.0" y="188.0" width="140.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="90.0" y="218.0" width="140.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="90.0" y="248.0" width="140.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="90.0" y="278.0" width="140.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="90.0" y="308.0" width="140.0" height="26.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="160.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">встигаємо 3/с</text>
<line x1="160.0" y1="336.0" x2="160.0" y2="342.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start"><tspan x="255.0" dy="0.0">черга росте</tspan><tspan x="255.0" dy="15.6">без межі, кожна</tspan><tspan x="255.0" dy="15.6">відповідь усе</tspan><tspan x="255.0" dy="15.6">старіша</tspan></text>
<rect x="525.0" y="70.0" width="460.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="755.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">скриня на одне місце</text>
<text x="655.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">надходить 10 завдань/с</text>
<line x1="655.0" y1="132.0" x2="655.0" y2="216.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="224.0" width="150.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="655.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">останнє завдання</text>
<line x1="738.0" y1="247.0" x2="790.0" y2="247.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="798.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="798.0" dy="0.0">старіші зникають</tspan><tspan x="798.0" dy="15.6">ще до роботи</tspan></text>
<line x1="655.0" y1="278.0" x2="655.0" y2="306.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="655.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">рахуємо лише останній</text>
<text x="510.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">коли надходження стабільно швидше за обслуговування, черга — це просто повільніше зависання</text>
