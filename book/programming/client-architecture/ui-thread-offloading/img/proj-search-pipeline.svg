<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного натиску: п'ять воріт і три виходи</text>
<rect x="70.0" y="52.0" width="320.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">потік інтерфейсу</tspan></text>
<rect x="670.0" y="52.0" width="320.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">фоновий потік</tspan></text>
<rect x="70.0" y="108.0" width="320.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">натиск клавіші</tspan></text>
<line x1="230.0" y1="152.0" x2="230.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="180.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ворота 1 · тиша 150 мс</tspan><tspan x="230.0" dy="16.2">новий знак переставляє таймер</tspan></text>
<line x1="230.0" y1="240.0" x2="230.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="268.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="293.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ворота 2 · скриня на одне місце</tspan><tspan x="230.0" dy="16.2">нестартоване завдання витісняється</tspan></text>
<line x1="230.0" y1="328.0" x2="230.0" y2="354.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="356.0" width="320.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ворота 3 · штамп покоління N</tspan></text>
<text x="640.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">завдання: текст, покоління N,</tspan><tspan x="640.0" dy="14.3">прапорець скасування</tspan></text>
<line x1="390.0" y1="377.0" x2="830.0" y2="377.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="830.0" y1="379.0" x2="830.0" y2="416.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="418.0" width="320.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">робітник бере зі скрині</tspan><tspan x="830.0" dy="16.2">лише останнє — старіші зникли</tspan></text>
<line x1="830.0" y1="472.0" x2="830.0" y2="496.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="498.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="522.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">ворота 4 · робочий цикл</tspan><tspan x="830.0" dy="16.2">кожні 512 записів — погляд у прапорець</tspan><tspan x="830.0" dy="16.2">побачив — виходить достроково</tspan></text>
<text x="640.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">маршалінг: одне з трьох закінчень</tspan><tspan x="640.0" dy="14.3">лягає в чергу потоку інтерфейсу</tspan></text>
<line x1="830.0" y1="572.0" x2="830.0" y2="622.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="830.0" y1="622.0" x2="230.0" y2="622.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="230.0" y1="624.0" x2="230.0" y2="648.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="650.0" width="320.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="230.0" y="675.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ворота 5 · адресат живий?</tspan><tspan x="230.0" dy="16.2">покоління = поточне?</tspan></text>
<rect x="60.0" y="736.0" width="300.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="764.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">показати результат</tspan></text>
<rect x="390.0" y="736.0" width="300.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="764.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">показати помилку</tspan></text>
<rect x="720.0" y="736.0" width="300.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="870.0" y="764.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">тихо вийти: скасовано</tspan></text>
<line x1="224.0" y1="710.0" x2="210.0" y2="734.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="238.0" y1="710.0" x2="540.0" y2="734.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="710.0" x2="870.0" y2="734.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="808.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ворота 1 і 2 бережуть процесор, ворота 3 і 5 — правильність, ворота 4 — і те, і те</text>
</svg>