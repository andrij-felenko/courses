<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектур: Онлайн-перший проти Офлайн-першого</text>
<rect x="30.0" y="45.0" width="365.0" height="295.0" rx="8" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Онлайн-перший підхід (Online-First)</text>
<text x="212.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Мережа як обов'язкова передумова дії</text>
<rect x="60.0" y="105.0" width="305.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="212.5" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Інтерфейс користувача (UI)</tspan><tspan x="212.5" dy="15.6">Клік / Ввід тексту</tspan></text>
<line x1="212.0" y1="150.0" x2="212.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="212.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">HTTP POST / Блокування</text>
<rect x="60.0" y="180.0" width="305.0" height="50.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Мережевий транспорт (RPC / REST)</tspan><tspan x="212.5" dy="15.6">Спінер очікування (Spinner)</tspan></text>
<line x1="212.0" y1="230.0" x2="212.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="260.0" width="305.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="212.5" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">База даних сервера</tspan><tspan x="212.5" dy="15.6">Єдине джерело правди</tspan></text>
<text x="212.5" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Збій мережі = зависання UI та втрата вводу</text>
<rect x="425.0" y="45.0" width="365.0" height="295.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="607.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Офлайн-перший підхід (Offline-First)</text>
<text x="607.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Локальна база — правда, мережа — транспорт</text>
<rect x="455.0" y="105.0" width="305.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="607.5" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Інтерфейс користувача (UI)</tspan><tspan x="607.5" dy="15.6">Миттєвий відгук (0 мс)</tspan></text>
<line x1="607.0" y1="150.0" x2="607.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="607.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Локальний запис (Транзакція)</text>
<rect x="455.0" y="180.0" width="305.0" height="50.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.5"/><text x="607.5" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Локальна БД (IndexedDB / SQLite)</tspan><tspan x="607.5" dy="15.6">+ Черга мутацій (Outbox Queue)</tspan></text>
<line x1="607.0" y1="230.0" x2="607.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="607.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронна реплікація</text>
<rect x="455.0" y="260.0" width="305.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="607.5" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Шлюз синхронізації та Серверна БД</tspan><tspan x="607.5" dy="15.6">Узгодження копій (Reconciliation)</tspan></text>
<text x="607.5" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Збій мережі = звичайна робота з локальною чергою</text>
</svg>