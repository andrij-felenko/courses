<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія вузлів: віртуальний об'єкт V8 проти системного DOM-вузла Blink/WebKit</text>
<rect x="50.0" y="70.0" width="420.0" height="460.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="260.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">VIRTUAL DOM NODE (VNode)</text>
<text x="260.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чистий об'єкт JavaScript у купі V8 (~80–120 байтів)</text>
<rect x="70.0" y="140.0" width="380.0" height="165.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="260.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Структура VNode (Plain Old JS Object):</tspan><tspan x="260.0" dy="15.0">• type: 'div' (рядковий тег або функція)</tspan><tspan x="260.0" dy="15.0">• key: 'item-42' (стабільний ідентифікатор)</tspan><tspan x="260.0" dy="15.0">• props: { className: 'card', onClick: fn }</tspan><tspan x="260.0" dy="15.0">• children: [ vnodeA, vnodeB ] (масив посилань)</tspan><tspan x="260.0" dy="15.0">• el: HTMLDivElement (посилання на DOM-вузол)</tspan><tspan x="260.0" dy="15.0">• flags: 1 (ShapeFlag: Element, Stateful)</tspan></text>
<rect x="70.0" y="325.0" width="380.0" height="185.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="392.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Властивості та ціна:</tspan><tspan x="260.0" dy="14.3">+ Швидка алокація в молодому поколінні V8 (~наносекунди)</tspan><tspan x="260.0" dy="14.3">+ Детермінованість і повна ізоляція від платформи</tspan><tspan x="260.0" dy="14.3">+ Читання та зміна полів не чіпають графічний конвеєр</tspan><tspan x="260.0" dy="14.3">+ Можливість рендерингу на сервері (SSR) чи у Worker</tspan></text>
<rect x="530.0" y="70.0" width="420.0" height="460.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="740.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">REAL DOM NODE (HTMLDivElement)</text>
<text x="740.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Системний об'єкт C++ у ядрі браузера (~1.5–4.0 КБ)</text>
<rect x="550.0" y="140.0" width="380.0" height="165.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="740.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Пов'язані структури ядра Blink / WebKit:</tspan><tspan x="740.0" dy="15.0">• Node / Element / EventTarget (ієрархія C++ класів)</tspan><tspan x="740.0" dy="15.0">• CSSComputedStyleDeclaration (дерево стилів)</tspan><tspan x="740.0" dy="15.0">• LayoutObject / LayoutBox (координати x, y, w, h)</tspan><tspan x="740.0" dy="15.0">• PaintLayer / CompositedLayer (шари для GPU)</tspan><tspan x="740.0" dy="15.0">• EventListenerMap (таблиця слухачів подій)</tspan><tspan x="740.0" dy="15.0">• V8 Wrapper / DOM Binding (міст між JS та C++)</tspan></text>
<rect x="550.0" y="325.0" width="380.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="392.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Графічний конвеєр при мутації:</tspan><tspan x="740.0" dy="14.3">− Recalculate Style: підбір CSS-селекторів для дерева</tspan><tspan x="740.0" dy="14.3">− Layout (Reflow): розрахунок геометрії та переносів</tspan><tspan x="740.0" dy="14.3">− Paint &amp; Composite: перемальовка та розбиття на тайли</tspan><tspan x="740.0" dy="14.3">− Ризик Layout Thrashing при чергуванні читань і записів</tspan></text>
<line x1="475.0" y1="220.0" x2="525.0" y2="220.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">el</text>
</svg>