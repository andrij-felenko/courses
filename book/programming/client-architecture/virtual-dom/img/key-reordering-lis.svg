<rect x="520.0" y="430.0" width="380.0" height="105.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ПЕРЕМІЩУВАНІ ВУЗЛИ (ПОЗА LIS):</tspan><tspan x="710.0" dy="11.7">• Вузол 'b' (oldIdx:1): перемістити перед 'g'</tspan><tspan x="710.0" dy="11.7">• Вузол 'g' (oldIdx:6): перемістити перед 'e'</tspan><tspan x="710.0" dy="11.7">• Рівно 2 точкові операції insertBefore замість повної перебудови!</tspan></text>
