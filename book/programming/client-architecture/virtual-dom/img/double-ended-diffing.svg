<text x="170.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">▲ oldStartIdx (0)</text>
<text x="590.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">▲ oldEndIdx (3)</text>
<rect x="60.0" y="270.0" width="880.0" height="120.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПОСЛІДОВНІСТЬ 4 ЕВРИСТИЧНИХ ПОРІВНЯНЬ НА КОЖНОМУ КРОЦІ ЦИКЛУ:</text>
<rect x="80.0" y="310.0" width="195.0" height="65.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="177.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. oldStart == newStart</text>
<text x="177.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Патч + StartIdx++</text>
