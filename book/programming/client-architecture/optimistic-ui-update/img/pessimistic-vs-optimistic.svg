<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Песимістичний та оптимістичний цикли оновлення інтерфейсу</text>
<rect x="40.0" y="60.0" width="470.0" height="410.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="275.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Песимістичне оновлення</text><text x="275.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">блокування та очікування мережі</text><rect x="95.0" y="134.5" width="360.0" height="33.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1. Клік користувача (намір)</tspan></text><line x1="275.0" y1="171.0" x2="275.0" y2="206.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="95.0" y="207.2" width="360.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">2. Блокування UI + спінер завантаження</tspan><tspan x="275.0" dy="15.6">(інтерфейс заморожено на 150–500 мс)</tspan></text><line x1="275.0" y1="261.0" x2="275.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="95.0" y="297.2" width="360.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">3. Відповідь сервера (HTTP 200 OK)</tspan><tspan x="275.0" dy="15.6">дані зафіксовано в базі</tspan></text><line x1="275.0" y1="351.0" x2="275.0" y2="386.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="95.0" y="387.2" width="360.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">4. Оновлення стану й розблокування UI</tspan><tspan x="275.0" dy="15.6">(відчутна затримка реакції)</tspan></text><rect x="550.0" y="60.0" width="470.0" height="410.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="785.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимістичне оновлення</text><text x="785.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">миттєва мутація з фоновим підтвердженням</text><rect x="605.0" y="134.5" width="360.0" height="33.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">1. Клік користувача (намір)</tspan></text><line x1="785.0" y1="171.0" x2="785.0" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="605.0" y="207.2" width="360.0" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">2. Миттєве оновлення UI (&lt;16 мс)</tspan><tspan x="785.0" dy="15.6">користувач одразу бачить результат дії</tspan></text><line x1="785.0" y1="261.0" x2="785.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="605.0" y="297.2" width="360.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">3. Фонові перегони мережі (In-Flight)</tspan><tspan x="785.0" dy="15.6">HTTP-запит виконується асинхронно</tspan></text><line x1="695.0" y1="351.0" x2="695.0" y2="386.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="875.0" y1="351.0" x2="875.0" y2="386.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600.0" y="393.4" width="180.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Успіх: тихе узгодження</tspan><tspan x="690.0" dy="14.3">(закріплення ID)</tspan></text><rect x="790.0" y="393.4" width="180.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Збій: відкат стану</tspan><tspan x="880.0" dy="14.3">(повідомлення)</tspan></text>
</svg>