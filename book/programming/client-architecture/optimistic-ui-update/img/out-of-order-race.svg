<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка відповідей мережі: застаріле перезаписування проти версіонування</text>
<rect x="40.0" y="60.0" width="475.0" height="420.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="277.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наївне перезаписування (Аномалія)</text><text x="277.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">застаріла відповідь ламає актуальний стан</text><line x1="97.5" y1="146.0" x2="457.5" y2="146.0" stroke="#333333" stroke-width="1.2"/><text x="107.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 0 мс</text><text x="277.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 100 мс</text><text x="447.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 500 мс</text><rect x="62.5" y="168.3" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">Дія 1 (t=0): Вмикач ON (повільна мережа, RTT=500 мс)</tspan><tspan x="277.5" dy="14.3">UI оптимістично: ON</tspan></text><rect x="62.5" y="248.3" width="430.0" height="45.3" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">Дія 2 (t=100): Вмикач OFF (швидка мережа, RTT=80 мс)</tspan><tspan x="277.5" dy="14.3">UI оптимістично: OFF</tspan></text><rect x="62.5" y="328.4" width="430.0" height="45.3" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="347.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">t = 180 мс: Прийшов ACK на Дію 2 -&gt; сервер повернув OFF</tspan><tspan x="277.5" dy="14.3">UI стан: OFF (правильно)</tspan></text><rect x="62.5" y="413.4" width="430.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="277.5" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">t = 500 мс: Прийшов ACK на Дію 1 -&gt; сервер повернув ON!</tspan><tspan x="277.5" dy="14.3">UI помилково стає ON (застарілий запис затер свіжий!)</tspan></text><rect x="545.0" y="60.0" width="475.0" height="420.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="782.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист версіями та чергою</text><text x="782.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">монотонні ревізії або скасування запитів</text><line x1="602.5" y1="146.0" x2="962.5" y2="146.0" stroke="#333333" stroke-width="1.2"/><text x="612.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 0 мс</text><text x="782.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 100 мс</text><text x="952.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 500 мс</text><rect x="567.5" y="168.3" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/><text x="782.5" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">Дія 1 (t=0): Запит seq=1 (AbortController #1)</tspan><tspan x="782.5" dy="14.3">UI оптимістично: ON (версія v1)</tspan></text><rect x="567.5" y="248.3" width="430.0" height="45.3" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="782.5" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">Дія 2 (t=100): Запит seq=2 -&gt; abort(#1) скасовує Запит 1</tspan><tspan x="782.5" dy="14.3">UI оптимістично: OFF (версія v2)</tspan></text><rect x="567.5" y="328.4" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="782.5" y="347.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">t = 180 мс: Прийшов ACK seq=2 -&gt; застосовано версію v2</tspan><tspan x="782.5" dy="14.3">UI стан: OFF (підтверджено)</tspan></text><rect x="567.5" y="413.4" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="782.5" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">t = 500 мс: Запит 1 або скасовано в сокеті, або проігноровано</tspan><tspan x="782.5" dy="14.3">бо seq=1 &lt; seq_latest(2). Стан лишається OFF!</tspan></text>
</svg>