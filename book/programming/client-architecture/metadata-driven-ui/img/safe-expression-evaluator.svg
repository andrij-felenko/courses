<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека виконання динамічної логіки: eval() проти Safe AST Interpreter</text>
<rect x="30.0" y="50.0" width="370.0" height="290.0" rx="8" fill="#fff7f7" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечний підхід: eval() / new Function()</text>
<rect x="50.0" y="95.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Рядок коду з сервера:</tspan><tspan x="215.0" dy="14.3">&quot;form.amount &gt; 1000 &amp;&amp; sendCookie()&quot;</tspan></text>
<line x1="215.0" y1="143.0" x2="215.0" y2="168.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="168.0" width="330.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Пряме виконання в JS VM</tspan><tspan x="215.0" dy="14.3">Доступ до window, document, fetch,</tspan><tspan x="215.0" dy="14.3">пам'яті процесу та системних API</tspan></text>
<line x1="215.0" y1="228.0" x2="215.0" y2="253.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="253.0" width="330.0" height="72.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">КАТАСТРОФА БЕЗПЕКИ</tspan><tspan x="215.0" dy="13.0">• Remote Code Execution (RCE) / XSS</tspan><tspan x="215.0" dy="13.0">• Викрадення сесійних токенів</tspan><tspan x="215.0" dy="13.0">• Блокування в App Store (Guideline 2.5.2)</tspan></text>
<rect x="440.0" y="50.0" width="370.0" height="290.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечний підхід: Sandboxed AST Interpreter</text>
<rect x="460.0" y="95.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Декларативне дерево правил (JSON AST):</tspan><tspan x="625.0" dy="14.3">{ op: '&gt;', left: { var: 'amount' }, right: 1000 }</tspan></text>
<line x1="625.0" y1="143.0" x2="660.0" y2="168.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="168.0" width="330.0" height="60.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Ізольований обчислювач операцій</tspan><tspan x="625.0" dy="14.3">Обмежена граматика (Turing-incomplete),</tspan><tspan x="625.0" dy="14.3">доступ лише до переданого стану форми</tspan></text>
<line x1="625.0" y1="228.0" x2="625.0" y2="253.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="253.0" width="330.0" height="72.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">ГАРАНТІЯ БЕЗПЕКИ</tspan><tspan x="625.0" dy="13.0">• Нульовий доступ до мережі та пам'яті</tspan><tspan x="625.0" dy="13.0">• Захист від нескінченних циклів</tspan><tspan x="625.0" dy="13.0">• Повна сумісність із правилами App Store</tspan></text>
</svg>