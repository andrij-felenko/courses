<text x="290.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Один спільний довготривалий TLS-канал на весь пристрій (apsd / GmsCore)</text>
<text x="290.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">Усі процеси застосунків заморожені в RAM. Модем спить у стані низької потужності (IDLE &lt; 1 мА)</text>
