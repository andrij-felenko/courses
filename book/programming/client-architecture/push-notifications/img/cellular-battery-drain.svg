<rect x="70.0" y="200.0" width="930.0" height="48.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="535.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">Наслідок: радіомодем практично не переходить у режим сну (IDLE).</tspan><tspan x="535.0" dy="15.6">Батарея смартфона ємністю 4000 мА·год розряджається за 3–5 годин фонового очікування.</tspan></text>
<rect x="30.0" y="300.0" width="1020.0" height="230.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="540.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0"></tspan></text>
