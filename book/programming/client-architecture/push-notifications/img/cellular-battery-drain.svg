<rect x="70.0" y="460.0" width="930.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="480.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">Виграш: модем прокидається лише за зовнішньою подією або рідкісним системним keep-alive (раз на 15–30 хв).</tspan><tspan x="535.0" dy="15.6">Автономність пристрою зростає до 24–48 годин без утрати миттєвої доставки сповіщень.</tspan></text>
