<text x="290.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Кожен застосунок тримає власний сокет і шле періодичний ping для обходу NAT</text>
<text x="290.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Модем переходить у стан високого споживання (200–500 мА) і тримає «хвіст» активності 10–15 с</text>
