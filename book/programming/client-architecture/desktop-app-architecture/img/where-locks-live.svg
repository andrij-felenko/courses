<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замки переїхали з даних на канали</text>
<rect x="40.0" y="76.0" width="300.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="190.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ПОТІК ІНТЕРФЕЙСУ</tspan><tspan x="190.0" dy="16.9">on_query_changed(): знімок + gen</tspan></text>
<rect x="384.0" y="76.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="534.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">м'ютекс Pool::m_</tspan><tspan x="534.0" dy="16.9">взято лише на push у чергу</tspan></text>
<line x1="340.0" y1="115.0" x2="376.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="728.0" y="76.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="878.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">ВИКОНАВЕЦЬ</tspan><tspan x="878.0" dy="16.9">grep() — робота ПОЗА замком</tspan></text>
<line x1="684.0" y1="115.0" x2="720.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="206.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="190.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ВИКОНАВЕЦЬ</tspan><tspan x="190.0" dy="16.9">ui_.post(результат, gen)</tspan></text>
<rect x="384.0" y="206.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="534.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">м'ютекс UiQueue::m_</tspan><tspan x="534.0" dy="16.9">взято лише на push у чергу</tspan></text>
<line x1="340.0" y1="245.0" x2="376.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="728.0" y="206.0" width="300.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="878.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">ПОТІК ІНТЕРФЕЙСУ</tspan><tspan x="878.0" dy="16.9">swap пачки, виклики ПОЗА замком</tspan></text>
<line x1="684.0" y1="245.0" x2="720.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="336.0" width="300.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="190.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ПОТІК ІНТЕРФЕЙСУ</tspan><tspan x="190.0" dy="16.9">звірив gen, зібрав нову версію</tspan></text>
<rect x="384.0" y="336.0" width="300.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/><text x="534.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">publish()</tspan><tspan x="534.0" dy="16.9">1 атомарний запис покажчика</tspan></text>
<line x1="340.0" y1="375.0" x2="376.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="728.0" y="336.0" width="300.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/><text x="878.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">МОДЕЛЬ І ВІДМАЛЬОВКА</tspan><tspan x="878.0" dy="16.9">замків: 0</tspan></text>
<line x1="684.0" y1="375.0" x2="720.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три властивості цих двох замків — і чому дедлок неможливий</text>
<rect x="40.0" y="502.0" width="300.0" height="44.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="2.0"/><text x="190.0" y="529.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">O(1) під замком</tspan></text>
<rect x="40.0" y="552.0" width="300.0" height="106.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="190.0" y="593.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Під замком — тільки push або swap черги.</tspan><tspan x="190.0" dy="15.6">Ні читання файлу, ні обчислення, ні</tspan><tspan x="190.0" dy="15.6">виклику чужого коду.</tspan></text>
<rect x="384.0" y="502.0" width="300.0" height="44.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="2.0"/><text x="534.0" y="529.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="534.0" dy="0.0">Робота — поза замком</tspan></text>
<rect x="384.0" y="552.0" width="300.0" height="106.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="534.0" y="592.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">job() і fn() викликають, уже віддавши</tspan><tspan x="534.0" dy="16.9">замок. Інакше потік тримав би замок</tspan><tspan x="534.0" dy="16.9">пули й брав замок черги.</tspan></text>
<rect x="728.0" y="502.0" width="300.0" height="44.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="2.0"/><text x="878.0" y="529.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="878.0" dy="0.0">Жодного вкладення</tspan></text>
<rect x="728.0" y="552.0" width="300.0" height="106.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="878.0" y="592.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">Ніхто ніколи не тримає обидва замки</tspan><tspan x="878.0" dy="16.9">одночасно. Цикл очікування вимагає</tspan><tspan x="878.0" dy="16.9">двох — тож його нема з чого скласти.</tspan></text>
<rect x="40.0" y="678.0" width="988.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="534.0" y="710.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">Замок на моделі тримали б десятки мілісекунд і в невизначеному порядку. Ці два — десятки наносекунд і поодинці.</tspan></text>
</svg>