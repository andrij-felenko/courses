<text x="530.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">застосує потік інтерфейсу</text>
<line x1="676.0" y1="470.0" x2="566.0" y2="470.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5"/>
<line x1="494.0" y1="470.0" x2="384.0" y2="470.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="530.0" cy="470.0" r="19.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="530.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="530.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">пряме чіпання віджетів</text>
<text x="530.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">чи стану — заборонено</text>
