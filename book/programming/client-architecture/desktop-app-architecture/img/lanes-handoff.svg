<line x1="210.0" y1="434.0" x2="210.0" y2="456.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="62.0" y="456.0" width="296.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="483.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Відмальовка кадру:</tspan><tspan x="210.0" dy="16.9">читає знімок стану</tspan></text>
