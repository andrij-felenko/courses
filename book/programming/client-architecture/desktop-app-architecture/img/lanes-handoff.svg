<rect x="702.0" y="330.0" width="296.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="850.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="850.0" dy="0.0">Не має ні віджетів,</tspan><tspan x="850.0" dy="16.9">ні доступу до стану</tspan></text>
<rect x="702.0" y="440.0" width="296.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="472.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Доповідає лише</tspan><tspan x="850.0" dy="16.9">подією в чергу</tspan></text>
<text x="530.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">завдання + копія входу</text>
<text x="530.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">+ ознака скасування</text>
<line x1="384.0" y1="258.0" x2="676.0" y2="258.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="676.0" y1="358.0" x2="384.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
