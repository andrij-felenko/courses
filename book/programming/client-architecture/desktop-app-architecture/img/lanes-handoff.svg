<rect x="702.0" y="130.0" width="296.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="162.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Виконавець:</tspan><tspan x="850.0" dy="16.9">диск · мережа · обчислення</tspan></text>
