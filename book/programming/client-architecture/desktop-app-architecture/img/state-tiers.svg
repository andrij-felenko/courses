<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="145.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Ярус і строк життя</text>
<text x="415.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Що там живе</text>
<text x="685.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Хто пише</text>
<text x="945.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Плутанина ярусів дає</text>
<rect x="40.0" y="90.0" width="210.0" height="130.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="145.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">ЕФЕМЕРНИЙ</tspan><tspan x="145.0" dy="16.9">живе, доки живе вікно</tspan></text>
<rect x="270.0" y="90.0" width="290.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="415.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">прокрутка, виділення,</tspan><tspan x="415.0" dy="16.9">наведення миші,</tspan><tspan x="415.0" dy="16.9">недонабраний текст</tspan></text>
<rect x="580.0" y="90.0" width="210.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">саме подання</tspan></text>
<rect x="810.0" y="90.0" width="270.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="945.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">потрапив у документ —</tspan><tspan x="945.0" dy="16.9">файл «змінюється»</tspan><tspan x="945.0" dy="16.9">від самого перегляду</tspan></text>
<rect x="40.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="145.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">СЕАНСОВИЙ</tspan><tspan x="145.0" dy="16.9">живе, доки живе процес</tspan></text>
<rect x="270.0" y="250.0" width="290.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="415.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">документ, стек скасування,</tspan><tspan x="415.0" dy="16.9">підключення, кеш</tspan></text>
<rect x="580.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">модель —</tspan><tspan x="685.0" dy="16.9">єдиний власник</tspan></text>
<rect x="810.0" y="250.0" width="270.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="945.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">правда осіла у віджеті —</tspan><tspan x="945.0" dy="16.9">дві копії розходяться</tspan></text>
<rect x="40.0" y="410.0" width="210.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="145.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">ТРИВКИЙ</tspan><tspan x="145.0" dy="16.9">переживає перезапуск</tspan></text>
<rect x="270.0" y="410.0" width="290.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="415.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">налаштування, файл на диску,</tspan><tspan x="415.0" dy="16.9">копія на сервері</tspan></text>
<rect x="580.0" y="410.0" width="210.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="685.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">виконавець:</tspan><tspan x="685.0" dy="16.9">це ввід-вивід</tspan></text>
<rect x="810.0" y="410.0" width="270.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="945.0" y="462.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">запис із потоку інтерфейсу —</tspan><tspan x="945.0" dy="16.9">заморозка на кожному</tspan><tspan x="945.0" dy="16.9">збереженні</tspan></text>
</svg>