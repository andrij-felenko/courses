<rect width="100%" height="100%" fill="#ffffff"/>
<text x="540.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл стану при відновленні: Канонічні дані vs Стан взаємодії (Сесія)</text><rect x="40.0" y="60.0" width="480.0" height="390.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="280.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Канонічний стан (Документ)</text><rect x="80.0" y="106.3" width="400.0" height="45.3" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Дерево вузлів / параграфів</tspan><tspan x="280.0" dy="14.3">Текстовий зміст, розмітка, атрибути</tspan></text><rect x="80.0" y="164.3" width="400.0" height="45.3" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Графічні об'єкти та шари</tspan><tspan x="280.0" dy="14.3">Векторні криві, координати, палітри</tspan></text><rect x="80.0" y="222.3" width="400.0" height="45.3" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Таблиці та схеми</tspan><tspan x="280.0" dy="14.3">Зв'язки сутностей, формули комірок</tspan></text><rect x="80.0" y="280.4" width="400.0" height="45.3" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="299.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Історія версій / лог змін</tspan><tspan x="280.0" dy="14.3">Незмінні комбінації дій</tspan></text><text x="280.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="280.0" dy="0.0">Зберігається у doc.snap + doc.wal.</tspan><tspan x="280.0" dy="15.6">Сувора валідація схем і контрольних сум.</tspan><tspan x="280.0" dy="15.6">Джерело істини для експорту та синхронізації.</tspan></text><rect x="560.0" y="60.0" width="480.0" height="390.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="800.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Стан робочої сесії (UI Context)</text><rect x="600.0" y="106.3" width="400.0" height="45.3" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Позиція курсору та виділення</tspan><tspan x="800.0" dy="14.3">Рядок, колонка, активний діапазон символів</tspan></text><rect x="600.0" y="164.3" width="400.0" height="45.3" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Зсув прокрутки (Scroll Offset)</tspan><tspan x="800.0" dy="14.3">Поточні координати X/Y вікна перегляду</tspan></text><rect x="600.0" y="222.3" width="400.0" height="45.3" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Відкриті панелі та масштаб</tspan><tspan x="800.0" dy="14.3">Дерево відкритих вкладок, Zoom 125%</tspan></text><rect x="600.0" y="280.4" width="400.0" height="45.3" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="299.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Черга відправки (Outbox)</tspan><tspan x="800.0" dy="14.3">Локальні мутації, що чекають на мережу</tspan></text><text x="800.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">Зберігається окремо (session.json / localStorage).</tspan><tspan x="800.0" dy="15.6">Якщо пошкоджено — скидається до значень за замовчуванням.</tspan><tspan x="800.0" dy="15.6">Відновлює відчуття неперервності роботи людини.</tspan></text>
