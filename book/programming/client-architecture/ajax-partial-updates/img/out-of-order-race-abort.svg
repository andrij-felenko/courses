<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка відповідей фонових запитів: аномалія перезаписування та захист AbortController</text>
<rect x="40.0" y="55.0" width="475.0" height="430.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="277.5" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аномалія неупорядкованих відповідей</text><text x="277.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">повільний старий запит затирає новий</text><line x1="97.5" y1="141.0" x2="457.5" y2="141.0" stroke="#333333" stroke-width="1.2"/><text x="107.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 0 мс</text><text x="277.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 150 мс</text><text x="447.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 600 мс</text><rect x="62.5" y="163.3" width="430.0" height="45.3" rx="6" fill="#f4f8fb" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">Введення «ca» (t=0): Запит #1 вирушає</tspan><tspan x="277.5" dy="14.3">(затримка мережі RTT = 600 мс)</tspan></text><rect x="62.5" y="243.3" width="430.0" height="45.3" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">Введення «cat» (t=150): Запит #2 вирушає</tspan><tspan x="277.5" dy="14.3">(швидка відповідь RTT = 120 мс)</tspan></text><rect x="62.5" y="323.4" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="277.5" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, 