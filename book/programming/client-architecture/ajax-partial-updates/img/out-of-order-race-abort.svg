я «ca» (t=0): Запит req_id=1</tspan><tspan x="782.5" dy="14.3">Створено AbortController #1</tspan></text><rect x="567.5" y="243.3" width="430.0" height="45.3" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="782.5" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">Введення «cat» (t=150): Запит req_id=2</tspan><tspan x="782.5" dy="14.3">controller1.abort() -&gt; обриває Запит #1 у мережі</tspan></text><rect x="567.5" y="323.4" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="782.5" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">t = 270 мс: Відповідь req_id=2 застосовано</tspan><tspan x="782.5" dy="14.3">UI показує вичерпні результати для «cat»</tspan></text><rect x="567.5" y="413.4" width="430.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="782.5" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">t = 600 мс: Відповідь #1 викидає AbortError</tspan><tspan x="782.5" dy="14.3">або відхиляється перевіркою (req_id=1 &lt; latest=2)</tspan></text>
