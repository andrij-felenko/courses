<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повне перезавантаження проти фонового часткового оновлення DOM</text>
<rect x="40.0" y="55.0" width="470.0" height="430.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="275.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повне перезавантаження сторінки</text><text x="275.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">скидання стану й повторний парсинг</text><rect x="90.0" y="130.0" width="370.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1. Клік користувача (перехід/форма)</tspan></text><line x1="275.0" y1="166.0" x2="275.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="90.0" y="203.3" width="370.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">2. Знищення DOM, зупинка JS-таймерів,</tspan><tspan x="275.0" dy="14.3">білий спалах (White Flash), втрата фокусу</tspan></text><line x1="275.0" y1="256.0" x2="275.0" y2="286.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="90.0" y="293.4" width="370.0" height="45.3" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="275.0" y="312.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">3. Отримання повного HTML-документа,</tspan><tspan x="275.0" dy="14.3">повторне завантаження CSS, шрифтів і JS</tspan></text><line x1="275.0" y1="346.0" x2="275.0" y2="376.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="90.0" y="383.4" width="370.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="402.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">4. Повний конвеєр: Parse -&gt; Layout -&gt; Paint</tspan><tspan x="275.0" dy="14.3">Скидання позиції прокрутки (Scroll loss)</tspan></text><rect x="550.0" y="55.0" width="470.0" height="430.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="785.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фоновий запит і часткове оновлення</text><text x="785.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">точкова мутація зі збереженням контексту</text><rect x="600.0" y="130.0" width="370.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">1. Подія введення або клік у віджеті</tspan></text><line x1="785.0" y1="166.0" x2="785.0" y2="196.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600.0" y="203.3" width="370.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">2. Неблоківний фоновий транспорт (Fetch/SSE)</tspan><tspan x="785.0" dy="14.3">UI активний: фокус у полі, скрол на місці</tspan></text><line x1="785.0" y1="256.0" x2="785.0" y2="286.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600.0" y="293.4" width="370.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="312.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">3. Передавання лише дельти (JSON / HTML-фрагмент)</tspan><tspan x="785.0" dy="14.3">Мінімальний мережевий трафік (RTT)</tspan></text><line x1="785.0" y1="346.0" x2="785.0" y2="376.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600.0" y="383.4" width="370.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="785.0" y="402.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">4. Локальна заміна вузла DOM (Morphing / Patch)</tspan><tspan x="785.0" dy="14.3">Анімації тривають, стан сесії не втрачається</tspan></text>
</svg>