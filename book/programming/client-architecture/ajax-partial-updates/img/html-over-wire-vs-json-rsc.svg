<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектури часткового оновлення: JSON API, HTML-over-the-wire та RSC</text>
<rect x="40.0" y="55.0" width="310.0" height="420.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="195.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">JSON API (Клієнтський SPA)</text><text x="195.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дані окремо від розмітки</text><rect x="60.0" y="123.3" width="270.0" height="45.3" rx="6" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Сервер віддає сирий JSON:</tspan><tspan x="195.0" dy="14.3">`{ id: 42, title: 'Item' }`</tspan></text><line x1="195.0" y1="181.0" x2="195.0" y2="221.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="60.0" y="228.3" width="270.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Клієнт завантажує JS-шаблонізатор,</tspan><tspan x="195.0" dy="14.3">компоненти й Virtual DOM (~50–300 КБ)</tspan></text><line x1="195.0" y1="286.0" x2="195.0" y2="326.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="60.0" y="336.2" width="270.0" height="59.6" rx="6" fill="#f4f8fb" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Парсинг JSON -&gt; Diff VDOM -&gt;</tspan><tspan x="195.0" dy="14.3">генерація DOM-вузлів у браузері</tspan><tspan x="195.0" dy="14.3">(навантаження на процесор клієнта)</tspan></text><rect x="375.0" y="55.0" width="310.0" height="420.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="530.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">HTML-over-the-wire</text><text x="530.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">HTMX, Hotwire Turbo</text><rect x="395.0" y="123.3" width="270.0" height="45.3" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="530.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Сервер генерує готовий фрагмент:</tspan><tspan x="530.0" dy="14.3">`&lt;div id='todo-42'&gt;...&lt;/div&gt;`</tspan></text><line x1="530.0" y1="181.0" x2="530.0" y2="221.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="395.0" y="228.3" width="270.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Мінімальний клієнтський рантайм</tspan><tspan x="530.0" dy="14.3">(10–15 КБ без важких SPA-фреймворків)</tspan></text><line x1="530.0" y1="286.0" x2="530.0" y2="326.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="395.0" y="336.2" width="270.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Пряма підміна (DOM Morphing):</tspan><tspan x="530.0" dy="14.3">елемент замінюється на льоту,</tspan><tspan x="530.0" dy="14.3">стан іншого дерева не чіпається</tspan></text><rect x="710.0" y="55.0" width="310.0" height="420.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="865.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">React Server Components</text><text x="865.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">потоковий граф віртуальних вузлів</text><rect x="730.0" y="123.3" width="270.0" height="45.3" rx="6" fill="#fbf4fd" stroke="#8e44ad" stroke-width="1.5"/><text x="865.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Сервер рендерить компоненти й</tspan><tspan x="865.0" dy="14.3">стрімить RSC wire format (рядки JSON)</tspan></text><line x1="865.0" y1="181.0" x2="865.0" y2="221.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="730.0" y="228.3" width="270.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Код серверних компонентів НЕ летить</tspan><tspan x="865.0" dy="14.3">у бандл браузера (економія пам'яті)</tspan></text><line x1="865.0" y1="286.0" x2="865.0" y2="326.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="730.0" y="336.2" width="270.0" height="59.6" rx="6" fill="#f4f8fb" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Потокова реконсиляція графа:</tspan><tspan x="865.0" dy="14.3">вбудовування частин у клієнтський VDOM</tspan><tspan x="865.0" dy="14.3">зі збереженням стану клієнтських кнопок</tspan></text>
</svg>