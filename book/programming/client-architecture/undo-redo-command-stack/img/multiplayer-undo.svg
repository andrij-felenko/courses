<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли документ спільний, «останній крок» перестає бути моїм</text>
<rect x="210.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#f7f9fb" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">моя дія 1</tspan></text><rect x="440.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#f7f9fb" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">чужа дія</tspan></text><line x1="392.0" y1="78.0" x2="438.0" y2="78.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="670.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#f7f9fb" stroke="#2457d6" stroke-width="1.5"/><text x="760.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">моя дія 2</tspan></text><line x1="622.0" y1="78.0" x2="668.0" y2="78.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільний документ:</text><rect x="30.0" y="150.0" width="540.0" height="330.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один стек на документ</text><rect x="70.0" y="218.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="300.0" y="253.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Ctrl+Z знімає верхівку спільного стека</tspan></text><rect x="70.0" y="302.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="300.0" y="337.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">а верхівка — «моя дія 2»… доки сусід не додав свою</tspan></text><text x="300.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="300.0" dy="0.0">мій Ctrl+Z відкочує ЧУЖУ зміну —</tspan><tspan x="300.0" dy="16.9">людина скасовує те, чого не робила</tspan></text><rect x="610.0" y="150.0" width="540.0" height="330.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="880.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Свій стек у кожного клієнта</text><rect x="650.0" y="218.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="253.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ctrl+Z шукає МОЮ останню дію</tspan></text><rect x="650.0" y="302.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="337.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">її відкат мусить пройти крізь чужі зміни, що лягли пізніше</tspan></text><text x="880.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="880.0" dy="0.0">відкат переписується під новий стан —</tspan><tspan x="880.0" dy="16.9">це вже вибіркове скасування, не стопка</tspan></text>
</svg>