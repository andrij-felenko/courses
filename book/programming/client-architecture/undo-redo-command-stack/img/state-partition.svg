<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не весь стан клієнта відкочується — і це рішення архітектора</text>
<text x="320.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">частина стану клієнта</text><text x="880.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">що з нею робить скасування</text><rect x="40.0" y="76.0" width="560.0" height="106.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Документ</tspan><tspan x="320.0" dy="18.2">те, що людина створює: текст, фігури, зв'язки</tspan></text><line x1="608.0" y1="129.0" x2="644.0" y2="129.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="652.0" y="76.0" width="470.0" height="106.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="887.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">лежить у кроці історії</tspan><tspan x="887.0" dy="16.9">і повертається дослівно</tspan></text><rect x="40.0" y="204.0" width="560.0" height="106.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Похідне</tspan><tspan x="320.0" dy="18.2">те, що обчислюється: підсумки, індекси, розкладка</tspan></text><line x1="608.0" y1="257.0" x2="644.0" y2="257.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="652.0" y="204.0" width="470.0" height="106.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="887.0" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">в історії НЕ лежить —</tspan><tspan x="887.0" dy="16.9">перераховується після відкату</tspan></text><rect x="40.0" y="332.0" width="560.0" height="106.0" rx="6" fill="#fdf3e6" stroke="#c07a1e" stroke-width="1.5"/><text x="320.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Подання й увага</tspan><tspan x="320.0" dy="18.2">курсор, виділення, прокрутка, фокус</tspan></text><line x1="608.0" y1="385.0" x2="644.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="652.0" y="332.0" width="470.0" height="106.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="887.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">у кроці лежить те, що каже</tspan><tspan x="887.0" dy="16.9">«дивись сюди»; решта — ні</tspan></text>
</svg>