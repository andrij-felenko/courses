<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова неблокувального кільцевого буфера SPSC (Lock-Free)</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Окремі кеш-лінії по 64 байти усувають False Sharing між ядрами процесора</text>
<rect x="30.0" y="80.0" width="245.0" height="245.0" rx="8" fill="#f8faff" stroke="#2457d6" stroke-width="1.8"/>
<text x="152.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Кеш-лінія Виробника (64 B)</text>
<text x="152.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">alignas(64) • Ядро CPU 0</text>
<rect x="45.0" y="140.0" width="215.0" height="48.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="152.5" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="152.5" dy="0.0">atomic&lt;size_t&gt; tail</tspan><tspan x="152.5" dy="13.7">Індекс запису (мутує)</tspan></text>
<rect x="45.0" y="205.0" width="215.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="152.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">size_t cached_head</tspan><tspan x="152.5" dy="13.0">Локальна копія head (кеш)</tspan></text>
<text x="152.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Оновлює tail через release</text>
<text x="152.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Читає head лише коли буфер повний</text>
<rect x="305.0" y="80.0" width="290.0" height="245.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Кільцевий масив слотів</text>
<text x="450.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">T buffer[N] • N = 2^k (побітова маска)</text>
<rect x="325.0" y="145.0" width="115.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="382.5" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="382.5" dy="0.0">Slot 0</tspan><tspan x="382.5" dy="12.3">Вільно</tspan></text>
<rect x="450.0" y="145.0" width="115.0" height="36.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="507.5" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">Slot 1</tspan><tspan x="507.5" dy="12.3">Дані</tspan></text>
<rect x="325.0" y="190.0" width="115.0" height="36.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="382.5" y="205.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="382.5" dy="0.0">Slot 2</tspan><tspan x="382.5" dy="12.3">Дані</tspan></text>
<rect x="450.0" y="190.0" width="115.0" height="36.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="507.5" y="205.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">Slot 3</tspan><tspan x="507.5" dy="12.3">Дані</tspan></text>
<rect x="325.0" y="235.0" width="115.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="382.5" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="382.5" dy="0.0">Slot 4</tspan><tspan x="382.5" dy="12.3">Вільно</tspan></text>
<rect x="450.0" y="235.0" width="115.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="507.5" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">Slot 5</tspan><tspan x="507.5" dy="12.3">Вільно</tspan></text>
<text x="450.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Індексація: i = tail &amp; (N - 1)</text>
<rect x="625.0" y="80.0" width="245.0" height="245.0" rx="8" fill="#fffaf5" stroke="#d35400" stroke-width="1.8"/>
<text x="747.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Кеш-лінія Споживача (64 B)</text>
<text x="747.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">alignas(64) • Ядро CPU 1</text>
<rect x="640.0" y="140.0" width="215.0" height="48.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="747.5" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle"><tspan x="747.5" dy="0.0">atomic&lt;size_t&gt; head</tspan><tspan x="747.5" dy="13.7">Індекс читання (мутує)</tspan></text>
<rect x="640.0" y="205.0" width="215.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="747.5" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="747.5" dy="0.0">size_t cached_tail</tspan><tspan x="747.5" dy="13.0">Локальна копія tail (кеш)</tspan></text>
<text x="747.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Оновлює head через release</text>
<text x="747.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Читає tail лише коли буфер порожній</text>
<line x1="275.0" y1="164.0" x2="303.0" y2="164.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623.0" y1="164.0" x2="597.0" y2="164.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="355.0" width="840.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Кожне ядро пише лише у власну кеш-лінію — це виключає cache line bouncing за протоколом MESI.</tspan><tspan x="450.0" dy="14.3">Локальне кешування чужого індексу зводить дорогі між'ядерні атомарні читання до абсолютного мінімуму.</tspan></text>
</svg>