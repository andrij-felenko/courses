<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="34.5" y="116.2" width="191.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">тік або vTaskDelay</tspan><tspan x="130.0" dy="15.6">→ керування планувальнику</tspan></text>
<text x="130.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1. ПРИВІД</text>
<rect x="265.0" y="116.2" width="190.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="360.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">регістри+PC задачі A</tspan><tspan x="360.0" dy="15.6">на ЇЇ стек; SP → TCB</tspan></text>
<text x="360.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">2. ЗБЕРЕГТИ</text>
<rect x="495.0" y="116.2" width="190.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="590.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">SP задачі B з TCB;</tspan><tspan x="590.0" dy="15.6">регістри+PC зі стека B</tspan></text>
<text x="590.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">3. ВІДНОВИТИ</text>
<line x1="225.0" y1="140.0" x2="265.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="455.0" y1="140.0" x2="495.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SP — єдина «ручка» до всього збереженого контексту</text>
<text x="360.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">задача B відновлюється точно туди, де її спинили</text>
</svg>