<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="70.0" y1="250.0" x2="670.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="670.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">час</text>
<text x="62.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">A (висока)</text>
<text x="62.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">B (низька)</text>
<rect x="70.0" y="162.0" width="120.0" height="26.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">B біжить</text>
<rect x="190.0" y="82.0" width="160.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">A витісняє — біжить</text>
<line x1="190.0" y1="150.0" x2="190.0" y2="100.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="192.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">прокинулась A → B геть</text>
<rect x="350.0" y="162.0" width="160.0" height="26.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">B знову біжить</text>
<line x1="350.0" y1="100.0" x2="350.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="352.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">A заснула → B назад</text>
</svg>