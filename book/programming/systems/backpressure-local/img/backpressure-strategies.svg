<rect x="720.0" y="383.0" width="186.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="813.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="813.0" dy="0.0">Властивість:</tspan><tspan x="813.0" dy="12.3">Повна відсутність черг;</tspan><tspan x="813.0" dy="12.3">нульовий ризик OOM,</tspan><tspan x="813.0" dy="12.3">зворотне керування потоком</tspan></text>
