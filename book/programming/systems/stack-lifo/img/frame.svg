<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що кладе на стек один виклик: кадр</text>
<rect x="60.0" y="64.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="76.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">адреса повернення</text>
<text x="76.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">куди продовжити того, хто викликав → у PC при return</text>
<rect x="60.0" y="128.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="76.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">збережені регістри</text>
<text x="76.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">значення, які треба відновити після виклику</text>
<rect x="60.0" y="192.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="76.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">параметри</text>
<text x="76.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">аргументи функції</text>
<rect x="60.0" y="256.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.8"/>
<text x="76.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">локальні змінні</text>
<text x="76.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">власні змінні функції</text>
<line x1="438.0" y1="64.0" x2="438.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="450.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">один</text>
<text x="450.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">кадр</text>
<rect x="508.0" y="90.0" width="168.0" height="50.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="592.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вхід → push</text>
<text x="592.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">кадр ліг на стек</text>
<rect x="508.0" y="156.0" width="168.0" height="50.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="592.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вихід → pop</text>
<text x="592.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">пам'ять умить вільна</text>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">локальні «автоматичні»: з'являються при вході, зникають при виході — без ручного керування</text>
</svg>