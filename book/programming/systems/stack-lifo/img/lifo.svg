<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лише вершина — ні пошуку, ні доступу до середини; тому стек блискавично швидкий</text>
