<rect x="300.0" y="212.0" width="180.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="390.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">потім f</text>
<line x1="240.0" y1="234.0" x2="294.0" y2="234.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="212.0" width="180.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="610.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">потім main</text>
