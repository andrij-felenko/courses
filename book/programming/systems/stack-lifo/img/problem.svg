<text x="175.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">адреса повернення + локальні</text>
<rect x="250.0" y="70.0" width="230.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="365.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">f()</text>
<text x="365.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">адреса повернення + локальні</text>
<rect x="440.0" y="70.0" width="230.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="2.0"/>
<text x="555.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">g()</text>
<text x="555.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">адреса повернення + локальні</text>
<line x1="290.0" y1="100.0" x2="248.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
