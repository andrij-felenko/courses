<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому write-back-кеш розходиться з RAM у часі</text>
<line x1="70.0" y1="360.0" x2="710.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час</text>
<line x1="134.0" y1="354.0" x2="134.0" y2="366.0" stroke="#333333" stroke-width="1.4"/>
<rect x="64.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="64.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="134.0" y="89.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">ядро пише</tspan><tspan x="134.0" dy="15.6">в буфер</tspan></text>
<line x1="134.0" y1="116.0" x2="134.0" y2="352.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="64.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="64.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="134.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">кеш: НОВЕ</tspan><tspan x="134.0" dy="15.0">RAM: старе</tspan></text>
<line x1="358.0" y1="354.0" x2="358.0" y2="366.0" stroke="#333333" stroke-width="1.4"/>
<rect x="288.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.4"/>
<rect x="288.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="358.0" y="89.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="358.0" dy="0.0">write-back</tspan><tspan x="358.0" dy="15.6">ще не стався</tspan></text>
<line x1="358.0" y1="116.0" x2="358.0" y2="352.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="288.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<rect x="288.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="358.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="358.0" dy="0.0">кеш: НОВЕ</tspan><tspan x="358.0" dy="15.0">RAM: СТАРЕ</tspan></text>
<line x1="582.0" y1="354.0" x2="582.0" y2="366.0" stroke="#333333" stroke-width="1.4"/>
<rect x="512.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="512.0" y="70.0" width="140.0" height="46.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="582.0" y="89.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="582.0" dy="0.0">після clean</tspan><tspan x="582.0" dy="15.6">→ старт DMA</tspan></text>
<line x1="582.0" y1="116.0" x2="582.0" y2="352.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="512.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="512.0" y="150.0" width="140.0" height="52.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="582.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="582.0" dy="0.0">кеш: НОВЕ</tspan><tspan x="582.0" dy="15.0">RAM: НОВЕ</tspan></text>
<text x="390.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис ядра осідає в кеші й до RAM доходить «колись» (write-back).</text>
<text x="390.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Поки clean не виконано, DMA на шині бачить у RAM лише стару копію.</text>
<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кеш зберігає копії блоками-кешлініями (на ESP32-S3 — 32 байти).</text>
</svg>