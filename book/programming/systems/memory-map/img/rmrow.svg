<text x="30.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">напр. SRAM1: 0x2002_FFFF − 0x2000_0000 + 1 = 0x30000 = 196 608 Б ≈ 192 КБ</text>
<text x="30.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">шина команд = код-простір · шина даних = пам'ять даних (Гарвард наживо)</text>
