<text x="684.0" y="511.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">адреси, за якими НЕ пам'ять,</text>
