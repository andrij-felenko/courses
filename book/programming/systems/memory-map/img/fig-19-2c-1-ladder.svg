<text x="684.0" y="391.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">купа — летка, дефіцитна</text>
<rect x="672.0" y="207.6" width="232.0" height="54.0" rx="7" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="684.0" y="226.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">FLASH</text>
<text x="684.0" y="242.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сюди прошивається код —</text>
<text x="684.0" y="256.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">нелетка, читається швидко</text>
<rect x="60.0" y="594.0" width="820.0" height="50.0" rx="9" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="470.0" y="614.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ до читання: знайди в RM таблицю «Memory map» — у ній рядки з BASE-адресами. Три, що потрібні щодня:</text>
<text x="470.0" y="632.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">де FLASH (код), де SRAM (змінні/стек), де PERIPHERAL (регістри). Решта — дірки й резерв; туди не лізь.</text>
