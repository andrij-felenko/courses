<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три незалежні важелі стиснення образу прошивки</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожен діє своїм механізмом; вмикати можна разом</text>
<rect x="28.0" y="74.0" width="246.0" height="250.0" rx="10" fill="#fff8e6" stroke="#caa24a" stroke-width="2.2"/>
<text x="151.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#8a6a14" text-anchor="middle" font-weight="700">-Os</text>
<text x="151.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">оптимізація за розміром</text>
<text x="151.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">optimize for size</text>
<line x1="44.0" y1="148.0" x2="258.0" y2="148.0" stroke="#caa24a" stroke-width="1.2"/>
<rect x="44.0" y="158.8" width="214.0" height="98.5" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="0.8"/><text x="151.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="151.0" dy="0.0">компілятор обирає</tspan><tspan x="151.0" dy="14.3">компактний варіант</tspan><tspan x="151.0" dy="14.3">коду, а не швидкий</tspan><tspan x="151.0" dy="14.3">(не розгортає цикли,</tspan><tspan x="151.0" dy="14.3">викликає спільне</tspan><tspan x="151.0" dy="14.3">замість вбудовування)</tspan></text>
<text x="151.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">жме .text (код)</text>
<rect x="310.0" y="74.0" width="246.0" height="250.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="433.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a6b30" text-anchor="middle" font-weight="700">--gc-sections</text>
<text x="433.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">прибирання секцій</text>
<text x="433.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">garbage collection of sections</text>
<line x1="326.0" y1="154.0" x2="540.0" y2="154.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="326.0" y="163.8" width="214.0" height="98.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="433.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="433.0" dy="0.0">лінкер викидає функції</tspan><tspan x="433.0" dy="14.3">та змінні, на які</tspan><tspan x="433.0" dy="14.3">ніхто не посилається</tspan><tspan x="433.0" dy="14.3">(кожна — в окремій</tspan><tspan x="433.0" dy="14.3">секції; невжиті секції</tspan><tspan x="433.0" dy="14.3">просто не входять в образ)</tspan></text>
<text x="433.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вирізає невжите з бібліотек</text>
<rect x="592.0" y="74.0" width="246.0" height="250.0" rx="10" fill="#e8eef8" stroke="#2457d6" stroke-width="2.2"/>
<text x="715.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a3880" text-anchor="middle" font-weight="700">-flto</text>
<text x="715.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">оптимізація під час лінкування</text>
<text x="715.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">link-time optimization, LTO</text>
<line x1="608.0" y1="154.0" x2="822.0" y2="154.0" stroke="#2457d6" stroke-width="1.2"/>
<rect x="608.0" y="161.8" width="214.0" height="98.5" rx="6" fill="#e8eef8" stroke="#2457d6" stroke-width="0.8"/><text x="715.0" y="179.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">оптимізація переноситься</tspan><tspan x="715.0" dy="14.3">на момент лінкування,</tspan><tspan x="715.0" dy="14.3">коли видно всю програму:</tspan><tspan x="715.0" dy="14.3">інлайн і прибирання</tspan><tspan x="715.0" dy="14.3">мертвого коду працюють</tspan><tspan x="715.0" dy="14.3">між файлами разом</tspan></text>
<text x="715.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">чистить крізь межі файлів</text>
</svg>