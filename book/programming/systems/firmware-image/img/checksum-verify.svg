<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка: сума надісланого = сумі в чипі?</text>
<rect x="112.4" y="86.2" width="95.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="160.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">образ на ПК</tspan><tspan x="160.0" dy="15.6">(надіслали)</tspan></text>
<rect x="485.5" y="86.2" width="108.9" height="47.6" rx="6" fill="#eef4ff" stroke="#3a5bb8" stroke-width="1.6"/><text x="540.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">образ у Flash</tspan><tspan x="540.0" dy="15.6">(прийняли)</tspan></text>
<line x1="207.6" y1="110.0" x2="485.5" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">залили по дроту</text>
<text x="160.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">сума A</text>
<text x="540.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3a5bb8" text-anchor="middle" font-weight="700">сума B</text>
<line x1="160.0" y1="188.0" x2="540.0" y2="188.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="311.8" y="171.5" width="76.4" height="33.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="350.0" y="192.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">A = B ?</tspan></text>
<text x="350.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">збіглося — цілий · різні — зіпсовано (перезалити)</text>
<text x="350.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">для хешу — лавина: зміна одного біта дає геть інший хеш</text>
</svg>