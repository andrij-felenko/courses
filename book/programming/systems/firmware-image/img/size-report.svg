<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зі секцій — два числа звіту: Flash і RAM</text>
<rect x="60.0" y="58.0" width="180.0" height="44.0" rx="6" fill="#eef4ff" stroke="#bbbbbb" stroke-width="1.3"/><text x="150.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">.text  180 КБ</tspan></text>
<rect x="60.0" y="128.0" width="180.0" height="44.0" rx="6" fill="#eafaf0" stroke="#bbbbbb" stroke-width="1.3"/><text x="150.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">.data    2 КБ</tspan></text>
<rect x="60.0" y="198.0" width="180.0" height="44.0" rx="6" fill="#eafaf0" stroke="#bbbbbb" stroke-width="1.3"/><text x="150.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">.bss   40 КБ</tspan></text>
<line x1="244.0" y1="80.0" x2="470.2" y2="96.0" stroke="#3a5bb8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="244.0" y1="150.0" x2="470.2" y2="122.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="244.0" y1="152.0" x2="444.2" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="244.0" y1="220.0" x2="444.2" y2="226.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="474.2" y="78.4" width="131.6" height="63.2" rx="6" fill="#eef4ff" stroke="#3a5bb8" stroke-width="1.8"/><text x="540.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3a5bb8" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Flash (образ)</tspan><tspan x="540.0" dy="15.6">= .text + .data</tspan><tspan x="540.0" dy="15.6">= 182 КБ</tspan></text>
<rect x="448.2" y="188.4" width="183.7" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">RAM (у роботі)</tspan><tspan x="540.0" dy="15.6">= .data + .bss</tspan><tspan x="540.0" dy="15.6">= 42 КБ  (+ стек/купа)</tspan></text>
<text x="330.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">.data — двічі</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">те саме показує рядок «програмна пам'ять … / динамічна пам'ять …»</text>
</svg>