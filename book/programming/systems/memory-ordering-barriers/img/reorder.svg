<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік A пише data, тоді ready — а потік B бачить це у зворотному порядку</text>
<rect x="60.0" y="60.0" width="300.0" height="34.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="81.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Потік A (пише)</tspan></text>
<rect x="60.0" y="108.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">data = 42;   // велике корисне значення</tspan></text>
<rect x="60.0" y="156.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ready = 1;   // прапорець «готово»</tspan></text>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">порядок у коді: спершу data, потім ready</text>
<rect x="420.0" y="60.0" width="280.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="81.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Потік B (читає)</tspan></text>
<rect x="420.0" y="108.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">while (ready == 0) {}   // чекає</tspan></text>
<rect x="420.0" y="156.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">use(data);   // очікує 42…</tspan></text>
<line x1="60.0" y1="268.0" x2="700.0" y2="268.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дійшло до потоку B (видимість записів):</text>
<line x1="70.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="70.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">раніше</text>
<text x="690.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">пізніше</text>
<circle cx="250.0" cy="350.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ready = 1</text>
<circle cx="560.0" cy="350.0" r="7.0" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="560.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">data = 42</text>
<text x="380.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">B побачив ready=1, коли data ще стара → use(data) читає сміття</text>
</svg>