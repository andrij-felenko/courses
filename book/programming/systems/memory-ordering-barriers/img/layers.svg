<text x="390.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Модель пам'яті — це договір: які з цих перестановок дозволені,</text>
<text x="390.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">а де ти командою-бар'єром кажеш «саме тут переставляти не можна».</text>
