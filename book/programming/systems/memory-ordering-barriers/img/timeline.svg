<text x="150.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Лемпорт</text>
<text x="150.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">послідовна</tspan><tspan x="150.0" dy="15.6">узгодженість —</tspan><tspan x="150.0" dy="15.6">умова коректності</tspan></text>
