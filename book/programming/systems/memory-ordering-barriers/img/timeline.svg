<text x="620.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">happens-before;</tspan><tspan x="620.0" dy="15.6">модель Java</tspan><tspan x="620.0" dy="15.6">полагоджено</tspan></text>
