<text x="450.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Ліворуч від JSR-133 порядок був турботою лише архітектури заліза.</tspan><tspan x="450.0" dy="17.6">Праворуч він став частиною договору самої мови — переносним між машинами.</tspan></text>
