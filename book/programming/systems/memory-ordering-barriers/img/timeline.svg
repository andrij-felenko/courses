<text x="830.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">std::atomic —</tspan><tspan x="830.0" dy="15.6">упорядкування</tspan><tspan x="830.0" dy="15.6">в стандарті C++</tspan></text>
