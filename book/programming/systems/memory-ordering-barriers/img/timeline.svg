<text x="390.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Java 1.0</text>
<text x="390.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">перша модель</tspan><tspan x="390.0" dy="15.6">у мові —</tspan><tspan x="390.0" dy="15.6">і вона зламана</tspan></text>
