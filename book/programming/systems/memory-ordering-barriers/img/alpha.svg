<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Єдине, що дозволяла тільки Alpha: прочитати покажчик — і взяти стару ціль</text>
<rect x="55.0" y="60.0" width="360.0" height="30.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Виробник (ядро 1)</tspan></text>
<rect x="55.0" y="98.0" width="360.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">node.val = 42;              // 1) заповнили вузол</tspan></text>
<rect x="55.0" y="138.0" width="360.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">smp_wmb();                  //    бар'єр запису</tspan></text>
<rect x="55.0" y="178.0" width="360.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">head = &amp;node;               // 2) опублікували</tspan></text>
<rect x="55.0" y="236.0" width="360.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Споживач (ядро 2)</tspan></text>
<rect x="55.0" y="274.0" width="360.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">p = head;                   // A) взяли покажчик</tspan></text>
<rect x="55.0" y="314.0" width="360.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">v = p-&gt;val;                 // B) взяли ціль</tspan></text>
<text x="235.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="235.0" dy="0.0">B залежить від A: адресу для B дало саме A.</tspan><tspan x="235.0" dy="15.6">Скрізь, крім Alpha, ця залежність тримає порядок.</tspan></text>
<rect x="470.0" y="60.0" width="355.0" height="30.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="647.5" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">Чому Alpha розриває навіть це</tspan></text>
<rect x="470.0" y="100.0" width="355.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="647.5" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Кеш ядра 2 поділений на незалежні БАНКИ.</tspan><tspan x="647.5" dy="15.6">А і B можуть впасти в різні банки.</tspan></text>
<rect x="470.0" y="150.0" width="355.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="647.5" y="166.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Банк із p-&gt;val оновлюється повільніше</tspan><tspan x="647.5" dy="15.6">за банк із head — і віддає СТАРУ копію.</tspan></text>
<rect x="470.0" y="200.0" width="355.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="647.5" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Наслідок: p = &amp;node (свіже),</tspan><tspan x="647.5" dy="15.6">а p-&gt;val = 0 (застаріле). Абсурд, але легальний.</tspan></text>
<text x="647.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">v == 0, хоча node.val давно = 42</text>
<line x1="470.0" y1="292.0" x2="825.0" y2="292.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="470.0" y="308.0" width="355.0" height="78.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="647.5" y="349.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Тому в Linux між A і B стоїть окремий бар'єр залежних читань. На всіх інших архітектурах він — пусте місце (no-op); ціну платить лише Alpha.</tspan></text>
</svg>