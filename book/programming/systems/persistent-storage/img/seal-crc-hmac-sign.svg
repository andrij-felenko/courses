<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Печатка запису: від захисту від випадковості до захисту від підробки</text>
<text x="400.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">логіка A/B-слотів і seq не змінюється — інша лише природа печатки над (seq + data)</text>
<rect x="24.0" y="78.0" width="236.0" height="258.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="142.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">CRC-32</text>
<text x="142.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle" font-style="italic">лінійна контрольна сума</text>
<rect x="36.0" y="140.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="70.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">ловить</tspan></text>
<text x="112.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">випадкове псування</text>
<text x="112.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">недопис, збій біта, шум</text>
<rect x="36.0" y="186.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="70.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">НЕ ловить</tspan></text>
<text x="112.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">зловмисну підробку</text>
<text x="112.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">хто керує даними — підбере CRC</text>
<rect x="36.0" y="232.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="70.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">ключ</tspan></text>
<text x="112.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">не потрібен</text>
<text x="112.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">дешево, швидко</text>
<rect x="46.0" y="306.0" width="192.0" height="20.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="142.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="142.0" dy="0.0">проти випадковості</tspan></text>
<rect x="282.0" y="78.0" width="236.0" height="258.0" rx="12" fill="#fff8e8" stroke="#9a7322" stroke-width="2.0"/>
<text x="400.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="700">HMAC-SHA-256</text>
<text x="400.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle" font-style="italic">хеш на СПІЛЬНОМУ ключі</text>
<rect x="294.0" y="140.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#9a7322" stroke-width="1.5"/><text x="328.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">ловить</tspan></text>
<text x="370.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">і випадкове, і підробку</text>
<text x="370.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">без ключа печатку не підробити</text>
<rect x="294.0" y="186.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#9a7322" stroke-width="1.5"/><text x="328.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">ключ</tspan></text>
<text x="370.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">один спільний секрет</text>
<text x="370.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">у писача і в читача</text>
<rect x="294.0" y="232.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#9a7322" stroke-width="1.5"/><text x="328.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">межа</tspan></text>
<text x="370.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">хто витягне ключ із чипа</text>
<text x="370.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">той зможе підробляти</text>
<rect x="304.0" y="306.0" width="192.0" height="20.0" rx="5" fill="#ffffff" stroke="#9a7322" stroke-width="1.5"/><text x="400.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">довірений пристрій</tspan></text>
<rect x="540.0" y="78.0" width="236.0" height="258.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="658.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Підпис (пара ключів)</text>
<text x="658.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle" font-style="italic">приватний підписав, відкритий звірив</text>
<rect x="552.0" y="140.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="586.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="586.0" dy="0.0">ловить</tspan></text>
<text x="628.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">і випадкове, і підробку</text>
<text x="628.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">приватний ключ лишає виробник</text>
<rect x="552.0" y="186.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="586.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="586.0" dy="0.0">ключ</tspan></text>
<text x="628.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">у пристрої лише ВІДКРИТИЙ</text>
<text x="628.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">ним не підробиш, лише звіриш</text>
<rect x="552.0" y="232.0" width="68.0" height="36.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="586.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="586.0" dy="0.0">це і є</tspan></text>
<text x="628.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">основа безпечного OTA</text>
<text x="628.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">образ приймаємо лише з підписом</text>
<rect x="562.0" y="306.0" width="192.0" height="20.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="658.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="658.0" dy="0.0">виробник ↔ пристрій</tspan></text>
<text x="400.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарність від зникнення живлення й захист від підробки — незалежні осі: слоти й seq тримають першу, печатка — другу.</text>
</svg>