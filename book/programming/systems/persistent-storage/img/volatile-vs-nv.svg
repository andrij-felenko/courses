<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи тримати біт: струмом чи фізично</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">летка комірка пам'ятає, лише поки тече струм; нелетка — завдяки застряглому фізичному стану</text>
<rect x="40.0" y="78.0" width="330.0" height="250.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="205.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Летка (volatile) — біт тримає струм</text>
<rect x="84.0" y="126.0" width="100.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="134.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">інвертор</tspan></text>
<rect x="226.0" y="126.0" width="100.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="276.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="276.0" dy="0.0">інвертор</tspan></text>
<line x1="186.0" y1="138.0" x2="224.0" y2="138.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="224.0" y1="154.0" x2="186.0" y2="154.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="205.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">вихід → вхід, по колу: сам себе тримає</text>
<line x1="64.0" y1="202.0" x2="346.0" y2="202.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="205.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">прибрали струм</text>
<rect x="74.0" y="234.0" width="262.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="259.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">петля рветься → біт зникає за мілісекунди</tspan></text>
<text x="205.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">як напис крейдою під дощем:</text>
<text x="205.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">не поновлюєш — змиває</text>
<rect x="390.0" y="78.0" width="330.0" height="250.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="555.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Нелетка (non-volatile) — біт застряг</text>
<rect x="470.0" y="124.0" width="170.0" height="46.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="555.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">плавучий затвор (в ізоляторі)</text>
<circle cx="494.0" cy="147.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="494.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="522.0" cy="147.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="522.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="550.0" cy="147.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="550.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="578.0" cy="147.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="578.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="606.0" cy="147.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="606.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="555.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">електрони замкнені оксидом — нема куди стекти</text>
<line x1="414.0" y1="202.0" x2="696.0" y2="202.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="555.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">прибрали струм</text>
<rect x="424.0" y="234.0" width="262.0" height="44.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">заряд лишається → біт цілий ~10 років</tspan></text>
<text x="555.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">як чорнило на папері:</text>
<text x="555.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">лежить саме, без живлення</text>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме питання — «а без струму?» — розводить два світи пам'яті: робочий (летка) і той, що переживає вимкнення (нелетка).</text>
</svg>