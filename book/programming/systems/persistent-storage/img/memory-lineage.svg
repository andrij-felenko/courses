<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="484.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід нелеткої пам'яті: щабель за щаблем — більше свободи, за свою ціну</text>
<text x="490.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">від «вплавлено на заводі, не змінити» до «дешево й масово, але блоками»</text>
<rect x="30.0" y="96.0" width="250.0" height="54.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="44.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">масочний ROM</text>
<text x="44.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">1960-ті</text>
<text x="296.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="296.0" y="116.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="446.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="446.0" dy="0.0">дані вплавлено маскою — вихідна точка</tspan></text>
<text x="612.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="612.0" y="116.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="724.0" y="134.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">не змінити взагалі ніколи</tspan></text>
<line x1="56.0" y1="152.0" x2="74.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="48.0" y="158.0" width="250.0" height="54.0" rx="9" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
