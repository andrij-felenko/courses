<text x="98.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Фроман, 1971</text>
<text x="350.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="350.0" y="302.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">стирай і переписуй багато разів</tspan></text>
<text x="666.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="666.0" y="302.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="778.0" y="320.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">вийми чип, світи УФ, оптом</tspan></text>
<line x1="110.0" y1="338.0" x2="128.0" y2="343.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="102.0" y="344.0" width="250.0" height="54.0" rx="9" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="116.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">EEPROM</text>
<text x="116.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Гарарі 1976; Intel ~1980</text>
<text x="368.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="368.0" y="364.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="518.0" y="382.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="518.0" dy="0.0">стирай струмом, не виймаючи, побайтно</tspan></text>
<text x="684.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="684.0" y="364.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="796.0" y="382.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="796.0" dy="0.0">знос оксиду; дорого — лише малі обсяги</tspan></text>
<line x1="128.0" y1="400.0" x2="146.0" y2="405.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="406.0" width="250.0" height="54.0" rx="9" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="134.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Flash</text>
<text x="134.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Масуока 1980 · NAND 1987</text>
<text x="386.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="386.0" y="426.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="536.0" y="444.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="536.0" dy="0.0">дешево, щільно, масово (терабайти)</tspan></text>
<text x="702.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="702.0" y="426.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="814.0" y="444.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="814.0" dy="0.0">стирання лише цілим блоком; знос блоку</tspan></text>
<text x="490.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен щабель віддає трохи жорсткості й здобуває трохи свободи — але жоден крок не безкоштовний.</text>
</svg>