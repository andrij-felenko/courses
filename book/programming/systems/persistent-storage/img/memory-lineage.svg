<text x="62.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Чжоу, 1956</text>
<text x="314.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="314.0" y="178.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="464.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="464.0" dy="0.0">програмуй сам, на столі</tspan></text>
<text x="630.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="630.0" y="178.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="742.0" y="196.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">рівно один раз — назад ніяк</tspan></text>
<line x1="74.0" y1="214.0" x2="92.0" y2="219.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="66.0" y="220.0" width="250.0" height="54.0" rx="9" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
