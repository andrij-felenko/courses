<text x="80.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Кан і Ші, 1967</text>
<text x="332.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">+ свобода</text>
<rect x="332.0" y="240.0" width="300.0" height="30.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="482.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="482.0" dy="0.0">принцип: заряд можна і зняти</tspan></text>
<text x="648.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">− ціна</text>
<rect x="648.0" y="240.0" width="224.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="258.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">лише доведений принцип, ще не виріб</tspan></text>
<line x1="92.0" y1="276.0" x2="110.0" y2="281.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
