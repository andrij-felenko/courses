<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві зворотні операції: взяти адресу (&amp;) і піти за нею (*)</text>
<rect x="40.0" y="60.0" width="300.0" height="110.0" rx="10" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="190.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">&amp;  —  «адреса від»</text>
<text x="190.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">&amp;x  →  0x20</text>
<text x="190.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дай, ДЕ лежить x</text>
<text x="190.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">p = &amp;x  — так націлюють покажчик</text>
<rect x="360.0" y="60.0" width="300.0" height="110.0" rx="10" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="510.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">*  —  «розіменування»</text>
<text x="510.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">*p  →  42</text>
<text x="510.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">піди за p і візьми значення</text>
<text x="510.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">*p = 99  — так МІНЯЮТЬ x через p</text>
<line x1="250.0" y1="205.0" x2="450.0" y2="205.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">&amp;  (значення → адреса)</text>
<line x1="450.0" y1="235.0" x2="250.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">*  (адреса → значення)</text>
<text x="150.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">значення x</text>
<text x="550.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">адреса в p</text>
</svg>