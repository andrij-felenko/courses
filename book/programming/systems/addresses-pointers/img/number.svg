<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 260" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="260" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покажчик — це просто число-адреса плюс тип</text>
<rect x="214.5" y="69.0" width="271.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="350.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">0x2000  —  лише адреса-число</tspan></text>
<text x="350.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">на 32-бітній машині — 4 байти, як будь-яке інше число</text>
<rect x="40.0" y="153.0" width="300.0" height="50.0" rx="8" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="190.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">int*  →  читати 4 байти</text>
<text x="190.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крок p+1 зсуває на 4 байти</text>
<rect x="360.0" y="153.0" width="300.0" height="50.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="510.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">char*  →  читати 1 байт</text>
<text x="510.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крок p+1 зсуває на 1 байт</text>
<text x="350.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">тип потрібен КОМПІЛЯТОРУ (скільки читати, який крок), не самому числу</text>
</svg>