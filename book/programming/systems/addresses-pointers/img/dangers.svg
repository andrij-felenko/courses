<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три зламані покажчики: нульовий, висячий, дикий</text>
<rect x="35.0" y="81.1" width="190.0" height="57.8" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.7"/><text x="130.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">адреса 0 — указує</tspan><tspan x="130.0" dy="13.7">«в нікуди»; піти за</tspan><tspan x="130.0" dy="13.7">ним → аварія</tspan></text>
<text x="130.0" y="73.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">нульовий (null)</text>
<rect x="255.0" y="81.1" width="190.0" height="57.8" rx="6" fill="#fafafa" stroke="#c0392b" stroke-width="1.7"/><text x="350.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">вказує на вже</tspan><tspan x="350.0" dy="13.7">недійсну пам'ять</tspan><tspan x="350.0" dy="13.7">(звільнену) → сміття</tspan></text>
<text x="350.0" y="73.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">висячий (dangling)</text>
<rect x="475.0" y="81.1" width="190.0" height="57.8" rx="6" fill="#fafafa" stroke="#8a5fb0" stroke-width="1.7"/><text x="570.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">неініціалізований —</tspan><tspan x="570.0" dy="13.7">випадкова адреса →</tspan><tspan x="570.0" dy="13.7">псує випадкову пам'ять</tspan></text>
<text x="570.0" y="73.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700">дикий (wild)</text>
<rect x="40.0" y="190.0" width="620.0" height="64.0" rx="8" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.6"/>
<text x="350.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На МК немає захисту пам'яті: хибний покажчик тихо «надряпає» поверх коду,</text>
<text x="350.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">чужих даних чи регістра периферії (він теж на адресі!) — і чип збоїть загадково.</text>
</svg>