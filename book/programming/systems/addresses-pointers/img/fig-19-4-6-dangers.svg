<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
<rect width="900" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інший бік: покажчики — джерело найгрізніших багів</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сила непрямості має ціну: покажчик, що вказує «не туди», тихо псує пам'ять або валить програму</text>
<rect x="70.0" y="88.0" width="760.0" height="54.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.7"/>
<text x="92.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Нульовий (null)</text>
<text x="300.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вказує «в нікуди» (адреса 0)</text>
<text x="300.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">піти за ним → аварія (crash)</text>
<rect x="70.0" y="152.0" width="760.0" height="54.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.7"/>
<text x="92.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Висячий (dangling)</text>
<text x="300.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вказує на пам'ять, що вже НЕдійсна</text>
<text x="300.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(звільнена/вийшла з області) → сміття</text>
<rect x="70.0" y="216.0" width="760.0" height="54.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.7"/>
<text x="92.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Дикий (wild)</text>
<text x="300.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">неініціалізований — містить ВИПАДКОВУ адресу</text>
<text x="300.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">піти за ним → псує випадкову пам'ять</text>
<rect x="60.0" y="290.0" width="780.0" height="110.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.7"/>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Особливо небезпечно на МК: там зазвичай НЕМАЄ захисту пам'яті, тож хибний покажчик може «надряпати»</text>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">поверх коду, чужих даних або навіть РЕГІСТРІВ ПЕРИФЕРІЇ (§19.2 — вони ж на адресах!) — і чип поведеться загадково.</text>
<text x="450.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь біди завжди той самий: плутанина «адреса проти значення» (§19.1) або покажчик, що показує кудись не туди.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому з покажчиками потрібна дисципліна: ініціалізуй, перевіряй на null, не тримай після звільнення (типові біди — §19.7).</text>
<text x="450.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: покажчик — гострий інструмент. Дає величезну силу непрямості, та вимагає акуратності, якої не пробачає.</text>
</svg>
