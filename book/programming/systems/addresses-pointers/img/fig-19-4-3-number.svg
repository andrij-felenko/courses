<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396">
<rect width="880" height="396" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Покажчик — це просто ЧИСЛО (адреса); тип каже, на ЩО він вказує</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сам покажчик — лише адреса-число (§17.1, §19.1); його «тип» потрібен компілятору, щоб знати розмір і крок</text>
<rect x="360.0" y="96.0" width="200.0" height="44.0" rx="4" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="350.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">0x10</text>
<text x="460.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x00002004</text>
<text x="460.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вміст покажчика — просто 32-бітне число (адреса)</text>
<text x="460.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">на 32-бітній машині покажчик займає 4 байти</text>
<rect x="120.0" y="210.0" width="300.0" height="96.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="270.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">«тип» покажчика</text>
<text x="270.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">int*  — вказує на 4-байтне ціле</text>
<text x="270.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">char* — вказує на 1 байт</text>
<text x="270.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(каже, скільки читати й який крок)</text>
<rect x="460.0" y="210.0" width="300.0" height="96.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="610.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">крок під час обходу</text>
<text x="610.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">p+1 для int* зсуває на 4 байти</text>
<text x="610.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">p+1 для char* — на 1 байт</text>
<text x="610.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(бо «крок» = розмір того, на що вказує)</text>
<text x="440.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тож покажчик — це адреса-число плюс ЗНАННЯ про те, на що вона показує. Саме число — як будь-яке інше (§17.1).</text>
<text x="440.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Через це покажчики й бувають 16-, 32- чи 64-бітні — рівно стільки, скільки треба, щоб умістити адресу (§19.1).</text>
</svg>
