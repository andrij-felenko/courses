<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо покажчики: чотири вигоди однієї непрямості</text>
<rect x="50.0" y="80.9" width="270.0" height="44.1" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.6"/><text x="185.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">велику структуру шлють</tspan><tspan x="185.0" dy="13.7">за адресою (кілька байтів)</tspan></text>
<text x="185.0" y="68.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">передати без копіювання</text>
<rect x="380.0" y="80.9" width="270.0" height="44.1" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.6"/><text x="515.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">функція пише в неї</tspan><tspan x="515.0" dy="13.7">через *p — «вернути назовні»</tspan></text>
<text x="515.0" y="68.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">змінити чужу змінну</text>
<rect x="50.0" y="170.9" width="270.0" height="44.1" rx="6" fill="#fafafa" stroke="#c0392b" stroke-width="1.6"/><text x="185.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">p+1, p+2 … крокують</tspan><tspan x="185.0" dy="13.7">по сусідніх комірках</tspan></text>
<text x="185.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">пройти масив / пам'ять</text>
<rect x="380.0" y="170.9" width="270.0" height="44.1" rx="6" fill="#fafafa" stroke="#8a5fb0" stroke-width="1.6"/><text x="515.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">комірка тримає адресу</tspan><tspan x="515.0" dy="13.7">наступної → списки, дерева</tspan></text>
<text x="515.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700">зв'язані структури</text>
</svg>