<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<rect width="900" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приведення покажчика змінює лише «крок» і «лінзу», а не саму адресу</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">те саме число-адреса; тип каже, скільки байтів читати й яким кроком іти</text>
<rect x="110.0" y="96.0" width="60.0" height="34.0" rx="0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="140.0" y="118.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x78</text>
<rect x="170.0" y="96.0" width="60.0" height="34.0" rx="0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="200.0" y="118.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x56</text>
<rect x="230.0" y="96.0" width="60.0" height="34.0" rx="0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="260.0" y="118.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x34</text>
<rect x="290.0" y="96.0" width="60.0" height="34.0" rx="0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="320.0" y="118.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x12</text>
<text x="110.0" y="88.0" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">0x2000</text>
<text x="230.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне 32-бітне ціле = 0x12345678 за адресою 0x2000 (мол. байт першим, §3.4.5)</text>
<rect x="70.0" y="200.0" width="360.0" height="84.0" rx="10" fill="#fbeeee" stroke="#c0271e" stroke-width="1.6"/>
<text x="250.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">int* p  —  «лінза» на 4 байти</text>
<text x="90.0" y="250.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">*p   → 0x12345678  (усі 4 байти)</text>
<text x="90.0" y="270.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">p+1  → 0x2004  (крок 4)</text>
<rect x="470.0" y="200.0" width="360.0" height="84.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="650.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">char* q = (char*)p  —  «лінза» на 1 байт</text>
<text x="490.0" y="250.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">*q   → 0x78  (лише мол. байт)</text>
<text x="490.0" y="270.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">q+1  → 0x2001  (крок 1)</text>
<rect x="70.0" y="318.0" width="360.0" height="150.0" rx="10" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="250.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Законно й переносно</text>
<text x="88.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• char*/unsigned char* — «оглядати» байти</text>
<text x="88.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  будь-якого об'єкта (винятку з aliasing)</text>
<text x="88.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• void* ↔ конкретний тип (туди-й-назад)</text>
<text x="88.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• up-cast у межах однієї структури/масиву</text>
<text x="88.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">memcpy у правильний тип — завжди безпечно</text>
<rect x="470.0" y="318.0" width="360.0" height="150.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.7"/>
<text x="650.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Небезпечно (UB!)</text>
<text x="488.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• читати int через float*/чужий тип —</text>
<text x="488.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  порушення strict aliasing (§7)</text>
<text x="488.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• (int*) на непідрівняну адресу →</text>
<text x="488.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  HardFault на Cortex-M (вирівнювання!)</text>
<text x="488.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">адреса та сама — а доступ уже зламаний</text>
</svg>
