<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перегони даних: несинхронізований доступ двох ядер до спільної комірки</text>
<rect x="240.0" y="280.0" width="300.0" height="60.0" rx="6" fill="#eef2f7" stroke="#4b5563" stroke-width="2.0"/><text x="390.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Спільна оперативна пам'ять (RAM)</tspan><tspan x="390.0" dy="16.9">Баланс: balance = 100</tspan></text>
<rect x="40.0" y="55.0" width="290.0" height="36.0" rx="6" fill="#edf2fc" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Ядро 1 (Потік A): balance += 50</tspan></text>
<rect x="40.0" y="100.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="185.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">1. Читання balance (100) у регістр R1</tspan></text>
<rect x="40.0" y="144.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="185.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">2. Обчислення: R1 = 100 + 50 = 150</tspan></text>
<rect x="40.0" y="188.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="185.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">3. Запис 150 назад у balance</tspan></text>
<rect x="450.0" y="55.0" width="290.0" height="36.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Ядро 2 (Потік B): balance += 30</tspan></text>
<rect x="450.0" y="100.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="595.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1. Читання balance (100) у регістр R2</tspan></text>
<rect x="450.0" y="144.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="595.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">2. Обчислення: R2 = 100 + 30 = 130</tspan></text>
<rect x="450.0" y="188.0" width="290.0" height="36.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="595.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">3. Запис 130 поверх результату Ядра 1</tspan></text>
<line x1="260.0" y1="280.0" x2="200.0" y2="140.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Читає 100</text>
<line x1="520.0" y1="280.0" x2="580.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="630.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Читає 100</text>
<line x1="185.0" y1="235.0" x2="280.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="235.0" x2="500.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="150.0" width="280.0" height="56.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/><text x="390.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Втрачене оновлення!</tspan><tspan x="390.0" dy="15.6">Замість 180 у пам'яті опинилося 130</tspan></text>
</svg>