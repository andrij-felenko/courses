<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія гарантій поступу в паралельних алгоритмах (М. Герліхі)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Від блокуючих замків до сильних гарантій реального часу: що отримує система та окремий потік</text>
<rect x="80.0" y="80.0" width="160.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Блокуючі (Locks)</tspan><tspan x="160.0" dy="14.3">М'ютекси, спінлоки</tspan></text>
<rect x="260.0" y="80.0" width="540.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="102.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Немає гарантій: потік під замком може зависнути або заснути,</tspan><tspan x="530.0" dy="13.7">повністю зупинивши всіх інших учасників системи.</tspan></text>
<rect x="80.0" y="146.0" width="160.0" height="52.0" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="160.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Obstruction-Free</tspan><tspan x="160.0" dy="14.3">(Без перешкод)</tspan></text>
<rect x="260.0" y="146.0" width="540.0" height="52.0" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="530.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Поступ одного потоку гарантовано за умови, що всі інші потоки</tspan><tspan x="530.0" dy="13.7">тимчасово зупинилися (немає конкуренції за ресурс).</tspan></text>
<rect x="80.0" y="212.0" width="160.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="234.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Lock-Free</tspan><tspan x="160.0" dy="14.3">(Без блокувань)</tspan></text>
<rect x="260.0" y="212.0" width="540.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Системний поступ: щонайменше один потік завжди завершує операцію</tspan><tspan x="530.0" dy="13.7">за скінченну кількість кроків. Окремі потоки можуть голодувати.</tspan></text>
<rect x="80.0" y="278.0" width="160.0" height="52.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Wait-Free</tspan><tspan x="160.0" dy="14.3">(Без очікування)</tspan></text>
<rect x="260.0" y="278.0" width="540.0" height="52.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="300.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Індивідуальний поступ: КОЖЕН потік гарантовано завершує операцію</tspan><tspan x="530.0" dy="13.7">за обмежену зверху кількість кроків O(1) / O(N), без повторів.</tspan></text>
</svg>