<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип дії Compare-And-Swap (CAS): неподільна операція в кремнії</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратна перевірка: якщо значення в пам'яті дорівнює очікуваному — записуємо нове. Інакше відхиляємо.</text>
<text x="230.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій 1: Успіх (Match)</text>
<rect x="80.0" y="110.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять [ptr]: 42  |  Expected: 42</text>
<rect x="80.0" y="170.0" width="300.0" height="44.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Порівняння [ptr] == Expected (42 == 42) -&gt; ТАК</tspan><tspan x="230.0" dy="13.0">[ptr] := Desired (99)</tspan></text>
<rect x="80.0" y="240.0" width="300.0" height="36.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повертає: TRUE (пам'ять оновлено на 99)</text>
<line x1="230.0" y1="146.0" x2="230.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="214.0" x2="230.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="75.0" x2="440.0" y2="310.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій 2: Конфлікт (Mismatch)</text>
<rect x="500.0" y="110.0" width="300.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять [ptr]: 50 (хтось змінив!) | Expected: 42</text>
<rect x="500.0" y="170.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Порівняння [ptr] == Expected (50 != 42) -&gt; НІ</tspan><tspan x="650.0" dy="13.0">Запис блокується кремнієм!</tspan></text>
<rect x="500.0" y="240.0" width="300.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повертає: FALSE | Expected оновлено на 50</text>
<line x1="650.0" y1="146.0" x2="650.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="214.0" x2="650.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="330.0" width="780.0" height="46.6" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">CAS виконується на шині процесора як одна неподільна дія (x86: LOCK CMPXCHG, ARM: LDREX/STREX).</tspan><tspan x="440.0" dy="14.3">Жоден інший потік не може вклинитися між перевіркою та записом.</tspan></text>
</svg>