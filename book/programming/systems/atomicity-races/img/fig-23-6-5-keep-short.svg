<text x="470.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило те саме, що для ISR (§23.3): захищай лише мінімальну дію, не більше.</text>
