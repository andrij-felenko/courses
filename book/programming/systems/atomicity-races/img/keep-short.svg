<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коротка критична секція безпечна; довга сліпить систему</text>
<text x="70.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">коротка</text>
<line x1="210.0" y1="120.0" x2="800.0" y2="120.0" stroke="#cfd6e2" stroke-width="2.0"/>
<rect x="250.0" y="104.0" width="110.0" height="32.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="305.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">секція (переривання вимкнені)</text>
<circle cx="300.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<line x1="300.0" y1="120.0" x2="365.0" y2="120.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,3"/>
<line x1="365.0" y1="120.0" x2="392.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">обслуговано майже відразу</text>
<text x="70.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">довга</text>
<line x1="210.0" y1="240.0" x2="800.0" y2="240.0" stroke="#cfd6e2" stroke-width="2.0"/>
<rect x="250.0" y="224.0" width="410.0" height="32.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.7"/>
<text x="455.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">секція (переривання вимкнені)</text>
<circle cx="300.0" cy="240.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<line x1="300.0" y1="240.0" x2="665.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,3"/>
<line x1="665.0" y1="240.0" x2="692.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">подія мусить чекати весь цей час → джитер, втрати</text>
<rect x="80.0" y="300.0" width="720.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Поки переривання вимкнені, сліпне ВСЯ система: час збивається, події набігають.</tspan><tspan x="440.0" dy="14.3">Захищають лише мінімальну дію — лічені такти, одиниці мікросекунд.</tspan></text>
</svg>