<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка даних: два +1, а лічильник зріс лише на одиницю</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">і loop(), і обробник роблять count++ — через перекриття замість +2 виходить +1</text>
<rect x="150.0" y="78.0" width="56.0" height="30.0" rx="5" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="178.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">5</text>
<rect x="470.0" y="78.0" width="56.0" height="30.0" rx="5" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="498.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">5</text>
<rect x="760.0" y="78.0" width="56.0" height="30.0" rx="5" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/>
<text x="788.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">6</text>
<text x="110.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">count:</text>
<text x="64.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">loop()</text>
<line x1="110.0" y1="180.0" x2="850.0" y2="180.0" stroke="#dfe6f5" stroke-width="2.0"/>
<rect x="150.0" y="164.0" width="110.0" height="32.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="205.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">читає 5</text>
<line x1="260.0" y1="180.0" x2="690.0" y2="180.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="475.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">...перервано, своє «5» забуто...</text>
<rect x="690.0" y="164.0" width="160.0" height="32.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="770.0" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">пише 5 + 1 = 6</text>
<text x="64.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">обробник</text>
<circle cx="330.0" cy="180.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="330.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">переривання врізалось</text>
<line x1="330.0" y1="180.0" x2="330.0" y2="284.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="330.0" y="284.0" width="300.0" height="32.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="480.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">читає 5 → +1 → пише 6</text>
<line x1="630.0" y1="300.0" x2="630.0" y2="180.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="90.0" y="350.0" width="700.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Було два «+1», а count став лише 6 замість 7: loop писав, спираючись на застаріле «5».</tspan><tspan x="440.0" dy="14.3">Результат залежить від того, ХТО коли встиг. Одне оновлення зникло.</tspan></text>
</svg>