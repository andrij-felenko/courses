<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Критична секція: зроби спільне неподільним — але НАКОРОТКО</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки переривання вимкнені, усі вони чекають — тож вікно має бути крихітним</text>
<text x="70.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">main:</text>
<line x1="130.0" y1="110.0" x2="820.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="360.0" y="96.0" width="180.0" height="28.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="450.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">критична секція</text>
<text x="360.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">noInterrupts()</text>
<text x="540.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal">interrupts()</text>
<text x="70.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ISR:</text>
<line x1="420.0" y1="200.0" x2="420.0" y2="126.0" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aGrey)"/>
<text x="420.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">хоче спрацювати тут…</text>
<line x1="560.0" y1="160.0" x2="575.0" y2="118.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="600.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">…але виконається аж тут</text>
<rect x="120.0" y="244.0" width="660.0" height="44.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Секція додає затримку КОЖНОМУ перериванню (§4.5.4).</text>
<text x="450.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому всередині — лише пара інструкцій; жодних Serial, delay, Flash.</text>
</svg>
