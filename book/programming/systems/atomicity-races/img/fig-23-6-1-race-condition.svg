<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<rect width="960" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гонка даних: одне оновлення губиться</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і loop(), і обробник роблять count++ — та через перекриття замість +2 виходить лише +1</text>
<text x="80.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">count:</text>
<rect x="150.0" y="80.0" width="50.0" height="28.0" rx="5" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="175.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<rect x="470.0" y="80.0" width="50.0" height="28.0" rx="5" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="495.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<rect x="760.0" y="80.0" width="50.0" height="28.0" rx="5" fill="#fbfcff" stroke="#c0271e" stroke-width="1.4"/>
<text x="785.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<text x="64.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">loop()</text>
<line x1="110.0" y1="180.0" x2="880.0" y2="180.0" stroke="#dfe6f5" stroke-width="2" stroke-linecap="round"/>
<rect x="150.0" y="164.0" width="90.0" height="32.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="195.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">читає 5</text>
<rect x="700.0" y="164.0" width="140.0" height="32.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="770.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пише 5+1=6</text>
<line x1="240.0" y1="180.0" x2="700.0" y2="180.0" stroke="#1f47b5" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">...перервано, своє «5» забуто...</text>
<text x="64.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">обробник</text>
<circle cx="330.0" cy="180.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="330.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ ISR перебив</text>
<line x1="330.0" y1="180.0" x2="330.0" y2="284.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="330.0" y="284.0" width="280.0" height="32.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">читає 5 → +1 → пише 6</text>
<line x1="610.0" y1="300.0" x2="610.0" y2="180.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="150.0" y="350.0" width="660.0" height="60.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Було два «+1», а count став лише 6 замість 7: loop писав, спираючись на застаріле «5».</text>
<text x="480.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Це й є гонка: результат залежить від того, ХТО коли встиг. Одне оновлення зникло.</text>
</svg>
