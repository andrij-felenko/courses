<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переставлення пам'яті: без бар'єра читач бачить head раніше за дані</text>
<text x="230.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">без бар'єра</text>
<rect x="90.0" y="95.0" width="280.0" height="36.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="230.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">writer: data = x;  потім head++</text>
<text x="230.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">store buffer переставив видимість</text>
<rect x="90.0" y="165.0" width="280.0" height="36.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="230.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">reader бачить новий head ПЕРШИМ</text>
<rect x="120.0" y="215.0" width="220.0" height="36.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="230.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">читає недописаний слот</text>
<line x1="230.0" y1="131.0" x2="230.0" y2="163.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="201.0" x2="230.0" y2="213.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="70.0" x2="460.0" y2="290.0" stroke="#dde2ea" stroke-width="1.5" stroke-dasharray="2,4"/>
<text x="690.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">з бар'єром (release / acquire)</text>
<rect x="550.0" y="95.0" width="280.0" height="36.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="690.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">writer: data = x; ▸release▸ head++</text>
<text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">буфер прочищено перед публікацією head</text>
<rect x="550.0" y="165.0" width="280.0" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="690.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">reader: acquire бачить head</text>
<rect x="580.0" y="215.0" width="220.0" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="690.0" y="236.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">дані вже видимі — слот готовий</text>
<line x1="690.0" y1="131.0" x2="690.0" y2="163.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="201.0" x2="690.0" y2="213.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="300.0" width="800.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="460.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Кожне ядро має власний store buffer; інше ядро може побачити записи в іншому порядку.</tspan><tspan x="460.0" dy="14.3">Пара release/acquire змушує залізо: побачив head — дані перед ним уже видимі. volatile від цього не рятує.</tspan></text>
</svg>