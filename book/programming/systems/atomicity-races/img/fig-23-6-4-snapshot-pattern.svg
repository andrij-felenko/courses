<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Патерн «знімок»: швидко скопіювати, потім працювати</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">критичну секцію тримають МІНІМАЛЬНОЮ — лише копіювання, а обробку роблять поза нею</text>
<rect x="110.0" y="100.0" width="720.0" height="130.0" rx="10" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="130" y="132" font-family="Consolas, monospace" font-size="14.5" fill="#ff8a7a" font-weight="bold">noInterrupts();</text>
<text x="130" y="158" font-family="Consolas, monospace" font-size="14.5" fill="#e8e8e8">  uint32_t n = pulses;  pulses = 0;<tspan fill="#caa24a">  // лише копія</tspan></text>
<text x="130" y="184" font-family="Consolas, monospace" font-size="14.5" fill="#7ee0a0" font-weight="bold">interrupts();</text>
<text x="130" y="214" font-family="Consolas, monospace" font-size="14.5" fill="#e8e8e8">Serial.println(n);<tspan fill="#caa24a">  // обробка — ПОЗА секцією</tspan></text>
<text x="180.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">у секції — мить</text>
<line x1="130.0" y1="256.0" x2="470.0" y2="256.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<text x="640.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">уся «важка» робота — вже з копією, без поспіху</text>
<line x1="490.0" y1="256.0" x2="820.0" y2="256.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<text x="470.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спершу швидко «фотографуємо» спільні дані в локальну змінну під захистом,</text>
<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">а тоді спокійно працюємо з копією — переривання вже знову ввімкнені.</text>
</svg>
