<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка: швидке редагування розсинхронізувало програму й механіку</text>
<text x="70.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">введення</text>
<line x1="210.0" y1="110.0" x2="800.0" y2="110.0" stroke="#dfe6f5" stroke-width="2.0"/>
<rect x="250.0" y="94.0" width="150.0" height="32.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="325.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">рентген обрано</text>
<rect x="470.0" y="94.0" width="200.0" height="32.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="570.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">швидка правка → електрони</text>
<text x="550.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 8 секунд</text>
<text x="70.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">механіка</text>
<line x1="210.0" y1="230.0" x2="800.0" y2="230.0" stroke="#fbe2e0" stroke-width="2.0"/>
<rect x="250.0" y="214.0" width="220.0" height="32.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="360.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">столик ще веде мішень</text>
<text x="620.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">мішені ще НЕМАЄ на місці</text>
<line x1="570.0" y1="126.0" x2="570.0" y2="214.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="585.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">програма «вважає» пучок слабким,</text>
<rect x="70.0" y="300.0" width="740.0" height="46.6" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Дві задачі діяли над спільним станом без черги; за швидкого редагування вони розсинхронізувались.</tspan><tspan x="440.0" dy="14.3">Потужний промінь спрацьовував напряму, без мішені — багаторазове передозування.</tspan></text>
</svg>