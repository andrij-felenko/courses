<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спінлок проти atomic fetch_add на двох ядрах (одне слово, +1)</text>
<text x="230.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">спінлок — повний замок</text>
<rect x="80.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="155.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Core 0</tspan><tspan x="155.0" dy="13.7">portENTER → ++</tspan></text>
<rect x="250.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/><text x="325.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Core 1</tspan><tspan x="325.0" dy="13.0">крутиться вхолосту</tspan></text>
<text x="230.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">інше ядро марно палить такти</text>
<line x1="450.0" y1="72.0" x2="450.0" y2="250.0" stroke="#dde2ea" stroke-width="1.5" stroke-dasharray="2,4"/>
<text x="680.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">atomic::fetch_add — lock-free</text>
<rect x="530.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="605.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">Core 0</tspan><tspan x="605.0" dy="13.7">fetch_add(1)</tspan></text>
<rect x="700.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="775.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Core 1</tspan><tspan x="775.0" dy="13.7">працює своє</tspan></text>
<text x="690.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">ніхто нікого не чекає (LL/SC)</text>
<rect x="355.0" y="212.0" width="190.0" height="36.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="450.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">одне вирівняне слово</text>
<line x1="170.0" y1="148.0" x2="365.0" y2="210.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="148.0" x2="535.0" y2="210.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="268.0" width="760.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Для +1 над одним словом спінлок бере повний замок і змушує сусіднє ядро крутитись.</tspan><tspan x="450.0" dy="14.3">fetch_add робить ту саму RMW однією неподільною інструкцією. Замок — для багатопольних оновлень.</tspan></text>
</svg>