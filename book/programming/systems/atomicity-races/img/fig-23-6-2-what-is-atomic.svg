<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Атомарність: неподільна дія проти дії в кілька кроків</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">count++ — це насправді ТРИ кроки, і між ними може втрутитися переривання</text>
<text x="250.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">count++ — НЕ атомарна (3 кроки):</text>
<rect x="80.0" y="120.0" width="130.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="145.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">прочитати</text>
<rect x="250.0" y="120.0" width="130.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="315.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">додати 1</text>
<rect x="420.0" y="120.0" width="130.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="485.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">записати</text>
<line x1="210.0" y1="142.0" x2="250.0" y2="142.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="380.0" y1="142.0" x2="420.0" y2="142.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<circle cx="295.0" cy="190.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="295.0" y1="190.0" x2="295.0" y2="164.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="295.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ ISR може втрутитися тут → гонка</text>
<text x="720.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">одне читання/запис слова —</text>
<text x="720.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">атомарне (1 крок):</text>
<rect x="640.0" y="132.0" width="160.0" height="44.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="720.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">неподільно</text>
<text x="720.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перервати «всередині»</text>
<text x="720.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">нема де — або до, або після</text>
<rect x="120.0" y="260.0" width="700.0" height="90.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="470.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Атомарна = «все або нічого», її не можна застати на півдорозі.</text>
<text x="470.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Багатокрокову дію (count++, читання 64-біт, оновлення структури) переривання може</text>
<text x="470.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розрізати посередині — і саме її треба захищати критичною секцією.</text>
</svg>
