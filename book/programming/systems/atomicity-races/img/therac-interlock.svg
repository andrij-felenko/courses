<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зниклий запобіжник: ранні моделі мали апаратне блокування, Therac-25 — лише софт</text>
<text x="230.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Therac-6 / 20</text>
<rect x="80.0" y="105.0" width="300.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="230.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">програма помилилась</text>
<line x1="230.0" y1="145.0" x2="230.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="172.0" width="300.0" height="38.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="230.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">апаратне блокування — не пускає</text>
<line x1="230.0" y1="212.0" x2="230.0" y2="237.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="238.0" width="180.0" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="230.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">промінь безпечний</text>
<line x1="440.0" y1="80.0" x2="440.0" y2="290.0" stroke="#dde2ea" stroke-width="1.5" stroke-dasharray="2,4"/>
<text x="650.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Therac-25</text>
<rect x="500.0" y="105.0" width="300.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="650.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">програма помилилась</text>
<line x1="650.0" y1="145.0" x2="650.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(апаратний запобіжник прибрано)</text>
<line x1="650.0" y1="205.0" x2="650.0" y2="237.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="238.0" width="200.0" height="36.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="650.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">передозування</text>
<rect x="60.0" y="308.0" width="760.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ранні моделі мали незалежний апаратний блокувальник: помилка софту не пускала промінь.</tspan><tspan x="440.0" dy="14.3">Therac-25 поклався на саму лише програму — і помилка лишилась без останньої сітки.</tspan></text>
</svg>