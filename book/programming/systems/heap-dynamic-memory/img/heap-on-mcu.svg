<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому на мікроконтролері купу беруть обережно</text>
<rect x="70.0" y="66.0" width="280.0" height="120.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Мізерна RAM</text>
<rect x="84.0" y="100.0" width="252.0" height="78.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="210.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">кілобайти всього —</tspan><tspan x="210.0" dy="13.7">фрагментація вичерпує</tspan><tspan x="210.0" dy="13.7">їх швидко й фатально</tspan></text>
<rect x="310.0" y="66.0" width="280.0" height="120.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="450.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Витік = крах</text>
<rect x="324.0" y="100.0" width="252.0" height="78.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="450.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">пристрій працює тижнями</tspan><tspan x="450.0" dy="13.7">без перезапуску, тож</tspan><tspan x="450.0" dy="13.7">навіть крихітний витік уб'є</tspan></text>
<rect x="550.0" y="66.0" width="280.0" height="120.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="690.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Недетермінований час</text>
<rect x="564.0" y="100.0" width="252.0" height="78.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="690.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">malloc триває то довше,</tspan><tspan x="690.0" dy="13.7">то коротше (пошук блоку)</tspan><tspan x="690.0" dy="13.7">— зле для реального часу</tspan></text>
<text x="450.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типові вбудовані підходи:</text>
<rect x="70.0" y="232.0" width="195.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="167.5" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">уникати динаміки</tspan><tspan x="167.5" dy="14.3">зовсім</tspan></text>
<rect x="275.0" y="232.0" width="195.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="372.5" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.5" dy="0.0">виділити все раз</tspan><tspan x="372.5" dy="14.3">на старті</tspan></text>
<rect x="480.0" y="232.0" width="195.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="577.5" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="577.5" dy="0.0">пули блоків</tspan><tspan x="577.5" dy="14.3">однакового розміру</tspan></text>
<rect x="685.0" y="232.0" width="195.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="782.5" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="782.5" dy="0.0">статика і стек</tspan><tspan x="782.5" dy="14.3">замість купи</tspan></text>
<rect x="50.0" y="296.0" width="800.0" height="47.9" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Це не означає, що «купа погана» — на ПК і серверах вона незамінна.</tspan><tspan x="450.0" dy="14.3">На крихітному залізі реального часу для постійних чи критичних даних — статика й стек.</tspan></text>
</svg>