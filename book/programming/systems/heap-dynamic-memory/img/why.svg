<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо купа: два випадки, з якими стек не впорається</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">локальне зникає при поверненні, а його розмір фіксований — та інколи треба не так</text>
<rect x="70.0" y="82.0" width="350.0" height="130.0" rx="6" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/><text x="245.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">1. Дані мусять ПЕРЕЖИТИ функцію</tspan><tspan x="245.0" dy="14.3"></tspan><tspan x="245.0" dy="14.3">функція створила результат і завершилась,</tspan><tspan x="245.0" dy="14.3">а він потрібен далі</tspan><tspan x="245.0" dy="14.3">стек: кадр знято → дані зникли</tspan></text>
<rect x="460.0" y="82.0" width="350.0" height="130.0" rx="6" fill="#fff8ec" stroke="#caa24a" stroke-width="1.6"/><text x="635.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">2. Розмір невідомий НАПЕРЕД</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">скільки даних — вирішується під час роботи</tspan><tspan x="635.0" dy="14.3">(прочитати N вимірів, N — на льоту)</tspan><tspan x="635.0" dy="14.3">стек: локальний масив фіксований</tspan></text>
<rect x="60.0" y="236.0" width="760.0" height="63.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Для обох є КУПА: велика область, з якої беруть блок будь-якого розміру під час роботи,</tspan><tspan x="440.0" dy="14.3">тримають скільки треба (він переживає функції) і повертають, коли вже не потрібен.</tspan><tspan x="440.0" dy="14.3">«Динамічна» — бо розмір і час життя вирішуються на льоту, а не наперед.</tspan></text>
</svg>