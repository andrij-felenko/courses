<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три біди ручного керування пам'яттю</text>
<rect x="70.0" y="70.0" width="240.0" height="180.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.7"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Витік (leak)</text>
<line x1="90.0" y1="108.0" x2="290.0" y2="108.0" stroke="#f0d6d4" stroke-width="1.0"/>
<rect x="86.0" y="118.0" width="208.0" height="120.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="190.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">узяв блок і не повернув</tspan><tspan x="190.0" dy="14.3">(чи загубив покажчик)</tspan><tspan x="190.0" dy="14.3">→ пам'ять помалу</tspan><tspan x="190.0" dy="14.3">заповнюється до краху</tspan></text>
<rect x="330.0" y="70.0" width="240.0" height="180.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.7"/>
<text x="450.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Використання після free</text>
<line x1="350.0" y1="108.0" x2="550.0" y2="108.0" stroke="#f0d6d4" stroke-width="1.0"/>
<rect x="346.0" y="118.0" width="208.0" height="120.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="450.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">звільнив блок, та далі</tspan><tspan x="450.0" dy="14.3">ним користуєшся</tspan><tspan x="450.0" dy="14.3">→ висячий покажчик:</tspan><tspan x="450.0" dy="14.3">сміття або аварія</tspan></text>
<rect x="590.0" y="70.0" width="240.0" height="180.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.7"/>
<text x="710.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Подвійне free</text>
<line x1="610.0" y1="108.0" x2="810.0" y2="108.0" stroke="#f0d6d4" stroke-width="1.0"/>
<rect x="606.0" y="118.0" width="208.0" height="120.0" rx="6" fill="#fdf6f6" stroke="#fdf6f6" stroke-width="0.0"/><text x="710.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">звільнив той самий блок</tspan><tspan x="710.0" dy="14.3">двічі</tspan><tspan x="710.0" dy="14.3">→ псує бухгалтерію</tspan><tspan x="710.0" dy="14.3">розпорядника купи</tspan></text>
<rect x="50.0" y="268.0" width="800.0" height="47.9" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Усі три ростуть із того самого кореня, що й біди покажчиків: пам'яттю керуєш ти.</tspan><tspan x="450.0" dy="14.3">Звідси золоте правило: кожному «взяти» — рівно одне «повернути», і не чіпай блок після free.</tspan></text>
</svg>