<rect x="40.0" y="406.0" width="820.0" height="47.9" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Стек — для тимчасового, що живе з викликом: швидко й безтурботно, але жорстко.</tspan><tspan x="450.0" dy="14.3">Купа — для довговічного чи невідомого наперед розміру: гнучко, та повільніше й вручну.</tspan></text>
