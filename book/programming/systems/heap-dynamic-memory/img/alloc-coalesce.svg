<text x="76.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">(в)</text>
<rect x="40.0" y="300.0" width="820.0" height="63.8" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Звільнив блок поряд із вільними — наївний free дає три дрібні уламки: великий запит не влізе.</tspan><tspan x="450.0" dy="14.3">Лік: злити блок із вільними сусідами за АДРЕСОЮ в один суцільний.</tspan><tspan x="450.0" dy="14.3">Наступного сусіда дає «адреса + розмір»; попереднього — граничні мітки (розмір у кінці блока).</tspan></text>
