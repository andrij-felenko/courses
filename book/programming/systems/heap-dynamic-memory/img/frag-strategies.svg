<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найбільший суцільний вільний шматок у часі: три стратегії</text>
<text x="180.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">(а) malloc/free врозкид</text>
<rect x="90.0" y="110.0" width="180.0" height="150.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="100.0" y1="118.0" x2="100.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="100.0" y1="246.0" x2="260.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="94.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">макс</text>
<text x="258.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">час</text>
<polyline points="100,128 140,150 170,140 210,180 230,170 255,240" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="255.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✘</text>
<text x="180.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тане 100 % → 8 %</text>
<text x="480.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(б) усе раз на старті</text>
<rect x="390.0" y="110.0" width="180.0" height="150.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="400.0" y1="118.0" x2="400.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="400.0" y1="246.0" x2="560.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="394.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">макс</text>
<text x="558.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">час</text>
<line x1="400.0" y1="134.0" x2="560.0" y2="134.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="480.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">не змінюється ніколи</text>
<text x="780.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(в) пул однакових слотів</text>
<rect x="690.0" y="110.0" width="180.0" height="150.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="700.0" y1="118.0" x2="700.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="700.0" y1="246.0" x2="860.0" y2="246.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="694.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">макс</text>
<text x="858.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">час</text>
<line x1="700.0" y1="134.0" x2="860.0" y2="134.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="780.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">сталий, O(1)</text>
<rect x="40.0" y="296.0" width="820.0" height="63.8" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="317.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">(а) врозкид: суцільний вільний тане, аж великий запит провалюється — пристрій падає в полі.</tspan><tspan x="450.0" dy="14.3">(б) усе на старті: картина заморожена, найгірший випадок відомий ще при компіляції.</tspan><tspan x="450.0" dy="14.3">(в) пул: зовнішньої фрагментації нема за визначенням, alloc/free стають O(1).</tspan></text>
</svg>