<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що таке контекст: знімок регістрів</text>
<rect x="60.0" y="70.0" width="300.0" height="220.0" rx="12" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Процесорне ядро</text>
<rect x="76.0" y="116.0" width="90.0" height="30.0" rx="5" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/>
<text x="121.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">PC</text>
<text x="178.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">лічильник команд — де я в коді</text>
<rect x="76.0" y="156.0" width="90.0" height="30.0" rx="5" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/>
<text x="121.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">SP</text>
<text x="178.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">вказівник стека — де мій стек</text>
<rect x="76.0" y="196.0" width="90.0" height="30.0" rx="5" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/>
<text x="121.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">R0…R12</text>
<text x="178.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">робочі регістри — проміжні дані</text>
<rect x="76.0" y="236.0" width="90.0" height="30.0" rx="5" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/>
<text x="121.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">PSR</text>
<text x="178.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прапорці — результат порівнянь</text>
<line x1="372.0" y1="180.0" x2="438.0" y2="180.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="405.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">знімок</text>
<rect x="450.0" y="104.0" width="260.0" height="152.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="580.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Контекст задачі</text>
<text x="580.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">усі ці значення разом —</tspan><tspan x="580.0" dy="14.9">повний «стан свідомості» задачі</tspan><tspan x="580.0" dy="14.9">тієї миті, коли її спинили</tspan></text>
<text x="580.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">відновиш ці значення — задача побіжить далі, наче не спинялася</text>
<text x="380.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«контекст» — це не абстракція, а конкретний набір регістрів процесора</text>
</svg>