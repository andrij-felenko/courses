<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто що зберігає (на прикладі Cortex-M)</text>
<rect x="60.0" y="80.0" width="300.0" height="190.0" rx="12" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Залізо — само, на вході в переривання</text>
<text x="210.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">caller-saved (за ABI — леткі)</text>
<rect x="78.0" y="140.0" width="264.0" height="44.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/>
<text x="210.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">R0  R1  R2  R3  R12  LR  PC  PSR</text>
<text x="210.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ці регістри й так «леткі» — код</tspan><tspan x="210.0" dy="13.0">уже не чекає їх цілими після виклику,</tspan><tspan x="210.0" dy="13.0">тож залізо стекає їх безкоштовно</tspan></text>
<rect x="400.0" y="80.0" width="300.0" height="190.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="550.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Планувальник — вручну, у PendSV</text>
<text x="550.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">callee-saved (за ABI — збережні)</text>
<rect x="418.0" y="140.0" width="264.0" height="44.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/>
<text x="550.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R4  R5  R6  R7  R8  R9  R10  R11</text>
<text x="550.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">ці регістри код лишав цілими через</tspan><tspan x="550.0" dy="13.0">виклики — тож саме їх мусить зберегти</tspan><tspan x="550.0" dy="13.0">код перемикання, залізо їх не чіпає</tspan></text>
<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">поділ праці збігається з поділом ABI: разом обидві половини й дають повний контекст</text>
</svg>