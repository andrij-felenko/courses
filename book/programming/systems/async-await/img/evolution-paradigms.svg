<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="35.0" y="20.0" width="270.0" height="320.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1. Зворотні виклики (Callbacks)</text>
<rect x="50.0" y="67.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Головний потік: запит вводу-виводу</tspan><tspan x="170.0" dy="14.3">(передаємо функцію-колбек)</tspan></text>
<line x1="170.0" y1="115.0" x2="170.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="152.3" width="240.0" height="45.3" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Цикл подій чекає на сокет/диск</tspan><tspan x="170.0" dy="14.3">(стек викликів розмотано!)</tspan></text>
<line x1="170.0" y1="205.0" x2="170.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="252.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Виклик колбека у свіжому стеку:</tspan><tspan x="170.0" dy="14.3">піраміда вкладень, втрата try/catch</tspan></text>
<rect x="335.0" y="20.0" width="270.0" height="320.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2. Проміси (Promises / Futures)</text>
<rect x="350.0" y="67.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Запит повертає об'єкт-токен:</tspan><tspan x="470.0" dy="14.3">Promise { &lt;pending&gt; }</tspan></text>
<line x1="470.0" y1="115.0" x2="470.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="152.3" width="240.0" height="45.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ланцюжок .then() / .catch():</tspan><tspan x="470.0" dy="14.3">пасивна підписка на результат</tspan></text>
<line x1="470.0" y1="205.0" x2="470.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="252.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Автосплющення промісів:</tspan><tspan x="470.0" dy="14.3">лінійний конвеєр, єдиний .catch</tspan></text>
<rect x="635.0" y="20.0" width="270.0" height="320.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<text x="770.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">3. Корутини (Async / Await)</text>
<rect x="650.0" y="67.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Синхронний вигляд коду:</tspan><tspan x="770.0" dy="14.3">val = await fetchAsync()</tspan></text>
<line x1="770.0" y1="115.0" x2="770.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="152.3" width="240.0" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Призупинення корутини:</tspan><tspan x="770.0" dy="14.3">стан у купі, потік вільний</tspan></text>
<line x1="770.0" y1="205.0" x2="770.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="252.3" width="240.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Відновлення з того ж рядка:</tspan><tspan x="770.0" dy="14.3">рідний try/catch, цикли for/while</tspan></text>
</svg>