<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння станів конкурентності</text>
<rect x="20.0" y="50.0" width="720.0" height="95.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<rect x="35.0" y="65.0" width="130.0" height="30.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="100.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Дедлок (Deadlock)</text>
<text x="275.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стан потоків: СПЛЯТЬ / ЗАБЛОКОВАНІ</text>
<text x="275.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Навантаження CPU: 0%</text>
<text x="550.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поведінка: кожен потік спить в очікуванні ресурсу.</text>
<text x="550.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Змін стану немає, прогрес відсутній назавжди.</text>
<text x="550.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лікування: перезапуск, таймаут або аборт транзакції.</text>
<rect x="20.0" y="160.0" width="720.0" height="95.0" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<rect x="35.0" y="175.0" width="130.0" height="30.0" rx="4" fill="#f39c12" stroke="#f39c12" stroke-width="1.5"/>
<text x="100.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Лайвлок (Livelock)</text>
<text x="275.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Стан потоків: АКТИВНІ (АКТИВНИЙ ЦИКЛ)</text>
<text x="275.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Навантаження CPU: 100%</text>
<text x="550.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поведінка: потоки відпускають ресурси й повторюють</text>
<text x="550.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">спробу синхронно, знову заважаючи один одному.</text>
<text x="550.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лікування: випадкова експоненційна затримка (jitter).</text>
<rect x="20.0" y="270.0" width="720.0" height="95.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<rect x="35.0" y="285.0" width="130.0" height="30.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="100.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Штатний прогрес</text>
<text x="275.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стан потоків: ВИКОНАННЯ ЗА ЧЕРГОЮ</text>
<text x="275.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Навантаження CPU: Корисна робота</text>
<text x="550.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поведінка: замки захоплюються в єдиному порядку або</text>
<text x="550.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">атомарно через std::scoped_lock / std::lock.</text>
<text x="550.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Результат: дедлоки та лайвлоки математично неможливі.</text>
</svg>