<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення: задача псує сусідню пам'ять</text>
<rect x="120.0" y="80.0" width="220.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="230.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">стек задачі A</text>
<rect x="138.0" y="200.0" width="184.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вихід за межу</text>
<rect x="400.0" y="80.0" width="220.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="510.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">стек задачі B</text>
<text x="510.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">затерто «сміттям»</text>
<text x="510.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">від задачі A</text>
<line x1="334.0" y1="224.0" x2="414.0" y2="159.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="268.0" width="500.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="370.0" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Винна A, а падає B: причина й симптом — у різних місцях</tspan></text>
