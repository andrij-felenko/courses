<text x="380.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні речі: адреса каже, ДЕ комірка; вміст — ЩО в ній лежить.</text>
<text x="380.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Адреси майже завжди пишуть шістнадцятково: 0x00, 0x1F, 0xFF — компактно лягає на біти.</text>
