<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому осердя змінили все</text>
<rect x="40.0" y="70.0" width="300.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">випадковий доступ</text>
<text x="190.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">будь-яка комірка миттєво,</tspan><tspan x="190.0" dy="14.3">не чекаючи оберту</tspan></text>
<rect x="380.0" y="70.0" width="300.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="530.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">надійність і швидкість</text>
<text x="530.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">не гасне, не плутає —</tspan><tspan x="530.0" dy="14.3">нарешті можна покластися</tspan></text>
<rect x="40.0" y="190.0" width="300.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.8"/>
<text x="190.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">нелеткість</text>
<text x="190.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">тримала дані</tspan><tspan x="190.0" dy="14.3">без живлення</tspan></text>
<rect x="380.0" y="190.0" width="300.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="530.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">сітка адрес X–Y</text>
<text x="530.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">пам'ять стала решіткою</tspan><tspan x="530.0" dy="14.3">комірок, кожна за адресою</tspan></text>
<text x="360.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Остання — точнісінько та модель, що живе в кожному чипі: пам'ять як масив комірок із адресами.</text>
</svg>