<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому осердя змінили все — і чому це вступ саме до цього розділу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перша швидка, надійна пам'ять із ВИПАДКОВИМ доступом зробила збережену програму (Розділ 18) практичною</text>
<rect x="70.0" y="88.0" width="760.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Випадковий доступ</text>
<text x="330.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">будь-яка комірка — миттєво, не чекаючи (на відміну від ліній і барабанів)</text>
<rect x="70.0" y="144.0" width="760.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Надійність і швидкість</text>
<text x="330.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не гасне, не плутає — на осердя нарешті можна було покластися</text>
<rect x="70.0" y="200.0" width="760.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="90.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Нелеткість</text>
<text x="330.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тримала дані без живлення; звідси й термін «core dump» — досі живий</text>
<rect x="70.0" y="256.0" width="760.0" height="46.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="90.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Сітка адрес X–Y</text>
<text x="330.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пам'ять = РЕШІТКА комірок, кожна за своєю адресою</text>
<rect x="60.0" y="322.0" width="780.0" height="102.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Останній пункт — наш місток. Пам'ять на осердях була буквально РЕШІТКОЮ комірок, кожна за адресою (X,Y) —</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">точнісінько та модель, що ми вивчатимемо в §19.1: пам'ять як масив комірок із адресами.</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Технологія змінилася (тепер кремній, не ферит), а сама ІДЕЯ адресованої решітки лишилась незмінною від Форрестера донині.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Заслуга — Джея Форрестера (практична схема збігу струмів), хоч над осердями працювали й інші (Ван,Ві) — як завжди, праця багатьох.</text>
</svg>
