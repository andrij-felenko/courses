<text x="380.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">одне 32-бітне число 0x12345678</text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">16-бітне → 2 комірки · 32-бітне → 4 · 64-бітне → 8.</text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">У якому ПОРЯДКУ викладені байти (старший чи молодший першим) — це endianness;</text>
<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тут важливо лише те, що комірки сусідні (а кратна розміру адреса — вирівнювання).</text>
