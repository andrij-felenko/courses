<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один біт у феритовому кільці</text>
<circle cx="200.0" cy="160.0" r="46" fill="none" stroke="#2457d6" stroke-width="14"/>
<path d="M 200.0 100.0 A 46 46 0 1 1 204.0 100.0" fill="none" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="200.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<text x="200.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">намагнічене за годинниковою</text>
<circle cx="520.0" cy="160.0" r="46" fill="none" stroke="#c0392b" stroke-width="14"/>
<path d="M 520.0 100.0 A 46 46 0 1 0 516.0 100.0" fill="none" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="520.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="520.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">намагнічене проти</text>
<text x="360.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ — гістерезис: петля майже прямокутна, тож стан «застрягає» і тримається сам собою.</text>
<text x="360.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тому осердя, на відміну від тригера, пам'ятає й знеструмлене:</text>
<text x="360.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вимкнув машину — а пам'ять ціла (нелеткість).</text>
</svg>