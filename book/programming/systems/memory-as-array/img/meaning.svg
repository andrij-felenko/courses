<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комірка тримає просто число — сенс надає вживання</text>
<rect x="270.0" y="84.0" width="220.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">комірка 0x20  =  0x41</text>
<text x="380.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(бітами: 0100 0001)</text>
<line x1="380.0" y1="136.0" x2="104.0" y2="230.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24.0" y="230.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="104.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">як ціле</text>
<text x="104.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">65</text>
<line x1="380.0" y1="136.0" x2="288.0" y2="230.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="208.0" y="230.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="288.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">як символ</text>
<text x="288.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">'A'</text>
<line x1="380.0" y1="136.0" x2="472.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="392.0" y="230.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="472.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">як команда</text>
<text x="472.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">шматок opcode</text>
<line x1="380.0" y1="136.0" x2="656.0" y2="230.0" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="576.0" y="230.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.6"/>
<text x="656.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">як float</text>
<text x="656.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кілька бітів дробу</text>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий байт — і число, і буква, і код. Адреса каже лише ДЕ; що він ОЗНАЧАЄ — вирішує програма.</text>
<text x="380.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Прочитати не за тією домовленістю (текст як команду, ціле як дріб) — і все ламається.</text>
</svg>