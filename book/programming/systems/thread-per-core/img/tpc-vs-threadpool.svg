<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектур: пул потоків зі спільною пам'яттю проти Thread-per-core</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Конкуренція за замки та кеш-інвалідація проти повної ізоляції ядер та шардування стану</text>
<rect x="30.0" y="75.0" width="395.0" height="265.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.8"/>
<text x="227.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний пул потоків (Shared Memory)</text>
<text x="227.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Конкуренція N потоків за спільний стан через м'ютекси</text>
<rect x="45.0" y="135.0" width="75.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="82.5" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="82.5" dy="0.0">Потік 1</tspan><tspan x="82.5" dy="12.3">(Ядро 0)</tspan></text>
<rect x="130.0" y="135.0" width="75.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="167.5" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="167.5" dy="0.0">Потік 2</tspan><tspan x="167.5" dy="12.3">(Ядро 1)</tspan></text>
<rect x="215.0" y="135.0" width="75.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="252.5" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="252.5" dy="0.0">Потік 3</tspan><tspan x="252.5" dy="12.3">(Ядро 2)</tspan></text>
<rect x="300.0" y="135.0" width="75.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="337.5" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="337.5" dy="0.0">Потік N</tspan><tspan x="337.5" dy="12.3">(Ядро K)</tspan></text>
<line x1="82.0" y1="178.0" x2="160.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="167.0" y1="178.0" x2="190.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="252.0" y1="178.0" x2="235.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="337.0" y1="178.0" x2="260.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="110.0" y="220.0" width="235.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="227.5" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="227.5" dy="0.0">Спільний замок (pthread_mutex_t)</tspan><tspan x="227.5" dy="13.0">Вузьке місце: черги очікування</tspan></text>
<rect x="75.0" y="275.0" width="305.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="227.5" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="227.5" dy="0.0">Спільна структура даних (Хеш-таблиця / Кеш)</tspan><tspan x="227.5" dy="12.3">Cache line bouncing між ядрами CPU</tspan><tspan x="227.5" dy="12.3">Втрати до 70-85% тактів на інвалідацію кешу</tspan></text>
<rect x="455.0" y="75.0" width="395.0" height="265.0" rx="8" fill="#f8fdf9" stroke="#27ae60" stroke-width="1.8"/>
<text x="652.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Thread-per-core (Shared-Nothing)</text>
<text x="652.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 закріплений потік на ядро, приватна пам'ять, нуль замків</text>
<rect x="470.0" y="135.0" width="115.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="527.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="527.5" dy="0.0">Ядро 0 (Потік 0)</tspan><tspan x="527.5" dy="12.3">Event Loop</tspan><tspan x="527.5" dy="12.3">Шард даних 0</tspan></text>
<rect x="595.0" y="135.0" width="115.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="652.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="652.5" dy="0.0">Ядро 1 (Потік 1)</tspan><tspan x="652.5" dy="12.3">Event Loop</tspan><tspan x="652.5" dy="12.3">Шард даних 1</tspan></text>
<rect x="720.0" y="135.0" width="115.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="777.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="777.5" dy="0.0">Ядро N (Потік N)</tspan><tspan x="777.5" dy="12.3">Event Loop</tspan><tspan x="777.5" dy="12.3">Шард даних N</tspan></text>
<rect x="470.0" y="215.0" width="365.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="652.5" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="652.5" dy="0.0">Між'ядерні SPSC кільцеві буфери (Ring Buffers)</tspan><tspan x="652.5" dy="12.3">Асинхронний обмін повідомленнями (Message Passing)</tspan><tspan x="652.5" dy="12.3">Кожне ядро працює виключно зі своїм L1/L2 кешем</tspan></text>
<line x1="527.0" y1="188.0" x2="527.0" y2="213.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="652.0" y1="188.0" x2="652.0" y2="213.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="777.0" y1="188.0" x2="777.0" y2="213.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="275.0" width="365.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="652.5" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="652.5" dy="0.0">Локальна пам'ять NUMA для кожного ядра</tspan><tspan x="652.5" dy="12.3">Нуль системних викликів блокування (Zero Lock Contention)</tspan><tspan x="652.5" dy="12.3">Масштабованість, близька до строго лінійної</tspan></text>
<rect x="40.0" y="355.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Пул зі спільною пам'яттю деградує на 32+ ядрах через конкуренцію за замки та інвалідацію кешу.</tspan><tspan x="440.0" dy="14.3">Thread-per-core ізолює стан по ядрах: кожне ядро опрацьовує свій шард без синхронізаційних блокувань.</tspan></text>
</svg>