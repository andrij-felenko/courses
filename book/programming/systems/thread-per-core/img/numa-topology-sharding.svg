<rect x="40.0" y="350.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">На сучасних багатосокетних серверах читання пам'яті чужого процесора через шину UPI займає втричі більше часу.</tspan><tspan x="440.0" dy="14.3">Thread-per-core локалізує структури даних на «своєму» NUMA-вузлі, усуваючи паразитний міжсокетний трафік.</tspan></text>
