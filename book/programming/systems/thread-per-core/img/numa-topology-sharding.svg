<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Thread-per-core прив'язує пам'ять шарду строго до локального NUMA-вузла (numa_alloc_onnode)</text>
