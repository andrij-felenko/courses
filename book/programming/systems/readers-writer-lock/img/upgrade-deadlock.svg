<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка підвищення блокування (Lock Upgrading Deadlock)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Чому пряме перетворення блокування читача на блокування запису призводить до мертвої петлі</text>
<rect x="60.0" y="75.0" width="340.0" height="220.0" rx="8" fill="#fcfcfc" stroke="#1b7340" stroke-width="1.5"/>
<text x="230.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b7340" text-anchor="middle" font-weight="700">Потік A (Reader 1)</text>
<rect x="85.0" y="120.0" width="290.0" height="32.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="230.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b7340" text-anchor="middle" font-weight="700">1. Тримає Shared Read Lock</text>
<rect x="85.0" y="175.0" width="290.0" height="32.0" rx="6" fill="#fff3cd" stroke="#caa24a" stroke-width="1.5"/>
<text x="230.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Бажає оновити запис (upgrade)</text>
<rect x="85.0" y="230.0" width="290.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Чекає, поки Потік B</tspan><tspan x="230.0" dy="14.3">відпустить свій Read Lock</tspan></text>
<rect x="480.0" y="75.0" width="340.0" height="220.0" rx="8" fill="#fcfcfc" stroke="#1b7340" stroke-width="1.5"/>
<text x="650.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b7340" text-anchor="middle" font-weight="700">Потік B (Reader 2)</text>
<rect x="505.0" y="120.0" width="290.0" height="32.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="650.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b7340" text-anchor="middle" font-weight="700">2. Тримає Shared Read Lock</text>
<rect x="505.0" y="175.0" width="290.0" height="32.0" rx="6" fill="#fff3cd" stroke="#caa24a" stroke-width="1.5"/>
<text x="650.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Бажає оновити запис (upgrade)</text>
<rect x="505.0" y="230.0" width="290.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Чекає, поки Потік A</tspan><tspan x="650.0" dy="14.3">відпустить свій Read Lock</tspan></text>
<line x1="375.0" y1="245.0" x2="505.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="505.0" y1="260.0" x2="375.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ДЕДЛОК</text>
<rect x="40.0" y="325.0" width="800.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Правило архітектури: безпечного атомарного «апгрейду» блокування з читання на запис не існує.</tspan><tspan x="440.0" dy="13.0">Щоб писати, читач зобов'язаний відпустити Read Lock і заново запросити Write Lock.</tspan></text>
</svg>