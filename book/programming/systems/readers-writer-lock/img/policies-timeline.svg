<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три політики доступу в RWLock</text>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Пріоритет читачів, пріоритет письменників та фазова справедливість (FIFO)</text>
<rect x="30.0" y="65.0" width="820.0" height="95.0" rx="6" fill="#fcfcfc" stroke="#d0d7de" stroke-width="1.2"/>
<text x="45.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b7340" text-anchor="start" font-weight="700">1. Пріоритет читачів (Read-preferring): максимум паралелізму читання</text>
<rect x="200.0" y="100.0" width="150.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="275.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">Читачі R1, R2</text>
<rect x="320.0" y="118.0" width="150.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="395.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">Читач R3 (заходить)</text>
<rect x="440.0" y="100.0" width="150.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="515.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">Читач R4 (заходить)</text>
<rect x="250.0" y="72.0" width="330.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="415.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Письменник W1 (голодує в очікуванні)</text>
<rect x="610.0" y="100.0" width="140.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="680.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">W1 нарешті пише</text>
<rect x="30.0" y="175.0" width="820.0" height="95.0" rx="6" fill="#fcfcfc" stroke="#d0d7de" stroke-width="1.2"/>
<text x="45.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Пріоритет письменників (Write-preferring): захист від застарівання даних</text>
<rect x="200.0" y="210.0" width="140.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="270.0" y="226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">Активні R1, R2</text>
<line x1="345.0" y1="185.0" x2="345.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="348.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Прийшов W1: бар'єр</text>
<rect x="355.0" y="210.0" width="130.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="420.0" y="226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">W1 пише монопольно</text>
<rect x="355.0" y="238.0" width="130.0" height="22.0" rx="6" fill="#f2f4f8" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="420.0" y="252.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">R3, R4 чекають у черзі</text>
<rect x="500.0" y="210.0" width="160.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="580.0" y="226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">R3, R4 читають разом</text>
<rect x="30.0" y="285.0" width="820.0" height="95.0" rx="6" fill="#fcfcfc" stroke="#d0d7de" stroke-width="1.2"/>
<text x="45.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Фазова справедливість (Phase-fair / FIFO): чергування груп читачів і письменника</text>
<rect x="200.0" y="320.0" width="140.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="270.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1b7340" text-anchor="middle" font-weight="700">Фаза 1: R1, R2 читають</text>
<rect x="355.0" y="320.0" width="140.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="425.0" y="336.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 2: W1 пише</text>
<rect x="510.0" y="320.0" width="160.0" height="26.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="1.5"/>
<text x="590.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1b7340" text-anchor="middle" font-weight="700">Фаза 3: R3, R4 читають разом</text>
<rect x="685.0" y="320.0" width="140.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="755.0" y="336.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 4: W2 пише</text>
<rect x="30.0" y="405.0" width="820.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Вибір політики визначає гарантії: пріоритет письменників запобігає затримці оновлень,</tspan><tspan x="440.0" dy="13.0">а фазова справедливість гарантує передбачуваний час очікування для обох сторін.</tspan></text>
</svg>