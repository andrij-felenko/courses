<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як захищатися: дисципліна, передбачуваність, інструменти</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">цілковито уникнути не завжди можна, та правильні звички гасять переважну більшість бід пам'яті</text>
<rect x="70.0" y="86.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Перевіряй межі</text>
<rect x="330.0" y="86.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">індекс &lt; розмір; не довіряй довжині вхідних даних</text>
<rect x="70.0" y="132.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Ініціалізуй усе</text>
<rect x="330.0" y="132.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">змінні й покажчики — нулем чи валідним значенням одразу</text>
<rect x="70.0" y="178.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Звільняй рівно раз</text>
<rect x="330.0" y="178.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кожному allocate — один free; обнуляй покажчик після нього</text>
<rect x="70.0" y="224.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Бережи стек</text>
<rect x="330.0" y="224.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">уникай нескінченної рекурсії й величезних локальних; лишай запас</text>
<rect x="70.0" y="270.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="90.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">На МК — статика</text>
<rect x="330.0" y="270.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">віддавай перевагу статичній/стековій пам'яті над купою</text>
<rect x="70.0" y="316.0" width="250.0" height="40.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="90.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Інструменти й мови</text>
<rect x="330.0" y="316.0" width="500.0" height="40.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="346.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">санітайзери, статичний аналіз; мови з безпекою пам'яті (Rust) гасять цілі класи</text>
<rect x="60.0" y="372.0" width="780.0" height="50.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C/C++ на МК ДОВІРЯЄ вам: ніхто не стереже пам'ять, тож дисципліна — на вас. Ці звички відрізняють надійну прошивку від примхливої.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Засвоївши пам'ять зсередини (увесь цей розділ), ви розумієте і ЧОМУ виникають ці біди, і як їх не припуститися.</text>
</svg>
