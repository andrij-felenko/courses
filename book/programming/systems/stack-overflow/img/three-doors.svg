<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хробак не мав «одного трюка»: він пробував три двері одночасно</text>
<rect x="30.0" y="86.0" width="208.0" height="250.0" rx="10" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<rect x="30.0" y="86.0" width="208.0" height="38.0" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<rect x="30.0" y="106.0" width="208.0" height="18.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="134.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">1. fingerd — переповнення буфера</text>
<text x="44.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сервіс finger показував, хто залогінений;</text>
<text x="44.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">у ньому 512-байтовий буфер читали через</text>
<text x="44.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">gets() без меж. Хробак слав 536 байтів —</text>
<text x="44.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">і перехоплював керування.</text>
<text x="44.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="44.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Це — герой нашої теми.</text>
<rect x="276.0" y="86.0" width="208.0" height="250.0" rx="10" fill="#fffaf0" stroke="#9a7322" stroke-width="1.8"/>
<rect x="276.0" y="86.0" width="208.0" height="38.0" rx="10" fill="#9a7322" stroke="#9a7322" stroke-width="0.0"/>
<rect x="276.0" y="106.0" width="208.0" height="18.0" rx="0" fill="#9a7322" stroke="#9a7322" stroke-width="0.0"/>
<text x="380.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2. sendmail — режим DEBUG</text>
<text x="290.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">поштовий сервер sendmail часто лишали</text>
<text x="290.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з увімкненим debug-режимом, що дозволяв</text>
<text x="290.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">слати команди прямо в систему.</text>
<text x="290.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Не переповнення — а відчинені «службові</text>
<text x="290.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">двері», які забули замкнути.</text>
<rect x="522.0" y="86.0" width="208.0" height="250.0" rx="10" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="522.0" y="86.0" width="208.0" height="38.0" rx="10" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<rect x="522.0" y="106.0" width="208.0" height="18.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="626.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">3. rsh / rexec — слабкі паролі</text>
<text x="536.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">довірчі зв'язки між машинами (rsh) +</text>
<text x="536.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">перебір паролів за словником на ~900 слів</text>
<text x="536.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">і за іменами користувачів.</text>
<text x="536.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Жодної «діри» в коді — лише людська звичка</text>
<text x="536.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ставити слабкі паролі й довіряти сусідам.</text>
<rect x="30.0" y="360.0" width="700.0" height="64.0" rx="6" fill="#f1f7f2" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Пробивши будь-які з трьох дверей, хробак копіював себе на нову машину — і повторював усе звідти.</tspan><tspan x="380.0" dy="14.3">Самопоширення без участі людини — ось чому це «хробак» (worm), а не «вірус», що чекає запуску.</tspan></text>
</svg>