<rect x="70.0" y="130.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Переповнення буфера</text>
<rect x="330.0" y="130.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">запис за межі масиву → псує сусіднє (й адресу повернення)</text>
<rect x="760.0" y="130.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.5</text>
