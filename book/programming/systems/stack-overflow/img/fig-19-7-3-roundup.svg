<text x="342.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стек доріс до купи (глибока рекурсія, великі локальні)</text>
<rect x="760.0" y="86.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
