<text x="82.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Витік пам'яті</text>
<rect x="330.0" y="174.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">узяв на купі й не повернув → пам'ять вичерпується</text>
<rect x="760.0" y="174.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.6</text>
<rect x="70.0" y="218.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Висячий покажчик</text>
<rect x="330.0" y="218.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на звільнену/зниклу пам'ять (use-after-free)</text>
<rect x="760.0" y="218.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.4–6</text>
<rect x="70.0" y="262.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Розіменування null</text>
<rect x="330.0" y="262.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">піти за нульовим покажчиком → аварія</text>
<rect x="760.0" y="262.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.4</text>
<rect x="70.0" y="306.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Дикий покажчик</text>
<rect x="330.0" y="306.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">неініціалізований → випадкова адреса → псує пам'ять</text>
<rect x="760.0" y="306.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.4</text>
<rect x="70.0" y="350.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Подвійне звільнення</text>
<rect x="330.0" y="350.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">free того самого блоку двічі → псує розпорядника</text>
<rect x="760.0" y="350.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">§19.6</text>
<rect x="70.0" y="394.0" width="250.0" height="38.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Читання неініціалізованого</text>
<rect x="330.0" y="394.0" width="420.0" height="38.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="342.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">узяв змінну до присвоєння → сміттєве значення</text>
<rect x="760.0" y="394.0" width="70.0" height="38.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1"/>
<text x="795.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">—</text>
<text x="450.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усі вони небезпечні передусім тому, що ТИХІ — не дають негайної помилки, а псують щось і йдуть далі (чому — нижче).</text>
