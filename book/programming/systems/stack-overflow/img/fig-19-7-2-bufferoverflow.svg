<text x="650.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сусіднє: інші дані / адреса повернення</text>
<line x1="544.0" y1="164.0" x2="600.0" y2="152.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="600.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">запис 12 байтів «перелився» за край — і затер сусідів</text>
<rect x="70.0" y="210.0" width="380.0" height="110.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="260.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок 1: крах</text>
<text x="90.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">затерта адреса повернення →</text>
<text x="90.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">функція «повернеться» в сміття →</text>
<text x="90.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стрибок у нікуди, аварія</text>
<text x="90.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(пам'ятаєте §19.5 — адреса на стеку?)</text>
<rect x="470.0" y="210.0" width="380.0" height="110.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="660.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок 2: злам (експлойт)</text>
<text x="490.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зловмисник навмисне підбирає «зайве»,</text>
<text x="490.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">щоб адреса повернення вказала на ЙОГО код →</text>
<text x="490.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">захоплення керування («smashing the stack»)</text>
<text x="490.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">— класична діра безпеки на десятиліття</text>
<text x="450.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь — відсутність перевірки меж: код пише, не глянувши, чи влазить. Дуже частий і дуже небезпечний баг.</text>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Запобігання: завжди перевіряй межі (індекс &lt; розмір), користуйся безпечними функціями, не довіряй довжині вхідних даних.</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Те саме буває й поза стеком (у купі, у глобальних) — будь-який запис за межу виділеного псує сусіднє.</text>
<text x="450.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Off-by-one» (на одиницю далі) — найтиповіша форма: цикл до &lt;= замість &lt;, забутий нуль-термінатор рядка тощо.</text>
</svg>
