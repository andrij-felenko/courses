<text x="195.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">буфер[512]</text>
<text x="195.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">коротке ім'я …</text>
<rect x="78.0" y="190.0" width="234.0" height="24.0" rx="3" fill="#eef3fb" stroke="#2457d6" stroke-width="1.2"/>
