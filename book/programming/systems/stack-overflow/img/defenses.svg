<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як захищатися: звички, що гасять більшість бід</text>
<rect x="60.0" y="64.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">перевіряй межі</text>
<text x="280.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">індекс &lt; розмір; не вір довжині вхідних даних</text>
<rect x="60.0" y="114.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ініціалізуй усе</text>
<text x="280.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">змінні й покажчики — одразу при оголошенні</text>
<rect x="60.0" y="164.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">звільняй рівно раз</text>
<text x="280.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">кожному allocate — один free, тоді обнули покажчик</text>
<rect x="60.0" y="214.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">бережи стек</text>
<text x="280.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">без нескінченної рекурсії й величезних локальних</text>
<rect x="60.0" y="264.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">на МК — статика</text>
<text x="280.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">статична / стекова пам'ять переважно над купою</text>
<rect x="60.0" y="314.0" width="600.0" height="42.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="76.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">інструменти й мови</text>
<text x="280.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">санітайзери, статичний аналіз; Rust гасить класи бід</text>
<text x="360.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">C/C++ на МК довіряє вам — дисципліна цілком на програмістові</text>
</svg>