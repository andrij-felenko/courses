<text x="460.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Урок для §3.6.7: переповнення буфера — не музейний експонат, а діра, що відчиняє машину чужому коду.</text>
<text x="460.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">Перевірка меж і відмова від «функцій без розміру» (як gets()) — пряма спадщина цієї ночі 1988-го.</text>
