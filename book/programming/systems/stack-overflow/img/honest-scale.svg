<text x="50.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">кожна клітинка ≈ 600 хостів · червоні ≈ ~6 000 із ~60 000</text>
<rect x="50.0" y="219.0" width="360.0" height="62.0" rx="6" fill="#fff6e6" stroke="#9a7322" stroke-width="1.5"/><text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Навіть «10%» — це здогад, а не вимір:</tspan><tspan x="230.0" dy="13.7">хтось припустив ~60 тис. хостів</tspan><tspan x="230.0" dy="13.7">і ~10% уражених. (перевірити)</tspan></text>
<text x="420.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Чому машини «лягали», хоч хробак</text>
<text x="420.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">нічого не стирав і не псував:</text>
<rect x="420.0" y="122.0" width="290.0" height="150.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/><text x="565.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Помилка в самому хроб'якові:</tspan><tspan x="565.0" dy="14.0">перш ніж заразити машину, він питав —</tspan><tspan x="565.0" dy="14.0">«я тут уже є?». Але щоб його не обманули</tspan><tspan x="565.0" dy="14.0">фальшивим «так», він однаково ставив</tspan><tspan x="565.0" dy="14.0">ще одну копію 1 раз із 7.</tspan><tspan x="565.0" dy="14.0">Копії множились на одній машині лавиною.</tspan></text>
<rect x="420.0" y="284.0" width="290.0" height="96.0" rx="6" fill="#f1f7f2" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Наслідок — не «знищення», а вичерпання:</tspan><tspan x="565.0" dy="13.7">процесор і пам'ять з'їдали десятки копій,</tspan><tspan x="565.0" dy="13.7">машина переставала відповідати (DoS).</tspan><tspan x="565.0" dy="13.7">Дані цілі — але працювати неможливо.</tspan></text>
<rect x="50.0" y="448.0" width="660.0" height="38.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="470.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Точніше: хробак не «вимкнув» мережу, а перевантажив тисячі машин до повного гальмування за лічені години.</tspan></text>
</svg>