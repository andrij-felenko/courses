<text x="608.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">засновано CERT/CC</text>
<text x="608.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">у Carnegie Mellon —</text>
<text x="608.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">координація реакції</text>
<text x="608.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">на інциденти</text>
<rect x="30.0" y="282.0" width="700.0" height="70.0" rx="6" fill="#f1f7f2" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="313.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Урок: переповнення буфера — не музейний експонат, а діра, що відчиняє машину чужому коду.</tspan><tspan x="380.0" dy="15.0">Перевірка меж і відмова від «функцій без розміру» (як gets()) — пряма спадщина цієї ночі 1988-го.</tspan></text>
