<line x1="590.0" y1="178.0" x2="590.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="610.0" y1="178.0" x2="610.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="630.0" y1="178.0" x2="630.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="650.0" y1="178.0" x2="650.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="560.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">регіон-вартовий</text>
<text x="560.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЖОДНОГО доступу</text>
<rect x="450.0" y="234.0" width="220.0" height="60.0" rx="4" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">.data сусіда</text>
<text x="560.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">цілий і недоторканий</text>
<line x1="560.0" y1="148.0" x2="560.0" y2="174.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="2,3"/>
<text x="560.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">перший же запис у вартового →</text>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">fault, чип спинено</text>
<text x="560.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">до псування сусіда</text>
<rect x="50.0" y="366.0" width="660.0" height="90.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Стек однаково «хоче» затопити сусіда в обох випадках — різниця в тому, що під ним лежить.</tspan><tspan x="380.0" dy="12.1">Без MPU нижче стека звичайна доступна пам'ять, тож перевитрата мовчки псує її, а симптом спливає геть в іншому місці.</tspan><tspan x="380.0" dy="12.1">З MPU під кожен стек кладуть тонкий регіон «жодного доступу»: перший же запис у нього — fault, і ядро спиняється РАНІШЕ.</tspan><tspan x="380.0" dy="12.1">Ось точна відповідь на «чому стек не затопить сусіда»: між ними — апаратна глуха стіна, а не просто порожнеча.</tspan></text>
</svg>