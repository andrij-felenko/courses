<line x1="470.0" y1="178.0" x2="470.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="490.0" y1="178.0" x2="490.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="510.0" y1="178.0" x2="510.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="530.0" y1="178.0" x2="530.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="550.0" y1="178.0" x2="550.0" y2="228.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
