<text x="190.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">.data сусіда</text>
<text x="190.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">звичайна доступна пам'ять</text>
<line x1="190.0" y1="148.0" x2="190.0" y2="282.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="2,3"/>
<text x="190.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стек переріс і мовчки</text>
<text x="190.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">затер .data сусіда —</text>
<text x="190.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">баг тихий, далекий, несталий</text>
<line x1="380.0" y1="84.0" x2="380.0" y2="350.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="560.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">з MPU</text>
<rect x="450.0" y="108.0" width="220.0" height="64.0" rx="4" fill="#eaf0fb" stroke="#2457d6" stroke-width="1.8"/>
