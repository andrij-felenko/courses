<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому біди пам'яті — найважчі для лову</text>
<rect x="60.0" y="64.0" width="600.0" height="42.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="76.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">тихі</text>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">не дають негайної помилки — псують пам'ять і йдуть далі, ніби все гаразд</text>
<rect x="60.0" y="114.0" width="600.0" height="42.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="76.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">далекі</text>
<text x="210.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">симптом виринає не там, де причина: зіпсував одне — впало інше, згодом</text>
<rect x="60.0" y="164.0" width="600.0" height="42.0" rx="8" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="76.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">несталі</text>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">залежать від таймінгу й даних: то є, то нема — важко відтворити</text>
<rect x="60.0" y="232.0" width="288.0" height="120.0" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="204.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="204.0" dy="0.0">на МК — гірше</tspan><tspan x="204.0" dy="14.3">захисту пам'яті немає →</tspan><tspan x="204.0" dy="14.3">хибний доступ ніхто не ловить,</tspan><tspan x="204.0" dy="14.3">а в полі ще й нема кому</tspan><tspan x="204.0" dy="14.3">перезапустити</tspan></text>
<rect x="372.0" y="232.0" width="288.0" height="120.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="516.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="516.0" dy="0.0">на ПК — легше</tspan><tspan x="516.0" dy="14.3">апаратний захист (MMU) + ОС</tspan><tspan x="516.0" dy="14.3">ловлять багато звернень «не туди»</tspan><tspan x="516.0" dy="14.3">→ програма падає одразу</tspan><tspan x="516.0" dy="14.3">(segfault), ближче до помилки</tspan></text>
</svg>