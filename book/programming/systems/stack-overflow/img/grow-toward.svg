<text x="250.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">стек</text>
<text x="250.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виклики, локальні</text>
<rect x="175.0" y="290.0" width="150.0" height="70.0" rx="0" fill="#fff6e6" stroke="#9a7322" stroke-width="1.7"/>
<text x="250.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9a7322" text-anchor="middle" font-weight="700">купа + дані</text>
<text x="250.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вгору ↑</text>
<text x="250.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вільний простір</text>
<line x1="151.0" y1="88.0" x2="151.0" y2="190.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="145.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">вниз</text>
<line x1="349.0" y1="342.0" x2="349.0" y2="240.0" stroke="#9a7322" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="355.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7322" text-anchor="start" font-weight="700">вгору</text>
<line x1="175.0" y1="249.0" x2="325.0" y2="249.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="250.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">дороста до купи → псують одне одного</text>
<rect x="470.0" y="90.0" width="210.0" height="110.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">ПК</tspan><tspan x="575.0" dy="14.3">апаратний захист (MMU) +</tspan><tspan x="575.0" dy="14.3">ОС ловлять наїзд → програму</tspan><tspan x="575.0" dy="14.3">обривають одразу (segfault)</tspan></text>
<rect x="470.0" y="220.0" width="210.0" height="120.0" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">МК</tspan><tspan x="575.0" dy="14.3">захисту пам'яті немає →</tspan><tspan x="575.0" dy="14.3">стек ТИХО перезаписує</tspan><tspan x="575.0" dy="14.3">купу/дані, і пристрій</tspan><tspan x="575.0" dy="14.3">починає «дуріти»</tspan></text>
