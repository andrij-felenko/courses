<rect x="50.0" y="348.0" width="660.0" height="66.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="377.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Два правила гасять цілі класи бід: код позначено «лише читати», дані — «не виконувати» (NX, no-execute),</tspan><tspan x="380.0" dy="13.7">а регістри периферії доступні «лише з привілейованого режиму» — звичайна задача їх навіть не торкнеться.</tspan></text>
