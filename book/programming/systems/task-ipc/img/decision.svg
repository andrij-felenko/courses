<rect x="50.0" y="232.0" width="360.0" height="40.0" rx="6" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">захистити СПІЛЬНИЙ РЕСУРС (один за раз)</tspan></text>
