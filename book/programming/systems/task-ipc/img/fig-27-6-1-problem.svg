<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Задачі незалежні — та мусять і спілкуватися, і ділити ресурси</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«голі» спільні змінні дають гонку (§27.5); потрібні БЕЗПЕЧНІ канали</text>
<rect x="80.0" y="110.0" width="180.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="170.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Задача A</text>
<text x="170.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">має дані</text>
<rect x="700.0" y="110.0" width="180.0" height="60.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="790.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Задача B</text>
<text x="790.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">потребує їх</text>
<rect x="400.0" y="100.0" width="160.0" height="36.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="480.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">гола змінна</text>
<line x1="260.0" y1="130.0" x2="398.0" y2="118.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="700.0" y1="130.0" x2="562.0" y2="118.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="480.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ одночасний доступ → гонка</text>
<rect x="140.0" y="220.0" width="300.0" height="56.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="290.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1) передати ДАНІ</text>
<text x="290.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(A → B: відлік, команда…)</text>
<rect x="520.0" y="220.0" width="300.0" height="56.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="670.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2) поділити РЕСУРС</text>
<text x="670.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(шина, периферія, змінна)</text>
<rect x="150.0" y="300.0" width="660.0" height="44.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RTOS дає для цього готові БЕЗПЕЧНІ засоби: чергу, семафор, м'ютекс —</text>
<text x="480.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усі вони поступливі (блокуються, не морозячи) й захищені від гонок.</text>
</svg>
