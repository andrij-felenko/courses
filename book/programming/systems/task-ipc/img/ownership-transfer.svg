<text x="230.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">наповнив</text>
<line x1="422.9" y1="130.0" x2="588.2" y2="130.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">send(вказівник)</text>
<rect x="60.0" y="180.0" width="230.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="175.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="175.0" dy="0.0">від миті send виробник</tspan><tspan x="175.0" dy="13.0">буфера НЕ торкається</tspan></text>
<rect x="450.0" y="180.0" width="230.0" height="50.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="565.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="565.0" dy="0.0">споживач вживає</tspan><tspan x="565.0" dy="13.0">й повертає в пул</tspan></text>
<text x="370.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">копіювання 256 Б нема; ціна — дисципліна «передав — забув»</text>
