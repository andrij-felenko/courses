<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавання володіння буфером через чергу</text>
<rect x="70.2" y="114.0" width="79.5" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="110.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">виробник</tspan></text>
<rect x="319.1" y="114.0" width="101.8" height="32.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/><text x="370.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">буфер 256 Б</tspan></text>
<rect x="590.2" y="114.0" width="79.5" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="630.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">споживач</tspan></text>
