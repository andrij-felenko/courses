<rect x="78.8" y="67.3" width="122.3" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="140.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">керування шиною</tspan><tspan x="140.0" dy="14.3">ВИСОКА</tspan></text>
<rect x="109.5" y="227.3" width="60.9" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="140.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">метео</tspan><tspan x="140.0" dy="14.3">НИЗЬКА</tspan></text>
