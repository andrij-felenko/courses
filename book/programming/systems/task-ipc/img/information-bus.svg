<line x1="201.2" y1="95.0" x2="324.1" y2="104.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="170.5" y1="245.0" x2="284.8" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">бере часто, коротко</text>
<text x="300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">бере рідко, тримає довго</text>
<text x="590.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle"><tspan x="590.0" dy="0.0">тисне процесор,</tspan><tspan x="590.0" dy="11.7">замка НЕ торкається</tspan></text>
<text x="360.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дизайн виглядає бездоганно — пастка у взаємодії пріоритетів</text>
