<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 891.4 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="891.4" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прірва затримок між процесором та пристроями вводу-виводу</text>
<rect x="15.0" y="15.0" width="810.0" height="330.0" rx="10" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прірва затримок: чому ввід-вивід вимагає зупинки або асинхронності</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Порівняння часу доступу в реальних одиницях та в масштабі процесорних тактів (3.3 ГГц)</text>
<text x="35.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Регістри CPU / L1-кеш</text>
<text x="255.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">0.3 – 1 нс</text>
<rect x="350.0" y="91.0" width="34.1" height="24.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="396.1" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">1 – 3 такти</text>
<text x="35.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Оперативна пам'ять (DRAM)</text>
<text x="255.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">50 – 100 нс</text>
<rect x="350.0" y="137.0" width="73.2" height="24.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="435.2" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">150 – 300 тактів</text>
<text x="35.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Твердотільний диск (NVMe SSD)</text>
<text x="255.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">10 – 50 мкс</text>
<rect x="350.0" y="183.0" width="151.2" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="513.2" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">30 000 – 150 000 тактів</text>
<text x="35.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Локальна мережа (10 GbE LAN)</text>
<text x="255.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">50 – 200 мкс</text>
<rect x="350.0" y="229.0" width="229.3" height="24.0" rx="4" fill="#fff1f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="591.3" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">150 000 – 600 000 тактів</text>
<text x="35.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Інтернет / WAN (через континент)</text>
<text x="255.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">50 – 150 мс</text>
<rect x="350.0" y="275.0" width="336.6" height="24.0" rx="4" fill="#fff1f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="698.6" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">150 000 000 – 500 000 000 тактів</text>
<line x1="35.0" y1="305.0" x2="805.0" y2="305.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="420.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Поки CPU чекає 1 пакет з мережі (100 мс), він міг би виконати 300 мільйонів обчислень</text>
</svg>