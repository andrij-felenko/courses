<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Журнал росте лише в кінець; для ключа чинний — НАЙНОВІШИЙ запис</text>
<rect x="30.0" y="74.0" width="118.0" height="52.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="89.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="89.0" dy="0.0">гучність=5</tspan></text>
<rect x="154.0" y="74.0" width="118.0" height="52.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="213.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="213.0" dy="0.0">яскр.=8</tspan></text>
<rect x="278.0" y="74.0" width="118.0" height="52.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="337.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="337.0" dy="0.0">гучність=7</tspan></text>
<rect x="402.0" y="74.0" width="118.0" height="52.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="461.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="461.0" dy="0.0">яскр.=8</tspan></text>
<rect x="526.0" y="74.0" width="118.0" height="52.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="585.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">гучність=9</tspan></text>
<line x1="30.0" y1="146.0" x2="644.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="644.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">напрям запису →</text>
<text x="30.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">старе ← сірі: перекриті пізнішим записом того ж ключа; зелені: чинні</text>
<text x="400.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Читаємо ключ «гучність» → сканом знаходимо ОСТАННІЙ його запис = 9.</text>
<text x="400.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Старі версії лишилися лежати як мертвий баласт — їх приберуть згодом.</text>
</svg>