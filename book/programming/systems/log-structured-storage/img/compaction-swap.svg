<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ущільнення поряд: живе → чистий журнал B; один перемикач робить B активним</text>
<text x="40.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Журнал A (активний): живе + мертве</text>
<rect x="40.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="73.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="73.0" dy="0.0">a=1</tspan></text>
<rect x="111.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="144.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="144.0" dy="0.0">b=2</tspan></text>
<rect x="182.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#f0f1f2" stroke="#c3c7cc" stroke-width="1.5"/><text x="215.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="215.0" dy="0.0">a=5</tspan></text>
<rect x="253.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="286.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="286.0" dy="0.0">c=3</tspan></text>
<rect x="324.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="357.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="357.0" dy="0.0">b=8</tspan></text>
<rect x="395.0" y="78.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="428.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="428.0" dy="0.0">a=9</tspan></text>
<text x="40.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стоїть НЕДОТОРКАНИМ, поки збираємо B</text>
<line x1="420.0" y1="162.0" x2="420.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="432.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">переписуємо ЛИШЕ живе (за покажчиком)</text>
<text x="40.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Журнал B (чистий): тільки живі версії</text>
<rect x="40.0" y="220.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="73.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="73.0" dy="0.0">c=3</tspan></text>
<rect x="111.0" y="220.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="144.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="144.0" dy="0.0">b=8</tspan></text>
<rect x="182.0" y="220.0" width="66.0" height="44.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="215.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">a=9</tspan></text>
<rect x="253.0" y="220.0" width="208.0" height="44.0" rx="6" fill="#ffffff" stroke="#c3c7cc" stroke-width="1.5"/>
<text x="357.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">вільне</text>
<rect x="254.0" y="300.8" width="332.0" height="34.5" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ПЕРЕМИКАЧ (окрема печатка): активний = B</tspan></text>
<text x="420.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один атомарний запис фіксує все: до нього чинний A, після — B; лише тоді стираємо A</text>
</svg>