<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек має контракт вирівнювання на межі виклику (AAPCS: кратно 8)</text>
<rect x="70.0" y="86.0" width="360.0" height="340.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ SP кратний 8 на виклику</text>
<rect x="130.0" y="136.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="122.0" y="158.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end" font-weight="700">0x2000</text>
<text x="230.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(вище — старе)</text>
<rect x="130.0" y="176.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="122.0" y="198.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end" font-weight="700">0x1ff8</text>
<text x="230.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">збережені r4..r7</text>
<rect x="130.0" y="216.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="122.0" y="238.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end" font-weight="700">0x1ff0</text>
<text x="230.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">локальні змінні</text>
<rect x="130.0" y="256.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="122.0" y="278.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end" font-weight="700">0x1fe8</text>
<text x="230.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SP → сюди, 0x1fe8</text>
<rect x="90.0" y="300.0" width="320.0" height="46.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="250.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x1FE8 mod 8 = 0 →</text>
<text x="250.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">STRD / VSTR / PUSH {d8} у чужій функції — ОК</text>
<rect x="510.0" y="86.0" width="360.0" height="340.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="690.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗ SP кратний лише 4</text>
<rect x="570.0" y="136.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="562.0" y="158.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end">0x2000</text>
<text x="670.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(вище — старе)</text>
<rect x="570.0" y="176.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="562.0" y="198.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#27ae60" text-anchor="end">0x1ff8</text>
<text x="670.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">збережені регістри</text>
<rect x="570.0" y="216.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="562.0" y="238.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="700">0x1ff4</text>
<text x="670.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">непарне число слотів</text>
<rect x="570.0" y="256.0" width="200.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="562.0" y="278.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="700">0x1fec</text>
<text x="670.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SP → сюди, 0x1fec</text>
<rect x="530.0" y="300.0" width="320.0" height="46.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="690.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">0x1FEC mod 8 = 4 →</text>
<text x="690.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">STRD за цією SP → HardFault у чужому коді</text>
<rect x="70.0" y="400.0" width="800.0" height="52.0" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="470.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контракт AAPCS: на вході в будь-яку функцію SP кратний 8. Твоя функція мусить лишити його таким для викликаних.</text>
<text x="470.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Компілятор тримає це сам — небезпека лише в асемблері та при ручному перемиканні стеків.</text>
</svg>