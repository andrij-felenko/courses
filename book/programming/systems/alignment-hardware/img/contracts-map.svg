<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратні контракти вирівнювання, що їх зустрічає системний код</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен рядок — контракт, який залізо чи рантайм накидають на адресу буфера.</text>
<rect x="40.0" y="92.0" width="880.0" height="34.0" rx="8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="130.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">вимагач</text>
<text x="470.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">яка кратність</text>
<text x="690.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">як карає порушення</text>
<text x="830.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">рятунок</text>
<rect x="40.0" y="126.0" width="880.0" height="62.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
<text x="130.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">DMA-буфер</text>
<text x="470.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">слово, часто рядок кешу</text>
<text x="690.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">не піде або зіпсує дані</text>
<text x="830.0" y="162.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">alignas(32)</text>
<rect x="40.0" y="194.0" width="880.0" height="62.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
<text x="130.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Рядок кешу</text>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">розмір рядка (32/64)</text>
<text x="690.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">штраф + хибне ділення</text>
<text x="830.0" y="230.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">align на рядок</text>
<rect x="40.0" y="262.0" width="880.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="130.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Атомік / lock-free</text>
<text x="470.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">розмір типу (4/8)</text>
<text x="690.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">втрата неподільності</text>
<text x="830.0" y="298.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">природне вирівн.</text>
<rect x="40.0" y="330.0" width="880.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="130.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">LDREX / STREX</text>
<text x="470.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">слово; Normal-память</text>
<text x="690.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">HardFault</text>
<text x="830.0" y="366.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">не на периферію</text>
<rect x="40.0" y="398.0" width="880.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="130.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SIMD (MOVAPS)</text>
<text x="470.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">16 / 32 / 64</text>
<text x="690.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">#GP навіть на x86</text>
<text x="830.0" y="434.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MOVUPS / alignas</text>
<rect x="40.0" y="466.0" width="880.0" height="62.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="130.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стек (AAPCS)</text>
<text x="470.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">8 на межі виклику</text>
<text x="690.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чужий код падає</text>
<text x="830.0" y="502.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">лишає компілятор</text>
<rect x="40.0" y="534.0" width="880.0" height="62.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="130.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сторінка MMU</text>
<text x="470.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">розмір сторінки 4 КБ</text>
<text x="690.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">mmap/DMA не ляжуть</text>
<text x="830.0" y="570.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">aligned_alloc</text>
</svg>