<text x="480.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">invalidate рядка викидає й чужі байти в ньому: втратиш свіжий запис CPU або отримаєш старе від DMA.</text>
<text x="480.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий рядок кешу не може бути водночас «за CPU» і «за DMA» — межа мусить збігтися з рядком.</text>
