<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тонкість запуску: як глобальні змінні дістають початкові значення</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">початкові значення мусять пережити вимкнення (отже, у Flash) — та змінні мінливі (отже, в RAM). Розв'язок: копія при старті</text>
<rect x="90.0" y="100.0" width="300.0" height="200.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="240.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FLASH (нелетка)</text>
<rect x="112.0" y="140.0" width="256.0" height="36.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="124.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">.text — код (виконується тут)</text>
<rect x="112.0" y="184.0" width="256.0" height="36.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="124.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">.rodata — сталі (читаються тут)</text>
<rect x="112.0" y="228.0" width="256.0" height="36.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.4"/>
<text x="124.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">початкові значення .data</text>
<text x="240.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе це пережило вимкнення</text>
<rect x="510.0" y="100.0" width="300.0" height="200.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="660.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">RAM (летка)</text>
<rect x="532.0" y="184.0" width="256.0" height="36.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.4"/>
<text x="660.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">.data (вже з копією значень)</text>
<rect x="532.0" y="228.0" width="256.0" height="36.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="660.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">.bss → обнулено</text>
<line x1="372.0" y1="246.0" x2="528.0" y2="202.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="450.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">КОПІЯ при старті</text>
<line x1="660.0" y1="300.0" x2="660.0" y2="268.0" stroke="#1f47b5" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#aBlue)"/>
<text x="660.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">обнуляється на старті</text>
<rect x="60.0" y="332.0" width="780.0" height="92.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перед запуском main() крихітний стартовий код КОПІЮЄ початкові значення .data з Flash у RAM і ОБНУЛЯЄ .bss.</text>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому глобальна змінна щоразу стартує зі свого початкового значення — воно зберігалося у Flash і скопіювалося в RAM.</text>
<text x="450.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Як саме це робить тулчейн (стартовий код, секції) — Розділ 21; тут досить розуміти ЧОМУ потрібна ця копія.</text>
</svg>
