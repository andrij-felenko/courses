<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чи пам'ятає пам'ять дані без живлення?</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">RAM забуває все при вимкненні; Flash зберігає</text>
<rect x="40.0" y="76.0" width="330.0" height="224.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="205.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">RAM — летка (volatile)</text>
<rect x="64.0" y="118.0" width="130.0" height="58.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="129.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="129.0" dy="0.0">живлення є</tspan><tspan x="129.0" dy="14.3">дані: 0x41</tspan></text>
<line x1="200.0" y1="147.0" x2="232.0" y2="147.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="118.0" width="106.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="293.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="293.0" dy="0.0">вимкнули</tspan><tspan x="293.0" dy="14.3">пусто</tspan></text>
<text x="205.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">як напис на дошці: згасло світло — стерлось</text>
<text x="205.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">тримає біт зворотним зв'язком, як тригер</text>
<text x="205.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">без струму петля рветься — біт забутий</text>
<text x="205.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">робоча пам'ять: змінні, стек, купа</text>
<rect x="390.0" y="76.0" width="330.0" height="224.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="555.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Flash — нелетка (non-volatile)</text>
<rect x="414.0" y="118.0" width="130.0" height="58.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="479.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="479.0" dy="0.0">живлення є</tspan><tspan x="479.0" dy="14.3">дані: код</tspan></text>
<line x1="550.0" y1="147.0" x2="582.0" y2="147.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="590.0" y="118.0" width="106.0" height="58.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="643.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="643.0" dy="0.0">вимкнули</tspan><tspan x="643.0" dy="14.3">код цілий</tspan></text>
<text x="555.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">як чорнило на папері: лишається без живлення</text>
<text x="555.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">пам'ятає фізично: заряд у плавучому затворі</text>
<text x="555.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">заряд нікуди не дівається без струму</text>
<text x="555.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">постійна пам'ять: програма, сталі</text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тому прошита програма лишається у Flash після вимкнення,</text>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">а змінна в RAM обнуляється при кожному ввімкненні.</text>
</svg>