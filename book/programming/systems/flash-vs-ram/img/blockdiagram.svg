<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прошивка живе в окремому чипі поруч із SoC</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">у ESP32 ядро та RAM на кристалі, а програму тримає сусідній флеш-чип через шину SPI</text>
<rect x="40.0" y="90.0" width="300.0" height="220.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="190.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">SoC (ESP32)</text>
<text x="190.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">усе на одному кристалі</text>
<rect x="62.0" y="144.0" width="120.0" height="50.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="122.0" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">ядро CPU</tspan><tspan x="122.0" dy="13.7">виконує код</tspan></text>
<rect x="198.0" y="144.0" width="120.0" height="50.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="258.0" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">SRAM</tspan><tspan x="258.0" dy="13.7">змінні (летка)</tspan></text>
<rect x="62.0" y="202.0" width="120.0" height="50.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="122.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">кеш</tspan><tspan x="122.0" dy="13.7">гарячий код</tspan></text>
<rect x="198.0" y="202.0" width="120.0" height="50.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.5"/><text x="258.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">контролер</tspan><tspan x="258.0" dy="13.7">SPI-флеші</tspan></text>
<text x="190.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">вбудованої Flash тут крихітна частка або нема —</text>
<text x="190.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">на цілу програму місця бракує</text>
<line x1="340.0" y1="218.0" x2="480.0" y2="218.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="340.0" y1="232.0" x2="480.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="340.0" y1="246.0" x2="480.0" y2="246.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="340.0" y1="260.0" x2="480.0" y2="260.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="404.0" y1="246.0" x2="426.0" y2="246.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="426.0" y1="260.0" x2="404.0" y2="260.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">шина SPI · 4 дроти</text>
<rect x="480.0" y="110.0" width="240.0" height="180.0" rx="12" fill="#fdf4f4" stroke="#c0392b" stroke-width="2.2"/>
<text x="600.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">зовнішній чип SPI-NOR-флеші</text>
<text x="600.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">клас W25Q · корпус SOIC-8</text>
<rect x="502.0" y="166.0" width="196.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="600.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">прошивка (код + сталі)</tspan><tspan x="600.0" dy="13.0">.text · .rodata · ресурси</tspan></text>
<text x="600.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">нелетка: лишається після вимкнення</text>
<text x="600.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">об'єм — мегабайти, недорого</text>
<text x="600.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">як читає й пише — NOR і XIP, нижче</text>
<rect x="40.0" y="330.0" width="680.0" height="56.0" rx="10" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поділ той самий: змінні — у швидкій леткій SRAM на кристалі; код і сталі — у місткій нелеткій флеші.</text>
<text x="380.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Лише тепер флеш — не всередині мікросхеми процесора, а окремим чипом поруч, через шину SPI.</text>
</svg>