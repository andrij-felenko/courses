<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416">
<rect width="900" height="416" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний поділ пам'яті: летка (RAM) vs нелетка (Flash)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чи пам'ятає вона дані БЕЗ живлення? RAM забуває все при вимкненні; Flash зберігає</text>
<rect x="70.0" y="92.0" width="380.0" height="230.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="260.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">RAM — ЛЕТКА (volatile)</text>
<rect x="100.0" y="134.0" width="150.0" height="70.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="175.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">живлення ON</text>
<text x="175.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дані: 0x41 ✓</text>
<line x1="258.0" y1="169.0" x2="308.0" y2="169.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="316.0" y="134.0" width="120.0" height="70.0" rx="8" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="376.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">OFF</text>
<text x="376.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">пусто ✗</text>
<text x="260.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як дошка, що стирається, щойно згасне світло</text>
<text x="260.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тримає біт, лише поки тече струм — як тригер (§16)</text>
<text x="260.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">робоча пам'ять: змінні, стек, купа</text>
<text x="260.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(дешевша на біт, дуже швидка)</text>
<rect x="450.0" y="92.0" width="380.0" height="230.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="640.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Flash — НЕЛЕТКА (non-volatile)</text>
<rect x="480.0" y="134.0" width="150.0" height="70.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="555.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">живлення ON</text>
<text x="555.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дані: код ✓</text>
<line x1="638.0" y1="169.0" x2="688.0" y2="169.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="696.0" y="134.0" width="120.0" height="70.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="756.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">OFF</text>
<text x="756.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">код ✓ ціле!</text>
<text x="640.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як чорнило на папері — лишається без живлення</text>
<text x="640.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пам'ятає фізично (заряд у плавучому затворі)</text>
<text x="640.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">постійна пам'ять: програма, сталі</text>
<text x="640.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(тому ваш скетч лишається після вимкнення)</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось чому програма «не зникає», коли ви від'єднуєте плату, а змінні обнуляються при кожному перезапуску:</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">програма живе в нелеткій Flash, а змінні — в леткій RAM. Це найпрактичніший поділ у всій пам'яті.</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(термін «летка»/«volatile» ще зустрінеться як ключове слово мови — Розділ 23 — та поки йдеться про фізику пам'яті)</text>
</svg>
