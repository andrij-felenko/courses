<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що куди: незмінне — у Flash, мінливе — в RAM</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це фізичне пояснення поділу RO/RW із §19.2: властивості даних диктують, у якій пам'яті їм жити</text>
<rect x="70.0" y="90.0" width="380.0" height="230.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="260.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FLASH (нелетка, повільніший запис)</text>
<rect x="96.0" y="134.0" width="328.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="116.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">.text — КОД</text>
<text x="116.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">інструкції програми</text>
<rect x="96.0" y="190.0" width="328.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="116.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">.rodata — СТАЛІ</text>
<text x="116.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">рядки, таблиці</text>
<text x="260.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">чому сюди:</text>
<text x="260.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• не міняються під час роботи</text>
<text x="260.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• мусять пережити вимкнення</text>
<rect x="450.0" y="90.0" width="380.0" height="230.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="640.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">RAM (летка, швидка, побайтна)</text>
<rect x="476.0" y="134.0" width="328.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="496.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">.data / .bss — ГЛОБАЛЬНІ</text>
<text x="496.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">змінні стану програми</text>
<rect x="476.0" y="190.0" width="328.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="496.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">стек і купа</text>
<text x="496.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">локальні, динамічні (§19.5–6)</text>
<text x="640.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">чому сюди:</text>
<text x="640.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• міняються постійно (потрібен швидкий запис)</text>
<text x="640.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• тимчасові — не шкода, що зникнуть</text>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило просте: незмінне й цінне (код, сталі) — у нелетку Flash; мінливе й тимчасове (змінні) — у швидку RAM.</text>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це й була причина групування RO/RW у карті §19.2 — фізика двох пам'ятей диктує, де чому місце.</text>
<text x="450.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На МК RAM зазвичай МІЗЕРНА (кілобайти), а Flash більша — тож великі сталі таблиці тримають у Flash, щоб берегти RAM.</text>
</svg>
