<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три аксіоми Карла Г'юїтта: реакція на вхідне повідомлення</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">У відповідь на кожне вилучене повідомлення актор може виконати виключно ці три дії</text>
<rect x="60.0" y="175.0" width="200.0" height="70.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="160.0" dy="0.0">Актор опрацьовує</tspan><tspan x="160.0" dy="15.0">вхідне повідомлення M</tspan><tspan x="160.0" dy="15.0">(одиничний крок)</tspan></text>
<rect x="370.0" y="80.0" width="220.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="480.0" dy="0.0">1. Надіслати повідомлення</tspan><tspan x="480.0" dy="14.3">скінченній кількості</tspan><tspan x="480.0" dy="14.3">відомих адрес (PID)</tspan></text>
<rect x="640.0" y="80.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">send(pid_b, Msg1)</tspan><tspan x="740.0" dy="13.7">send(pid_c, Msg2)</tspan></text>
<line x1="260.0" y1="190.0" x2="368.0" y2="115.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="112.0" x2="638.0" y2="112.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370.0" y="178.0" width="220.0" height="64.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="480.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Створити акторів</tspan><tspan x="480.0" dy="14.3">скінченне число нових</tspan><tspan x="480.0" dy="14.3">акторів (Spawn child)</tspan></text>
<rect x="640.0" y="178.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="740.0" y="206.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">new_pid = spawn(Actor)</tspan><tspan x="740.0" dy="13.7">ієрархія потомків</tspan></text>
<line x1="260.0" y1="210.0" x2="368.0" y2="210.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="210.0" x2="638.0" y2="210.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370.0" y="276.0" width="220.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="297.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="480.0" dy="0.0">3. Змінити поведінку</tspan><tspan x="480.0" dy="14.3">визначити нову логіку/стан</tspan><tspan x="480.0" dy="14.3">для наступного msg</tspan></text>
<rect x="640.0" y="276.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">become(next_behavior)</tspan><tspan x="740.0" dy="13.7">state' = f(state, M)</tspan></text>
<line x1="260.0" y1="230.0" x2="368.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="308.0" x2="638.0" y2="308.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="358.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ніяких додаткових побічних дій на спільну пам'ять: стан оновлюється лише переходом у нову поведінку.</tspan><tspan x="440.0" dy="14.3">Усі породжені повідомлення й нові актори стають активними після завершення поточного кроку.</tspan></text>
</svg>