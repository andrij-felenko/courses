<rect x="40.0" y="355.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Актор не блокує потік ОС: після обробки невеликої порції повідомлень (або витрати кванта редукцій)</tspan><tspan x="440.0" dy="14.3">він поступається потоком, повертаючись у чергу готових. Пасивні актори пам'ять не навантажують.</tspan></text>
