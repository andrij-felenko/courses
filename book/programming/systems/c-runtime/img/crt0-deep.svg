<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">crt0 зблизька: три передумови і що зламається без кожної</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок строгий (згори вниз):</text>
<rect x="100.0" y="66.0" width="560.0" height="74.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/>
<text x="116.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="start" font-weight="700">1. Вказівник стека (SP)</text>
<text x="116.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ставить векторний reset ще ДО будь-якого виклику</text>
<text x="116.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">без нього: перший виклик функції валить машину</text>
<rect x="100.0" y="160.0" width="560.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="116.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Копія .data: Flash → RAM</text>
<text x="116.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">початкові значення — у Flash, змінні живуть у RAM</text>
<text x="116.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">без неї: ініціалізований глобал = сміття</text>
<rect x="100.0" y="254.0" width="560.0" height="74.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="116.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Обнулення .bss</text>
<text x="116.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">стандарт C: нульовий глобал = 0 на старті</text>
<text x="116.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">без нього: нульовий глобал = сміття</text>
<line x1="380.0" y1="142.0" x2="380.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="236.0" x2="380.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Спершу стек — інакше crt0 зруйнує власний стек, записуючи в RAM-діапазон .bss</text>
</svg>