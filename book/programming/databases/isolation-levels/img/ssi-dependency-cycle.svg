<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф серіалізовності та виявлення конфліктів у SSI</text>
<text x="510.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф прямих залежностей (DSG) та виявлення небезпечної структури в SSI</text>
<rect x="117.5" y="123.0" width="245.1" height="73.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="240.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Транзакція T1 (Аліса)</tspan><tspan x="240.0" dy="14.3">• Читає стан Боба (r_1[Bob])</tspan><tspan x="240.0" dy="14.3">• Записує стан Аліси (w_1[Alice])</tspan><tspan x="240.0" dy="14.3">• Фіксується (c_1)</tspan></text>
<rect x="664.3" y="123.0" width="231.4" height="73.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="780.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Транзакція T2 (Боб)</tspan><tspan x="780.0" dy="14.3">• Читає стан Аліси (r_2[Alice])</tspan><tspan x="780.0" dy="14.3">• Записує стан Боба (w_2[Bob])</tspan><tspan x="780.0" dy="14.3">• Фіксується (c_2)</tspan></text>
<line x1="370.0" y1="130.0" x2="645.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.5" y="93.5" width="289.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">rw-антизалежність (r_1[Bob] ──rw──&gt; w_2[Bob])</tspan><tspan x="510.0" dy="13.0">T1 прочитала версію до запису T2</tspan></text>
<line x1="645.0" y1="190.0" x2="370.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="353.1" y="193.5" width="313.8" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">rw-антизалежність (r_2[Alice] ──rw──&gt; w_1[Alice])</tspan><tspan x="510.0" dy="13.0">T2 прочитала версію до запису T1</tspan></text>
<rect x="198.5" y="279.4" width="623.0" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="510.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Теорема Фекете-Кехіла (2008): Кожен несеріалізовний цикл у Snapshot Isolation</tspan><tspan x="510.0" dy="14.3">містить небезпечну структуру (Dangerous Structure) з двох послідовних rw-антизалежностей:</tspan></text>
<rect x="129.3" y="374.4" width="141.4" height="41.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Попередня транзакція</tspan><tspan x="200.0" dy="14.3">T_in</tspan></text>
<rect x="367.0" y="365.2" width="286.0" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/><text x="510.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">PIVOT ТРАНЗАКЦІЯ T_p</tspan><tspan x="510.0" dy="14.3">Вхідний rw-конфлікт (inConflict=true)</tspan><tspan x="510.0" dy="14.3">Вихідний rw-конфлікт (outConflict=true)</tspan></text>
<rect x="752.4" y="374.4" width="135.1" height="41.3" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Наступна транзакція</tspan><tspan x="820.0" dy="14.3">T_out</tspan></text>
<line x1="295.0" y1="395.0" x2="365.0" y2="395.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">rw-edge</text>
<line x1="655.0" y1="395.0" x2="725.0" y2="395.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">rw-edge</text>
<rect x="106.4" y="464.4" width="807.1" height="41.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="481.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Рішення SSI в СУБД (PostgreSQL): При виявленні двох суміжних rw-ребер рушій аварійно відкочує</tspan><tspan x="510.0" dy="14.3">транзакцію-півот (Pivot) з помилкою 40001 (serialization_failure), розриваючи потенційний цикл без важких блокувань.</tspan></text>
</svg>