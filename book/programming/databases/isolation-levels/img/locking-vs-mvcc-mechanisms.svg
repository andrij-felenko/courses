<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури 2PL та MVCC</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектур: Двофазне блокування (2PL) проти Багатоверсійності (MVCC)</text>
<rect x="40.0" y="60.0" width="460.0" height="430.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="270.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Двофазне блокування (2PL / Strict 2PL)</text>
<rect x="111.0" y="112.5" width="318.1" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Песимістичний підхід (Pessimistic Concurrency)</tspan><tspan x="270.0" dy="13.0">• Читач бере Shared Lock (S-lock)</tspan><tspan x="270.0" dy="13.0">• Письменник бере Exclusive Lock (X-lock)</tspan><tspan x="270.0" dy="13.0">• Читачі блокують письменників, письменники — читачів</tspan></text>
<rect x="79.6" y="227.5" width="380.8" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Конфліктна матриця блокувань:</tspan><tspan x="270.0" dy="13.0">• S-lock + S-lock  ──►  СУМІСНІ (одночасне читання)</tspan><tspan x="270.0" dy="13.0">• S-lock + X-lock  ──►  КОНФЛІКТ (читач/письменник чекає)</tspan><tspan x="270.0" dy="13.0">• X-lock + X-lock  ──►  КОНФЛІКТ (взаємне очікування / Deadlock)</tspan></text>
<rect x="96.7" y="364.0" width="346.6" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="380.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Переваги: Абсолютна простота математичних гарантій.</tspan><tspan x="270.0" dy="13.0">Ціна: Низька пропускна здатність на високому навантаженні,</tspan><tspan x="270.0" dy="13.0">небезпека взаємних блокувань (Deadlocks), простої черг.</tspan></text>
<rect x="540.0" y="60.0" width="460.0" height="430.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Багатоверсійність (MVCC + Snapshot)</text>
<rect x="605.2" y="112.5" width="329.5" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Оптимістичний підхід зі знімками стану</tspan><tspan x="770.0" dy="13.0">• Читачі НЕ блокують письменників</tspan><tspan x="770.0" dy="13.0">• Письменники НЕ блокують читачів</tspan><tspan x="770.0" dy="13.0">• Кожен запис створює нову версію кортежу (xmin / xmax)</tspan></text>
<rect x="588.1" y="227.5" width="363.7" height="65.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Механіка знімка (Snapshot Visibility):</tspan><tspan x="770.0" dy="13.0">• Транзакція T бачить версії з xmin &lt; T.snapshot_id</tspan><tspan x="770.0" dy="13.0">• Читання повертає історичний знімок на момент старту</tspan><tspan x="770.0" dy="13.0">• Конфлікт виникає лише при паралельному записі (Write-Write)</tspan></text>
<rect x="593.9" y="364.0" width="352.3" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="380.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Переваги: Колосальна швидкість читання без затримок.</tspan><tspan x="770.0" dy="13.0">Ціна: Накопичення мертвих версій (потрібен VACUUM / GC),</tspan><tspan x="770.0" dy="13.0">складність виявлення аномалій (потрібен SSI для строгості).</tspan></text>
<rect x="179.8" y="493.5" width="680.4" height="23.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="520.0" y="508.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головний закон сучасних СУБД: Readers never block Writers, and Writers never block Readers (MVCC).</tspan></text>
</svg>