<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="50.0" width="820.0" height="85.0" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
<rect x="40.0" y="50.0" width="220.0" height="85.0" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="1.8"/>
<text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1NF (Перша нормальна форма)</text>
<text x="280.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Атомарність значень: усунення списків, повторюваних груп та масивів у полях</text>
<text x="280.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Правило: Кожен атрибут містить неподільне скалярне значення з базового домену.</text>
<rect x="40.0" y="160.0" width="820.0" height="85.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
<rect x="40.0" y="160.0" width="220.0" height="85.0" rx="0" fill="#0d9488" stroke="#0d9488" stroke-width="1.8"/>
<text x="150.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2NF (Друга нормальна форма)</text>
<text x="280.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Усунення часткових функціональних залежностей від складеного первинного ключа</text>
<text x="280.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Правило: Кожен неключовий атрибут функціонально повно залежить від усього ключа (X → Y, де X = PK).</text>
<rect x="40.0" y="270.0" width="820.0" height="85.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<rect x="40.0" y="270.0" width="220.0" height="85.0" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/>
<text x="150.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3NF (Третя нормальна форма)</text>
<text x="280.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Усунення транзитивних залежностей між неключовими атрибутами</text>
<text x="280.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Правило: Якщо X → Y, то X — суперключ АБО Y — первинний (входить до кандидатного ключа).</text>
<rect x="40.0" y="380.0" width="820.0" height="85.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="40.0" y="380.0" width="220.0" height="85.0" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.8"/>
<text x="150.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">BCNF (Нормальна форма Бойса–Кодда)</text>
<text x="280.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Повне очищення від надлишкових детермінантів при перетині кандидатних ключів</text>
<text x="280.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Правило: Для будь-якої нетривіальної залежності X → Y детермінант X обов'язково є суперключем.</text>
<line x1="150.0" y1="135.0" x2="150.0" y2="159.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="150.0" y1="245.0" x2="150.0" y2="269.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="150.0" y1="355.0" x2="150.0" y2="379.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="480.0" width="820.0" height="38.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Хіта: Безвтратний природний зв'язок (Lossless Join) гарантується: R₁ ⋈ R₂ = R ⇔ R₁ ∩ R₂ → R₁ або R₁ ∩ R₂ → R₂</text>
</svg>