<rect x="45.0" y="305.0" width="270.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="367.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Для кожного кортежу зовнішньої</tspan><tspan x="180.0" dy="14.3">таблиці A виконується пошук</tspan><tspan x="180.0" dy="14.3">у внутрішній таблиці B.</tspan><tspan x="180.0" dy="14.3">Ідеально, якщо A крихітна (1-100),</tspan><tspan x="180.0" dy="14.3">а таблиця B має індекс за ключем.</tspan></text>
