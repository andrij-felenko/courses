<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок запису WAL та сторінок даних</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність операцій запису: непорушні правила WAL (Undo Rule та Redo Rule)</text>
<rect x="40.0" y="55.0" width="880.0" height="140.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ОПЕРАТИВНА ПАМ'ЯТЬ (DRAM) — Буферний пул сторінок та WAL Buffer</text>
<rect x="40.0" y="240.0" width="880.0" height="200.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="60.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">ЕНЕРГОНЕЗАЛЕЖНИЙ НАКОПИЧУВАЧ (NVMe / SSD / HDD) — Файли бази та WAL</text>
<rect x="113.6" y="107.2" width="172.8" height="55.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="200.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Модифікація в RAM</tspan><tspan x="200.0" dy="14.3">Сторінка X (PageLSN = 42)</tspan><tspan x="200.0" dy="14.3">Запис логу у WAL Buffer</tspan></text>
<rect x="337.7" y="320.2" width="224.6" height="59.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">2. fsync() WAL-блоку на диск</tspan><tspan x="450.0" dy="14.3">Запис LSN=42 надійно на диску.</tspan><tspan x="450.0" dy="14.3">Транзакція отримує COMMIT.</tspan></text>
<rect x="653.4" y="320.2" width="233.2" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="770.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">3. Асинхронний Checkpoint</tspan><tspan x="770.0" dy="14.3">Брудна сторінка X скидається</tspan><tspan x="770.0" dy="14.3">у файл таблиці (тільки після WAL!)</tspan></text>
<line x1="295.0" y1="135.0" x2="360.0" y2="350.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="198.0" width="70.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Undo Rule:</tspan><tspan x="305.0" dy="13.0">Лог ПЕРЕД</tspan><tspan x="305.0" dy="13.0">даними</tspan></text>
<line x1="555.0" y1="350.0" x2="660.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="584.0" y="309.5" width="47.9" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="608.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="608.0" dy="0.0">Фоновий</tspan><tspan x="608.0" dy="13.0">запис</tspan></text>
<rect x="558.0" y="109.0" width="244.0" height="52.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="680.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Раптове знеструмлення або збій ядра</tspan><tspan x="680.0" dy="13.0">DRAM втрачено, але лог LSN=42 на диску →</tspan><tspan x="680.0" dy="13.0">рушій надійно відновить стан через REDO</tspan></text>
</svg>