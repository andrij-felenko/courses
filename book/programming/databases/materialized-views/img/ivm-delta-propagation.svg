<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр інкрементного поширення змін (IVM Delta Pipeline)</text>
<rect x="65.0" y="88.4" width="150.0" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Базова таблиця R</tspan><tspan x="140.0" dy="15.6">INSERT INTO orders</tspan><tspan x="140.0" dy="15.6">VALUES (101, 45.00)</tspan></text>
<line x1="240.0" y1="120.0" x2="330.0" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мутація</text>
<rect x="332.2" y="86.4" width="215.5" height="67.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="440.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Дельта-потік ΔR</tspan><tspan x="440.0" dy="15.6">+ {id: 101, amount: 45.00}</tspan><tspan x="440.0" dy="15.6">Знак: INSERT (+), DELETE (-)</tspan></text>
<line x1="440.0" y1="175.0" x2="440.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Диференційне обчислення</text>
<rect x="160.0" y="250.0" width="560.0" height="120.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Алгебраїчні дельта-правила:</tspan><tspan x="440.0" dy="15.6">• Фільтрація: Δ(σ_p(R)) = σ_p(ΔR)</tspan><tspan x="440.0" dy="15.6">• З'єднання: Δ(R ⋈ S) = (ΔR ⋈ S_new) ∪ (R_old ⋈ ΔS)</tspan><tspan x="440.0" dy="15.6">• Агрегація: SUM_new = SUM_old + Δamount, COUNT_new = COUNT_old + 1</tspan></text>
<line x1="440.0" y1="370.0" x2="440.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="245.3" y="403.4" width="389.4" height="63.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="440.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Оновлений стан матеріалізованого в'ю (MV)</tspan><tspan x="440.0" dy="15.6">Ключ знайдено: UPDATE row SET sum += 45.00, count += 1</tspan><tspan x="440.0" dy="15.6">Ключ відсутній: INSERT INTO mv VALUES (key, 45.00, 1)</tspan></text>
<rect x="760.0" y="180.0" width="170.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Важливість __count:</tspan><tspan x="845.0" dy="13.0"></tspan><tspan x="845.0" dy="13.0">При видаленні кортежу</tspan><tspan x="845.0" dy="13.0">лічильник зменшується.</tspan><tspan x="845.0" dy="13.0"></tspan><tspan x="845.0" dy="13.0">Коли __count = 0,</tspan><tspan x="845.0" dy="13.0">рядок видаляється з MV.</tspan><tspan x="845.0" dy="13.0"></tspan><tspan x="845.0" dy="13.0">Запобігає фантомним</tspan><tspan x="845.0" dy="13.0">нульовим групам!</tspan></text>
<line x1="720.0" y1="310.0" x2="760.0" y2="310.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
</svg>