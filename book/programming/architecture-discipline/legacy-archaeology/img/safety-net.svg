<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спершу — сітка, тоді зміна: характеризаційний тест ловить регресії</text>
<rect x="40.0" y="70.0" width="210.0" height="88.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">1. Сфотографувати</tspan><tspan x="145.0" dy="16.9">поведінку як є</tspan><tspan x="145.0" dy="16.9">(не як мала б бути)</tspan></text>
<rect x="285.0" y="70.0" width="210.0" height="88.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">2. Прорізати шов —</tspan><tspan x="390.0" dy="16.9">точку, де підставити</tspan><tspan x="390.0" dy="16.9">тест</tspan></text>
<rect x="530.0" y="70.0" width="210.0" height="88.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">3. Міняти код —</tspan><tspan x="635.0" dy="16.9">сітка тримає</tspan><tspan x="635.0" dy="16.9">стару поведінку</tspan></text>
<line x1="250.0" y1="114.0" x2="285.0" y2="114.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="495.0" y1="114.0" x2="530.0" y2="114.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">сітка = зафіксовані пари вхід → поточний вихід</text>
<rect x="60.0" y="220.0" width="130.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">вхід A</tspan></text>
<text x="217.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">→</text>
<rect x="300.0" y="220.0" width="130.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">0x1F</tspan></text>
<rect x="60.0" y="272.0" width="130.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">вхід B</tspan></text>
<text x="217.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">→</text>
<rect x="300.0" y="272.0" width="130.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">-273</tspan></text>
<rect x="60.0" y="324.0" width="130.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">вхід C</tspan></text>
<text x="217.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">→</text>
<rect x="300.0" y="324.0" width="130.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">&quot;ok&quot;</tspan></text>
<rect x="540.0" y="236.0" width="210.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Зміна зламала</tspan><tspan x="645.0" dy="16.9">поведінку C →</tspan><tspan x="645.0" dy="16.9">тест падає</tspan><tspan x="645.0" dy="16.9">тут-таки</tspan></text>
<line x1="438.0" y1="350.0" x2="540.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Тест описує, що код РОБИТЬ зараз, а не що мав би. Це страховка на час перебудови.</text>
</svg>