<rect x="570.0" y="96.0" width="150.0" height="96.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Не знаєш,</tspan><tspan x="645.0" dy="16.9">навіщо цей</tspan><tspan x="645.0" dy="16.9">паркан —</tspan><tspan x="645.0" dy="16.9">не зноси</tspan></text>
<text x="645.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">паркан Честертона</text>
