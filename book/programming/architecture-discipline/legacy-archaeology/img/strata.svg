<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рядок legacy — це шари минулих виправлень, кожен колись щось лагодив</text>
<rect x="70.0" y="70.0" width="470.0" height="52.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">верхній шар: свіжа латка на баг #4821</tspan></text>
<rect x="70.0" y="130.0" width="470.0" height="52.0" rx="6" fill="#e9edf2" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">обхід крашу драйвера — тимчасово, 3 роки тому</tspan></text>
<rect x="70.0" y="190.0" width="470.0" height="52.0" rx="6" fill="#e3e8ee" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">+300 мс затримки: чекаємо повільний диск</tspan></text>
<rect x="70.0" y="250.0" width="470.0" height="52.0" rx="6" fill="#dde3ea" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">if (year==1999) — фікс Y2K-подібного вузла</tspan></text>
<rect x="70.0" y="310.0" width="470.0" height="52.0" rx="6" fill="#d6dde6" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">нижній шар: первісний намір, документів нема</tspan></text>
