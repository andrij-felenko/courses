<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рушій: один реєстр — п'ять перевірок — один звіт</text>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі дані проходять крізь п'ять незалежних лінз і сходяться в перелік того, що підсвічено</text>
<rect x="40.0" y="250.0" width="190.0" height="120.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="2.0"/>
<text x="135.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реєстр</text>
<text x="135.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="135.0" dy="0.0">хто · 3 булеві осі</tspan><tspan x="135.0" dy="14.0">турбота · інтерес</tspan></text>
<text x="135.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">як дані, не в голові</text>
<rect x="350.0" y="92.0" width="300.0" height="66.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.7"/>
<text x="500.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · Клас вагомості</text>
<text x="500.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 булеві → 1 із 7 класів</text>
<line x1="234.0" y1="310.0" x2="344.0" y2="125.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="176.0" width="300.0" height="66.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="500.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · Квадрант сітки</text>
<text x="500.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">влада × інтерес → 1 із 4</text>
<line x1="234.0" y1="310.0" x2="344.0" y2="209.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="260.0" width="300.0" height="66.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.7"/>
<text x="500.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · Покриття турбот</text>
<text x="500.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">турбота без рішення = діра</text>
<line x1="234.0" y1="310.0" x2="344.0" y2="293.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="344.0" width="300.0" height="66.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.7"/>
<text x="500.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4 · Точки компромісу</text>
<text x="500.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">спільний параметр, конфлікт</text>
<line x1="234.0" y1="310.0" x2="344.0" y2="377.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="428.0" width="300.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/>
<text x="500.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 · Матриця в'ю</text>
<text x="500.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">жоден рядок не порожній</text>
<line x1="234.0" y1="310.0" x2="344.0" y2="461.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="735.0" y="175.0" width="205.0" height="260.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="837.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звіт підсвічує</text>
<text x="751.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">— залежний без важеля</text>
<text x="751.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">— турбота без рішення</text>
<text x="751.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">— вето твердого порогу</text>
<text x="751.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">— компроміс на параметрі</text>
<text x="751.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">— голос без жодного в'ю</text>
<line x1="654.0" y1="125.0" x2="729.0" y2="305.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="654.0" y1="209.0" x2="729.0" y2="305.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="654.0" y1="293.0" x2="729.0" y2="305.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="654.0" y1="377.0" x2="729.0" y2="305.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="654.0" y1="461.0" x2="729.0" y2="305.0" stroke="#c9cdd3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="533.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="553.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Знімок фіксує миттєвий розподіл осей — щойно осі повзуть, рушій переганяють</tspan></text>
</svg>