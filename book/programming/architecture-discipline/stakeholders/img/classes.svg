<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різні люди дивляться на ту саму систему по-різному</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожен клас несе свою турботу — і саме вона тисне на архітектуру</text>
<circle cx="410.0" cy="300.0" r="66.0" fill="#eef7ee" stroke="#27ae60" stroke-width="2.2"/>
<text x="410.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система</text>
<text x="410.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(одна)</text>
<rect x="150.0" y="130.0" width="230.0" height="66.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="265.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замовник</text>
<text x="265.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи вкладемось у бюджет і строк</text>
<line x1="265.0" y1="196.0" x2="369.4" y2="270.9" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="500.0" y="130.0" width="230.0" height="66.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="615.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Користувач</text>
<text x="615.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи зроблю тут своє швидко й без болю</text>
<line x1="615.0" y1="196.0" x2="467.4" y2="270.9" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="60.0" y="300.0" width="230.0" height="66.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="175.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розробник</text>
<text x="175.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи зрозуміла структура, куди класти код</text>
<line x1="175.0" y1="300.0" x2="344.2" y2="300.0" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="590.0" y="300.0" width="230.0" height="66.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="705.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Супровід</text>
<text x="705.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи легко змінити, коли зміняться вимоги</text>
<line x1="705.0" y1="300.0" x2="492.6" y2="300.0" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="150.0" y="470.0" width="230.0" height="66.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="265.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адміністратор</text>
<text x="265.0" y="517.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи видно збій і чи підніму систему вночі</text>
<line x1="265.0" y1="470.0" x2="369.4" y2="347.6" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="500.0" y="470.0" width="230.0" height="66.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="615.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аудитор</text>
<text x="615.0" y="517.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чи виконано норми, приватність, безпеку</text>
<line x1="615.0" y1="470.0" x2="467.4" y2="347.6" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="3,4"/>
</svg>