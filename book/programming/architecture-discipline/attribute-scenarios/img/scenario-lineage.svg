<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід сценарію: що кожен крок додав до нього як мірила</text>
<line x1="50.0" y1="178.0" x2="968.0" y2="178.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="966.0" y1="178.0" x2="992.0" y2="178.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="155.0" y1="121.0" x2="155.0" y2="169.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="155.0" cy="178.0" r="8.0" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<line x1="155.0" y1="187.0" x2="155.0" y2="232.0" stroke="#6b7280" stroke-width="1.3"/>
<rect x="80.0" y="71.0" width="150.0" height="49.9" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/><text x="155.0" y="92.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">SAAM</tspan><tspan x="155.0" dy="16.9">1994</tspan></text>
<rect x="49.0" y="232.0" width="212.0" height="152.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Сценарій уперше —</tspan><tspan x="155.0" dy="15.6">мірило, а не смак.</tspan><tspan x="155.0" dy="15.6">Одна якість:</tspan><tspan x="155.0" dy="15.6">змінюваність.</tspan></text>
<line x1="400.0" y1="121.0" x2="400.0" y2="169.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="400.0" cy="178.0" r="8.0" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<line x1="400.0" y1="187.0" x2="400.0" y2="232.0" stroke="#6b7280" stroke-width="1.3"/>
<rect x="325.0" y="71.0" width="150.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/><text x="400.0" y="92.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ATAM</tspan><tspan x="400.0" dy="16.9">2000</tspan></text>
<rect x="294.0" y="232.0" width="212.0" height="152.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Дерево корисності</tspan><tspan x="400.0" dy="15.6">ранжує сценарії за</tspan><tspan x="400.0" dy="15.6">важливістю й складністю.</tspan><tspan x="400.0" dy="15.6">Точки чутливості й</tspan><tspan x="400.0" dy="15.6">компромісу, ризики.</tspan><tspan x="400.0" dy="15.6">Якості — навхрест.</tspan></text>
<line x1="645.0" y1="121.0" x2="645.0" y2="169.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="645.0" cy="178.0" r="8.0" fill="#fff8e8" stroke="#b8860b" stroke-width="2.0"/>
<line x1="645.0" y1="187.0" x2="645.0" y2="232.0" stroke="#6b7280" stroke-width="1.3"/>
<rect x="570.0" y="71.0" width="150.0" height="49.9" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/><text x="645.0" y="92.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">QAW</tspan><tspan x="645.0" dy="16.9">2001</tspan></text>
<rect x="539.0" y="232.0" width="212.0" height="152.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="645.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Сценарії збирають</tspan><tspan x="645.0" dy="15.6">ще ДО архітектури —</tspan><tspan x="645.0" dy="15.6">від стейкхолдерів.</tspan><tspan x="645.0" dy="15.6">Нема що оцінювати —</tspan><tspan x="645.0" dy="15.6">є що з'ясувати.</tspan></text>
<line x1="890.0" y1="121.0" x2="890.0" y2="169.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="890.0" cy="178.0" r="8.0" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<line x1="890.0" y1="187.0" x2="890.0" y2="232.0" stroke="#6b7280" stroke-width="1.3"/>
<rect x="815.0" y="71.0" width="150.0" height="49.9" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/><text x="890.0" y="92.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Канон</tspan><tspan x="890.0" dy="16.9">2003 → 2011</tspan></text>
<rect x="784.0" y="232.0" width="212.0" height="152.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="890.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Шість частин сценарію</tspan><tspan x="890.0" dy="15.6">(SAiP, 2-ге вид.).</tspan><tspan x="890.0" dy="15.6">Спільний словник</tspan><tspan x="890.0" dy="15.6">якостей —</tspan><tspan x="890.0" dy="15.6">ISO/IEC 25010.</tspan></text>
<text x="520.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Одна лінія крізь усе: та сама одиниця — сценарій — щоразу бере на себе більше ваги.</text>
</svg>