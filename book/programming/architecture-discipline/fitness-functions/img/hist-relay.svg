<line x1="781.0" y1="48.0" x2="781.0" y2="300.0" stroke="#d7dbe0" stroke-width="1.0" stroke-dasharray="4,5"/>
<text x="166.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">1864</text>
<text x="166.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">Герберт</tspan><tspan x="166.0" dy="15.6">Спенсер</tspan></text>
<text x="166.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="166.0" dy="0.0">біологія-</tspan><tspan x="166.0" dy="13.2">гасло</tspan></text>
<rect x="91.0" y="162.4" width="150.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="166.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="166.0" dy="0.0">гасло:</tspan><tspan x="166.0" dy="15.6">«виживання</tspan><tspan x="166.0" dy="15.6">найпристосованіших»</tspan></text>
<text x="166.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="166.0" dy="0.0">назвав ідею,</tspan><tspan x="166.0" dy="13.8">але не дав міри</tspan></text>
<text x="410.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">1932</text>
<text x="410.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Сьюол</tspan><tspan x="410.0" dy="15.6">Райт</tspan></text>
<text x="410.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">популяційна</tspan><tspan x="410.0" dy="13.2">генетика</tspan></text>
<rect x="359.0" y="162.4" width="102.1" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">висота-число</tspan><tspan x="410.0" dy="15.6">на нерівному</tspan><tspan x="410.0" dy="15.6">ландшафті</tspan></text>
<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">дав фітнесу</tspan><tspan x="410.0" dy="13.8">геометрію:</tspan><tspan x="410.0" dy="13.8">висота й вершини</tspan></text>
<text x="656.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">1975</text>
<text x="656.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="656.0" dy="0.0">Джон</tspan><tspan x="656.0" dy="15.6">Голланд</tspan></text>
<text x="656.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="656.0" dy="0.0">генетичні</tspan><tspan x="656.0" dy="13.2">алгоритми</tspan></text>
<rect x="587.9" y="162.4" width="136.3" height="63.2" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="656.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">функція, яку</tspan><tspan x="656.0" dy="15.6">ПИШУТЬ, — плавний</tspan><tspan x="656.0" dy="15.6">число-компас</tspan></text>
<text x="656.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="656.0" dy="0.0">зробив міру</tspan><tspan x="656.0" dy="13.8">обчислюваною —</tspan><tspan x="656.0" dy="13.8">компас сліпого пошуку</tspan></text>
<text x="906.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">2017</text>
<text x="906.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="906.0" dy="0.0">Форд · Парсонс</tspan><tspan x="906.0" dy="15.6">· Куа</tspan></text>
<text x="906.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="906.0" dy="0.0">архітектура</tspan><tspan x="906.0" dy="13.2">ПЗ</tspan></text>
<rect x="861.8" y="162.4" width="88.4" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="906.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="906.0" dy="0.0">вирок:</tspan><tspan x="906.0" dy="15.6">пройшло /</tspan><tspan x="906.0" dy="15.6">не пройшло</tspan></text>
<text x="906.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="906.0" dy="0.0">плавний градієнт</tspan><tspan x="906.0" dy="13.8">→ різкий поріг</tspan></text>
<line x1="94.0" y1="326.0" x2="990.0" y2="326.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">наскрізне крізь усі переходи: об'єктивна міра близькості до мети, що напрямляє сліпий інкрементний добір</tspan></text>
