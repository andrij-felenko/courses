<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три перевірки: що кожній треба і що вона ловить</text>
<line x1="268.0" y1="70.0" x2="268.0" y2="325.0" stroke="#d7dbe0" stroke-width="1.0"/>
<line x1="90.0" y1="158.0" x2="900.0" y2="158.0" stroke="#e2e6ea" stroke-width="1.0"/>
<line x1="90.0" y1="250.0" x2="900.0" y2="250.0" stroke="#e2e6ea" stroke-width="1.0"/>
<rect x="91.6" y="87.0" width="116.7" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Заборонена</tspan><tspan x="150.0" dy="16.9">(досяжність)</tspan></text>
<text x="300.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="300.0" dy="0.0">треба: названа пара  X ⇏ Y</tspan><tspan x="300.0" dy="15.6">ловить: будь-який шлях X → … → Y</tspan><tspan x="300.0" dy="15.6">     (навіть того ж рівня, навіть униз)</tspan></text>
<rect x="63.4" y="179.1" width="173.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Шари</tspan><tspan x="150.0" dy="16.9">(частковий порядок)</tspan></text>
<text x="300.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="300.0" dy="0.0">треба: рівень кожного модуля</tspan><tspan x="300.0" dy="15.6">ловить: будь-яке ребро вгору</tspan><tspan x="300.0" dy="15.6">     (рівень зростає)</tspan></text>
<rect x="75.5" y="271.1" width="149.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Цикли</tspan><tspan x="150.0" dy="16.9">(3-колірний DFS)</tspan></text>
<text x="300.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="300.0" dy="0.0">треба: лише граф, і все</tspan><tspan x="300.0" dy="15.6">ловить: будь-який цикл</tspan><tspan x="300.0" dy="15.6">     (кожен цикл має ребро вгору)</tspan></text>
<rect x="244.5" y="361.2" width="450.9" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Кожен цикл несе ребро вгору → повні рівні вже підказують цикли;</tspan><tspan x="470.0" dy="15.6">а названа пара ловить те, що шари й цикли пропускають.</tspan></text>
</svg>