<text x="170.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">означено сам предмет:</tspan><tspan x="170.0" dy="12.7">що таке архітектура</tspan><tspan x="170.0" dy="12.7">(елементи · форма · чому)</tspan></text>
