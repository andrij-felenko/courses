<text x="770.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4ea8" text-anchor="middle" font-weight="700">ATAM (TR-008)</text>
<text x="770.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">метод про КОМПРОМІСИ</tspan><tspan x="770.0" dy="12.7">між атрибутами —</tspan><tspan x="770.0" dy="12.7">стрижень і назва</tspan></text>
<rect x="174.7" y="379.8" width="590.6" height="32.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="470.0" y="399.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">три шари: означити структуру  →  перевіряти сценаріями  →  бачити, що якості тягнуться навхрест</tspan></text>
