<text x="570.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">кілька аналізів атрибутів</tspan><tspan x="570.0" dy="12.7">стоять поруч (звіт-97):</tspan><tspan x="570.0" dy="12.7">ще не злиті в одне</tspan></text>
