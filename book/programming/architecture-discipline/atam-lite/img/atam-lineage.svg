<text x="370.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">SAAM</text>
<text x="370.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">оцінка ОДНІЄЇ якості —</tspan><tspan x="370.0" dy="12.7">змінюваності — через</tspan><tspan x="370.0" dy="12.7">сценарії, а не смак</tspan></text>
