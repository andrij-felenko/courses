<rect x="745.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.0"/><text x="770.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4ea8" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">1998</tspan></text>
