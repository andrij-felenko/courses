<text x="60.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a4ea8" text-anchor="start"><tspan x="60.0" dy="0.0">те саме рішення тягне</tspan><tspan x="60.0" dy="11.9">ДВІ якості в різні боки</tspan></text>
