<text x="60.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start"><tspan x="60.0" dy="0.0">надійність СИЛЬНО</tspan><tspan x="60.0" dy="11.9">залежить від цього</tspan><tspan x="60.0" dy="11.9">рішення</tspan></text>
