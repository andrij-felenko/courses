<rect x="322.4" y="183.5" width="175.2" height="73.0" rx="6" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.0"/><text x="410.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4ea8" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Рішення:</tspan><tspan x="410.0" dy="16.2">тримати резервну БД</tspan><tspan x="410.0" dy="16.2">синхронною</tspan></text>
