<rect x="415.0" y="117.0" width="150.0" height="66.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="490.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">ЗАКРИТИЙ</tspan><tspan x="490.0" dy="15.6">минув або</tspan><tspan x="490.0" dy="15.6">стався</tspan></text>
<line x1="185.0" y1="150.0" x2="225.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="375.0" y1="150.0" x2="415.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 490 117 C 490 78, 110 78, 110 117" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="300.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">щотижня перечитуємо: оцінки зсунулись?</text>
<line x1="110.0" y1="223.0" x2="110.0" y2="189.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="110.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">нові ризики</text>
