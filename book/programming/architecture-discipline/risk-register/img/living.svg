<text x="490.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">в архів, з уроком</text>
<line x1="40.0" y1="300.0" x2="720.0" y2="300.0" stroke="#d0d0d0" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="230.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">МЕРТВИЙ реєстр — таблиця пилюки</text>
<rect x="90.0" y="380.0" width="250.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="215.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">написали раз на старті</tspan></text>
