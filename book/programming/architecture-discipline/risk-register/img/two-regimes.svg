<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один реєстр — два обчислення: дешеве середнє, дорогий хвіст</text>
<rect x="301.1" y="65.9" width="297.8" height="52.2" rx="6" fill="#eef1f5" stroke="#1a1a1a" stroke-width="2.0"/><text x="450.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">РЕЄСТР</tspan><tspan x="450.0" dy="18.2">рядки: p · L  ·  задачі: o, m, p</tspan></text>
<line x1="360.0" y1="128.0" x2="280.0" y2="176.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="149.4" y="193.5" width="181.2" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">СЕРЕДНЄ · РАНЖУВАННЯ</tspan></text>
<text x="240.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Σ p·L — сума очікуваних</text>
<rect x="65.0" y="276.0" width="350.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">• лінійне: сума середніх = середнє суми</tspan><tspan x="240.0" dy="15.6">• точне й дешеве — тривіальний цикл</tspan><tspan x="240.0" dy="15.6">• СЛІПЕ до хвоста й до кореляції</tspan><tspan x="240.0" dy="15.6">→ куди дивитися першими</tspan></text>
<line x1="540.0" y1="128.0" x2="620.0" y2="176.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="593.6" y="193.5" width="132.8" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="660.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">РЕЗЕРВ · ХВІСТ</tspan></text>
<text x="660.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Монте-Карло → перцентиль P80</text>
<rect x="485.0" y="276.0" width="350.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="660.0" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">• розігруємо реєстр тисячі разів</tspan><tspan x="660.0" dy="15.6">• БАЧИТЬ кореляцію (спільний корінь)</tspan><tspan x="660.0" dy="15.6">• дорожче, наближене, з seed</tspan><tspan x="660.0" dy="15.6">→ скільки закладати в резерв</tspan></text>
<rect x="150.0" y="402.0" width="600.0" height="44.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="450.0" y="420.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Не симулюй те, що дає лінійність, і не закладай резерв за середнім:</tspan><tspan x="450.0" dy="15.6">кореляція міняє лише правий шлях, а середнє — ніколи.</tspan></text>
</svg>