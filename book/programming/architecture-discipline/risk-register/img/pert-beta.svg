<rect x="525.4" y="81.7" width="205.2" height="100.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="628.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="628.0" dy="0.0">Бета на [o, p], α+β = 6</tspan><tspan x="628.0" dy="16.9">α = 1+4(m−o)/(p−o) = 1.89</tspan><tspan x="628.0" dy="16.9">β = 1+4(p−m)/(p−o) = 4.11</tspan><tspan x="628.0" dy="16.9">⇒ середнє = (o+4m+p)/6</tspan><tspan x="628.0" dy="16.9">   = ⅔·мода + ⅓·середина</tspan></text>
<rect x="498.3" y="276.2" width="259.4" height="47.6" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/><text x="628.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="628.0" dy="0.0">розмах ≈ 6σ  ⇒  σ ≈ (p−o)/6 = 3.0</tspan><tspan x="628.0" dy="15.6">(окрема евристика, не та сама бета)</tspan></text>
