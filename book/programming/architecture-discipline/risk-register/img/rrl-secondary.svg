<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пом'якшення несе власний ризик, і він з'їдає важіль</text>
<text x="410.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Бекап за 60 000 зменшує збиток з 2 млн до 150 тис. (лишок після = 7 500)</text>
<text x="400.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">нібито знято: 100 000 − 7 500 = 92 500</text>
<rect x="100.0" y="132.0" width="600.0" height="36.0" rx="4" fill="#eaf3ec" stroke="#27ae60" stroke-width="1.8"/>
<text x="400.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">…власний (наведений) ризик пом'якшення повертає частину назад:</text>
<rect x="100.0" y="232.0" width="480.0" height="36.0" rx="4" fill="#eaf3ec" stroke="#27ae60" stroke-width="1.8"/>
<rect x="580.0" y="232.0" width="120.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="340.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">чисто знято 74 000</text>
<text x="640.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">наведено −18 500</text>
<text x="215.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">наївний RRL ≈ 1.54</text>
<line x1="330.0" y1="346.0" x2="445.0" y2="346.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">справжній RRL ≈ 1.23</text>
<text x="410.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">За менш надійного відновлення важіль легко падає під 1 — тому наведене рахують завжди.</text>
</svg>