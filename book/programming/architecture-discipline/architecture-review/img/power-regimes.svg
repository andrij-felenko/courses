<text x="960.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">владу РОЗДАНО</text>
<text x="430.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">маятник хитнувся сюди за ~40 років</text>
<line x1="210.0" y1="108.0" x2="560.0" y2="108.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
