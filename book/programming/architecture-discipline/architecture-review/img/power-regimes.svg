<rect x="40.0" y="176.0" width="300.0" height="46.0" rx="6" fill="#fdeee9" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ЦЕНТРАЛІЗОВАНА РАДА</tspan><tspan x="190.0" dy="16.9">(ворота)</tspan></text>
<rect x="40.0" y="230.0" width="300.0" height="176.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">владу зосереджено</tspan><tspan x="190.0" dy="15.6">в одному тілі — кожне</tspan><tspan x="190.0" dy="15.6">рішення проходить крізь нього</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">хиба: вузьке місце й театр —</tspan><tspan x="190.0" dy="15.6">черга, обхід,</tspan><tspan x="190.0" dy="15.6">посмертна маска рішення</tspan></text>
<circle cx="540.0" cy="138.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<line x1="540.0" y1="145.0" x2="540.0" y2="176.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<rect x="390.0" y="176.0" width="300.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ПРОЦЕС ПОРАДИ</tspan><tspan x="540.0" dy="16.9">(розмова)</tspan></text>
<rect x="390.0" y="230.0" width="300.0" height="176.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">владу роздано — будь-хто</tspan><tspan x="540.0" dy="15.6">вирішує; АЛЕ мусить спитати</tspan><tspan x="540.0" dy="15.6">пораду в зачеплених і фахівців;</tspan><tspan x="540.0" dy="15.6">записи, принципи, радар</tspan><tspan x="540.0" dy="15.6">тримають рішення зв'язними</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">рев'ю живе в КОЖНОМУ рішенні</tspan></text>
<circle cx="890.0" cy="138.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<line x1="890.0" y1="145.0" x2="890.0" y2="176.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<rect x="740.0" y="176.0" width="300.0" height="46.0" rx="6" fill="#fdeee9" stroke="#c0392b" stroke-width="1.5"/><text x="890.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">ПОВНИЙ ДЕЦЕНТРАЛІЗМ</tspan><tspan x="890.0" dy="16.9">(без рев'ю)</tspan></text>
<rect x="740.0" y="230.0" width="300.0" height="176.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">владу роздано,</tspan><tspan x="890.0" dy="15.6">обов'язку радитися немає —</tspan><tspan x="890.0" dy="15.6">кожен вирішує сам</tspan><tspan x="890.0" dy="15.6"></tspan><tspan x="890.0" dy="15.6">хиба: дрейф і незв'язність —</tspan><tspan x="890.0" dy="15.6">рішення розповзаються,</tspan><tspan x="890.0" dy="15.6">ніхто не бачить цілого</tspan></text>
<text x="540.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">хто штовхнув маятник від воріт до розмови</text>
