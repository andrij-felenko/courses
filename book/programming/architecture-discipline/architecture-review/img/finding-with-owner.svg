<line x1="450.0" y1="64.0" x2="450.0" y2="442.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,5"/>
<text x="225.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">знахідка БЕЗ власника</text>
<text x="675.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">знахідка З власником</text>
<rect x="86.5" y="90.2" width="277.1" height="51.6" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="225.0" dy="0.0">«стоп у спільній черзі з телеметрією;</tspan><tspan x="225.0" dy="15.6">під піком спізнюється»</tspan></text>
<text x="97.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">власник:</text>
<text x="353.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">— (нічий)</text>
<text x="97.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">стан:</text>
<text x="353.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">відкрито</text>
<text x="97.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">дедлайн:</text>
<text x="353.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">— не призначено</text>
<circle cx="225.0" cy="320.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="225.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="225.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">нікуди не рухається</text>
<rect x="165.6" y="387.2" width="118.7" height="49.6" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="408.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">за тиждень —</tspan><tspan x="225.0" dy="15.6">жодного сліду</tspan></text>
<line x1="225.0" y1="372.0" x2="225.0" y2="387.2" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="536.5" y="90.2" width="277.1" height="51.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">«стоп у спільній черзі з телеметрією;</tspan><tspan x="675.0" dy="15.6">під піком спізнюється»</tspan></text>
<text x="547.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">власник:</text>
<text x="803.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">Оля</text>
<text x="547.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">стан:</text>
<text x="803.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">знімається</text>
<text x="547.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">дедлайн:</text>
<text x="803.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">день 14</text>
<circle cx="675.0" cy="320.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="675.0" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="675.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">рухоме зобов'язання</text>
<rect x="593.3" y="387.2" width="163.4" height="49.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="408.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">у живий реєстр →</tspan><tspan x="675.0" dy="15.6">доведуть до «знято»</tspan></text>
<line x1="675.0" y1="372.0" x2="675.0" y2="387.2" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
