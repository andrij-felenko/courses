<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="430.0" y1="60.0" x2="430.0" y2="440.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,5"/>
<text x="215.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Пасивне рев'ю</text>
<text x="645.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Активне рев'ю</text>
<rect x="147.4" y="99.5" width="135.1" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">готова діаграма</tspan></text>
<rect x="144.7" y="172.5" width="140.6" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">«є заперечення?»</tspan></text>
<line x1="215.0" y1="136.5" x2="215.0" y2="172.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="215.0" cy="262.0" r="15.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="215.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рецензент мовчки киває</text>
<line x1="215.0" y1="207.5" x2="215.0" y2="247.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="147.6" y="330.1" width="134.8" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="352.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">вада проходить</tspan><tspan x="215.0" dy="16.9">непоміченою</tspan></text>
<line x1="215.0" y1="315.0" x2="215.0" y2="330.1" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="215.0" cy="420.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="215.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="215.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">мовчання = «згода»</text>
<rect x="527.0" y="92.2" width="236.0" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">«проведи стоп крізь структуру:</tspan><tspan x="645.0" dy="15.6">вкладеться в 200 мс під піком?»</tspan></text>
<circle cx="645.0" cy="200.0" r="15.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="645.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рецензент простежує шлях</text>
<line x1="645.0" y1="143.8" x2="645.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="548.5" y="283.0" width="193.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">стверджує, а не заперечує</tspan></text>
<line x1="645.0" y1="253.0" x2="645.0" y2="283.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="569.5" y="354.5" width="151.0" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">вада — на світлі</tspan></text>
<line x1="645.0" y1="317.0" x2="645.0" y2="354.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="645.0" cy="434.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="645.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="645.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">питання змушує подивитися</text>
</svg>