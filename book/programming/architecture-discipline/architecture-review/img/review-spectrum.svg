<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр рев'ю: від соло-прогону до архітектурної ради</text>
<text x="530.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">згори вниз: формальність, ціна й церемонність зростають</text>
<line x1="22.0" y1="96.0" x2="22.0" y2="520.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="44.0" y="56.0" width="220.0" height="30.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">форма рев'ю</tspan></text>
<rect x="278.0" y="56.0" width="356.0" height="30.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">коли саме брати</tspan></text>
<rect x="650.0" y="56.0" width="386.0" height="30.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="843.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="843.0" dy="0.0">як тихо вмирає</tspan></text>
<rect x="44.0" y="96.0" width="220.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Соло-прогін</tspan><tspan x="154.0" dy="15.6">(сам собі)</tspan></text>
<rect x="278.0" y="96.0" width="356.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">сам женеш 2–3 драйвер-сценарії</tspan><tspan x="456.0" dy="15.6">крізь власну схему</tspan></text>
<rect x="650.0" y="96.0" width="386.0" height="76.0" rx="6" fill="#fbeae7" stroke="#c0392b" stroke-width="1.5"/><text x="843.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="843.0" dy="0.0">самообман: своїх сліпих</tspan><tspan x="843.0" dy="15.6">плям не видно</tspan></text>
<rect x="44.0" y="184.0" width="220.0" height="76.0" rx="6" fill="#eef5ef" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Рев'ю рішення / ADR</tspan><tspan x="154.0" dy="15.6">(парне)</tspan></text>
<rect x="278.0" y="184.0" width="356.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">колега стверджує ОДИН сценарій</tspan><tspan x="456.0" dy="15.6">за ОДНИМ рішенням</tspan></text>
<rect x="650.0" y="184.0" width="386.0" height="76.0" rx="6" fill="#fbeae7" stroke="#c0392b" stroke-width="1.5"/><text x="843.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="843.0" dy="0.0">вузьке коло: клас ризику</tspan><tspan x="843.0" dy="15.6">без свого фахівця мовчить</tspan></text>
<rect x="44.0" y="272.0" width="220.0" height="76.0" rx="6" fill="#fdf6ee" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Активне рев'ю</tspan><tspan x="154.0" dy="15.6">(ARID-клас)</tspan></text>
<rect x="278.0" y="272.0" width="356.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">мала команда жене драйвер-</tspan><tspan x="456.0" dy="15.6">сценарії крізь незавершену форму</tspan></text>
<rect x="650.0" y="272.0" width="386.0" height="76.0" rx="6" fill="#fbeae7" stroke="#c0392b" stroke-width="1.5"/><text x="843.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="843.0" dy="0.0">стає судом, щойно автора</tspan><tspan x="843.0" dy="15.6">починають екзаменувати</tspan></text>
<rect x="44.0" y="360.0" width="220.0" height="76.0" rx="6" fill="#fdeee9" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Повне оцінювання</tspan><tspan x="154.0" dy="15.6">(ATAM-клас)</tspan></text>
<rect x="278.0" y="360.0" width="356.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">стейкхолдери, дерево корисності,</tspan><tspan x="456.0" dy="15.6">компроміси — багатоденний розбір</tspan></text>
<rect x="650.0" y="360.0" width="386.0" height="76.0" rx="6" fill="#fbeae7" stroke="#c0392b" stroke-width="1.5"/><text x="843.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="843.0" dy="0.0">заважке для дрібного;</tspan><tspan x="843.0" dy="15.6">обряд раз на рік</tspan></text>
<rect x="44.0" y="448.0" width="220.0" height="76.0" rx="6" fill="#f8e0d9" stroke="#333333" stroke-width="1.5"/><text x="154.0" y="482.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Архітектурна рада</tspan><tspan x="154.0" dy="15.6">(governance)</tspan></text>
<rect x="278.0" y="448.0" width="356.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="482.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">централізовані ворота</tspan><tspan x="456.0" dy="15.6">на КОЖНУ зміну</tspan></text>
<rect x="650.0" y="448.0" width="386.0" height="76.0" rx="6" fill="#fbeae7" stroke="#c0392b" stroke-width="1.5"/><text x="843.0" y="482.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="843.0" dy="0.0">вузьке місце й театр;</tspan><tspan x="843.0" dy="15.6">команди обходять</tspan></text>
</svg>