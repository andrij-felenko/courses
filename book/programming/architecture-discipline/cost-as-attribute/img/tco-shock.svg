<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому цифра TCO струснула закупівлі: видно було п'яту частину</text>
<rect x="150.0" y="80.0" width="150.0" height="64.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="225.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 20 %</text>
<rect x="150.0" y="144.0" width="150.0" height="256.0" rx="6" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="225.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">≈ 80 %</text>
<text x="136.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">ціна на ціннику</text>
<text x="136.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">підтримка,</text>
<text x="136.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">простої, навчання,</text>
<text x="136.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">адміністрування</text>
<rect x="325.0" y="118.8" width="150.0" height="32.5" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="400.0" y="139.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">чужа рука</tspan></text>
<text x="491.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">хтось інший ставить ПЗ, лагодить,</text>
<text x="491.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">оновлює — це його робочий час</text>
<rect x="325.0" y="198.8" width="150.0" height="32.5" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="400.0" y="219.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">простій</tspan></text>
<text x="491.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">поки стіл не працює, не працює</text>
<text x="491.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">й людина за ним</text>
<rect x="325.0" y="278.8" width="150.0" height="32.5" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="400.0" y="299.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">самопоміч</tspan></text>
<text x="491.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">колеги вчать одне одного в обхід</text>
<text x="491.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ІТ — час, якого ніхто не рахує</text>
<rect x="325.0" y="358.8" width="150.0" height="32.5" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="400.0" y="379.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">накопичення</tspan></text>
<text x="491.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">усе це — щороку, помножене</text>
<text x="491.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">на кожен стіл у конторі</text>
<text x="470.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">покупець порівнював машини за верхньою п'ятою частиною — а платив за всю висоту стовпчика</text>
</svg>