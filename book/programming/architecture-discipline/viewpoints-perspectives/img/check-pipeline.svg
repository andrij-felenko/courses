<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірник консистентності: опис як дані → групи → дві перевірки → ворота</text>
<rect x="30.0" y="107.0" width="209.5" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="134.8" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="134.8" dy="0.0">1. Опис як дані</tspan></text>
<rect x="46.0" y="168.1" width="177.6" height="53.8" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="134.8" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="134.8" dy="0.0">маніфестації в усіх в'ю</tspan><tspan x="134.8" dy="13.7">+ відповідності (ISO 42010)</tspan><tspan x="134.8" dy="13.7">+ вузли й мережеві зв'язки</tspan></text>
<rect x="273.5" y="107.0" width="209.5" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="378.2" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="378.2" dy="0.0">2. Резолвер груп</tspan></text>
<rect x="292.4" y="168.1" width="171.6" height="53.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="378.2" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="378.2" dy="0.0">обхід графа відповідностей</tspan><tspan x="378.2" dy="13.7">з visited-set —</tspan><tspan x="378.2" dy="13.7">стійкий до циклів</tspan></text>
<line x1="242.5" y1="127.0" x2="270.5" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="517.0" y="107.0" width="209.5" height="40.0" rx="6" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="621.8" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="621.8" dy="0.0">3. Дві перевірки</tspan></text>
<rect x="541.9" y="168.1" width="159.6" height="53.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="621.8" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="621.8" dy="0.0">покриття E×V (сироти)</tspan><tspan x="621.8" dy="13.7">+ хибно-локальні виклики</tspan><tspan x="621.8" dy="13.7">(local проти мережі)</tspan></text>
<line x1="486.0" y1="127.0" x2="514.0" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.5" y="107.0" width="209.5" height="40.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="865.2" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.2" dy="0.0">4. Вердикт</tspan></text>
<rect x="800.4" y="168.1" width="129.7" height="53.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="865.2" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="865.2" dy="0.0">список порушень +</tspan><tspan x="865.2" dy="13.7">код виходу: 0 або 1</tspan><tspan x="865.2" dy="13.7">= ворота складання</tspan></text>
<line x1="729.5" y1="127.0" x2="757.5" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="188.0" y="301.2" width="624.0" height="29.5" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">усе, що зловлено, — на кресленні, а не в проді: ворота падають на неузгодженому описі</tspan></text>
</svg>