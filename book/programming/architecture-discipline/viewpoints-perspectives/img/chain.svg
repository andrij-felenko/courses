<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг ISO 42010: турбота стейкхолдера керує вибором в'ю</text>
<rect x="40.0" y="110.0" width="170.5" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="125.2" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.2" dy="0.0">Стейкхолдер</tspan></text>
<rect x="40.0" y="158.0" width="170.5" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="125.2" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.2" dy="0.0">той, у кого</tspan><tspan x="125.2" dy="13.7">є турбота</tspan></text>
<rect x="256.5" y="110.0" width="170.5" height="42.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="341.8" y="127.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="341.8" dy="0.0">Турбота</tspan><tspan x="341.8" dy="16.9">(concern)</tspan></text>
<rect x="256.5" y="158.0" width="170.5" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="341.8" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="341.8" dy="0.0">«чи витримає</tspan><tspan x="341.8" dy="13.7">пік навантаження»</tspan></text>
<line x1="214.5" y1="131.0" x2="252.5" y2="131.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="473.0" y="110.0" width="170.5" height="42.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="558.2" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="558.2" dy="0.0">Viewpoint</tspan></text>
<rect x="473.0" y="158.0" width="170.5" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="558.2" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="558.2" dy="0.0">готовий шаблон:</tspan><tspan x="558.2" dy="13.7">що і як показати</tspan></text>
<line x1="431.0" y1="131.0" x2="469.0" y2="131.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="689.5" y="110.0" width="170.5" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="774.8" y="127.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="774.8" dy="0.0">View</tspan><tspan x="774.8" dy="16.9">(погляд)</tspan></text>
<rect x="689.5" y="158.0" width="170.5" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="774.8" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="774.8" dy="0.0">заповнений шаблон</tspan><tspan x="774.8" dy="13.7">для ЦІЄЇ системи</tspan></text>
<line x1="647.5" y1="131.0" x2="685.5" y2="131.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="199.2" y="235.0" width="501.6" height="30.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">не «намалюймо всі діаграми», а «яка турбота → та в'ю її покриває»</tspan></text>
</svg>