<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="418" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сім в'ю Rozanski/Woods: кожна відповідає на одне питання про структуру</text>
<text x="105.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">В'Ю</text>
<text x="425.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">НА ЯКЕ ПИТАННЯ ВІДПОВІДАЄ</text>
<text x="776.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">КОГО НАЙБІЛЬШЕ ХВИЛЮЄ</text>
<rect x="30.0" y="66.0" width="840.0" height="40.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="66.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="90.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Контекстна</tspan></text>
<text x="198.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">де межі системи, з ким вона говорить</text>
<text x="680.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">замовник, інтегратори</text>
<rect x="30.0" y="112.0" width="840.0" height="40.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="112.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Функційна</tspan></text>
<text x="198.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">з яких частин і як вони взаємодіють</text>
<text x="680.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усі, аналітики</text>
<rect x="30.0" y="158.0" width="840.0" height="40.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="158.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Інформаційна</tspan></text>
<text x="198.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">які дані, де живуть, як течуть</text>
<text x="680.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">власники даних, DBA</text>
<rect x="30.0" y="204.0" width="840.0" height="40.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="204.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Конкурентна</tspan></text>
<text x="198.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">що працює паралельно, де синхронізація</text>
<text x="680.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">розробники, тестувальники</text>
<rect x="30.0" y="250.0" width="840.0" height="40.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="250.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Розробки</tspan></text>
<text x="198.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">як улаштований код, збірка, модулі</text>
<text x="680.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">команда розробки</text>
<rect x="30.0" y="296.0" width="840.0" height="40.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="320.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Розгортання</tspan></text>
<text x="198.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">на якому залізі це крутиться</text>
<text x="680.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">інфраструктура, DevOps</text>
<rect x="30.0" y="342.0" width="840.0" height="40.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="342.0" width="150.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Операційна</tspan></text>
<text x="198.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">як це запускати, стежити, лікувати</text>
<text x="680.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">експлуатація, підтримка</text>
