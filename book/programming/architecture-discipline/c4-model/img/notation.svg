<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія коробки й стрілки — з чого читається сама діаграма</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">нотація вільна, але кожна частина підпису має свою роль</text>
<rect x="100.0" y="165.0" width="300.0" height="152.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">API-сервіс</text>
<text x="250.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">[Контейнер]</text>
<text x="250.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Java · Spring Boot</text>
<text x="250.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">надає REST-API замовлень</text>
<line x1="400.0" y1="205.0" x2="458.0" y2="205.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="464.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 · назва — що це</text>
<line x1="400.0" y1="235.0" x2="458.0" y2="235.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="464.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2 · тип елемента (людина / система / контейнер / компонент)</text>
<line x1="400.0" y1="262.0" x2="458.0" y2="262.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="464.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3 · технологія у дужках</text>
<line x1="400.0" y1="292.0" x2="458.0" y2="292.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="464.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4 · опис — одне речення</text>
<rect x="120.0" y="415.0" width="180.0" height="54.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="210.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Веб-застосунок</text>
<rect x="510.0" y="415.0" width="180.0" height="54.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="600.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">API-сервіс</text>
<line x1="302.0" y1="442.0" x2="508.0" y2="442.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="405.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">надсилає запити [HTTPS/JSON]</text>
<text x="405.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">напрям стрілки = хто ініціює</text>
<text x="405.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">підпис = дія + протокол</text>
<text x="460.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коробка сама каже, що вона; стрілка — що передає й куди. Легенда обов'язкова, бо кольори в різних авторів різні.</text>
</svg>