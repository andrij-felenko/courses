<text x="500.0" y="527.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правиш модель раз — обидві діаграми оновлюються разом; проводиш заборонену залежність — падає складання.</text>
