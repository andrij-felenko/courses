<text x="883.8" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">+ стаття на InfoQ</text>
<text x="480.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не одна дата винаходу, а повільне визрівання: спершу практика, потім назви, потім ім'я, потім відкритий стандарт.</text>
