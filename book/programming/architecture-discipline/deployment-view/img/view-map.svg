<rect x="430.0" y="112.0" width="210.0" height="66.0" rx="6" fill="#fff6e6" stroke="#b8860b" stroke-width="1.5"/><text x="535.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">Динамічний в'ю</tspan><tspan x="535.0" dy="15.6">(як працює в часі)</tspan></text>
<rect x="430.0" y="208.0" width="210.0" height="66.0" rx="6" fill="#fff6e6" stroke="#b8860b" stroke-width="1.5"/><text x="535.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">В'ю розгортання</tspan><tspan x="535.0" dy="15.6">(на яке залізо лягає)</tspan></text>
