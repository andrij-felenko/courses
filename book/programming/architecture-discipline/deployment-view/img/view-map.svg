<rect x="100.0" y="246.0" width="190.0" height="36.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="268.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">Код</tspan></text>
