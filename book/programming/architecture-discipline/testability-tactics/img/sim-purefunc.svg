<text x="500.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">детермінований симулятор</text>
<rect x="330.0" y="116.0" width="340.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">віртуальний годинник — не time.Now()</tspan></text>
<rect x="330.0" y="168.0" width="340.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">засіяний PRNG — не глобальний rand()</tspan></text>
<rect x="330.0" y="220.0" width="340.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">симульовані мережа й диск</tspan></text>
<rect x="330.0" y="300.0" width="340.0" height="66.0" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="329.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ОДИН потік · подієвий цикл</tspan><tspan x="500.0" dy="15.6">симулятор тасує порядок і впорскує збої</tspan></text>
