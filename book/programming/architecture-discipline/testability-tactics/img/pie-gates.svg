<text x="560.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дефект стає видимим, лише коли пройде всі чотири ворота</text>
