<rect x="958.0" y="402.7" width="64.0" height="29.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="990.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">24%</text>
<rect x="94.6" y="455.5" width="930.8" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="560.0" y="476.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">тестовність = p(досяг) · p(зарази) · p(пошир) · p(вияви)   —   будь-який ≈ 0 робить добуток ≈ 0: дефект ховається</tspan></text>
