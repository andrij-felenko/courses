<rect x="80.0" y="99.9" width="200.0" height="56.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="180.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Досяжність</tspan><tspan x="180.0" dy="18.2">(reach)</tspan></text>
<rect x="350.0" y="99.9" width="200.0" height="56.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="450.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Зараження</tspan><tspan x="450.0" dy="18.2">(infect)</tspan></text>
<rect x="620.0" y="99.9" width="200.0" height="56.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="720.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Поширення</tspan><tspan x="720.0" dy="18.2">(propagate)</tspan></text>
<rect x="890.0" y="99.9" width="200.0" height="56.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="990.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Виявність</tspan><tspan x="990.0" dy="18.2">(reveal)</tspan></text>
<rect x="65.0" y="164.1" width="230.0" height="76.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.4"/><text x="180.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Керування: обрати</tspan><tspan x="180.0" dy="14.3">вхід, що доводить</tspan><tspan x="180.0" dy="14.3">виконання до</tspan><tspan x="180.0" dy="14.3">хворого місця</tspan></text>
<rect x="335.0" y="164.1" width="230.0" height="76.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.4"/><text x="450.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Керування: вхід має</tspan><tspan x="450.0" dy="14.3">зіпсувати внутрішній</tspan><tspan x="450.0" dy="14.3">стан, а не проскочити</tspan><tspan x="450.0" dy="14.3">повз хибний рядок</tspan></text>
<rect x="605.0" y="164.1" width="230.0" height="76.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.4"/><text x="720.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Мала DRR: не дати</tspan><tspan x="720.0" dy="14.3">виходу проковтнути</tspan><tspan x="720.0" dy="14.3">зіпсоване значення</tspan><tspan x="720.0" dy="14.3">(інформація не гине)</tspan></text>
<rect x="875.0" y="164.1" width="230.0" height="76.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.4"/><text x="990.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Спостереження: оракул</tspan><tspan x="990.0" dy="14.3">чи асерт мусить</tspan><tspan x="990.0" dy="14.3">дивитися саме туди,</tspan><tspan x="990.0" dy="14.3">де виліз дефект</tspan></text>
<text x="45.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">доживає до кроку:</text>
