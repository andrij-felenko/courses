<rect x="310.0" y="271.6" width="640.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">IEEE 1149.1: граничний скан</tspan><tspan x="630.0" dy="16.2">вбудовує доступ у залізо, коли</tspan><tspan x="630.0" dy="16.2">щупом уже не дотягтися</tspan></text>
