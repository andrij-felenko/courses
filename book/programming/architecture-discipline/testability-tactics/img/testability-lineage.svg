<line x1="250.0" y1="197.5" x2="310.0" y2="197.5" stroke="#2457d6" stroke-width="1.6"/>
<rect x="310.0" y="164.1" width="640.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">SCOAP (Сандія): перший алгоритм,</tspan><tspan x="630.0" dy="16.2">що рахує ці міри для кожної</tspan><tspan x="630.0" dy="16.2">лінії кристала</tspan></text>
<circle cx="250.0" cy="305.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<line x1="225.0" y1="305.0" x2="250.0" y2="305.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="75.0" y="281.6" width="150.0" height="46.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="150.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1990</tspan><tspan x="150.0" dy="16.2">Плати (JTAG)</tspan></text>
