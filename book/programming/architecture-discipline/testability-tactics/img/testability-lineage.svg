<rect x="75.0" y="66.6" width="150.0" height="46.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="150.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1959–60</tspan><tspan x="150.0" dy="16.2">Теорія керування</tspan></text>
<line x1="250.0" y1="90.0" x2="310.0" y2="90.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="310.0" y="56.6" width="640.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Калман уводить керованість</tspan><tspan x="630.0" dy="16.2">і спостережуваність як</tspan><tspan x="630.0" dy="16.2">властивості стану системи</tspan></text>
<circle cx="250.0" cy="197.5" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<line x1="232.6" y1="197.5" x2="250.0" y2="197.5" stroke="#2457d6" stroke-width="1.6"/>
