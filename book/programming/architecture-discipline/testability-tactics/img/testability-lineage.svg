<line x1="244.2" y1="412.5" x2="250.0" y2="412.5" stroke="#27ae60" stroke-width="1.6"/>
<rect x="55.8" y="389.1" width="188.5" height="46.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="408.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1991</tspan><tspan x="150.0" dy="16.2">Програмне забезпечення</tspan></text>
<line x1="250.0" y1="412.5" x2="310.0" y2="412.5" stroke="#27ae60" stroke-width="1.6"/>
<rect x="310.0" y="379.1" width="640.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Фрідман переносить пару в код</tspan><tspan x="630.0" dy="16.2">(доменна тестовність); Біндер, ~1994:</tspan><tspan x="630.0" dy="16.2">«керуй входом — спостерігай вихід»</tspan></text>
