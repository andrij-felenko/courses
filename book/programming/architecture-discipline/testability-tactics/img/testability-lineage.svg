<line x1="250.0" y1="520.0" x2="310.0" y2="520.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="310.0" y="486.6" width="640.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Бас, Клементс, Казман: пара стає</tspan><tspan x="630.0" dy="16.2">коренем дерева тактик тестовності</tspan><tspan x="630.0" dy="16.2">(розділ якісних атрибутів)</tspan></text>
