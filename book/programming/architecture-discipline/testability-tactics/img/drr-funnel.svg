<rect x="123.8" y="476.2" width="772.4" height="47.6" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/><text x="510.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Синій — правильний стан; червоний — стан, зіпсований дефектом. Обидва дають вихід B → дефект не видно.</tspan><tspan x="510.0" dy="15.6">DRR = |домен| / |діапазон|: велика DRR → сильне стискання → мала ймовірність, що дефект дотягнеться до виходу.</tspan></text>
