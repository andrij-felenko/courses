<text x="455.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">функція стискає: багато внутрішніх станів → мало виходів</text>
