<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="216.0" y="96.0" width="323.0" height="223.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/><text x="377.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="377.5" dy="0.0">КРИТИЧНИЙ ФОН — пастка</tspan><tspan x="377.5" dy="18.2">не вирізняє, та критичне</tspan><tspan x="377.5" dy="18.2">→ віддати спеціалістові,</tspan><tspan x="377.5" dy="18.2">для кого це ЯДРО</tspan><tspan x="377.5" dy="18.2">(платежі · зарплатня · вхід)</tspan></text>
<rect x="551.0" y="96.0" width="323.0" height="223.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="712.5" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">ЯДРО й критичне</tspan><tspan x="712.5" dy="18.2">вирізняє й не сміє впасти</tspan><tspan x="712.5" dy="18.2">→ БУДУВАТИ своє</tspan><tspan x="712.5" dy="18.2">(маршрут кур'єра)</tspan></text>
<rect x="216.0" y="331.0" width="323.0" height="223.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="377.5" y="420.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="377.5" dy="0.0">ФОН допоміжний</tspan><tspan x="377.5" dy="18.2">не вирізняє, збій не страшний</tspan><tspan x="377.5" dy="18.2">→ брати найдешевше готове</tspan><tspan x="377.5" dy="18.2">(розсилка · сховище)</tspan></text>
<rect x="551.0" y="331.0" width="323.0" height="223.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.6"/><text x="712.5" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">ЯДРО допоміжне</tspan><tspan x="712.5" dy="18.2">вирізняє, збій не фатальний</tspan><tspan x="712.5" dy="18.2">→ радше своє, легко</tspan></text>
<text x="545.0" y="612.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">вирізняльність →</text>
<text x="377.5" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">фон — не вирізняє</text>
<text x="712.5" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ядро — вирізняє</text>
<text x="210.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">критичність ↑</text>
<text x="194.0" y="201.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"><tspan x="194.0" dy="0.0">критичне</tspan><tspan x="194.0" dy="15.6">не впасти</tspan></text>
<text x="194.0" y="442.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">допоміжне</text>
</svg>