<rect x="43.7" y="114.6" width="142.6" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Стимул</tspan><tspan x="115.0" dy="16.9">запит приходить,</tspan><tspan x="115.0" dy="16.9">коли база лежить</tspan></text>
<rect x="300.0" y="95.0" width="170.0" height="110.0" rx="6" fill="#eef7ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="385.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Елемент системи</text>
