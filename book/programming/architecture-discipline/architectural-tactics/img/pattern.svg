<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патерн — готовий пакет із кількох тактик</text>
<rect x="60.0" y="70.0" width="660.0" height="220.0" rx="6" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="390.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПАТЕРН: «запобіжник» (circuit breaker)</text>
<text x="390.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">компроміс уже зашитий усередині — ти береш пакет цілком</text>
<rect x="85.0" y="170.0" width="190.0" height="90.0" rx="6" fill="#eef7ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="180.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тактика: виявити</text>
<text x="180.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">таймаут на</tspan><tspan x="180.0" dy="15.6">виклик</tspan></text>
<rect x="295.0" y="170.0" width="190.0" height="90.0" rx="6" fill="#eef7ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="390.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тактика: не допустити</text>
<text x="390.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">полічити збої,</tspan><tspan x="390.0" dy="15.6">розімкнути</tspan></text>
<rect x="505.0" y="170.0" width="190.0" height="90.0" rx="6" fill="#eef7ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="600.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тактика: оговтатись</text>
<text x="600.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">пробний запит,</tspan><tspan x="600.0" dy="15.6">замкнути назад</tspan></text>
</svg>