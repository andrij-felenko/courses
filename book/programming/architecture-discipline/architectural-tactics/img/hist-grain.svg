<rect x="345.0" y="92.0" width="250.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="470.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">GoF · 1994</text>
<text x="470.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">патерн — названий</text>
<text x="470.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">каталожний розв'язок;</text>
<text x="470.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">компроміс уже</text>
<text x="470.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">зашито автором</text>
<rect x="441.9" y="244.5" width="56.3" height="29.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="470.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ПАКЕТ</tspan></text>
<rect x="650.0" y="92.0" width="250.0" height="195.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="775.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Басс · SEI · 2003</text>
<text x="775.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тактика — один важіль,</text>
<text x="775.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна вимірна відповідь;</text>
