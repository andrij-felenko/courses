<rect x="317.2" y="483.4" width="425.5" height="43.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="501.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">Гістерезис живе на ребрі НА ПІДОЗРІ → ПІДНЯВСЯ (поріг пропусків);</tspan><tspan x="530.0" dy="14.3">затримка повернення — на ребрі ПОВЕРНЕННЯ → ГОЛОВНИЙ.</tspan></text>
