<rect x="675.0" y="371.5" width="220.0" height="57.1" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="2.2"/><text x="785.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">ПІДНЯВСЯ</tspan><tspan x="785.0" dy="17.6">резерв — новий головний</tspan></text>
<rect x="105.0" y="371.5" width="220.0" height="57.1" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="2.2"/><text x="215.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ПОВЕРНЕННЯ</tspan><tspan x="215.0" dy="17.6">старий доганяє стан</tspan></text>
