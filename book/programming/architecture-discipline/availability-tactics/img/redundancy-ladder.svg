<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резерв: що тепліший, то швидше відновлення — і дорожче</text>
<rect x="40.0" y="70.0" width="470.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.7"/>
<text x="56.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Гарячий резерв</text>
<text x="56.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">запасний працює й рахує те саме в реальному часі</text>
<text x="56.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">найдорожче: подвійне залізо весь час</text>
<rect x="550.0" y="96.0" width="250.0" height="26.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="810.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">мілісекунди</text>
<rect x="40.0" y="166.0" width="470.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/>
<text x="56.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Теплий резерв</text>
<text x="56.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">запасний увімкнений, але лише отримує стан, не рахує</text>
<text x="56.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">дешевше: залізо є, але простоює</text>
<rect x="550.0" y="192.0" width="175.0" height="26.0" rx="5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="735.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">секунди</text>
<rect x="40.0" y="262.0" width="470.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/>
<text x="56.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Холодний резерв</text>
<text x="56.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">запасний вимкнений; вмикають і піднімають стан після збою</text>
<text x="56.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-style="italic">найдешевше: залізо чекає вимкненим</text>
<rect x="550.0" y="288.0" width="100.0" height="26.0" rx="5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="660.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">хвилини</text>
<text x="550.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">час на відновлення →</text>
</svg>