<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три слова — бо втручатися можна у трьох різних місцях</text>
<line x1="760.0" y1="70.0" x2="760.0" y2="330.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="772.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">межа системи</text>
<text x="772.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усе, що правіше, —
бачить користувач</text>
<rect x="35.0" y="140.5" width="230.0" height="69.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="150.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ДЕФЕКТ (fault)</tspan><tspan x="150.0" dy="16.2">хибний рядок коду,</tspan><tspan x="150.0" dy="16.2">транзистор на грані</tspan></text>
<text x="150.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дрімає — роками нічого</text>
<rect x="315.0" y="140.5" width="230.0" height="69.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="430.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">ПОХИБКА (error)</tspan><tspan x="430.0" dy="16.2">зіпсоване значення</tspan><tspan x="430.0" dy="16.2">в пам'яті / стані</tspan></text>
<text x="430.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">спрацював → активний</text>
<rect x="775.0" y="140.5" width="190.0" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="870.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">ВІДМОВА (failure)</tspan><tspan x="870.0" dy="16.2">сервіс не той,</tspan><tspan x="870.0" dy="16.2">що обіцяли</tspan></text>
<line x1="271.0" y1="175.0" x2="307.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="248.5" y="115.3" width="83.0" height="39.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="290.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">спрацював</tspan><tspan x="290.0" dy="14.3">(активація)</tspan></text>
<line x1="551.0" y1="175.0" x2="767.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="621.6" y="115.3" width="76.7" height="39.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="660.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">прорвалася</tspan><tspan x="660.0" dy="14.3">за межу</tspan></text>
<rect x="60.0" y="300.0" width="200.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">прибрати, поки дрімає</tspan><tspan x="160.0" dy="14.3">→ відмови не буде</tspan></text>
<rect x="330.0" y="300.0" width="200.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">перехопити всередині</tspan><tspan x="430.0" dy="14.3">→ не дати вирватись</tspan></text>
<rect x="600.0" y="300.0" width="150.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">оговтатись швидко</tspan><tspan x="675.0" dy="14.3">→ скоротити простій</tspan></text>
</svg>