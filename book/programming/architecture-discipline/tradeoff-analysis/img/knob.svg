<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Trade-off — це одна ручка, а не список плюсів і мінусів</text>
<rect x="265.4" y="141.1" width="189.2" height="57.9" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.4"/><text x="360.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">розмір кешу / TTL</tspan><tspan x="360.0" dy="16.9">(одна ручка рішення)</tspan></text>
<rect x="77.5" y="63.0" width="144.9" height="53.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">швидкість</tspan><tspan x="150.0" dy="16.9">(латентність ↓)</tspan></text>
<line x1="265.4" y1="150.0" x2="222.4" y2="117.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">більше → краще</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="150.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="493.5" y="63.0" width="153.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="570.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">свіжість даних</tspan><tspan x="570.0" dy="16.9">(застарілість ↑)</tspan></text>
<line x1="454.6" y1="150.0" x2="493.5" y2="117.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">більше → гірше</text>
<circle cx="570.0" cy="150.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="570.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крутиш ОДНУ ручку — два атрибути рушають назустріч один одному.</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Немає «правильного» положення — є те, що краще для ЦИХ сценаріїв.</text>
</svg>