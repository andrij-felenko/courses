<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де природно живе кожна мова</text>
<text x="450.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама ідея «вузол → стрілка» — різні ніші застосування</text>
<rect x="90.0" y="110.0" width="340.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">PlantUML</tspan><tspan x="260.0" dy="16.9"></tspan><tspan x="260.0" dy="16.9">UML-нотації: класи, послідовності,</tspan><tspan x="260.0" dy="16.9">компоненти, стани, розгортання</tspan></text>
<rect x="470.0" y="110.0" width="340.0" height="130.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Mermaid</tspan><tspan x="640.0" dy="16.9"></tspan><tspan x="640.0" dy="16.9">легкі схеми прямо в markdown;</tspan><tspan x="640.0" dy="16.9">GitHub рендерить у тексті .md</tspan></text>
<line x1="200.0" y1="246.0" x2="200.0" y2="344.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">власний рушій у браузері</text>
<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">спирається на рушій нижче</text>
<rect x="90.0" y="350.0" width="720.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="385.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">DOT / Graphviz — низькорівневий рушій розкладки</tspan><tspan x="450.0" dy="16.9">(інші інструменти часто будують картинку на ньому)</tspan></text>
