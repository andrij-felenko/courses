<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна думка — «незворотність народжує складність» — і три її перевтілення</text>
<line x1="250.0" y1="90.0" x2="250.0" y2="500.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="250.0" y1="498.0" x2="250.0" y2="510.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="250.0" cy="130.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="228.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="end" font-weight="700">2002</text>
<text x="228.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Енріко Заніното</text>
<text x="228.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">XP 2002, Альгеро</text>
<rect x="274.0" y="92.0" width="330.0" height="76.0" rx="6" fill="#f7f9fb" stroke="#2457d6" stroke-width="1.5"/>
<line x1="258.0" y1="130.0" x2="274.0" y2="130.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="286.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">незворотність — одне з чотирьох</text>
<text x="286.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">джерел складності; Тойота</text>
<text x="286.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">приборкує складність, зменшуючи</text>
<text x="286.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">незворотність</text>
<text x="439.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">→ економічна теорема про виробництво</text>
<circle cx="250.0" cy="250.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="228.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="end" font-weight="700">2003</text>
<text x="228.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Мартін Фаулер</text>
<text x="228.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">«Who Needs an Architect?»</text>
<rect x="274.0" y="219.5" width="330.0" height="61.0" rx="6" fill="#f7f9fb" stroke="#27ae60" stroke-width="1.5"/>
<line x1="258.0" y1="250.0" x2="274.0" y2="250.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="286.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">задача архітектора —</text>
<text x="286.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прибирати незворотність, дати</text>
<text x="286.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">команді право передумати згодом</text>
<text x="439.0" y="293.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">→ порада ремесла проєктувальникові</text>
<circle cx="250.0" cy="370.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="228.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="end" font-weight="700">2015</text>
<text x="228.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Джеф Безос</text>
<text x="228.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">лист акціонерам Amazon</text>
<rect x="274.0" y="339.5" width="330.0" height="61.0" rx="6" fill="#f7f9fb" stroke="#c0392b" stroke-width="1.5"/>
<line x1="258.0" y1="370.0" x2="274.0" y2="370.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="286.0" y="357.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">однобічні / двобічні двері</text>
<text x="286.0" y="372.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">= Тип 1 / Тип 2; велика фірма</text>
<text x="286.0" y="387.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">душить себе важким процесом</text>
<text x="439.0" y="413.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">→ простий образ для будь-кого</text>
<circle cx="250.0" cy="470.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="228.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="end" font-weight="700">2016</text>
<text x="228.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Джеф Безос</text>
<text x="228.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">лист акціонерам Amazon</text>
<rect x="274.0" y="439.5" width="330.0" height="61.0" rx="6" fill="#f7f9fb" stroke="#c0392b" stroke-width="1.5"/>
<line x1="258.0" y1="470.0" x2="274.0" y2="470.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="286.0" y="457.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">70% інформації досить;</text>
<text x="286.0" y="472.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">повільність дорожча за помилку;</text>
<text x="286.0" y="487.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">«не згоден, але берусь»</text>
<text x="439.0" y="513.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">→ готове правило швидкості</text>
<text x="410.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ідея не належить одному: Заніното її вимовив, Фаулер приклав до архітектури, Безос дав образ і поширив</text>
</svg>