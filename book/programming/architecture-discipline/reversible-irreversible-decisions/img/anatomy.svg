<text x="450.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вартість відкату — добуток кількох осей; розміру рішення серед них немає</text>
