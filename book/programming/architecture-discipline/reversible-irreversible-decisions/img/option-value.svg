<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому зворотність коштує грошей: обрати ПІСЛЯ того, як дізнався — цінніше</text>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Два рівноймовірні майбутні (по ½); цінність рішення — умовні бали</text>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">майбутнє L: попит низький</text>
<rect x="150.0" y="132.0" width="54.0" height="198.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="214.0" y="264.0" width="54.0" height="66.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="150.0" y="132.0" width="54.0" height="198.0" rx="3" fill="none" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="177.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">9</text>
<text x="241.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<line x1="140.0" y1="330.0" x2="282.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="177.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">просте</text>
<text x="241.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">масштаб.</text>
<text x="520.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">майбутнє H: попит зростає</text>
<rect x="460.0" y="264.0" width="54.0" height="66.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="524.0" y="132.0" width="54.0" height="198.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="524.0" y="132.0" width="54.0" height="198.0" rx="3" fill="none" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="487.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3</text>
<text x="551.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">9</text>
<line x1="450.0" y1="330.0" x2="590.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="487.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">просте</text>
<text x="551.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">масштаб.</text>
<rect x="620.0" y="84.0" width="190.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="715.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">усереднено:</text>
<text x="632.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">жорстко A:  (9+3)/2 = 6</text>
<text x="632.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">жорстко B:  (3+9)/2 = 6</text>
<text x="632.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">гнучко:     (9+9)/2 = 9</text>
<line x1="632.0" y1="206.0" x2="798.0" y2="206.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="715.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">цінність зворотності</text>
<text x="715.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 9 − 6 = 3</text>
<text x="410.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Жорсткий вибір мусить угадати наперед; гнучкий вирішує, коли туман розвіявся — різниця і є ціна зворотності.</text>
<text x="410.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Гнучкий бере вищий стовпчик у кожному майбутньому (обведено).</text>
</svg>