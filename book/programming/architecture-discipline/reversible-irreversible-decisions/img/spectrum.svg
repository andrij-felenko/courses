<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рішення сортують не за розміром наслідків, а за вартістю відкату</text>
<line x1="70.0" y1="120.0" x2="710.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="708.0" y1="120.0" x2="718.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="70.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">двобічні двері</text>
<text x="70.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">вернувся — і майже нічого не втратив</text>
<text x="710.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">однобічні двері</text>
<text x="710.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">назад — тільки з великою кровʼю</text>
<text x="716.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">вартість відкату росте →</text>
<circle cx="101.0" cy="120.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<line x1="101.0" y1="120.0" x2="101.0" y2="101.3" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="101.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">назва змінної</text>
<circle cx="206.4" cy="120.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<line x1="206.4" y1="120.0" x2="206.4" y2="138.7" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="206.4" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">внутрішній модуль</text>
<text x="206.4" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">переписати</text>
<circle cx="355.2" cy="120.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="2.0"/>
<line x1="355.2" y1="120.0" x2="355.2" y2="101.3" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="355.2" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">REST-ендпойнт,</text>
<text x="355.2" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">яким користуються</text>
<circle cx="491.6" cy="120.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<line x1="491.6" y1="120.0" x2="491.6" y2="138.7" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="491.6" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">формат даних</text>
<text x="491.6" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">у базі</text>
<circle cx="628.0" cy="120.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<line x1="628.0" y1="120.0" x2="628.0" y2="101.3" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="628.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вибір хмари</text>
<text x="628.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">на весь стек</text>
<text x="390.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Дрібна зміна може бути однобічними дверима, а велика перебудова — двобічними: важить лише зворотність</text>
</svg>