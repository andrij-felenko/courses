<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен драйвер викреслює свою область простору структур</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">те, що переживає всіх драйверів одразу, — вузька зона здійсненного</text>
<rect x="50.0" y="70.0" width="660.0" height="370.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="80.0" y="105.0" width="300.0" height="95.0" rx="6" fill="#f0f0f0" stroke="#c0392b" stroke-width="1.7"/><text x="230.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">викреслено законом:</tspan><tspan x="230.0" dy="16.9">дані поза ЄС</tspan></text>
<rect x="405.0" y="110.0" width="285.0" height="90.0" rx="6" fill="#f0f0f0" stroke="#c0392b" stroke-width="1.7"/><text x="547.5" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="547.5" dy="0.0">не тримає 10× пік:</tspan><tspan x="547.5" dy="16.9">спільна вузька БД</tspan></text>
<rect x="80.0" y="300.0" width="250.0" height="105.0" rx="6" fill="#f0f0f0" stroke="#c0392b" stroke-width="1.7"/><text x="205.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">заборонено політикою:</tspan><tspan x="205.0" dy="16.9">чужий стек</tspan></text>
<rect x="375.0" y="300.0" width="305.0" height="105.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="527.5" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="527.5" dy="0.0">здійсненні структури:</tspan><tspan x="527.5" dy="16.9">пережили всіх драйверів</tspan></text>
</svg>