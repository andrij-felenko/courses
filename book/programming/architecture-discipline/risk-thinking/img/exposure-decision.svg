<text x="40" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic" transform="rotate(-90 40 360.0)">експозиція, людино-дні (вище = гірше)</text>
<text x="470.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кеш збиває головну скелю моноліта (тонкий сегмент вузького місця), та власні ризики переважують — за грубими числами моноліт легший</text>
