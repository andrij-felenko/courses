<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ми знаємо про власне незнання: чотири клітини</text>
<text x="340.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">усвідомлюємо</text>
<text x="656.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">НЕ усвідомлюємо</text>
<text x="158.0" y="177.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700" transform="rotate(-90 158.0 177.5)">знаємо</text>
<text x="158.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700" transform="rotate(-90 158.0 368.5)">НЕ знаємо</text>
<rect x="190.0" y="90.0" width="300.0" height="175.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="340.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Відоме відоме</text>
<text x="340.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">факти, на які спираємось.</tspan><tspan x="340.0" dy="16.5">Просто робимо.</tspan></text>
<rect x="506.0" y="90.0" width="300.0" height="175.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="656.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Відоме невідоме</text>
<text x="656.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">названий ризик.</tspan><tspan x="656.0" dy="16.5">Його В РЕЄСТР —</tspan><tspan x="656.0" dy="16.5">моніторити й гасити.</tspan></text>
<rect x="190.0" y="281.0" width="300.0" height="175.0" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="2.0"/>
<text x="340.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700">Невідоме відоме</text>
<text x="340.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">мовчазне знання команди,</tspan><tspan x="340.0" dy="16.5">не вимовлене вголос.</tspan><tspan x="340.0" dy="16.5">Витягти рев'ю.</tspan></text>
<rect x="506.0" y="281.0" width="300.0" height="175.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="656.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Невідоме невідоме</text>
<text x="656.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">чого й уявити не можемо.</tspan><tspan x="656.0" dy="16.5">Проти нього — лише</tspan><tspan x="656.0" dy="16.5">запас і зворотність.</tspan></text>
<text x="450.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">інженерна пара «known/unknown unknowns» — з аерокосмічної практики кінця 1960-х (unk-unks)</text>
