<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синьо-зелене</text>
<text x="480.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">два повні середовища</text>
<rect x="446.0" y="114.0" width="68.1" height="28.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="480.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">маршрут</tspan></text>
