<circle cx="182.0" cy="150.0" r="17.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.0"/><text x="182.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">v1</text>
