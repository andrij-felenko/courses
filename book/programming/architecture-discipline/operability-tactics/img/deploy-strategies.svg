<rect x="384.0" y="262.0" width="192.0" height="34.0" rx="6" fill="#f6faf7" stroke="#27ae60" stroke-width="1.3"/><text x="480.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">відкіт миттєвий; ×2 ресурси</tspan></text>
<text x="800.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канаркове</text>
