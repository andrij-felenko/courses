<circle cx="846.0" cy="208.0" r="17.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.0"/><text x="846.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">v1</text>
<text x="800.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">збій б'є по 1%, не по всіх</text>
<rect x="696.0" y="262.0" width="208.0" height="34.0" rx="6" fill="#f6faf7" stroke="#27ae60" stroke-width="1.3"/><text x="800.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">найобережніше; складна маршрутизація</tspan></text>
