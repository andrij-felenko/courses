<text x="160.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">живі завжди; ще й сумісність</text>
<text x="160.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">двох версій разом</text>
<rect x="60.0" y="262.0" width="200.0" height="34.0" rx="6" fill="#f6faf7" stroke="#27ae60" stroke-width="1.3"/><text x="160.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ощадливо; відкіт поступовий</tspan></text>
<line x1="320.0" y1="46.0" x2="320.0" y2="410.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
