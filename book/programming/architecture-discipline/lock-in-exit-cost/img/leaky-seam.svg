<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що протікає крізь чистий інтерфейс</text>
<rect x="140.0" y="56.5" width="580.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="430.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Свій інтерфейс:   put()  ·  get()  ·  list()</tspan></text>
<text x="430.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">у сигнатурах — лише типи й імена: тут усе виглядає чисто</text>
<line x1="60.0" y1="158.0" x2="800.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="68.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">шов</text>
<rect x="101.1" y="315.4" width="117.8" height="65.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="160.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">порядок:</tspan><tspan x="160.0" dy="15.6">читання одразу</tspan><tspan x="160.0" dy="15.6">після запису</tspan></text>
<line x1="160.0" y1="315.4" x2="160.0" y2="162.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="277.7" y="315.4" width="124.6" height="65.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="340.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">семантика збою:</tspan><tspan x="340.0" dy="15.6">виняток чи</tspan><tspan x="340.0" dy="15.6">код помилки</tspan></text>
<line x1="340.0" y1="315.4" x2="340.0" y2="162.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="457.7" y="315.4" width="124.6" height="65.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="520.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ретраї та</tspan><tspan x="520.0" dy="15.6">ідемпотентність</tspan><tspan x="520.0" dy="15.6">повтору</tspan></text>
<line x1="520.0" y1="315.4" x2="520.0" y2="162.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="644.5" y="315.4" width="110.9" height="65.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="700.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">затримка</tspan><tspan x="700.0" dy="15.6">під</tspan><tspan x="700.0" dy="15.6">навантаженням</tspan></text>
<line x1="700.0" y1="315.4" x2="700.0" y2="162.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">код нишком починає покладатися на конкретного вендора — попри чисті сигнатури</text>
</svg>