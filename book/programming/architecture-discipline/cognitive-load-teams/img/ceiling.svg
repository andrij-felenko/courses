<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмір сервісу впирається в стелю уваги, не в залізо</text>
<text x="450.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що обмежує розмір сервісу</text>
<text x="220.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна команда — одна стеля</text>
<line x1="60.0" y1="110.0" x2="380.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="380.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">стеля</text>
<rect x="90.0" y="230.0" width="78.0" height="150.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="129.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сервіс A</text>
<rect x="194.0" y="270.0" width="78.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="233.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сервіс B</text>
<rect x="298.0" y="290.0" width="78.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="337.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сервіс C</text>
<line x1="60.0" y1="380.0" x2="380.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="220.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">C вилазить за стелю → якість падає</text>
<line x1="450.0" y1="66.0" x2="450.0" y2="406.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="650.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залізо росте, голова — ні</text>
<text x="570.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАЛІЗО</text>
<line x1="570.0" y1="360.0" x2="570.0" y2="150.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="570.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="570.0" dy="0.0">додай вузлів —</tspan><tspan x="570.0" dy="12.6">масштабується</tspan></text>
<text x="730.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ГОЛОВА</text>
<line x1="730.0" y1="360.0" x2="730.0" y2="240.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="730.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">стеля</text>
<text x="730.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="730.0" dy="0.0">місткість —</tspan><tspan x="730.0" dy="12.6">майже стала</tspan></text>
</svg>