<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два важелі: зрізати стороннє або розрізати по межі області</text>
<text x="450.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи влізти під стелю</text>
<text x="230.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Зрізати стороннє</text>
<rect x="80.0" y="125.2" width="300.0" height="49.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Платформа бере на себе</tspan><tspan x="230.0" dy="15.6">збірку, деплой, моніторинг</tspan></text>
<line x1="230.0" y1="180.8" x2="230.0" y2="236.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="80.0" y="245.2" width="300.0" height="49.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="230.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Команда думає лише про</tspan><tspan x="230.0" dy="15.6">свою предметну область</tspan></text>
<line x1="450.0" y1="66.0" x2="450.0" y2="356.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="670.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Розрізати по межі області</text>
<rect x="520.0" y="125.2" width="300.0" height="49.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="670.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Одна команда тримає</tspan><tspan x="670.0" dy="15.6">дві незв'язані області</tspan></text>
<line x1="670.0" y1="180.8" x2="670.0" y2="236.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="524.0" y="250.0" width="140.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="594.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">Команда «Оплата»</tspan></text>
<rect x="678.0" y="250.0" width="140.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="748.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">Команда «Каталог»</tspan></text>
</svg>