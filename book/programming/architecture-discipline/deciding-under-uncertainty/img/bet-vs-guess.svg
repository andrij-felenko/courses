<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не вгадати наосліп, а зробити ставку дешевою й зворотною</text>
<text x="84.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Наосліп: угадати й забетонувати</text>
<rect x="106.5" y="125.0" width="157.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">велике рішення</tspan><tspan x="185.0" dy="16.9">одразу, на здогад</tspan></text>
<line x1="269.5" y1="150.0" x2="544.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="406.8" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">місяці коду на припущенні</text>
<rect x="604.0" y="106.0" width="150.0" height="88.0" rx="8" fill="#f7d7d2" stroke="#c0392b" stroke-width="2.4"/>
<text x="679.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="679.0" dy="0.0">припущення</tspan><tspan x="679.0" dy="16.2">хибне —</tspan><tspan x="679.0" dy="16.2">переробити все</tspan></text>
<text x="84.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Під невизначеністю: ставити дешево й вчитися</text>
<rect x="152.8" y="316.6" width="64.5" height="46.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">дешева</tspan><tspan x="185.0" dy="16.2">ставка</tspan></text>
<rect x="333.9" y="316.6" width="72.2" height="46.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">факт із</tspan><tspan x="370.0" dy="16.2">живого</tspan></text>
<rect x="515.0" y="316.6" width="80.0" height="46.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">звузити</tspan><tspan x="555.0" dy="16.2">варіанти</tspan></text>
<line x1="222.2" y1="340.0" x2="328.9" y2="340.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="411.1" y1="340.0" x2="510.0" y2="340.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 555.0 365.4 C 555.0 400.0, 185.0 400.0, 185.0 367.4" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
<text x="370.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">повторюй, поки певність не окупить ціну рішення</text>
<line x1="600.0" y1="340.0" x2="614.0" y2="340.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="613.7" y="315.1" width="92.5" height="49.9" rx="6" fill="#d8f3e3" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">рішення</tspan><tspan x="660.0" dy="16.9">на фактах</tspan></text>
</svg>