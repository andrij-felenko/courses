<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один вибір — і два атрибути тягнуться в різні боки</text>
<rect x="275.0" y="127.0" width="210.0" height="46.0" rx="8" fill="#eef7ef" stroke="#27ae60" stroke-width="1.6"/><text x="380.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">кешувати відповіді</text>
<text x="380.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(архітектурне рішення)</text>
<rect x="75.0" y="128.0" width="170.0" height="44.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="160.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">швидкість ↑</text>
<text x="160.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">відповідь за 5 мс</text>
<text x="160.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">замість 200 мс</text>
<line x1="272.0" y1="150.0" x2="250.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515.0" y="128.0" width="170.0" height="44.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="600.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">свіжість ↓</text>
<text x="600.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">дані можуть</text>
<text x="600.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">відставати на секунди</text>
<line x1="488.0" y1="150.0" x2="510.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="262.0" width="620.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Немає «просто кращого» рішення — є вибір, ЩО з чим міняємо.</text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ремесло архітектора — назвати обидва боки числом і вирішити свідомо,</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">а не відкрити відставання даних випадково у проді.</text>
</svg>