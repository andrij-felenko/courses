<text x="430.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Остання клітина — число, яке або досягнуто, або ні. Оце й робить атрибут перевірним.</text>
