<rect x="210.0" y="390.0" width="330.0" height="42.0" rx="0" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="375.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">95-й перцентиль ≤ 300 мс</text>
<rect x="540.0" y="390.0" width="320.0" height="42.0" rx="0" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
