<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як складалася мова про занепад систем</text>
<line x1="150.0" y1="80.0" x2="150.0" y2="550.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="150.0" cy="128.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="134.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1989-1992</text>
<line x1="156.0" y1="128.0" x2="190.0" y2="128.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="196.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Перрі й Вульф - засади архітектури</text>
<rect x="190.0" y="96.0" width="560.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="202.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Дали означення: архітектура = елементи + форма + обґрунтування.</text>
<text x="202.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Розкололи «архітектуру» на ЗАДУМАНУ форму й РЕАЛЬНИЙ стан -</text>
<text x="202.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">і назвали зазор між ними хворобою.</text>
<circle cx="150.0" cy="252.7" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="134.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1992</text>
<line x1="156.0" y1="252.7" x2="190.0" y2="252.7" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="196.0" y="210.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Ерозія проти дрейфу (те саме джерело)</text>
<rect x="190.0" y="220.7" width="560.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="202.0" y="242.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Дві різні причини одного наслідку:</text>
<text x="202.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ЕРОЗІЯ - від свідомих ПОРУШЕНЬ форми;</text>
<text x="202.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ДРЕЙФ - від НЕЧУТЛИВОСТІ, коли форми просто не помічають.</text>
<circle cx="150.0" cy="377.3" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="134.0" y="371.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">~сер. 1990-х</text>
<line x1="156.0" y1="377.3" x2="190.0" y2="377.3" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="196.0" y="335.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Марік кидає влучне слово</text>
<rect x="190.0" y="345.3" width="560.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="202.0" y="367.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">На гуртку патернів при Іллінойському університеті звучить</text>
<text x="202.0" y="387.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">назва «Big Ball of Mud» - і здогад, що це, можливо,</text>
<text x="202.0" y="407.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">і є панівна реальна «архітектура» галузі.</text>
<circle cx="150.0" cy="502.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="134.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1997</text>
<line x1="156.0" y1="502.0" x2="190.0" y2="502.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="196.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Фут і Йодер розгортають образ</text>
<rect x="190.0" y="470.0" width="560.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="202.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Праця «Big Ball of Mud» називає сили занепаду:</text>
<text x="202.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">РІСТ КЛАПТЯМИ (piecemeal growth) роз'їдає структуру,</text>
<text x="202.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ЛАТАННЯ НАШВИДКУРУЧ (expedient repair) множить рубці.</text>
<text x="410.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ліві дві віхи - суха академічна точність; праві дві - вулична влучність образу. Про одне явище.</text>
</svg>