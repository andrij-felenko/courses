<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три сорти когнітивного навантаження команди</text>
<text x="450.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Голова команди — обмежений посуд</text>
<rect x="250.0" y="110.0" width="400.0" height="300.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="450.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">межа того, що вміщає голова</text>
<rect x="270.0" y="300.0" width="360.0" height="90.0" rx="7" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="450.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішнє — суть домену</text>
<text x="450.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як влаштоване страхування, податок</text>
<text x="450.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">не викинеш — лише вмісти в межу</text>
<rect x="270.0" y="206.0" width="360.0" height="80.0" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доречне — осмислення продукту</text>
<text x="450.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як краще спроєктувати саме цю фічу</text>
<text x="450.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">заради нього й тримають команду</text>
<rect x="270.0" y="130.0" width="360.0" height="60.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="450.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побічне — тертя інструментів</text>
<text x="450.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">складання, розгортання, ключі — податок</text>
<line x1="642.0" y1="160.0" x2="780.0" y2="160.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="788.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">зрізати</text>
<text x="788.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">до нуля</text>
<line x1="242.0" y1="246.0" x2="130.0" y2="246.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="122.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">звільнене</text>
<text x="122.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">місце</text>
</svg>