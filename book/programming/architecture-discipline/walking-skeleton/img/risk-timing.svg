<rect x="492.0" y="108.0" width="110.0" height="24.0" rx="4" fill="#fdece9" stroke="#c0392b" stroke-width="1.3"/>
<text x="547.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">сервер</text>
<rect x="613.0" y="108.0" width="88.0" height="24.0" rx="4" fill="#fdece9" stroke="#c0392b" stroke-width="1.3"/>
<text x="657.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">екран</text>
<circle cx="756.0" cy="120.0" r="12.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="756.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">!</text>
<text x="756.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стик зібрано</text>
<text x="800.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">хиба інтеграції спливає пізно — переробляти дорого</text>
<text x="230.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">спершу ходячий</text>
<text x="230.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">кістяк</text>
<line x1="250.0" y1="260.0" x2="800.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="798.0" y1="260.0" x2="808.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="261.0" y="248.0" width="60.5" height="24.0" rx="4" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="291.2" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кістяк</text>
<circle cx="332.5" cy="260.0" r="12.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="332.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">!</text>
<text x="352.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">стик зібрано в перший тиждень</text>
<rect x="371.0" y="248.0" width="110.0" height="24.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="426.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">давач</text>
<rect x="492.0" y="248.0" width="110.0" height="24.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="547.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">прошивка</text>
<rect x="613.0" y="248.0" width="176.0" height="24.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="701.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">решта</text>
<text x="800.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">хибу знайдено дешево — м'ясо наростає на робочому кістяку</text>
<text x="440.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Та сама помилка коштує тим менше, чим раніше її зустріти; кістяк призначає зустріч на перший тиждень</text>
</svg>