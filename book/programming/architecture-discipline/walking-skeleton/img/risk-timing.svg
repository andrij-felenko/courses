<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кістяк не прибирає ризик інтеграції — він переносить зустріч із ним на початок</text>
<text x="230.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">спершу вузли</text>
<text x="230.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">поодинці</text>
<line x1="250.0" y1="120.0" x2="800.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="798.0" y1="120.0" x2="808.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="261.0" y="108.0" width="99.0" height="24.0" rx="4" fill="#fdece9" stroke="#c0392b" stroke-width="1.3"/>
<text x="310.5" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">давач</text>
<rect x="371.0" y="108.0" width="110.0" height="24.0" rx="4" fill="#fdece9" stroke="#c0392b" stroke-width="1.3"/>
