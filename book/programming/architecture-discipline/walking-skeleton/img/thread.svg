<text x="84.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">давач</text>
<rect x="133.0" y="150.0" width="58.0" height="46.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="162.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">прошивка</text>
