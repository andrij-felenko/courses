<line x1="267.0" y1="173.0" x2="291.0" y2="173.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="345.0" y1="173.0" x2="369.0" y2="173.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="205.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">одне значення доходить до екрана —</text>
<text x="205.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">усі стики вже працюють</text>
<line x1="430.0" y1="55.0" x2="430.0" y2="375.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="620.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вузли поодинці</text>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">готові, але не з'єднані</text>
