<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кістяк — не завжди правильний хід: спершу спитай, де сидить головний ризик</text>
<rect x="360.0" y="52.0" width="180.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="450.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Де сидить</tspan><tspan x="450.0" dy="16.2">головний ризик?</tspan></text>
<line x1="450.0" y1="98.0" x2="167.5" y2="145.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="150.0" width="215.0" height="74.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.3"/><text x="167.5" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">На стиках між частинами —</tspan><tspan x="167.5" dy="14.3">чи складеться ціле?</tspan></text>
<line x1="167.5" y1="224.0" x2="167.5" y2="263.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="268.0" width="215.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="167.5" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Ходячий кістяк —</tspan><tspan x="167.5" dy="14.3">тонка нитка крізь усі</tspan><tspan x="167.5" dy="14.3">вузли, лишається жити</tspan></text>
<line x1="450.0" y1="98.0" x2="442.5" y2="145.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335.0" y="150.0" width="215.0" height="74.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.3"/><text x="442.5" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="442.5" dy="0.0">Усередині одного вузла —</tspan><tspan x="442.5" dy="14.3">важкий алгоритм,</tspan><tspan x="442.5" dy="14.3">точність, швидкодія?</tspan></text>
<line x1="442.5" y1="224.0" x2="442.5" y2="263.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335.0" y="268.0" width="215.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="442.5" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="442.5" dy="0.0">Спайк — тонко, але</tspan><tspan x="442.5" dy="14.3">вглиб ОДНОГО вузла;</tspan><tspan x="442.5" dy="14.3">код викидний</tspan></text>
<line x1="450.0" y1="98.0" x2="732.5" y2="145.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="150.0" width="215.0" height="74.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.3"/><text x="732.5" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">Чи потрібне це взагалі —</tspan><tspan x="732.5" dy="14.3">цінність для людей?</tspan></text>
<line x1="732.5" y1="224.0" x2="732.5" y2="263.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="268.0" width="215.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/><text x="732.5" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">MVP — найменше,</tspan><tspan x="732.5" dy="14.3">чим уже</tspan><tspan x="732.5" dy="14.3">користуються</tspan></text>
<text x="450.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Кістяк прицільно б'є ризик інтеграції — «чи складеться ціле». Інші ризики просять інших інструментів.</text>
</svg>