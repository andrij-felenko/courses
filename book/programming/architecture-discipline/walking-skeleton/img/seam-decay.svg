<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">5 вузлів (4 стики) —</tspan><tspan x="700.0" dy="13.7">≈ 18% з першого разу</tspan></text>
