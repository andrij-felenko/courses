<text x="450.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ризик архітектури живе на стиках; що більше вузлів, то менший шанс, що все стикнеться саме собою</text>
