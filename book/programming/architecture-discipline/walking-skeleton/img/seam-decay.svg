<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ризик сидить на стиках: один стик — пучок домовленостей, і з кожним вузлом шанс тане</text>
<line x1="470.0" y1="52.0" x2="470.0" y2="400.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="238.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Один стик — пучок незалежних домовленостей</text>
<rect x="70.0" y="110.0" width="78.0" height="46.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="109.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">частина A</text>
<rect x="330.0" y="110.0" width="78.0" height="46.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="369.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">частина B</text>
<text x="239.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стик</text>
<line x1="150.0" y1="133.0" x2="328.0" y2="133.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="239.0" y1="118.0" x2="239.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="239.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на ньому мусять збігтися:</text>
<rect x="78.0" y="200.0" width="322.0" height="28.0" rx="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="239.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">формат кадру</tspan></text>
<rect x="78.0" y="234.0" width="322.0" height="28.0" rx="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="239.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">порядок байтів і полів</tspan></text>
<rect x="78.0" y="268.0" width="322.0" height="28.0" rx="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="239.0" y="285.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">одиниці й масштаб</tspan></text>
<rect x="78.0" y="302.0" width="322.0" height="28.0" rx="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="239.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">семантика помилок і таймаутів</tspan></text>
<rect x="78.0" y="336.0" width="322.0" height="28.0" rx="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="239.0" y="353.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">версія та автентифікація</tspan></text>
<text x="239.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожна — окремий шанс на розбіжність</text>
<text x="690.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шанс, що весь ланцюг стикнеться з першого разу</text>
