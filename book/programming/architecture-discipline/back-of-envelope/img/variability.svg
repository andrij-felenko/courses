<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мінливість обслуговування множить чергу (Полачек–Хінчин)</text>
<rect x="210.0" y="54.5" width="440.0" height="35.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">W_q = [ρ/(1−ρ)] · S · (1+C²)/2</tspan></text>
<line x1="90.0" y1="372.0" x2="790.0" y2="372.0" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="130.0" y="349.0" width="120.0" height="23.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">×0.5</text>
<text x="190.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Детермінований</tspan><tspan x="190.0" dy="15.6">C² = 0</tspan></text>
<rect x="370.0" y="326.0" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="430.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">×1.0</text>
<text x="430.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Експоненційний</tspan><tspan x="430.0" dy="15.6">C² = 1</tspan></text>
<rect x="610.0" y="142.0" width="120.0" height="230.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="670.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">×5.0</text>
<text x="670.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Мінливий (H₂)</tspan><tspan x="670.0" dy="15.6">C² = 9</tspan></text>
<text x="430.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий ρ і S — черга різниться в ×10: зменшити розкид обслуговування = вкоротити хвіст</text>
</svg>