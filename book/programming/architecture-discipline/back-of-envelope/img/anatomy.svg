<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прикидка: розкласти · оцінити кожне грубо · перемножити · перевірити</text>
<rect x="300.0" y="64.5" width="280.0" height="35.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Питання: скільки?</tspan></text>
<rect x="70.0" y="151.1" width="210.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">скільки</tspan><tspan x="175.0" dy="16.9">одиниць</tspan></text>
<rect x="335.0" y="151.1" width="210.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">× частка,</tspan><tspan x="440.0" dy="16.9">що годиться</tspan></text>
<rect x="600.0" y="151.1" width="210.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">× скільки на одну /</tspan><tspan x="705.0" dy="16.9">як часто</tspan></text>
<line x1="440.0" y1="99.5" x2="175.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">розклад на множники</text>
<rect x="240.0" y="270.5" width="400.0" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="293.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">≈ 10ⁿ   —   одна значуща цифра</tspan></text>
<line x1="175.0" y1="200.0" x2="270.0" y2="270.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="376.2" width="300.0" height="47.6" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Інший бік:</tspan><tspan x="230.0" dy="15.6">сходиться з відомим згори?</tspan></text>
<rect x="490.0" y="376.2" width="320.0" height="47.6" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Межі:</tspan><tspan x="650.0" dy="15.6">не менше нуля, не більше світу?</tspan></text>
<line x1="400.0" y1="305.5" x2="230.0" y2="376.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="305.5" x2="650.0" y2="376.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">перевірка</text>
<text x="440.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">жодне число не мусить бути точним — похибки гасять одна одну</text>
</svg>