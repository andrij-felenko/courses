<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Little's Law: скільки всередині = темп надходження × час усередині</text>
<rect x="310.0" y="95.0" width="300.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="460.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">система</text>
<circle cx="370.0" cy="150.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="420.0" cy="175.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="470.0" cy="150.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="520.0" cy="176.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="560.0" cy="150.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="410.0" cy="200.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="500.0" cy="200.0" r="9.0" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<line x1="150.0" y1="165.0" x2="306.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">λ надходять (req/с)</text>
<line x1="614.0" y1="165.0" x2="782.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="694.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">виходять</text>
<text x="460.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">L — скільки одиниць усередині водночас</text>
<text x="460.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">W — скільки часу кожна проводить усередині</text>
<rect x="155.0" y="332.0" width="190.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">L = λ · W</tspan></text>
<rect x="485.0" y="327.1" width="320.0" height="49.9" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="645.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">λ = 2000/с · W = 0.05 с</tspan><tspan x="645.0" dy="16.9">→ L = 100 у роботі водночас</tspan></text>
<text x="450.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий закон дає число потоків, розмір пулу з'єднань і пам'ять під запити в польоті</text>
</svg>