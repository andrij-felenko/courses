<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен «тік» кварцу додає одиницю до регістра-лічильника — самотужки, без участі коду</text>
