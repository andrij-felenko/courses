<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кварц дає рівний тік — апаратний лічильник його відмірює. Прочитав число — знаєш час.</text>
