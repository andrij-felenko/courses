<rect x="130.0" y="364.0" width="720.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="490.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SYNC не вдався → «Failed to connect»:</text>
<text x="490.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зазвичай авто-скидання / strapping не спрацювало (§4.2.6).</text>
