<rect x="130.0" y="290.0" width="720.0" height="48.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="152.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Перевірка MD5</text>
