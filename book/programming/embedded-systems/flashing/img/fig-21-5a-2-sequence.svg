<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як esptool заливає прошивку: від рукостискання до перевірки</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спершу домовитися з ROM-завантажувачем, тоді залити швидкий stub — і вже ним прошивати</text>
<circle cx="90.0" cy="116.0" r="18.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="90.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="130.0" y="92.0" width="720.0" height="48.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="152.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">SYNC</text>
<text x="152.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">рукостискання з ROM-завантажувачем</text>
<line x1="90.0" y1="134.0" x2="90.0" y2="158.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
