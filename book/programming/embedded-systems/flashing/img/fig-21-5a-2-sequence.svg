<rect x="130.0" y="224.0" width="720.0" height="48.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="152.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">FLASH: BEGIN → DATA → END</text>
<text x="152.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стерти, писати блоками (кожен із сумою)</text>
<line x1="90.0" y1="266.0" x2="90.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
