<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чіп прошиває сам себе: ПК диктує, ROM-завантажувач пише Flash</text>
<rect x="22.9" y="126.2" width="124.2" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="85.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">ПК</tspan><tspan x="85.0" dy="15.6">(диктує байти)</tspan></text>
<rect x="230.0" y="70.0" width="420.0" height="160.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="440.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Мікроконтролер</text>
<rect x="252.0" y="120.0" width="200.0" height="84.0" rx="6" fill="#fbf3df" stroke="#a9791f" stroke-width="2.0"/><text x="352.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a9791f" text-anchor="middle" font-weight="700"><tspan x="352.0" dy="0.0">ROM-завантажувач</tspan><tspan x="352.0" dy="14.3">(заводський, незмінний)</tspan></text>
<rect x="490.0" y="120.0" width="130.0" height="84.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="2.0"/><text x="555.0" y="158.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Flash</tspan><tspan x="555.0" dy="15.6">(образ)</tspan></text>
<line x1="147.1" y1="150.0" x2="228.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="188.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дріт</text>
<line x1="452.0" y1="162.0" x2="488.0" y2="162.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="471.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">пише</text>
<text x="370.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ROM незнищенний → першу й будь-яку наступну прошивку приймає він; чіп не «закам'яніє»</text>
