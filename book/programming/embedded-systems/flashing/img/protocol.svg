<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмова ПК із ROM-завантажувачем: стерти → блоки з перевіркою → звірити</text>
<rect x="40.0" y="120.0" width="200.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Стерти</text>
<line x1="56.0" y1="158.0" x2="224.0" y2="158.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="140.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">флеш пишеться</tspan><tspan x="140.0" dy="13.7">лише по чистому</tspan></text>
<rect x="280.0" y="120.0" width="200.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="380.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Блоки + сума</text>
<line x1="296.0" y1="158.0" x2="464.0" y2="158.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">до кожного блоку —</tspan><tspan x="380.0" dy="13.7">контрольна сума</tspan></text>
<line x1="242.0" y1="168.0" x2="278.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="520.0" y="120.0" width="200.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="620.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Звірити</text>
<line x1="536.0" y1="158.0" x2="704.0" y2="158.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">чи лягло саме те,</tspan><tspan x="620.0" dy="13.7">що слали</tspan></text>
<line x1="482.0" y1="168.0" x2="518.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="160.0" y="252.0" width="320.0" height="44.0" rx="6" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="200.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7fe0a0" text-anchor="start" font-weight="700">блок даних</text>
<rect x="380.0" y="258.0" width="92.0" height="32.0" rx="6" fill="#351313" stroke="#c0392b" stroke-width="1.4"/>
<text x="426.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f0b0b0" text-anchor="middle" font-weight="700">сума</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дріт неідеальний — тому кожен блок перевіряють контрольною сумою</text>
</svg>