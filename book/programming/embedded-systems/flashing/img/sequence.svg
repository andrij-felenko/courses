<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири кроки esptool: SYNC → stub → FLASH → перевірка MD5</text>
<rect x="30.0" y="110.0" width="160.0" height="100.0" rx="6" fill="#fbf3df" stroke="#a9791f" stroke-width="2.0"/>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a9791f" text-anchor="middle" font-weight="700">SYNC</text>
<line x1="44.0" y1="150.0" x2="176.0" y2="150.0" stroke="#a9791f" stroke-width="1.2"/>
<text x="110.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">рукостискання:</tspan><tspan x="110.0" dy="13.0">чіп на зв'язку?</tspan></text>
<rect x="220.0" y="110.0" width="160.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">STUB у RAM</text>
<line x1="234.0" y1="150.0" x2="366.0" y2="150.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="300.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">швидкий</tspan><tspan x="300.0" dy="13.0">«прошивач»</tspan></text>
<line x1="192.0" y1="160.0" x2="218.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="410.0" y="110.0" width="160.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="490.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">FLASH блоками</text>
<line x1="424.0" y1="150.0" x2="556.0" y2="150.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="490.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">стерти й писати,</tspan><tspan x="490.0" dy="13.0">кожен блок із сумою</tspan></text>
<line x1="382.0" y1="160.0" x2="408.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="600.0" y="110.0" width="160.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="680.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">перевірка MD5</text>
<line x1="614.0" y1="150.0" x2="746.0" y2="150.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="680.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">звірити суму</tspan><tspan x="680.0" dy="13.0">регіону</tspan></text>
<line x1="572.0" y1="160.0" x2="598.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">сума кожного блоку ловить спотворення в дорозі; MD5 наприкінці доводить — лягло саме те, що слали</text>
</svg>