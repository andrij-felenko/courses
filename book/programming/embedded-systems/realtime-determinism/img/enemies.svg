<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вороги реального часу: що руйнує передбачуваність</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">уникай їх на критичному шляху, інакше найгірший випадок «попливе»</text>
<rect x="20.0" y="78.0" width="168.0" height="150.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="104.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Інверсія пріоритетів</text>
<line x1="34.0" y1="114.0" x2="174.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="104.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="104.0" dy="0.0">низька тримає замок,</tspan><tspan x="104.0" dy="11.7">висока чекає</tspan><tspan x="104.0" dy="11.7">→ успадкування пріор.</tspan></text>
<rect x="204.0" y="78.0" width="168.0" height="150.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="288.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="700">Задовге блокування</text>
<line x1="218.0" y1="114.0" x2="358.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="288.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="288.0" dy="0.0">замок або очікування</tspan><tspan x="288.0" dy="11.7">надто довго</tspan><tspan x="288.0" dy="11.7">→ тримай коротко</tspan></text>
<rect x="388.0" y="78.0" width="168.0" height="150.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="472.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Необмежені операції</text>
<line x1="402.0" y1="114.0" x2="542.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="472.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">купа, довга ISR,</tspan><tspan x="472.0" dy="11.7">busy-wait, рекурсія</tspan><tspan x="472.0" dy="11.7">→ геть із шляху</tspan></text>
<rect x="572.0" y="78.0" width="168.0" height="150.0" rx="12" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="656.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a4fb0" text-anchor="middle" font-weight="700">Голодування</text>
<line x1="586.0" y1="114.0" x2="726.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="656.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">зажерлива висока</tspan><tspan x="656.0" dy="11.7">не дає бігти нижчим</tspan><tspan x="656.0" dy="11.7">→ дай решті час</tspan></text>
<rect x="110.0" y="256.0" width="540.0" height="64.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Спільне в усіх ворогів одне: вони роблять найгірший випадок невідомим</tspan><tspan x="380.0" dy="12.2">або величезним — а без відомого найгіршого випадку</tspan><tspan x="380.0" dy="12.2">реальний час гарантувати неможливо.</tspan></text>
</svg>