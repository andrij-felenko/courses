<text x="710.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ жоден раз не перейшла межу</text>
<rect x="150.0" y="300.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Реальний час обирає ПРАВУ систему: повільнішу в середньому, зате таку, що НІКОЛИ</text>
<text x="480.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не запізнюється понад межу. Передбачуваність важливіша за рекордну швидкість.</text>
