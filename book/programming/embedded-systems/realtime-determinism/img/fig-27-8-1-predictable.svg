<text x="710.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Не найшвидша, та ЗАВЖДИ в межах</text>
