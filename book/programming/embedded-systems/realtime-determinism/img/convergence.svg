<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як усе сходиться: до здатності обіцяти час</text>
<text x="390.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">від простого циклу без жодних гарантій — до системи, що встигає гарантовано</text>
<rect x="17.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="75.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Super-loop</text>
<text x="75.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="75.0" dy="0.0">просто, та</tspan><tspan x="75.0" dy="11.7">без гарантій</tspan></text>
<line x1="134.0" y1="136.0" x2="142.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="143.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="201.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Задачі</text>
<text x="201.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="201.0" dy="0.0">кожна —</tspan><tspan x="201.0" dy="11.7">проста справа</tspan></text>
<line x1="260.0" y1="136.0" x2="268.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="269.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="327.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="700">Планувальник</text>
<text x="327.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="327.0" dy="0.0">пріоритети,</tspan><tspan x="327.0" dy="11.7">витіснення</tspan></text>
<line x1="386.0" y1="136.0" x2="394.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="453.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">FreeRTOS</text>
<text x="453.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="453.0" dy="0.0">ядро + два</tspan><tspan x="453.0" dy="11.7">ядра ESP32</tspan></text>
<line x1="512.0" y1="136.0" x2="520.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="521.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="579.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a4fb0" text-anchor="middle" font-weight="700">Обмін</text>
<text x="579.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="579.0" dy="0.0">черги,</tspan><tspan x="579.0" dy="11.7">м'ютекси</tspan></text>
<line x1="638.0" y1="136.0" x2="646.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="647.0" y="94.0" width="116.0" height="84.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="705.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Реальний час</text>
<text x="705.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">гарантовано</tspan><tspan x="705.0" dy="11.7">вчасно</tspan></text>
<rect x="120.0" y="226.0" width="540.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Super-loop не міг обіцяти час; задачі з пріоритетним витісненням,</tspan><tspan x="390.0" dy="12.5">обмеженими затримками RTOS і дбайливим дизайном — можуть.</tspan><tspan x="390.0" dy="12.5">Це й є реальний час: не «якось працює»,</tspan><tspan x="390.0" dy="12.5">а «гарантовано встигає».</tspan></text>
</svg>