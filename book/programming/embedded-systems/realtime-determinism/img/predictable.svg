<text x="670.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">дедлайн</text>
<text x="549.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">жодного разу не за межу</text>
<rect x="110.0" y="286.0" width="540.0" height="56.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Реальний час обирає праву систему: повільнішу в середньому,</tspan><tspan x="380.0" dy="14.3">зате таку, що ніколи не запізнюється понад межу.</tspan></text>
