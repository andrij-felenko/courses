<rect x="464.0" y="156.0" width="26.0" height="74.0" rx="2" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="498.0" y="162.0" width="26.0" height="68.0" rx="2" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="532.0" y="158.0" width="26.0" height="72.0" rx="2" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<rect x="566.0" y="154.0" width="26.0" height="76.0" rx="2" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
