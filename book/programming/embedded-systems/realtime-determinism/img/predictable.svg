<line x1="44.0" y1="150.0" x2="286.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="6,3"/>
<text x="40.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end" font-weight="700">дедлайн</text>
<text x="169.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">один сплеск зірвав строк</text>
<text x="549.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Не найшвидша, та завжди в межах</text>
