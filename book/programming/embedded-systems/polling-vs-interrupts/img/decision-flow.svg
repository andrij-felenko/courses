<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три питання поспіль ведуть до інструмента</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">хоч одне «так» — переривання; обидва «ні» — досить опитування</text>
<rect x="290.0" y="85.0" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Подія рідкісна чи</tspan><tspan x="440.0" dy="16.9">випадкова в часі?</tspan></text>
<rect x="270.0" y="205.1" width="340.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Реагувати вмить</tspan><tspan x="440.0" dy="16.9">або не можна проґавити?</tspan></text>
<line x1="440.0" y1="134.9" x2="440.0" y2="205.1" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ні</text>
<rect x="640.0" y="153.0" width="200.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="174.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">ПЕРЕРИВАННЯ</tspan></text>
<line x1="590.0" y1="110.0" x2="640.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<line x1="610.0" y1="230.0" x2="640.0" y2="182.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<rect x="340.0" y="333.0" width="200.0" height="34.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">ОПИТУВАННЯ</tspan></text>
<line x1="440.0" y1="254.9" x2="440.0" y2="333.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ні</text>
<text x="440.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека (аварія, перегрів) — переривання поза чергою, хай там що.</text>
<text x="440.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Саму обробку події майже завжди виносять у loop() через прапорець.</text>
</svg>