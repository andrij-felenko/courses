<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<rect width="900" height="660" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: як цілий комп'ютер уміщується в одну крихту</text>
<text x="450.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок — нове питання, що штовхало далі (сірим — те, що стане змістом Розділу 20)</text>
<line x1="218.0" y1="96.0" x2="218.0" y2="630.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="218.0" cy="126.0" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="196.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">до 1971</text>
<text x="244.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Комп'ютер = шафа</text>
<text x="244.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Логіка з сотень окремих чипів. Чи влізе ВЕСЬ комп'ютер на один кристал?</text>
<circle cx="218.0" cy="220.8" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="196.0" y="225.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1960-ті</text>
<text x="244.0" y="217.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Калькуляторна гонка / Busicom · TI · Sharp</text>
<text x="244.0" y="237.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Десятки чипів на калькулятор — дорого. Як здешевити? → стиснути в один</text>
<circle cx="218.0" cy="315.6" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="196.0" y="320.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1971</text>
<text x="244.0" y="312.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Intel 4004 / Hoff · Faggin</text>
<text x="244.0" y="332.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Процесор на чипі! Та ПЗП і ОЗП — ще ОКРЕМО. Це МІКРОПРОЦЕСОР</text>
<circle cx="218.0" cy="410.4" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="196.0" y="415.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1971</text>
<text x="244.0" y="407.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">TI TMS0100 / Boone · Cochran</text>
<text x="244.0" y="427.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Цілий комп'ютер на чипі: ПЗП+ОЗП+I/O всередині. Це МІКРОКОНТРОЛЕР</text>
<circle cx="218.0" cy="505.2" r="10.0" fill="#ffffff" stroke="#c0271e" stroke-width="3"/>
<circle cx="218.0" cy="505.2" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="196.0" y="510.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1974</text>
<text x="244.0" y="502.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">TMS1000</text>
<text x="244.0" y="522.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Програмований МК за долар → сотні мільйонів штук у речах</text>
<rect x="210.0" y="592.0" width="16.0" height="16.0" rx="3" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="196.0" y="605.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 20</text>
<text x="244.0" y="597.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ESP32</text>
<text x="244.0" y="617.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">З чого МК складається й чим ESP32 особливий?</text>
</svg>
