<rect x="105.0" y="336.0" width="220.0" height="50.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.4"/><text x="215.0" y="357.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">DIP-панелька</tspan><tspan x="215.0" dy="14.3">(чип вийнятний)</tspan></text>
<rect x="535.0" y="336.0" width="220.0" height="50.0" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.4"/><text x="645.0" y="357.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">WROOM-модуль</tspan><tspan x="645.0" dy="14.3">(чип назавжди припаяний)</tspan></text>
