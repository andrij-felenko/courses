<rect x="105.0" y="176.0" width="220.0" height="50.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.4"/><text x="215.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Зовнішній кварц 16 МГц</tspan><tspan x="215.0" dy="14.3">(фіксована частота, без PLL)</tspan></text>
<rect x="535.0" y="176.0" width="220.0" height="50.0" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.4"/><text x="645.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Кварц 40 МГц + PLL</tspan><tspan x="645.0" dy="14.3">(до 240 МГц; всередині чипа)</tspan></text>
<rect x="105.0" y="261.0" width="220.0" height="50.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.4"/><text x="215.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Лінійний стабілізатор</tspan><tspan x="215.0" dy="14.3">(5 В або 3.3 В)</tspan></text>
