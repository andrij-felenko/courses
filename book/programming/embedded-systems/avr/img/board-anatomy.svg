<rect x="570.0" y="406.0" width="150.0" height="56.0" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.4"/><text x="645.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Кнопки EN + BOOT</tspan><tspan x="645.0" dy="14.3">+ гребінки GPIO</tspan><tspan x="645.0" dy="14.3">(рівні: 3.3 В!)</tspan></text>
<rect x="87.0" y="482.0" width="686.0" height="27.0" rx="6" fill="#f8f8f8" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="499.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">навколо 8-бітного AVR — більше дискретних вузлів; у ESP32 USB-логіку й тактування глибше в чипі</tspan></text>
