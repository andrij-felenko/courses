<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка за відмови — це конвеєр</text>
<rect x="30.0" y="70.0" width="220.0" height="220.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="140.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Виявити</text>
<text x="48.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">звірка давачів</text>
<text x="48.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">(не згодні?)</text>
<text x="48.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">телеметрія ESC</text>
<text x="48.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">watchdog (завис?)</text>
<text x="48.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">струм і температура</text>
<rect x="290.0" y="70.0" width="220.0" height="220.0" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<text x="400.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">2. Вирішити</text>
<text x="308.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">який failsafe доречний:</text>
<text x="308.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• на резерв</text>
<text x="308.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• повернутись додому</text>
<text x="308.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• сісти / планувати</text>
<text x="308.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• роззброїти на землі</text>
<rect x="550.0" y="70.0" width="220.0" height="220.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="660.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Деградувати</text>
<text x="568.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">виконати реакцію:</text>
<text x="568.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">втратити трохи,</text>
<text x="568.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">а не все одразу;</text>
<text x="568.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">реакція зашита</text>
<text x="568.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">заздалегідь</text>
<line x1="254.0" y1="180.0" x2="286.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="514.0" y1="180.0" x2="546.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не можна зреагувати на відмову, якої не помітив — тому виявлення найважливіше</text>
</svg>