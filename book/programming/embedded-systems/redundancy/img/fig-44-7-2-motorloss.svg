            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому серйозні апарати беруть 6–8 моторів, а не 4</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">квадрокоптер не переживає втрати мотора; гекса/окто — переживає</text>
<text x="245" y="100" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Квадрокоптер (4 мотори)</text>
<rect x="60" y="116" width="370" height="250" rx="12" fill="#fff7f7" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<circle cx="245" cy="220" r="16" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="245" y1="220" x2="245.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="245.0" cy="312.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="245" y1="220" x2="153.0" y2="220.0" stroke="#cc0000" stroke-width="2.6" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="153.0" cy="220.0" r="16" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<line x1="144.0" y1="211.0" x2="162.0" y2="229.0" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="144.0" y1="229.0" x2="162.0" y2="211.0" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="245" y1="220" x2="244.99999999999997" y2="128.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="244.99999999999997" cy="128.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="245" y1="220" x2="337.0" y2="219.99999999999997" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="337.0" cy="219.99999999999997" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="245" y="332" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">4 мотори = 4 керовані величини.</text>
<text x="245" y="350" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Втратив один — нема запасу → падіння.</text>
<text x="715" y="100" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Гекса / окто (6–8 моторів)</text>
<rect x="530" y="116" width="370" height="250" rx="12" fill="#f4fbf6" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<circle cx="715" cy="220" r="16" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="715" y1="220" x2="715.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="715.0" cy="312.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="715" y1="220" x2="635.3256628518317" y2="266.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="635.3256628518317" cy="266.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="715" y1="220" x2="635.3256628518317" y2="174.0" stroke="#cc0000" stroke-width="2.6" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="635.3256628518317" cy="174.0" r="16" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<line x1="626.3256628518317" y1="165.0" x2="644.3256628518317" y2="183.0" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="626.3256628518317" y1="183.0" x2="644.3256628518317" y2="165.0" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="715" y1="220" x2="715.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="715.0" cy="128.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="715" y1="220" x2="794.6743371481683" y2="173.99999999999994" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="794.6743371481683" cy="173.99999999999994" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<line x1="715" y1="220" x2="794.6743371481683" y2="266.0" stroke="#1a1a1a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="794.6743371481683" cy="266.0" r="16" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="715" y="332" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Зайві мотори дають запас тяги й керування.</text>
<text x="715" y="350" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Втратив один — летить далі, сідає контрольовано.</text>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Та сама логіка резервування, що для давачів (43.2), — лише тепер для виконавців: зайвий мотор коштує ваги, та рятує апарат.</text>
</svg>
