<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Мета — драбина деградації, а не обрив</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">добра система втрачає по сходинці; крихка — від повної справності одразу до краху</text>
<text x="250" y="96" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Добра система: драбина</text>
<rect x="70" y="130" width="150" height="26" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="78" y="148" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повна справність</text>
<rect x="160" y="190" width="150" height="26" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<line x1="220" y1="156" x2="160" y2="190" stroke="#0a8f3c" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="168" y="208" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">втратив давач → на резерв</text>
<rect x="250" y="250" width="150" height="26" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<line x1="310" y1="216" x2="250" y2="250" stroke="#0a8f3c" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="258" y="268" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">втратив GNSS → безпечний режим / посадка</text>
<rect x="340" y="310" width="150" height="26" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<line x1="400" y1="276" x2="340" y2="310" stroke="#0a8f3c" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="348" y="328" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">втратив мотор (гекса) → сісти</text>
<rect x="430" y="370" width="150" height="26" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<line x1="490" y1="336" x2="430" y2="370" stroke="#0a8f3c" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="438" y="388" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">безпечна зупинка</text>
<text x="250" y="430" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">кожна відмова — лише крок униз, апарат живий</text>
<text x="740" y="96" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Крихка система: обрив</text>
<rect x="640" y="130" width="200" height="30" rx="7" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="740" y="150" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">повна справність</text>
<line x1="740" y1="162" x2="740" y2="360" stroke="#cc0000" stroke-width="3.0" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="756" y="270" font-size="11" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">одна відмова</text>
<rect x="660" y="366" width="160" height="40" rx="8" fill="#cc0000" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="740" y="391" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">КРАХ</text>
<text x="480.0" y="466" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Усе з цього розділу служить одній меті: щоб апарат ішов донизу сходами, а не падав з обриву від першої ж поломки.</text>
</svg>
