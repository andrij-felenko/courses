<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470"
     viewBox="0 0 980 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому окрема плата: виділений контролер проти універсального комп'ютера</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">критичне для виживання потребує гарантій, яких універсальна ОС не дає</text>
<rect x="300" y="70" width="335" height="36" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="467.5" y="94" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Виділений політний контролер</text>
<rect x="645" y="70" width="305" height="36" rx="8" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="797.5" y="94" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Універсальний комп'ютер (Linux/телефон)</text>
<rect x="30" y="110" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="137" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Тайминг</text>
<rect x="300" y="110" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="137" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">гарантований, детермінований</text>
<rect x="645" y="110" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="137" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«швидко в середньому», джиттер</text>
<rect x="30" y="156" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="183" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Завантаження</text>
<rect x="300" y="156" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="183" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мілісекунди</text>
<rect x="645" y="156" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="183" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">десятки секунд</text>
<rect x="30" y="202" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="229" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Скільки задач</text>
<rect x="300" y="202" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="229" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">одна — керувати апаратом</text>
<rect x="645" y="202" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="229" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">багато: ОС, мережа, застосунки</text>
<rect x="30" y="248" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="275" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Режими збою</text>
<rect x="300" y="248" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="275" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мало, передбачувані</text>
<rect x="645" y="248" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="275" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">багато й несподівані</text>
<rect x="30" y="294" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="321" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Watchdog + failsafe</text>
<rect x="300" y="294" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="321" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вбудовано</text>
<rect x="645" y="294" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="321" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">немає за замовчуванням</text>
<rect x="30" y="340" width="262" height="40" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="367" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Реальний час</text>
<rect x="300" y="340" width="335" height="40" rx="7" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<text x="314" y="367" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">так (RTOS / голе залізо)</text>
<rect x="645" y="340" width="305" height="40" rx="7" fill="#fff8ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.0"/>
<text x="659" y="367" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ні</text>
<rect x="30" y="390" width="920" height="38" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="46" y="414" font-size="12" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">Висновок: критичне для виживання — на виділеній платі; важке й «розумне» — на універсальній (про цей поділ — у 43.5).</text>
</svg>
