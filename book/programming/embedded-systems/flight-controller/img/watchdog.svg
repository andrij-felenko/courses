<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410"
     viewBox="0 0 900 410" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="410" fill="white"/>
<text x="450.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Watchdog: рятівник від зависання керування</text>
<text x="450.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">контур мусить «відмічатися» щотакту; зупинився — апаратний таймер перезапускає МК</text>
<rect x="40" y="84" width="410" height="250" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="245" y="110" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">НОРМА — контур працює</text>
<rect x="70" y="140" width="150" height="70" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="145" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">контур</text>
<text x="145" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">керування</text>
<line x1="220" y1="175" x2="300" y2="175" stroke="#0a8f3c" stroke-width="2.0" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="260" y="166" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">скидаю</text>
<rect x="300" y="140" width="150" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="375" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">WATCHDOG</text>
<text x="375" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">таймер</text>
<rect x="70" y="250" width="380" height="22" rx="6" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<rect x="72" y="252" width="300" height="18" rx="5" fill="#bbf0cb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="80" y="296" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">таймер щоразу скидається — до 0 не доходить →</text>
<text x="80" y="314" font-size="11.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">watchdog ніколи не спрацьовує. Усе гаразд.</text>
<rect x="470" y="84" width="410" height="250" rx="12" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="675" y="110" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ЗАВИСАННЯ — контур став</text>
<rect x="500" y="140" width="150" height="70" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="575" y="170" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">контур</text>
<text x="575" y="188" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">став  ✗</text>
<line x1="650" y1="175" x2="730" y2="175" stroke="#cc0000" stroke-width="2.0" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="690" y="166" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">не скидаю</text>
<rect x="730" y="140" width="150" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="805" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">WATCHDOG</text>
<text x="805" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">таймер</text>
<rect x="500" y="250" width="380" height="22" rx="6" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<rect x="502" y="252" width="16" height="18" rx="5" fill="#f4b8b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="510" y="296" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">таймер добіг до 0 → СПРАЦЮВАВ →</text>
<text x="510" y="314" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">апаратний RESET МК + перехід у failsafe.</text>
<text x="450.0" y="400" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Watchdog (Розділ 24) — остання лінія оборони: навіть якщо код зациклився, залізо саме перезапустить контролер.</text>
</svg>
