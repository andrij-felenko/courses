<text x="505.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вартість публікації не залежить від кількості читачів — тому її можна робити навіть із переривання</text>
