<text x="505.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">читання не блокує видавця й не має підтверджень: замість гарантії доставки читач дістає точне число пропущеного</text>
