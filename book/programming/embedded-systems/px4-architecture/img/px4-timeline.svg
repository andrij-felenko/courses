<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як PX4 дійшов від студентського змагання до апстріму NuttX</text>
<line x1="262.0" y1="62.0" x2="262.0" y2="600.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="228.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a5276" text-anchor="end" font-weight="700">2008</text>
<circle cx="262.0" cy="82.0" r="7.0" fill="#ffffff" stroke="#1a5276" stroke-width="2.4"/>
<rect x="284.0" y="54.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="1.6"/>
<text x="302.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="start" font-weight="700">ETH Zurich: дослідницький проєкт PIXHAWK</text>
<text x="302.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лоренц Маєр збирає 14 студентів під європейське змагання мікроапаратів</text>
<text x="228.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a5276" text-anchor="end" font-weight="700">2009</text>
<circle cx="262.0" cy="156.0" r="7.0" fill="#ffffff" stroke="#1a5276" stroke-width="2.4"/>
<rect x="284.0" y="128.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="1.6"/>
<text x="302.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="start" font-weight="700">EMAV: перше місце в категорії внутрішньої автономії</text>
<text x="302.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">перші, хто обійшов перешкоди машинним зором на борту, а не з наземного комп'ютера</text>
<text x="228.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">2011</text>
<circle cx="262.0" cy="230.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="284.0" y="202.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="302.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">архітектуру визнано безнадійною — переписування з нуля</text>
<text x="302.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">три попередні покоління політного ПЗ відкинуто; четверте й дало PX4</text>
<text x="228.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7d3c98" text-anchor="end" font-weight="700">2012</text>
<circle cx="262.0" cy="304.0" r="7.0" fill="#ffffff" stroke="#7d3c98" stroke-width="2.4"/>
<rect x="284.0" y="276.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="1.6"/>
<text x="302.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="start" font-weight="700">код відкрито: перший публічний реліз PX4</text>
<text x="302.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">репозиторій на GitHub створено 4 серпня 2012; uORB уже всередині</text>
<text x="228.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e8449" text-anchor="end" font-weight="700">2013</text>
<circle cx="262.0" cy="378.0" r="7.0" fill="#ffffff" stroke="#1e8449" stroke-width="2.4"/>
<rect x="284.0" y="350.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/>
<text x="302.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="start" font-weight="700">FMUv2 під іменем Pixhawk, серійне виробництво в 3D Robotics</text>
<text x="302.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">плата стає доступною поза лабораторією — звідси й пізніші стандарти Pixhawk</text>
<text x="228.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e8449" text-anchor="end" font-weight="700">2014</text>
<circle cx="262.0" cy="452.0" r="7.0" fill="#ffffff" stroke="#1e8449" stroke-width="2.4"/>
<rect x="284.0" y="424.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/>
<text x="302.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="start" font-weight="700">Dronecode: фонд під Linux Foundation</text>
<text x="302.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">торгові марки й врядування виходять з-під однієї компанії; ліцензія коду — BSD 3-clause</text>
<text x="228.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7d3c98" text-anchor="end" font-weight="700">2015</text>
<circle cx="262.0" cy="526.0" r="7.0" fill="#ffffff" stroke="#7d3c98" stroke-width="2.4"/>
<rect x="284.0" y="498.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="1.6"/>
<text x="302.0" y="521.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="start" font-weight="700">ICRA 2015, с. 6235–6240: модель опубліковано як наукову роботу</text>
<text x="302.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Meier, Honegger, Pollefeys — вимірювання затримок і опис брокера</text>
<text x="228.0" y="605.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="end" font-weight="700">2022</text>
<circle cx="262.0" cy="600.0" r="7.0" fill="#ffffff" stroke="#b9770e" stroke-width="2.4"/>
<rect x="284.0" y="572.0" width="660.0" height="58.0" rx="6" fill="#ffffff" stroke="#b9770e" stroke-width="1.6"/>
<text x="302.0" y="595.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">uORB з'являється в апстрімі Apache NuttX</text>
<text x="302.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">apps/system/uorb — C-інтерфейси з прямим посиланням на документацію PX4</text>
<text x="480.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Жоден рядок тут не є заслугою однієї людини: ім'я в копірайті коду — «PX4 Development Team»</text>
<text x="480.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Дати 2008–2015 — за власною розповіддю учасників; 2012 і 2022 звірено з історією репозиторіїв</text>
</svg>