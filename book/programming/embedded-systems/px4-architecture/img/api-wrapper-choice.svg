<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 668" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="668" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибір C++-обгортки uORB: ліворуч вирішують екземпляри, праворуч — джерело пробудження</text>
<rect x="50.0" y="56.0" width="510.0" height="46.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="2.0"/><text x="305.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a5276" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">ПУБЛІКУЮ  —  вирішує кількість екземплярів теми</tspan></text>
<rect x="620.0" y="56.0" width="510.0" height="46.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="2.0"/><text x="875.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">ЧИТАЮ  —  вирішує те, що будить мій модуль</tspan></text>
<rect x="50.0" y="126.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="1.6"/><text x="164.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">тема одна на всю систему</tspan><tspan x="164.0" dy="15.0">(регулятор, оцінювач, командер)</tspan></text>
<line x1="282.0" y1="168.0" x2="310.0" y2="168.0" stroke="#1a5276" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="314.0" y="126.0" width="246.0" height="84.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.8"/><text x="437.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle"><tspan x="437.0" dy="0.0">Publication&lt;T&gt;</tspan><tspan x="437.0" dy="15.0">publish(data)</tspan></text>
<rect x="50.0" y="236.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="1.6"/><text x="164.0" y="274.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">по екземпляру на пристрій</tspan><tspan x="164.0" dy="15.0">чи на примірник фільтра</tspan></text>
<line x1="282.0" y1="278.0" x2="310.0" y2="278.0" stroke="#1a5276" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="314.0" y="236.0" width="246.0" height="84.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.8"/><text x="437.0" y="274.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle"><tspan x="437.0" dy="0.0">PublicationMulti&lt;T&gt;</tspan><tspan x="437.0" dy="15.0">publish(data) · get_instance()</tspan></text>
<rect x="50.0" y="346.0" width="510.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.4"/><text x="305.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Обидві оголошують тему ліниво — при першій публікації.</tspan><tspan x="305.0" dy="15.0">Номер екземпляра видає сама шина, задати його наперед не можна.</tspan></text>
<rect x="620.0" y="126.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="734.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">модуль має прокидатися</tspan><tspan x="734.0" dy="15.0">саме від цієї теми</tspan></text>
<line x1="852.0" y1="168.0" x2="880.0" y2="168.0" stroke="#1e8449" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="884.0" y="126.0" width="246.0" height="84.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="1.8"/><text x="1007.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle"><tspan x="1007.0" dy="0.0">SubscriptionCallbackWorkItem</tspan><tspan x="1007.0" dy="15.0">будить чергу робіт на публікації</tspan></text>
<rect x="620.0" y="236.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="734.0" y="274.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">тема часта, а мені досить</tspan><tspan x="734.0" dy="15.0">раз на N мілісекунд</tspan></text>
<line x1="852.0" y1="278.0" x2="880.0" y2="278.0" stroke="#1e8449" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="884.0" y="236.0" width="246.0" height="84.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="1.8"/><text x="1007.0" y="274.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle"><tspan x="1007.0" dy="0.0">SubscriptionInterval</tspan><tspan x="1007.0" dy="15.0">updated() бреше до кінця інтервалу</tspan></text>
<rect x="620.0" y="346.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="734.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">треба обійти всі екземпляри</tspan><tspan x="734.0" dy="15.0">(усі гіроскопи, усі баро)</tspan></text>
<line x1="852.0" y1="388.0" x2="880.0" y2="388.0" stroke="#1e8449" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="884.0" y="346.0" width="246.0" height="84.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="1.8"/><text x="1007.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle"><tspan x="1007.0" dy="0.0">SubscriptionMultiArray&lt;T&gt;</tspan><tspan x="1007.0" dy="15.0">цикл range-for по масиву</tspan></text>
<rect x="620.0" y="456.0" width="228.0" height="84.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="734.0" y="494.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">просто дочитати найсвіжіше</tspan><tspan x="734.0" dy="15.0">у власному такті</tspan></text>
<line x1="852.0" y1="498.0" x2="880.0" y2="498.0" stroke="#1e8449" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="884.0" y="456.0" width="246.0" height="84.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="1.8"/><text x="1007.0" y="494.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle"><tspan x="1007.0" dy="0.0">Subscription</tspan><tspan x="1007.0" dy="15.0">updated() · copy() · update()</tspan></text>
<rect x="50.0" y="566.0" width="1080.0" height="62.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="1.8"/>
<text x="590.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">усі шість — тонкі обгортки над тим самим C-API: дескриптор плюс власне покоління</text>
<text x="590.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">жодна не додає буфера й не змінює семантики втрат — вибір впливає лише на те, коли ти прокидаєшся</text>
<text x="590.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Помилковий вибір не дає ні помилки компіляції, ні попередження — лише гірші числа в польоті</text>
</svg>