<text x="490.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повільна гілка — оцінювач, регулятор положення, навігатор — живиться тими самими темами, лише рідше</text>
