<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витіснення: важливіше переривання перебиває менш важливе</text>
<text x="30.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">основний код</text>
<text x="30.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">низький ISR</text>
<text x="30.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">високий ISR</text>
<rect x="170.0" y="93.0" width="130.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<rect x="300.0" y="173.0" width="150.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<line x1="395.0" y1="207.0" x2="395.0" y2="253.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="395.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">високе переривання надходить</text>
<rect x="395.0" y="253.0" width="180.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="485.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">високий ISR</text>
<line x1="575.0" y1="253.0" x2="575.0" y2="207.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="575.0" y="173.0" width="160.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="655.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">низький ISR — далі</text>
<rect x="735.0" y="93.0" width="110.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<line x1="170.0" y1="318.0" x2="845.0" y2="318.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="845.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час</text>
<text x="450.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">низький поступається високому; коли той завершиться — доробляє з того самого місця</text>
</svg>