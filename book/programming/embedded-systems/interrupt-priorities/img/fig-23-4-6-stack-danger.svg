  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Небезпека: глибока вкладеність переповнює стек</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен вкладений обробник з'їдає шматок стека — забагато рівнів, і пам'ять закінчиться</text>
<rect x="360.0" y="100.0" width="220.0" height="230.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="470.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стек</text>
<rect x="370.0" y="282.0" width="200.0" height="36.0" rx="4" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="470.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">основний код</text>
<rect x="370.0" y="242.0" width="200.0" height="36.0" rx="4" fill="#eef6ef" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="470.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ISR рів.1</text>
<rect x="370.0" y="202.0" width="200.0" height="36.0" rx="4" fill="#fff6e0" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="470.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ISR рів.2</text>
<rect x="370.0" y="162.0" width="200.0" height="36.0" rx="4" fill="#ffe3d6" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="470.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ISR рів.3</text>
<rect x="370.0" y="122.0" width="200.0" height="36.0" rx="4" fill="#fbecec" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="470.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ISR рів.4 …</text>
<text x="470.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">← межа пам'яті!</text>
<line x1="340.0" y1="310.0" x2="340.0" y2="120.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="324.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">росте</text>
<rect x="620.0" y="130.0" width="290.0" height="170.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="765.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як убезпечитися:</text>
<text x="636.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тримати обробники короткими</text>
<text x="636.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не плодити багато рівнів</text>
<text x="636.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• на Arduino все рівня 1 —</text>
<text x="648.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">вкладеності нема, тож безпечно</text>
<text x="636.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• глибока вкладеність — лише</text>
<text x="648.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">коли свідомо ставиш рівні</text>
</svg>
