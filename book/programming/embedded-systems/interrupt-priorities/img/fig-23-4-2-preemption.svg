<text x="470.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Низький поступається високому, а коли той завершиться — спокійно доробляє своє.</text>
