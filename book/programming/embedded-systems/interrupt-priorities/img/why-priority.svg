<text x="430.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">пріоритет — число терміновості: за ним процесор вирішує, кого пустити першим</text>
