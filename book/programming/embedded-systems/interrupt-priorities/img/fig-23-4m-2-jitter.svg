<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джитер: найкращий випадок проти найгіршого</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на 240 МГц 1 такт ≈ 4 нс; фіксована частина мала, блокування — велика й мінлива</text>
<text x="80.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Найкращий:</text>
<rect x="230.0" y="96.0" width="70.0" height="28.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="265.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">~35</text>
<text x="320.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тактів ≈ 0.15 мкс  (лише фіксоване)</text>
<text x="80.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Найгірший:</text>
<rect x="230.0" y="148.0" width="70.0" height="28.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<rect x="302.0" y="148.0" width="430.0" height="28.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="517.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ найдовше блокування (сотні тактів)</text>
<text x="760.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ кілька мкс</text>
<line x1="300.0" y1="200.0" x2="732.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="516.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ДЖИТЕР = найгірший − найкращий</text>
<rect x="120.0" y="248.0" width="660.0" height="40.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коротші критичні секції й ISR → менший джитер → твердіший real-time (§4.5.3, §4.5.6).</text>
</svg>
