<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кілька справ в одному циклі через millis() — без блокування</text>
<rect x="320.9" y="78.5" width="318.2" height="33.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">loop(): now = millis() — «чи не час?»</tspan></text>
<rect x="110.0" y="215.6" width="180.0" height="48.8" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">LED</tspan><tspan x="200.0" dy="16.2">щосекунди</tspan></text>
<line x1="480.0" y1="113.0" x2="200.0" y2="215.6" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="215.6" width="180.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">давач</tspan><tspan x="480.0" dy="16.2">5 разів/с</tspan></text>
<line x1="480.0" y1="113.0" x2="480.0" y2="215.6" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="215.6" width="180.0" height="48.8" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="760.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">серцебиття</tspan><tspan x="760.0" dy="16.2">раз на 5 с</tspan></text>
<line x1="480.0" y1="113.0" x2="760.0" y2="215.6" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="187.3" y="334.0" width="585.4" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="480.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">кожна спрацьовує у свій час; цикл лише перевіряє millis() й нікого не блокує</tspan></text>
<rect x="269.4" y="389.5" width="421.3" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">порівняння now − t &gt;= interval переживає переповнення лічильника</tspan></text>
</svg>