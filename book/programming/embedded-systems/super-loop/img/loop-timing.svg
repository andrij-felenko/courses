<text x="70.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">КОРОТКИЙ loop() — багато швидких обертів</text>
