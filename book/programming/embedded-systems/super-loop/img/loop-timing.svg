<text x="70.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ОДИН ДОВГИЙ КРОК — оберт розтягнувся, усе чекає</text>
