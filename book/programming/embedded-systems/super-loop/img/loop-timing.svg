<rect x="213.3" y="374.0" width="533.4" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">поки тягнеться один тривалий виклик — ні читання, ні оновлення виходу</tspan></text>
