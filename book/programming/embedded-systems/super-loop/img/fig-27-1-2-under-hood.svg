<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що під капотом: звичайний main() із вічним циклом</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Arduino це ховає, та насправді є все знайоме з Розділу 21: скидання → завантажувач → main()</text>
<rect x="40.0" y="110.0" width="150.0" height="50.0" rx="9" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
