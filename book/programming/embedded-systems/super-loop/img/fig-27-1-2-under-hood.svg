<text x="115.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(Розділ 21)</text>
<rect x="250.0" y="210.0" width="460.0" height="130.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="480.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">насправді в коді:</text>
<text x="266.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">int main() {</text>
<text x="266.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    setup();           // раз</text>
<text x="266.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    for (;;) {          // вічно</text>
<text x="266.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">        loop();</text>
<text x="266.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    }</text>
<text x="266.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<rect x="150.0" y="320.0" width="0.0" height="0.0" rx="0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Super-loop» — це просто setup() один раз і loop() у нескінченному for(;;). Жодної магії.</text>
