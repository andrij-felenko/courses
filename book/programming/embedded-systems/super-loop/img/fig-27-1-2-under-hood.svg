<text x="491.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">main()</text>
<line x1="566.0" y1="135.0" x2="604.0" y2="135.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="604.0" y="110.0" width="150.0" height="50.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
