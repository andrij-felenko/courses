  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Класичний цикл: читай → обчисли → дій → знову</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щооберту мікроконтролер опитує світ, думає й відповідає</text>
<path d="M 494 130 A 110 110 0 0 1 553.7 251.0" fill="none" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<path d="M 505.70000000000005 313.0 A 110 110 0 0 1 394.3 313.0" fill="none" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<path d="M 346.3 251.0 A 110 110 0 0 1 406 130" fill="none" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<circle cx="450.0" cy="120.0" r="50.0" fill="#fbfcff" stroke="#1f47b5" stroke-width="2"/>
<text x="450.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ЧИТАЙ входи</text>
<text x="450.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">давачі, кнопки</text>
<circle cx="545.7" cy="285.0" r="50.0" fill="#fbfcff" stroke="#c0271e" stroke-width="2"/>
<text x="545.7" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ДІЙ на виходи</text>
<text x="545.7" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">LED, мотор, дані</text>
<circle cx="354.3" cy="285.0" r="50.0" fill="#fbfcff" stroke="#1f8a3b" stroke-width="2"/>
<text x="354.3" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОБЧИСЛИ</text>
<text x="354.3" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">логіка, рішення</text>
<text x="450.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">loop()</text>
<rect x="150.0" y="350.0" width="600.0" height="40.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один прохід loop() = один такт «опитати → подумати → відповісти».</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Просто, передбачувано, легко читати згори вниз.</text>
