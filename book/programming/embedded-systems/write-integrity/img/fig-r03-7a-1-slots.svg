<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два слоти конфігу: версія + дані + сума</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пишемо в старіший слот; новіший лишається цілим запасом</text>
<rect x="70.0" y="92.0" width="330.0" height="80.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="86.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Слот A  (старіший)</text>
<rect x="86.0" y="130.0" width="90.0" height="30.0" rx="5" fill="#fff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="131.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">версія 7</text>
<rect x="186.0" y="130.0" width="120.0" height="30.0" rx="5" fill="#fff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="246.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дані</text>
<rect x="316.0" y="130.0" width="70.0" height="30.0" rx="5" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="351.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сума ✓</text>
<rect x="500.0" y="92.0" width="330.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="516.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Слот B  (новіший)</text>
<rect x="516.0" y="130.0" width="90.0" height="30.0" rx="5" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="561.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">версія 8</text>
<rect x="616.0" y="130.0" width="120.0" height="30.0" rx="5" fill="#fff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="676.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дані</text>
<rect x="746.0" y="130.0" width="70.0" height="30.0" rx="5" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="781.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сума ✓</text>
<line x1="235.0" y1="192.0" x2="235.0" y2="214.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="235.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">пишемо сюди → стане версією 9</text>
<rect x="120.0" y="232.0" width="660.0" height="72.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">При старті: узяти слот із найбільшою версією, що проходить суму.</text>
<text x="450.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Поки пишемо A, цілий B чекає запасом; не дописали A — беремо B.</text>
<text x="450.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Хоч би коли впало живлення — лишається щонайменше одна добра копія.</text>
</svg>
