<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="790" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="395.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підпис: пристрій запускає лише прошивку, підписану своїм ключем</text>
<text x="160.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Виробник</text>
<rect x="80.0" y="92.0" width="160.0" height="56.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">образ</tspan><tspan x="160.0" dy="15.6">+ ТАЄМНИЙ ключ</tspan></text>
<line x1="160.0" y1="150.0" x2="160.0" y2="184.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="188.0" width="160.0" height="50.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">образ + ПІДПИС</tspan></text>
<line x1="244.0" y1="213.0" x2="360.0" y2="213.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="302.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">захищений</text>
<text x="302.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">канал (TLS)</text>
<text x="560.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пристрій</text>
<rect x="480.0" y="92.0" width="200.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="580.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">ВІДКРИТИЙ ключ</tspan><tspan x="580.0" dy="15.6">(зашитий у пристрій)</tspan></text>
<rect x="484.1" y="196.8" width="151.8" height="32.5" rx="6" fill="#fff7e6" stroke="#e67e22" stroke-width="1.5"/><text x="560.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">перевірити підпис</tspan></text>
<line x1="560.0" y1="150.0" x2="560.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="213.0" x2="480.1" y2="213.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="540.0" y1="232.0" x2="470.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="232.0" x2="660.0" y2="292.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="296.0" width="180.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="320.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">підпис сходиться →</tspan><tspan x="470.0" dy="15.6">ЗАПУСТИТИ</tspan></text>
<rect x="600.0" y="296.0" width="170.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="320.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">чужий / підмінений →</tspan><tspan x="685.0" dy="15.6">ВІДКИНУТИ</tspan></text>
<rect x="90.0" y="372.0" width="610.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Контрольна сума ловить ВИПАДКОВЕ псування, та безсила проти зловмисника: він</tspan><tspan x="395.0" dy="16.2">перерахував би й суму. Підпис — інший рубіж: виробник підписує образ таємним</tspan><tspan x="395.0" dy="16.2">ключем, пристрій перевіряє відкритим. Чужа чи підмінена прошивка підпис не</tspan><tspan x="395.0" dy="16.2">пройде, хоч би якою цілою доїхала. OTA без перевірки підпису — двері без замка.</tspan></text>
</svg>