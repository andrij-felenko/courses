<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві банки: робочу не чіпаємо, новий образ ллємо в запасну</text>
<rect x="105.0" y="130.0" width="150.0" height="150.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="167.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Слот A</tspan><tspan x="180.0" dy="16.9">(РОБОЧИЙ)</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">стара,</tspan><tspan x="180.0" dy="16.9">робоча</tspan><tspan x="180.0" dy="16.9">прошивка</tspan></text>
<text x="180.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">звідси виконуємось</text>
<rect x="525.0" y="130.0" width="150.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="167.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Слот B</tspan><tspan x="600.0" dy="16.9">(ЗАПАСНИЙ)</tspan><tspan x="600.0" dy="16.9"></tspan><tspan x="600.0" dy="16.9">сюди пишемо</tspan><tspan x="600.0" dy="16.9">новий</tspan><tspan x="600.0" dy="16.9">образ</tspan></text>
<text x="600.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">сюди ллємо нове</text>
<line x1="600.0" y1="70.0" x2="600.0" y2="106.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="680.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">образ із мережі</text>
<rect x="302.5" y="311.8" width="175.0" height="32.5" rx="6" fill="#fff7e6" stroke="#e67e22" stroke-width="1.5"/><text x="390.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">перемикач  (otadata)</tspan></text>
<line x1="180.0" y1="280.0" x2="180.0" y2="328.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="600.0" y1="280.0" x2="600.0" y2="328.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="200.0" y1="328.0" x2="506.5" y2="328.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">1 короткий крок: «завантажуйся з B»</text>
<text x="390.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тільки ПІСЛЯ повного запису й перевірки</text>
<rect x="90.0" y="388.0" width="600.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Той, що пишемо, і той, що виконуємо, — завжди різні. Ризикуємо лише запасним</tspan><tspan x="390.0" dy="16.2">слотом; робочий цілий до останньої миті. Наступного разу ролі поміняються.</tspan></text>
</svg>