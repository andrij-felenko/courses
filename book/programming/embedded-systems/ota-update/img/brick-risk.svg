<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один слот: новий образ пишуть поверх робочого — і ризикують усім</text>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">До оновлення</text>
<rect x="85.0" y="150.0" width="130.0" height="120.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">РОБОЧА</tspan><tspan x="150.0" dy="16.9">прошивка</tspan><tspan x="150.0" dy="16.9">(ціла)</tspan></text>
<text x="150.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">пристрій працює</text>
<line x1="221.0" y1="210.0" x2="319.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пишемо</text>
<text x="270.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поверх</text>
<text x="390.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Під час заливки</text>
<rect x="325.0" y="150.0" width="130.0" height="60.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="390.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">нове</text>
<rect x="325.0" y="210.0" width="130.0" height="60.0" rx="0" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">старе</text>
<text x="390.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">⚡ збій тут!</text>
<line x1="360.0" y1="201.0" x2="360.0" y2="219.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="380.0" y1="201.0" x2="380.0" y2="219.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="400.0" y1="201.0" x2="400.0" y2="219.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="420.0" y1="201.0" x2="420.0" y2="219.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="461.0" y1="210.0" x2="559.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">обрив</text>
<text x="630.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Після збою</text>
<rect x="565.0" y="150.0" width="130.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">напівстара-</tspan><tspan x="630.0" dy="16.9">напівнова</tspan><tspan x="630.0" dy="16.9">ЦЕГЛИНА</tspan></text>
<text x="630.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">не завантажиться</text>
<rect x="90.0" y="320.0" width="600.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="390.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">З єдиним слотом новий образ пишуть прямо поверх робочого. Доїде цілим —</tspan><tspan x="390.0" dy="16.2">пощастило. Та якщо мережа чи живлення обірвуться на півдорозі, у єдиному</tspan><tspan x="390.0" dy="16.2">слоті лишиться напівстара-напівнова прошивка — і пристрій уже не оживе.</tspan><tspan x="390.0" dy="16.2">Це і є «цеглина»: ось чому одного слота для безпечного OTA замало.</tspan></text>
</svg>