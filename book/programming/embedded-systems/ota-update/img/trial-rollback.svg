<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Новий образ — на випробуванні: підтвердив себе чи відкіт</text>
<rect x="202.7" y="63.5" width="374.6" height="33.0" rx="6" fill="#fff7e6" stroke="#e67e22" stroke-width="1.5"/><text x="390.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">перемкнулись на новий образ → пробний запуск</tspan></text>
<line x1="270.0" y1="100.0" x2="240.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="100.0" x2="540.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="158.0" width="180.0" height="70.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">образ піднявся,</tspan><tspan x="240.0" dy="15.6">головне працює →</tspan><tspan x="240.0" dy="15.6">«я СПРАВНИЙ»</tspan></text>
<line x1="240.0" y1="230.0" x2="240.0" y2="268.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="272.0" width="180.0" height="64.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">перемикач</tspan><tspan x="240.0" dy="15.6">ЗАКРІПЛЕНО →</tspan><tspan x="240.0" dy="15.6">оновлення вдалося</tspan></text>
<rect x="450.0" y="158.0" width="180.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">образ упав / завис /</tspan><tspan x="540.0" dy="15.6">мовчить кілька</tspan><tspan x="540.0" dy="15.6">спроб поспіль</tspan></text>
<line x1="540.0" y1="230.0" x2="540.0" y2="268.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="272.0" width="180.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ВІДКАТ на старий,</tspan><tspan x="540.0" dy="15.6">робочий слот →</tspan><tspan x="540.0" dy="15.6">пристрій живий</tspan></text>
<rect x="90.0" y="360.0" width="600.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Образ може доїхати ЦІЛИМ як файл, але бути ПОГАНИМ як програма — з помилкою</tspan><tspan x="390.0" dy="16.2">в коді. Перевірка цілості тут безсила. Тому новий код стартує «на випробуванні»</tspan><tspan x="390.0" dy="16.2">й мусить САМ себе підтвердити; не підтвердив — завантажувач відкочується на</tspan><tspan x="390.0" dy="16.2">старий, перевірений слот. Забути виклик «я справний» — пастка: відкотить і добру.</tspan></text>
</svg>