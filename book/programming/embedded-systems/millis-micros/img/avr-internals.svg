<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">AVR (Uno): Timer0 переповнюється ~щомс і кличе ISR</text>
<rect x="70.0" y="90.6" width="200.0" height="78.8" rx="6" fill="#fef7e9" stroke="#b08900" stroke-width="1.5"/><text x="170.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Timer0 (8-біт)</tspan><tspan x="170.0" dy="15.6">крок 4 мкс</tspan><tspan x="170.0" dy="15.6">переповнення</tspan><tspan x="170.0" dy="15.6">≈ 1.024 мс</tspan></text>
<line x1="280.0" y1="130.0" x2="420.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">переповнення</text>
<rect x="425.0" y="90.6" width="230.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ISR переповнення:</tspan><tspan x="540.0" dy="15.6">ms_count++</tspan><tspan x="540.0" dy="15.6">(+ дрібна корекція</tspan><tspan x="540.0" dy="15.6">за 0.024 мс)</tspan></text>
<line x1="540.0" y1="175.0" x2="540.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="254.0" width="260.0" height="32.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ms_count (лічильник мс)</tspan></text>
<line x1="670.0" y1="270.0" x2="770.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="745.0" y="226.8" width="150.0" height="46.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">millis()</tspan><tspan x="820.0" dy="15.0">→ ms_count</tspan></text>
<rect x="725.0" y="282.9" width="190.0" height="44.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">micros()</tspan><tspan x="820.0" dy="13.7">→ ms×1000 + TCNT0×4</tspan></text>
<text x="460.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Схема працює, та переривання тікає ~1000 разів на секунду — забирає процесор.</text>
</svg>