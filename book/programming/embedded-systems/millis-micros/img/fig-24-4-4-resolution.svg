<text x="340.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">крок ~1 мкс (у 1000× дрібніший)</text>
