<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32: широкий 64-бітний таймер сам лічить мкс</text>
<rect x="180.0" y="93.8" width="560.0" height="32.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">апаратний системний таймер — 64 біт, лічить мкс безперервно</tspan></text>
<line x1="340.0" y1="134.0" x2="276.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="134.0" x2="644.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="171.0" y="191.2" width="210.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="276.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="276.0" dy="0.0">micros()</tspan><tspan x="276.0" dy="15.6">= просто прочитати</tspan></text>
<rect x="539.0" y="191.2" width="210.0" height="47.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="644.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="644.0" dy="0.0">millis()</tspan><tspan x="644.0" dy="15.6">= прочитати / 1000</tspan></text>
<rect x="180.0" y="274.3" width="560.0" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="294.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Та Arduino-функції віддають 32 біт:</tspan><tspan x="460.0" dy="15.0">millis() обгортається ~49.7 дня, micros() ~71 хв.</tspan><tspan x="460.0" dy="15.0">Повні 64 біт — через esp_timer_get_time(). Час порівнюй відніманням.</tspan></text>
</svg>