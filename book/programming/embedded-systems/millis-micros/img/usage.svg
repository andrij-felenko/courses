<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три прийоми — і всі через віднімання (стійкі до переповнення)</text>
<rect x="35.0" y="80.0" width="270.0" height="150.0" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="170.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">мітка часу</text>
<text x="170.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">t = micros();</text>
<text x="170.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запам'ятати мить</text>
<rect x="335.0" y="80.0" width="270.0" height="150.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="470.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">інтервал</text>
<text x="470.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dt = micros() − t0;</text>
<text x="470.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">скільки тривало</text>
<rect x="635.0" y="80.0" width="270.0" height="150.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="770.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">тайм-аут</text>
<text x="770.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">if (millis() − t0 &gt; LIMIT)</text>
<text x="770.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чи не задовго чекаємо</text>
<text x="470.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ усюди — РІЗНИЦЯ часів, а не абсолютне значення.</text>
<text x="470.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">millis()/micros() дешеві — лише читають лічильник, тож клич скільки треба.</text>
</svg>