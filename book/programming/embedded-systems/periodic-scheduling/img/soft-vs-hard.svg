<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">М'який і жорсткий реальний час: чого коштує пропуск строку</text>
<rect x="105.0" y="70.0" width="300.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">М'ЯКИЙ</tspan></text>
<rect x="196.6" y="134.0" width="116.7" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">строк бажаний</tspan></text>
<rect x="145.2" y="199.2" width="219.6" height="31.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">пропуск → трохи гірша якість</tspan></text>
<rect x="169.8" y="267.4" width="170.5" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="255.0" dy="0.0">блимання збилося,</tspan><tspan x="255.0" dy="14.3">дисплей оновився пізніше</tspan></text>
<rect x="535.0" y="70.0" width="300.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">ЖОРСТКИЙ</tspan></text>
<rect x="608.0" y="134.0" width="153.9" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="685.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">строк обов'язковий</tspan></text>
<rect x="550.2" y="199.2" width="269.6" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">пропуск → відмова, інколи небезпека</tspan></text>
<rect x="593.5" y="267.4" width="183.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="685.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="685.0" dy="0.0">крок двигуна не в строк,</tspan><tspan x="685.0" dy="14.3">подушка безпеки спізнилась</tspan></text>
<line x1="470.0" y1="60.0" x2="470.0" y2="320.0" stroke="#d0d5dd" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="288.9" y="356.2" width="362.2" height="47.6" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Планувальник на millis() — для м'якого часу.</tspan><tspan x="470.0" dy="15.6">Жорсткий потребує апаратних таймерів або RTOS.</tspan></text>
