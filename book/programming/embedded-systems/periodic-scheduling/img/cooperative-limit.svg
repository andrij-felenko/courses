<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кооперативність: довга задача затримує всіх інших</text>
<line x1="70.0" y1="150.0" x2="880.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="880.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">час →</text>
<rect x="90.0" y="116.0" width="80.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="130.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">A</text>
<rect x="180.0" y="116.0" width="420.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="390.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">B (довга)</text>
<rect x="610.0" y="116.0" width="80.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="650.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">C</text>
<line x1="300.0" y1="156.0" x2="300.0" y2="220.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="300.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">час C настав</text>
<line x1="610.0" y1="156.0" x2="610.0" y2="200.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="610.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">C нарешті йде</text>
<line x1="310.0" y1="190.0" x2="600.0" y2="190.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="455.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C чекає кінця B</text>
<rect x="214.5" y="336.2" width="511.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Жодна задача нікого не перебиває — лише чемно чекає черги.</tspan><tspan x="470.0" dy="15.6">Тому кожна МУСИТЬ бути короткою: одна «жадібна» псує таймінг усіх.</tspan></text>
</svg>