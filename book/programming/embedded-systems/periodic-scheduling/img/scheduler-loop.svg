<line x1="265.0" y1="230.0" x2="405.2" y2="230.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="195.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ні → наступний рядок</text>
<line x1="195.0" y1="270.0" x2="195.0" y2="288.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="195.9" y="376.2" width="548.2" height="47.6" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Один прохід for по таблиці замінює десяток окремих if.</tspan><tspan x="470.0" dy="15.6">Додати задачу = дописати рядок. Маленький «фреймворк часу» на millis().</tspan></text>
