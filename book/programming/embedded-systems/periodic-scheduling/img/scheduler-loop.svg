<rect x="138.5" y="205.6" width="113.0" height="48.8" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="195.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">now − t.last</tspan><tspan x="195.0" dy="16.2">≥ t.period ?</tspan></text>
<line x1="195.0" y1="176.0" x2="195.0" y2="205.6" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
