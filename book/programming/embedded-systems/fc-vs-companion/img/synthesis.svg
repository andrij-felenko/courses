  <rect x="0" y="0" width="980" height="540" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Весь розділ в одній карті: контур на борту, два джерела уставки над ним</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сенсори → контролер → виконавчі механізми; станція й комп'ютер лише задають мету</text>
<rect x="70" y="78" width="360" height="72" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="250" y="104" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">НАЗЕМНА СТАНЦІЯ (на землі)</text>
<text x="250" y="126" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">оператор: параметри, місія, нагляд (43.4)</text>
<rect x="550" y="78" width="360" height="72" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="730" y="104" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ КОМП'ЮТЕР (на апараті)</text>
<text x="730" y="126" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">розум: бачення, планування, ML (43.5)</text>
<rect x="70" y="210" width="840" height="246" rx="14" fill="#f6fbf7" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="490" y="236" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ КОНТРОЛЕР — серце апарата</text>
<text x="490" y="256" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">43.2: реальний час · надійність · резервування    |    43.3: шари HAL → драйвери → оцінювач → керування → навігація</text>
<rect x="100" y="324" width="150" height="52" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="175.0" y="355" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ДАВАЧІ</text>
<rect x="280" y="324" width="160" height="52" rx="9" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360.0" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ОЦІНЮВАЧ</text>
<rect x="470" y="324" width="160" height="52" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="550.0" y="355" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КЕРУВАННЯ</text>
<rect x="660" y="324" width="150" height="52" rx="9" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="735.0" y="355" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ВИКОНАННЯ</text>
<line x1="250" y1="350" x2="277" y2="350" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="440" y1="350" x2="467" y2="350" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="630" y1="350" x2="657" y2="350" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="810" y1="376" x2="810" y2="420" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="810" y1="420" x2="175" y2="420" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="175" y1="420" x2="175" y2="378" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="492" y="414" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">апарат рухається → давачі міряють знову</text>
<line x1="250" y1="150" x2="510" y2="322" stroke="#d98a00" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="730" y1="150" x2="560" y2="322" stroke="#1f4ed8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="360" y="232" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">уставка</text>
<text x="648" y="232" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">уставка</text>
<text x="505" y="300" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(MAVLink)</text>
<rect x="70" y="472" width="840" height="36" rx="9" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="490" y="495" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Обидва джерела уставки — НАД контуром. Відмовлять обидва — політ і failsafe лишаються на борту. Ось чому «політ» відділяють від «розуму».</text>
</svg>
