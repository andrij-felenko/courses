<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450"
     viewBox="0 0 940 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="450" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як «розум» керує «політом»: високорівневі уставки + сторож</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">комп'ютер каже КУДИ, контролер вирішує ЯК; замовк комп'ютер — контролер у failsafe</text>
<rect x="60" y="110" width="270" height="110" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="195" y="150" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ</text>
<text x="195" y="172" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КОМП'ЮТЕР</text>
<text x="195" y="196" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(«розум»)</text>
<rect x="610" y="110" width="270" height="110" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="745" y="150" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ</text>
<text x="745" y="172" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КОНТРОЛЕР</text>
<text x="745" y="196" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">режим Guided / Offboard</text>
<line x1="332" y1="150" x2="606" y2="150" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="469" y="140" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">уставки: «лети до X» · «тримай швидкість» · «ціль тут»</text>
<line x1="606" y1="188" x2="334" y2="188" stroke="#0a8f3c" stroke-width="2.0" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="469" y="206" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">телеметрія: стан · положення · режим</text>
<rect x="250" y="290" width="440" height="92" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="470" y="318" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">⏱ Сторож команд</text>
<text x="470" y="340" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Немає нових уставок довше за строк?</text>
<text x="470" y="358" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Контролер НЕ висить на «розумі» → сам у failsafe (утримання / RTL).</text>
<line x1="195" y1="220" x2="195" y2="340" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="195" y1="340" x2="248" y2="340" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="470.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий принцип, що й з наземною станцією (43.4): джерело уставки може відмовити — контролер від цього не падає.</text>
</svg>
