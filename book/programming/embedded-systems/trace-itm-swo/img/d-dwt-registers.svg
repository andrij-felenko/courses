<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">DWT зсередини: вимір, профіль і події в одному блоці</text>
<rect x="60.0" y="70.0" width="620.0" height="34.0" rx="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="76.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700">регістр / вузол DWT</text>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700">що містить</text>
<text x="600.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700">навіщо</text>
<rect x="60.0" y="104.0" width="620.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="76.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">CYCCNT</text>
<text x="360.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">лічильник тактів ядра</text>
<text x="600.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">точний вимір тривалості</text>
<rect x="60.0" y="156.0" width="620.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="76.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">CPICNT / EXCCNT</text>
<text x="360.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">такти на інструкцію, вхід у винятки</text>
<text x="600.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">де ядро марнує цикли</text>
<rect x="60.0" y="208.0" width="620.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="76.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SLEEPCNT / LSUCNT</text>
<text x="360.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сон, доступи до пам'яті</text>
<text x="600.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">профіль простою й шини</text>
<rect x="60.0" y="260.0" width="620.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="76.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a7d1a" text-anchor="start" font-weight="700">PC sampler</text>
<text x="360.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">періодичний знімок PC</text>
<text x="600.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">статистичний профіль «де час»</text>
<rect x="60.0" y="312.0" width="620.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="76.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">COMP0..3 + MASK</text>
<text x="360.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">компаратори адрес даних</text>
<text x="600.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">вотчпойнти й трасування доступу</text>
<text x="370.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один блок DWT дає три речі одразу: точний вимір (CYCCNT), профіль (лічильники + семплер PC), події (компаратори)</text>
</svg>