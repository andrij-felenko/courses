<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупинити час чи спостерігати за ним на ходу</text>
<text x="60.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Брейкпойнт: ядро стоїть</text>
<rect x="60.0" y="96.0" width="110.0" height="26.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="115.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">біжить</text>
<rect x="190.0" y="96.0" width="80.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">СТОП</text>
<rect x="280.0" y="96.0" width="60.0" height="26.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="310.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">далі</text>
<text x="60.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">реальний час тим часом:</text>
<line x1="60.0" y1="182.0" x2="340.0" y2="182.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">мотор крутиться, пакет летить, дедлайн збито</text>
<line x1="366.0" y1="70.0" x2="366.0" y2="280.0" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="400.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Траса: ядро не спиняється</text>
<rect x="400.0" y="96.0" width="270.0" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="535.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ядро біжить безперервно</text>
<line x1="430.0" y1="122.0" x2="430.0" y2="156.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="486.0" y1="122.0" x2="486.0" y2="156.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="542.0" y1="122.0" x2="542.0" y2="156.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="598.0" y1="122.0" x2="598.0" y2="156.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="654.0" y1="122.0" x2="654.0" y2="156.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="400.0" y="158.0" width="270.0" height="26.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="535.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">потік подій тече на хост</text>
<text x="400.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">час видно, а виконання не рвемо</text>
<text x="360.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">halt зупиняє і ловить миттєвий зріз; траса не спиняє і бачить поведінку в часі</text>
</svg>