<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пакет ITM: заголовок із номером порту й розміром + дані</text>
<rect x="60.0" y="90.0" width="200.0" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Заголовок</text>
<text x="160.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 байт</text>
<rect x="260.0" y="90.0" width="360.0" height="46.0" rx="6" fill="#fdf6e3" stroke="#9a7d1a" stroke-width="1.6"/>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a7d1a" text-anchor="middle" font-weight="700">Корисні дані</text>
<text x="440.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1, 2 або 4 байти</text>
<text x="60.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Заголовок стимул-порту, біт за бітом:</text>
<rect x="60.0" y="190.0" width="360.0" height="50.0" rx="4" fill="#dcecff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="240.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">A[4:3]</tspan><tspan x="240.0" dy="13.0">номер порту</tspan></text>
<text x="240.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">біти 7..3</text>
<rect x="426.0" y="190.0" width="90.0" height="50.0" rx="4" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="471.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">0</tspan></text>
<text x="471.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">біт 2</text>
<rect x="522.0" y="190.0" width="150.0" height="50.0" rx="4" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="597.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="597.0" dy="0.0">SS</tspan><tspan x="597.0" dy="13.0">розмір</tspan></text>
<text x="597.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">біти 1..0</text>
<text x="60.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">SS: 01 → 1 байт даних · 10 → 2 байти · 11 → 4 байти (біт 2 = 0 ⇒ це стимул-пакет)</text>
</svg>