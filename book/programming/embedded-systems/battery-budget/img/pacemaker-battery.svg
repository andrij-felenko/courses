<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роки життя = ємність ÷ струм: два важелі кардіостимулятора</text>
<rect x="250.2" y="129.8" width="219.6" height="70.4" rx="6" fill="#f8f8f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">роки ≈ ємність (мА·год)</tspan><tspan x="360.0" dy="18.2">──────────────────────</tspan><tspan x="360.0" dy="18.2">середній струм (мкА)</tspan></text>
<line x1="360.0" y1="130.0" x2="360.0" y2="70.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="246.5" y="20.2" width="226.9" height="59.6" rx="6" fill="#d1fae5" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="39.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="360.0" dy="0.0">краща хімія:</tspan><tspan x="360.0" dy="14.3">ртуть → літій-йод</tspan><tspan x="360.0" dy="14.3">(герметичність, малий саморозряд)</tspan></text>
<line x1="360.0" y1="200.0" x2="360.0" y2="260.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="240.3" y="260.2" width="239.4" height="59.6" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="360.0" dy="0.0">ощадніша схема:</tspan><tspan x="360.0" dy="14.3">КМОН, майже завжди мовчить,</tspan><tspan x="360.0" dy="14.3">зрідка б'є — режим сну й скважність</tspan></text>
<rect x="84.0" y="200.0" width="52.0" height="20.0" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2.0"/>
<text x="110.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">~2 р.</text>
<text x="110.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ртуть</text>
<rect x="174.0" y="120.0" width="52.0" height="100.0" rx="4" fill="#d1fae5" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">~10 р.</text>
<text x="200.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">літій-йод</text>
<text x="155.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ресурс батареї</text>
<rect x="152.5" y="372.5" width="415.0" height="31.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="391.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перемогу 1970-х дала ПАРА: більший чисельник × менший знаменник</tspan></text>
</svg>