<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560"
     viewBox="0 0 980 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Шари ArduPilot: знизу — залізо, згори — місія</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">абстрактний контур із 43.1 стає стосом конкретних модулів</text>
<rect x="56" y="86" width="590" height="64" rx="10" fill="#ececef" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="72" y="112" font-size="13.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Апарат і режими</text>
<text x="72" y="134" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">ArduCopter · ArduPlane · Rover — головний цикл, мікшер</text>
<rect x="56" y="155" width="590" height="64" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="72" y="181" font-size="13.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Навігація</text>
<text x="72" y="203" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">AP_Mission · AC_WPNav · режими (Auto/RTL/Loiter) → уставка</text>
<rect x="56" y="224" width="590" height="64" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="72" y="250" font-size="13.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Керування</text>
<text x="72" y="272" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">AC_AttitudeControl · AC_PosControl · AC_PID</text>
<rect x="56" y="293" width="590" height="64" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="72" y="319" font-size="13.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Оцінювач стану</text>
<text x="72" y="341" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">AP_AHRS + EKF3 — поєднання → орієнтація, положення, швидкість</text>
<rect x="56" y="362" width="590" height="64" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="72" y="388" font-size="13.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">Драйвери давачів</text>
<text x="72" y="410" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">AP_InertialSensor · AP_GPS · AP_Baro · AP_Compass</text>
<rect x="56" y="431" width="590" height="64" rx="10" fill="#e3effb" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="72" y="457" font-size="13.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">HAL — апаратна абстракція</text>
<text x="72" y="479" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">AP_HAL: UART · I2C · SPI · GPIO · RCOut · Scheduler</text>
<line x1="44" y1="489" x2="44" y2="92" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="30" y="250.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">потік</text>
<rect x="670" y="86" width="250" height="409" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="795.0" y="112" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">НАСКРІЗНІ СЛУЖБИ</text>
<rect x="688" y="146" width="214" height="70" rx="9" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="702" y="174" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AP_Scheduler</text>
<text x="702" y="196" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">темпи задач</text>
<rect x="688" y="236" width="214" height="70" rx="9" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="702" y="264" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">GCS_MAVLink</text>
<text x="702" y="286" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">зв'язок із землею (Розд. 42)</text>
<rect x="688" y="326" width="214" height="70" rx="9" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="702" y="354" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AP_Logger</text>
<text x="702" y="376" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">журнали польоту</text>
<rect x="688" y="416" width="214" height="70" rx="9" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="702" y="444" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AP_Param</text>
<text x="702" y="466" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">параметри (→ 43.4)</text>
<text x="490.0" y="546" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Кожен шар спирається лише на сусідній знизу — тому шар можна замінити (інша плата, інший давач), не чіпаючи решти.</text>
</svg>
