<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPB зсередини: брейк (HALT) і латка (remap) — той самий блок</text>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Flash (код прошивки)</text>
<rect x="40.0" y="86.0" width="74.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="77.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0800</text>
<text x="77.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">bl  init</text>
<rect x="40.0" y="132.0" width="74.0" height="42.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="77.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0804</text>
<text x="77.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(брейк тут)</text>
<rect x="40.0" y="178.0" width="74.0" height="42.0" rx="4" fill="#fff8e6" stroke="#caa24a" stroke-width="1.3"/>
<text x="77.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0808</text>
<text x="77.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6d1f" text-anchor="middle">(латка тут)</text>
<rect x="280.0" y="70.0" width="230.0" height="230.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="395.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">FPB</text>
<text x="395.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">6 компараторів інструкцій</text>
<text x="395.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2 компаратори літералів</text>
<rect x="296.0" y="146.0" width="198.0" height="28.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="395.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">CMP: 0x0804 → BKPT (halt)</text>
<rect x="296.0" y="180.0" width="198.0" height="28.0" rx="4" fill="#fff8e6" stroke="#caa24a" stroke-width="1.3"/>
<text x="395.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1f" text-anchor="middle">CMP: 0x0808 → remap</text>
<rect x="296.0" y="214.0" width="198.0" height="28.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="395.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">REMAP base → таблиця в RAM</text>
<text x="395.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">обидва режими — одне залізо</text>
<text x="395.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тому компаратори лічені</text>
<line x1="118.0" y1="153.0" x2="280.0" y2="160.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="118.0" y1="199.0" x2="280.0" y2="194.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="150.0" width="170.0" height="110.0" rx="10" fill="#fbfdfb" stroke="#27ae60" stroke-width="2.0"/>
<text x="645.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Латка в RAM</text>
<text x="645.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виправлена</text>
<text x="645.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">інструкція</text>
<text x="645.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Flash не чіпано</text>
<line x1="510.0" y1="196.0" x2="560.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Брейк підставляє ядру BKPT; латка підставляє слово з RAM — Flash в обох випадках лишається незмінним.</text>
</svg>