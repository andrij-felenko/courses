<text x="60.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Кількість ядер</text>
<rect x="320.0" y="136.0" width="540.0" height="36.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/><text x="590.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">одне  ↔  два</tspan></text>
<text x="60.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Покоління Wi-Fi</text>
<rect x="320.0" y="184.0" width="540.0" height="36.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/><text x="590.0" y="206.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Wi-Fi 4  ↔  Wi-Fi 6</tspan></text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Bluetooth</text>
<rect x="320.0" y="232.0" width="540.0" height="36.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/><text x="590.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">немає  /  BLE  /  + класичний</tspan></text>
<text x="60.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Вбудований USB</text>
<rect x="320.0" y="280.0" width="540.0" height="36.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/><text x="590.0" y="302.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">немає  ↔  є</tspan></text>
<text x="60.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Особливі здатності</text>
<rect x="320.0" y="328.0" width="540.0" height="36.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/><text x="590.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">AI-прискорення (S3) · Thread/Matter (C6)</tspan></text>
<rect x="120.0" y="392.0" width="660.0" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="450.0" y="411.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Решта — пам'ять, число ніжок — другорядні відмінності.</tspan></text>
