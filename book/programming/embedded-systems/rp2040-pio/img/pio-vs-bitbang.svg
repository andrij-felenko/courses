<rect x="40.0" y="220.0" width="530.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="305.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро лише кладе байти у FIFO і йде у свої справи.</text>
<text x="305.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Автомат жене протокол сам — навантаження ядра ≈ 0%.</text>
<text x="305.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Біт-бенгінг натомість тримав би ядро в петлі весь час передачі.</text>
