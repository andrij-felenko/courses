<text x="599.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">пін</text>
<path d="M 636 120 L 636 98 L 656 98 L 656 120 L 676 120 L 676 98 L 696 98 L 696 120 L 716 120 L 716 98 L 731 98" fill="none" stroke="#8e44ad" stroke-width="2.2"/>
