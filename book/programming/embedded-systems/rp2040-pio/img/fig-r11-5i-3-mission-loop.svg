<text x="292.9" y="297.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чипа конкурентам</text>
<line x1="393.9" y1="326.1" x2="451.8" y2="268.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
