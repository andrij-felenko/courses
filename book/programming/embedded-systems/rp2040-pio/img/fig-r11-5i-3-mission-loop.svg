<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля, де чип служить місії</text>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чому продати власний чип конкурентам — для charity раціонально</text>
<rect x="280.0" y="65.0" width="160.0" height="70.0" rx="10" fill="#eef6ee" stroke="#27ae60" stroke-width="2.0"/><text x="360.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Освітня мета</tspan><tspan x="360.0" dy="14.3">фундації</tspan></text>
<rect x="410.0" y="195.0" width="160.0" height="70.0" rx="10" fill="#e8f4f8" stroke="#2457d6" stroke-width="2.0"/><text x="490.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Дешевий відкритий</tspan><tspan x="490.0" dy="14.3">чип RP2040 (~$1)</tspan></text>
<rect x="280.0" y="325.0" width="160.0" height="70.0" rx="10" fill="#fff8e6" stroke="#c0392b" stroke-width="2.0"/><text x="360.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Виробники плат</tspan><tspan x="360.0" dy="14.3">(Adafruit, Arduino,</tspan><tspan x="360.0" dy="14.3">Pimoroni, SparkFun…)</tspan></text>
<rect x="150.0" y="195.0" width="160.0" height="70.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="230.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Прибуток → фундація</tspan><tspan x="230.0" dy="14.3">+ ширша спільнота</tspan><tspan x="230.0" dy="14.3">+ більше новачків</tspan></text>
<line x1="326.1" y1="133.9" x2="268.2" y2="191.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="297.1" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">фінансує відкриту</text>
