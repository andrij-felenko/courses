<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один біт WS2812 = вікно тактів автомата</text>
<text x="70.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">біт «1»</text>
<path d="M 70 150 L 70 90 L 220 90 L 220 150 L 290 150" fill="none" stroke="#8e44ad" stroke-width="2.6"/>
<line x1="70.0" y1="174.0" x2="220.0" y2="174.0" stroke="#b9770e" stroke-width="1.4"/>
<text x="145.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle">T1H ≈ 800 нс</text>
<text x="430.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">біт «0»</text>
<path d="M 430 150 L 430 90 L 505 90 L 505 150 L 650 150" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<line x1="430.0" y1="174.0" x2="505.0" y2="174.0" stroke="#b9770e" stroke-width="1.4"/>
<text x="467.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle">T0H ≈ 400 нс</text>
<line x1="70.0" y1="220.0" x2="290.0" y2="220.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="180.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 біт = 25 тактів ≈ 1.25 мкс</text>
<line x1="430.0" y1="220.0" x2="650.0" y2="220.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="540.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 біт = 25 тактів ≈ 1.25 мкс</text>
<rect x="70.0" y="280.0" width="620.0" height="52.0" rx="6" fill="#f4eefa" stroke="#8e44ad" stroke-width="1.6"/>
<text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Довжину HIGH задає не пауза в коді, а кількість тактів (інструкція + затримка [n]).</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Тривалість «1» і «0» різниться тільки тим, де автомат опускає ніжку через side-set.</text>
</svg>