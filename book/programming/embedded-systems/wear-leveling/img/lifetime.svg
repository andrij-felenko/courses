<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порахуймо строк служби</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вирівнювання зносу множить ресурс на кількість секторів — і це величезна різниця</text>
<rect x="180.0" y="86.0" width="540.0" height="46.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="450.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">строк = endurance × сектори ÷ записів за добу</tspan></text>
<rect x="80.0" y="156.0" width="740.0" height="46.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="100.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="start" font-weight="700">Без вирівнювання (1 сектор)</text>
<text x="430.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">100 000 ÷ (10/добу)</text>
<text x="700.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="700">≈ 27 років… для 1 байта</text>
<rect x="80.0" y="212.0" width="740.0" height="46.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="100.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">…але всі записи в нього:</text>
<text x="430.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">при 10 записах/хв</text>
<text x="700.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">≈ кілька місяців — і смерть</text>
<rect x="80.0" y="268.0" width="740.0" height="46.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="100.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">З вирівнюванням (×256 секторів)</text>
<text x="430.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">100 000 × 256 ÷ записи</text>
<text x="700.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">роки навіть під шквалом</text>
<text x="450.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновок: частота записів вирішує все. Рідше пишеш — довше живе, хоч скільки секторів.</text>
</svg>