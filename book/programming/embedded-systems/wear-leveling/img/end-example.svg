<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий лічильник, три долі</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">E = 100 000 циклів; міняємо лише вирівнювання й частоту</text>
<text x="70.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1 сектор · кожні 10 с</text>
<rect x="70.0" y="126.0" width="90.0" height="28.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="115.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 12 днів</text>
<text x="70.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✗ помирає за два тижні</text>
<text x="70.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">20 секторів · кожні 10 с</text>
<rect x="70.0" y="192.0" width="300.0" height="28.0" rx="5" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="220.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">≈ 230 днів</text>
<text x="70.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">вирівнювання × 20</text>
<text x="70.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">20 секторів · щогодини</text>
<rect x="70.0" y="258.0" width="560.0" height="28.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="350.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 200+ років</text>
<text x="70.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ рідше + вирівнювання</text>
<text x="440.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два головні важелі: вирівнювання (× секторів) і рідші записи (÷ частоту).</text>
