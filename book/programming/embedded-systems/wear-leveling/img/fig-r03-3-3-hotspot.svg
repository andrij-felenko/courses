<text x="580.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• чіп «помер» на 1/40 ресурсу</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Класичний приклад — лічильник, що його оновлюють у тому самому місці.</text>
