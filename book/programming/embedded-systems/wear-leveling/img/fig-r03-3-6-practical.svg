<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як не вбити Flash: правила на щодень</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знос — тиха смерть; кілька звичок рятують пам'ять на роки</text>
<rect x="60.0" y="90.0" width="380.0" height="240.0" rx="12" fill="#fffafa" stroke="#c0271e" stroke-width="2"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">НЕ роби</text>
<text x="82.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ оновлювати дані «на місці»</text>
<text x="82.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ писати у Flash щосекунди</text>
<text x="82.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ вести лічильник у тому ж байті</text>
<text x="82.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ лити логи без обмежень</text>
<text x="82.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ ігнорувати endurance</text>
<rect x="460.0" y="90.0" width="380.0" height="240.0" rx="12" fill="#fbfdfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="650.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Роби</text>
<text x="482.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ довір NVS / ФС вирівнювання</text>
<text x="482.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ тримай гаряче в RAM, скидай зрідка</text>
<text x="482.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ групуй і відкладай записи</text>
<text x="482.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ обмеж лог кільцем (§4.3.1)</text>
<text x="482.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ для лічильників — FRAM (§4.3.3)</text>
</svg>
