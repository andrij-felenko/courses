<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один виклик: BKPT 0xAB спиняє ядро, хост робить роботу, ядро біжить далі</text>
<text x="185.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Прошивка (ядро ARM)</text>
<text x="675.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700">Хост (ПК) через зонд</text>
<rect x="70.0" y="70.0" width="230.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">r0 = 0x04  (SYS_WRITE0)</tspan></text>
<rect x="70.0" y="138.0" width="230.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">r1 = &amp;&quot;temp=25\0&quot;</tspan></text>
<rect x="70.0" y="206.0" width="230.0" height="46.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">BKPT 0xAB  → ядро СТОЇТЬ</tspan></text>
<line x1="185.0" y1="252.0" x2="185.0" y2="370.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="3,5"/>
<text x="185.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ядро завмерле</text>
<text x="185.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(такти йдуть марно)</text>
<rect x="70.0" y="384.0" width="230.0" height="46.0" rx="6" fill="#d5e8d4" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="403.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">r0 = код результату</tspan><tspan x="185.0" dy="14.3">ядро біжить далі</tspan></text>
<rect x="560.0" y="138.0" width="230.0" height="46.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="675.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">зонд бачить halt</tspan></text>
<rect x="560.0" y="206.0" width="230.0" height="46.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="675.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">читає r0 → яка операція;</tspan><tspan x="675.0" dy="13.0">r1 → де аргументи</tspan></text>
<rect x="560.0" y="274.0" width="230.0" height="46.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="675.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">виконує на ПК:</tspan><tspan x="675.0" dy="13.0">друкує рядок у консоль</tspan></text>
<rect x="560.0" y="342.0" width="230.0" height="46.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="675.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">кладе результат у r0,</tspan><tspan x="675.0" dy="13.0">знімає halt</tspan></text>
<line x1="302.0" y1="229.0" x2="558.0" y2="161.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle">halt</text>
<line x1="558.0" y1="365.0" x2="302.0" y2="407.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">resume</text>
</svg>