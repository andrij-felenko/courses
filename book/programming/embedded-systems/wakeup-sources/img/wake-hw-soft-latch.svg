<line x1="470.0" y1="262.0" x2="462.0" y2="256.0" stroke="#8e44ad" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="108.4" y="348.4" width="543.1" height="43.3" rx="6" fill="#fff3cd" stroke="#e67e22" stroke-width="1.5"/><text x="380.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">HOLD=HIGH першим рядком — інакше відпустять кнопку і чип згасне на старті.</tspan><tspan x="380.0" dy="14.3">HOLD=LOW рве живлення: струм = 0, повний cold-boot при наступному ввімкненні.</tspan></text>
