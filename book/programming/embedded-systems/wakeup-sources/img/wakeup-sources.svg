<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири джерела пробудження з deep-sleep і їхня ціна</text>
<rect x="312.0" y="153.0" width="136.0" height="64.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.5"/>
<text x="380.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Сплячий чип</tspan><tspan x="380.0" dy="18.2">(deep-sleep)</tspan></text>
<rect x="89.0" y="71.0" width="112.0" height="48.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/>
<text x="145.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">① ТАЙМЕР</tspan><tspan x="145.0" dy="15.6">(RTC timer)</tspan></text>
<text x="145.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle">RTC-таймер  ≈10 мкА</text>
<text x="145.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Давач раз на N хв</text>
<line x1="145.0" y1="95.0" x2="310.0" y2="155.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="559.0" y="71.0" width="112.0" height="48.0" rx="6" fill="#e8f8f7" stroke="#1a7a73" stroke-width="2.0"/>
<text x="615.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a7a73" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">② GPIO / ext</tspan><tspan x="615.0" dy="15.6">(ext0/ext1)</tspan></text>
<text x="615.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a7a73" text-anchor="middle">RTC-GPIO  +1–5 мкА</text>
<text x="615.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кнопка, INT давача</text>
<line x1="615.0" y1="95.0" x2="450.0" y2="155.0" stroke="#1a7a73" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="89.0" y="246.0" width="112.0" height="48.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="2.0"/>
<text x="145.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">③ ДОТИК</tspan><tspan x="145.0" dy="15.6">(touch pad)</tspan></text>
<text x="145.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">Ємнісний сканер  +~150 мкА</text>
<text x="145.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кнопка без механіки</text>
<line x1="145.0" y1="270.0" x2="310.0" y2="215.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="559.0" y="246.0" width="112.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">④ ULP</tspan><tspan x="615.0" dy="15.6">(co-processor)</tspan></text>
<text x="615.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ULP + RTC-АЦП  +~100 мкА</text>
<text x="615.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Поріг сигналу в сні</text>
<line x1="615.0" y1="270.0" x2="450.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="33.4" y="354.5" width="693.2" height="27.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="371.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Можна ввімкнути кілька джерел разом; після пробудження прошивка питає ПРИЧИНУ — esp_sleep_get_wakeup_cause()</tspan></text>
</svg>