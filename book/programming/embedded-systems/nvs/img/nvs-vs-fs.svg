<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">NVS проти файлової системи</text>
<rect x="60.0" y="70.0" width="270.0" height="150.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="195.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">NVS</text>
<text x="195.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">дрібні іменовані</tspan><tspan x="195.0" dy="13.8">налаштування</tspan><tspan x="195.0" dy="13.8"></tspan><tspan x="195.0" dy="13.8">байти — сотні байтів</tspan><tspan x="195.0" dy="13.8">десятки ключів</tspan></text>
<text x="195.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="195.0" dy="0.0">ssid, пароль, гучність,</tspan><tspan x="195.0" dy="14.3">лічильники, калібрування</tspan></text>
<rect x="390.0" y="70.0" width="270.0" height="150.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="525.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">файлова система</text>
<text x="525.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">великі дані,</tspan><tspan x="525.0" dy="13.8">схожі на файли</tspan><tspan x="525.0" dy="13.8"></tspan><tspan x="525.0" dy="13.8">кілобайти — мегабайти</tspan><tspan x="525.0" dy="13.8">багато даних</tspan></text>
<text x="525.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="525.0" dy="0.0">журнали, картинки,</tspan><tspan x="525.0" dy="14.3">звук, веб-сторінки</tspan></text>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">маленьке й «налаштування» → NVS;  велике й «файл» → файлова система</text>
</svg>