<text x="500.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вільне місце</text>
<text x="470.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="470.0" dy="0.0">Кожен покажчик має ОДНОГО господаря:</tspan><tspan x="470.0" dy="16.7">ядро лиш пише й рухає WrOff,</tspan><tspan x="470.0" dy="16.7">зонд лиш читає й рухає RdOff.</tspan><tspan x="470.0" dy="16.7">Тому замок не потрібен —</tspan><tspan x="470.0" dy="16.7">вони ніколи не пишуть в одне.</tspan></text>
<text x="470.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">WrOff == RdOff → порожньо</text>
