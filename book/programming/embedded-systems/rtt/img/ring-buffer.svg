<text x="470.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Зайняте — між RdOff і WrOff:</text>
<rect x="470.0" y="104.0" width="22.0" height="14.0" rx="6" fill="#dbe7fb" stroke="#b9c4d6" stroke-width="1.0"/>
<text x="500.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ще не прочитане зондом</text>
