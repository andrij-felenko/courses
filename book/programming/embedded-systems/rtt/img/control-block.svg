<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як зонд знаходить RTT: підпис у RAM, потім описи каналів</text>
<text x="115.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">RAM цілі</text>
<rect x="40.0" y="70.0" width="150.0" height="48.0" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.0"/>
<text x="115.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">.data</text>
<rect x="40.0" y="124.0" width="150.0" height="48.0" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.0"/>
<text x="115.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стек</text>
<rect x="40.0" y="178.0" width="150.0" height="48.0" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.0"/>
<text x="115.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">купа</text>
<rect x="40.0" y="232.0" width="150.0" height="48.0" rx="4" fill="#fff3d6" stroke="#c0392b" stroke-width="2.2"/>
<text x="115.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RTT CB</text>
<rect x="40.0" y="286.0" width="150.0" height="48.0" rx="4" fill="#e8f3ea" stroke="#c9c9c9" stroke-width="1.0"/>
<text x="115.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">буфери</text>
<rect x="40.0" y="340.0" width="150.0" height="48.0" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.0"/>
<text x="115.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">.bss</text>
<text x="115.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">зонд фоново читає RAM</text>
<text x="300.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Керівний блок (SEGGER_RTT_CB)</text>
<rect x="300.0" y="70.0" width="250.0" height="40.0" rx="6" fill="#fff3d6" stroke="#c0392b" stroke-width="1.3"/><text x="425.0" y="93.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">acID[16] = &quot;SEGGER RTT\0…&quot;</tspan></text>
<text x="562.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">підпис — за ним зонд і впізнає блок</text>
<rect x="300.0" y="116.0" width="250.0" height="40.0" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.3"/><text x="425.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">MaxNumUp / MaxNumDown</tspan></text>
<text x="562.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">скільки каналів угору / вниз</text>
<rect x="300.0" y="162.0" width="250.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="425.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">aUp[0]:  pBuffer, Size,</tspan></text>
<text x="562.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">опис кільця 0 (ядро→хост):</text>
<rect x="300.0" y="208.0" width="250.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="425.0" y="231.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">         WrOff, RdOff, Flags</tspan></text>
<text x="562.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">де буфер, розмір, два покажчики</text>
<rect x="300.0" y="254.0" width="250.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="425.0" y="277.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">aDown[0]: pBuffer, Size,</tspan></text>
<text x="562.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">опис кільця вниз (хост→ядро)</text>
<rect x="300.0" y="300.0" width="250.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="425.0" y="323.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">          WrOff, RdOff, Flags</tspan></text>
<line x1="194.0" y1="256.0" x2="294.0" y2="90.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="251.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">знайдено
за підписом</text>
<rect x="82.7" y="351.4" width="594.6" height="49.3" rx="6" fill="#f6f4ec" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="372.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Адрес блоку зонд наперед не знає: він сканує RAM, шукаючи 16 байтів &quot;SEGGER RTT&quot;;</tspan><tspan x="380.0" dy="14.3">знайшов підпис — читає описи каналів і качає буфери. Усе через SWD/JTAG, без окремого піна.</tspan></text>
</svg>