<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди під'єднано перемикач і що він тримає</text>
<rect x="55.0" y="95.0" width="190.0" height="110.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="150.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">перемикач</tspan><tspan x="150.0" dy="16.9">безпеки</tspan><tspan x="150.0" dy="16.9">(кнопка + LED)</tspan></text>
<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у руках оператора</text>
<line x1="245.0" y1="130.0" x2="370.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="307.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лінія SAFETY_SW</text>
<text x="307.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(натиснуто / ні)</text>
<line x1="370.0" y1="170.0" x2="245.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="307.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">лінія LED (стан)</text>
<rect x="370.0" y="85.0" width="300.0" height="130.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">IO-копроцесор</tspan><tspan x="520.0" dy="16.9">(окремий чип, керує виходами)</tspan></text>
<text x="520.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">затвор PWM: доки перемикач не знято — ЗАКРИТО</text>
<line x1="670.0" y1="150.0" x2="790.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="790.0" y="105.0" width="140.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="860.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">виходи PWM</tspan><tspan x="860.0" dy="16.2">→ ESC → двигуни</tspan></text>
<rect x="160.0" y="383.5" width="640.0" height="33.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">перемикач ріже виходи в IO-чипі — ПОВЗ політний код (FMU)</tspan></text>
<rect x="203.2" y="426.0" width="553.5" height="32.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="480.0" y="446.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">навіть якщо головна прошивка збожеволіє — двигуни стоять, доки кнопку не знято</tspan></text>
</svg>