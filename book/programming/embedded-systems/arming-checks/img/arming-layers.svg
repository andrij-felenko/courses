<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три заслони на шляху газу до двигунів</text>
<rect x="110.0" y="80.0" width="680.0" height="74.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">КОМАНДА газу (пульт / місія)</tspan></text>
<text x="450.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">джерело наміру</text>
<line x1="450.0" y1="168.0" x2="450.0" y2="178.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="110.0" y="174.0" width="680.0" height="74.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">логіка ARM у прошивці</tspan></text>
<text x="450.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пропускає лише коли ARMED і перевірки пройшли</text>
<line x1="450.0" y1="262.0" x2="450.0" y2="272.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="110.0" y="268.0" width="680.0" height="74.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="450.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">апаратний запобіжник (safety switch)</tspan></text>
<text x="450.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">фізичний перемикач: доки не знято — виходи заглушено</text>
<line x1="450.0" y1="356.0" x2="450.0" y2="366.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="110.0" y="362.0" width="680.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">вихід на регулятори (ESC)  →  ОБЕРТАННЯ</tspan></text>
<text x="450.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">остання ланка: сюди доходить лише дозволене</text>
</svg>