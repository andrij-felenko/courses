<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Arming — ворота до обертання двигунів</text>
<line x1="470.0" y1="70.0" x2="470.0" y2="370.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="9 7"/>
<rect x="110.0" y="92.8" width="250.0" height="54.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DISARMED</tspan><tspan x="235.0" dy="19.5">(знеструмлено)</tspan></text>
<text x="235.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">команда газу ІГНОРУЄТЬСЯ</text>
<text x="235.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">двигуни завжди стоять</text>
<text x="235.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">можна брати руками</text>
<rect x="580.0" y="92.8" width="250.0" height="54.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="705.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">ARMED</tspan><tspan x="705.0" dy="19.5">(під напругою)</tspan></text>
<text x="705.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">газ КЕРУЄ двигунами</text>
<text x="705.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">гвинти можуть крутитися</text>
<text x="705.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">руки геть</text>
<rect x="210.0" y="275.1" width="520.0" height="49.9" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">перейти можна ЛИШЕ коли:</tspan><tspan x="470.0" dy="16.9">усі перевірки зелені  +  свідома команда ARM</tspan></text>
<line x1="350.0" y1="355.0" x2="590.0" y2="355.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ARM</text>
<line x1="590.0" y1="405.0" x2="350.0" y2="405.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">  DISARM (будь-коли)</text>
</svg>