<text x="468.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="468.0" dy="0.0">ключова перевага класу</tspan></text>
<rect x="458.0" y="350.0" width="294.0" height="50.0" rx="5" fill="#e5f0fa" stroke="#2471a3" stroke-width="1.2"/>
<text x="468.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2471a3" text-anchor="start" font-weight="700">▸ Більший струм спокою</text>
<text x="468.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="468.0" dy="0.0">радіо їсть, поки не вимкнеш</tspan></text>
<text x="410.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">STM32 виграє точною провідною периферією; ESP32 — вбудованим радіо.</text>
