<text x="78.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="78.0" dy="0.0">потрібен зовнішній модуль</tspan></text>
