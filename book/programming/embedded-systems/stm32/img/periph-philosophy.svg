<text x="468.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="468.0" dy="0.0">прив'язаний до інтерфейсів</tspan></text>
