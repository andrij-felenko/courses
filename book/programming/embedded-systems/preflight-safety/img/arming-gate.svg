<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлюз arming: два замки між «зібрано» і «летить»</text>
<rect x="35.0" y="152.5" width="230.0" height="65.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">DISARMED</tspan><tspan x="150.0" dy="16.2">(двигуни не крутяться</tspan><tspan x="150.0" dy="16.2">за жодних команд)</tspan></text>
<rect x="675.0" y="152.5" width="230.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">ARMED</tspan><tspan x="790.0" dy="16.2">(двигуни живі,</tspan><tspan x="790.0" dy="16.2">апарат може злетіти)</tspan></text>
<text x="430.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАСТАВА 1</text>
