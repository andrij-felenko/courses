<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія часу CMSIS: від купівлі Keil до модульної федерації</text>
<line x1="250.0" y1="90.0" x2="250.0" y2="690.0" stroke="#c9ced4" stroke-width="3.0"/>
<text x="222.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="end" font-weight="700">2004</text>
<text x="222.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">19 жовтня</text>
<line x1="250.0" y1="120.0" x2="292.0" y2="120.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="120.0" r="7.0" fill="#f0e6fa" stroke="#7d3c98" stroke-width="2.0"/>
<rect x="292.0" y="83.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#7d3c98" stroke-width="1.8"/>
<text x="308.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="start" font-weight="700">Cortex-M3: ядро стає однаковим</text>
<text x="308.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">NVIC, SysTick і їхні адреси входять в архітектуру;</text>
<text x="308.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">кремній — Luminary (2006), STM32 (2007), далі решта</text>
<text x="222.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a5276" text-anchor="end" font-weight="700">2005</text>
<text x="222.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">28 жовтня</text>
<line x1="250.0" y1="228.0" x2="292.0" y2="228.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="228.0" r="7.0" fill="#d6eaf8" stroke="#1a5276" stroke-width="2.0"/>
<rect x="292.0" y="191.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="1.8"/>
<text x="308.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a5276" text-anchor="start" font-weight="700">ARM купує Keil</text>
<text x="308.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ARM здобуває людей, що 20 років жили в зоопарку</text>
<text x="308.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">заголовків 8051 — і мотив задати програмний стандарт</text>
<text x="222.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="end" font-weight="700">2008</text>
<text x="222.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">12 листоп.</text>
<line x1="250.0" y1="336.0" x2="292.0" y2="336.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="336.0" r="11.0" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.4"/>
<rect x="292.0" y="299.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#1e8449" stroke-width="1.8"/>
<text x="308.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">CMSIS 1.0 · ядро CMSIS-Core</text>
<text x="308.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ARM + Atmel · IAR · Keil · Luminary · Micrium · NXP · SEGGER · ST</text>
<text x="308.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">один C-інтерфейс до ядра — на кожному чипі й компіляторі</text>
<text x="222.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="end" font-weight="700">2009–14</text>
<text x="222.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">CMSIS 2–4</text>
<line x1="250.0" y1="444.0" x2="292.0" y2="444.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="444.0" r="7.0" fill="#fdf3d6" stroke="#b9770e" stroke-width="2.0"/>
<rect x="292.0" y="407.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#b9770e" stroke-width="1.8"/>
<text x="308.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">Родина розростається</text>
<text x="308.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">DSP · SVD · Pack · DAP · RTOS · Driver — кожен модуль</text>
<text x="308.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">закриває свій фронт роздроблення; під Pack уже 16 партнерів</text>
<text x="222.0" y="549.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="end" font-weight="700">2016+</text>
<text x="222.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">CMSIS 5</text>
<line x1="250.0" y1="552.0" x2="292.0" y2="552.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="552.0" r="7.0" fill="#f0e6fa" stroke="#7d3c98" stroke-width="2.0"/>
<rect x="292.0" y="515.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#7d3c98" stroke-width="1.8"/>
<text x="308.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="start" font-weight="700">«Cortex» → «Common»</text>
<text x="308.0" y="559.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">GitHub і ліцензія Apache 2.0; стандарт виходить за межі</text>
<text x="308.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Cortex-M на молодші Cortex-A — назва «Cortex» більше не точна</text>
<text x="222.0" y="657.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="end" font-weight="700">2023-24</text>
<text x="222.0" y="674.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">CMSIS 6</text>
<line x1="250.0" y1="660.0" x2="292.0" y2="660.0" stroke="#c9ced4" stroke-width="1.4"/>
<circle cx="250.0" cy="660.0" r="7.0" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.0"/>
<rect x="292.0" y="623.0" width="546.0" height="74.0" rx="8" fill="#ffffff" stroke="#1e8449" stroke-width="1.8"/>
<text x="308.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="start" font-weight="700">Модульна федерація</text>
<text x="308.0" y="667.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">монорепо розбито на окремі репозиторії GitHub</text>
<text x="308.0" y="683.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з відкритим врядуванням — кожен модуль сам по собі</text>
<text x="430.0" y="744.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стандарт приходить через чотири роки після ядра — вирівнювати те, що вже встигло розійтися</text>
</svg>