<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="900" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як з epoch дістати дату: «знімаємо шари»</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне число секунд розкручують у дату, знімаючи шар за шаром</text>
<rect x="60.0" y="86.0" width="200.0" height="48.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="160.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">epoch (секунди)</text>
<line x1="260.0" y1="110.0" x2="300.0" y2="110.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="280.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">÷86400</text>
<rect x="300.0" y="86.0" width="230.0" height="48.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="415.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">дні від 1970</text>
<text x="415.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+ залишок: секунди в добі</text>
<line x1="415.0" y1="134.0" x2="415.0" y2="168.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="300.0" y="170.0" width="230.0" height="44.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="415.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">секунди в добі →</text>
<text x="415.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">години : хвилини : секунди</text>
<line x1="530.0" y1="110.0" x2="580.0" y2="110.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<rect x="580.0" y="86.0" width="270.0" height="128.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="715.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дні від 1970 →</text>
<text x="715.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">− роки (365 або 366)</text>
<text x="715.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">− місяці (28/29/30/31)</text>
<text x="715.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">= рік · місяць · день</text>
<text x="715.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">(високосні — складність!)</text>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Секунди → доби й час доби; доби → роки → місяці → день. Зворотне переведення — так само, у зворотний бік.</text>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому-то всередині тримають просте число, а в дату переводять лише для показу (§4.6.8).</text>
</svg>
