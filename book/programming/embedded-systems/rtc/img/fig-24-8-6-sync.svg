<text x="700.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">так само вміють</text>
<text x="700.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">GPS і радіосигнал</text>
<text x="700.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">точного часу</text>
<rect x="120.0" y="234.0" width="660.0" height="40.0" rx="8" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Періодично беремо точний час із мережі (NTP) — і виставляємо годинник наново.</text>
