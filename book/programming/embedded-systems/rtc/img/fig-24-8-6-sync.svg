<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Синхронізація: звіряти з еталоном</text>
<rect x="70.0" y="100.0" width="150.0" height="70.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="145.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ESP32</text>
<text x="145.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">годинник дрейфнув</text>
<line x1="220.0" y1="135.0" x2="360.0" y2="135.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="290.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Wi-Fi</text>
