<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній RTC ESP32 проти зовнішнього модуля</text>
<rect x="60.0" y="70.0" width="360.0" height="180.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="240.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">Внутрішній RTC ESP32</text>
<text x="82.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">іде в глибокому сні ✓</text>
<text x="82.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">без батарейки → втрачає час</text>
<text x="82.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">   при повному вимкненні</text>
<text x="82.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">помітний дрейф ✗</text>
<rect x="450.0" y="70.0" width="330.0" height="180.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зовнішній DS3231</text>
<text x="470.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">власна батарейка → роки ходу ✓</text>
<text x="470.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">термокомпенсація → ±2 ppm ✓</text>
<text x="470.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">є alarm-вихід (будить за часом)</text>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">трохи деталей і місця — ціна</text>
<rect x="60.0" y="260.0" width="720.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Точний, тривкий час — бери зовнішній DS3231; досить пережити сон — вистачить внутрішнього.</tspan></text>
</svg>