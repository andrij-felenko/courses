<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Високосний рік: правило ÷4, ÷100, ÷400</text>
<rect x="70.0" y="64.0" width="700.0" height="92.0" rx="6" fill="#fbfbff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="420.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">рік ділиться на 4  →  високосний (29 днів у лютому)…</text>
<text x="420.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">…АЛЕ ділиться на 100  →  НЕ високосний…</text>
<text x="420.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">…АЛЕ ділиться на 400  →  таки високосний.</text>
<rect x="90.0" y="178.0" width="200.0" height="64.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="190.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2024  (÷4)</text>
<text x="190.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓ високосний</text>
<rect x="330.0" y="178.0" width="200.0" height="64.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="430.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1900  (÷100, не ÷400)</text>
<text x="430.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">✗ звичайний</text>
<rect x="570.0" y="178.0" width="200.0" height="64.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="670.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2000  (÷400)</text>
<text x="670.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓ високосний</text>
<rect x="60.0" y="258.0" width="720.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="277.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Лютий має 29 днів лише у високосний — через це конвертація й заплутана. Пояси й літній час іще гірші.</tspan></text>
</svg>