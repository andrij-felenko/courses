<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрейф: кожен годинник бреше потроху</text>
<text x="420.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">невелика похибка ходу накопичується — час поволі «розходиться» зі справжнім</text>
<line x1="90.0" y1="140.0" x2="760.0" y2="140.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="74.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end" font-weight="700">істина</text>
<polyline points="90,140 760,104" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="774.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">дрейф</text>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">дешевий RTC ~20 ppm ≈ 1.7 с/добу ≈ ~1 хв/місяць</text>
<text x="420.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">DS3231 ~2 ppm ≈ кілька секунд/місяць</text>
<rect x="150.0" y="238.0" width="540.0" height="32.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="420.0" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Похибка накопичується з часом — тому годинник час від часу треба звіряти.</tspan></text>
