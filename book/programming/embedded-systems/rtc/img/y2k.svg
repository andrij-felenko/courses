<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y2K: дві цифри, що заощадили — і бабахнули</text>
<text x="420.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">рік зберігали двома цифрами заради дорогоцінної пам'яті</text>
<rect x="60.0" y="84.0" width="200.0" height="70.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="160.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">рік = «99»</text>
<text x="160.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(тобто 1999)</text>
<line x1="260.0" y1="119.0" x2="320.0" y2="119.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="290.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2000</text>
<rect x="320.0" y="84.0" width="210.0" height="70.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="425.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">рік = «00»</text>
<text x="425.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">комп'ютер читає 1900!</text>
<line x1="530.0" y1="119.0" x2="590.0" y2="119.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="590.0" y="84.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="715.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">арифметика дат ламається</text>
<text x="715.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(вік, тривалості, рахунки)</text>
<rect x="60.0" y="202.0" width="720.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Скорочення «викинути 19» заощаджувало байти на мільярдах записів —</tspan><tspan x="420.0" dy="13.7">і клало бомбу сповільненої дії під 2000-й рік.</tspan><tspan x="420.0" dy="13.7">Пам'ять колись була такою дорогою, що дві цифри здавалися ощадливістю.</tspan></text>
</svg>