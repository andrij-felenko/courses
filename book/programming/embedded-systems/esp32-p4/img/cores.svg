<text x="390.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">знайома двоступенева ощадність родини — тільки «велика» половина набагато потужніша</text>
