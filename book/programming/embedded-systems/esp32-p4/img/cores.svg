<rect x="300.0" y="90.0" width="210.0" height="84.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/><text x="405.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Ядро 1 (HP)</tspan><tspan x="405.0" dy="15.0">RISC-V · до 400 МГц</tspan><tspan x="405.0" dy="15.0">FPU + ШІ-вектор</tspan></text>
<text x="175.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">важка логіка, інтерфейс, зображення</text>
<rect x="560.0" y="100.0" width="160.0" height="66.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="640.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">LP-ядро</tspan><tspan x="640.0" dy="14.3">до 40 МГц</tspan><tspan x="640.0" dy="14.3">жевріє у сні</tspan></text>
