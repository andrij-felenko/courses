<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переповнення millis(): чому віднімання все одно працює</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">millis() теж переповнюється (~49.7 дня), та різниця (now − last) лишається правильною</text>
<line x1="80.0" y1="200.0" x2="700.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="80.0,200.0 300.0,90.0 300.0,200.0 560.0,90.0 560.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80.0" y1="90.0" x2="620.0" y2="90.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="74.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">2^32</text>
<circle cx="300.0" cy="90.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="300.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ wrap (~49.7 дня)</text>
<text x="360.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">далі лічба з нуля</text>
<rect x="60.0" y="250.0" width="420.0" height="120.0" rx="10" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="270.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛЬНО (стійко до wrap)</text>
<text x="80" y="304" font-family="Consolas, monospace" font-size="13" fill="#1b1b1b">if (millis() - last >= interval)</text>
<text x="270.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">віднімання беззнакове → wrap</text>
<text x="270.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сам себе компенсує. Завжди так.</text>
<rect x="500.0" y="250.0" width="420.0" height="120.0" rx="10" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="710.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">НЕПРАВИЛЬНО (ламається на wrap)</text>
<text x="520" y="304" font-family="Consolas, monospace" font-size="13" fill="#1b1b1b">if (millis() >= last + interval)</text>
<text x="710.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">після переповнення порівняння</text>
<text x="710.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">збивається — подія застрягне.</text>
</svg>
