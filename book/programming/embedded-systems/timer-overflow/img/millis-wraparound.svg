<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення millis(): чому віднімання все одно працює</text>
<line x1="80.0" y1="195.0" x2="700.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="80.0,195.0 300.0,90.0 300.0,195.0 560.0,90.0 560.0,195.0" fill="none" stroke="#27ae60" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80.0" y1="90.0" x2="620.0" y2="90.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="72.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">2³²</text>
<circle cx="300.0" cy="90.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<circle cx="560.0" cy="90.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">↯ wrap (~49.7 дня)</text>
<rect x="60.0" y="250.0" width="420.0" height="120.0" rx="10" fill="#f3faf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="270.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО (стійко до wrap)</text>
<text x="80" y="306" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a">if (millis() - last >= interval)</text>
<text x="270.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">беззнакове віднімання саме</text>
<text x="270.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">компенсує wrap — працює завжди</text>
<rect x="500.0" y="250.0" width="420.0" height="120.0" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="710.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕПРАВИЛЬНО (ламається на wrap)</text>
<text x="520" y="306" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a">if (millis() &gt;= last + interval)</text>
<text x="710.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">після переповнення порівняння</text>
<text x="710.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">збивається — подія застрягає</text>
</svg>