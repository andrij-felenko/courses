<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">На переповненні: віднімання тримається, порівняння зривається</text>
<rect x="60.0" y="70.0" width="400.0" height="210.0" rx="10" fill="#f3faf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="260.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО</text>
<text x="82" y="134" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="15" fill="#1a1a1a">now - last &gt;= interval</text>
<text x="260.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">різниця беззнакова — за модулем 2³²</text>
<text x="260.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">wrap «само себе компенсує»</text>
<text x="260.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">працює через переповнення</text>
<text x="260.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(і завжди поза ним)</text>
<rect x="480.0" y="70.0" width="400.0" height="210.0" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="680.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ХИБНО</text>
<text x="502" y="134" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="15" fill="#1a1a1a">now &gt;= last + interval</text>
<text x="680.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">last + interval теж обертається</text>
<text x="680.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">порівняння на мить бреше</text>
<text x="680.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">таймер застрягає до обороту</text>
<text x="680.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(побачити в розробці майже нереально)</text>
<line x1="460.0" y1="175.0" x2="480.0" y2="175.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>