<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переповнення: лічильник дійшов до максимуму й «обнулився»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лічильник скінченний; за максимумом наступний тік повертає його в нуль — і лічба триває</text>
<line x1="90.0" y1="270.0" x2="90.0" y2="90.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="90.0" y1="270.0" x2="880.0" y2="270.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="82.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">значення</text>
<text x="880.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<polyline points="90.0,270.0 300.0,110.0 300.0,270.0 560.0,110.0 560.0,270.0 820.0,110.0 820.0,270.0" fill="none" stroke="#1f8a3b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90.0" y1="110.0" x2="880.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="82.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">макс</text>
<text x="82.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(2^N − 1)</text>
<circle cx="300.0" cy="110.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="300.0" y1="110.0" x2="300.0" y2="270.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="300.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ переповнення</text>
<circle cx="560.0" cy="110.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="560.0" y1="110.0" x2="560.0" y2="270.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="560.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ переповнення</text>
<circle cx="820.0" cy="110.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="820.0" y1="110.0" x2="820.0" y2="270.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="820.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ переповнення</text>
<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">період переповнення = (макс+1) × тривалість тіку</text>
<text x="430.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">16-біт @ 1 мкс → ~65 мс; 32-біт → ~71 хв; 64-біт → тисячоліття</text>
</svg>
