<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переповнення — це подія: воно може смикнути переривання</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щойно лічильник обнулився, таймер кличе обробник — точно й без участі коду</text>
<line x1="90.0" y1="200.0" x2="760.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="90.0,200.0 250.0,100.0 250.0,200.0 450.0,100.0 450.0,200.0 650.0,100.0 650.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90.0" y1="100.0" x2="700.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="84.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">макс</text>
<circle cx="250.0" cy="100.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="250.0" y1="100.0" x2="250.0" y2="60.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="250.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯</text>
<circle cx="450.0" cy="100.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="450.0" y1="100.0" x2="450.0" y2="60.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="450.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯</text>
<circle cx="650.0" cy="100.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="650.0" y1="100.0" x2="650.0" y2="60.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="650.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯</text>
<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">переривання за переповненням</text>
<rect x="760.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="835.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">обробник</text>
<text x="835.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(ISR таймера)</text>
<line x1="700.0" y1="100.0" x2="800.0" y2="150.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="150.0" y="270.0" width="640.0" height="70.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так таймер сам, без опитування, сповіщає «минув проміжок!» — і обробник реагує.</text>
<text x="470.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Це поєднання таймера (Розділ 24) і переривання (Розділ 23) — основа всієї роботи з часом.</text>
</svg>
