<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення таймер перетворює на переривання</text>
<rect x="65.0" y="105.6" width="170.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="150.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">лічильник</tspan><tspan x="150.0" dy="16.2">росте з тіками</tspan></text>
<rect x="315.0" y="105.6" width="170.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">↯ обнулився</tspan><tspan x="400.0" dy="16.2">(переповнення)</tspan></text>
<rect x="565.0" y="105.6" width="150.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">переривання</tspan><tspan x="640.0" dy="16.2">таймера</tspan></text>
<rect x="785.0" y="105.6" width="110.0" height="48.8" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">обробник</tspan><tspan x="840.0" dy="16.2">(ISR)</tspan></text>
<line x1="235.0" y1="130.0" x2="315.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="485.0" y1="130.0" x2="565.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="715.0" y1="130.0" x2="785.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">таймер лічить час, а переривання миттєво сповіщає, коли проміжок минув — без опитування в циклі</text>
</svg>