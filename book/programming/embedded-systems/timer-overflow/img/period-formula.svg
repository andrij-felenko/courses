<rect x="420.0" y="95.6" width="200.0" height="48.8" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ВЕРХ</tspan><tspan x="520.0" dy="16.2">(скільки тіків лічити)</tspan></text>
<text x="700.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">=</text>
<rect x="760.0" y="103.0" width="120.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="820.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">період</tspan></text>
<rect x="150.0" y="195.0" width="640.0" height="100.0" rx="8" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.3"/>
<text x="172.0" y="233.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a">ESP32: частота 80 МГц, передільник ÷80  →  тік = 1 мкс</text>
<text x="172.0" y="263.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="14" fill="#1a1a1a">ВЕРХ = 1000  →  період = 1000 × 1 мкс = 1 мс</text>
