<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Беззнакове віднімання — як на циферблаті</text>
<circle cx="240.0" cy="185.0" r="100.0" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<text x="240.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0 / 2³²</text>
<circle cx="209.1" cy="89.9" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="195.1" y="79.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">last ≈ MAX</text>
<circle cx="264.2" cy="88.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="278.2" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">now = 4</text>
<text x="240.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">проміжок</text>
<text x="240.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">= 10 мс</text>
<rect x="430.0" y="110.0" width="430.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/>
<text x="645.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Через переповнення:</text>
<text x="452" y="162" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a">last = 4 294 967 290   (≈ MAX)</text>
<text x="452" y="186" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a">за 10 мс now = 4   (обернувся)</text>
<text x="452" y="210" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6">now − last = (4 − last) mod 2³²</text>
<text x="452" y="234" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#27ae60">= 10  ✓  правильний проміжок</text>
<text x="450.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">як на 12-годинному циферблаті: «2 − 10» = 4 години, а не −8 — лічильник теж по колу</text>
</svg>