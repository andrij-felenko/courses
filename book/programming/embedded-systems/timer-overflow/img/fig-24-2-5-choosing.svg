<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Слідкуй лише, щоб ВЕРХ уліз у лічильник (не перевищив його розрядність).</text>
