<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому популярні виклики небезпечні в обробнику — і чим їх замінити</text>
<rect x="30.0" y="50.0" width="170.0" height="32.0" rx="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="115.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Функція</text>
<rect x="210.0" y="50.0" width="270.0" height="32.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="345.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Чому небезпечна в обробнику</text>
<rect x="490.0" y="50.0" width="250.0" height="32.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечна заміна</text>
<rect x="30.0" y="90.0" width="170.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/><text x="115.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">strtok</tspan></text>
<rect x="210.0" y="90.0" width="270.0" height="50.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.0"/><text x="345.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">статичний буфер:</tspan><tspan x="345.0" dy="13.0">зберігає *ptr між викликами</tspan></text>
<rect x="490.0" y="90.0" width="250.0" height="50.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="615.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">парсити в loop();</tspan><tspan x="615.0" dy="13.0">або strtok_r (лише в loop)</tspan></text>
<rect x="30.0" y="144.0" width="170.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/><text x="115.0" y="172.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">malloc / new / String</tspan></text>
<rect x="210.0" y="144.0" width="270.0" height="50.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.0"/><text x="345.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">замок купи:</tspan><tspan x="345.0" dy="13.0">на FreeRTOS — збій</tspan></text>
<rect x="490.0" y="144.0" width="250.0" height="50.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="615.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">буфер фікс. розміру,</tspan><tspan x="615.0" dy="13.0">виділений у setup()</tspan></text>
<rect x="30.0" y="198.0" width="170.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/><text x="115.0" y="226.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">printf / Serial.print</tspan></text>
<rect x="210.0" y="198.0" width="270.0" height="50.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.0"/><text x="345.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">внутр. буфер + malloc,</tspan><tspan x="345.0" dy="13.0">до того ж повільно</tspan></text>
<rect x="490.0" y="198.0" width="250.0" height="50.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="615.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">прапорець/черга в обробнику,</tspan><tspan x="615.0" dy="13.0">друк у loop()</tspan></text>
<rect x="30.0" y="252.0" width="170.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/><text x="115.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">gmtime / localtime</tspan></text>
<rect x="210.0" y="252.0" width="270.0" height="50.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.0"/><text x="345.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">статичний буфер</tspan><tspan x="345.0" dy="13.0">(errno, результат)</tspan></text>
<rect x="490.0" y="252.0" width="250.0" height="50.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="615.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">localtime_r у loop(),</tspan><tspan x="615.0" dy="13.0">не в обробнику</tspan></text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Дивись не на швидкість, а на середній стовпець: прихований стан між викликами — ось небезпека</text>
</svg>