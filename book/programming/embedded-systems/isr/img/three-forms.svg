<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="260" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи відкласти роботу — від простого до потужного</text>
<rect x="40.0" y="80.0" width="200.0" height="130.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="140.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Прапорець</text>
<text x="140.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">обробник ставить,</text>
<text x="140.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">loop перевіряє</text>
<text x="140.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">одна подія</text>
<rect x="260.0" y="80.0" width="200.0" height="130.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Черга подій</text>
<text x="360.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">обробник кладе в кільце,</text>
<text x="360.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">loop розбирає</text>
<text x="360.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">потік подій</text>
<rect x="480.0" y="80.0" width="200.0" height="130.0" rx="12" fill="#fdf3e0" stroke="#b8860b" stroke-width="2.0"/>
<text x="580.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">Задача (RTOS)</text>
<text x="580.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">обробник будить задачу,</text>
<text x="580.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вона робить важке</text>
<text x="580.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">структурована робота</text>
<line x1="242.0" y1="145.0" x2="258.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="462.0" y1="145.0" x2="478.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Що важча робота — то правіше; суть одна: обробник лише сигналить, робота — поза ним</text>
</svg>