<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">З delay() не зробиш двох справ із різним ритмом</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">блимати одним LED раз на 500 мс, іншим — раз на 300 мс: delay одного блокує другий</text>
<text x="64.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">треба:</text>
<text x="120.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">LED-A кожні 500 мс</text>
<text x="120.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">LED-B кожні 300 мс</text>
<text x="64.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">delay:</text>
<rect x="120.0" y="196.0" width="200.0" height="28.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="220.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A, delay(500)</text>
<rect x="330.0" y="196.0" width="200.0" height="28.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="430.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">B ЧЕКАЄ ці 500 мс</text>
<rect x="540.0" y="196.0" width="200.0" height="28.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="640.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B, delay(300)</text>
<rect x="750.0" y="196.0" width="140.0" height="28.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="820.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">A збився!</text>
<text x="480.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ритми збиваються: поки чекає один delay, другий LED стоїть. Так двох ритмів не втримати.</text>
<rect x="150.0" y="300.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь проблеми: delay() монополізує процесор. Доки він чекає, більше НІЩО не діється.</text>
<text x="480.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">А реальні пристрої мусять робити багато справ «водночас».</text>
</svg>
