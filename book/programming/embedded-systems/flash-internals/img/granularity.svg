<text x="351.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">пишемо сюди (1 сторінка)</text>
<line x1="300.0" y1="300.0" x2="300.0" y2="252.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАПИС торкається однієї сторінки</text>
<line x1="640.0" y1="300.0" x2="640.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">СТИРАННЯ змітає весь сектор</text>
<text x="640.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(усі 16 сторінок одразу)</text>
