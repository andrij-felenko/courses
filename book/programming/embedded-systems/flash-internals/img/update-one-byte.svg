<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки коштує змінити ОДИН байт</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не можна просто перезаписати — доводиться переписати цілий сектор</text>
<circle cx="110.0" cy="114.0" r="17.0" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="110.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="150.0" y="92.0" width="600.0" height="46.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="172.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Прочитати весь сектор у RAM</text>
<text x="172.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">усі 4 КБ</text>
<line x1="110.0" y1="131.0" x2="110.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="180.0" r="17.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="110.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<rect x="150.0" y="158.0" width="600.0" height="46.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="172.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Змінити потрібний байт у RAM</text>
<text x="172.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1 байт</text>
<line x1="110.0" y1="197.0" x2="110.0" y2="224.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="246.0" r="17.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="110.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<rect x="150.0" y="224.0" width="600.0" height="46.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="172.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">СТЕРТИ сектор у Flash</text>
<text x="172.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">усе → 0xFF</text>
<line x1="110.0" y1="263.0" x2="110.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="312.0" r="17.0" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="110.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">4</text>
<rect x="150.0" y="290.0" width="600.0" height="46.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="172.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Записати сектор назад</text>
<text x="172.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">4 КБ із правкою</text>
<rect x="150.0" y="360.0" width="600.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="450.0" y="380.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Змінити 1 байт = переписати 4096. Ще й небезпечно: вимкнення між 3 і 4 = втрата сектора.</tspan></text>
</svg>