<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тридцять два роки від коду до його назви</text>
<line x1="258.0" y1="76.0" x2="258.0" y2="596.0" stroke="#cfd6dd" stroke-width="2.4"/>
<circle cx="258.0" cy="116.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1961</tspan></text>
<rect x="300.0" y="83.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Пітерсон і Браун друкують «Cyclic Codes for Error Detection».</tspan><tspan x="630.0" dy="18.9">Код задано многочленом — теорії більше нічого й не треба.</tspan></text>
<circle cx="258.0" cy="204.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1970-ті</tspan><tspan x="150.0" dy="20.8">— 80-ті</tspan></text>
<rect x="300.0" y="171.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Табличні реалізації розходяться вендорськими записками</tspan><tspan x="630.0" dy="18.9">й журналами; UART-и накидають відбитий порядок бітів.</tspan></text>
<circle cx="258.0" cy="292.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1988</tspan></text>
<rect x="300.0" y="259.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="287.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Сарвате друкує табличний метод у CACM: код став швидким,</tspan><tspan x="630.0" dy="18.9">але копіювали саме код, а не опис — описів не було.</tspan></text>
<circle cx="258.0" cy="380.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1993</tspan></text>
<rect x="300.0" y="347.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Росс Вільямс: модель Rocksoft — шість параметрів</tspan><tspan x="630.0" dy="18.9">плюс контрольне значення для рядка «123456789».</tspan></text>
<circle cx="258.0" cy="468.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="463.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">2002</tspan><tspan x="150.0" dy="20.8">і 2004</tspan></text>
<rect x="300.0" y="435.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="463.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Купман рахує відстань Геммінга поліномів для реальних</tspan><tspan x="630.0" dy="18.9">довжин кадру: стало відомо, ЯКИЙ поліном брати.</tspan></text>
<circle cx="258.0" cy="556.0" r="10.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/>
<text x="150.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">2011</tspan></text>
<rect x="300.0" y="523.0" width="660.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="551.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Ґреґ Кук відкриває каталог параметризованих CRC і RevEng:</tspan><tspan x="630.0" dy="18.9">додано residue й ступінь засвідченості кожного профілю.</tspan></text>
</svg>