<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять записів одного полінома</text>
<text x="510.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">x¹⁶ + x¹² + x⁵ + 1  —  один і той самий многочлен</text>
<line x1="90.0" y1="96.0" x2="930.0" y2="96.0" stroke="#cfd6dd" stroke-width="1.4"/>
<text x="210.0" y="140.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0x11021</text>
<text x="320.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">повний запис: усі 17 бітів, старша одиниця на місці</text>
<text x="210.0" y="186.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0x1021</text>
<text x="320.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">«нормальний»: старша одиниця неявна, її відкинули</text>
<text x="210.0" y="232.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0x8408</text>
<text x="320.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">відбиті молодші 16 бітів — для правозсувного коду</text>
<text x="210.0" y="278.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0x0811</text>
<text x="320.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">відбито всі 17 бітів, тоді відкинуто старший</text>
<text x="210.0" y="324.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0x8810</text>
<text x="320.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">відкинуто не старшу одиницю, а МОЛОДШУ (запис Купмана)</text>
<line x1="90.0" y1="350.0" x2="930.0" y2="350.0" stroke="#cfd6dd" stroke-width="1.4"/>
<text x="510.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Даташит подає одне з цих чисел — і майже ніколи не каже, яке саме.</text>
</svg>