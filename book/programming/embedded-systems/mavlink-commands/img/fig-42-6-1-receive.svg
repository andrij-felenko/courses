<text x="80.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">master.wait_heartbeat()              # 1) дочекатися апарата</text>
<text x="80.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">msg = master.recv_match('ATTITUDE')  # 2) узяти повідомлення</text>
