<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи дати МК дротову мережу</text>
<rect x="60.0" y="80.0" width="250.0" height="300.0" rx="12" fill="#e6f4f8" stroke="#2a93b5" stroke-width="2.0"/>
<rect x="74.0" y="92.0" width="222.0" height="44.0" rx="6" fill="#ffffff" stroke="#2a93b5" stroke-width="1.6"/><text x="185.0" y="117.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0e6b8a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Внутрішній MAC + зовнішній PHY</tspan></text>
<text x="78.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• MAC у самому МК</text>
<text x="78.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• PHY окремим чипом</text>
<text x="78.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• шина MII / RMII</text>
<text x="78.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• стек — lwIP у МК</text>
<text x="78.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 10/100, висока швидкість</text>
<text x="78.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• більше ніжок, складніше</text>
<rect x="350.0" y="80.0" width="250.0" height="300.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<rect x="364.0" y="92.0" width="222.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="475.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">SPI-Ethernet: W5500</tspan></text>
<text x="368.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• MAC + PHY + стек у чипі</text>
<text x="368.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• TCP/IP усередині (hardwired)</text>
<text x="368.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• до МК — лише по SPI</text>
<text x="368.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• lwIP НЕ потрібен</text>
<text x="368.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• кілька сокетів у залізі</text>
<text x="368.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• проста плата, мало ніжок</text>
<rect x="640.0" y="80.0" width="250.0" height="300.0" rx="12" fill="#fff1e6" stroke="#d2772a" stroke-width="2.0"/>
<rect x="654.0" y="92.0" width="222.0" height="44.0" rx="6" fill="#ffffff" stroke="#d2772a" stroke-width="1.6"/><text x="765.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9560f" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">SPI-Ethernet: ENC28J60</tspan></text>
<text x="658.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• лише MAC + PHY</text>
<text x="658.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• стека всередині немає</text>
<text x="658.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• до МК — по SPI</text>
<text x="658.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• стек — lwIP у МК</text>
<text x="658.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• лише 10 Мбіт/с</text>
<text x="658.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• найпростіше, найповільніше</text>
<text x="470.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">три двері до мережі: різний поділ праці між МК і чипом, але назовні — той самий Ethernet</text>
</svg>