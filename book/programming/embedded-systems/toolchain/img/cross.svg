<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крос-компіляція: будуємо на ПК — для чипа</text>
<rect x="40.0" y="70.0" width="300.0" height="180.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ПК-«завод»  (ядро x86)</text>
<rect x="80.0" y="120.0" width="220.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">тут ПРАЦЮЄ тулчейн</tspan></text>
<text x="190.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">багато пам'яті й обчислень —</text>
<text x="190.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">збере прошивку за секунди</text>
<text x="190.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">але сам код чипа тут НЕ біжить</text>
<rect x="430.0" y="70.0" width="250.0" height="180.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="555.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">МК  (Xtensa / RISC-V)</text>
<rect x="460.0" y="120.0" width="190.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">тут ВИКОНУЄТЬСЯ код</tspan></text>
<text x="555.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лічені кілобайти пам'яті —</text>
<text x="555.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сам зібрати себе не зміг би</text>
<text x="555.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">біжить готовим машинним кодом</text>
<line x1="342.0" y1="150.0" x2="428.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="385.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">.bin</text>
</svg>