<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід «димового тесту»: той самий фокус мандрує галузями</text>
<line x1="70.0" y1="150.0" x2="690.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
<line x1="688.0" y1="150.0" x2="698.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="82.4" cy="150.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="82.4" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">судна</text>
<text x="82.4" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">1836</text>
<text x="82.4" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="82.4" dy="0.0">дим у корпус —</tspan><tspan x="82.4" dy="13.8">де виходить, там щілина</tspan></text>
<circle cx="256.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="256.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">сантехніка</text>
<text x="256.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">1875</text>
<text x="256.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="256.0" dy="0.0">дим у труби —</tspan><tspan x="256.0" dy="13.8">пробоїни й витоки</tspan></text>
<circle cx="454.4" cy="150.0" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="454.4" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">електроніка</text>
<text x="454.4" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усталилось
у XX ст.</text>
<text x="454.4" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="454.4" dy="0.0">увімкнув плату —</tspan><tspan x="454.4" dy="13.8">пішов дим — вимкни</tspan></text>
<circle cx="628.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="628.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">тестування ПЗ</text>
<text x="628.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кінець XX ст.</text>
<text x="628.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="628.0" dy="0.0">швидка перевірка:</tspan><tspan x="628.0" dy="13.8">система взагалі жива?</tspan></text>
<circle cx="76.0" cy="314.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="90.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">задокументована дата (першоджерело)</text>
<circle cx="436.0" cy="314.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">запозичення — образ усталений, точна дата фольклорна</text>
</svg>