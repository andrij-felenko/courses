<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460"
     viewBox="0 0 940 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="460" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Одна прошивка — безліч апаратів: усе вирішують параметри</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">той самий образ Copter стає квадро, гекса чи трикоптер — лише параметром</text>
<rect x="320" y="84" width="300" height="66" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="470" y="110" font-size="15" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ArduCopter</text>
<text x="470" y="132" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">один двійковий образ (той самий код)</text>
<line x1="470" y1="150" x2="142" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="50" y="258" width="184" height="86" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="142" y="284" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Квадро</text>
<text x="142" y="304" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">×4 мотори</text>
<rect x="62" y="316" width="160" height="22" rx="5" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="142" y="331" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FRAME_CLASS=1</text>
<line x1="470" y1="150" x2="367" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="275" y="258" width="184" height="86" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="367" y="284" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Гекса</text>
<text x="367" y="304" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">×6 моторів</text>
<rect x="287" y="316" width="160" height="22" rx="5" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="367" y="331" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FRAME_CLASS=2</text>
<line x1="470" y1="150" x2="592" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="500" y="258" width="184" height="86" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="592" y="284" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Окто</text>
<text x="592" y="304" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">×8 моторів</text>
<rect x="512" y="316" width="160" height="22" rx="5" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="592" y="331" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FRAME_CLASS=3</text>
<line x1="470" y1="150" x2="817" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="725" y="258" width="184" height="86" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="817" y="284" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Трикоптер</text>
<text x="817" y="304" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">×3 + кермо-серво</text>
<rect x="737" y="316" width="160" height="22" rx="5" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="817" y="331" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FRAME_CLASS=7</text>
<text x="470.0" y="396" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Інший ТИП апарата — літак чи ровер — то вже інший образ (ArduPlane/Rover), але та сама архітектура й ті самі бібліотеки.</text>
<text x="470.0" y="446" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Параметри — це «особистість» апарата поверх однакового коду.</text>
</svg>
