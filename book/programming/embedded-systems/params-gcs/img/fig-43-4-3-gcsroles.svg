<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430"
     viewBox="0 0 960 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Наземна станція: кокпіт оператора на землі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">конфігурує, планує, стежить, аналізує й командує — по MAVLink, але НЕ в контурі керування</text>
<rect x="250" y="78" width="240" height="70" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="370" y="104" font-size="13.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">НАЗЕМНА СТАНЦІЯ</text>
<text x="370" y="126" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Mission Planner · QGroundControl</text>
<rect x="600" y="78" width="240" height="70" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="720" y="104" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ КОНТРОЛЕР</text>
<text x="720" y="126" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">на апараті</text>
<line x1="490" y1="105" x2="598" y2="105" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="598" y1="122" x2="490" y2="122" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="544" y="96" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">MAVLink</text>
<text x="544" y="142" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">радіо/USB (Розд. 42)</text>
<text x="110" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Що робить наземна станція:</text>
<rect x="60" y="210" width="240" height="58" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="180" y="234" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Налаштувати</text>
<text x="180" y="254" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">параметри + калібрування</text>
<rect x="360" y="210" width="240" height="58" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="480" y="234" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Спланувати</text>
<text x="480" y="254" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">місія, точки маршруту</text>
<rect x="660" y="210" width="240" height="58" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="780" y="234" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Стежити</text>
<text x="780" y="254" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">HUD: крен, висота, заряд</text>
<rect x="210" y="288" width="240" height="58" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="330" y="312" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Аналізувати</text>
<text x="330" y="332" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">журнали польоту</text>
<rect x="510" y="288" width="240" height="58" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="630" y="312" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Командувати</text>
<text x="630" y="332" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">arm · режим · RTL</text>
<text x="480.0" y="418" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Станція ДИВИТЬСЯ й ВЕЛИТЬ, але летить апарат сам: обірветься зв'язок — керування й failsafe лишаються на борту (43.2).</text>
</svg>
