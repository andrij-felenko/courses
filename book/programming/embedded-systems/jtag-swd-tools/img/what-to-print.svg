<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три види крихт — спершу гіпотеза, тоді крихта</text>
<rect x="34.0" y="70.0" width="196.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="132.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">значення</text>
<rect x="50.0" y="116.0" width="164.0" height="36.0" rx="6" fill="#1f1f1f" stroke="#27ae60" stroke-width="1.0"/>
<text x="132.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a8e6c0" text-anchor="middle">&quot;x =&quot;, x</text>
<text x="132.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="132.0" dy="0.0">перевірити</tspan><tspan x="132.0" dy="14.4">припущення про дані</tspan></text>
<rect x="252.0" y="70.0" width="196.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="350.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">маркери</text>
<rect x="268.0" y="116.0" width="164.0" height="36.0" rx="6" fill="#1f1f1f" stroke="#2457d6" stroke-width="1.0"/>
<text x="350.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a8e6c0" text-anchor="middle">&quot;дійшов сюди&quot;</text>
<text x="350.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="350.0" dy="0.0">куди тече потік</tspan><tspan x="350.0" dy="14.4">і де спинився</tspan></text>
<rect x="470.0" y="70.0" width="196.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="568.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">помилки</text>
<rect x="486.0" y="116.0" width="164.0" height="36.0" rx="6" fill="#1f1f1f" stroke="#c0392b" stroke-width="1.0"/>
<text x="568.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a8e6c0" text-anchor="middle">&quot;не мало статись&quot;</text>
<text x="568.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="568.0" dy="0.0">гілки, що не</tspan><tspan x="568.0" dy="14.4">мали б трапитись</tspan></text>
<text x="350.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">поділ навпіл: один маркер посередині → баг далі чи раніше → ділимо ще</text>
<text x="350.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожна крихта вдвічі звужує область — двійковий пошук причини</text>
</svg>