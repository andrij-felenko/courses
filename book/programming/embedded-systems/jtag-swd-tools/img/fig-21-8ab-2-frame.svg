<rect x="41.0" y="66.0" width="738.0" height="176.0" rx="10" fill="none" stroke="#aaaaaa" stroke-width="1.2"/>
<text x="410.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Разом: 6 байтів замість ~25 байтів тексту. Загубив байт → XOR не зійдеться → декодер ресинхронізується на наступному 0x7E</text>
<rect x="151.3" y="319.0" width="517.3" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="338.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">0x2E 0x09 — це СИРІ байти числа 2350, НЕ символи ASCII '2', '3', '5', '0'</tspan></text>
