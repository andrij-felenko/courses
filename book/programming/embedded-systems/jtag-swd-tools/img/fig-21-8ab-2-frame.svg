<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">приклад: BLOG(LOG_TEMP, (int16_t)2350)  →  2350 = 0x092E  (little-endian)</text>
