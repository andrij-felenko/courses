<text x="860.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">2 перетин(и) — парно → ЗЗОВНІ</text>
