<text x="860.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">1 перетин(и) — непарно → ВСЕРЕДИНІ</text>
