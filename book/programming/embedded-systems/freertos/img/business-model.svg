<text x="160.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">FreeRTOS</text>
<text x="160.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">$0</tspan><tspan x="160.0" dy="13.0">GPL-виняток</tspan><tspan x="160.0" dy="13.0">(потім MIT)</tspan></text>
<rect x="270.0" y="70.0" width="200.0" height="96.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="370.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">OpenRTOS</text>
<text x="370.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">комерційна</tspan><tspan x="370.0" dy="13.0">ліцензія + підтримка</tspan><tspan x="370.0" dy="13.0">(WITTENSTEIN)</tspan></text>
<rect x="480.0" y="70.0" width="200.0" height="96.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="580.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SafeRTOS</text>
