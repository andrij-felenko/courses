<text x="480.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два ядра ESP32 дають і справжню паралельність: радіо на одному, ваша робота — на іншому,</text>
