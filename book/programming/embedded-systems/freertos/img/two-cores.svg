<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32 має два процесорні ядра: PRO_CPU і APP_CPU</text>
<rect x="70.0" y="80.0" width="280.0" height="150.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро 0 — PRO_CPU</text>
<text x="210.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">«протокольне»</tspan><tspan x="210.0" dy="14.3">за умовчанням: Wi-Fi і Bluetooth</tspan><tspan x="210.0" dy="14.3">(усе радіо)</tspan></text>
<rect x="370.0" y="80.0" width="280.0" height="150.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="510.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро 1 — APP_CPU</text>
<text x="510.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">«застосункове»</tspan><tspan x="510.0" dy="14.3">за умовчанням: ваші setup() і loop()</tspan><tspan x="510.0" dy="14.3">(код скетчу)</tspan></text>
<rect x="70.0" y="252.0" width="580.0" height="44.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="360.0" y="278.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">обидва працюють під одним ядром FreeRTOS</tspan></text>
<text x="360.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не всі ESP32 такі: S2 і C3 — одноядерні</text>
