<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таймер: одна лічба тактів — три способи зачепити її за світ</text>
<rect x="58.1" y="93.9" width="123.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Джерело такту</tspan><tspan x="120.0" dy="18.2">80 МГц</tspan></text>
<rect x="276.1" y="93.9" width="107.8" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Передільник</tspan><tspan x="330.0" dy="18.2">÷ 80</tspan></text>
<rect x="514.1" y="93.9" width="91.8" height="52.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Лічильник</tspan><tspan x="560.0" dy="18.2">0 → 999</tspan></text>
<line x1="189.9" y1="120.0" x2="268.1" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="391.9" y1="120.0" x2="506.1" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="445.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тік = 1 мкс</text>
<rect x="700.0" y="95.0" width="320.0" height="92.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.5"/>
<text x="860.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПЕРЕПОВНЕННЯ</text>
<text x="860.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">дорахував до межі →</tspan><tspan x="860.0" dy="16.2">перериванням б'є період</tspan></text>
<line x1="613.9" y1="120.0" x2="690.0" y2="141.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="235.0" width="320.0" height="92.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.5"/>
<text x="860.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПОРІВНЯННЯ</text>
<text x="860.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">лічильник дійшов до C →</tspan><tspan x="860.0" dy="16.2">залізо саме діє на ніжці</tspan></text>
<line x1="613.9" y1="128.0" x2="690.0" y2="281.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="375.0" width="320.0" height="92.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.5"/>
<text x="860.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАХОПЛЕННЯ</text>
<text x="860.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">подія на ніжці →</tspan><tspan x="860.0" dy="16.2">миттєвий знімок лічби</tspan></text>
<line x1="613.9" y1="136.0" x2="690.0" y2="421.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="486.2" y="403.9" width="147.7" height="52.2" rx="6" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Процесор</tspan><tspan x="560.0" dy="18.2">виконує свій код</tspan></text>
<line x1="560.0" y1="397.9" x2="560.0" y2="152.1" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 6"/>
<text x="585.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="585.0" dy="0.0">лічба йде</tspan><tspan x="585.0" dy="16.2">сама, без</tspan><tspan x="585.0" dy="16.2">участі коду</tspan></text>
</svg>