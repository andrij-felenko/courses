<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32: три сторожі за доменами живлення й такту</text>
<rect x="40.0" y="70.0" width="720.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Task WDT (TWDT)</text>
<text x="60.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">стежить, чи всі задачі (і loop) дістають час на ядрі;</text>
<text x="60.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">задача-ненажера захопила CPU → тривога</text>
<rect x="40.0" y="162.0" width="720.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="60.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Interrupt WDT (IWDT)</text>
<text x="60.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ловить «німі» зависання: переривання вимкнені</text>
<text x="60.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">задовго (довга критична секція, завислий ISR)</text>
<rect x="40.0" y="254.0" width="720.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.8"/>
<text x="60.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">RTC WDT (RWDT)</text>
<text x="60.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">найживучіший, від RTC-домену; стереже навіть</text>
<text x="60.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">завантаження — застрягання ще до старту коду</text>
</svg>