<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Часто watchdog спершу попереджає, а вже потім скидає</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коротке переривання дає шанс зберегти стан чи записати причину — і лише тоді reset</text>
<line x1="90.0" y1="170.0" x2="880.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="90.0,100.0 350.0,170.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">лічильник вниз (не годують)</text>
<circle cx="350.0" cy="170.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<line x1="350.0" y1="170.0" x2="350.0" y2="130.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="270.0" y="90.0" width="160.0" height="36.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="350.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">1) переривання-</text>
<text x="350.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="normal" font-style="normal">попередження</text>
<text x="350.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(зберегти стан, лог)</text>
<line x1="350.0" y1="170.0" x2="600.0" y2="170.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<circle cx="600.0" cy="170.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="600.0" y1="170.0" x2="600.0" y2="130.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="530.0" y="92.0" width="140.0" height="34.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="600.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2) СКИД чипа</text>
<line x1="600.0" y1="170.0" x2="850.0" y2="170.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<text x="740.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ чистий старт</text>
<text x="470.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так пристрій не лише оживає, а й може лишити «передсмертну записку» — чому завис.</text>
</svg>
