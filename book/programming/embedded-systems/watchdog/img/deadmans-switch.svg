<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобіжник пильності: натискаєш — їдеш, відпустив — стає</text>
<rect x="70.0" y="83.5" width="260.0" height="33.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.8"/><text x="200.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">натискає педаль</tspan></text>
<circle cx="200.0" cy="175.0" r="34.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.4"/>
<text x="200.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">педаль</text>
<text x="200.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">↓</text>
<line x1="150.0" y1="250.0" x2="250.0" y2="250.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="200.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">поїзд їде</text>
<rect x="410.0" y="83.5" width="300.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="560.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">знепритомнів, педаль відпущено</tspan></text>
<circle cx="560.0" cy="175.0" r="34.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="560.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<line x1="534.0" y1="282.0" x2="586.0" y2="282.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="560.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">поїзд сам зупиняється</text>
<rect x="110.0" y="322.0" width="540.0" height="28.0" rx="6" fill="#fff8ec" stroke="#b9770e" stroke-width="1.4"/><text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Watchdog — це той самий «запобіжник пильності» для прошивки.</tspan></text>
</svg>