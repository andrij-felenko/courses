<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завислий пристрій мертвий, а дотягнутися нікому</text>
<rect x="100.0" y="122.8" width="180.0" height="54.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">процесор</tspan><tspan x="190.0" dy="19.5">завис</tspan></text>
<text x="190.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вічний цикл або очікування</text>
<text x="190.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не реагує ні на що</text>
<circle cx="190.0" cy="300.0" r="30.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="190.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">RESET</text>
<line x1="166.0" y1="324.0" x2="214.0" y2="276.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="190.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">натиснути нікому</text>
<line x1="300.0" y1="150.0" x2="400.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лікує лише</text>
<text x="350.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">скид живлення</text>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">а пристрій — недосяжний</text>
<rect x="430.0" y="130.0" width="260.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">давач на горі</tspan></text>
<rect x="430.0" y="186.0" width="260.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">контролер у стіні</tspan></text>
<rect x="430.0" y="242.0" width="260.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">апарат у космосі</tspan></text>
</svg>