<rect x="269.0" y="52.2" width="161.9" height="55.6" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">мить скидання:</tspan><tspan x="350.0" dy="15.6">читаємо рівень IO0</tspan></text>
