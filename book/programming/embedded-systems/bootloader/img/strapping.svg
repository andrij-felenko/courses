<line x1="380.0" y1="107.8" x2="520.0" y2="177.3" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="118.8" y="177.3" width="122.3" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="180.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">висока (1)</tspan><tspan x="180.0" dy="14.3">→ ваша програма</tspan></text>
<rect x="441.8" y="177.3" width="156.4" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="520.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">низька (0)</tspan><tspan x="520.0" dy="14.3">→ режим завантаження</tspan></text>
<text x="350.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">рівень ніжки на старті — це команда чипу про режим</text>
