<text x="590.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">старе</text>
<line x1="440.0" y1="70.0" x2="440.0" y2="136.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="440.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">курсор DMA</text>
<text x="390.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">ядро читає тут і тепер → дістає половину нового, половину старого = розрив (tearing)</text>
<text x="40.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Два буфери: розведені у просторі — конфлікту немає</text>
<rect x="40.0" y="212.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="205.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">A — DMA пише (зайнятий)</text>
<rect x="410.0" y="212.0" width="330.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="575.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">B — ядро читає (стабільний)</text>
<text x="390.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">кожен працює зі своєю пам'яттю → ні розриву, ні втрати; на завершенні ролі міняються</text>
