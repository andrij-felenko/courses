<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як перші автопілоти «бачили» горизонт без IMU: інфрачервоні термопари</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">земля тепла (ІЧ-яскрава), небо холодне (ІЧ-темне) — різниця дає крен і тангаж</text>
<rect x="40.0" y="70.0" width="540.0" height="200.0" rx="0" fill="#dbeafe" stroke="none" stroke-width="0.0"/>
<rect x="40.0" y="270.0" width="540.0" height="160.0" rx="0" fill="#dcfce7" stroke="none" stroke-width="0.0"/>
<line x1="40.0" y1="270.0" x2="580.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="40.0" y="70.0" width="540.0" height="360.0" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="54.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">холодне небо  ≈ −40 °C</text>
<text x="54.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">тепла земля  ≈ +15 °C</text>
<g transform="rotate(22 310.0 242)"><polygon points="224.0,242 396.0,242 388.0,251 232.0,251" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/><circle cx="310.0" cy="240.0" r="13.0" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="224.0" cy="246.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="396.0" cy="246.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/></g>
<line x1="230.0" y1="214.0" x2="202.0" y2="284.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<line x1="390.0" y1="278.0" x2="418.0" y2="208.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="160.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">ІЧ-давач L</text>
<text x="152.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">→ тепла земля</text>
<text x="386.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">ІЧ-давач R</text>
<text x="378.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">→ холодне небо</text>
<text x="312.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">крен</text>
<text x="610.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Що «чує» автопілот</text>
<rect x="610.0" y="92.0" width="290.0" height="86.0" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="624.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівний політ</text>
<circle cx="650.0" cy="144.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="860.0" cy="144.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="650.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">T_L</text>
<text x="860.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">T_R</text>
<text x="755.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">T_L ≈ T_R</text>
<text x="755.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">→ крен 0</text>
<rect x="610.0" y="192.0" width="290.0" height="86.0" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="624.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Крен праворуч</text>
<circle cx="650.0" cy="244.0" r="9.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="860.0" cy="246.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="755.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="700">T_L &gt; T_R</text>
<text x="755.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="middle">→ виправити кермом</text>
<rect x="610.0" y="292.0" width="290.0" height="56.0" rx="9" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="755.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">крен ∝ T_L − T_R</text>
<text x="755.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тангаж ∝ T_перед − T_зад</text>
<text x="610.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d98a00" text-anchor="start" font-weight="700">Чому відмовилися:</text>
<text x="610.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">хмари, захід сонця, гарячий дах і ліс</text>
<text x="610.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">плутають «горизонт»; MEMS-IMU витіснили термопари.</text>
</svg>