<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500"
     viewBox="0 0 940 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як перші автопілоти «бачили» горизонт без IMU: інфрачервоні термопари</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">земля тепла (ІЧ-яскрава), небо холодне (ІЧ-темне) — різниця дає крен і тангаж</text>
<rect x="40" y="70" width="540" height="200" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="40" y="270" width="540" height="160" rx="0" fill="#dcfce7" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<line x1="40" y1="270" x2="580" y2="270" stroke="#0a8f3c" stroke-width="2.0" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="40" y="70" width="540" height="360" rx="10" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="54" y="96" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">холодне небо  ≈ −40 °C</text>
<text x="54" y="416" font-size="12.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">тепла земля  ≈ +15 °C</text>
<g transform="rotate(22 310.0 242)">
<polygon points="224.0,242 396.0,242 388.0,251 232.0,251" fill="#ffffff" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="310.0" cy="240" r="13" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="224.0" cy="246" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="396.0" cy="246" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
</g>
<line x1="230.26218850725627" y1="213.78383296623156" x2="202.26218850725627" y2="283.78383296623156" stroke="#cc0000" stroke-width="2.0" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="389.73781149274373" y1="278.21616703376844" x2="417.73781149274373" y2="208.21616703376844" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="160.26218850725627" y="305.78383296623156" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">ІЧ-давач L</text>
<text x="152.26218850725627" y="319.78383296623156" font-size="11" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">→ тепла земля</text>
<text x="385.73781149274373" y="202.21616703376844" font-size="11.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ІЧ-давач R</text>
<text x="377.73781149274373" y="216.21616703376844" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">→ холодне небо</text>
<text x="312.0" y="198" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">крен</text>
<text x="610" y="78" font-size="13.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Що «чує» автопілот</text>
<rect x="610" y="92" width="290" height="86" rx="9" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="624" y="114" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Рівний політ</text>
<circle cx="650" cy="144" r="7" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="860" cy="144" r="7" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="650" y="166" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">T_L</text>
<text x="860" y="166" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">T_R</text>
<text x="755" y="140" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">T_L ≈ T_R</text>
<text x="755" y="158" font-size="11.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">→ крен 0</text>
<rect x="610" y="192" width="290" height="86" rx="9" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="624" y="214" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Крен праворуч</text>
<circle cx="650" cy="244" r="9" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="860" cy="246" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="755" y="240" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">T_L &gt; T_R</text>
<text x="755" y="258" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">→ виправити кермом</text>
<rect x="610" y="292" width="290" height="56" rx="9" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="755" y="316" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">крен ∝ T_L − T_R</text>
<text x="755" y="336" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="Consolas, monospace">тангаж ∝ T_перед − T_зад</text>
<text x="610" y="366" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">⚠ чому відмовилися:</text>
<text x="610" y="384" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">хмари, захід сонця, гарячий дах і</text>
<text x="610" y="399" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">ліс плутають «горизонт». MEMS-IMU</text>
<text x="610" y="414" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(Розділ 33) витіснили термопари.</text>
</svg>
