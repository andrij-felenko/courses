<text x="240.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ArduPilot виходить із Dronecode → незалежний (GPLv3);</text>
