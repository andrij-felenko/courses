<text x="450.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Хобі-лінія (Arduino) і академічна лінія (ETH) зійшлися на залізі Pixhawk, а потім розійшлися через ліцензії — звідси два великі відкриті автопілоти.</text>
