<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур у контурі: різні задачі — різні темпи</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">зовнішній контур веде апарат туди, куди треба; внутрішній не дає впасти</text>
<rect x="70.0" y="96.0" width="720.0" height="356.0" rx="12" fill="#f6f7fb" stroke="#6b7280" stroke-width="1.8"/>
<text x="86.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">НАВІГАЦІЯ / МІСІЯ — куди летіти</text>
<rect x="690.0" y="100.0" width="84.0" height="22.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="732.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">~1–10 Гц</text>
<rect x="140.0" y="172.0" width="580.0" height="212.0" rx="12" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="156.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">КОНТУР ПОЛОЖЕННЯ / ШВИДКОСТІ — тримати траєкторію</text>
<rect x="612.0" y="176.0" width="84.0" height="22.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="654.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">~20–50 Гц</text>
<rect x="220.0" y="248.0" width="420.0" height="104.0" rx="12" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="236.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">КОНТУР ОРІЄНТАЦІЇ (attitude) — не впасти</text>
<rect x="470.0" y="258.0" width="96.0" height="22.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="518.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">~250–1000 Гц</text>
<text x="228.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">вихід → команди на мотори та серво</text>
<text x="96.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">↓ задає уставку</text>
<text x="166.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">↓ задає уставку</text>
<text x="430.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Внутрішній контур — найшвидший і найкритичніший: не встигне — апарат перекинеться раніше, ніж зреагує навігація.</text>
</svg>