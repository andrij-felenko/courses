<line x1="220.0" y1="216.0" x2="220.0" y2="254.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.4" y="254.0" width="109.3" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">вимкни мотор</tspan></text>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">читається згори вниз</text>
