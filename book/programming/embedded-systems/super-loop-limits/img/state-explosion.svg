<text x="730.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">прапорці, таймери, переходи — і це лише ОДНА справа</text>
<rect x="140.1" y="382.0" width="659.8" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Кожна нова справа не додає коду, а множить заплутаність — це межа не машини, а людини.</tspan></text>
