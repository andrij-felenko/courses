<text x="822.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">чекає, доки відпрацює вся рутина перед ним</text>
<line x1="822.0" y1="168.0" x2="822.0" y2="188.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="210.8" y="276.2" width="518.5" height="47.6" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Сказати «це важливіше, виконай негайно» super-loop не вміє.</tspan><tspan x="470.0" dy="15.6">Саме це дає операційна система — пріоритет однієї роботи над іншою.</tspan></text>
