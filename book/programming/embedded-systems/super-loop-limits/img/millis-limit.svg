<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">крихітні шматочки по одному щооберту</text>
<text x="250.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">між ними цикл займається іншими</text>
<rect x="520.0" y="75.0" width="360.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="95.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">НЕ ПОРІЗАТИ — мережа, SD, давач</tspan></text>
<rect x="540.0" y="140.0" width="320.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="700.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">блокує зсередини — суцільний блок</text>
<text x="700.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ділити нíчого — хіба переписати з нуля</text>
<text x="700.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">до того ж потік один: довгий шматок тримає решту</text>
<line x1="470.0" y1="65.0" x2="470.0" y2="250.0" stroke="#d0d5dd" stroke-width="1.2" stroke-dasharray="5 4"/>
