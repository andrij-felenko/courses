<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чотири питання, щоб підмкнути будь-який модуль</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відповіси на них — і з'єднання працюватиме; пропустиш — ловитимеш «загадки»</text>
<rect x="40.0" y="90.0" width="210.0" height="250.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="145.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 · Живлення</text>
<line x1="56.0" y1="134.0" x2="234.0" y2="134.0" stroke="#c0271e" stroke-width="1.2" stroke-linecap="round"/>
<text x="145.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Яка напруга — 3.3 чи 5 В?</text>
<text x="145.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сумісність рівнів (§22.3);</text>
<text x="145.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ESP32 не 5-В-терпимий</text>
<rect x="270.0" y="90.0" width="210.0" height="250.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="375.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2 · Напрям</text>
<line x1="286.0" y1="134.0" x2="464.0" y2="134.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="375.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жене сам чи «відпускає»?</text>
<text x="375.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">push-pull → прямо;</text>
<text x="375.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">перемикач → підтяжка (§22.4)</text>
<rect x="500.0" y="90.0" width="210.0" height="250.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="605.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3 · Логіка</text>
<line x1="516.0" y1="134.0" x2="694.0" y2="134.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="605.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Активний рівень — 1 чи 0?</text>
<text x="605.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">active-high / active-low;</text>
<text x="605.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">як читати в коді (§22.4)</text>
<rect x="730.0" y="90.0" width="210.0" height="250.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="835.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">4 · Захист</text>
<line x1="746.0" y1="134.0" x2="924.0" y2="134.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="835.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Струми й пороги в нормі?</text>
<text x="835.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">послідовний R, межі струму,</text>
<text x="835.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">діоди (§22.3, §22.6)</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільна земля (GND) — завжди обов'язкова (§22.6). Без неї модуль і МК не «бачать» одне одного.</text>
</svg>
