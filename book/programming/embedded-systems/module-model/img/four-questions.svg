<line x1="400.0" y1="116.0" x2="533.0" y2="116.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="466.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Активний рівень —</text>
<text x="466.5" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 чи 0?</text>
<text x="466.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">active-high / -low;</text>
