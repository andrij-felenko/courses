<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модуль — «чорна скринька»: важать піни, не нутрощі</text>
<rect x="90.0" y="96.0" width="230.0" height="188.0" rx="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="205.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">МОДУЛЬ</text>
<text x="205.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(давач / периферія)</text>
<text x="205.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">усередині:</text>
<text x="205.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">транзистори? чіп?</text>
<text x="205.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">— нам байдуже</text>
<line x1="90.0" y1="140.0" x2="44.0" y2="140.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="40.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">VCC</text>
<line x1="90.0" y1="252.0" x2="44.0" y2="252.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="40.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">GND</text>
<circle cx="320.0" cy="190.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="326.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">OUT (сигнал)</text>
<line x1="324.0" y1="190.0" x2="470.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="470.0" y="132.0" width="200.0" height="116.0" rx="12" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<text x="570.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">мікроконтролер</text>
<text x="570.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">читає один біт:</text>
<text x="570.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">є сигнал / нема</text>
<rect x="110.0" y="300.0" width="500.0" height="28.0" rx="6" fill="#fdf6e3" stroke="#b9770e" stroke-width="1.3"/><text x="360.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Те саме приховування, що з функцією в коді чи регістром: нутрощі — за інтерфейсом.</tspan></text>
</svg>