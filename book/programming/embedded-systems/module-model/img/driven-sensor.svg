<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Давач сам жене вихід: 3.3 В — прямо, 5 В — лише через зсув</text>
<rect x="30.0" y="60.0" width="340.0" height="270.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="200.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Однакова напруга (3.3 В) → прямо</text>
<rect x="56.0" y="150.0" width="120.0" height="64.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="116.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">давач 3.3 В</text>
<text x="116.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">push-pull OUT</text>
<line x1="176.0" y1="182.0" x2="250.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="213.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">прямо</text>
<rect x="250.0" y="150.0" width="96.0" height="64.0" rx="8" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<text x="298.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">вхід МК</text>
<text x="200.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">однакові рівні — просто з'єднати</text>
<text x="200.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(і спільна земля)</text>
<rect x="390.0" y="60.0" width="340.0" height="270.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="560.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Давач 5 В → обов'язково зсув</text>
<rect x="408.0" y="150.0" width="96.0" height="64.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="456.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">давач 5 В</text>
<text x="456.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle">OUT = 5 В</text>
<line x1="504.0" y1="182.0" x2="528.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="528.0" y="158.0" width="70.0" height="48.0" rx="6" fill="#fdf6e3" stroke="#b9770e" stroke-width="1.6"/>
<text x="563.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">зсув</text>
<text x="563.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle">рівнів</text>
<line x1="598.0" y1="182.0" x2="622.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="622.0" y="150.0" width="86.0" height="64.0" rx="8" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<text x="665.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">вхід МК</text>
<text x="560.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">5 В прямо = спалена ніжка!</text>
<text x="560.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лише дільник чи перетворювач рівнів</text>
</svg>