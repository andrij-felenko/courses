<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Друк і відлагоджувач не змагаються — це різні сили</text>
<rect x="30.0" y="48.0" width="200.0" height="46.0" rx="6" fill="#2d3e50" stroke="#333333" stroke-width="1.2"/>
<text x="130.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Критерій</text>
<rect x="240.0" y="48.0" width="270.0" height="46.0" rx="6" fill="#2d3e50" stroke="#333333" stroke-width="1.2"/>
<text x="375.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Serial.print</text>
<rect x="520.0" y="48.0" width="270.0" height="46.0" rx="6" fill="#2d3e50" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Відлагоджувач</text>
<rect x="30.0" y="94.0" width="200.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Що бачить?</tspan></text>
<rect x="240.0" y="94.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="115.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">лише надруковане</tspan><tspan x="375.0" dy="15.6">наперед</tspan></text>
<rect x="520.0" y="94.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="115.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">всю пам'ять,</tspan><tspan x="655.0" dy="15.6">регістри, стек</tspan></text>
<rect x="30.0" y="144.0" width="200.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вплив на час</tspan></text>
<rect x="240.0" y="144.0" width="270.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">малий</tspan><tspan x="375.0" dy="15.6">(якщо рядок короткий)</tspan></text>
<rect x="520.0" y="144.0" width="270.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">зупиняє ядро —</tspan><tspan x="655.0" dy="15.6">рве реальний час</tspan></text>
<rect x="30.0" y="194.0" width="200.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Потрібен зонд?</tspan></text>
<rect x="240.0" y="194.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">ні — лише UART</tspan></text>
<rect x="520.0" y="194.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="215.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">так — зонд</tspan><tspan x="655.0" dy="15.6">або USB-JTAG</tspan></text>
<rect x="30.0" y="244.0" width="200.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Сильний у</tspan></text>
<rect x="240.0" y="244.0" width="270.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="265.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">потоковому</tspan><tspan x="375.0" dy="15.6">спостереженні</tspan></text>
<rect x="520.0" y="244.0" width="270.0" height="50.0" rx="4" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="265.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">локалізації збою</tspan><tspan x="655.0" dy="15.6">й аналізі стану</tspan></text>
<rect x="30.0" y="294.0" width="200.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Heisenbug</tspan></text>
<rect x="240.0" y="294.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">може приховати</tspan><tspan x="375.0" dy="15.6">(змінює час)</tspan></text>
<rect x="520.0" y="294.0" width="270.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">не ховає —</tspan><tspan x="655.0" dy="15.6">ядро завмерло</tspan></text>
</svg>