<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Друк опитує на ходу; відлагоджувач зупиняє час і оглядає нерухоме</text>
<rect x="20.0" y="50.0" width="330.0" height="280.0" rx="10" fill="#fff8f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="185.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">ДРУК (Serial.print)</text>
<circle cx="120.0" cy="175.0" r="26.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="120.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CPU</text>
<line x1="150.0" y1="175.0" x2="215.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">біжить →</text>
<line x1="185.0" y1="205.0" x2="185.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="140.0" y="240.0" width="90.0" height="30.0" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">? де ти ?</tspan></text>
<text x="185.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">видно лише те,</text>
<text x="185.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">що сам заклав у друк</text>
<rect x="410.0" y="50.0" width="330.0" height="280.0" rx="10" fill="#f0f8ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="575.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ВІДЛАГОДЖУВАЧ (halt)</text>
<circle cx="490.0" cy="175.0" r="26.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="490.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">CPU</text>
<rect x="450.0" y="213.0" width="80.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">завмер</tspan></text>
<text x="615.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">читаємо:</text>
<text x="615.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• будь-який регістр</text>
<text x="615.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• будь-яку пам'ять</text>
<text x="615.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• весь стек викликів</text>
<rect x="440.0" y="285.0" width="270.0" height="30.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/><text x="575.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">час зупинено — читаємо все</tspan></text>
<line x1="380.0" y1="60.0" x2="380.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 4"/>
</svg>