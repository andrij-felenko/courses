<text x="380.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Хто де лежить, каже маленька ТАБЛИЦЯ РОЗДІЛІВ на початку Flash:</tspan><tspan x="380.0" dy="15.4">«ось тут завантажувач, тут додаток, тут NVS, тут файли».</tspan><tspan x="380.0" dy="15.4">Без неї чіп не знав би навіть, звідки запускати програму.</tspan></text>
