<text x="132.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ota_0 (app)</text>
<text x="408.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">розмір 0x100000</text>
