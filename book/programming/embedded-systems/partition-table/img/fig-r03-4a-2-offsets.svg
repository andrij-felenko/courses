<text x="408.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">розмір 0x100000</text>
<text x="108.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">0x210000</text>
<text x="108.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">зсув</text>
<text x="480.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Зсув кожної = зсув + розмір попередньої:</text>
<text x="480.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0x9000 + 0x4000 = 0xd000   → otadata</text>
<text x="480.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0xd000 + 0x2000 = 0xf000   → phy</text>
<text x="480.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0xf000 + 0x1000 = 0x10000  → factory</text>
<text x="480.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0x10000 + 0x100000 = 0x110000 → ota_0</text>
<text x="480.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0x110000 + 0x100000 = 0x210000 → ota_1</text>
<rect x="480.0" y="262.0" width="360.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="660.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Порожній offset збірка заповнює сама —</text>
<text x="660.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кладе розділ одразу за попереднім.</text>
<text x="660.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Сума всіх розділів ≤ обсяг Flash.</text>
