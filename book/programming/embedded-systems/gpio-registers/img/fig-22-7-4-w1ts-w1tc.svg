<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Атомарні W1TS / W1TC: без «прочитав-змінив-записав»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">запис маски прямо встановлює або скидає лише потрібні біти — одним рухом</text>
<rect x="50.0" y="80.0" width="840.0" height="150.0" rx="12" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="70.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Небезпека: REG |= mask — це три дії (read-modify-write)</text>
<rect x="100.0" y="120.0" width="180.0" height="46.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="190.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1) прочитати REG</text>
<line x1="280.0" y1="143.0" x2="350.0" y2="143.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="350.0" y="120.0" width="180.0" height="46.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2) АБО з маскою</text>
<line x1="530.0" y1="143.0" x2="600.0" y2="143.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="600.0" y="120.0" width="180.0" height="46.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="690.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3) записати назад</text>
<text x="470.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Якщо між кроками 1 і 3 переривання змінить REG — твій запис ЗАТРЕ ту зміну (гонка).</text>
<rect x="50.0" y="250.0" width="840.0" height="150.0" rx="12" fill="none" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="70.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Безпечно: GPIO.out_w1ts = mask — одна атомарна дія</text>
<text x="90.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">W1TS (write-1-to-set):</text>
<text x="110.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">де в масці 1 — той біт стає 1; де 0 — біт без змін.</text>
<text x="90.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">W1TC (write-1-to-clear):</text>
<text x="110.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">де в масці 1 — той біт стає 0; де 0 — біт без змін.</text>
<text x="710.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо саме чіпає лише</text>
<text x="710.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">потрібні біти — читати</text>
<text x="710.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">нічого не треба.</text>
</svg>
