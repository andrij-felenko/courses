<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарні W1TS / W1TC: без «прочитав-змінив-записав»</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">запис маски прямо ставить або скидає лише потрібні біти — одним рухом</text>
<rect x="40.0" y="76.0" width="780.0" height="138.0" rx="12" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Небезпека: REG |= mask — це три дії (read-modify-write)</text>
<rect x="100.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="190.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1) прочитати REG</text>
<line x1="280.0" y1="138.0" x2="340.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2) АБО з маскою</text>
<line x1="520.0" y1="138.0" x2="580.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="670.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3) записати назад</text>
<text x="430.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Втрутиться переривання між 1 і 3 — твій запис ЗАТРЕ його зміну (гонка).</text>
<rect x="40.0" y="234.0" width="780.0" height="150.0" rx="12" fill="none" stroke="#27ae60" stroke-width="1.6"/>
<text x="60.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Безпечно: GPIO.out_w1ts = mask — одна атомарна дія</text>
<text x="80.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">W1TS (write-1-to-set):</text>
<text x="100.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">де в масці 1 — той біт стає 1; де 0 — біт без змін.</text>
<text x="80.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">W1TC (write-1-to-clear):</text>
<text x="100.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">де в масці 1 — той біт стає 0; де 0 — біт без змін.</text>
<rect x="621.2" y="297.1" width="157.7" height="57.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="700.0" dy="0.0">Залізо саме чіпає</tspan><tspan x="700.0" dy="13.7">лише потрібні біти —</tspan><tspan x="700.0" dy="13.7">читати нічого не треба.</tspan></text>
</svg>