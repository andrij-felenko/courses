  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інкрементний CRC: рахуємо на льоту, а не в кінці</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен прийнятий байт одразу домішуємо в поточний CRC — буферувати весь пакет не треба</text>
<rect x="70.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="145.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">len=3</text>
<text x="145.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">crc = init(3)</text>
<line x1="220.0" y1="165.0" x2="238.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="238.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="313.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x41</text>
<text x="313.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">crc = upd(crc, 0x41)</text>
<line x1="388.0" y1="165.0" x2="406.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="406.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="481.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x42</text>
<text x="481.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">crc = upd(crc, 0x42)</text>
<line x1="556.0" y1="165.0" x2="574.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="574.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="649.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x43</text>
<text x="649.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">crc = upd(crc, 0x43)</text>
<line x1="724.0" y1="165.0" x2="742.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="742.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="817.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CRC-байт</text>
<text x="817.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">crc == прийнятий?</text>
<text x="450.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">коли приходить CRC-байт, відповідь уже готова — лишається тільки порівняти</text>
<rect x="60.0" y="300.0" width="780.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інкрементний CRC економить і пам'ять (не зберігаємо весь пакет), і час (рахуємо паралельно з прийомом).</text>
<text x="450.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий принцип годиться й для передачі: нарощуємо CRC, доки формуємо пакет.</text>
</svg>
