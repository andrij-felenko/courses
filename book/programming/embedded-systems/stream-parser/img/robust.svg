<text x="150.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">len &gt; буфер → скид</tspan><tspan x="150.0" dy="12.3">(інакше переповнення)</tspan></text>
