<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">побитий пакет → відкинути,</tspan><tspan x="360.0" dy="12.3">чекати наступний SYNC</tspan></text>
