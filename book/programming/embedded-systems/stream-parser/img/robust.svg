<text x="570.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="570.0" dy="0.0">застрягли надовго → скид</tspan><tspan x="570.0" dy="12.3">(загублений байт)</tspan></text>
