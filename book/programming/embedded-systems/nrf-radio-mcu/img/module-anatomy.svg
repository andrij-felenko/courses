<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія модуля nRF52-класу: що зібрано під екраном</text>
<rect x="50.0" y="70.0" width="470.0" height="320.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="285.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">металевий екран (під ним — увесь радіотракт)</text>
<rect x="90.0" y="150.0" width="180.0" height="150.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="180.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">радіо-SoC</tspan><tspan x="180.0" dy="13.0">Cortex-M4 + 2.4 ГГц радіо</tspan><tspan x="180.0" dy="13.0">Flash і RAM на кристалі</tspan></text>
<rect x="310.0" y="140.0" width="150.0" height="50.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="385.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">кварц 32 МГц</tspan><tspan x="385.0" dy="13.0">(такт + опора радіо)</tspan></text>
<rect x="310.0" y="210.0" width="150.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="385.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">кварц 32.768 кГц</tspan><tspan x="385.0" dy="13.0">(будить зі сну)</tspan></text>
<rect x="310.0" y="290.0" width="150.0" height="56.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.5"/><text x="385.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">DC-DC (дросель+LDO)</tspan><tspan x="385.0" dy="13.0">мікроамперний режим</tspan></text>
<rect x="90.0" y="300.0" width="180.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.5"/><text x="180.0" y="326.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">π-ланка узгодження → 50 Ом</tspan></text>
<line x1="180.0" y1="300.0" x2="180.0" y2="280.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="175.0" width="120.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="640.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">PCB-антена</tspan><tspan x="640.0" dy="14.3">(або роз'єм U.FL)</tspan></text>
<rect x="572.0" y="167.0" width="136.0" height="126.0" rx="6" fill="none" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="640.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">зона без міді навколо</text>
<line x1="270.0" y1="322.0" x2="580.0" y2="230.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="70.0" width="150.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="635.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">назовні: VDD, GND,</tspan><tspan x="635.0" dy="13.0">SWD (прошивка), GPIO</tspan></text>
<rect x="560.0" y="320.0" width="170.0" height="66.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="645.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">купуєш виміряний тракт</tspan><tspan x="645.0" dy="13.0">+ сертифікацію</tspan><tspan x="645.0" dy="13.0">(FCC/CE/TELEC)</tspan></text>
</svg>