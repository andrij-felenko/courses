<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 351.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="351.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому радіо вирішує бюджет батареї: заряд на сесію = площа під струмом</text>
<line x1="80.0" y1="280.0" x2="680.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="80.0" y1="280.0" x2="80.0" y2="52.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="680.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-style="italic">час</text>
<text x="68.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">струм</text>
<line x1="74.0" y1="121.6" x2="80.0" y2="121.6" stroke="#6b7280" stroke-width="1.0"/>
<text x="70.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">180 мА</text>
<line x1="74.0" y1="273.0" x2="80.0" y2="273.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="70.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">8 мА</text>
<polygon points="110.0,280.0 110.0,121.6 260.0,121.6 260.0,280.0" fill="#d6e4f7" stroke="#2457d6" stroke-width="2.4"/>
<text x="185.0" y="109.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Wi-Fi (ESP32)</text>
<text x="185.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">≈180 мА × 200 мс</text>
<text x="185.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">велика площа = великий заряд</text>
<polygon points="410.0,280.0 410.0,273.0 428.0,273.0 428.0,280.0" fill="#f6d9d4" stroke="#c0392b" stroke-width="2.4"/>
<text x="436.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">BLE (nRF): ≈8 мА × 4 мс</text>
<text x="436.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">крихітна площа = крихітний заряд</text>
<line x1="428.0" y1="278.0" x2="670.0" y2="278.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="670.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">сон ≈ мікроампери</text>
<text x="360.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Автономність вирішує заряд на сесію — площа під кривою, не миттєвий струм</text>
</svg>