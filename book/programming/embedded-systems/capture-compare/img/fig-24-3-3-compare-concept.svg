<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порівняння (compare): дія, щойно лічильник дійде до мітки</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">залізо весь час звіряє лічильник із заданим числом; збіг → автоматична дія на ніжці</text>
<line x1="90.0" y1="230.0" x2="760.0" y2="230.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="90.0,230.0 760.0,90.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">лічильник</text>
<line x1="90.0" y1="150.0" x2="760.0" y2="150.0" stroke="#caa24a" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="764.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="start" font-weight="bold" font-style="normal">значення порівняння</text>
<circle cx="472.9" cy="150.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="472.9" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">збіг!</text>
<line x1="472.9" y1="150.0" x2="472.9" y2="300.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="362.9" y="300.0" width="220.0" height="50.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="472.9" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">дія: перемкнути ніжку</text>
<text x="472.9" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">та/або переривання</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо саме «натискає» в потрібний тік — без жодної затримки коду. Точність ідеальна.</text>
</svg>
