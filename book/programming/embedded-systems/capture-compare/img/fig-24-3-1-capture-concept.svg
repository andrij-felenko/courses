  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Захоплення (capture): залізо миттєво «фотографує» лічильник на фронті</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">прийшов фронт на ніжку — апаратура тієї ж миті копіює значення лічильника в регістр</text>
<line x1="90.0" y1="210.0" x2="760.0" y2="210.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="90.0,210.0 300.0,110.0 300.0,210.0 560.0,110.0 560.0,210.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">лічильник</text>
<text x="64.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">сигнал</text>
<polyline points="90.0,290.0 360.0,290.0 360.0,250.0 760.0,250.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360.0" cy="250.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="360.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↑ фронт тут</text>
<line x1="360.0" y1="250.0" x2="360.0" y2="210.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="360.0" cy="174.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="360.0" y1="174.0" x2="470.0" y2="150.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="470.0" y="130.0" width="200.0" height="50.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="570.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">регістр захоплення</text>
<text x="570.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= значення лічильника</text>
<rect x="150.0" y="310.0" width="640.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Знімок робить ЗАЛІЗО тієї ж наносекунди — без затримки коду й джитера переривань.</text>
<text x="470.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Це точна апаратна «мітка часу» зовнішньої події.</text>
</svg>
