<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як ESP підкорив аматорів: ланцюг подій</text>
<line x1="250.0" y1="80.0" x2="250.0" y2="600.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="250.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">до 2014</text>
<text x="276.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Дорогий Wi-Fi</text>
<text x="276.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Плата зв'язку $30–40 — дорожча за весь проєкт. Як вивести саморобку в мережу?</text>
<circle cx="250.0" cy="214.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2014</text>
<text x="276.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">ESP8266 (Espressif · AI-Thinker)</text>
<text x="276.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Дешевий «перехідник на Wi-Fi» за кілька $. Невже лише причіп до Arduino?</text>
<circle cx="250.0" cy="308.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2014–15</text>
<text x="276.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Відкриття спільноти</text>
<text x="276.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">А всередині — справжній 32-біт комп'ютер! Та документація китайською.</text>
<circle cx="250.0" cy="402.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="228.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2015</text>
<text x="276.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">NodeMCU + ядро Arduino</text>
<text x="276.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Чіп за $3 програмують як Arduino — стіни впали, вибух проєктів.</text>
<circle cx="250.0" cy="496.0" r="10.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="250.0" cy="496.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="228.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2016</text>
<text x="276.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ESP32 (Espressif)</text>
<text x="276.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Два ядра, +Bluetooth, готова екосистема з першого дня.</text>
<rect x="242.0" y="582.0" width="16.0" height="16.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="228.0" y="595.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">сьогодні</text>
<text x="276.0" y="587.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Стандарт IoT</text>
<text x="276.0" y="607.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Чому саме ESP підкорив аматорів?</text>
</svg>