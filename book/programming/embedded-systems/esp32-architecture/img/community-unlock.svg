<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як спільнота відчинила ESP8266 світові</text>
<rect x="40.0" y="82.0" width="150.0" height="76.0" rx="6" fill="#f3f3f3" stroke="#6b7280" stroke-width="1.7"/><text x="115.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Дешевий чіп</tspan><tspan x="115.0" dy="13.7">з потенціалом,</tspan><tspan x="115.0" dy="13.7">док. китайською</tspan></text>
<rect x="228.0" y="82.0" width="150.0" height="76.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.7"/><text x="303.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="303.0" dy="0.0">Спільнота розбирає,</tspan><tspan x="303.0" dy="13.7">перекладає,</tspan><tspan x="303.0" dy="13.7">документує</tspan></text>
<line x1="192.0" y1="120.0" x2="226.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="416.0" y="82.0" width="150.0" height="76.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/><text x="491.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="491.0" dy="0.0">NodeMCU (Lua) +</tspan><tspan x="491.0" dy="13.7">ядро Arduino</tspan></text>
<line x1="380.0" y1="120.0" x2="414.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="604.0" y="82.0" width="150.0" height="76.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.7"/><text x="679.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="679.0" dy="0.0">Комп'ютер з Wi-Fi</tspan><tspan x="679.0" dy="13.7">за $3, як Arduino</tspan></text>
<line x1="568.0" y1="120.0" x2="602.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="792.0" y="82.0" width="150.0" height="76.0" rx="6" fill="#fff6e0" stroke="#8a6a14" stroke-width="1.7"/><text x="867.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a14" text-anchor="middle" font-weight="700"><tspan x="867.0" dy="0.0">Вибух аматорських</tspan><tspan x="867.0" dy="13.7">проєктів</tspan></text>
