  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як ESP підкорив аматорів: ланцюг подій</text>
<text x="460.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від дорогого Wi-Fi до стандарту IoT — кожен щабель нове питання</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="630.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="126.0" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">до 2014</text>
<text x="276.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Дорогий Wi-Fi</text>
<text x="276.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Плата зв'язку $30–40 — дорожча за весь проєкт. Як вивести саморобку в мережу?</text>
<circle cx="250.0" cy="220.8" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="225.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2014</text>
<text x="276.0" y="217.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ESP8266 / Espressif · AI-Thinker</text>
<text x="276.0" y="237.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Дешевий «перехідник на Wi-Fi» за $5. Невже лише причіп до Arduino?</text>
<circle cx="250.0" cy="315.6" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="320.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2014–15</text>
<text x="276.0" y="312.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Відкриття спільноти</text>
<text x="276.0" y="332.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">А всередині — справжній 32-біт комп'ютер! Та документація китайською</text>
<circle cx="250.0" cy="410.4" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="415.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2015</text>
<text x="276.0" y="407.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">NodeMCU + ядро Arduino</text>
<text x="276.0" y="427.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чіп за $3 програмують як Arduino — стіни впали → вибух проєктів</text>
<circle cx="250.0" cy="505.2" r="10.0" fill="#ffffff" stroke="#c0271e" stroke-width="3"/>
<circle cx="250.0" cy="505.2" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="228.0" y="510.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2016</text>
<text x="276.0" y="502.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ESP32 / Espressif</text>
<text x="276.0" y="522.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Два ядра, +Bluetooth, готова екосистема з першого дня</text>
<rect x="242.0" y="592.0" width="16.0" height="16.0" rx="3" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="228.0" y="605.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">сьогодні</text>
<text x="276.0" y="597.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Стандарт IoT</text>
<text x="276.0" y="617.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Чому саме ESP підкорив аматорів?</text>
</svg>
