<rect x="390.0" y="234.0" width="150.0" height="64.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="465.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">RTC-пам'ять</tspan><tspan x="465.0" dy="15.6">живе у сні</tspan></text>
