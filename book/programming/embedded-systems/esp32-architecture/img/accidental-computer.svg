<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP-01: «перехідник на Wi-Fi», а всередині — комп'ютер</text>
<rect x="60.0" y="100.0" width="320.0" height="180.0" rx="12" fill="#f3f3f3" stroke="#bdbdbd" stroke-width="1.8"/>
<text x="220.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Очікували</text>
<text x="220.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">німий «перехідник»</text>
<text x="220.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лише з'єднати чужу плату</text>
<text x="220.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з Wi-Fi за AT-командами</text>
<rect x="110.0" y="222.0" width="220.0" height="44.0" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5"/><text x="220.0" y="240.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="220.0" dy="0.0">ESP-01: 8 ніжок,</tspan><tspan x="220.0" dy="14.3">антена-доріжка</tspan></text>
<rect x="440.0" y="100.0" width="320.0" height="180.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">А всередині виявилось</text>
<text x="600.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">32-бітне ядро (~80 МГц)</text>
<text x="600.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">з пам'яттю + той самий Wi-Fi</text>
<rect x="480.0" y="204.0" width="240.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">самодостатній комп'ютер —</tspan><tspan x="600.0" dy="14.3">жодна головна плата</tspan><tspan x="600.0" dy="14.3">не потрібна</tspan></text>
<line x1="382.0" y1="190.0" x2="438.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">маскування дрібнички під «причіп» і стало головним сюрпризом</text>
</svg>