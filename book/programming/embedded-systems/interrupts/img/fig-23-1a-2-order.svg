<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило «спершу дані, потім покажчик»</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">рухати head — означає «опублікувати»; робити це треба ОСТАННІМ</text>
<rect x="60.0" y="84.0" width="380.0" height="110.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Правильно ✓</text>
<text x="250.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) записати дані в слот</text>
<text x="250.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2) посунути head</text>
<text x="250.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">main бачить head, коли дані вже там</text>
<rect x="460.0" y="84.0" width="380.0" height="110.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Неправильно ✗</text>
<text x="650.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) посунути head</text>
<text x="650.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2) записати дані</text>
<text x="650.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">main прочитає слот ДО запису → сміття</text>
<rect x="120.0" y="222.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Публікуй (рухай покажчик) останнім — і споживач ніколи не побачить недописаного.</text>
<text x="450.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Той самий принцип «перемикач останнім», що рятував нас у §4.3.7.</text>
