<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як підключити переривання в коді: attachInterrupt</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три речі: яка ніжка, яка функція-обробник і на яку подію</text>
<rect x="120.0" y="110.0" width="680.0" height="56.0" rx="10" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="140" y="146" font-family="Consolas, monospace" font-size="17" fill="#e8e8e8" font-weight="bold">attachInterrupt(<tspan fill="#7fb4ff">digitalPinToInterrupt(PIN)</tspan>, <tspan fill="#7ee0a0">onPress</tspan>, <tspan fill="#ff8a7a">FALLING</tspan>);</text>
<line x1="250.0" y1="166.0" x2="250.0" y2="210.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="60.0" y="210.0" width="240.0" height="90.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="180.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1 · яка ніжка</text>
<text x="180.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">digitalPinToInterrupt(PIN)</text>
<text x="180.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">номер «лінії» переривання</text>
<line x1="480.0" y1="166.0" x2="480.0" y2="210.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="340.0" y="210.0" width="240.0" height="90.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="460.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2 · обробник (ISR)</text>
<text x="460.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">onPress — ваша функція</text>
<text x="460.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">викликається на подію</text>
<line x1="650.0" y1="166.0" x2="650.0" y2="210.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="620.0" y="210.0" width="240.0" height="90.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="740.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">3 · подія</text>
<text x="740.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">FALLING / RISING / CHANGE</text>
<text x="740.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">спад / наростання / зміна</text>
<text x="460.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FALLING — спад (натиск кнопки з підтяжкою), RISING — наростання, CHANGE — будь-яка зміна.</text>
<text x="460.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Сам обробник: void onPress() { … } — короткий і обережний (правила — у §23.3).</text>
</svg>
