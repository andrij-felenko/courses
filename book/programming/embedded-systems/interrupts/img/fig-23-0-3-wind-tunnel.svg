  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо це знадобилося: реальний час аеродинамічної труби</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">виміри приходять у НЕпередбачувані моменти — їх треба ловити вмить, не чекаючи</text>
<polyline points="70.0,150.0 250.0,150.0 300.0,175.0 300.0,245.0 250.0,270.0 70.0,270.0 70.0,150.0" fill="#f4f8ff" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="175.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">аеродинамічна труба</text>
<line x1="40.0" y1="175.0" x2="70.0" y2="175.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<line x1="40.0" y1="210.0" x2="70.0" y2="210.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<line x1="40.0" y1="245.0" x2="70.0" y2="245.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="30.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">потік повітря</text>
<polyline points="150.0,210.0 200.0,200.0 205.0,210.0 150.0,220.0" fill="#9a9aa0" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="178.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">модель</text>
<circle cx="120.0" cy="175.0" r="4.0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="170.0" cy="195.0" r="4.0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="210.0" cy="230.0" r="4.0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="140.0" cy="255.0" r="4.0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="175.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">датчики тиску/сили</text>
<rect x="640.0" y="150.0" width="220.0" height="120.0" rx="12" fill="none" stroke="#1f47b5" stroke-width="2"/>
<text x="750.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">комп'ютер (1103)</text>
<text x="750.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">має схопити КОЖЕН</text>
<text x="750.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вимір тієї ж миті</text>
<text x="750.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ не можна «бути зайнятим»</text>
<line x1="310.0" y1="180.0" x2="640.0" y2="180.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<line x1="310.0" y1="210.0" x2="640.0" y2="210.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<line x1="310.0" y1="245.0" x2="640.0" y2="245.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<text x="470.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">виміри надходять нерівномірно (t1, t2, t3 …)</text>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Опитуванням такі випадкові події легко проґавити —</text>
<text x="470.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тому й додали переривання: пристрій сам кличе процесор.</text>
</svg>
