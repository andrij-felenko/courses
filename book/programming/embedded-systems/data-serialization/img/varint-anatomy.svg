<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Varint: число 300 → два байти base-128</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">300 = 0b1_0010_1100  (потрібно 9 бітів → в один байт по 7 не влазить)</text>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1 · розбити на 7-бітні групи, МОЛОДША перша</text>
<text x="60.0" y="128.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">0010 1100  →  групи по 7:  010 1100 | 000 0010</text>
<text x="60.0" y="150.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6b7280" text-anchor="start">               молодші 7 = 0101100   старші = 0000010</text>
<text x="40.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2 · старший біт = «далі ще є?» (1 — так, 0 — це останній)</text>
