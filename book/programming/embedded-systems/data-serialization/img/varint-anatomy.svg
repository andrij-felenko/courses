<rect x="120.0" y="360.0" width="660.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Декодер читає байти, поки старший біт = 1; на першому байті з 0 — стоп.</tspan><tspan x="450.0" dy="15.6">Payload-сімки склеює у ЗВОРОТНОМУ порядку (молодша група — молодші біти):</tspan><tspan x="450.0" dy="15.6">0000010·0101100 = 1_0010_1100 = 300.</tspan></text>
