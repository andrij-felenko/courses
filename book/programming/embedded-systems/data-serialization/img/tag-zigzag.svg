<rect x="60.0" y="400.0" width="780.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Кодування: (n &lt;&lt; 1) ^ (n &gt;&gt; 31)  — від'ємні стають непарними, додатні — парними.</tspan><tspan x="450.0" dy="15.6">Розкодування: (u &gt;&gt; 1) ^ -(u &amp; 1)  — молодший біт-парність відновлює знак.</tspan><tspan x="450.0" dy="15.6">Без zigzag −1 у two's complement = 0xFFFFFFFF → аж 5 байтів varint; із zigzag −1 = 1 → один байт.</tspan></text>
