<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи намацати межі кадру</text>
<text x="40.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Префікс довжини</text>
<text x="40.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">спершу читаємо, скільки байтів далі — тоді відлічуємо рівно стільки</text>
<rect x="90.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">LEN</text>
<text x="120.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3</text>
<rect x="154.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="184.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">D0</text>
<text x="184.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані</text>
<rect x="218.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="248.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">D1</text>
<text x="248.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані</text>
<rect x="282.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="312.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">D2</text>
<text x="312.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані</text>
<rect x="346.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="376.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">CRC</text>
<text x="376.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сума</text>
<rect x="410.0" y="128.0" width="60.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="150.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">CRC</text>
<text x="440.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сума</text>
<line x1="120.0" y1="118.0" x2="314.0" y2="118.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="218.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">«далі 3 байти даних»</text>
<rect x="90.0" y="202.0" width="700.0" height="30.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="440.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Дані прозорі: 0x7E всередині — звичайний байт. Але збрехана довжина губить синхронізацію.</tspan></text>
<text x="40.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Маркер із екрануванням (стиль HDLC / PPP)</text>
<text x="40.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">0x7E — межа кадру; якщо байт даних = 0x7E чи 0x7D, його екранують</text>
<rect x="90.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">7E</text>
<text x="120.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">межа</text>
<rect x="154.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="184.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">02</text>
<text x="184.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані</text>
<rect x="218.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="248.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">7D</text>
<text x="248.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">escape</text>
<rect x="282.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="312.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">5E</text>
<text x="312.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">=дані 7E</text>
<rect x="346.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="376.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">01</text>
<text x="376.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані</text>
<rect x="410.0" y="320.0" width="60.0" height="36.0" rx="4" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="342.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">7E</text>
<text x="440.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">межа</text>
<text x="250.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">0x7D 0x5E = дані 0x7E   (0x7E XOR 0x20 = 0x5E)</text>
<rect x="90.0" y="394.0" width="700.0" height="30.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="412.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">0x7E ніколи не трапляється в даних → межу видно завжди. Ціна — escape-байти й стан «щойно був 0x7D».</tspan></text>
</svg>