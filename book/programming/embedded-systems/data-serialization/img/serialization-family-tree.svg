<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві гілки серіалізації від однієї задачі</text>
<rect x="190.0" y="48.0" width="520.0" height="42.0" rx="6" fill="#e9ecef" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="71.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Стіна: несумісні машини (big/little-endian, EBCDIC, слова Cray) — байти не означають те саме</tspan></text>
<text x="225.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ТЕЛЕКОМ · комітет, наперед, на все</text>
<text x="675.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">UNIX / SUN · мінімум, швидко, дешево</text>
<rect x="50.0" y="128.0" width="350.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">X.400 (пошта MHS, 1980–84)</tspan></text>
<text x="225.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потрібно передати структуру листа</text>
<line x1="225.0" y1="188.0" x2="225.0" y2="208.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="350.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="237.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ASN.1 · X.409 (1984)</tspan></text>
<text x="225.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">мова опису + кодування разом</text>
<line x1="225.0" y1="270.0" x2="225.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="292.0" width="350.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">X.208 нотація + X.209 BER (1988)</tspan></text>
<text x="225.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">форма ОКРЕМО від кодування (TLV)</text>
<line x1="225.0" y1="352.0" x2="225.0" y2="372.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="374.0" width="350.0" height="46.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="225.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">DER → сертифікати X.509</tspan></text>
<text x="225.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">канонічне кодування для підписів</text>
<rect x="500.0" y="128.0" width="350.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">NFS + ONC RPC (Sun, 1984)</tspan></text>
<text x="675.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потрібно передати аргументи й файли</text>
<line x1="675.0" y1="188.0" x2="675.0" y2="208.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="210.0" width="350.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="237.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">XDR · RFC 1014 (1987)</tspan></text>
<text x="675.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">канонічний big-endian, БЕЗ тегів</text>
<line x1="675.0" y1="270.0" x2="675.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="292.0" width="350.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">«відправник усе виправляє»</tspan></text>
<text x="675.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 порядок на всіх; 4-байтові слова</text>
<line x1="370.0" y1="398.0" x2="330.0" y2="470.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="675.0" y1="328.0" x2="570.0" y2="470.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="265.0" y="474.0" width="370.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="494.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Protocol Buffers (Google: Proto1 2001 → відкрито 2008)</tspan><tspan x="450.0" dy="13.0">СХЕМА (від телекома) + ЩІЛЬНІСТЬ (від Unix)</tspan><tspan x="450.0" dy="13.0">+ сталий числовий тег поля → еволюція без поломки</tspan></text>
<rect x="235.0" y="552.0" width="430.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="573.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Безсхемний бунт: «як JSON, лише швидко й компактно»</tspan><tspan x="450.0" dy="10.4">MessagePack (2008) · CBOR — RFC 7049 (2013) / 8949 (2020): двійковий самоопис, без схеми</tspan></text>
</svg>