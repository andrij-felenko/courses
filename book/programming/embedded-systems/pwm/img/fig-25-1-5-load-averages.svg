<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це працює: навантаження саме «згладжує» імпульси</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перемикання швидше, ніж устигає реагувати око чи мотор — тож вони бачать середнє</text>
<text x="64.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">ШІМ →</text>
<polyline points="140.0,160.0 140.0,110.0 160.0,110.0 160.0,160.0 190.0,160.0 190.0,110.0 210.0,110.0 210.0,160.0 240.0,160.0 240.0,110.0 260.0,110.0 260.0,160.0 290.0,160.0 290.0,110.0 310.0,110.0 310.0,160.0 340.0,160.0 340.0,110.0 360.0,110.0 360.0,160.0 390.0,160.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="400.0" y1="135.0" x2="470.0" y2="135.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="490.0" y="92.0" width="160.0" height="56.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="570.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">око</text>
<text x="570.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інерція зору</text>
<text x="680.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ бачить рівну яскравість</text>
<rect x="490.0" y="172.0" width="160.0" height="56.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="570.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<text x="570.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інерція маси</text>
<text x="680.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ крутиться рівно</text>
<rect x="490.0" y="252.0" width="160.0" height="56.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="570.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нагрівач</text>
<text x="570.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">теплова інерція</text>
<text x="680.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ гріє рівно</text>
<rect x="140.0" y="300.0" width="680.0" height="64.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Якби перемикання було повільним, ми б бачили блимання. Швидке ж — зливається в рівне.</text>
<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому в ШІМ важлива не лише шпаруватість, а й достатньо ВИСОКА частота (про це далі).</text>
</svg>
