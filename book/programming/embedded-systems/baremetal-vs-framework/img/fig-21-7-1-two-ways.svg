<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама дія — дві дороги до регістра</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">різниця в тому, ХТО складає запис: ви чи бібліотека</text>
<rect x="40.0" y="86.0" width="360.0" height="116.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="220.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Голе залізо</text>
<rect x="70.0" y="126.0" width="300.0" height="44.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="220.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#eaf6ee" text-anchor="middle" font-weight="bold" font-style="normal">GPIO_OUT |= (1 &lt;&lt; 2);</text>
<text x="220.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ви самі складаєте запис</text>
<rect x="40.0" y="232.0" width="360.0" height="116.0" rx="12" fill="none" stroke="#eef6ef" stroke-width="2"/>
<text x="220.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Фреймворк</text>
<rect x="70.0" y="272.0" width="300.0" height="44.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="220.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7fe0a0" text-anchor="middle" font-weight="bold" font-style="normal">digitalWrite(2, HIGH);</text>
<text x="220.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">бібліотека складе запис за вас</text>
<line x1="404.0" y1="150.0" x2="524.0" y2="208.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="404.0" y1="298.0" x2="524.0" y2="248.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="534.0" y="186.0" width="330.0" height="84.0" rx="10" fill="#eef3ff" stroke="#1f47b5" stroke-width="2"/>
<text x="699.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">один і той самий</text>
<text x="699.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">запис у РЕГІСТР</text>
<text x="699.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ ніжка перемикається</text>
</svg>
