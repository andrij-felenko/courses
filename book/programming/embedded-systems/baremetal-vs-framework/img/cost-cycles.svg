<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна зручності: десятки тактів проти одного-трьох</text>
<text x="236.0" y="122.0" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="end">digitalWrite(2, HIGH)</text>
<rect x="250.0" y="104.0" width="360.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="620.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">≈ 40 тактів ≈ 0.17 мкс</text>
<text x="236.0" y="192.0" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="end">GPIO_OUT |= (1&lt;&lt;2)</text>
<rect x="250.0" y="174.0" width="22.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="282.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">≈ 2 такти ≈ 0.008 мкс</text>
<text x="250.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">різниця ~10–50× — та на 240 МГц обидва тонуть у частках мкс</text>
<text x="360.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">для звичайної дії (блимнути раз на секунду) різниці не видно;</tspan><tspan x="360.0" dy="14.3">вона важить лише в гарячому циклі на мільйони перемикань/с</tspan></text>
</svg>