<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як обирати: спершу частота під навантаження, тоді роздільність</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">частоту диктує фізика навантаження; роздільність береш найбільшу, що ще вміщається</text>
<rect x="50.0" y="90.0" width="410.0" height="220.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="255.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1. Частоту — від навантаження</text>
<line x1="70.0" y1="134.0" x2="440.0" y2="134.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="80.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• світлодіод: &gt; 200 Гц (не блимає)</text>
<text x="80.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• мотор: часто 1–20 кГц (тихо)</text>
<text x="80.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• звук: за межею чутності</text>
<rect x="510.0" y="90.0" width="410.0" height="220.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="715.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2. Роздільність — що влізе</text>
<line x1="530.0" y1="134.0" x2="900.0" y2="134.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="540.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• порахуй max біт за формулою</text>
<text x="540.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• візьми стільки, скільки треба</text>
<text x="540.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• для LED 8 біт майже завжди</text>
<rect x="150.0" y="326.0" width="660.0" height="44.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: НАЙНИЖЧА частота, що годиться навантаженню → лишається найбільше біт на плавність.</text>
</svg>
