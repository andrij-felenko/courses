<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">JTAG і SWD ведуть до одного блока, різним числом ліній</text>
<rect x="540.0" y="100.0" width="150.0" height="100.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="615.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">відлагоджу-</tspan><tspan x="615.0" dy="15.6">вальний блок</tspan><tspan x="615.0" dy="15.6">у ядрі</tspan></text>
<text x="60.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">TCK такт</text>
<text x="60.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">TMS режим</text>
<text x="60.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">TDI вхід</text>
<text x="60.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">TDO вихід</text>
<text x="60.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">JTAG — 4 лінії</text>
<line x1="210.0" y1="86.0" x2="536.0" y2="124.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SWCLK такт</text>
<text x="60.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SWDIO дані ⇄ керування</text>
<text x="60.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">SWD — 2 лінії</text>
<line x1="280.0" y1="210.0" x2="536.0" y2="176.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">та сама сила — SWDIO суміщає TDI, TDO і TMS, перемикаючи напрям</text>
</svg>