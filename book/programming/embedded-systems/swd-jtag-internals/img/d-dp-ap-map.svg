<text x="434.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">0x00</text>
<text x="570.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">CSW (R/W) — режим доступу</text>
<rect x="420.0" y="138.0" width="300.0" height="34.0" rx="0" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
