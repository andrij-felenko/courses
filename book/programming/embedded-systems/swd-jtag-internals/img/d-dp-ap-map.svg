<rect x="420.0" y="172.0" width="300.0" height="34.0" rx="0" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="434.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">0x0C</text>
<text x="570.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">DRW (R/W) — дані</text>
<rect x="420.0" y="206.0" width="300.0" height="34.0" rx="0" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="434.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">0xF8</text>
<text x="570.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">BASE / IDR — опис AP</text>
<line x1="340.0" y1="155.0" x2="416.0" y2="86.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SELECT задає,</text>
<text x="380.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЯКИЙ AP і банк</text>
<text x="40.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">* який саме регістр на 0b01 і 0b10 — залежить від поля DPBANKSEL у SELECT</text>
<text x="40.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Читання AP запізнюється на крок: значення приходить у наступному читанні або з RDBUFF</text>
</svg>