<rect x="40.0" y="172.0" width="300.0" height="34.0" rx="0" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
<text x="54.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">0b10</text>
<text x="190.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">SELECT (W) / RESEND (R)</text>
<rect x="40.0" y="206.0" width="300.0" height="34.0" rx="0" fill="#f4f6f8" stroke="#d7dde6" stroke-width="1.0"/>
