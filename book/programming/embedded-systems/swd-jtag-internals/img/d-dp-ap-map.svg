<text x="190.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">RDBUFF (R)</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a5fb0" text-anchor="start" font-weight="700">MEM-AP — міст до шини</text>
<rect x="420.0" y="70.0" width="300.0" height="34.0" rx="6" fill="#8a5fb0" stroke="#8a5fb0" stroke-width="1.4"/>
<text x="434.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700">адреса A[3:2]</text>
<text x="570.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="700">регістр (R / W)</text>
