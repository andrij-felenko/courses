<rect x="560.0" y="184.0" width="130.0" height="56.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/><text x="625.0" y="208.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">пам'ять / шина</tspan><tspan x="625.0" dy="14.3">через AP</tspan></text>
