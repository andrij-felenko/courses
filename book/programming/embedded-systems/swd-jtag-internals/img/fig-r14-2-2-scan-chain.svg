<text x="405.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен такт TCK: бít вдвигається з TDI, зсувається по ланцюгу, стан чипа видвигається у TDO.</text>
<text x="405.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Один тонкий дріт-«нитка» дає серіалізований доступ до всіх регістрів.</text>
<text x="410.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рис. 4.14.2.2. Скан-ланцюг: один тонкий дріт дає доступ до всіх нутрощів коштом серіалізації.</text>
