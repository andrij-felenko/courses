<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль CRC — це конвеєр із шести параметрів</text>
<line x1="130.9" y1="108.0" x2="210.1" y2="108.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="305.9" y1="108.0" x2="364.2" y2="108.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="531.8" y1="108.0" x2="592.1" y2="108.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="687.9" y1="108.0" x2="748.1" y2="108.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="851.9" y1="108.0" x2="920.0" y2="108.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="62.0" y="78.9" width="65.9" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Байти</tspan><tspan x="95.0" dy="18.2">даних</tspan></text>
<rect x="213.1" y="78.9" width="89.8" height="58.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="258.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Відбиття</tspan><tspan x="258.0" dy="18.2">входу</tspan></text>
<rect x="367.2" y="69.8" width="161.7" height="76.4" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="448.0" y="94.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="448.0" dy="0.0">Ядро</tspan><tspan x="448.0" dy="18.2">зсув-XOR</tspan><tspan x="448.0" dy="18.2">(старт · поліном)</tspan></text>
<rect x="595.1" y="78.9" width="89.8" height="58.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Відбиття</tspan><tspan x="640.0" dy="18.2">виходу</tspan></text>
<rect x="751.1" y="78.9" width="97.8" height="58.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Фінальний</tspan><tspan x="800.0" dy="18.2">XOR</tspan></text>
<rect x="923.0" y="88.0" width="49.9" height="40.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="948.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="948.0" dy="0.0">CRC</tspan></text>
<text x="530.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Два кінці зійдуться, лише коли збіжаться ВСІ шість параметрів — сам поліном нічого не гарантує.</text>
<text x="150.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Контрольне значення — CRC рядка &quot;123456789&quot;:</text>
<text x="150.0" y="248.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#1a1a1a" text-anchor="start">CRC-8/SMBus          поліном 0x07         →  0xF4</text>
<text x="150.0" y="276.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#1a1a1a" text-anchor="start">CRC-8/Maxim (1-Wire)  поліном 0x31         →  0xA1</text>
<text x="150.0" y="304.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#1a1a1a" text-anchor="start">CRC-16/CCITT-FALSE   поліном 0x1021       →  0x29B1</text>
<text x="150.0" y="332.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#1a1a1a" text-anchor="start">CRC-16/Modbus        поліном 0x8005       →  0x4B37</text>
<text x="150.0" y="360.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#1a1a1a" text-anchor="start">CRC-32 (zlib, PNG)   поліном 0x04C11DB7   →  0xCBF43926</text>
</svg>