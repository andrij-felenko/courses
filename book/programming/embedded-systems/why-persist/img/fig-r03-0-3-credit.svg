<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Винайшли в Toshiba — а слава й гроші розійшлися</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">класична історія: інженер створив проривну річ, а визнання прийшло криво й пізно</text>
<rect x="60.0" y="110.0" width="250.0" height="110.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="185.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Toshiba (Японія)</text>
<text x="185.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Фудзіо Масуока — винахідник;</text>
<text x="185.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Сьодзі Аріідзумі назвав «flash»;</text>
<text x="185.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">компанія скупо віддячила</text>
<rect x="360.0" y="110.0" width="250.0" height="110.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="485.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Intel (США)</text>
<text x="485.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">підхопила NOR-flash і першою</text>
<text x="485.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">агресивно її комерціалізувала</text>
<text x="485.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(чип на 256 Кбіт, 1988)</text>
<rect x="660.0" y="110.0" width="200.0" height="110.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="760.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Масуока згодом</text>
<text x="760.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">судився з Toshiba за</text>
<text x="760.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">винагороду; став</text>
<text x="760.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">професором (Тохоку)</text>
<line x1="310.0" y1="150.0" x2="360.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="610.0" y1="165.0" x2="660.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="110.0" y="250.0" width="700.0" height="64.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="460.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесно: винахід — Масуоки й Аріідзумі (Toshiba); масовий ринок розкрутили й інші.</text>
<text x="460.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Назвати справжнього автора — не дрібниця, а точність, якої вимагає інженерна культура.</text>
<text x="460.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий візерунок «винайшов тут — нагороду деінде» ми вже бачили не раз.</text>
</svg>
