<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Винайшли в Toshiba — а слава й гроші розійшлися</text>
<rect x="50.0" y="80.0" width="260.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="180.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Toshiba (Японія)</text>
<text x="180.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Масуока — винахідник;</tspan><tspan x="180.0" dy="13.0">Аріідзумі назвав «flash»;</tspan><tspan x="180.0" dy="13.0">компанія скупо віддячила</tspan></text>
<rect x="450.0" y="80.0" width="260.0" height="96.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="580.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Intel (США)</text>
<text x="580.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">підхопила NOR-flash і першою</tspan><tspan x="580.0" dy="13.0">агресивно її комерціалізувала</tspan><tspan x="580.0" dy="13.0">(чип на 256 Кбіт, 1988)</tspan></text>
<line x1="310.0" y1="128.0" x2="450.0" y2="128.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">винахід</text>
<text x="380.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ринок</text>
<rect x="190.0" y="196.0" width="380.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Масуока згодом судився з Toshiba за винагороду;</tspan><tspan x="380.0" dy="13.0">став професором університету Тохоку</tspan></text>
<text x="380.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">винахід — Масуоки й Аріідзумі (Toshiba); масовий ринок розкрутили й інші</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">назвати справжнього автора — не дрібниця, а точність інженерної культури</text>
</svg>