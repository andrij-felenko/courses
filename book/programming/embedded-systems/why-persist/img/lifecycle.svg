<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя пристрою в часі: коли що пишуть і читають</text>
<line x1="70.0" y1="250.0" x2="690.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="690.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">час життя пристрою</text>
<line x1="107.2" y1="244.0" x2="107.2" y2="256.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="107.2" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">завод</text>
<line x1="280.8" y1="244.0" x2="280.8" y2="256.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="280.8" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">налаштування</text>
<line x1="466.8" y1="244.0" x2="466.8" y2="256.0" stroke="#1a1a1a" stroke-width="1.6"/>
