<line x1="652.8" y1="244.0" x2="652.8" y2="256.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="652.8" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сервіс</text>
<rect x="107.2" y="80.0" width="545.6" height="30.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="115.2" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Калібрування</text>
<text x="646.8" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">пишуть раз</text>
<rect x="280.8" y="126.0" width="372.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="288.8" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Конфігурація</text>
<text x="646.8" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">пишуть зрідка</text>
<rect x="466.8" y="172.0" width="186.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="474.8" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Лог</text>
<text x="646.8" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">дописують у роботі</text>
<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">пишуть у свій момент, а читають усі — поки пристрій живе</text>
