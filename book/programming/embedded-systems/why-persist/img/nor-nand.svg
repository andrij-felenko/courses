<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 311.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="311.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два різновиди Flash від Масуоки в Toshiba</text>
<rect x="50.0" y="70.0" width="300.0" height="190.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">NOR (1984)</text>
<line x1="66.0" y1="106.0" x2="334.0" y2="106.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="68.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• довільний доступ до байта</text>
<text x="68.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• швидке читання</text>
<text x="68.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• виконання коду «на місці»</text>
<text x="68.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• → програмна пам'ять чипів</text>
<text x="200.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">Flash вашого ESP32 — цього роду</text>
<rect x="390.0" y="70.0" width="300.0" height="190.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/>
<text x="540.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a5fb0" text-anchor="middle" font-weight="700">NAND (1987)</text>
<line x1="406.0" y1="106.0" x2="674.0" y2="106.0" stroke="#8a5fb0" stroke-width="1.2"/>
<text x="408.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• доступ блоками, не байтом</text>
<text x="408.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• набагато щільніша й дешевша</text>
<text x="408.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ідеальна під великі обсяги</text>
<text x="408.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• → SD-картки, флешки, SSD</text>
<text x="540.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a5fb0" text-anchor="middle" font-style="italic">на чому лежать ваші файли</text>
<text x="370.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">NOR — щоб виконувати код; NAND — щоб зберігати гори даних; поділ живий донині</text>
</svg>