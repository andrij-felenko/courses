<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
<rect width="880" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один запис і відновлення при старті</text>
<text x="440.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">номер по порядку дає лад, мітка цілості відсіює обірване</text>
<text x="150.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Формат запису:</text>
<rect x="150.0" y="108.0" width="90.0" height="40.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="195.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">№ 105</text>
<rect x="240.0" y="108.0" width="200.0" height="40.0" rx="0" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="340.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">…подія…</text>
<rect x="440.0" y="108.0" width="110.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="495.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ цілий</text>
<rect x="150.0" y="158.0" width="90.0" height="40.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="195.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">№ 106</text>
<rect x="240.0" y="158.0" width="200.0" height="40.0" rx="0" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="340.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">…поді—</text>
<rect x="440.0" y="158.0" width="110.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="495.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ обірваний</text>
<text x="600.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">При старті:</text>
<text x="600.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• знайти найбільший № з доброю міткою</text>
<text x="620.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ це найновіший запис</text>
<text x="600.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• обірвані (хибна мітка) — пропустити</text>
<line x1="560.0" y1="96.0" x2="560.0" y2="188.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<rect x="150.0" y="222.0" width="580.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Мітка цілості — той самий прийом, що й у §4.3.7: збій під час запису</text>
<text x="440.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лишає останній запис обірваним, і відновлення спокійно його відкидає.</text>
</svg>
