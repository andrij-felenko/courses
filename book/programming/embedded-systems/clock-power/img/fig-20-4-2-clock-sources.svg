<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
<rect width="900" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться такт: внутрішній RC, кварц і множення PLL</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вибір між дешевизною й точністю</text>
<rect x="40.0" y="92.0" width="250.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="2"/>
<text x="165.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішній RC</text>
<path d="M 90,150 q 12,-22 24,0 q 12,22 24,0 q 12,-22 24,0" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="165.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усередині чипа · миттєвий старт</text>
<text x="165.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дешево, без зовнішніх деталей</text>
<text x="165.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">неточно: ±1–5 %</text>
<rect x="325.0" y="92.0" width="250.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="450.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Кварцовий резонатор</text>
<line x1="420.0" y1="140.0" x2="420.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="428.0" y="138.0" width="44.0" height="34.0" rx="0" fill="#eef3ff" stroke="#1b1b1b" stroke-width="1.6"/>
<line x1="480.0" y1="140.0" x2="480.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зовнішня деталь (кристалик)</text>
<text x="450.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повільніший старт, трохи дорожче</text>
<text x="450.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">дуже точно: ±10–50 ppm</text>
<rect x="610.0" y="92.0" width="250.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="2"/>
<text x="735.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PLL — множник частоти</text>
<rect x="626.0" y="150.0" width="90.0" height="44.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="671.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кварц</text>
<text x="671.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">40 МГц</text>
<rect x="742.0" y="150.0" width="56.0" height="44.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="770.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×6</text>
<text x="820.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<line x1="716.0" y1="172.0" x2="742.0" y2="172.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="640.0" y="206.0" width="180.0" height="30.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="730.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ядро 240 МГц</text>
<line x1="770.0" y1="194.0" x2="730.0" y2="206.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="735.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">точність кварцу + швидкість</text>
<rect x="120.0" y="420.0" width="660.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Більшість МК мають і внутрішній RC, і вхід для кварцу — джерело обирають під задачу.</text>
</svg>
