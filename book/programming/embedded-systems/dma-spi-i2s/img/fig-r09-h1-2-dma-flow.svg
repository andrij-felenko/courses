<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPU-loop проти DMA: що робить процесор під час звуку</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зліва — CPU тягне кожен байт сам; справа — DMA-канал, CPU вільний</text>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без DMA (Covox / порт LPT)</text>
<rect x="150.0" y="123.0" width="130.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="215.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">CPU</tspan><tspan x="215.0" dy="16.9">(8086 / 286)</tspan></text>
<rect x="150.0" y="236.2" width="130.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">PCM-буфер</tspan><tspan x="215.0" dy="15.6">(RAM)</tspan></text>
<rect x="150.0" y="344.0" width="130.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">DAC / динамік</tspan></text>
<line x1="215.0" y1="176.0" x2="215.0" y2="237.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="223.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">читає байт</text>
<line x1="215.0" y1="283.0" x2="215.0" y2="344.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="223.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">OUT port</text>
<rect x="135.0" y="72.7" width="160.0" height="34.7" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.2"/><text x="215.0" y="87.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">~8 000 циклів/с</tspan><tspan x="215.0" dy="11.7">→ 8% CPU @ 10 МГц</tspan></text>
<line x1="430.0" y1="70.0" x2="430.0" y2="430.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="645.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З DMA (Sound Blaster)</text>
<rect x="580.0" y="123.0" width="130.0" height="53.9" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="2.0"/><text x="645.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">CPU</tspan><tspan x="645.0" dy="16.9">(вільний!)</tspan></text>
<rect x="580.0" y="236.2" width="130.0" height="47.6" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">DMA 8237</tspan><tspan x="645.0" dy="15.6">канал 1</tspan></text>
<rect x="580.0" y="344.0" width="130.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">DAC / динамік</tspan></text>
<line x1="645.0" y1="283.0" x2="645.0" y2="344.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="653.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">DREQ/DACK</text>
<line x1="645.0" y1="176.0" x2="645.0" y2="237.0" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="653.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">програмує
(один раз)</text>
<rect x="545.0" y="72.7" width="200.0" height="34.7" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.2"/><text x="645.0" y="87.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">&lt; 1% CPU</tspan><tspan x="645.0" dy="11.7">(тільки ISR на кінець буфера)</tspan></text>
<rect x="100.0" y="421.0" width="660.0" height="30.0" rx="6" fill="#f0f4ff" stroke="#4a6fa5" stroke-width="1.5"/><text x="430.0" y="439.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">DMA передає байти автономно: CPU отримує переривання ЛИШЕ коли буфер закінчився</tspan></text>
</svg>