<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому прошивку не можна писати поверх себе</text>
<rect x="267.4" y="99.0" width="185.1" height="61.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="360.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">поточна прошивка</tspan><tspan x="360.0" dy="16.9">▶ виконується зараз</tspan></text>
<line x1="110.0" y1="130.0" x2="263.4" y2="130.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="110.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">пишемо нове</text>
<text x="512.6" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text>
<text x="512.6" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«цеглина»</text>
<rect x="70.0" y="214.0" width="580.0" height="60.0" rx="6" fill="#fdf6e3" stroke="#6b7280" stroke-width="1.4"/><text x="360.0" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Потрібне ДРУГЕ місце: писати новий образ туди,</tspan><tspan x="360.0" dy="15.6">не чіпаючи того, що зараз працює.</tspan></text>
</svg>