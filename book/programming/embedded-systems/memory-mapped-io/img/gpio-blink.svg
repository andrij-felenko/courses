<text x="535.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">світлодіод горить</text>
<text x="460.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоб згасити — OUT &amp;= ~(1&lt;&lt;2). Саме це робить digitalWrite(2, HIGH) усередині.</text>
