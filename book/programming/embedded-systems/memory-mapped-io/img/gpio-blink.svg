 Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3</text><rect x="510.0" y="220.0" width="50.0" height="44.0" rx="2" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.8"/><text x="535.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><text x="535.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2</text><rect x="560.0" y="220.0" width="50.0" height="44.0" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="585.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text><text x="585.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1</text><rect x="610.0" y="220.0" width="50.0" height="44.0" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="635.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text><text x="635.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0</text>
