<svg xmlns="http://www.w3.org/2000/svg" viewBox="-73.12 -10 1219.76 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-73.12" y="-10" width="1219.76" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр моделей консистентності: від суворих гарантій до високої доступності</text>
<line x1="60.0" y1="600.0" x2="60.0" y2="70.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сила гарантій / Ціна координації (RTT)</text>
<line x1="1020.0" y1="70.0" x2="1020.0" y2="600.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1020.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Доступність (HA) / Швидкість відгуку</text>
<rect x="110.0" y="80.0" width="860.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="126.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Сувора серіалізовність (Strict Serializability / External Consistency)</text>
<text x="126.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Транзакційна ізоляція Serializable + Лінеаризовність операцій у фізичному часі.</text>
<text x="126.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Приклади: Google Spanner (TrueTime), CockroachDB.</text>
<rect x="110.0" y="170.0" width="860.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="126.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Лінеаризовність (Linearizability / Strong Consistency)</text>
<text x="126.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Одиночні операції над одним об'єктом. Кожна операція фіксується в точці лінеаризації в реальному часі.</text>
<text x="126.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Композиційна властивість. Приклади: Raft (etcd), Paxos, ZAB (ZooKeeper sync-writes).</text>
<rect x="110.0" y="260.0" width="860.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.8"/>
<text x="126.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="start" font-weight="700">Послідовна консистентність (Sequential Consistency, Lamport 1979)</text>
<text x="126.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Існує єдиний глобальний порядок для всіх вузлів, що зберігає локальний порядок процесів.</text>
<text x="126.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Не вимагає реального часу. Не має властивості композиційності.</text>
<rect x="110.0" y="350.0" width="860.0" height="72.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.8"/>
<text x="126.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="start" font-weight="700">Причинна консистентність (Causal Consistency / Causal+)</text>
<text x="126.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зберігає зв'язки «спричинено раніше» (happens-before, a → b). Конкурентні оновлення дозволені.</text>
<text x="126.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Найсильніша модель, досяжна при повній доступності (AP). Приклади: COPS, Bolt-on.</text>
<rect x="110.0" y="440.0" width="860.0" height="72.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.8"/>
<text x="126.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="start" font-weight="700">Сесійні гарантії (Session Consistency: RYW, Monotonic Reads/Writes)</text>
<text x="126.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Гарантії для окремого клієнта в межах його сесії. Різні клієнти можуть бачити розбіжності.</text>
<text x="126.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Приклади: Azure Cosmos DB (Session), MongoDB (causal sessions).</text>
<rect x="110.0" y="530.0" width="860.0" height="72.0" rx="6" fill="#fdecea" stroke="#27ae60" stroke-width="1.8"/>
<text x="126.0" y="554.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Кінцева узгодженість (Eventual Consistency / SEC через CRDT)</text>
<text x="126.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">За відсутності нових записів усі репліки збігаються до однакового стану.</text>
<text x="126.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Мінімальна латентність читання/запису. Приклади: DynamoDB, Cassandra (ONE), Amazon S3.</text>
<line x1="540.0" y1="154.0" x2="540.0" y2="168.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="244.0" x2="540.0" y2="258.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="334.0" x2="540.0" y2="348.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="424.0" x2="540.0" y2="438.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="514.0" x2="540.0" y2="528.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160.0" y="626.0" width="760.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="540.0" y="645.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Правило вибору: кожне посилення гарантій консистентності вимагає синхронних мережевих раундів (RTT),</tspan><tspan x="540.0" dy="13.7">знижуючи стійкість системи до мережевих розділень (CAP-теорема).</tspan></text>
</svg>