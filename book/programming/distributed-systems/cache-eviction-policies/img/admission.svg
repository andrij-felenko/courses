<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двобій на вході: чи заслуговує новачок місця більше за жертву</text>
<rect x="64.5" y="101.0" width="191.0" height="57.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="160.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">кандидат K9</tspan><tspan x="160.0" dy="16.9">щойно прочитали з бази</tspan></text>
<rect x="79.3" y="271.1" width="161.4" height="57.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="160.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">жертва за LRU: K3</tspan><tspan x="160.0" dy="16.9">найдовше не питали</tspan></text>
<rect x="400.0" y="165.0" width="250.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="525.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">оцінювач частоти</tspan><tspan x="525.0" dy="16.9">пам'ятає довшу історію,</tspan><tspan x="525.0" dy="16.9">ніж уміщає кеш</tspan></text>
