<rect x="717.1" y="260.0" width="145.7" height="40.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="790.0" y="284.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">K3 ≈ 7 звернень</tspan></text>
