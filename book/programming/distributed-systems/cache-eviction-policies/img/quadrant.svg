<rect x="20.0" y="353.1" width="130.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="85.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">мало</tspan><tspan x="85.0" dy="16.9">звернень</tspan></text>
<rect x="175.0" y="120.0" width="380.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="365.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">гарячий із паузою — або мертва зірка</tspan><tspan x="365.0" dy="18.2">LRU: викине   ·   LFU: лишить</tspan><tspan x="365.0" dy="18.2">одного сигналу тут замало</tspan></text>
<rect x="585.0" y="120.0" width="380.0" height="160.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="775.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">стабільно гарячий</tspan><tspan x="775.0" dy="18.2">LRU: лишить   ·   LFU: лишить</tspan><tspan x="775.0" dy="18.2">обидві мають рацію</tspan></text>
<rect x="175.0" y="300.0" width="380.0" height="160.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="365.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">давно й майже не потрібен</tspan><tspan x="365.0" dy="18.2">LRU: викине   ·   LFU: викине</tspan><tspan x="365.0" dy="18.2">обидві мають рацію</tspan></text>
<rect x="585.0" y="300.0" width="380.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="775.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">щойно прочитаний під час скану</tspan><tspan x="775.0" dy="18.2">LRU: лишить   ·   LFU: викине</tspan><tspan x="775.0" dy="18.2">одного сигналу тут замало</tspan></text>
<text x="505.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Дві червоні клітинки — це і є характерні помилки кожної політики.</text>
