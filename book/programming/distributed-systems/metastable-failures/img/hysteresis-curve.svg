<text x="145.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">(дроп до L &amp;lt; L_rec)</text>
<rect x="356.4" y="245.9" width="327.2" height="88.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="520.0" dy="0.0">ПАСТКА ГІСТЕРЕЗИСУ:</tspan><tspan x="520.0" dy="14.3">При поверненні навантаження з L_crit до L_nominal</tspan><tspan x="520.0" dy="14.3">система НЕ повертається на робочу гілку!</tspan><tspan x="520.0" dy="14.3">Вона застрягає в точці краху (Goodput ≈ 0),</tspan><tspan x="520.0" dy="14.3">доки трафік не зріжуть нижче порогу L_rec.</tspan></text>
</svg>