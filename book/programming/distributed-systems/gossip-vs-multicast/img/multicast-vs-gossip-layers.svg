<text x="55.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дублювання в кремнії (ASIC) на швидкості дроту</text>
<text x="55.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Затримка: 1 переліт (фізичний ліміт оптоволокна)</text>
<text x="55.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Вузьке місце: обмежена пам'ять TCAM у роутерах</text>
<text x="55.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Блокується публічним Інтернетом та SDN хмари</text>
<text x="55.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ненадійний UDP: втрата потребує NAK у застосунку</text>
<text x="55.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Динамічне членство перевантажує площину PIM</text>
<text x="55.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Використання: біржові канали (HFT), локальні LAN</text>
