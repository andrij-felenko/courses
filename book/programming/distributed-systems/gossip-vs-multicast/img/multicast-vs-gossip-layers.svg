<text x="495.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Затримка: O(log N) раундів епідемічного обміну</text>
<text x="495.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Нульовий стан у роутерах: мережа — «тупа труба»</text>
<text x="495.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Проходить крізь NAT, WAN, хмари (AWS/GCP/K8s)</text>
<text x="495.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ймовірнісна надійність: стійкість до втрат і крахів</text>
<text x="495.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Членство: легке масштабування до 100 000+ вузлів</text>
<text x="495.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Використання: кластери Cassandra, Consul, Dynamo</text>
