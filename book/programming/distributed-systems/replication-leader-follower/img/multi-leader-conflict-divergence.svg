<rect x="80.0" y="410.0" width="940.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="430.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">СТРАТЕГІЇ ЗБІЖНОСТІ (CONVERGENCE):</tspan><tspan x="550.0" dy="13.7">1. Last-Write-Wins (LWW): Перемагає більший таймстемп (ризик: похибка годинників NTP стирає дані безслідно)</tspan><tspan x="550.0" dy="13.7">2. CRDT (Conflict-Free Replicated Data Types): Детерміністичне об'єднання за математичною напівґраткою (Lattice Join)</tspan><tspan x="550.0" dy="13.7">3. Conflict Avoidance: Маршрутизація всіх записів конкретного користувача в єдиний визначений датацентр</tspan></text>
