<rect x="55.0" y="280.0" width="480.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Послідовність кроків:</tspan><tspan x="295.0" dy="13.7">1. Координатор зчитує стан з R=3 вузлів</tspan><tspan x="295.0" dy="13.7">2. Виявляє розходження версій: Вузол 3 має застарілу v2</tspan><tspan x="295.0" dy="13.7">3. Клієнту негайно повертається свіже значення v3</tspan><tspan x="295.0" dy="13.7">4. У фоновому режимі надсилається дельта v3 на Вузол 3,</tspan><tspan x="295.0" dy="13.7">   оновлюючи його стан без участі оператора</tspan></text>
