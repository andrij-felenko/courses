<rect x="605.0" y="300.0" width="480.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Послідовність кроків:</tspan><tspan x="845.0" dy="13.7">1. Цільовий вузол репліки A недоступний через збій мережі</tspan><tspan x="845.0" dy="13.7">2. Сусідній вузол X погоджується тимчасово зберегти мутацію</tspan><tspan x="845.0" dy="13.7">   у спеціальній локальній черзі натяків (Hints Queue)</tspan><tspan x="845.0" dy="13.7">3. Коли Gossip-протокол сигналізує, що вузол A ожив,</tspan><tspan x="845.0" dy="13.7">   вузол X вивантажує накопичені дельти на вузол A</tspan></text>
