<rect x="620.0" y="140.0" width="120.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Клієнт</tspan><tspan x="680.0" dy="14.3">(Запис v4)</tspan></text>
<rect x="775.0" y="140.0" width="135.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="842.5" y="159.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="842.5" dy="0.0">Вузол A (Цільовий)</tspan><tspan x="842.5" dy="13.7">🔴 ТИМЧАСОВО ВПАВ</tspan></text>
