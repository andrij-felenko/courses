<text x="590.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">При переході в DRAINING роутери миттєво припиняють направляти нових орендарів, дозволяючи поточним завершити роботу.</text>
