<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ТРИФАЗНИЙ КОНВЕЄР: Розділення чистого транзакційного рішення та зовнішніх сайд-ефектів</tspan></text>
<rect x="50.0" y="85.0" width="350.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="225.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ФАЗА 1: ЧИСТЕ РІШЕННЯ</tspan><tspan x="225.0" dy="16.9">Локальна ACID-транзакція</tspan></text>
<rect x="50.0" y="155.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="225.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">1. Отримано подію: OrderCharged {id: 42, sum: 500}</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">2. BEGIN TRANSACTION (PostgreSQL):</tspan><tspan x="225.0" dy="14.3">   - INSERT INTO inbox (msg_id, status)</tspan><tspan x="225.0" dy="14.3">     VALUES ('msg-42', 'PENDING_CALL')</tspan><tspan x="225.0" dy="14.3">     ON CONFLICT DO NOTHING;</tspan><tspan x="225.0" dy="14.3">   - Розрахунок детермінованого токена:</tspan><tspan x="225.0" dy="14.3">     idemp_key = hash(msg_id, 'stripe_charge')</tspan><tspan x="225.0" dy="14.3">   - Запис наміру в outbox / intent-лог;</tspan><tspan x="225.0" dy="14.3">3. COMMIT;</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">Результат: Намір зафіксовано в БД.</tspan></text>
<rect x="50.0" y="405.0" width="350.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="225.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ТОЧКА ЗБОЮ 1 (Крах до виклику API):</tspan><tspan x="225.0" dy="14.3">База пам'ятає стан PENDING_CALL.</tspan><tspan x="225.0" dy="14.3">При повторі споживач бачить намір</tspan><tspan x="225.0" dy="14.3">і безпечно переходить до Фази 2.</tspan></text>
<line x1="405.0" y1="275.0" x2="420.0" y2="275.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="425.0" y="85.0" width="350.0" height="60.0" rx="6" fill="#fff8e1" stroke="#d4ac0d" stroke-width="2.0"/><text x="600.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ФАЗА 2: САЙД-ЕФЕКТ</tspan><tspan x="600.0" dy="16.9">Мережевий виклик стороннього API</tspan></text>
<rect x="425.0" y="155.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.4"/><text x="600.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Формування HTTP POST до Stripe / SMS-шлюзу:</tspan><tspan x="600.0" dy="14.3">   Headers: Idempotency-Key = idemp_key</tspan><tspan x="600.0" dy="14.3">   Body: {amount: 500, currency: 'UAH'}</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">2. Виконання мережевого запиту:</tspan><tspan x="600.0" dy="14.3">   - Зовнішній сервіс отримує запит.</tspan><tspan x="600.0" dy="14.3">   - Якщо запит повторний (за idemp_key),</tspan><tspan x="600.0" dy="14.3">     сервіс повертає кешований результат,</tspan><tspan x="600.0" dy="14.3">     НЕ списуючи кошти вдруге!</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">3. Отримано відповідь: charge_id = 'ch_9912'.</tspan></text>
<rect x="425.0" y="405.0" width="350.0" height="90.0" rx="6" fill="#fff8e1" stroke="#d4ac0d" stroke-width="1.2"/><text x="600.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ТОЧКА ЗБОЮ 2 (Крах під час/після виклику):</tspan><tspan x="600.0" dy="14.3">Списання відбулося, але ACK брокеру не пішов.</tspan><tspan x="600.0" dy="14.3">Новий воркер викличе Stripe з ТИМ САМИМ</tspan><tspan x="600.0" dy="14.3">idemp_key → Stripe НЕ зніме гроші вдруге!</tspan></text>
<line x1="780.0" y1="275.0" x2="795.0" y2="275.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="800.0" y="85.0" width="350.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="975.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">ФАЗА 3: ФІНАЛІЗАЦІЯ</tspan><tspan x="975.0" dy="16.9">Закріплення стану та ACK брокеру</tspan></text>
<rect x="800.0" y="155.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="975.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">1. BEGIN TRANSACTION (PostgreSQL):</tspan><tspan x="975.0" dy="14.3">   - UPDATE inbox SET status = 'COMPLETED',</tspan><tspan x="975.0" dy="14.3">     external_ref = 'ch_9912'</tspan><tspan x="975.0" dy="14.3">     WHERE msg_id = 'msg-42';</tspan><tspan x="975.0" dy="14.3">   - UPDATE orders SET status = 'PAID'</tspan><tspan x="975.0" dy="14.3">     WHERE id = 42;</tspan><tspan x="975.0" dy="14.3">2. COMMIT;</tspan><tspan x="975.0" dy="14.3"></tspan><tspan x="975.0" dy="14.3">3. Підтвердження повідомлення в брокері:</tspan><tspan x="975.0" dy="14.3">   - consumer.commit_offset('msg-42')</tspan><tspan x="975.0" dy="14.3">   - Брокер просуває вказівник зчитування.</tspan></text>
<rect x="800.0" y="405.0" width="350.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="975.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">ТОЧКА ЗБОЮ 3 (Крах до commit offset):</tspan><tspan x="975.0" dy="14.3">Брокер пересилає подію знову. Споживач</tspan><tspan x="975.0" dy="14.3">бачить status='COMPLETED' у базі даних,</tspan><tspan x="975.0" dy="14.3">пропускає кроки 1-2 і шле ACK брокеру.</tspan></text>
<rect x="50.0" y="520.0" width="1100.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="543.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ФУНДАМЕНТАЛЬНЕ ПРАВИЛО ЗОВНІШНІХ ЕФЕКТІВ:</tspan><tspan x="600.0" dy="15.6">Неможливо включити сторонній HTTP/gRPC сервіс у локальну транзакцію бази даних.</tspan><tspan x="600.0" dy="15.6">Єдиний надійний спосіб — генерація детермінованого токена ідемпотентності на Фазі 1 та передача його зовнішньому API на Фазі 2.</tspan></text>
</svg>