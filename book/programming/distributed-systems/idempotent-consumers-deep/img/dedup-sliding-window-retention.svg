<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">АНАТОМІЯ ВІКНА ДЕДУПЛІКАЦІЇ: межі зберігання ключів, очищення TTL та загроза пізніх дублів</tspan></text>
<rect x="50.0" y="80.0" width="1100.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЧАСОВА ШКАЛА ЖИТТЄВОГО ЦИКЛУ ПОВІДОМЛЕНЬ І ВІКНА ДЕДУПЛІКАЦІЇ (Tw)</tspan></text>
<line x1="80.0" y1="150.0" x2="1120.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1130.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Час (t)</text>
<rect x="80.0" y="130.0" width="260.0" height="40.0" rx="6" fill="#f0f0f0" stroke="#cccccc" stroke-width="1.0"/>
<text x="210.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Очищена історія (TTL сплив)</text>
<rect x="340.0" y="125.0" width="520.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">АКТИВНЕ ВІКНО ДЕДУПЛІКАЦІЇ (Tw = T_broker + T_lag + T_jitter)</text>
<rect x="860.0" y="130.0" width="240.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="980.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Поточний час (t_now) / Нові події</text>
<line x1="340.0" y1="120.0" x2="340.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="340.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Межа витіснення (t_now - Tw)</text>
<line x1="860.0" y1="120.0" x2="860.0" y2="180.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="860.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Поточний момент t_now</text>
<rect x="50.0" y="230.0" width="530.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="315.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">СЦЕНАРІЙ 1: Дублікат прибуває ВСЕРЕДИНІ вікна (t ∈ Tw)</tspan></text>
<rect x="50.0" y="290.0" width="530.0" height="140.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="315.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">1. Повідомлення ID=8492 вперше оброблено в момент t_0.</tspan><tspan x="315.0" dy="14.3">2. Ключ 'msg:8492' збережено в inbox-таблиці з TTL = 7 діб.</tspan><tspan x="315.0" dy="14.3">3. Мережевий таймаут брокера пересилає дублікат через 12 секунд.</tspan><tspan x="315.0" dy="14.3">4. Споживач перевіряє inbox: ключ знайдено!</tspan><tspan x="315.0" dy="14.3">5. ДІЯ: Мутація пропускається, відправляється швидкий ACK.</tspan><tspan x="315.0" dy="14.3">Результат: Стан системи цілісний, бізнес-ефект однократний.</tspan></text>
<rect x="50.0" y="440.0" width="530.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="315.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">ВИСНОВОК: Поки дублікат вкладається у вікно Tw, дедуплікація</tspan><tspan x="315.0" dy="15.0">працює детерміновано без додаткових обмежень.</tspan></text>
<rect x="620.0" y="230.0" width="530.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="885.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">СЦЕНАРІЙ 2: Пізній дублікат ПОЗА вікном (t &lt; t_now - Tw)</tspan></text>
<rect x="620.0" y="290.0" width="530.0" height="140.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="885.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">1. Повідомлення ID=1020 оброблено 10 днів тому (TTL=7 діб сплив).</tspan><tspan x="885.0" dy="14.3">2. Фоновий процес вичистив ключ 'msg:1020' для економії пам'яті.</tspan><tspan x="885.0" dy="14.3">3. Інженер повторно програє збійну чергу (Dead Letter Queue replay).</tspan><tspan x="885.0" dy="14.3">4. Споживач перевіряє inbox: запис ВІДСУТНІЙ (хибно-нове!).</tspan><tspan x="885.0" dy="14.3">5. ДІЯ: Споживач виконує списання вдруге!</tspan><tspan x="885.0" dy="14.3">Результат: Подвійне списання коштів, фінансова розбіжність.</tspan></text>
<rect x="620.0" y="440.0" width="530.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="885.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">ЗАХИСТ ВІД ПІЗНІХ ДУБЛІВ: Монотонні контрольні точки (версії/епохи)</tspan><tspan x="885.0" dy="15.0">або детерміноване узгодження з журналом подій джерела.</tspan></text>
<rect x="50.0" y="575.0" width="1100.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="601.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЗОЛОТЕ ПРАВИЛО ВІКНА ДЕДУПЛІКАЦІЇ:</tspan><tspan x="600.0" dy="15.6">Тривалість вікна Tw мусить перевищувати максимальний час утримання повідомлень у брокері (Broker Retention)</tspan><tspan x="600.0" dy="15.6">+ максимальний допустимий лаг відновлення споживача + розбіжність мережевих годинників.</tspan></text>
</svg>