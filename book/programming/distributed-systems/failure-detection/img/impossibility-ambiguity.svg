<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальна невизначеність: 4 фізичні причини однакового мовчання</text>
<rect x="25.0" y="55.0" width="230.0" height="400.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="140.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Спостерігач (Node A)</text>
<rect x="45.0" y="114.0" width="190.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Надсилання зонда</tspan><tspan x="140.0" dy="13.0">(Ping / Heartbeat)</tspan><tspan x="140.0" dy="13.0">Фіксація таймера t = 0</tspan></text>
<line x1="140.0" y1="180.0" x2="140.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="232.5" width="190.0" height="65.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Таймаут T сплив!</tspan><tspan x="140.0" dy="13.0">Відповіді немає.</tspan><tspan x="140.0" dy="13.0">Симптом: ПОВНЕ</tspan><tspan x="140.0" dy="13.0">МОВЧАННЯ СОКЕТА</tspan></text>
<line x1="140.0" y1="315.0" x2="140.0" y2="355.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="374.0" width="190.0" height="52.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="140.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Дилема рішення:</tspan><tspan x="140.0" dy="13.0">Оголосити DEAD чи</tspan><tspan x="140.0" dy="13.0">продовжувати чекати?</tspan></text>
<line x1="240.0" y1="265.0" x2="290.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.0" y="55.0" width="690.0" height="400.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="630.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична реальність віддаленого вузла (Node B) та мережі</text>
<rect x="300.0" y="98.0" width="660.0" height="68.0" rx="5" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="315.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Аварійна зупинка (Crash-Stop)</text>
<text x="315.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">Вимкнення живлення, крах ядра ОС (Kernel Panic), апаратний збій.</tspan><tspan x="315.0" dy="11.9">Вузол фізично мертвий і більше ніколи не відповість самостійно.</tspan></text>
<rect x="300.0" y="183.0" width="660.0" height="68.0" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="315.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">2. Втрата пакетів у мережі (Packet Loss)</text>
<text x="315.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">Переповнення буфера черги комутатора, CRC-помилка, скидання SYN/ACK.</tspan><tspan x="315.0" dy="11.9">Вузол B живий і працює, але пакет запиту або відповіді знищено.</tspan></text>
<rect x="300.0" y="268.0" width="660.0" height="68.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="315.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">3. Тимчасова пауза процесу (GC / CPU Stall)</text>
<text x="315.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">Stop-The-World пауза збирача сміття на 4 секунди, swap-шторм на диску.</tspan><tspan x="315.0" dy="11.9">Вузол B живий, але потік виконання тимчасово заморожений OS.</tspan></text>
<rect x="300.0" y="353.0" width="660.0" height="68.0" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="315.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">4. Аномальна затримка мережі (Extreme Jitter)</text>
<text x="315.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">Маршрутизатор перенаправив трафік довшим резервним каналом.</tspan><tspan x="315.0" dy="11.9">Затримка RTT зросла з 20 мс до 3500 мс; пакет живий і повільно рухається.</tspan></text>
</svg>