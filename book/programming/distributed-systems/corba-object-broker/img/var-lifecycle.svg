<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Посилання на об'єкт: три типи й одна власність</text>
<text x="200.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">A_ptr</text>
<rect x="40.0" y="70.0" width="320.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="200.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">сире посилання</tspan><tspan x="200.0" dy="16.9">не звільняє нічого само</tspan><tspan x="200.0" dy="16.9">порівнювати == не можна</tspan></text>
<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">A_var</text>
<rect x="370.0" y="70.0" width="320.0" height="86.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="530.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">обгортка з деструктором</tspan><tspan x="530.0" dy="16.9">release() на виході з області</tspan><tspan x="530.0" dy="16.9">in() inout() out() _retn()</tspan></text>
<text x="860.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">A_out</text>
<rect x="700.0" y="70.0" width="320.0" height="86.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/><text x="860.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">тип лише для out-параметра</tspan><tspan x="860.0" dy="16.9">звільняє попереднє значення</tspan><tspan x="860.0" dy="16.9">перед тим, як покласти нове</tspan></text>
<text x="530.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що робить присвоєння</text>
<rect x="40.0" y="214.0" width="380.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="230.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">A_var v(p);</tspan></text>
<line x1="430.0" y1="242.0" x2="468.0" y2="242.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478.0" y="214.0" width="542.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="749.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="749.0" dy="0.0">переймає власність p — release зробить тільки v</tspan></text>
<rect x="40.0" y="282.0" width="380.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="230.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">A_var v2(v);</tspan></text>
<line x1="430.0" y1="310.0" x2="468.0" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478.0" y="282.0" width="542.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/><text x="749.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="749.0" dy="0.0">_duplicate — два незалежні власники, два release</tspan></text>
<rect x="40.0" y="350.0" width="380.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="230.0" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">A_ptr q = v;</tspan></text>
<line x1="430.0" y1="378.0" x2="468.0" y2="378.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478.0" y="350.0" width="542.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="749.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="749.0" dy="0.0">звуження без копії — власником лишається v</tspan></text>
<rect x="40.0" y="418.0" width="380.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="230.0" y="450.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">A_ptr r = v._retn();</tspan></text>
<line x1="430.0" y1="446.0" x2="468.0" y2="446.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478.0" y="418.0" width="542.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="749.0" y="450.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="749.0" dy="0.0">v віддає власність назовні й стає порожнім</tspan></text>
<rect x="40.0" y="500.0" width="980.0" height="66.0" rx="6" fill="#fffdf3" stroke="#d8c98a" stroke-width="1.6"/><text x="530.0" y="529.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Конструктор від сирого _ptr переймає власність, конструктор від іншого _var — дублює.</tspan><tspan x="530.0" dy="17.6">Ці два рядки виглядають однаково, а роблять протилежне: звідси і подвійні звільнення, і витоки.</tspan></text>
</svg>