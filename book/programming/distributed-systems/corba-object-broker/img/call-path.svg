<rect x="70.0" y="448.0" width="920.0" height="74.0" rx="6" fill="#fffdf3" stroke="#d8c98a" stroke-width="1.6"/><text x="530.0" y="472.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Ілюзія народжується рівно на двох стиках: стаб перетворює виклик на повідомлення,</tspan><tspan x="530.0" dy="17.6">скелет перетворює повідомлення на виклик. Усе, що лежить між ними, —</tspan><tspan x="530.0" dy="17.6">звичайна ненадійна мережа, і жоден із цих двох стиків її не скасовує.</tspan></text>
