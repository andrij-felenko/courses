<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто виділяє пам'ять і хто її звільняє</text>
<text x="265.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">у клієнта — того, хто кличе</text>
<text x="815.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">у серванта — того, кого кличуть</text>
<rect x="50.0" y="84.0" width="430.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="265.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">in — const char* / const S&amp;</tspan><tspan x="265.0" dy="16.9">пам'ять виділив клієнт</tspan><tspan x="265.0" dy="16.9">він же звільняє її після виклику</tspan></text>
<rect x="600.0" y="84.0" width="430.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="815.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">сервант лише читає</tspan><tspan x="815.0" dy="16.9">не звільняє нічого</tspan><tspan x="815.0" dy="16.9">хоче зберегти — копіює сам</tspan></text>
<text x="540.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">in</text>
<line x1="492.0" y1="148.0" x2="588.0" y2="148.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="224.0" width="430.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="265.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">inout — char*&amp;, S&amp;</tspan><tspan x="265.0" dy="16.9">рядок мусить бути зі string_alloc</tspan><tspan x="265.0" dy="16.9">не літерал і не масив у стеку</tspan></text>
<rect x="600.0" y="224.0" width="430.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="815.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">сервант може звільнити старий</tspan><tspan x="815.0" dy="16.9">і покласти новий указник</tspan><tspan x="815.0" dy="16.9">довжина не обмежена вхідною</tspan></text>
<text x="540.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">inout</text>
<line x1="492.0" y1="278.0" x2="588.0" y2="278.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="588.0" y1="300.0" x2="492.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="364.0" width="430.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="265.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">out / повернення — char*&amp;, S*&amp;, S*</tspan><tspan x="265.0" dy="16.9">клієнт отримує чужу пам'ять</tspan><tspan x="265.0" dy="16.9">і мусить звільнити її сам —</tspan><tspan x="265.0" dy="16.9">навіть коли сервант у тому ж процесі</tspan></text>
<rect x="600.0" y="364.0" width="430.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="815.0" y="403.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">сервант виділяє й віддає власність</tspan><tspan x="815.0" dy="16.9">разом зі значенням</tspan><tspan x="815.0" dy="16.9">нульовий указник повертати не можна</tspan></text>
<text x="540.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">out і повернення</text>
<line x1="588.0" y1="428.0" x2="492.0" y2="428.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="502.0" width="980.0" height="84.0" rx="6" fill="#fffdf3" stroke="#d8c98a" stroke-width="1.6"/><text x="540.0" y="531.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Власність завжди рухається в бік значення: хто отримав дані змінної довжини — той і звільняє.</tspan><tspan x="540.0" dy="17.6">Клієнт мусить звільнити повернене навіть тоді, коли сервант живе в тому самому процесі, —</tspan><tspan x="540.0" dy="17.6">інакше локальний і віддалений виклики поводилися б по-різному, і переїзд об'єкта ламав би код.</tspan></text>
</svg>