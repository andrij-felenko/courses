<rect x="140.0" y="540.0" width="940.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="610.0" y="565.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Згідно з теорією масового обслуговування (модель M/M/1), затримка зростає нелінійно.</tspan><tspan x="610.0" dy="16.9">Наближення до 100% завантаження неминуче перетворює будь-який сплеск трафіку на нескінченну чергу.</tspan><tspan x="610.0" dy="16.9">Контроль допуску штучно обмежує потік λ, щоб утримати робочу точку лівіше коліна затримки.</tspan></text>
</svg>