<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1255.25 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1255.25" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="20.0" width="1120.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="620.0" y="50.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Еволюція контролю допуску: від телефонії Ерланга до хмарних мікросервісів</tspan></text>
<line x1="100.0" y1="100.0" x2="1140.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="1120.0" y1="100.0" x2="1140.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">Час →</text>
<line x1="130.0" y1="92.0" x2="130.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="130.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1909</text>
<line x1="130.0" y1="108.0" x2="130.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="5.0" y="160.0" width="250.0" height="135.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/><text x="130.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1909: Агнер Ерланг</tspan><tspan x="130.0" dy="11.7">Формула блокування Erlang B для телефонних ліній.</tspan><tspan x="130.0" dy="11.7">Перша математична модель відмови при дефіциті каналів.</tspan></text>
<line x1="330.0" y1="92.0" x2="330.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="330.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1985</text>
<line x1="330.0" y1="108.0" x2="330.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="205.0" y="360.0" width="250.0" height="135.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="330.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">1980-ті: Мережі ATM і CAC</tspan><tspan x="330.0" dy="11.7">Call Admission Control (CAC) і Leaky Bucket.</tspan><tspan x="330.0" dy="11.7">Гарантія якості (QoS) для віртуальних каналів зв'язку.</tspan></text>
<line x1="530.0" y1="92.0" x2="530.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="530.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1997</text>
<line x1="530.0" y1="108.0" x2="530.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="405.0" y="160.0" width="250.0" height="135.0" rx="6" fill="#fbf4db" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">1997: RSVP та IntServ (RFC 2205)</tspan><tspan x="530.0" dy="11.7">Резервування смуги пропускання на маршрутизаторах.</tspan><tspan x="530.0" dy="11.7">Складна сигналізація поступилася DiffServ і дропанню пакетів.</tspan></text>
<line x1="730.0" y1="92.0" x2="730.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="730.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2012</text>
<line x1="730.0" y1="108.0" x2="730.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="605.0" y="360.0" width="250.0" height="135.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/><text x="730.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">2012: CoDel і Bufferbloat</tspan><tspan x="730.0" dy="11.7">Kathie Nichols, Van Jacobson (ACM Queue).</tspan><tspan x="730.0" dy="11.7">Контроль затримки в черзі (Sojourn time) замість розміру черги.</tspan></text>
<line x1="930.0" y1="92.0" x2="930.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="930.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2016</text>
<line x1="930.0" y1="108.0" x2="930.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="805.0" y="160.0" width="250.0" height="135.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/><text x="930.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">2016: Google SRE Adaptive Throttling</tspan><tspan x="930.0" dy="11.7">Клієнтський і серверний адаптивний тротлінг.</tspan><tspan x="930.0" dy="11.7">Імовірнісне скидання запитів без перевантаження бекенду.</tspan></text>
<line x1="1080.0" y1="92.0" x2="1080.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="1080.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2018</text>
<line x1="1080.0" y1="108.0" x2="1080.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="955.0" y="360.0" width="250.0" height="135.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="1080.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">2018+: Netflix Concurrency Limits</tspan><tspan x="1080.0" dy="11.7">Алгоритми TCP Vegas і Gradient у сервісних сітках.</tspan><tspan x="1080.0" dy="11.7">Автоматичне визначення лімітів конкурентності без статичних конфігів.</tspan></text>
<rect x="60.0" y="560.0" width="1120.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="620.0" y="594.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Головний історичний урок: жорсткі статичні ліміти та попереднє резервування (ATM / RSVP)</tspan><tspan x="620.0" dy="16.9">виявилися надто крихкими для масштабованих мереж. Сучасний підхід поєднує динамічний моніторинг черг</tspan><tspan x="620.0" dy="16.9">(CoDel / Sojourn time), адаптивні алгоритми пошуку пропускної здатності (TCP Vegas / Gradient)</tspan><tspan x="620.0" dy="16.9">та узгоджений захист на стороні клієнта і сервера (SRE Throttling).</tspan></text>
</svg>