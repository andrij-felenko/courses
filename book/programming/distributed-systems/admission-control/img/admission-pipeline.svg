<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="260.0" width="160.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="140.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">ВХІДНИЙ ЗАПИТ</tspan><tspan x="140.0" dy="16.2"></tspan><tspan x="140.0" dy="16.2">- Пріоритет</tspan><tspan x="140.0" dy="16.2">- Дедлайн (TTL)</tspan><tspan x="140.0" dy="16.2">- Ідентифікатор</tspan></text>
<line x1="220.0" y1="315.0" x2="275.0" y2="315.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="230.0" width="200.0" height="170.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="320.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">1. КЛАСИФІКАЦІЯ</tspan><tspan x="320.0" dy="11.7">І ПРІОРИТЕТ</tspan><tspan x="320.0" dy="11.7"></tspan><tspan x="320.0" dy="11.7">Критичний / Звичайний / Фоновий трафік;</tspan><tspan x="320.0" dy="11.7">Квоти споживачів</tspan></text>
<line x1="300.0" y1="400.0" x2="300.0" y2="510.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="315.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="315.0" dy="0.0">Низький пріоритет</tspan><tspan x="315.0" dy="14.3">при стресі</tspan></text>
<line x1="420.0" y1="315.0" x2="480.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="485.0" y="230.0" width="210.0" height="170.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="590.0" y="278.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">2. ЧАС ОЧІКУВАННЯ</tspan><tspan x="590.0" dy="16.2">(Sojourn Time)</tspan><tspan x="590.0" dy="16.2"></tspan><tspan x="590.0" dy="16.2">Чи встигне запис</tspan><tspan x="590.0" dy="16.2">до дедлайну клієнта?</tspan><tspan x="590.0" dy="16.2">T_wait + T_exec &lt; T_ttl</tspan></text>
<line x1="565.0" y1="400.0" x2="565.0" y2="510.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="580.0" dy="0.0">Очікування &gt; TTL</tspan><tspan x="580.0" dy="14.3">(запізно)</tspan></text>
<line x1="695.0" y1="315.0" x2="755.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="230.0" width="210.0" height="170.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="865.0" y="289.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">3. ЛІМІТ ПОТОКІВ</tspan><tspan x="865.0" dy="15.0">(In-flight Limiter)</tspan><tspan x="865.0" dy="15.0"></tspan><tspan x="865.0" dy="15.0">Активних запитів &lt; L_limit</tspan><tspan x="865.0" dy="15.0">(Vegas / Gradient / AIMD)</tspan></text>
<line x1="840.0" y1="400.0" x2="840.0" y2="510.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="855.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="855.0" dy="0.0">Пул переповнено</tspan><tspan x="855.0" dy="14.3">(In-flight ≥ L)</tspan></text>
<line x1="970.0" y1="315.0" x2="1035.0" y2="315.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1040.0" y="245.0" width="150.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="1115.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1115.0" dy="0.0">ДОПУСК (Admit)</tspan><tspan x="1115.0" dy="11.7"></tspan><tspan x="1115.0" dy="11.7">Виділення потоку,</tspan><tspan x="1115.0" dy="11.7">робота з базою,</tspan><tspan x="1115.0" dy="11.7">успішна відповідь 200 OK</tspan></text>
<rect x="220.0" y="515.0" width="750.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="595.0" y="543.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">РАННЯ ВІДМОВА (Fast Drop):</tspan><tspan x="595.0" dy="16.2">HTTP 429 Too Many Requests / 503 Unavailable / gRPC RESOURCE_EXHAUSTED</tspan><tspan x="595.0" dy="16.2">Заголовок Retry-After + випадковий джитер. Витрати ресурсів процесора ≈ 0.</tspan></text>
<line x1="1115.0" y1="245.0" x2="1115.0" y2="110.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="1115.0" y1="110.0" x2="865.0" y2="110.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="865.0" y1="110.0" x2="865.0" y2="225.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="70.0" width="330.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="865.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">Зворотний зв'язок (Feedback loop):</tspan><tspan x="865.0" dy="13.7">затримка RTT і черги динамічно змінюють ліміт L</tspan></text>
<rect x="60.0" y="615.0" width="1130.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="625.0" y="638.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Контролер допуску працює як багатошаровий фільтр перед ресурсоємним ядром сервісу,</tspan><tspan x="625.0" dy="16.9">відсікаючи приречені та надлишкові запити до виділення пам'яті та потоків виконання.</tspan></text>
</svg>