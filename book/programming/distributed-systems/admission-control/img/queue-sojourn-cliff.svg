<rect x="40.0" y="408.0" width="235.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="157.5" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.5" dy="0.0">3. З контролем допуску</tspan><tspan x="157.5" dy="16.9">раннє скидання в черзі</tspan></text>
