<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="24.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="51.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">СПЕКТР ОПЕРАЦІЙ: від природної ідемпотентності до синтезованого стану</tspan></text>
<rect x="40.0" y="90.0" width="345.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="212.5" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="212.5" dy="0.0">ПРИРОДНО ІДЕМПОТЕНТНІ</tspan><tspan x="212.5" dy="16.9">структура дії зберігає стан</tspan></text>
<rect x="40.0" y="160.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="212.5" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Абсолютне присвоєння</tspan><tspan x="212.5" dy="15.6">x := 42</tspan><tspan x="212.5" dy="15.6">повтор залишає x = 42</tspan></text>
<rect x="40.0" y="246.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="212.5" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Булеві прапорці й tombstones</tspan><tspan x="212.5" dy="15.6">status := 'DELETED'</tspan><tspan x="212.5" dy="15.6">повтор не міняє ознаки</tspan></text>
<rect x="40.0" y="332.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="212.5" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Операції над множинами</tspan><tspan x="212.5" dy="15.6">S := S ∪ {user_id}</tspan><tspan x="212.5" dy="15.6">повтор не подвоює елемент</tspan></text>
<rect x="40.0" y="418.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="212.5" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Монотонний максимум</tspan><tspan x="212.5" dy="15.6">max_seen := max(max_seen, t)</tspan><tspan x="212.5" dy="15.6">повтор не збільшує число</tspan></text>
<rect x="420.0" y="90.0" width="345.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="592.5" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">НЕІДЕМПОТЕНТНІ ЗА СУТТЮ</tspan><tspan x="592.5" dy="16.9">кожен виклик міняє стан</tspan></text>
<rect x="420.0" y="160.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="592.5" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Відносні дельти та лічильники</tspan><tspan x="592.5" dy="15.6">balance := balance - 100</tspan><tspan x="592.5" dy="15.6">повтор краде ще 100 грн</tspan></text>
<rect x="420.0" y="246.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="592.5" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Додавання до списку / черги</tspan><tspan x="592.5" dy="15.6">list.append(order_item)</tspan><tspan x="592.5" dy="15.6">повтор подвоює товар</tspan></text>
<rect x="420.0" y="332.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="592.5" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Генерація сутностей</tspan><tspan x="592.5" dy="15.6">INSERT INTO orders ... (auto_id)</tspan><tspan x="592.5" dy="15.6">повтор створює дубль</tspan></text>
<rect x="420.0" y="418.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="592.5" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Побічні ефекти назовні</tspan><tspan x="592.5" dy="15.6">send_push_notification()</tspan><tspan x="592.5" dy="15.6">повтор дратує людину</tspan></text>
<rect x="800.0" y="90.0" width="345.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="972.5" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="972.5" dy="0.0">СИНТЕЗОВАНА ІДЕМПОТЕНТНІСТЬ</tspan><tspan x="972.5" dy="16.9">міст через токен і реєстр</tspan></text>
<rect x="800.0" y="160.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="972.5" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Детерміновані ключі</tspan><tspan x="972.5" dy="15.6">id := hash(buyer, order_ref)</tspan><tspan x="972.5" dy="15.6">INSERT IGNORE замість auto_id</tspan></text>
<rect x="800.0" y="246.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="972.5" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Автомат станів із лізою</tspan><tspan x="972.5" dy="15.6">IN_PROGRESS → COMMITTED</tspan><tspan x="972.5" dy="15.6">паралельні дублі блокуються</tspan></text>
<rect x="800.0" y="332.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="972.5" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Збереження відбитка запиту</tspan><tspan x="972.5" dy="15.6">хеш тіла звіряється на вході</tspan><tspan x="972.5" dy="15.6">захист від підміни параметрів</tspan></text>
<rect x="800.0" y="418.0" width="345.0" height="78.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="972.5" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Кешування результату</tspan><tspan x="972.5" dy="15.6">повтору віддається старий 200</tspan><tspan x="972.5" dy="15.6">без повторної мутації</tspan></text>
<rect x="40.0" y="555.0" width="1120.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="578.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">якщо операція не є ідемпотентною природно — її синтезують:</tspan><tspan x="600.0" dy="16.9">прив'язують до унікального токена запиту й проводять через транзакційний реєстр</tspan></text>
</svg>