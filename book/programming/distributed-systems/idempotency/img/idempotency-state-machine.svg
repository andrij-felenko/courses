<text x="590.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Витіснення застарілого запису після завершення вікна збереження (TTL)</text>
<rect x="40.0" y="580.0" width="1120.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="597.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">три правила надійного автомата:</tspan><tspan x="600.0" dy="16.2">1. Резервування ключа — строго атомарне через унікальне обмеження;</tspan><tspan x="600.0" dy="16.2">2. Паралельний дубль не виконує логіку двічі, а чекає чи повертає блокування;</tspan><tspan x="600.0" dy="16.2">3. Повтор після успіху повертає збережений результат без повторного виклику бізнес-шару</tspan></text>
</svg>