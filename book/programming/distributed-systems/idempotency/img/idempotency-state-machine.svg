<rect x="40.0" y="20.0" width="1120.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЖИТТЄВИЙ ЦИКЛ ТОКЕНА: атомарні переходи, блокування та повтори</tspan></text>
<rect x="60.0" y="120.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="160.0" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">НЕМАЄ ЗАПИСУ</tspan><tspan x="160.0" dy="17.6">новий запит</tspan></text>
<rect x="460.0" y="120.0" width="280.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="600.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">В ОБРОБЦІ (IN_PROGRESS)</tspan><tspan x="600.0" dy="16.9">взято блокування / лізу TTL</tspan><tspan x="600.0" dy="16.9">збережено хеш запиту</tspan></text>
<rect x="900.0" y="120.0" width="240.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.2"/><text x="1020.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">ЗАФІКСОВАНО (COMMITTED)</tspan><tspan x="1020.0" dy="16.9">збережено тіло відповіді</tspan><tspan x="1020.0" dy="16.9">операцію завершено</tspan></text>
<rect x="460.0" y="390.0" width="280.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЗБІЙ (FAILED)</tspan><tspan x="600.0" dy="16.9">тимчасова помилка</tspan><tspan x="600.0" dy="16.9">(можна повторити)</tspan></text>
