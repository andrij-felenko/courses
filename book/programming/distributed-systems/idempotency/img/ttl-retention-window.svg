<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1266.8 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1266.8" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ГОРИЗОНТ ЗБЕРЕЖЕННЯ КЛЮЧІВ: співвідношення TTL та клієнтських повторів</tspan></text>
<line x1="120.0" y1="150.0" x2="1060.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="1050.0" y1="150.0" x2="1060.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1060.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">Час →</text>
<line x1="160.0" y1="140.0" x2="160.0" y2="160.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">T₀ (Перший запит)</text>
<line x1="554.8" y1="140.0" x2="554.8" y2="160.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="554.8" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">T_retry (Крайній повтор клієнта)</text>
<line x1="836.8" y1="140.0" x2="836.8" y2="160.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="836.8" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T_ttl (Спливання TTL ключа)</text>
<rect x="160.0" y="175.0" width="676.8" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="498.4" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНА ЗОНА: ключ у пам'яті → повтори безпечні й ідемпотентні</text>
<rect x="836.8" y="175.0" width="193.2" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="933.4" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНА ЗОНА (ключ видалено)</text>
<rect x="160.0" y="245.0" width="420.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="370.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">СЦЕНАРІЙ А: повтор у межах вікна</tspan><tspan x="370.0" dy="15.6"></tspan><tspan x="370.0" dy="15.6">• Запит приходить до T_ttl</tspan><tspan x="370.0" dy="15.6">• Ключ знайдено в реєстрі</tspan><tspan x="370.0" dy="15.6">• Віддається збережена відповідь (Успіх)</tspan></text>
<line x1="395.0" y1="211.0" x2="395.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="806.8" y="245.0" width="440.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1026.8" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1026.8" dy="0.0">СЦЕНАРІЙ Б: запізнілий «зомбі-повтор»</tspan><tspan x="1026.8" dy="15.6"></tspan><tspan x="1026.8" dy="15.6">• Повтор затримався в черзі й прийшов після T_ttl</tspan><tspan x="1026.8" dy="15.6">• Сервер не знає про попереднє виконання</tspan><tspan x="1026.8" dy="15.6">• Дія виконується вдруге (Помилка!)</tspan></text>
<line x1="949.6" y1="211.0" x2="949.6" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="385.0" width="940.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">МАТЕМАТИЧНЕ ПРАВИЛО РОЗРАХУНКУ TTL:</tspan><tspan x="590.0" dy="16.2"></tspan><tspan x="590.0" dy="16.2">TTL_idempotency  &gt;  Max_Client_Backoff  +  Max_Network_Delay  +  Clock_Skew</tspan><tspan x="590.0" dy="16.2"></tspan><tspan x="590.0" dy="16.2">Якщо клієнт робить експоненційні повтори до 24 годин — TTL має бути не менше 48–72 годин</tspan></text>
<rect x="40.0" y="545.0" width="1100.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="567.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">пам'ять скінченна, але занадто малий TTL перетворює легітимні повтори на аварії;</tspan><tspan x="590.0" dy="16.9">горизонт збереження ключів завжди проєктують із запасом відносно максимального бюджету повторів</tspan></text>
</svg>