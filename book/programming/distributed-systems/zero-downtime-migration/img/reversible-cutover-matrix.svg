<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="45.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">АРХІТЕКТУРА БЕЗПЕЧНОГО ПЕРЕМИКАННЯ: ДВОНАПРАВЛЕНА СИНХРОНІЗАЦІЯ І ВІДКАТ</tspan></text>
<rect x="40.0" y="80.0" width="1100.0" height="260.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="55.0" y="95.0" width="1070.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПЕРІОД ПЕРЕМИКАННЯ (CUTOVER WINDOW) ІЗ ЗАХИСТОМ ВІД ВТРАТИ ДАНИХ</tspan></text>
<rect x="60.0" y="150.0" width="180.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="150.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">КЛІЄНТСЬКИЙ ТРАФІК</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">Динамічний роутер /</tspan><tspan x="150.0" dy="14.3">Feature Flag:</tspan><tspan x="150.0" dy="14.3">• Read: New DB (100%)</tspan><tspan x="150.0" dy="14.3">• Write: New DB (100%)</tspan></text>
<line x1="240.0" y1="210.0" x2="320.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="140.0" width="260.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="450.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">НОВА БАЗА ДАНИХ</tspan><tspan x="450.0" dy="15.0">(Active Primary)</tspan><tspan x="450.0" dy="15.0"></tspan><tspan x="450.0" dy="15.0">• Обслуговує 100% запитів</tspan><tspan x="450.0" dy="15.0">• Генерує події мутацій</tspan><tspan x="450.0" dy="15.0">• Джерело правди</tspan></text>
<line x1="580.0" y1="190.0" x2="780.0" y2="190.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="595.0" y="145.0" width="170.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="680.0" y="161.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ЗВОРОТНА РЕПЛІКАЦІЯ</tspan><tspan x="680.0" dy="13.7">(Reverse CDC Stream)</tspan></text>
<rect x="780.0" y="140.0" width="260.0" height="140.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.5"/><text x="910.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">СТАРА БАЗА ДАНИХ</tspan><tspan x="910.0" dy="13.7">(Passive Standby)</tspan><tspan x="910.0" dy="13.7"></tspan><tspan x="910.0" dy="13.7">• Отримує всі нові записи</tspan><tspan x="910.0" dy="13.7">• Підтримується в актуальному стані</tspan><tspan x="910.0" dy="13.7">• Готова до миттєвого повернення</tspan></text>
<rect x="40.0" y="360.0" width="535.0" height="250.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<rect x="55.0" y="375.0" width="505.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="307.5" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">СЦЕНАРІЙ УСПІХУ: ЗАВЕРШЕННЯ МІГРАЦІЇ</tspan></text>
<rect x="55.0" y="415.0" width="505.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="307.5" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">1. Цільова база стабільно працює під повним навантаженням (24–72 год)</tspan><tspan x="307.5" dy="13.7">2. Метрики затримок, помилок і навантаження CPU в межах норми</tspan><tspan x="307.5" dy="13.7">3. Зворотна реплікація вимикається</tspan><tspan x="307.5" dy="13.7">4. Стара база даних переводиться в режим Read-Only і архівується</tspan><tspan x="307.5" dy="13.7">5. Стара схема остаточно видаляється (Contract phase)</tspan><tspan x="307.5" dy="13.7">6. Міграція успішно закрита без жодної секунди простою</tspan></text>
<rect x="605.0" y="360.0" width="535.0" height="250.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="620.0" y="375.0" width="505.0" height="32.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="872.5" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">АВАРІЙНИЙ СЦЕНАРІЙ: БЕЗПЕЧНИЙ ВІДКАТ (ROLLBACK)</tspan></text>
<rect x="620.0" y="415.0" width="505.0" height="180.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="872.5" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="872.5" dy="0.0">1. У новій базі виявлено приховану деградацію / некоректну логіку</tspan><tspan x="872.5" dy="13.7">2. Роутер миттєво перемикає Feature Flag назад на Стару базу</tspan><tspan x="872.5" dy="13.7">3. Завдяки зворотній синхронізації стара база містить ВСІ транзакції,</tspan><tspan x="872.5" dy="13.7">   що відбулися за час роботи нової бази!</tspan><tspan x="872.5" dy="13.7">4. ЖОДЕН запис клієнта не втрачено (Zero Data Loss)</tspan><tspan x="872.5" dy="13.7">5. Сервіс продовжує роботу, команда спокійно виправляє дефект</tspan></text>
</svg>