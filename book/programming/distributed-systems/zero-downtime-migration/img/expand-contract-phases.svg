<rect x="55.0" y="475.0" width="570.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="340.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">ЗВОРОТНА СУМІСНІСТЬ (Backward Compatibility):</tspan><tspan x="340.0" dy="14.3"></tspan><tspan x="340.0" dy="14.3">• Нова версія застосунку (N+1) вміє читати і писати стару схему</tspan><tspan x="340.0" dy="14.3">• Будь-яке розширення схеми є опційним (nullable або default)</tspan><tspan x="340.0" dy="14.3">• Відсутність збоїв під час канареечного розгортання</tspan></text>
<rect x="645.0" y="475.0" width="580.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="935.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">ПРЯМА СУМІСНІСТЬ (Forward Compatibility):</tspan><tspan x="935.0" dy="14.3"></tspan><tspan x="935.0" dy="14.3">• Стара версія застосунку (N) ігнорує нові поля і продовжує роботу</tspan><tspan x="935.0" dy="14.3">• Безпечний відкат бінарників застосунку без відкату міграцій БД</tspan><tspan x="935.0" dy="14.3">• Відсутність блокуючих монолітних вікон оновлення</tspan></text>
<rect x="40.0" y="625.0" width="1200.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="640.0" y="649.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Правило нульового простою: База даних завжди повинна бути готова прийняти як попередню, так і наступну версію коду.</tspan></text>
