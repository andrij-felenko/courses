<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корисна пропускна здатність (Goodput) проти загального навантаження</text>
<rect x="40.0" y="50.0" width="440.0" height="460.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="260.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без скидання навантаження (катастрофа FIFO)</text>
<line x1="80.0" y1="450.0" x2="450.0" y2="450.0" stroke="#333333" stroke-width="1.5"/>
<line x1="80.0" y1="450.0" x2="80.0" y2="110.0" stroke="#333333" stroke-width="1.5"/>
<line x1="80.0" y1="450.0" x2="460.0" y2="450.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="80.0" y1="450.0" x2="80.0" y2="100.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Вхідний трафік (Offered Load)</text>
<text x="75.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Пропускна здатність (RPS)</text>
<line x1="80.0" y1="250.0" x2="440.0" y2="250.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="435.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Номінальна місткість (C)</text>
<polyline points="80.0,450.0 220.0,250.0 440.0,250.0" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
<text x="350.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Сирий Throughput (CPU 100%)</text>
<path d="M 80 450 Q 180 300 220 250 Q 250 260 280 390 Q 330 440 440 444" stroke="#c0392b" stroke-width="3" fill="none"/>
<text x="290.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Goodput обвалюється до нуля</text>
<text x="290.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">(марна робота над протухлими запитами)</text>
<rect x="225.0" y="105.0" width="240.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="345.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Колапс «Badput»:</text>
<text x="345.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Черга неконтрольовано росте</text>
<text x="345.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Клієнти відпадають за таймаутом</text>
<text x="345.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Сервер марнує 100% CPU на сміття</text>
<rect x="520.0" y="50.0" width="440.0" height="460.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="740.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Зі скиданням навантаження (Load Shedding)</text>
<line x1="560.0" y1="450.0" x2="930.0" y2="450.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="450.0" x2="560.0" y2="110.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="450.0" x2="940.0" y2="450.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="450.0" x2="560.0" y2="100.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="930.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Вхідний трафік (Offered Load)</text>
<text x="555.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Пропускна здатність (RPS)</text>
<line x1="560.0" y1="250.0" x2="920.0" y2="250.0" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="915.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Номінальна місткість (C)</text>
<path d="M 560 450 L 700 250 L 920 250" stroke="#27ae60" stroke-width="3" fill="none"/>
<text x="805.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стабільний Goodput = C</text>
<polyline points="700.0,250.0 920.0,135.0 920.0,250.0" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
<text x="815.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Швидко відхилені запити</text>
<text x="815.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">(Fail-Fast: HTTP 503 / 429)</text>
<rect x="700.0" y="95.0" width="235.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="817.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Самозахист системи:</text>
<text x="817.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Детермінований час відповіді</text>
<text x="817.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• 100% прийнятих запитів успішні</text>
</svg>