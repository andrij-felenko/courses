<text x="335.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Після краху: джерело віддасть msg 101 повторно (At-Least-Once)</text>
