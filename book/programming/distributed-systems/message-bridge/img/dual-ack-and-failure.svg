<rect x="100.0" y="52.3" width="140.0" height="35.3" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Брокер-джерело</tspan><tspan x="170.0" dy="14.3">(Source Broker)</tspan></text>
<rect x="430.0" y="52.3" width="140.0" height="35.3" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Міст повідомлень</tspan><tspan x="500.0" dy="14.3">(Message Bridge)</tspan></text>
<rect x="760.0" y="52.3" width="140.0" height="35.3" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Цільовий брокер</tspan><tspan x="830.0" dy="14.3">(Target Broker)</tspan></text>
