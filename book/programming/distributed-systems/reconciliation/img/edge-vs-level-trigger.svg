<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імперативний (Edge-triggered) проти Декларативного (Level-triggered) підходу</text>
<rect x="20.0" y="50.0" width="395.0" height="350.0" rx="8" fill="#fdfafb" stroke="#fca5a5" stroke-width="1.5"/>
<text x="217.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Edge-triggered (Реакція на переходи / події)</text>
<rect x="35.0" y="98.0" width="365.0" height="48.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="217.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Команда: «Створити вузол +1»</text>
<text x="217.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Надсилається одиночна RPC-подія</text>
<line x1="217.0" y1="148.0" x2="217.0" y2="168.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="170.0" width="365.0" height="52.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="217.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Мережевий збій або перезавантаження</text>
<text x="217.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Пакет втрачено, повторна спроба не надійшла</text>
<line x1="217.0" y1="224.0" x2="217.0" y2="244.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="246.0" width="365.0" height="60.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="217.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Розрив внутрішнього стану:</text>
<text x="217.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">База: вважає що вузлів 5 (запит відправлено)</text>
<text x="217.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Реальність: працює лише 4 вузли</text>
<rect x="35.0" y="318.0" width="365.0" height="66.0" rx="5" fill="#fff1f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="217.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок: незворотний прихований дрейф</text>
<text x="217.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Система «сліпа» до фізичної реальності,</text>
<text x="217.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">наступні команди спираються на хибний стан</text>
<rect x="445.0" y="50.0" width="395.0" height="350.0" rx="8" fill="#f6fbf8" stroke="#86efac" stroke-width="1.5"/>
<text x="642.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Level-triggered (Звірка стану / Reconciliation)</text>
<rect x="460.0" y="98.0" width="365.0" height="48.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="642.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Декларація: «Бажаний стан = 5 вузлів»</text>
<text x="642.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зафіксовано декларативну специфікацію (Spec)</text>
<line x1="642.0" y1="148.0" x2="642.0" y2="168.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="170.0" width="365.0" height="52.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="642.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Спостереження (Observe) та Diff</text>
<text x="642.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фактично працює 4 вузли. Обчислено Δ = +1</text>
<line x1="642.0" y1="224.0" x2="642.0" y2="244.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="246.0" width="365.0" height="60.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="642.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Ідемпотентна дія (Act) та перевірка</text>
<text x="642.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Створюється відсутній 5-й вузол.</text>
<text x="642.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Навіть якщо пакет втрачено, цикл повторить спробу</text>
<rect x="460.0" y="318.0" width="365.0" height="66.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="642.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Наслідок: самовідновлення та збіжність</text>
<text x="642.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Стан гарантовано зійдеться до бажаного,</text>
<text x="642.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">незалежно від кількості втрачених повідомлень</text>
</svg>