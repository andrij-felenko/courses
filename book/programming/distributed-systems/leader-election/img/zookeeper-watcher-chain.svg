<line x1="725.0" y1="186.0" x2="725.0" y2="137.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="740.0" y="145.0" width="200.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Watch: ТІЛЬКИ node_001</tspan></text>
