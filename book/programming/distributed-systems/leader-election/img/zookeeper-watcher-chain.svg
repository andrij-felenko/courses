<rect x="155.0" y="90.0" width="200.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Єдиний ключ: /app/leader</tspan><tspan x="255.0" dy="15.0">Власник: Вузол 1</tspan></text>
