<rect x="70.0" y="310.0" width="140.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Вузол N (Watch)</tspan></text>
<line x1="210.0" y1="328.0" x2="250.0" y2="135.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="370.0" width="420.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="255.0" dy="0.0">НАСЛІДОК ПАДІННЯ ЛІДЕРА:</tspan><tspan x="255.0" dy="14.3">• Координатор одночасно надсилає N-1 сповіщень.</tspan><tspan x="255.0" dy="14.3">• Усі N-1 вузлів миттєво шлють запити на створення ключа.</tspan><tspan x="255.0" dy="14.3">• Складність: O(N) сповіщень, O(N²) навантаження на мережу.</tspan><tspan x="255.0" dy="14.3">• Ризик колапсу координатора при великих кластерах.</tspan></text>
<rect x="510.0" y="25.0" width="460.0" height="465.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<rect x="525.0" y="35.0" width="430.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="57.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">ОПТИМАЛЬНИЙ ПАТЕРН: Ланцюг послідовних вузлів</tspan></text>
