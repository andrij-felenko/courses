<rect x="535.0" y="165.0" width="190.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">/election/node_002 (STANDBY)</tspan><tspan x="630.0" dy="13.7">Вузол 2</tspan></text>
