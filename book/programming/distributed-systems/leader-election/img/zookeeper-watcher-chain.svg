<rect x="525.0" y="370.0" width="430.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="740.0" dy="0.0">ПЕРЕВАГА ЛАНЦЮГОВОГО СПОСТЕРЕЖЕННЯ:</tspan><tspan x="740.0" dy="11.7">• При падінні лідера (node_001) прокидається РІВНО ОДИН вузол (node_002).</tspan><tspan x="740.0" dy="11.7">• При падінні проміжного вузла прокидається лише його наступник.</tspan><tspan x="740.0" dy="11.7">• Складність: строго O(1) подій на подію відмови.</tspan><tspan x="740.0" dy="11.7">• Ідеальне масштабування на сотні й тисячі вузлів.</tspan></text>
