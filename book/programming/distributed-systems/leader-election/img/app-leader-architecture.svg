<rect x="370.0" y="80.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Вузол 2 (STANDBY / FOLLOWER)</tspan></text>
<rect x="370.0" y="118.0" width="260.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Стан: CANDIDATE</tspan><tspan x="500.0" dy="14.3">Очікує лізу (Watch / Poll)</tspan><tspan x="500.0" dy="14.3">Звичайні HTTP-запити: ТАК</tspan><tspan x="500.0" dy="14.3">Фонові монопольні задачі: НІ</tspan></text>
<rect x="670.0" y="70.0" width="280.0" height="145.0" rx="6" fill="#fff3cd" stroke="#6b7280" stroke-width="1.5"/>
<rect x="680.0" y="80.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Вузол 3 (STANDBY / FOLLOWER)</tspan></text>
<rect x="680.0" y="118.0" width="260.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Стан: CANDIDATE</tspan><tspan x="810.0" dy="14.3">Очікує лізу (Watch / Poll)</tspan><tspan x="810.0" dy="14.3">Звичайні HTTP-запити: ТАК</tspan><tspan x="810.0" dy="14.3">Фонові монопольні задачі: НІ</tspan></text>
<rect x="50.0" y="240.0" width="280.0" height="35.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Keep-Alive серцебиття (3 с)</tspan></text>
<line x1="190.0" y1="215.0" x2="190.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="275.0" x2="190.0" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="530.0" y="240.0" width="420.0" height="35.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="261.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Монопольний запис + Fencing Token (e=42)</tspan></text>
<line x1="290.0" y1="215.0" x2="600.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="740.0" y1="275.0" x2="740.0" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="300.0" width="450.0" height="135.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<rect x="45.0" y="310.0" width="420.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Зовнішній координатор (etcd / ZooKeeper / K8s Lease)</tspan></text>
<rect x="45.0" y="348.0" width="420.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Ключ: /service/leader-lock</tspan><tspan x="255.0" dy="14.3">Власник: Вузол 1 | TTL: 10 с | Ревізія епохи: 42</tspan><tspan x="255.0" dy="14.3">Забезпечує лінеаризований консенсус</tspan></text>
<line x1="500.0" y1="215.0" x2="410.0" y2="300.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="810.0" y1="215.0" x2="460.0" y2="300.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="300.0" width="460.0" height="135.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<rect x="525.0" y="310.0" width="430.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Цільове сховище даних (PostgreSQL / S3 / Kafka)</tspan></text>
<rect x="525.0" y="348.0" width="430.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Таблиця стану: last_fencing_token = 42</tspan><tspan x="740.0" dy="14.3">Інваріант: UPDATE ... WHERE token &gt;= last_token</tspan><tspan x="740.0" dy="14.3">Відхиляє мутації з токенами e &lt; 42</tspan></text>
<rect x="30.0" y="455.0" width="940.0" height="125.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="45.0" y="465.0" width="910.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">АРХІТЕКТУРНИЙ ПРИНЦИП:</tspan><tspan x="500.0" dy="15.0">1. Додаток не реалізує складний консенсус усередині кожного контейнера, а делегує вибори лідера координатору.</tspan><tspan x="500.0" dy="15.0">2. Ліза гарантує автоматичне зняття повноважень при відмові лідера через спливання TTL.</tspan><tspan x="500.0" dy="15.0">3. Фенсинговий токен (Fencing Token / Epoch) захищає сховище від застарілих дій зомбі-лідера при GC-паузах.</tspan></text>
</svg>