<rect x="30.0" y="20.0" width="940.0" height="210.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<rect x="45.0" y="30.0" width="910.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Кластер екземплярів прикладного сервісу (Stateless Worker Pods)</tspan></text>
<rect x="50.0" y="70.0" width="280.0" height="145.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<rect x="60.0" y="80.0" width="260.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Вузол 1 (АКТИВНИЙ ЛІДЕР)</tspan></text>
<rect x="60.0" y="118.0" width="260.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Стан: LEADER</tspan><tspan x="190.0" dy="14.3">Утримує лізу: lease_id=0xFA1</tspan><tspan x="190.0" dy="14.3">Токен епохи: epoch=42</tspan><tspan x="190.0" dy="14.3">Виконує монопольні фонові задачі</tspan></text>
