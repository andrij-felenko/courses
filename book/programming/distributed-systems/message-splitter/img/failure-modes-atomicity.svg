<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка збоїв і відновлення: часткова публікація, транзакції та ідемпотентність</text>
<rect x="15.0" y="55.0" width="910.0" height="165.0" rx="8" fill="#f8f9fa" stroke="#c0392b" stroke-width="1.2"/>
<text x="470.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій збою: аварійне завершення спліттера на елементі K (350 з 1000)</text>
<rect x="45.0" y="105.5" width="200.0" height="69.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Спліттер публікує:</tspan><tspan x="145.0" dy="13.0">Елементи 1..350 -&gt; OK</tspan><tspan x="145.0" dy="13.0">Елемент 351 -&gt; КРАХ!</tspan><tspan x="145.0" dy="13.0">352..1000 -&gt; Не надіслано</tspan></text>
<line x1="255.0" y1="140.0" x2="325.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="311.2" y="105.5" width="317.6" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Стан системи після перезапуску:</tspan><tspan x="470.0" dy="13.0">• Перші 350 уже споживаються воркерами</tspan><tspan x="470.0" dy="13.0">• Брокер повертає весь вхідний пакет на повтор</tspan><tspan x="470.0" dy="13.0">• Спліттер починає розбір наново з 1-го елемента</tspan></text>
<line x1="605.0" y1="140.0" x2="675.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="105.5" width="190.0" height="69.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="795.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Загроза:</tspan><tspan x="795.0" dy="13.0">Дублювання 1..350</tspan><tspan x="795.0" dy="13.0">Подвійне списання коштів</tspan><tspan x="795.0" dy="13.0">Порушення цілісності</tspan></text>
<rect x="15.0" y="235.0" width="910.0" height="205.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.2"/>
<text x="470.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Дворівневий захист: транзакційний брокер та ідемпотентний фільтр споживача</text>
<rect x="45.0" y="304.0" width="400.0" height="82.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Рівень 1: Транзакційна сесія брокера (Kafka / AMQP):</tspan><tspan x="245.0" dy="13.0">• begin_transaction()</tspan><tspan x="245.0" dy="13.0">• Публікація всіх 1 000 елементів у транзакції</tspan><tspan x="245.0" dy="13.0">• commit_transaction() або abort()</tspan><tspan x="245.0" dy="13.0">Результат: споживачі бачать або всі 1 000, або 0</tspan></text>
<rect x="495.0" y="304.0" width="400.0" height="82.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Рівень 2: Ідемпотентність споживача (Redis / SQL):</tspan><tspan x="695.0" dy="13.0">• Ключ: CorrID + ':' + SequenceNum</tspan><tspan x="695.0" dy="13.0">• SET key NX EX 86400 (Атомарний запис)</tspan><tspan x="695.0" dy="13.0">• Якщо ключ є -&gt; ACK без повторної бізнес-дії</tspan><tspan x="695.0" dy="13.0">Результат: повна стійкість до повторів</tspan></text>
</svg>