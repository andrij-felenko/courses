<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій парсингу: повна буферизація проти потокового розбору</text>
<rect x="15.0" y="55.0" width="445.0" height="365.0" rx="8" fill="#f8f9fa" stroke="#c0392b" stroke-width="1.2"/>
<text x="237.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Повна буферизація в пам'яті (DOM Tree)</text>
<rect x="47.0" y="107.9" width="380.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">Вхідний пакет (100 МБ JSON/XML)</tspan><tspan x="237.0" dy="13.7">Повне читання у пам'ять процесу</tspan></text>
<line x1="237.0" y1="165.0" x2="237.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="47.0" y="204.3" width="380.0" height="71.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="237.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">Побудова AST / Об'єктного дерева:</tspan><tspan x="237.0" dy="13.7">• Мільйони вузлів та DTO-об'єктів</tspan><tspan x="237.0" dy="13.7">• Використання RAM: 600–900 МБ (O(N))</tspan><tspan x="237.0" dy="13.7">• GC-паузи (Stop-the-world 1.5–3.5 с)</tspan></text>
<line x1="237.0" y1="290.0" x2="237.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="47.0" y="343.5" width="380.0" height="43.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="237.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">Ризики: Out-Of-Memory при сплесках трафіку,</tspan><tspan x="237.0" dy="13.0">величезна латентність до відправки першого елемента</tspan></text>
<rect x="480.0" y="55.0" width="445.0" height="365.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.2"/>
<text x="702.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Потоковий розбір (StAX / SAX / Zero-Copy Span)</text>
<rect x="512.0" y="107.9" width="380.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="702.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Вхідний потік байтів через Socket / mmap</tspan><tspan x="702.0" dy="13.7">Фіксований буфер кільця (64 КБ)</tspan></text>
<line x1="702.0" y1="165.0" x2="702.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="512.0" y="204.3" width="380.0" height="71.4" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">Ітеративне виділення токенів:</tspan><tspan x="702.0" dy="13.7">• Нульове зайве виділення пам'яті (Zero-Copy)</tspan><tspan x="702.0" dy="13.7">• Використання RAM: O(1) (~64 КБ стабільно)</tspan><tspan x="702.0" dy="13.7">• Миттєва емісія елемента №1 (&lt; 1 мс)</tspan></text>
<line x1="702.0" y1="290.0" x2="702.0" y2="320.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="512.0" y="343.5" width="380.0" height="43.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="702.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Переваги: Необмежений розмір пакета (10+ ГБ),</tspan><tspan x="702.0" dy="13.0">стабільний SLA, природний протитиск (Backpressure)</tspan></text>
</svg>