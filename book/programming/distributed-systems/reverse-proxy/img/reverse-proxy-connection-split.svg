<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрив TCP-сесій та буферизація між WAN і LAN</text>
<rect x="20.0" y="55.0" width="260.0" height="275.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.2"/>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зовнішній клієнт (WAN)</text>
<text x="150.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Повільний канал, втрати, затримки</text>
<rect x="90.7" y="122.5" width="118.6" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Мобільний клієнт</tspan><tspan x="150.0" dy="13.0">RTT: 80–150 мс</tspan><tspan x="150.0" dy="13.0">Швидкість: 50 КБ/с</tspan><tspan x="150.0" dy="13.0">TLS 1.3 / HTTP/2</tspan></text>
<rect x="35.0" y="215.0" width="230.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="150.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TCP Сокет 1 (Client-Facing)</text>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Довгоживучий TCP сеанс</text>
<text x="150.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Повільне читання тіла запиту</text>
<text x="150.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Захист від атак Slowloris</text>
<rect x="310.0" y="55.0" width="320.0" height="275.0" rx="8" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="470.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Зворотний проксі (Event Loop / epoll)</text>
<text x="470.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Неблокуючий ввід-вивід та ізоляція швидкостей</text>
<rect x="330.0" y="120.0" width="280.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="470.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Буфер запиту (Request Buffer)</text>
<text x="470.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Асинхронне накопичення байтів із WAN</text>
<text x="470.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Запит передається в LAN лише після повного збору</text>
<rect x="330.0" y="220.0" width="280.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="470.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Буфер відповіді (Response Buffer)</text>
<text x="470.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Миттєвий прийом повної відповіді від бекенда</text>
<text x="470.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Повільна роздача клієнту без блокування бекенда</text>
<rect x="660.0" y="55.0" width="260.0" height="275.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.2"/>
<text x="790.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Внутрішній бекенд (LAN)</text>
<text x="790.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">RTT &lt; 0.5 мс, швидкість 10 Гбіт/с</text>
<rect x="707.9" y="129.0" width="164.2" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Воркер застосунку</tspan><tspan x="790.0" dy="13.0">(Gunicorn / Puma / Tomcat)</tspan><tspan x="790.0" dy="13.0">Пул потоків обмежений</tspan></text>
<rect x="675.0" y="215.0" width="230.0" height="95.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.0"/>
<text x="790.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">TCP Сокет 2 (Upstream-Facing)</text>
<text x="790.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Пул з'єднань Keep-Alive</text>
<text x="790.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Воркер зайнятий лише 5–10 мс</text>
<text x="790.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Швидка передача через LAN / UDS</text>
<line x1="280.0" y1="160.0" x2="330.0" y2="160.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="160.0" x2="660.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="260.0" x2="610.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="260.0" x2="280.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Проксі поглинає затримки WAN, звільняючи воркери бекенда від простою в очікуванні сокетів</text>
</svg>