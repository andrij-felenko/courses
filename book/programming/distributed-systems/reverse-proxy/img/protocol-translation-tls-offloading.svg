<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими обробки TLS та протокольна трансляція на зворотному проксі</text>
<rect x="20.0" y="60.0" width="920.0" height="95.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="40.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Зняття TLS (SSL Offloading / Termination)</text>
<rect x="86.5" y="99.6" width="86.9" height="30.7" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Клієнт (WAN)</tspan><tspan x="130.0" dy="11.7">HTTPS (TLS 1.3)</tspan></text>
<rect x="385.0" y="93.8" width="170.0" height="42.4" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Зворотний проксі</tspan><tspan x="470.0" dy="11.7">Розшифрування TLS</tspan><tspan x="470.0" dy="11.7">AES-NI / криптографія</tspan></text>
<rect x="746.0" y="99.6" width="128.0" height="30.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Внутрішній сервер (LAN)</tspan><tspan x="810.0" dy="11.7">Чистий HTTP/1.1 / UDS</tspan></text>
<line x1="210.0" y1="115.0" x2="370.0" y2="115.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="290.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTPS / TLS 1.3</text>
<line x1="570.0" y1="115.0" x2="715.0" y2="115.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="642.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTP / UDS (без шифрування)</text>
<rect x="20.0" y="165.0" width="920.0" height="95.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="40.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Повторне шифрування (SSL Bridging / Re-encryption)</text>
<rect x="53.2" y="204.7" width="153.6" height="30.7" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Клієнт (WAN)</tspan><tspan x="130.0" dy="11.7">HTTPS (Публічний сертифікат)</tspan></text>
<rect x="385.0" y="198.8" width="170.0" height="42.4" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Зворотний проксі</tspan><tspan x="470.0" dy="11.7">Термінація + mTLS</tspan><tspan x="470.0" dy="11.7">Інспекція L7 / WAF</tspan></text>
<rect x="733.2" y="204.7" width="153.6" height="30.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Внутрішній сервер (LAN)</tspan><tspan x="810.0" dy="11.7">Внутрішній mTLS (Zero-Trust)</tspan></text>
<line x1="210.0" y1="220.0" x2="370.0" y2="220.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="290.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Публічний TLS</text>
<line x1="570.0" y1="220.0" x2="715.0" y2="220.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="642.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Внутрішній mTLS</text>
<rect x="20.0" y="270.0" width="920.0" height="95.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="40.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Наскрізний пропуск L4 (SSL Passthrough / SNI Routing)</text>
<rect x="68.6" y="309.6" width="122.9" height="30.7" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="322.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Клієнт (WAN)</tspan><tspan x="130.0" dy="11.7">Зашифрований потік TLS</tspan></text>
<rect x="385.0" y="303.8" width="170.0" height="42.4" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">L4 Проксі (SNI Switch)</tspan><tspan x="470.0" dy="11.7">Маршрутизація за Server Name</tspan><tspan x="470.0" dy="11.7">Без розшифрування</tspan></text>
<rect x="743.4" y="309.6" width="133.1" height="30.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="322.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Цільовий сервер (LAN)</tspan><tspan x="810.0" dy="11.7">Термінація кінцевого TLS</tspan></text>
<line x1="210.0" y1="325.0" x2="370.0" y2="325.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="290.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шифрований потік TCP</text>
<line x1="570.0" y1="325.0" x2="715.0" y2="325.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="642.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шифрований потік TCP</text>
</svg>