<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневий кеш та логічне версіонування ключів</text>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневий кеш (L1 In-Memory + L2 Redis) та миттєва інвалідація просторів назв</text>
<rect x="40.0" y="65.0" width="270.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">App Pod 1 (Вузол 1)</tspan><tspan x="175.0" dy="15.6"></tspan><tspan x="175.0" dy="15.6">• L1 Cache: In-Process RAM</tspan><tspan x="175.0" dy="15.6">  Затримка: &lt; 1 мкс</tspan><tspan x="175.0" dy="15.6">  Мікро-TTL: 2–5 секунд</tspan><tspan x="175.0" dy="15.6">• Підписник на шину Pub/Sub:</tspan><tspan x="175.0" dy="15.6">  Слухає події скидання L1</tspan></text>
<rect x="710.0" y="65.0" width="270.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">App Pod 2 (Вузол 2)</tspan><tspan x="845.0" dy="15.6"></tspan><tspan x="845.0" dy="15.6">• L1 Cache: In-Process RAM</tspan><tspan x="845.0" dy="15.6">  Затримка: &lt; 1 мкс</tspan><tspan x="845.0" dy="15.6">  Мікро-TTL: 2–5 секунд</tspan><tspan x="845.0" dy="15.6">• Підписник на шину Pub/Sub:</tspan><tspan x="845.0" dy="15.6">  Слухає події скидання L1</tspan></text>
<rect x="340.0" y="65.0" width="340.0" height="190.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">L2 Спільний розподілений кеш</tspan><tspan x="510.0" dy="15.6">(Redis Cluster / Memcached)</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• Затримка мережі: 0.5–1.5 мс</tspan><tspan x="510.0" dy="15.6">• Зберігає повний стан сутностей</tspan><tspan x="510.0" dy="15.6">• Канал інвалідації: Redis Pub/Sub</tspan><tspan x="510.0" dy="15.6">• Лічильник версій просторів назв</tspan></text>
<rect x="40.0" y="280.0" width="940.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Миттєва безблокуюча інвалідація групи ключів через лічильник версій (Namespacing)</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• Проблема: Команда KEYS tenant:42:* або масовий DEL у Redis блокує однопотоковий Event Loop і кладе продакшн.</tspan><tspan x="510.0" dy="15.6">• Рішення: Зберігаємо версію простору: GET v:tenant:42 -&gt; повертає 7. Формуємо ключі: tenant:42:v7:orders:101.</tspan><tspan x="510.0" dy="15.6">• Миттєве скидання всіх даних тенанта: Атомарна команда INCR v:tenant:42 (нова версія 8).</tspan><tspan x="510.0" dy="15.6">• Усі попередні сотні тисяч ключів із суфіксом v7 стають миттєво невидимими і тихо зникають за власним TTL.</tspan></text>
<text x="510.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дворівнева архітектура розвантажує мережу L2, а версіонування усуває блокуючі сканування пам'яті.</text>
</svg>