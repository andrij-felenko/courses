<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кешування відсутності запису захищає базу даних від сканування неіснуючих ID</text>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проникнення кешу (Cache Penetration) та кешування порожнечі</text>
<rect x="40.0" y="60.0" width="445.0" height="420.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="262.5" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">БЕЗ кешування порожнечі (Вразливість)</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">1. Клієнт / бот запитує неіснуючий ключ:</tspan><tspan x="262.5" dy="14.3">   GET /users/999999999 (ID немає в системі)</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">2. Сервіс перевіряє Redis -&gt; ПРОМАХ (ключа нема)</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">3. Сервіс робить SELECT у PostgreSQL -&gt; 0 рядків</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">4. У кеш нічого не пишеться (бо значення null)</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">5. Наступні 10 000 таких самих запитів знову йдуть</tspan><tspan x="262.5" dy="14.3">   напряму в БД, створюючи прямий DDoS на дисковий ввід/вивід.</tspan><tspan x="262.5" dy="14.3"></tspan><tspan x="262.5" dy="14.3">Наслідок: 100 % запитів до неіснуючих сутностей б'ють у базу.</tspan></text>
<rect x="535.0" y="60.0" width="445.0" height="420.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="757.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">З кешуванням порожнечі (Negative Caching)</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">1. Клієнт запитує неіснуючий ключ:</tspan><tspan x="757.5" dy="13.0">   GET /users/999999999</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">2. Сервіс перевіряє Redis -&gt; ПРОМАХ (перший раз)</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">3. Сервіс робить SELECT у PostgreSQL -&gt; 0 рядків</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">4. Сервіс записує маркер порожнечі в Redis:</tspan><tspan x="757.5" dy="13.0">   SET users:999999999 &quot;__NULL__&quot; EX 60</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">5. Наступні 9 999 запитів отримують маркер із пам'яті</tspan><tspan x="757.5" dy="13.0">   і миттєво повертають 404 Not Found без виклику бази даних.</tspan><tspan x="757.5" dy="13.0"></tspan><tspan x="757.5" dy="13.0">Результат: База захищена, короткий TTL (30–60 с) запобігає застряганню.</tspan></text>
<text x="510.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Правило: Маркер відсутності записується з коротким TTL, а при створенні сутності ключ інвалідується.</text>
</svg>