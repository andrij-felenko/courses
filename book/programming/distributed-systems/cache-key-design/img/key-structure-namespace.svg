<rect x="650.0" y="336.0" width="370.0" height="145.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">SDS заголовок + рядок ключа (sdshdr8)</tspan><tspan x="835.0" dy="13.0"></tspan><tspan x="835.0" dy="13.0">len(1B) + alloc(1B) + flags(1B) + buf[] + null(1B)</tspan><tspan x="835.0" dy="13.0"></tspan><tspan x="835.0" dy="13.0">Довгий ключ (120 Б) -&gt; виділення jemalloc 160 Б</tspan><tspan x="835.0" dy="13.0">Компактний ключ (24 Б) -&gt; виділення jemalloc 32 Б</tspan><tspan x="835.0" dy="13.0">Економія на 50 млн ключів: 50M * 128 Б = 6.4 ГБ RAM!</tspan></text>
