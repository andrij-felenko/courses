<rect x="40.0" y="20.0" width="1000.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="45.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Криза гарячого ключа: деградація шардованого кластера при нерівномірному трафіку</tspan></text>
