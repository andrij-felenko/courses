<rect x="55.0" y="136.0" width="270.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">95 000 req/s (95%)</tspan><tspan x="190.0" dy="13.0">Гарячий ключ: product:flash_deal</tspan><tspan x="190.0" dy="13.0">(Розподіл Ціпфа: alpha = 1.3)</tspan></text>
<rect x="55.0" y="215.0" width="270.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">5 000 req/s (5%)</tspan><tspan x="190.0" dy="13.0">Мільйони звичайних ключів</tspan><tspan x="190.0" dy="13.0">(Холодний хвіст запитів)</tspan></text>
<rect x="55.0" y="280.0" width="270.0" height="120.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Шардування за хешем:</tspan><tspan x="190.0" dy="13.0">Slot = CRC16(key) mod 16384</tspan><tspan x="190.0" dy="13.0"></tspan><tspan x="190.0" dy="13.0">product:flash_deal</tspan><tspan x="190.0" dy="13.0">  -&gt; Slot 12431 -&gt; Вузол 14</tspan><tspan x="190.0" dy="13.0"></tspan><tspan x="190.0" dy="13.0">Увесь трафік 95k req/s б'є</tspan><tspan x="190.0" dy="13.0">в ОДИН фізичний сокет!</tspan></text>
<rect x="55.0" y="415.0" width="270.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Каскадний ефект:</tspan><tspan x="190.0" dy="13.0">1. 100% CPU на Вузлі 14</tspan><tspan x="190.0" dy="13.0">2. Затримка: 1мс -&gt; 4000мс</tspan><tspan x="190.0" dy="13.0">3. Таймаут клієнтів і повтори</tspan><tspan x="190.0" dy="13.0">4. Відмова репліки після фейловера</tspan></text>
