<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">АРХІТЕКТУРА ДВОРІВНЕВОГО КОГЕРЕНТНОГО КЕШУВАННЯ (L1 IN-MEMORY + L2 REDIS + CDC)</tspan></text>
<rect x="40.0" y="75.0" width="480.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="55.0" y="90.0" width="450.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="280.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">КЛАСТЕР МІКРОСЕРВІСІВ (СЕРВІС КАТАЛОГУ / ЗАМОВЛЕНЬ)</tspan></text>
<rect x="60.0" y="135.0" width="440.0" height="185.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="75.0" y="145.0" width="410.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="162.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ІНСТАНС #1 (POD 1)</tspan></text>
<rect x="75.0" y="180.0" width="410.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="280.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">L1 Local Cache (RAM / 100 нс):</tspan><tspan x="280.0" dy="13.7">Кеш у процесі (Caffeine / Ristretto / Sharded Map)</tspan><tspan x="280.0" dy="13.7">Зберігає гарячі об'єкти без мережевих RTT</tspan></text>
<rect x="75.0" y="245.0" width="410.0" height="65.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.0"/><text x="280.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Слухач інвалідації (Invalidation Listener):</tspan><tspan x="280.0" dy="13.7">• Приймає події по шині NATS / Kafka / Redis PubSub</tspan><tspan x="280.0" dy="13.7">• Очищає L1 слот або оновлює версію атомарно</tspan></text>
<rect x="60.0" y="335.0" width="440.0" height="205.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="75.0" y="345.0" width="410.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ІНСТАНС #2 (POD 2)</tspan></text>
<rect x="75.0" y="380.0" width="410.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="280.0" y="397.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">L1 Local Cache (RAM / 100 нс):</tspan><tspan x="280.0" dy="13.7">Ізольований адресний простір другого вузла</tspan><tspan x="280.0" dy="13.7">Потребує когерентного скидання при змінах</tspan></text>
<rect x="75.0" y="445.0" width="410.0" height="80.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.0"/><text x="280.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Клієнтський трекінг (Redis Tracking Client):</tspan><tspan x="280.0" dy="13.7">RESP3 підключення: тримає інвалідні повідомлення</tspan><tspan x="280.0" dy="13.7">та витісняє локальні змінні при мутаціях у L2</tspan></text>
<rect x="560.0" y="75.0" width="580.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="575.0" y="90.0" width="550.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="850.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">СПІЛЬНИЙ ШАР ЗБЕРЕЖЕННЯ ТА ШИНА ІНВАЛІДАЦІЇ</tspan></text>
<rect x="585.0" y="135.0" width="530.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="850.0" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">L2 Спільний Кеш (Redis Cluster / Memcached / 1-2 мс):</tspan><tspan x="850.0" dy="14.3">• Централізоване сховище ключ-значення для всіх інстансів</tspan><tspan x="850.0" dy="14.3">• Підтримка атомарних Lease Tokens, CAS та версій</tspan><tspan x="850.0" dy="14.3">• Запобігає навантаженню бази при промахах L1</tspan></text>
<rect x="585.0" y="220.0" width="530.0" height="70.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="850.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Шина Інвалідації (Kafka / NATS / Redis PubSub):</tspan><tspan x="850.0" dy="14.3">• Топік: cache-invalidation-events</tspan><tspan x="850.0" dy="14.3">• Повідомлення: {key: 'prod:12', ver: 4, action: 'EVICT'}</tspan><tspan x="850.0" dy="14.3">• Трансляція (Fan-out) на всі поди сервісів</tspan></text>
<rect x="585.0" y="305.0" width="530.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="850.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">CDC Engine (Debezium / PostgreSQL WAL Reader):</tspan><tspan x="850.0" dy="14.3">Зчитує зафіксовані транзакції з бінарного журналу бази</tspan><tspan x="850.0" dy="14.3">Гарантує відсутність фантомних або втрачених подій</tspan></text>
<rect x="585.0" y="385.0" width="530.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="850.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Первинна СКБД (Master PostgreSQL / MySQL):</tspan><tspan x="850.0" dy="14.3">Єдине джерело правди (Single Source of Truth)</tspan><tspan x="850.0" dy="14.3">ACID-транзакції, первинні таблиці та WAL</tspan></text>
<rect x="585.0" y="465.0" width="530.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="489.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">ГАРАНТІЯ КОГЕРЕНТНОСТІ:</tspan><tspan x="850.0" dy="14.3">Мутація в БД → WAL → CDC → Шина → L2 Evict + L1 Evict на всіх вузлах.</tspan><tspan x="850.0" dy="14.3">Повна ліквідація вікна застарілості без блокуючого 2PC!</tspan></text>
