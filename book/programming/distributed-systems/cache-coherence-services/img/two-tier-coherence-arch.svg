<line x1="850.0" y1="305.0" x2="850.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="850.0" y1="220.0" x2="850.0" y2="205.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="585.0" y1="255.0" x2="500.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="585.0" y1="255.0" x2="500.0" y2="485.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>