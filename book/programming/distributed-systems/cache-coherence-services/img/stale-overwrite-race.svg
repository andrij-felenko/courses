<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ГОНКА ЗАСТАРІЛОГО ЗАПИСУ (STALE-OVERWRITE RACE): як кеш отруюється старими даними</tspan></text>
<rect x="40.0" y="75.0" width="340.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="55.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">КЛІЄНТ ЧИТАННЯ (СЕРВІС A)</tspan></text>
<rect x="55.0" y="140.0" width="310.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1. GET user:42 → Кеш-промах (Cache Miss)</tspan><tspan x="210.0" dy="14.3">Дані у кеші відсутні</tspan></text>
<rect x="55.0" y="210.0" width="310.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="210.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">2. Запит у СКБД: SELECT ... WHERE id=42</tspan><tspan x="210.0" dy="14.3">Отримано: {id: 42, balance: 100} (Версія 1)</tspan></text>
<rect x="55.0" y="290.0" width="310.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">⚡ ЗАТРИМКА (GC Pause / лаг мережі):</tspan><tspan x="210.0" dy="14.3">Процес Сервісу A засинає на 80 мс</tspan><tspan x="210.0" dy="14.3">і ще не встиг виконати SET у кеш!</tspan></text>
<rect x="55.0" y="385.0" width="310.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">5. Пробудження Сервісу A:</tspan><tspan x="210.0" dy="14.3">SET user:42 {balance: 100}</tspan><tspan x="210.0" dy="14.3">Запис застарілої Версії 1 у кеш!</tspan></text>
<rect x="55.0" y="470.0" width="310.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">НАСЛІДОК: Кеш містить 100 замість 150.</tspan><tspan x="210.0" dy="14.3">Постійне отруєння до завершення TTL!</tspan></text>
<rect x="420.0" y="75.0" width="340.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="435.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">РЕСУРСИ (СКБД ТА КЕШ REDIS)</tspan></text>
<rect x="435.0" y="140.0" width="310.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КЕШ REDIS:</tspan><tspan x="590.0" dy="14.3">Ключ user:42 відсутній (Null)</tspan></text>
<rect x="435.0" y="210.0" width="310.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СКБД (Master PostgreSQL):</tspan><tspan x="590.0" dy="14.3">Початковий стан рядка: balance = 100</tspan></text>
<rect x="435.0" y="290.0" width="310.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="590.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СКБД: UPDATE accounts SET balance = 150;</tspan><tspan x="590.0" dy="14.3">COMMIT (Зафіксовано Версію 2)</tspan><tspan x="590.0" dy="14.3">CDC надсилає інвалідацію: DEL user:42</tspan></text>
<rect x="435.0" y="385.0" width="310.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КЕШ REDIS:</tspan><tspan x="590.0" dy="14.3">Приймає SET user:42 {balance: 100}</tspan><tspan x="590.0" dy="14.3">Перезаписує порожній ключ старійшиною!</tspan></text>
<rect x="435.0" y="470.0" width="310.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СТАН РОЗХОДЖЕННЯ:</tspan><tspan x="590.0" dy="14.3">СКБД = 150 (Свіже) | Кеш = 100 (Брудне)</tspan></text>
<rect x="800.0" y="75.0" width="340.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="815.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="970.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">КЛІЄНТ ЗАПИСУ (СЕРВІС B)</tspan></text>
<rect x="815.0" y="140.0" width="310.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="970.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Очікування події бізнес-мутації</tspan><tspan x="970.0" dy="14.3">(поповнення рахунку на 50 грн)</tspan></text>
<rect x="815.0" y="210.0" width="310.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="970.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">3. Виконання мутації в БД:</tspan><tspan x="970.0" dy="14.3">UPDATE accounts SET balance = 150</tspan><tspan x="970.0" dy="14.3">Транзакція COMMIT успішна</tspan></text>
<rect x="815.0" y="290.0" width="310.0" height="75.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="970.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">4. Інвалідація кешу:</tspan><tspan x="970.0" dy="14.3">Виклик DEL user:42 у Redis</tspan><tspan x="970.0" dy="14.3">Кеш чистий, але Сервіс A вже несе старе!</tspan></text>
<rect x="815.0" y="385.0" width="310.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="970.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Сервіс B вважає інвалідацію завершеною,</tspan><tspan x="970.0" dy="14.3">але кеш щойно отруєно Сервісом A</tspan></text>
<rect x="815.0" y="470.0" width="310.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="970.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Подальші запити інших сервісів</tspan><tspan x="970.0" dy="14.3">читатимуть застарілі 100 грн з кешу</tspan></text>
<line x1="365.0" y1="240.0" x2="435.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="815.0" y1="240.0" x2="745.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="815.0" y1="325.0" x2="745.0" y2="325.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="365.0" y1="415.0" x2="435.0" y2="415.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>