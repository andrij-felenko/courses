<rect x="40.0" y="370.0" width="1060.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="570.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Механізм роботи Watermark:</tspan><tspan x="570.0" dy="15.6">• Watermark — це монотонна обіцянка системи: «ми більше не очікуємо подій із EventTime &lt; W».</tspan><tspan x="570.0" dy="15.6">• Подія e3 (10:02) надійшла пізніше за e4 (10:04), але ДО спрацьовування вотермарка — вона враховується у вікні.</tspan><tspan x="570.0" dy="15.6">• Подія e5 (10:03) прибула ПІСЛЯ закриття вікна (Dropped / Late Data) — її відправляють у Dead-Letter Queue або Side Output.</tspan><tspan x="570.0" dy="15.6"></tspan></text>
