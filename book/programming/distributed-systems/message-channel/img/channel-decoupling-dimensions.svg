<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири виміри розчеплення через канал повідомлень</text>
<rect x="10.0" y="10.0" width="980.0" height="460.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири виміри розчеплення розподілених систем через канал повідомлень</text>
<rect x="45.0" y="190.8" width="130.0" height="98.5" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">ВІДПРАВНИКИ</tspan><tspan x="110.0" dy="14.3">(Producers)</tspan><tspan x="110.0" dy="14.3"></tspan><tspan x="110.0" dy="14.3">• Вебсервери</tspan><tspan x="110.0" dy="14.3">• Фонові воркери</tspan><tspan x="110.0" dy="14.3">• IoT-шлюзи</tspan></text>
<rect x="354.5" y="179.4" width="290.9" height="121.2" rx="6" fill="#fff3cd" stroke="#333333" stroke-width="1.8"/><text x="500.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">КАНАЛ ПОВІДОМЛЕНЬ (Message Channel)</tspan><tspan x="500.0" dy="15.0"></tspan><tspan x="500.0" dy="15.0">[Буфер пам'яті / Дисковий журнал WAL]</tspan><tspan x="500.0" dy="15.0"></tspan><tspan x="500.0" dy="15.0">• Інкапсуляція маршруту й транспорту</tspan><tspan x="500.0" dy="15.0">• Управління потоком і черговістю</tspan><tspan x="500.0" dy="15.0">• Ізоляція відмов і згладжування піків</tspan></text>
<rect x="807.0" y="190.8" width="166.0" height="98.5" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">ОТРИМУВАЧІ</tspan><tspan x="890.0" dy="14.3">(Consumers)</tspan><tspan x="890.0" dy="14.3"></tspan><tspan x="890.0" dy="14.3">• Обробники замовлень</tspan><tspan x="890.0" dy="14.3">• Бази даних / Сховища</tspan><tspan x="890.0" dy="14.3">• ML-аналітика</tspan></text>
<line x1="180.0" y1="240.0" x2="350.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="265.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">write / send</text>
<line x1="650.0" y1="240.0" x2="820.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="735.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">read / poll</text>
<rect x="140.0" y="71.0" width="280.0" height="48.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/><text x="280.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1. Просторове розчеплення (Space)</tspan><tspan x="280.0" dy="13.0">Відправник не знає IP/порт отримувача;</tspan><tspan x="280.0" dy="13.0">обидва прив'язані лише до імені каналу.</tspan></text>
<rect x="580.0" y="71.0" width="280.0" height="48.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/><text x="720.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">2. Часове розчеплення (Time)</tspan><tspan x="720.0" dy="13.0">Учасники не мусять працювати одночасно;</tspan><tspan x="720.0" dy="13.0">буфер каналу зберігає дані під час збоїв.</tspan></text>
<rect x="140.0" y="371.0" width="280.0" height="48.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/><text x="280.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">3. Синхронізаційне розчеплення (Execution)</tspan><tspan x="280.0" dy="13.0">Відправник не блокує свій потік;</tspan><tspan x="280.0" dy="13.0">споживач вичитує дані у власному темпі.</tspan></text>
<rect x="580.0" y="371.0" width="280.0" height="48.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/><text x="720.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">4. Типове розчеплення (Datatype)</tspan><tspan x="720.0" dy="13.0">Канал фіксує схему передачі (DTO);</tspan><tspan x="720.0" dy="13.0">ізоляція версій і форматів повідомлень.</tspan></text>
</svg>