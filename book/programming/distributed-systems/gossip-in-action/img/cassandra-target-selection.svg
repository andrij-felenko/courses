<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="300.0" y="30.0" width="220.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="51.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Вузол A (Gossiper раунд 1с)</tspan><tspan x="410.0" dy="15.6">Вибір партнерів для обміну</tspan></text>
<line x1="350.0" y1="80.0" x2="140.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="200.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Випадковий живий вузол</tspan><tspan x="140.0" dy="14.3">(Ймовірність = 1.0)</tspan><tspan x="140.0" dy="14.3">Рівномірний вибір серед</tspan><tspan x="140.0" dy="14.3">усіх активних учасників</tspan></text>
<line x1="410.0" y1="80.0" x2="410.0" y2="175.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="180.0" width="200.0" height="70.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="410.0" y="200.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">2. Недоступний вузол</tspan><tspan x="410.0" dy="11.7">Ймовірність P = unreach / (live + 1)</tspan><tspan x="410.0" dy="11.7">Спроба виявити відновлення</tspan><tspan x="410.0" dy="11.7">після збою</tspan></text>
<line x1="470.0" y1="80.0" x2="680.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="180.0" width="200.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="200.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">3. Seed-вузол (Якір)</tspan><tspan x="680.0" dy="11.7">Ймовірність P = seeds / (live + unreach)</tspan><tspan x="680.0" dy="11.7">Або якщо A не бачить живих</tspan><tspan x="680.0" dy="11.7">Запобігання розколу кластера</tspan></text>
<rect x="120.0" y="310.0" width="580.0" height="95.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Гарантії архітектури вибору цілей:</tspan><tspan x="410.0" dy="14.3">• Живі вузли поширюють метадані за O(log N) раундів</tspan><tspan x="410.0" dy="14.3">• Недоступні вузли автоматично повертаються в кільце без ручного втручання</tspan><tspan x="410.0" dy="14.3">• Seed-вузли зшивають ізольовані підмножини («острови пліток») після збоїв мережі</tspan></text>
</svg>