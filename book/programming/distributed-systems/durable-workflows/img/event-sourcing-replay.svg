<rect x="40.0" y="375.0" width="840.0" height="65.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.0"/><text x="460.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Принцип Replay:</tspan><tspan x="460.0" dy="14.3">Воркер повторно проганяє детермінований код від початку. Усі минулі кроки миттєво підставляються</tspan><tspan x="460.0" dy="14.3">з журналу історії без зовнішніх викликів, доки виконання не досягне актуальної межі (frontier).</tspan></text>
