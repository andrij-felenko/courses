<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
<rect x="20.0" y="15.0" width="415.0" height="410.0" rx="8" fill="#fff8f7" stroke="#e0b4b0" stroke-width="1.5"/><text x="227.5" y="224.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0"></tspan></text>
<text x="227.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційне виконання (Volatile State)</text>
<rect x="87.0" y="69.3" width="280.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="227.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="227.0" dy="0.0">Пам'ять процесу (Стек / Купа)</tspan><tspan x="227.0" dy="14.3">Локальні змінні та виклики</tspan></text>
<rect x="87.0" y="164.3" width="280.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="227.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="227.0" dy="0.0">Аварія / Перезавантаження вузла</tspan><tspan x="227.0" dy="14.3">(OOM, перезапуск пода, мережевий збій)</tspan></text>
<line x1="227.0" y1="120.0" x2="227.0" y2="155.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="227.0" y1="215.0" x2="227.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="375.0" height="145.0" rx="6" fill="#ffffff" stroke="#e0b4b0" stroke-width="1.2"/><text x="227.5" y="307.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Наслідки збою в класичних системах:</tspan><tspan x="227.5" dy="14.3">• Стек викликів і стан змінних повністю знищено</tspan><tspan x="227.5" dy="14.3">• Ручний розбір статусу через таблиці БД (status='...')</tspan><tspan x="227.5" dy="14.3">• Ризик дублювання оплат або втрати кроків</tspan><tspan x="227.5" dy="14.3">• Складні розриви логіки на десятки мікросервісів</tspan></text>
<rect x="465.0" y="15.0" width="415.0" height="410.0" rx="8" fill="#f4faf6" stroke="#a3d9b8" stroke-width="1.5"/><text x="672.5" y="224.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0"></tspan></text>
<text x="672.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Durable Execution (Незнищенний процес)</text>
<rect x="532.0" y="69.3" width="280.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="672.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Звичайний імперативний код</tspan><tspan x="672.0" dy="14.3">(послідовні виклики, цикли, try/catch)</tspan></text>
<rect x="532.0" y="164.3" width="280.0" height="41.3" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="672.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Журнал подій (Event History)</tspan><tspan x="672.0" dy="14.3">Фіксація кожного завершеного кроку</tspan></text>
<line x1="672.0" y1="120.0" x2="672.0" y2="155.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="672.0" y1="215.0" x2="672.0" y2="250.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="485.0" y="260.0" width="375.0" height="145.0" rx="6" fill="#ffffff" stroke="#a3d9b8" stroke-width="1.2"/><text x="672.5" y="307.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Властивості незнищенного процесу:</tspan><tspan x="672.5" dy="14.3">• Після аварії код відновлюється з точного місця паузи</tspan><tspan x="672.5" dy="14.3">• Жодних подвійних списань чи повторних побічних дій</tspan><tspan x="672.5" dy="14.3">• Стан, локальні змінні й черговість гарантовані рушієм</tspan><tspan x="672.5" dy="14.3">• Процес може тривати місяцями без утримання пам'яті</tspan></text>
</svg>