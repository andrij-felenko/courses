<rect x="470.0" y="150.0" width="110.0" height="90.0" rx="6" fill="#f5f5f5" stroke="#6b7280" stroke-width="1.2"/><text x="525.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Retry</tspan><tspan x="525.0" dy="13.0">Backoff</tspan><tspan x="525.0" dy="13.0">(Пауза)</tspan></text>
<rect x="595.0" y="150.0" width="275.0" height="90.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/><text x="732.5" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">Спроба 2 (Start-To-Close)</tspan><tspan x="732.5" dy="13.0">Виконання на іншому воркері...</tspan><tspan x="732.5" dy="13.0">Успішний результат!</tspan></text>
