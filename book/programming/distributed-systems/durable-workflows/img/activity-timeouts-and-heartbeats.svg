<text x="460.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Heartbeat Timeout: Контроль живості для тривалих задач (хвилини/години)</text>
