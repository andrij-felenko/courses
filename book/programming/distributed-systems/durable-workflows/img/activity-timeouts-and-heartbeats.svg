<text x="460.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири виміри таймаутів для надійного виконання Activity</text>
<rect x="50.0" y="80.0" width="820.0" height="45.0" rx="6" fill="#eef2ff" stroke="#3f51b5" stroke-width="1.5"/><text x="460.0" y="106.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a237e" text-anchor="middle"><tspan x="460.0" dy="0.0">Schedule-To-Close Timeout: Загальний бюджет часу на виконання (включно з усіма повторами)</tspan></text>
