<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазний цикл виявлення збоїв у протоколі SWIM</text>
<rect x="20.0" y="50.0" width="405.0" height="345.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="222.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 1: Пряме зондування (Direct Ping)</text>
<circle cx="90.0" cy="160.0" r="26.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="90.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол A</text>
<text x="90.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(ініціатор)</text>
<circle cx="340.0" cy="160.0" r="26.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="340.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол B</text>
<text x="340.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(ціль)</text>
<line x1="120.0" y1="145.0" x2="308.0" y2="145.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Прямий Ping (UDP)</text>
<line x1="308.0" y1="175.0" x2="120.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="215.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ack втрачено або B перевантажений</text>
<line x1="205.0" y1="168.0" x2="225.0" y2="182.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="225.0" y1="168.0" x2="205.0" y2="182.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="35.0" y="245.0" width="375.0" height="135.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="222.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Таймаут прямого зонду T_ack сплив</text>
<text x="222.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Відсутність Ack не означає смерть B</text>
<text x="222.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Причина: локальна втрата пакетів на маршруті A-B</text>
<text x="222.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Вузол B може бути повністю здоровим</text>
<text x="222.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Рішення: непряма перевірка через посередників</text>
