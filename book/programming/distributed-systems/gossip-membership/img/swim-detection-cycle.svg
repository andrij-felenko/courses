<text x="650.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Посер. C₁</text>
<circle cx="650.0" cy="275.0" r="22.0" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Посер. C₂</text>
<circle cx="805.0" cy="200.0" r="24.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="805.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол B</text>
<line x1="517.0" y1="185.0" x2="628.0" y2="137.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="555.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ping-req(B)</text>
<line x1="672.0" y1="135.0" x2="783.0" y2="187.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="745.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ping</text>
<line x1="783.0" y1="195.0" x2="672.0" y2="145.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="628.0" y1="145.0" x2="517.0" y2="195.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="595.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ack (успіх)</text>
<line x1="517.0" y1="215.0" x2="628.0" y2="263.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="555.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ping-req(B)</text>
<line x1="672.0" y1="265.0" x2="783.0" y2="213.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="460.0" y="315.0" width="385.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="652.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Якщо бодай один посередник C отримав Ack від B:</text>
<text x="652.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вузол B вважається здоровим (Alive)</text>
<text x="652.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Якщо жоден не відповів за T_ping → перехід у Suspect</text>
