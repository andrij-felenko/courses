<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Lifeguard: Захист від помилкових підозр при деградації вузла</text>
<rect x="20.0" y="55.0" width="410.0" height="335.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="225.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Самооцінка вузла (Local Health Multiplier)</text>
<circle cx="90.0" cy="160.0" r="30.0" fill="#fefce8" stroke="#ca8a04" stroke-width="2.0"/>
<text x="90.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол</text>
<text x="90.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">LHM = 0..8</text>
<rect x="145.0" y="115.0" width="270.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="280.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динаміка шкали LHM:</text>
<text x="280.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Провал власного зонду → LHM + 1</text>
<text x="280.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Отримано підозру на себе → LHM + 1</text>
<text x="280.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">• Успішний раунд зондування → LHM - 1</text>
<rect x="35.0" y="230.0" width="380.0" height="145.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="225.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Адаптація поведінки вузла при LHM &gt; 0:</text>
<text x="225.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Зонд-пауза (Probe Pause): уповільнення пінгу</text>
<text x="225.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Подовження T_ack: захист від затримок GC/CPU</text>
<text x="225.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Збільшення вікна спростування T_suspect</text>
<text x="225.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол усвідомлює власне гальмування і не 'карає' сусідів</text>
<rect x="450.0" y="55.0" width="410.0" height="335.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="655.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Консенсус підозр (Dogpiling / Corroboration)</text>
<rect x="470.0" y="115.0" width="370.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="655.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кількість незалежних підтверджень C:</text>
<text x="655.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">C = 0 підтверджень  →  T_suspect = T_max (макс. шанс)</text>
<text x="655.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">C ≥ K підтверджень  →  T_suspect = T_min (швидкий крах)</text>
<rect x="470.0" y="215.0" width="370.0" height="45.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="470.0" y="215.0" width="145.0" height="45.0" rx="4" fill="#fca5a5" stroke="#c0392b" stroke-width="1.5"/>
<text x="542.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T_min (C=K)</text>
<text x="735.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Повне вікно T_max (C=0)</text>
<rect x="470.0" y="280.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="655.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула динамічного таймауту:</text>
<text x="655.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">T = T_max - (T_max - T_min) · [log(C+1) / log(K+1)]</text>
<text x="655.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Чим більше підтверджень, тим швидше вузол позначається Dead</text>
</svg>