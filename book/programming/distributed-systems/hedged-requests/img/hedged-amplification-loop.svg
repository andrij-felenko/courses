<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПЕТЛЯ МЕТАСТАБІЛЬНОЇ ВІДМОВИ: як неконтрольоване геджування перетворює легке перевантаження на колапс</tspan></text>
<rect x="103.5" y="127.3" width="273.1" height="65.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Початкове сповільнення сервісу</tspan><tspan x="240.0" dy="15.0">(база на 80% CPU або мережевий дрижак)</tspan><tspan x="240.0" dy="15.0">Затримка P50 зростає з 10 мс до 30 мс</tspan></text>
<line x1="410.0" y1="160.0" x2="520.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t &gt; t_h (25 мс)</text>
<rect x="543.6" y="127.3" width="292.8" height="65.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">2. Масовий запуск гедж-запитів</tspan><tspan x="690.0" dy="15.0">Замість 5% запитів поріг перевищують 80%!</tspan><tspan x="690.0" dy="15.0">Клієнти починають масово дублювати RPC</tspan></text>
<line x1="690.0" y1="215.0" x2="690.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="760.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+80% нового трафіку</text>
<rect x="537.1" y="337.3" width="305.9" height="65.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">3. Ампліфікація навантаження бекенду</tspan><tspan x="690.0" dy="15.0">Черги задач зростають, потоки вичерпуються.</tspan><tspan x="690.0" dy="15.0">Сервери витрачають CPU на виконання дублів</tspan></text>
<line x1="520.0" y1="370.0" x2="410.0" y2="370.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Черги ростуть</text>
<rect x="93.6" y="337.3" width="292.8" height="65.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="240.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">4. Затримка злітає до секунд</tspan><tspan x="240.0" dy="15.0">Тепер 100% запитів перевищують поріг t_h!</tspan><tspan x="240.0" dy="15.0">Кожен запит надсилає по 2-3 дублі</tspan></text>
<line x1="240.0" y1="310.0" x2="240.0" y2="215.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ПЕТЛЯ ЗАКРИЛАСЯ
(Повний колапс)</text>
<rect x="40.0" y="480.0" width="1100.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.4"/><text x="590.0" y="513.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">ЗАХИСТ: геджування КАТЕГОРИЧНО заборонено вмикати без бюджету токенів (Token Bucket) та вимикача (Circuit Breaker).</tspan><tspan x="590.0" dy="15.6">Якщо частка гедж-запитів досягає встановленого ліміту (наприклад, 10% від вхідного потоку),</tspan><tspan x="590.0" dy="15.6">клієнт припиняє надсилати дублі й чекає природної відповіді першої спроби.</tspan></text>
</svg>