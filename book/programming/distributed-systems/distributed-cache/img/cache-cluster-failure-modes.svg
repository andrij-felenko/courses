<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динаміка відмов у розподіленому кластері</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Аварія майстра, деградація хітрейту та лавинний ефект бази даних</text>
<rect x="40.0" y="95.0" width="270.0" height="230.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стан 1: Нормальна робота</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• Майстер A: 100k req/s (Hit 99%)</tspan><tspan x="175.0" dy="14.3">• Асинхронна реплікація на Replica A</tspan><tspan x="175.0" dy="14.3">• База даних отримує лише 1% запитів</tspan><tspan x="175.0" dy="14.3">• Латентність читання p99 &lt; 1 мс</tspan></text>
<line x1="310.0" y1="210.0" x2="360.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="335.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Аварія</text>
<rect x="360.0" y="95.0" width="280.0" height="230.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Стан 2: Фейловер (1-5 секунд)</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">• Майстер A падає (OOM / Kernel panic)</tspan><tspan x="500.0" dy="14.3">• Sentinel / Gossip фіксує таймаут</tspan><tspan x="500.0" dy="14.3">• Недорепліковані байти втрачаються</tspan><tspan x="500.0" dy="14.3">• Replica A промоутиться в Майстра</tspan><tspan x="500.0" dy="14.3">• Клієнти отримують Connection Refused</tspan></text>
<line x1="640.0" y1="210.0" x2="690.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="665.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки</text>
<rect x="690.0" y="95.0" width="270.0" height="230.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Стан 3: Лавина на первинне сховище</tspan><tspan x="825.0" dy="11.7"></tspan><tspan x="825.0" dy="11.7">• Промахи кешу (Cache Misses) летять в SQL</tspan><tspan x="825.0" dy="11.7">• База даних отримує сплеск x50 запитів</tspan><tspan x="825.0" dy="11.7">• Пул з'єднань БД вичерпано (Pool Exhaustion)</tspan><tspan x="825.0" dy="11.7">• Латентність SQL зростає з 5 мс до 10 с</tspan><tspan x="825.0" dy="11.7">• Каскадне падіння застосунків!</tspan></text>
<rect x="40.0" y="345.0" width="920.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Архітектурні заходи запобігання каскадним збоям:</tspan><tspan x="500.0" dy="14.3">1. Захист від лавини (Request Coalescing / Singleflight): злиття сотень паралельних промахів в один SQL-запит.</tspan><tspan x="500.0" dy="14.3">2. Імовірнісна рання регенерація (XFetch): оновлення запису у фоні до закінчення його TTL.</tspan><tspan x="500.0" dy="14.3">3. Circuit Breaker: відсікання частини некритичних запитів у разі деградації кешу (Graceful Degradation).</tspan><tspan x="500.0" dy="14.3">4. Теплий старт (Cache Warming): прогрівання критичних ключів перед пуском бойового трафіку на новий шард.</tspan></text>
</svg>