<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="25.0" width="400.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="44.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Дата-центр Франкфурт (Зона А)</tspan><tspan x="240.0" dy="16.2">Початковий стан: x = 1</tspan></text>
<rect x="520.0" y="25.0" width="400.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="44.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Дата-центр Дублін (Зона Б)</tspan><tspan x="720.0" dy="16.2">Початковий стан: x = 1</tspan></text>
<rect x="455.0" y="85.0" width="50.0" height="310.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<line x1="480.0" y1="95.0" x2="480.0" y2="385.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="5,4"/>
<rect x="457.0" y="190.0" width="46.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="473.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="473.0" dy="0.0">ОБРИВ</tspan><tspan x="473.0" dy="11.7">ЛІНКА</tspan><tspan x="473.0" dy="11.7">(P)</tspan></text>
<rect x="60.0" y="95.0" width="360.0" height="150.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<rect x="80.0" y="105.0" width="320.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Вузол 1 (Франкфурт)</tspan></text>
<rect x="80.0" y="145.0" width="320.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Клієнт виконує запис:</tspan><tspan x="240.0" dy="11.7">Write(x, 2) -&gt; OK</tspan><tspan x="240.0" dy="11.7">Локальне значення оновлено: x = 2.</tspan><tspan x="240.0" dy="11.7">Спроба відправити реплікацію на Вузол 2 блокується обривом.</tspan></text>
<rect x="540.0" y="95.0" width="360.0" height="150.0" rx="8" fill="#fff3cd" stroke="#c0392b" stroke-width="2.0"/>
<rect x="560.0" y="105.0" width="320.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Вузол 2 (Дублін)</tspan></text>
<rect x="560.0" y="145.0" width="320.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Клієнт виконує читання:</tspan><tspan x="720.0" dy="14.3">Read(x) -&gt; Що відповісти?</tspan><tspan x="720.0" dy="14.3">Вузол 2 не знає, чи був запис на Вузлі 1,</tspan><tspan x="720.0" dy="14.3">бо всі мережеві запити зависають на обриві.</tspan></text>
<rect x="60.0" y="270.0" width="360.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Клієнт А: Write(x, 2)</tspan></text>
<line x1="240.0" y1="270.0" x2="240.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="270.0" width="360.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Клієнт Б: Read(x)</tspan></text>
<line x1="720.0" y1="270.0" x2="720.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="335.0" width="400.0" height="160.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<rect x="75.0" y="345.0" width="370.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Рішення 1: CP (Строга узгодженість)</tspan></text>
<rect x="75.0" y="380.0" width="370.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Вузол 2 відмовляється відповідати без кворуму:</tspan><tspan x="260.0" dy="14.3">Read(x) -&gt; Error 503 / Timeout.</tspan><tspan x="260.0" dy="14.3">✓ Лінеаризовність збережена: старий x=1 не видано.</tspan><tspan x="260.0" dy="14.3">✗ Втрата доступності: живий клієнт отримав збій.</tspan></text>
<rect x="500.0" y="335.0" width="400.0" height="160.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<rect x="515.0" y="345.0" width="370.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Рішення 2: AP (Висока доступність)</tspan></text>
<rect x="515.0" y="380.0" width="370.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Вузол 2 негайно повертає локальне значення:</tspan><tspan x="700.0" dy="11.7">Read(x) -&gt; 1 (OK).</tspan><tspan x="700.0" dy="11.7">✓ 100% доступність: клієнт отримав миттєву відповідь.</tspan><tspan x="700.0" dy="11.7">✗ Втрата узгодженості: повернуто застарілий x=1 після запису x=2.</tspan></text>
</svg>