<rect x="70.0" y="240.0" width="420.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="269.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Фолбек (Холодний запит у реляційну БД без індексу):</tspan><tspan x="280.0" dy="14.3">• Час виконання: 850 мс (у 400× довше!)</tspan><tspan x="280.0" dy="14.3">• Створює 50 МБ алокацій у пам'яті</tspan><tspan x="280.0" dy="14.3">• Виснажує пул з'єднань пулу БД</tspan></text>
<rect x="70.0" y="350.0" width="420.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="381.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">НАСЛІДОК: МЕТАСТАБІЛЬНА АВАРІЯ</tspan><tspan x="280.0" dy="15.0">Фолбек споживає більше ресурсів, ніж нормальний шлях.</tspan><tspan x="280.0" dy="15.0">Система входить у смертельну спіраль і падає наглухо.</tspan></text>
