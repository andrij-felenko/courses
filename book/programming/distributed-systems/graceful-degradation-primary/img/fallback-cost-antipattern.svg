<rect x="570.0" y="240.0" width="420.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="269.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Детермінований фолбек (Static / Local O(1)):</tspan><tspan x="780.0" dy="14.3">• Час виконання: 0.05 мс (миттєве повернення)</tspan><tspan x="780.0" dy="14.3">• 0 алокацій (повертає статичний `std::span`)</tspan><tspan x="780.0" dy="14.3">• 0 викликів по мережі</tspan></text>
<rect x="570.0" y="350.0" width="420.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="382.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">НАСЛІДОК: РОЗВАНТАЖЕННЯ СИСТЕМИ</tspan><tspan x="780.0" dy="13.7">При перевантаженні фолбек знижує споживання CPU в 700 разів.</tspan><tspan x="780.0" dy="13.7">Кластер миттєво стабілізується.</tspan></text>
