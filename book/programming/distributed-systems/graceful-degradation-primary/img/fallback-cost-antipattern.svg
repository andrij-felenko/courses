<rect x="70.0" y="155.0" width="420.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Основний шлях (L1 Cache Hit):</tspan><tspan x="280.0" dy="14.3">Час виконання: 2 мс | Використання CPU: 0.1%</tspan><tspan x="280.0" dy="14.3">10 000 RPS обробляються легко</tspan></text>
