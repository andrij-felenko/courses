<rect x="570.0" y="155.0" width="420.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Основний шлях (Розподілений ML-пошук):</tspan><tspan x="780.0" dy="14.3">Час виконання: 35 мс | 100% точність скорингу</tspan><tspan x="780.0" dy="14.3">Вимагає 4 мережевих виклики</tspan></text>
