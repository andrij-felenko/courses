<line x1="445.0" y1="195.0" x2="465.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="655.0" y1="195.0" x2="675.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="865.0" y1="195.0" x2="885.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Вхідний пакет (JSON/XML)</text>
<text x="980.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Цільова черга (Protobuf)</text>
<rect x="255.0" y="330.0" width="610.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Карантин помилок: Мертва черга (Dead Letter Queue, DLQ)</text>
<text x="560.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фіксація причини збою: пошкоджений синтаксис, невідомий enum, відсутні обов'язкові поля</text>
<text x="560.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Оригінальні байти збережено + контекст помилки + трасування (Traceparent)</text>
<line x1="350.0" y1="290.0" x2="350.0" y2="330.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="395.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка парсингу</text>
<line x1="560.0" y1="290.0" x2="560.0" y2="330.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="620.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Семантичний збій</text>
<line x1="770.0" y1="290.0" x2="770.0" y2="330.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="825.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Порушення інваріанту</text>
<rect x="45.0" y="445.0" width="1050.0" height="50.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/><text x="570.0" y="473.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ключове правило надійності: транслятор ніколи не ковтає помилки мовчки та не запускає нескінченні повтори для невалідних даних — пошкоджений пакет ізолюється в DLQ із діагностичним контекстом.</tspan></text>
