<text x="225.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості Rumor Mongering:</text>
<text x="225.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Затримка: O(log N) раундів (надшвидкий розліт)</text>
<text x="225.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Трафік: O(k · N) невеликих UDP дейтаграм</text>
<text x="225.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Зупинка: лічильник дублікатів k або монета 1/k</text>
<text x="225.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Гарантія: імовірнісна (залишок неінфікованих ~ e^(-k))</text>
<rect x="455.0" y="52.0" width="400.0" height="318.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="655.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Anti-Entropy (Фонова анти-ентропія)</text>
