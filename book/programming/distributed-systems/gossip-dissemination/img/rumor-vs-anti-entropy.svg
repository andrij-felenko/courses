<line x1="740.0" y1="173.0" x2="570.0" y2="173.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="655.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. Дельти розбіжностей B</text>
