<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="25.0" width="470.0" height="55.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="48.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">КЕШ-ЗАМОК (Redis / SETNX / Redlock)</tspan><tspan x="275.0" dy="16.9">Орієнтація: Швидкість та ефективність</tspan></text><rect x="40.0" y="100.0" width="470.0" height="390.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><rect x="55.0" y="115.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Призначення: Захист від дублювання роботи (ефективність)</tspan></text><rect x="55.0" y="175.0" width="440.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Механізм: Ключ із TTL + перевірка випадкового значення (Lua)</tspan></text><rect x="55.0" y="235.0" width="440.0" height="48.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Слабке місце: Асинхронна реплікація: втрата замка при аварії майстра</tspan></text><rect x="55.0" y="295.0" width="440.0" height="48.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Годинник: Спирається на локальний настінний/монотонний час</tspan></text><rect x="55.0" y="355.0" width="440.0" height="48.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Наслідок збою: Можливий одночасний доступ двох клієнтів</tspan></text><rect x="55.0" y="415.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Ціна відмови: Низька (повторний розрахунок, зайвий лист)</tspan></text><rect x="570.0" y="25.0" width="470.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="48.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">КОНСЕНСУСНИЙ ЗАМОК (etcd / ZooKeeper)</tspan><tspan x="805.0" dy="16.9">Орієнтація: Строга коректність і лінеаризовність</tspan></text><rect x="570.0" y="100.0" width="470.0" height="390.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><rect x="585.0" y="115.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Призначення: Запобігання псуванню даних (строга коректність)</tspan></text><rect x="585.0" y="175.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Механізм: Ефемерні вузли, Raft/Paxos-кворум, лізи з KeepAlive</tspan></text><rect x="585.0" y="235.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Стійкість: Переживає падіння лідера без втрати інформації</tspan></text><rect x="585.0" y="295.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Огорожа: Монотонні лічильники (zxid, revision) для ресурсів</tspan></text><rect x="585.0" y="355.0" width="440.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Черга очікування: Спостереження (Watch) без штурму опитуванням</tspan></text><rect x="585.0" y="415.0" width="440.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Ціна: Вища латентність (RTP consensus round-trips)</tspan></text>
</svg>