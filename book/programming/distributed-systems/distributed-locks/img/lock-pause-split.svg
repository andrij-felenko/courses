<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="20.0" width="240.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Клієнт 1</tspan><tspan x="180.0" dy="16.9">(отримує замок)</tspan></text><rect x="420.0" y="20.0" width="240.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Сервер замків і Сховище</tspan><tspan x="540.0" dy="16.9">(замок TTL = 10 с)</tspan></text><rect x="780.0" y="20.0" width="240.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Клієнт 2</tspan><tspan x="900.0" dy="16.9">(перехоплює замок)</tspan></text><line x1="180.0" y1="80.0" x2="180.0" y2="175.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="180.0" y1="395.0" x2="180.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="540.0" y1="80.0" x2="540.0" y2="235.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="540.0" y1="275.0" x2="540.0" y2="370.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="540.0" y1="405.0" x2="540.0" y2="475.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="900.0" y1="80.0" x2="900.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="180.0" y1="110.0" x2="540.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Запит: Захопити замок (TTL 10 с)</text><line x1="540.0" y1="145.0" x2="180.0" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">2. Замок надано на 10 с</text><rect x="105.0" y="180.0" width="150.0" height="210.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="180.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">ПАУЗА ПРОЦЕСУ</tspan><tspan x="180.0" dy="14.3">(Stop-the-world GC,</tspan><tspan x="180.0" dy="14.3">свопінг або VM-лаг)</tspan><tspan x="180.0" dy="14.3">тривалість 15 с</tspan></text><circle cx="540.0" cy="255.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/><rect x="400.0" y="239.0" width="280.0" height="32.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Ліза Клієнта 1 спливла (час вийшов)</tspan></text><line x1="900.0" y1="290.0" x2="540.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Запит замка</text><line x1="540.0" y1="325.0" x2="900.0" y2="345.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">4. Замок надано Клієнту 2</text><line x1="900.0" y1="360.0" x2="540.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">5. Запис даних (Клієнт 2)</text><rect x="450.0" y="375.0" width="180.0" height="26.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="391.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Запис Клієнта 2 успішний</tspan></text><line x1="180.0" y1="430.0" x2="540.0" y2="455.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="360.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">6. Запізнілий запис Клієнта 1</tspan><tspan x="360.0" dy="15.0">(вважає, що замок досі його!)</tspan></text><rect x="320.0" y="485.0" width="440.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="507.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">КОНФЛІКТ І ПОРУШЕННЯ ЦІЛІСНОСТІ!</tspan><tspan x="540.0" dy="15.6">Сховище перезаписане застарілими даними</tspan></text>
</svg>