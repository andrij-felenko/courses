<rect x="80.0" y="50.0" width="260.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Шкала сервера (період лізи L = 10 с)</tspan></text><rect x="80.0" y="130.0" width="644.0" height="36.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="402.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чинна ліза на сервері (0 ... 10 с)</text><rect x="724.0" y="130.0" width="276.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="862.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Ліза спливла (замок вільний)</text><line x1="80.0" y1="124.0" x2="80.0" y2="172.0" stroke="#333333" stroke-width="2.0"/><text x="80.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">t = 0</text><line x1="724.0" y1="124.0" x2="724.0" y2="172.0" stroke="#c0392b" stroke-width="2.0"/><text x="724.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t = L (10 с)</text><rect x="80.0" y="220.0" width="320.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Шкала клієнта (робота та подовження)</tspan></text><rect x="80.0" y="300.0" width="73.6" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="116.8" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill