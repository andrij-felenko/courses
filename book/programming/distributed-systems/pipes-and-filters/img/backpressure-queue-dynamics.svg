<line x1="460.0" y1="95.0" x2="520.0" y2="95.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="72.0" width="120.0" height="46.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="600.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Повільний фільтр</tspan><tspan x="600.0" dy="13.0">(Споживач)</tspan><tspan x="600.0" dy="13.0">μ = 2 000 msg/s</tspan></text>
<rect x="740.0" y="65.0" width="225.0" height="75.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.0"/>
<text x="852.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат захисту:</text>
<text x="852.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Фіксоване споживання RAM</text>
<text x="852.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Прогнозована затримка</text>
<rect x="15.0" y="225.0" width="970.0" height="195.0" rx="8" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/>
