<rect x="50.0" y="287.0" width="120.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Швидкий фільтр</tspan><tspan x="110.0" dy="13.0">(Виробник)</tspan><tspan x="110.0" dy="13.0">λ = 10 000 msg/s</tspan></text>
<line x1="170.0" y1="310.0" x2="230.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="275.0" width="260.0" height="75.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="370.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Необмежена черга [Limit: ∞]</text>
<text x="370.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">5 000 000 повідомлень у черзі...</text>
<text x="370.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Затримка: &gt; 40 хвилин | RAM: 18 GB</text>
<line x1="500.0" y1="310.0" x2="560.0" y2="310.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580.0" y="287.0" width="120.0" height="46.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="640.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Повільний фільтр</tspan><tspan x="640.0" dy="13.0">(Споживач)</tspan><tspan x="640.0" dy="13.0">μ = 2 000 msg/s</tspan></text>
<rect x="770.0" y="280.0" width="195.0" height="85.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="867.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Катастрофічний фінал:</text>
<text x="867.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Out Of Memory (OOM Killer)</text>
<text x="867.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Деградація GC pauses</text>
<text x="867.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Втрата актуальності даних</text>
</svg>