<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Активне зондування (Active Probing) проти Пасивного спостереження (Outlier Detection)</text>
<rect x="30.0" y="55.0" width="440.0" height="400.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="250.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Активне зондування (Active Probes / Polling)</text>
<rect x="55.0" y="144.0" width="130.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Балансувальник /</tspan><tspan x="120.0" dy="13.0">Оркестратор</tspan><tspan x="120.0" dy="13.0">(Таймер кожні 5 с)</tspan></text>
<rect x="310.0" y="110.5" width="120.0" height="39.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Бекенд A</tspan><tspan x="370.0" dy="13.0">/healthz -&gt; 200 OK</tspan></text>
<rect x="307.9" y="200.5" width="124.3" height="39.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Бекенд B</tspan><tspan x="370.0" dy="13.0">/healthz -&gt; Timeout</tspan></text>
<line x1="190.0" y1="155.0" x2="305.0" y2="135.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">GET /healthz</text>
<line x1="190.0" y1="185.0" x2="305.0" y2="215.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Синтетичний запит</text>
<rect x="45.0" y="280.0" width="410.0" height="160.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="250.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Характеристики активного зондування:</tspan><tspan x="250.0" dy="12.3">• Штучний трафік: N балансувальників × M серверів</tspan><tspan x="250.0" dy="12.3">  породжують постійне фонове навантаження.</tspan><tspan x="250.0" dy="12.3">• Ризик фальшивого позитиву: /healthz повертає 200,</tspan><tspan x="250.0" dy="12.3">  але реальні бізнес-маршрути падають через deadlock.</tspan><tspan x="250.0" dy="12.3">• Періодичність: виявляє аварію лише після чергового</tspan><tspan x="250.0" dy="12.3">  інтервалу таймера (затримка виявлення = periodSeconds).</tspan></text>
<rect x="490.0" y="55.0" width="460.0" height="400.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="720.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Пасивне спостереження (Outlier Detection / Envoy)</text>
<rect x="501.9" y="144.0" width="146.2" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="575.0" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Зворотний проксі /</tspan><tspan x="575.0" dy="13.0">Envoy Sidecar</tspan><tspan x="575.0" dy="13.0">(Аналіз реальних RPC)</tspan></text>
<rect x="755.8" y="110.5" width="158.5" height="39.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Бекенд A</tspan><tspan x="835.0" dy="13.0">Реальні виклики -&gt; 200 OK</tspan></text>
<rect x="750.0" y="194.0" width="169.9" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="835.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Бекенд B (Outlier)</tspan><tspan x="835.0" dy="13.0">5 помилок 5xx поспіль</tspan><tspan x="835.0" dy="13.0">[Тимчасова евікція на 30 с]</tspan></text>
<line x1="650.0" y1="155.0" x2="755.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Користувацький RPC</text>
<line x1="650.0" y1="185.0" x2="750.0" y2="215.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">5xx / Connection Reset</text>
<rect x="505.0" y="280.0" width="430.0" height="160.0" rx="4" fill="#f0fff4" stroke="#27ae60" stroke-width="1.0"/>
<text x="720.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="720.0" dy="0.0">Характеристики пасивного спостереження:</tspan><tspan x="720.0" dy="12.3">• Нуль додаткового трафіку: аналізує реальні запити.</tspan><tspan x="720.0" dy="12.3">• Миттєва реакція: вузол вилучається одразу після k помилок</tspan><tspan x="720.0" dy="12.3">  (наприклад consecutive_5xx = 5) без очікування таймера.</tspan><tspan x="720.0" dy="12.3">• Outlier Ejection: ізолює вузол з високим лагом або помилками,</tspan><tspan x="720.0" dy="12.3">  повертаючи його в пул після періоду охолодження.</tspan><tspan x="720.0" dy="12.3">• Найвища точність для виявлення «сірих відмов» (gray failures).</tspan></text>
</svg>