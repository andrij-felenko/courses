<text x="722.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Каскадний колапс і петля CrashLoopBackOff</text>
<rect x="515.0" y="114.0" width="160.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Оркестратор (K8s)</tspan><tspan x="595.0" dy="13.0">Liveness failed</tspan><tspan x="595.0" dy="13.0">Одночасний SIGKILL</tspan></text>
<rect x="770.0" y="114.0" width="150.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">Усі 100 подів убито!</tspan><tspan x="845.0" dy="13.0">0 подів у ротації</tspan><tspan x="845.0" dy="13.0">100% 503 для клієнтів</tspan></text>
<line x1="680.0" y1="140.0" x2="765.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="532.0" y="223.1" width="380.0" height="53.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="722.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0.0">Рестарт 100 подів одночасно:</tspan><tspan x="722.0" dy="13.7">Шквал відкриття TCP-з'єднань на СУБД</tspan><tspan x="722.0" dy="13.7">(Thundering Herd на пулі конектів)</tspan></text>
<line x1="722.0" y1="185.0" x2="722.0" y2="215.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="722.0" y1="285.0" x2="722.0" y2="320.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="522.0" y="329.0" width="400.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="722.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0.0">Метастабільна відмова:</tspan><tspan x="722.0" dy="13.0">СУБД остаточно лягає під шквалом підключень.</tspan><tspan x="722.0" dy="13.0">Кластер назавжди застрягає в CrashLoopBackOff.</tspan></text>
<rect x="510.0" y="398.0" width="425.0" height="45.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="722.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновок: перевірка має залежати лише від локального стану процесу.</text>
</svg>