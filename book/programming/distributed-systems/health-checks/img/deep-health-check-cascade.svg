<text x="247.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Помилкова архітектура (Deep Probe)</text>
<rect x="60.0" y="130.5" width="140.0" height="39.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Pod 1 (Web)</tspan><tspan x="130.0" dy="13.0">/healthz -&gt; DB ping</tspan></text>
<rect x="60.0" y="210.5" width="140.0" height="39.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Pod 2 (Web)</tspan><tspan x="130.0" dy="13.0">/healthz -&gt; DB ping</tspan></text>
<rect x="60.0" y="290.5" width="140.0" height="39.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Pod 3 (Web)</tspan><tspan x="130.0" dy="13.0">/healthz -&gt; DB ping</tspan></text>
<rect x="276.8" y="202.2" width="186.5" height="55.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Спільна СУБД</tspan><tspan x="370.0" dy="14.3">(PostgreSQL / Redis)</tspan><tspan x="370.0" dy="14.3">Сплеск затримки (CPU 99%)</tspan></text>
<line x1="205.0" y1="150.0" x2="285.0" y2="210.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="205.0" y1="230.0" x2="285.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="205.0" y1="310.0" x2="285.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="365.0" width="405.0" height="75.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.0"/>
<text x="247.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="247.0" dy="0.0">Помилка: /healthz перевіряє спільну базу даних.</tspan><tspan x="247.0" dy="12.3">Коли база тимчасово сповільнюється, проби на ВСІХ подах</tspan><tspan x="247.0" dy="12.3">одночасно перевищують таймаут (1 секунда).</tspan></text>
