<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="30.0" width="240.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="51.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Реєстр періодичних задач</tspan><tspan x="160.0" dy="15.6">(Job Definition Store)</tspan></text>
<line x1="280.0" y1="55.0" x2="360.0" y2="55.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Hash(JobID)</text>
<rect x="360.0" y="20.0" width="330.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="525.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Консистентне кільце розподілу (Hash Ring)</text>
<rect x="375.0" y="52.0" width="90.0" height="38.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Шард 0..31</tspan><tspan x="420.0" dy="13.0">Вузол 1</tspan></text>
<rect x="480.0" y="52.0" width="90.0" height="38.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Шард 32..63</tspan><tspan x="525.0" dy="13.0">Вузол 2</tspan></text>
<rect x="585.0" y="52.0" width="90.0" height="38.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Шард 64..95</tspan><tspan x="630.0" dy="13.0">Вузол 3</tspan></text>
<rect x="750.0" y="30.0" width="270.0" height="60.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Координатор кластера (etcd / Raft)</tspan><tspan x="885.0" dy="13.7">Оренда ліз на володіння шардами</tspan><tspan x="885.0" dy="13.7">та виявлення відмов планувальників</tspan></text>
<line x1="690.0" y1="55.0" x2="750.0" y2="55.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="525.0" y1="100.0" x2="525.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Призначення шарду з лізою володіння</text>
<rect x="40.0" y="140.0" width="980.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="530.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПЛОЩИНА УПРАВЛІННЯ: Вузол планувальника (Control Plane / Scheduler Instance)</text>
<rect x="60.0" y="175.0" width="230.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Журнал стану шарду (WAL)</tspan><tspan x="175.0" dy="13.7">Збереження точок запуску</tspan><tspan x="175.0" dy="13.7">та розрахунок next_run_utc</tspan><tspan x="175.0" dy="13.7">(надійний стан на диску)</tspan></text>
<line x1="290.0" y1="225.0" x2="340.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="175.0" width="380.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Ієрархічне Часове Колесо (Timing Wheel)</tspan><tspan x="530.0" dy="13.7">O(1) додавання таймерів та O(1) перехід по такті</tspan><tspan x="530.0" dy="13.7">Колесо секунд (0..59) → Колесо хвилин (0..59) → Днів</tspan><tspan x="530.0" dy="13.7">Спрацьовує по монотонному тіку таймера</tspan></text>
<line x1="720.0" y1="225.0" x2="770.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="175.0" width="230.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Генератор тригерів (Dispatcher)</tspan><tspan x="885.0" dy="13.7">Додає Monotonic Fencing Epoch</tspan><tspan x="885.0" dy="13.7">та формує подію виконання</tspan><tspan x="885.0" dy="13.7">(Trigger Event)</tspan></text>
<line x1="530.0" y1="290.0" x2="530.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Асинхронний диспатч тригерів (Idempotency Key = JobID + SlotUTC)</text>
<rect x="40.0" y="330.0" width="980.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="530.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шина задач / Розподілена черга (Message Broker: Kafka / RabbitMQ / SQS)</text>
<line x1="200.0" y1="375.0" x2="200.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="375.0" x2="530.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="860.0" y1="375.0" x2="860.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="410.0" width="280.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Воркер 1 (Data Plane)</tspan><tspan x="200.0" dy="13.7">Перевірка Fencing Token &gt;= MaxSeen</tspan><tspan x="200.0" dy="13.7">та виконання бізнес-коду</tspan></text>
<rect x="390.0" y="410.0" width="280.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Воркер 2 (Data Plane)</tspan><tspan x="530.0" dy="13.7">Ідемпотентний запис у БД</tspan><tspan x="530.0" dy="13.7">та підтвердження (ACK) у чергу</tspan></text>
<rect x="720.0" y="410.0" width="280.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Воркер K (Data Plane)</tspan><tspan x="860.0" dy="13.7">Обробка повторів (Retries)</tspan><tspan x="860.0" dy="13.7">та звіт про завершення</tspan></text>
</svg>