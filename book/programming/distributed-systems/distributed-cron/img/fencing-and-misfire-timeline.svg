<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="1000.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="530.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала: Зміна планувальника, лізи та захист токеном огорожі (Fencing Token)</text>
<line x1="70.0" y1="120.0" x2="990.0" y2="120.0" stroke="#333333" stroke-width="1.5"/>
<line x1="980.0" y1="120.0" x2="1000.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="990.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Час t</text>
<rect x="80.0" y="60.0" width="220.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="79.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Планувальник 1</tspan><tspan x="190.0" dy="13.7">Ліза чинна (Epoch = 41)</tspan></text>
<line x1="190.0" y1="105.0" x2="190.0" y2="135.0" stroke="#333333" stroke-width="1.2"/>
<circle cx="190.0" cy="120.0" r="4.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<text x="190.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">t=0: Диспатч (Epoch=41)</text>
<rect x="330.0" y="60.0" width="200.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="79.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">GC-ПАУЗА Планувальника 1</tspan><tspan x="430.0" dy="13.7">(процес зависає на 20 с)</tspan></text>
<line x1="430.0" y1="105.0" x2="430.0" y2="135.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="430.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">t=10: Спливання лізи TTL</text>
<rect x="560.0" y="60.0" width="220.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="79.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Планувальник 2 бере шард</tspan><tspan x="670.0" dy="13.7">Нова ліза (Epoch = 42)</tspan></text>
<line x1="670.0" y1="105.0" x2="670.0" y2="135.0" stroke="#333333" stroke-width="1.2"/>
<circle cx="670.0" cy="120.0" r="4.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<text x="670.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">t=12: Диспатч (Epoch=42)</text>
<rect x="800.0" y="60.0" width="190.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="79.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">Запізнілий тригер Epoch=41</tspan><tspan x="895.0" dy="13.7">ВІДХИЛЕНО воркером!</tspan></text>
<line x1="895.0" y1="105.0" x2="895.0" y2="135.0" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="895.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="895.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">t=22: Відхилено (41 &lt; 42)</text>
<rect x="80.0" y="170.0" width="900.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="194.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Правило огорожі: Воркер фіксує найвищу епоху MaxSeen=42. Коли запізнілий сигнал від зомбі-планувальника 1</tspan><tspan x="530.0" dy="13.7">з епохою 41 прибуває до системи, він безумовно відкидається, запобігаючи повторному запуску задачі.</tspan></text>
<rect x="30.0" y="255.0" width="1000.0" height="215.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="530.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Політики обробки пропущених запусків (Misfire Policies) після відновлення від збою</text>
<rect x="60.0" y="300.0" width="240.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="319.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Вікно простою системи (Outage)</tspan><tspan x="180.0" dy="13.0">Пропущено точки: 02:00, 02:15, 02:30</tspan></text>
<rect x="330.0" y="300.0" width="670.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="319.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. FireAndProceed (Catch-Up / Наздогнати всі):</tspan><tspan x="665.0" dy="11.7">Послідовно запускає всі 3 пропущені ітерації (02:00, 02:15, 02:30). Обов'язково для фінансового білінгу та агрегації.</tspan></text>
<rect x="330.0" y="355.0" width="670.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="374.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. FireOnceNow (Запустити один раз зараз):</tspan><tspan x="665.0" dy="11.7">Ігнорує кількість пропусків і запускає рівно 1 наздоганяючу ітерацію, далі за розкладом. Для прогріву кешу та синхронізації.</tspan></text>
<rect x="330.0" y="410.0" width="670.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="429.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">3. IgnoreMisfires / Skip (Пропустити всі втрачені):</tspan><tspan x="665.0" dy="13.0">Скидає всі пропущені запуски і чекає наступного штатного слота (02:45). Для збору телеметрії та живих сповіщень.</tspan></text>
</svg>