<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="290.0" width="160.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="140.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Вхідний RPC-запит</tspan><tspan x="140.0" dy="16.9">(Request Arrival)</tspan></text>
<line x1="220.0" y1="330.0" x2="270.0" y2="330.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="280.0" width="220.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Перевірка допуску:</tspan><tspan x="380.0" dy="17.6">in_flight &lt; Limit?</tspan></text>
<line x1="380.0" y1="380.0" x2="380.0" y2="520.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="395.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Ні (переповнено)</text>
<rect x="280.0" y="520.0" width="200.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="380.0" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Швидке скидання:</tspan><tspan x="380.0" dy="16.2">HTTP 429 / 503</tspan><tspan x="380.0" dy="16.2">(0 затрат ресурсів)</tspan></text>
<line x1="490.0" y1="330.0" x2="560.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="525.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<rect x="560.0" y="280.0" width="210.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="665.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Обробка запиту</tspan><tspan x="665.0" dy="16.9">(Сервіс / База даних)</tspan><tspan x="665.0" dy="16.9">Фіксація t_start, t_end</tspan></text>
<line x1="770.0" y1="330.0" x2="830.0" y2="330.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="290.0" width="150.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="905.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">Успішна відповідь</tspan><tspan x="905.0" dy="15.6">клієнту</tspan></text>
<line x1="665.0" y1="280.0" x2="665.0" y2="140.0" stroke="#333333" stroke-width="1.8"/>
<line x1="665.0" y1="140.0" x2="720.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Телеметрія RTT</text>
<rect x="720.0" y="90.0" width="220.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="830.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Вікно вимірювань:</tspan><tspan x="830.0" dy="16.2">minRTT = min(RTT_i)</tspan><tspan x="830.0" dy="16.2">sampleRTT = avg(RTT_i)</tspan></text>
<line x1="940.0" y1="140.0" x2="990.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="990.0" y="80.0" width="180.0" height="120.0" rx="6" fill="#fbf4db" stroke="#b45309" stroke-width="2.0"/><text x="1080.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">Градієнт затримки:</tspan><tspan x="1080.0" dy="15.6">g = minRTT / sampleRTT</tspan><tspan x="1080.0" dy="15.6"></tspan><tspan x="1080.0" dy="15.6">Limit_new =</tspan><tspan x="1080.0" dy="15.6">Limit · g + headroom</tspan></text>
<line x1="1080.0" y1="200.0" x2="1080.0" y2="240.0" stroke="#b45309" stroke-width="1.8"/>
<line x1="1080.0" y1="240.0" x2="380.0" y2="240.0" stroke="#b45309" stroke-width="1.8"/>
<line x1="380.0" y1="240.0" x2="380.0" y2="280.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Динамічне оновлення ліміту паралелізму Limit</text>
<rect x="100.0" y="620.0" width="1000.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="600.0" y="646.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Автоматичний гомеостаз: якщо sampleRTT росте через черги, g &lt; 1 і ліміт звужується;</tspan><tspan x="600.0" dy="16.2">якщо затримка повертається до норми, g ≈ 1 і ліміт плавно розширюється за рахунок headroom.</tspan></text>
</svg>