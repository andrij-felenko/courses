<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="25.0" width="340.0" height="410.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/>
<rect x="55.0" y="40.0" width="310.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="210.0" y="61.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Щонайбільше один раз</tspan><tspan x="210.0" dy="18.2">(At-most-once)</tspan></text>
<rect x="55.0" y="105.0" width="310.0" height="315.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="210.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Спроб: рівно 1 (без повторів)</tspan><tspan x="210.0" dy="16.2">Підтвердження: до або без обробки</tspan><tspan x="210.0" dy="16.2"></tspan><tspan x="210.0" dy="16.2">• Втрати: МОЖЛИВІ (0 або 1)</tspan><tspan x="210.0" dy="16.2">• Дублікати: ВИКЛЮЧЕНІ</tspan><tspan x="210.0" dy="16.2">• Ціна: мінімальна затримка</tspan><tspan x="210.0" dy="16.2"></tspan><tspan x="210.0" dy="16.2">Застосування: метрики, телеметрія,</tspan><tspan x="210.0" dy="16.2">потокове аудіо/відео, де свіжість</tspan><tspan x="210.0" dy="16.2">важливіша за повноту.</tspan></text>
<rect x="410.0" y="25.0" width="340.0" height="410.0" rx="8" fill="#fef9e7" stroke="#333333" stroke-width="1.6"/>
<rect x="425.0" y="40.0" width="310.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="580.0" y="61.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Щонайменше один раз</tspan><tspan x="580.0" dy="18.2">(At-least-once)</tspan></text>
<rect x="425.0" y="105.0" width="310.0" height="315.0" rx="6" fill="#fef9e7" stroke="none" stroke-width="1.5"/><text x="580.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Спроб: 1..N (повтори до ACK)</tspan><tspan x="580.0" dy="16.2">Підтвердження: після запису/обробки</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">• Втрати: ВИКЛЮЧЕНІ (при стійкості)</tspan><tspan x="580.0" dy="16.2">• Дублікати: НЕМИНУЧІ</tspan><tspan x="580.0" dy="16.2">• Ціна: навантаження від повторів</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">Застосування: черги повідомлень</tspan><tspan x="580.0" dy="16.2">(RabbitMQ, Kafka, SQS) за замовчуванням;</tspan><tspan x="580.0" dy="16.2">базовий фундамент систем.</tspan></text>
<rect x="780.0" y="25.0" width="340.0" height="410.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/>
<rect x="795.0" y="40.0" width="310.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="950.0" y="61.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">Рівно один наслідок</tspan><tspan x="950.0" dy="18.2">(Effectively-once)</tspan></text>
<rect x="795.0" y="105.0" width="310.0" height="315.0" rx="6" fill="#e8f6ee" stroke="none" stroke-width="1.5"/><text x="950.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">At-least-once + Ідемпотентність</tspan><tspan x="950.0" dy="16.2">(дедуплікація на боці стану)</tspan><tspan x="950.0" dy="16.2"></tspan><tspan x="950.0" dy="16.2">• Втрати: ВИКЛЮЧЕНІ</tspan><tspan x="950.0" dy="16.2">• Дублікати: ВІДСІКАЮТЬСЯ</tspan><tspan x="950.0" dy="16.2">• Ціна: пам'ять під ключі + транзакції</tspan><tspan x="950.0" dy="16.2"></tspan><tspan x="950.0" dy="16.2">Застосування: фінансові операції,</tspan><tspan x="950.0" dy="16.2">білінг, зміна залишків на складі,</tspan><tspan x="950.0" dy="16.2">критичні мутації бази даних.</tspan></text>
</svg>