<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкий шлях за метаданими проти глибокого аналізу вмісту</text>
<rect x="10.0" y="10.0" width="980.0" height="400.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Продуктивність та ізоляція збоїв у маршрутизаторі повідомлень</text>
<rect x="30.0" y="65.0" width="455.0" height="325.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="257.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкий шлях: маршрутизація за заголовками</text>
<line x1="50.0" y1="110.0" x2="465.0" y2="110.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="257.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">• Зчитування транспортних метаданих (AMQP/Kafka headers)</tspan><tspan x="257.0" dy="14.7">• Zero-copy сканування: тіло повідомлення не десеріалізується</tspan><tspan x="257.0" dy="14.7">• Затримка: 2–10 мікросекунд на повідомлення</tspan><tspan x="257.0" dy="14.7">• Пропускна здатність: сотні тисяч / мільйони msg/sec на ядро</tspan><tspan x="257.0" dy="14.7">• Мінімальне навантаження на GC / алокатор пам'яті</tspan></text>
<rect x="49.5" y="312.5" width="415.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="257.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">Вхідний пакет → Заголовки (Тип/Регіон) → Цільова черга</tspan><tspan x="257.0" dy="13.0">(Тіло передається як сирий зріз байтів без розбору)</tspan></text>
<rect x="515.0" y="65.0" width="455.0" height="325.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/>
<text x="742.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Глибокий аналіз вмісту та обробка аномалій</text>
<line x1="535.0" y1="110.0" x2="950.0" y2="110.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="742.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">• Парсинг JSON/Protobuf/Avro для перевірки внутрішніх полів</tspan><tspan x="742.0" dy="14.7">• Висока ціна CPU: десеріалізація займає 80–95% часу обробки</tspan><tspan x="742.0" dy="14.7">• Ризик отруйних повідомлень (Poison Pill) при битому синтаксисі</tspan><tspan x="742.0" dy="14.7">• Немаршрутизовані повідомлення скидаються в Dead Letter Queue</tspan><tspan x="742.0" dy="14.7">• Зворотний тиск (Backpressure) при переповненні буфера черги</tspan></text>
<rect x="534.5" y="312.5" width="415.0" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="742.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">Битий JSON / Немає правила → Dead Letter Queue (DLQ)</tspan><tspan x="742.0" dy="13.0">(Ізоляція помилок без зупинки основного конвеєра)</tspan></text>
</svg>