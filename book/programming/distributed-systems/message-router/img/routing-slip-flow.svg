<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність обробки через Routing Slip</text>
<rect x="10.0" y="10.0" width="980.0" height="340.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутний лист (Routing Slip): послідовна обробка без центрального оркестратора</text>
<rect x="15.0" y="75.0" width="210.0" height="100.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="120.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Початок (Ingress)</text>
<line x1="30.0" y1="110.0" x2="210.0" y2="110.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="120.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Впорскування списку</tspan><tspan x="120.0" dy="14.2">Slip: [KYC, Fraud, Billing]</tspan></text>
<rect x="265.0" y="75.0" width="210.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="370.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Сервіс KYC</text>
<line x1="280.0" y1="110.0" x2="460.0" y2="110.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="370.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Виконує валідацію</tspan><tspan x="370.0" dy="14.2">Slip: [Fraud, Billing]</tspan></text>
<rect x="525.0" y="75.0" width="210.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="630.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Фрод-контроль</text>
<line x1="540.0" y1="110.0" x2="720.0" y2="110.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="630.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Оцінює кредитний ризик</tspan><tspan x="630.0" dy="14.2">Slip: [Billing]</tspan></text>
<rect x="775.0" y="75.0" width="210.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="880.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Сервіс білінгу</text>
<line x1="790.0" y1="110.0" x2="970.0" y2="110.0" stroke="#6b7280" stroke-width="0.8"/>
<text x="880.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Списує кошти з балансу</tspan><tspan x="880.0" dy="14.2">Slip: [] (порожній)</tspan></text>
<line x1="228.0" y1="120.0" x2="262.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="478.0" y1="120.0" x2="522.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="738.0" y1="120.0" x2="772.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="210.0" width="920.0" height="115.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка заголовка Routing Slip на кожному етапі:</text>
<text x="500.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Вхідний шлюз формує заголовок X-Routing-Slip зі списком черг або кінцевих точок обробки.</tspan><tspan x="500.0" dy="13.0">2. Сервіс зчитує повідомлення, виконує локальну дію, вилучає (pop) себе зі списку заголовка.</tspan><tspan x="500.0" dy="13.0">3. Якщо в списку ще лишилися адресати — повідомлення автоматично пушиться на наступний крок.</tspan><tspan x="500.0" dy="13.0">4. Коли список порожніє — конвеєр успішно завершено. Немає єдиного вузького місця оркестратора.</tspan></text>
</svg>