<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл Scatter-Gather: паралельний старт, спекулятивне геджування та відміна</text>
<rect x="15.0" y="48.0" width="910.0" height="415.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<rect x="45.0" y="87.9" width="130.0" height="44.1" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Scatter-Gather</tspan><tspan x="110.0" dy="13.7">Coordinator</tspan></text>
<line x1="185.0" y1="95.0" x2="340.0" y2="95.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">t=0: Запит A</text>
<line x1="185.0" y1="125.0" x2="340.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">t=0: Запит B</text>
<rect x="365.0" y="73.5" width="150.0" height="43.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Сервіс A (Ціни)</tspan><tspan x="440.0" dy="13.0">Успіх за 18 мс</tspan></text>
<line x1="525.0" y1="95.0" x2="680.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">t=18 мс: Результат</text>
<rect x="360.0" y="153.5" width="160.0" height="43.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="440.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Сервіс B (Репліка 1)</tspan><tspan x="440.0" dy="13.0">Зависання в черзі...</tspan></text>
<line x1="340.0" y1="220.0" x2="520.0" y2="220.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="430.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Таймаут геджування (p95 = 25 мс) вичерпано!</text>
<line x1="185.0" y1="135.0" x2="340.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">t=25 мс: Геджований Запит B2</text>
<rect x="360.0" y="243.5" width="160.0" height="43.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Сервіс B (Репліка 2)</tspan><tspan x="440.0" dy="13.0">Успіх за 12 мс</tspan></text>
<line x1="530.0" y1="265.0" x2="680.0" y2="135.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="605.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">t=37 мс: Результат B2</text>
<line x1="680.0" y1="130.0" x2="530.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="615.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Скасування (Cancel)</text>
<rect x="692.5" y="89.3" width="165.0" height="71.4" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.8"/><text x="775.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Злиття результатів</tspan><tspan x="775.0" dy="13.7">(Aggregation)</tspan><tspan x="775.0" dy="13.7">Латентність: 37 мс</tspan><tspan x="775.0" dy="13.7">(замість 350 мс!)</tspan></text>
<rect x="45.0" y="355.6" width="850.0" height="78.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ключові механізми надійності Scatter-Gather:</tspan><tspan x="470.0" dy="12.3">1. Bounded Concurrency: обмежений пул корутин / потоків координатора</tspan><tspan x="470.0" dy="12.3">2. Speculative Hedging: паралельний дублюючий запит при перевищенні p95 порогу</tspan><tspan x="470.0" dy="12.3">3. Cancellation Propagation: миттєве скидання зайвих гілок через Context / Stop Token</tspan><tspan x="470.0" dy="12.3">4. Graceful Degradation: видача часткового результату при досягненні твердого дедлайну</tspan></text>
</svg>