<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1250" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="90.0" y1="215.0" x2="1170.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="40.0" y="55.0" width="250.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/><text x="165.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">чистий м'який стан</tspan><tspan x="165.0" dy="16.2"></tspan><tspan x="165.0" dy="16.2">лише періодичні оновлення</tspan><tspan x="165.0" dy="16.2">і строк на боці приймача</tspan></text>
<line x1="165.0" y1="190.0" x2="165.0" y2="207.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="165.0" cy="215.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="345.0" y="55.0" width="250.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.4"/><text x="470.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">+ явне видалення</tspan><tspan x="470.0" dy="16.2"></tspan><tspan x="470.0" dy="16.2">PathTear і ResvTear у RSVP</tspan><tspan x="470.0" dy="16.2">без підтвердження доставки</tspan></text>
<line x1="470.0" y1="190.0" x2="470.0" y2="207.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="470.0" cy="215.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="650.0" y="55.0" width="250.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="775.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">+ надійна доставка змін</tspan><tspan x="775.0" dy="16.2"></tspan><tspan x="775.0" dy="16.2">RFC 2961: ідентифікатори,</tspan><tspan x="775.0" dy="16.2">зведені рефреші, квитанції</tspan></text>
<line x1="775.0" y1="190.0" x2="775.0" y2="207.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="775.0" cy="215.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="955.0" y="55.0" width="250.0" height="130.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="1080.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">чистий твердий стан</tspan><tspan x="1080.0" dy="16.2"></tspan><tspan x="1080.0" dy="16.2">встановлення й розбирання</tspan><tspan x="1080.0" dy="16.2">по разу: Q.2931, ST-II</tspan></text>
<line x1="1080.0" y1="190.0" x2="1080.0" y2="207.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="1080.0" cy="215.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="92.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">менше зобов'язань, більше фону</text>
<text x="1168.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">більше зобов'язань, менше фону</text>
<rect x="70.0" y="285.0" width="1110.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="625.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">SIGCOMM 2003: одна модель накрила весь відрізок. Явне видалення коштує майже нічого, а розходження станів зменшує різко;</tspan><tspan x="625.0" dy="17.6">з надійною доставкою змін м'який стан наздоганяє твердий за узгодженістю — тож протоколи не такі різні, як здається.</tspan></text>
</svg>