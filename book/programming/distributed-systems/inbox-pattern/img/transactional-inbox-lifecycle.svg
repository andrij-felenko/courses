<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЖИТТЄВИЙ ЦИКЛ ПОВІДОМЛЕННЯ: атомарна дедуплікація та захист від дублів</tspan></text>
<rect x="50.0" y="100.0" width="200.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">БРОКЕР ПОВІДОМЛЕНЬ</tspan><tspan x="150.0" dy="15.0">(Kafka / RabbitMQ / SQS)</tspan><tspan x="150.0" dy="15.0">доставка at-least-once</tspan></text>
<line x1="250.0" y1="140.0" x2="340.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">повідомлення
(msg_id, payload)</text>
<rect x="345.0" y="95.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/><text x="460.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">ТРАНЗАКЦІЯ БД (BEGIN)</tspan><tspan x="460.0" dy="16.2">INSERT INTO inbox</tspan><tspan x="460.0" dy="16.2">ON CONFLICT DO NOTHING</tspan></text>
<line x1="575.0" y1="140.0" x2="680.0" y2="140.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="628.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Новий msg_id</text>
<rect x="685.0" y="95.0" width="240.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="805.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">БІЗНЕС-ОБРОБКА</tspan><tspan x="805.0" dy="16.2">мутація доменних таблиць</tspan><tspan x="805.0" dy="16.2">status = 'PROCESSED'</tspan></text>
<line x1="925.0" y1="140.0" x2="985.0" y2="140.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="990.0" y="95.0" width="160.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.2"/><text x="1070.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">COMMIT</tspan><tspan x="1070.0" dy="16.2">транзакції</tspan><tspan x="1070.0" dy="16.2">успішно</tspan></text>
<line x1="1070.0" y1="185.0" x2="1070.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="1070.0" y1="270.0" x2="150.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="150.0" y1="270.0" x2="150.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ПІДТВЕРДЖЕННЯ БРОКЕРУ (ACK / Commit Offset) — повідомлення вилучається з черги</text>
<line x1="460.0" y1="185.0" x2="460.0" y2="360.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="475.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Колізія UNIQUE (дубль)</text>
<rect x="345.0" y="365.0" width="230.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="460.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">ДУБЛЬ ВЖЕ В БАЗІ</tspan><tspan x="460.0" dy="16.2">ROLLBACK транзакції</tspan><tspan x="460.0" dy="16.2">ігнорування бізнес-коду</tspan></text>
<line x1="575.0" y1="410.0" x2="800.0" y2="410.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Безпечний повторний ACK</text>
<rect x="805.0" y="365.0" width="200.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.8"/><text x="905.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">НЕГАЙНИЙ ACK</tspan><tspan x="905.0" dy="16.2">брокер зупиняє</tspan><tspan x="905.0" dy="16.2">пересилання дублів</tspan></text>
<line x1="1005.0" y1="410.0" x2="1070.0" y2="410.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="1070.0" y1="410.0" x2="1070.0" y2="270.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="805.0" y1="185.0" x2="805.0" y2="480.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<line x1="805.0" y1="480.0" x2="805.0" y2="490.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="815.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Помилка в бізнес-коді</text>
<rect x="685.0" y="490.0" width="240.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="805.0" y="518.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">ЗБІЙ ОБРОБКИ</tspan><tspan x="805.0" dy="15.6">ROLLBACK + retry_count++</tspan><tspan x="805.0" dy="15.6">при перевищенні → DLQ</tspan></text>
<rect x="40.0" y="585.0" width="1120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="611.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">автомат гарантує неподільність: кожне повідомлення або виконує бізнес-ефект і фіксується в inbox,</tspan><tspan x="600.0" dy="16.2">або відкочується цілком і чекає повтору брокера; уже зафіксовані дублікати миттєво глушаться</tspan></text>
</svg>