<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПАСТКА РОЗДІЛЬНОЇ ДЕДУПЛІКАЦІЇ: чому зовнішній реєстр не рятує від збоїв</tspan></text>
<rect x="50.0" y="85.0" width="510.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="305.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">РОЗДІЛЬНІ СХОВИЩА (ПОМИЛКА)</tspan><tspan x="305.0" dy="16.9">ключ у Redis, бізнес-стан у PostgreSQL</tspan></text>
<rect x="70.0" y="160.0" width="470.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="305.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Сценарій А: Спочатку база даних, потім кеш</tspan><tspan x="305.0" dy="15.0">1. UPDATE balances SET amount = amount - 500 (Успіх)</tspan><tspan x="305.0" dy="15.0">2. КРАХ споживача до запису ключа в Redis!</tspan></text>
<rect x="70.0" y="240.0" width="470.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="305.0" y="266.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Брокер пересилає повідомлення через таймаут ACK</tspan><tspan x="305.0" dy="15.0">Ключа в Redis немає → БАЗА ОНОВЛЮЄТЬСЯ ВДРУГЕ (Збитки!)</tspan></text>
<rect x="70.0" y="315.0" width="470.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="305.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Сценарій Б: Спочатку кеш, потім база даних</tspan><tspan x="305.0" dy="15.0">1. SETNX idempotency:msg-101 (Успіх у Redis)</tspan><tspan x="305.0" dy="15.0">2. КРАХ споживача до виконання SQL у PostgreSQL!</tspan></text>
<rect x="70.0" y="395.0" width="470.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="305.0" y="421.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Брокер пересилає повідомлення повторно</tspan><tspan x="305.0" dy="15.0">Ключ у Redis знайдено → ОБРОБКУ ПРОПУЩЕНО (Подія втрачена!)</tspan></text>
<rect x="70.0" y="470.0" width="470.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="305.0" y="491.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Причина: неможливо гарантувати атомарність</tspan><tspan x="305.0" dy="15.0">між двома незалежними мережевими вузлами</tspan></text>
<rect x="620.0" y="85.0" width="510.0" height="56.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="875.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">TRANSACTIONAL INBOX (ПРАВИЛЬНО)</tspan><tspan x="875.0" dy="16.9">дедуплікація і стан в одній локальній транзакції</tspan></text>
<rect x="640.0" y="160.0" width="470.0" height="190.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="875.0" y="184.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">BEGIN TRANSACTION;</tspan><tspan x="875.0" dy="15.0"></tspan><tspan x="875.0" dy="15.0">  -- 1. Спроба вставити ідентифікатор події</tspan><tspan x="875.0" dy="15.0">  INSERT INTO inbox (message_id, handler, status)</tspan><tspan x="875.0" dy="15.0">  VALUES ('msg-101', 'OrderPaid', 'PROCESSED');</tspan><tspan x="875.0" dy="15.0"></tspan><tspan x="875.0" dy="15.0">  -- 2. Мутація бізнес-таблиць</tspan><tspan x="875.0" dy="15.0">  UPDATE balances SET amount = amount - 500 WHERE user_id = 42;</tspan><tspan x="875.0" dy="15.0">  INSERT INTO orders (id, status) VALUES ('ord-101', 'PAID');</tspan><tspan x="875.0" dy="15.0"></tspan><tspan x="875.0" dy="15.0">COMMIT;</tspan></text>
<rect x="640.0" y="365.0" width="470.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="875.0" y="399.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">При збої до COMMIT: відкочується І запис у inbox, І бізнес-зміни.</tspan><tspan x="875.0" dy="13.7">При повторі брокера: транзакція почнеться заново й виконається чисто.</tspan></text>
<rect x="640.0" y="455.0" width="470.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="875.0" y="477.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">При збої після COMMIT (втрата ACK):</tspan><tspan x="875.0" dy="13.7">Повторний INSERT спричинить UniqueViolation → споживач відкидає дубль</tspan><tspan x="875.0" dy="13.7">і безпечно підтверджує повідомлення в брокері (ACK).</tspan></text>
<rect x="40.0" y="555.0" width="1100.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="577.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">золоте правило споживача: стан дедуплікації мусить фіксуватися в тій самій транзакції, що й бізнес-стан;</tspan><tspan x="590.0" dy="16.2">лише єдина транзакція бази даних перетворює ненадійний транспорт на надійну обробку</tspan></text>
</svg>