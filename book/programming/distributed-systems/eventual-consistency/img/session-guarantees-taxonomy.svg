<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири сесійні гарантії поверх кінцево-узгодженого сховища</text>
<rect x="35.0" y="65.0" width="265.0" height="515.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="43.0" y="73.0" width="249.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#c0392b" stroke-width="1.5"/><text x="167.5" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">1. ЧИТАЙ ВЛАСНІ ЗАПИСИ</tspan><tspan x="167.5" dy="15.0">(Read-Your-Writes)</tspan></text>
<rect x="43.0" y="133.0" width="249.0" height="28.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="167.5" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Клієнт бачить власні оновлення</tspan></text>
<rect x="45.0" y="169.0" width="245.0" height="165.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="167.5" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">АНАЛІЗ АНОМАЛІЇ:</tspan><tspan x="167.5" dy="13.7">Оновив аватар профілю,</tspan><tspan x="167.5" dy="13.7">перезавантажив сторінку —</tspan><tspan x="167.5" dy="13.7">і знову бачить старе фото,</tspan><tspan x="167.5" dy="13.7">бо запит потрапив на репліку,</tspan><tspan x="167.5" dy="13.7">яка ще не отримала запис.</tspan></text>
<rect x="45.0" y="343.0" width="245.0" height="185.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="167.5" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">ІНЖЕНЕРНИЙ ЗАХИСТ:</tspan><tspan x="167.5" dy="13.7">Читання після запису</tspan><tspan x="167.5" dy="13.7">маршрутизуються на лідер,</tspan><tspan x="167.5" dy="13.7">або клієнт передає токен</tspan><tspan x="167.5" dy="13.7">версії й чекає, поки репліка</tspan><tspan x="167.5" dy="13.7">наздожене цей LSN.</tspan></text>
<rect x="45.0" y="537.0" width="245.0" height="30.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.0"/><text x="167.5" y="555.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">Гарантія на рівні сесії</tspan></text>
<rect x="320.0" y="65.0" width="265.0" height="515.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="328.0" y="73.0" width="249.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="452.5" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">2. МОНОТОННЕ ЧИТАННЯ</tspan><tspan x="452.5" dy="15.0">(Monotonic Reads)</tspan></text>
<rect x="328.0" y="133.0" width="249.0" height="28.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="452.5" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="452.5" dy="0.0">Час ніколи не йде назад</tspan></text>
<rect x="330.0" y="169.0" width="245.0" height="165.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="452.5" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="452.5" dy="0.0">АНАЛІЗ АНОМАЛІЇ:</tspan><tspan x="452.5" dy="13.7">Перший запит повернув</tspan><tspan x="452.5" dy="13.7">свіжий стан v2 зі швидкого</tspan><tspan x="452.5" dy="13.7">вузла, а повторний запит</tspan><tspan x="452.5" dy="13.7">повернув старий стан v1</tspan><tspan x="452.5" dy="13.7">із запізнілої репліки.</tspan></text>
<rect x="330.0" y="343.0" width="245.0" height="185.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="452.5" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="452.5" dy="0.0">ІНЖЕНЕРНИЙ ЗАХИСТ:</tspan><tspan x="452.5" dy="13.7">Балансувальник зберігає</tspan><tspan x="452.5" dy="13.7">сесійний токен версії</tspan><tspan x="452.5" dy="13.7">і відхиляє вузли,</tspan><tspan x="452.5" dy="13.7">у яких номер транзакції</tspan><tspan x="452.5" dy="13.7">менший за вже бачений.</tspan></text>
<rect x="330.0" y="537.0" width="245.0" height="30.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.0"/><text x="452.5" y="555.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">Гарантія на рівні сесії</tspan></text>
<rect x="605.0" y="65.0" width="265.0" height="515.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="613.0" y="73.0" width="249.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="737.5" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="737.5" dy="0.0">3. МОНОТОННИЙ ЗАПИС</tspan><tspan x="737.5" dy="15.0">(Monotonic Writes)</tspan></text>
<rect x="613.0" y="133.0" width="249.0" height="28.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="737.5" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Записи клієнта впорядковані</tspan></text>
<rect x="615.0" y="169.0" width="245.0" height="165.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="737.5" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">АНАЛІЗ АНОМАЛІЇ:</tspan><tspan x="737.5" dy="13.7">Запис W1 (створення)</tspan><tspan x="737.5" dy="13.7">і запис W2 (редагування)</tspan><tspan x="737.5" dy="13.7">пішли різними шляхами;</tspan><tspan x="737.5" dy="13.7">W2 падає з помилкою,</tspan><tspan x="737.5" dy="13.7">бо W1 ще не доставлено.</tspan></text>
<rect x="615.0" y="343.0" width="245.0" height="185.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="737.5" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">ІНЖЕНЕРНИЙ ЗАХИСТ:</tspan><tspan x="737.5" dy="13.7">Усі послідовні записи</tspan><tspan x="737.5" dy="13.7">одного клієнта прив'язують</tspan><tspan x="737.5" dy="13.7">до одного шарду або черги,</tspan><tspan x="737.5" dy="13.7">де порядок гарантується</tspan><tspan x="737.5" dy="13.7">монотонним лічильником.</tspan></text>
<rect x="615.0" y="537.0" width="245.0" height="30.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.0"/><text x="737.5" y="555.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="737.5" dy="0.0">Гарантія на рівні сесії</tspan></text>
<rect x="890.0" y="65.0" width="265.0" height="515.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="898.0" y="73.0" width="249.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#d48806" stroke-width="1.5"/><text x="1022.5" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1022.5" dy="0.0">4. ПРИЧИННЕ СЛІДУВАННЯ</tspan><tspan x="1022.5" dy="15.0">(Writes-Follow-Reads)</tspan></text>
<rect x="898.0" y="133.0" width="249.0" height="28.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1022.5" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.5" dy="0.0">Відповідь після запитання</tspan></text>
<rect x="900.0" y="169.0" width="245.0" height="165.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="1022.5" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.5" dy="0.0">АНАЛІЗ АНОМАЛІЇ:</tspan><tspan x="1022.5" dy="13.7">Боб відповів на пост Аліси;</tspan><tspan x="1022.5" dy="13.7">сторонні читачі бачать</tspan><tspan x="1022.5" dy="13.7">відповідь Боба раніше,</tspan><tspan x="1022.5" dy="13.7">ніж вихідний пост Аліси,</tspan><tspan x="1022.5" dy="13.7">що ламає контекст бесіди.</tspan></text>
<rect x="900.0" y="343.0" width="245.0" height="185.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="1022.5" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.5" dy="0.0">ІНЖЕНЕРНИЙ ЗАХИСТ:</tspan><tspan x="1022.5" dy="13.7">Векторні годинники</tspan><tspan x="1022.5" dy="13.7">фіксують причинний зв'язок:</tspan><tspan x="1022.5" dy="13.7">подія не публікується,</tspan><tspan x="1022.5" dy="13.7">доки всі її передумови</tspan><tspan x="1022.5" dy="13.7">не зафіксовані в сховищі.</tspan></text>
<rect x="900.0" y="537.0" width="245.0" height="30.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.0"/><text x="1022.5" y="555.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1022.5" dy="0.0">Гарантія на рівні сесії</tspan></text>
<rect x="120.0" y="600.0" width="940.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="623.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Сесійні гарантії не вимагають глобального синхронного консенсусу між усіма вузлами.</tspan><tspan x="590.0" dy="15.6">Вони будуються локально для кожного клієнта через сесійні токени версій та липку маршрутизацію.</tspan></text>
</svg>