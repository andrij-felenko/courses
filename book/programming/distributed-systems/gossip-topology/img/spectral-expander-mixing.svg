<circle cx="105.0" cy="220.0" r="14.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="105.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">S3</text>
