<line x1="150.0" y1="155.0" x2="295.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="280.0" width="360.0" height="65.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="225.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Розширюваність межі: e(S, V \ S) &amp;ge; h(G) · |S|</text>
<text x="225.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Спектральний розрив гарантує швидкий вихід пліток</text>
<text x="225.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">із будь-якого локального кластера за O(log N) кроків</text>
<rect x="455.0" y="55.0" width="400.0" height="305.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="655.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр матриці переходу оверлею</text>
<line x1="490.0" y1="170.0" x2="820.0" y2="170.0" stroke="#333333" stroke-width="2.0"/>
<line x1="490.0" y1="160.0" x2="490.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="655.0" y1="163.0" x2="655.0" y2="177.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="820.0" y1="160.0" x2="820.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">-1</text>
<text x="655.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="820.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">&amp;lambda;₁ = 1</text>
<circle cx="740.0" cy="170.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="740.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">&amp;lambda;₂ (друге число)</text>
<text x="740.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">&amp;lambda;₂ &amp;le; 2&amp;radic;(d-1)/d</text>
<line x1="740.0" y1="130.0" x2="820.0" y2="130.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="740.0" y1="125.0" x2="740.0" y2="135.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="820.0" y1="125.0" x2="820.0" y2="135.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="780.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Спектральний розрив &amp;gamma; = 1 - &amp;lambda;₂</text>
<rect x="475.0" y="230.0" width="360.0" height="115.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="655.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок спектра з часом змішування (Mixing Time)</text>
<text x="655.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Нерівність Алона-Мілмана: &amp;gamma;/2 &amp;le; h(G) &amp;le; &amp;radic;(2&amp;gamma;)</text>
<text x="655.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Час збіжності: T_mix = O( (1 / &amp;gamma;) · log N )</text>
<text x="655.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Для графа Рамануджана &amp;gamma; &amp;ge; 1 - 2/&amp;radic;d (ідеальний експандер)</text>
<text x="655.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Забезпечує стійкість до відмов 50% випадкових вузлів</text>
</svg>