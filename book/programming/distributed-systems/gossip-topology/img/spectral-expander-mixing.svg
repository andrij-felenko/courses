<line x1="150.0" y1="155.0" x2="160.0" y2="220.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="240.0" y="105.0" width="165.0" height="165.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="322.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Підмножина V \ S (Сприйнятливі)</text>
<circle cx="270.0" cy="165.0" r="14.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="270.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">U1</text>
<circle cx="340.0" cy="155.0" r="14.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="340.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">U2</text>
<circle cx="295.0" cy="220.0" r="14.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="295.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">U3</text>
<circle cx="360.0" cy="220.0" r="14.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
