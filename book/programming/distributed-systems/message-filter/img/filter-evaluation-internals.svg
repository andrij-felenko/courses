<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкий та повільний шляхи виконання фільтра повідомлень</text>
<rect x="15.0" y="15.0" width="970.0" height="390.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній механізм рушія: швидкий шлях заголовків проти парсингу тіла</text>
<rect x="28.3" y="108.7" width="153.4" height="132.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Вхідне повідомлення</tspan><tspan x="105.0" dy="12.3"></tspan><tspan x="105.0" dy="12.3">[Заголовки / Headers]</tspan><tspan x="105.0" dy="12.3">• type: 'ORDER_PAID'</tspan><tspan x="105.0" dy="12.3">• tenant_id: 1042</tspan><tspan x="105.0" dy="12.3">• priority: 5</tspan><tspan x="105.0" dy="12.3"></tspan><tspan x="105.0" dy="12.3">[Тіло / Payload]</tspan><tspan x="105.0" dy="12.3">JSON / Protobuf / Avro</tspan><tspan x="105.0" dy="12.3">(2.5 КБ двійкових даних)</tspan></text>
<rect x="235.0" y="75.0" width="450.0" height="120.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="460.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ШВИДКИЙ ШЛЯХ: Фільтрація за метаданими (Header Filtering)</text>
<text x="460.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• O(1) перевірка хеш-таблиці або бітової маски прапорців</text>
<text x="460.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Zero-Copy: тіло повідомлення НЕ десеріалізується і лишається в Page Cache</text>
<text x="460.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Пропускна здатність: &gt; 1 000 000 перевірок/с на ядро CPU</text>
<rect x="235.0" y="215.0" width="450.0" height="130.0" rx="6" fill="#fff3cd" stroke="#d39e00" stroke-width="1.5"/>
<text x="460.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle" font-weight="700">ПОВІЛЬНИЙ ШЛЯХ: Фільтрація за вмістом (Content-Based Filtering)</text>
<text x="460.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Повне розпакування JSON/XML/Protobuf у дерево об'єктів пам'яті</text>
<text x="460.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Обчислення виразів XPath / JSONPath / AST / CEL над полями</text>
<text x="460.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Виділення пам'яті (allocations), тиск на GC, втрата Zero-Copy</text>
<text x="460.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Пропускна здатність: ~ 15 000 – 50 000 перевірок/с на ядро</text>
<line x1="185.0" y1="160.0" x2="230.0" y2="135.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="185.0" y1="190.0" x2="230.0" y2="270.0" stroke="#d39e00" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="690.0" y1="135.0" x2="735.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="690.0" y1="270.0" x2="735.0" y2="210.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="740.0" y="154.5" width="90.0" height="61.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Оцінка P(m)</tspan><tspan x="785.0" dy="13.0"></tspan><tspan x="785.0" dy="13.0">TRUE / FALSE</tspan><tspan x="785.0" dy="13.0">чи Помилка</tspan></text>
<line x1="835.0" y1="165.0" x2="875.0" y2="115.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="875.4" y="88.8" width="99.3" height="42.4" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="925.0" dy="0.0">TRUE: Пропуск</tspan><tspan x="925.0" dy="11.7">→ Вихідний канал</tspan><tspan x="925.0" dy="11.7">(Споживач)</tspan></text>
<line x1="835.0" y1="185.0" x2="875.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="868.7" y="163.8" width="112.6" height="42.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="925.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">FALSE: Скидання</tspan><tspan x="925.0" dy="11.7">→ Метрики лічильника</tspan><tspan x="925.0" dy="11.7">(Drop/Ignore)</tspan></text>
<line x1="835.0" y1="205.0" x2="875.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="864.2" y="238.8" width="121.6" height="42.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="925.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="925.0" dy="0.0">ПОМИЛКА: Карантин</tspan><tspan x="925.0" dy="11.7">→ Мертва черга (DLQ)</tspan><tspan x="925.0" dy="11.7">(Fail-safe політика)</tspan></text>
</svg>