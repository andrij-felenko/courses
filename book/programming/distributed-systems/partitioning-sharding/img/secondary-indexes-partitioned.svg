<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вторинні індекси в шардованих системах: локальні проти глобальних</text>
<rect x="40.0" y="60.0" width="425.0" height="380.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="40.0" y="60.0" width="425.0" height="40.0" rx="8" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="252.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">А. Локальний індекс (Document-Partitioned)</text>
<rect x="60.0" y="115.0" width="385.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="140.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шард 1 (Ключі 1..500)</text>
<rect x="75.0" y="148.0" width="170.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="160.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Дані: [ID:1, Color:Red]</text>
<rect x="260.0" y="148.0" width="170.0" height="42.0" rx="4" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="345.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Індекс: Red -&gt; [ID:1]</text>
<rect x="60.0" y="210.0" width="385.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="140.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шард 2 (Ключі 501..1000)</text>
<rect x="75.0" y="243.0" width="170.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="160.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Дані: [ID:700, Color:Red]</text>
<rect x="260.0" y="243.0" width="170.0" height="42.0" rx="4" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="345.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Індекс: Red -&gt; [ID:700]</text>
<rect x="60.0" y="305.0" width="385.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="252.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості локального індексу:</text>
<text x="252.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• Запис: швидкий і локальний (1 шард)</text>
<text x="252.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• Читання: Scatter-Gather (опитування ВСІХ шардів)</text>
<text x="252.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• P99 затримка експоненційно деградує з ростом N</text>
<text x="252.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Приклад: Elasticsearch, MongoDB (за замовчуванням)</text>
<rect x="495.0" y="60.0" width="425.0" height="380.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="495.0" y="60.0" width="425.0" height="40.0" rx="8" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="707.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Б. Глобальний індекс (Term-Partitioned)</text>
<rect x="515.0" y="115.0" width="385.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="600.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 1 (Шард даних)</text>
<rect x="530.0" y="148.0" width="355.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="707.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зберігає рядки: [ID:1, Red], [ID:2, Blue]</text>
<rect x="515.0" y="210.0" width="385.0" height="85.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.0"/>
<text x="630.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол 2 (Шард глобального індексу)</text>
<rect x="530.0" y="243.0" width="355.0" height="42.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="707.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Індекс термів [A..M]: Color:Blue -&gt; [ID:2]</text>
<rect x="515.0" y="305.0" width="385.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="707.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості глобального індексу:</text>
<text x="707.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• Читання: точкове й швидке (1 цільовий шард індексу)</text>
<text x="707.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• Запис: розподілена транзакція (2PC) або асинхронний лаг</text>
<text x="707.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Складність підтримки цілісності при збоях</text>
<text x="707.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Приклад: DynamoDB Global Secondary Index (GSI)</text>
</svg>