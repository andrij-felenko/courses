<text x="180.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Розумний клієнт (Smart Client)</text>
<rect x="340.0" y="55.0" width="280.0" height="365.0" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/>
