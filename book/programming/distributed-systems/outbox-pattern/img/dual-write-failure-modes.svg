<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПАСТКА ПОДВІЙНОГО ЗАПИСУ: чому неможливо безпечно писати у два мережеві ресурси без 2PC</tspan></text>
<rect x="40.0" y="80.0" width="535.0" height="460.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="55.0" y="95.0" width="505.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="307.5" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">СЦЕНАРІЙ А: Спершу фіксація в БД, потім надсилання в брокер</tspan></text>
<rect x="65.0" y="145.0" width="485.0" height="48.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="307.5" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">1. BEGIN TRANSACTION</tspan><tspan x="307.5" dy="14.3">2. UPDATE accounts SET balance = balance - 1000;</tspan><tspan x="307.5" dy="14.3">3. COMMIT;</tspan></text>
<rect x="65.0" y="210.0" width="485.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="307.5" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">БАЗА ДАНИХ: Зміни успішно зафіксовано на диску</tspan></text>
<rect x="65.0" y="265.0" width="485.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="307.5" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">⚡ АВАРІЙНА ВІДМОВА: знеструмлення / OOM-кілер / збій мережі</tspan><tspan x="307.5" dy="15.0">(до того, як виконано broker.send())</tspan></text>
<rect x="65.0" y="335.0" width="485.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="307.5" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">4. broker.send(&quot;MoneyWithdrawn&quot;, payload) — НЕ ВИКОНАНО</tspan></text>
<rect x="60.0" y="405.0" width="495.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="307.5" y="429.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">НАСЛІДОК: ВТРАТА ПОДІЇ (Event Loss)</tspan><tspan x="307.5" dy="15.0"></tspan><tspan x="307.5" dy="15.0">• Гроші з балансу списано назавжди</tspan><tspan x="307.5" dy="15.0">• Повідомлення в брокер ніколи не надійде</tspan><tspan x="307.5" dy="15.0">• Сервіс сповіщень та бухгалтерія не знають про факт списання</tspan><tspan x="307.5" dy="15.0">• Система переходить у фатально неузгоджений стан</tspan></text>
<rect x="605.0" y="80.0" width="535.0" height="460.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="620.0" y="95.0" width="505.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="872.5" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">СЦЕНАРІЙ Б: Спершу надсилання в брокер, потім фіксація в БД</tspan></text>
<rect x="630.0" y="145.0" width="485.0" height="48.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="872.5" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">1. broker.send(&quot;MoneyWithdrawn&quot;, payload) → ACK отримано</tspan><tspan x="872.5" dy="14.3">Повідомлення збережено у брокері та пішло до консюмерів</tspan></text>
<rect x="630.0" y="210.0" width="485.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="872.5" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">БРОКЕР: Подію вже прочитали інші мікросервіси</tspan></text>
<rect x="630.0" y="265.0" width="485.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="872.5" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">⚡ АВАРІЙНА ВІДМОВА: конфлікт унікальності / відкат транзакції</tspan><tspan x="872.5" dy="15.0">або збій БД під час виконання COMMIT</tspan></text>
<rect x="630.0" y="335.0" width="485.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="872.5" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">2. BEGIN ... UPDATE ... COMMIT — ВІДКОЧЕНО (ROLLBACK)</tspan></text>
<rect x="625.0" y="405.0" width="495.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="872.5" y="429.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="872.5" dy="0.0">НАСЛІДОК: ФАНТОМНА ПОДІЯ (Phantom Event)</tspan><tspan x="872.5" dy="15.0"></tspan><tspan x="872.5" dy="15.0">• У базі даних стан лишився незмінним (списання не було)</tspan><tspan x="872.5" dy="15.0">• Сервіс складського обліку вже відвантажує товар за подією</tspan><tspan x="872.5" dy="15.0">• Відкликати повідомлення з брокера неможливо</tspan><tspan x="872.5" dy="15.0">• Виникає матеріальний збиток через хибну реакцію споживачів</tspan></text>
<rect x="40.0" y="555.0" width="1100.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="583.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ВИСНОВОК: Дві незалежні мережеві операції не можуть бути атомарними. Будь-який порядок їх виклику містить вікно розриву.</tspan></text>
</svg>