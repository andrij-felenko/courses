<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="1140.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">КОНВЕЄР CHANGE DATA CAPTURE (CDC): вилучення подій із журналу транзакцій (WAL)</tspan></text>
<rect x="30.0" y="85.0" width="225.0" height="375.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="142.5" y="179.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="142.5" dy="0.0">1. БАЗА ДАНИХ</tspan><tspan x="142.5" dy="15.0">(PostgreSQL)</tspan><tspan x="142.5" dy="15.0"></tspan><tspan x="142.5" dy="15.0">Сховище таблиць:</tspan><tspan x="142.5" dy="15.0">• orders (бізнес-дані)</tspan><tspan x="142.5" dy="15.0">• outbox (події)</tspan><tspan x="142.5" dy="15.0"></tspan><tspan x="142.5" dy="15.0">Журнал транзакцій:</tspan><tspan x="142.5" dy="15.0">• Write-Ahead Log (WAL)</tspan><tspan x="142.5" dy="15.0">• Реплікаційний слот</tspan><tspan x="142.5" dy="15.0">• Плагін pgoutput</tspan><tspan x="142.5" dy="15.0"></tspan><tspan x="142.5" dy="15.0">COMMIT фіксує зміни</tspan><tspan x="142.5" dy="15.0">у WAL-файлах на диску.</tspan></text>
<line x1="255.0" y1="270.0" x2="330.0" y2="270.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="259.0" y="235.0" width="67.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="292.5" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="292.5" dy="0.0">WAL потік</tspan></text>
<rect x="330.0" y="85.0" width="225.0" height="375.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="442.5" y="194.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="442.5" dy="0.0">2. DEBEZIUM</tspan><tspan x="442.5" dy="15.0">CONNECTOR</tspan><tspan x="442.5" dy="15.0"></tspan><tspan x="442.5" dy="15.0">Logical Decoding:</tspan><tspan x="442.5" dy="15.0">• Підключений до слота</tspan><tspan x="442.5" dy="15.0">• Читає бінарний WAL</tspan><tspan x="442.5" dy="15.0">• Фільтрує лише outbox</tspan><tspan x="442.5" dy="15.0">• Фіксує позицію LSN</tspan><tspan x="442.5" dy="15.0">• Нуль SQL-опитувань</tspan><tspan x="442.5" dy="15.0"></tspan><tspan x="442.5" dy="15.0">Перетворює мутацію</tspan><tspan x="442.5" dy="15.0">рядка на подію CDC.</tspan></text>
<line x1="555.0" y1="270.0" x2="630.0" y2="270.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="559.0" y="235.0" width="67.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="592.5" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">CDC подія</tspan></text>
<rect x="630.0" y="85.0" width="225.0" height="375.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.5"/><text x="742.5" y="201.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.5" dy="0.0">3. OUTBOX ROUTER</tspan><tspan x="742.5" dy="15.0">(SMT Transform)</tspan><tspan x="742.5" dy="15.0"></tspan><tspan x="742.5" dy="15.0">Single Message Transform:</tspan><tspan x="742.5" dy="15.0">• payload → тіло запису</tspan><tspan x="742.5" dy="15.0">• aggregate_id → ключ</tspan><tspan x="742.5" dy="15.0">• aggregate_type → топік</tspan><tspan x="742.5" dy="15.0">• headers → трасування</tspan><tspan x="742.5" dy="15.0"></tspan><tspan x="742.5" dy="15.0">Очищає подію від колонок БД</tspan><tspan x="742.5" dy="15.0">і формує чистий Kafka-запис.</tspan></text>
<line x1="855.0" y1="270.0" x2="930.0" y2="270.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="857.0" y="235.0" width="71.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="892.5" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="892.5" dy="0.0">Kafka запис</tspan></text>
<rect x="930.0" y="85.0" width="225.0" height="375.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1042.5" y="194.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1042.5" dy="0.0">4. APACHE KAFKA</tspan><tspan x="1042.5" dy="15.0">CLUSTER</tspan><tspan x="1042.5" dy="15.0"></tspan><tspan x="1042.5" dy="15.0">Топіки подій:</tspan><tspan x="1042.5" dy="15.0">• topic: orders.events</tspan><tspan x="1042.5" dy="15.0">• key: order_id = 42</tspan><tspan x="1042.5" dy="15.0">• partition = hash(key) % N</tspan><tspan x="1042.5" dy="15.0"></tspan><tspan x="1042.5" dy="15.0">Порядок строго збережено</tspan><tspan x="1042.5" dy="15.0">в межах одного aggregate_id.</tspan><tspan x="1042.5" dy="15.0"></tspan><tspan x="1042.5" dy="15.0">Гарантія: At-Least-Once.</tspan></text>
<rect x="30.0" y="480.0" width="1140.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="600.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ПЕРЕВАГИ CDC ПЕРЕД ОПИТУВАННЯМ:</tspan><tspan x="600.0" dy="15.0">1. Затримка менше 10 мс (замість періодичного сну опитувача).</tspan><tspan x="600.0" dy="15.0">2. Нульовий вплив на продуктивність SQL-рушія (немає блокувань таблиці та роздування індексів).</tspan><tspan x="600.0" dy="15.0">3. Гарантія фіксації навіть тих рядків, які були негайно видалені з таблиці.</tspan></text>
</svg>