<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">АРХІТЕКТУРА TRANSACTIONAL OUTBOX: об'єднання мутації та події в одну локальну транзакцію</tspan></text>
<rect x="40.0" y="90.0" width="190.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">КЛІЄНТ</tspan><tspan x="135.0" dy="15.0">HTTP / gRPC запит</tspan><tspan x="135.0" dy="15.0">(створити замовлення)</tspan></text>
<line x1="230.0" y1="120.0" x2="290.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="80.0" width="250.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="415.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">СЕРВІС ЗАСТОСУНКУ</tspan><tspan x="415.0" dy="15.6">(Order Service)</tspan><tspan x="415.0" dy="15.6"></tspan><tspan x="415.0" dy="15.6">Відкриває локальну транзакцію</tspan></text>
<line x1="415.0" y1="160.0" x2="415.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="200.0" width="350.0" height="230.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<rect x="255.0" y="210.0" width="320.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="415.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">ЄДИНА ЛОКАЛЬНА ACID-ТРАНЗАКЦІЯ</tspan></text>
<rect x="260.0" y="248.0" width="310.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="415.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">Таблиця бізнес-сутностей (orders)</tspan><tspan x="415.0" dy="13.7">INSERT INTO orders (id, user_id, status)</tspan><tspan x="415.0" dy="13.7">VALUES (42, 814, 'PAID')</tspan></text>
<rect x="260.0" y="318.0" width="310.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="415.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">Таблиця вихідних подій (outbox)</tspan><tspan x="415.0" dy="12.3">INSERT INTO outbox (id, aggregate_id, payload)</tspan><tspan x="415.0" dy="12.3">VALUES (uuid, 42, '{...json...}')</tspan></text>
<rect x="260.0" y="388.0" width="310.0" height="30.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="415.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">COMMIT — або обидва записи на диску, або жодного</tspan></text>
<line x1="590.0" y1="270.0" x2="680.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="170.0" width="240.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="800.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">СТРАТЕГІЯ 1: Polling Publisher</tspan><tspan x="800.0" dy="13.0"></tspan><tspan x="800.0" dy="13.0">• Фоновий воркер читає таблицю</tspan><tspan x="800.0" dy="13.0">• SELECT ... FOR UPDATE SKIP LOCKED</tspan><tspan x="800.0" dy="13.0">• Надсилає батч і видаляє оброблене</tspan></text>
<line x1="590.0" y1="350.0" x2="680.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="320.0" width="240.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="800.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">СТРАТЕГІЯ 2: Transaction Log Tailing</tspan><tspan x="800.0" dy="13.0"></tspan><tspan x="800.0" dy="13.0">• Debezium / CDC читає WAL бази</tspan><tspan x="800.0" dy="13.0">• Нульове навантаження опитуванням</tspan><tspan x="800.0" dy="13.0">• Стрімінг змін у реальному часі</tspan></text>
<line x1="920.0" y1="220.0" x2="970.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="920.0" y1="370.0" x2="970.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="970.0" y="210.0" width="170.0" height="190.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.6"/><text x="1055.0" y="246.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">БРОКЕР</tspan><tspan x="1055.0" dy="15.6">ПОВІДОМЛЕНЬ</tspan><tspan x="1055.0" dy="15.6"></tspan><tspan x="1055.0" dy="15.6">Apache Kafka /</tspan><tspan x="1055.0" dy="15.6">RabbitMQ</tspan><tspan x="1055.0" dy="15.6"></tspan><tspan x="1055.0" dy="15.6">Topic: orders</tspan><tspan x="1055.0" dy="15.6">Key: order_id</tspan><tspan x="1055.0" dy="15.6">At-Least-Once</tspan></text>
<line x1="1055.0" y1="400.0" x2="1055.0" y2="450.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="950.0" y="450.0" width="210.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="1055.0" y="461.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">СПОЖИВАЧІ (Consumers)</tspan><tspan x="1055.0" dy="15.0"></tspan><tspan x="1055.0" dy="15.0">• Доставка (Delivery)</tspan><tspan x="1055.0" dy="15.0">• Склад (Inventory)</tspan><tspan x="1055.0" dy="15.0">• Білінг (Billing)</tspan></text>
<rect x="40.0" y="550.0" width="1100.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="585.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КЛЮЧОВА ПЕРЕВАГА: База даних виступає єдиним джерелом правди. Вузол може впасти у будь-яку секунду — після перезапуску воркер або CDC-рушій продовжить ретрансляцію непосланих рядків з outbox без жодної втрати даних.</tspan></text>
</svg>