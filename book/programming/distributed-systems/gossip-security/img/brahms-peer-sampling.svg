<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захищена вибірка сусідів Brahms: протидія забрудненню топології</text>
<rect x="20.0" y="50.0" width="405.0" height="340.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="222.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний Push-Pull Peer Sampling</text>
<rect x="35.0" y="95.0" width="375.0" height="125.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="222.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Атака масовим Push-забрудненням (Sybil Flood):</text>
<rect x="45.0" y="130.0" width="95.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="92.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Sybil Botnet</text>
<line x1="140.0" y1="145.0" x2="235.0" y2="145.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="187.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">10 000 Push/s</text>
<rect x="240.0" y="130.0" width="155.0" height="75.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="317.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Routing Table жертви</text>
<text x="317.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">95% записів = Sybil IP</text>
<text x="317.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Чесні вузли витіснено</text>
<text x="317.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">(Затемнення / Eclipse)</text>
<rect x="35.0" y="235.0" width="375.0" height="140.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="222.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Чому наївні алгоритми падають:</text>
<text x="222.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вузол сліпо приймає адреси з чужих Push-повідомлень.</text>
<text x="222.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Зловмисник генерує безліч фіктивних адрес (Sybil).</text>
<text x="222.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Таблиця сусідів повністю заповнюється ботами за O(log N).</text>
<text x="222.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Наслідок: вузол бачить лише отруєну версію реальності.</text>
<text x="222.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Трафік на чесні вузли падає до нуля.</text>
<rect x="455.0" y="50.0" width="405.0" height="340.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="657.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Архітектура стійкої вибірки Brahms</text>
<rect x="470.0" y="95.0" width="375.0" height="50.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="482.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">1. Push View (α = 10%):</text>
<text x="482.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Обмежена частка прямого обміну. Захист від повного переповнення.</text>
<rect x="470.0" y="153.0" width="375.0" height="50.0" rx="4" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/>
<text x="482.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="start" font-weight="700">2. Pull View (β = 10%):</text>
<text x="482.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Активний запит випадкових сусідів з локальної перевіреної історії.</text>
<rect x="470.0" y="211.0" width="375.0" height="65.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="482.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Sampler View (γ = 80% — Незміщений семплер):</text>
<text x="482.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">Випадкове блукання (Random Walk) + Min-Wise Hashing.</text>
<text x="482.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Імовірність потрапляння вузла строго пропорційна його чесній вазі.</text>
<rect x="470.0" y="285.0" width="375.0" height="90.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="657.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Математична гарантія Brahms:</text>
<text x="657.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Якщо частка візантійських вузлів f &lt; 0.2, частка ботів</text>
<text x="657.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">у routing table чесного вузла ніколи не перевищить f,</text>
<text x="657.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">навіть якщо ботнет надсилає нескінченний потік Push-запитів.</text>
</svg>