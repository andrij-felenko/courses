<rect x="718.0" y="60.0" width="140.0" height="34.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="788.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">5. Peer Score &amp; Mesh</text>
<text x="788.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Gossipsub v1.1 скоринг</text>
<text x="788.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штрафи та ретрансляція</text>
<rect x="723.0" y="160.0" width="130.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="788.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Score &gt;= Publish?</text>
<text x="788.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">FORWARD k PEERS</text>
<text x="788.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Оновлення стану</text>
<rect x="25.0" y="260.0" width="830.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="440.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Результат конвеєра: стійкість до візантійських збоїв f &lt; N / 3</text>
<text x="440.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Негайне відсікання DoS на стадії 1 захищає криптографічний рушій від перевантаження.</text>
<text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Підписи Ed25519 (стадія 2) унеможливлюють підробку чужого стану проміжними вузлами-ретрансляторами.</text>
<text x="440.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Скоринг поведінки (стадія 5) ізолює повільні та шкідливі вузли, підтримуючи здорову топологію розповсюдження.</text>
<text x="440.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Еквівокація (стадія 4) миттєво карається довічним баном і розсилкою криптографічного доказу зради.</text>
