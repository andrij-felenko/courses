<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізний ланцюг передачі протитиску через шари розподіленої системи</text>
<rect x="60.0" y="60.0" width="880.0" height="40.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<line x1="80.0" y1="80.0" x2="920.0" y2="80.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Прямий потік даних: Клієнт → Шлюз → Сервіс прийому → Воркер → База даних</text>
<rect x="65.0" y="140.2" width="150.0" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Клієнт / SDK</tspan><tspan x="140.0" dy="14.3">Мережевий буфер</tspan><tspan x="140.0" dy="14.3">TCP send buffer</tspan></text>
<rect x="245.0" y="140.2" width="150.0" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Шлюз (Proxy)</tspan><tspan x="320.0" dy="14.3">Envoy / Nginx</tspan><tspan x="320.0" dy="14.3">readDisable(true)</tspan></text>
<rect x="425.0" y="140.2" width="150.0" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Сервіс прийому</tspan><tspan x="500.0" dy="14.3">gRPC / Netty</tspan><tspan x="500.0" dy="14.3">Stream Window = 0</tspan></text>
<rect x="605.0" y="140.2" width="150.0" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Воркер обробки</tspan><tspan x="680.0" dy="14.3">Обмежений буфер</tspan><tspan x="680.0" dy="14.3">High Watermark</tspan></text>
<rect x="785.0" y="140.2" width="150.0" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="860.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">База даних / Sink</tspan><tspan x="860.0" dy="14.3">LSM Compaction</tspan><tspan x="860.0" dy="14.3">I/O Затримка</tspan></text>
<rect x="60.0" y="245.0" width="880.0" height="40.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<line x1="920.0" y1="265.0" x2="80.0" y2="265.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зворотний сигнал протитиску (Flow Control): зменшення кредитів, пауза читання, TCP ZeroWindow</text>
<line x1="790.0" y1="335.0" x2="750.0" y2="335.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="713.7" y="294.5" width="112.6" height="33.0" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.0"/><text x="770.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">1. Затримка I/O</tspan><tspan x="770.0" dy="13.0">черга заповнюється</tspan></text>
<line x1="610.0" y1="415.0" x2="570.0" y2="415.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="533.7" y="374.5" width="112.6" height="33.0" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.0"/><text x="590.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">2. High Watermark</tspan><tspan x="590.0" dy="13.0">request(0) / Pause</tspan></text>
<line x1="430.0" y1="335.0" x2="390.0" y2="335.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.9" y="294.5" width="118.3" height="33.0" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.0"/><text x="410.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">3. WINDOW_UPDATE=0</tspan><tspan x="410.0" dy="13.0">HTTP/2 Stream Pause</tspan></text>
<line x1="250.0" y1="415.0" x2="210.0" y2="415.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="162.3" y="374.5" width="135.4" height="33.0" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.0"/><text x="230.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">4. readDisable(true)</tspan><tspan x="230.0" dy="13.0">TCP ZeroWindow (win=0)</tspan></text>
<rect x="60.0" y="495.0" width="880.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="500.0" y="517.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Результат наскрізного узгодження швидкості:</text>
<text x="500.0" y="539.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Клієнт примусово знижує темп генерації на джерелі — жоден проміжний вузол не переповнює пам'ять і не падає з OOM.</text>
</svg>