<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол детектування збоїв SWIM: прямий зонд, непрямий запит та спростування</text>
<rect x="20.0" y="50.0" width="260.0" height="335.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="150.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 1: Прямий зонд</text>
<rect x="35.0" y="95.0" width="75.0" height="40.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="72.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол A</text>
<rect x="190.0" y="95.0" width="75.0" height="40.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="227.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол B</text>
<line x1="110.0" y1="115.0" x2="185.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="148.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ping</text>
<line x1="140.0" y1="140.0" x2="160.0" y2="160.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="160.0" y1="140.0" x2="140.0" y2="160.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="150.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Втрата пакета / таймаут</text>
<rect x="35.0" y="200.0" width="230.0" height="70.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="150.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таймаут відповіді (Ack):</text>
<text x="150.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">A не оголошує B мертвим одразу,</text>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">бо збій може бути асиметричним</text>
<rect x="35.0" y="285.0" width="230.0" height="85.0" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="150.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">Перехід до Фази 2:</text>
<text x="150.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вибір k помічників (C, D)</text>
<text x="150.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">для непрямого опитування B</text>
<text x="150.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Indirect Probing)</text>
<rect x="295.0" y="50.0" width="270.0" height="335.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 2: Непрямий Ping-Req</text>
<rect x="310.0" y="95.0" width="65.0" height="35.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="342.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол A</text>
<rect x="485.0" y="95.0" width="65.0" height="35.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="517.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол B</text>
<rect x="395.0" y="155.0" width="75.0" height="35.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="432.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Помічник C</text>
<line x1="355.0" y1="130.0" x2="395.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ping-Req</text>
<line x1="470.0" y1="165.0" x2="500.0" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ping</text>
<rect x="310.0" y="205.0" width="240.0" height="75.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="430.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій А: C достукався до B</text>
<text x="430.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">C пересилає Ack вузлу A</text>
<text x="430.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">B лишається Alive (збій зв'язку A-B)</text>
<text x="430.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Хибну тривогу відвернено</text>
<rect x="310.0" y="290.0" width="240.0" height="80.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="430.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій Б: Ніхто не достукався</text>
<text x="430.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Таймаут непрямих відповідей</text>
<text x="430.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">A оголошує: B = Suspect(inc=I)</text>
<text x="430.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запуск таймера підозри Tsuspect</text>
<rect x="580.0" y="50.0" width="260.0" height="335.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="710.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 3: Підозра й Спростування</text>
<rect x="595.0" y="95.0" width="230.0" height="80.0" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="710.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">Стан Suspect (Підозра):</text>
<text x="710.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Плітка шириться кластером.</text>
<text x="710.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">B ще не видаляється з таблиць,</text>
<text x="710.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">але трафік на нього обмежується</text>
<rect x="595.0" y="185.0" width="230.0" height="85.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Спростування (Refutation):</text>
<text x="710.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">B живий і чує плітку про свою смерть!</text>
<text x="710.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">B робить: inc = inc + 1</text>
<text x="710.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Розсилає Alive(inc+1) —</text>
<text x="710.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">старша інкарнація скасовує підозру</text>
<rect x="595.0" y="280.0" width="230.0" height="90.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="710.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Підтвердження смерті (Dead):</text>
<text x="710.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Таймер Tsuspect вичерпано,</text>
<text x="710.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">спростування від B не надійшло.</text>
<text x="710.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">B = Dead -&gt; видалення з кластера</text>
<text x="710.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">із фіксацією Tombstone</text>
</svg>