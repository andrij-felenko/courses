<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка застарілого запису: як старий стан отруює кеш після інвалідації</text>
<rect x="70.0" y="55.0" width="140.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Читач (C1)</tspan></text>
<rect x="310.0" y="55.0" width="140.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Кеш</tspan></text>
<rect x="570.0" y="55.0" width="140.0" height="42.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">База даних</tspan></text>
<rect x="810.0" y="55.0" width="140.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Записувач (C2)</tspan></text>
<line x1="140.0" y1="100.0" x2="140.0" y2="460.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="380.0" y1="100.0" x2="380.0" y2="460.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="640.0" y1="100.0" x2="640.0" y2="460.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="880.0" y1="100.0" x2="880.0" y2="460.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="140.0" y1="130.0" x2="380.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="196.4" y="104.5" width="127.1" height="19.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. GET key (промах)</tspan></text>
<line x1="140.0" y1="180.0" x2="640.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="254.3" y="154.5" width="271.3" height="19.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">2. SELECT -&gt; отримав v₁ (затримка обробки)</tspan></text>
<line x1="880.0" y1="240.0" x2="640.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="663.9" y="214.5" width="192.1" height="19.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="227.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">3. UPDATE key = v₂ (commit)</tspan></text>
<line x1="880.0" y1="295.0" x2="380.0" y2="295.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="563.9" y="269.5" width="192.1" height="19.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">4. DELETE key (інвалідація)</tspan></text>
<line x1="140.0" y1="370.0" x2="380.0" y2="370.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="135.7" y="341.5" width="248.7" height="21.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="355.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">5. SET key = v₁ (запізнілий запис!)</tspan></text>
<rect x="100.0" y="425.0" width="800.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Результат: у БД лежить актуальне v₂, а в кеш назавжди записано застаріле v₁ (примарний запис).</tspan><tspan x="500.0" dy="15.6">Усі наступні читачі отримують хибні дані, поки не настане примусовий TTL або новий запис.</tspan></text>
</svg>