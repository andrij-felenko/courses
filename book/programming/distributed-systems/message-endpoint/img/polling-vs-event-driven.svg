<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="1100.0" height="470.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="570.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі доставки: Polling Consumer (Pull) проти Event-Driven Consumer (Push)</text>
<rect x="40.0" y="75.0" width="515.0" height="390.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="297.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Polling Consumer (Синхронний Pull)</text>
<rect x="60.0" y="130.0" width="180.0" height="85.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="150.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Консюмер (Потік)</text>
<text x="150.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">while (running) {</text>
<text x="150.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  msg = poll(timeout);</text>
<rect x="355.0" y="130.0" width="180.0" height="85.0" rx="5" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/>
<text x="445.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брокер / Черга</text>
<text x="445.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">[ Msg 3 ][ Msg 2 ][ Msg 1 ]</text>
<text x="445.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Буфер на диску/пам'яті</text>
<line x1="240.0" y1="155.0" x2="350.0" y2="155.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="295.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">1. poll() запит</text>
<line x1="350.0" y1="190.0" x2="245.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="295.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">2. Відповідь (батч)</text>
<rect x="60.0" y="235.0" width="475.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/><text x="297.5" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Властивості Pull-моделі:</tspan><tspan x="297.5" dy="11.7">• Природний протитиск (Backpressure): консюмер бере рівно стільки, скільки встигає.</tspan><tspan x="297.5" dy="11.7">• Контроль паузи: легка реалізація батчингу та зупинки на час перевантаження БД.</tspan><tspan x="297.5" dy="11.7">• Недолік: латентність простою між інтервалами опитування або спалювання CPU на пустих циклах.</tspan></text>
<rect x="60.0" y="360.0" width="475.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="297.5" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Типове застосування: Apache Kafka (KafkaConsumer.poll()), AWS SQS (ReceiveMessage),</tspan><tspan x="297.5" dy="12.3">пакетна аналітична обробка великих масивів даних.</tspan></text>
<rect x="585.0" y="75.0" width="515.0" height="390.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="842.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Event-Driven Consumer (Асинхронний Push)</text>
<rect x="605.0" y="130.0" width="180.0" height="85.0" rx="5" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/>
<text x="695.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брокер / Сокет</text>
<text x="695.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Миттєва відправка</text>
<text x="695.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">push(msg) у сокет</text>
<rect x="900.0" y="130.0" width="180.0" height="85.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="990.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Message Listener</text>
<text x="990.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">onMessage(msg) {</text>
<text x="990.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  handleAsync(msg);</text>
<line x1="785.0" y1="160.0" x2="895.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="840.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1. Подія (Push)</text>
<line x1="895.0" y1="195.0" x2="790.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="840.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">2. basic.ack</text>
<rect x="605.0" y="235.0" width="475.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="842.5" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Властивості Push-моделі:</tspan><tspan x="842.5" dy="12.3">• Мінімальна латентність: повідомлення надходить негайно після публікації в чергу.</tspan><tspan x="842.5" dy="12.3">• Небезпека затоплення (OOM): якщо швидкість надходження &gt; швидкості обробки,</tspan><tspan x="842.5" dy="12.3">  пам'ять процесу вичерпується без ліміту префетчу (Prefetch QoS limit).</tspan><tspan x="842.5" dy="12.3">• Обов'язкова наявність пулу воркерів та явного кредитного контролю (Credit Flow).</tspan></text>
<rect x="605.0" y="360.0" width="475.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/><text x="842.5" y="399.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Типове застосування: RabbitMQ (basic.consume / Spring @RabbitListener),</tspan><tspan x="842.5" dy="13.7">JMS MessageListener, gRPC Streaming, реалтайм-сервіси з низькою латентністю.</tspan></text>
</svg>