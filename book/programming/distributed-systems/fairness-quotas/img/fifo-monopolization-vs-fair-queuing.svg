<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Монополізація черги FIFO галасливим сусідом проти справедливого розподілу (Fair Queuing)</text>
<rect x="30.0" y="55.0" width="940.0" height="205.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Спільна черга FIFO: проблема «галасливого сусіда» (Noisy Neighbor)</text>
<text x="50.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Клієнт A генерує шторм важких запитів; критичний клієнт B блокується в хвості й падає за таймаутом.</text>
