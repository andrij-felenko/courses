<text x="50.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Справедливе планування (Fair Queuing / DRR): повна ізоляція та чесні кванти</text>
<text x="50.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кожен клієнт має незалежну чергу. Планувальник чергує обробку, гарантуючи мікросекундну затримку для легких клієнтів.</text>
