<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ДИЛЕМА ПЕРЕБІРОК: НАДЛИШКОВА ФРАГМЕНТАЦІЯ ТА ЗАМОРОЖЕНІ РЕСУРСИ (RESOURCE STRANDING)</tspan></text>
<rect x="40.0" y="80.0" width="350.0" height="430.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="215.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">СПІЛЬНИЙ ПУЛ (0 ПЕРЕБІРОК)</text>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Висока утилізація, 0 ізоляції</text>
<rect x="60.0" y="150.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="80.0" y="170.0" width="270.0" height="80.0" rx="4" fill="#d1e7dd" stroke="#27ae60" stroke-width="1.0"/>
<text x="215.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ефективність: 92% CPU</text>
<text x="215.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ресурси діляться динамічно</text>
<rect x="80.0" y="265.0" width="270.0" height="50.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="215.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ризик каскадної відмови: КРИТИЧНИЙ</text>
<text x="215.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Один паразит топить увесь корабель</text>
<text x="215.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновок:</text>
<text x="215.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ідеально дешево за ресурсами,</text>
<text x="215.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">але катастрофічно крихко.</text>
<rect x="415.0" y="80.0" width="350.0" height="430.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="590.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ДРІБНІ СТАТИЧНІ ПЕРЕБІРКИ</text>
<text x="590.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повна ізоляція, але втрата ємності</text>
<rect x="435.0" y="150.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="450.0" y="165.0" width="280.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="590.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Відсік А: 100% (Переповнено, ДРОП)</text>
<text x="590.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Клієнти дістають HTTP 429</text>
<rect x="450.0" y="215.0" width="280.0" height="40.0" rx="3" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.0"/>
<text x="590.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Відсік Б: 5% (Простоює 95% ресурсів)</text>
<text x="590.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Заморожена ємність (Stranded)</text>
<rect x="450.0" y="265.0" width="280.0" height="40.0" rx="3" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.0"/>
<text x="590.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Відсік В: 10% (Простоює 90% ресурсів)</text>
<text x="590.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Заморожена ємність (Stranded)</text>
<text x="590.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Проблема Resource Stranding:</text>
<text x="590.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сервери завантажені лише на 35%,</text>
<text x="590.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">але сервіс уже відхиляє користувачів,</text>
<text x="590.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">бо квота А жорстко заблокована.</text>
<rect x="790.0" y="80.0" width="350.0" height="430.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="965.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">АДАПТИВНІ ПЕРЕБІРКИ (БАЛАНС)</text>
<text x="965.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Динамічні квоти + базовий резерв</text>
<rect x="810.0" y="150.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="830.0" y="170.0" width="270.0" height="60.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.0"/>
<text x="965.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантований мінімум (Floor)</text>
<text x="965.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кожен орендар має захищений відсік</text>
<rect x="830.0" y="240.0" width="270.0" height="70.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="965.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Спільний еластичний буфер (Burst)</text>
<text x="965.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Займається за наявності вільних сил</text>
<text x="965.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Швидко відбирається при дефіциті</text>
<text x="965.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат:</text>
<text x="965.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Захист від каскадного падіння 100%,</text>
<text x="965.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">утилізація інфраструктури 80-85%,</text>
<text x="965.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">відсутність мертвого простою.</text>
