<rect x="0.0" y="0.0" width="820.0" height="430.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><rect x="77.6" y="12.0" width="664.8" height="36.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="35.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Відстеження причинності векторними годинниками (3 вузли: A, B, C)</tspan></text><rect x="20.0" y="80.0" width="85.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="62.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол A</text><rect x="20.0" y="185.0" width="85.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="62.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол B</text><rect x="20.0" y="290.0" width="85.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="62.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол C</text><line x1="115.0" y1="100.0" x2="780.0" y2="100.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="115.0" y1="205.0" x2="780.0" y2="205.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="115.0" y1="310.0" x2="780.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="150.0" cy="100.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/><rect x="95.5" y="54.0" width="108.9" height="32.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">e₀: [0, 0, 0]</tspan></text><circle cx="280.0" cy="100.0" r="6.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/><rect x="225.5" y="46.2" width="108.9" height="47.6" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">e₁: [1, 0, 0]</tspan><tspan x="280.0" dy="15.6">(запис на A)</tspan></text><circle cx="150.0" cy="205.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/><rect x="109.2" y="159.0" width="81.6" height="32.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">[0, 0, 0]</tspan></text><line x1="280.0" y1="106.0" x2="440.0" y2="199.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="307.3" y="132.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">msg: [1, 0, 0]</tspan></text><circle cx="440.0" cy="205.0" r="6.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/><rect x="382.1" y="213.2" width="115.8" height="47.6" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="233.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">e₂: [1, 1, 0]</tspan><tspan x="440.0" dy="15.6">(max + tick B)</tspan></text><circle cx="150.0" cy="310.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/><rect x="109.2" y="264.0" width="81.6" height="32.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">[0, 0, 0]</tspan></text><circle cx="440.0" cy="310.0" r="6.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/><rect x="385.5" y="318.2" width="108.9" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">e₃: [0, 0, 1]</tspan><tspan x="440.0" dy="15.6">(запис на C)</tspan></text><rect x="560.0" y="80.0" width="230.0" height="290.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця відношень</text><line x1="575.0" y1="118.0" x2="775.0" y2="118.0" stroke="#6b7280" stroke-width="1.0"/><text x="675.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Причинний зв'язок (e₁ → e₂):</text><text x="675.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[1, 0, 0] ≤ [1, 1, 0] (A ≤ B)</text><text x="675.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Подія e₁ спричинила e₂</text><line x1="575.0" y1="195.0" x2="775.0" y2="195.0" stroke="#e0e0e0" stroke-width="1.0"/><text x="675.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Конкурентність (e₂ ∥ e₃):</text><text x="675.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[1, 1, 0] ≰ [0, 0, 1]</text><text x="675.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[0, 0, 1] ≰ [1, 1, 0]</text><text x="675.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Конфлікт гілок!</text><text x="675.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потрібне злиття на рівні</text><text x="675.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">застосунку або CRDT</text><rect x="20.0" y="375.0" width="520.0" height="42.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.2"/><text x="280.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d5a00" text-anchor="middle" font-weight="700">Векторний годинник виявляє конфлікт e₂ ∥ e₃, але не вміє його злити сам</text>
