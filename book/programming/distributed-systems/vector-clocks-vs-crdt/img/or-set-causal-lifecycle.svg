<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><rect x="137.1" y="12.0" width="545.8" height="36.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="35.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Життєвий цикл елемента в Observed-Remove Set (OR-Set)</tspan></text><rect x="20.0" y="65.0" width="370.0" height="355.0" rx="8" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пастка простого 2P-Set (Add/Remove)</text><line x1="35.0" y1="105.0" x2="375.0" y2="105.0" stroke="#f5c6cb" stroke-width="1.0"/><rect x="101.0" y="112.3" width="208.1" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">1. Додавання елемента «X»</tspan><tspan x="205.0" dy="14.3">AddSet = { «X» }, RemSet = { }</tspan></text><line x1="205.0" y1="160.0" x2="205.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="88.4" y="185.2" width="233.2" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">2. Видалення елемента «X»</tspan><tspan x="205.0" dy="14.3">AddSet = { «X» }, RemSet = { «X» }</tspan><tspan x="205.0" dy="14.3">(«X» переміщено в надгробки)</tspan></text><line x1="205.0" y1="248.0" x2="205.0" y2="273.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="88.4" y="275.2" width="233.2" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">3. Спроба повторно додати «X»</tspan><tspan x="205.0" dy="14.3">AddSet = { «X» }, RemSet = { «X» }</tspan><tspan x="205.0" dy="14.3">Стан = AddSet \ RemSet = ∅</tspan></text><text x="205.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка: елемент назавжди заблокований!</text><text x="205.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">2P-Set не дозволяє повторне додавання</text><rect x="420.0" y="65.0" width="380.0" height="355.0" rx="8" fill="#f8fcf9" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розв'язання в OR-Set (унікальні теги / dots)</text><line x1="435.0" y1="105.0" x2="785.0" y2="105.0" stroke="#c3e6cb" stroke-width="1.0"/><rect x="471.5" y="112.3" width="277.1" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1. Вузол A додає «X» із тегом t₁ = (A, 1)</tspan><tspan x="610.0" dy="14.3">Елементи: { («X», t₁) }</tspan></text><line x1="610.0" y1="160.0" x2="610.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="471.5" y="185.2" width="277.1" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2. Вузол B бачить t₁ і видаляє «X»</tspan><tspan x="610.0" dy="14.3">Видаляються лише спостережені теги { t₁ }</tspan><tspan x="610.0" dy="14.3">Елементи: ∅, Видалені теги: { t₁ }</tspan></text><line x1="610.0" y1="252.0" x2="610.0" y2="277.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="462.1" y="280.2" width="295.9" height="59.6" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">3. Конкурентно вузол A знову додає «X»</tspan><tspan x="610.0" dy="14.3">Генерується новий унікальний тег t₂ = (A, 2)</tspan><tspan x="610.0" dy="14.3">Елементи: { («X», t₂) }</tspan></text><rect x="435.0" y="355.0" width="350.0" height="52.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.2"/><text x="610.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Результат злиття: { («X», t₂) } ∈ Стан!</text><text x="610.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Нове додавання t₂ вижило, оскільки B видалив лише t₁</text>
</svg>