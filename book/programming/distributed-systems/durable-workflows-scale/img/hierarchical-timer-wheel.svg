<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="425.0" height="100.0" rx="8" fill="#fff8f7" stroke="#e0b4b0" stroke-width="1.5"/><text x="232.5" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0"></tspan></text>
<text x="232.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний глобальний Poller (Антипатерн)</text>
<rect x="35.0" y="55.0" width="395.0" height="50.0" rx="6" fill="#ffffff" stroke="#e0b4b0" stroke-width="1.0"/><text x="232.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">SELECT * FROM timers WHERE fire_time &lt;= NOW() LIMIT 1000</tspan><tspan x="232.5" dy="13.0">Блокування таблиць, сплески I/O та відставання черги</tspan></text>
<rect x="475.0" y="15.0" width="425.0" height="100.0" rx="8" fill="#f4faf6" stroke="#a3d9b8" stroke-width="1.5"/><text x="687.5" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0"></tspan></text>
<text x="687.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ієрархічне квантування таймерів (Timer Wheel)</text>
<rect x="490.0" y="55.0" width="395.0" height="50.0" rx="6" fill="#ffffff" stroke="#a3d9b8" stroke-width="1.0"/><text x="687.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">Квантування часу за бакетами (секунди -&gt; хвилини -&gt; дні)</tspan><tspan x="687.5" dy="13.0">O(1) перевірка готових таймерів без сканування бази даних</tspan></text>
<rect x="20.0" y="130.0" width="880.0" height="305.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0"></tspan></text>
<text x="460.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура ієрархічних часових бакетів усередині логічного шарду</text>
<rect x="35.0" y="175.0" width="260.0" height="150.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Рівень 1: Секундні слоти [0..59]</tspan><tspan x="165.0" dy="13.7">• Поточний активний секундний бакет</tspan><tspan x="165.0" dy="13.7">• Таймери спрацьовують негайно</tspan><tspan x="165.0" dy="13.7">• Завдання миттєво відправляються</tspan><tspan x="165.0" dy="13.7">  у Task Queue воркерам</tspan></text>
<rect x="330.0" y="175.0" width="260.0" height="150.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.2"/><text x="460.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Рівень 2: Хвилинні бакети [0..59]</tspan><tspan x="460.0" dy="13.7">• Таймери на найближчу годину</tspan><tspan x="460.0" dy="13.7">• На межі кожної хвилини таймери</tspan><tspan x="460.0" dy="13.7">  пересипаються (каскадуються)</tspan><tspan x="460.0" dy="13.7">  у секундне колесо</tspan></text>
<rect x="625.0" y="175.0" width="260.0" height="150.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.2"/><text x="755.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Рівень 3: Довготривалі бакети (Дні)</tspan><tspan x="755.0" dy="13.7">• Таймери на дні, місяці та роки</tspan><tspan x="755.0" dy="13.7">• Зберігаються у партиціях БД,</tspan><tspan x="755.0" dy="13.7">  відсортованих за часом;</tspan><tspan x="755.0" dy="13.7">  підвантажуються порціями</tspan></text>
<line x1="625.0" y1="250.0" x2="590.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330.0" y1="250.0" x2="295.0" y2="250.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="340.0" width="850.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="460.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Механізм переміщення (Cascade): Шард просуває внутрішній годинник без блокування таблиць.</tspan><tspan x="460.0" dy="13.7">Коли хвилина минає, елементи з хвилинного бакета розкладаються у відповідні секунди.</tspan><tspan x="460.0" dy="13.7">База даних зчитується лише блоками великих діапазонів, мінімізуючи навантаження на сховище.</tspan></text>
</svg>