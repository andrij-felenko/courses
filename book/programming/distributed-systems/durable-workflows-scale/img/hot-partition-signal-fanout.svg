<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="425.0" height="430.0" rx="8" fill="#fff8f7" stroke="#e0b4b0" stroke-width="1.5"/><text x="232.5" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0"></tspan></text>
<text x="232.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Конкурентний колапс (Single Entity Bottleneck)</text>
<rect x="69.4" y="65.9" width="325.2" height="38.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="232.0" y="81.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.0" dy="0.0">10 000 сигналів/сек на один WorkflowID</tspan><tspan x="232.0" dy="13.7">(наприклад, глобальний лічильник або флеш-розпродаж)</tspan></text>
<line x1="232.0" y1="115.0" x2="232.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="77.0" y="160.0" width="310.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="232.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.0" dy="0.0">Постійні конфлікти CAS (Optimistic Locking):</tspan><tspan x="232.0" dy="13.0">Кожен сигнал вимагає блокування шарду,</tspan><tspan x="232.0" dy="13.0">повторного зчитування історії та оновлення версії</tspan></text>
<line x1="232.0" y1="225.0" x2="232.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="265.0" width="395.0" height="165.0" rx="6" fill="#ffffff" stroke="#e0b4b0" stroke-width="1.2"/><text x="232.5" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Результат:</tspan><tspan x="232.5" dy="13.7">• 99% запитів зазнають відмови за таймаутом блокування</tspan><tspan x="232.5" dy="13.7">• Шард перевантажується ретраями та блокує сусідні процеси</tspan><tspan x="232.5" dy="13.7">• Падіння загальної пропускної здатності кластера</tspan></text>
<rect x="475.0" y="15.0" width="425.0" height="430.0" rx="8" fill="#f4faf6" stroke="#a3d9b8" stroke-width="1.5"/><text x="687.5" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0"></tspan></text>
<text x="687.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Масштабоване рішення: Tree Fan-Out і батчинг</text>
<rect x="532.0" y="65.9" width="310.0" height="38.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="687.0" y="81.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.0" dy="0.0">Вхідний потік сигналів розподіляється</tspan><tspan x="687.0" dy="13.7">за хешем ключа (User / Partition ID)</tspan></text>
<line x1="687.0" y1="115.0" x2="687.0" y2="145.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="490.0" y="145.0" width="395.0" height="120.0" rx="6" fill="#ffffff" stroke="#a3d9b8" stroke-width="1.2"/><text x="687.5" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">Каскад дочірніх процесів (Child Workflows):</tspan><tspan x="687.5" dy="13.7">• Листкові воркфлоу приймають сигнали локально</tspan><tspan x="687.5" dy="13.7">• Агрегують по 100–500 подій у пам'яті</tspan><tspan x="687.5" dy="13.7">• Передають зведені батчі батьківському процесу</tspan></text>
<line x1="687.0" y1="265.0" x2="687.0" y2="290.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="490.0" y="290.0" width="395.0" height="140.0" rx="6" fill="#ffffff" stroke="#a3d9b8" stroke-width="1.2"/><text x="687.5" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">Кореневий процес (Root Aggregator):</tspan><tspan x="687.5" dy="13.7">• Отримує періодичні батчі замість мільйонів сигналів</tspan><tspan x="687.5" dy="13.7">• Навантаження на один процес знижується в 100–1000 разів</tspan><tspan x="687.5" dy="13.7">• Ізоляція збоїв та нульові блокування сховища</tspan></text>
</svg>