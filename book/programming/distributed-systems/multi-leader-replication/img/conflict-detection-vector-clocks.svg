<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Детекція паралельних правок через версійні вектори та шляхи збіжності</text>
<rect x="30.0" y="55.0" width="900.0" height="175.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="480.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Детекція конкурентності: векторні мітки V = [v_A, v_B]</text>
<rect x="70.0" y="101.2" width="220.0" height="57.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Стан A: [1, 0]</tspan><tspan x="180.0" dy="14.3">Запис: 'Alice'</tspan><tspan x="180.0" dy="14.3">(Вузол A не бачив дій B)</tspan></text>
<rect x="670.0" y="101.2" width="220.0" height="57.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Стан B: [0, 1]</tspan><tspan x="780.0" dy="14.3">Запис: 'Bob'</tspan><tspan x="780.0" dy="14.3">(Вузол B не бачив дій A)</tspan></text>
<line x1="295.0" y1="130.0" x2="380.0" y2="130.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="665.0" y1="130.0" x2="580.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="390.0" y="96.5" width="180.0" height="67.0" rx="6" fill="#fff9db" stroke="#e67e22" stroke-width="1.5"/><text x="480.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Порівняння векторів:</tspan><tspan x="480.0" dy="13.0">[1, 0] vs [0, 1]</tspan><tspan x="480.0" dy="13.0">Жоден не домінує!</tspan><tspan x="480.0" dy="13.0">→ КОНКУРЕНТНІ (Concurrent)</tspan></text>
<text x="480.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Потрібне детерміноване правило злиття (збіжність до однакового стану на обох вузлах)</text>
<text x="480.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТРАТЕГІЇ ЗБІЖНОСТІ (CONVERGENCE)</text>
<rect x="30.0" y="275.0" width="280.0" height="240.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="170.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Last Write Wins (LWW)</text>
<rect x="45.0" y="338.5" width="250.0" height="93.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">• Порівняння міток часу (NTP)</tspan><tspan x="170.0" dy="13.0">• Запис із більшим t перемагає</tspan><tspan x="170.0" dy="13.0">• Альтернативний запис тихо</tspan><tspan x="170.0" dy="13.0">  викидається без сліду!</tspan><tspan x="170.0" dy="13.0">• Ризик: похибка годинника</tspan><tspan x="170.0" dy="13.0">  знищує новіші бізнес-дані</tspan></text>
<rect x="50.0" y="464.5" width="240.0" height="41.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Результат: 'Bob' (v[1,1])</tspan><tspan x="170.0" dy="13.0">Правку 'Alice' втрачено!</tspan></text>
<rect x="340.0" y="275.0" width="280.0" height="240.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="480.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Збереження версій (Siblings)</text>
<rect x="355.0" y="338.5" width="250.0" height="93.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">• Зберігаються обидва значення</tspan><tspan x="480.0" dy="13.0">• Дерево ревізій (_rev у CouchDB)</tspan><tspan x="480.0" dy="13.0">• При читанні клієнт отримує</tspan><tspan x="480.0" dy="13.0">  список конфліктних копій</tspan><tspan x="480.0" dy="13.0">• Обов'язок злиття покладено</tspan><tspan x="480.0" dy="13.0">  на застосунок або людину</tspan></text>
<rect x="360.0" y="464.5" width="240.0" height="41.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Результат: {'Alice', 'Bob'}</tspan><tspan x="480.0" dy="13.0">Чесно, але складніше API</tspan></text>
<rect x="650.0" y="275.0" width="280.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="790.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Безконфліктні типи (CRDT)</text>
<rect x="665.0" y="338.5" width="250.0" height="93.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">• Алгебраїчна напівґратка</tspan><tspan x="790.0" dy="13.0">• Операції комутують або</tspan><tspan x="790.0" dy="13.0">  злиття полів є детермінованим</tspan><tspan x="790.0" dy="13.0">• Лічильники PN-Counter, множини</tspan><tspan x="790.0" dy="13.0">  OR-Set, злиття JSON по ключах</tspan><tspan x="790.0" dy="13.0">• Немає втрати правок</tspan></text>
<rect x="670.0" y="464.5" width="240.0" height="41.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Результат: об'єднання правок</tspan><tspan x="790.0" dy="13.0">Без втрат і блокувань</tspan></text>
</svg>