<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Анатомія навали на кеш: перевантаження джерела внаслідок одночасного промаху</tspan></text>
<rect x="40.0" y="80.0" width="330.0" height="450.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="55.0" y="95.0" width="300.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">1. Вхідний потік запитів</tspan></text>
<rect x="55.0" y="140.0" width="300.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Гарячий ключ: product:7821</tspan><tspan x="205.0" dy="13.7">Інтенсивність: λ = 5000 запитів/с</tspan></text>
<rect x="55.0" y="190.0" width="300.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Кеш (TTL = 60 с)</tspan><tspan x="205.0" dy="13.0">Час t = 60.000 с: термін дії вичерпано!</tspan><tspan x="205.0" dy="13.0">Усі 5000 потоків фіксують ПРОМАХ</tspan></text>
<line x1="205.0" y1="250.0" x2="205.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="285.0" width="300.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="316.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Вікно вразливості (δ = 200 мс):</tspan><tspan x="205.0" dy="13.0">За час обчислення одного запиту</tspan><tspan x="205.0" dy="13.0">надходить 1000 паралельних промахів.</tspan><tspan x="205.0" dy="13.0">Жоден не чекає на сусіда!</tspan></text>
<rect x="55.0" y="390.0" width="300.0" height="125.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Наслідки для клієнтів:</tspan><tspan x="205.0" dy="12.3">• Затримка зростає: 5 мс → 15 000 мс</tspan><tspan x="205.0" dy="12.3">• Спрацьовує клієнтський таймаут 2 с</tspan><tspan x="205.0" dy="12.3">• Шторм повторних спроб (Retry Storm)</tspan><tspan x="205.0" dy="12.3">• Клієнти лавиноподібно добивають сервіс</tspan></text>
<rect x="390.0" y="80.0" width="380.0" height="450.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="405.0" y="95.0" width="350.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">2. Колапс джерела даних (СУБД)</tspan></text>
<rect x="405.0" y="140.0" width="350.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Пул з'єднань СУБД (Max = 100):</tspan><tspan x="580.0" dy="13.0">1000 потоків одночасно штурмують базу</tspan><tspan x="580.0" dy="13.0">Черга з'єднань миттєво переповнена</tspan></text>
<rect x="405.0" y="205.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">CPU &amp; Диск:</tspan><tspan x="580.0" dy="13.0">• Завантаження CPU: 100%</tspan><tspan x="580.0" dy="13.0">• Перемикання контекстів ядра: &gt; 500k/s</tspan><tspan x="580.0" dy="13.0">• Черга дискового вводу/виводу: переповнена</tspan></text>
<rect x="405.0" y="275.0" width="350.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Конкуренція за блокування:</tspan><tspan x="580.0" dy="13.0">Сотні ідентичних SQL-запитів блокують</tspan><tspan x="580.0" dy="13.0">рядки та сторінки в Buffer Pool</tspan></text>
<rect x="405.0" y="340.0" width="350.0" height="175.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="398.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Метастабільна відмова (Metastable Failure):</tspan><tspan x="580.0" dy="13.0">• База не встигає відповісти за час таймауту.</tspan><tspan x="580.0" dy="13.0">• Відповіді викидаються в нікуди, бо клієнт відпав.</tspan><tspan x="580.0" dy="13.0">• Кеш ніколи не заповнюється свіжим значенням.</tspan><tspan x="580.0" dy="13.0">• Навіть при спаданні трафіку система не виходить</tspan><tspan x="580.0" dy="13.0">  зі стану перевантаження без ручного втручання.</tspan></text>
<rect x="790.0" y="80.0" width="350.0" height="450.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="805.0" y="95.0" width="320.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">3. Класифікація методів захисту</tspan></text>
<rect x="805.0" y="140.0" width="320.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">А. Блокування (Lock / Mutex):</tspan><tspan x="965.0" dy="13.0">Тільки один потік іде до бази,</tspan><tspan x="965.0" dy="13.0">інші чекають у черзі або сплять.</tspan><tspan x="965.0" dy="13.0">Розподілений замок у Redis.</tspan></text>
<rect x="805.0" y="230.0" width="320.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Б. Об'єднання запитів (Coalescing):</tspan><tspan x="965.0" dy="13.0">Один рейс на всі паралельні запити.</tspan><tspan x="965.0" dy="13.0">Результат розсилається підписникам.</tspan><tspan x="965.0" dy="13.0">Single-Flight у пам'яті процесу.</tspan></text>
<rect x="805.0" y="320.0" width="320.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">В. Раннє оновлення (XFetch / Soft TTL):</tspan><tspan x="965.0" dy="13.0">Ймовірнісний або фоновий розрахунок</tspan><tspan x="965.0" dy="13.0">ДО настання фізичного вичерпання TTL.</tspan><tspan x="965.0" dy="13.0">Клієнт завжди отримує відповідь з пам'яті.</tspan></text>
<rect x="805.0" y="415.0" width="320.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Г. Дезсинхронізація (TTL Jitter):</tspan><tspan x="965.0" dy="13.0">Додавання випадкового шуму до TTL,</tspan><tspan x="965.0" dy="13.0">щоб запобігти масовому одночасному</tspan><tspan x="965.0" dy="13.0">згорянню тисяч споріднених ключів.</tspan></text>
<line x1="370.0" y1="210.0" x2="390.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="770.0" y1="210.0" x2="790.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>