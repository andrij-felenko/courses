<text x="500.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дозволені операції над схемою:</text>
<text x="375.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="375.0" dy="0.0">• Додавання нових полів</tspan><tspan x="375.0" dy="12.3">• Видалення необов'язкових</tspan><tspan x="375.0" dy="12.3">  полів (зі старим дефолтом)</tspan><tspan x="375.0" dy="12.3">• Заборонено: видаляти обов'язкові</tspan></text>
