<line x1="695.0" y1="107.0" x2="965.0" y2="107.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="695.0" y="118.0" width="270.0" height="38.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="0.8"/>
<text x="830.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Reader(нова) ↔ Writer(стара)</tspan><tspan x="830.0" dy="12.0">і Reader(стара) ↔ Writer(нова)</tspan></text>
<text x="830.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Хто оновлюється першим:</text>
<text x="830.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будь-який (незалежно)</text>
<line x1="695.0" y1="210.0" x2="965.0" y2="210.0" stroke="#6b7280" stroke-width="0.6"/>
<text x="830.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дозволені операції над схемою:</text>
<text x="705.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="705.0" dy="0.0">• Додавання лише полів із дефолтом</tspan><tspan x="705.0" dy="12.3">• Видалення лише полів із дефолтом</tspan><tspan x="705.0" dy="12.3">• Найвища безпека для мікросервісів</tspan><tspan x="705.0" dy="12.3">• Canary / Blue-Green релізи</tspan></text>
