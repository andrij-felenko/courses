<text x="45.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">• Видалення полів</tspan><tspan x="45.0" dy="12.3">• Додавання необов'язкових</tspan><tspan x="45.0" dy="12.3">  полів зі значенням за замовчуванням</tspan><tspan x="45.0" dy="12.3">• Заборонено: нові обов'язкові поля</tspan></text>
