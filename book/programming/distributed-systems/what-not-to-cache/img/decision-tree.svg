<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 фільтрів перевірки доцільності кешування</text>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чекліст архітектора: 5 фільтрів для перевірки доцільності кешу</text>
<rect x="30.0" y="70.0" width="200.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Частота змін</tspan></text>
<rect x="245.0" y="70.0" width="470.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Мутацій більше ніж читань (W &gt;= R)?</tspan><tspan x="480.0" dy="15.6">TTL менший за інтервал читання?</tspan></text>
<rect x="730.0" y="70.0" width="280.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Якщо ТАК -&gt; НЕ КЕШУВАТИ</tspan><tspan x="870.0" dy="14.3">Нульова користь, витрата CPU</tspan></text>
<rect x="30.0" y="156.0" width="200.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2. Узгодженість</tspan></text>
<rect x="245.0" y="156.0" width="470.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Потрібна миттєва точність (нуль застарілості)?</tspan><tspan x="480.0" dy="15.6">Фінансовий баланс чи залишок товару?</tspan></text>
<rect x="730.0" y="156.0" width="280.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="188.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Якщо ТАК -&gt; НЕ КЕШУВАТИ</tspan><tspan x="870.0" dy="14.3">Ризик подвійних списань</tspan></text>
<rect x="30.0" y="242.0" width="200.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="282.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">3. Вартість обчислень</tspan></text>
<rect x="245.0" y="242.0" width="470.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Локальне обчислення дешевше за сокет кешу?</tspan><tspan x="480.0" dy="15.6">T_compute &lt; T_cache_lookup (нс проти мс)?</tspan></text>
<rect x="730.0" y="242.0" width="280.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Якщо ТАК -&gt; НЕ КЕШУВАТИ</tspan><tspan x="870.0" dy="14.3">Звернення до кешу сповільнить CPU</tspan></text>
<rect x="30.0" y="328.0" width="200.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">4. Безпека та контекст</tspan></text>
<rect x="245.0" y="328.0" width="470.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Приватні сесії, токени CSRF, персональні PII</tspan><tspan x="480.0" dy="15.6">без строгої ізоляції в ключі кешу?</tspan></text>
<rect x="730.0" y="328.0" width="280.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Якщо ТАК -&gt; НЕ КЕШУВАТИ</tspan><tspan x="870.0" dy="14.3">Ризик витоку (Cache Deception)</tspan></text>
<rect x="30.0" y="414.0" width="200.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">5. Локальність даних</tspan></text>
<rect x="245.0" y="414.0" width="470.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Одноразовий скан, аналітичний звіт,</tspan><tspan x="480.0" dy="15.6">довгий хвіст унікальних пошукових рядків?</tspan></text>
<rect x="730.0" y="414.0" width="280.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Якщо ТАК -&gt; НЕ КЕШУВАТИ</tspan><tspan x="870.0" dy="14.3">Засмічення LRU (Thrashing)</tspan></text>
<text x="520.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Лише якщо на ВСІ 5 запитань відповідь «НІ» — сутність підлягає безпечному та вигідному кешуванню.</text>
