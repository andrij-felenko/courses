<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка мультиплексування HTTP/2 та gRPC: чому L4 ламає розподіл навантаження</text>
<rect x="20.0" y="55.0" width="485.0" height="425.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.2"/>
<text x="262.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Спроба балансувати HTTP/2 через L4 (Збій розподілу)</text>
<rect x="30.0" y="115.8" width="150.0" height="48.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="105.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1 Клієнт (gRPC / HTTP/2)</tspan><tspan x="105.0" dy="11.7">100 паралельних запитів</tspan><tspan x="105.0" dy="11.7">в 1 TCP-з'єднанні</tspan></text>
<line x1="182.0" y1="140.0" x2="218.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="222.5" y="115.8" width="125.0" height="48.4" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">L4 Балансувальник</tspan><tspan x="285.0" dy="11.7">Бачить 1 TCP потік</tspan><tspan x="285.0" dy="11.7">-&gt; Шле на 1 сервер</tspan></text>
<line x1="350.0" y1="140.0" x2="385.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="379.0" y="121.7" width="122.0" height="36.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Сервер A: 100 req</tspan><tspan x="440.0" dy="11.7">CPU: 100% (Колапс!)</tspan></text>
<rect x="385.8" y="201.7" width="108.3" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Сервер B: 0 req</tspan><tspan x="440.0" dy="11.7">CPU: 1% (Простоює)</tspan></text>
<rect x="385.8" y="271.6" width="108.3" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Сервер C: 0 req</tspan><tspan x="440.0" dy="11.7">CPU: 1% (Простоює)</tspan></text>
<rect x="35.0" y="360.0" width="455.0" height="105.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="262.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="262.0" dy="0.0">Наслідок: L4 не розуміє мультиплексовані фрейми всередині TCP.</tspan><tspan x="262.0" dy="12.6">Усі 100 запитів летять в один сервер, руйнуючи горизонтальне масштабування.</tspan><tspan x="262.0" dy="12.6">Сервери B і C залишаються порожніми, а сервер A падає від OOM або таймаутів.</tspan></text>
<rect x="535.0" y="55.0" width="485.0" height="425.0" rx="6" fill="#f9fcf9" stroke="#27ae60" stroke-width="1.2"/>
<text x="777.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Балансування HTTP/2 через L7 (Коректний розподіл)</text>
<rect x="545.0" y="115.8" width="150.0" height="48.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1 Клієнт (gRPC / HTTP/2)</tspan><tspan x="620.0" dy="11.7">100 паралельних запитів</tspan><tspan x="620.0" dy="11.7">в 1 TCP-з'єднанні</tspan></text>
<line x1="697.0" y1="140.0" x2="733.0" y2="140.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="716.1" y="115.8" width="177.8" height="48.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">L7 Проксі (Envoy)</tspan><tspan x="805.0" dy="11.7">Термінує TCP, демультиплексує</tspan><tspan x="805.0" dy="11.7">100 потоків на рівні кадрів</tspan></text>
<line x1="875.0" y1="130.0" x2="905.0" y2="130.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="875.0" y1="145.0" x2="905.0" y2="210.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="875.0" y1="155.0" x2="905.0" y2="280.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="910.0" y="121.7" width="100.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Сервер A: 33 req</tspan><tspan x="960.0" dy="11.7">CPU: 33% (Норма)</tspan></text>
<rect x="910.0" y="201.7" width="100.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Сервер B: 33 req</tspan><tspan x="960.0" dy="11.7">CPU: 33% (Норма)</tspan></text>
<rect x="910.0" y="271.6" width="100.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Сервер C: 34 req</tspan><tspan x="960.0" dy="11.7">CPU: 34% (Норма)</tspan></text>
<rect x="550.0" y="360.0" width="455.0" height="105.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="777.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="777.0" dy="0.0">Результат: L7 розбирає HTTP/2 потоки (Streams) і розподіляє кожен запит окремо.</tspan><tspan x="777.0" dy="12.6">Пул бекендів навантажується рівномірно, хвостова затримка (p99) мінімізується.</tspan><tspan x="777.0" dy="12.6">Ефективне використання ресурсів усього парку машин без перекосів.</tspan></text>
</svg>