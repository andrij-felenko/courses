<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряма відповідь сервера (Direct Server Return, DSR): асиметричний обхід вузьких місць</text>
<rect x="37.5" y="114.0" width="145.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Клієнт</tspan><tspan x="110.0" dy="13.0">IP: 198.51.100.2</tspan><tspan x="110.0" dy="13.0">Шле GET-запит (~1 КБ)</tspan></text>
<rect x="367.5" y="107.5" width="245.0" height="65.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">L4 Балансувальник (VIP)</tspan><tspan x="490.0" dy="13.0">Підміняє лише MAC-адресу</tspan><tspan x="490.0" dy="13.0">(IP-заголовки незмінні: Dst=VIP)</tspan><tspan x="490.0" dy="13.0">Навантаження лише на Ingress</tspan></text>
<rect x="742.8" y="107.5" width="214.4" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Бекенд-вузол (Real Server)</tspan><tspan x="850.0" dy="13.0">IP: 10.0.1.50</tspan><tspan x="850.0" dy="13.0">VIP налаштовано на lo:0 (no ARP)</tspan><tspan x="850.0" dy="13.0">Формує відповідь (~10 МБ)</tspan></text>
<rect x="350.0" y="340.5" width="280.0" height="39.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Мережевий комутатор / Шлюз (Internet Gateway)</tspan><tspan x="490.0" dy="13.0">Прямий транзит трафіку в Інтернет</tspan></text>
<line x1="185.0" y1="140.0" x2="360.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="272.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Малий запит (1 КБ)</text>
<text x="272.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Src: 198.51.100.2, Dst: VIP</text>
<line x1="620.0" y1="140.0" x2="740.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="680.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">2. MAC Rewrite / IPIP</text>
<text x="680.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Dst IP все ще VIP!</text>
<line x1="850.0" y1="195.0" x2="630.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="775.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. Велика відповідь (10 МБ)</text>
<text x="775.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Src: VIP, Dst: 198.51.100.2</text>
<line x1="350.0" y1="360.0" x2="110.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="205.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">4. Пряма доставка клієнту</text>
<text x="205.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">В обхід L4 балансувальника!</text>
<rect x="40.0" y="415.0" width="900.0" height="50.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="490.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефект DSR: вихідний потік у 10–100 разів більший за вхідний. L4-балансувальник не є вузьким місцем для гігабітів трафіку.</text>
</svg>