<text x="450.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Валідація JWT/OAuth2</tspan><tspan x="450.0" dy="14.2">Очищення X-User-Id</tspan><tspan x="450.0" dy="14.2">Впорскування Claims</tspan></text>
<rect x="550.0" y="60.0" width="160.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="630.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Маршрутизатор</text>
