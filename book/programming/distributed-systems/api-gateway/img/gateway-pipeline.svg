<text x="630.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Зіставлення path/headers</tspan><tspan x="630.0" dy="14.2">Переписування URL</tspan><tspan x="630.0" dy="14.2">Вибір Upstream Cluster</tspan></text>
