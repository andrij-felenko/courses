<rect x="370.0" y="60.0" width="160.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Автентифікація</text>
