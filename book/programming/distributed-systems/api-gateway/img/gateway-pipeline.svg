<text x="90.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">TCP / TLS</tspan><tspan x="90.0" dy="14.2">HTTP/1.1, HTTP/2, gRPC</tspan><tspan x="90.0" dy="14.2">ALPN узгодження</tspan></text>
