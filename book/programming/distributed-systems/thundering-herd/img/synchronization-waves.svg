<rect x="620.0" y="380.0" width="505.0" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="872.5" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="872.5" dy="0.0">Характеристики десинхронізованого потоку:</tspan><tspan x="872.5" dy="12.3">• Випадковий шум руйнує фазову когерентність клієнтських циклів.</tspan><tspan x="872.5" dy="12.3">• Навантаження розмазується тонким шаром, не перевищуючи ліміт.</tspan><tspan x="872.5" dy="12.3">• Goodput наближається до 100%: кожен запит отримує відповідь.</tspan><tspan x="872.5" dy="12.3">• Сервер стабільно перетравлює отару за передбачуваний час.</tspan></text>
