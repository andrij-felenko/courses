<rect x="55.0" y="380.0" width="505.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="307.5" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">Характеристики некерованої отари:</tspan><tspan x="307.5" dy="12.3">• Кожен пік значно перевищує фізичну місткість вузла.</tspan><tspan x="307.5" dy="12.3">• 100% запитів під час піку зазнають відмови через черги та таймаути.</tspan><tspan x="307.5" dy="12.3">• Періоди між піками мають нульове завантаження (CPU простоює).</tspan><tspan x="307.5" dy="12.3">• Клієнти зберігають синхронність фази через фіксовані множники 2^i.</tspan></text>
