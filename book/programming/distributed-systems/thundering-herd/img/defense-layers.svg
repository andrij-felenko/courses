<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Багаторівневий захист від штормів пробудження у розподілених архітектурах</tspan></text>
<rect x="40.0" y="80.0" width="260.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="55.0" y="95.0" width="230.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1. Транспорт та Ядро</tspan></text>
<rect x="55.0" y="140.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">SO_REUSEPORT:</tspan><tspan x="170.0" dy="12.3">Шардинг черг слухання між</tspan><tspan x="170.0" dy="12.3">потоками ядра без конкуренції</tspan><tspan x="170.0" dy="12.3">за єдиний accept-мутекс.</tspan></text>
<rect x="55.0" y="225.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">EPOLLEXCLUSIVE:</tspan><tspan x="170.0" dy="12.3">Пробудження строго одного</tspan><tspan x="170.0" dy="12.3">воркера на подію замість</tspan><tspan x="170.0" dy="12.3">усіх N сплячих потоків.</tspan></text>
<rect x="55.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">SYN Cookies &amp; Backlog:</tspan><tspan x="170.0" dy="12.3">Захист від переповнення</tspan><tspan x="170.0" dy="12.3">черги TCP без виділення</tspan><tspan x="170.0" dy="12.3">структур стану в ядрі</tspan><tspan x="170.0" dy="12.3">при зливних сплесках SYN.</tspan></text>
<rect x="55.0" y="415.0" width="230.0" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">TLS Session Resumption:</tspan><tspan x="170.0" dy="12.3">Зменшення витрат CPU</tspan><tspan x="170.0" dy="12.3">на повторне встановлення</tspan><tspan x="170.0" dy="12.3">захищеного каналу завдяки</tspan><tspan x="170.0" dy="12.3">квиткам сесій (Session Tickets).</tspan></text>
<rect x="320.0" y="80.0" width="260.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="335.0" y="95.0" width="230.0" height="34.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">2. Шлюз та Вхідний бар'єр</tspan></text>
<rect x="335.0" y="140.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Token Bucket Limiting:</tspan><tspan x="450.0" dy="12.3">Жорстке відсікання сплесків</tspan><tspan x="450.0" dy="12.3">з'єднань на вході з поверненням</tspan><tspan x="450.0" dy="12.3">швидкої помилки (429 / RST).</tspan></text>
<rect x="335.0" y="225.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Staggered Staged Warm-up:</tspan><tspan x="450.0" dy="12.3">Поступове відкриття шлюзу</tspan><tspan x="450.0" dy="12.3">після старту для уникнення</tspan><tspan x="450.0" dy="12.3">холодного удару по бекендах.</tspan></text>
<rect x="335.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Jittered Retry-After:</tspan><tspan x="450.0" dy="12.3">HTTP 429 з динамічним</tspan><tspan x="450.0" dy="12.3">заголовком Retry-After:</tspan><tspan x="450.0" dy="12.3">Header = base + random()</tspan><tspan x="450.0" dy="12.3">для розсіювання клієнтів.</tspan></text>
<rect x="335.0" y="415.0" width="230.0" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Load Shedding:</tspan><tspan x="450.0" dy="12.3">Скидання низькопріоритетних</tspan><tspan x="450.0" dy="12.3">фонових запитів на користь</tspan><tspan x="450.0" dy="12.3">критичних операцій користувача</tspan><tspan x="450.0" dy="12.3">під час пікового навантаження.</tspan></text>
<rect x="600.0" y="80.0" width="260.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="615.0" y="95.0" width="230.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">3. Координація та Замки</tspan></text>
<rect x="615.0" y="140.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Послідовні вотчі (ZNode):</tspan><tspan x="730.0" dy="12.3">Клієнт чекає ТІЛЬКИ на свій</tspan><tspan x="730.0" dy="12.3">попередник (i - 1), запобігаючи</tspan><tspan x="730.0" dy="12.3">шторму пробудження O(N^2).</tspan></text>
<rect x="615.0" y="225.0" width="230.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Raft Randomized Election:</tspan><tspan x="730.0" dy="12.3">Випадковий інтервал виборів</tspan><tspan x="730.0" dy="12.3">(150-300 мс) гарантує швидке</tspan><tspan x="730.0" dy="12.3">обрання лідера без колізій.</tspan></text>
<rect x="615.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Staggered Lease Renewals:</tspan><tspan x="730.0" dy="12.3">Періодичне оновлення лізів</tspan><tspan x="730.0" dy="12.3">у Soft-State реєстрах з</tspan><tspan x="730.0" dy="12.3">індивідуальним зміщенням фази</tspan><tspan x="730.0" dy="12.3">(Hash(ID) mod Interval).</tspan></text>
<rect x="615.0" y="415.0" width="230.0" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Hierarchical Single-Flight:</tspan><tspan x="730.0" dy="12.3">Локальне злиття однакових</tspan><tspan x="730.0" dy="12.3">запитів на рівні екземплярів</tspan><tspan x="730.0" dy="12.3">перед зверненням до загального</tspan><tspan x="730.0" dy="12.3">кластера координації.</tspan></text>
<rect x="880.0" y="80.0" width="260.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="895.0" y="95.0" width="230.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">4. Клієнтська дисципліна</tspan></text>
<rect x="895.0" y="140.0" width="230.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Decorrelated Jitter:</tspan><tspan x="1010.0" dy="12.3">Нелінійне розмивання пауз</tspan><tspan x="1010.0" dy="12.3">між спробами з урахуванням</tspan><tspan x="1010.0" dy="12.3">попереднього інтервалу сну.</tspan></text>
<rect x="895.0" y="225.0" width="230.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Retry Budgets:</tspan><tspan x="1010.0" dy="12.3">Обмеження повторів часткою</tspan><tspan x="1010.0" dy="12.3">від успішних запитів (&lt;= 10%),</tspan><tspan x="1010.0" dy="12.3">що вимикає лавиноподібні шторми.</tspan></text>
<rect x="895.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="342.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Client-Side Circuit Breaker:</tspan><tspan x="1010.0" dy="12.3">Автономне розмикання кола</tspan><tspan x="1010.0" dy="12.3">на пристрої користувача при</tspan><tspan x="1010.0" dy="12.3">детекції серійних збоїв мережі.</tspan></text>
<rect x="895.0" y="415.0" width="230.0" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Poller Phase Offsets:</tspan><tspan x="1010.0" dy="12.3">Примусовий розкид періодичних</tspan><tspan x="1010.0" dy="12.3">таймерів фонових завдань замість</tspan><tspan x="1010.0" dy="12.3">запуску рівно на початку хвилини</tspan><tspan x="1010.0" dy="12.3">(00.000 секунд).</tspan></text>
</svg>