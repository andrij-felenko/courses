<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналітичний простір ATAM: точки чутливості, компроміси, ризики та не-ризики</text>
<rect x="55.0" y="60.0" width="390.0" height="190.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="75.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Точка чутливості (Sensitivity Point, S)</text>
<text x="75.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="75.0" dy="0.0">Параметр p суттєво змінює ОДИН якісний атрибут (|∂Q/∂p| &gt;&gt; 0).</tspan><tspan x="75.0" dy="12.3">Рішення концентрує вплив на одній шкалі.</tspan><tspan x="75.0" dy="12.3"></tspan><tspan x="75.0" dy="12.3">Приклад: розмір буфера сокетів прямо задає стійкість до</tspan><tspan x="75.0" dy="12.3">мікровсплесків трафіку без втрати пакетів.</tspan></text>
<rect x="475.0" y="60.0" width="390.0" height="190.0" rx="10" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.0"/>
<text x="495.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4ea8" text-anchor="start" font-weight="700">Точка компромісу (Tradeoff Point, T)</text>
<text x="495.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="495.0" dy="0.0">Параметр p тягне ДВА атрибути в ПРОТИЛЕЖНІ боки.</tspan><tspan x="495.0" dy="12.3">Неможливо покращити один, не погіршивши інший.</tspan><tspan x="495.0" dy="12.3"></tspan><tspan x="495.0" dy="12.3">Приклад: синхронний кворум реплікації (R+W &gt; N)</tspan><tspan x="495.0" dy="12.3">гарантує строгу консистентність, але збільшує затримку.</tspan></text>
<rect x="55.0" y="275.0" width="390.0" height="190.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="75.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Архітектурний ризик (Risk, R)</text>
<text x="75.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="75.0" dy="0.0">Рішення, що ставить під загрозу досягнення міри якості,</tspan><tspan x="75.0" dy="12.3">або наслідки якого команда не прорахувала.</tspan><tspan x="75.0" dy="12.3"></tspan><tspan x="75.0" dy="12.3">Приклад: необмежена черга повідомлень без backpressure</tspan><tspan x="75.0" dy="12.3">загрожує OOM під час сплеску навантаження.</tspan></text>
<rect x="475.0" y="275.0" width="390.0" height="190.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="495.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Не-ризик / Обґрунтоване рішення (Non-Risk, NR)</text>
<text x="495.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="495.0" dy="0.0">Рішення надійно гарантує потрібну міру якості за рахунок</tspan><tspan x="495.0" dy="12.3">чітко визначеного архітектурного інваріанта.</tspan><tspan x="495.0" dy="12.3"></tspan><tspan x="495.0" dy="12.3">Приклад: використання ідемпотентних ключів у Kafka-споживачах</tspan><tspan x="495.0" dy="12.3">виключає дублювання транзакцій при повторних відправках.</tspan></text>
<rect x="101.9" y="475.8" width="716.3" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="460.0" y="495.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Зв'язок: точки компромісу (T) без явного інваріанта стають ризиками (R); з доведеним інваріантом — не-ризиками (NR).</tspan></text>
</svg>