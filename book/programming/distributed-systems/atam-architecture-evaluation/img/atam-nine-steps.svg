<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дев'ять кроків ATAM у двох фазах оцінювання</text>
<text x="250.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4ea8" text-anchor="middle" font-weight="700">Фаза 1: Оцінювачі та архітектурна група</text>
<text x="710.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 2: Розширені стейкхолдери</text>
<line x1="480.0" y1="36.0" x2="480.0" y2="510.0" stroke="#d0d4da" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="50.0" y="76.0" width="400.0" height="58.0" rx="8" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.6"/>
<text x="66.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">1. Презентація ATAM</text>
<text x="66.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Вирівнювання термінів, правил і меж оцінки</text>
<line x1="250.0" y1="135.0" x2="250.0" y2="149.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="150.0" width="400.0" height="58.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="66.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Бізнес-драйвери</text>
<text x="66.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Контекст, місія, функційні межі, цілі бізнесу</text>
<line x1="250.0" y1="209.0" x2="250.0" y2="223.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="224.0" width="400.0" height="58.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="66.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Презентація архітектури</text>
<text x="66.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Діаграми поглядів, обмеження, патерни виконання</text>
<line x1="250.0" y1="283.0" x2="250.0" y2="297.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="298.0" width="400.0" height="58.0" rx="8" fill="#f3edfb" stroke="#7a4ea8" stroke-width="1.6"/>
<text x="66.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4ea8" text-anchor="start" font-weight="700">4. Каталогізація підходів</text>
<text x="66.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Фіксація архітектурних стилів і тактик</text>
<line x1="250.0" y1="357.0" x2="250.0" y2="371.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="372.0" width="400.0" height="58.0" rx="8" fill="#f3edfb" stroke="#7a4ea8" stroke-width="1.6"/>
<text x="66.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4ea8" text-anchor="start" font-weight="700">5. Дерево корисності</text>
<text x="66.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Формування та пріоритезація сценаріїв (В,В)</text>
<line x1="250.0" y1="431.0" x2="250.0" y2="445.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="446.0" width="400.0" height="58.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="66.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">6. Аналіз підходів (Фаза 1)</text>
<text x="66.0" y="489.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Трасування топ-сценаріїв → пошук S, T, R, NR</text>
<line x1="450.0" y1="475.0" x2="510.0" y2="105.0" stroke="#7a4ea8" stroke-width="2.0" stroke-dasharray="4 4"/>
<line x1="510.0" y1="105.0" x2="540.0" y2="105.0" stroke="#7a4ea8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="76.0" width="380.0" height="82.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="558.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">7. Штурм сценаріїв</text>
<text x="558.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="558.0" dy="0.0">Генерація сценаріїв ширшим колом (devs, ops, QA)</tspan></text>
<line x1="730.0" y1="159.0" x2="730.0" y2="203.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="540.0" y="204.0" width="380.0" height="82.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="558.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">8. Аналіз підходів (Фаза 2)</text>
<text x="558.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="558.0" dy="0.0">Перевірка архітектури на сценаріях стейкхолдерів</tspan></text>
<line x1="730.0" y1="287.0" x2="730.0" y2="331.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="540.0" y="332.0" width="380.0" height="82.0" rx="8" fill="#fff6e0" stroke="#d97706" stroke-width="1.8"/>
<text x="558.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">9. Презентація результатів</text>
<text x="558.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="558.0" dy="0.0">Каталог ризиків, компромісів та теми ризиків</tspan></text>
<rect x="102.9" y="530.8" width="754.2" height="34.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="551.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Результат ATAM: не оцінка «добре/погано», а точна мапа рішень — чутливості (S), компроміси (T), ризики (R) і теми ризиків.</tspan></text>
</svg>