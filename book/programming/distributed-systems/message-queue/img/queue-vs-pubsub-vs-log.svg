<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="1100.0" height="485.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="570.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три парадигми асинхронного обміну: Черга, Pub/Sub та Журнал подій</text>
<rect x="40.0" y="70.0" width="330.0" height="360.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="205.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Черга (Point-to-Point)</text>
<line x1="55.0" y1="115.0" x2="355.0" y2="115.0" stroke="#6b7280" stroke-width="1.1"/>
<text x="205.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">RabbitMQ, SQS, ActiveMQ</tspan><tspan x="205.0" dy="15.5"></tspan><tspan x="205.0" dy="15.5">• Модель: 1 повідомлення → 1 воркер</tspan><tspan x="205.0" dy="15.5">• Споживання: Конкурентний розбір черги</tspan><tspan x="205.0" dy="15.5">• Стан: Зберігається на брокері</tspan><tspan x="205.0" dy="15.5">• Видалення: Одразу після підтвердження (ACK)</tspan><tspan x="205.0" dy="15.5">• Повторне читання: НЕМОЖЛИВЕ</tspan><tspan x="205.0" dy="15.5"></tspan><tspan x="205.0" dy="15.5">Призначення: розподіл важких задач,</tspan><tspan x="205.0" dy="15.5">буферизація піків, бекенд-обробка.</tspan></text>
<rect x="390.0" y="70.0" width="330.0" height="360.0" rx="8" fill="#fef9e7" stroke="#d97706" stroke-width="1.6"/>
<text x="555.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Тема (Publish / Subscribe)</text>
<line x1="405.0" y1="115.0" x2="705.0" y2="115.0" stroke="#6b7280" stroke-width="1.1"/>
<text x="555.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Redis Pub/Sub, SNS, Google Pub/Sub</tspan><tspan x="555.0" dy="15.5"></tspan><tspan x="555.0" dy="15.5">• Модель: 1 повідомлення → N підписників</tspan><tspan x="555.0" dy="15.5">• Споживання: Fan-out розсилка кожному</tspan><tspan x="555.0" dy="15.5">• Стан: Ефемерний (без стану підписників)</tspan><tspan x="555.0" dy="15.5">• Збереження: Зникає одразу після розсилки</tspan><tspan x="555.0" dy="15.5">• Повторне читання: НЕМОЖЛИВЕ</tspan><tspan x="555.0" dy="15.5"></tspan><tspan x="555.0" dy="15.5">Призначення: розсилка сповіщень,</tspan><tspan x="555.0" dy="15.5">інвалідація кешів, чати, телеметрія.</tspan></text>
<rect x="740.0" y="70.0" width="330.0" height="360.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="905.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Журнал подій (Event Log)</text>
<line x1="755.0" y1="115.0" x2="1055.0" y2="115.0" stroke="#6b7280" stroke-width="1.1"/>
<text x="905.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Apache Kafka, Apache Pulsar</tspan><tspan x="905.0" dy="15.5"></tspan><tspan x="905.0" dy="15.5">• Модель: Незмінний потік подій (Append-only)</tspan><tspan x="905.0" dy="15.5">• Споживання: Зсуви (Offset) ведуть клієнти</tspan><tspan x="905.0" dy="15.5">• Стан: Клієнти самі фіксують свій прогрес</tspan><tspan x="905.0" dy="15.5">• Збереження: Дні/місяці за часом або обсягом</tspan><tspan x="905.0" dy="15.5">• Повторне читання: ПОВНОЦІННЕ (Replay)</tspan><tspan x="905.0" dy="15.5"></tspan><tspan x="905.0" dy="15.5">Призначення: Event Sourcing, потокова</tspan><tspan x="905.0" dy="15.5">аналітика, спільна історія фактів.</tspan></text>
<rect x="40.0" y="440.0" width="1030.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="555.0" y="465.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Ключова різниця: Черга знищує повідомлення після виконання завдання одним виконавцем; Pub/Sub копіює його всім активним слухачам; Журнал зберігає факти назавжди для багатьох систем.</tspan></text>
</svg>