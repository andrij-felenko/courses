<rect x="30.0" y="30.0" width="520.0" height="390.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="290.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Жадібний Prefetch (prefetch = 10)</text>
<rect x="50.0" y="85.0" width="480.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Воркер 1 (Отримав 10 задач):</text>
<rect x="60.0" y="125.0" width="140.0" height="75.0" rx="6" fill="#ffcccc" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Задача 1 (Важка)</tspan><tspan x="130.0" dy="13.0">Час: 30 секунд</tspan><tspan x="130.0" dy="13.0">[Виконується... ⚙️]</tspan></text>
<rect x="210.0" y="125.0" width="305.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="362.5" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Задачі 2..10 (Легкі, по 0.1 с кожна)</tspan><tspan x="362.5" dy="13.0">Заблоковані в локальному буфері Воркера 1!</tspan><tspan x="362.5" dy="13.0">Час очікування у черзі: &gt; 30 секунд</tspan></text>
<rect x="50.0" y="230.0" width="480.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Воркер 2 (Вільний):</text>
<rect x="210.0" y="245.0" width="305.0" height="48.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="362.5" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">ГОЛОДУВАННЯ (Starvation) 🛑</tspan><tspan x="362.5" dy="13.0">Простоює, бо всі задачі забрав Воркер 1</tspan></text>
<rect x="50.0" y="320.0" width="480.0" height="85.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Наслідок жадібного prefetch:</tspan><tspan x="290.0" dy="13.0">• Швидкі задачі чекають за спиною важкої.</tspan><tspan x="290.0" dy="13.0">• Неефективне використання CPU інших серверів.</tspan><tspan x="290.0" dy="13.0">• Загальний час обробки пакету: 31 секунда.</tspan></text>
<rect x="570.0" y="30.0" width="520.0" height="390.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="830.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Справедливий Prefetch (prefetch = 1)</text>
<rect x="590.0" y="85.0" width="480.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="700.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Воркер 1 (prefetch=1):</text>
<rect x="600.0" y="125.0" width="455.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="827.5" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="827.5" dy="0.0">Задача 1 (Важка, 30 с) — обробляється окремо</tspan></text>
<rect x="590.0" y="200.0" width="480.0" height="105.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="700.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Воркер 2 (prefetch=1):</text>
<rect x="600.0" y="240.0" width="455.0" height="52.0" rx="6" fill="#d1fae5" stroke="#27ae60" stroke-width="1.5"/><text x="827.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="827.5" dy="0.0">Послідовно забирає Задачі 2, 3, 4 ... 10 з черги брокера!</tspan><tspan x="827.5" dy="13.0">Усі 9 швидких задач виконано за 0.9 секунди!</tspan></text>
<rect x="590.0" y="320.0" width="480.0" height="85.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Результат справедливого розподілу:</tspan><tspan x="830.0" dy="13.0">• Жодна легка задача не заблокована важкою.</tspan><tspan x="830.0" dy="13.0">• 100% завантаження всіх доступних воркерів.</tspan><tspan x="830.0" dy="13.0">• Загальний час скорочено з 31 с до 30 с (легкі готові за 1 с).</tspan></text>
<rect x="30.0" y="430.0" width="1060.0" height="24.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/><text x="560.0" y="445.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Правило: для неоднорідних за часом задач встановлюйте prefetch=1 (QoS); більший prefetch доцільний лише для однорідних мікрозадач.</tspan></text>
</svg>