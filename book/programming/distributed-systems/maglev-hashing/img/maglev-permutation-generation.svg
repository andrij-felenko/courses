<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація псевдовипадкових перестановок комірок для кожного бекенда</text>
<rect x="20.0" y="50.0" width="1000.0" height="75.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="520.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математична основа: Розмір таблиці M = 7 (просте число), N = 3 бекенди</text>
<text x="520.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Формула кроку: offset[i] = hash1(name) mod M,   skip[i] = (hash2(name) mod (M - 1)) + 1   (НСД(skip, M) = 1)</text>
<rect x="20.0" y="140.0" width="315.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="37.0" y="148.5" width="280.0" height="39.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="177.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.0" dy="0.0">Бекенд B0 (srv-01)</tspan><tspan x="177.0" dy="13.0">offset = 3,  skip = 4</tspan></text>
<text x="177.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність кандидатів j = 0..6:</text>
<text x="177.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.0" dy="0.0">j=0: (3 + 0·4) mod 7 = 3</tspan><tspan x="177.0" dy="14.5">j=1: (3 + 1·4) mod 7 = 0</tspan><tspan x="177.0" dy="14.5">j=2: (3 + 2·4) mod 7 = 4</tspan><tspan x="177.0" dy="14.5">j=3: (3 + 3·4) mod 7 = 1</tspan><tspan x="177.0" dy="14.5">j=4: (3 + 4·4) mod 7 = 5</tspan><tspan x="177.0" dy="14.5">j=5: (3 + 5·4) mod 7 = 2</tspan><tspan x="177.0" dy="14.5">j=6: (3 + 6·4) mod 7 = 6</tspan></text>
<rect x="35.0" y="410.0" width="285.0" height="38.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="177.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Перестановка: [3, 0, 4, 1, 5, 2, 6]</text>
<rect x="362.0" y="140.0" width="315.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="380.0" y="148.5" width="280.0" height="39.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="520.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Бекенд B1 (srv-02)</tspan><tspan x="520.0" dy="13.0">offset = 0,  skip = 2</tspan></text>
<text x="520.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність кандидатів j = 0..6:</text>
<text x="520.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">j=0: (0 + 0·2) mod 7 = 0</tspan><tspan x="520.0" dy="14.5">j=1: (0 + 1·2) mod 7 = 2</tspan><tspan x="520.0" dy="14.5">j=2: (0 + 2·2) mod 7 = 4</tspan><tspan x="520.0" dy="14.5">j=3: (0 + 3·2) mod 7 = 6</tspan><tspan x="520.0" dy="14.5">j=4: (0 + 4·2) mod 7 = 1</tspan><tspan x="520.0" dy="14.5">j=5: (0 + 5·2) mod 7 = 3</tspan><tspan x="520.0" dy="14.5">j=6: (0 + 6·2) mod 7 = 5</tspan></text>
<rect x="377.0" y="410.0" width="285.0" height="38.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="520.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Перестановка: [0, 2, 4, 6, 1, 3, 5]</text>
<rect x="705.0" y="140.0" width="315.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="722.0" y="148.5" width="280.0" height="39.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="862.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="862.0" dy="0.0">Бекенд B2 (srv-03)</tspan><tspan x="862.0" dy="13.0">offset = 5,  skip = 3</tspan></text>
<text x="862.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність кандидатів j = 0..6:</text>
<text x="862.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="862.0" dy="0.0">j=0: (5 + 0·3) mod 7 = 5</tspan><tspan x="862.0" dy="14.5">j=1: (5 + 1·3) mod 7 = 1</tspan><tspan x="862.0" dy="14.5">j=2: (5 + 2·3) mod 7 = 4</tspan><tspan x="862.0" dy="14.5">j=3: (5 + 3·3) mod 7 = 0</tspan><tspan x="862.0" dy="14.5">j=4: (5 + 4·3) mod 7 = 3</tspan><tspan x="862.0" dy="14.5">j=5: (5 + 5·3) mod 7 = 6</tspan><tspan x="862.0" dy="14.5">j=6: (5 + 6·3) mod 7 = 2</tspan></text>
<rect x="720.0" y="410.0" width="285.0" height="38.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="862.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Перестановка: [5, 1, 4, 0, 3, 6, 2]</text>
</svg>