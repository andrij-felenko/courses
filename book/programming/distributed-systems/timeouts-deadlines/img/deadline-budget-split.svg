<rect x="148.7" y="144.0" width="96.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="196.7" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="196.7" dy="0.0">Локально</tspan><tspan x="196.7" dy="14.3">60 мс</tspan></text>
