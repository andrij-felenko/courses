<rect x="80.0" y="240.0" width="1000.0" height="200.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="100.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ПРАВИЛО ОБЧИСЛЕННЯ ТАЙМАУТУ ДЛЯ ПІДВИКЛИКУ (Subcall Budgeting):</text>
<text x="100.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">T_remain = T_deadline − T_now</text>
<text x="100.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">T_subcall = min( T_configured_limit, T_remain − T_safety_margin )</text>
<text x="100.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Якщо T_subcall &lt; T_min_network_rtt → ВІДМОВА ВІДРАЗУ (Fail Fast / Shed Load)</text>
<rect x="100.0" y="374.0" width="960.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Замість передачі статичного ліміту (напр., 400 мс) на кожен підвиклик, клієнт обмежує виклик ЗАЛИШКОМ бюджету.</tspan><tspan x="580.0" dy="15.6">Якщо після виклику 1 лишилося 350 мс, виклик 2 отримає таймаут min(400, 350 − 20) = 330 мс.</tspan></text>
<rect x="80.0" y="460.0" width="1000.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="493.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Головний висновок: дедлайн не додається до кожного виклику заново, а ТАНЕ в міру проходження конвеєра.</tspan><tspan x="580.0" dy="16.2">Кожен наступний сервіс у ланцюжку знає точний залишок часу, завдяки чому не починає безнадійну роботу,</tspan><tspan x="580.0" dy="16.2">якщо попередня ланка вже з'їла більшу частину доступного бюджету.</tspan></text>
</svg>