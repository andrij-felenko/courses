<rect x="40.0" y="524.0" width="1100.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Без жорстких таймаутів повільність одного компонента затягує в зависання всі вищі шари.</tspan><tspan x="590.0" dy="16.2">Потоки пулів блокуються на викликах, що мовчать, і сервіс втрачає здатність обслуговувати навіть ті гілки,</tspan><tspan x="590.0" dy="16.2">які не мають жодного стосунку до збійного вузла.</tspan></text>
