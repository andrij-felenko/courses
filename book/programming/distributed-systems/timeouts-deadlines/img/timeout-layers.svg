<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ШАРИ ТАЙМАУТІВ: де саме таймери контролюють ресурси на шляху запиту</tspan></text>
<rect x="50.0" y="80.0" width="280.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Connect Timeout</text>
<text x="190.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TCP SYN / SYN-ACK</text>
<line x1="340.0" y1="124.0" x2="380.0" y2="124.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390.0" y="80.0" width="740.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="112.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Обмежує час встановлення TCP-з'єднання з віддаленим хостом.</tspan><tspan x="760.0" dy="15.6">Захищає від зависання, коли вузол вимкнений з мережі або переповнено SYN backlog.</tspan><tspan x="760.0" dy="15.6">Типове значення: 200–1000 мс.</tspan></text>
<rect x="50.0" y="182.0" width="280.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Queue / Admission Timeout</text>
<text x="190.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Черга пулу обробників</text>
<line x1="340.0" y1="226.0" x2="380.0" y2="226.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390.0" y="182.0" width="740.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Час перебування запиту в черзі до того, як вільний потік візьме його в роботу.</tspan><tspan x="760.0" dy="15.6">Якщо час у черзі з'їв весь дедлайн — запит відкидають без виконання (load shedding).</tspan><tspan x="760.0" dy="15.6">Типове значення: 50–200 мс.</tspan></text>
<rect x="50.0" y="284.0" width="280.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">3. Socket / Idle Timeout</text>
<text x="190.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">SO_RCVTIMEO / TCP keepalive</text>
<line x1="340.0" y1="328.0" x2="380.0" y2="328.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390.0" y="284.0" width="740.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Максимальна пауза МІЖ сусідніми байтами в сокеті (не весь запит!).</tspan><tspan x="760.0" dy="15.6">Пастка: якщо надсилати по 1 байту кожні 4.9 с при таймауті 5 с — з'єднання висить годинами.</tspan><tspan x="760.0" dy="15.6">Типове значення: 2–5 с.</tspan></text>
<rect x="50.0" y="386.0" width="280.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">4. DB / Lock Timeout</text>
<text x="190.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">statement_timeout / lock_timeout</text>
<line x1="340.0" y1="430.0" x2="380.0" y2="430.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390.0" y="386.0" width="740.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Обмеження тривалості SQL-запиту та очікування блокування рядків у базі даних.</tspan><tspan x="760.0" dy="15.6">Запобігає утриманню 'мертвих' блокувань після того, як HTTP-клієнт уже відвалився.</tspan><tspan x="760.0" dy="15.6">Типове значення: 500–3000 мс.</tspan></text>
<rect x="50.0" y="488.0" width="280.0" height="88.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="190.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">5. End-to-End RPC Deadline</text>
<text x="190.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Контекст запиту / grpc-timeout</text>
<line x1="340.0" y1="532.0" x2="380.0" y2="532.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="390.0" y="488.0" width="740.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="520.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Абсолютний бюджет часу на всю бізнес-операцію від ініціатора до кінця.</tspan><tspan x="760.0" dy="15.6">Прокидається крізь усі мікросервіси та підсумовує витрати на всіх етапах.</tspan><tspan x="760.0" dy="15.6">Типове значення: 300–2000 мс.</tspan></text>
<rect x="50.0" y="592.0" width="1080.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="614.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Помилка в будь-якому з цих шарів перетворює систему на вразливу: брак одного таймауту зводить нанівець решту.</tspan></text>
</svg>