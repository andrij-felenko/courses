<text x="950.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">UPDATE</text>
<rect x="720.0" y="330.0" width="310.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="875.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Прямий запис у базу, кеш скидається (delete).</tspan><tspan x="875.0" dy="14.3">Не засмічує RAM даними без наступних читань.</tspan></text>
