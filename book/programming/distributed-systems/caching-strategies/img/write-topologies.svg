<rect x="880.0" y="210.0" width="120.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="228.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">База даних</tspan><tspan x="940.0" dy="14.3">(запис)</tspan></text>
