<rect x="810.0" y="80.0" width="330.0" height="75.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="975.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">1. Моніторинг та алертинг (Metrics &amp; Alerts)</tspan><tspan x="975.0" dy="14.3">• DLQ Depth &gt; 0 (тривога на кожне повідомлення)</tspan><tspan x="975.0" dy="14.3">• Age of Oldest Message (загроза вичерпання TTL)</tspan></text>
