<rect x="810.0" y="280.0" width="330.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="975.0" y="309.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">3. Повторне введення (Redrive / Replay Pipeline)</tspan><tspan x="975.0" dy="14.3">• Виправлення коду / патч схеми даних</tspan><tspan x="975.0" dy="14.3">• Контроль швидкості (Rate Limiter / Backpressure)</tspan><tspan x="975.0" dy="14.3">• Захист від зациклення (Loop Breaker)</tspan></text>
<rect x="810.0" y="395.0" width="330.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="975.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">4. Архів безнадійних повідомлень (Parking Lot)</tspan><tspan x="975.0" dy="14.3">• Довготривале сховище S3 / холодний лог</tspan><tspan x="975.0" dy="14.3">• Захист сховища брокера від переповнення</tspan></text>
