<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="560.0" height="470.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Point-to-Point черги (RabbitMQ / AWS SQS)</text>
<rect x="40.0" y="75.0" width="520.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="300.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основна черга з індивідуальними квитанціями</text>
<rect x="60.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="115.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M1 (OK)</text>
<rect x="185.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#ffe3e3" stroke="#c0392b" stroke-width="1.2"/>
<text x="240.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M2 (FAIL)</text>
<rect x="310.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="365.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M3 (OK)</text>
<rect x="435.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="490.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M4 (OK)</text>
<rect x="40.0" y="200.0" width="520.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Механізм ізоляції в класичних чергах:</tspan><tspan x="300.0" dy="13.0">• Брокер відстежує стан кожного повідомлення окремо</tspan><tspan x="300.0" dy="13.0">• Невдале повідомлення M2 вибірково вилучається з черги після N спроб</tspan><tspan x="300.0" dy="13.0">• Сусідні повідомлення M1, M3, M4 успішно підтверджуються (ACK)</tspan><tspan x="300.0" dy="13.0">• Повідомлення M2 атомарно маршрутизується в DLQ без порушення черги</tspan></text>
<rect x="40.0" y="325.0" width="520.0" height="145.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="300.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Окрема черга DLQ (Dead Letter Queue)</text>
<rect x="60.0" y="365.0" width="480.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Ізольоване повідомлення [M2] зберігає свій початковий стан.</tspan><tspan x="300.0" dy="13.0">Виправлення та повторна відправка (Redrive) відбуваються незалежно,</tspan><tspan x="300.0" dy="13.0">але можуть спричинити порушення первинного порядку виконання (Out-of-Order).</tspan></text>
<rect x="600.0" y="20.0" width="560.0" height="470.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="880.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Журнали з партиціями (Apache Kafka / Event Log)</text>
<rect x="620.0" y="75.0" width="520.0" height="110.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.3"/>
<text x="880.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незмінний лог партиції (Append-only Log Partition)</text>
<rect x="640.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#e8f6ee" stroke="#333333" stroke-width="1.2"/>
<text x="695.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Off: 40 ✓</text>
<rect x="765.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#ffe3e3" stroke="#333333" stroke-width="1.2"/>
<text x="820.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Off: 41 ⚡</text>
<rect x="890.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="945.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Off: 42 ⏳</text>
<rect x="1015.0" y="115.0" width="110.0" height="40.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="1070.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Off: 43 ⏳</text>
<rect x="620.0" y="200.0" width="520.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Фундаментальна дилема логів із партиціями:</tspan><tspan x="880.0" dy="13.0">• Лог незмінний: неможливо «видалити» або «перемістити» офсет 41</tspan><tspan x="880.0" dy="13.0">• Консюмер може просунути committed offset вперед лише послідовно</tspan><tspan x="880.0" dy="13.0">• Якщо офсет 41 не обробляється, консюмер зависає (зупинка партиції)</tspan><tspan x="880.0" dy="13.0">• Вирішення: клієнт публікує подію в topic-orders-dlq і комітить офсет 42</tspan></text>
<rect x="620.0" y="325.0" width="520.0" height="145.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="880.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Окремий топік: topic-orders-dlq</text>
<rect x="640.0" y="365.0" width="480.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="391.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Компроміс узгодженості (Ordering vs Availability):</tspan><tspan x="880.0" dy="13.0">• Офсет 41 перенесено в топік DLQ, консюмер пішов далі до 42, 43</tspan><tspan x="880.0" dy="13.0">• Якщо 41 — це CreateUser, а 42 — UpdateUser, виникає розрив стану!</tspan><tspan x="880.0" dy="13.0">• Повторне відтворення з DLQ вимагає ідемпотентності та версіонування.</tspan></text>
</svg>