<rect x="35.0" y="205.0" width="240.0" height="125.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="155.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Особливість:</tspan><tspan x="155.0" dy="14.3">Дії можуть бути скасовані</tspan><tspan x="155.0" dy="14.3">компенсаціями C1, C2.</tspan><tspan x="155.0" dy="14.3">Виконуються ДО точки</tspan><tspan x="155.0" dy="14.3">неповернення.</tspan></text>
<rect x="305.0" y="20.0" width="270.0" height="325.0" rx="8" fill="#fffdf0" stroke="#e6cf73" stroke-width="1.5"/><text x="440.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0"></tspan></text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9c7a00" text-anchor="middle" font-weight="700">2. Поворотна транзакція</text>
<text x="440.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c7a00" text-anchor="middle">(Pivot Transaction)</text>
<rect x="325.0" y="102.2" width="230.0" height="55.6" rx="6" fill="#ffffff" stroke="#9c7a00" stroke-width="1.5"/><text x="440.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Крок T3 (Точка неповернення)</tspan><tspan x="440.0" dy="14.3">• Авторизація фінального чека</tspan><tspan x="440.0" dy="14.3">• Підпис договору</tspan></text>
<rect x="320.0" y="205.0" width="240.0" height="125.0" rx="6" fill="#fcf8e3" stroke="#9c7a00" stroke-width="1.0"/><text x="440.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Особливість:</tspan><tspan x="440.0" dy="14.3">Якщо T3 вдалася — сага</tspan><tspan x="440.0" dy="14.3">гарантовано йде до кінця.</tspan><tspan x="440.0" dy="14.3">Якщо T3 зазнала невдачі —</tspan><tspan x="440.0" dy="14.3">запускається компенсація C2, C1.</tspan></text>
<rect x="590.0" y="20.0" width="270.0" height="325.0" rx="8" fill="#f4faf6" stroke="#a3d9b8" stroke-width="1.5"/><text x="725.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0"></tspan></text>
<text x="725.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Повторювані транзакції</text>
<text x="725.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(Retryable / Forward)</text>
<rect x="615.0" y="102.2" width="220.0" height="55.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Кроки T4, T5</tspan><tspan x="725.0" dy="14.3">• Друк квитанції</tspan><tspan x="725.0" dy="14.3">• Відправка сповіщення SMS</tspan></text>
<rect x="605.0" y="205.0" width="240.0" height="125.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.0"/><text x="725.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Особливість:</tspan><tspan x="725.0" dy="14.3">Виконуються ПІСЛЯ pivot.</tspan><tspan x="725.0" dy="14.3">Не можуть зазнати фатальної</tspan><tspan x="725.0" dy="14.3">бізнес-відмови: при збоях</tspan><tspan x="725.0" dy="14.3">повторюються до успіху.</tspan></text>
