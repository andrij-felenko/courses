<rect x="20.0" y="20.0" width="270.0" height="325.0" rx="8" fill="#fff8f7" stroke="#e0b4b0" stroke-width="1.5"/><text x="155.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0"></tspan></text>
<text x="155.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Компенсовні транзакції</text>
<text x="155.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(Compensable Steps)</text>
