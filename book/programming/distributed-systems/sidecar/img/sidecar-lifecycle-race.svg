<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Координація зупинки Pod: гонка сигналів SIGTERM та її усунення</text>
<rect x="40.0" y="55.0" width="435.0" height="440.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="257.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Дефект: Одночасний SIGTERM (Без координації)</text>
<line x1="80.0" y1="110.0" x2="80.0" y2="430.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="80.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t = 0</text>
<text x="80.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Час</text>
<rect x="125.0" y="116.0" width="290.0" height="28.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Kubelet надсилає SIGTERM усім контейнерам</tspan></text>
<rect x="125.0" y="179.5" width="290.0" height="41.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Sidecar (Envoy / Egress Proxy)</tspan><tspan x="270.0" dy="13.0">Миттєво закриває сокети та завершується</tspan></text>
<line x1="80.0" y1="200.0" x2="120.0" y2="200.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="125.0" y="259.5" width="290.0" height="41.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="270.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Main App (Триває плавний drain транзакцій)</tspan><tspan x="270.0" dy="13.0">Спроба відправити фінальний HTTP-запит</tspan></text>
<line x1="80.0" y1="280.0" x2="120.0" y2="280.0" stroke="#d97706" stroke-width="1.2"/>
<rect x="125.0" y="339.5" width="290.0" height="41.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ПОМИЛКА: Connection Refused на 127.0.0.1</tspan><tspan x="270.0" dy="13.0">Вихідні запити та логи втрачено!</tspan></text>
<line x1="270.0" y1="315.0" x2="270.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="115.0" y="434.5" width="310.0" height="41.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Результат: 502/503 помилки у клієнтів,</tspan><tspan x="270.0" dy="13.0">незбережені критичні транзакції.</tspan></text>
<rect x="525.0" y="55.0" width="435.0" height="440.0" rx="8" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/>
<text x="742.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Рішення: Впорядковане завершення (preStop / Native)</text>
<line x1="565.0" y1="110.0" x2="565.0" y2="430.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="565.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t = 0</text>
<text x="565.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Час</text>
<rect x="610.0" y="116.0" width="290.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Kubelet ініціює зупинку Pod</tspan></text>
<rect x="610.0" y="179.5" width="290.0" height="41.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="755.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Main App отримує SIGTERM:</tspan><tspan x="755.0" dy="13.0">Припиняє прийом нових і завершує in-flight</tspan></text>
<line x1="565.0" y1="200.0" x2="605.0" y2="200.0" stroke="#d97706" stroke-width="1.2"/>
<rect x="610.0" y="259.5" width="290.0" height="41.0" rx="6" fill="#d1fae5" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Sidecar утримує preStop hook / чекає drain:</tspan><tspan x="755.0" dy="13.0">Канал зв'язку та збір логів активні</tspan></text>
<line x1="565.0" y1="280.0" x2="605.0" y2="280.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="609.6" y="339.5" width="290.8" height="41.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Main App завершується (код 0)</tspan><tspan x="755.0" dy="13.0">Sidecar скидає фінальний буфер і зупиняється</tspan></text>
<line x1="755.0" y1="235.0" x2="755.0" y2="255.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755.0" y1="315.0" x2="755.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600.0" y="434.5" width="310.0" height="41.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Результат: Нуль втрачених запитів,</tspan><tspan x="755.0" dy="13.0">гарантована цілісність даних і логів.</tspan></text>
