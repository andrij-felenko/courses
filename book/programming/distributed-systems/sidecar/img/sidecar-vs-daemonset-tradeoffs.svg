<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні компроміси: Бібліотека (SDK) vs Sidecar vs DaemonSet</text>
<rect x="40.0" y="55.0" width="290.0" height="420.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="185.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">In-Process SDK (Бібліотека)</text>
<rect x="60.0" y="104.5" width="250.0" height="41.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Код всередині процесу</tspan><tspan x="185.0" dy="13.0">(Спільна пам'ять, нуль сокетів)</tspan></text>
<rect x="60.0" y="161.5" width="250.0" height="67.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Плюси:</tspan><tspan x="185.0" dy="13.0">+ Нульова затримка мережі</tspan><tspan x="185.0" dy="13.0">+ Відсутність витрат на IPC</tspan><tspan x="185.0" dy="13.0">+ Прямий доступ до пам'яті</tspan></text>
<rect x="60.0" y="265.0" width="250.0" height="80.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Мінуси:</tspan><tspan x="185.0" dy="13.0">- Поліглотний податок (N мов)</tspan><tspan x="185.0" dy="13.0">- Спільний blast radius падінь</tspan><tspan x="185.0" dy="13.0">- Оновлення вимагає редеплою</tspan><tspan x="185.0" dy="13.0">- Складність конфігурації</tspan></text>
<rect x="60.0" y="388.0" width="250.0" height="54.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Оптимально:</tspan><tspan x="185.0" dy="13.0">Ультранизька затримка (&lt;100мкс),</tspan><tspan x="185.0" dy="13.0">однорідний мономовний стек.</tspan></text>
<rect x="355.0" y="55.0" width="290.0" height="420.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="500.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Sidecar (На кожен Pod)</text>
<rect x="375.0" y="104.5" width="250.0" height="41.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Окремий процес у Pod</tspan><tspan x="500.0" dy="13.0">(Спільний netns / loopback)</tspan></text>
<rect x="375.0" y="155.0" width="250.0" height="80.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="172.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Плюси:</tspan><tspan x="500.0" dy="13.0">+ Повна мовна незалежність</tspan><tspan x="500.0" dy="13.0">+ Ізоляція cgroups (CPU/RAM)</tspan><tspan x="500.0" dy="13.0">+ Незалежний релізний цикл</tspan><tspan x="500.0" dy="13.0">+ Динамічний mTLS та інжекція</tspan></text>
<rect x="375.0" y="265.0" width="250.0" height="80.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Мінуси:</tspan><tspan x="500.0" dy="13.0">- Витрати пам'яті (RAM × N Pods)</tspan><tspan x="500.0" dy="13.0">- Затримка loopback (~1-2мс)</tspan><tspan x="500.0" dy="13.0">- Складність зупинки / запуску</tspan><tspan x="500.0" dy="13.0">- Вичерпання TIME_WAIT портів</tspan></text>
<rect x="375.0" y="388.0" width="250.0" height="54.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Оптимально:</tspan><tspan x="500.0" dy="13.0">Мікросервіси, Service Mesh,</tspan><tspan x="500.0" dy="13.0">ротація mTLS, збір телеметрії.</tspan></text>
<rect x="670.0" y="55.0" width="290.0" height="420.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="815.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">DaemonSet (Один на Ноду)</text>
<rect x="690.0" y="104.5" width="250.0" height="41.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="815.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Один агент на фізичний вузол</tspan><tspan x="815.0" dy="13.0">(Обслуговує всі Pods вузла)</tspan></text>
<rect x="690.0" y="155.0" width="250.0" height="80.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="172.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Плюси:</tspan><tspan x="815.0" dy="13.0">+ Мінімальний оверхед по RAM</tspan><tspan x="815.0" dy="13.0">+ Фіксована кількість процесів</tspan><tspan x="815.0" dy="13.0">+ Спільні ресурси на ноді</tspan><tspan x="815.0" dy="13.0">+ Простота оновлення агента</tspan></text>
<rect x="690.0" y="265.0" width="250.0" height="80.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Мінуси:</tspan><tspan x="815.0" dy="13.0">- Слабша ізоляція мультиаренди</tspan><tspan x="815.0" dy="13.0">- Немає унікального mTLS ключа</tspan><tspan x="815.0" dy="13.0">- Падіння вузла вражає всі Pods</tspan><tspan x="815.0" dy="13.0">- Складніший роутинг через Unix sock</tspan></text>
<rect x="690.0" y="388.0" width="250.0" height="54.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="815.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Оптимально:</tspan><tspan x="815.0" dy="13.0">Збір системних метрик (Node Exporter),</tspan><tspan x="815.0" dy="13.0">хостові логи, eBPF моніторинг.</tspan></text>
</svg>