<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологія стану агрегатора: розподілене шардування без блокувань проти спільного сховища</text>
<rect x="15.0" y="55.0" width="445.0" height="405.0" rx="8" fill="#f8f9fa" stroke="#c0392b" stroke-width="1.2"/>
<text x="237.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Централізований стан (Shared Store + Locks)</text>
<rect x="47.0" y="118.5" width="380.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">N незалежних воркерів-агрегаторів</tspan><tspan x="237.0" dy="13.0">Випадкове читання з черги без прив'язки</tspan></text>
<line x1="237.0" y1="175.0" x2="237.0" y2="215.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="237.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Блокування / CAS-конфлікти</text>
<rect x="47.0" y="235.6" width="380.0" height="78.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="237.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">Спільна база даних / Redis Cluster:</tspan><tspan x="237.0" dy="12.3">• SELECT ... FOR UPDATE (Рядкові блокування)</tspan><tspan x="237.0" dy="12.3">• Мережевий RTT: 1.5–4.0 мс на кожен запис</tspan><tspan x="237.0" dy="12.3">• Висока ймовірність Deadlocks при паралелізмі</tspan><tspan x="237.0" dy="12.3">• Стеля масштабування: пропускна здатність БД</tspan></text>
<rect x="47.0" y="374.1" width="380.0" height="41.9" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="237.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">Наслідки: Висока затримка (Tail Latency p99),</tspan><tspan x="237.0" dy="12.3">вузьке горло на спільних блокуваннях пам'яті</tspan></text>
<rect x="480.0" y="55.0" width="445.0" height="405.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.2"/>
<text x="702.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Шардування за ключем (Partitioned by CorrID)</text>
<rect x="512.0" y="118.5" width="380.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="702.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Брокер з партиціонуванням (Kafka / Rabbit Consistent Hash):</tspan><tspan x="702.0" dy="13.0">Ключ маршрутизації = hash(CorrelationID)</tspan></text>
<line x1="702.0" y1="175.0" x2="702.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="702.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Строга ізоляція: 1 Partition -&gt; 1 Thread</text>
<rect x="512.0" y="235.6" width="380.0" height="78.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">Локальний стан воркера (In-Memory + RocksDB WAL):</tspan><tspan x="702.0" dy="12.3">• Повна відсутність блокувань (Lock-Free Threading)</tspan><tspan x="702.0" dy="12.3">• Затримка обробки: &lt; 0.05 мс (O(1) Hash Map)</tspan><tspan x="702.0" dy="12.3">• Локальний WAL забезпечує надійність при краху</tspan><tspan x="702.0" dy="12.3">• Лінійне горизонтальне масштабування кластера</tspan></text>
<rect x="512.0" y="374.1" width="380.0" height="41.9" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="702.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Переваги: Максимальний TPS (100k+ msg/sec),</tspan><tspan x="702.0" dy="12.3">нульові блокування, передбачувана p99 затримка</tspan></text>
</svg>