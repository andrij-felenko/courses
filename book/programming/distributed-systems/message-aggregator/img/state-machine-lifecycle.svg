<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат агрегаційного кошика: переходи, тайм-аути та надгробки</text>
<rect x="19.8" y="89.0" width="280.4" height="82.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. COLLECTING (Збирання)</tspan><tspan x="160.0" dy="13.0">• Створення кошика за першим CorrID</tspan><tspan x="160.0" dy="13.0">• Старт таймерів дедлайну та бездіяльності</tspan><tspan x="160.0" dy="13.0">• Буферизація повідомлень у сховищі</tspan><tspan x="160.0" dy="13.0">• Фільтрація дублікатів (Idempotency)</tspan></text>
<line x1="280.0" y1="130.0" x2="410.0" y2="130.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="345.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Count == Total / FIN</text>
<rect x="396.7" y="89.0" width="286.6" height="82.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">2. COMPLETED (Завершено)</tspan><tspan x="540.0" dy="13.0">• Зупинка фонових таймерів</tspan><tspan x="540.0" dy="13.0">• Агрегація/редукція корисного навантаження</tspan><tspan x="540.0" dy="13.0">• Атомарна публікація CompositeMessage</tspan><tspan x="540.0" dy="13.0">• Створення запису надгробка (Tombstone)</tspan></text>
<line x1="160.0" y1="200.0" x2="160.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Сплив дедлайну
або Inactivity TTL</text>
<rect x="22.9" y="319.0" width="274.2" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">3. TIMED_OUT (Частковий збір)</tspan><tspan x="160.0" dy="13.0">• Оцінка політики: Drop vs Partial vs DLQ</tspan><tspan x="160.0" dy="13.0">• Відправка наявних елементів у DLQ</tspan><tspan x="160.0" dy="13.0">• Запуск компенсувальної саги (Rollback)</tspan><tspan x="160.0" dy="13.0">• Створення надгробка з прапорцем FAIL</tspan></text>
<line x1="540.0" y1="200.0" x2="540.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Встановлення TTL
надгробка</text>
<line x1="280.0" y1="360.0" x2="410.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="338.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ескалація збою</text>
<rect x="362.6" y="319.0" width="354.8" height="82.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="533.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">4. TOMBSTONE (Надгробок)</tspan><tspan x="533.0" dy="13.0">• Зберігає факт закриття CorrID</tspan><tspan x="533.0" dy="13.0">• Перехоплює запізнілі повідомлення (Stragglers)</tspan><tspan x="533.0" dy="13.0">• Спрямовує «хвости» у DLQ без створення нового кошика</tspan><tspan x="533.0" dy="13.0">• TTL надгробка: 2x–5x від максимального SLA</tspan></text>
<line x1="660.0" y1="360.0" x2="735.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">TTL сплив</text>
<rect x="760.0" y="320.6" width="150.0" height="78.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">5. PURGED</tspan><tspan x="835.0" dy="12.3">(Видалено)</tspan><tspan x="835.0" dy="12.3">• Звільнення RAM</tspan><tspan x="835.0" dy="12.3">• Очищення диска</tspan><tspan x="835.0" dy="12.3">• Запобігання витокам</tspan></text>
</svg>