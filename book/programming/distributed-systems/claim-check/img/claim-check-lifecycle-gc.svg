<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл стану Claim Check та стратегії прибирання сміття (Garbage Collection)</text>
<rect x="15.0" y="55.0" width="215.0" height="355.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="122.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Збереження стану</text>
<rect x="29.5" y="106.7" width="185.0" height="66.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="122.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">Генерація блоба</tspan><tspan x="122.0" dy="12.3">Розрахунок SHA-256</tspan><tspan x="122.0" dy="12.3">Створення ключа CAS:</tspan><tspan x="122.0" dy="12.3">sha256(payload)</tspan></text>
<rect x="29.5" y="205.6" width="185.0" height="78.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="122.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Синхронний PUT у S3</tspan><tspan x="122.0" dy="12.3">УВАГА:</tspan><tspan x="122.0" dy="12.3">публікувати квитанцію</tspan><tspan x="122.0" dy="12.3">до отримання HTTP 200</tspan><tspan x="122.0" dy="12.3">інакше гонка 404 Not Found!</tspan></text>
<rect x="29.5" y="322.9" width="185.0" height="54.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="122.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">Отримання ETag</tspan><tspan x="122.0" dy="12.3">Формування квитанції</tspan><tspan x="122.0" dy="12.3">з лімітом TTL</tspan></text>
<line x1="235.0" y1="205.0" x2="260.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="265.0" y="55.0" width="215.0" height="355.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="372.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Черга та читання</text>
<rect x="279.5" y="106.7" width="185.0" height="66.6" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="372.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="372.0" dy="0.0">Публікація в брокер</tspan><tspan x="372.0" dy="12.3">(Kafka / RabbitMQ)</tspan><tspan x="372.0" dy="12.3">Розмір: сотні байтів</tspan><tspan x="372.0" dy="12.3">Висока швидкість</tspan></text>
<rect x="279.5" y="211.7" width="185.0" height="66.6" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="372.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="372.0" dy="0.0">Вичитка споживачем</tspan><tspan x="372.0" dy="12.3">Перевірка фільтрів.</tspan><tspan x="372.0" dy="12.3">Якщо потрібно тіло:</tspan><tspan x="372.0" dy="12.3">GET s3://bucket/key</tspan></text>
<rect x="279.5" y="316.7" width="185.0" height="66.6" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="372.0" y="334.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.0" dy="0.0">Верифікація цілісності:</tspan><tspan x="372.0" dy="12.3">sha256(data) ==</tspan><tspan x="372.0" dy="12.3">claim.content_sha256</tspan><tspan x="372.0" dy="12.3">Ідемпотентна обробка</tspan></text>
<line x1="485.0" y1="205.0" x2="510.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="515.0" y="55.0" width="430.0" height="355.0" rx="6" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.4"/>
<text x="730.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Стратегії інвалідації та прибирання сміття (GC)</text>
<rect x="532.5" y="112.8" width="395.0" height="44.4" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">А. Політика життєвого циклу сховища (S3 Lifecycle TTL)</tspan><tspan x="730.0" dy="11.7">Бакет автоматично видаляє об'єкти через N днів (наприклад, 7 днів).</tspan><tspan x="730.0" dy="11.7">Найпростіша та найнадійніша схема: блоби-сироти видаляються автоматично.</tspan></text>
<rect x="532.5" y="196.9" width="395.0" height="56.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Б. Видалення споживачем (Explicit Consumer Cleanup)</tspan><tspan x="730.0" dy="11.7">Споживач надсилає DELETE у сховище після успішного збереження результату.</tspan><tspan x="730.0" dy="11.7">Небезпека: при багатьох підписниках (Pub/Sub) перший споживач</tspan><tspan x="730.0" dy="11.7">видалить дані, зламавши обробку для інших підписників!</tspan></text>
<rect x="532.5" y="301.9" width="395.0" height="56.1" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">В. Демон-асенізатор (Janitor / Tombstone Compaction)</tspan><tspan x="730.0" dy="11.7">Споживачі публікують подію завершення 'TaskCompleted' у службовий топік.</tspan><tspan x="730.0" dy="11.7">Окремий фоновий сервіс зіставляє підтвердження і видаляє блоб з S3,</tspan><tspan x="730.0" dy="11.7">коли всі зареєстровані споживачі відзвітували про успіх.</tspan></text>
</svg>