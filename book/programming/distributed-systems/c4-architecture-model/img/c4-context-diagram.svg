<line x1="530.0" y1="240.0" x2="625.0" y2="245.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="575.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запитує скоринг ризику</text><text x="575.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">[REST / HTTPS]</text>
<rect x="625.0" y="307.5" width="170.0" height="85.0" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/><text x="710.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлюз сповіщень</text><text x="710.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">[External System]</text><text x="710.0" y="361.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Доставляє SMS, Email</tspan><tspan x="710.0" dy="12.5">та Push-повідомлення</tspan></text>
<line x1="530.0" y1="270.0" x2="625.0" y2="340.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="575.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надсилає квитанції</text><text x="575.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">[gRPC / TLS]</text>
<text x="420.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа системи (System Boundary): усередині — наш продукт, ззовні — клієнти та сторонні партнери.</text>
