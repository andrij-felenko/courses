<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 1 (Context): Платіжна платформа у бізнес-оточенні</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Окреслює систему як чорну скриньку, користувачів і суміжні зовнішні системи</text>
<rect x="310.0" y="185.0" width="220.0" height="110.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.8"/><text x="420.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Платіжна платформа</text><text x="420.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">[Software System]</text><text x="420.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обробляє платежі, керує</tspan><tspan x="420.0" dy="12.5">гаманцями та транзакціями</tspan></text>
<circle cx="120.0" cy="100.5" r="13.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><rect x="45.0" y="116.5" width="150.0" height="75.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="120.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покупець</text><text x="120.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">[Person]</text><text x="120.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Здійснює онлайн-покупки</tspan><tspan x="120.0" dy="12.5">та переказує кошти</tspan></text>
<line x1="195.0" y1="165.0" x2="310.0" y2="220.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="245.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оплачує замовлення</text><text x="245.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">[HTTPS]</text>
<circle cx="120.0" cy="280.5" r="13.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><rect x="45.0" y="296.5" width="150.0" height="75.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="120.0" y="316.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мерчант / Торговець</text><text x="120.0" y="332.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">[Person]</text><text x="120.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Переглядає звіти,</tspan><tspan x="120.0" dy="12.5">керує виплатами</tspan></text>
<line x1="195.0" y1="325.0" x2="310.0" y2="265.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="245.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Отримує аналітику та звіти</text><text x="245.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">[HTTPS]</text>
<rect x="625.0" y="97.5" width="170.0" height="85.0" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/><text x="710.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Банківський еквайринг</text><text x="710.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">[External System]</text><text x="710.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Проводить кліринг карток</tspan><tspan x="710.0" dy="12.5">Visa / Mastercard</tspan></text>
<line x1="530.0" y1="210.0" x2="625.0" y2="150.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="575.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Створює транзакції</text><text x="568.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">[ISO 8583 / TLS]</text>
