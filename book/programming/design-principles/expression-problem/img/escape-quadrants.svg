<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири виходи з вилки — і хибний вихід</text>
<text x="500.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">осі: чи дешево додати ОПЕРАЦІЮ (праворуч) і чи дешево додати ТИП (вгору)</text>
<rect x="150.0" y="100.0" width="708.0" height="370.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<line x1="504.0" y1="100.0" x2="504.0" y2="470.0" stroke="#d0d5db" stroke-width="1.1" stroke-dasharray="5,5"/>
<line x1="150.0" y1="285.0" x2="858.0" y2="285.0" stroke="#d0d5db" stroke-width="1.1" stroke-dasharray="5,5"/>
<rect x="234.9" y="160.4" width="184.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="327.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="327.0" dy="0.0">ООП · Абстрактна фабрика</tspan><tspan x="327.0" dy="15.6">рядки — даром,</tspan><tspan x="327.0" dy="15.6">стовпці — за плату</tspan></text>
<rect x="555.7" y="160.4" width="250.6" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="681.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="681.0" dy="0.0">Мультиметоди · Класи типів</tspan><tspan x="681.0" dy="15.6">Tagless-final · Object algebras</tspan><tspan x="681.0" dy="15.6">обидві осі — відкрито</tspan></text>
<rect x="262.3" y="353.2" width="129.4" height="47.6" rx="6" fill="#ffffff" stroke="#d0d5db" stroke-width="1.3"/><text x="327.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="327.0" dy="0.0">(обидві дорого —</tspan><tspan x="327.0" dy="15.6">свідомо не тут)</tspan></text>
<rect x="588.9" y="345.4" width="184.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="681.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">ФП · взірці · Відвідувач</tspan><tspan x="681.0" dy="15.6">стовпці — даром,</tspan><tspan x="681.0" dy="15.6">рядки — за плату</tspan></text>
<line x1="430.0" y1="225.0" x2="575.0" y2="352.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="575.0" y1="352.0" x2="430.0" y2="225.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="300.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">Відвідувач — поворот, не вихід</text>
<text x="300.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">операцію: ДОРОГО</text>
<text x="700.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">операцію: ДЕШЕВО</text>
<text x="504.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ додати операцію (стовпець)</text>
<text x="78.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">тип:</tspan><tspan x="78.0" dy="15.0">ДЕШЕВО</tspan></text>
<text x="78.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">тип:</tspan><tspan x="78.0" dy="15.0">ДОРОГО</tspan></text>
<text x="500.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ООП-ріг (класи) і ФП-ріг стоять навпроти по діагоналі; Відвідувач лише возить між ними.</text>
<text x="500.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Правий-верхній кут — справжній вихід: додати і тип, і операцію, не чіпаючи старого.</text>
</svg>