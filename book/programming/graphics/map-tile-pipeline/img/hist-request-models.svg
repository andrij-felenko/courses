<line x1="255.0" y1="222.0" x2="255.0" y2="238.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="244.0" width="370.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="255.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">одна GIF на все вікно, адреса неповторна</tspan></text>
<text x="255.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="255.0" dy="0.0">крок на один піксель коштує стільки ж,</tspan><tspan x="255.0" dy="15.6">скільки стрибок через океан;</tspan><tspan x="255.0" dy="15.6">кеш не має за що вхопитися, бо другого</tspan><tspan x="255.0" dy="15.6">такого самого запиту вже не буде</tspan></text>
<text x="845.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">слизька карта (з 2005)</text>
