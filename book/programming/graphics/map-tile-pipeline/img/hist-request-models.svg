<text x="811.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зелені вже в кеші · червоні щойно з'явилися з краю</text>
<text x="845.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="845.0" dy="0.0">адреса z/x/y стала й повторювана, тому те саме</tspan><tspan x="845.0" dy="15.6">сховище обслуговує різних людей і різні сеанси:</tspan><tspan x="845.0" dy="15.6">працюють кеш браузера, проксі й CDN</tspan></text>
