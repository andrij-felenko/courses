<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що саме зламав 2005 рік</text>
<text x="255.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">картинка на замовлення (1993–2004)</text>
<rect x="70.0" y="96.0" width="370.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="255.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">запит: центр, масштаб, розмір вікна</tspan></text>
<line x1="255.0" y1="148.0" x2="255.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
