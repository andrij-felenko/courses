<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро кешу й планувальника: хто чим володіє</text>
<rect x="40.0" y="84.0" width="300.0" height="480.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="190.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">потік малювання</text>
<rect x="54.0" y="104.0" width="272.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">скласти потребу кадру,</tspan><tspan x="190.0" dy="16.9">підняти покоління g</tspan></text>
<rect x="54.0" y="216.0" width="272.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">пошук у кеші:</tspan><tspan x="190.0" dy="16.9">влучання — малюємо,</tspan><tspan x="190.0" dy="16.9">промах — замовляємо</tspan></text>
<rect x="54.0" y="328.0" width="272.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="363.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">request(id, vp):</tspan><tspan x="190.0" dy="16.9">відсіяти те, що вже</tspan><tspan x="190.0" dy="16.9">в польоті або в купі</tspan></text>
<rect x="54.0" y="440.0" width="272.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">кінець кадру: злити ready,</tspan><tspan x="190.0" dy="16.9">вставити в кеш, trim,</tspan><tspan x="190.0" dy="16.9">квота завантажень текстур</tspan></text>
<rect x="420.0" y="84.0" width="300.0" height="480.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="570.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільне під коротким замком</text>
<rect x="434.0" y="104.0" width="272.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="570.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">pending — адреси,</tspan><tspan x="570.0" dy="16.9">що чекають у купі</tspan></text>
<rect x="434.0" y="216.0" width="272.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="570.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">купа запитів, ключ</tspan><tspan x="570.0" dy="16.9">(−g, |Δz|, d²);</tspan><tspan x="570.0" dy="16.9">живе одне покоління</tspan></text>
<rect x="434.0" y="328.0" width="272.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="570.0" y="363.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">inFlight — адреса → політ:</tspan><tspan x="570.0" dy="16.9">прапорець аборту,</tspan><tspan x="570.0" dy="16.9">лічильник байтів</tspan></text>
<rect x="434.0" y="440.0" width="272.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="570.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">ready — розпаковані растри;</tspan><tspan x="570.0" dy="16.9">замок лише на обмін</tspan><tspan x="570.0" dy="16.9">двома векторами</tspan></text>
<rect x="800.0" y="84.0" width="300.0" height="480.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="950.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">фонові потоки</text>
<rect x="814.0" y="104.0" width="272.0" height="96.0" rx="6" fill="#eef7ee" stroke="#333333" stroke-width="1.4"/><text x="950.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">take(): зняти найкращий,</tspan><tspan x="950.0" dy="16.9">зайняти з'єднання</tspan></text>
<rect x="814.0" y="216.0" width="272.0" height="96.0" rx="6" fill="#eef7ee" stroke="#333333" stroke-width="1.4"/><text x="950.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">байти: спершу диск,</tspan><tspan x="950.0" dy="16.9">потім мережа</tspan></text>
<rect x="814.0" y="328.0" width="272.0" height="96.0" rx="6" fill="#eef7ee" stroke="#333333" stroke-width="1.4"/><text x="950.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">розпакувати в растр</tspan></text>
<rect x="814.0" y="440.0" width="272.0" height="96.0" rx="6" fill="#eef7ee" stroke="#333333" stroke-width="1.4"/><text x="950.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">publish() у ready;</tspan><tspan x="950.0" dy="16.9">FlightGuard стирає запис</tspan><tspan x="950.0" dy="16.9">у будь-якому разі</tspan></text>
<text x="380.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">потреба</text>
<line x1="344.0" y1="196.0" x2="416.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">готове</text>
<line x1="416.0" y1="468.0" x2="344.0" y2="468.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">робота</text>
<line x1="724.0" y1="196.0" x2="796.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">растр</text>
<line x1="796.0" y1="468.0" x2="724.0" y2="468.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="570.0" dy="0.0">кеш розпакованих тайлів належить ЛИШЕ потокові малювання — фонові його не бачать;</tspan><tspan x="570.0" dy="16.9">спільні тільки чотири структури посередині, і жоден замок не тримають довше за перестановку покажчиків</tspan></text>
</svg>