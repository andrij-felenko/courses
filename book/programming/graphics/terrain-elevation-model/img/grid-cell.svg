<text x="780.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="780.0" dy="0.0">крок сітки 30 м, нахил схилу 40 %:</tspan><tspan x="780.0" dy="15.6">цих шести метрів у даних немає взагалі</tspan></text>
<text x="520.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">чотири ваги невід'ємні й дають одиницю — тому суміш ніколи не виходить за межі кутових висот</text>
