<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий екран, той самий граф — різне число запитів</text>
<text x="580.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">100 замовлень, лише 3 різні покупці; під лічильником запитів до бази</text>
<text x="350.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">стратегія</text>
<text x="845.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">запитів</text>
<text x="350.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="350.0" dy="0.0">Ліниво в циклі</tspan><tspan x="350.0" dy="15.0">(без спільної мапи)</tspan></text>
<rect x="380.0" y="135.0" width="376.0" height="34.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="845.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#c0392b" text-anchor="end" font-weight="700">101</text>
<text x="1120.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">1 список + по 1 на кожне зі 100</text>
<text x="350.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="350.0" dy="0.0">Ліниво + мапа тотожності</tspan></text>
<rect x="380.0" y="213.0" width="145.1" height="34.0" rx="6" fill="#d98c0a" stroke="#d98c0a" stroke-width="1.0"/>
<text x="845.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#d98c0a" text-anchor="end" font-weight="700">4</text>
<text x="1120.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">100 дотиків склеєні у 3 покупці</text>
<text x="350.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="350.0" dy="0.0">Пакетний IN-запит наперед</tspan></text>
<rect x="380.0" y="291.0" width="95.6" height="34.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="845.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#2457d6" text-anchor="end" font-weight="700">2</text>
<text x="1120.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">усі потрібні id — одним запитом</text>
<text x="350.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="350.0" dy="0.0">Жадібне з'єднання (JOIN)</tspan></text>
<rect x="380.0" y="369.0" width="46.0" height="34.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="845.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#27ae60" text-anchor="end" font-weight="700">1</text>
<text x="1120.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">покупці приїхали разом із замовленнями</text>
<text x="580.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">101 → 4 → 2 → 1: лінь сама по собі не рятує — рятує знання свого сценарію</text>
</svg>