<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама форма — дві різні роботи</text>
<text x="660.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тримач значення нічого не знає про те, де живе значення — у слоті моделі чи в рядку бази</text>
<line x1="660.0" y1="92.0" x2="660.0" y2="452.0" stroke="#d0d5db" stroke-width="1.0" stroke-dasharray="7,7"/>
<text x="330.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Звідки родом: світ вікон (MVC)</text>
<text x="990.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Куди перекотився: світ даних (ORM)</text>
<line x1="330.0" y1="191.0" x2="330.0" y2="275.2" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="330.0" y1="323.8" x2="330.0" y2="408.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="227.5" y="159.0" width="205.0" height="32.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.6"/><text x="330.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Подання (віджет)</tspan></text>
<rect x="227.5" y="276.2" width="205.0" height="47.6" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.9"/><text x="330.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">ValueHolder</tspan><tspan x="330.0" dy="15.6">value / value:</tspan></text>
<rect x="227.5" y="409.0" width="205.0" height="32.0" rx="6" fill="#eef7f0" stroke="#2457d6" stroke-width="1.6"/><text x="330.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">слот у моделі</tspan></text>
<line x1="990.0" y1="191.0" x2="990.0" y2="275.2" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="990.0" y1="323.8" x2="990.0" y2="408.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="887.5" y="159.0" width="205.0" height="32.0" rx="6" fill="#eef2f7" stroke="#c0392b" stroke-width="1.6"/><text x="990.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Order (у пам'яті)</tspan></text>
<rect x="887.5" y="276.2" width="205.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="990.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">ValueHolder</tspan><tspan x="990.0" dy="15.6">getValue()</tspan></text>
<rect x="887.5" y="409.0" width="205.0" height="32.0" rx="6" fill="#eef7f0" stroke="#c0392b" stroke-width="1.6"/><text x="990.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">рядок у базі</tspan></text>
<text x="330.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Робота: з'єднати віджет зі слотом моделі</tspan><tspan x="330.0" dy="14.3">й сповістити про зміну (onChangeSend:).</tspan></text>
<text x="990.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Робота: відкласти похід у базу — getValue()</tspan><tspan x="990.0" dy="14.3">робить SELECT аж на перший доступ.</tspan></text>
<text x="660.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна форма — посилання на значення плюс спосіб дістати; різна робота — сповіщати проти відкладати.</text>
</svg>