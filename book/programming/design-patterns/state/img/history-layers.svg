<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари, на яких виросла машина станів</text>
<line x1="848.0" y1="434.0" x2="848.0" y2="74.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="854.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">час</text>
<text x="842.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">1943</text>
<line x1="845.0" y1="410.0" x2="851.0" y2="410.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="842.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">1955</text>
<line x1="845.0" y1="306.0" x2="851.0" y2="306.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="842.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">1987</text>
<line x1="845.0" y1="156.0" x2="851.0" y2="156.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="842.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">1994</text>
<line x1="845.0" y1="100.0" x2="851.0" y2="100.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="60.0" y="356.0" width="744.0" height="78.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="432.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="432.0" dy="0.0">НЕРВОВІ МЕРЕЖІ  →  ПОНЯТТЯ АВТОМАТА</tspan><tspan x="432.0" dy="16.2">Мак-Каллок і Піттс 1943 · Кліні 1956 (регулярні події)</tspan><tspan x="432.0" dy="16.2">система живе скінченним набором станів</tspan></text>
<rect x="60.0" y="256.0" width="744.0" height="78.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="432.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="432.0" dy="0.0">БЕЛЛ ЛАБС  →  ДВІ ІМЕННІ ФОРМИ</tspan><tspan x="432.0" dy="16.2">Мілі 1955: вихід = f(стан, вхід) · Мур 1956: вихід = g(стан)</tspan><tspan x="432.0" dy="16.2">формальний синтез послідовнісних схем</tspan></text>
<rect x="60.0" y="156.0" width="744.0" height="78.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="432.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="432.0" dy="0.0">СТАТЕЧАРТИ  →  ПРИБОРКАНА СКЛАДНІСТЬ</tspan><tspan x="432.0" dy="16.2">Гарел 1987: ієрархія (глибина) + ортогональність</tspan><tspan x="432.0" dy="16.2">великий автомат перестає вибухати</tspan></text>
<rect x="237.0" y="78.0" width="390.0" height="52.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="432.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="432.0" dy="0.0">ПАТЕРН СТАН — Банда чотирьох, 1994</tspan><tspan x="432.0" dy="15.6">кожен стан стає ОБ'ЄКТОМ (приклад: TCPConnection)</tspan></text>
