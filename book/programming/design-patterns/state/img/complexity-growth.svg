<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SWITCH ЗА СТАНОМ</text>
<text x="215.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один текст на всі стани й події</text>
<rect x="40.0" y="116.0" width="350.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">новий стан → зайти в КОЖЕН із E методів</tspan><tspan x="215.0" dy="15.6">і дописати гілку; забудеш одну — тихий баг</tspan></text>
