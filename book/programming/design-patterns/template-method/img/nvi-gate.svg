<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">NVI: ворота й дірка</text>
<text x="590.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">публічний невіртуальний каркас охоплює приватну віртуальну дірку — і перевірки навколо неї</text>
<rect x="80.0" y="100.0" width="600.0" height="600.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="2.6"/>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">std::string render(fields) const</text>
<text x="380.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">публічний · НЕвіртуальний — не перевизначити, не переставити</text>
<rect x="140.0" y="188.8" width="480.0" height="32.5" rx="6" fill="#f3ecfb" stroke="#8b5cc7" stroke-width="1.5"/><text x="380.0" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">① передумова: fields не порожні</tspan></text>
<rect x="140.0" y="280.8" width="480.0" height="32.5" rx="6" fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.5"/><text x="380.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">② header() — спільний крок</tspan></text>
<rect x="140.0" y="364.6" width="480.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.2"/><text x="380.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">③ renderBody(fields)   ← дірка</tspan><tspan x="380.0" dy="16.2">приватна ВІРТУАЛЬНА · заповнює нащадок</tspan></text>
<rect x="140.0" y="464.8" width="480.0" height="32.5" rx="6" fill="#f3ecfb" stroke="#8b5cc7" stroke-width="1.5"/><text x="380.0" y="485.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">④ післяумова + інваріант результату</tspan></text>
<rect x="140.0" y="556.8" width="480.0" height="32.5" rx="6" fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.5"/><text x="380.0" y="577.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">⑤ footer() — спільний крок</tspan></text>
<text x="380.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порядок кроків зафіксовано у воротах — згори вниз</text>
<text x="960.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">нащадки</text>
<rect x="855.0" y="326.2" width="210.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="960.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">JsonReport</tspan><tspan x="960.0" dy="15.6">renderBody → {…}</tspan></text>
<line x1="847.0" y1="350.0" x2="630.0" y2="389.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="855.0" y="406.2" width="210.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="960.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">TextReport</tspan><tspan x="960.0" dy="15.6">renderBody → k: v</tspan></text>
<line x1="847.0" y1="430.0" x2="630.0" y2="389.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="735.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">лише у дірку</text>
<line x1="60.0" y1="712.0" x2="1120.0" y2="712.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="590.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">нащадок дістає тільки дірку; каркас і перевірки виконуються неминуче</text>
</svg>