<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто кого кличе</text>
<text x="550.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у каркасі керування перевернуте: не ти кличеш його — він кличе тебе</text>
<line x1="550.0" y1="96.0" x2="550.0" y2="436.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="4,6"/>
<text x="286.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Бібліотека</text>
<rect x="151.0" y="163.6" width="270.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/><text x="286.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="286.0" dy="0.0">твій код</tspan><tspan x="286.0" dy="16.2">керує потоком</tspan></text>
<rect x="151.0" y="313.6" width="270.0" height="48.8" rx="6" fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.9"/><text x="286.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="286.0" dy="0.0">sort(), parse(), …</tspan><tspan x="286.0" dy="16.2">бібліотека — служить</tspan></text>
<line x1="286.0" y1="212.4" x2="286.0" y2="313.6" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="435.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ти кличеш ↓</text>
<text x="286.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ти вгорі — ти в керуванні</text>
<text x="814.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Каркас (шаблонний метод)</text>
<rect x="679.0" y="163.6" width="270.0" height="48.8" rx="6" fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.9"/><text x="814.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="814.0" dy="0.0">каркас: importFile()</tspan><tspan x="814.0" dy="16.2">керує потоком</tspan></text>
<rect x="679.0" y="313.6" width="270.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.9"/><text x="814.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="814.0" dy="0.0">твій крок: parse()</tspan><tspan x="814.0" dy="16.2">служить — заповнена дірка</tspan></text>
<line x1="814.0" y1="212.4" x2="814.0" y2="313.6" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="963.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">каркас кличе ↓</text>
<text x="814.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">твій код унизу — тебе кличуть</text>
<line x1="60.0" y1="456.0" x2="1040.0" y2="456.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="550.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«не телефонуй нам — ми зателефонуємо тобі»: керування переходить від твого коду до каркаса</text>
</svg>