<rect x="283.0" y="644.0" width="770.0" height="56.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.9"/>
<text x="298.0" y="667.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">ET++ (Цюрих): Вайнанд · Гамма · Марті — каркас у C++</text>
<text x="298.0" y="688.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Джонсон і Фут називають явище: «інверсія керування»</text>
