<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 892" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="892" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід шаблонного методу</text>
<text x="540.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спершу механізм і практика — патерн уже працює в каркасах; лише потім слова, а тоді й імʼя</text>
