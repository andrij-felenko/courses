<circle cx="250.0" cy="672.0" r="11.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.6"/>
<text x="220.0" y="677.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">1988</text>
<rect x="283.0" y="774.0" width="770.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.9"/>
<text x="298.0" y="797.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«Банда чотирьох» називає атом: Шаблонний метод</text>
