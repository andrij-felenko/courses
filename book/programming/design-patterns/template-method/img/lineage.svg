<circle cx="250.0" cy="802.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="220.0" y="807.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="end" font-weight="700">1994</text>
<line x1="60.0" y1="834.0" x2="1020.0" y2="834.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="540.0" y="862.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">патерн працював у каркасах ще до того, як дістав імʼя: механізм → практика → «інверсія керування» → «Шаблонний метод»</text>
