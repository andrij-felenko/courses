<text x="298.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«Не телефонуй нам — ми зателефонуємо тобі»</text>
<text x="298.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Річард Світ (Mesa / Tajo, Xerox PARC) — «закон Голлівуда»</text>
