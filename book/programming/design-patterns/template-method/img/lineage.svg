<text x="298.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Бібліотека підпрограм (EDSAC)</text>
<text x="298.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Вілкс · Вілер · Ґілл: повторно вживаний код, який кличеш ТИ</text>
