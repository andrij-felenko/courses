<text x="298.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Simula 67 — віртуальні процедури + спадкування</text>
<text x="298.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Даль і Нюгор дають механізм: предок «провалюється» в крок нащадка</text>
