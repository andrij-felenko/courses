<rect x="522.0" y="236.6" width="300.0" height="66.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="672.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">ОДНА ІДЕЯ:</tspan><tspan x="672.0" dy="16.9">спосіб дії — окрема річ,</tspan><tspan x="672.0" dy="16.9">яку носять і підставляють</tspan></text>
