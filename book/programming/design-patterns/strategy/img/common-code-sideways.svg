<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільне — вбік як інструмент, не вгору як предок</text>
<text x="520.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стратегії рівні; помічник кличуть за потреби</text>
<rect x="120.4" y="116.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="270.4" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.4" dy="0.0">FlatRate</tspan><tspan x="270.4" dy="15.6">50 + вага·10</tspan></text>
<rect x="120.4" y="216.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="270.4" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.4" dy="0.0">ZonalRate</tspan><tspan x="270.4" dy="15.6">40 + зона·25</tspan></text>
<rect x="120.4" y="316.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="270.4" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.4" dy="0.0">FreeOverThreshold</tspan><tspan x="270.4" dy="15.6">поріг; 60 + вага·8</tspan></text>
<rect x="120.4" y="416.2" width="300.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="270.4" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.4" dy="0.0">CourierRate</tspan><tspan x="270.4" dy="15.6">80 + віддаль·1.5</tspan></text>
<text x="270.4" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усі на одному рівні —</text>
<text x="270.4" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жодна не предок жодній</text>
<rect x="619.6" y="215.6" width="300.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="769.6" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="769.6" dy="0.0">weightFee(база, вага, ставка)</tspan><tspan x="769.6" dy="16.2">= база + вага · ставка</tspan></text>
<text x="769.6" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">помічник ВБІК</text>
<line x1="424.4" y1="140.0" x2="615.6" y2="140.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="424.4" y1="340.0" x2="615.6" y2="340.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">кличуть</text>
<text x="520.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не кличуть — своя формула</text>
<line x1="40.0" y1="482.0" x2="1000.0" y2="482.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="520.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓  вбік як інструмент — пропонує послугу</text>
<text x="520.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">✗  вгору як предок — нав'язав би форму (тому відкинуте)</text>
</svg>