<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кістяк стратегії</text>
<text x="520.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">контекст делегує через інтерфейс, не знаючи реалізації</text>
<rect x="63.0" y="169.4" width="290.0" height="81.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="208.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="208.0" dy="0.0">Order  (контекст)</tspan><tspan x="208.0" dy="16.2">policy: DiscountPolicy</tspan><tspan x="208.0" dy="16.2">finalPrice():</tspan><tspan x="208.0" dy="16.2">  total − policy.discount(this)</tspan></text>
<text x="208.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тримає ОДНЕ поле-стратегію</text>
<text x="208.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">і делегує йому роботу</text>
<rect x="504.8" y="125.6" width="280.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="644.8" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="644.8" dy="0.0">«interface» DiscountPolicy</tspan><tspan x="644.8" dy="16.2">discount(order): number</tspan></text>
<line x1="353.0" y1="187.4" x2="504.8" y2="150.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,5"/>
