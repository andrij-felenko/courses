<rect x="504.8" y="276.2" width="280.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="644.8" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="644.8" dy="0.0">NoDiscount</tspan><tspan x="644.8" dy="15.6">return 0</tspan></text>
<line x1="504.8" y1="300.0" x2="474.8" y2="300.0" stroke="#27ae60" stroke-width="1.3"/>
