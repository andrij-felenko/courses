<text x="520.0" y="554.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">setPolicy(інша) → контекст поводиться інакше, його код НЕ змінюється</text>
</svg>