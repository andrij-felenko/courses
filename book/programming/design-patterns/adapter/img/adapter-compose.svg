<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Композиція двох вірних адаптерів: A→B→C дає вірний A→C</text>
<text x="190.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">F_in: вниз</text>
<text x="810.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">F_out: вгору</text>
<rect x="260.0" y="103.5" width="480.0" height="33.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">A — Target (що бачить клієнт)</tspan></text>
<rect x="260.0" y="283.5" width="480.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="500.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">B — проміжний інтерфейс</tspan></text>
<rect x="260.0" y="463.5" width="480.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="500.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">C — Adaptee (справжній виконавець)</tspan></text>
<line x1="300.0" y1="138.5" x2="300.0" y2="281.5" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="300.0" y1="318.5" x2="300.0" y2="461.5" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="245.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">f_in¹</text>
<text x="245.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">f_in²</text>
<line x1="700.0" y1="461.5" x2="700.0" y2="318.5" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="700.0" y1="281.5" x2="700.0" y2="138.5" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="755.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">f_out²</text>
<text x="755.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">f_out¹</text>
<rect x="140.0" y="545.0" width="720.0" height="44.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.3"/><text x="500.0" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Підставляємо ⟦B⟧ = f_out² ∘ ⟦C⟧ ∘ f_in² у ⟦A⟧ = f_out¹ ∘ ⟦B⟧ ∘ f_in¹:</tspan><tspan x="500.0" dy="15.6">⟦A⟧ = (f_out¹ ∘ f_out²) ∘ ⟦C⟧ ∘ (f_in² ∘ f_in¹).   Вихідний бік — зворотним порядком.</tspan></text>
</svg>