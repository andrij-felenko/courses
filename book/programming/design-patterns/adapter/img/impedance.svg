<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неузгодження імпедансів: чому взагалі потрібен перехідник</text>
<line x1="600.0" y1="92.0" x2="600.0" y2="430.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="310.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Неузгоджено</text>
<rect x="115.0" y="225.1" width="150.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="190.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Джерело</tspan><tspan x="190.0" dy="16.9">Z = 8 Ω</tspan></text>
<rect x="382.5" y="225.1" width="175.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="470.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Навантаження</tspan><tspan x="470.0" dy="16.9">Z = 75 Ω</tspan></text>
<line x1="330.0" y1="216.0" x2="330.0" y2="284.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,4"/>
<line x1="269.0" y1="236.0" x2="378.5" y2="236.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="372.5" y1="268.0" x2="269.0" y2="268.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="330.0" width="470.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="305.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Опір стрибає 8 → 75 Ω. Частина хвилі відбивається назад (червона стрілка)</tspan><tspan x="305.0" dy="13.0">— ця потужність не доходить до навантаження, губиться на межі.</tspan></text>
<text x="890.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Узгоджено</text>
<rect x="635.0" y="225.1" width="130.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="700.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Джерело</tspan><tspan x="700.0" dy="16.9">8 Ω</tspan></text>
<rect x="815.0" y="225.1" width="150.0" height="49.9" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.9"/><text x="890.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Узгоджувач</tspan><tspan x="890.0" dy="16.9">(перехідник)</tspan></text>
<rect x="1005.0" y="225.1" width="150.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="1080.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">Навантаження</tspan><tspan x="1080.0" dy="16.9">75 Ω</tspan></text>
<line x1="769.0" y1="250.0" x2="811.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="969.0" y1="250.0" x2="1001.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="330.0" width="470.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="875.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Проміжна ланка згладжує стрибок опору. Хвиля проходить уся,</tspan><tspan x="875.0" dy="15.6">без відбивання — уся потужність доходить до навантаження.</tspan></text>
<rect x="120.0" y="462.0" width="960.0" height="66.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="600.0" y="491.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">У коді — те саме: світ об'єктів і світ реляційних таблиць мають різний «опір».</tspan><tspan x="600.0" dy="16.2">Адаптер (чи ORM) — це узгоджувач між ними, щоб дані пройшли без втрат на «відбивання».</tspan></text>
</svg>