<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адаптер має два боки — і перекладає між ними</text>
<rect x="25.0" y="216.6" width="250.0" height="66.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="150.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Клієнтський код</tspan><tspan x="150.0" dy="16.9">вміє лише:</tspan><tspan x="150.0" dy="16.9">charge(гривні, валюта)</tspan></text>
<text x="150.0" y="202.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ЦІЛЬ (що очікує наш код)</text>
<rect x="885.0" y="216.6" width="250.0" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1010.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">StripeClient (чужий)</tspan><tspan x="1010.0" dy="16.9">вміє лише:</tspan><tspan x="1010.0" dy="16.9">createCharge(центи)</tspan></text>
<text x="1010.0" y="202.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">АДАПТОВАНИЙ (чужий об'єкт)</text>
<rect x="420.0" y="150.0" width="320.0" height="250.0" rx="10" fill="#fff8f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="580.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">StripeAdapter</text>
<text x="580.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">роз'єм зверху = форма charge</text>
<text x="580.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">роз'єм знизу = форма createCharge</text>
<rect x="442.0" y="227.0" width="276.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="580.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">гривні × 100 → центи</tspan></text>
<rect x="442.0" y="261.0" width="276.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="580.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">валюта → малі літери</tspan></text>
<rect x="442.0" y="295.0" width="276.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="580.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">з відповіді взяти лише id</tspan></text>
<line x1="275.0" y1="220.0" x2="416.0" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="744.0" y1="360.0" x2="885.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сам адаптер нічого не обчислює по суті — лише пристосовує форму виклику</text>
</svg>