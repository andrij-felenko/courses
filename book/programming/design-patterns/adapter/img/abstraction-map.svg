<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Функція абстракції Гоара: α піднімає справні представлення в семантику Target</text>
<rect x="140.0" y="125.0" width="380.0" height="49.9" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Простір Target — T</tspan><tspan x="330.0" dy="16.9">значення, які обіцяє контракт</tspan></text>
<rect x="140.0" y="375.1" width="380.0" height="49.9" rx="6" fill="#eef7f1" stroke="#27ae60" stroke-width="1.6"/><text x="330.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Інваріант I ⊆ A</tspan><tspan x="330.0" dy="16.9">справні стани Adaptee</tspan></text>
<line x1="250.0" y1="373.1" x2="250.0" y2="176.9" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="234.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">α = f_out</text>
<text x="234.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(абстракція)</text>
<line x1="410.0" y1="176.9" x2="410.0" y2="373.1" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="426.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">f_in</text>
<text x="426.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(вибір представлення)</text>
<rect x="640.0" y="348.0" width="350.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="815.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">A ∖ I — стани поза інваріантом</tspan><tspan x="815.0" dy="16.2">α не визначена — саме тут адаптер тече</tspan></text>
<rect x="140.0" y="492.0" width="760.0" height="46.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.3"/><text x="520.0" y="511.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Пара (f_in, α): f_in обирає представлення в I, α читає з нього значення Target.</tspan><tspan x="520.0" dy="15.6">За межами I пари немає — і жодне f_out не відновить того, чого f_in не дав.</tspan></text>
</svg>