<text x="196.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
<circle cx="238.0" cy="150.0" r="15.0" fill="#f4f4f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="238.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
<circle cx="280.0" cy="150.0" r="15.0" fill="#f4f4f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="280.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
<circle cx="322.0" cy="150.0" r="15.0" fill="#f4f4f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="322.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
<text x="205.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">входить у стек 1 раз, виходить 1 раз</text>
<text x="205.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(1× push  +  1× pop на вузол)</text>
<rect x="55.0" y="262.0" width="300.0" height="60.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">усього за обхід:</tspan><tspan x="205.0" dy="18.2">2n операцій  =  O(n)</tspan></text>
<text x="735.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вартість одного next()</text>
<rect x="542.0" y="274.0" width="24.0" height="26.0" rx="3" fill="#f4f4f5" stroke="#b9c2cc" stroke-width="1.5"/>
