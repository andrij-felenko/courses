<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складність: O(n) на обхід, O(1) амортизовано на крок, O(h) пам'яті</text>
<text x="205.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен вузол — рівно двічі</text>
