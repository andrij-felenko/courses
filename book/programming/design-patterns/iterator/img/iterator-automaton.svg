<text x="905.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start"><tspan x="905.0" dy="0.0">◀ фінальний</tspan><tspan x="905.0" dy="17.2">hasNext() = false</tspan></text>
