<text x="540.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">стан q — «що лишилось обійти», обернена на дані (defunctionalization);   δ(q) = (елемент, наступний q)</tspan><tspan x="540.0" dy="24.1">hasNext() = «q не фінальний»;    next() = застосувати перехід δ</tspan><tspan x="540.0" dy="24.1">список:  q — суфікс [3,1,4] → [1,4] → [4] → []        дерево (in-order):  q — стек напівпройдених вузлів</tspan></text>
