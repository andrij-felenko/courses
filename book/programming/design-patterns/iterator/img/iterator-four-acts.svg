<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обхід, винайдений чотири рази</text>
<line x1="605.0" y1="56.0" x2="1095.0" y2="56.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="605.0" y1="56.0" x2="605.0" y2="64.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="1095.0" y1="56.0" x2="1095.0" y2="64.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="850.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1994 — той самий рік, дві події</text>
<line x1="60.0" y1="106.0" x2="1100.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="175.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">≈1974</text>
<circle cx="175.0" cy="106.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="60.0" y="126.0" width="230.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="175.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Курсор бази даних</tspan><tspan x="175.0" dy="16.9">SEQUEL · System R</tspan></text>
<rect x="60.0" y="214.0" width="230.0" height="56.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">МЕХАНІЗМ</tspan><tspan x="175.0" dy="16.2">рантайм-курсор</tspan></text>
<text x="175.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">Бере записи по одному,</tspan><tspan x="175.0" dy="16.2">ховає «де я в наборі»</tspan></text>
<text x="445.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1974–75</text>
<circle cx="445.0" cy="106.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="330.0" y="126.0" width="230.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="445.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Ітератори CLU</tspan><tspan x="445.0" dy="16.9">Б. Лісков · MIT</tspan></text>
<rect x="330.0" y="214.0" width="230.0" height="56.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">МОВНА КОНСТРУКЦІЯ</tspan><tspan x="445.0" dy="16.2">yield · корутина</tspan></text>
<text x="445.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="445.0" dy="0.0">Обхід пишеш звичайно —</tspan><tspan x="445.0" dy="16.2">мова морозить стан</tspan></text>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1994</text>
<circle cx="715.0" cy="106.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="600.0" y="126.0" width="230.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="715.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">GoF «Ітератор / Курсор»</tspan><tspan x="715.0" dy="16.9">банда чотирьох</tspan></text>
<rect x="600.0" y="214.0" width="230.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="715.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">КАНОН</tspan><tspan x="715.0" dy="16.2">патерн дістав ім'я</tspan></text>
<text x="715.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">Зібрали, назвали,</tspan><tspan x="715.0" dy="16.2">поклали в каталог</tspan></text>
<text x="985.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1994</text>
<circle cx="985.0" cy="106.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="870.0" y="126.0" width="230.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="985.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="985.0" dy="0.0">C++ STL</tspan><tspan x="985.0" dy="16.9">Степанов · HP</tspan></text>
<rect x="870.0" y="214.0" width="230.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="985.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="985.0" dy="0.0">БІБЛІОТЕКА</tspan><tspan x="985.0" dy="16.2">категорії ітераторів</tspan></text>
<text x="985.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="985.0" dy="0.0">Клей між контейнером</tspan><tspan x="985.0" dy="16.2">і алгоритмом</tspan></text>
<rect x="60.0" y="360.0" width="1040.0" height="66.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="580.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама думка на чотирьох висотах:</text>
<text x="580.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">ідея (курсор) → мовна конструкція (CLU) → канон (GoF) → бібліотека (STL)</text>
</svg>