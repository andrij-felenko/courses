<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві версії локатора під однією назвою</text>
<text x="600.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий реєстр «ключ → служба» — а вигоди й шкода зовсім різні</text>
<line x1="600.0" y1="76.0" x2="600.0" y2="500.0" stroke="#d0d5db" stroke-width="1.1" stroke-dasharray="4,6"/>
<text x="318.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СТАТИЧНИЙ ГЛОБАЛЬНИЙ ЛОКАТОР</text>
<rect x="193.0" y="139.8" width="250.0" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="318.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="318.0" dy="0.0">глобальний  Locator</tspan></text>
<rect x="193.0" y="275.6" width="250.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="318.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="318.0" dy="0.0">OrderService</tspan><tspan x="318.0" dy="16.2">ctor() — порожній</tspan></text>
<line x1="292.0" y1="271.6" x2="292.0" y2="176.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="344.0" y1="176.2" x2="344.0" y2="271.6" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="282.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">смикає get()</text>
<text x="354.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">служба</text>
<text x="318.0" y="358.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ невидима в сигнатурі</text>
<text x="318.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">✗ тест готує спільний глобал</text>
<text x="318.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">✗ збій виринає в рантаймі</text>
<text x="882.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">УПРОВАДЖЕНИЙ РЕЄСТР</text>
<rect x="757.0" y="139.8" width="250.0" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="882.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.0" dy="0.0">хто складає (корінь)</tspan></text>
<rect x="757.0" y="275.6" width="250.0" height="48.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.9"/><text x="882.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.0" dy="0.0">OrderService</tspan><tspan x="882.0" dy="16.2">ctor(ServiceRegistry)</tspan></text>
<line x1="882.0" y1="176.2" x2="882.0" y2="271.6" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="978.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">подає ззовні</text>
<text x="882.0" y="358.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ реєстр видно в сигнатурі</text>
<text x="882.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">✓ тест подає власний екземпляр</text>
<text x="882.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">✓ спільного сховища нема</text>
<line x1="40.0" y1="520.0" x2="1160.0" y2="520.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="600.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Антипатерном локатор роблять не «ключ → служба», а глобальна статична досяжність</text>
<text x="600.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">прибери глобальність — і найгостріші жала витягнуто</text>
</svg>