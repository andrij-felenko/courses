<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як «фасад» став іменованим патерном</text>
<line x1="70.0" y1="150.0" x2="870.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="868.0" y1="150.0" x2="890.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="150.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1977</text>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Александер</text>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«A Pattern Language»</text>
<text x="150.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">— патерн у зодчестві</text>
<circle cx="360.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="360.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1990</text>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">OOPSLA, BOF</text>
<text x="360.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гамма й Гелм</text>
<text x="360.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знаходять одне одного</text>
<circle cx="545.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="545.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1991</text>
<text x="545.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">дисертація</text>
<text x="545.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">каталог патернів</text>
<text x="545.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з ET++ (Гамма)</text>
<circle cx="770.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<text x="770.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1994</text>
<text x="770.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Design Patterns»</text>
<text x="770.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">банда чотирьох:</text>
<text x="770.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">фасад канонізовано</text>
<rect x="267.9" y="324.4" width="404.2" height="71.2" rx="10" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="470.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Намір (GoF): дати уніфікований інтерфейс до набору</tspan><tspan x="470.0" dy="15.6">інтерфейсів підсистеми; фасад визначає інтерфейс вищого</tspan><tspan x="470.0" dy="15.6">рівня, що робить підсистему простішою у використанні.</tspan></text>
