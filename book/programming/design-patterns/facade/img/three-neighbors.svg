<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схожі на вигляд, різні за задачею</text>
<rect x="40.0" y="58.0" width="250.0" height="44.0" rx="10" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.5"/>
<text x="165.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ФАСАД</text>
<text x="165.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">СПРОСТИТИ</text>
<text x="165.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">багато частин → одні прості двері;</text>
<text x="165.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">порядок і зв'язки сховано</text>
<rect x="40.0" y="208.0" width="250.0" height="60.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="165.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">структурний · однобічно:</tspan><tspan x="165.0" dy="15.0">клієнт → підсистема</tspan></text>
<rect x="330.0" y="58.0" width="250.0" height="44.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.5"/>
<text x="455.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">АДАПТЕР</text>
<text x="455.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">ПЕРЕКЛАСТИ</text>
<text x="455.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чужий інтерфейс → наш очікуваний;</text>
<text x="455.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">зазвичай одна обгортка</text>
<rect x="330.0" y="208.0" width="250.0" height="60.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="455.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="455.0" dy="0.0">структурний · переклад,</tspan><tspan x="455.0" dy="15.0">а не спрощення</tspan></text>
<rect x="620.0" y="58.0" width="250.0" height="44.0" rx="10" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.5"/>
<text x="745.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ПОСЕРЕДНИК</text>
<text x="745.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">РОЗВ'ЯЗАТИ</text>
<text x="745.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">частини не кличуть одна одну</text>
<text x="745.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">напряму — усе через центр</text>
<rect x="620.0" y="208.0" width="250.0" height="60.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="745.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">поведінковий · двобічно:</tspan><tspan x="745.0" dy="15.0">частини ⇄ центр</tspan></text>
<text x="450.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">усі троє стоять МІЖ клієнтом і рештою — але з різною метою</text>
<text x="450.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">фасад спрощує · адаптер перекладає · посередник розв'язує зв'язки</text>
</svg>