<text x="295.2" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Wᵢ — час утримання</text>
<rect x="172.0" y="71.6" width="300.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="322.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.0" dy="0.0">рахуємо ВВИСЬ (по вертикалях):</tspan><tspan x="322.0" dy="16.2">∫ N(t) dt = L · T</tspan></text>
<rect x="642.0" y="71.6" width="320.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="802.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="802.0" dy="0.0">рахуємо ВШИР (по смугах):</tspan><tspan x="802.0" dy="16.2">Σ Wᵢ = сума часів утримання</tspan></text>
<rect x="282.2" y="565.2" width="555.7" height="33.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="560.0" y="586.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">та сама площа:  Σ Wᵢ = L · T,  а Σ Wᵢ = (λT) · W   ⟹   L = λ · W</tspan></text>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одну площу рахуємо двома способами — і випадає L = λW</text>
