<text x="540.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прапорець persisted вирішує, чим стане save() — INSERT чи UPDATE.</text>
