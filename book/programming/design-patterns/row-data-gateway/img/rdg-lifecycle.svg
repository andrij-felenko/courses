<text x="840.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="840.0" dy="0.0">OrderFinder._load(row)</tspan><tspan x="840.0" dy="15.0">рядок приходить ІЗ бази</tspan></text>
