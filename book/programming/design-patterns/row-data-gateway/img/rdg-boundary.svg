<text x="519.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="519.0" dy="0.0">+ правила В той</tspan><tspan x="519.0" dy="15.0">самий об'єкт</tspan></text>
