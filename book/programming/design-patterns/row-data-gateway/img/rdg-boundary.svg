<text x="519.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="519.0" dy="0.0">лиши чистим,</tspan><tspan x="519.0" dy="15.0">правила зверху</tspan></text>
