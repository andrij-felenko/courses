<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що шар декоратора робить навколо делегації</text>
<text x="590.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перед викликом · після · замість — інтерфейс незмінний</text>
<rect x="120.0" y="150.0" width="360.0" height="300.0" rx="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="300.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">шар-декоратор</text>
<rect x="212.0" y="268.0" width="176.0" height="120.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="300.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">компонент</text>
<text x="300.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">справжня робота</text>
<text x="300.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · ДО делегації</text>
<text x="300.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · ПІСЛЯ делегації</text>
<line x1="300.0" y1="116.0" x2="300.0" y2="150.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="300.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виклик</text>
<line x1="300.0" y1="450.0" x2="300.0" y2="486.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="300.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">результат</text>
<line x1="168.0" y1="250.0" x2="168.0" y2="268.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="432.0" y1="388.0" x2="432.0" y2="406.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="560.0" y="148.0" width="500.0" height="60.0" rx="8" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="582.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">ДО</text>
<text x="582.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">перевірити вхід, залогувати, старт таймера</text>
<rect x="560.0" y="224.0" width="500.0" height="60.0" rx="8" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="582.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">ПІСЛЯ</text>
<text x="582.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">змінити чи перевірити результат, стоп таймера</text>
<rect x="560.0" y="300.0" width="500.0" height="60.0" rx="8" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.5"/>
<text x="582.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">НАВКОЛО</text>
<text x="582.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">змінити аргументи на вході І відповідь на виході</text>
<rect x="560.0" y="376.0" width="500.0" height="60.0" rx="8" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.5"/>
<text x="582.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ЗАМІСТЬ (short-circuit)</text>
<text x="582.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">не делегувати: кеш-влучення, відмова доступу</text>
<text x="810.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">усі чотири лишають інтерфейс незмінним</text>
</svg>