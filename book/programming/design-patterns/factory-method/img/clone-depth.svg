<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="590.0" y1="92.0" x2="590.0" y2="428.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="296.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Поверхневе клонування (shallow)</text>
<text x="296.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">копіюємо об'єкт — вкладене лишається СПІЛЬНИМ</text>
<rect x="121.0" y="137.3" width="150.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="196.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="196.0" dy="0.0">Command — взірець</tspan><tspan x="196.0" dy="14.3">params ▾</tspan></text>
<rect x="317.0" y="137.3" width="157.9" height="45.3" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="396.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="396.0" dy="0.0">клон = взірець.clone()</tspan><tspan x="396.0" dy="14.3">params ▾</tspan></text>
<rect x="191.0" y="277.4" width="210.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="296.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="296.0" dy="0.0">ОДИН список params</tspan><tspan x="296.0" dy="14.3">[ id, name, … ]</tspan></text>
<line x1="196.0" y1="184.0" x2="270.0" y2="296.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="396.0" y1="184.0" x2="322.0" y2="296.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="296.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">змінив params у клоні — воно змінилось і у взірця</text>
<text x="296.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стан ТЕЧЕ між копіями — прихована помилка</text>
<text x="884.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Глибоке клонування (deep)</text>
<text x="884.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рекурсивно копіюємо й вкладене — копії незалежні</text>
<rect x="709.0" y="137.3" width="150.0" height="45.3" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="784.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="784.0" dy="0.0">Command — взірець</tspan><tspan x="784.0" dy="14.3">params ▾</tspan></text>
<rect x="905.0" y="137.3" width="157.9" height="45.3" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="984.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="984.0" dy="0.0">клон = взірець.clone()</tspan><tspan x="984.0" dy="14.3">params ▾</tspan></text>
<rect x="695.0" y="277.4" width="178.0" height="45.3" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="784.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="784.0" dy="0.0">params взірця</tspan><tspan x="784.0" dy="14.3">[ id, name ]</tspan></text>
<rect x="895.0" y="277.4" width="178.0" height="45.3" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="984.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="984.0" dy="0.0">params клона — СВІЙ</tspan><tspan x="984.0" dy="14.3">[ id, name ]</tspan></text>
<line x1="784.0" y1="184.0" x2="784.0" y2="296.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="984.0" y1="184.0" x2="984.0" y2="296.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="884.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">клон має ВЛАСНИЙ список — об'єкти незалежні</text>
<text x="884.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">але глибока копія дорога, а сокет/файл не копіюються</text>
<line x1="60.0" y1="438.0" x2="1120.0" y2="438.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="590.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прототип працює лише коли clone() копіює на ПОТРІБНУ глибину:</text>
<text x="590.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">продукт-значення (SQL + параметри) клонується;  продукт із живим ресурсом (сокет) — ні.</text>
<text x="590.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тому взірець годиться для Command;  Connection частіше лишають класу на родину.</text>
</svg>