<line x1="915.0" y1="382.5" x2="915.0" y2="420.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="785.0" y="420.2" width="260.0" height="47.6" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.7"/><text x="915.0" y="440.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">HttpRequest — цілий,</tspan><tspan x="915.0" dy="15.6">перевірений, незмінний</tspan></text>
<text x="915.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">проміжного об'єкта нема чого брати</text>
