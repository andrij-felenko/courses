<text x="305.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сетери: об'єкт існує з першого кроку</text>
<rect x="155.0" y="93.8" width="300.0" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="305.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">new MutableHttpRequest()</tspan></text>
<text x="305.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">HttpRequest є — але БИТИЙ</text>
