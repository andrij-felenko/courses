<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напівзібраний стан: де його можна взяти</text>
