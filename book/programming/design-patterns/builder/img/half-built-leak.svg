<text x="1125.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не запит</text>
<line x1="915.0" y1="210.2" x2="915.0" y2="259.8" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="805.0" y="261.8" width="220.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">.timeout(…)</tspan></text>
<text x="1125.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">це Builder,</text>
<text x="1125.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не запит</text>
