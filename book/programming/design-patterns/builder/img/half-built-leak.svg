<rect x="805.0" y="177.8" width="220.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="198.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">.body(…)</tspan></text>
