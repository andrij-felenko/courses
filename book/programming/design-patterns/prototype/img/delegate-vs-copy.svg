<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="560.0" y1="92.0" x2="560.0" y2="448.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="280.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Делегування — зв'язок ЖИВИЙ</text>
<rect x="175.0" y="151.2" width="210.0" height="33.5" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="280.0" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">прототип</tspan></text>
<rect x="175.0" y="339.2" width="210.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="280.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">нащадок</tspan></text>
<line x1="280.0" y1="339.2" x2="280.0" y2="188.8" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<text x="401.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">не знайшов у себе —</text>
<text x="401.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">дивиться сюди НАЖИВО</text>
<text x="280.0" y="412.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміниш прототип —</text>
<text x="280.0" y="432.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміняться ВСІ нащадки</text>
<text x="840.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Копіювання — зв'язок ОБІРВАНО</text>
<rect x="735.0" y="151.2" width="210.0" height="33.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="840.0" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">зразок</tspan></text>
<rect x="735.0" y="339.2" width="210.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="840.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">клон</tspan></text>
<line x1="840.0" y1="188.8" x2="840.0" y2="339.2" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7,5"/>
<line x1="827.0" y1="271.0" x2="839.0" y2="253.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="841.0" y1="271.0" x2="853.0" y2="253.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="961.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">після copy</text>
<text x="961.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">зв'язку НЕМА</text>
<text x="840.0" y="412.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміниш зразок —</text>
<text x="840.0" y="432.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">клон не помітить</text>
<line x1="70.0" y1="480.0" x2="1050.0" y2="480.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="560.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий «прототип» — дві протилежні машинерії.</text>
</svg>