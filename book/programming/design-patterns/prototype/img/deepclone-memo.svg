<rect x="486.0" y="286.0" width="228.0" height="52.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.4"/><text x="600.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">squad  →  squad′</tspan></text>
<text x="600.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">запис ДО рекурсії</text>
<line x1="360.0" y1="190.0" x2="462.0" y2="194.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
