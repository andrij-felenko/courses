<rect x="935.0" y="355.5" width="150.0" height="33.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="1010.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">squad′</tspan></text>
<line x1="982.0" y1="206.5" x2="982.0" y2="355.5" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="966.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">.squad</text>
