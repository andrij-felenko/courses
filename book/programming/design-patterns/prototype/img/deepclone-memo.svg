<text x="600.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">memo</text>
<text x="600.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">оригінал  →  копія</text>
<line x1="482.0" y1="210.0" x2="718.0" y2="210.0" stroke="#d0d5db" stroke-width="1.0"/>
