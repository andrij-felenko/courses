<line x1="60.0" y1="488.0" x2="1140.0" y2="488.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="600.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">deepClone(вузол): якщо memo вже має вузол — вернути готову копію; інакше memo.set(вузол, копія) ПЕРЕД заходом у поля.</text>
<text x="600.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Реєстрація до рекурсії розриває цикл (обхід не піде вдруге) і зберігає спільну тотожність (два поля на один об'єкт → одна копія).</text>
