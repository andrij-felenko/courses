<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схожі як обгортки — різні за наміром</text>
<line x1="210.0" y1="92.0" x2="335.0" y2="92.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="485.0" y1="92.0" x2="610.0" y2="92.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="73.0" width="120.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="96.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">клієнт</tspan></text>
<rect x="335.0" y="65.0" width="150.0" height="53.9" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/><text x="410.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">обгортка</tspan><tspan x="410.0" dy="16.9">(тримає ціль)</tspan></text>
<rect x="610.0" y="73.0" width="120.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="96.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">ціль</tspan></text>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спільний кістяк: об'єкт тримає інший і передає виклик далі</text>
<rect x="70.0" y="178.0" width="680.0" height="62.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="92.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Адаптер</text>
<line x1="260.0" y1="190.0" x2="260.0" y2="228.0" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="282.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">міняє ФОРМУ інтерфейсу: чужий → наш</text>
<rect x="70.0" y="252.0" width="680.0" height="62.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="92.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Декоратор</text>
<line x1="260.0" y1="264.0" x2="260.0" y2="302.0" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="282.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">інтерфейс той самий — ДОДАЄ поведінку</text>
<rect x="70.0" y="326.0" width="680.0" height="62.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="92.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Проксі</text>
<line x1="260.0" y1="338.0" x2="260.0" y2="376.0" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="282.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">інтерфейс той самий — КЕРУЄ доступом</text>
<rect x="70.0" y="400.0" width="680.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="92.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Міст</text>
<line x1="260.0" y1="412.0" x2="260.0" y2="450.0" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="282.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">не фіксує жоден — дає двом ієрархіям мінятись нарізно</text>
</svg>