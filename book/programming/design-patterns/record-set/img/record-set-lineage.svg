<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 808" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="808" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід набору рядків: що кожен крок дописав до форми</text>
<line x1="300.0" y1="99.0" x2="300.0" y2="743.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="96.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">1980</tspan><tspan x="153.0" dy="16.2">dBASE II · формат DBF</tspan></text>
<circle cx="300.0" cy="133.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="96.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="767.0" y="129.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: файлова база на одному робочому місці: сервера немає, відривати нема від чого</tspan><tspan x="767.0" dy="15.6">додалося: у заголовку файлу — опис полів: ім'я, тип, довжина. Таблиця описує себе сама</tspan></text>
<rect x="40.0" y="192.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">1991—1995</tspan><tspan x="153.0" dy="16.2">DataWindow · VB3 · Delphi 1</tspan></text>
<circle cx="300.0" cy="229.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="192.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="767.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: сітку на екрані не напишеш під кожну таблицю — вона мусить спитати дані про колонки</tspan><tspan x="767.0" dy="15.6">додалося: схема живе в самому результаті; рух по рядках в обидва боки, а не лише вперед</tspan></text>
<rect x="40.0" y="288.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">1996—1998</tspan><tspan x="153.0" dy="16.2">ADC/RDS · ADO Recordset</tspan></text>
<circle cx="300.0" cy="325.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="288.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="767.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: багатоланковий застосунок і браузер: у клієнта з'єднання немає взагалі</tspan><tspan x="767.0" dy="15.6">додалося: від'єднаність як РЕЖИМ курсора: CursorLocation = adUseClient, потім ActiveConnection = Nothing</tspan></text>
<rect x="40.0" y="384.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="417.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">1998</tspan><tspan x="153.0" dy="16.2">пакетні правки в ADO</tspan></text>
<circle cx="300.0" cy="421.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="384.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="767.0" y="417.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: набір відірвано — негайний UPDATE слати нікуди, а рядок тим часом могли змінити</tspan><tspan x="767.0" dy="15.6">додалося: стан рядка (незмінений / змінений / доданий / вилучений) і початкові значення полів</tspan></text>
<rect x="40.0" y="480.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="513.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">1997—2004</tspan><tspan x="153.0" dy="16.2">JDBC ResultSet → CachedRowSet</tspan></text>
<circle cx="300.0" cy="517.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="480.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="767.0" y="513.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: та сама біда в Java, але перша відповідь інша — збагатити курсор, а не відривати його</tspan><tspan x="767.0" dy="15.6">додалося: прокрутка й правка в курсорі (1998); від'єднаний RowSet — окремим інтерфейсом, реалізації аж 2004</tspan></text>
<rect x="40.0" y="576.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="609.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">2002</tspan><tspan x="153.0" dy="16.2">ADO.NET DataSet</tspan></text>
<circle cx="300.0" cy="613.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="576.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="767.0" y="609.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: режим вимагав питати про об'єкт «а ти ще тримаєш з'єднання?» під час виконання</tspan><tspan x="767.0" dy="15.6">додалося: від'єднаність стала ТИПОМ: кілька таблиць, зв'язки між ними, запис себе в XML</tspan></text>
<rect x="40.0" y="672.0" width="226.0" height="74.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="153.0" y="705.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">2002</tspan><tspan x="153.0" dy="16.2">каталог PoEAA</tspan></text>
<circle cx="300.0" cy="709.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="334.0" y="672.0" width="866.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="767.0" y="705.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.0" dy="0.0">змусило: у чотирьох платформ — чотири назви для однієї речі</tspan><tspan x="767.0" dy="15.6">додалося: спільне ім'я: набір рядків — подання табличних даних у пам'яті</tspan></text>
</svg>