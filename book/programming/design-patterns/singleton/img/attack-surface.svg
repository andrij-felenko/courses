<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять дверей до другого екземпляра — і що кожні замикає</text>
<line x1="234.4" y1="158.6" x2="373.5" y2="222.8" stroke="#d9a400" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="665.6" y1="158.6" x2="526.5" y2="222.8" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="234.4" y1="357.4" x2="373.5" y2="293.2" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="665.6" y1="357.4" x2="526.5" y2="293.2" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="104.6" x2="450.0" y2="222.8" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="375.0" y="230.8" width="150.0" height="54.5" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.5"/><text x="450.0" y="253.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ЄДИНИЙ</tspan><tspan x="450.0" dy="19.5">екземпляр</tspan></text>
<rect x="76.9" y="97.4" width="182.2" height="61.2" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="168.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="168.0" dy="0.0">1. Гонитва потоків</tspan><tspan x="168.0" dy="15.6">два потоки — два new</tspan><tspan x="168.0" dy="15.6">→ замок: ідіом платформи</tspan></text>
<rect x="630.7" y="97.4" width="202.7" height="61.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="732.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="732.0" dy="0.0">2. Серіалізація</tspan><tspan x="732.0" dy="15.6">readObject робить новий</tspan><tspan x="732.0" dy="15.6">→ замок: readResolve / enum</tspan></text>
<rect x="66.7" y="357.4" width="202.7" height="61.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="168.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="168.0" dy="0.0">3. Рефлексія</tspan><tspan x="168.0" dy="15.6">setAccessible(true) в обхід</tspan><tspan x="168.0" dy="15.6">→ замок: перевірка / enum</tspan></text>
<rect x="637.5" y="357.4" width="189.0" height="61.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="732.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="732.0" dy="0.0">4. Клонування</tspan><tspan x="732.0" dy="15.6">clone() віддає копію</tspan><tspan x="732.0" dy="15.6">→ замок: заборонити clone</tspan></text>
<rect x="335.0" y="43.4" width="230.0" height="61.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="62.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">5. Кілька завантажувачів класів</tspan><tspan x="450.0" dy="15.6">клас × loader = свій екземпляр</tspan><tspan x="450.0" dy="15.6">→ замок: один спільний loader</tspan></text>
<text x="450.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Наївний замок закриває лише двері 1; решта чотири відчиняються незалежно.</text>
</svg>