<text x="460.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Сінглтон обмежує кількість обʼєктів; моностейт — кількість станів. Обидва лишаються глобальним станом.</text>
