<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="372" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Якщо B ще не збудований, конструктор A читає порожнечу</text>
<text x="410.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">конструктор A читає B</text>
<line x1="310.4" y1="140.0" x2="509.6" y2="140.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="149.6" y="115.0" width="160.8" height="49.9" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">глобальний обʼєкт A</tspan><tspan x="230.0" dy="16.9">(файл a.cpp)</tspan></text>
<rect x="509.6" y="115.0" width="160.8" height="49.9" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">глобальний обʼєкт B</tspan><tspan x="590.0" dy="16.9">(файл b.cpp)</tspan></text>
<rect x="255.5" y="207.1" width="309.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="410.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порядок ініціалізації A і B між файлами</tspan><tspan x="410.0" dy="16.9">стандартом C++ НЕ визначений</tspan></text>
<rect x="186.3" y="295.6" width="447.5" height="48.8" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ліки: сінглтон Меєрса — B живе у функції як локальний static</tspan><tspan x="410.0" dy="16.2">й будується при першому зверненні (construct-on-first-use)</tspan></text>
</svg>