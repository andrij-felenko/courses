<rect x="138.0" y="205.6" width="184.0" height="72.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Посередник</tspan><tspan x="230.0" dy="16.9">лише маршрутизує</tspan><tspan x="230.0" dy="16.9">й координує</tspan></text>
<text x="230.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">колеги прості, легко замінні;</text>
<text x="230.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">правила — в одному видимому місці</text>
<line x1="452.0" y1="246.0" x2="512.0" y2="246.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="482.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">минає рік</text>
<text x="482.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">усе звалюють</text>
<text x="482.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">в один клас</text>
<text x="716.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Той самий посередник за рік</text>
