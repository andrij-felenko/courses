<text x="480.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">стягнула її на один вузол: степінь n зовні, усі m правил усередині — ось божественний об'єкт.</text>
