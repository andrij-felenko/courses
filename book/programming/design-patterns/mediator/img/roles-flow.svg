<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три ролі: колега сповіщає посередника, той керує рештою</text>
<rect x="52.0" y="196.6" width="196.0" height="70.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="219.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Колега A</tspan><tspan x="150.0" dy="16.9">прапорець</tspan><tspan x="150.0" dy="16.9">«та сама адреса»</tspan></text>
<text x="150.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A знає посередника</text>
<text x="150.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лише як інтерфейс</text>
<rect x="372.0" y="150.0" width="216.0" height="172.0" rx="10" fill="#fff6e5" stroke="#c0392b" stroke-width="2.0"/>
<text x="480.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Посередник</text>
<text x="480.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">інтерфейс: notify(хто, подія)</text>
<line x1="392.0" y1="214.0" x2="568.0" y2="214.0" stroke="#e0c98a" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="480.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діалог — конкретний посередник</text>
<text x="480.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тримає посилання на всіх колег</text>
<text x="480.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">і містить логіку координації</text>
<rect x="714.0" y="131.1" width="172.0" height="53.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Колега B</tspan><tspan x="800.0" dy="16.9">поле адреси</tspan></text>
<rect x="714.0" y="273.1" width="172.0" height="53.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Колега C</tspan><tspan x="800.0" dy="16.9">кнопка OK</tspan></text>
<line x1="248.0" y1="210.0" x2="372.0" y2="196.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="292.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">1. notify(A, «змінився»)</text>
<line x1="588.0" y1="190.0" x2="714.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="694.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">2. field.disable()</text>
<line x1="588.0" y1="278.0" x2="714.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="694.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">3. okButton.enable()</text>
<text x="470.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Колеги не з'єднані між собою — уся взаємодія тече через посередника.</text>
</svg>