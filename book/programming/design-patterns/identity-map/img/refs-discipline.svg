<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 786" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="786" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто тримає об'єкт живим — той і вирішує, коли він помре</text>
<text x="650.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий об'єкт, та сама мапа — різниця лише в тому, чи встигли його змінити</text>
<rect x="40.0" y="88.0" width="600.0" height="596.0" rx="12" fill="#fbfefc" stroke="#27ae60" stroke-width="2.0"/>
<text x="340.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ЧИСТИЙ ОБ'ЄКТ</text>
<text x="340.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">об'єкт лише прочитали й нічого не чіпали</text>
<rect x="80.0" y="201.8" width="184.0" height="32.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="172.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="172.0" dy="0.0">код запиту</tspan></text>
<rect x="80.0" y="301.8" width="184.0" height="32.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="172.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="172.0" dy="0.0">мапа сесії</tspan></text>
<rect x="80.0" y="401.8" width="184.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="172.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="172.0" dy="0.0">одиниця роботи</tspan></text>
<text x="172.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">порожня — писати нічого</text>
<rect x="396.0" y="291.1" width="192.0" height="53.9" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="492.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.0" dy="0.0">Order #42</tspan><tspan x="492.0" dy="16.9">status = 'new'</tspan></text>
<line x1="268.0" y1="218.0" x2="392.0" y2="294.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="268.0" y1="318.0" x2="382.0" y2="318.0" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="7,5"/><polygon points="392.0,318.0 382.0,313.0 382.0,323.0" fill="#6b7280"/>
<rect x="84.0" y="498.0" width="512.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="340.0" y="532.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">код відпустив об'єкт —</tspan><tspan x="340.0" dy="16.9">і сильних посилань не лишилось.</tspan><tspan x="340.0" dy="16.9">Об'єкт помирає негайно, а мапа</tspan><tspan x="340.0" dy="16.9">прибирає порожню комірку сама.</tspan></text>
<text x="340.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПАМ'ЯТЬ ВІЛЬНА</text>
<rect x="660.0" y="88.0" width="600.0" height="596.0" rx="12" fill="#fafbff" stroke="#2457d6" stroke-width="2.0"/>
<text x="960.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">БРУДНИЙ ОБ'ЄКТ</text>
<text x="960.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">об'єкт змінили — і сесія про це вже знає</text>
<rect x="700.0" y="201.8" width="184.0" height="32.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="792.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">код запиту</tspan></text>
<rect x="700.0" y="301.8" width="184.0" height="32.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="792.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">мапа сесії</tspan></text>
<rect x="700.0" y="401.8" width="184.0" height="32.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="792.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">одиниця роботи</tspan></text>
<text x="792.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тут лежить цей об'єкт</text>
<rect x="1016.0" y="291.1" width="192.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1112.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1112.0" dy="0.0">Order #42</tspan><tspan x="1112.0" dy="16.9">status = 'paid'</tspan></text>
<line x1="888.0" y1="218.0" x2="1012.0" y2="294.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="888.0" y1="318.0" x2="1002.0" y2="318.0" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="7,5"/><polygon points="1012.0,318.0 1002.0,313.0 1002.0,323.0" fill="#6b7280"/>
<line x1="888.0" y1="418.0" x2="1012.0" y2="342.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="704.0" y="498.0" width="512.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="960.0" y="532.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">код відпустив об'єкт —</tspan><tspan x="960.0" dy="16.9">а одиниця роботи ще тримає.</tspan><tspan x="960.0" dy="16.9">Об'єкт живе до commit(), і лише коли</tspan><tspan x="960.0" dy="16.9">списки почистять — аж тоді помирає.</tspan></text>
<text x="960.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ЗМІНИ ДОЖИЛИ ДО ЗАПИСУ</text>
<line x1="290.0" y1="712.0" x2="356.0" y2="712.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="366.0" y="717.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сильне посилання — тримає об'єкт живим</text>
<line x1="770.0" y1="712.0" x2="836.0" y2="712.0" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="7,5"/>
<text x="846.0" y="717.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">слабке — не тримає</text>
<text x="650.0" y="760.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Список того, що треба записати, і список того, що треба тримати живим, — це один список.</text>
</svg>