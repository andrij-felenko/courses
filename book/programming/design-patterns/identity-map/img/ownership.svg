<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому та сама мапа тримає в Hibernate і руйнує в Rails</text>
<text x="650.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">річ не в якості мапи, а в тому, чи є кому володіти графом</text>
<rect x="40.0" y="96.0" width="600.0" height="560.0" rx="12" fill="#fcfcfd" stroke="#27ae60" stroke-width="2.0"/>
<text x="70.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">СЕСІЯ ВОЛОДІЄ ВСІМ — TopLink · Hibernate · JPA</text>
<rect x="241.3" y="159.5" width="197.3" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="340.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">session.get(Order, 42)</tspan></text>
<line x1="340.0" y1="196.0" x2="340.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="228.0" width="520.0" height="300.0" rx="10" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="340.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сесія · контекст персистентності</text>
<rect x="104.0" y="278.0" width="472.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="340.0" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">карта тотожності:  (тип, ключ) → об'єкт</tspan></text>
<rect x="104.0" y="336.0" width="472.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="340.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">одиниця роботи:  список змінених об'єктів</tspan></text>
<rect x="104.0" y="394.0" width="472.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="340.0" y="420.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">колекції зв'язків — обгорнуті сесією</tspan></text>
<rect x="104.0" y="452.0" width="472.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="340.0" y="478.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">порядок flush — теж її рішення</tspan></text>
<rect x="80.0" y="552.0" width="520.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="340.0" y="578.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Симетрію зв'язків тримає розробник — за правилом,</tspan><tspan x="340.0" dy="16.2">оголошеним із першого дня. Але правило Є КОМУ адресувати:</tspan><tspan x="340.0" dy="16.2">у графа є власник.</tspan></text>
<rect x="660.0" y="96.0" width="600.0" height="560.0" rx="12" fill="#fcfcfd" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ГРАФ — НІЧИЙ — Active Record</text>
<rect x="821.0" y="159.5" width="277.9" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="960.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">Post.find(42)   ← класовий метод</tspan></text>
<text x="960.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сесії, якій це адресувати, не існує</text>
<line x1="960.0" y1="224.0" x2="960.0" y2="256.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="256.0" width="520.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="960.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Thread.current[:identity_map]</tspan><tspan x="960.0" dy="16.2">глобальна змінна з гарною назвою + middleware на запит</tspan></text>
<line x1="960.0" y1="318.0" x2="960.0" y2="350.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="350.0" width="520.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="960.0" y="377.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">@post.comments — запам'ятано на самому об'єкті</tspan><tspan x="960.0" dy="16.2">мапа про цю колекцію не знає й не інвалідує її</tspan></text>
<line x1="960.0" y1="412.0" x2="960.0" y2="444.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="444.0" width="520.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="960.0" y="474.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Поки мапи не було, ДРУГА КОПІЯ перечитувала колекцію —</tspan><tspan x="960.0" dy="16.2">і саме вона, непомітно, тримала граф свіжим.</tspan><tspan x="960.0" dy="16.2">Мапа прибрала копію — і разом із нею перечитування.</tspan></text>
<rect x="680.0" y="552.0" width="520.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="940.0" y="578.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">Правило «тримай обидва боки зв'язку» тут ніколи не було потрібне —</tspan><tspan x="940.0" dy="16.2">тож десять років коду його не знає. Мапа створила потребу</tspan><tspan x="940.0" dy="16.2">в правилі заднім числом.</tspan></text>
<text x="650.0" y="700.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта тотожності — не деталь, яку доставляють. Це властивість архітектури, у якої є сесія.</text>
<text x="650.0" y="730.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Hibernate теж не стежить за зв'язками. Різниця в тому, що там є кому за них відповідати.</text>
</svg>