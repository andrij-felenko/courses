<rect x="360.0" y="384.0" width="320.0" height="130.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="520.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">commit вдався</text>
<text x="520.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">accept(): мітки скинуто,</tspan><tspan x="520.0" dy="15.9">вилучені рядки викинуто —</tspan><tspan x="520.0" dy="15.9">набір і база кажуть те саме</tspan></text>
