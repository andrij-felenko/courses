<text x="515.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">changes()</text>
<text x="515.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="515.0" dy="0.0">тільки помічені рядки —</tspan><tspan x="515.0" dy="15.4">решта не турбує базу</tspan></text>
