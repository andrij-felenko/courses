<text x="1000.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">commit упав → відкат</text>
<text x="1000.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">база незмінна, мітки ЛИШИЛИСЬ:</tspan><tspan x="1000.0" dy="15.9">повторити або reject()</tspan><tspan x="1000.0" dy="15.9">до вихідних значень</tspan></text>
<rect x="170.0" y="546.0" width="960.0" height="74.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="650.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">.NET-пастка: DataAdapter.Update сам кличе AcceptChanges на кожному вдалому рядку —</tspan><tspan x="650.0" dy="16.5">після відкату транзакції набір уже вважає себе збереженим. Лікує AcceptChangesDuringUpdate = false</tspan></text>
</svg>