<text x="850.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">INSERT · UPDATE · DELETE</tspan><tspan x="850.0" dy="15.4">тут і тільки тут — SQL</tspan></text>
