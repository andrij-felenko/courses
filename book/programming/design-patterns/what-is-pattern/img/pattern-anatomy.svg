<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патерн — це не код, а картка з чотирьох частин</text>
<rect x="60.0" y="58.0" width="640.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="78.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">НАЗВА</text>
<text x="78.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">спільне слово, яким команда називає рішення</text>
<text x="682.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">«Стратегія»</text>
<rect x="60.0" y="148.0" width="640.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="78.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="700">ЗАДАЧА + СИЛИ</text>
<text x="78.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">яка проблема і які суперечливі вимоги тиснуть</text>
<text x="682.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">поведінка мусить мінятися на льоту</text>
<rect x="60.0" y="238.0" width="640.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="78.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">РОЗВ'ЯЗОК</text>
<text x="78.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">як розставити ролі об'єктів, щоб сили погодити</text>
<text x="682.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">винести дію в окремий об'єкт, що підставляється</text>
<rect x="60.0" y="328.0" width="640.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="78.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">НАСЛІДКИ</text>
<text x="78.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">що виграв і чим за це заплатив</text>
<text x="682.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">гнучкість ↑, але класів більше</text>
</svg>