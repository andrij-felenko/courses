<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перенесли не поради — форму запису патерну</text>
<rect x="40.0" y="58.0" width="300.0" height="36.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="190.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Александер · «Світло з двох боків»</text>
<rect x="560.0" y="58.0" width="300.0" height="36.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/>
<text x="710.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Банда чотирьох · «Стратегія»</text>
<rect x="40.0" y="112.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="190.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">кімната в будинку</tspan></text>
<rect x="560.0" y="112.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="710.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">об'єкт зі змінною поведінкою</tspan></text>
<rect x="391.0" y="141.0" width="118.0" height="34.0" rx="17" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="450.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">КОНТЕКСТ</text>
<line x1="340.0" y1="158.0" x2="391.0" y2="158.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="158.0" x2="509.0" y2="158.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="212.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="190.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">м'яке світло з кількох боків,</tspan><tspan x="190.0" dy="16.2">але вікна коштують</tspan></text>
<rect x="560.0" y="212.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="710.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">мінятися, не переписуючи</tspan><tspan x="710.0" dy="16.2">власника, під час роботи</tspan></text>
<rect x="391.0" y="241.0" width="118.0" height="34.0" rx="17" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="450.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">СИЛИ</text>
<line x1="340.0" y1="258.0" x2="391.0" y2="258.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="258.0" x2="509.0" y2="258.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="312.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="190.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">вікна у дві зовнішні стіни</tspan></text>
<rect x="560.0" y="312.0" width="300.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="710.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">винести поведінку</tspan><tspan x="710.0" dy="16.2">в підставний об'єкт</tspan></text>
<rect x="391.0" y="341.0" width="118.0" height="34.0" rx="17" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="450.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">РОЗВ'ЯЗОК</text>
<line x1="340.0" y1="358.0" x2="391.0" y2="358.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="358.0" x2="509.0" y2="358.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">та сама кістка — змінилися лише іменники</text>
</svg>