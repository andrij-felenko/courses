<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Антипатерн — теж картка з чотирьох частин, але зі знаком мінус</text>
<rect x="56.0" y="62.0" width="688.0" height="84.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/>
<text x="74.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">НАЗВА</text>
<text x="74.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">спільне слово, яким команда показує на біль</text>
<text x="726.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">«Божественний об'єкт»</text>
<rect x="56.0" y="158.0" width="688.0" height="84.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="74.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ОМАНЛИВИЙ ПСЕВДО-РОЗВ'ЯЗОК</text>
<text x="74.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">те зручне, за що хапаються</text>
<text x="726.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">«дописати сюди, тут же під рукою»</text>
<rect x="56.0" y="254.0" width="688.0" height="84.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="74.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">СХОВАНА СПРАВЖНЯ ЦІНА</text>
<text x="74.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">що насправді дістаєш</text>
<text x="726.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">клас знає все — не змінити, не тестувати частинами</text>
<rect x="56.0" y="350.0" width="688.0" height="84.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="74.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">РОЗВ'ЯЗОК-ВИХІД</text>
<text x="74.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перевірений спосіб вибратися</text>
<text x="726.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">розбити за обов'язками, залежності подати ззовні</text>
</svg>