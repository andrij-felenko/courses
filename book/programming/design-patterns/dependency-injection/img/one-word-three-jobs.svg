<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово на три роботи</text>
<rect x="60.0" y="70.0" width="1060.0" height="290.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.8"/>
<text x="590.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ІНВЕРСІЯ КЕРУВАННЯ — як її вживав Авалон</text>
<text x="590.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">компонентом завжди керують ззовні — і кожній із трьох робіт назва пасує однаково добре</text>
<rect x="125.0" y="217.5" width="290.0" height="65.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.7"/><text x="270.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">СКЛАДАННЯ</tspan><tspan x="270.0" dy="16.2">хто дає компонентові</tspan><tspan x="270.0" dy="16.2">інші компоненти</tspan></text>
<rect x="445.0" y="217.5" width="290.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.7"/><text x="590.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">НАЛАШТУВАННЯ</tspan><tspan x="590.0" dy="16.2">хто дає числа, шляхи,</tspan><tspan x="590.0" dy="16.2">ключі й таймаути</tspan></text>
<rect x="765.0" y="217.5" width="290.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.7"/><text x="910.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">ЖИТТЄВИЙ ЦИКЛ</tspan><tspan x="910.0" dy="16.2">хто вирішує, коли створити,</tspan><tspan x="910.0" dy="16.2">запустити й знищити</tspan></text>
<line x1="270.0" y1="362.0" x2="270.0" y2="442.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="590.0" y1="362.0" x2="660.0" y2="442.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="910.0" y1="362.0" x2="840.0" y2="442.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120.0" y="455.6" width="300.0" height="48.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="270.0" y="476.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">ВПРОВАДЖЕННЯ ЗАЛЕЖНОСТЕЙ</tspan><tspan x="270.0" dy="16.2">точне ім'я — лише для ЦІЄЇ роботи</tspan></text>
<rect x="600.0" y="455.6" width="300.0" height="48.8" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="750.0" y="476.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">лишилися під старим прапором</tspan><tspan x="750.0" dy="16.2">власних імен так і не дістали</tspan></text>
<text x="590.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">DI не перейменувало IoC — воно відкололо від нього ОДНУ роботу з трьох</text>
<text x="590.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">налаштування й життєвий цикл лишилися під старою назвою</text>
</svg>