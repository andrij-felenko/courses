<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл, який локатор ховав, а конструктор показує</text>
<line x1="600.0" y1="60.0" x2="600.0" y2="400.0" stroke="#d0d5db" stroke-width="1.1" stroke-dasharray="4,6"/>
<text x="300.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ПІД ЛОКАТОРОМ — цикл живий</text>
<rect x="211.3" y="126.8" width="177.3" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Billing</tspan><tspan x="300.0" dy="15.0">charge() → get(&quot;notify&quot;)</tspan></text>
<rect x="214.6" y="266.8" width="170.8" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="286.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Notifier</tspan><tspan x="300.0" dy="15.0">send() → get(&quot;billing&quot;)</tspan></text>
<line x1="245.0" y1="179.2" x2="245.0" y2="260.8" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="355.0" y1="260.8" x2="355.0" y2="179.2" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="300.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">смик</text>
<text x="300.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обидва вже створені порожніми —</text>
<text x="300.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">смик стається аж під час виклику</text>
<text x="300.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✓ працює, і цикл ніхто не бачить</text>
<text x="900.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">КОНСТРУКТОРАМИ — зібрати нема як</text>
<rect x="817.9" y="126.8" width="164.2" height="46.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="900.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Billing</tspan><tspan x="900.0" dy="15.0">ctor(notify: Notifier)</tspan></text>
<rect x="817.9" y="266.8" width="164.2" height="46.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="900.0" y="286.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Notifier</tspan><tspan x="900.0" dy="15.0">ctor(billing: Billing)</tspan></text>
<line x1="822.0" y1="179.2" x2="822.0" y2="260.8" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="978.0" y1="260.8" x2="978.0" y2="179.2" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="900.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="900.0" dy="0.0">щоб створити одного —</tspan><tspan x="900.0" dy="14.9">треба вже мати другого</tspan></text>
<text x="900.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">топологічного порядку не існує:</text>
<text x="900.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">граф із циклом не збирається взагалі</text>
<text x="900.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">✗ падає ще на складанні</text>
<line x1="60.0" y1="424.0" x2="1140.0" y2="424.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="600.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два чесні виходи</text>
<rect x="90.0" y="476.0" width="480.0" height="100.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.7"/><text x="330.0" y="514.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">① РОЗІРВАТИ ЦИКЛ — краще</tspan><tspan x="330.0" dy="15.6">витягти спільне третє або пустити подію назустріч;</tspan><tspan x="330.0" dy="15.6">цикл був справжньою вадою будови, а не дрібницею</tspan></text>
<rect x="630.0" y="476.0" width="480.0" height="100.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.7"/><text x="870.0" y="514.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">② ПОСТАЧАЛЬНИК — коли інакше ніяк</tspan><tspan x="870.0" dy="15.6">ctor(notify: () =&gt; Notifier) — виклик відкладено,</tspan><tspan x="870.0" dy="15.6">але залежність ЗАДЕКЛАРОВАНА в сигнатурі</tspan></text>
</svg>