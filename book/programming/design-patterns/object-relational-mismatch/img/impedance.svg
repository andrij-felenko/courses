<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="70.0" width="1120.0" height="235.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="600.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">В електриці: опір — одна величина, і її можна зрівняти</text>
<line x1="700.0" y1="110.0" x2="700.0" y2="222.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="233.0" y1="148.0" x2="690.0" y2="148.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">падна хвиля</text>
<line x1="710.0" y1="165.0" x2="967.0" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="870.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">передана</text>
<line x1="690.0" y1="190.0" x2="233.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">відбита — коли Zₗ ≠ Z₀</text>
<rect x="75.0" y="138.1" width="150.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Джерело</tspan><tspan x="150.0" dy="16.9">опір Z₀</tspan></text>
<rect x="975.0" y="138.1" width="150.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1050.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Навантаження</tspan><tspan x="1050.0" dy="16.9">опір Zₗ</tspan></text>
<text x="600.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Γ = (Zₗ − Z₀) / (Zₗ + Z₀)      Zₗ = Z₀ → Γ = 0: усе проходить, нічого не вертається</text>
<rect x="40.0" y="345.0" width="1120.0" height="235.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="600.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">На стику об'єкт ↔ таблиця: «опори» різнорідні</text>
<line x1="660.0" y1="388.0" x2="660.0" y2="500.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="660.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">переклад</text>
<line x1="233.0" y1="423.0" x2="650.0" y2="423.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зусилля програміста</text>
<line x1="670.0" y1="440.0" x2="967.0" y2="440.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="865.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">лягло в рядок</text>
<line x1="650.0" y1="465.0" x2="233.0" y2="465.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">відбите зусилля — на КОЖНОМУ переході</text>
<rect x="75.0" y="413.1" width="150.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Об'єкт</tspan><tspan x="150.0" dy="16.9">(пам'ять)</tspan></text>
<rect x="975.0" y="413.1" width="150.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="1050.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Рядок</tspan><tspan x="1050.0" dy="16.9">(таблиця)</tspan></text>
<rect x="110.0" y="525.6" width="980.0" height="52.8" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/><text x="600.0" y="548.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">«Опори» тут різнорідні — не два значення однієї величини, а різні речі.</tspan><tspan x="600.0" dy="16.2">Стану, де Γ = 0, немає: повністю узгодити не можна ніколи — ось де аналогія ламається.</tspan></text>
</svg>