<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ставки на відсутність: нейтральність проти поглинання</text>
<text x="560.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">порожній об'єкт хоче зникнути в обчисленні;  Option — спинити його на видноті</text>
<text x="60.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">порожній об'єкт — ставка на нейтральність</text>
<rect x="100.0" y="187.0" width="100.0" height="46.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><text x="150.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок 1</text>
<line x1="202.0" y1="210.0" x2="288.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="187.0" width="100.0" height="46.0" rx="9" fill="#e8f6ee" stroke="#27ae60" stroke-width="2"/><text x="340.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">порожній</text>
<line x1="392.0" y1="210.0" x2="478.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="187.0" width="100.0" height="46.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><text x="530.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок 3</text>
<line x1="582.0" y1="210.0" x2="668.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="187.0" width="100.0" height="46.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><text x="720.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок 4</text>
<line x1="772.0" y1="210.0" x2="858.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="860.0" y="187.0" width="100.0" height="46.0" rx="9" fill="#e8f6ee" stroke="#27ae60" stroke-width="2"/><text x="910.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">результат</text>
<text x="150.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">значення тече наскрізь — «порожній» лишає його незмінним</text>
<text x="150.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">інертний і невидимий; якщо випадково поглинальний — тихо ламає</text>
<text x="60.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Option / Maybe — поглинання видиме в типі</text>
<rect x="100.0" y="397.0" width="100.0" height="46.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><text x="150.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок 1</text>
<rect x="290.0" y="397.0" width="100.0" height="46.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="340.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Nothing</text>
<rect x="480.0" y="397.0" width="100.0" height="46.0" rx="9" fill="#f7f8fa" stroke="#c9ced4" stroke-width="2"/><text x="530.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">крок 3</text>
<rect x="670.0" y="397.0" width="100.0" height="46.0" rx="9" fill="#f7f8fa" stroke="#c9ced4" stroke-width="2"/><text x="720.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">крок 4</text>
<line x1="202.0" y1="420.0" x2="288.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="860.0" y="397.0" width="100.0" height="46.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="910.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Nothing</text>
<line x1="392.0" y1="376.0" x2="858.0" y2="376.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">коротке замикання — решту кроків пропущено</text>
<text x="150.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">тип каже «тут або значення, або нічого» — наприкінці мусиш розібрати Nothing</text>
<text x="150.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">поглинання те саме, але видиме й перевірене — забути неможливо</text>
<line x1="44.0" y1="306.0" x2="1076.0" y2="306.0" stroke="#e2e5e9" stroke-width="1.0"/>
<line x1="44.0" y1="552.0" x2="1076.0" y2="552.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="560.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">нейтральний ⇒ відсутність інертна й невидима · поглинальний-у-типі ⇒ спиняє й вимагає уваги</text>
</svg>