<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1070" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="535.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг: кожна ланка перевіряє поріг і або бере, або передає далі</text>
<text x="535.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Сірі стрілки — «не моє, передаю далі»; зелені — «моє, беру і зупиняю»</text>
<rect x="20.0" y="105.0" width="150.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">відправник</tspan><tspan x="95.0" dy="15.6">кидає запит</tspan><tspan x="95.0" dy="15.6">першій ланці</tspan></text>
<rect x="210.0" y="105.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Ланка 1</tspan><tspan x="305.0" dy="16.9">перевіряє поріг</tspan></text>
<rect x="420.0" y="105.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">Ланка 2</tspan><tspan x="515.0" dy="16.9">перевіряє поріг</tspan></text>
<rect x="630.0" y="105.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Ланка 3</tspan><tspan x="725.0" dy="16.9">перевіряє поріг</tspan></text>
<rect x="850.0" y="105.0" width="180.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="940.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">ніхто не взяв</tspan><tspan x="940.0" dy="15.6">запит випадає</tspan><tspan x="940.0" dy="15.6">необробленим</tspan></text>
<line x1="170.0" y1="145.0" x2="210.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="145.0" x2="420.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="145.0" x2="630.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="820.0" y1="145.0" x2="850.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="305.0" y1="187.0" x2="305.0" y2="298.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="210.0" y="300.0" width="190.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">поріг підходить →</tspan><tspan x="305.0" dy="15.6">бере й зупиняє</tspan></text>
<line x1="515.0" y1="187.0" x2="515.0" y2="298.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="420.0" y="300.0" width="190.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="515.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">поріг підходить →</tspan><tspan x="515.0" dy="15.6">бере й зупиняє</tspan></text>
<line x1="725.0" y1="187.0" x2="725.0" y2="298.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="630.0" y="300.0" width="190.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">поріг підходить →</tspan><tspan x="725.0" dy="15.6">бере й зупиняє</tspan></text>
<text x="535.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Якщо жодна ланка не взяла — запит доходить до кінця й випадає необробленим.</text>
</svg>