<rect x="740.0" y="310.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="352.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Director</tspan><tspan x="880.0" dy="16.9">≤ 100 000 → сам обробляє</tspan><tspan x="880.0" dy="16.9">інакше → передає далі</tspan></text>
