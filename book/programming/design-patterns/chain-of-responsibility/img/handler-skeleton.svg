<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скелет: інтерфейс, спільна основа, конкретні ланки — і зчеплені екземпляри</text>
<rect x="380.0" y="60.0" width="300.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">«інтерфейс» Approver</tspan><tspan x="530.0" dy="16.9">setNext(next) · handle(запит)</tspan></text>
<line x1="530.0" y1="130.0" x2="530.0" y2="168.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
