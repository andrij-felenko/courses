<text x="530.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Механіку «next» клас має один раз; кожен екземпляр лише посилається на наступний.</text>
