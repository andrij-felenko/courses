<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1250" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="625.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна форма, відкрита тричі незалежно — і названа аж наприкінці</text>
<text x="80.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">залізо</text>
<rect x="155.0" y="65.0" width="230.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1954 · NBS DYSEAC</tspan><tspan x="270.0" dy="16.9">переривання від</tspan><tspan x="270.0" dy="16.9">пристроїв вводу-виводу</tspan></text>
<line x1="385.0" y1="105.0" x2="413.0" y2="105.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="415.0" y="65.0" width="230.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">1957 · Electrologica X1</tspan><tspan x="530.0" dy="16.9">Дейкстра: машина стала</tspan><tspan x="530.0" dy="16.9">недетермінованою</tspan></text>
<line x1="645.0" y1="105.0" x2="673.0" y2="105.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="675.0" y="65.0" width="230.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">1970 · DEC Unibus</tspan><tspan x="790.0" dy="16.9">гірлянда BG: не моє —</tspan><tspan x="790.0" dy="16.9">передай дротом далі</tspan></text>
<text x="80.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">мови й помилки</text>
<rect x="155.0" y="205.0" width="230.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1964–65 · PL/I</tspan><tspan x="270.0" dy="16.9">ON-unit: помилка спливає</tspan><tspan x="270.0" dy="16.9">вгору по стеку викликів</tspan></text>
<line x1="385.0" y1="245.0" x2="413.0" y2="245.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="415.0" y="205.0" width="230.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">1975 · Джон Ґуденаф</tspan><tspan x="530.0" dy="16.9">перша спроба записати</tspan><tspan x="530.0" dy="16.9">правило як правило</tspan></text>
<line x1="645.0" y1="245.0" x2="673.0" y2="245.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="675.0" y="205.0" width="230.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">1989–91 · C++</tspan><tspan x="790.0" dy="16.9">«вернутися чи згорнути»:</tspan><tspan x="790.0" dy="16.9">згортаємо — і крапка</tspan></text>
<text x="80.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">каркаси GUI</text>
<rect x="155.0" y="345.0" width="230.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1985 · Apple MacApp</tspan><tspan x="270.0" dy="16.9">клас «Event-Handler»</tspan></text>
<line x1="385.0" y1="385.0" x2="413.0" y2="385.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="415.0" y="345.0" width="230.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">1988 · ET++ Еріка Ґамми</tspan><tspan x="530.0" dy="16.9">теж «Event-Handler»</tspan></text>
<line x1="645.0" y1="385.0" x2="673.0" y2="385.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="675.0" y="345.0" width="230.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">1989 · NeXT «Responder»,</tspan><tspan x="790.0" dy="16.9">Symantec TCL «Bureaucrat»</tspan></text>
<rect x="965.0" y="170.0" width="255.0" height="150.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="1.5"/><text x="1092.5" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6d00" text-anchor="middle" font-weight="700"><tspan x="1092.5" dy="0.0">1994 · «банда чотирьох»</tspan><tspan x="1092.5" dy="16.9">Chain of Responsibility</tspan><tspan x="1092.5" dy="16.9"></tspan><tspan x="1092.5" dy="16.9">одне ім'я на три</tspan><tspan x="1092.5" dy="16.9">незалежні винаходи</tspan></text>
<line x1="905.0" y1="105.0" x2="962.0" y2="212.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="905.0" y1="245.0" x2="960.0" y2="245.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="905.0" y1="385.0" x2="962.0" y2="288.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Три лінії не знали одна про одну — і кожна прийшла до того самого: «не моє — передай наступному».</text>
</svg>