<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди йде виміряна пам'ять лісу з мільйона дерев</text>
<line x1="120.0" y1="540.0" x2="980.0" y2="540.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="255.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">абсолютний RSS ≈ 31 МБ</text>
<rect x="180.0" y="185.0" width="150.0" height="355.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.7"/>
<line x1="330.0" y1="362.5" x2="420.0" y2="362.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вектор дерев: 1 000 000 × 24 Б  ≈  24.0 МБ</text>
<rect x="180.0" y="142.0" width="150.0" height="43.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<line x1="330.0" y1="163.5" x2="420.0" y2="170.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сітки 3 видів  ≈  2.9 МБ</text>
<rect x="180.0" y="90.0" width="150.0" height="52.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.7"/>
<line x1="330.0" y1="116.0" x2="420.0" y2="110.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">незмінний фон рантайму  ≈  3.5 МБ  (код, libc; не залежить від N)</text>
<line x1="120.0" y1="142.0" x2="900.0" y2="142.0" stroke="#c0392b" stroke-width="1.7" stroke-dasharray="7,6"/>
<text x="760.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">серветка ≈ 27 МБ  =  приріст RSS (after − before)</text>
<text x="500.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">приріст RSS ≈ серветковому підрахунку; абсолютний RSS вищий рівно на фон рантайму</text>
<text x="500.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">рахуючи пам'ять — рахуй буфери на купі, а фон відкидай різницею до/після</text>
</svg>