<text x="172.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">ліс: K=3  (глибоко у виграші)</text>
<text x="570.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Схематично (s_intr ≫ s_ctx): за важкого виду перетин K* майже при N — виграш майже завжди.</text>
