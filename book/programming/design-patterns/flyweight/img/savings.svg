<text x="270.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">M_наївно = N·S_full</text>
<rect x="300.0" y="360.0" width="300.0" height="40.0" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="384.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">M_легк = N·s_ctx + K·s_intr</tspan></text>
<text x="517.5" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">виграш</text>
<text x="1010.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">програш</text>
