<text x="570.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять легковаговика росте з K і врешті переганяє наївну</text>
