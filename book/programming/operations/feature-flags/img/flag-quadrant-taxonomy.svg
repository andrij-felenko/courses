<rect x="145.0" y="125.0" width="290.0" height="69.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Прапорці експериментів (A/B)</tspan><tspan x="290.0" dy="14.3">• Життя: тижні або місяці</tspan><tspan x="290.0" dy="14.3">• Розрахунок: динамічний за користувачем</tspan><tspan x="290.0" dy="14.3">• Мета: перевірка гіпотез і метрик</tspan></text>
<rect x="525.0" y="125.0" width="290.0" height="69.9" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Прапорці доступу / прав</tspan><tspan x="670.0" dy="14.3">• Життя: роки (постійні)</tspan><tspan x="670.0" dy="14.3">• Розрахунок: динамічний за тарифом/роллю</tspan><tspan x="670.0" dy="14.3">• Мета: монетизація та преміум-функції</tspan></text>
<rect x="144.1" y="345.1" width="291.9" height="69.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="290.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Прапорці випуску (Release)</tspan><tspan x="290.0" dy="14.3">• Життя: дні або тижні</tspan><tspan x="290.0" dy="14.3">• Розрахунок: когорти або статичний відсоток</tspan><tspan x="290.0" dy="14.3">• Мета: безпечний Trunk-Based деплой</tspan></text>
