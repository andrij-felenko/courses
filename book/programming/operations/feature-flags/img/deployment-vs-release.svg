<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення деплою та релізу: керування видимістю коду через прапорці</text>
<rect x="80.0" y="86.0" width="240.0" height="47.9" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1. Деплой на сервери</tspan><tspan x="200.0" dy="16.9">(код потрапляє в прод)</tspan></text>
<rect x="400.0" y="87.2" width="280.0" height="45.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Стан у системі:</tspan><tspan x="540.0" dy="15.6">новий код спить за прапорцем</tspan></text>
<rect x="745.0" y="87.2" width="170.0" height="45.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Трафік:</tspan><tspan x="830.0" dy="15.6">100% на старому коді</tspan></text>
<line x1="325.0" y1="110.0" x2="395.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="685.0" y1="110.0" x2="740.0" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="70.0" y1="225.0" x2="890.0" y2="225.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="264.8" y="213.5" width="530.3" height="23.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="221.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Рішення в рантаймі: прапорець перемикає поведінку без повторного розгортання</tspan></text>
<rect x="80.0" y="316.1" width="240.0" height="47.9" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">2. Реліз для користувачів</tspan><tspan x="200.0" dy="16.9">(керування видимістю)</tspan></text>
<rect x="400.0" y="317.2" width="280.0" height="45.6" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Поступова розкатка:</tspan><tspan x="540.0" dy="15.6">1% → 10% → 50% → 100% за хешем</tspan></text>
<rect x="728.0" y="317.2" width="204.0" height="45.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Відкат при збої:</tspan><tspan x="830.0" dy="15.6">миттєве 0% без перезбірки</tspan></text>
<line x1="325.0" y1="340.0" x2="395.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="685.0" y1="340.0" x2="740.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="49.4" y="208.5" width="101.2" height="33.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="100.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">деплой готовий →</tspan><tspan x="100.0" dy="13.0">початок релізу</tspan></text>
<line x1="150.0" y1="144.0" x2="100.0" y2="203.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="100.0" y1="247.0" x2="150.0" y2="306.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Деплой — це технічна доставка байтів на машини; реліз — це надання можливості користувачам.</text>
</svg>