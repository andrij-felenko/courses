<text x="530.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">5. Відкат і згортання (Rollback)</text>
<text x="530.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Зняття мережевих правил tc</tspan><tspan x="530.0" dy="13.5">Відновлення контейнерів</tspan><tspan x="530.0" dy="13.5">Звільнення дескрипторів</tspan></text>
