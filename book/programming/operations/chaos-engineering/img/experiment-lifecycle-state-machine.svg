<text x="210.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Аварійний Stop (Kill Switch)</text>
<text x="210.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">SLO порушено або panic</tspan><tspan x="210.0" dy="13.5">Екстрене скидання правил</tspan><tspan x="210.0" dy="13.5">Захист продуктивного трафіку</tspan></text>
