<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="30.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Життєвий цикл хаос-експерименту: скінченний автомат переходів</text>
<rect x="60.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="160.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">1. Гіпотеза і базовий стан</text>
<text x="160.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Вимірювання стійкого стану</tspan><tspan x="160.0" dy="13.5">Формулювання очікувань SLI</tspan><tspan x="160.0" dy="13.5">Обмеження радіуса ураження</tspan></text>
<rect x="300.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="400.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="700">2. Активація і підготовка</text>
<text x="400.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Перевірка здоров'я системи</tspan><tspan x="400.0" dy="13.5">Запуск сторожового таймера</tspan><tspan x="400.0" dy="13.5">Встановлення перехоплювачів</tspan></text>
<rect x="540.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="640.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">3. Активна ін'єкція збою</text>
<text x="640.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Внесення затримки / помилок</tspan><tspan x="640.0" dy="13.5">Знищення вузла чи каналу</tspan><tspan x="640.0" dy="13.5">Спостереження реакції метрик</tspan></text>
<rect x="700.0" y="240.0" width="200.0" height="110.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.6"/>
<text x="800.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">4. Валідація стійкого стану</text>
<text x="800.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Порівняння метрик із порогом</tspan><tspan x="800.0" dy="13.5">Перевірка спрацювання fallback</tspan><tspan x="800.0" dy="13.5">Тест збереження цілісності</tspan></text>
