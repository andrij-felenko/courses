<text x="425.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">3. Оновлення сторінки (F5) → Запит потрапляє на Репліку 2</text>
