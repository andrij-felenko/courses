<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні прийняття рішень: Транспортний балансувальник L4 проти Проксі-сервера L7</text>
<rect x="30.0" y="65.0" width="450.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="255.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">L4: Пакетна маршрутизація (TCP/UDP)</text>
<rect x="100.8" y="122.3" width="308.4" height="45.3" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="255.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Клієнтський TCP-пакет</tspan><tspan x="255.0" dy="14.3">[IP джерела | Порт | IP призначення | TCP SYN]</tspan></text>
<line x1="255.0" y1="175.0" x2="255.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Аналіз 5-tuple (без розбору HTTP)</text>
<rect x="125.9" y="218.1" width="258.3" height="73.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="255.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">L4 Ядро (IPVS / eBPF / DPDK / Maglev)</tspan><tspan x="255.0" dy="14.3">• Не перериває TCP-потік (Passthrough)</tspan><tspan x="255.0" dy="14.3">• Переписує IP/MAC (DNAT або DSR)</tspan><tspan x="255.0" dy="14.3">• Пропускна здатність: &gt;10 млн пак/с</tspan></text>
<line x1="255.0" y1="305.0" x2="255.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пряма передача сегментів</text>
<rect x="132.1" y="365.2" width="245.7" height="59.6" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="255.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Бекенд (Цільовий вузол)</tspan><tspan x="255.0" dy="14.3">Отримує сирий TCP-потік від клієнта;</tspan><tspan x="255.0" dy="14.3">Сам виконує TLS-рукостискання</tspan></text>
<text x="255.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Перевага: мінімальна затримка (&lt;10 мкс), низький CPU</text>
<rect x="520.0" y="65.0" width="450.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="745.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">L7: Прикладний проксі (HTTP / gRPC / TLS)</text>
<rect x="575.1" y="122.3" width="339.8" height="45.3" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="745.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Клієнтський запит (HTTPS)</tspan><tspan x="745.0" dy="14.3">[TLS 1.3 | HTTP GET /api/v2/orders | Cookie | JSON]</tspan></text>
<line x1="745.0" y1="175.0" x2="745.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повна термінація TCP та дешифрування TLS</text>
<rect x="593.9" y="223.1" width="302.1" height="73.9" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="745.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">L7 Зворотний проксі (Envoy / NGINX / HAProxy)</tspan><tspan x="745.0" dy="14.3">• Парсинг URL-шляхів, заголовків, кук</tspan><tspan x="745.0" dy="14.3">• Термінація TLS, стиснення, кешування</tspan><tspan x="745.0" dy="14.3">• Пул гарячих Keep-Alive з'єднань до бекендів</tspan></text>
<line x1="745.0" y1="315.0" x2="745.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Маршрутизація за шляхом /api/*</text>
<rect x="606.5" y="365.2" width="277.1" height="59.6" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="745.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Бекенд (Сервіс замовлень)</tspan><tspan x="745.0" dy="14.3">Отримує чистий HTTP/1.1 або gRPC;</tspan><tspan x="745.0" dy="14.3">Ідентифікує клієнта через X-Forwarded-For</tspan></text>
<text x="745.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Перевага: гнучка маршрутизація, захист, інспекція</text>
</svg>