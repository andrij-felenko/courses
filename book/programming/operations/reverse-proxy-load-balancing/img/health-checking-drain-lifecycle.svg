<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл бекенда в балансувальнику: Зондування здоров'я, викид та плавний злив (Drain)</text>
<rect x="40.0" y="80.0" width="220.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="150.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Здоровий (Healthy)</text>
<text x="150.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">100% робочої ваги</tspan><tspan x="150.0" dy="14.9">Приймає нові запити</tspan><tspan x="150.0" dy="14.9">Зонд /healthz повертає 200 OK</tspan></text>
<rect x="390.0" y="80.0" width="220.0" height="110.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
<text x="500.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">Викинутий (Ejected / Unhealthy)</text>
<text x="500.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Вага = 0 (трафік заблоковано)</tspan><tspan x="500.0" dy="14.9">Пасивний аутлаєр (5xx помилки)</tspan><tspan x="500.0" dy="14.9">Або K поспіль провалів зонда</tspan></text>
<rect x="740.0" y="80.0" width="220.0" height="110.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="850.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Відновлення (Warmup)</text>
<text x="850.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">M поспіль успішних 200 OK</tspan><tspan x="850.0" dy="14.9">Поступовий ріст ваги (0→100%)</tspan><tspan x="850.0" dy="14.9">Захист від перевантаження</tspan></text>
<line x1="265.0" y1="135.0" x2="385.0" y2="135.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="325.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">5xx &gt; Поріг / Таймаут</text>
<line x1="615.0" y1="135.0" x2="735.0" y2="135.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Cooldown вийшов</text>
<line x1="850.0" y1="195.0" x2="850.0" y2="230.0" stroke="#16a34a" stroke-width="1.8"/>
<line x1="850.0" y1="230.0" x2="150.0" y2="230.0" stroke="#16a34a" stroke-width="1.8"/>
<line x1="150.0" y1="230.0" x2="150.0" y2="195.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Успішне прогрівання (Readmission) → Повернення в пул</text>
<rect x="250.0" y="280.0" width="500.0" height="160.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="500.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Фаза штатного виведення з експлуатації (Connection Draining)</text>
<text x="500.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Балансувальник отримує команду SIGTERM / API De-register</tspan><tspan x="500.0" dy="14.7">2. Встановлює вагу вузла = 0 (нові клієнтські TCP/HTTP сесії не направляються)</tspan><tspan x="500.0" dy="14.7">3. Очікує завершення існуючих in-flight транзакцій (до спливу drain_timeout)</tspan><tspan x="500.0" dy="14.7">4. Клієнтам повертається Connection: close для закриття Keep-Alive сокетів</tspan><tspan x="500.0" dy="14.7">5. Процес бекенда безпечно зупиняється без жодного обірваного запиту (0 помилок 502)</tspan></text>
<line x1="70.0" y1="195.0" x2="70.0" y2="360.0" stroke="#d97706" stroke-width="1.8"/>
<line x1="70.0" y1="360.0" x2="245.0" y2="360.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="135.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Деплой / Рестарт</text>
</svg>