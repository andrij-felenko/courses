<text x="310.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК (LSN &gt;= Req)</text>
<rect x="606.6" y="332.2" width="266.8" height="55.6" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Гілка НІ (Репліка відстає):</tspan><tspan x="740.0" dy="14.3">1. Очікувати WAIT_LSN (до 20 мс)</tspan><tspan x="740.0" dy="14.3">2. Якщо таймаут -&gt; Спрямувати на Primary</tspan></text>
