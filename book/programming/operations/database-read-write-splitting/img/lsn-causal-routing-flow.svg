<text x="480.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Точне відстеження LSN гарантує Read-Your-Own-Writes без сліпого спрямування 100% читань на Primary</text>
