<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм сесійної маршрутизації за токенами узгодженості (LSN / GTID Routing)</text>
<rect x="76.2" y="62.2" width="147.7" height="55.6" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="150.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Клієнт виконує запис:</tspan><tspan x="150.0" dy="14.3">UPDATE / INSERT</tspan><tspan x="150.0" dy="14.3">(Фіксація транзакції)</tspan></text>
<rect x="369.3" y="62.2" width="141.4" height="55.6" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="440.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Primary фіксує WAL</tspan><tspan x="440.0" dy="14.3">Повертає токен LSN:</tspan><tspan x="440.0" dy="14.3">L_commit = 0/48A9F10</tspan></text>
<rect x="680.5" y="62.2" width="179.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/><text x="770.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Сесія клієнта зберігає:</tspan><tspan x="770.0" dy="14.3">Required_LSN = L_commit</tspan><tspan x="770.0" dy="14.3">Window_Expire = now() + 2s</tspan></text>
