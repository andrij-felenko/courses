<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат стану сесії та прив'язки з'єднань (Connection Pinning State Machine)</text>
<rect x="34.6" y="115.9" width="270.8" height="88.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">СТАН: РОЗІМКНЕНИЙ (Unpinned)</tspan><tspan x="170.0" dy="14.3">• autocommit = 1</tspan><tspan x="170.0" dy="14.3">• Немає відкритих транзакцій</tspan><tspan x="170.0" dy="14.3">• Немає тимчасових таблиць</tspan><tspan x="170.0" dy="14.3">Маршрут: SELECT -&gt; Репліка, W -&gt; Primary</tspan></text>
<rect x="617.7" y="115.9" width="264.5" height="88.2" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">СТАН: ТРАНЗАКЦІЙНИЙ (Pinned)</tspan><tspan x="750.0" dy="14.3">• BEGIN / START TRANSACTION</tspan><tspan x="750.0" dy="14.3">• autocommit = 0</tspan><tspan x="750.0" dy="14.3">• SELECT ... FOR UPDATE</tspan><tspan x="750.0" dy="14.3">Маршрут: 100% запитів -&gt; ТІЛЬКИ Primary</tspan></text>
<rect x="283.8" y="295.9" width="352.3" height="88.2" rx="6" fill="#fefde8" stroke="#d4ac0d" stroke-width="1.5"/><text x="460.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">СТАН: СЕСІЙНО-МОДИФІКОВАНИЙ (Stateful Dirty)</tspan><tspan x="460.0" dy="14.3">• Виконано: SET @my_var = 123</tspan><tspan x="460.0" dy="14.3">• Створено: CREATE TEMPORARY TABLE</tspan><tspan x="460.0" dy="14.3">• Змінено: SET time_zone / sql_mode</tspan><tspan x="460.0" dy="14.3">Маршрут: З'єднання НЕ МОЖНА повертати в спільний пул!</tspan></text>
<line x1="315.0" y1="140.0" x2="580.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="447.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">BEGIN / START TRANSACTION (Прив'язка до Primary)</text>
<line x1="580.0" y1="180.0" x2="315.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="447.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">COMMIT / ROLLBACK (Повернення в розімкнений стан)</text>
<line x1="210.0" y1="225.0" x2="360.0" y2="295.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b7950b" text-anchor="middle">SET @var / CREATE TEMP</text>
<line x1="710.0" y1="225.0" x2="560.0" y2="295.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b7950b" text-anchor="middle">Модифікація сесії в транзакції</text>
<line x1="360.0" y1="340.0" x2="180.0" y2="230.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle">RESET CONNECTION / DISCARD</text>
<text x="480.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Маршрутизатор зобов'язаний жорстко контролювати стан сесії, щоб уникнути витоку конфіденційних даних та порушення транзакційності</text>
</svg>