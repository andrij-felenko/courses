<svg xmlns="http://www.w3.org/2000/svg" viewBox="-37.5 -10 997.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-37.5" y="-10" width="997.5" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від Split-Brain: Кворум, Fencing та STONITH</text><text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Як кластер нейтралізує ізольований вузол і запобігає паралельному запису розбіжних даних</text><line x1="420.0" y1="75.0" x2="420.0" y2="440.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,6"/><text x="420.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">МЕРЕЖЕВИЙ РОЗРИВ (Partition)</text><rect x="30.0" y="105.0" width="360.0" height="340.0" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="210.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">Ізольований сегмент (Меншість 1/3)</text><rect x="60.0" y="158.4" width="300.0" height="63.2" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="210.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Старий Лідер (Вузол 1)</tspan><tspan x="210.0" dy="15.6">Вважає себе лідером, але</tspan><tspan x="210.0" dy="15.6">втратив зв'язок із DCS</tspan></text><rect x="50.0" y="255.2" width="320.0" height="59.6" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/><text x="210.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Апаратний Watchdog (/dev/watchdog)</tspan><tspan x="210.0" dy="14.3">Ліза спливла -&gt; Скидання таймера не виконано</tspan><tspan x="210.0" dy="14.3">-&gt; Примусовий Kernel Panic / Hard Reset</tspan></text><line x1="210.0" y1="225.0" x2="210.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="210.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">STONITH (Shoot The Other Node)</text><text x="210.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вузол 1 фізично вимикається або перезавантажується,
блокуючи будь-яку можливість прийняти запис</text><rect x="450.0" y="105.0" width="480.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="690.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Кворумний сегмент (Більшість 2/3 + DCS)</text><rect x="490.0" y="155.2" width="400.0" height="59.6" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="690.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">DCS Кворум (etcd 3-Node Quorum)</tspan><tspan x="690.0" dy="14.3">2 з 3 вузлів доступні -&gt; Кворум є</tspan><tspan x="690.0" dy="14.3">Фіксує спливання лізи Вузла 1</tspan></text><rect x="470.0" y="260.2" width="200.0" height="59.6" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="570.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Вузол 2 (Новий Лідер)</tspan><tspan x="570.0" dy="14.3">Виграє лізу в etcd</tspan><tspan x="570.0" dy="14.3">Стає Primary (RW)</tspan></text><rect x="710.0" y="260.2" width="200.0" height="59.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="810.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Вузол 3 (Репліка)</tspan><tspan x="810.0" dy="14.3">Перепідключається</tspan><tspan x="810.0" dy="14.3">до Вузла 2</tspan></text><line x1="690.0" y1="220.0" x2="590.0" y2="255.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="675.0" y1="290.0" x2="705.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="690.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">WAL потік</text><text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Консистентність збережена</text><text x="690.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кластер продовжує приймати транзакції без колізій;
два лідери не можуть існувати одночасно</text>
</svg>