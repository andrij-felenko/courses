<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні моделі кластеризації баз даних</text><text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Організація стану, вузлів та потоків реплікації</text><rect x="20.0" y="70.0" width="290.0" height="390.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><rect x="20.0" y="70.0" width="290.0" height="36.0" rx="8" fill="#e8f0fe" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a56db" text-anchor="middle" font-weight="700">1. Primary-Standby (Active-Passive)</text><rect x="40.0" y="118.4" width="250.0" height="63.2" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="165.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Лідер (Primary Node)</tspan><tspan x="165.0" dy="15.6">Читання + Запис (RW)</tspan><tspan x="165.0" dy="15.6">Локальний NVMe + WAL</tspan></text><line x1="165.0" y1="190.0" x2="165.0" y2="235.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/><text x="175.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Потік WAL / Binlog</text><rect x="40.0" y="243.4" width="250.0" height="63.2" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/><text x="165.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Репліка (Standby Node)</tspan><tspan x="165.0" dy="15.6">Тільки читання (RO)</tspan><tspan x="165.0" dy="15.6">Відтворення WAL (Replay)</tspan></text><line x1="35.0" y1="330.0" x2="295.0" y2="330.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,3"/><text x="40.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Єдине джерело запису (SPOW)</text><text x="40.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Синхронна або асинхронна реплікація</text><text x="40.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Промоція репліки при відмові лідера</text><text x="40.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Приклади: PostgreSQL (Patroni), MySQL</text><rect x="335.0" y="70.0" width="290.0" height="390.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><rect x="335.0" y="70.0" width="290.0" height="36.0" rx="8" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">2. Multi-Primary (All-Active)</text><rect x="350.0" y="127.3" width="120.0" height="45.3" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="410.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вузол A (RW)</tspan><tspan x="410.0" dy="14.3">БД + Буфер</tspan></text><rect x="490.0" y="127.3" width="120.0" height="45.3" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="550.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Вузол B (RW)</tspan><tspan x="550.0" dy="14.3">БД + Буфер</tspan></text><rect x="390.0" y="232.3" width="180.0" height="45.3" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="480.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Вузол C (RW)</tspan><tspan x="480.0" dy="14.3">БД + Сертифікація</tspan></text><line x1="465.0" y1="150.0" x2="495.0" y2="150.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="415.0" y1="185.0" x2="440.0" y2="230.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="545.0" y1="185.0" x2="520.0" y2="230.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><text x="480.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Тотальний порядок подій</text><line x1="350.0" y1="330.0" x2="610.0" y2="330.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,3"/><text x="355.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис приймає будь-який вузол</text><text x="355.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Оптимістичне блокування (Commit Rollback)</text><text x="355.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кворумна сертифікація конфліктів</text><text x="355.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Приклади: Galera Cluster, Group Repl.</text><rect x="650.0" y="70.0" width="290.0" height="390.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><rect x="650.0" y="70.0" width="290.0" height="36.0" rx="8" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">3. Розподілений консенсус (NewSQL)</text><rect x="665.0" y="127.3" width="260.0" height="45.3" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="795.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Діапазон R1 [A..M]: Лідер Raft</tspan><tspan x="795.0" dy="14.3">Вузол 1 (Лідер) ↔ Вузли 2,3 (Фоловер)</tspan></text><rect x="665.0" y="207.3" width="260.0" height="45.3" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="795.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Діапазон R2 [N..Z]: Лідер Raft</tspan><tspan x="795.0" dy="14.3">Вузол 2 (Лідер) ↔ Вузли 1,3 (Фоловер)</tspan></text><line x1="795.0" y1="185.0" x2="795.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="665.0" y1="330.0" x2="925.0" y2="330.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,3"/><text x="670.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Автоматичне шардування на діапазони</text><text x="670.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Незалежний Raft-консенсус на діапазон</text><text x="670.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прозоре горизонтальне масштабування</text><text x="670.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Приклади: CockroachDB, TiDB, Spanner</text>
</svg>