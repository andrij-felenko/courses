<text x="790.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Кворум отримано (2/3)</tspan><tspan x="790.0" dy="13.0">Оренду лідера подовжено</tspan><tspan x="790.0" dy="13.0">Приймає нові транзакції</tspan></text>
<line x1="310.0" y1="155.0" x2="650.0" y2="155.0" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 4"/>
<rect x="410.0" y="138.0" width="140.0" height="34.0" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="480.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Мережевий розрив</text>
<rect x="370.0" y="220.0" width="220.0" height="90.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="480.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">Регіон C: Quorum Witness / Арбітр</text>
<text x="480.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Незалежний вузол кворуму</tspan><tspan x="480.0" dy="13.5">Видає оренду лідера (Lease Lock)</tspan><tspan x="480.0" dy="13.5">Голосує за промоушн Регіону B</tspan></text>
<line x1="370.0" y1="265.0" x2="300.0" y2="265.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="335.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Немає зв'язку</text>
<line x1="590.0" y1="265.0" x2="660.0" y2="265.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Кворум (2/3)</text>
<rect x="40.0" y="330.0" width="880.0" height="125.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Принципи запобігання Split-Brain (розходженню станів):</text>
<circle cx="65.0" cy="378.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="80.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Непарна кількість голосів:</text>
<text x="290.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Кворум (N/2 + 1) гарантує, що лише один сегмент мережі може зібрати більшість голосів.</text>
<circle cx="65.0" cy="400.0" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.0"/>
<text x="80.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ізоляція старої ноди (Fencing):</text>
<text x="290.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">STONITH / відкликання IAM-прав унеможливлює запис даних старим лідером в ізольованому ЦОД.</text>
<circle cx="65.0" cy="422.0" r="3.5" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="80.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Оренда з таймаутом (TTL Lease):</text>
<text x="290.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Лідер автоматично втрачає право на запис, якщо не може подовжити оренду в арбітра за T_lease.</text>
