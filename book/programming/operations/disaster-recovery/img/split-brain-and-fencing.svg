<rect x="40.0" y="70.0" width="260.0" height="36.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="170.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Регіон A (Основний / Isolated)</text>
<rect x="60.0" y="120.0" width="220.0" height="70.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="170.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Primary Вузол</text>
<text x="170.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Втратив зв'язок з Регіоном B</tspan><tspan x="170.0" dy="14.2">Вважає себе лідером!</tspan></text>
<rect x="60.0" y="205.0" width="220.0" height="85.0" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<text x="170.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">СТАТУС: FENCED (Ізольовано)</text>
<text x="170.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Кворум втрачено (1/3)</tspan><tspan x="170.0" dy="13.0">STONITH: живлення вимкнено</tspan><tspan x="170.0" dy="13.0">АБО переведено в Read-Only</tspan></text>
<rect x="660.0" y="70.0" width="260.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<rect x="660.0" y="70.0" width="260.0" height="36.0" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="790.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Регіон B (DR Standby -&gt; Promoted)</text>
<rect x="680.0" y="120.0" width="220.0" height="70.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="790.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">DR Standby -&gt; Новий Primary</text>
<text x="790.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Отримав голос арбітра</tspan><tspan x="790.0" dy="14.2">Успішний Failover</tspan></text>
