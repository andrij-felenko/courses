<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="24.0" y="26.0" width="912.0" height="225.0" rx="6" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.4"/>
<text x="40.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Жорсткий Purge (Hard Purge): шквал запитів на Origin (Cache Stampede)</text>
<rect x="45.0" y="72.0" width="260.0" height="155.0" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
<text x="175.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">1. Подія Hard Purge</text>
<text x="175.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Об'єкт негайно видаляється</tspan><tspan x="175.0" dy="14.9">з оперативної пам'яті та SSD</tspan><tspan x="175.0" dy="14.9">на всіх крайових PoP-вузлах.</tspan><tspan x="175.0" dy="14.9">Кеш-стан: EMPTY (пусто)</tspan></text>
<line x1="308.0" y1="151.0" x2="348.0" y2="151.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="350.0" y="72.0" width="260.0" height="155.0" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
<text x="480.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">2. Одночасні Cache Miss</text>
<text x="480.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">10 000 користувачів/сек</tspan><tspan x="480.0" dy="14.9">приходять на 50 PoP-вузлів.</tspan><tspan x="480.0" dy="14.9">Усі запити фіксують Miss.</tspan><tspan x="480.0" dy="14.9">Кожен потік летить на бекенд</tspan></text>
<line x1="613.0" y1="151.0" x2="653.0" y2="151.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="655.0" y="72.0" width="260.0" height="155.0" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="785.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">3. Перевантаження Origin</text>
<text x="785.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle"><tspan x="785.0" dy="0.0">База даних вичерпує пули з'єднань.</tspan><tspan x="785.0" dy="14.9">Час відповіді зростає до 8000 мс.</tspan><tspan x="785.0" dy="14.9">Шквал помилок 504 Gateway Timeout.</tspan><tspan x="785.0" dy="14.9">Каскадна відмова системи</tspan></text>
<rect x="24.0" y="265.0" width="912.0" height="230.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="40.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">М'який Purge (Soft Purge): фонове оновлення та схлопування (Request Coalescing)</text>
<rect x="45.0" y="311.0" width="260.0" height="160.0" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
<text x="175.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">1. Подія Soft Purge</text>
<text x="175.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Об'єкт НЕ видаляється з пам'яті.</tspan><tspan x="175.0" dy="14.9">TTL виставляється в 0,</tspan><tspan x="175.0" dy="14.9">але прапорець STALE активний.</tspan><tspan x="175.0" dy="14.9">Кеш-стан: STALE (застарілий)</tspan></text>
<line x1="308.0" y1="390.0" x2="348.0" y2="390.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="350.0" y="311.0" width="260.0" height="160.0" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
<text x="480.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">2. Stale-While-Revalidate</text>
<text x="480.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Користувачі миттєво отримують</tspan><tspan x="480.0" dy="14.9">stale-копію з латентністю &lt; 15 мс.</tspan><tspan x="480.0" dy="14.9">Перший запит ініціює Single-Flight.</tspan><tspan x="480.0" dy="14.9">Решта запитів чекають або читають stale</tspan></text>
<line x1="613.0" y1="390.0" x2="653.0" y2="390.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="655.0" y="311.0" width="260.0" height="160.0" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="785.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. Захищений Origin</text>
<text x="785.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="785.0" dy="0.0">Бекенд отримує РІВНО 1 запит</tspan><tspan x="785.0" dy="14.9">від Origin Shield проксі.</tspan><tspan x="785.0" dy="14.9">Нова версія атомарно замінює</tspan><tspan x="785.0" dy="14.9">stale-об'єкт у кеші без перерви</tspan></text>
</svg>