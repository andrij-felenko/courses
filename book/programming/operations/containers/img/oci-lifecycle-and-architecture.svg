<text x="478.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="478.0" dy="0.0">Визначає структуру OCI Bundle:</tspan><tspan x="478.0" dy="12.3">кореневий каталог rootfs та</tspan><tspan x="478.0" dy="12.3">декларативний файл config.json.</tspan></text>
