<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівнева стратегія алертингу за швидкістю випалювання бюджету</text>
<rect x="38.7" y="68.3" width="222.6" height="43.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Критичний 1 (Page)</tspan><tspan x="150.0" dy="14.3">Швидкість = 14.4x (2% / 1 год)</tspan></text>
<rect x="45.0" y="158.3" width="210.0" height="43.3" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Критичний 2 (Page)</tspan><tspan x="150.0" dy="14.3">Швидкість = 6x (5% / 6 год)</tspan></text>
<rect x="42.1" y="248.3" width="215.8" height="43.3" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Тікет 1 (Робочий час)</tspan><tspan x="150.0" dy="14.3">Швидкість = 3x (10% / 24 год)</tspan></text>
<rect x="45.0" y="338.4" width="210.0" height="43.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Тікет 2 (Робочий час)</tspan><tspan x="150.0" dy="14.3">Швидкість = 1x (10% / 3 дні)</tspan></text>
<rect x="305.0" y="68.3" width="370.0" height="43.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Коротке: 1 год (14.4x) AND Довге: 5 хв (14.4x)</tspan><tspan x="490.0" dy="14.3">Миттєве виявлення повної відмови системи</tspan></text>
<rect x="305.0" y="158.3" width="370.0" height="43.3" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Коротке: 6 год (6x) AND Довге: 30 хв (6x)</tspan><tspan x="490.0" dy="14.3">Виявлення стійкої деградації середнього темпу</tspan></text>
<rect x="305.0" y="248.3" width="370.0" height="43.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Коротке: 24 год (3x) AND Довге: 2 год (3x)</tspan><tspan x="490.0" dy="14.3">Повільне танення бюджету помилок</tspan></text>
<rect x="305.0" y="338.4" width="370.0" height="43.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Коротке: 3 дні (1x) AND Довге: 6 год (1x)</tspan><tspan x="490.0" dy="14.3">Фоновий витік надійності протягом місяця</tspan></text>
