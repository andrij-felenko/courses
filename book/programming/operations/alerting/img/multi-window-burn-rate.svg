<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Багатовіконна перевірка одночасно гарантує швидке реагування та відсутність передчасного зняття.</text>
