<rect x="22.0" y="265.0" width="916.0" height="140.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="38.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Ключові інваріанти управління інцидентом на кожному кроці:</text>
<circle cx="44.0" cy="313.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="56.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Операційний темп (Cadence):</text>
<text x="255.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Командир синхронізує статус кожні 10-15 хв; фіксує поточні гіпотези та призначає виконавців</text>
<circle cx="44.0" cy="335.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="56.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пріоритет пом'якшення:</text>
<text x="255.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Спочатку відновлюємо доступність користувачам (rollback, traffic shedding), глибокий дебаг — після</text>
<circle cx="44.0" cy="357.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="56.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Єдине джерело правди:</text>
<text x="255.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Один канал Slack (#inc-YYYYMMDD-slug) та один голосовий міст; сторонні обговорення заборонені</text>
<circle cx="44.0" cy="379.0" r="3.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="56.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Перехід до навчання:</text>
<text x="255.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Інцидент завершується не закриттям тікета, а постмортемом і впровадженням системних запобіжників</text>
</svg>