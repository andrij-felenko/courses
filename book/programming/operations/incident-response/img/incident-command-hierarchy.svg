<text x="147.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">Блокування, реплікація,</tspan><tspan x="147.0" dy="13.5">пули з'єднань, I/O</tspan></text>
