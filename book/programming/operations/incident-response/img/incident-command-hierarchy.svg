<rect x="491.0" y="330.0" width="200.0" height="90.0" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
<text x="591.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">Сервісна логіка</text>
<text x="591.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="591.0" dy="0.0">Помилки релізу, баги,</tspan><tspan x="591.0" dy="13.5">сторонні API, черги</tspan></text>
<line x1="175.0" y1="270.0" x2="591.0" y2="328.0" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow)"/>
