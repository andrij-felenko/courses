<text x="480.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Командир інциденту (Incident Commander)</text>
<text x="480.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Ухвалює рішення, веде темп, делегує завдання</tspan><tspan x="480.0" dy="14.3">Сам код НЕ пише і в терміналі НЕ дебажить</tspan></text>
<rect x="45.0" y="175.0" width="260.0" height="95.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="175.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Технічний координатор (Ops Lead)</text>
<text x="175.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Керує інженерними діями</tspan><tspan x="175.0" dy="13.7">Координує відкоти та конфігурації</tspan><tspan x="175.0" dy="13.7">Розподіляє задачі між експертами</tspan></text>
<rect x="350.0" y="175.0" width="260.0" height="95.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="480.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">Хронікер / Скрайб (Scribe)</text>
<text x="480.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Фіксує хронологію подій та рішень</tspan><tspan x="480.0" dy="13.7">Зберігає графіки метрик і логи</tspan><tspan x="480.0" dy="13.7">Готує основу для постмортему</tspan></text>
<rect x="655.0" y="175.0" width="260.0" height="95.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="785.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle" font-weight="700">Координатор комунікацій (Comms)</text>
<text x="785.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Оновлює публічну StatusPage</tspan><tspan x="785.0" dy="13.7">Інформує підтримку та менеджмент</tspan><tspan x="785.0" dy="13.7">Захищає команду від відволікань</tspan></text>
