<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поширення контексту крізь шари виконання</text>
<rect x="40.0" y="60.0" width="880.0" height="54.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Вхідний HTTP-запит  ──&gt;  Мідлвар видобуває / генерує контекст:</tspan><tspan x="480.0" dy="15.0">{ &quot;trace_id&quot;: &quot;4bf92f3577b34da6&quot;, &quot;request_id&quot;: &quot;req-9821&quot;, &quot;tenant_id&quot;: &quot;org_77&quot;, &quot;user_id&quot;: 401 }</tspan></text>
<line x1="480.0" y1="118.0" x2="480.0" y2="148.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="152.0" width="880.0" height="140.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Шар збереження контексту (Implicit Context / MDC / Execution Context)</text>
<rect x="60.0" y="194.0" width="260.0" height="82.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="190.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ThreadLocal / MDC</tspan><tspan x="190.0" dy="14.3">(Java, C++ per-thread)</tspan><tspan x="190.0" dy="14.3">Працює в 1 потоці;</tspan><tspan x="190.0" dy="14.3">губиться в пулах задач</tspan></text>
<rect x="350.0" y="194.0" width="260.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">AsyncLocalStorage</tspan><tspan x="480.0" dy="14.3">(Node.js / V8)</tspan><tspan x="480.0" dy="14.3">Автоматично слідує за</tspan><tspan x="480.0" dy="14.3">асинхронними промісами</tspan></text>
<rect x="640.0" y="194.0" width="260.0" height="82.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Явний context.Context</tspan><tspan x="770.0" dy="14.3">(Go / Rust explicit)</tspan><tspan x="770.0" dy="14.3">Передається першим</tspan><tspan x="770.0" dy="14.3">аргументом у виклики</tspan></text>
<line x1="480.0" y1="296.0" x2="480.0" y2="326.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="880.0" height="134.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="60.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Глибокий виклик: db.Exec(query) зазнав помилки</text>
<rect x="60.0" y="370.0" width="840.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">logger.Error(&quot;db_query_timeout&quot;, Field(&quot;table&quot;, &quot;orders&quot;), Field(&quot;elapsed_ms&quot;, 1250));</tspan></text>
<text x="60.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">→ Результат: логер автоматично об'єднує локальні поля виклику з контекстом запиту (trace_id, user_id, tenant_id)</text>
<text x="60.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">без потреби вручну протягувати 10 параметрів крізь 5 проміжних функцій сервісного шару.</text>
</svg>