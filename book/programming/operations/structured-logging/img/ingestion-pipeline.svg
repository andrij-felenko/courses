<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях логу: від коду застосунку до сховища запитів</text>
<rect x="30.0" y="70.0" width="150.0" height="76.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="97.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">1 · Застосунок</tspan><tspan x="105.0" dy="15.0">нуль-алокаційний</tspan><tspan x="105.0" dy="15.0">енкодер + буфер</tspan></text>
<rect x="220.0" y="70.0" width="150.0" height="76.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="295.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">2 · Фоновий потік</tspan><tspan x="295.0" dy="12.3">неблокувальний</tspan><tspan x="295.0" dy="12.3">пакетний скид у stdout</tspan></text>
<rect x="410.0" y="70.0" width="150.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="485.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">3 · Агент вузла</tspan><tspan x="485.0" dy="13.7">Vector / Fluent Bit</tspan><tspan x="485.0" dy="13.7">(збір з контейнера)</tspan></text>
<rect x="600.0" y="70.0" width="150.0" height="76.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="675.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">4 · Буфер черги</tspan><tspan x="675.0" dy="12.3">Kafka / Redpanda</tspan><tspan x="675.0" dy="12.3">(захист від сплесків)</tspan></text>
<rect x="790.0" y="70.0" width="140.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">5 · Сховище</tspan><tspan x="860.0" dy="13.7">ClickHouse / Loki /</tspan><tspan x="860.0" dy="13.7">Elasticsearch</tspan></text>
<line x1="182.0" y1="108.0" x2="218.0" y2="108.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="372.0" y1="108.0" x2="408.0" y2="108.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="562.0" y1="108.0" x2="598.0" y2="108.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="752.0" y1="108.0" x2="788.0" y2="108.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24.0" y="176.0" width="912.0" height="276.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.4"/>
<text x="44.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Інженерні гарантії та ціна на кожному щаблі конвеєра</text>
<rect x="44.0" y="224.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="134.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">Гарячий шлях коду</tspan></text>
<text x="236.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Логер НЕ має виділяти пам'ять на купі (zero allocation) і не блокує робочі потоки під замками.</text>
<rect x="44.0" y="268.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="134.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">Міжпроцесна межа</tspan></text>
<text x="236.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Застосунок пише JSON-лінії в stdout/pipe; ОС керує буфером каналу (~64 КБ); переповнення веде до дропу або блокування.</text>
<rect x="44.0" y="312.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="134.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">Збір та парсинг</tspan></text>
<text x="236.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Агент вузла збагачує логи метаданими пода (node_name, container_id, namespace) без втручання в код.</text>
<rect x="44.0" y="356.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="134.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">Транспортний буфер</tspan></text>
<text x="236.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Шина повідомлень згладжує навантаження під час інцидентів, коли обсяг логів зростає в 10–100 разів.</text>
<rect x="44.0" y="400.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="134.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">Індексація й пошук</tspan></text>
<text x="236.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Колонкове збереження стискає однакові ключі на 85–90% і дозволяє читати лише потрібні стовпчики полів.</text>
</svg>