<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура швидкого логера: наївний підхід проти нуль-алокаційного</text>
<rect x="24.0" y="56.0" width="912.0" height="196.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="44.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">НАЇВНИЙ ЛОГЕР (String interpolation + Mutex + Синхронний I/O)</text>
<rect x="44.0" y="100.0" width="260.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="174.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">1 · Форматування рядка</tspan><tspan x="174.0" dy="14.3">`sprintf` / `fmt.Sprintf`</tspan><tspan x="174.0" dy="14.3">Виділення на купі (heap malloc)</tspan></text>
<rect x="330.0" y="100.0" width="260.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">2 · Захоплення замка</tspan><tspan x="460.0" dy="14.3">`std::mutex.lock()`</tspan><tspan x="460.0" dy="14.3">Контеншн між усіма ядрами</tspan></text>
<rect x="616.0" y="100.0" width="290.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="761.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">3 · Синхронний сискол</tspan><tspan x="761.0" dy="14.3">`write(fd, buf, len)`</tspan><tspan x="761.0" dy="14.3">Потік чекає на заповнений pipe</tspan></text>
<line x1="306.0" y1="134.0" x2="328.0" y2="134.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="592.0" y1="134.0" x2="614.0" y2="134.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="44.0" y="182.0" width="862.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="475.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="475.0" dy="0.0">Наслідок: 200–800 нс на запис, сплески затримки GC через мільйони дрібних рядків,</tspan><tspan x="475.0" dy="14.3">деградація пропускної здатності сервісу у 2–4 рази під навантаженням.</tspan></text>
<rect x="24.0" y="270.0" width="912.0" height="230.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="44.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">НУЛЬ-АЛОКАЦІЙНИЙ ЛОГЕР (Попередньо виділений буфер + SPSC кільце + фоновий батчинг)</text>
<rect x="44.0" y="314.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="174.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">1 · Кодування в стек/пул</tspan><tspan x="174.0" dy="14.3">Прямий запис байтів у буфер</tspan><tspan x="174.0" dy="14.3">0 виділень пам'яті (0 allocs)</tspan></text>
<rect x="330.0" y="314.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">2 · Беззамкова черга</tspan><tspan x="460.0" dy="14.3">Lock-free Ring Buffer</tspan><tspan x="460.0" dy="14.3">Атомарний рух покажчика</tspan></text>
<rect x="616.0" y="314.0" width="290.0" height="78.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="761.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">3 · Фоновий записувач</tspan><tspan x="761.0" dy="14.3">`writev()` пакетів по 64 КБ</tspan><tspan x="761.0" dy="14.3">Робочі потоки вільні негайно</tspan></text>
<line x1="306.0" y1="353.0" x2="328.0" y2="353.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="592.0" y1="353.0" x2="614.0" y2="353.0" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="44.0" y="406.0" width="862.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="475.0" y="440.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Результат: 10–35 нс на запис (у 20 разів швидше), нульове навантаження на Garbage Collector,</tspan><tspan x="475.0" dy="15.0">стабільний p99.9 час реакції мікросервісу навіть за інтенсивного логування.</tspan></text>
</svg>