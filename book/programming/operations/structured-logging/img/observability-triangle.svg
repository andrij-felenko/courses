<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник спостережності: роль структурованих логів</text>
<rect x="24.0" y="66.0" width="280.0" height="240.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="164.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">МЕТРИКИ</text>
<text x="164.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Числові агрегати (числа)</text>
<rect x="38.0" y="130.0" width="252.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="164.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="164.0" dy="0.0">«Що зламалося і коли?»</tspan></text>
<text x="44.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Агреговані лічильники й таймери</text>
<text x="44.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Низька вартість збереження</text>
<text x="44.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Не мають контексту окремого виклику</text>
<rect x="330.0" y="66.0" width="280.0" height="240.0" rx="10" fill="#fdf6e3" stroke="#b08900" stroke-width="1.8"/>
<text x="470.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">РОЗПОДІЛЕНІ ТРЕЙСИ</text>
<text x="470.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Причинно-наслідкові ланцюги</text>
<rect x="344.0" y="130.0" width="252.0" height="36.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">«Де саме виникла затримка?»</tspan></text>
<text x="350.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дерево спанів між сервісами</text>
<text x="350.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Шлях запиту крізь мікросервіси</text>
<text x="350.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фіксують тривалість етапів</text>
<rect x="636.0" y="66.0" width="280.0" height="240.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="776.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СТРУКТУРОВАНІ ЛОГИ</text>
<text x="776.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Детальні фактичні події</text>
<rect x="650.0" y="130.0" width="252.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="776.0" dy="0.0">«Чому саме це сталося?»</tspan></text>
<text x="656.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Довільний набір типізованих полів</text>
<text x="656.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вичерпний контекст помилки</text>
<text x="656.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повна деталізація вхідних даних</text>
<rect x="24.0" y="324.0" width="892.0" height="134.0" rx="10" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/>
<text x="44.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Міст кореляції: trace_id та span_id всередині структурованого логу</text>
<rect x="44.0" y="370.0" width="852.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="400.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">У структурованому лозі trace_id автоматично зв'язує спан трейсингу з усіма логами операції:</tspan><tspan x="470.0" dy="14.3">Алерт метрики (5xx &gt; 1%) ──&gt; Відкриття спану в трейсі (затримка 3004 мс) ──&gt; Перехід за trace_id до точного логу з помилкою</tspan></text>
</svg>