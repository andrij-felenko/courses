<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="25.0" y="25.0" width="440.0" height="430.0" rx="6" fill="#fffaf5" stroke="#ea580c" stroke-width="1.5"/>
<text x="245.0" y="49.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Програмний метод: EPT/NPT Write Protection</text>
<rect x="41.0" y="69.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="53.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="start" font-weight="700">1. Скидання біта W у таблицях EPT</text>
<text x="53.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Гіпервізор знімає дозвіл на запис у PTE (Write=0)</text>
<line x1="245.0" y1="128.0" x2="245.0" y2="138.0" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="41.0" y="139.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="53.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="start" font-weight="700">2. Спроба запису гостьовим vCPU</text>
<text x="53.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Інструкція гостя викликає апаратне виключення EPT Violation</text>
<line x1="245.0" y1="198.0" x2="245.0" y2="208.0" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="41.0" y="209.0" width="408.0" height="58.0" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="53.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">3. Дорогий вихід у корінь (VM-Exit)</text>
<text x="53.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Процесор перериває гостя, зберігає стан і перемикається в KVM</text>
<line x1="245.0" y1="268.0" x2="245.0" y2="278.0" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="41.0" y="279.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="53.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="start" font-weight="700">4. Встановлення біта в Dirty Bitmap</text>
<text x="53.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">KVM позначає сторінку як брудну у виділеній бітовій масці</text>
<line x1="245.0" y1="338.0" x2="245.0" y2="348.0" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="41.0" y="349.0" width="408.0" height="58.0" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="53.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">5. Відновлення Write=1 та VM-Entry</text>
<text x="53.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">KVM дозволяє запис та повертає керування гостю (~1500 тактів)</text>
<text x="245.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">Ціна: Десятки тисяч VM-Exit на секунду деградують продуктивність</text>
<rect x="495.0" y="25.0" width="440.0" height="430.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="715.0" y="49.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Апаратний метод: Intel PML (Page Modification Logging)</text>
<rect x="511.0" y="69.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="523.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">1. Активація біта PML у VMCS</text>
<text x="523.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Гіпервізор виділяє 4 КБ буфер у пам'яті для PML (512 записів)</text>
<line x1="715.0" y1="128.0" x2="715.0" y2="138.0" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="511.0" y="139.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="523.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">2. Запис гостя в пам'ять (Write)</text>
<text x="523.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Гість модифікує сторінку без переривання виконання</text>
<line x1="715.0" y1="198.0" x2="715.0" y2="208.0" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="511.0" y="209.0" width="408.0" height="58.0" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="523.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">3. Апаратне логування мікрокодом (0 тактів)</text>
<text x="523.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Процесор сам записує GPA у буфер PML без виходу VM-Exit!</text>
<line x1="715.0" y1="268.0" x2="715.0" y2="278.0" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="511.0" y="279.0" width="408.0" height="58.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="523.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">4. Заповнення 512 записів буфера</text>
<text x="523.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лише після 512 модифікованих сторінок виникає PML Full VM-Exit</text>
<line x1="715.0" y1="338.0" x2="715.0" y2="348.0" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="511.0" y="349.0" width="408.0" height="58.0" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="523.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">5. Пакетне копіювання в Dirty Bitmap</text>
<text x="523.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">KVM зчитує одразу 512 сторінок за один системний перехід</text>
<text x="715.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Зиск: Зменшення кількості VM-Exit у сотні разів під час міграції</text>
</svg>