<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="520.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="25.0" y="25.0" width="440.0" height="490.0" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.6"/>
<text x="245.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Ітеративне Pre-Copy (Попереднє копіювання)</text>
<rect x="41.0" y="71.0" width="408.0" height="84.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="245.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Ітерація 0: Повний дамп пам'яті</text>
<text x="245.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Передача всієї RAM по мережі</tspan><tspan x="245.0" dy="14.2">Гість продовжує працювати на вузлі-джерелі</tspan><tspan x="245.0" dy="14.2">Сторінки записуються в бітову маску (dirty tracking)</tspan></text>
<line x1="245.0" y1="156.0" x2="245.0" y2="168.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="41.0" y="169.0" width="408.0" height="84.0" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="245.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Ітерації 1..N: Передача брудних сторінок</text>
<text x="245.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Повторне надсилання лише змінених сторінок</tspan><tspan x="245.0" dy="14.2">Гість далі генерує нові модифікації</tspan><tspan x="245.0" dy="14.2">Перевірка умови збіжності: V_dirty ≤ V_threshold</tspan></text>
<line x1="245.0" y1="254.0" x2="245.0" y2="266.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="41.0" y="267.0" width="408.0" height="84.0" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="245.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Зупинка і досилання (Stop-and-Copy)</text>
<text x="245.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Пауза vCPU гостя на джерелі (Downtime 20-50 мс)</tspan><tspan x="245.0" dy="14.2">Досилання залишку брудних сторінок</tspan><tspan x="245.0" dy="14.2">Серіалізація і передача стану пристроїв (VMCS, vAPIC)</tspan></text>
<line x1="245.0" y1="352.0" x2="245.0" y2="364.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="41.0" y="365.0" width="408.0" height="84.0" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="245.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Активація на цільовому вузлі</text>
<text x="245.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Десеріалізація регістрів vCPU і пристроїв</tspan><tspan x="245.0" dy="14.2">Запуск vCPU на цільовому вузлі</tspan><tspan x="245.0" dy="14.2">Розсилка Gratuitous ARP для перемикання мережі</tspan></text>
<rect x="41.0" y="467.0" width="408.0" height="38.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="245.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Властивість: Безпечний відкат при збої, але ризик незабіжності</text>
<rect x="495.0" y="25.0" width="440.0" height="490.0" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.6"/>
<text x="715.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">Post-Copy (Перенесення після копіювання)</text>
<rect x="511.0" y="71.0" width="408.0" height="84.0" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="715.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Миттєва зупинка на джерелі</text>
<text x="715.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Коротка початкова пауза vCPU на джерелі</tspan><tspan x="715.0" dy="14.2">Серіалізація та передача стану vCPU і пристроїв</tspan><tspan x="715.0" dy="14.2">Пам'ять залишається на вузлі-джерелі</tspan></text>
<line x1="715.0" y1="156.0" x2="715.0" y2="168.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="511.0" y="169.0" width="408.0" height="84.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="715.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Негайний старт на цілі (з порожньою RAM)</text>
<text x="715.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Реєстрація діапазонів пам'яті через userfaultfd</tspan><tspan x="715.0" dy="14.2">Запуск vCPU на цільовому вузлі</tspan><tspan x="715.0" dy="14.2">Розсилка Gratuitous ARP на початку процесу</tspan></text>
<line x1="715.0" y1="254.0" x2="715.0" y2="266.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="511.0" y="267.0" width="408.0" height="84.0" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="715.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Сторінкові збої на вимогу (On-Demand Faults)</text>
<text x="715.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">vCPU звертається до відсутньої сторінки → Page Fault</tspan><tspan x="715.0" dy="14.2">userfaultfd перехоплює збій у QEMU</tspan><tspan x="715.0" dy="14.2">Запит сторінки через мережу з джерела (високий пріоритет)</tspan></text>
<line x1="715.0" y1="352.0" x2="715.0" y2="364.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="511.0" y="365.0" width="408.0" height="84.0" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="715.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Фонова докачка залишку пам'яті</text>
<text x="715.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Фоновий потік послідовно передає холодні сторінки</tspan><tspan x="715.0" dy="14.2">Використання ioctl(UFFDIO_COPY) для вставки сторінок</tspan><tspan x="715.0" dy="14.2">Гарантоване завершення рівно за один повний прохід</tspan></text>
<rect x="511.0" y="467.0" width="408.0" height="38.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="715.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Властивість: Гарантована збіжність, але збій мережі вбиває ВМ</text>
</svg>