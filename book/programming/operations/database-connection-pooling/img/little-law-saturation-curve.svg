<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="80.0" y="70.0" width="260.0" height="330.0" rx="6" fill="#f0fdf4" stroke="none" stroke-width="1.5"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Зона 1: Лінійний ріст</text>
<text x="210.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Pool Size &lt; CPU Cores</text>
