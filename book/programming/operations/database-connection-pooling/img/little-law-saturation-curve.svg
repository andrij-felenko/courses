<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle" font-weight="700">Зона 2: Оптимум</text>
<text x="430.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a16207" text-anchor="middle">Cores * 2 + Spindles</text>
<rect x="520.0" y="70.0" width="360.0" height="330.0" rx="6" fill="#fef2f2" stroke="none" stroke-width="1.5"/>
<text x="700.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Зона 3: Деградація (Thrashing / Bottleneck)</text>
<text x="700.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">Контекстні перемикання, блокування пам'яті та диска</text>
<line x1="80.0" y1="400.0" x2="900.0" y2="400.0" stroke="#333333" stroke-width="1.8"/>
<line x1="80.0" y1="400.0" x2="80.0" y2="50.0" stroke="#333333" stroke-width="1.8"/>
<line x1="880.0" y1="400.0" x2="910.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="80.0" y1="70.0" x2="80.0" y2="40.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="905.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Розмір пулу з'єднань (Pool Size / Конкурентність)</text>
<text x="70.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пропускна здатність (RPS) / Затримка (Latency)</text>
