<text x="480.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Watch HTTP/gRPC потік з API Server</text>
<text x="480.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Локальний Informer Cache (Reflector/Lister)</text>
<rect x="665.0" y="235.0" width="270.0" height="80.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="800.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">2. Аналіз різниці (Diff)</text>
<text x="800.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Δ = Desired.Spec - Actual.Status</text>
<text x="800.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Виявлено дефіцит або зміну образу</text>
<rect x="335.0" y="395.0" width="290.0" height="80.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="480.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">3. Виправлення (Act / Mutate)</text>
<text x="480.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Асинхронний виклик API: POST / PATCH / DELETE</text>
<text x="480.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Ідемпотентне створення/видалення подів</text>
<rect x="25.0" y="235.0" width="270.0" height="80.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="160.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">4. Фіксація статусу (Status)</text>
<text x="160.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Оптимістичне блокування (resourceVersion)</text>
<text x="160.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Черга з експоненційним backoff при збоях</text>
