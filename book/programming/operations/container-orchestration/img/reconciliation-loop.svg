<rect x="10.0" y="10.0" width="940.0" height="480.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="480.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">Цикл узгодження стану (Reconciliation Loop)</text>
<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Безперервний порівняльний автомат: Бажаний стан (Spec) проти Реального стану (Status)</text>
