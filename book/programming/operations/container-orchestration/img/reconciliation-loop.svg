<line x1="160.0" y1="233.0" x2="333.0" y2="132.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="355.0" y="222.5" width="250.0" height="105.0" rx="6" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
<text x="480.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Фундаментальні гарантії</text>
<text x="480.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Level-triggered (чутливий до стану)</text>
<text x="480.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Self-healing (самовідновлення)</text>
<text x="480.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">• Сходження до ідеалу при збоях</text>
</svg>