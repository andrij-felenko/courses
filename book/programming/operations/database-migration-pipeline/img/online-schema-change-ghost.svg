<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній механізм Online Schema Change (gh-ost / pt-osc)</text>
<rect x="40.0" y="70.0" width="280.0" height="410.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="180.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Оригінальна таблиця: users</text>
<text x="180.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Живий продакшн-трафік (Read / Write)</text>
<rect x="81.9" y="141.3" width="196.1" height="37.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="180.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Додаток / Клієнтські запити</tspan><tspan x="180.0" dy="14.3">(INSERT / UPDATE / DELETE)</tspan></text>
<line x1="180.0" y1="190.0" x2="180.0" y2="225.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.8" y="247.5" width="198.4" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="180.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Поточні дані (100 млн рядків)</tspan><tspan x="180.0" dy="13.0">• Схема v1</tspan><tspan x="180.0" dy="13.0">• Відсутність блокування таблиці</tspan><tspan x="180.0" dy="13.0">• Неперервна доступність</tspan></text>
<rect x="46.9" y="402.5" width="266.2" height="35.0" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.2"/><text x="180.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Журнал бінарних логів (Binlog / WAL)</tspan><tspan x="180.0" dy="13.0">Реплікаційний потік змін у реальному часі</tspan></text>
<rect x="360.0" y="70.0" width="280.0" height="410.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">OSC Контролер (gh-ost)</text>
<text x="500.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронний оркестратор міграції</text>
<rect x="405.6" y="141.0" width="188.7" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="155.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Зчитувач подій (Streamer):</tspan><tspan x="500.0" dy="13.0">Слухає binlog і перехоплює нові</tspan><tspan x="500.0" dy="13.0">зміни, що надходять у users</tspan></text>
<rect x="399.9" y="231.0" width="200.1" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. Чанковий копіювальник:</tspan><tspan x="500.0" dy="13.0">Копіює існуючі рядкиusersпакетами</tspan><tspan x="500.0" dy="13.0">(WHERE id BETWEEN a AND b)</tspan></text>
<rect x="397.1" y="321.0" width="205.8" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Контролер тротлінгу:</tspan><tspan x="500.0" dy="13.0">Перевіряє лаг реплік і CPU.</tspan><tspan x="500.0" dy="13.0">Призупиняє бекфіл при навантаженні</tspan></text>
<rect x="410.3" y="411.0" width="179.4" height="48.0" rx="6" fill="#e8f8ed" stroke="#27ae60" stroke-width="1.2"/><text x="500.0" y="425.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">4. Атомарний Cutover:</tspan><tspan x="500.0" dy="13.0">Блокування users на 10 мс,</tspan><tspan x="500.0" dy="13.0">RENAME users &lt;-&gt; _users_gho</tspan></text>
<rect x="680.0" y="70.0" width="280.0" height="410.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="820.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">Ghost-таблиця: _users_gho</text>
<text x="820.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тіньова структура з новою схемою v2</text>
<rect x="720.0" y="141.0" width="200.1" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="820.0" y="155.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Створення порожньої таблиці</tspan><tspan x="820.0" dy="13.0">та застосування DDL (ALTER TABLE)</tspan><tspan x="820.0" dy="13.0">на нульовому обсязі даних</tspan></text>
<rect x="728.5" y="236.0" width="183.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="820.0" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Застосування бінарних змін</tspan><tspan x="820.0" dy="13.0">та поступове заповнення чанків</tspan><tspan x="820.0" dy="13.0">з перетворенням нових полів</tspan></text>
<rect x="730.3" y="339.5" width="179.4" height="61.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/><text x="820.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Стан таблиці:</tspan><tspan x="820.0" dy="13.0">• 100% даних синхронізовано</tspan><tspan x="820.0" dy="13.0">• Нові індекси побудовано</tspan><tspan x="820.0" dy="13.0">• Готовність до підміни</tspan></text>
<rect x="717.9" y="439.0" width="204.2" height="22.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="820.0" y="453.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Після Cutover: Стає новою users</tspan></text>
