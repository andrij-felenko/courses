<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та фази конвеєра міграцій бази даних у CI/CD</text>
<rect x="30.0" y="60.0" width="280.0" height="200.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Статичний аналіз у CI</text>
<rect x="67.9" y="102.5" width="204.2" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="170.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Парсинг AST та SQL-лінтинг</tspan><tspan x="170.0" dy="13.0">(Squawk / Atlas / Custom Rules)</tspan></text>
<rect x="47.2" y="151.0" width="245.7" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="170.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Перевірка блокувань:</tspan><tspan x="170.0" dy="13.0">• Заборона важких локів (AccessExclusive)</tspan><tspan x="170.0" dy="13.0">• Обов'язковий lock_timeout і defaults</tspan></text>
<rect x="45.0" y="225.5" width="249.9" height="19.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="170.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Результат: Блокування PR при ризику простою</tspan></text>
<line x1="310.0" y1="160.0" x2="360.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="360.0" y="60.0" width="280.0" height="200.0" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
<text x="500.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Тестування на тіньовій БД</text>
<rect x="373.1" y="102.5" width="253.8" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ефемерний клон продакшн-схеми</tspan><tspan x="500.0" dy="13.0">(Анонімізований снепшот або Thin Clone)</tspan></text>
<rect x="385.7" y="151.0" width="228.6" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Прогін міграції (Dry-Run):</tspan><tspan x="500.0" dy="13.0">• Вимірювання часу виконання DDL</tspan><tspan x="500.0" dy="13.0">• Перевірка ідемпотентності та відкату</tspan></text>
<rect x="394.6" y="225.5" width="210.9" height="19.0" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.0"/><text x="500.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Результат: Верифікація безпеки схеми</tspan></text>
<line x1="640.0" y1="160.0" x2="690.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="690.0" y="60.0" width="280.0" height="200.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="830.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Пре-деплой запуск (CD)</text>
<rect x="696.9" y="102.5" width="266.2" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Ізольований K8s Job / Runner</tspan><tspan x="830.0" dy="13.0">(Відокремлений від запуску подів сервісу)</tspan></text>
<rect x="704.3" y="151.0" width="251.4" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Захоплення Advisory Lock:</tspan><tspan x="830.0" dy="13.0">• Захист від паралельного виконання</tspan><tspan x="830.0" dy="13.0">• Транзакційне оновлення schema_migrations</tspan></text>
<rect x="721.8" y="225.5" width="216.5" height="19.0" rx="6" fill="#e8f8ed" stroke="#27ae60" stroke-width="1.0"/><text x="830.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Результат: Схема v2 готова ДО коду v2</tspan></text>
<line x1="830.0" y1="260.0" x2="830.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="310.0" width="490.0" height="210.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="725.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">4. Розкатка коду додатка (Rolling / Blue-Green)</text>
<rect x="519.5" y="357.5" width="411.0" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="725.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Одночасна робота подів v1 та v2 зі схемою v2</tspan><tspan x="725.0" dy="13.0">(Сувора зворотна сумісність: v1 ігнорує нові поля, v2 заповнює обидва)</tspan></text>
<rect x="579.5" y="412.5" width="291.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="725.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Повний перехід трафіку на v2</tspan><tspan x="725.0" dy="13.0">(Усі поди v1 успішно виведені з експлуатації)</tspan></text>
<rect x="549.5" y="475.0" width="351.0" height="20.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.0"/><text x="725.0" y="488.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Гарантія: Нульовий простій для клієнтів (Zero Downtime)</tspan></text>
<line x1="480.0" y1="415.0" x2="370.0" y2="415.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="310.0" width="340.0" height="210.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="200.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Пост-деплой та асинхронний бекфіл</text>
<rect x="88.6" y="351.0" width="222.9" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="200.0" y="365.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Фонові воркери міграції даних:</tspan><tspan x="200.0" dy="13.0">• Чанковий бекфіл історичних рядків</tspan><tspan x="200.0" dy="13.0">• Адаптивний тротлінг за лагом реплік</tspan></text>
<rect x="62.9" y="406.0" width="274.2" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="200.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Фінальне прибирання (Contract):</tspan><tspan x="200.0" dy="13.0">• Видалення старих колонок у наступному релізі</tspan><tspan x="200.0" dy="13.0">• Очищення тригерів та тимчасових таблиць</tspan></text>
<rect x="91.8" y="475.5" width="216.5" height="19.0" rx="6" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="1.0"/><text x="200.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Стан: Чиста нова схема без артефактів</tspan></text>
</svg>