<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мутабельна проти Імутабельної інфраструктури (Pets vs Cattle)</text>
<rect x="40.0" y="70.0" width="440.0" height="420.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="260.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">МУТАБЕЛЬНА («Домашні улюбленці» / Pets)</text>
<rect x="60.0" y="125.0" width="400.0" height="48.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Базовий сервер розгортається один раз (v1.0)</text>
<rect x="60.0" y="183.0" width="400.0" height="48.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Оновлення: SSH / Ansible накочує патчі наживо</text>
<rect x="60.0" y="241.0" width="400.0" height="48.0" rx="4" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Накопичення артефактів, сміття, тимчасових ліб</text>
<rect x="60.0" y="299.0" width="400.0" height="48.0" rx="4" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Непомітний дрейф конфігурацій («Сніжинки»)</text>
<rect x="60.0" y="357.0" width="400.0" height="48.0" rx="4" fill="#ffe4e6" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Сервер унікальний: страшно перезавантажити чи видалити</text>
<text x="260.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">• Модифікація ресурсів на місці (In-place)</text>
<text x="260.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">• Висока ймовірність невідтворюваних збоїв</text>
<rect x="520.0" y="70.0" width="440.0" height="420.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="740.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">ІМУТАБЕЛЬНА («Змінне стадо» / Cattle)</text>
<rect x="540.0" y="125.0" width="400.0" height="48.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Збірка незмінного образу (Golden Image / AMI / OCI)</text>
<rect x="540.0" y="183.0" width="400.0" height="48.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Розгортання абсолютно однакових екземплярів (v1.0)</text>
<rect x="540.0" y="241.0" width="400.0" height="48.0" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Потрібне оновлення? Збирається новий образ v1.1</text>
<rect x="540.0" y="299.0" width="400.0" height="48.0" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Підняття нових серверів v1.1 поруч зі старими v1.0</text>
<rect x="540.0" y="357.0" width="400.0" height="48.0" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Знищення старих серверів (Blue/Green або Rolling)</text>
<text x="740.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">• Ресурси ніколи не змінюються на місці</text>
<text x="740.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">• 100% відтворюваність та безпечний відкат</text>
</svg>