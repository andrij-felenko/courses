<text x="500.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">3. Рушій планування (Plan)</text>
<text x="500.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Звірка: Desired vs State vs Real</tspan><tspan x="500.0" dy="14.9">Обчислення дифу (Diff Engine)</tspan><tspan x="500.0" dy="14.9">Побудова графа залежностей (DAG)</tspan><tspan x="500.0" dy="14.9">План дій: Create, Update, Replace</tspan></text>
