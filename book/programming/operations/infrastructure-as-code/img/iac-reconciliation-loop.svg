<text x="850.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Cloud API (AWS, GCP, Azure)</tspan><tspan x="850.0" dy="14.9">Фізичні ресурси (VPC, DB)</tspan><tspan x="850.0" dy="14.9">Опитування через Refresh</tspan></text>
