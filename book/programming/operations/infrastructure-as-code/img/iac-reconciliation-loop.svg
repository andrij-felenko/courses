<text x="150.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">4. Блокування стану</text>
<text x="150.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Distributed State Lock</tspan><tspan x="150.0" dy="14.9">Захист від гонитви (Race)</tspan><tspan x="150.0" dy="14.9">Блокування у DynamoDB / S3</tspan></text>
<rect x="740.0" y="395.0" width="220.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
