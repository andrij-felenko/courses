<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Декларативний код у Git</tspan><tspan x="150.0" dy="14.9">HCL / YAML / TypeScript</tspan><tspan x="150.0" dy="14.9">Версійована схема ресурсів</tspan></text>
