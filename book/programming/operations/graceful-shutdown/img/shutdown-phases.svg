<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<line x1="30.0" y1="270.0" x2="920.0" y2="270.0" stroke="#333333" stroke-width="1.8"/>
<line x1="890.0" y1="270.0" x2="930.0" y2="270.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="915.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Час →</text>
<rect x="24.0" y="90.0" width="168.0" height="130.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="108.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Сигнал і статус</text>
<text x="108.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="108.0" dy="0.0">SIGTERM від оркестратора</tspan><tspan x="108.0" dy="15.4">Зміна Readiness: 503</tspan><tspan x="108.0" dy="15.4">Сповіщення Ingress</tspan></text>
<line x1="108.0" y1="220.0" x2="108.0" y2="270.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="108.0" cy="270.0" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<line x1="195.0" y1="155.0" x2="209.0" y2="155.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="212.0" y="90.0" width="168.0" height="130.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.8"/>
<text x="296.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Пауза поширення</text>
<text x="296.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="296.0" dy="0.0">Очікування оновлення IP</tspan><tspan x="296.0" dy="15.4">Маршрути вилучають вузол</tspan><tspan x="296.0" dy="15.4">Нові SYN ще долітають</tspan></text>
<line x1="296.0" y1="220.0" x2="296.0" y2="270.0" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="296.0" cy="270.0" r="4.5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
<line x1="383.0" y1="155.0" x2="397.0" y2="155.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="400.0" y="90.0" width="168.0" height="130.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="484.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">3. Дренаж запитів</text>
<text x="484.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="484.0" dy="0.0">Закриття listen-сокета</tspan><tspan x="484.0" dy="15.4">Connection: close / GOAWAY</tspan><tspan x="484.0" dy="15.4">Доведення inflight-робіт</tspan></text>
<line x1="484.0" y1="220.0" x2="484.0" y2="270.0" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="484.0" cy="270.0" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
<line x1="571.0" y1="155.0" x2="585.0" y2="155.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="588.0" y="90.0" width="168.0" height="130.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="672.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">4. Згортання ресурсів</text>
<text x="672.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Flush логів і трейсів</tspan><tspan x="672.0" dy="15.4">Закриття пулів БД/кешу</tspan><tspan x="672.0" dy="15.4">Звільнення дескрипторів</tspan></text>
<line x1="672.0" y1="220.0" x2="672.0" y2="270.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="672.0" cy="270.0" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<line x1="759.0" y1="155.0" x2="773.0" y2="155.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="776.0" y="90.0" width="168.0" height="130.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="860.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">5. Фінал / Дедлайн</text>
<text x="860.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Чистий вихід exit(0)</tspan><tspan x="860.0" dy="15.4">АБО таймер дедлайну</tspan><tspan x="860.0" dy="15.4">Force-abort до SIGKILL</tspan></text>
<line x1="860.0" y1="220.0" x2="860.0" y2="270.0" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="860.0" cy="270.0" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<rect x="24.0" y="310.0" width="912.0" height="135.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Дії системних рівнів під час штатного вимкнення:</text>
<circle cx="45.0" cy="358.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="58.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Балансувальник / Ingress:</text>
<text x="250.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Викреслює IP зі списку бекендів (readiness probe = false, endpoint removal)</text>
<circle cx="45.0" cy="380.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="58.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Серверний процес:</text>
<text x="250.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Перестає брати нові TCP-з'єднання, досилає 200 OK з Connection: close / GOAWAY</text>
<circle cx="45.0" cy="402.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="58.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Воркери і черги:</text>
<text x="250.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Зупиняють вибірку (basic.cancel / pause), докручують активні транзакції, роблять ACK</text>
<circle cx="45.0" cy="424.0" r="3.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="58.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Сторожовий таймер:</text>
<text x="250.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Запобігає зависанню на недоступних залежностях; форсує вихід до прильоту SIGKILL</text>
</svg>