<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два світи: текст для людини, числа для машини</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий намір — два геть різні описи</text>
<rect x="50.0" y="110.0" width="330.0" height="200.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.5"/>
<text x="70.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8fcf9f" text-anchor="start" font-weight="bold" font-style="normal">вихідний код (для людини)</text>
<text x="70.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">OUT |= (1 &lt;&lt; 2);</text>
<text x="70.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7a9a86" text-anchor="start" font-weight="normal" font-style="italic">// увімкнути біт 2</text>
<text x="215.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">легко читає людина</text>
<line x1="388.0" y1="200.0" x2="438.0" y2="200.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="450.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">?</text>
<line x1="462.0" y1="200.0" x2="512.0" y2="200.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="450.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">переклад</text>
<rect x="520.0" y="110.0" width="330.0" height="200.0" rx="8" fill="#101418" stroke="#000000" stroke-width="1.5"/>
<text x="540.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7fa6bf" text-anchor="start" font-weight="bold" font-style="normal">машинний код (для ядра)</text>
<text x="540.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">3A 01 7C 4F</text>
<text x="540.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">2B 01 04 00</text>
<text x="540.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">3C 01 7C 4F</text>
<text x="685.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">єдине, що розуміє кремній</text>
<rect x="120.0" y="344.0" width="660.0" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хтось мусить перекласти лівий опис на правий — це й робить компілятор.</text>
</svg>
