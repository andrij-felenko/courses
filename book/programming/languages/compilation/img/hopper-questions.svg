<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від «людина думає як машина» до «машина перекладає за людину»</text>
<rect x="30.0" y="130.0" width="180.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="120.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Людина думає</tspan><tspan x="120.0" dy="15.6">як машина</tspan></text>
<text x="120.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">числами вручну</text>
<rect x="270.0" y="130.0" width="180.0" height="76.0" rx="6" fill="#f6f4ec" stroke="#a98a2a" stroke-width="2.0"/><text x="360.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a98a2a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">А чи може машина</tspan><tspan x="360.0" dy="15.6">перекладати сама?</tspan></text>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">зухвале питання</text>
<line x1="212.0" y1="168.0" x2="266.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="510.0" y="130.0" width="180.0" height="76.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="600.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Машина перекладає</tspan><tspan x="600.0" dy="15.6">за людину</tspan></text>
<text x="600.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">компілятор A-0</text>
<line x1="452.0" y1="168.0" x2="506.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен щабель — нове питання, що штовхало далі</text>
</svg>