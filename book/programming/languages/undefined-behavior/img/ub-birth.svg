<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження поняття UB: від рядка стандарту C89 до «носових демонів»</text>
<line x1="70.0" y1="150.0" x2="710.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="70.0" y1="144.0" x2="70.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="710.0" y1="144.0" x2="710.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="217.0" y="137.0" width="26.0" height="26.0" rx="6" fill="#fdf6e9" stroke="#b8860b" stroke-width="2.0"/>
<text x="230.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700">§</text>
<text x="230.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">1989</text>
<text x="230.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ANSI C (C89)</text>
<text x="230.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стандарт ділить «не диктовано»</text>
<text x="230.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">impl-defined — обери й задокументуй</text>
<text x="230.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">unspecified — обери, та мовчи</text>
<text x="230.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">undefined — «жодних вимог»</text>
<rect x="532.0" y="137.0" width="26.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="545.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">@</text>
<text x="545.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">25.02.1992</text>
<text x="545.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джон Ф. Вудс · comp.std.c</text>
<text x="545.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тема «Why is this legal?»</text>
<text x="545.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">UB може «випустити</text>
<text x="545.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">демонів із вашого носа»</text>
<text x="545.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">→ гасло «nasal demons»</text>
<text x="390.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«не диктовано» стало точним поняттям — а тоді й фольклором</text>
<text x="390.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">формальне означення (ліворуч) породило метафору, що пояснює його силу (праворуч)</text>
</svg>