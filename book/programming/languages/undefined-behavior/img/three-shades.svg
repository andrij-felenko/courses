<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три різні «стандарт не гарантує»: означене, неспецифіковане, невизначене</text>
<rect x="30.0" y="66.0" width="220.0" height="210.0" rx="10" fill="#f3faf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="140.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Означено реалізацією</text>
<line x1="50.0" y1="104.0" x2="230.0" y2="104.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="140.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">компілятор ОБЕРЕ</text>
<text x="140.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">варіант і ЗАДОКУМЕНТУЄ</text>
<text x="140.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">його</text>
<text x="140.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">розмір int; зсув</text>
<text x="140.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">від'ємного числа</text>
<rect x="280.0" y="66.0" width="220.0" height="210.0" rx="10" fill="#fdf6e9" stroke="#b8860b" stroke-width="2.0"/>
<text x="390.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">Неспецифіковано</text>
<line x1="300.0" y1="104.0" x2="480.0" y2="104.0" stroke="#b8860b" stroke-width="1.2"/>
<text x="390.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">один із кількох</text>
<text x="390.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">варіантів, але</text>
<text x="390.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">документувати не мусить</text>
<text x="390.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">порядок обчислення</text>
<text x="390.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">аргументів f(a(), b())</text>
<rect x="530.0" y="66.0" width="220.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="640.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Невизначено (UB)</text>
<line x1="550.0" y1="104.0" x2="730.0" y2="104.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="640.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">стандарт НЕ обіцяє</text>
<text x="640.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">нічого — програма</text>
<text x="640.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">втрачає будь-який сенс</text>
<text x="640.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переповнення int;</text>
<text x="640.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вихід за межі масиву</text>
<text x="390.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">керовано  →  непередбачувано, але локально  →  згубно на всю програму</text>
</svg>