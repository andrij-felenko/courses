<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне UB — і компілятор законно прибирає перевірку на null</text>
<rect x="30.0" y="66.0" width="360.0" height="240.0" rx="10" fill="#0f1115" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9ecbff" text-anchor="middle" font-weight="700">як написано</text>
<text x="52.0" y="128.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#ffd479" text-anchor="start" font-weight="700">s = tun-&gt;sk;</text>
<text x="372.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">1. розіменували tun</text>
<text x="52.0" y="162.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">if (!tun)</text>
<text x="372.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">2. аж тепер перевірка</text>
<text x="52.0" y="196.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">    return err;</text>
<text x="52.0" y="230.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">use(s);</text>
<text x="210.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ff8a80" text-anchor="middle" font-weight="700">розіменування було ДО перевірки</text>
<rect x="430.0" y="66.0" width="320.0" height="240.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="590.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">що вивів компілятор</text>
<text x="590.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">tun-&gt;sk уже спрацював —</text>
<text x="590.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">отже tun НЕ може бути null</text>
<text x="590.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(інакше це UB, а UB</text>
<text x="590.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">не буває за задумом)</text>
<text x="590.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ if(!tun) завжди хибне</text>
<text x="590.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ перевірку ВИКИНУТО</text>
</svg>