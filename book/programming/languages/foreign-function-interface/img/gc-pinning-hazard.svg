<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="410.0" height="360.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без Pinning: Переміщення об'єкта GC</text>
<text x="225.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Компактифікатор дефрагментує купу під час C-виклику</text>
<rect x="40.0" y="95.0" width="370.0" height="70.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="55.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. C-код отримує сирий вказівник: ptr = 0x1000</text>
<rect x="55.0" y="130.0" width="160.0" height="24.0" rx="3" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.0"/>
<text x="135.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Об'єкт за адресою 0x1000</text>
<line x1="280.0" y1="142.0" x2="220.0" y2="142.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">C ptr: 0x1000</text>
<rect x="40.0" y="185.0" width="370.0" height="75.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="55.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. GC спрацьовує і переносить дані на 0x2000</text>
<rect x="55.0" y="222.0" width="160.0" height="24.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="135.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Нова адреса: 0x2000</text>
<text x="230.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">0x1000 тепер сміття!</text>
<rect x="40.0" y="280.0" width="370.0" height="80.0" rx="5" fill="#faece8" stroke="#c0392b" stroke-width="1.5"/>
<text x="55.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. Рідна функція виконує запис: *ptr = 42;</text>
<text x="55.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Запис у 0x1000 руйнує чужий об'єкт у купі</text>
<text x="55.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">КРАХ: Непередбачуване пошкодження пам'яті (UB)</text>
<rect x="450.0" y="20.0" width="410.0" height="360.0" rx="8" fill="#f0f7f2" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З Pinning: Фіксація адреси в пам'яті</text>
<text x="655.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GC позначає блок як нерухомий до завершення FFI</text>
<rect x="470.0" y="95.0" width="370.0" height="70.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="485.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Pinning: об'єкт позначається PINNED (0x1000)</text>
<rect x="485.0" y="130.0" width="160.0" height="24.0" rx="3" fill="#e2f3e8" stroke="#27ae60" stroke-width="1.0"/>
<text x="565.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">PINNED [0x1000]</text>
<line x1="710.0" y1="142.0" x2="650.0" y2="142.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="760.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">C ptr: 0x1000</text>
<rect x="470.0" y="185.0" width="370.0" height="75.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="485.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. GC рухає інші об'єкти, але 0x1000 лишається</text>
<rect x="485.0" y="222.0" width="160.0" height="24.0" rx="3" fill="#e2f3e8" stroke="#27ae60" stroke-width="1.0"/>
<text x="565.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Адреса незмінна: 0x1000</text>
<text x="660.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">GC не переміщує об'єкт</text>
<rect x="470.0" y="280.0" width="370.0" height="80.0" rx="5" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="485.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. C-код завершує роботу і повертає керування</text>
<text x="485.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Запис у 0x1000 безпечний. Рантайм викликає Unpin</text>
<text x="485.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">ЦІЛІСНІСТЬ ЗБЕРЕЖЕНО: Дані валідні, GC продовжує роботу</text>
</svg>