<text x="420.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розробник декларує вигляд UI для стану State; рушій вираховує мінімальні імперативні мутації</text>
