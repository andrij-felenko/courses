<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція декларативного SQL в імперативні інструкції процесора</text>
<rect x="28.0" y="70.0" width="175.0" height="295.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="115.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Декларація</text>
<text x="115.5" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Вихідний SQL-запит</text>
<line x1="38.0" y1="118.0" x2="193.0" y2="118.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="115.5" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SELECT name, score</text>
<text x="115.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FROM users</text>
<text x="115.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">WHERE age &gt;= 18</text>
<text x="115.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">  AND active = true</text>
<rect x="36.0" y="317.0" width="159.0" height="38.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<rect x="38.0" y="319.0" width="155.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="115.5" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.5" dy="0.0">Опис сутності та обмежень</tspan></text>
<line x1="206.0" y1="217.5" x2="226.0" y2="217.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="229.0" y="70.0" width="175.0" height="295.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="316.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">2. AST &amp; Логічний план</text>
<text x="316.5" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Реляційні оператори</text>
<line x1="239.0" y1="118.0" x2="394.0" y2="118.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="316.5" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Project [name, score]</text>
<text x="316.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">       ↑</text>
<text x="316.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Filter [age &gt;= 18 ∧ active]</text>
<text x="316.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">       ↑</text>
<text x="316.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Scan [users table]</text>
<rect x="237.0" y="317.0" width="159.0" height="38.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<rect x="239.0" y="319.0" width="155.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="316.5" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="316.5" dy="0.0">Дерево операцій реляційної алгебри</tspan></text>
<line x1="407.0" y1="217.5" x2="427.0" y2="217.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="70.0" width="175.0" height="295.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="517.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Оптимізатор CBO</text>
<text x="517.5" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Правила та статистика</text>
<line x1="440.0" y1="118.0" x2="595.0" y2="118.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="517.5" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Predicate Pushdown:</text>
<text x="517.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">фільтр опущено до Scan</text>
<text x="517.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Index Scan вибору:</text>
<text x="517.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">використано індекс age_idx</text>
<text x="517.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Cost: I/O + CPU min</text>
<rect x="438.0" y="317.0" width="159.0" height="38.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<rect x="440.0" y="319.0" width="155.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="517.5" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="517.5" dy="0.0">Пошук найдешевшого плану</tspan></text>
<line x1="608.0" y1="217.5" x2="628.0" y2="217.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="631.0" y="70.0" width="175.0" height="295.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="718.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. Фізичний план</text>
<text x="718.5" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Імперативний ітератор</text>
<line x1="641.0" y1="118.0" x2="796.0" y2="118.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="718.5" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Volcano Iterator Model:</text>
<text x="718.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Project.next()</text>
<text x="718.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">  -&gt; IndexScan.next()</text>
<text x="718.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CPU: покроковий цикл,</text>
<text x="718.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">читання сторінок з RAM</text>
<rect x="639.0" y="317.0" width="159.0" height="38.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<rect x="641.0" y="319.0" width="155.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="718.5" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="718.5" dy="0.0">Покрокове виконання на CPU</tspan></text>
<text x="420.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Планувальник перетворює безчасову реляційну декларацію на покроковий конвеєр викликів next()</text>
</svg>