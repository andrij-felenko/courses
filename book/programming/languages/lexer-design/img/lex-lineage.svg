<text x="170.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="700">1957</text>
<text x="170.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">FORTRAN</tspan><tspan x="170.0" dy="15.6">команда Бекуса, IBM</tspan><tspan x="170.0" dy="15.6">сканування — окрема фаза</tspan></text>
