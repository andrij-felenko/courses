<text x="170.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="700">1975</text>
<text x="170.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Lex</tspan><tspan x="170.0" dy="15.6">Леск і Шмідт, Bell Labs</tspan><tspan x="170.0" dy="15.6">компаньйон до Yacc</tspan></text>
<rect x="460.0" y="202.0" width="280.0" height="96.0" rx="8" fill="#fdecec" stroke="#e0a0a0" stroke-width="1.6"/>
<text x="600.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="700">1982</text>
<text x="600.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Software Tools lex</tspan><tspan x="600.0" dy="15.6">Поскенцер, потім Пексон</tspan><tspan x="600.0" dy="15.6">мовою Ratfor</tspan></text>
<rect x="460.0" y="48.0" width="280.0" height="96.0" rx="8" fill="#fce7f3" stroke="#e0a6c8" stroke-width="1.6"/>
<text x="600.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="700">1987</text>
<text x="600.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">flex — Fast Lexical</tspan><tspan x="600.0" dy="15.6">analyzer generator</tspan><tspan x="600.0" dy="15.6">Пексон, LBL, чистий C</tspan></text>
<line x1="170.0" y1="144.0" x2="170.0" y2="202.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">фаза → інструмент</text>
<line x1="310.0" y1="250.0" x2="460.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="385.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сумісний вхід,
без спільного коду</text>
<line x1="600.0" y1="202.0" x2="600.0" y2="144.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Ratfor → C</text>
<rect x="210.0" y="365.6" width="480.0" height="52.8" rx="6" fill="#fff8ec" stroke="#e0b877" stroke-width="1.5"/><text x="450.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Lex і flex не ділять жодного рядка коду:</tspan><tspan x="450.0" dy="16.2">flex читає ті самі вхідні файли, але написаний з нуля й швидший.</tspan></text>
