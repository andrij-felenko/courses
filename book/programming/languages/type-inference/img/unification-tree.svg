<text x="430.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Покрокове виведення найбільш загального уніфікатора (MGU):</text>
<text x="50.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Збіг конструкторів: обидва корені є функціональною стрілкою (→). Декомпозуємо гілки.</text>
<text x="50.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Ліва гілка: α = Bool  ⇒  [α ↦ Bool],   Int = γ  ⇒  [γ ↦ Int].</text>
<text x="50.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Права гілка: β = (δ → Bool)  ⇒  [β ↦ (δ → Bool)]  (перевірка occurs-check: β ∉ vars(δ → Bool) — успіх).</text>
<text x="50.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Підсумкова підстановка σ = { α ↦ Bool, γ ↦ Int, β ↦ (δ → Bool) }. Загальний тип: (Bool → Int) → (δ → Bool)</text>
</svg>