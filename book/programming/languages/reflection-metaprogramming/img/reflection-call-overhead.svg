<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння конвеєра виконання: прямий виклик, vtable та рефлексія</text>
<rect x="30.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">1. Прямий / Inline виклик</text>
<rect x="45.0" y="110.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="160.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Код виклику:</tspan><tspan x="160.0" dy="14.3">obj.calculate(42);</tspan></text>
<line x1="160.0" y1="180.0" x2="160.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="220.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="160.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Машинний код CPU:</tspan><tspan x="160.0" dy="12.3"></tspan><tspan x="160.0" dy="12.3">• Інструкції повністю інлайняться</tspan><tspan x="160.0" dy="12.3">• Аргументи в регістрах CPU</tspan><tspan x="160.0" dy="12.3">• Час: ~0–0.5 нс (0 тактів затримки)</tspan></text>
<line x1="160.0" y1="310.0" x2="160.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="350.0" width="230.0" height="85.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="160.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Підсумок:</tspan><tspan x="160.0" dy="13.7">✔ Максимальна швидкість</tspan><tspan x="160.0" dy="13.7">✔ Оптимізація конвеєра CPU</tspan><tspan x="160.0" dy="13.7">✔ Нуль алокацій пам'яті</tspan></text>
<rect x="320.0" y="60.0" width="270.0" height="390.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="455.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">2. Віртуальний виклик (vtable)</text>
<rect x="335.0" y="110.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="455.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Код виклику:</tspan><tspan x="455.0" dy="14.3">base_ptr-&gt;calculate(42);</tspan></text>
<line x1="455.0" y1="180.0" x2="455.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335.0" y="220.0" width="240.0" height="90.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="455.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Машинний код CPU:</tspan><tspan x="455.0" dy="13.7"></tspan><tspan x="455.0" dy="13.7">1. Читання vptr з об'єкта</tspan><tspan x="455.0" dy="13.7">2. Читання адреси методу з vtable</tspan><tspan x="455.0" dy="13.7">3. Непрямий перехід (call [rax+24])</tspan><tspan x="455.0" dy="13.7">• Час: ~1–3 нс</tspan></text>
<line x1="455.0" y1="310.0" x2="455.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335.0" y="350.0" width="240.0" height="85.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="455.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Підсумок:</tspan><tspan x="455.0" dy="13.7">✔ Динамічний поліморфізм</tspan><tspan x="455.0" dy="13.7">✖ Непрямий виклик (missed inline)</tspan><tspan x="455.0" dy="13.7">✖ +8 байт на покажчик vptr</tspan></text>
<rect x="620.0" y="60.0" width="270.0" height="390.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="755.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9f1239" text-anchor="middle" font-weight="700">3. Динамічна рефлексія</text>
<rect x="635.0" y="110.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="755.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Код виклику:</tspan><tspan x="755.0" dy="13.0">method.invoke(obj, new Object[]{42});</tspan></text>
<line x1="755.0" y1="180.0" x2="755.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="635.0" y="205.0" width="240.0" height="130.0" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/><text x="755.0" y="226.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Конвеєр JVM / CLR / Dynamic:</tspan><tspan x="755.0" dy="11.7"></tspan><tspan x="755.0" dy="11.7">1. Пакування аргументів (boxing: int -&gt; Integer)</tspan><tspan x="755.0" dy="11.7">2. Створення масиву Object[] у купі</tspan><tspan x="755.0" dy="11.7">3. Перевірка прав доступу (security check)</tspan><tspan x="755.0" dy="11.7">4. Валідація типів параметрів</tspan><tspan x="755.0" dy="11.7">5. Непрямий виклик через native stub</tspan><tspan x="755.0" dy="11.7">6. Розпакування результату (unboxing)</tspan><tspan x="755.0" dy="11.7">• Час: ~15–60 нс (до 100x повільніше)</tspan></text>
<line x1="755.0" y1="335.0" x2="755.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="635.0" y="350.0" width="240.0" height="85.0" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/><text x="755.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Підсумок:</tspan><tspan x="755.0" dy="11.7">✔ Максимальна гнучкість у рантаймі</tspan><tspan x="755.0" dy="11.7">✖ Високе навантаження на GC та CPU</tspan><tspan x="755.0" dy="11.7">✖ Повна втрата типобезпеки компілятора</tspan></text>
</svg>