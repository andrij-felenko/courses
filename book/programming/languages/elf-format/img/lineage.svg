<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід форматів об'єктних файлів UNIX</text>
<rect x="55.0" y="70.0" width="150.0" height="132.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="130.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">a.out</text>
<text x="130.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1971</text>
<text x="130.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">«assembler output»</tspan><tspan x="130.0" dy="13.8">фіксована структура,</tspan><tspan x="130.0" dy="13.8">без іменованих секцій</tspan></text>
<rect x="54.2" y="213.3" width="151.7" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">тісно: спільні</tspan><tspan x="130.0" dy="14.3">бібліотеки не влазять</tspan></text>
<rect x="285.0" y="70.0" width="150.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">COFF</text>
<text x="360.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1983</text>
<text x="360.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перші іменовані</tspan><tspan x="360.0" dy="13.8">секції; ще заскладний</tspan><tspan x="360.0" dy="13.8">для динаміки</tspan></text>
<rect x="296.7" y="213.3" width="126.6" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">динамічні</tspan><tspan x="360.0" dy="14.3">бібліотеки — мука</tspan></text>
<rect x="515.0" y="70.0" width="150.0" height="132.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="590.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">ELF</text>
<text x="590.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1988</text>
<text x="590.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">довільні секції +</tspan><tspan x="590.0" dy="13.8">погляд-сегменти;</tspan><tspan x="590.0" dy="13.8">процесор у заголовку</tspan></text>
<rect x="520.4" y="213.3" width="139.1" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">гнучкий, незалежний</tspan><tspan x="590.0" dy="14.3">від ядра</tspan></text>
<line x1="211.0" y1="136.0" x2="279.0" y2="136.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="441.0" y1="136.0" x2="509.0" y2="136.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="185.8" y="274.2" width="348.3" height="47.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="294.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">1993: комітет TIS робить ELF спільним стандартом</tspan><tspan x="360.0" dy="15.6">(v1.1 — жовтень 1993; v1.2 — травень 1995)</tspan></text>
