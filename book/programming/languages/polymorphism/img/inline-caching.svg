<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани вбудованого кешування (Inline Caching) у динамічних середовищах</text>
<rect x="30.0" y="56.0" width="210.0" height="210.0" rx="8" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="135.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1. Мономорфний (Mono)</text>
<text x="135.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">90%+ викликів у програмах</text>
<line x1="45.0" y1="108.0" x2="225.0" y2="108.0" stroke="#a7f3d0" stroke-width="1.0"/>
<rect x="42.0" y="120.0" width="186.0" height="74.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="50.0" y="140.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">if (obj.class == Point) {</text>
<text x="65.0" y="160.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">call Point::draw</text>
<text x="50.0" y="180.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6b7280" text-anchor="start">} else fallback()</text>
<text x="135.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість: як прямий виклик</text>
<text x="135.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 порівняння + 1 стрибок</text>
<text x="135.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Можливий повний інлайнінг</text>
<line x1="242.0" y1="160.0" x2="288.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">інший тип</text>
<rect x="290.0" y="56.0" width="240.0" height="210.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Поліморфний (Poly / PIC)</text>
<text x="410.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">2–4 різні класи у місці виклику</text>
<line x1="305.0" y1="108.0" x2="515.0" y2="108.0" stroke="#bfdbfe" stroke-width="1.0"/>
<rect x="302.0" y="118.0" width="216.0" height="86.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="310.0" y="136.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1a1a1a" text-anchor="start">switch (obj.class) {</text>
<text x="320.0" y="152.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">case Circle: call DrawCircle</text>
<text x="320.0" y="168.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">case Rect:   call DrawRect</text>
<text x="320.0" y="184.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">case Line:   call DrawLine</text>
<text x="310.0" y="198.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1a1a1a" text-anchor="start">}</text>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Коротка лінійна перевірка</text>
<text x="410.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Inline stub chain або таблиця</text>
<line x1="532.0" y1="160.0" x2="578.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="555.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">&gt;4 типів</text>
<rect x="580.0" y="56.0" width="210.0" height="210.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="685.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Мегаморфний (Mega)</text>
<text x="685.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">5+ типів або непередбачувано</text>
<line x1="595.0" y1="108.0" x2="775.0" y2="108.0" stroke="#fecaca" stroke-width="1.0"/>
<rect x="592.0" y="120.0" width="186.0" height="74.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="685.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Глобальна хеш-таблиця</text>
<text x="600.0" y="162.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1a1a1a" text-anchor="start">hash = (class ^ sel)</text>
<text x="600.0" y="180.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">call global_cache[hash]</text>
<text x="685.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повільний шлях (Slow Path)</text>
<text x="685.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кеш-промахи в BTB процесора</text>
<text x="685.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Інлайнінг неможливий</text>
<text x="410.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">JIT-компілятор переписує машинний код на ходу (patching), адаптуючись до типів у точці виклику</text>
</svg>