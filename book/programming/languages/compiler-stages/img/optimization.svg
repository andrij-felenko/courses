<rect x="74.0" y="112.0" width="232.0" height="30.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="90.0" y="130.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">x = 2 + 3;</text>
<rect x="74.0" y="150.0" width="232.0" height="30.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="90.0" y="168.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">int t = a*b;  // не вжито</text>
<rect x="74.0" y="188.0" width="232.0" height="30.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="90.0" y="206.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">for(i..) sum+=i;</text>
<rect x="400.0" y="90.0" width="260.0" height="150.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="530.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">що згенеровано</text>
<rect x="414.0" y="112.0" width="232.0" height="30.0" rx="8" fill="#13251a" stroke="#0a120d" stroke-width="1.4"/><text x="430.0" y="130.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#7fe0a0" text-anchor="start" font-weight="700">x = 5;   // пораховано</text>
<rect x="414.0" y="150.0" width="232.0" height="30.0" rx="8" fill="#13251a" stroke="#0a120d" stroke-width="1.4"/><text x="430.0" y="168.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7fe0a0" text-anchor="start" font-weight="700">(зникло)  // мертвий код</text>
<rect x="414.0" y="188.0" width="232.0" height="30.0" rx="8" fill="#13251a" stroke="#0a120d" stroke-width="1.4"/><text x="430.0" y="206.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#7fe0a0" text-anchor="start" font-weight="700">розгорнуто/злито</text>
<line x1="326.0" y1="165.0" x2="394.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">те саме</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">результат зобов'язаний збігтися — шлях до нього компілятор вільний переписати</text>
