<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Препроцесор: суто текстові операції</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ріже й клеїть текст, не розуміючи коду</text>
<text x="60.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вклеїти файл</text>
<rect x="60.0" y="108.0" width="380.0" height="56.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">#include &lt;Arduino.h&gt;</text>
<line x1="448.0" y1="136.0" x2="506.0" y2="136.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="516.0" y="108.0" width="360.0" height="56.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="534.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">→ весь вміст файлу вклеєно</text>
<text x="60.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">підставити визначення</text>
<rect x="60.0" y="206.0" width="380.0" height="56.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">#define LED 2 … LED</text>
<line x1="448.0" y1="234.0" x2="506.0" y2="234.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="516.0" y="206.0" width="360.0" height="56.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="534.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">→ … 2</text>
<text x="60.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">умовне включення</text>
<rect x="60.0" y="304.0" width="380.0" height="56.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">#ifdef ESP32 … #endif</text>
<line x1="448.0" y1="332.0" x2="506.0" y2="332.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="516.0" y="304.0" width="360.0" height="56.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="534.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">→ код лишити або викинути</text>
<rect x="120.0" y="402.0" width="700.0" height="30.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На виході — суцільний текст без жодного «#». Стадія «дурна»: лише ріже й клеїть.</text>
</svg>
