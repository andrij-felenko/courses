<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Оптимізація: той самий результат — меншими командами</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">компілятор зберігає результат, але вільний переписати шлях до нього</text>
<rect x="40.0" y="96.0" width="400.0" height="256.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="240.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як написано (наївно)</text>
<rect x="60.0" y="142.0" width="360.0" height="168.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="76.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">x = 2 * 3;        // рахуємо в коді</text>
<text x="76.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">y = x;            // зайва копія</text>
<text x="76.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">// y далі ніде не вжито</text>
<text x="76.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">while (0) { ... }  // 0 разів</text>
<text x="240.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">багато зайвих кроків</text>
<line x1="448.0" y1="224.0" x2="502.0" y2="224.0" stroke="#1f8a3b" stroke-width="3.5" marker-end="url(#aGreen)"/>
<rect x="512.0" y="96.0" width="368.0" height="256.0" rx="12" fill="none" stroke="#eef6ef" stroke-width="2"/>
<text x="696.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Що згенерував компілятор</text>
<rect x="532.0" y="142.0" width="328.0" height="130.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="548.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="start" font-weight="normal" font-style="normal">// x = 6  (пораховано наперед)</text>
<text x="548.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="start" font-weight="normal" font-style="normal">// y і цикл — викинуто (мертві)</text>
<text x="548.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="start" font-weight="normal" font-style="normal">…лишилось тільки потрібне</text>
<text x="696.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">стале пораховано, мертве викинуто</text>
<text x="696.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ коротше й швидше</text>
</svg>
