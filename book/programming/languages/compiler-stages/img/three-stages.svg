<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стадії: препроцесор → компілятор → асемблер</text>
<rect x="20.0" y="110.0" width="116.0" height="80.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="78.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">файл коду</tspan><tspan x="78.0" dy="14.3">(.c / .cpp)</tspan></text>
<rect x="180.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="255.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Препроцесор</tspan></text>
<rect x="360.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="435.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">Компілятор</tspan></text>
<rect x="540.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="615.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Асемблер</tspan></text>
<rect x="700.0" y="110.0" width="104.0" height="80.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="752.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="752.0" dy="0.0">об'єктний</tspan><tspan x="752.0" dy="14.3">файл .o</tspan></text>
<line x1="138.0" y1="150.0" x2="178.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="158.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="158.0" dy="0.0">розгорнутий</tspan><tspan x="158.0" dy="11.7">текст</tspan></text>
<line x1="332.0" y1="150.0" x2="358.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="345.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">асемблер</tspan></text>
<line x1="512.0" y1="150.0" x2="538.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="525.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">числа</tspan></text>
<line x1="692.0" y1="150.0" x2="698.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожна стадія опускає код на щабель нижче (lowering)</text>
<text x="410.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один файл коду → один об'єктний файл</text>
</svg>