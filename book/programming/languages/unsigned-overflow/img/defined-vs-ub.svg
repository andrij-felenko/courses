<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий перекот, дві гарантії: модуль ліворуч, порожнеча праворуч</text>
<line x1="360.0" y1="46.0" x2="360.0" y2="316.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">unsigned: ВИЗНАЧЕНО</text>
<rect x="30.0" y="82.0" width="300.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="180.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">0xFFFFFFFF + 1  →  0</tspan></text>
<text x="180.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стандарт гарантує:</text>
<text x="180.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">результат mod 2ᴺ</text>
<rect x="30.0" y="194.0" width="300.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="180.0" y="224.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">на це МОЖНА покладатися:</tspan><tspan x="180.0" dy="14.3">лічильники, геш, кільцевий</tspan><tspan x="180.0" dy="14.3">індекс, різниця часу.</tspan><tspan x="180.0" dy="14.3">код переносний і передбачний</tspan></text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">signed: UB</text>
<rect x="390.0" y="82.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="540.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">INT_MAX + 1  →  ???</tspan></text>
<text x="540.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стандарт не обіцяє:</text>
<text x="540.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">нічого взагалі</text>
<rect x="390.0" y="194.0" width="300.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="540.0" y="224.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">спиратися НЕ можна:</tspan><tspan x="540.0" dy="14.3">оптимізатор має право</tspan><tspan x="540.0" dy="14.3">викинути вашу ж перевірку,</tspan><tspan x="540.0" dy="14.3">вважаючи, що UB не буває</tspan></text>
<text x="360.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">біти перевалюють однаково — різниця живе в МОВІ, не в залізі</text>
</svg>