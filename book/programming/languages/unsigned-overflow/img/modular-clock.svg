<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Беззнакове число як позиція на колі: додавання йде за модулем 2ᴺ</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-бітне беззнакове: коло з 8 позицій (0…7)</text>
<circle cx="250.0" cy="218.0" r="118.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<circle cx="250.0" cy="100.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="250.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0</text>
<circle cx="333.4" cy="134.6" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="349.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="368.0" cy="218.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="390.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="333.4" cy="301.4" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="349.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="250.0" cy="336.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="250.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text>
<circle cx="166.6" cy="301.4" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="151.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5</text>
<circle cx="132.0" cy="218.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="110.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6</text>
<circle cx="166.6" cy="134.6" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="151.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">7</text>
<line x1="154.0" y1="218.0" x2="249.6" y2="122.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="250.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">+3</text>
<text x="250.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">6 → 1</text>
<text x="570.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">закон кола</text>
<text x="452.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">6 + 3 = 9</text>
<text x="452.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">9 = 8 + 1</text>
<text x="452.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">9 mod 8 = 1</text>
<rect x="446.0" y="216.0" width="250.0" height="96.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="571.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">N бітів → модуль 2ᴺ</tspan><tspan x="571.0" dy="15.6"></tspan><tspan x="571.0" dy="15.6">сума завжди «довертається»</tspan><tspan x="571.0" dy="15.6">на залишок від ділення на 2ᴺ</tspan><tspan x="571.0" dy="15.6">— нічого не губиться, лише</tspan><tspan x="571.0" dy="15.6">обертається по колу</tspan></text>
</svg>