<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просування ламає модуль: uint16·uint16 рахується в int, не в 16 бітах</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">uint16_t a=50000, b=50000;   a * b = ?</text>
<rect x="40.0" y="84.0" width="300.0" height="78.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">НАЇВНЕ сподівання</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">дія «на 16 бітах»,</tspan><tspan x="190.0" dy="15.6">результат mod 2¹⁶</tspan><tspan x="190.0" dy="15.6">(2500000000 mod 65536)</tspan></text>
<rect x="380.0" y="84.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="530.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">ЩО РОБИТЬ C</tspan><tspan x="530.0" dy="15.6"></tspan><tspan x="530.0" dy="15.6">обидва → int (32 біти),</tspan><tspan x="530.0" dy="15.6">дія в int; 2 500 000 000</tspan><tspan x="530.0" dy="15.6">&gt; INT_MAX → знакове UB!</tspan></text>
<line x1="360.0" y1="168.0" x2="360.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="200.0" width="480.0" height="52.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.7"/><text x="360.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">гарантія модуля 2ᴺ діє в ШИРИНІ обчислення, а не оголошення:</tspan><tspan x="360.0" dy="14.3">до int — модуль зникає, і замість беззнакового wrap можна дістати UB</tspan></text>
<text x="360.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">рятунок: рахувати у явно широкому беззнаковому типі</text>
<text x="360.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(uint32_t)a * b  або  (uint64_t)a * b  — тоді модуль справді 2³² чи 2⁶⁴</text>
</svg>