<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Індекс кільцевого буфера маскою: &amp; (SIZE−1) дешевше за % SIZE</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер на 8: індекс  &amp;  7  (двійково 0111)</text>
