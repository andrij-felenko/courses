<text x="210.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">+1</text>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">7 → 0</text>
<text x="546.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">чому це остача</text>
<text x="396.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">9 = 1001 (двійково)</text>
<text x="396.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">маска 7 = 0111</text>
<text x="396.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">9 &amp; 7 = 0001 = 1</text>
<text x="396.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">9 mod 8 = 1  — те саме</text>
<rect x="390.0" y="232.0" width="296.0" height="118.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="538.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="538.0" dy="0.0">&amp; (SIZE−1)  ==  % SIZE</tspan><tspan x="538.0" dy="15.6">ЛИШЕ коли SIZE = 2ᵏ:</tspan><tspan x="538.0" dy="15.6">тоді SIZE−1 — суцільна</tspan><tspan x="538.0" dy="15.6">маска молодших одиниць.</tspan><tspan x="538.0" dy="15.6">коштує 1 такт «І»</tspan><tspan x="538.0" dy="15.6">замість циклу ділення</tspan></text>
