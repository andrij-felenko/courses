<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="120.0" y1="150.0" x2="780.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="778.0" y1="150.0" x2="798.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="120.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="120.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">2006</text>
<rect x="25.0" y="196.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Грейдон Гоар пише сам,</tspan><tspan x="120.0" dy="15.6">у вільний час.</tspan><tspan x="120.0" dy="15.6">Компілятор — на OCaml.</tspan><tspan x="120.0" dy="15.6">МАЄ збирача сміття (@T).</tspan></text>
<text x="120.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Особистий проєкт</text>
<circle cx="344.4" cy="150.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<text x="344.4" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">2009</text>
<rect x="249.4" y="196.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="344.4" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="344.4" dy="0.0">Офіційне спонсорство;</tspan><tspan x="344.4" dy="15.6">мета — безпечний</tspan><tspan x="344.4" dy="15.6">рушій браузера (Servo).</tspan><tspan x="344.4" dy="15.6">Показ світу — 2010.</tspan></text>
<text x="344.4" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Mozilla підхоплює</text>
<circle cx="568.8" cy="150.0" r="11.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="568.8" cy="150.0" r="17.0" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="568.8" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">~2013</text>
<rect x="473.8" y="196.0" width="190.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="568.8" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="568.8" dy="0.0">Головна подія.</tspan><tspan x="568.8" dy="15.6">GC прибрано на користь</tspan><tspan x="568.8" dy="15.6">власності; типостани</tspan><tspan x="568.8" dy="15.6">й зайве — теж геть.</tspan></text>
<text x="568.8" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Збирача сміття ВИКИНУТО</text>
<circle cx="780.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="780.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">2015</text>
<rect x="685.0" y="196.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">15 травня 2015.</tspan><tspan x="780.0" dy="15.6">Розворот завершено;</tspan><tspan x="780.0" dy="15.6">обіцянка сумісності.</tspan><tspan x="780.0" dy="15.6">Модель уже усталена.</tspan></text>
<text x="780.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стабільна 1.0</text>
<text x="450.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Rust народжувався відніманням: головна подія — не старт, а викидання збирача сміття</text>
</svg>