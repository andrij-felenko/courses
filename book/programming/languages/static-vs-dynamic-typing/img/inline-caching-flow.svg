<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Inline Caching (IC) у динамічних віртуальних машинах</text>
<rect x="0.0" y="0.0" width="840.0" height="410.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прискорення динамічного доступу: Вбудоване кешування (Inline Caching)</text>
<rect x="30.0" y="55.0" width="180.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місце виклику (Call Site)</text>
<text x="50.0" y="100.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="start">point.get_x()</text>
<text x="120.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Змінний тип об'єкта point</text>
<line x1="210.0" y1="92.0" x2="260.0" y2="92.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260.0" y="50.0" width="240.0" height="90.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Мономорфний кеш (Fast Path)</text>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Порівняння: obj.shape == Shape_A</text>
<line x1="275.0" y1="98.0" x2="485.0" y2="98.0" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="380.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">СПІВПАДІННЯ (95% викликів):</text>
<text x="380.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Прямий стрибок за адресою без словника</text>
<line x1="500.0" y1="92.0" x2="570.0" y2="92.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="55.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="690.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Прямий виклик коду</text>
<text x="585.0" y="100.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#27ae60" text-anchor="start">CALL 0x7FFF_0040_1020</text>
<text x="690.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість майже як у C/C++ (1 такт)</text>
<line x1="380.0" y1="140.0" x2="380.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Промах</text>
<rect x="260.0" y="175.0" width="240.0" height="100.0" rx="8" fill="#fffbf5" stroke="#f59e0b" stroke-width="1.6"/>
<text x="380.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">2. Поліморфний кеш (2–4 типи)</text>
<text x="380.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Таблиця пар: (Shape_B, fn_B),</text>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">(Shape_C, fn_C), (Shape_D, fn_D)</text>
<line x1="275.0" y1="236.0" x2="485.0" y2="236.0" stroke="#fde68a" stroke-width="1.0"/>
<text x="380.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Лінійний пошук серед 4 записів</text>
<text x="380.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Затримка: 4–10 тактів CPU</text>
<line x1="500.0" y1="225.0" x2="570.0" y2="225.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="570.0" y="190.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<text x="690.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Непрямий виклик з таблиці</text>
<text x="585.0" y="232.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">CALL [table + rdx*8]</text>
<text x="690.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Помірні накладні витрати</text>
<line x1="380.0" y1="275.0" x2="380.0" y2="305.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">&gt;4 типів</text>
<rect x="260.0" y="305.0" width="550.0" height="80.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
<text x="535.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">3. Мегаморфний пошук (Повний провал кешування / Slow Path)</text>
<text x="535.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Глобальний хеш-пошук у словнику властивостей об'єкта або ланцюжку прототипів</text>
<text x="535.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Накладні витрати: 50–200 тактів, скидання конвеєра, навантаження GC</text>
</svg>