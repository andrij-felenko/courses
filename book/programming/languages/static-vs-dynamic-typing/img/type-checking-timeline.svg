<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи перевірки типів: компіляція проти рантайму</text>
<rect x="0.0" y="0.0" width="840.0" height="430.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<rect x="15.0" y="15.0" width="810.0" height="185.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="35.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Статична типізація: верифікація до запуску (AOT)</text>
<rect x="35.0" y="60.0" width="130.0" height="105.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний код</text>
<text x="45.0" y="105.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">let x: int = 5;</text>
<text x="45.0" y="125.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#c0392b" text-anchor="start">let y = x + &quot;1&quot;;</text>
<text x="100.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">типи у синтаксисі</text>
<line x1="165.0" y1="112.0" x2="205.0" y2="112.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205.0" y="55.0" width="175.0" height="115.0" rx="6" fill="#eaf4fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="292.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Перевірка типів</text>
<text x="292.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Type Checker / AST</text>
<line x1="215.0" y1="104.0" x2="370.0" y2="104.0" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="292.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">int + string : НЕСУМІСНІ</text>
<text x="292.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка компіляції!</text>
<line x1="380.0" y1="112.0" x2="420.0" y2="112.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420.0" y="60.0" width="175.0" height="105.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="507.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація коду</text>
<text x="507.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Стирання типів (Erasure)</text>
<text x="435.0" y="122.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#27ae60" text-anchor="start">ADD EAX, EBX</text>
<text x="507.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сирі байти без тегів</text>
<line x1="595.0" y1="112.0" x2="635.0" y2="112.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="635.0" y="60.0" width="170.0" height="105.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Цільовий процесор</text>
<text x="720.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пряме виконання</text>
<text x="720.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">0 тактів на перевірки</text>
<text x="720.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Повний SIMD / inline</text>
<rect x="15.0" y="220.0" width="810.0" height="195.0" rx="8" fill="#fffbf5" stroke="#fed7aa" stroke-width="1.5"/>
<text x="35.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Динамічна типізація: верифікація тегів у пам'яті під час виконання</text>
<rect x="35.0" y="265.0" width="130.0" height="135.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний код</text>
<text x="45.0" y="310.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">x = 5</text>
<text x="45.0" y="330.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">y = x + &quot;1&quot;</text>
<text x="100.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">змінні без типів</text>
<text x="100.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">парсер пропускає</text>
<line x1="165.0" y1="330.0" x2="205.0" y2="330.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205.0" y="265.0" width="155.0" height="135.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="282.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Байткод VM</text>
<text x="215.0" y="310.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1a1a1a" text-anchor="start">LOAD_FAST  x</text>
<text x="215.0" y="330.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#1a1a1a" text-anchor="start">LOAD_CONST '1'</text>
<text x="215.0" y="350.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#c0392b" text-anchor="start">BINARY_ADD</text>
<text x="282.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">операція узагальнена</text>
<line x1="360.0" y1="330.0" x2="400.0" y2="330.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="265.0" width="185.0" height="135.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.6"/>
<text x="492.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Значення з тегами (Купа)</text>
<rect x="412.0" y="300.0" width="160.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="492.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Tag: INT | Val: 5</text>
<text x="492.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PyObject / Tagged Value</text>
<rect x="412.0" y="345.0" width="160.0" height="38.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="492.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Tag: STR | Val: '1'</text>
<text x="492.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обгортка в пам'яті (Box)</text>
<line x1="585.0" y1="330.0" x2="625.0" y2="330.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="265.0" width="180.0" height="135.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="715.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Runtime Tag Dispatch</text>
<text x="715.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">if (x.tag == INT &amp;&amp;</text>
<text x="715.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">    y.tag == INT) { ... }</text>
<line x1="635.0" y1="338.0" x2="795.0" y2="338.0" stroke="#fed7aa" stroke-width="1.0"/>
<text x="715.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">else: raise TypeError</text>
<text x="715.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Аварія посеред роботи</text>
</svg>