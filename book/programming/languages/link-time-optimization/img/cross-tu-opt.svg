<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міжмодульний інлайнінг, згортання констант та усунення мертвого коду</text>
<text x="210.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">До LTO: дві ізольовані одиниці трансляції</text>
<rect x="30.0" y="65.0" width="175.0" height="175.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="117.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">math.c</text>
<rect x="40.0" y="100.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="52.0" y="118.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">int scale(int x) {</text>
<rect x="40.0" y="134.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="52.0" y="152.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">  return x * 4;</text>
<rect x="40.0" y="168.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="52.0" y="186.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">}</text>
<rect x="40.0" y="202.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="52.0" y="220.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="700">void dead_fn() { ... }</text>
<rect x="225.0" y="65.0" width="175.0" height="175.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="312.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">main.c</text>
<rect x="235.0" y="100.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="247.0" y="118.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">int main() {</text>
<rect x="235.0" y="134.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="247.0" y="152.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">  int a = scale(10);</text>
<rect x="235.0" y="168.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="247.0" y="186.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">  return a + 2;</text>
<rect x="235.0" y="202.0" width="155.0" height="30.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="247.0" y="220.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">}</text>
<line x1="235.0" y1="149.0" x2="195.0" y2="115.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="215.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">call</text>
<text x="210.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Без LTO: непрямий виклик call scale;</text>
<text x="210.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">невикористана dead_fn() потрапляє в бінарник</text>
<line x1="415.0" y1="150.0" x2="465.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="440.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">LTO</text>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Після LTO: оптимізація всієї програми</text>
<rect x="490.0" y="65.0" width="320.0" height="175.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">main (результат міжмодульної оптимізації)</text>
<rect x="505.0" y="105.0" width="290.0" height="32.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="517.0" y="124.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">int main() {</text>
<rect x="505.0" y="141.0" width="290.0" height="32.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="517.0" y="160.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7fe0a0" text-anchor="start" font-weight="700">  return 42; // scale(10)*4+2 обчислено!</text>
<rect x="505.0" y="177.0" width="290.0" height="32.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="517.0" y="196.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#eaf6ee" text-anchor="start" font-weight="700">}</text>
<text x="650.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">1. Cross-TU Inlining: функцію scale() вбудовано в main()</text>
<text x="650.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">2. Constant Propagation: аргумент 10 розгорнуто (10*4+2 = 42)</text>
<text x="650.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">3. Dead Code Elimination: dead_fn() і scale() видалено</text>
<text x="420.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міжмодульні оптимізації перетворюють виклики через межі файлів на прямі константні вирази</text>
</svg>