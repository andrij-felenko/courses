<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девіртуалізація віртуальних функцій на етапі лінкування</text>
<text x="210.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Без LTO: непрямий виклик через vtable</text>
<rect x="40.0" y="75.0" width="150.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="115.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Об'єкт у пам'яті</text>
<rect x="50.0" y="110.0" width="130.0" height="26.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="115.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">vptr (покажчик)</text>
<rect x="50.0" y="142.0" width="130.0" height="26.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="115.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">поля даних...</text>
<rect x="230.0" y="75.0" width="150.0" height="105.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
<text x="305.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">Таблиця vtable</text>
<rect x="240.0" y="110.0" width="130.0" height="26.0" rx="4" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
<text x="305.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">&amp;Circle::draw</text>
<rect x="240.0" y="142.0" width="130.0" height="26.0" rx="4" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
<text x="305.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">&amp;Circle::area</text>
<line x1="180.0" y1="123.0" x2="230.0" y2="123.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="305.0" y1="180.0" x2="305.0" y2="230.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="305.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">call *%rax (непрямий перехід)</text>
<text x="210.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Компілятор не знає, чи існують інші класи в інших .o,</text>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тому змушений звертатися до пам'яті vtable під час роботи.</text>
<line x1="420.0" y1="50.0" x2="420.0" y2="340.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="630.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З LTO: аналіз ієрархії (CHA) + прямий виклик</text>
<rect x="449.5" y="78.5" width="361.0" height="43.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.6"/><text x="630.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Аналіз ієрархії класів (Class Hierarchy Analysis)</tspan><tspan x="630.0" dy="13.0">Вся програма перевірена: єдиний нащадок Shape — Circle!</tspan></text>
<line x1="630.0" y1="135.0" x2="630.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="182.9" width="340.0" height="44.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="201.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Девіртуалізація (Devirtualization):</tspan><tspan x="630.0" dy="13.7">call Circle::draw()  →  прямий виклик без vtable!</tspan></text>
<line x1="630.0" y1="240.0" x2="630.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.7" y="282.9" width="358.5" height="44.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Інлайнінг (Inlining):</tspan><tspan x="630.0" dy="13.7">Тіло Circle::draw() вбудовано прямо в місце виклику!</tspan></text>
<text x="420.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">LTO відкриває повну картину спадкування в проєкті, усуваючи накладні витрати ООП-поліморфізму</text>
</svg>