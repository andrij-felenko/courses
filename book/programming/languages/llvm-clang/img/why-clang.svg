<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три причини, чому Apple створила Clang замість GCC</text>
<text x="400.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому Apple не влаштовував GCC — три причини разом</text>
<rect x="40.0" y="80.0" width="220.0" height="180.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="150.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ЛІЦЕНЗІЯ</text>
<line x1="70.0" y1="126.0" x2="230.0" y2="126.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="150.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">GPL зобовʼязує</tspan><tspan x="150.0" dy="14.3">відкривати зміни;</tspan><tspan x="150.0" dy="14.3">дозвільна LLVM — ні</tspan></text>
<rect x="290.0" y="80.0" width="220.0" height="180.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="400.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">МОВА</text>
<line x1="320.0" y1="126.0" x2="480.0" y2="126.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="400.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Objective-C —</tspan><tspan x="400.0" dy="14.3">головна для Apple,</tspan><tspan x="400.0" dy="14.3">у GCC на других ролях</tspan></text>
<rect x="540.0" y="80.0" width="220.0" height="180.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="650.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ІНСТРУМЕНТИ</text>
<line x1="570.0" y1="126.0" x2="730.0" y2="126.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="650.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">GCC замкнений;</tspan><tspan x="650.0" dy="14.3">для IDE треба</tspan><tspan x="650.0" dy="14.3">перед-бібліотека</tspan></text>
<line x1="150.0" y1="260.0" x2="400.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="400.0" y1="260.0" x2="400.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="650.0" y1="260.0" x2="400.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="180.0" y="306.2" width="440.0" height="31.5" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/><text x="400.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">→ збудувати ВЛАСНИЙ перед поверх LLVM = Clang</tspan></text>
</svg>