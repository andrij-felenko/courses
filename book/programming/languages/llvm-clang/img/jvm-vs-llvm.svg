<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розвилка задуму: JVM на льоту проти LLVM наскрізно</text>
<line x1="410.0" y1="70.0" x2="410.0" y2="320.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="205.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">модель Java (JVM)</text>
<rect x="130.0" y="85.3" width="150.0" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">переносний</tspan><tspan x="205.0" dy="14.3">байткод</tspan></text>
<line x1="205.0" y1="130.7" x2="205.0" y2="176.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="177.3" width="190.0" height="45.3" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="205.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">віртуальна машина</tspan><tspan x="205.0" dy="14.3">+ JIT на льоту</tspan></text>
<text x="205.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">оптимізує ШМАТКАМИ під час виконання</text>
<text x="205.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">часу обмаль — глибоко копати ніколи</text>
<text x="615.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">задум LLVM</text>
<rect x="540.0" y="85.3" width="150.0" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="615.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">нейтральне</tspan><tspan x="615.0" dy="14.3">подання (IR)</tspan></text>
<line x1="615.0" y1="130.7" x2="615.0" y2="176.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="177.3" width="190.0" height="45.3" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="615.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">завчасна (AOT)</tspan><tspan x="615.0" dy="14.3">оптимізація</tspan></text>
<text x="615.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">бачить УСЮ програму разом</text>
<text x="615.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">часу скільки треба — оптимізує наскрізно</text>
<text x="410.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">«та сама ідея, але нижче рівнем і заздалегідь» — звідси назва Low Level Virtual Machine</text>
</svg>