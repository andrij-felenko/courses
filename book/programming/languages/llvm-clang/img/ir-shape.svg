<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">IR зблизька: та сама функція мовою LLVM</text>
<text x="200.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">як ви написали (C)</text>
<rect x="50.0" y="84.0" width="320.0" height="34.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="64.0" y="105.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">int add_scaled(int a, int b) {</text>
<rect x="50.0" y="124.0" width="320.0" height="34.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="64.0" y="145.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">    int t = a * 4;</text>
<rect x="50.0" y="164.0" width="320.0" height="34.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="64.0" y="185.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">    return t + b;</text>
<rect x="50.0" y="204.0" width="320.0" height="34.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="64.0" y="225.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">}</text>
<line x1="380.0" y1="170.0" x2="430.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="405.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">clang</text>
<text x="405.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">-emit-llvm</text>
<text x="610.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">проміжне подання LLVM (IR)</text>
<rect x="440.0" y="84.0" width="330.0" height="34.0" rx="8" fill="#151d2b" stroke="#0a120d" stroke-width="1.4"/><text x="454.0" y="104.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#bcd0ff" text-anchor="start" font-weight="700">define i32 @add_scaled(i32 %a, i32 %b) {</text>
<rect x="440.0" y="124.0" width="330.0" height="34.0" rx="8" fill="#151d2b" stroke="#0a120d" stroke-width="1.4"/><text x="454.0" y="144.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#bcd0ff" text-anchor="start" font-weight="700">  %t   = mul i32 %a, 4</text>
<rect x="440.0" y="164.0" width="330.0" height="34.0" rx="8" fill="#151d2b" stroke="#0a120d" stroke-width="1.4"/><text x="454.0" y="184.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#bcd0ff" text-anchor="start" font-weight="700">  %sum = add i32 %t, %b</text>
<rect x="440.0" y="204.0" width="330.0" height="34.0" rx="8" fill="#151d2b" stroke="#0a120d" stroke-width="1.4"/><text x="454.0" y="224.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#bcd0ff" text-anchor="start" font-weight="700">  ret i32 %sum</text>
<rect x="440.0" y="244.0" width="330.0" height="34.0" rx="8" fill="#151d2b" stroke="#0a120d" stroke-width="1.4"/><text x="454.0" y="264.9" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#bcd0ff" text-anchor="start" font-weight="700">}</text>
<text x="400.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожен %-регістр присвоєно РІВНО раз (SSA); тип явний (i32); ще не прив'язано до ядра</text>
</svg>