<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл пам'яті: динамічний розрахунок проти статичної таблиці LUT</text>
<rect x="40.0" y="60.0" width="360.0" height="350.0" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-width="1.5"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#f57f17" text-anchor="middle" font-weight="700">Динамічне обчислення (Runtime)</text>
<rect x="60.0" y="110.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#fbc02d" stroke-width="1.5"/><text x="220.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Код ініціалізації в .text</tspan><tspan x="220.0" dy="13.7">При кожному старті програми / виклику:</tspan><tspan x="220.0" dy="13.7">Виконується цикл розрахунку (напр. CRC32 / sin)</tspan></text>
<line x1="220.0" y1="185.0" x2="220.0" y2="215.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="220.0" width="320.0" height="85.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Використання ресурсів процесора:</tspan><tspan x="220.0" dy="15.0">• Витрата тактів CPU та енергії живлення</tspan><tspan x="220.0" dy="15.0">• Виділення буфера в RAM (.bss / .data)</tspan><tspan x="220.0" dy="15.0">• Ризик гонитви станів під час ініціалізації</tspan></text>
<rect x="60.0" y="325.0" width="320.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Підсумок: Додатковий оверхед часу,</tspan><tspan x="220.0" dy="15.6">витрата пам'яті RAM, код старту</tspan></text>
<rect x="460.0" y="60.0" width="360.0" height="350.0" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Compile-Time LUT (constexpr / consteval)</text>
<rect x="480.0" y="110.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Розрахунок у компіляторі (CTFE)</tspan><tspan x="640.0" dy="13.7">Під час збірки проєкту:</tspan><tspan x="640.0" dy="13.7">Компілятор сам виконує алгоритм і генерує масив</tspan></text>
<line x1="640.0" y1="185.0" x2="640.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="220.0" width="320.0" height="85.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Нульовий оверхед під час виконання:</tspan><tspan x="640.0" dy="12.3">• Таблиця кладеться безпосередньо в .rodata (Flash/ROM)</tspan><tspan x="640.0" dy="12.3">• Нуль тактів CPU на ініціалізацію</tspan><tspan x="640.0" dy="12.3">• Миттєвий доступ O(1) за індексом</tspan></text>
<rect x="480.0" y="325.0" width="320.0" height="65.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Підсумок: RAM = 0 байт, старт = 0 мкс,</tspan><tspan x="640.0" dy="15.6">чистий безпомилковий доступ</tspan></text>
</svg>