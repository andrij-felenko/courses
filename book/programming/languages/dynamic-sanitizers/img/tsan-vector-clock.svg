<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виявлення гонок даних через векторні годинники TSan</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виявлення гонок даних (Data Race) через векторні годинники TSan</text>
<rect x="40.0" y="60.0" width="340.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Потік 1 (Thread 1)</text>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Годинник T1: [T1: 12, T2: 4]</text>
<rect x="60.0" y="130.0" width="300.0" height="65.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="75.0" y="155.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0" fill="#1e293b" text-anchor="start" font-weight="700">x = 42;  // Write(X)</text>
<text x="75.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Тінь: Записано (T1, Epoch 12, Write)</text>
<rect x="60.0" y="220.0" width="300.0" height="70.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="75.0" y="245.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.0" fill="#0f766e" text-anchor="start" font-weight="700">pthread_mutex_unlock(&amp;m);</text>
<text x="75.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Публікація годинника T1 в м'ютекс: [12, 4]</text>
<text x="210.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">T1 закінчив запис змінної X</text>
<text x="210.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">і звільнив замок</text>
<rect x="460.0" y="60.0" width="340.0" height="340.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="630.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Потік 2 (Thread 2)</text>
<text x="630.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Годинник T2: [T1: 2, T2: 5]</text>
<rect x="480.0" y="130.0" width="300.0" height="65.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="495.0" y="155.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.0" fill="#b91c1c" text-anchor="start" font-weight="700">int v = x;  // Read(X)</text>
<text x="495.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Читання БЕЗ взяття м'ютекса!</text>
<rect x="480.0" y="220.0" width="300.0" height="100.0" rx="5" fill="#fff1f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="630.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Перевірка стану TSan:</text>
<text x="630.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Попередній запис був в T1 (епоха 12)</text>
<text x="630.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Поточний T2 знає про T1 лише епоху 2 (&lt; 12)</text>
<text x="630.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ Немає відношення happens-before!</text>
<text x="630.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ФАТАЛЬНА ПОМИЛКА:</text>
<text x="630.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">WARNING: ThreadSanitizer: data race on x</text>
<line x1="365.0" y1="160.0" x2="475.0" y2="160.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ГОНКА</text>
</svg>