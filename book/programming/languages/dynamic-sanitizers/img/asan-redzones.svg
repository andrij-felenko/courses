<text x="250.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Shadow: 0xFD 0xFD 0xFD 0xFD ... (heap-freed)</text>
<rect x="460.0" y="312.0" width="320.0" height="62.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять затримується в карантині</text>
<text x="620.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Будь-який доступ негайно генерує Use-After-Free</text>
</svg>