<text x="375.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Доступ дозволено (malloc)</text>
<rect x="510.0" y="80.0" width="290.0" height="60.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="655.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Права червона зона (40 B)</text>
<text x="655.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Отруєна пам'ять</text>
