<text x="655.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">heap-right-redzone</text>
<rect x="40.0" y="275.0" width="760.0" height="115.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Після free(ptr) — Карантинна черга (FIFO Quarantine Queue):</text>
