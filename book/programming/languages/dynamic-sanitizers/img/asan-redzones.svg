<text x="140.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ліва червона зона (32 B)</text>
<text x="140.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Отруєна пам'ять</text>
<rect x="245.0" y="80.0" width="260.0" height="60.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
