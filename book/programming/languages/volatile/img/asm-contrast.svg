<text x="58.0" y="222.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="700">  beq  loop</text>
<text x="352.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">→ вічний цикл</text>
<text x="205.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ff8a80" text-anchor="middle" font-weight="700">load НАД циклом → запис ISR невидимий</text>
<rect x="390.0" y="70.0" width="330.0" height="250.0" rx="10" fill="#0f1115" stroke="#27ae60" stroke-width="2.0"/>
