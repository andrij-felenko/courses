<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама програма: load над циклом проти load усередині</text>
<rect x="40.0" y="70.0" width="330.0" height="250.0" rx="10" fill="#0f1115" stroke="#c0392b" stroke-width="2.0"/>
<text x="205.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ff8a80" text-anchor="middle" font-weight="700">без volatile</text>
<text x="58.0" y="132.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd479" text-anchor="start" font-weight="700">  load r1, [flag]</text>
<text x="352.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">читаємо ОДИН раз</text>
