<text x="408.0" y="132.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="700">loop:</text>
<text x="408.0" y="162.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd479" text-anchor="start" font-weight="700">  load r1, [flag]</text>
<text x="702.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">читаємо ЩОРАЗУ</text>
<text x="408.0" y="192.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="700">  test r1</text>
<text x="702.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">з пам'яті</text>
<text x="408.0" y="222.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e8e8e8" text-anchor="start" font-weight="700">  beq  loop</text>
<text x="702.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-style="italic">→ побачить і вийде</text>
<text x="555.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9be7b4" text-anchor="middle" font-weight="700">load У циклі → зміну від ISR видно</text>
