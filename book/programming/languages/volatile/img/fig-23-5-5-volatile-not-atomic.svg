<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Важливо: volatile дає СВІЖІСТЬ, але не АТОМАРНІСТЬ</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">voltatile гарантує читання з пам'яті, та не захищає від переривання посеред дії</text>
<rect x="60.0" y="90.0" width="380.0" height="130.0" rx="12" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Що volatile ДАЄ</text>
<text x="82.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ завжди читати/писати в пам'ять</text>
<text x="82.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ не кешувати в регістрі</text>
<text x="82.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✓ не прибирати «зайві» доступи</text>
<rect x="500.0" y="90.0" width="380.0" height="130.0" rx="12" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="690.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Чого volatile НЕ дає</text>
<text x="522.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ не робить дію неподільною</text>
<text x="522.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ багатобайтне читання ще можна</text>
<text x="540.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перервати посередині (розрив)</text>
<text x="522.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">✗ не замінює критичну секцію</text>
<text x="250.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розрив (tearing) 64-біт значення:</text>
<rect x="120.0" y="270.0" width="130.0" height="34.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="185.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">читаю старші</text>
<circle cx="265.0" cy="287.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="265.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ ISR змінив усе</text>
<rect x="280.0" y="270.0" width="130.0" height="34.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="345.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">читаю молодші</text>
<text x="265.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ половина стара + половина нова = сміття</text>
<rect x="560.0" y="250.0" width="320.0" height="100.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="720.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому для багатобайтних / складених</text>
<text x="720.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">даних треба ще й захист від переривання</text>
<text x="720.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">(критична секція) — це наступна тема §23.6.</text>
</svg>
