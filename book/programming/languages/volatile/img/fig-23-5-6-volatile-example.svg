<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">До й після: одне слово, що все вирішує</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий код зависає без volatile і працює з ним</text>
<rect x="60.0" y="90.0" width="400.0" height="150.0" rx="10" fill="#0f1115" stroke="#c0271e" stroke-width="1.8"/>
<text x="260.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="1" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="80" y="120" font-family="Consolas, monospace" font-size="14" fill="#ff8a7a" font-weight="bold">bool flag = false;</text>
<text x="80" y="146" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">void IRAM_ATTR isr(){ flag=true; }</text>
<text x="80" y="180" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">// очікуємо подію:</text>
<text x="80" y="206" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">while(!flag){ }</text>
<text x="80" y="230" font-family="Consolas, monospace" font-size="13" fill="#ff8a7a" font-weight="bold">// ЗАВИСАЄ назавжди ✗</text>
<text x="260.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">без volatile — баг</text>
<rect x="490.0" y="90.0" width="400.0" height="150.0" rx="10" fill="#0f1115" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="510" y="120" font-family="Consolas, monospace" font-size="14" fill="#7ee0a0" font-weight="bold">volatile bool flag = false;</text>
<text x="510" y="146" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">void IRAM_ATTR isr(){ flag=true; }</text>
<text x="510" y="180" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">// очікуємо подію:</text>
<text x="510" y="206" font-family="Consolas, monospace" font-size="14" fill="#e8e8e8">while(!flag){ }</text>
<text x="510" y="230" font-family="Consolas, monospace" font-size="13" fill="#7ee0a0" font-weight="bold">// виходить, щойно подія ✓</text>
<text x="690.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">з volatile — працює</text>
<rect x="180.0" y="300.0" width="580.0" height="50.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Різниця — одне слово volatile перед типом. Воно й перетворює «зависання» на робочий код.</text>
<text x="470.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Звичка: КОЖНУ змінну, спільну з обробником, оголошуй volatile.</text>
</svg>
