<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Без volatile цикл звіряється зі старою копією в регістрі</text>
<rect x="60.0" y="80.0" width="250.0" height="110.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="185.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПАМ'ЯТЬ</text>
<rect x="110.0" y="122.0" width="150.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="185.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">flag = true</text>
<text x="185.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(свіже значення)</text>
<rect x="450.0" y="80.0" width="250.0" height="110.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="575.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">РЕГІСТР процесора</text>
<rect x="500.0" y="122.0" width="150.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="575.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">flag = false</text>
<text x="575.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(застаріла копія)</text>
<line x1="185.0" y1="250.0" x2="185.0" y2="192.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="185.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">обробник (ISR) записав</text>
<text x="185.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">flag = true у пам'ять</text>
<line x1="575.0" y1="250.0" x2="575.0" y2="192.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="575.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">цикл while(!flag) звіряє</text>
<text x="575.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">лише регістр → крутиться вічно</text>
<line x1="330.0" y1="135.0" x2="430.0" y2="135.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="380.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">не зазирає</text>
</svg>