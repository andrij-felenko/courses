<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три оптимізації читань: кешувати, прибирати, переставляти</text>
<rect x="40.0" y="70.0" width="220.0" height="130.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">У регістр</text>
<text x="150.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">часту змінну тримати</text>
<text x="150.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">в регістрі, не бігати</text>
<text x="150.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">щоразу в пам'ять</text>
<rect x="270.0" y="70.0" width="220.0" height="130.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="380.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Прибрати читання</text>
<text x="380.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">якщо між читаннями</text>
<text x="380.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ніхто не писав —</text>
<text x="380.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">навіщо читати двічі?</text>
<rect x="500.0" y="70.0" width="220.0" height="130.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="610.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Переставити</text>
<text x="610.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">змінити порядок</text>
<text x="610.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">доступів до пам'яті</text>
<text x="610.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">задля швидкості</text>
<text x="380.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для звичайного коду це КОРЕКТНО — якщо змінну міняє лише видимий код.</text>
<text x="380.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Обробник міняє її «за спиною» оптимізатора — і тут потрібен volatile.</text>
</svg>