<text x="95.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ISR пише</text>
<text x="95.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">flag=true</text>
<line x1="610.0" y1="128.0" x2="507.0" y2="128.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
