<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому так стається: компілятор «надто розумний»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">оптимізатор припускає, що змінні міняє лише видимий код, — і це ламається з ISR</text>
<rect x="50.0" y="90.0" width="270.0" height="110.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="185.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Кешує в регістрі</text>
<text x="185.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримає змінну в регістрі,</text>
<text x="185.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не бігаючи в пам'ять щоразу</text>
<rect x="345.0" y="90.0" width="270.0" height="110.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Прибирає «зайві» читання</text>
<text x="480.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо в коді нема запису —</text>
<text x="480.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">навіщо перечитувати?</text>
<rect x="640.0" y="90.0" width="270.0" height="110.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="775.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Переставляє доступи</text>
<text x="775.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">міняє порядок читань/</text>
<text x="775.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">записів задля швидкості</text>
<rect x="80.0" y="230.0" width="360.0" height="110.0" rx="10" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="260.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Для звичайного коду — ДОБРЕ</text>
<text x="260.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо змінну міняє лише ваш код,</text>
<text x="260.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ці хитрощі прискорюють і нічого</text>
<text x="260.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не ламають — все коректно.</text>
<rect x="500.0" y="230.0" width="360.0" height="110.0" rx="10" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.6"/>
<text x="680.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">З перериванням — ПОМИЛКА</text>
<text x="680.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ISR міняє змінну «за спиною»</text>
<text x="680.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оптимізатора — і той працює зі</text>
<text x="680.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">старою копією. Тут і треба volatile.</text>
</svg>
