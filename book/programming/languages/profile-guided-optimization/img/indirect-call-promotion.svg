<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спекулятивна девіртуалізація та Indirect Call Promotion</text>
<line x1="430.0" y1="45.0" x2="430.0" y2="385.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="215.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Звичайний поліморфний виклик</text>
<rect x="95.0" y="58.5" width="240.0" height="43.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="215.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">obj-&gt;process(data)</tspan><tspan x="215.0" dy="13.0">(виклик через vtable або покажчик)</tspan></text>
<line x1="215.0" y1="110.0" x2="215.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="95.0" y="147.9" width="240.0" height="54.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="215.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. Завантаження vptr з об'єкта</tspan><tspan x="215.0" dy="12.3">2. Читання адреси методу з vtable</tspan><tspan x="215.0" dy="12.3">3. Непрямий перехід: call *%rax</tspan></text>
<line x1="215.0" y1="215.0" x2="215.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="115.0" y="258.5" width="200.0" height="43.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="215.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Цільова функція</tspan><tspan x="215.0" dy="13.0">(компілятор не знає яка)</tspan></text>
<rect x="50.0" y="311.7" width="330.0" height="66.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/><text x="215.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Обмеження:</tspan><tspan x="215.0" dy="12.3">• Неможливо заінлайнити</tspan><tspan x="215.0" dy="12.3">• Помилки апаратного передбачення переходів (BTB)</tspan><tspan x="215.0" dy="12.3">• Блокування конвеєра</tspan></text>
<text x="645.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З PGO: Indirect Call Promotion (ICP)</text>
<rect x="484.8" y="54.1" width="320.4" height="41.9" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.4"/><text x="645.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Профіль значень (Value Profile):</tspan><tspan x="645.0" dy="12.3">obj-&gt;process вказує на FastHandler у 99.4% випадків</tspan></text>
<line x1="645.0" y1="105.0" x2="645.0" y2="135.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="505.0" y="148.5" width="280.0" height="43.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="645.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Спекулятивна перевірка типу:</tspan><tspan x="645.0" dy="13.0">if (obj-&gt;vptr == FastHandler::vtable)</tspan></text>
<line x1="580.0" y1="198.0" x2="540.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">99.4%</text>
<line x1="710.0" y1="198.0" x2="750.0" y2="240.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="765.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0.6%</text>
<rect x="445.0" y="247.9" width="170.0" height="54.2" rx="6" fill="#ebfbee" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Прямий виклик +</tspan><tspan x="530.0" dy="12.3">АГРЕСИВНИЙ ІНЛАЙНІНГ</tspan><tspan x="530.0" dy="12.3">(FastHandler::process)</tspan></text>
<rect x="690.0" y="254.1" width="140.0" height="41.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="760.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">call *%rax</tspan><tspan x="760.0" dy="12.3">(резервний непрямий)</tspan></text>
<rect x="475.0" y="311.7" width="340.0" height="66.6" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.2"/><text x="645.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Переваги:</tspan><tspan x="645.0" dy="12.3">• Інлайнінг розкриває автовекторизацію (SIMD)</tspan><tspan x="645.0" dy="12.3">• Згортання констант та усунення підвиразів</tspan><tspan x="645.0" dy="12.3">• Прямий перехід без промахів BTB</tspan></text>
</svg>