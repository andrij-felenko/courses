<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="780.0" height="330.0" rx="12" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бар'єр компілятора (&quot;memory&quot; clobber) проти Апаратного бар'єра процесора</text>
<rect x="40.0" y="70.0" width="360.0" height="260.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Програмний бар'єр компілятора</text>
<rect x="55.0" y="115.0" width="330.0" height="45.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="220.0" y="141.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">asm volatile (&quot;&quot; ::: &quot;memory&quot;);</tspan></text>
<rect x="55.0" y="170.0" width="330.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="220.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ДІЯ НА ЕТАПІ КОМПІЛЯЦІЇ:</tspan><tspan x="220.0" dy="13.0">• Забороняє компілятору переставляти читання й записи</tspan><tspan x="220.0" dy="13.0">• Скидає кешовані в регістрах значення змінних у RAM</tspan><tspan x="220.0" dy="13.0">• Не генерує ЖОДНОЇ машинної інструкції (0 байтів коду)</tspan></text>
<rect x="55.0" y="260.0" width="330.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">МЕЖА ДІЇ: безсилий проти апаратного</tspan><tspan x="220.0" dy="11.7">позачергового виконання інструкцій CPU (Out-of-Order)</tspan></text>
<rect x="420.0" y="70.0" width="360.0" height="260.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратний бар'єр процесора (CPU Barrier)</text>
<rect x="435.0" y="115.0" width="330.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="600.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">asm volatile (&quot;mfence&quot; ::: &quot;memory&quot;); // x86</tspan><tspan x="600.0" dy="13.7">asm volatile (&quot;dmb ish&quot; ::: &quot;memory&quot;); // ARM</tspan></text>
<rect x="435.0" y="170.0" width="330.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="600.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ДІЯ НА ЕТАПІ ВИКОНАННЯ (РУХ У КРЕМНІЇ):</tspan><tspan x="600.0" dy="13.0">• Зупиняє конвеєр вибірки/виконання CPU</tspan><tspan x="600.0" dy="13.0">• Скидає буфери запису (Store Buffers) у кеш L1/L2</tspan><tspan x="600.0" dy="13.0">• Забезпечує когерентність та видимість для інших ядер</tspan></text>
<rect x="435.0" y="260.0" width="330.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РЕЗУЛЬТАТ: гарантує фізичний порядок доступу</tspan><tspan x="600.0" dy="13.0">до оперативної пам'яті між різними ядрами</tspan></text>
</svg>