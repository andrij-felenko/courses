<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="780.0" height="320.0" rx="12" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтеграція Extended Asm у проміжне представлення та генератор коду</text>
<rect x="40.0" y="75.0" width="220.0" height="235.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="150.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Синтаксичний аналіз (IR)</text>
<rect x="52.0" y="120.0" width="196.0" height="75.0" rx="6" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="132.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">asm volatile (</tspan><tspan x="150.0" dy="14.3">  &quot;template&quot;</tspan><tspan x="150.0" dy="14.3">  : outputs</tspan><tspan x="150.0" dy="14.3">  : inputs</tspan><tspan x="150.0" dy="14.3">)</tspan></text>
<rect x="52.0" y="205.0" width="196.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="150.0" y="230.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Компілятор будує вузол IR:</tspan><tspan x="150.0" dy="13.7">• список змінних-виходів</tspan><tspan x="150.0" dy="13.7">• список змінних-входів</tspan><tspan x="150.0" dy="13.7">• рядки обмежень (constraints)</tspan></text>
<line x1="265.0" y1="192.5" x2="295.0" y2="192.5" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="75.0" width="220.0" height="235.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="410.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Розподіл регістрів</text>
<rect x="312.0" y="120.0" width="196.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="410.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Розбір обмежень:</tspan><tspan x="410.0" dy="13.7">&quot;r&quot; -&gt; довільний GP регістр</tspan><tspan x="410.0" dy="13.7">&quot;=a&quot; -&gt; фіксований RAX/EAX</tspan><tspan x="410.0" dy="13.7">&quot;m&quot; -&gt; адреса в пам'яті</tspan></text>
<rect x="312.0" y="205.0" width="196.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="410.0" y="232.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Генерація пересилань:</tspan><tspan x="410.0" dy="12.3">• завантаження входів у регістри</tspan><tspan x="410.0" dy="12.3">• резервування clobbers</tspan><tspan x="410.0" dy="12.3">• виділення пам'яті для виходів</tspan></text>
<line x1="525.0" y1="192.5" x2="555.0" y2="192.5" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="560.0" y="75.0" width="220.0" height="235.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="670.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Емісія тексту асемблера</text>
<rect x="572.0" y="120.0" width="196.0" height="75.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="670.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Підстановка операндів:</tspan><tspan x="670.0" dy="13.7">%0 -&gt; %rax, %1 -&gt; %rbx</tspan><tspan x="670.0" dy="13.7">Рядок-шаблон перетворюється</tspan><tspan x="670.0" dy="13.7">на чисті інструкції</tspan></text>
<rect x="572.0" y="205.0" width="196.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="670.0" y="230.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Фінальний вивід:</tspan><tspan x="670.0" dy="13.7">Компілятор передає текст</tspan><tspan x="670.0" dy="13.7">прямо у системний асемблер</tspan><tspan x="670.0" dy="13.7">(GNU as / LLVM MC)</tspan></text>
</svg>