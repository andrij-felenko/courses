<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="780.0" height="330.0" rx="12" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний розрив: непрозорий MSVC __asm проти декларативного GCC/Clang Asm</text>
<rect x="40.0" y="70.0" width="360.0" height="260.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="220.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">MSVC x86: Блоковий __asm</text>
<rect x="55.0" y="115.0" width="330.0" height="65.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="220.0" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">__asm {</tspan><tspan x="220.0" dy="14.3">  mov eax, x</tspan><tspan x="220.0" dy="14.3">  add eax, y</tspan><tspan x="220.0" dy="14.3">  mov z, eax</tspan><tspan x="220.0" dy="14.3">}</tspan></text>
<rect x="55.0" y="190.0" width="330.0" height="125.0" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/><text x="220.0" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ВЛАСТИВОСТІ МОДЕЛІ:</tspan><tspan x="220.0" dy="13.0">• Непрозорий чорний ящик для оптимізатора</tspan><tspan x="220.0" dy="13.0">• Компілятор змушений скидати всі регістри на стек</tspan><tspan x="220.0" dy="13.0">• Неможливо вказати вхідні/вихідні залежності</tspan><tspan x="220.0" dy="13.0">• Зламав глобальний розподіл регістрів у SSA</tspan><tspan x="220.0" dy="13.0">• ПОВНІСТЮ ВИДАЛЕНО у MSVC для x86-64 та ARM64</tspan></text>
<rect x="420.0" y="70.0" width="360.0" height="260.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">GCC / Clang: Extended Asm Contract</text>
<rect x="435.0" y="115.0" width="330.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="600.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">asm volatile (</tspan><tspan x="600.0" dy="13.7">  &quot;add %1, %0&quot;</tspan><tspan x="600.0" dy="13.7">  : &quot;=r&quot; (z)</tspan><tspan x="600.0" dy="13.7">  : &quot;r&quot; (x), &quot;0&quot; (y) : &quot;cc&quot;</tspan><tspan x="600.0" dy="13.7">);</tspan></text>
<rect x="435.0" y="190.0" width="330.0" height="125.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="600.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ВЛАСТИВОСТІ МОДЕЛІ:</tspan><tspan x="600.0" dy="11.7">• Чіткий контракт залежностей (inputs, outputs, clobbers)</tspan><tspan x="600.0" dy="11.7">• Повна інтеграція у граф SSA та конвеєр оптимізацій</tspan><tspan x="600.0" dy="11.7">• Регістри виділяються компілятором без зайвих spill</tspan><tspan x="600.0" dy="11.7">• Працює на всіх архітектурах (x86, x64, ARM, RISC-V)</tspan><tspan x="600.0" dy="11.7">• Загальновизнаний промисловий стандарт</tspan></text>
</svg>