<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="780.0" height="340.0" rx="12" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння оптимізаційного шляху: Вбудовані функції (Intrinsics) vs Inline Asm</text>
<rect x="40.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вбудовані функції (Intrinsics)</text>
<rect x="55.0" y="115.0" width="330.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="220.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">__m128 c = _mm_add_ps(a, b);</tspan><tspan x="220.0" dy="14.3">int lz = __builtin_clz(x);</tspan></text>
<rect x="55.0" y="170.0" width="330.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="220.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ПЕРЕВАГИ ОПТИМІЗАЦІЇ:</tspan><tspan x="220.0" dy="11.7">• Повна видимість у проміжному графі (SSA IR)</tspan><tspan x="220.0" dy="11.7">• Constant Folding: вираховування констант під час компіляції</tspan><tspan x="220.0" dy="11.7">• Dead Code Elimination: видалення непотрібного коду</tspan><tspan x="220.0" dy="11.7">• Автовекторизація та вільне планування інструкцій</tspan><tspan x="220.0" dy="11.7">• Сувора типізація та захист від помилок типів</tspan></text>
<rect x="55.0" y="275.0" width="330.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">ВИСНОВОК: Оптимальний вибір для обчислень, SIMD та бітових операцій</tspan></text>
<rect x="420.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="600.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вбудований асемблер (Inline Asm)</text>
<rect x="435.0" y="115.0" width="330.0" height="45.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="600.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">asm (&quot;addps %1, %0&quot; : &quot;+x&quot;(a) : &quot;x&quot;(b));</tspan><tspan x="600.0" dy="13.7">asm (&quot;bsr %1, %0&quot; : &quot;=r&quot;(r) : &quot;r&quot;(x));</tspan></text>
<rect x="435.0" y="170.0" width="330.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="600.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ОБМЕЖЕННЯ ОПТИМІЗАЦІЇ:</tspan><tspan x="600.0" dy="11.7">• Непрозорий текст для оптимізатора IR</tspan><tspan x="600.0" dy="11.7">• Неможливо згорнути константи всередині рядка</tspan><tspan x="600.0" dy="11.7">• Жорсткі обмеження регістрів створюють зайві копіювання</tspan><tspan x="600.0" dy="11.7">• Легко помилитися з clobbers та пошкодити стан процесора</tspan><tspan x="600.0" dy="11.7">• Не переноситься між різними архітектурами</tspan></text>
<rect x="435.0" y="275.0" width="330.0" height="45.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ВИСНОВОК: Потрібен виключно для керування залізом (MSR, CR3, порти, бар'єри)</tspan></text>
</svg>