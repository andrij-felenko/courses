<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійна компіляція різними: незалежний свідок проти отрути</text>
<rect x="264.8" y="37.0" width="190.4" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="58.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Джерело компілятора A</tspan><tspan x="360.0" dy="16.9">(те саме, читане обома)</tspan></text>
<rect x="60.0" y="140.0" width="240.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="180.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підозрюваний A збирає</text>
<text x="180.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">джерело A → бінарник X</text>
<rect x="420.0" y="140.0" width="240.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="540.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незалежний T збирає джерело A,</text>
<text x="540.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тим результатом — знову → Y</text>
<line x1="300.0" y1="92.0" x2="180.0" y2="136.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="420.0" y1="92.0" x2="540.0" y2="136.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="233.8" y="237.5" width="252.5" height="35.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">X  vs  Y   —   біт-у-біт?</tspan></text>
<line x1="180.0" y1="200.0" x2="320.0" y2="236.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="200.0" x2="400.0" y2="236.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">збіглися → джерело чесне</text>
<text x="560.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">різні → у X отрута</text>
</svg>