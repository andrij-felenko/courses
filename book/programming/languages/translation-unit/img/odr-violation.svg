<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порушення One Definition Rule (ODR) через невідповідність макета пам'яті</text>
<rect x="190.0" y="60.0" width="380.0" height="65.0" rx="6" fill="#fdf6e3" stroke="#b79a5e" stroke-width="1.5"/><text x="380.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a14" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">struct Packet {</tspan><tspan x="380.0" dy="13.0">  int id;</tspan><tspan x="380.0" dy="13.0">#ifdef DEBUG</tspan><tspan x="380.0" dy="13.0">  char tag[8];</tspan><tspan x="380.0" dy="13.0">#endif</tspan><tspan x="380.0" dy="13.0">  int payload;</tspan><tspan x="380.0" dy="13.0">};</tspan></text>
<line x1="280.0" y1="130.0" x2="190.0" y2="160.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="130.0" x2="570.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="157.3" width="240.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">TU 1 (sender.cpp)</tspan><tspan x="190.0" dy="14.3">-DDEBUG (Розмір = 16B)</tspan></text>
<rect x="70.0" y="215.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Зсуви полів у TU 1:</tspan><tspan x="190.0" dy="13.0">[+0] id (4B)</tspan><tspan x="190.0" dy="13.0">[+4] tag (8B) [включно з padding]</tspan><tspan x="190.0" dy="13.0">[+12] payload (4B)</tspan></text>
<rect x="450.0" y="157.3" width="240.0" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">TU 2 (receiver.cpp)</tspan><tspan x="570.0" dy="14.3">DEBUG вимкнено (Розмір = 8B)</tspan></text>
<rect x="450.0" y="215.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Зсуви полів у TU 2:</tspan><tspan x="570.0" dy="13.0">[+0] id (4B)</tspan><tspan x="570.0" dy="13.0">[+4] payload (4B)</tspan><tspan x="570.0" dy="13.0">(поле tag взагалі відсутнє)</tspan></text>
<rect x="70.0" y="290.0" width="620.0" height="45.0" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/><text x="380.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#856404" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Порушення ODR (Ill-Formed, No Diagnostic Required): лінкер не перевіряє сумісність внутрішнього макета структур.</tspan><tspan x="380.0" dy="11.7">Читання payload у receiver.cpp читає байти tag з sender.cpp — руйнування пам'яті та приховані збої!</tspan></text>
</svg>