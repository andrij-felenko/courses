<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Tcl_Obj: рядок назовні, кеш типу всередині</text>
<rect x="220.0" y="70.0" width="320.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="380.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">один об'єкт-значення (Tcl_Obj)</text>
<rect x="234.0" y="86.0" width="292.0" height="52.0" rx="6" fill="#13202a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="380.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8fcf9f" text-anchor="middle">рядкове подання</text>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#eef6ef" text-anchor="middle" font-weight="700">&quot;1 2 3&quot;</text>
<rect x="234.0" y="150.0" width="292.0" height="56.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">внутрішнє подання (кеш типу)</text>
<text x="380.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#256b38" text-anchor="middle" font-weight="700">список [1][2][3]</text>
<text x="70.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">перший доступ</text>
<text x="70.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">як список:</text>
<text x="70.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">розібрати РАЗ,</text>
<text x="70.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">запам'ятати</text>
<line x1="190.0" y1="160.0" x2="216.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">далі — той самий</text>
<text x="690.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">тип майже безкоштовно:</text>
<text x="690.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">кеш уже готовий</text>
<line x1="700.0" y1="186.0" x2="544.0" y2="178.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Мерехтіння (shimmering): просиш то як число, то як список —</text>
<text x="380.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кеш щоразу викидається й будується наново → втрата, якщо в гарячому циклі</text>
<rect x="130.0" y="292.0" width="500.0" height="44.0" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/>
<text x="380.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">число → список → число → список …</text>
<text x="380.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожна стрілка = розбір заново</text>
</svg>