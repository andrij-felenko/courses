<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">repeat N {body}: власна керівна конструкція через відкладене виконання тіла</text>
<text x="400.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Власна керівна конструкція: тіло — рядок, виконаний відкладено</text>
<rect x="250.0" y="52.0" width="300.0" height="58.0" rx="9" fill="#13202a" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="400.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#eef6ef" text-anchor="middle" font-weight="700">repeat 3 {</text>
<text x="400.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#eef6ef" text-anchor="middle" font-weight="700">puts &quot;крок $i&quot; }</text>
<text x="566.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">число 3 і тіло-рядок —</text>
<text x="566.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">обидва просто аргументи</text>
<rect x="250.0" y="150.0" width="300.0" height="66.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="400.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">C-команда RepeatCmd</text>
<text x="400.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тіло НЕ чіпає — лише зберігає й крутить цикл</text>
<line x1="400.0" y1="112.0" x2="400.0" y2="148.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="218.0" x2="400.0" y2="236.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">N разів: виконати тіло-рядок у кадрі того, хто покликав (uplevel 1)</text>
<line x1="155.0" y1="256.0" x2="155.0" y2="264.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="266.0" width="150.0" height="74.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
