<rect x="325.0" y="266.0" width="150.0" height="74.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="400.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#256b38" text-anchor="middle" font-weight="700">оберт 2</text>
<text x="400.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Tcl_EvalObjEx</text>
<text x="400.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(interp, body, 0)</text>
<line x1="645.0" y1="256.0" x2="645.0" y2="264.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570.0" y="266.0" width="150.0" height="74.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="645.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#256b38" text-anchor="middle" font-weight="700">оберт 3</text>
<text x="645.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Tcl_EvalObjEx</text>
<text x="645.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(interp, body, 0)</text>
<rect x="120.0" y="356.0" width="560.0" height="44.0" rx="8" fill="#f6f4ec" stroke="#a98a2a" stroke-width="1.6"/>
<text x="400.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a6312" text-anchor="middle" font-weight="700">Точнісінько так само влаштовані вбудовані if і while:</text>
<text x="400.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">беруть тіло-рядок і самі вирішують, коли й скільки разів його виконати.</text>
</svg>