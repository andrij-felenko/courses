<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий закон прибирає задумане на МК</text>
<text x="250.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">як написано</text>
<text x="600.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">що згенеровано (-O2)</text>
<text x="40.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Затримка порожнім циклом</text>
<rect x="240.0" y="92.0" width="240.0" height="42.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="254.0" y="116.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">for(i=0;i&lt;9999;i++);</text>
<line x1="486.0" y1="113.0" x2="536.0" y2="113.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="544.0" y="92.0" width="220.0" height="42.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="558.0" y="116.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7fe0a0" text-anchor="start" font-weight="700">(зникло)</text>
<text x="544.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">тіло нічого не змінює → мертве</text>
<text x="40.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Читання регістра-порту</text>
<rect x="240.0" y="188.0" width="240.0" height="42.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="254.0" y="212.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#eaf6ee" text-anchor="start" font-weight="700">while(!(REG &amp; RDY));</text>
<line x1="486.0" y1="209.0" x2="536.0" y2="209.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="544.0" y="188.0" width="220.0" height="42.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="558.0" y="212.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7fe0a0" text-anchor="start" font-weight="700">прочитав раз, крутить далі</text>
<text x="544.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">REG «не міняється» у коді</text>
<rect x="60.0" y="300.0" width="680.0" height="60.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="400.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Це не баг компілятора — код не оголосив ці доступи спостережуваними.</tspan><tspan x="400.0" dy="13.7">volatile переводить доступ через огорожу — і правило «ніби» його вже не чіпає.</tspan></text>
</svg>