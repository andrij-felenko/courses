<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило «ніби»: огорожа спостережуваного</text>
<rect x="30.0" y="60.0" width="720.0" height="320.0" rx="16" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/>
<text x="390.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">СПОСТЕРЕЖУВАНА ПОВЕДІНКА — чіпати НЕ можна</text>
<rect x="56.0" y="112.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="206.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">доступи до volatile-комірок</tspan></text>
<rect x="56.0" y="162.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="206.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">ввід-вивід (файли, порти, консоль)</tspan></text>
<rect x="56.0" y="212.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="206.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">факт і порядок завершення програми</tspan></text>
<rect x="400.0" y="108.0" width="340.0" height="220.0" rx="14" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="570.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">внутрішня кухня — вільно переписати</text>
<text x="418.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• тримати змінну в регістрі чи в пам'яті</text>
<text x="418.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• порядок незалежних обчислень</text>
<text x="418.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• викинути мертвий код і зайві читання</text>
<text x="418.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• порахувати сталі наперед, злити цикли</text>
<text x="390.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">рівність лише на огорожі: що видно ззовні — збігається; як усередині — байдуже</text>
</svg>