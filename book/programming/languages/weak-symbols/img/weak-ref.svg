<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слабке посилання: необов'язкова залежність без #ifdef</text>
<rect x="220.0" y="73.3" width="280.0" height="45.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">if (optional_logger_init)</tspan><tspan x="360.0" dy="14.3">    optional_logger_init();</tspan></text>
<text x="360.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">перевірка дивиться на саму АДРЕСУ символу</text>
<rect x="40.0" y="210.0" width="220.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">модуль у збірці</tspan><tspan x="150.0" dy="13.0">адреса справжня → виклик іде</tspan></text>
<line x1="300.0" y1="118.0" x2="150.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="210.0" width="220.0" height="44.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">модуля нема</tspan><tspan x="570.0" dy="13.0">адреса 0 → виклик пропущено</tspan></text>
<line x1="420.0" y1="118.0" x2="570.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">слабке посилання: нема цілі — не помилка, а нуль; той самий код працює обома способами</text>
</svg>