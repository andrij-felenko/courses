<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий цикл копіювання, різний машинний код</text>
<rect x="122.9" y="58.0" width="124.2" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="79.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">БЕЗ restrict</tspan></text>
<rect x="50.0" y="110.0" width="270.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">перекриття не виключене</tspan><tspan x="185.0" dy="15.6">-&gt; строго по черзі:</tspan><tspan x="185.0" dy="15.6"></tspan><tspan x="185.0" dy="15.6">load  src[0]</tspan><tspan x="185.0" dy="15.6">store dst[0]</tspan><tspan x="185.0" dy="15.6">load  src[1]</tspan><tspan x="185.0" dy="15.6">store dst[1]</tspan><tspan x="185.0" dy="15.6">...  (n разів, скалярно)</tspan></text>
<rect x="481.6" y="58.0" width="106.8" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="79.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">З restrict</tspan></text>
<rect x="400.0" y="110.0" width="270.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">перекриття виключене</tspan><tspan x="535.0" dy="15.6">-&gt; укрупнено, векторно:</tspan><tspan x="535.0" dy="15.6"></tspan><tspan x="535.0" dy="15.6">vload  src[0..3]</tspan><tspan x="535.0" dy="15.6">vstore dst[0..3]</tspan><tspan x="535.0" dy="15.6">vload  src[4..7]</tspan><tspan x="535.0" dy="15.6">vstore dst[4..7]</tspan><tspan x="535.0" dy="15.6">... (n/4 разів)</tspan></text>
</svg>