<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порушення: два типи на ОДНІЙ комірці</text>
<rect x="280.0" y="150.0" width="160.0" height="70.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/><text x="360.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">одна комірка</tspan><tspan x="360.0" dy="18.2">пам'яті</tspan></text>
<rect x="110.4" y="70.0" width="79.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">float* f</tspan><tspan x="150.0" dy="16.9">(пише)</tspan></text>
<line x1="150.0" y1="120.0" x2="285.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="539.1" y="70.0" width="71.9" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="575.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">int* p</tspan><tspan x="575.0" dy="16.9">(читає)</tspan></text>
<line x1="575.0" y1="120.0" x2="435.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="270.0" width="220.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">думає: f і p — різне,</tspan><tspan x="230.0" dy="15.6">тож читання p можна</tspan><tspan x="230.0" dy="15.6">не оновлювати</tspan></text>
<rect x="380.0" y="270.0" width="220.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">результат: p читає</tspan><tspan x="490.0" dy="15.6">старе значення →</tspan><tspan x="490.0" dy="15.6">сміття (це UB)</tspan></text>
</svg>