<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лексичний проти динамічного пошуку ідентифікатора</text>
<rect x="25.0" y="20.0" width="350.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="36.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ЛЕКСИЧНА ВИДИМІСТЬ (Lexical Scope)</tspan><tspan x="200.0" dy="14.3">Пошук за структурою сирцевого тексту (AST)</tspan></text>
<rect x="25.0" y="70.0" width="350.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">var x = 10; // глобальний x</tspan><tspan x="200.0" dy="13.0">function bar() { print(x); }</tspan><tspan x="200.0" dy="13.0">function foo() { var x = 20; bar(); }</tspan><tspan x="200.0" dy="13.0">foo();</tspan></text>
<rect x="25.0" y="155.0" width="350.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Шлях розв'язання імені x:</tspan><tspan x="200.0" dy="13.0">1. bar() шукає x у власному блоці -&gt; не знайдено</tspan><tspan x="200.0" dy="13.0">2. bar() підіймається до лексичного предка: Global</tspan><tspan x="200.0" dy="13.0">3. Знайдено global x = 10</tspan><tspan x="200.0" dy="13.0"></tspan><tspan x="200.0" dy="13.0">Результат: print(x) друкує 10</tspan><tspan x="200.0" dy="13.0">(визначено місцем написання функції)</tspan></text>
<line x1="385.0" y1="180.0" x2="395.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="405.0" y="20.0" width="350.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="36.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ДИНАМІЧНА ВИДИМІСТЬ (Dynamic Scope)</tspan><tspan x="580.0" dy="14.3">Пошук за стеком активних викликів (Call Stack)</tspan></text>
<rect x="405.0" y="70.0" width="350.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">global x = 10;</tspan><tspan x="580.0" dy="13.0">def bar(): print(x)</tspan><tspan x="580.0" dy="13.0">def foo(): x = 20; bar()</tspan><tspan x="580.0" dy="13.0">foo()</tspan></text>
<rect x="405.0" y="155.0" width="350.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Шлях розв'язання імені x:</tspan><tspan x="580.0" dy="13.0">1. bar() шукає x у власному фреймі -&gt; не знайдено</tspan><tspan x="580.0" dy="13.0">2. bar() перевіряє фрейм того, хто викликав: foo()</tspan><tspan x="580.0" dy="13.0">3. У фреймі foo() знайдено x = 20</tspan><tspan x="580.0" dy="13.0"></tspan><tspan x="580.0" dy="13.0">Результат: print(x) друкує 20</tspan><tspan x="580.0" dy="13.0">(залежить від динамічного ланцюга викликів)</tspan></text>
<text x="390.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Лексичний пошук спирається на розташування в коді; динамічний — на стек поточних викликів</text>
</svg>