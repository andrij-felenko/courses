<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захоплення змінних у замиканні та керування пам'яттю</text>
<rect x="25.0" y="20.0" width="350.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="36.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ЗАХОПЛЕННЯ ЗА ПОСИЛАННЯМ [&amp;]</tspan><tspan x="200.0" dy="14.3">Стековий кадр знищується при виході з функції</tspan></text>
<rect x="25.0" y="70.0" width="350.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">auto make_callback() {</tspan><tspan x="200.0" dy="13.0">    int val = 42; // на стеку make_callback</tspan><tspan x="200.0" dy="13.0">    return [&amp;]() { return val; }; // небезпечно!</tspan><tspan x="200.0" dy="13.0">}</tspan><tspan x="200.0" dy="13.0">// виклик: auto fn = make_callback(); fn();</tspan></text>
<rect x="25.0" y="160.0" width="350.0" height="155.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Стан пам'яті:</tspan><tspan x="200.0" dy="13.0">1. make_callback завершується -&gt; стек вивільнено</tspan><tspan x="200.0" dy="13.0">2. Лямбда зберігає покажчик на &amp;val у мертвому стеку</tspan><tspan x="200.0" dy="13.0">3. Виклик fn() призводить до читання сміття / UB</tspan><tspan x="200.0" dy="13.0"></tspan><tspan x="200.0" dy="13.0">Результат: Dangling Reference (висяче посилання)</tspan></text>
<rect x="405.0" y="20.0" width="350.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="36.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ПРОСУВАННЯ В КУПУ (Heap Promotion)</tspan><tspan x="580.0" dy="14.3">Змінна переноситься в купу для подовження життя</tspan></text>
<rect x="405.0" y="70.0" width="350.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">function makeCounter() {</tspan><tspan x="580.0" dy="13.0">    let count = 0; // захоплюється замиканням</tspan><tspan x="580.0" dy="13.0">    return () =&gt; ++count;</tspan><tspan x="580.0" dy="13.0">}</tspan><tspan x="580.0" dy="13.0">// JS / Python / Go переносять count у Heap</tspan></text>
<rect x="405.0" y="160.0" width="350.0" height="155.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Стан пам'яті:</tspan><tspan x="580.0" dy="13.0">1. Компілятор бачить ескейп замикання (Escape Analysis)</tspan><tspan x="580.0" dy="13.0">2. Створюється об'єкт оточення (Environment Record) у купі</tspan><tspan x="580.0" dy="13.0">3. Замикання володіє посиланням на цей об'єкт</tspan><tspan x="580.0" dy="13.0"></tspan><tspan x="580.0" dy="13.0">Результат: count живе стільки, скільки живе лямбда</tspan></text>
<text x="390.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Якщо замикання переживає свій лексичний блок, захоплені змінні вимагають копіювання або перенесення в купу</text>
</svg>