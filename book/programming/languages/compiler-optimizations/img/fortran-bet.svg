<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парі FORTRAN (1957): переклад мусив не поступитися ручному коду</text>
<rect x="320.0" y="48.0" width="230.0" height="76.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="332.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">ФОРМУЛА (FORTRAN)</text><text x="332.0" y="84.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">DO 10 I = 1, N</text><text x="332.0" y="102.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">   A(I) = B(I) + C*D</text><text x="332.0" y="120.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">10 CONTINUE</text>
<rect x="30.0" y="210.0" width="360.0" height="94.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="42.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c88" text-anchor="start" font-weight="700">буквально (так НЕ купили б)</text><text x="42.0" y="246.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9e9e" text-anchor="start">кожної ітерації рахувати C*D наново,</text><text x="42.0" y="264.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9e9e" text-anchor="start">щоразу множити I на розмір,</text><text x="42.0" y="282.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9e9e" text-anchor="start">щоразу лізти в пам'ять по A,B,C,D</text><text x="42.0" y="300.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9e9e" text-anchor="start">→ повільно, як боялися замовники</text>
<rect x="470.0" y="210.0" width="360.0" height="94.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="482.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7fa8c0" text-anchor="start" font-weight="700">оптимізовано (саме це виграло парі)</text><text x="482.0" y="246.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">C*D порахувати ОДИН раз до циклу,</text><text x="482.0" y="264.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">адресу вести кроком, без множень,</text><text x="482.0" y="282.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">гарячі значення тримати в регістрах</text><text x="482.0" y="300.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">→ нарівні з рукописним асемблером</text>
<line x1="400.0" y1="124.0" x2="200.0" y2="206.0" stroke="#a55" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="124.0" x2="650.0" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">замовники брали високорівневу мову лише за швидкий код — тож перший успішний компілятор мусив оптимізувати</text>
</svg>