<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізації живлять одна одну — прохід за проходом</text>
<rect x="20.0" y="90.0" width="200.0" height="112.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="32.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">вихід</text><text x="32.0" y="126.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">a = 5;</text><text x="32.0" y="144.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">b = a + 3;</text><text x="32.0" y="162.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">c = b * 2;</text><text x="32.0" y="180.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">use(c);</text><text x="32.0" y="198.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">d = a - 1;  // d не вжито</text>
<rect x="250.0" y="90.0" width="200.0" height="112.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="262.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">згортання + поширення</text><text x="262.0" y="126.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">a = 5;</text><text x="262.0" y="144.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">b = 8;</text><text x="262.0" y="162.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">c = 16;</text><text x="262.0" y="180.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">use(c);</text><text x="262.0" y="198.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">d = 4;      // все ще не вжито</text>
<rect x="500.0" y="90.0" width="200.0" height="112.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="512.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">прибирання мертвого</text><text x="512.0" y="126.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start"></text><text x="512.0" y="144.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start"></text><text x="512.0" y="162.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">c = 16;</text><text x="512.0" y="180.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start">use(c);</text><text x="512.0" y="198.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#bfe3cf" text-anchor="start"></text>
<rect x="720.0" y="90.0" width="150.0" height="40.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="732.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">лишилось</text><text x="732.0" y="126.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ffd479" text-anchor="start">use(16);</text>
<line x1="224.0" y1="145.0" x2="246.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="454.0" y1="145.0" x2="496.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="704.0" y1="145.0" x2="716.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">згорнули сталі → відкрилося, що d нікуди не йде → викинули → зайвих обчислень нема</text>
<text x="440.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">компілятор ганяє проходи по колу, доки код перестане мінятися (нерухома точка)</text>
</svg>