<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув, що зробила Аллен: програму бачити не як текст, а як граф</text>
<rect x="36.0" y="66.0" width="300.0" height="130.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="48.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">ЯК ТЕКСТ — питання доводиться вгадувати</text><text x="48.0" y="102.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">x = 0;</text><text x="48.0" y="120.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">if (n &gt; 0)</text><text x="48.0" y="138.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">    x = f(n);</text><text x="48.0" y="156.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">while (x &lt; 10)</text><text x="48.0" y="174.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">    x = x + 1;</text><text x="48.0" y="192.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">return x;</text>
<text x="186.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чи жива x? чи є шлях сюди? — неясно</text>
<line x1="560.0" y1="87.0" x2="560.0" y2="123.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="530.0" y1="153.0" x2="500.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="568.0" y1="153.0" x2="568.0" y2="269.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="225.0" x2="530.0" y2="269.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="620.0" y1="276.0" x2="700.0" y2="276.0" stroke="#d08a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="292.0" x2="620.0" y2="292.0" stroke="#d08a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="299.0" x2="560.0" y2="351.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="660.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9791a" text-anchor="middle">тіло</text>
<text x="600.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">хиб.</text>
<rect x="500.0" y="56.5" width="120.0" height="31.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="560.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">x = 0</tspan></text>
<rect x="500.0" y="122.5" width="120.0" height="31.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="560.0" y="141.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">n &gt; 0 ?</tspan></text>
<rect x="410.0" y="194.5" width="120.0" height="31.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="470.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">x = f(n)</tspan></text>
<rect x="500.0" y="268.5" width="120.0" height="31.0" rx="6" fill="#fff4e0" stroke="#d08a1a" stroke-width="1.8"/><text x="560.0" y="287.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d08a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">x &lt; 10 ?</tspan></text>
<rect x="700.0" y="268.5" width="120.0" height="31.0" rx="6" fill="#fff4e0" stroke="#d08a1a" stroke-width="1.8"/><text x="760.0" y="287.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d08a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">x = x+1</tspan></text>
<rect x="500.0" y="350.5" width="120.0" height="31.0" rx="6" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/><text x="560.0" y="369.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">return x</tspan></text>
<text x="560.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЯК ГРАФ — усе стає обчислюваним</text>
<text x="440.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">досяжність, живучість, інваріантність циклу — тепер це чіткі запитання про граф, а не здогади</text>
</svg>