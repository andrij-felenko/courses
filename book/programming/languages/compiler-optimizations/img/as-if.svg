<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило «наче-так»: результат один, шляхів багато</text>
<rect x="300.0" y="50.0" width="260.0" height="94.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/><text x="312.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb4a6" text-anchor="start" font-weight="700">ЯК НАПИСАНО (C)</text><text x="312.0" y="86.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">int y = 0;</text><text x="312.0" y="104.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">for (int i=0;i&lt;4;i++)</text><text x="312.0" y="122.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">    y += 3;</text><text x="312.0" y="140.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#eaf6ee" text-anchor="start">return y;</text>
<rect x="30.0" y="220.0" width="240.0" height="94.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="42.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7fa8c0" text-anchor="start" font-weight="700">«у лоб» (-O0)</text><text x="42.0" y="256.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=0</text><text x="42.0" y="274.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">loop i=0..3:</text><text x="42.0" y="292.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">  y=y+3</text><text x="42.0" y="310.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">ret y</text>
<line x1="430.0" y1="144.0" x2="150.0" y2="216.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320.0" y="220.0" width="240.0" height="130.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/><text x="332.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7fa8c0" text-anchor="start" font-weight="700">розгорнуто</text><text x="332.0" y="256.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=0</text><text x="332.0" y="274.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=y+3</text><text x="332.0" y="292.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=y+3</text><text x="332.0" y="310.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=y+3</text><text x="332.0" y="328.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">y=y+3</text><text x="332.0" y="346.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7fe0a0" text-anchor="start">ret y</text>
<line x1="430.0" y1="144.0" x2="440.0" y2="216.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
