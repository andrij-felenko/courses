<line x1="430.0" y1="144.0" x2="730.0" y2="216.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">усі три повертають 12 — компілятор вільний обрати будь-який, аби видимий результат збігся</text>
