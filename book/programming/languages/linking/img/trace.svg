<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінкування крок за кроком</text>
<rect x="40.0" y="80.0" width="180.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">КРОК 1</tspan><tspan x="130.0" dy="14.3">розв'язання символів</tspan><tspan x="130.0" dy="14.3">(потребує → визначає)</tspan></text>
<rect x="260.0" y="80.0" width="180.0" height="96.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">КРОК 2</tspan><tspan x="350.0" dy="14.3">роздати адреси</tspan><tspan x="350.0" dy="14.3">(заповнити дірки)</tspan></text>
<rect x="480.0" y="80.0" width="180.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">РЕЗУЛЬТАТ</tspan><tspan x="570.0" dy="14.3">один повний образ</tspan><tspan x="570.0" dy="14.3">(готовий у прошивку)</tspan></text>
<line x1="220.0" y1="128.0" x2="260.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="128.0" x2="480.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">спершу всі імена з'єднано, тоді всі адреси роздано — дірок не лишилось</text>
</svg>