<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр генерації коду через X-Macros</text>
<rect x="10.0" y="10.0" width="820.0" height="330.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="25.0" y="120.0" width="240.0" height="100.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="145.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">МАЙСТЕР-ТАБЛИЦЯ (X-Macro)</tspan><tspan x="145.0" dy="13.0">#define CMD_TABLE(X) \</tspan><tspan x="145.0" dy="13.0">  X(START, 0, &quot;start&quot;) \</tspan><tspan x="145.0" dy="13.0">  X(STOP,  1, &quot;stop&quot;)  \</tspan><tspan x="145.0" dy="13.0">  X(RESET, 2, &quot;reset&quot;)</tspan></text>
<line x1="265.0" y1="140.0" x2="350.0" y2="65.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="35.0" width="220.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="460.0" y="55.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1. Визначення X(name, id, str):</tspan><tspan x="460.0" dy="13.0">#define X(n, i, s) CMD_##n = i,</tspan><tspan x="460.0" dy="13.0">enum Command { CMD_TABLE(X) };</tspan></text>
<line x1="570.0" y1="65.0" x2="620.0" y2="65.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="42.0" width="195.0" height="46.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="717.5" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">Згенеровано:</tspan><tspan x="717.5" dy="13.0">enum { CMD_START=0, ... }</tspan></text>
<line x1="265.0" y1="170.0" x2="350.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="140.0" width="220.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="460.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">2. Перевизначення X:</tspan><tspan x="460.0" dy="13.0">#define X(n, i, s) s,</tspan><tspan x="460.0" dy="13.0">const char* names[] = {</tspan><tspan x="460.0" dy="13.0">  CMD_TABLE(X) };</tspan></text>
<line x1="570.0" y1="170.0" x2="620.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="147.0" width="195.0" height="46.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="717.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">Згенеровано:</tspan><tspan x="717.5" dy="13.0">{&quot;start&quot;, &quot;stop&quot;, &quot;reset&quot;}</tspan></text>
<line x1="265.0" y1="200.0" x2="350.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="245.0" width="220.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="460.0" y="260.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">3. Перевизначення X:</tspan><tspan x="460.0" dy="11.7">#define X(n, i, s) \</tspan><tspan x="460.0" dy="11.7">  if (!strcmp(str, s)) return CMD_##n;</tspan><tspan x="460.0" dy="11.7">CMD_TABLE(X)</tspan></text>
<line x1="570.0" y1="275.0" x2="620.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="252.0" width="195.0" height="46.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="717.5" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">Згенеровано:</tspan><tspan x="717.5" dy="13.0">Функція парсингу рядка</tspan></text>
<text x="420.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Єдине джерело правди: додавання одного рядка в CMD_TABLE автоматично оновлює всі три структури</text>
</svg>