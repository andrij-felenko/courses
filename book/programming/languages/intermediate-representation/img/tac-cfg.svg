<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три адреси й граф керування: з чого зроблене IR</text>
<text x="380.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">if (x &gt; 0)  y = x;  else  y = -x;   z = y + 1;</text>
<text x="380.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">той самий фрагмент — як граф простих блоків IR</text>
<rect x="280.0" y="100.0" width="200.0" height="56.0" rx="8" fill="#2a230f" stroke="#0a120d" stroke-width="1.4"/><text x="294.0" y="118.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">t1 = x &gt; 0</text><text x="294.0" y="135.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">br t1, B1, B2</text>
<text x="380.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">B0</text>
<rect x="90.0" y="210.0" width="200.0" height="56.0" rx="8" fill="#2a230f" stroke="#0a120d" stroke-width="1.4"/><text x="104.0" y="228.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">y = x</text><text x="104.0" y="245.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">jmp B3</text>
<text x="190.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B1  (then)</text>
<rect x="470.0" y="210.0" width="200.0" height="56.0" rx="8" fill="#2a230f" stroke="#0a120d" stroke-width="1.4"/><text x="484.0" y="228.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">y = 0 - x</text><text x="484.0" y="245.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">jmp B3</text>
<text x="570.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">B2  (else)</text>
<rect x="280.0" y="340.0" width="200.0" height="56.0" rx="8" fill="#2a230f" stroke="#0a120d" stroke-width="1.4"/><text x="294.0" y="358.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">z = y + 1</text><text x="294.0" y="375.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f0dca0" text-anchor="start">ret z</text>
<text x="380.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">B3  (злиття)</text>
<line x1="340.0" y1="156.0" x2="200.0" y2="204.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">t1≠0</text>
<line x1="420.0" y1="156.0" x2="560.0" y2="204.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="512.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">t1=0</text>
<line x1="200.0" y1="266.0" x2="330.0" y2="336.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="266.0" x2="430.0" y2="336.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожен блок — рівний ланцюжок «одна дія на рядок»; стрілки — можливі переходи</text>
</svg>