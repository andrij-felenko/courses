<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ексклюзивне володіння: переміщення (Move) ресурсу</text>
<rect x="30.0" y="60.0" width="700.0" height="125.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="45.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Стан до переміщення: std::unique_ptr&lt;Buffer&gt; a = std::make_unique&lt;Buffer&gt;()</text>
<rect x="60.0" y="102.0" width="160.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="140.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Змінна a (на стеку)</text>
<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ptr = 0x7FFF10</text>
<line x1="220.0" y1="135.0" x2="420.0" y2="135.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">володіє</text>
<rect x="430.0" y="102.0" width="270.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="565.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ресурс у купі (Адреса: 0x7FFF10)</text>
<text x="565.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Буфер даних [ 4096 байтів ]</text>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Операція: b = std::move(a);   (передача права власності)</text>
<rect x="30.0" y="220.0" width="700.0" height="125.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="45.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Стан після переміщення: a стає порожнім (nullptr), b стає єдиним власником</text>
<rect x="60.0" y="262.0" width="140.0" height="65.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.2"/>
<text x="130.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Змінна a</text>
<text x="130.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ptr = nullptr</text>
<rect x="230.0" y="262.0" width="160.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="310.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Змінна b (новий власник)</text>
<text x="310.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ptr = 0x7FFF10</text>
<line x1="390.0" y1="295.0" x2="470.0" y2="295.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">володіє</text>
<rect x="480.0" y="262.0" width="220.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="590.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ресурс у купі (0x7FFF10)</text>
<text x="590.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">~b() звільнить його рівно 1 раз</text>
</svg>