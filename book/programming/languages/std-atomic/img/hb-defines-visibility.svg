<text x="380.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<rect x="181.3" y="335.2" width="397.4" height="45.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="354.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">конфліктні доступи без порядку → гонка даних</tspan><tspan x="380.0" dy="15.6">об'єктивного «раніше» немає → НЕВИЗНАЧЕНА ПОВЕДІНКА</tspan></text>
