<rect x="465.0" y="278.0" width="180.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">читання: r = x</tspan></text>
