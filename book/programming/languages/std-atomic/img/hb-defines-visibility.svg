<text x="380.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">happens-before</text>
<rect x="156.2" y="156.0" width="447.5" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">читач ГАРАНТОВАНО бачить 42 — визначено, однаково для всіх</tspan></text>
<line x1="70.0" y1="212.0" x2="690.0" y2="212.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
