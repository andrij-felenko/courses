<rect x="65.0" y="80.0" width="230.0" height="74.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="180.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усі ці записи —</text>
<text x="180.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перед релізом</text>
<text x="395.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">synchronizes-with</text>
<text x="395.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(той самий прапорець)</text>
<line x1="310.0" y1="200.0" x2="475.0" y2="150.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="600.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">потік-споживач</text>
<rect x="495.0" y="84.0" width="210.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">while(!ready.load(</tspan></text>
<rect x="495.0" y="106.0" width="210.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">      acquire)) {}</tspan></text>
<rect x="495.0" y="152.0" width="210.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">use(data);</tspan></text>
<rect x="495.0" y="188.0" width="210.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">read(buf[i]);</tspan></text>
<rect x="485.0" y="148.0" width="230.0" height="68.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тут гарантовано</text>
<text x="600.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">видно 42 і buf</text>
<rect x="221.0" y="297.2" width="337.9" height="45.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">acquire-читання, що ПОБАЧИЛО release-запис,</tspan><tspan x="390.0" dy="15.6">бачить і все, що виробник зробив до нього</tspan></text>
