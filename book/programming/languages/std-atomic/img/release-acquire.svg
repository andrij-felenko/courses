<rect x="75.0" y="120.0" width="210.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">buf[i] = x;</tspan></text>
<rect x="75.0" y="166.0" width="210.0" height="24.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">ready.store(true,</tspan></text>
