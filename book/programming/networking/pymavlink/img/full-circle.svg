<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повне коло: початкова мета здійснюється</text>
<rect x="40.0" y="64.0" width="250.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2008: мета</text>
<text x="165.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">дрон, що сам бачить</tspan><tspan x="165.0" dy="13.0">і літає (зір)</tspan></text>
<text x="165.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">MAVLink —</tspan><tspan x="165.0" dy="12.3">лише побічний інструмент</tspan></text>
<line x1="296.0" y1="139.0" x2="360.0" y2="139.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="328.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">роки</text>
<rect x="370.0" y="64.0" width="250.0" height="150.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="495.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">сьогодні</text>
<text x="495.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">бортовий комп'ютер +</tspan><tspan x="495.0" dy="13.0">pymavlink + зір/ШІ</tspan></text>
<text x="495.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">= та сама автономність,</tspan><tspan x="495.0" dy="12.3">якої прагнули</tspan></text>
<text x="380.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">інструмент, зроблений «між іншим», тепер несе той самий зір</text>
</svg>