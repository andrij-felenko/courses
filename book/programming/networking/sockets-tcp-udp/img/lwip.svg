<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сокети на МК: знайомий API над стеком lwIP</text>
<rect x="200.0" y="56.0" width="360.0" height="46.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="380.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">твій код: socket / bind / connect / sendto / recv</tspan></text>
<rect x="200.0" y="112.0" width="360.0" height="46.0" rx="9" fill="#eef3ff" stroke="#2457d6" stroke-width="1.6"/><text x="380.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">BSD-сокети ESP-IDF (інтерфейс)</tspan></text>
<rect x="200.0" y="168.0" width="360.0" height="46.0" rx="9" fill="#fff7e6" stroke="#b08900" stroke-width="1.6"/><text x="380.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">lwIP: TCP, UDP, IP — крихітний стек у RAM МК</tspan></text>
<rect x="200.0" y="224.0" width="360.0" height="46.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="380.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">драйвер Wi-Fi / Ethernet → ефір чи дріт</tspan></text>
<line x1="580.0" y1="56.0" x2="580.0" y2="102.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="580.0" y1="168.0" x2="580.0" y2="214.0" stroke="#b08900" stroke-width="2.0"/>
<text x="588.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">той самий код,</text>
<text x="588.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">що й на ПК</text>
<text x="588.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="start">увесь стек —</text>
<text x="588.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="start">кілька КБ RAM</text>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">пишеш звичні сокети — а під ними працює стек, що влазить у пам'ять мікроконтролера</text>
