<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="372" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два буфери за одним сокетом і що вони насправді тримають</text>
<rect x="155.5" y="60.0" width="139.0" height="32.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="225.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">програма: send()</tspan></text>
<rect x="625.5" y="60.0" width="139.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">програма: recv()</tspan></text>
<line x1="225.0" y1="100.0" x2="225.0" y2="166.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="695.0" y1="166.0" x2="695.0" y2="100.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">передавальний буфер · SO_SNDBUF</text>
<text x="695.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">приймальний буфер · SO_RCVBUF</text>
<rect x="50.0" y="196.0" width="150.0" height="72.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="125.0" dy="0.0">непідтверджене</tspan></text>
<rect x="200.0" y="196.0" width="110.0" height="72.0" rx="6" fill="#eef3fd" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="255.0" dy="0.0">не відіслане</tspan></text>
<rect x="310.0" y="196.0" width="90.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="355.0" dy="0.0">вільно</tspan></text>
<rect x="520.0" y="196.0" width="160.0" height="72.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="228.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="600.0" dy="0.0">прийняте,</tspan><tspan x="600.0" dy="14.3">чекає recv</tspan></text>
<rect x="680.0" y="196.0" width="190.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="228.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle"><tspan x="775.0" dy="0.0">вільно = вікно,</tspan><tspan x="775.0" dy="14.3">яке оголошують</tspan></text>
<text x="460.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">мережа</text>
<line x1="410.0" y1="232.0" x2="510.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="225.0" dy="0.0">байт лежить тут не до відправлення,</tspan><tspan x="225.0" dy="15.0">а до підтвердження з того боку</tspan></text>
<text x="695.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="695.0" dy="0.0">вільне місце — це число, яке стек</tspan><tspan x="695.0" dy="15.0">оголошує відправникові як вікно</tspan></text>
</svg>