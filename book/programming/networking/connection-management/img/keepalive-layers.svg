<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні Keep-Alive: чому зонд ядра не гарантує працездатність процесу</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Транспортний рівень (TCP Keep-Alive)</text>
<rect x="50.0" y="85.0" width="380.0" height="240.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="98.1" y="117.3" width="63.9" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Ядро ОС</tspan><tspan x="130.0" dy="14.3">Клієнт</tspan></text>
<rect x="318.1" y="117.3" width="63.9" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Ядро ОС</tspan><tspan x="350.0" dy="14.3">Сервер</tspan></text>
<rect x="278.6" y="217.3" width="142.8" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Застосунок сервера</tspan><tspan x="350.0" dy="14.3">DEADLOCK / ЗАВИС</tspan></text>
<line x1="180.0" y1="130.0" x2="300.0" y2="130.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="240.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">ACK-зонд ядра</text>
<line x1="300.0" y1="150.0" x2="180.0" y2="150.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="240.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">ACK-відповідь ядра</text>
<text x="240.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро відповідає автоматично, навіть коли
застосунок повністю заблокований!</text>
<text x="700.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Прикладний рівень (Heartbeat / HTTP/2 PING)</text>
<rect x="510.0" y="85.0" width="380.0" height="240.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<rect x="548.6" y="117.3" width="82.7" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Застосунок</tspan><tspan x="590.0" dy="14.3">Клієнт</tspan></text>
<rect x="749.8" y="117.3" width="120.3" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Застосунок</tspan><tspan x="810.0" dy="14.3">Сервер (робочий)</tspan></text>
<line x1="645.0" y1="130.0" x2="750.0" y2="130.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="700.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">PING / Heartbeat</text>
<line x1="750.0" y1="150.0" x2="645.0" y2="150.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="700.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">PONG / Відповідь</text>
<text x="700.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Перевіряє весь наскрізний шлях:
і мережу, і чергу циклу подій застосунку.</text>
</svg>