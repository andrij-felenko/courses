<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Копіювання пам'яті проти кодека зі зсувів</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">у програмі є ЧИСЛО  v = 0x0A0B0C0D  (одне й те саме на обох машинах)</text>
<rect x="40.0" y="92.0" width="445.0" height="250.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="262.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗ memcpy(buf, &amp;v, 4) — копіюємо ПАМ'ЯТЬ</text>
<text x="262.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у дріт іде те, як число лежить у цій машині</text>
<text x="80.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">хост little-endian:</text>
<rect x="80.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="111.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0D</text>
<rect x="142.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="173.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0C</text>
<rect x="204.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="235.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0B</text>
<rect x="266.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="297.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0A</text>
<text x="80.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">хост big-endian:</text>
<rect x="80.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="111.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0A</text>
<rect x="142.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="173.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0B</text>
<rect x="204.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="235.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0C</text>
<rect x="266.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="297.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0D</text>
<text x="262.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">два різні дроти — приймач не має шансу</text>
<rect x="515.0" y="92.0" width="445.0" height="250.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="737.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ b[0]=v&gt;&gt;24 … b[3]=v — беремо ЧИСЛО</text>
<text x="737.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зсув визначений над значенням, не над пам'яттю</text>
<text x="555.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">хост little-endian:</text>
<rect x="555.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="586.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0A</text>
<rect x="617.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="648.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0B</text>
<rect x="679.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="710.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0C</text>
<rect x="741.0" y="190.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="772.0" y="217.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0D</text>
<text x="555.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">хост big-endian:</text>
<rect x="555.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="586.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0A</text>
<rect x="617.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="648.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0B</text>
<rect x="679.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="710.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0C</text>
<rect x="741.0" y="274.0" width="62.0" height="40.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="772.0" y="301.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0D</text>
<text x="737.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">один і той самий дріт — без жодного #ifdef</text>
<rect x="40.0" y="366.0" width="920.0" height="92.0" rx="12" fill="#f3f5f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="500.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому так: v &gt;&gt; 24 означає «поділи значення на 2²⁴», а не «візьми перший байт із пам'яті».</text>
<text x="500.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення над значенням дає ту саму відповідь на будь-якому процесорі,</text>
<text x="500.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тому кодек зі зсувів не треба ні перевіряти на порядок байтів, ні перемикати за платформою.</text>
<rect x="40.0" y="476.0" width="920.0" height="60.0" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="500.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дзеркально при читанні:  v = (b[0]&lt;&lt;24) | (b[1]&lt;&lt;16) | (b[2]&lt;&lt;8) | b[3]</text>
<text x="500.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">— теж арифметика над значеннями, теж однакова всюди.</text>
</svg>