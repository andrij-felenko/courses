<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія між чипами: одна з трьох шин</text>
<rect x="60.0" y="64.0" width="130.0" height="54.0" rx="9" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="125.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">SDIO</text>
<line x1="194.0" y1="91.0" x2="210.0" y2="91.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="214.0" y="64.0" width="510.0" height="54.0" rx="9" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.2"/>
<rect x="222.0" y="72.0" width="494.0" height="38.0" rx="6" fill="#f7f7f7" stroke="none" stroke-width="0.0"/><text x="469.0" y="94.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="469.0" dy="0.0">найшвидша; типовий вибір під Wi-Fi-потік (на P4-платі — 4 лінії, 40 МГц)</tspan></text>
<rect x="60.0" y="134.0" width="130.0" height="54.0" rx="9" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="125.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">SPI</text>
<line x1="194.0" y1="161.0" x2="210.0" y2="161.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="214.0" y="134.0" width="510.0" height="54.0" rx="9" fill="#f7f7f7" stroke="#2457d6" stroke-width="1.2"/>
<rect x="222.0" y="142.0" width="494.0" height="38.0" rx="6" fill="#f7f7f7" stroke="none" stroke-width="0.0"/><text x="469.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="469.0" dy="0.0">простіша й невибаглива до ніжок; повний або половинний дуплекс</tspan></text>
<rect x="60.0" y="204.0" width="130.0" height="54.0" rx="9" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.8"/>
<text x="125.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">UART</text>
<line x1="194.0" y1="231.0" x2="210.0" y2="231.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="214.0" y="204.0" width="510.0" height="54.0" rx="9" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.2"/>
<rect x="222.0" y="212.0" width="494.0" height="38.0" rx="6" fill="#f7f7f7" stroke="none" stroke-width="0.0"/><text x="469.0" y="234.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="469.0" dy="0.0">найпростіша, для скромного трафіку та Bluetooth-HCI</tspan></text>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">роль однакова — змінюється лише швидкість і скільки ніжок коштує</text>
</svg>