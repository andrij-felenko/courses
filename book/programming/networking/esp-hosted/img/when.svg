<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="318" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP-Hosted (два чипи) чи одночиповий ESP32</text>
<rect x="40.0" y="60.0" width="330.0" height="210.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="205.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ESP-Hosted: ведучий + ведений</text>
<text x="56.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• «мозок» без радіо (ESP32-P4, STM32, Linux)</text>
<text x="56.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• потрібен Wi-Fi 6 / BLE, а чип його не має</text>
<text x="56.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• радіо доточуємо рівно тоді, коли треба</text>
<text x="56.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• одне сертифіковане радіо на різні плати</text>
<rect x="410.0" y="60.0" width="330.0" height="210.0" rx="10" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="575.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Одночиповий ESP32 (S3/C3/C6)</text>
<text x="426.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• чип і рахує, і має радіо «з коробки»</text>
<text x="426.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• проста, дешева, масова річ — один корпус</text>
<text x="426.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• не треба ні зайвої плати, ні другої шини</text>
<text x="426.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• обчислень рівно стільки, скільки чип тягне</text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">питання не «скільки чипів», а «чи має той, хто рахує, власне радіо»</text>
</svg>