<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="318" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі: для чого МК-сервер, а для чого ні</text>
<rect x="40.0" y="60.0" width="330.0" height="210.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="205.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Для цього він і є</text>
<text x="56.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• портал налаштування Wi-Fi</text>
<text x="56.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• керування пристроєм із телефона</text>
<text x="56.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• моніторинг показань у браузері</text>
<text x="56.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• усе локально, кілька клієнтів</text>
<text x="56.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• без окремого застосунку</text>
<rect x="410.0" y="60.0" width="330.0" height="210.0" rx="10" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="575.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Не для цього</text>
<text x="426.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• публічний хостинг сайту в інтернет</text>
<text x="426.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• тисячі одночасних з'єднань</text>
<text x="426.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• важкі сторінки й великий трафік</text>
<text x="426.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• мало пам'яті — кілька сокетів</text>
<text x="426.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTPS дається тяжко</text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">це локальний пульт пристрою, а не майданчик для світу</text>
</svg>