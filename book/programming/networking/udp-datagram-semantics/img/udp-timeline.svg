<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 762" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="762" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сім років від пакетної мови до RFC 768</text>
<line x1="250.0" y1="54.0" x2="250.0" y2="738.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="40.0" y="64.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">грудень 1973</tspan></text>
<circle cx="250.0" cy="92.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="64.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">NVP, Денні Коен (ISI)</tspan></text>
<rect x="590.0" y="64.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">перша пакетна мова поверх ARPANET</tspan></text>
<rect x="40.0" y="132.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">жовтень 1974</tspan></text>
<circle cx="250.0" cy="160.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="132.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">RFC 660, Дейв Волден (BBN)</tspan></text>
<rect x="590.0" y="132.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">«некеровані пакети»: без повторів,</tspan><tspan x="795.0" dy="15.6">без збирання, без порядку</tspan></text>
<rect x="40.0" y="200.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">15 серпня 1977</tspan></text>
<circle cx="250.0" cy="228.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="200.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">IEN 2, Джон Постел (ISI)</tspan></text>
<rect x="590.0" y="200.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="224.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">«ми порушуємо принцип шарування» —</tspan><tspan x="795.0" dy="15.6">відділити мережевий шар від TCP</tspan></text>
<rect x="40.0" y="268.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="300.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">1977 (дата спірна)</tspan></text>
<circle cx="250.0" cy="296.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="268.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">нарада в ISI,</tspan><tspan x="418.0" dy="15.6">Марина-дель-Рей</tspan></text>
<rect x="590.0" y="268.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">рішення розділити TCP і IP;</tspan><tspan x="795.0" dy="15.6">там-таки накреслено UDP</tspan></text>
<rect x="40.0" y="336.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">22 листопада 1977</tspan></text>
<circle cx="250.0" cy="364.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="336.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">RFC 741, Денні Коен</tspan></text>
<rect x="590.0" y="336.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">специфікація NVP: «уникнення</tspan><tspan x="795.0" dy="15.6">наскрізних повторів»</tspan></text>
<rect x="40.0" y="404.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">січень–лютий 1978</tspan></text>
<circle cx="250.0" cy="432.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="404.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">IEN 21, 26, 27, 28</tspan></text>
<rect x="590.0" y="404.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="428.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">перші специфікації з розділеними</tspan><tspan x="795.0" dy="15.6">заголовками TCP і IP</tspan></text>
<rect x="40.0" y="472.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">червень–вересень 1978</tspan></text>
<circle cx="250.0" cy="500.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="472.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">IEN 41 і IEN 55, Постел</tspan></text>
<rect x="590.0" y="472.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">окремі специфікації IP v4 і TCP v4</tspan></text>
<rect x="40.0" y="540.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="572.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">21 січня 1979</tspan></text>
<circle cx="250.0" cy="568.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="540.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="572.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">IEN 71, Девід Рід (MIT)</tspan></text>
<rect x="590.0" y="540.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="564.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">перша специфікація</tspan><tspan x="795.0" dy="15.6">«User Datagram Protocol»</tspan></text>
<rect x="40.0" y="608.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="640.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">2 травня 1979</tspan></text>
<circle cx="250.0" cy="636.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="608.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="640.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">IEN 88, Джон Постел</tspan></text>
<rect x="590.0" y="608.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="640.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">той самий заголовок, редакція ISI</tspan></text>
<rect x="40.0" y="676.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="708.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">28 серпня 1980</tspan></text>
<circle cx="250.0" cy="704.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="268.0" y="676.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="418.0" y="708.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="418.0" dy="0.0">RFC 768, Джон Постел</tspan></text>
<rect x="590.0" y="676.0" width="410.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="700.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="795.0" dy="0.0">чинний стандарт: три сторінки,</tspan><tspan x="795.0" dy="15.6">відтоді без змін</tspan></text>
</svg>