<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкове пакування Protocol Buffers: TLV, Varint та ZigZag</text>
<rect x="40.0" y="52.0" width="920.0" height="125.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="55.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Ключ поля (Tag = field_number &lt;&lt; 3 | wire_type):</text>
<rect x="60.0" y="92.0" width="540.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="330.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Номер поля (field_number: 1..536870911)  [біти 7..3]</tspan></text>
<rect x="605.0" y="92.0" width="335.0" height="40.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.2"/><text x="772.5" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Тип дроту (wire_type: 0..5) [біти 2..0]</tspan></text>
<text x="60.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">wire_type: 0 = Varint (int32/bool), 1 = 64-bit (fixed64/double), 2 = Length-delimited (string/bytes/message), 5 = 32-bit (fixed32/float)</text>
<rect x="40.0" y="190.0" width="920.0" height="165.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="55.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Base-128 Varint: кодування числа 300 (0x012C = 00000001 00101100_2):</text>
<text x="60.0" y="240.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">Крок 1: розбиваємо на 7-бітні шматки:  [0000010] [0101100]  (значення 2 та 44)</text>
<text x="60.0" y="265.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">Крок 2: міняємо порядок (little-endian): молодші 7 біт ідуть першими -&gt; 0101100, потім 0000010</text>
<text x="60.0" y="290.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">Крок 3: додаємо MSB (1 = продовження є, 0 = останній байт):</text>
<rect x="60.0" y="302.0" width="180.0" height="42.0" rx="5" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
<text x="70.0" y="327.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1 0101100 (0xAC)</text>
<rect x="255.0" y="302.0" width="180.0" height="42.0" rx="5" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="265.0" y="327.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">0 0000010 (0x02)</text>
<text x="460.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">-&gt; Замість 4 байтів uint32 число 300 займає 2 байти: 0xAC 0x02</text>
<rect x="40.0" y="368.0" width="920.0" height="142.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="55.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">3. ZigZag кодування для sint32/sint64: (n &lt;&lt; 1) ^ (n &gt;&gt; 31)</text>
<text x="60.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Звичайний int32(-1) у Varint займає 10 байтів через знакове розширення до 64 біт. ZigZag відображає знакові числа у беззнакові:</text>
<rect x="60.0" y="425.0" width="170.0" height="70.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/><text x="145.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Вхідне n = 0</tspan><tspan x="145.0" dy="14.3">ZigZag = 0</tspan><tspan x="145.0" dy="14.3">Varint: 1 байт (0x00)</tspan></text>
<rect x="245.0" y="425.0" width="170.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.2"/><text x="330.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Вхідне n = -1</tspan><tspan x="330.0" dy="14.3">ZigZag = 1</tspan><tspan x="330.0" dy="14.3">Varint: 1 байт (0x01)</tspan></text>
<rect x="430.0" y="425.0" width="170.0" height="70.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/><text x="515.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Вхідне n = 1</tspan><tspan x="515.0" dy="14.3">ZigZag = 2</tspan><tspan x="515.0" dy="14.3">Varint: 1 байт (0x02)</tspan></text>
<rect x="615.0" y="425.0" width="170.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.2"/><text x="700.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Вхідне n = -2</tspan><tspan x="700.0" dy="14.3">ZigZag = 3</tspan><tspan x="700.0" dy="14.3">Varint: 1 байт (0x03)</tspan></text>
<rect x="800.0" y="425.0" width="150.0" height="70.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/><text x="875.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Вхідне n = 2147483647</tspan><tspan x="875.0" dy="14.3">ZigZag = 4294967294</tspan><tspan x="875.0" dy="14.3">Varint: 5 байтів</tspan></text>
</svg>