<rect x="440.0" y="76.0" width="556.0" height="66.0" rx="6" fill="#fdf6e0" stroke="#b08900" stroke-width="1.4"/><text x="718.0" y="105.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">У ЦЬОМУ запиті межа тіла оголошена ДВІЧІ:</tspan><tspan x="718.0" dy="16.9">довжиною в 6 байтів і поблоковим кодуванням.</tspan></text>
<rect x="440.0" y="156.0" width="556.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="718.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">Фронтенд і бекенд — різні програми різних авторів.</tspan><tspan x="718.0" dy="16.2">Кожна сама вирішує, котра межа головніша,</tspan><tspan x="718.0" dy="16.2">і про вибір сусіда нічого не знає.</tspan></text>
