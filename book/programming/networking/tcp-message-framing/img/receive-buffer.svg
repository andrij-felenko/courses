<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три дії на кожну подію готовності сокета</text>
<text x="170.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. дописали прийняте в кінець</text>
<text x="482.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. вийняли ВСІ повні кадри</text>
<text x="794.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. зсунули хвіст на початок</text>
<rect x="24.0" y="150.0" width="292.0" height="52.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="24.0" y="150.0" width="64.2" height="52.0" rx="0" fill="#eceff3" stroke="#6b7280" stroke-width="1.3"/>
<text x="56.1" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">хвіст</text>
<rect x="88.2" y="150.0" width="227.8" height="52.0" rx="0" fill="#e7edfb" stroke="#2457d6" stroke-width="1.3"/>
<text x="202.1" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">нова порція</text>
<rect x="336.0" y="150.0" width="292.0" height="52.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="336.0" y="150.0" width="99.3" height="52.0" rx="0" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.3"/>
<text x="385.6" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кадр 1</text>
<rect x="435.3" y="150.0" width="111.0" height="52.0" rx="0" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.3"/>
<text x="490.8" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кадр 2</text>
<rect x="546.2" y="150.0" width="81.8" height="52.0" rx="0" fill="#eceff3" stroke="#6b7280" stroke-width="1.3"/>
<text x="587.1" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">неповний</text>
<rect x="648.0" y="150.0" width="292.0" height="52.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="648.0" y="150.0" width="81.8" height="52.0" rx="0" fill="#eceff3" stroke="#6b7280" stroke-width="1.3"/>
<text x="688.9" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">неповний</text>
<rect x="729.8" y="150.0" width="210.2" height="52.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="834.9" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вільно</text>
<line x1="385.6" y1="144.0" x2="385.6" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="490.8" y1="144.0" x2="490.8" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="482.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">у обробку</text>
<text x="170.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">читання не знає про кадри —</tspan><tspan x="170.0" dy="14.9">воно приносить стільки, скільки є</tspan></text>
<text x="482.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="482.0" dy="0.0">цикл зупиняється, коли залишку</tspan><tspan x="482.0" dy="14.9">не вистачає навіть на заголовок</tspan></text>
<text x="794.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="794.0" dy="0.0">інваріант відновлено: у буфері —</tspan><tspan x="794.0" dy="14.9">початок ще не зібраного кадру</tspan></text>
</svg>