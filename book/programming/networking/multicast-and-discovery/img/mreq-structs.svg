<text x="500.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">адресою інтерфейс називають лише в найстарішій формі — і саме там назва неоднозначна:</text>
<text x="500.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">адреса ще не видана DHCP, змінилася або повторюється на двох інтерфейсах — і приєднання йде не туди</text>
<text x="500.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">тому нові API просять індекс: він у інтерфейсу є завжди й один</text>
