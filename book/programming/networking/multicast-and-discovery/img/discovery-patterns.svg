<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи дізнатися, хто в мережі</text>
<rect x="24.0" y="50.0" width="400.0" height="300.0" rx="10" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="224.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">запит і відповідь</text>
<rect x="50.0" y="92.0" width="130.0" height="36.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.6"/><text x="115.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">новачок</tspan></text>
<rect x="268.0" y="92.0" width="130.0" height="36.0" rx="6" fill="#f2fbf5" stroke="#27ae60" stroke-width="1.6"/><text x="333.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="333.0" dy="0.0">вузли A і B</tspan></text>
<text x="224.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">запит у групу: хто надає цю службу?</text>
<line x1="64.0" y1="172.0" x2="384.0" y2="172.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="224.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">відповідь A — одноадресно новачкові</text>
<line x1="384.0" y1="228.0" x2="64.0" y2="228.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="224.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">відповідь B — одноадресно новачкові</text>
<line x1="384.0" y1="284.0" x2="64.0" y2="284.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="224.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">у спокої мережа мовчить, старт — за одну затримку</text>
<text x="224.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">зникнення вузла не помітить ніхто, доки не спитають</text>
<rect x="456.0" y="50.0" width="400.0" height="300.0" rx="10" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="656.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">оголошення</text>
<rect x="482.0" y="92.0" width="130.0" height="36.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.6"/><text x="547.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="547.0" dy="0.0">новачок слухає</tspan></text>
<rect x="700.0" y="92.0" width="130.0" height="36.0" rx="6" fill="#f2fbf5" stroke="#27ae60" stroke-width="1.6"/><text x="765.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">вузли A і B</tspan></text>
<text x="656.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">A: я тут, адреса й порт, дійсно 120 с</text>
<line x1="816.0" y1="172.0" x2="496.0" y2="172.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="656.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">B: я тут, адреса й порт, дійсно 120 с</text>
<line x1="816.0" y1="228.0" x2="496.0" y2="228.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="656.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повтор кожні 30 с — інакше запис протухне</text>
<line x1="816.0" y1="284.0" x2="496.0" y2="284.0" stroke="#6b7280" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="656.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">новачок нічого не питає — лише слухає</text>
<text x="656.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">зникнення видно само: запис не оновили, він помер</text>
</svg>