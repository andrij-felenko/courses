<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рев'ю — людський шар поверх автоматичних сіток</text>
<rect x="30.0" y="70.0" width="380.0" height="320.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="220.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Інструменти ловлять</text>
<text x="220.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">механічне й структурне — автоматично</text>
<line x1="48.0" y1="130.0" x2="392.0" y2="130.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
