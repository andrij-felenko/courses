<text x="480.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">рішення тісно в'яже модулі</text>
<rect x="468.0" y="266.0" width="344.0" height="46.0" rx="8" fill="#ffffff" stroke="#7a4ea8" stroke-width="1.3"/>
<text x="480.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">читабельність</text>
<text x="480.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">за пів року ніхто не зрозуміє</text>
<rect x="468.0" y="322.0" width="344.0" height="46.0" rx="8" fill="#ffffff" stroke="#7a4ea8" stroke-width="1.3"/>
<text x="480.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">крайова логіка</text>
<text x="480.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">забутий випадок, не баг форми</text>
<text x="430.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">інструмент перевіряє, чи код правильний за формою; людина — чи він правильний за задумом</text>
