<text x="60.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">use-after-free, NULL, межі</text>
<rect x="48.0" y="266.0" width="344.0" height="46.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="60.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">хост-тести</text>
<text x="60.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">поведінка на відомих входах</text>
<rect x="48.0" y="322.0" width="344.0" height="46.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="60.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">фаззинг</text>
<text x="60.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">крах на хаотичному вході</text>
<rect x="450.0" y="70.0" width="380.0" height="320.0" rx="12" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.0"/>
<text x="640.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7a4ea8" text-anchor="middle" font-weight="700">Рецензент ловить</text>
<text x="640.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">те, що автоматика не формалізує</text>
<line x1="468.0" y1="130.0" x2="812.0" y2="130.0" stroke="#7a4ea8" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="468.0" y="154.0" width="344.0" height="46.0" rx="8" fill="#ffffff" stroke="#7a4ea8" stroke-width="1.3"/>
