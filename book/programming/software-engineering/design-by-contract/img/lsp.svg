<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило Лісков: куди вільно зсувати контракт нащадка</text>
<rect x="230.0" y="53.5" width="300.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="380.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">БАТЬКІВСЬКИЙ контракт</tspan></text>
<text x="200.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ПЕРЕДУМОВА (вхід)</text>
<text x="560.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПОСТУМОВА (вихід)</text>
<rect x="100.0" y="162.5" width="200.0" height="31.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="200.0" y="181.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">батько: x &gt; 0</tspan></text>
<rect x="460.0" y="155.3" width="200.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">батько: список</tspan><tspan x="560.0" dy="14.3">відсортовано</tspan></text>
<line x1="200.0" y1="193.5" x2="200.0" y2="227.3" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="200.7" x2="560.0" y2="227.3" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="85.0" y="227.3" width="230.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="200.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">нащадку МОЖНА: x ≥ 0</tspan><tspan x="200.0" dy="14.3">(послабити — ширше)</tspan></text>
<rect x="445.0" y="227.3" width="230.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">нащадку МОЖНА: ще й</tspan><tspan x="560.0" dy="14.3">без дублів (посилити)</tspan></text>
<rect x="85.0" y="299.4" width="230.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="200.0" y="318.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">НЕ МОЖНА: x &gt; 100</tspan><tspan x="200.0" dy="14.3">(посилити — вужче)</tspan></text>
<rect x="445.0" y="299.4" width="230.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="318.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">НЕ МОЖНА: інколи</tspan><tspan x="560.0" dy="14.3">не відсортовано</tspan></text>
<text x="380.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">передумову лише послаблювати · постумову лише посилювати · інваріант зберігати</text>
</svg>