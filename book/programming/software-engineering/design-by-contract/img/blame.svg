<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення провини: межа контракту називає винного</text>
<text x="185.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ контракту</text>
<text x="535.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З контрактом</text>
<line x1="360.0" y1="48.0" x2="360.0" y2="268.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="50.0" y="84.0" width="270.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="185.0" y="103.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">погані аргументи проходять</tspan><tspan x="185.0" dy="14.3">у тіло функції</tspan></text>
<rect x="400.0" y="84.0" width="270.0" height="46.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.7"/><text x="535.0" y="103.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">передумова на самій межі</tspan><tspan x="535.0" dy="14.3">ловить аргумент одразу</tspan></text>
<rect x="50.0" y="148.0" width="270.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="185.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">крах за 50 рядків углиб,</tspan><tspan x="185.0" dy="14.3">у чужому коді</tspan></text>
<rect x="400.0" y="148.0" width="270.0" height="46.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.7"/><text x="535.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">стоп тут же, де помилка</tspan><tspan x="535.0" dy="14.3">вперше ввійшла</tspan></text>
<line x1="185.0" y1="130.0" x2="185.0" y2="148.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535.0" y1="130.0" x2="535.0" y2="148.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="212.0" width="270.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="185.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">хто винен? викликач</tspan><tspan x="185.0" dy="14.3">чи функція? — невідомо</tspan></text>
<rect x="400.0" y="212.0" width="270.0" height="46.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.7"/><text x="535.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">винен ВИКЛИКАЧ — однозначно,</tspan><tspan x="535.0" dy="14.3">без гадань</tspan></text>
<line x1="185.0" y1="194.0" x2="185.0" y2="212.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535.0" y1="194.0" x2="535.0" y2="212.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">контракт перетворює «десь зламалось» на «винен той, хто порушив свій бік»</text>
</svg>