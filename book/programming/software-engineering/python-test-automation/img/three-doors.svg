<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1010" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи дістатися до системи, що не на Python</text>
<rect x="40.0" y="100.0" width="145.0" height="400.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.8"/>
<text x="112.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">обв'язка</tspan><tspan x="112.0" dy="19.5">на Python</tspan></text>
<line x1="185.0" y1="160.0" x2="400.1" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запуск процесу</text>
<rect x="406.1" y="133.1" width="127.7" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">система як</tspan><tspan x="470.0" dy="16.9">окремий процес</tspan></text>
<line x1="539.9" y1="160.0" x2="689.4" y2="160.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="695.4" y="124.6" width="209.2" height="70.8" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.4"/><text x="800.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">аварія не чіпає обв'язку;</tspan><tspan x="800.0" dy="16.9">видно лише вивід</tspan><tspan x="800.0" dy="16.9">і код повернення</tspan></text>
<line x1="185.0" y1="300.0" x2="381.6" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сокет або порт</text>
<rect x="387.6" y="273.1" width="164.8" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">плата чи сервіс</tspan><tspan x="470.0" dy="16.9">на тому кінці лінії</tspan></text>
<line x1="558.4" y1="300.0" x2="711.6" y2="300.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="717.6" y="264.6" width="164.8" height="70.8" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.4"/><text x="800.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">перевіряється й сам</tspan><tspan x="800.0" dy="16.9">протокол; усередину</tspan><tspan x="800.0" dy="16.9">системи не видно</tspan></text>
<line x1="185.0" y1="450.0" x2="366.8" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">виклик функції</text>
<rect x="372.8" y="423.1" width="194.4" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="470.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">бібліотека, завантажена</tspan><tspan x="470.0" dy="16.9">в цей самий процес</tspan></text>
<line x1="573.2" y1="450.0" x2="700.5" y2="450.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="706.5" y="414.6" width="187.0" height="70.8" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.4"/><text x="800.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">видно кожну функцію;</tspan><tspan x="800.0" dy="16.9">аварія вбиває обв'язку</tspan><tspan x="800.0" dy="16.9">разом зі звітом</tspan></text>
<line x1="300.0" y1="118.0" x2="300.0" y2="372.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="300.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">межа процесу</text>
<text x="300.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">межі немає: чужий код у пам'яті обв'язки</text>
<line x1="300.0" y1="498.0" x2="300.0" y2="514.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7,5"/>
</svg>