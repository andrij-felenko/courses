<rect x="70.0" y="574.0" width="940.0" height="88.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.4"/><text x="540.0" y="605.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Ланцюг рахують від rootdir до теки самого файлу; conftest сусідньої гілки не завантажується взагалі.</tspan><tspan x="540.0" dy="16.9">Межу пошуку вгору звужує --confcutdir. Усі conftest.py імпортуються ДО тестових модулів —</tspan><tspan x="540.0" dy="16.9">тому pytest.register_assert_rewrite(&quot;helpers&quot;) має стояти саме там, інакше assert у помічнику лишиться німим.</tspan></text>
