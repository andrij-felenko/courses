<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що лишається в зоні підозри, коли модульний тест червоніє</text>
<rect x="240" y="140" width="420" height="250" rx="10" fill="#fbfcfd" stroke="#2457d6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="450.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">зона підозри при червоному світлі</text>
<rect x="50.0" y="188.5" width="140.0" height="43.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="2.2"/><text x="120.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Тест</tspan></text>
<line x1="198.0" y1="210.0" x2="320.6" y2="210.0" stroke="#b8860b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="259.3" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вхід і результат</text>
<rect x="328.6" y="172.6" width="242.9" height="74.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/><text x="450.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Одиниця під тестом</tspan><tspan x="450.0" dy="16.9">обіцянка: «дає розібрану дату</tspan><tspan x="450.0" dy="16.9">або каже, що рядок хибний»</tspan></text>
<rect x="375.0" y="303.1" width="150.0" height="53.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">чистий помічник —</tspan><tspan x="450.0" dy="16.9">лишаємо справжнім</tspan></text>
<line x1="740.0" y1="150.0" x2="740.0" y2="400.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="7 6"/>
<text x="740.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">шов</text>
<line x1="579.4" y1="210.0" x2="797.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="805.0" y="161.5" width="210.0" height="37.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="910.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Дублер бази</tspan></text>
<line x1="579.4" y1="210.0" x2="797.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="805.0" y="246.5" width="210.0" height="37.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="910.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Дублер годинника</tspan></text>
<line x1="579.4" y1="210.0" x2="797.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="805.0" y="331.5" width="210.0" height="37.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="910.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Дублер мережі</tspan></text>
<text x="540.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Підміняють лише те, чим не можеш керувати або що повільне; чисту логіку лишають справжньою.</text>
</svg>