<text x="572.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">30</text>
<text x="682.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
<rect x="630.0" y="162.0" width="104.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="682.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">40</text>
<text x="352.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">head = tail = 0</text>
<rect x="858.5" y="156.6" width="163.0" height="72.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/><text x="940.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">push(50) → false</tspan><tspan x="940.0" dy="16.9">count лишився 4</tspan><tspan x="940.0" dy="16.9">вміст не змінився</tspan></text>
<text x="60.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">pop × 5  →  10, 20, 30, 40, потім відмова.   Порядок надходження збережено.</text>
<text x="60.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">Помилка на одиницю:  if (r-&gt;count &gt; RB_CAP) return false;</text>
<text x="60.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">той самий стан, той самий п'ятий push — але перевірка пропускає його всередину</text>
<text x="352.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<rect x="300.0" y="452.0" width="104.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="352.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">50</text>
<text x="462.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
<rect x="410.0" y="452.0" width="104.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="462.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">20</text>
<text x="572.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2</text>
<rect x="520.0" y="452.0" width="104.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="572.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">30</text>
<text x="682.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
<rect x="630.0" y="452.0" width="104.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="682.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">40</text>
<text x="352.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">tail = 0,  тут було 10</text>
<text x="462.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">head = 1</text>
<rect x="818.2" y="446.6" width="243.6" height="72.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/><text x="940.0" y="470.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">push(50) → true</tspan><tspan x="940.0" dy="16.9">count = 5 &gt; RB_CAP</tspan><tspan x="940.0" dy="16.9">найстаріше значення затерто</tspan></text>
<text x="60.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">pop × 5  →  50, 20, 30, 40, знову 50.   Один елемент зник, інший видано двічі.</text>
<text x="560.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один знак порівняння: ні виходу за межі масиву, ні падіння — лише тихо зіпсована обіцянка.</text>
</svg>