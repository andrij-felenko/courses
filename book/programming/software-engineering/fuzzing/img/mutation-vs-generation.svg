<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мутаційний проти генераційного фаззингу</text>
<rect x="30.0" y="76.0" width="380.0" height="206.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="220.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d1a" text-anchor="middle" font-weight="700">мутаційний</text>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">псує готові приклади з корпусу</text>
<line x1="50.0" y1="136.0" x2="390.0" y2="136.0" stroke="#caa24a" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="52.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+  стартує миттєво — формат не описуєш</text>
<text x="52.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+  знаходить багато за малих зусиль</text>
<text x="52.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">−  глибокі валідатори часто не пройде</text>
<text x="52.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">−  не вигадає геть нову структуру</text>
<rect x="430.0" y="76.0" width="380.0" height="206.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">генераційний</text>
<text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">будує вхід за описом формату</text>
<line x1="450.0" y1="136.0" x2="790.0" y2="136.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="452.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+  глибоко проходить валідатори</text>
<text x="452.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+  досягає коду за перевірками формату</text>
<text x="452.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">−  опис граматики треба писати руками</text>
<text x="452.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">−  дорожчий старт, вужчий під один формат</text>
<text x="420.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">структуро-свідомий фаззинг поєднує обидва: мутує, та лишається в межах граматики</text>
</svg>