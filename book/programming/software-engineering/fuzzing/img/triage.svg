<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 260" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="260" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріаж крешу: від сирих байтів до причини</text>
<rect x="24.0" y="80.0" width="149.6" height="104.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="98.8" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">креш-вхід</text>
<text x="98.8" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="98.8" dy="0.0">фаззер відклав</tspan><tspan x="98.8" dy="11.2">байти, що впали</tspan></text>
<rect x="189.6" y="80.0" width="149.6" height="104.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="264.4" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">відтворити</text>
<text x="264.4" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="264.4" dy="0.0">запустити ще раз —</tspan><tspan x="264.4" dy="11.2">падає стабільно?</tspan></text>
<rect x="355.2" y="80.0" width="149.6" height="104.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.0"/>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a8a" text-anchor="middle" font-weight="700">мінімізувати</text>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">зрізати зайве до</tspan><tspan x="430.0" dy="11.2">найкоротшого входу</tspan></text>
<rect x="520.8" y="80.0" width="149.6" height="104.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="595.6" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">дедуплікувати</text>
<text x="595.6" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.6" dy="0.0">згрупувати за</tspan><tspan x="595.6" dy="11.2">місцем аварії</tspan></text>
<rect x="686.4" y="80.0" width="149.6" height="104.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="761.2" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">полагодити</text>
<text x="761.2" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="761.2" dy="0.0">виправити причину,</tspan><tspan x="761.2" dy="11.2">додати в корпус</tspan></text>
<line x1="175.6" y1="132.0" x2="187.6" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="341.2" y1="132.0" x2="353.2" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="506.8" y1="132.0" x2="518.8" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="672.4" y1="132.0" x2="684.4" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">сирий креш ще не звіт: відтвори, зріж до мінімуму, згрупуй — і лише тоді лагодь</text>
</svg>