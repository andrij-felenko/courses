<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місце фаззингу серед сіток якості</text>
<rect x="150.0" y="78.0" width="540.0" height="70.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="420.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ворнінги · статичний аналіз</text>
<text x="420.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ловлять підозрілі КОНСТРУКЦІЇ без запуску</text>
<rect x="150.0" y="168.0" width="540.0" height="70.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.2"/>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a8a" text-anchor="middle" font-weight="700">хост-тести</text>
<text x="420.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">перевіряють входи, які придумав ТИ</text>
<rect x="150.0" y="258.0" width="540.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.2"/>
<text x="420.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">фаззинг + санітайзери</text>
<text x="420.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">САМ шукає входи, яких ти не уявив</text>
<text x="410.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тест відповідає на «чи правильно для входу X»; фаззер питає «а який X усе зламає»</text>
<text x="410.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">фаззинг доповнює тести й санітайзери, а не заміняє їх</text>
</svg>