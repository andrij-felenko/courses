<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія модуля за Парнасом: таємниця за інтерфейсним бар'єром</text>
<rect x="40.0" y="52.0" width="760.0" height="360.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="160.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">КЛІЄНТСЬКИЙ КОД (Зовнішній світ)</text>
<rect x="260.0" y="96.0" width="520.0" height="300.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="520.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">МОДУЛЬ ЗА ПАРНАСОМ</text>
<rect x="276.0" y="138.0" width="488.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="520.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ПУБЛІЧНИЙ ІНТЕРФЕЙС / КОНТРАКТ</text>
<text x="520.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Неповні типи · Сигнатури функцій · Передумови/постумови · Коди помилок</text>
<rect x="276.0" y="214.0" width="488.0" height="166.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.8"/>
<text x="520.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ТАЄМНИЦЯ МОДУЛЯ (Secret)</text>
<text x="290.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Структура пам'яті: двозв'язний список, динамічний вектор, бітова маска</text>
<text x="290.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Апаратні регістри: біти керування, адреси MMIO, часові затримки</text>
<text x="290.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Алгоритмічні евристики: політика витіснення кешу (LRU/LFU), швидке сортування</text>
<text x="290.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Формати протоколів: бінарні заголовки, вирівнювання, порядок байтів (endianness)</text>
<text x="290.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Управління ресурсами: м'ютекси, пули дескрипторів, динамічна алокація</text>
<line x1="90.0" y1="150.0" x2="276.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">виклик API</text>
<line x1="90.0" y1="200.0" x2="276.0" y2="200.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">запит послуги</text>
<line x1="276.0" y1="250.0" x2="90.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">результат / статус</text>
<line x1="80.0" y1="310.0" x2="230.0" y2="310.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
