<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компіляційний бар'єр: непрозорий покажчик (Opaque Pointer)</text>
<line x1="420.0" y1="48.0" x2="420.0" y2="396.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КОМПІЛЯЦІЙНИЙ БАР'ЄР (ABI Firewall)</text>
<rect x="40.0" y="56.0" width="350.0" height="330.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="215.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнтський файл (client.c / main.cpp)</text>
<rect x="56.0" y="96.0" width="318.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="215.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Публічний заголовок (sensor.h):</tspan><tspan x="215.0" dy="13.0">typedef struct sensor sensor_t;  /* неповний тип */</tspan><tspan x="215.0" dy="13.0">sensor_t* sensor_create(uint8_t id);</tspan><tspan x="215.0" dy="13.0">int sensor_read(sensor_t *s, float *out);</tspan></text>
<rect x="56.0" y="176.0" width="318.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="215.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Клієнтський код:</tspan><tspan x="215.0" dy="13.0">sensor_t *s = sensor_create(1);</tspan><tspan x="215.0" dy="13.0">float val = 0.0f;</tspan><tspan x="215.0" dy="13.0">sensor_read(s, &amp;val);</tspan><tspan x="215.0" dy="13.0">/* sizeof(struct sensor) невідомий! */</tspan><tspan x="215.0" dy="13.0">/* s-&gt;raw_reg — ПОМИЛКА КОМПІЛЯЦІЇ */</tspan></text>
<rect x="56.0" y="282.0" width="318.0" height="88.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.4"/><text x="215.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Що знає компілятор клієнта:</tspan><tspan x="215.0" dy="13.0">• Розмір покажчика (4 або 8 байтів)</tspan><tspan x="215.0" dy="13.0">• Сигнатури публічних функцій</tspan><tspan x="215.0" dy="13.0">• Жодного зміщення внутрішніх полів!</tspan></text>
<rect x="450.0" y="56.0" width="350.0" height="330.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="625.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файл реалізації (sensor.c / sensor.cpp)</text>
<rect x="466.0" y="96.0" width="318.0" height="120.0" rx="6" fill="#fef9e7" stroke="#c07000" stroke-width="1.6"/><text x="625.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Повне визначення структури (лише в .c):</tspan><tspan x="625.0" dy="13.0">struct sensor {</tspan><tspan x="625.0" dy="13.0">    uint8_t   bus_id;</tspan><tspan x="625.0" dy="13.0">    uint16_t  calibration_raw[16];</tspan><tspan x="625.0" dy="13.0">    float     last_temperature;</tspan><tspan x="625.0" dy="13.0">    uint32_t  error_flags;</tspan><tspan x="625.0" dy="13.0">    void      *bus_handle;</tspan><tspan x="625.0" dy="13.0">};</tspan></text>
<rect x="466.0" y="230.0" width="318.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="625.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Внутрішня реалізація:</tspan><tspan x="625.0" dy="13.0">• sensor_create: виділяє пам'ять під повну структуру</tspan><tspan x="625.0" dy="13.0">• sensor_read: читає калібрування, рахує формулу</tspan><tspan x="625.0" dy="13.0">• приватні допоміжні функції: static inline</tspan></text>
<rect x="466.0" y="314.0" width="318.0" height="56.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.6"/><text x="625.0" y="339.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Перевага ABI:</tspan><tspan x="625.0" dy="11.7">Зміна полів struct sensor не вимагає перекомпіляції client.o!</tspan></text>
</svg>