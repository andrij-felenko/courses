<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 406" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="406" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефект спостерігача: важкий вимір сам спотворює систему</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">міряй легко і поза критичним шляхом — інакше профіль бреше</text>
<rect x="50.0" y="76.0" width="400.0" height="260.0" rx="12" fill="#1f8a3b11" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="250.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="700">Легкий вимір</text>
<text x="70.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">esp_cpu_get_cycle_count()  — дешево</text>
<text x="70.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Δt = t1 − t0  (2 такти накладних)</text>
<text x="70.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Друк РІДКО: раз на 1000 ітерацій</text>
<text x="70.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ тайминг ділянки НЕ змінено</text>
<text x="250.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">Правильно: бачимо реальні цифри</text>
<rect x="510.0" y="76.0" width="400.0" height="260.0" rx="12" fill="#c0271e11" stroke="#c0271e" stroke-width="2.0"/>
<text x="710.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="700">Важкий вимір</text>
<text x="530.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Serial.print() на кожній ітерації</text>
<text x="530.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">UART ~1 мс → БЛОКУЄ задачу</text>
<text x="530.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Виміряний Δt роздутий у 20×</text>
<text x="530.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ профіль бреше, рішення хибне</text>
<text x="710.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="700">Небезпечно: вимір псує те, що мірить</text>
<text x="480.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">vs</text>
<rect x="108.2" y="373.0" width="743.7" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/><text x="480.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Бери дешевий лічильник циклів. Друкуй зведення рідко й поза критичним шляхом. Дивись на МАКСИМУМ.</tspan></text>
</svg>