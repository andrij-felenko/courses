<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піраміда тестів: багато швидких, мало повільних</text>
<polygon points="410.0,78.0 327.3,162.0 492.7,162.0" fill="#e9eefb" stroke="#2457d6" stroke-width="2"/>
<polygon points="327.3,162.0 492.7,162.0 575.4,246.0 244.6,246.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<polygon points="244.6,246.0 575.4,246.0 660.0,332.0 160.0,332.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2"/>
<text x="410.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">тест на залізі</text>
<text x="410.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">мало · повільно · найреальніше</text>
<text x="410.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">симуляція периферії (моки)</text>
<text x="410.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">підроблене залізо · середньо</text>
<text x="410.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">юніт-тести на хості</text>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">багато · швидко (секунди) · на ПК</text>
<text x="410.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">масу перевірок роби внизу — нагору винось лише те, що інакше не перевірити</text>
