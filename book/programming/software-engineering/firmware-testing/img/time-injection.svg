<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">інжекція часу: таймаут без реального чекання</text>
<rect x="40.0" y="64.0" width="350.0" height="280.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="215.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">час зашитий усередині</text>
<rect x="80.0" y="110.0" width="270.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">if (millis() - t0 &gt; 5000)</text>
<text x="215.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">код сам читає залізний годинник</text>
<line x1="215.0" y1="168.0" x2="215.0" y2="196.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="200.0" width="290.0" height="84.0" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">у тесті: щоб настав таймаут,</text>
<text x="215.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">треба ЧЕКАТИ справжні 5 секунд</text>
<text x="215.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">повільно · хистко · недетерміновано</text>
<text x="215.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">✗ годинник — невидима залежність</text>
<rect x="430.0" y="64.0" width="350.0" height="280.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="605.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">джерело часу за швом</text>
<rect x="470.0" y="110.0" width="270.0" height="56.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="605.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">if (now() - t0 &gt; 5000)</text>
<text x="605.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">now() подають ззовні</text>
<line x1="605.0" y1="168.0" x2="605.0" y2="196.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="200.0" width="290.0" height="84.0" rx="8" fill="#fff" stroke="#27ae60" stroke-width="1.4"/>
<text x="605.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">у тесті: now = 0; крок; now = 6000;</text>
<text x="605.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">«минуло 6 с» настає МИТТЄВО</text>
<text x="605.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">швидко · стабільно · повторювано</text>
<text x="605.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">✓ час керований — ловить межі точно</text>
<text x="410.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">винеси годинник за шов — і час у тесті стає кермом, а не секундоміром</text>
</svg>