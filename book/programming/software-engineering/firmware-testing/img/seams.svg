<text x="58.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">структура з полями-функціями</text>
<text x="58.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">(vtable вручну): код кличе</text>
<text x="58.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">drv-&gt;read(); у тесті в поле</text>
<text x="58.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">кладуть мок під час виконання</text>
<line x1="56.0" y1="250.0" x2="264.0" y2="250.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="58.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">✓ той самий бінар; гнучко</text>
<text x="58.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">− трохи зайвого коду й непрямий виклик</text>
<rect x="290.0" y="60.0" width="240.0" height="300.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">підміна на лінкуванні</text>
<rect x="320.0" y="98.0" width="180.0" height="24.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">шов у ЗБІРЦІ</text>
<text x="308.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">один .h, два .c: hw.c для</text>
<text x="308.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">заліза, fake.c для тесту;</text>
<text x="308.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">лінкер бере потрібний.</text>
<text x="308.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Так і робить Ceedling</text>
<line x1="306.0" y1="250.0" x2="514.0" y2="250.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="308.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">✓ нуль зайвого в бойовому коді</text>
<text x="308.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">− підміна цілим файлом, не точково</text>
<rect x="540.0" y="60.0" width="240.0" height="300.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="660.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">препроцесор (#ifdef)</text>
<rect x="570.0" y="98.0" width="180.0" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">шов у ВИХІДНИКУ</text>
<text x="558.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">#ifdef TEST → один код,</text>
<text x="558.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">#else → інший. Гілки</text>
<text x="558.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">обирає компілятор ще до</text>
<text x="558.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">складання бінаря</text>
<line x1="556.0" y1="250.0" x2="764.0" y2="250.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="558.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">✗ тест ганяє ІНШИЙ код,</text>
<text x="558.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ніж їде в чіп — найгірший шов</text>
<text x="410.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">що пізніше обирається підміна (рантайм → збірка → вихідник), то ближче тест до бойового коду</text>
