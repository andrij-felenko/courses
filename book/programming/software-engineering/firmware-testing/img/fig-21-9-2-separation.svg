<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний прийом: відділити логіку від заліза</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розділені — і логіку можна ганяти тестами на ПК, не торкаючись чипа</text>
<rect x="90.0" y="88.0" width="720.0" height="116.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="450.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЛОГІКА — без заліза</text>
<text x="450.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скінченні автомати · обчислення · розбір даних · рішення</text>
<text x="450.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(пам'ятаєте розбір причини reset із §4.1.8? це теж чиста логіка)</text>
<text x="450.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ компілюється й тестується прямо на ПК</text>
<rect x="250.0" y="218.0" width="400.0" height="40.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">інтерфейс / HAL — шов між світами</text>
<text x="760.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">← тут підмінюють</text>
<text x="760.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">   залізо на мок</text>
<rect x="90.0" y="272.0" width="720.0" height="110.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ДОСТУП ДО ЗАЛІЗА</text>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">GPIO · регістри · драйвери давачів · шини</text>
<text x="450.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">потрібен чіп — або його підробка (мок)</text>
