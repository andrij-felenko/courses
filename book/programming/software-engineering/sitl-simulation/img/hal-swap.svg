<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SITL зсередини: підміна на рівні HAL</text>
<rect x="70.0" y="64.0" width="680.0" height="96.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="410.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КОД АВТОПІЛОТА — однаковий в обох збірках</text>
<text x="410.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">оцінка стану (EKF) · керування · режими · місії</text>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">не знає, що під ним — чіп чи модель</text>
<rect x="190.0" y="178.0" width="440.0" height="36.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.9"/>
<text x="410.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">межа HAL — однаковий інтерфейс «дай вимір / дай тягу»</text>
<rect x="70.0" y="244.0" width="350.0" height="96.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="245.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">бойовий бекенд (плата)</text>
<text x="245.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">драйвери чипа: SPI / I2C / PWM</text>
<text x="245.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">реальні давачі й мотори</text>
<rect x="400.0" y="244.0" width="350.0" height="96.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2.4"/>
<text x="575.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">бекенд SITL (модель)</text>
<text x="575.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виміри з моделі фізики</text>
<text x="575.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тяга → у модель, не в залізо</text>
<line x1="245.0" y1="244.0" x2="190.0" y2="214.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="575.0" y1="244.0" x2="630.0" y2="214.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">SITL — це просто ще одна «плата»: підмінили найнижчий шар, усе вище лишилось</text>
</svg>