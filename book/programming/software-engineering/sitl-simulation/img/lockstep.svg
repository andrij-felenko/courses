<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Lockstep: крок симулятора — крок прошивки, по черзі</text>
<rect x="40.0" y="50.0" width="220.0" height="28.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="150.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">СИМУЛЯТОР (фізика, час)</text>
<rect x="560.0" y="50.0" width="220.0" height="28.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="670.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ПРОШИВКА (крок керування)</text>
<line x1="150.0" y1="86.0" x2="150.0" y2="332.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="3 4"/>
<line x1="670.0" y1="86.0" x2="670.0" y2="332.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 4"/>
<line x1="150.0" y1="112.0" x2="670.0" y2="112.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">виміри + мітка часу t</text>
<line x1="670.0" y1="156.0" x2="150.0" y2="156.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">один крок: оцінка → керування → тяга</text>
<line x1="150.0" y1="200.0" x2="670.0" y2="200.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">крок фізики на dt; час = t + dt</text>
<line x1="670.0" y1="244.0" x2="150.0" y2="244.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">наступний крок керування</text>
<line x1="150.0" y1="288.0" x2="670.0" y2="288.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">виміри на t + dt …</text>
<rect x="120.0" y="340.0" width="580.0" height="30.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="410.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">ніхто не біжить попереду; час — модельний → хід можна пришвидшити, сповільнити чи спинити</text>
</svg>