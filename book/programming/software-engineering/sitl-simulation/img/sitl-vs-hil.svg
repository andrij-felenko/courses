<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SITL і HIL: різниця в одному — що справжнє, а що модель</text>
<rect x="30.0" y="70.0" width="360.0" height="250.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">SITL — у петлі лише КОД</text>
<rect x="54.0" y="122.0" width="312.0" height="36.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="70.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">код автопілота</text>
<text x="350.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">справжній</text>
<rect x="54.0" y="168.0" width="312.0" height="36.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="70.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">чіп / плата</text>
<text x="350.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="700">нема</text>
<rect x="54.0" y="214.0" width="312.0" height="36.0" rx="8" fill="#ffffff" stroke="#8a6d1a" stroke-width="1.6"/>
<text x="70.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">давачі, мотори, фізика</text>
<text x="350.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="end" font-weight="700">модель</text>
<text x="210.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">усе в одному процесі на ПК — швидко, безпечно, без заліза</text>
