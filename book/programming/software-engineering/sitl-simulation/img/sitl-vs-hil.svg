<text x="750.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">справжній</text>
<rect x="454.0" y="168.0" width="312.0" height="36.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="470.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">чіп / плата</text>
<text x="750.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">справжня</text>
<rect x="454.0" y="214.0" width="312.0" height="36.0" rx="8" fill="#ffffff" stroke="#8a6d1a" stroke-width="1.6"/>
<text x="470.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">давачі, мотори, фізика</text>
<text x="750.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="end" font-weight="700">модель</text>
<text x="610.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">реальний чіп у петлі — реалістичніше, але потрібна плата</text>
<text x="410.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">та сама межа, лише зсунута: SITL перевіряє код, HIL — код разом із залізом</text>
</svg>