<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві осі перевірки якості: статична й динамічна</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вони бачать різне — і тому доповнюють одна одну</text>
<rect x="40.0" y="80.0" width="370.0" height="220.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="225.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАТИЧНА (без запуску)</text>
<text x="225.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ворнінги · статичний аналіз</text>
<line x1="60.0" y1="142.0" x2="390.0" y2="142.0" stroke="#1f8a3b" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="65.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ бачить ВЕСЬ код</text>
<text x="65.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ не потребує виконання</text>
<text x="65.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ дешево і швидко</text>
<text x="65.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ не знає реальних даних</text>
<text x="65.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ можливі хибні тривоги</text>
<rect x="490.0" y="80.0" width="370.0" height="220.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="675.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ДИНАМІЧНА (із запуском)</text>
<text x="675.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тести · відлагоджувач · санітайзери</text>
<line x1="510.0" y1="142.0" x2="840.0" y2="142.0" stroke="#1f47b5" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="515.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ бачить РЕАЛЬНІ дані</text>
<text x="515.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ ловить рантайм-баги</text>
<text x="515.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ перевіряє фізичну поведінку</text>
<text x="515.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ лише пройдені шляхи</text>
<text x="515.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ потрібне залізо або симулятор</text>
<circle cx="450.0" cy="190.0" r="26.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
<text x="450.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">vs</text>
<rect x="80.0" y="316.0" width="740.0" height="52.0" rx="8" fill="#f8f8f8" stroke="#e4e4e4" stroke-width="1"/>
<text x="450.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Статична ловить «структурні» баги в коді; динамічна — «поведінкові» з реальними даними.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Разом — повна сітка. Порізно — сліпа пляма.</text>
</svg>
