<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири сітки якості: що раніше зловиш — то дешевше</text>
<rect x="130.0" y="70.0" width="560.0" height="54.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="410.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ворнінги</text>
<text x="410.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">при кожній збірці — безкоштовно</text>
<line x1="714.0" y1="126.0" x2="714.0" y2="136.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="138.0" width="560.0" height="54.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.0"/>
<text x="410.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a8a" text-anchor="middle" font-weight="700">статичний аналіз</text>
<text x="410.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">рідше, автоматично, на ПК</text>
<line x1="714.0" y1="194.0" x2="714.0" y2="204.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="206.0" width="560.0" height="54.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="410.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="700">хост-тести</text>
<text x="410.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">хвилини на ПК, автоматично</text>
<line x1="714.0" y1="262.0" x2="714.0" y2="272.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="274.0" width="560.0" height="54.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">живий чіп</text>
<text x="410.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">повільно, потрібне залізо</text>
<line x1="714.0" y1="52.0" x2="714.0" y2="68.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="728.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">баг</text>
<text x="112.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">дешево</text>
<text x="112.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">найдорожче</text>
<line x1="60.0" y1="78.0" x2="60.0" y2="314.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожен клас багів дешевше зловити на своєму рівні, а не на вершині піраміди</text>
</svg>