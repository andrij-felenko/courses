<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підстановка Лісков: підтип придатний усюди, де чекають базовий</text>
<rect x="160.0" y="60.2" width="440.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="380.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">код, написаний у термінах БАЗОВОГО типу T</tspan><tspan x="380.0" dy="15.6">(знає лише обіцянки T)</tspan></text>
<rect x="175.0" y="173.3" width="150.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">обʼєкт T</tspan><tspan x="250.0" dy="14.3">(базовий)</tspan></text>
<rect x="435.0" y="173.3" width="150.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/><text x="510.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">обʼєкт S</tspan><tspan x="510.0" dy="14.3">(підтип)</tspan></text>
<line x1="250.0" y1="173.3" x2="310.0" y2="107.8" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="510.0" y1="173.3" x2="450.0" y2="107.8" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="510.0" y="240.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">підставляємо S замість T</text>
<rect x="150.0" y="280.0" width="460.0" height="32.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="380.0" y="300.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">поведінка коду не змінилась  →  S Є ПІДТИПОМ T</tspan></text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">підтипізація — про збіг ПОВЕДІНКИ, а не лише полів і сигнатур</text>
</svg>