<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири правила поведінкової підтипізації</text>
<rect x="150.0" y="53.5" width="460.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="380.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">ПІДТИП ВЗАЄМОЗАМІННИЙ із базовим, якщо:</tspan></text>
<rect x="120.0" y="105.3" width="520.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/><text x="380.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1. Передумову — лише ПОСЛАБИТИ</tspan><tspan x="380.0" dy="14.3">приймати не менше входів, ніж батько</tspan></text>
<rect x="120.0" y="171.3" width="520.0" height="45.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/><text x="380.0" y="190.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2. Постумову — лише ПОСИЛИТИ</tspan><tspan x="380.0" dy="14.3">гарантувати не менше, ніж батько</tspan></text>
<rect x="120.0" y="237.3" width="520.0" height="45.3" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.8"/><text x="380.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">3. Інваріанти батька — ЗБЕРЕГТИ</tspan><tspan x="380.0" dy="14.3">жодного не скасувати (свої — можна додати)</tspan></text>
<rect x="120.0" y="303.4" width="520.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="380.0" y="322.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">4. Історичне правило</tspan><tspan x="380.0" dy="14.3">не міняти стан способом, забороненим батькові</tspan></text>
<text x="380.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порушив бодай одне — формально «успадкував», а насправді тихо рве чужий код</text>
</svg>