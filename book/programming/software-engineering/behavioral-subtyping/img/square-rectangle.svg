<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадрат і Прямокутник: класичне порушення LSP</text>
<rect x="50.0" y="54.2" width="300.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="200.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ВИКЛИКАЧ під Прямокутник:</tspan><tspan x="200.0" dy="14.3">setWidth(5) міняє лише ширину</tspan><tspan x="200.0" dy="14.3">→ площа = 5 × стара_висота</tspan></text>
<rect x="430.0" y="54.2" width="300.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="580.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">А підставили КВАДРАТ:</tspan><tspan x="580.0" dy="14.3">інваріант w == h</tspan><tspan x="580.0" dy="14.3">→ setWidth ЗМУШЕНИЙ змінити й висоту</tspan></text>
<rect x="130.0" y="196.0" width="70.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">5 × 3</text>
<text x="165.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">висота ціла</text>
<rect x="560.0" y="176.0" width="90.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="605.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">5 × 5</text>
<text x="605.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">висота тихо змінилась</text>
<line x1="290.0" y1="230.0" x2="470.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="274.3" y="207.3" width="231.4" height="45.3" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.8"/><text x="390.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">постумова «висота не змінилась»</tspan><tspan x="390.0" dy="14.3">тихо ПОРУШЕНА</tspan></text>
<rect x="110.0" y="304.0" width="560.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="390.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Квадрат успадкував поля Прямокутника, але НЕ його поведінку → не підтип</tspan></text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сильніший інваріант нащадка ламає те, на що розраховував код під батька</text>
</svg>