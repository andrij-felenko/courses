<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей прийняття рішень під час рев'ю</text>
<text x="480.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прийняття рішень: Одностайність vs Прагматичний консенсус (Rough Consensus)</text>
<rect x="60.0" y="75.0" width="400.0" height="270.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Одностайність (Unanimity)</text>
<text x="260.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Кожен учасник повинен погодитися»</text>
<circle cx="95.0" cy="170.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="95.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="115.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Будь-який учасник має право вето</text>
<circle cx="95.0" cy="206.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="95.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="115.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Блокування через суб'єктивні смаки (bike-shedding)</text>
<circle cx="95.0" cy="242.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="95.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="115.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Параліч аналізу: місяці безкінечних суперечок</text>
<circle cx="95.0" cy="278.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="95.0" y="281.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="115.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Дизайн розмивається на догоду всім компромісам</text>
<rect x="80.0" y="310.0" width="360.0" height="26.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="260.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Результат: затягування або компромісний монстр</tspan></text>
<rect x="500.0" y="75.0" width="400.0" height="270.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/>
<text x="700.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Rough Consensus (IETF)</text>
<text x="700.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Усі заперечення почуті, блокуючі ризики зняті»</text>
<circle cx="535.0" cy="170.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="535.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="555.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Рішення не вимагає 100% однакових думок</text>
<circle cx="535.0" cy="206.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="535.0" y="210.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="555.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Відхилення незгоди, якщо немає технічного доказу збою</text>
<circle cx="535.0" cy="242.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="535.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="555.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Обмежений у часі період обговорення (time-box)</text>
<circle cx="535.0" cy="278.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="535.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="555.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Фінальне слово за відповідальним архітектором / TL</text>
<rect x="520.0" y="310.0" width="360.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="700.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Результат: швидке просування з контролем ризиків</tspan></text>
<line x1="50.0" y1="375.0" x2="910.0" y2="375.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="48.9" y="406.5" width="862.2" height="37.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/><text x="480.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Принцип IETF: «We reject: kings, presidents and voting. We believe in: rough consensus and running code»</tspan></text>
</svg>