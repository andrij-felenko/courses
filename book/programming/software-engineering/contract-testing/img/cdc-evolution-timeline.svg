<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія розвитку контрактного тестування</text>
<text x="540.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція контрактного тестування: від моків до розподіленого брокера</text>
<line x1="260.0" y1="85.0" x2="260.0" y2="525.0" stroke="#6b7280" stroke-width="2.2"/>
<text x="220.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2000</text>
<circle cx="260.0" cy="115.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="300.0" y="80.0" width="730.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Mackinnon, Freeman, Craig: «Endo-Testing: Unit Testing with Mock Objects»</tspan><tspan x="665.0" dy="16.9">Виникає потреба перевіряти очікування від співпрацівників у межах одного процесу</tspan></text>
<text x="220.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2006</text>
<circle cx="260.0" cy="210.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="300.0" y="175.0" width="730.0" height="70.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Ian Robinson (ThoughtWorks): стаття «Consumer-Driven Contracts: A Service Design Pattern»</tspan><tspan x="665.0" dy="16.9">Формулювання ідеї: споживач публікує власні очікування, щоб постачальник не ламав клієнтів</tspan></text>
<text x="220.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2011</text>
<circle cx="260.0" cy="305.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="300.0" y="270.0" width="730.0" height="70.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Martin Fowler: формалізація «Contract Test»</tspan><tspan x="665.0" dy="16.9">Окремий клас тестів на межі зовнішніх сервісів та для верифікації тестових дублерів</tspan></text>
<text x="220.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2013</text>
<circle cx="260.0" cy="400.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="300.0" y="365.0" width="730.0" height="70.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Beth Skurrie, Ron Holshausen (realestate.com.au / DiUS): створення Pact</tspan><tspan x="665.0" dy="16.9">Перший виконуваний JSON-формат контракту та mock-сервер для автоматичного запису очікувань</tspan></text>
<text x="220.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2017+</text>
<circle cx="260.0" cy="495.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="300.0" y="460.0" width="730.0" height="70.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Pact Broker, матриця сумісності can-i-deploy та специфікації Pact v3/v4</tspan><tspan x="665.0" dy="16.9">Підтримка бінарних повідомлень, черг подій (Kafka/RabbitMQ), gRPC та Protobuf</tspan></text>
<text x="540.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Контрактні тести перетворили неформальні домовленості команд на машинно перевірювані артефакти в CI.</text>
</svg>