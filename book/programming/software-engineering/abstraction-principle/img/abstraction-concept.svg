<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип абстракції: відокремлення сутнісного від випадкового</text>
<rect x="100.0" y="21.3" width="580.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="390.0" y="40.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">КЛІЄНТСЬКИЙ КОД (БІЗНЕС-ЛОГІКА)</tspan><tspan x="390.0" dy="14.3">Оперує сутностями завдання: sensor.read_temperature() -&gt; float</tspan></text>
<line x1="390.0" y1="66.7" x2="390.0" y2="114.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">виклик через контракт</text>
<rect x="80.0" y="113.0" width="620.0" height="73.9" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="390.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">МЕЖА АБСТРАКЦІЇ (СЕМАНТИЧНИЙ КОНТРАКТ)</tspan><tspan x="390.0" dy="14.3">• Чіткий набір операцій: { read(), calibrate(), status() }</tspan><tspan x="390.0" dy="14.3">• Гарантовані інваріанти: температура в °C, діапазон [-40..+85]</tspan><tspan x="390.0" dy="14.3">• Ізоляція від фізичного представлення та апаратного протоколу</tspan></text>
<line x1="50.0" y1="216.0" x2="730.0" y2="216.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="390.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">▼  ДЕТАЛІ ВТІЛЕННЯ ПРИХОВАНІ ЗА МЕЖЕЮ  ▼</text>
<rect x="60.0" y="275.5" width="200.0" height="69.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="160.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Реалізація I2C (BMP280)</tspan><tspan x="160.0" dy="13.0">• Адреса шини 0x76</tspan><tspan x="160.0" dy="13.0">• Калібрувальні коефіцієнти</tspan><tspan x="160.0" dy="13.0">• 20-бітні сирі регістри</tspan></text>
<rect x="290.0" y="275.5" width="200.0" height="69.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="390.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Реалізація SPI (MAX31865)</tspan><tspan x="390.0" dy="13.0">• Вибірка CS, режим SPI 1</tspan><tspan x="390.0" dy="13.0">• PT100 терморезистор</tspan><tspan x="390.0" dy="13.0">• Обчислення полінома RTD</tspan></text>
<rect x="520.0" y="275.5" width="200.0" height="69.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="620.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Імітатор SITL (Mock)</tspan><tspan x="620.0" dy="13.0">• Генерація синусоїди</tspan><tspan x="620.0" dy="13.0">• Додавання шуму Гауса</tspan><tspan x="620.0" dy="13.0">• Тестування без заліза</tspan></text>
<line x1="210.0" y1="216.0" x2="160.0" y2="275.5" stroke="#6b7280" stroke-width="1.4"/>
