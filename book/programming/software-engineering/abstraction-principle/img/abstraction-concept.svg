<text x="390.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зміна протоколу, заліза чи структури пам'яті не зачіпає клієнтський код</text>
