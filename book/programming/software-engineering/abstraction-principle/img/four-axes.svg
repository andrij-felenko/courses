<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири осі принципу абстракції</text>
<rect x="21.6" y="133.8" width="182.8" height="112.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="113.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="113.0" dy="0.0">1. За значенням</tspan><tspan x="113.0" dy="13.7">(Функціональна)</tspan><tspan x="113.0" dy="13.7"></tspan><tspan x="113.0" dy="13.7">Параметризація обчислень</tspan><tspan x="113.0" dy="13.7">аргументами:</tspan><tspan x="113.0" dy="13.7">sqr(x) = x · x</tspan><tspan x="113.0" dy="13.7">Замість дублювання формул</tspan></text>
<rect x="209.9" y="133.8" width="202.3" height="112.4" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.6"/><text x="311.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="311.0" dy="0.0">2. За представленням</tspan><tspan x="311.0" dy="13.7">(Абстрактні типи (ADT))</tspan><tspan x="311.0" dy="13.7"></tspan><tspan x="311.0" dy="13.7">Приховування форми пам'яті</tspan><tspan x="311.0" dy="13.7">за операціями:</tspan><tspan x="311.0" dy="13.7">RingBuffer { push, pop }</tspan><tspan x="311.0" dy="13.7">Захист інваріантів структури</tspan></text>
<rect x="414.4" y="133.8" width="189.3" height="112.4" rx="6" fill="#fff8e1" stroke="#c07000" stroke-width="1.6"/><text x="509.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="509.0" dy="0.0">3. За типом</tspan><tspan x="509.0" dy="13.7">(Параметрична (Generics))</tspan><tspan x="509.0" dy="13.7"></tspan><tspan x="509.0" dy="13.7">Параметризація алгоритму</tspan><tspan x="509.0" dy="13.7">типом даних:</tspan><tspan x="509.0" dy="13.7">sort&lt;T&gt;(span&lt;T&gt;)</tspan><tspan x="509.0" dy="13.7">Один код для int, float, T</tspan></text>
<rect x="612.4" y="133.8" width="189.3" height="112.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="707.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.0" dy="0.0">4. За поведінкою</tspan><tspan x="707.0" dy="13.7">(Поліморфна)</tspan><tspan x="707.0" dy="13.7"></tspan><tspan x="707.0" dy="13.7">Динамічна підміна втілення</tspan><tspan x="707.0" dy="13.7">через інтерфейс:</tspan><tspan x="707.0" dy="13.7">ITransport -&gt; send(pkt)</tspan><tspan x="707.0" dy="13.7">UART, TCP, BLE на льоту</tspan></text>
<rect x="50.0" y="38.5" width="720.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="410.0" y="57.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ЄДИНЕ ПРАВИЛО: СПІЛЬНІСТЬ ВИНЕСЕНО В АБСТРАКЦІЮ, ВІДМІННОСТІ — У ПАРАМЕТРИ</tspan></text>
<text x="410.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Різні механізми мови втілюють один і той самий принцип на різних рівнях виразності</text>
</svg>