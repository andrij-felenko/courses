<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні реакції: одне питання, три відповіді</text>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">очікувано</text>
<line x1="380.0" y1="83.0" x2="150.0" y2="151.1" stroke="#6b7280" stroke-width="1.5"/>
<line x1="150.0" y1="224.9" x2="150.0" y2="264.4" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="93.0" y="151.1" width="114.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ЗОВНІШНІЙ СВІТ</tspan><tspan x="150.0" dy="14.3">давач мовчить,</tspan><tspan x="150.0" dy="14.3">файл відсутній,</tspan><tspan x="150.0" dy="14.3">шина зайнята</tspan></text>
<rect x="87.9" y="264.4" width="124.2" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="150.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">КОД ПОВЕРНЕННЯ</tspan><tspan x="150.0" dy="15.6">хай вирішує</tspan><tspan x="150.0" dy="15.6">викликач</tspan></text>
<text x="380.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c07000" text-anchor="middle" font-weight="700" font-style="italic">баг</text>
<line x1="380.0" y1="83.0" x2="380.0" y2="143.9" stroke="#6b7280" stroke-width="1.5"/>
<line x1="380.0" y1="232.1" x2="380.0" y2="264.4" stroke="#c07000" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="316.7" y="143.9" width="126.6" height="88.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="380.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ПОРУШЕНО</tspan><tspan x="380.0" dy="14.3">ПРИПУЩЕННЯ</tspan><tspan x="380.0" dy="14.3">NULL там, де не</tspan><tspan x="380.0" dy="14.3">може бути; індекс</tspan><tspan x="380.0" dy="14.3">за межами</tspan></text>
<rect x="321.6" y="264.4" width="116.7" height="63.2" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="2.2"/><text x="380.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">ASSERT</tspan><tspan x="380.0" dy="15.6">стоп у debug,</tspan><tspan x="380.0" dy="15.6">файл і рядок</tspan></text>
<text x="610.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">невідновно</text>
<line x1="380.0" y1="83.0" x2="610.0" y2="151.1" stroke="#6b7280" stroke-width="1.5"/>
<line x1="610.0" y1="224.9" x2="610.0" y2="264.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="553.0" y="151.1" width="114.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="610.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">СТАН ЗЛАМАНО</tspan><tspan x="610.0" dy="14.3">псування стеку,</tspan><tspan x="610.0" dy="14.3">бита критична</tspan><tspan x="610.0" dy="14.3">структура в RAM</tspan></text>
<rect x="540.5" y="264.4" width="139.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="610.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">ПАНІКА / RESET</tspan><tspan x="610.0" dy="15.6">далі будь-яка</tspan><tspan x="610.0" dy="15.6">дія робить гірше</tspan></text>
<rect x="315.9" y="45.0" width="128.2" height="38.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/><text x="380.0" y="68.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Звідки збій?</tspan></text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">силу відповіді диктує ПОХОДЖЕННЯ збою, не його гучність</text>
</svg>