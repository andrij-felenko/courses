<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трійка Гоара {P} C {Q}: уперед виконання, назад доказ</text>
<rect x="60.0" y="110.0" width="200.0" height="92.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.0"/>
<text x="160.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1f8a8a" text-anchor="middle" font-weight="700">{ P }</text>
<text x="160.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">передумова:</tspan><tspan x="160.0" dy="11.4">стан ДО виконання</tspan></text>
<rect x="310.0" y="110.0" width="180.0" height="92.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<text x="400.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="400.0" dy="0.0">програма</tspan><tspan x="400.0" dy="11.4">(інструкції)</tspan></text>
<rect x="540.0" y="110.0" width="200.0" height="92.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.0"/>
<text x="640.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1f8a8a" text-anchor="middle" font-weight="700">{ Q }</text>
<text x="640.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">постумова:</tspan><tspan x="640.0" dy="11.4">стан ПІСЛЯ</tspan></text>
<line x1="266.0" y1="156.0" x2="304.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="496.0" y1="156.0" x2="534.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">виконання</text>
<text x="400.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">«якщо до C справджується P, то після C справдиться Q»</text>
<line x1="640.0" y1="232.0" x2="160.0" y2="232.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="400.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">доказ рухається НАЗАД: від Q крізь C — яка P достатня</text>
<text x="400.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(числення слабшої передумови — основа дедуктивної верифікації)</text>
</svg>