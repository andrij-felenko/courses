<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа доказу: певність лише щодо специфікації, яку пише людина</text>
<rect x="30.0" y="92.0" width="180.0" height="96.0" rx="10" fill="#f1f1f1" stroke="#6b7280" stroke-width="2.0"/>
<text x="120.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">реальна</tspan><tspan x="120.0" dy="14.9">вимога</tspan></text>
<text x="120.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">що насправді</tspan><tspan x="120.0" dy="11.4">треба</tspan></text>
<rect x="320.0" y="92.0" width="180.0" height="96.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.0"/>
<text x="410.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a8a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">специфікація</tspan></text>
<text x="410.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">формальний</tspan><tspan x="410.0" dy="11.4">запис вимоги</tspan></text>
<rect x="610.0" y="92.0" width="180.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="700.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">код</tspan></text>
<text x="700.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="700.0" dy="0.0">реалізація</tspan></text>
<line x1="606.0" y1="140.0" x2="504.0" y2="140.0" stroke="#1f8a8a" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="504.0" y1="158.0" x2="606.0" y2="158.0" stroke="#1f8a8a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="555.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a8a" text-anchor="middle" font-weight="700">ДОКАЗ</text>
<text x="555.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a8a" text-anchor="middle"><tspan x="555.0" dy="0.0">машина гарантує:</tspan><tspan x="555.0" dy="11.4">код = специфікація</tspan></text>
<line x1="214.0" y1="140.0" x2="316.0" y2="140.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="265.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<text x="265.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="265.0" dy="0.0">НЕ доведено:</tspan><tspan x="265.0" dy="11.4">людина пише руками</tspan></text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">доказ замикає лише ланку «код ↔ специфікація»</text>
<text x="410.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">хибна специфікація → бездоганно доведено НЕ ТЕ; це головна межа методу</text>
