<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довірена база: що доказ гарантує і у що все одно віриш</text>
<rect x="230.0" y="60.0" width="300.0" height="56.0" rx="10" fill="#e6f4f4" stroke="#1f8a8a" stroke-width="2.4"/>
<text x="380.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a8a" text-anchor="middle" font-weight="700">ДОВЕДЕНИЙ КОД</text>
<text x="380.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">властивість математично гарантована</text>
<rect x="30.0" y="200.0" width="150.0" height="90.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="105.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">специфікація</text>
<text x="105.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">відбиває справжню</tspan><tspan x="105.0" dy="10.8">вимогу?</tspan></text>
<line x1="105.0" y1="196.0" x2="380.0" y2="120.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="213.3" y="200.0" width="150.0" height="90.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<text x="288.3" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">пруфер</text>
<text x="288.3" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="288.3" dy="0.0">сам доказувач</tspan><tspan x="288.3" dy="10.8">без вади?</tspan></text>
<line x1="288.3" y1="196.0" x2="380.0" y2="120.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="396.7" y="200.0" width="150.0" height="90.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="471.7" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">компілятор</text>
<text x="471.7" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="471.7" dy="0.0">переклав без</tspan><tspan x="471.7" dy="10.8">спотворення?</tspan></text>
<line x1="471.7" y1="196.0" x2="380.0" y2="120.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="580.0" y="200.0" width="150.0" height="90.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<text x="655.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">залізо</text>
<text x="655.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">виконує так,</tspan><tspan x="655.0" dy="10.8">як припускали?</tspan></text>
<line x1="655.0" y1="196.0" x2="380.0" y2="120.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="380.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">довірена база (їй віримо без доказу)</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">доказ ПЕРЕНОСИТЬ довіру на цю базу, а не скасовує її</text>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">seL4 і CompCert тому й цінні: вони звужують базу — менше того, у що треба просто вірити</text>
</svg>