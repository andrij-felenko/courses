<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затиск (clamp) проти тихого перевалювання (wrap)</text>
<line x1="70.0" y1="250.0" x2="70.0" y2="72.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="70.0" y1="250.0" x2="320.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="195.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вхід зростає</text>
<text x="195.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">wrap: тихо перевалює</text>
<line x1="70.0" y1="117.4" x2="320.0" y2="117.4" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="322.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">межа</text>
<polyline points="76,244 220,121 220,244 314,199" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<text x="220.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">стрибок на дно</text>
<line x1="400.0" y1="250.0" x2="400.0" y2="72.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400.0" y1="250.0" x2="650.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="525.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вхід зростає</text>
<text x="525.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">clamp: притискає до стелі</text>
<rect x="400.0" y="117.4" width="250.0" height="132.6" rx="0" fill="#eef9f0" stroke="none" stroke-width="0.0"/>
<line x1="400.0" y1="117.4" x2="650.0" y2="117.4" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="652.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">стеля</text>
<polyline points="406,244 550,120 644,120" fill="none" stroke="#27ae60" stroke-width="2.6"/>
<text x="580.0" y="109.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">плато на межі</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Те саме завелике значення: wrap робить його малим і брехливим, clamp лишає на безпечній межі.</text>
</svg>