<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зелений тест із дублем доводить рівно одне</text>
<rect x="50.0" y="78.0" width="570.0" height="140.0" rx="14" fill="#f0fbf4" stroke="#cfeadd" stroke-width="1.4"/>
<text x="335.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Що показав зелений тест</text>
<line x1="274.0" y1="172.0" x2="376.0" y2="172.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="90.0" y="154.2" width="180.0" height="35.5" rx="6" fill="#fffbea" stroke="#1a1a1a" stroke-width="2.0"/><text x="180.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">одиниця</tspan></text>
<rect x="380.0" y="154.2" width="180.0" height="35.5" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/><text x="470.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ДУБЛЬ D</tspan></text>
<rect x="50.0" y="300.0" width="570.0" height="140.0" rx="14" fill="#f2f6ff" stroke="#d5e0f7" stroke-width="1.4"/>
<text x="335.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Що тобі потрібно в бою</text>
<line x1="274.0" y1="394.0" x2="376.0" y2="394.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="90.0" y="376.2" width="180.0" height="35.5" rx="6" fill="#fffbea" stroke="#1a1a1a" stroke-width="2.0"/><text x="180.0" y="398.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">одиниця</tspan></text>
<rect x="380.0" y="376.2" width="180.0" height="35.5" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/><text x="470.0" y="398.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">СПРАВЖНІЙ R</tspan></text>
<line x1="335.0" y1="226.0" x2="335.0" y2="292.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="91.8" y="236.8" width="96.4" height="44.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="140.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">перенесення</tspan><tspan x="140.0" dy="15.0">висновку</tspan></text>
<rect x="354.7" y="229.3" width="274.7" height="59.4" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.5"/><text x="492.0" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.0" dy="0.0">законне ЛИШЕ якщо D тримає</tspan><tspan x="492.0" dy="15.0">той самий контракт, що R,</tspan><tspan x="492.0" dy="15.0">у частині, якою одиниця користується</tspan></text>
<text x="910.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Чим зазор вірності проривається</text>
<rect x="660.0" y="128.0" width="470.0" height="56.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Дубль не вміє падати —</tspan><tspan x="895.0" dy="15.6">гілку помилки тест ніби перевіряє, а насправді ні</tspan></text>
<rect x="660.0" y="194.0" width="470.0" height="56.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Дубль дозволяє те, чого справжній не дозволить:</tspan><tspan x="895.0" dy="15.6">унікальність, транзакцію, порядок</tspan></text>
<rect x="660.0" y="260.0" width="470.0" height="56.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Справжній змінився —</tspan><tspan x="895.0" dy="15.6">дубль лишився вчорашнім</tspan></text>
<rect x="660.0" y="326.0" width="470.0" height="56.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Дубль на ЧУЖОМУ кодує лише</tspan><tspan x="895.0" dy="15.6">твій здогад про чужий контракт</tspan></text>
<rect x="660.0" y="412.0" width="470.0" height="92.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="895.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">Стягує зазор один хід: той самий набір перевірок</tspan><tspan x="895.0" dy="16.2">ганяють і на дублі, і на справжньому.</tspan><tspan x="895.0" dy="16.2">Це контрактний тест — єдине, що вміє сказати,</tspan><tspan x="895.0" dy="16.2">що дубль іще не збрехав.</tspan></text>
<rect x="256.8" y="542.2" width="666.5" height="35.5" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.8"/><text x="590.0" y="564.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Тест із дублем показує: одиниця працює з ДУБЛЕМ. Про справжнього він мовчить.</tspan></text>
</svg>