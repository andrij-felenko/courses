<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один набір тверджень — стільки смуг, скільки реалізацій</text>
<rect x="55.0" y="92.0" width="480.0" height="64.0" rx="6" fill="#fffbea" stroke="#1a1a1a" stroke-width="2.2"/><text x="295.0" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">НАБІР ТВЕРДЖЕНЬ ПРО КОНТРАКТ ТРАНСПОРТУ</tspan><tspan x="295.0" dy="17.6">TYPED_TEST_SUITE_P — один текст</tspan></text>
<rect x="55.0" y="174.0" width="480.0" height="190.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="295.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">•  mtu() більший за нуль</tspan><tspan x="295.0" dy="17.6">•  шматок рівно на MTU приймається</tspan><tspan x="295.0" dy="17.6">•  шматок понад MTU — Fatal</tspan><tspan x="295.0" dy="17.6">•  поки ніхто не вичитує, транспорт</tspan><tspan x="295.0" dy="17.6">    зрештою відповідає WouldBlock</tspan></text>
<rect x="55.0" y="382.0" width="480.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="295.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">тіла торкаються ЛИШЕ mtu() і send() —</tspan><tspan x="295.0" dy="16.9">тому компілюються для БУДЬ-ЯКОЇ реалізації</tspan></text>
<line x1="549.0" y1="205.0" x2="676.0" y2="172.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="549.0" y1="300.0" x2="676.0" y2="342.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="690.0" y="118.0" width="500.0" height="108.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="940.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">ШВИДКА СМУГА</tspan><tspan x="940.0" dy="16.9">INSTANTIATE_TYPED_TEST_SUITE_P⟨FakeTransport⟩</tspan><tspan x="940.0" dy="16.9">кожен коміт · мілісекунди · без мережі</tspan></text>
<rect x="690.0" y="288.0" width="500.0" height="108.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="940.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">ПОВІЛЬНА СМУГА</tspan><tspan x="940.0" dy="16.9">INSTANTIATE_TYPED_TEST_SUITE_P⟨UdpLoopback⟩</tspan><tspan x="940.0" dy="16.9">нічний прогін · справжній сокет</tspan></text>
<rect x="690.0" y="428.0" width="500.0" height="112.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="471.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Червона повільна при зеленій швидкій</tspan><tspan x="940.0" dy="16.9">означає рівно одне: фейк збрехав</tspan><tspan x="940.0" dy="16.9">саме в цьому рядку контракту.</tspan></text>
<rect x="386.2" y="598.5" width="467.6" height="55.1" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.8"/><text x="620.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Без повільної смуги фейк тихо старіє — а разом із ним</tspan><tspan x="620.0" dy="17.6">старіють усі швидкі тести, що на ньому стоять.</tspan></text>
</svg>