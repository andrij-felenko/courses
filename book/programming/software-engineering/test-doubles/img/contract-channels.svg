<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири канали, якими одиниця обмінюється зі світом</text>
<line x1="261.0" y1="178.0" x2="404.0" y2="178.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">прямий вхід: аргументи виклику</text>
<line x1="404.0" y1="226.0" x2="261.0" y2="226.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">прямий вихід: повернене значення</text>
<line x1="490.0" y1="231.5" x2="490.0" y2="435.9" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="630.0" y1="435.9" x2="630.0" y2="231.5" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="320.0" y1="300.0" x2="490.0" y2="300.0" stroke="#c0392b" stroke-width="1.4"/>
<rect x="40.0" y="266.5" width="280.0" height="67.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">НЕПРЯМИЙ ВИХІД</tspan><tspan x="180.0" dy="16.2">що одиниця каже світові</tspan><tspan x="180.0" dy="16.2">тут ТОЧКА СПОСТЕРЕЖЕННЯ</tspan></text>
<line x1="630.0" y1="386.0" x2="760.0" y2="386.0" stroke="#2457d6" stroke-width="1.4"/>
<rect x="760.0" y="352.5" width="280.0" height="67.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="900.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">НЕПРЯМИЙ ВХІД</tspan><tspan x="900.0" dy="16.2">що одиниця чує від світу</tspan><tspan x="900.0" dy="16.2">тут ТОЧКА КЕРУВАННЯ</tspan></text>
<rect x="65.0" y="171.9" width="190.0" height="56.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="160.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">ТЕСТ</tspan><tspan x="160.0" dy="18.2">(твої руки)</tspan></text>
<rect x="410.0" y="174.5" width="300.0" height="51.0" rx="6" fill="#fffbea" stroke="#1a1a1a" stroke-width="2.4"/><text x="560.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Одиниця під перевіркою</tspan></text>
<rect x="390.0" y="441.9" width="340.0" height="56.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="560.0" y="465.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Справжній співавтор</tspan><tspan x="560.0" dy="18.2">(база, шлюз, годинник)</tspan></text>
<rect x="299.1" y="534.0" width="521.7" height="51.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="560.0" y="556.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Прямі канали тест тримає сам. До непрямих він дістає лише тим,</tspan><tspan x="560.0" dy="16.9">що підставляє замість співавтора, — дублером.</tspan></text>
</svg>