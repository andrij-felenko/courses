<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три розряди й одне питання: чи зламає мене оновлення?</text>
<text x="500.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="545.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#1a1a1a" text-anchor="middle">.</text>
<text x="580.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#27ae60" text-anchor="middle" font-weight="700">4</text>
<text x="615.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#1a1a1a" text-anchor="middle">.</text>
<text x="650.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="60.0" y="175.0" width="330.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="225.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">МАЖОРНЕ = 2</tspan></text>
<text x="225.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">коли росте</text>
<rect x="60.0" y="258.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">ламка зміна:</tspan><tspan x="225.0" dy="16.2">прибрав, переназвав</tspan><tspan x="225.0" dy="16.2">чи змінив поведінку</tspan></text>
<text x="225.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що це для тебе</text>
<rect x="60.0" y="368.0" width="330.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">читай журнал і мігруй —</tspan><tspan x="225.0" dy="16.2">брати наосліп НЕ можна</tspan></text>
<rect x="415.0" y="175.0" width="330.0" height="50.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.2"/><text x="580.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">МІНОРНЕ = 4</tspan></text>
<text x="580.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">коли росте</text>
<rect x="415.0" y="258.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">нова можливість</tspan><tspan x="580.0" dy="16.2">поряд зі старим;</tspan><tspan x="580.0" dy="16.2">старе — точно як було</tspan></text>
<text x="580.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що це для тебе</text>
<rect x="415.0" y="368.0" width="330.0" height="62.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">безпечно;</tspan><tspan x="580.0" dy="16.2">нове — за бажанням</tspan></text>
<rect x="770.0" y="175.0" width="330.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="935.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">ЛАТКА = 1</tspan></text>
<text x="935.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">коли росте</text>
<rect x="770.0" y="258.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="935.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">виправлення без зміни</tspan><tspan x="935.0" dy="16.2">поведінки, на яку</tspan><tspan x="935.0" dy="16.2">ти спираєшся</tspan></text>
<text x="935.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що це для тебе</text>
<rect x="770.0" y="368.0" width="330.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="935.0" y="403.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">бери наосліп</tspan></text>
<rect x="70.0" y="470.0" width="1020.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="580.0" y="494.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Правило скидання: піднявся старший розряд — молодші в нуль.</tspan><tspan x="580.0" dy="16.9">1.4.2  →  1.5.0 (нова можливість, латка в нуль)  →  2.0.0 (ламка, мінор і латка в нуль).</tspan><tspan x="580.0" dy="16.9">Кожен розряд лічить зміни свого роду від останньої старшої зміни.</tspan></text>
</svg>