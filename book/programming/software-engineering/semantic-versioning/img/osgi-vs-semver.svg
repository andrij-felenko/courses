<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві схеми однієї ідеї: точніше проти простішого</text>
<rect x="55.0" y="70.0" width="515.0" height="420.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="610.0" y="70.0" width="515.0" height="420.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="73.0" y="82.0" width="479.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="312.5" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="312.5" dy="0.0">OSGi Alliance · вайтпейпер «Semantic Versioning», 2010</tspan></text>
<rect x="73.0" y="140.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="312.5" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.5" dy="0.0">версія: major . minor . micro . qualifier  (чотири розряди)</tspan></text>
<rect x="73.0" y="206.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="312.5" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.5" dy="0.0">два роди клієнта: хто ВИКЛИКАЄ · хто РЕАЛІЗУЄ інтерфейс</tspan></text>
<rect x="73.0" y="272.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="312.5" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.5" dy="0.0">мінор: сумісний для викликача, ламкий для реалізатора</tspan></text>
<rect x="73.0" y="338.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="312.5" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.5" dy="0.0">діапазони різні: викликач [1.5, 2)  ·  реалізатор [1.5, 1.6)</tspan></text>
<rect x="73.0" y="404.0" width="479.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="312.5" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="312.5" dy="0.0">точніше — і саме тому важче ухвалити</tspan></text>
<rect x="628.0" y="82.0" width="479.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="867.5" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="867.5" dy="0.0">Том Престон-Веннер · semver.org, від грудня 2009</tspan></text>
<rect x="628.0" y="140.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="867.5" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">версія: MAJOR . MINOR . PATCH  (три розряди)</tspan></text>
<rect x="628.0" y="206.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="867.5" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">один рід клієнта — одне правило на всіх</tspan></text>
<rect x="628.0" y="272.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="867.5" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">мінор сумісний — і по всьому, без ролей</tspan></text>
<rect x="628.0" y="338.0" width="479.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="867.5" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">усі беруть один діапазон: [1.2.3, 2.0.0)</tspan></text>
<rect x="628.0" y="404.0" width="479.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="867.5" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="867.5" dy="0.0">простіше — і саме тому поширилося</tspan></text>
<rect x="55.0" y="508.0" width="1070.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="590.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ідея одна — кодувати сумісність у номері.</tspan><tspan x="590.0" dy="17.6">Переміг не найточніший запис, а найпростіший названий, що влучив у мить найбільшої потреби.</tspan></text>
</svg>