<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл паралельної зміни: розширення, міграція та звуження</text>
<rect x="40.0" y="75.0" width="350.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="215.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ФАЗА 1: РОЗШИРЕННЯ (EXPAND)</tspan></text>
<rect x="40.0" y="130.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="215.0" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Постачальник публікує новий контракт v2 поряд із v1.</tspan><tspan x="215.0" dy="14.3"></tspan><tspan x="215.0" dy="14.3">Сервер підтримує ОБИДВА інтерфейси одночасно.</tspan><tspan x="215.0" dy="14.3"></tspan><tspan x="215.0" dy="14.3">Жоден існуючий клієнт не ламається (100% сумісність).</tspan><tspan x="215.0" dy="14.3"></tspan><tspan x="215.0" dy="14.3">Клієнти v1 продовжують працювати без змін.</tspan></text>
<rect x="40.0" y="385.0" width="350.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="215.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Стан: Контракт розширено (v1 + v2)</tspan></text>
<rect x="415.0" y="75.0" width="350.0" height="44.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ФАЗА 2: МІГРАЦІЯ (TRANSITION)</tspan></text>
<rect x="415.0" y="130.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="590.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Клієнти поступово переходять з v1 на v2 за власним графіком.</tspan><tspan x="590.0" dy="11.7"></tspan><tspan x="590.0" dy="11.7">Телеметрія вимірює частку трафіку на старому інтерфейсі.</tspan><tspan x="590.0" dy="11.7"></tspan><tspan x="590.0" dy="11.7">Надсилаються попередження про застарівання (Deprecation).</tspan><tspan x="590.0" dy="11.7"></tspan><tspan x="590.0" dy="11.7">Виконується бекфіл історичних даних та подвійний запис.</tspan></text>
<rect x="415.0" y="385.0" width="350.0" height="40.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="590.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Стан: Трафік мігрує (v1 → v2)</tspan></text>
<rect x="790.0" y="75.0" width="350.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="965.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">ФАЗА 3: ЗВУЖЕННЯ (CONTRACT)</tspan></text>
<rect x="790.0" y="130.0" width="350.0" height="240.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="965.0" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Телеметрія підтверджує: трафік v1 впав до нуля.</tspan><tspan x="965.0" dy="14.3"></tspan><tspan x="965.0" dy="14.3">Старий інтерфейс v1, адаптери та шими видаляються.</tspan><tspan x="965.0" dy="14.3"></tspan><tspan x="965.0" dy="14.3">Видаляються застарілі колонки в базі даних.</tspan><tspan x="965.0" dy="14.3"></tspan><tspan x="965.0" dy="14.3">Кодова база повертається до чистого стану без легасі.</tspan></text>
<rect x="790.0" y="385.0" width="350.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="965.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">Стан: Тільки v2 (чистий контракт)</tspan></text>
<line x1="393.0" y1="250.0" x2="412.0" y2="250.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="768.0" y1="250.0" x2="787.0" y2="250.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="50.0" y="445.0" width="1080.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="466.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ключовий інваріант: кожен крок є сумісним у часі, розгортання клієнта і сервера розчеплені,</tspan><tspan x="590.0" dy="16.2">а система ніколи не вимагає одночасної зупинки всіх компонентів (Zero-Downtime).</tspan></text>
</svg>